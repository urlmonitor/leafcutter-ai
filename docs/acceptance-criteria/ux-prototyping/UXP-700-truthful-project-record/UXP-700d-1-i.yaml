test_rationale: |
  A hardcoded exclusion list satisfies every clause of UXP-700d-1 against today's ten mockups
  and three flows, and then silently stops working the first time someone adds an example. The
  varying-population clause is the only assertion no name list can satisfy, and it has to be
  its own record because UXP-700d-1's tests stay green when the list is hardcoded.
test_spec:
  - name: test_newly_added_example_artifact_is_excluded_without_a_list_edit
    target_dir: unit_tests/product_truth/
    description: "An example journey created inside the test is absent from the project's record with no configuration change."
    type: integration
    angle: seam
    framework: unittest
  - name: test_set_aside_count_rises_by_one_when_an_example_artifact_is_added
    target_dir: unit_tests/product_truth/
    description: "The stated count of artifacts set aside as example content rises from N to N+1."
    type: integration
    angle: seam
    framework: unittest
notes: |
  Named mutation: replace the location predicate with a literal list of the current example
  artifact ids. UXP-700d-1 stays green; only this record turns red.
