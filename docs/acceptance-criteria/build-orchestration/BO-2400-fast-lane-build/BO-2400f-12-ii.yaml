id: BO-2400f-12-ii
components:
  - build_orchestration
title: "The refusal is not a second readiness filter — a producible set is never refused"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a resolved connected build set every member of which declares source-and-test
    work proved by a passing covering test,
  When the run examines the set for producibility,
  Then no refusal is issued and the run proceeds to claim the set and dispatch its
    first build agent exactly as it did before this check existed.

  Given a resolved set whose members are readiness draft or reviewed rather than
    approved, and every member of which the roster can produce,
  When the run examines the set,
  Then it is not refused: pointing at the acceptance criterion is the go-ahead
    (BO-2400f, BO-2400f-2), and this check reads only what a member declares it needs
    made, never whether anyone has approved it, prioritised it, or documented it.

  Given a resolved set whose members carry no explicit declaration either way — no
    stated proof obligation and no stated producer,
  When the run examines the set,
  Then those members are treated as producible source-and-test work and the run
    proceeds, so the check refuses only on a positive declaration the roster cannot
    satisfy and an unannotated store keeps building.
