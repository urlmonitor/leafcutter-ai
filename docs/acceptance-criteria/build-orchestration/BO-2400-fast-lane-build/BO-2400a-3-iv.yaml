    fast_lane_pre_existing_tests_report:
      type: object
      description: "Pre-existing covering tests are reported (test id, AC id, observed outcome) under an excluded-from-verdict group and contribute nothing to the red-baseline decision."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "The verdict computation must read only the newly-added partition; a pre-existing test's outcome must be incapable of changing it."
    - "Exclusion is not suppression: pre-existing covering tests still appear in the gate's report with their outcomes, in a group the operator can see is excluded."
    - "The covering test for this criterion must vary a pre-existing test's outcome (pass -> fail) and assert the verdict is byte-identical, rather than only asserting the happy path."
