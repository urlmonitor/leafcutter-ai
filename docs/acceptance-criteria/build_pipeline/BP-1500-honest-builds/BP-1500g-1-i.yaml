id: BP-1500g-1-i
title: "The opt-in mode whose purpose is removal still does not remove the adopter's work, wherever they put it"
component: build-pipeline
components:
  - build_pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given the same project and the same adopter-authored capability as BP-1500g-1,
  When that project is rebuilt using the opt-in mode whose stated purpose is to
    clear out what the package no longer produces,
  Then the adopter's capability is present when the run ends, with its contents
    unchanged byte for byte,
  And the tool which runs capabilities in that project still discovers it by name
    and runs it,
  And this holds both when the adopter placed their capability among the content
    the package generates and when they placed it apart from that content, so
    there is no placement in which running the build in this mode forfeits their
    work,
  And an adopter can find out what this mode would remove from their project
    without having to run it and observe the removal.
depends_on:
  - BP-1500g-1
