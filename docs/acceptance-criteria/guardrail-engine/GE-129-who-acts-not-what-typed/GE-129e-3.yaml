notes: |
  WHY THIS IS THE MECHANICAL FORM. "Every written promise matches what is enforced" (L1) cannot be
  checked by reading wording. It can be checked by making the promise executable: each stated
  outcome is a test input and expected result. A guard change that is not reflected in the
  reference, or a reference edit not reflected in the guard, fails.

  WHY THE SECOND SCENARIO IS LINKS, NOT WORDING. The three rule surfaces state who may commit in
  prose. Checking that prose would be the grep-for-a-sentence the standing rule rejects. Pointing
  them at the checked table single-sources the outcomes; the link check is weaker than the table
  check and is stated as such. Their token-free wording is GE-129e-1's.

  declares_side_effect: false -- the Then clauses assert failures and passes.
