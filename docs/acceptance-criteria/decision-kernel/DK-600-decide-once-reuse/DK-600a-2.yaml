it_requirements:
  - Every grounding evidence item carries a repository-relative locator that names a section or line
    range and a content hash over the stored excerpt.
  - Search candidates are judged by Jev for relevance before they count as grounding; the rerank batch
    size and the coverage bar come from config.retrieval and config.research.
  - Retrieval stays inside the configured read roots and deny globs; nothing outside the scope is
    read.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Failures follow the project error-handling policy: an I/O, provider or budget failure is logged
    at an appropriate level and surfaces as a typed result or a stated limitation, never as a silent
    pass.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
