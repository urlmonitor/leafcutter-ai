it_requirements:
- 'IT-PO decision (left open by the BA): the check is a CALLER of the store''s existing record check,
  not a parallel re-implementation. Rules that check already owns (config/ac_store_schema.json, the components
  rule, the parent back-link rule) are evaluated through its code path and each violated rule surfaces
  as exactly one finding.'
- 'Fail-closed on every inconclusive path: zero records checked, an unreadable record, or an internal
  error in any rule family yields verdict failed. The fail-open tail of the commit-time circular-dependency
  hook must not be reused.'
- Must operate directly on the feature-folder path it is given, independent of the git index and the staged-file
  set (check_ac_schema.py and check_ac_parent_covered_by.py read the index and are no-ops when pointed
  at a path by hand).
- The feature-planning workflow (templates/workflows-js/plan-feature.js; python-coder craft per ACD-1700b-1)
  runs the check at the end of each authoring stage (product owner, business analyst, technical planner,
  code-aware step) and reads the outcome from the check's exit status and JSON report, never from the
  stage agent's returned text.
- A stage whose check verdict is failed is not reported complete, does not advance to the next gate, and
  its report is shown at that stage's gate.
- 'Deterministic: an identical folder yields a byte-identical report (run-twice-and-diff).'
- Must complete within 5 seconds for a feature folder of up to 100 records.
- Must never modify criteria, title, depends_on, req_status or any field outside the three repair families
  of ACD-2400a-2 (write-locked fields per check_ac_governance.py).
- 'Ships to consumer projects with the plan-feature workflow: canonical source and deployed copy kept
  in parity through the build (ADR-001, ADR-013) and verified from the deployed layout after a rebuild.'
- Must log repairs at info and findings/failures at warning or above per the project error handling policy.
delivers_to:
- agent: python-coder
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject). Every rule family (ACD-2400a-2, ACD-2400a-3, ACD-2400b-1-i, ACD-2400c-1-i)
    reports through this contract; plan-feature.js consumes it.'
- agent: llm-expert
  contract: The check's CLI entry point and family list, which templates/agents/it-po.md points to once
    ACD-2400e-2 removes the relocated sections.
