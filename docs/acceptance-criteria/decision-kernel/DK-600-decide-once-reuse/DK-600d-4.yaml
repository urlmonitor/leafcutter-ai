notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-publishing step    review
    leafcutter/decision-publishing step    merge

  DERIVATION. Two publishing steps folded into one L2 under the five-L2 cap: review
  and merge are the git half of publishing, both carried by git rather than the
  kernel. Kernel-checkable parts: publish makes no commit, push or merge; a merged
  record is found through the index. dec-ef8ddcb79d668a67 is the store's first
  real record, merged with PR #978. Screen: decision-record-published.

  STANDING RULE carried from DK-600d (ADR-060 section 1): git is canonical for
  published decisions.

  IT-PO BUILD STATUS (2026-10-02, unverified): kernel side built; the git side is
  process, not code. Real evidence: dec-ef8ddcb79d668a67 is on main via PR #978 and
  test_committed_store validates it.

  TRUE STATUS (2026-10-02): work_status in_progress; the it-po verified build status is
    built_partly_tested.
    - 'Reviewed like any change' is enforced by the PR process, not kernel code; no test can
      assert it. 'Publish made no commit, push or merge' is structural (kernel/memory/
      imports no subprocess or git) and untested. The lookup is tested in a temporary
      repository after publish, not against the merged main store.
  Missing tests are listed in TICKET-20261002-DecisionKernelACTestGaps; once they pass, mark
    done through scripts/ac_store/mark_ac_done.py.

  PROCESS CONTEXT, NOT A CRITERION (BA amendment 2026-10-06): after publish, the new
  record and the regenerated index are an ordinary uncommitted change in the checkout.
  It then goes through git review like any change: a person commits it, opens a PR, and
  it reaches main only when that PR is reviewed and merged under the repository's branch
  protection (dec-ef8ddcb79d668a67 reached main this way with PR #978). The kernel takes
  no part in that review and no kernel test can prove it, so it is recorded here and
  not in the criteria. The flow steps review and merge stay back-linked to this AC for
  its kernel-checkable parts: publish makes no git change, and a record in the
  checkout's docs/decisions/ is found through the index.
