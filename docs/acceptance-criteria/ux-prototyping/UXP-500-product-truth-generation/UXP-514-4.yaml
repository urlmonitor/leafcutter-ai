    relevance: "The general anti-vacuity rule these four checks are instances of."
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: UXP-514
  contract: "The umbrella drift check this record is one of the four named parts of."
origin_agent: business-analyst
created: 2026-09-07
amended_by:
- action: approved
  agent: approve_acs
