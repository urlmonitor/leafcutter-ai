id: BO-4400c-3-i
title: "A project carrying both a uv and a Poetry lock file is set up with uv, and says so"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: internal
criteria: |
  Given a test project whose root contains both a uv lock file and a Poetry lock file,
    on a machine with both uv and Poetry available,
  When a workspace is requested from the one workspace maker and it answers ready,
  Then the workspace's environment in ".venv" was created by synchronising with uv,
  And Poetry was not run,
  And the ready answer names "uv lock file" as the choosing declaration and notes that
    a Poetry lock file was also present and not used.
depends_on: [BO-4400c-3]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400c.yaml
    relationship: constrains
    status: exists
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4400c-1
  contract: "Declaration-driven set-up selection."
package_surface: false
it_requirements:
  - >-
    Precedence comes from the single table in BO-4400c-1 (uv above Poetry); the ready answer lists
    every lower-row declaration found in environment.ignored_declarations.
  - >-
    PROOF: deployed maker as a separate process; real uv; a recording poetry shim on PATH that
    fails the test if invoked; local find-links source.
test_required: true
test_spec:
  - name: test_both_lock_files_set_up_with_uv
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "With uv.lock and poetry.lock present, .venv is created by uv and the poetry shim records no invocation."
    must_catch:
      - "Poetry checked before uv"
  - name: test_ready_answer_notes_unused_poetry_lock
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The answer names uv lock file as the declaration and lists Poetry lock file in ignored_declarations."
test_rationale: >-
  The precedence is invisible in the result unless the losing tool is observed not running and the
  answer says what was ignored.
