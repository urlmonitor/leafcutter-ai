title: "A kind of artifact with no defined proof is refused up front, never waived"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a requirement declaring an artifact of a kind for which no proof is defined,
  When a run resolves a group containing that requirement,
  Then the run stops before any craft is dispatched and names the kind that has no
    defined proof,
  And it does not proceed and then finish that member on the strength of the artifact
    having been produced,
  And it does not treat the absence of a defined proof as the absence of a proof
    obligation.

  Given the same requirement,
  When a proof for that kind is subsequently defined,
  Then the same requirement builds, with no edit to the requirement itself and no edit
    to any list of refused kinds.

  Given a run whose proof for some kind cannot be established because the means of
    establishing it is unavailable in that run,
  When the run resolves a group containing a member of that kind,
  Then the run refuses before any craft is dispatched, stating that the proof cannot be
    established here,
  And it does not dispatch the craft, produce the artifact, and then discover at the
    end that it cannot prove it.

  Given a requirement that states for itself which proof applies to its deliverable,
  When a run resolves a group containing it,
  Then that statement does not decide which proof is applied: the kind is determined
    from where the deliverable sits and which of this project's registers claims it,
  And where the stated kind differs from the determined one, the run reports the
    requirement as carrying a defective declaration rather than adopting what it
    states,
  And a kind with no defined proof is therefore not something a requirement can put
    itself into — so this criterion's refusal cannot be turned into an exemption by
    declaring one.
