title: "Guardrails when the fix is bigger than expected"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  Automatic escalation warning when scope exceeds a quick fix.

  If the change touches more files than expected, introduces structural
  complexity, or the test reveals the root cause is deeper than diagnosed,
  the workflow pauses and warns you. You can choose to continue anyway or
  escalate to the full build pipeline with your progress preserved.
