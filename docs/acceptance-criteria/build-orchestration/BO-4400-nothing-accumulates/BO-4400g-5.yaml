notes: |
  Satisfies BO-4400g documentation_triggers [how-to]. Clearing by hand and clearing by
  name are the same user-facing action, so the guide BO-4300e-5 produced is extended rather
  than a second one written.

  AMENDED 2026-11-16 (user decision): the 14-day rule for pushed but unmerged work
  (BO-4400g-2-v) is stated beside the kept reasons, because "not yet on the main line" no
  longer means "kept until merged". Under ONE RULE the routine sweep (BO-4400d-4) uses the
  same reasons and rules and links here.
