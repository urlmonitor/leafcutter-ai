title: "Agent template declares its contracts and behaviors"
component: infrastructure
level: L1
status: active
criteria: |
  Every agent template carries structured metadata describing what it does —
  its input/output contract, the config values it consumes, and the
  behavioral patterns that govern its conditional logic.

  These fields make the I/O Contract and Contributor Notes sections of the
  agent card fully auto-generable. Without them, contracts and behaviors
  can only be inferred by reading the template prose body.
