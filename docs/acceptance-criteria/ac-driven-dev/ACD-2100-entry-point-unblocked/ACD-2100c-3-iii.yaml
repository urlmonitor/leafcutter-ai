  - "When args.resume_answer is present, read the run's durable pause record via readPauseRecordWithRetry BEFORE the orphan scan classifies drafts; if it exists, is not stale, and its context lists AC ids (context.acs), exclude exactly those ids from the orphan set."
  - "Ids not listed in the record's context.acs remain orphan candidates exactly as today -- the exclusion is by explicit id, never by origin_agent, readiness or a blanket skip."
  - "If the record read is unreadable, return the existing pause_record_unreadable terminal status; never fall through to the resolve-orphans-choice gate, because pausing there overwrites the record."
  - "With no args.resume_answer the orphan scan path is unchanged."
  - "FILE-SIZE RATCHET (GE-127): plan-feature.js is over its 1000-line limit; every added measured line must be offset by removing about two (redundant // comments or blank-line runs, no behaviour change), verified with scripts/commit_guardian/check_file_size.py run from the worktree."
  - "Must satisfy the repository error-handling policy: reading the pause record is external I/O."
test_spec:
  - name: test_resume_with_own_drafts_in_record_raises_no_orphan_gate
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Drive plan-feature through unit_tests/_workflow_engine_harness.py with stubbed agent()
      replies: resume_answer for gate-ba, pause record exists/not stale with context.acs equal
      to the uncommitted drafted ids; no resolve-orphans-choice gate is raised and the
      answer-applied path is reached.
  - name: test_extra_uncommitted_draft_not_in_record_still_offered_as_orphan
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Same resume, plus one uncommitted draft whose id is not in context.acs; that draft is
      still offered as an orphan.
  - name: test_no_resume_answer_orphan_behaviour_unchanged
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Without resume_answer, uncommitted drafts are classified and gated as orphans exactly
      as before.
  - name: test_resume_never_rewrites_pause_record_to_a_different_gate
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      During a resume (including an unreadable record read, which ends pause_record_unreadable),
      no pause-store write dispatched by the stubbed agent() names a gate other than the one
      the run was paused at.
test_rationale: >-
  The defect is a misclassification -- the run's own pending drafts read as a crashed
  session's leftovers -- so each test drives the real workflow code through the engine
  harness with stubbed agent() replies rather than grepping the template. The own-drafts
  case proves the resume reaches the answer; the extra-draft case is the discrimination
  guard that keeps genuine orphans detected; the no-answer case pins unchanged behaviour;
  the record-never-rewritten case covers the damage that made the approval unrecoverable.
