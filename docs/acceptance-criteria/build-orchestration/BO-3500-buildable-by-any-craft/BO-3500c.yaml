notes: |
  THIS IS THE DANGEROUS ONE, and it is stated as a requirement rather than left
  as an assumption for exactly that reason. Every cheap way to make BO-3500a and
  BO-3500b pass runs through weakening what "finished" means: waive the proof for
  anything without a test, or mark the non-code member done because a run touched
  it. Either is phantom-done arriving through the front door of the tool built
  hardest against it. The bar this L1 sets is a proof obligation of comparable
  strength in a form that suits the deliverable — not an exemption.

  BOUNDARY vs BO-2500 ("Trust that a feature is done because a test proves it").
  BO-2500 is not narrowed and not contradicted. Its subject is that no opinion
  may confer done-ness; only a mechanical check may. This L1 keeps that and asks
  only that the mechanical check be the right instrument for a deliverable that
  is not code. If a decomposition here ever reads as "some work is done without
  a mechanical check", it has drifted and should be rejected.

  BOUNDARY vs ACD-1800a / ACD-1800b. Those own what a requirement declares it
  needs and how completion is counted from per-deliverable sign-offs — the store
  side. This owns whether a run can produce the artifact and evidence it — the
  build side. The two must agree at the seam and neither may be built as though
  it covers the other; ACD-1800b is currently ahead of this one in the roadmap
  (phase_acbuild_2a), so treat its accounting as the target, not as a rival.

  FOR THE BA: the concrete instrument is deliberately left open. KI-BO-013
  suggests one ("the named doc file exists and changed in the diff"), which is a
  reasonable floor for a written page and clearly insufficient for a screen or a
  prompt. Do not let the floor for the easiest deliverable become the ceiling for
  all of them.
