id: UXP-604
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "A feature-level deduped 'N/M ACs done' rollup is shown for the whole flow"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: done
criteria: |
  Given a selected flow whose steps and branches collectively reference a set of acceptance criteria,
  When the /flows view renders the flow,
  Then a single feature-level "N/M ACs done" rollup is shown for the whole flow,
  where M is the count of DISTINCT acceptance criteria across the flow and N is how many of those distinct ACs are done,
  And this rollup is computed from the flow's acceptance criteria, not reused from the per-step status summary that badges the flow.
depends_on:
  - UXP-591
doc_links:
  - path: docs/architecture/components/ux-prototyping.md
    relationship: describes
    status: exists
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "deriveImplSummary in leafcutter-web/lib/data/flows.ts must compute acTotal (M) and acDone (N) as DISTINCT-AC counts over all steps+branches, kept separate from implSummary.done, which counts STEPS by status."
  - "FlowImplSummary in leafcutter-web/lib/data/types.ts must carry acDone and acTotal, and ExplorerInner in leafcutter-web/components/flows/flow-explorer.tsx must render the feature rollup from implSummary.acDone/acTotal (guarded by acTotal > 0), never from the per-step status summary."
delivers_to: null
