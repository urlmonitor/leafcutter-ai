id: BP-1300f-1-i
components:
  - build_pipeline
title: "A type error is new only when its code and message occur more often at the head than at the merge base, so a moved old error is never charged and line numbers play no part"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Background:
    Given at the merge base the file scripts/svc.py has exactly one type error, code
      "return-value", message 'Incompatible return value type (got "int", expected "str")',
      at line 2.

  Scenario: An old error on a moved line is not new
    When the pull request inserts five lines above that function and changes nothing else,
      so mypy now reports the same code and message at line 7,
    Then the check passes,
    And it reports 0 new errors and 1 existing error left untouched.

  Scenario: A genuinely new error fails, naming where and what
    When the pull request adds a function with an "assignment" error at head line 12,
    Then the check fails with a non-zero exit,
    And the output names scripts/svc.py, line 12, code "assignment" and mypy's message,
    And the output gives a one-line remedy: fix the type; do not add a type-ignore.

  Scenario: One more copy of an existing error is one new error
    When the pull request adds a second function carrying the same "return-value" error
      with the same message,
    Then the check fails, reporting exactly 1 new error of that code and message,
    And it names the head lines where that error occurs, saying the merge base already
      had 1 identical error in the file.

  Scenario: A line number inside a message is not part of the error's identity
    Given an error whose message mentions a line, such as 'Name "x" already defined on
      line 3',
    When the pull request moves both definitions down so the message says line 8,
    Then the two errors are the same error and neither is reported as new.
