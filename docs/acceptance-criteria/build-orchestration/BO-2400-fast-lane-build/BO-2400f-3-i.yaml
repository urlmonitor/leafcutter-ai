assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The distinction that carries this record is between an answer that is ABSENT
     and an answer that is EMPTY OF THIS BRANCH. The existing fallback treats both
     as 'git said nothing' and trusts the claim. Only the first is a hiccup; the
     second is positive evidence that the probe looked somewhere that does not
     have the branch this run just created, because the run created it. Do not
     collapse them back together, and do not delete the fallback wholesale — its
     stated reason, that one flaky dispatch should not halt the lane, is sound."
  - "Containment of the probe matters more than inspection of its answer. An
     answer is only evidence about the repository it came from, so the probe must
     be run against a repository the run already knows rather than an agent's
     ambient working directory. Checking the answer harder while leaving the
     probe free to run anywhere reproduces this defect with more steps."
  - "The existing self-consistency check — that the reported path appears in the
     raw output supplied alongside it — must be kept. It catches a fabricated
     path, which is a different failure from this one, and was added for two
     recorded occurrences."
  - "This file is already over its size limit (measured by
     _file_size_ratchet.count_content_lines, not wc -l), so the GE-127b-1 ratchet
     refuses any commit that leaves it longer than it stood at HEAD. The change
     must be net-neutral or net-shrinking in content lines."
test_spec:
  - name: test_a_probe_answering_without_the_runs_own_branch_halts
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "The probe returns an answer that lists worktrees but has no
      record for the branch this run created; the run halts instead of
      proceeding. Fails the behaviour that treats this as 'git said nothing'."
  - name: test_the_halt_names_the_unconfirmed_branch_and_the_claimed_location
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "The halt payload carries both the branch that could not be
      confirmed and the location the worktree phase claimed. A halt naming
      neither leaves the reader unable to tell a wrong-repo probe from a genuine
      absence."
  - name: test_no_later_phase_runs_against_the_claimed_location
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "After the halt, the resolve phase is never dispatched. Asserted
      on dispatch, not on the returned status, since a run can report a halt and
      still have taken the step."
  - name: test_a_probe_that_lists_the_runs_branch_proceeds_on_gits_path
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "The non-regression arm: a probe answering from the right
      repository, listing the branch, lets the run proceed on git's reported
      path. Fails any fix that halts whenever the probe is anything but perfect."
  - name: test_a_probe_that_could_not_run_at_all_still_falls_back
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: boundary
    description: "The narrowing arm: no answer of any kind still falls back to
      the claim. Fails any fix that deletes the fallback rather than narrowing
      it, which would halt the lane on a single flaky dispatch."
test_rationale: |
  The two arms that matter are the third and the fifth, and they must both exist in
  the same suite. A fix that halts on every imperfect probe passes the first four
  descriptors and fails the fifth; a fix that changes nothing passes the fourth and
  fifth and fails the first. Only a fix that distinguishes an absent answer from an
  answer empty of this run's own branch passes all five.

  test_no_later_phase_runs_against_the_claimed_location asserts on whether the next
  phase was dispatched rather than on the returned status, because the failure this
  record exists to prevent is precisely a run that continued to a later phase
  against a wrong location — a status field saying "halt" would not have prevented
  the observed failure, which reached the resolve phase and died there.

  These run through unit_tests/_workflow_engine_harness.py with stubbed agent
  responses, the same vehicle
  unit_tests/workflows/test_bo2400f_13_workspace_refusal_workflow.py already uses
  for the sibling refusal path. A test that greps fast-lane-ship.js for the new
  condition does not satisfy any descriptor here: the defect being fixed is one
  where a present, correct-looking check produced the wrong decision, so presence
  of source text is exactly the evidence that was already misleading.
