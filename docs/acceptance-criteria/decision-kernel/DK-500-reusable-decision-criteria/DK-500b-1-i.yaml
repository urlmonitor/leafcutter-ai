id: DK-500b-1-i
title: A suggested broader category never loops back and never names a retired category
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the category cat-6c3eb4f2af148922 already has cat-d6ce5f78c181ebd1 as its broader category,
  And cat-40cc613f737e3323 is retired with replaced_by cat-d15d52392d7aa94c,
  When a suggestion would make cat-6c3eb4f2af148922 the broader category of cat-d6ce5f78c181ebd1, or would name cat-40cc613f737e3323 as a broader category,
  Then that suggestion is not offered,
  And the reason names the loop cat-d6ce5f78c181ebd1 -> cat-6c3eb4f2af148922 -> cat-d6ce5f78c181ebd1, or names the retired category and its replacement,
  And the same suggestion naming the live replacement cat-d15d52392d7aa94c as the broader category is offered.
depends_on:
- DK-500b-1
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500b-1
  contract: Grouping suggestion with broader (category id or null).
change_target: code
risk_surface: internal
it_requirements:
- 'The broader check runs wherever a broader value can enter a suggestion or a record: when a person sets or changes broader in a review run, and again at publish (DK-500c-2, DK-500c-3-ii).'
- A loop is detected over the whole broader chain across published records, staged records and the suggestion's own value; the refusal names the full loop path in order.
- A retired broader target is refused, naming the retired id and its replaced_by ids; the same suggestion naming the live replacement is accepted.
- The method of dec-a070edfb6465bced makes no broader suggestions itself, so the broader values checked here are person-set; no Jev or LLM call decides broader.
test_required: true
test_spec:
- name: test_broader_loop_not_offered_and_named
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Making cat-6c3eb4f2af148922 broader of cat-d6ce5f78c181ebd1 is not offered; the reason names cat-d6ce5f78c181ebd1 -> cat-6c3eb4f2af148922 -> cat-d6ce5f78c181ebd1.
- name: test_retired_broader_not_offered_names_replacement
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Naming the retired cat-40cc613f737e3323 as broader is not offered; the reason names it and cat-d15d52392d7aa94c.
- name: test_live_replacement_broader_is_offered
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: The same suggestion naming cat-d15d52392d7aa94c as broader is offered.
test_rationale: Drive the grouping through its public entry point with a controlled Jev provider that replays recorded probabilities and counts calls, plus a recording host port that fails on any request; assert placements, reasons and call counts, not internal helpers.
