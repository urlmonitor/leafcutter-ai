notes: |
  Reported as upstream Finding 12 (drafted). The observable symptom in daily
  use is a blocking error with no stderr on every Edit of a .py file, while
  the edit itself succeeds — which reads as harness noise rather than as a
  guard doing its job, so the guard's findings were being dismissed.

  SCOPE NOTE ON THIS L1. GE-108's own doc_links point at the commit-time
  guard, templates/scripts/commit_guardian/check_exception_handling.py. This
  record is the first under GE-108 to address the authoring-time PostToolUse
  sibling, templates/hooks/check_exception_handling_hook.py, which no record
  in the store referenced before now. The two files enforce the same Error
  Handling Policy at two different moments; they are not the same file and a
  change to one does not touch the other.
