notes: |
  THIS IS THE ONE CHILD OF BO-3100d THAT IS MECHANICALLY ENFORCEABLE, and it is how the L1
  escapes being prose. Rather than asserting that a document contains the right words —
  which is a grep-only test on dead prose, the exact thing the goal's hard constraint
  rejects — each factual claim about runtime dispatch behaviour becomes an executable check
  whose result must agree with it. A claim that drifts away from the behaviour then fails
  something.

  THE FALSE PREMISE, verified against both records on 2026-08-25 rather than taken from the
  handover note. ADR-006 states "Any call beyond depth 1 is silently blocked — no error" and
  ADR-019 states "Any call beyond depth 1 is silently dropped — no error is raised, the tool
  call simply does not execute". Both are falsifiable by a single execution, and both are
  false: nesting works.

  WHY IT MATTERS BEYOND TIDINESS: the false premise actively misdirects the fix. A reader
  who believes the constraint is a depth limit will design around depth, and the actual
  failure has nothing to do with depth. Both records reason from the wrong constraint to
  conclusions that happen to be partly right — flattening the chain and dispatching inline
  do both help — which is the worst case, because the reasoning is never challenged by the
  outcome.

  THE THIRD SCENARIO IS THE ANTI-VACUUM CLAUSE. Without it, the cheapest way to pass is to
  pair a check with one claim and leave the rest unexamined; the record then carries a mix
  of verified and unverified assertions that read identically. Reporting unchecked claims
  makes the coverage of this mechanism visible.

  SEQUENCED AFTER BO-3100c on the parent's instruction: c may change the correct topology, so
  documenting before it lands describes a design that is about to move.

  Deliberately NOT specified here: which claims count as behavioural, and where the checks
  live. Both are IT PO decisions. The criterion constrains only that the pairing exists and
  that disagreement is a failure.

  IT-PO DECISION (2026-08-26). Both open questions are answered in it_requirements. The one
  worth restating: whether a statement is a behavioural claim must be an explicit MARKING on
  the claim, not something inferred from its wording. Inferring it would be a text heuristic
  over prose — the same shape BO-3200a-2 rejects for fact-versus-judgement — and it would let
  the covered set silently shrink as the record is edited, which is exactly what the third
  scenario exists to prevent.
