assigned_agent: python-coder
estimated_complexity: standard
it_requirements:
  - "Author fresh unit tests in tests/test_registry_validator.py (new file). The original source PR is closed, so the tests must be written from scratch and verified run-to-green (python -m unittest / pytest on tests/test_registry_validator.py) before sign-off — do not assume any prior test scaffolding exists."
  - "Functions under test (scripts/registry_validator.py): load_registry(package_root), _load_agents(package_root), validate_agent_registry(package_root). Import by bare module name after adding scripts/ to sys.path (matches the existing tests/test_verification_block.py convention)."
  - "Assert load_registry returns the parsed agents list (list[dict]) with every agent entry present for a well-formed registry fixture."
  - "API MISMATCH: load_registry does NOT raise on a missing/malformed file — it silently returns []. The 'fails with an error naming the unreadable/unparseable file' behavior lives in _load_agents (returns an errors list) and is surfaced by validate_agent_registry. Assert the error-naming behavior against _load_agents / validate_agent_registry, not load_registry, or coordinate a criteria amendment with the BA."
  - "API GAP: registry_validator has NO check for a missing required field (id/role) or a duplicate agent id — a missing id currently raises KeyError rather than returning an error, and duplicates are never detected. The missing-field / duplicate-id scenarios cannot be authored run-to-green against the current code; flag to the BA/coder that this validation must be added before the test can pass."
  - "Use a self-contained on-disk fixture package (tmp_path with config/agent_registry.json plus templates/) so the template-path / orphan-template / produces checks inside validate_agent_registry do not fire spuriously; do not assert against the live package registry."
