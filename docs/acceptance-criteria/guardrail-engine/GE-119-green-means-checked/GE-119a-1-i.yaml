  - "PREREQUISITE STATE — verify before implementing. GE-116a-1-iii carries readiness: approved but work_status: todo and implemented_by: [], so the fail-open-on-unparseable behaviour it specifies may not exist in the guard yet. If it is absent, this AC's deliverable is the executing regression guard plus the minimum work that makes GE-116a-1-iii's behaviour observable — NOT a re-specification of GE-116a-1-iii and NOT an expansion of its scope."
  - "This AC must not force a production change. If executing the criteria already yields the ordinary success value, the deliverable is the executing regression test plus a recorded observation. Do not manufacture a change in order to have something to commit."
