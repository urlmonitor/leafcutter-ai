criteria: |
  Given a user looks up how their tests find the test database,
  When they read the settings field reference and the testing guide,
  Then the field reference's row for testing_context.db_connection_test shows
      no default and says that when it is unset, database tests are reported
      as not configured and are not run,
    And the row gives an example that is plainly a placeholder
      (postgresql://<user>:<password>@<host>:<port>/<database>), not an
      address that could work on someone's machine,
    And the testing guide's example database test takes its connection from
      that setting rather than from a literal address,
    And neither page names a host, port or database as the place leafcutter's
      tests run,
    And every other documentation page that quotes
      postgresql://trader:trader@localhost:5403/LIVE as history — in
      leafcutter's own docs, including the analysis page on test writers
      proving failure rather than discrimination, and any shipped page under
      templates/docs/ — quotes a placeholder instead, while still saying that
      the template shipped one adopter's local address, with username and
      password, to every install.
