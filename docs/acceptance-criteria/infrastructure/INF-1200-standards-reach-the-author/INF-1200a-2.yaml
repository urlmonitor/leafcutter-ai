it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED. This record registers nothing: no
    hooks_manifest.hooks id, no new top-level key in commit_guardian.json, no agent entry,
    no skill entry, no paths.json surface. It is a pure invariance constraint on the carrier
    INF-1200b-1 and INF-1200d-1 build. Plain-list spec form; no config_schema_fragment
    invented for a key that will never exist.
  - >-
    THE INVARIANT, STATED AS THE PROHIBITION IT IS. What a specialist is told must be a pure
    function of (the declaration as it stands) and (what the ownership record assigns that
    specialist), and of nothing else. Specifically, no input to the standards a brief
    carries may be: a findings log, a hook exit status, a commit history, a count of past
    violations, a per-agent offence record, a run timestamp, a cache of previous outputs, or
    the contents of hooks_manifest. State it as a purity property of the carrier rather than
    as something the tests happen to observe — the same construction GE-127e-2 uses for its
    description function.
  - >-
    THE SECOND ARM IS NOT "DELIVERY IS UNCONDITIONAL", AND THE DIFFERENCE IS THE WHOLE
    RECORD. A delivery that fires every time but says MORE after a breach — an added
    warning, a stronger wording, a note that this specialist has offended before — has
    smuggled feedback back into the brief. The comparison is between the two compiled
    briefs and they must be byte-identical in the region that states the standard, not
    merely both non-empty. Assert equality of content, never non-emptiness of both.
  - >-
    THE THIRD ARM'S FIXTURE IS REAL AND IS TEMPORARY BY DESIGN — MEASURED IN THIS WORKTREE.
    commit_guardian.json declares four standards with thresholds: file_size (line_limits
    {'.py': 400, '.sql': 600}, default 400), complexity (max_score 15), sql_complexity
    (max_score 75) and folder_density (max_files_per_folder 15). Of the sixty-two ids in
    hooks_manifest.hooks, none is check_complexity, check_sql_complexity or
    check_folder_density — those three checks are reached by nothing, so their standards
    CANNOT have been breached. That asymmetry is the fixture. BP-1600a-2 is approved and
    will remove it, so the descriptor must construct the unreached state under its own
    control rather than depending on today's accident.
  - >-
    FENCED — THIS RECORD REGISTERS NOTHING AND MUST NOT BE MADE TO WAIT ON REGISTRATION.
    Whether the three unreached checks should run is BP-1600a-2's approved, high-priority
    work. This record takes the unreached state as a GIVEN and requires the telling to be
    indifferent to it. No implementation here may inspect a manifest, count scripts, or add
    an entry; and no implementation here may be deferred until BP-1600a-2 lands. Satisfying
    this record by causing the unreached checks to run has answered someone else's record
    and left this one untested.
  - >-
    SEE INF-1200a-3, WHICH OWNS THE SYMMETRIC OBLIGATION FROM THE STANDARDS AXIS. This
    record fixes that what a specialist is told does not depend on anything HAVING HAPPENED;
    d-3 fixes that the SET of standards carried does not depend on which checks are
    reachable, and adds the two transitions. They are consistent, neither subsumes the
    other, and the implementation must satisfy both with ONE purity property rather than two
    conditions written in two places.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the
    config and registry reads; log at WARNING or higher or re-raise; no bare or blind
    excepts. A read failure must not degrade to "carry only what we know about", which would
    make the brief's contents depend on transient conditions and fail this record silently.
test_spec:
  - name: test_inf_1200a_2_the_standard_is_in_the_brief_before_any_work_of_that_kind_has_ever_been_produced
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Build into a temporary target whose project state contains no work of the covered
      kind, nothing submitted for checking, and no recorded breach of the standard, and read
      the produced .claude/agents/<owner>.md. The standards for the kinds of file that
      specialist owns are already stated. This is the arm that keeps the whole tree out of
      GE-127: the value is claimed in a state where nothing was ever refused and nothing
      could be.
  - name: test_inf_1200a_2_the_brief_is_identical_before_and_after_a_breach_of_the_same_standard
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Build once in a never-breached state, capture the brief; produce a real breach of that
      same standard in the target project; build again and capture the brief. What the brief
      says about that standard must be the SAME — not merely present in both, but equal in
      content: neither introduced by the breach, nor reworded by it, nor added to because of
      it. Equality is asserted on the region stating the standard, so an appended "you have
      offended before" note fails here rather than passing a both-non-empty check.
  - name: test_inf_1200a_2_a_standard_whose_check_is_reached_by_nothing_is_stated_exactly_as_the_others_are
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      With the check that would apply a standard reachable by nothing — so no breach of it
      can occur — the standard is stated in its owner's brief exactly as it is when the
      check is reached. The unreached state is constructed under the test's own control
      rather than read off today's accident, because BP-1600a-2 is approved and will make
      the three currently-unreached checks run; a descriptor that depends on that accident
      loses its fixture the day that record lands.
  - name: test_inf_1200a_2_the_fire_first_injection_reds_all_three_arms_together
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's NAMED MUTATION, CARRIED VERBATIM AND OBSERVED AS ONE EXPERIMENT. MUTATION:
      make a standard's presence in a specialist's brief conditional on that standard having
      produced a finding — carry outward only the standards that have fired, or add the
      standard to the brief at the point it is first breached. Under that injection: the
      never-breached arm must go RED, because a specialist that has not yet offended is told
      nothing; the after-a-breach comparison must go RED, because the two materials differ;
      and the unreached-check arm must go RED, because a check that cannot fire can never
      produce the finding the delivery waits on. All three must revert. THIS MUTATION HAS NO
      STAY-GREEN HALF BY DESIGN AND THAT IS ITSELF THE ASSERTION: an injection run in which
      any arm stays green means that arm was not carrying the timing claim and must be
      rewritten before this record is believed.
test_rationale: |
  This is the record that keeps the whole tree out of GE-127, and it is the only one that
  does it by observation rather than by assertion. Every other criterion here can be read as
  "the specialist ends up knowing the standard", and a design that tells a specialist the
  limit the first time it is refused satisfies that reading completely — while being cheap,
  well-targeted, and productive of excellent before-and-after numbers. So no descriptor here
  may be satisfiable by a single dispatch in a single project state. Each arm is a build run
  in a controlled project state, and the second arm is a comparison of two such runs.

  The second arm asserts EQUALITY of the region stating the standard rather than presence in
  both. That is the difference between this record and "delivery is unconditional": a
  delivery that fires every time but says more after a breach passes a presence check and
  fails this one, and the smuggled feedback is exactly what the L1 forbids.

  The third arm's fixture is constructed rather than observed. Three of the four standards
  configured in commit_guardian.json have no hooks_manifest entry today, which makes an
  unreachable check free to obtain — but BP-1600a-2 is approved and will remove that
  asymmetry, and a descriptor built on it would then pass for the wrong reason. Constructing
  the unreached state under the test's own control keeps the arm able to fail after that
  record lands.

  The BA's mutation is carried verbatim and reddens all three arms with no stay-green half.
  That is deliberate and is recorded as an assertion in its own right: unlike the mixed-outcome
  mutations elsewhere in this tree, here a surviving green arm is evidence of a defective arm
  rather than of independent arms.
