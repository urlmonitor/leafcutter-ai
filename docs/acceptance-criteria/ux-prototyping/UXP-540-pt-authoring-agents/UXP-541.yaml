it_requirements: |
  The mockup-author agent does not exist yet and must be built. It consumes the classifier output
  and the drafted mock data, and produces one *.mockup.json per screen conforming to
  mockup.schema.json, populated from the mock records. Screen ids must match what the flow's steps
  reference (the product-truth validator errors on an unresolved screen for an approved flow).
  A hand-authored gold example lives at
  docs/product-truth/mock-data/pipeline-prompts/draft-mockups.prompt.json.
