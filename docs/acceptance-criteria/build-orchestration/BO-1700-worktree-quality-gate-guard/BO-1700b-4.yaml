criteria: |
  Given the canary hook entry has been deleted from the resolved config so no
    canary hook is registered,
  When the probe runs Check D,
  Then the probe distinguishes "canary hook absent from config" from "canary hook
    ran but produced no token", reports FAIL in either case, and stderr states
    which of the two conditions occurred.
  And removing the canary entry cannot cause Check D to be skipped or to report a
    pass.
