notes: |
  THE TRIVIAL BYPASS THIS CLOSES. GE-123b's title says "no single line", and the
  literal reading of that invites an implementation that examines each entry
  alone. Six entries, each naming one rule and each of them individually
  unremarkable, reach exactly the same zero as the one over-broad line in
  GE-123b-1 — measured today at 0 findings. If the per-line reading is the one
  that ships, the guarantee is defeated by anyone who writes their suppression
  out longhand, which is the form the existing how-to guidance actually
  encourages. The rule that has no bypass is: the entry that would remove a
  file's LAST remaining live rule is the one declined, whichever entry that
  turns out to be, judged against every suppression in force.

  ORDER-INDEPENDENCE IS AN ASSERTION IN ITS OWN RIGHT, and arm 2 exists because
  the natural implementation of arm 1 introduces the hazard. Once entries are
  applied in sequence and the last one is refused, the surviving finding depends
  on file order, which makes the outcome an accident of how the author typed
  their allowlist. Arm 2 deliberately asserts the COUNT rather than which rule
  survives, so it constrains the outcome without prescribing a resolution
  strategy — that choice belongs to the IT PO. CAUTION FOR THE TEST AUTHOR: arm
  2 passes vacuously today, because both orders currently yield zero. It is only
  meaningful asserted together with arm 1, and must never be run or reported as
  a standalone pass.

  MEASURED TODAY, end-to-end through the multi-file entry point (2026-08-18):
    - arm 1 baseline: 0 findings, clean exit, no warning on any stream. Target:
      at least one finding and a findings-present exit.
    - arm 2 baseline: 0 findings in both orders — vacuously equal, see above.
    - arm 3 baseline: 1 finding, the high-entropy token — ALREADY CORRECT.
      Labelled regression guard; green on arrival is expected and is not a
      TDD-order violation. It is the mandatory paired positive: without it the
      criterion is satisfied by an implementation that declines every entry once
      more than one is present.

  Ordinary source filenames throughout — no env-named file appears here, per the
  tree-wide authoring constraint. Every arm must be exercised through the
  multi-file entry point with real files on disk; the accumulation behaviour in
  particular cannot be observed by calling the suppression predicate once.

  IT-PO RESOLUTION-STRATEGY NOTE (2026-08-18), left here rather than decided in
  the criteria: the strategy is the implementer's choice, but it is constrained
  from three directions at once and the naive shape fails. Restoring "one rule"
  is not enough — two of the six declared rules (the exchange-key rule and the
  env-filename rule) fire zero times on an ordinary source file, so restoring
  one of those leaves the file nominally covered and still silent, which fails
  arm 1's "at least one finding". The outcome must also be a function of the
  entry SET rather than its order, and arm 3 forbids declining entries merely
  because several are in force. Declining the entire collapsing group for the
  affected file satisfies all three with no ordering hazard; it is offered as a
  worked shape, not mandated. Baselines re-verified before enrichment: 0 in both
  orders, and 1 for the five-entry arm.
