notes: |
  PO authoring note (for the BA). This L1 owns the MODULE-level declaration:
  the file's top-level docstring must name the component it belongs to, and that
  name must be one of the registered components in docs/components.json. Scope is
  diff-only — only new or changed files are checked; legacy modules are not
  retrofitted (mirrors the existing tail-tag convention). The VALIDITY of the
  named component (must resolve to a real component id) is part of "declares its
  component" — a garbage or unknown component name does not satisfy this.
  Enforcement action (block vs warn) belongs to GE-117d, not here. This L1 is the
  requirement that the declaration exist and be valid.
  documentation_triggers [how-to] — authors need a task guide for what to write
  in a module docstring; no new multi-actor flow beyond the shared commit-time
  guardrail interaction that GE-117d documents.
