test_required: true
test_spec:
  - name: test_every_workflow_commit_path_calls_the_shared_step
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Each deployed workflow's commit path is run under unit_tests/_workflow_engine_harness.py with scripted replies; every recorded commit dispatch instructs the shared step and no other staging or commit command."
  - name: test_census_names_any_commit_site_no_migration_record_accounts_for
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Adding a fixture workflow with an extra commit dispatch, or an agent text with a git add instruction, makes the census fail naming that site."
    must_catch:
      - "a hard-coded list of eight sites"
      - "a census that greps for the step's name instead of enumerating dispatches"
  - name: test_no_agent_or_skill_text_carries_a_staging_or_commit_recipe
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: criterion
    description: "Every commit instruction found in deployed agent and skill text directs the reader to the shared step; none stages all, stages by scope or records a commit directly."
  - name: test_each_replaced_ki_regression_test_invokes_the_shared_step
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "For each listed KI and hardened-copy rule, its regression test drives the real shared step (observed by the step's own invocation record), not a retired recipe."
  - name: test_commit_answer_block_is_byte_identical_in_every_deployed_consumer
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: deployed
    description: "Every deployed workflow that dispatches the commit agent outside the drive phase loop carries the COMMIT-ANSWER block byte-identical to its single source."
test_rationale: >-
  Repo CLAUDE.md "Verify behaviorally, not by grep" binds here: a census that greps for the
  step's name passes on dead code. The census therefore runs each workflow's commit path and
  derives the population, and the parity test exists because BO-4300c-3 found the precedent
  marker block had already drifted between two workflows.
