id: BO-400e-3-i
title: "Finalization closes a ticket through the same checking mechanism as the drivers, or leaves it open"
component: build-orchestration
components:
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given an epic is being finalized
    And its branch still carries tickets whose recorded state is not the finished one
  When finalization closes those tickets
  Then each close is performed by invoking the same checking mechanism the drivers invoke
  And no step writes the finished state by editing the record directly
  And the blanket override is not used to force a close through.

  Given one of those tickets names a phase as needed that carries no sign-off
  When finalization attempts its close
  Then the mechanism refuses
  And that ticket's recorded state is left unchanged
  And the refusal is reported against that ticket by name
  And finalization does not substitute a direct write to close it anyway.
