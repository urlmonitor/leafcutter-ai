id: INF-400e-2
title: "Second-run PO uses previously-learned user framing preferences in L0/L1 language"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the product-owner-v3 agent ran once and the user corrected its L0 phrasing
    from "System provides automated X" to "You get X without manual effort"
    (preferring second-person active voice),
  And that preference was captured as a memory-user learning
    (e.g., memory/feedback_l0_framing_preference.md),
  When the product-owner-v3 agent runs a second time for a different feature,
  Then the agent's L0 criteria field uses second-person active voice
    (e.g., "You get..." or "Your project...") rather than third-person passive
    (e.g., "The system provides..." or "Automated X is delivered..."),
  And the agent does not revert to the default framing style that was corrected
    in the prior run.
depends_on: [INF-400e, INF-400a]
