estimated_complexity: S
it_requirements:
  - "The staged set must be carried as (number, path) pairs from the point it is read until the point it is filtered. Reducing it to a list of bare integers before the merge-in filter runs is what makes the defect possible, and any implementation that re-derives a path from a number is reintroducing it."
  - "The merge-in decision must be evaluated once per staged FILE, against that file's own path, and it needs TWO probes on that path: the file must exist upstream (`git cat-file -e origin/main:<path>`) AND be absent from HEAD (`git cat-file -e HEAD:<path>`). Absence from HEAD alone identifies nothing — a file the author just wrote is equally absent from HEAD — so a per-file filter that keeps only the HEAD probe still drops the authored file and still passes the double-claim. Verified: making the filter per-file without adding the upstream probe leaves the distinguishing test red."
  - "The first-match number-to-path lookup must be removed rather than corrected: it is unreachable once the pairs are carried through, and leaving it invites a second caller to reintroduce the bug."
  - "Do NOT satisfy this by moving self-collision detection ahead of the exemption while leaving the exemption per-number. That passes the double-claim scenario and still drops the author's file from the cross-collision comparison, so a single authored record colliding with a merged-in one would go unreported."
  - "The public `get_staged_adr_numbers()` signature must keep returning a list of integers with duplicates preserved; the pair-returning form is a new helper it delegates to. The integer form is what the fail-closed early-exit reads."
  - "Removing the per-number path lookup also removes one `git diff --cached` invocation per staged ADR, which the whole-collection performance budget in GE-122a-1 asks for. That is a consequence, not the motive — do not let it drive a design that skips the per-file HEAD probe."
test_spec:
  - name: test_authored_adr_is_reported_despite_merged_in_twin
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "In a real repository mid-merge, with the upstream ADR-034 staged by the merge AND a newly authored ADR-034 staged alongside it, the gate exits non-zero and its report names 034. This is the distinguishing case: it is the only one the defective and the correct implementation answer differently."
  - name: test_merged_in_adr_alone_is_not_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The same merge staging only the upstream ADR-034 exits zero — the guarantee the merge-in exemption exists to provide, asserted so that deleting the exemption cannot be mistaken for fixing the defect."
  - name: test_two_newly_authored_adrs_sharing_a_number_are_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Two brand-new staged records both claiming ADR-077 exit non-zero and the report names 077 — the same-commit self-collision path, asserted to stay reachable after the filter changes."
test_rationale: |
  All three descriptors run the gate as a process against a real git repository with a real
  merge in progress, because the defect is not observable from inside any single helper: each
  helper returns a defensible answer, and the wrong result emerges only from applying a
  per-number answer to a per-file set. Each test asserts the staged set BEFORE invoking the
  gate, so a fixture that failed to stage what the scenario needs fails as a setup error rather
  than as a false behavioural pass — the failure mode that would otherwise let a test that
  detects nothing look like a passing guard. The trigger depends on staged-path ordering (the
  authored filename sorts before the merged-in one, so the first-match lookup resolves to it),
  so the fixture filenames are chosen deliberately and must not be renamed casually.
