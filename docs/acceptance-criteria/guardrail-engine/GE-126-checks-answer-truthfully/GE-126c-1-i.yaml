id: GE-126c-1-i
title: "The copy the build produces does not inherit the refusal"
component: guardrail-engine
components:
  - commit_guardian
  - build_pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the build-source copy of the parent-back-link check now refuses to answer,
  And the build produces the deployed copy from that build-source copy,
  When the build is run and the deployed copy it produced is invoked against one record
    that genuinely violates the parent-back-link rule,
  Then the deployed copy blocks naming the record and the missing back-link rather than
    refusing,
  And when the deployed copy is invoked against a clean record it reports an ordinary pass,
  And a commit staging a record with a valid parent back-link completes with this check
    reporting the ordinary success value,
  And the same holds for every location the build writes a copy of this check to so no
    location that is meant to enforce is left carrying the refusal.

  Coverage note: covered by running the build and then executing the copy at each location
  the build wrote against both a violating and a clean record. Asserting only that the
  build-source copy refuses does not cover this criterion, and it is the arm whose absence
  would be discovered by every commit in the repository at once.
