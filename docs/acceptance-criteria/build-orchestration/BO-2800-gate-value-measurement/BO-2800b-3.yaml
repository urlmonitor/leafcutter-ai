notes: |
  DECIDED DESIGN POINT, and the rationale is load-bearing: prose normalisation is a
  FALLBACK ONLY and must be visibly stamped, because a heuristic denominator that LOOKS
  exact is precisely the failure mode this goal exists to eliminate. This AC does not
  contradict the "no free-text clustering as the dedup mechanism" rule in the BO-2800b
  notes — clustering is barred as the PRIMARY key; here it is a marked, discountable
  fallback for records that predate the vocabulary.

  THREE STATES, THREE LABELS. The original pairing of two labels with three states was a
  real defect: BO-2800b-4's trigger (rule identifier absent or unrecognised on a live
  finding) fell outside both labels, yet b-4's promotion clause claimed to move a record
  "from heuristic to declared". Under the corrected set, promotion moves a record from
  "unclassified" to "declared" and the heuristic label never enters that path.

  WHY THIS IS STILL A SEPARATE AC FROM BO-2800b-4, against the reviewer's suggestion to
  merge them. They look alike — both handle "no declared rule identifier" — but they act
  on disjoint populations and have different outputs. This AC governs the FROZEN
  historical corpus, where no gate remains to promote into and the only available output
  is a stamped, discountable identity. BO-2800b-4 governs LIVE findings from a gate that
  is still running, where the output is a promotion queue and an eventual vocabulary
  change. Merging them would put a corpus-migration rule and a live intake mechanism in
  one AC and blur which population the discount applies to — exactly the confusion the
  two-label set produced. The shared vocabulary lives here; the intake mechanism lives
  in b-4.

  THE DISCOUNT APPLIES TO "heuristic" ONLY. This matters because the pull-request review
  gate is permanently exempt from declaring a vocabulary (BO-2800b-1) and produced about
  65% of recorded blockers. Its live findings are "unclassified", not "heuristic", so they
  are counted at full weight. Discounting them would discard most of the signal.
