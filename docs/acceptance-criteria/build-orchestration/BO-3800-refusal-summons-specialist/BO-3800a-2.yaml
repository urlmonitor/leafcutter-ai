id: BO-3800a-2
title: "A commit made by the commit agent or by a drive's commit step brings in the restructuring specialist on a complexity refusal; a session or person committing directly is told what to do and nothing is brought in"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven and the drive's own commit step attempts delivery,
  And check-complexity refuses it, stating that plan_batches in scripts/planner.py has
    complexity 31 and only 30 is allowed,
  When that refusal is adjudicated,
  Then the author's change is held as BO-3800a-1 requires, and the restructuring
    specialist appears in the ordered record of parties engaged, after the refusal and
    before delivery is attempted again.

  Given the same change and the same refusal, where the commit was made by the commit
    agent,
  When that refusal is adjudicated,
  Then the restructuring specialist is engaged in the same position, after the refusal
    and before delivery is attempted again, so a commit-agent commit brings the
    specialist in just as the drive's own commit step does.

  Given the same change refused the same way when an interactive session runs git
    commit itself, and again when a person runs git commit at a terminal,
  When each refusal is met,
  Then no party is engaged and nothing is held on the committer's behalf,
  And each committer is shown the refusal text GE-132a-3 requires: complexity 31, only
    30 allowed, and bring in the restructuring specialist with complexity-reduction.
