notes: |
  Retrospective refinement of KM-400a-3-i for registry-backed Component records.
  Compatibility component hubs without an authored registry record are not evidence
  of a complete native Component entry. New-component admission requirements are not
  permission to synthesize missing fields on legacy entries. Receipt evidence covers
  source fidelity and mutation checks; IT PO review and criterion-specific test links are now recorded; fresh execution remains separately evidenced.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Registry keys remain the canonical component identity; registry-entry validation and snapshot containment must
  reject conflicting identities or escaping references without source rewrites.
- The complete-native-record contract applies to registry-backed components; compatibility hubs retain their existing
  identity without acquiring fabricated registry fields.
