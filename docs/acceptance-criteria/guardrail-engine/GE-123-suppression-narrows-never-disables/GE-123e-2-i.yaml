notes: |
  PROMISE 2 OF GE-123e, second half (no carry-over), and the mandatory regression
  "a commit after a token-carrying commit is still checked".

  WHY THIS IS THE ARM THAT CATCHES THE DEFECT. The KI says it plainly: a test that
  only asserts "token in message, check skipped", or its inverse, passes against the
  defect. The defect is off by one commit in both directions. The token is unseen
  in the commit that carries it and honoured in the commit after it. Only a
  two-commit test exercises the second direction. Its confidence label stays
  DERIVED: the silent skip follows from the directly observed stale file, but it
  has not yet been observed as a wrong outcome. Do not upgrade that label in
  tickets or changelogs.

  THE STALE FILE MUST BE MADE BY GIT. The first commit writes the last-commit-message
  file as a side effect of a real commit. Writing that file by hand reproduces a
  state at a moment of the test's choosing, which is the FP-7 mistake. The third arm
  stops a "detect the stale token and refuse" implementation from passing.

  TEST-EVIDENCE RULE (for the IT PO; non-negotiable). Every scenario is verified
  through REAL git commit calls in a scratch repository with the hook installed.
  Use both an inline -m message and a message file passed the way the shared commit
  step passes it. Hand-writing the repository's last-commit-message file, or setting
  the environment variables the check reads in place of making a commit, is NOT
  evidence (test-angles failure catalogue, EPIC-ComputedQualityGates FP-7).
