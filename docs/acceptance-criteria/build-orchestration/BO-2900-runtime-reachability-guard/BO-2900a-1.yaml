notes: |
  The core positive rule of BO-2900a. Analytical decisions recorded for the IT PO and
  the implementer:

  - THE CALIBRATING FACT. When the five fast-lane AC-lifecycle functions were marked
    done, every statement the incumbent gate checks was TRUE: a covers-tagged test
    existed, it executed real code, and it passed. What was false is that no test in
    the repository entered the module's way in — every test direct-imported an inner
    function. "The test passes" and "the code is reachable" were independently true
    and false at the same time. That is the gap this AC closes, and it is why the
    third condition must be about what the run REACHED, not about the test's quality.

  - THE FINAL CLAUSE IS A SCOPE FENCE, NOT AN ESCAPE HATCH. A unit with no way in is
    deliberately excluded here so this rule stays decidable (compare the entered way
    in against the run). The no-way-in case is a harder judgement and is decided by
    BO-2900a-3, which routes it to the recorded exemption in BO-2900d. Without the
    fence an implementer will either block every helper module under this AC or
    quietly pass it — both are wrong.

  - MANDATORY TWO-WAY BOUNDARY vs BP-1100b-5 (build-pipeline, authored concurrently).
    Neither absorbs the other:
      * BP-1100b-5 is a DIFF-TIME LINT ON ASSERTION SHAPE. It fires on staged hunks
        that add an assertion whose only check is "this symbol's name appears in this
        file's text", over a fixed glob set (workflow JS and commit-guardian Python),
        and it has a `# presence-only: <reason>` waiver.
      * THIS AC is a DONE-PROOF ELIGIBILITY RULE ON WHAT THE ASSERTION REACHED. It
        fires when a criterion is being marked done, applies to any unit with a
        runtime way in, and rejects a genuinely-executing proof that got there by
        direct import.
    Decisive calibration: BP-1100b-5 WOULD NOT HAVE CAUGHT the fast-lane regression —
    the module is not in its glob set, and those tests were not presence-only, they
    executed real code. Only this AC catches it. Conversely this AC does not catch a
    presence-only assertion over a workflow JavaScript file, because that file has no
    entry point of its own to be entered. Implementers of either must not widen into
    the other's territory; if the two ever appear to collide, the correct move is to
    re-read this paragraph, not to merge the rules.

  - The BP-1100b-5 doc_link is recorded as `status: exists` because that AC was
    authored in the mainline store during the same session. It is not present in this
    worktree's checkout; resolve the link against the merged store, not this branch.

  - Verification must EXECUTE the eligibility evaluation over a fixture pair (one
    proof that goes through the way in, one that imports directly) and compare the two
    verdicts. A test that reads the gate's source for the new condition passes on a
    gate that never applies it — the exact failure this tree exists to prevent.

  2026-10-21 (IT PO). The technical contract is brought in line with the
  2026-09-30 amendments. It had contradicted them, and a coder reading this record
  alone would have built the fail-closed refusal that BO-2900a-2-ii exists to remove.
  criteria, title, req_status and depends_on are untouched. work_status stays todo
  and readiness stays reviewed. These are not protected fields, so the change
  carries no amended_by entry. What changed:
    (1) expects_from.contract. Before, it quoted the old record shape: one target
        '<module>:<callable>', one entry_point, reached_through as a bool and
        observation_ok. Now it names the amended reach_record of BO-2900a-2: unit,
        the entry_points list, a three-way reached_through with undecidable_cause,
        and observation with unwatchable_cause. It also says which fields this rule
        reads and that only the literal 'not_reached' can refuse. It agrees with
        BO-2900a-2 (the reach_record), BO-2900a-2-iii (the question names the
        declared unit and the answer has three values) and BO-2900a-1-iv (the unit
        comes from implemented_by).
    (2) it_requirements.constraints, the observation constraint. Before: "A missing
        observation fails closed with refusal_cause 'observation_unavailable'".
        Now an unwatched record or an undecidable answer gives no verdict. The
        criterion is neither refused nor credited, the verdict equals the
        rule-not-invoked verdict, and the case is announced with its cause and no
        clearing action. This agrees with BO-2900a-2-ii and BO-2900a-2-iii. The
        ban on falling back to source-text signals is kept as it was.
    (3) it_requirements.config_schema_fragment.reachability_verdict. Before, the
        refusal_cause enum included 'observation_unavailable'. That value is
        removed, and the description now says no cause exists for an unwatched or
        undecidable record. It now spells unit and entry_point as source paths
        (BO-2900a-1-iv) and notes that the dict is untouched while the rule is
        report-only (BO-2900a-1-ii).
    (4) The entry-point resolution constraint. Before, the unit was "the module
        holding the implementing code, or a module that imports it", spelled
        '<module path>:main'. Now the unit is the one the record's implemented_by
        names and no other, and the entry point is spelled '<repo-relative source
        path>:<callable>' by resolved path, never by stem or build-output copy.
        This agrees with BO-2900a-1-iv.
    (5) The scope-fence constraint. The hand-off to BO-2900a-3 is now scoped to "the
        declared unit exposes no way in". A record that declares no unit gets no
        verdict and no finding from this rule (BO-2900a-1-iv).
    (6) delivers_to.contract. unit and entry_point are spelled as source paths. An
        unwatched or undecidable record adds no key and changes no key. While
        report-only, the dict equals the rule-not-invoked verdict and the facts go
        on the structured finding. This agrees with BO-2900a-1-ii, BO-2900a-1-iv
        and BO-2900a-2-ii.
  Left alone on purpose, and they belong to other records: BO-2900a-1-ii (its
  it_requirements and delivers_to) and BO-2900a-5 (its delivers_to) still list
  'observation_unavailable' as a cause. BO-2900a-1-i still describes reached_through
  as a bool. Each needs the same amendment before it is built. This record's
  test_spec entries are protected test-designer output and were not edited.
  Addendum, later the same day (IT PO): those three siblings have now received the
  same amendment, so the paragraph above is history and not an open item. A
  correction too: BO-2900a-5's contract is in its expects_from, not its
  delivers_to.

  2026-09-30 (BA). work_status returned done -> todo, and three L3 children added
  (BO-2900a-1-ii report-only suspension, -iii the re-arm corpus, -iv the named
  unit). This criterion's own Then clause is "the criterion is rejected as not
  eligible"; the rule was suspended to report-only on 2026-09-30 and now rejects
  nothing, so the criterion is not satisfied by the tree. Measured, not inferred:
  unit_tests/ac_store/test_bo_2900a_1.py and test_bo_2900a_1_ii.py were run
  against this worktree and 4 of their 6 cases fail, every one of them on an
  assertion that the verdict is ineligible. The three new children describe the
  state the criterion is held in and the conditions for returning it to force;
  none of them is built. work_status and covered_by are open fields, so this
  change carries no amended_by entry — criteria, title, req_status and
  depends_on are untouched.

  2026-08-13 (IT PO enrichment). Enforcement surface for the BO-2900a family is the
  DONE-PROOF PATH, not a new hook: these are per-criterion eligibility rules, and
  verify_done_eligible is already consumed by both the check-done-proof pre-commit hook
  and the required CI done-proof job, so extending it inherits both enforcement points
  for free. The change-refusal surface (BO-2900b/c) is a separate new hook; see
  BO-2900b-1's notes for that decision and its rationale.
