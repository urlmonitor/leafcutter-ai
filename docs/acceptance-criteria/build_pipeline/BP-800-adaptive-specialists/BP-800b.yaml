criteria: |
  A purpose-built agent is generated for every detected language or framework.

  For each technology discovered in the project, the build produces a
  specialist agent loaded with behavioral best practices for that ecosystem —
  covering style, testing conventions, idioms, and tooling preferences.
  Multiple technologies are handled independently, frameworks inherit from
  their parent language, and unknown technologies get a minimal specialist
  rather than being skipped.
