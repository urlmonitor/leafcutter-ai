criteria: |
  Given an author who has read only the how-to and wants a new block named DEMO-ANSWER used by one
    existing route,
  When they follow its steps in order on a fresh checkout,
  Then the steps cover creating the block's source, marking an empty place for it in the route's
    template, declaring it as awaiting adoption when no route uses it yet, installing the package,
    and running the identity check,
  And following them ends with an install that succeeds and an identity check that passes, naming
    DEMO-ANSWER with one inspected copy.

  Given the same author wants an existing route to start consuming COMMIT-ANSWER,
  When they follow the how-to's second procedure,
  Then it tells them to mark the empty place, to remove COMMIT-ANSWER's awaiting-adoption entry for
    the record they are completing when it is the last one, and to reinstall,
  And it links to the reference page for every failure message rather than restating them.
