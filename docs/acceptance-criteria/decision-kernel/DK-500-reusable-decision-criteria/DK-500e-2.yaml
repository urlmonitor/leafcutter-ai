id: DK-500e-2
title: Criteria are drafted only for the gap Jev named, and not at all when nothing is missing
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given Jev's verdict names one missing concern, readability into the knowledge graph, beside five reused criteria,
  When criteria are drafted for the decision,
  Then every drafted criterion addresses that concern,
  And no drafted criterion repeats the wording of a reused criterion,
  And the person can still add criteria of their own at the approval of proposals,
  And when Jev's verdict states that nothing is missing, no criterion is drafted and no drafting request is made.
depends_on:
- DK-500e
- DK-500e-1
covered_by:
- DK-500e-2-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'Gap criteria [{wording, criterion_id, priority, kind, gap_concern, proposal_status: proposed}] beside the reused criteria, plus removed_repeats: [{wording, category_id}]. Consumed by in-run grouping (DK-500b-4) and the approval of proposals.'
expects_from:
  ac_id: DK-500e-1
  contract: Gap verdict with missing_concerns (DK-500e-1 delivers_to).
change_target: code
risk_surface: contract_boundary
it_requirements:
- The host request (host.generate_options, compiled by the kernel's invocation compiler, ADR-052) asks only for criteria for the missing concerns named in the verdict, and passes the reused criteria as already covered. The kernel checks that every returned criterion names one of those concerns (gap_concern) and drops the others with a stated reason.
- No host drafting request is made when the verdict is no_gap. With not_judged the fallback of DK-500e-1-i applies; with no reuse (an empty library) the request is exactly today's (DK-500e-3).
- Drafted criteria stay proposals (proposal_status proposed) and pass through in-run grouping (DK-500b-4) and the approval.
- The prompt text is compiled by kernel code, so this stays python-coder work; no agent template or skill changes.
test_required: true
test_spec:
- name: test_every_drafted_criterion_addresses_named_concern
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With one missing concern, every drafted criterion carries that gap_concern; others returned by the host are dropped with a reason.
- name: test_no_drafted_criterion_repeats_reused_wording
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: No drafted criterion repeats the wording of a reused criterion.
- name: test_person_can_still_add_criteria
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The approval still accepts criteria the person adds.
- name: test_no_drafting_request_when_no_gap
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With a no-gap verdict, the recording host port receives no drafting request and no criterion is drafted.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, the run report, trace events and call counts rather than internal helpers.
