  the procedure, and GE-126a-5 is a sibling reference rather than a downstream consumer
  — the two are the two documentation_triggers legs of the same L1, not a chain. DO NOT
  REFILL.

  AGENT — documentation-expert, and the surfaces are docs/how-to/ pages only. Note for
  the driver: documentation-expert has a recorded habit of dispatching a leaf specialist
  and returning before it finishes. Verify the page exists on disk before accepting the
  sign-off; an early 'nothing changed' reading is not proof the specialist died.

  THE EXTRACT-DO-NOT-RETYPE REQUIREMENT IS THE CORE OF THE TEST CONTRACT and it is the
  thing a test author will skip. Retyping the commands into the test produces a test of
  the test author, which stays green while the page rots. Every descriptor here is
  written to turn on the shipped bytes.

