    type: behavioral
    description: "Hook executed as a subprocess against the seven staged records, with no SKIP set, exits 0."
  - name: test_no_violation_reported_for_any_exempted_child
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "None of KM-200a..KM-200f appears in the violation output of the passing run."
  - name: test_output_names_parked_parent_once_with_its_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The run's stdout names KM-200 exactly once as a recognised parked record and includes the recorded parked_reason, so the exemption is visible rather than silent."
  - name: test_marker_removed_differential_exits_nonzero_with_six_violations
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Identical staged set with the parked marker removed from KM-200.yaml exits non-zero and reports six violations — the passing run is attributable to recognition, not to the check not running."
