notes: |
  Trigger choice (BO-4400d notes leave it to BA/IT PO): session start, rate-limited by a
  configurable interval, because a schedule needs a machine-level timer the package cannot
  install portably (Windows / WSL / macOS differ), while a session start exists in every
  install. The interval stops a burst of sessions (parallel agents, restarts) from sweeping
  repeatedly. Logged as an assumption.
