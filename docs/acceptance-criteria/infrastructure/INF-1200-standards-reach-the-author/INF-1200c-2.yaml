notes: |
  THE PO NAMED THIS AS THE ARM MOST LIKELY TO BE DROPPED, AND IT IS RIGHT TO WORRY.
  "The owner" is not reliably singular in either direction. A specialist may own several
  kinds of file with different standards; a kind of file may have more than one
  legitimate audience. A decomposition that assumes one specialist per kind of file, or
  one kind of file per specialist, under-delivers on whichever pairing it drops, and
  the drop is silent — the specialist that was told one of its two standards looks
  exactly like a specialist that was told everything.

  THE IMPLEMENTATION THIS RECORD EXISTS TO EXCLUDE IS THE ONE THE LANGUAGE HANDS YOU
  FOR FREE. A dictionary keyed by kind of file, or by specialist, gives first-match
  semantics with no code written and no warning issued. It is correct on any fixture in
  which each key appears once. It is the same failure in both directions and one
  mutation exposes both.

  THE THIRD ARM IS NOT THE SAME AS INF-1200c-1's EXCLUSION ARM. c-1 excludes a
  specialist that owns nothing covered. This excludes a covered specialist being told
  about the wrong ONE of the kinds of file it owns — a within-specialist precision
  claim that c-1 cannot see, because from c-1's vantage that specialist was correctly
  in the audience.

  THE FOURTH ARM IS AN INDEPENDENCE CLAIM AND IT IS THERE FOR A SPECIFIC BUG SHAPE. A
  join implemented by mutating a shared accumulator, or by attributing standards to
  specialists rather than to kinds of file, produces cross-contamination that only
  appears once one standard has two audiences and one specialist has three kinds. Three
  and two are the smallest numbers at which that is observable.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: key the delivery on a single association in each direction — one owner per
  kind of file and one kind of file per specialist — taking the first match encountered
  and discarding the rest. Under that injection:
    - the two-kinds-one-specialist arm must go RED, because only one of the two
      standards is stated;
    - the two-specialists-one-kind arm must go RED, because only the first specialist
      is told;
    - the independence arm must go RED;
    - INF-1200c-1's movement arm must STAY GREEN, because a first-match lookup rebuilt
      from the ownership record still moves when ownership moves.
  All four outcomes must be observed together and all must revert. The green outcome is
  the evidence that this record is carrying something c-1 cannot: an implementation that
  passes every arm of c-1 can still drop half the audience.

  MEASURED, 2026-09-09, IN THIS WORKTREE. The ownership record already assigns one
  specialist more than one kind of file, and records in the same entry a written
  rationale acknowledging that one of those assignments is an expedient rather than a
  judgement. Whether that assignment is right is AR-100's question and is fenced. That
  it exists means the first arm has a real fixture and must use it.

  DELIBERATELY NOT NAMED IN THE CRITERIA: any specialist and any kind of file, per the
  L0's altitude test and GE-127c's precedent.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The
  mutation above, including which arm must stay green, is written to be turned directly
  into test descriptors.
