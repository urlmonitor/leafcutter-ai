documentation_rationale: "Preserves an existing mandatory guarantee across a change of mechanism -- it introduces no new user-facing behaviour to document, and the isolation setup itself is already covered by the ACD-2100 tree."
notes: |
  WHY AN L1 FOR SOMETHING THAT IS ALREADY SUPPOSED TO BE TRUE. Because it is
  already supposed to be true and has failed anyway. Isolation is not a new ask
  in this tree -- the user named it as a constraint on the redesign. It gets a
  slot so the redesign cannot quietly drop it, and it is stated as an invariant
  over ALL paths rather than over the happy path.

  THE OBSERVED FAILURE THIS GUARDS AGAINST. The current route has been seen to
  lose isolation as a SIDE EFFECT of an unrelated defect: a gate that could not
  reach the user was answered by an agent refusal accepted as a decision, the
  run continued outside isolation, and authoring landed on the main checkout.
  So the requirement is not "the route creates a worktree". It is "no reachable
  path leaves the session writing to the shared copy" -- including cancel,
  failure, an unreachable user, and an unavailable setup step. Note the
  dependency direction: ACD-2200b's conversational gates remove the specific
  trigger, but removing one trigger is not the same as establishing the
  invariant.

  KNOWN ADJACENT DEFECT, deliberately left with its owner: KI-ACD-007
  (product-truth artifacts written to the main checkout) is the same failure
  class on a different store and is fenced out of ACD-2100. If decomposition
  shows one mechanism fixes both say so rather than annexing it silently.

  EVIDENCE STANDARD: prove this by running the route's failure paths in a fresh
  process from a real working directory and inspecting where files landed --
  not by grepping for a setup call. A setup call that is present and skipped
  looks identical to one that ran.
