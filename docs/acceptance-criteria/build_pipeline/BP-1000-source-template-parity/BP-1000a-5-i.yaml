created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000a-5.yaml"
criteria: |
  Given a checkout that contains the tracked templates/scripts/feedback/ source
    mirror
  And the gitignored working-tree directory scripts/feedback/ has been deleted
    entirely (simulating a fresh clone with no leftover working-tree files)
  When the build is run end to end including its broken-reference preflight guard
  Then the build resolves the feedback deployable-script set from the tracked
    mirror and completes with a success outcome
  And the broken-reference preflight guard does not report any feedback script as
    a broken or missing reference
  And the build outcome is identical whether or not a stale scripts/feedback/
    working copy happens to be present, so the result never depends on leftover
    working-tree files
