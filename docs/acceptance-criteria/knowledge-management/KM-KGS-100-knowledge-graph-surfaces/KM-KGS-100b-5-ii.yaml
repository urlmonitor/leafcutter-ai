criteria: |
  Given the read index is exercised against the real on-disk knowledge store as it
    is actually written on disk, inside a layout produced by a deployed build
    (build.py --target-dir), rather than against hand-authored synthetic fixtures
  When the equivalence, staleness, self-heal, and fallback behaviors of the index
    are verified
  Then each behavior is asserted by running the real read path in a fresh process
    against that real deployed store and comparing its output to a live full parse of
    the same store
  And a verification that only exercises synthetic in-memory fixtures does not, on its
    own, satisfy the correctness contract for this capability
