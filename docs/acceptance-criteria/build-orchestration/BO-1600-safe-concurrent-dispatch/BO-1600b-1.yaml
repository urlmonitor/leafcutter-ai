notes: |
  Origin: EPIC-FinalizeFeatureHardening KI-1. Cleanup-after-failure is the
  complement of the prevention guarantee in BO-1600a: even with serialized
  writes, a commit that dies mid-write must not leave debris for the next
  supervisor. Atomic-write-then-rename of loose objects is the canonical git
  mechanism; the AC states the WHAT (no truncated object survives) not the HOW.
