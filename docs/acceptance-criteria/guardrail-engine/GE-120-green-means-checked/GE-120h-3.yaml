assigned_agent: python-coder
estimated_complexity: M
package_surface: true
it_requirements:
  config_schema_fragment:
    _declares: >-
      NOT A NEW TOP-LEVEL CONFIGURATION KEY — read this before writing any code.
      This AC registers FIVE ENTRIES in the EXISTING hooks_manifest.hooks array of
      templates/scripts/commit_guardian/commit_guardian.json. It introduces no new
      settings section and no new configuration key of any kind. The fragment below
      is the schema of ONE MEMBER of that array, derived by measuring the 62 members
      it already holds (2026-09-14), narrowed to the shape these five require. Every
      property named below is already carried by existing members: id/tier/name/
      entry/language/stages/pass_filenames/change_set_source appear on 62 of 62, and
      always_run on 9 of 62. Nothing here is aspirational.
      DELIBERATE OMISSION, DO NOT "COMPLETE" IT: four of the five have a populated
      top-level settings section in this same file already (folder_density,
      sql_complexity, debug_scripts — verified present; ac_done_on_merge needs none),
      and the fifth, test_fixture_bloat, has NO such section. That absence is
      load-bearing and intended: check_test_fixture_bloat.py reads
      load_config().get("test_fixture_bloat", {}) and then enabled = config.get(
      "enabled", False), so the missing key resolves to {} and the check is inert on
      arrival, which is what makes registering it zero-risk. Creating that key would
      ARM a check nobody has decided to arm. It is therefore not declared here and
      must not be added by this AC.
      ALSO NOTE: a top-level key added later IS itself a package surface —
      _package_surface_registry.WATCHED_REGISTRIES watches this file through BOTH
      ("hooks_manifest.hooks", "list_ids") AND ("", "mapping_keys"). Arming
      test_fixture_bloat is a separate change that needs its own package_surface
      declaration.
      CORRECTED 2026-10-08 (IT PO), AGAINST THE LANDED MANIFEST: the five are NOT
      uniform. Four (check-folder-density, check-test-fixture-bloat,
      check-sql-complexity, check-debug-scripts) are tier judgment, stages
      ["pre-commit"], and entered through run_hook.py. check-ac-done-on-merge is
      tier transform, stages ["post-merge"], invoked DIRECTLY (its entry names
      hooks/check_ac_done_on_merge.py with no run_hook.py wrapper), and carries
      negative_control {not_applicable: true, reason}. transform is correct: the
      script mutates AC files after a merge and never judges (main() returns 0
      unconditionally; the __main__ guard maps OSError/ValueError to exit 0), and
      transform is the fixing role in run_hook.py's tier vocabulary
      (_TRANSFORM_TIER). The 2026-09-14 version of this fragment required
      tier: {const: judgment} for all five, so GE-120h-3-i, which judges these
      entries against this fragment, would have flagged a correct registration as
      a violation. The per-id split below (allOf/if/then/else) states the true
      shape. negative_control is the one property added to the measured set, and
      it is carried by exactly two entries in the manifest today, this being one.
    type: object
    required:
      - id
      - tier
      - name
      - entry
      - language
      - stages
      - pass_filenames
      - change_set_source
      - always_run
    properties:
      id:
        type: string
        enum:
          - check-folder-density
          - check-test-fixture-bloat
          - check-sql-complexity
          - check-debug-scripts
          - check-ac-done-on-merge
      tier:
        type: string
        enum:
          - judgment
          - transform
        description: >-
          judgment for the four pre-commit gates; transform for
          check-ac-done-on-merge. Pinned per id by the allOf below.
      name:
        type: string
        minLength: 1
      entry:
        type: string
        description: >-
          The four pre-commit gates are invoked through the deployed run_hook.py
          wrapper. check-ac-done-on-merge is NOT: its entry invokes
          {{config.output_root}}/scripts/commit_guardian/hooks/check_ac_done_on_merge.py
          directly. Its script path carries the hooks/ segment because the script
          lives at templates/scripts/commit_guardian/hooks/check_ac_done_on_merge.py;
          build_commit_guardian() walks the guardian directory with rglob, so the
          subdirectory is deployed.
      negative_control:
        type: object
        description: >-
          GE-120f's declaration, shaped per config/verification_flow.schema.json
          $defs/negative_control. Required on check-ac-done-on-merge in its
          not_applicable form, with a reason stating the structural ground. The
          not_applicable form is forbidden on the four that can refuse (amended arm
          4): one that ships unarmed, or that has nothing to examine here, is not
          excused by a declaration.
      language:
        type: string
        const: system
      stages:
        type: array
        description: >-
          ["pre-commit"] for check-folder-density, check-test-fixture-bloat,
          check-sql-complexity and check-debug-scripts. ["post-merge"] for
          check-ac-done-on-merge, whose subject is a merge that already happened.
        items:
          type: string
          enum:
            - pre-commit
            - post-merge
      pass_filenames:
        const: false
      always_run:
        const: true
      change_set_source:
        type: string
        const: handed_by_commit_path
        description: >-
          SEE THE change_set_source it_requirement BELOW — this value is NOT the
          intuitive one and self_derived is a verified claim these five cannot make
          as they stand.
    not:
      required:
        - files
    allOf:
      - if:
          required:
            - id
          properties:
            id:
              const: check-ac-done-on-merge
        then:
          required:
            - negative_control
          properties:
            tier:
              const: transform
            stages:
              const:
                - post-merge
            entry:
              not:
                pattern: "run_hook\\.py"
            negative_control:
              required:
                - not_applicable
                - reason
              properties:
                not_applicable:
                  const: true
                reason:
                  type: string
                  minLength: 1
        else:
          properties:
            tier:
              const: judgment
            stages:
              const:
                - pre-commit
            entry:
              pattern: "run_hook\\.py"
            negative_control:
              not:
                required:
                  - not_applicable
  reference_file_path: templates/scripts/commit_guardian/commit_guardian.json
  n_location_rule: >-
    5 — one new member appended to the single hooks_manifest.hooks array, one per
    registered check. No other location in the file is modified: no top-level key is
    added, renamed or removed, and the three existing settings sections
    (folder_density, sql_complexity, debug_scripts) are left exactly as they are.
    Partial registration is a defect: four of five leaves the inventory ratchet's
    staleness assertion red and the README still false about the fifth.
  required_skills:
    - python-coder
  post_write_commands:
    - "python3 scripts/build.py"
    - "python3 scripts/commit_guardian/install_pre_commit_shims.py"
    - "python3 -m pytest unit_tests/commit_guardian/test_hook_registration_inventory.py"
  constraints:
    - "THE REGISTRATION IS NOT THE DELIVERABLE — THE EXECUTION IS. Five lines in a file is not evidence that anything runs. Every clause must be evidenced by driving the deployed commit path (run_hook.py against a real staged set, or a real `git commit`), never by reading the manifest as text. CLAUDE.md 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep' is binding on this AC in its strongest form."
    - "change_set_source MUST BE handed_by_commit_path FOR ALL FIVE, NOT self_derived, AND THIS CONTRADICTS THE INTUITIVE READING. The value is not a free label: change_set_source._classify_hook() credits self_derived ONLY when the entry's own script text contains `get_authored_change` or `_authored_change` (_SHARED_SOURCE_MARKERS); an entry claiming self_derived whose script does not is placed in DeterminationResult.failures. Verified 2026-09-14: none of the five scripts references either marker, so the only two self_derived entries in the manifest today remain check-doc-frontmatter and check-contract-shrinking. Declaring self_derived without first migrating the scripts onto the shared source would be a false declaration that the live suite does not catch — test_ge_120e_2.py's real-manifest assertion only checks membership in the allowed value set. This is the same declaration-checked-for-shape-not-for-truth defect as KI-CG-20260831-fictional-config-schema-fragment. See GE-120h-3-i, which owns this field and states the condition under which self_derived becomes truthful."
    - "NO `files` KEY ON ANY OF THE FIVE, AND THE OMISSION IS NOT TIDINESS. Each entry is always_run: true with pass_filenames: false and no files regex — the shape check-file-size, check-build-drift, check-identifier-uniqueness and check-hook-trigger-reachability already use. check_hook_trigger_reachability.py reports an always_run entry that ALSO carries a files filter as a self-contradiction and fails the run; for check-debug-scripts a location-anchored `^debugging/scripts/` regex would additionally classify UNREACHABLE (not the softer NOTHING-TO-MATCH) because this checkout tracks no file under debugging/. The reachability gate is itself registered and runs on the same commit, so a wrong shape is refused immediately. Constrained in full by GE-120h-3-i."
    - "DO NOT CREATE THE test_fixture_bloat CONFIG KEY. Its absence is what keeps check-test-fixture-bloat inert, and inert is the agreed condition of registering it. Arming it is a separate, deliberate decision and a separate package surface."
    - "DO NOT 'TIDY' check_folder_density.py's CLASSIFICATION. Its built-in ratchet raises a violation only where a folder crosses the limit IN THIS COMMIT, so the 113 directories already over max_files_per_folder report as warnings. That behaviour is the entire reason the second criterion arm is satisfiable today; a refactor that reports pre-existing state as a violation walls off large parts of the repository on the first commit after this lands."
    - "REDUCE THE INVENTORY BASELINE BY EXACTLY THESE FIVE, IN THE SAME CHANGE. unit_tests/commit_guardian/test_hook_registration_inventory.py's UNREGISTERED_BASELINE names all five; its staleness assertion fails if they are registered and the baseline is not reduced. Remove those five lines and their comments. Do not add anything to that frozenset, and do not re-derive the remaining nine — read the baseline rather than this AC for the set, since it has moved three times in one day."
    - "ADR-001 TEMPLATE/DEPLOYED PARITY. templates/scripts/commit_guardian/commit_guardian.json is the canonical source; build_commit_guardian() deploys it to scripts/commit_guardian/ and config/commit_guardian/, and build_precommit regenerates .pre-commit-config.yaml from it. Edit the template only, then run build.py and confirm all deployed copies and the generated config carry the five entries. NOTE: this worktree currently has no deployed copies at all — build.py has not been run here — so any verification performed before build.py proves nothing about the deployed path."
    - "check-ac-done-on-merge ONLY RUNS IF THE post-merge HOOK TYPE IS INSTALLED, AND NO ENTRY USES THAT STAGE TODAY. Measured 2026-09-14, the manifest's stages are pre-commit (60), commit-msg (1), manual (1) — post-merge would be the first. build_precommit emits the stage into .pre-commit-config.yaml but installs nothing; install_pre_commit_shims.py reads the declared stages from that file and writes the missing shim, and setup_ticket_worktree.py calls it for new worktrees. An existing checkout needs it re-run. Registering a post-merge entry without the shim reproduces exactly the defect this L0 is named after: a check listed as live that nothing invokes. Evidence for this check must be a real merge in a checkout where the shim is installed."
    - "check-ac-done-on-merge READS `git diff HEAD~1 HEAD`, NOT THE STAGED SET AND NOT argv. Do not describe or test it as a staged-set consumer. It also returns 0 unconditionally and its __main__ guard swallows OSError/ValueError into exit 0, so it cannot block. It is tier transform, stages post-merge, and invoked directly rather than through run_hook.py. Under amended arm 4 it is the one check that cannot refuse, so its hooks_manifest entry MUST carry negative_control {not_applicable: true, reason} whose reason states that structural ground. It must not be left to be inferred from silence."
    - "THE FOURTH ARM IS THE ANTI-THEATRE CLAUSE, AND IT IS FOUR REFUSALS PLUS ONE DECLARATION. DO NOT SATISFY IT BY OBSERVING GREEN RESULTS. (a) For each of the four that can refuse (check-folder-density, check-sql-complexity, check-debug-scripts, and check-test-fixture-bloat under settings that arm it), drive an input that check exists to refuse through the registered entry (run_hook.py <check script> against a real staged git repo) and show a non-zero exit naming what it objected to. Three of those four have nothing to bite on in this repository and one is unarmed by default, so this needs deliberate fixtures. Arming check-test-fixture-bloat must happen in a private deployed copy, never by adding the test_fixture_bloat key to the tracked template. (b) For check-ac-done-on-merge, which no input or setting can drive to a refusal, the entry that registers it must declare negative_control.not_applicable with a structural reason. A not_applicable declaration on any of the other four fails the arm, because each of them can be made to refuse. How a known-bad input or exemption is declared, stored and enforced is GE-120f's; do not respecify it here."
    - "IF BP-1600a-2 LANDS FIRST, FIND THE FIVE PRESENT AND ASSERT THEM — DO NOT ADD THEM TWICE. Deliberately not a depends_on edge in either direction; whichever is scheduled second adapts."
test_spec:
  - name: test_ge120h3_all_five_run_on_an_ordinary_commit
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: deployed
    surface_invoked: "git commit and git merge --no-ff in a scratch repo with pre-commit installed for pre-commit and post-merge; the five stanzas are copied from the build-generated .pre-commit-config.yaml of the shared deployed layout"
    description: "In test_ge_120h_3_registration.py (arm 1): a real git commit shows each of the four pre-commit checks' status line as Passed and does not run check-ac-done-on-merge; a real merge then shows check-ac-done-on-merge's status line. The scratch config carries only the five stanzas, not the full hook family."
  - name: test_ge120h3_previously_acceptable_content_still_commits
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: "git commit in a scratch repo with the five generated stanzas installed"
    description: "In test_ge_120h_3_registration.py (arm 1): ordinary content (prose, a small .py, a trivial .sql) commits with rc 0, HEAD exists, and no hook reports Failed."
  - name: test_ge120h3_preexisting_over_density_directories_do_not_refuse
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: "python templates/scripts/commit_guardian/run_hook.py templates/scripts/commit_guardian/check_folder_density.py (subprocess, real scratch git repo)"
    description: "In test_ge_120h_3_registration.py (arm 2): a folder already at 20 committed files, with one more staged, exits 0 and is reported PRE-EXISTING by name, never FOLDER TOO DENSE. Synthetic folder, source-tree script; it does not exercise this repository's own over-limit directories."
  - name: test_ge120h3_check_sql_complexity_reports_nothing_to_inspect_when_no_sql_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_hook.py check_sql_complexity.py (subprocess, real scratch git repo)"
    description: "In test_ge_120h_3.py (arm 3): with no .sql staged the check exits 0 and prints GE-120a-1's 'RESULT: nothing_to_inspect' rather than staying silent."
  - name: test_ge120h3_check_debug_scripts_reports_nothing_to_inspect_when_none_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_hook.py check_debug_scripts.py (subprocess, real scratch git repo)"
    description: "In test_ge_120h_3.py (arm 3): with nothing staged under debugging/scripts/ the check exits 0 and prints 'RESULT: nothing_to_inspect'."
  - name: test_ge_120h_3_reachable_from_entry_point
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "python templates/scripts/commit_guardian/run_hook.py templates/scripts/commit_guardian/check_debug_scripts.py"
    description: "In test_ge_120h_3.py: the registered wrapper refuses an untagged debug script with a non-zero exit naming the file, so the result is consumed in control flow and is not just a function return value."
  - name: test_ge120h3_check_folder_density_refuses_a_newly_dense_folder
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "run_hook.py check_folder_density.py (subprocess, real scratch git repo)"
    description: "In test_ge_120h_3_refusals.py (arm 4, refusal 1 of 4): a folder at 15 committed files pushed to 16 by this commit's staging exits non-zero with FOLDER TOO DENSE and is not reported PRE-EXISTING."
  - name: test_ge120h3_check_sql_complexity_refuses_an_overcomplex_sql_file
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "run_hook.py check_sql_complexity.py (subprocess, real scratch git repo)"
    description: "In test_ge_120h_3_refusals.py (arm 4, refusal 2 of 4): a staged .sql whose score exceeds sql_complexity.max_score exits non-zero and names complex.sql."
  - name: test_ge120h3_check_debug_scripts_refuses_an_untagged_debug_script
