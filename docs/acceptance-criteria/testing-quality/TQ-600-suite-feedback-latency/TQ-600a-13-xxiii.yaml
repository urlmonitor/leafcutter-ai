notes: |
  OPEN POINT FOR THE OWNER — SKIPS FOR OTHER REASONS. The folder may contain tests that skip
  for reasons unrelated to the local database (for example a test that needs a hosted
  database or a credential the post-merge run does not hold). This record makes those
  visible and forbids counting them as passed, but does NOT make them turn the run red or
  did-not-complete, because doing so would hold every pull request on a credential the run
  was never given. If the owner wants a non-database skip to fail the lane, that is a one-
  clause change here.

  NO DELIVERS_TO, DELIBERATELY. As in TQ-600a-13-xxii, the notice of TQ-600a-13-iii reads
  this ending through the existing did-not-complete verdict and stage vocabulary of
  TQ-600a-13-v, gaining one stage value and a named list of other-reason skips. No new
  contract is declared toward TQ-600a-13-iii, an approved record of an earlier run.

  HOW "NO DATABASE WAS REACHABLE" IS RECOGNISED is the IT PO's to settle (a shared skip
  reason, a marker, or the lane's own reachability probe), but it must be decided from the
  test's own result, never from searching test source.
