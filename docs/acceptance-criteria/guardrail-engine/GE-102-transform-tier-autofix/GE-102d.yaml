work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a staged Python file that violates the exception-handling rules (a bare except,
    a blind exception catch, or a silently swallowed error),
  When the exception-handling check reports the violation,
  Then it emits an AUTOFIX_AGENT line naming the agent that owns the .py extension,
  And the agent id is obtained from the same extension-to-agent lookup the complexity and
    doc-length checks already use (driven by the agent registry's owned file extensions),
  And the line format matches the AUTOFIX_AGENT lines those existing checks already print,
  so the auto-fix path can parse the originating agent and re-dispatch it.
depends_on: [GE-102]
