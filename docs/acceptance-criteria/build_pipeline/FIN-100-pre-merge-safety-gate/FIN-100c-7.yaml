    entry: "Added estimated_complexity (S), it_requirements (instance-specific integration only: recovered baseline is non-null so Step 1 does not fire and the existing Step 2/Step 5 partition applies unchanged — no new triage branch, no schema change; behavioral rules inherited from FIN-100c-1/2 are deliberately NOT restated), and test_spec (3 descriptors). assigned_agent test-failure-triage kept per the read-only classification boundary and sibling convention (FIN-100c-1/2/3); contracts and criteria unchanged."
    by: it-po
