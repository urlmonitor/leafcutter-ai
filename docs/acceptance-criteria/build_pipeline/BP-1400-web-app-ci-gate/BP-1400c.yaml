title: "A web-app page that won't load is caught before it reaches users"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Every page of the web app is automatically loaded and verified to render without error.

  When a pull request changes the web app, each of its pages is loaded
  automatically and checked to render without error, so a broken page or route is
  caught before the change merges — not after it ships, by a person who happens to
  open it.
