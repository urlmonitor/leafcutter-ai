status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic driven through /build-epic holding three tickets, two of them
    with a newly added test covering the same requirement whose test entry
    names must_catch ["revert the fix"] —
      K1: the test writer's sign-off says red, and the test's only failure is
          "ImportError: cannot import name 'refresh_config_v2'",
      K2: the test writer's sign-off says red, and the test fails with
          "AssertionError: expected 1 refresh call, got 3",
      K3: the ticket has no source requirement,
  When each ticket reaches the step between the test writer and the coder,
  Then the /build-epic route runs the same red-baseline reader the fast lane
      and /build-feature run, over the same inputs, before any coder is
      dispatched for that ticket,
    And K1 does not reach the coder: its drive stops with the reader's report
      naming the test and the absence-only red, although the test writer's
      sign-off said red,
    And K2 reaches the coder as it does today,
    And K3 records "red-baseline reader not applicable: no source requirement"
      and goes on to the coder, never recorded as verified,
    And for the same tests and run outcomes the /build-epic verdict is
      identical to the fast lane's and /build-feature's,
    And the verdict is the reader's own; the supervisor's summary of it, or
      the test writer's sign-off, never stands in for it.
