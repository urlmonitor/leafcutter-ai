title: "The fast lane passes --exclude-structural-parent, so pointing it at one AC does not balloon the build set"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast-lane ship workflow resolving the connected build set for a single
    target acceptance criterion,
  When it invokes the select_connected subcommand,
  Then the invocation includes the --exclude-structural-parent flag,
  And an acceptance criterion that names its own structural parent in depends_on does
    not cause that parent's entire subtree to be pulled into the build set,
  And the symptom ("pointing the fast lane at one AC resolves a build set of fifteen
    and builds them all in a single run and pull request") does not occur.
