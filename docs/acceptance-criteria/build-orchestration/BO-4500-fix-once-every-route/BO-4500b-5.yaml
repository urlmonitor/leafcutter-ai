  diagram hooks (mermaid parent link, complexity, naming, identifier uniqueness, doc
  frontmatter), and the components it draws were read from the built code
  (build_phases_workflows.py, build_shared_blocks.py, build_shared_validation.py,
  shared_block_identity.py), whose behaviour the BO-4500b-1/-2/-3 tests cover.
