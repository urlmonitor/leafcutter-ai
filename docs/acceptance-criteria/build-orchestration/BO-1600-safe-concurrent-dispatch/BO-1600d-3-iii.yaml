criteria: |
  Given the repository is a shallow clone or a bare clone
  When the recovery entry point is started against it
  Then recovery refuses to proceed and reports that the repository is a shallow or
    bare clone that this recovery does not support, before taking any repair action
  And it performs no object removal, no ref reset, and no index rebuild in this case
