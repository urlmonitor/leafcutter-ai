it_requirements:
  - "Encode in the test-writer agent template the rule that any change to a parser, validator, or hook must be accompanied by an independent behavioral test that runs the component in a fresh process against a real on-disk artifact produced by the tool that writes it."
  - "The independent check must assert observable behavior on the real artifact, not only on synthetic in-test fixtures, so a feature that is broken on real data cannot pass on tidy hand-made data (see project memory: files_touched drives surface / real-artifact behavioral spot-check)."
  - "The convention must be consistent with the round-trip discipline (BO-2500c-2) and the fixture policy (BO-2500c-1); it states the WHAT that the fast lane's verification step invokes."
