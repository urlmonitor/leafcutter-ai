id: TKT-200f-1
components:
  - ticket-creation
title: "A premise true only on a dirty local tree is rejected against the clean tree"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose captured claim reproduces on a developer's local checkout but the
    captured reproduction command yields a different result when run against a clean,
    CI-equivalent tree,
  When the pre-inbox-exit premise verification runs the command against the clean tree,
  Then the verification observes the discrepancy between the local capture and the clean-tree
    result,
  And the ticket is blocked from leaving the inbox with a reason that shows the local
    result versus the clean-tree result,
  And the premise is not allowed to become load-bearing.
