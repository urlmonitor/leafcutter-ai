notes: |
  SITE 2 OF 5, and the first of the two causes of KI-ACD-009. Verified by the PO on
  2026-08-25: templates/workflows-js/plan-feature.js line 1749 reads
  `{{config.output_root}}/config/agent_registry.json`, which expands to a
  cwd-relative `.leafcutter/config/agent_registry.json`. Confirmed by `ls` in the
  known issue: that file exists at the workspace root and does NOT exist inside a
  worktree. So the read fails deterministically for any run whose working directory
  is a worktree -- which is where every authoring run starts.

  THE SECOND GIVEN IS THE WHOLE TEST. If the fixture worktree happens to contain a
  `.leafcutter/config/` directory, the buggy relative path resolves and the test
  passes against unfixed code. Assert the absence first, then run. This is the same
  construction hazard as ACD-2100a-1's two-copies Given.

  BOUNDARY WITH ACD-2100b. This record is about the read SUCCEEDING from a worktree.
  What the check reports when it genuinely cannot read, cannot parse, or cannot find
  the agent is ACD-2100b's subject, and the two must not be merged: fixing only the
  path would make the misleading message stop appearing in the one case anybody
  reproduced while leaving the false verdict in place for the rest.

  RELATED: ACD-2100b-5 removes the live agent round-trip this check currently uses
  to read a static local file. If that lands first, this behaviour is exercised
  through the runtime's own read instead of through a dispatched agent; the
  observable outcome stated here is unchanged either way.

  2026-08-25 (it-po): no expects_from edge to ACD-2100a-1 even though both consume the
  same resolution, because depends_on does not carry that ordering and the build
  sequencer reads depends_on only (KI-ACD-015, open) -- an expects_from edge without a
  depends_on mirror is invisible to scheduling and would be a contract nobody enforces.
  The shared-resolution requirement is therefore stated as an it_requirement, which the
  coder does see. Same reasoning applies to the a-3/b-1..b-3 relationship: those are
  refinements of this read's failure reporting, not prerequisites of it.
