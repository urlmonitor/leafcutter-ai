it_requirements:
- Record canonical AC, ancestor criteria, ADR and product-truth identities with their content/source revisions;
  do not let a changed parent obligation hide behind an unchanged leaf ID.
- Compare semantic scope/approval/dependency/settings evidence separately from priority-only edits, so
  priority does not invalidate an otherwise healthy owned feature.
- Revalidation must precede implementation, reviewer and publication dispatch, not just restart.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
  workspace_claim:object, settings_revision:string, next_step:string, ac_evidence:object[], ac_budgets:object[],
  review_count:integer, in_flight_action:object|null, publication:object|null}.'
- 'Runtime interface from ACD-1300f-1 (data handoff, not an additional build-order prerequisite): FeatureCandidate
  {feature_id:string, ancestor_ids:string[], source_revision:string, obligations:[{ac_id:string, parent_id:string|null,
  level:string, criteria:string, revision:string}], remaining_ac_ids:string[], completed_context_ids:string[],
  readiness:object, estimates:object, unanswered_questions:object[], dependency_edges:object[]}.'
- 'Runtime interface from ACD-1300f-2 (data handoff, not an additional build-order prerequisite): DependencyPlan
  {feature_id:string, ordered_ac_ids:string[], internal_edges:object[], external_edges:object[], evidence:[{ac_id:string,
  scope:worktree|target, revision:string, checks:object[], completed:boolean}], blockers:object[]}.'
- 'Runtime interface from ACD-1300b-1 (data handoff, not an additional build-order prerequisite): WorkerSettings
  {enabled:boolean, max_agent_calls:integer>=1, implementation:{executor:string, provider:string, model:string,
  endpoint:string, credential_ref:string|null}, reviewer:{executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, credential_ref:string|null}, settings_revision:string}.'
