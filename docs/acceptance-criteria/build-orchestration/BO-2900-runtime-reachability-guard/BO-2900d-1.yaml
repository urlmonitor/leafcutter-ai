notes: |
  The exemption is not a convenience — without it this whole tree gets switched off
  within a week, because most modules in this repository legitimately have no way in
  of their own. Analytical decisions:

  - THE THIRD SCENARIO IS THE ONE THAT MATTERS. Every implementation of an exemption
    starts as a recorded list and drifts into a heuristic: helpers live in a certain
    folder, or are named a certain way, or lack a certain marker, so let them all
    through. The moment that happens the guard stops being a guard — code becomes
    exempt by where someone put it, which is exactly how the stranded functions
    survived review. The name/extension/folder scenario is written to be failed by any
    convention-based shortcut, and it is cheap to test.

  - THE EXEMPTION IS ANNOUNCED, NOT ABSORBED. An exemption that produces no output is
    indistinguishable from a check that did not run. The parent L1's wording — allowed
    "with a stated, visible reason", never "waved through silently" — is carried here
    as an output requirement on the accepted case, not only on the refused case.

  - IT RELEASES A SPECIFIC REFUSAL. The second scenario asserts the consequence
    end-to-end: the exempted unit's criterion becomes eligible to be marked done. Without
    that clause an implementer can satisfy this AC by suppressing a report while the
    done-proof gate keeps refusing, leaving the author with no route through at all.

  BOUNDARY: this AC is the MECHANISM (recorded, reasoned, no implicit pass). Whether
  the accumulated set stays reviewable is BO-2900d-2; how narrowly an exemption applies
  is BO-2900d-3; what an unusable reason is is BO-2900d-1-i. The wording of the refusal
  is BO-2900e.

  Deliberately left to the IT PO: WHERE the exemption is recorded. The criteria
  constrain that it is explicit, attached to a named unit, carries a reason, and is
  visible in the guard's output — not whether it lives beside the code, in the criterion
  record, or in a project-level file. Note that BP-1100b-5 chose an in-source waiver
  comment for its adjacent rule; consistency with that choice is worth considering but is
  not required by this AC, and the two guards must not share one waiver namespace.

  Verification must EXECUTE the guard over all three fixture states. A test that reads
  the guard's source for exemption handling passes on a guard that ignores exemptions
  entirely.

  2026-08-13 — IT PO DECISION 1 OF 2: WHERE AN EXEMPTION IS RECORDED.

  DECISION: a project-level registry file, config/reachability_exemptions.yaml.
  Rejected: an in-source marker comment; an AC field.

  Rationale, in the order the ACs force it:
    1. BO-2900d-2 requires EVERY exemption in force, with its reason and a total, on
       EVERY run including clean ones. With in-source markers that inventory can only
       be produced by scanning the whole repository on every run — expensive, and,
       worse, it means the exemption inventory is derived by text scanning, the one
       method this entire tree forbids everywhere else. A declarative file makes the
       inventory a single read.
    2. BO-2900d-3 requires a STALE exemption (its named item no longer exists) to be
       reported. An in-source marker cannot survive the deletion of the code it sits
       in, so staleness is unrepresentable and that AC becomes vacuous. A central
       registry makes staleness a first-class, detectable state.
    3. BO-2900d-1's third scenario requires that name, extension and folder confer
       nothing. An explicit registry of exact item ids makes convention-based leakage
       structurally impossible rather than merely prohibited.
    4. BO-2900d-5 requires this exemption to be distinguishable from BP-1100b-5's
       in-source `# presence-only:` waiver. Choosing a DIFFERENT MEDIUM makes the two
       vocabularies impossible to confuse at the point of use — a stronger guarantee
       than a paragraph asking readers to keep them apart.
    5. An AC field was rejected because BO-2900b's exemptions cover CAPABILITIES, which
       are not ACs and have no AC record to carry a field; and because BO-2900d-2's
       "seven exemptions across the project" inventory would otherwise require a scan
       of the whole AC store on every run.

  Cost accepted: the registry must be deployed (scripts/build_phases.py) or the hook
  reads an empty set in the deployed layout. That trap is named explicitly in
  it_requirements because it is the known failure mode for this class of change in this
  repository.
