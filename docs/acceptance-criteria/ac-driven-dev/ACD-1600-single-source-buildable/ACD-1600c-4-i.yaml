notes: |
  WHY THE ASYMMETRY. "Neither present nor marked" is a claim that cannot be true of any
  repository state, so it refuses. "Marked to be created but present" is often a stale
  marker or a name collision, but it can also be legitimate mid-build (the file was created
  by the work in progress), so it is reported, not refused. Finished work is exempt from the
  report entirely: the marker records intent at authoring time, and the work fulfilling it
  must not turn every later commit touching the record into noise.

  Q4 ANSWERED (user decision 2026-09-28, specified in ACD-1600c-4-iv): a FINISHED requirement
  that declares an existing file which has since been deleted by other work is never refused
  at commit time; it is listed as "declared existing, now absent (work finished)" in a section
  of the store-wide declared-files report (ACD-1600c-4-ii), and its declared list is left
  unchanged. This record's own criteria are unchanged.

  ==========================================================================
  READ THE ASYMMETRY PARAGRAPH ABOVE WITH THIS CORRECTION (2026-10-12).
  ==========================================================================
  THE LAST SENTENCE OF "WHY THE ASYMMETRY" IS THE SOUND VERSION; THE CLOSING CRITERION IS NOT.
  The paragraph above says the exemption holds because "the marker records intent at authoring
  time, and the work fulfilling it must not turn every later commit touching the record into
  noise". That is correct and it is the reason the exemption is right. The final CRITERION
  gives a different reason -- "because the finished work is what created it" -- and that one is
  FALSE whenever the declared path is shared between records, which is the ordinary case rather
  than the exotic one.

  MEASURED 2026-10-12 across the three paths TQ-600a-13-x declares (post_merge_hold.py,
  post_merge_notice.py, post_merge_tunables.json, all three present in the tree): 15
  `to_be_created` declarations; 3 on the record that created the path; 12 on finished records
  exempted by this record's closing criterion, of which only those same 3 are declarations by
  a creator. So the stated reason is true of 3 of the 12 entries it absolves and false of 9.

  THE BEHAVIOUR IS NOT IN QUESTION AND IS NOT BEING CHANGED. Under the settled meaning of the
  marker -- a BUILD PRECONDITION on the tree at this record's build time, so NOT "my work
  creates it" and NOT merely "this did not exist when I was authored" -- all 15 declarations
  are correct, the exemption is right because a SPENT PRECONDITION has nothing left to check,
  and `test_finished_record_exempt_from_already_exists_report` asserts the right thing. Note
  that THIS RECORD'S REFUSAL BRANCH IS WHAT SETTLES THE SEMANTICS: nothing would block a merge
  over a stale historical note, so `existing` + absent refusing proves the field is a live
  claim about the tree the work will be built against.

  WHAT THE WRONG REASON COSTS, in two places. First COUNTABILITY: it reads as a complete
  account of every exempted entry, so the population is never counted, and because the
  condition is exempted rather than flagged no gate will ever surface it. Second, and this one
  bites on records that are still LIVE: the same wrong frame makes "marked to be created but
  already exists" read as a stale marker when the common cause is a precondition a SIBLING
  SATISFIED EARLY -- so a correct declaration looks like a mistake, and the tidy-ups it invites
  are both harmful. Re-marking to `existing` asserts a precondition the record cannot
  guarantee and arms a blocking refusal keyed on another record's build order. Silencing the
  advisory reaches into the branch that produces this record's refusal, since both outcomes
  come from one comparison.

  WHERE THE CORRECTION LIVES. ACD-1600c-4-v settles the marker's meaning as a build
  precondition, replaces this record's rationale with "the precondition is spent", counts the
  exempted population in the one store-wide declared-files report, and RELABELS the live
  advisory so it names its cause (another record declares this path and is finished, versus no
  record accounts for it -- both derivable from the store with no new field). It is
  `readiness: draft`, pending the user, and it carries one open question: whether the field's
  consumers treat `state` as a build precondition or as a correctness assertion, which this
  author asserts from observable behaviour rather than from source. The general shape -- a
  condition on work, evaluated against a tree that other records' work moves, diverging with
  nobody making a mistake, and exempted rather than flagged once done -- is the fourth entry on
  INF-600b-2's canonical list of true-looking-and-wrong shapes, recorded there as the most
  common member because it needs no error to occur.

  ONE MORE SURFACE, NAMED SO IT IS NOT MISSED: `declared_files` and `to_be_created` appear
  NOWHERE under docs/reference/ (grepped 2026-10-12). The schema SSOT does not document the
  field at all, so this record's criteria sentence is the only published statement of what the
  marker means -- which is how a reader reconstructs the ownership reading. ACD-1600c-4-v
  carries docs/reference/ac-schema.md as a modify target for exactly this reason.
