title: "The production lock overrides an explicit opt-in — lock wins over allow"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: done
criteria: |
  Given a production deployment that has BOTH explicitly opted in to allowing runtime overrides
    AND set the production lock LEAFCUTTER_MOCK_LOCK=real,
  When a request arrives carrying ?mock=1,
  Then the lock takes precedence over the opt-in and the deployment serves real data with the
    live badge — the override is ignored,
  So the resolution order is lock > opt-in-allow > runtime override > env default, and the
    UXP-553-1 production lock remains the absolute guarantee of real data.
