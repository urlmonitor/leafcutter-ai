assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE CLOSE IS INVISIBLE TO THE ANCHOR AND TO THE VERDICT BY CONSTRUCTION. The anchor is
    the head commit of the most recent successful suite run on main; the hold verdict is
    the latest settled suite run's conclusion. A close produces no suite run, so it moves
    neither. The lifecycle and the hold read no close event, close time, `state_reason` or
    timeline entry for any purpose.
  - >-
    WHERE GITHUB READS CLOSING KEYWORDS — VERIFIED (GitHub expert, Q1 and finding 4): the
    nine keywords above, any case, optional colon, `#N` and `OWNER/REPO#N`, in the pull
    request's description OR in a commit message, only for pull requests into the default
    branch; sidebar links close too. In this repository squash commits carry every commit
    message (`COMMIT_MESSAGES`) and merge commits carry the PR title (`PR_TITLE`), so a
    keyword in a title or any commit message probably lands on main and closes the issue
    (UNVERIFIED inference). Under decision A all of these are harmless to the verdict,
    which is the point of this record.
  - >-
    HOW THE ISSUE WAS CLOSED MUST NOT CHANGE THE OUTCOME. Reopening the most recent closed
    notice or creating a new one are both acceptable. If reopening is chosen, `red_since`
    in the state block is the reopen time, not the original `created_at`.
  - >-
    THE WINDOW IS CLOSED (user decision A). The hold during the window between a close
    and the next run is asserted here, because it follows from the run-history verdict
    rather than from a second source; nothing in this family leaves it open any more.
  - >-
    NO NEW CODE PATH IS EXPECTED. This record is satisfied by -iii's lifecycle and -vi's
    verdict as specified; it exists to pin the close routes with tests. If an implementer
    finds they need close-specific logic, that is a sign one of those two reads an issue
    event, which is the defect.
  - >-
    THE TESTS COST UNDER 0.4 s. In-process through the real REST client against the
    shared recording fake server, reusing TQ-600a-13-iii's scratch-repository builder.
    The two close routes are served issue states (closed by a user with `state_reason:
    completed`; closed as completed with a `closed_by` pull-request merge event in the
    served timeline, which the code must never request).
delivers_to: null
expects_from:
  - ac_id: TQ-600a-13-iii
    contract: >-
      The open/update/close lifecycle and the last-green anchor read from the suite's
      run history.
  - ac_id: TQ-600a-13-vi
    contract: >-
      The hold verdict computed from the run history, which this record requires to be
      unaffected by issue state.
test_spec:
  - name: test_tq600a_13_iv_closing_the_notice_does_not_release_the_hold
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_hold.py's verdict entry point, in-process, against the recording fake server serving a red latest run and a notice closed (a) by a user and (b) as completed by a merged pull request"
    must_catch:
      - "the hold reads issue state, so closing the notice by hand releases every held pull request"
      - "a merged `Fixes #N` closes the notice and the next evaluation of an unrelated pull request passes before any green run"
    description: >-
      THIS IS THE DESCRIPTOR THAT CANNOT BE DROPPED. With the latest settled run red and
      the notice closed by either route, an undeclared pull request is held. Serve a green
      latest run with the notice still open: pass — the issue has no effect either way.
  - name: test_tq600a_13_iv_a_closed_notice_reappears_on_the_next_red_run
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py in-process against the recording fake server"
    description: >-
      Close the notice (each route); apply a red run. Exactly one open `post-merge-red`
      issue afterwards — reopened or new.
  - name: test_tq600a_13_iv_the_close_does_not_move_the_commit_anchor
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_notice.py against the fake server and a real scratch git repository"
    must_catch:
      - "the close is recorded as the last green point, so the culprit merged before it is omitted"
      - "the range is anchored at the previous red run"
      - "an existing closed notice is treated as 'already raised this streak' and nothing is created"
      - "a reopened notice reports red-since as the original creation time"
    description: >-
      Green at G, culprit C1, red, notice closed, merge C2, red again. The reappeared
      notice's commit list contains C1 and C2 and its `anchor_sha` is G.
  - name: test_tq600a_13_iv_a_green_run_after_a_close_leaves_it_closed
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py and post_merge_hold.py against the fake server"
    description: >-
      The paired control: close, then a green run. No create and no reopen recorded; the
      hold passes an undeclared pull request.
test_rationale: |
  The automatic close on merge is why this is not a rare edge case: agents write
  "Fixes #N" by habit, and GitHub reads it in commit messages too. Before 2026-10-08 that
  close released every held pull request; the first descriptor now asserts the opposite,
  and is the one that cannot be dropped. The fake server records every request, so a
  descriptor also fails if the hold or the lifecycle requests an issue timeline or event
  endpoint at all.

  Both close routes cost the same in the fake — two served issue states. The anchor
  assertion reuses a real scratch repository. Under 0.4 s.
