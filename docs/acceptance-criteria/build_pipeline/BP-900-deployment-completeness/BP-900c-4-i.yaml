  contract: "The third remediation branch and the state it keys on (the path is already named by a deploy declaration). This AC constrains WHERE that state is read from — the deploy declarations the build ships from, across every declaration shape — and pins it by mutating a declaration and observing the remediation change."
test_spec:
  - name: test_editing_the_deploy_declaration_moves_the_remediation_for_the_same_path
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: seam
    description: "Two runs over the same tree differing only in the declaration: run A, with scripts/knowledge/harvest_learnings.py named by the knowledge-scripts declaration, yields the declaration-already-exists remediation for that path; run B, with that one path removed from the declaration and nothing else changed, yields the add-a-deploy-phase remediation for the same path. The pass condition is that the value MOVED between the two runs — a selector fed by a list maintained beside the declarations passes every single-run assertion and fails only here."
  - name: test_restoring_the_declared_source_emits_no_entry_for_that_path
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "Third run of the same fixture: with the source restored at the declared path and the declaration left naming it, the report contains no entry for that path at all — so the new branch fires only on a genuinely broken reference and cannot manufacture findings for healthy declared paths."
  - name: test_each_declaration_state_is_read_from_build_py_stderr_jsonl_subprocess
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "python scripts/build.py --target-dir <seeded tree>, run as a subprocess once per declaration state"
    description: "Every value compared across the runs is parsed from the JSONL the build wrote to stderr when invoked through its real entry point; comparing return values of the remediation selector across two calls does not satisfy this contract, because the selector can be correct in isolation while the report the build emits is not the one it produced."
  - name: test_mapping_table_declaration_shape_yields_the_same_three_outcomes
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: boundary
    description: "The same declared / declaration-edited / source-restored sequence, repeated against a path declared through a mapping table rather than a file list, produces the same three outcomes — so the predicate is keyed on the path being declared rather than on which declaration shape happens to hold it, and the mapping-table and single-path declarations do not keep the hole the file-list fix closes."
test_rationale: |
  This record is separable from BP-900c-4 by exactly one observation, and the test
  contract has to be built around it. A hard-coded set of the paths that happen to be
  declared today makes every BP-900c-4 assertion pass and is wrong the first time anyone
  edits a deploy declaration. Only a run BEFORE and a run AFTER a declaration edit, with
  the tree otherwise untouched, separates the two implementations — hence the seam entry,
  and hence a pass condition stated as "the value moved" rather than "the value is X".

  reachability is charged for the same reason it is charged on BP-900c-4: the current
  build already emits a well-formed, accurate record for this path, so any assertion that
  a finding exists or that a string appears is green against the broken code. Every
  compared value must come from the report a real build invocation produced.

  boundary is charged for the declaration-shape quantifier. BP-900g-9's sign-off
  enumerated declared-entry deploy loops of at least three shapes; a predicate written
  against the file-list shape that produced the observed defect passes every other clause
  here and leaves the identical hole elsewhere. That is the EPIC-BOPhantomDoneRemediation
  T03 shape — a guard present in one check and absent from its structurally identical
  twin, all tests green — and the second-shape run is the only thing that catches it.
