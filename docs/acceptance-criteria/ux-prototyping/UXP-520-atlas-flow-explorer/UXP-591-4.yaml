assigned_agent: frontend-coder
estimated_complexity: M
change_target:
- code
- ui
risk_surface: internal
it_requirements:
- Drawer open writes ?step=<id> with window.history.replaceState, replacing the current entry and never
  adding one (owner decision 2026-10-09). router.push, router.replace and pushState are not used for drawer
  actions; the explorer does not remount or refetch on one.
- Drawer open, switch and close (UXP-591-4-i, -ii) and keyboard open/close (UXP-617-3-i) call one replace-entry
  function in leafcutter-web/components/flows/flow-history.ts, driven from use-flows-view-state.ts; flow-explorer.tsx
  and flow-drawer.tsx only report the intent.
- Each replace writes the entry's view state {crumbs, filters} under the 'leafcutter:flows-view' key,
  merged into, never overwriting, the App Router's __NA and __PRIVATE_NEXTJS_INTERNALS_TREE keys; not
  sessionStorage.
- 'No drawer path exists on the finder: /flows draws no flow, and no code path rewrites /flows to a step
  address. The owner-ruling-1 branch (bare /flows replaced by the default flow''s step address) and the
  default-entry constant it used are removed.'
- The push/replace decision stays in the pure modules of components/flows/ (flow-view-model.ts, flow-step-view.ts,
  flow-history.ts) so the dataset's FlowNavigation sessions replay against it.
- 'Real-browser proof (history length under the App Router, Back and Forward without a reload) is deferred
  with the Playwright harness (owner decision: not in scope); until then the jsdom vitest tests on window.history
  are the proof.'
delivers_to:
  agent: frontend-coder
  contract: 'Replace-entry path in leafcutter-web/components/flows/flow-history.ts: replaceEntry(url:
    string, state: {crumbs: string[] (Flow ids, entry flow first), filters: {source: ''real'' | ''mock'',
    kind: ''user'' | ''data'' | ''architecture'', realization: ''all'' | ''built'' | ''spec'' | ''mock''}})
    rewrites the current entry with window.history.replaceState, the state under ''leafcutter:flows-view''
    beside the App Router''s keys; history.length never changes. url = flowHref(flowId, stepId | null),
    or, for a filter change, the unchanged current URL. Used by UXP-591-4-i, UXP-591-4-ii, UXP-591-2-ii,
    UXP-591-5-iii, -iv and -v (filter changes, same URL, new filters) and UXP-617-3-i.'
expects_from:
- ac_id: UXP-591-1
  contract: The flow's canonical address /flows/<flow id>, onto which the open drawer's ?step=<id> is
    appended.
- ac_id: UXP-591-2
  contract: A step address reopened in a new tab opens the same drawer through leafcutter-web/app/flows/[...id]/page.tsx.
test_spec:
- name: clicking Plan on /flows/leafcutter/deliver-a-feature opens its drawer and replaces the address
    with ?step=plan at unchanged history length
  target_dir: leafcutter-web/__tests__/uxp-591-4/
  framework: vitest
  type: component
  angle: criterion
  must_catch:
  - the drawer open uses pushState or router.push and history.length grows
  - the drawer opens but the address is not updated
- name: the replaced address reopened through the catch-all route shows the same Plan drawer
  target_dir: leafcutter-web/__tests__/uxp-591-4/
  framework: vitest
  type: integration
  angle: reachability
  surface_invoked: window.location after the click, then the default export of leafcutter-web/app/flows/[...id]/page.tsx
    with that path and query
- name: the finder at /flows renders no flow node or drawer, so no history write turns /flows into a step
    address
  target_dir: leafcutter-web/__tests__/uxp-591-4/
  framework: vitest
  type: component
  angle: boundary
  must_catch:
  - the default-entry replace of owner ruling 1 is still reachable
- name: every open-drawer and close-drawer record in atlas-flows.mock.json replays against the navigation
    modules
  target_dir: leafcutter-web/__tests__/uxp-591-4/
  framework: vitest
  type: unit
  angle: real_artifact
  description: 'Sessions drawer-replace, drawer-in-history, clear-step-notice and keyboard-step-drawer:
    history_op, history_stack, history_index, address_bar and drawer.'
test_rationale: 'jsdom observes window.history directly, so history.length is asserted rather than a mocked
  router call; the reopen test proves the written address works; the dataset replay covers the approved
  v4 sessions. Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx vitest run` (180
  s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks cannot read vitest tests
  yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was. No Playwright:
  the harness is deferred by the owner.'
