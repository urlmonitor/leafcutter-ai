id: BO-3200d-1
title: "A result of 149 kilobytes reaches the step that reads it byte-for-byte identical to what was produced"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a specialist that produces a well-formed result of at least 149 kilobytes, containing
    a distinctive marker part-way through it,
  When that result is handed to the step that reads it,
  Then what that step reads is byte-for-byte identical to what was produced, and it finds the
    marker.

  Given the same result,
  When the step that reads it forms its verdict,
  Then the verdict is the one it reaches from the whole result, and matches the verdict it
    reaches when reading the produced result directly.

  Given a result of a few hundred bytes containing the same marker,
  When it is handed to the step that reads it,
  Then it is read whole and the marker found, so the handover behaves the same way regardless
    of size.
