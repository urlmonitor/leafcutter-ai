title: "The drift hooks find the build manifest where build.py actually writes it"
component: guardrail-engine
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the build writes its manifest to the package root as
    <package>/.build_manifest.json (build_helpers.write_build_manifest),
  And a drift hook (check_output_drift or check_build_drift) is invoked from any
    supported layout — the package checkout, a git worktree of it, or a consumer
    install where the package directory is not named "leafcutter",
  When the hook resolves the manifest in order to compare deployed outputs
    against their recorded hashes,
  Then it locates the manifest that the build actually wrote rather than a path
    derived from a hardcoded package-directory name,
  And when a manifest genuinely cannot be found the hook says so explicitly
    instead of passing silently,
  And the symptom ("the drift gate reports success while never having compared
    anything, because the manifest path it computed does not exist") must not occur.
