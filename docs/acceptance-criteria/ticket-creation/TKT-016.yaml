id: TKT-016
components:
  - ticket_creation_pipeline
  - ac_store
readiness: reviewed
priority: medium
title: "The epic back-reference an AC records is a repo-relative path, on every route that writes one"
component: ticket-creation
status: active
criteria: |
  Given a goal AC whose leaf criteria are assembled into an epic,
    And the assembly is invoked with an absolute inbox directory -- the form this
      repository's own shell convention requires of every path argument,
  When the assembly rewrites each leaf AC's recorded implementation back-reference
    from the loose ticket it first wrote to the epic-folder ticket it moved that
    ticket into,
  Then the recorded back-reference is a path relative to the worktree root,
    And it contains no absolute filesystem prefix and no user's home directory,
    And it names the same file the loose back-reference named before the move,
  And given the assembly cannot establish a worktree root at all,
  When it would otherwise record an absolute path,
  Then it says so rather than recording one silently, because a back-reference that
    resolves only on the machine that wrote it is worse than a missing one: it looks
    like evidence.

  So a criterion's record of what implemented it is portable, and the store does not
  accumulate paths that are dead for every reader except its author.
