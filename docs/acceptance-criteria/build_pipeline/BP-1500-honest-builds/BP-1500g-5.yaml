id: BP-1500g-5
title: "The ownership boundary of an installed project is written down: what the build claims, and what stays the adopter's"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: medium
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a project whose installed tree holds content the package produced and
    content the adopter owns side by side,
  When a reader who has never seen the implementation consults the build's
    reference documentation,
  Then it states, by category rather than by filename, which parts of that tree
    the build claims and rewrites and which parts it never touches,
  And it states what each way of running the build does to each of those
    categories,
  And it names this question apart from the residue question -- what a sweep may
    remove because the package no longer produces it -- so a reader does not take
    a statement about one as an answer about the other,
  And, given any one thing in that tree, that reader can say from the
    documentation alone whether an ordinary build would leave it alone, without
    reading the build's source.
depends_on:
  - BP-1500g
