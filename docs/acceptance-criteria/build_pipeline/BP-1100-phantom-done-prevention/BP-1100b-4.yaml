      exports `ADR_030_INJECTED_GLOBALS` and `SANDBOX_BACK_COMPAT_GLOBALS` as
      the single source of truth, used to BUILD the actual `__sandbox__`
      object literal (via a generated `{SANDBOX_ENTRIES_JS}` template
      placeholder, not a second hand-typed literal) and imported directly by
      `test_harness_exposes_only_the_engine_injected_globals`, which now
      enumerates `Object.getOwnPropertyNames(globalThis)` from inside the
