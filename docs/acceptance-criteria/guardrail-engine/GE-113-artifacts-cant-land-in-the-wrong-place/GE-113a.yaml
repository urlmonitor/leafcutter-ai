id: GE-113a
title: "A misplaced test stops the commit with a fix-it message"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Commit a test outside its configured home and you're stopped, with a pointer to where it belongs.

  When a test file is staged for commit but sits outside the location your
  project configured for tests, the commit is blocked and the message names the
  configuration that decides the correct location, so the fix is obvious instead
  of a guessing game.
