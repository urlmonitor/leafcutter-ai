notes: |
  THE DESTRUCTIVE DEFAULT, stated as a property rather than as a line edit. Line
  2086 substitutes a stop decision when no result is present, so the answer to "no
  answer" is to discard. resolveGate should not return a bare null today, which is
  precisely why this must be specified as an invariant instead of as a patch: the
  present code path is unreachable, the next refactor makes it reachable again, and
  a test written against the line would have been deleted with it.

  THE THIRD CLAUSE KEEPS THE FEATURE. Discarding is a legitimate outcome that a
  person may want. What is being removed is discarding as a fallback, not discarding
  as a choice -- and the attribution requirement is what makes the two
  distinguishable afterwards in the run's own record.

  THE SECOND CLAUSE IS NOT KI-ACD-006. It says only that the run must not attribute
  a stop to a person who never chose it. It says nothing about the status vocabulary
  of a cancelled run, which is out of scope for this tree even though the return
  path at 2091-2094 is the same code an implementer will be reading. Leave the
  return status alone.

  OBSERVE THE FILES, NOT THE RETURN VALUE. "Still present on disk after the process
  has exited" is the assertion. A run that returns a non-destructive result and then
  removes the worktree or resets the branch on the way out satisfies every in-process
  check and still loses the work.

  2026-08-25 (it-po): both expects_from edges have depends_on mirrors already in place.
  The fourth test is the one that gives this record teeth -- without it the invariant is
  only asserted over paths that are reachable today, and the whole point of writing it
  as an invariant is that the destructive default lives on a path that is not.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
