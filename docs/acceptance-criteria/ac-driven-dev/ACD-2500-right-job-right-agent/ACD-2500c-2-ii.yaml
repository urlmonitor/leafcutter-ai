criteria: |
  Given the project's type checker, run with the project's own settings over
    unit_tests/ac_driven_dev/test_design_stage/_design_stage_support.py, reports a
    var-annotated finding at line 101 (a variable whose element type it cannot infer),
  When that variable is given its type,
  Then the type checker reports no finding for that file,
  And every test in unit_tests/ac_driven_dev/test_design_stage/ passes, with the same
    number of tests collected as before the change.
depends_on:
  - ACD-2500c-2
