notes: |
  WHY AGREEMENT IS ITS OWN CRITERION RATHER THAN A CONSEQUENCE. GE-118d and
  KM-KGS-100d-3 can both be satisfied by two independent implementations that
  happen to accept the same shapes on the day they are built. Nothing then holds
  them together: the next shape question is answered twice, and the second answer
  is written by someone who does not know the first exists. At that point the two
  components disagree about what a document MEANS — the guard says a document
  declares two relationships, the map says it declares one — and no test in either
  component can see the disagreement, because each is consistent with itself.

  THE SHAPE OF THE FIX IS NAMED PRECEDENT, NOT INVENTION. ACS-100i-9 is the
  established pattern in this store for anything enforced in two places: one
  shared helper imported by both entry points, one format string so the two
  messages are identical rather than merely similar, and explicitly no second
  copy of the list. GE-126's L0 notes cite it for exactly this purpose. Follow it.

  THE THIRD-SHAPE CLAUSE IS THE ONLY ARM THAT CANNOT BE SATISFIED BY COINCIDENCE.
  Comparing today's two resolvers on today's two shapes passes whenever the two
  copies agree, which they will on the day they are written. Admitting a further
  shape to the shared routine and observing BOTH consumers move is what proves
  there is one routine and not two — the same test shape INF-1200f-1 uses to
  prove a figure is shared rather than duplicated, and the sentence is borrowed
  from it deliberately.

  A DEPLOYMENT HAZARD THE IMPLEMENTER MUST SETTLE, NOT DISCOVER. The two
  consumers do not ship from the same place: the guard runs from the deployed
  layout under .leafcutter/scripts/commit_guardian/, while knowledge_query.py
  runs from scripts/. A shared helper that only one of them can import is the
  ModuleNotFoundError this L0 exists for, and CLAUDE.md's standing rule applies —
  a module a hook imports must be in the build deploy manifest, verified by
  running the DEPLOYED hook, not by the unit tests, which import from the source
  tree and are structurally blind to the gap. GE-118c was reopened for precisely
  this class (config/doc_types.json missing from the manifest); do not repeat it.

  NOT A LICENCE TO UNIFY THE THIRD CONSUMER.
  check_adr_cross_reference._doc_mentions_adr reads related_docs by substring
  match over the whole file and never indexes into an element. It is unaffected
  today and must stay unaffected — routing it through the resolver would change
  its behaviour for no gain and put a third opinion into a contract this record
  exists to reduce to one.
