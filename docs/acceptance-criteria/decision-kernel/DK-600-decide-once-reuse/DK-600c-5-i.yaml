it_requirements:
  - Documentation states only behaviour that a test proves on main; where the code and an existing
    doc disagree, the doc is corrected, never the other way round.
  - 'Reference genre. The field list matches config/decision_record.schema.json (generated from
    kernel.memory.models) in both directions: every schema property, recursively, is named, and every
    named field is a schema property. There is no executable test (test_required false): the author
    checks both directions with a scratch script outside the repository and names the command and its
    result in its sign-off comment. documentation-verifier confirms only that the reference changed on
    the branch and holds no placeholders; it does not re-run the check, so the sign-off record is the
    evidence. Nothing re-checks the pair after this ticket, so a later schema change can leave the
    reference behind (accepted with test_required false, user decision 2026-10-10).'
  - The 'What a record holds' table in file-and-reuse-decisions-with-the-kernel.md becomes a link
    to the reference, not a second copy.
  - 'Target file (fixed 2026-10-10 by business-analyst for tickets/00_inbox/TICKET-20261010-DecisionLifecycleDocs.md): docs/reference/decision-record.md (the doc_links entry marked planned).'
