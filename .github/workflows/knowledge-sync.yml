name: Knowledge projection sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact canonical commit SHA to replay (40 lowercase hex characters)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: vars.KNOWLEDGE_SYNC_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: knowledge-canonical-${{ github.repository }}
      cancel-in-progress: false
    env:
      SOURCE_REVISION: ${{ github.event.inputs.revision || github.sha }}
      KNOWLEDGE_REPOSITORY_ID: ${{ vars.KNOWLEDGE_REPOSITORY_ID || 'leafcutter' }}
      LEAFCUTTER_NEO4J_URI: ${{ secrets.LEAFCUTTER_NEO4J_URI }}
      LEAFCUTTER_NEO4J_WRITER_USERNAME: ${{ secrets.LEAFCUTTER_NEO4J_WRITER_USERNAME }}
      LEAFCUTTER_NEO4J_WRITER_PASSWORD: ${{ secrets.LEAFCUTTER_NEO4J_WRITER_PASSWORD }}
      # Instance-specific and required: no fallback. An unset value fails the job by name
      # before any connection is attempted.
      LEAFCUTTER_NEO4J_DATABASE: ${{ vars.LEAFCUTTER_NEO4J_DATABASE }}
      # Declared retention bound: the 3 newest generations are kept; anything older is
      # reclaimed only once it is also 7200 s (2 h) old. 7200 s is above the 3600 s
      # continuation lifetime (knowledge.cursors.CONTINUATION_LIFETIME_SECONDS), so no
      # continuation can still be live on a reclaimed generation. At ~2 merges/hour this
      # keeps roughly 7-8 generations (~200k relationships), under the Aura Free 400k cap.
      KNOWLEDGE_RETENTION_MAX_GENERATIONS: '3'
      KNOWLEDGE_RETENTION_MIN_AGE_SECONDS: '7200'
      # Declared capacity ceiling (Aura Free: 200,000 nodes / 400,000 relationships per database).
      # The backend does not report its ceiling over Bolt, so it is declared here. Publication is
      # refused before any write when measured usage plus the snapshot exceeds 90 percent of the
      # ceiling on either axis, and warns above 75 percent.
      KNOWLEDGE_CAPACITY_MAX_NODES: '200000'
      KNOWLEDGE_CAPACITY_MAX_RELATIONSHIPS: '400000'
      KNOWLEDGE_CAPACITY_REFUSE_PERCENT: '90'
      KNOWLEDGE_CAPACITY_WARN_PERCENT: '75'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report resolved backend configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          # Secret VALUES are never printed. Presence, lengths and the non-secret
          # database name and host are, because a run that cannot say which
          # database it addressed cannot be diagnosed from its logs -- 61
          # consecutive failures said only "backend unavailable".
          def presence(name):
              value = os.environ.get(name)
              if value is None:
                  return 'UNSET'
              if not value.strip():
                  return 'SET-BUT-EMPTY (counts as absent)'
              return f'set ({len(value)} chars)'

          uri = os.environ.get('LEAFCUTTER_NEO4J_URI', '')
          host = urlsplit(uri).hostname or '(unparseable)'
          database = os.environ.get('LEAFCUTTER_NEO4J_DATABASE', '')

          print('--- knowledge-sync resolved configuration ---')
          print(f'  database name     : {database or "(empty)"}')
          print(f'    from            : vars.LEAFCUTTER_NEO4J_DATABASE (required, no fallback)')
          print(f'  host              : {host}')
          print(f'  scheme            : {urlsplit(uri).scheme or "(none)"}')
          print(f'  repository_id     : {os.environ.get("KNOWLEDGE_REPOSITORY_ID", "")}')
          print(f'  source revision   : {os.environ.get("SOURCE_REVISION", "")}')
          print(f'  retention bound   : keep {os.environ.get("KNOWLEDGE_RETENTION_MAX_GENERATIONS", "")} newest generations;')
          print(f'                      reclaim older ones only after {os.environ.get("KNOWLEDGE_RETENTION_MIN_AGE_SECONDS", "")} s')
          print(f'  capacity ceiling  : {os.environ.get("KNOWLEDGE_CAPACITY_MAX_NODES", "")} nodes, {os.environ.get("KNOWLEDGE_CAPACITY_MAX_RELATIONSHIPS", "")} relationships;')
          print(f'                      refuse above {os.environ.get("KNOWLEDGE_CAPACITY_REFUSE_PERCENT", "")} %, warn above {os.environ.get("KNOWLEDGE_CAPACITY_WARN_PERCENT", "")} %')
          print('  secret presence (values never printed):')
          for name in ('LEAFCUTTER_NEO4J_URI',
                       'LEAFCUTTER_NEO4J_WRITER_USERNAME',
                       'LEAFCUTTER_NEO4J_WRITER_PASSWORD'):
              print(f'    {name:<34} {presence(name)}')
          if database and host and not host.startswith(f'{database}.'):
              print('  NOTE: the database name is not the leading label of the host.')
              print('        Aura names a database after its instance, so these normally match.')
              print('        A mismatch is the usual cause of Neo.ClientError.Database.DatabaseNotFound.')
          print('---------------------------------------------')
          PY
      - name: Validate configured writer and immutable canonical revision
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          names = ('LEAFCUTTER_NEO4J_URI', 'LEAFCUTTER_NEO4J_DATABASE', 'LEAFCUTTER_NEO4J_WRITER_USERNAME', 'LEAFCUTTER_NEO4J_WRITER_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Knowledge sync writer configuration missing: ' + ', '.join(missing))
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_REVISION']):
              raise SystemExit('Replay requires an exact 40-character commit SHA')
          PY
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
      - name: Install standalone writer dependencies
        run: python -m pip install -r knowledge/requirements-neo4j.txt 'pydantic>=2,<3'
      - name: Validate and publish canonical snapshot
        shell: bash
        run: |
          python -m knowledge validate --root "$GITHUB_WORKSPACE" --repository-id "$KNOWLEDGE_REPOSITORY_ID" --revision "$SOURCE_REVISION"
          python -m knowledge sync --root "$GITHUB_WORKSPACE" --repository-id "$KNOWLEDGE_REPOSITORY_ID" --revision "$SOURCE_REVISION" --retention-max-generations "$KNOWLEDGE_RETENTION_MAX_GENERATIONS" --retention-min-age-seconds "$KNOWLEDGE_RETENTION_MIN_AGE_SECONDS" --capacity-max-nodes "$KNOWLEDGE_CAPACITY_MAX_NODES" --capacity-max-relationships "$KNOWLEDGE_CAPACITY_MAX_RELATIONSHIPS" --capacity-refuse-percent "$KNOWLEDGE_CAPACITY_REFUSE_PERCENT" --capacity-warn-percent "$KNOWLEDGE_CAPACITY_WARN_PERCENT"
          python -m knowledge status --root "$GITHUB_WORKSPACE" --repository-id "$KNOWLEDGE_REPOSITORY_ID" --revision "$SOURCE_REVISION" --retention-max-generations "$KNOWLEDGE_RETENTION_MAX_GENERATIONS" --retention-min-age-seconds "$KNOWLEDGE_RETENTION_MIN_AGE_SECONDS" --capacity-max-nodes "$KNOWLEDGE_CAPACITY_MAX_NODES" --capacity-max-relationships "$KNOWLEDGE_CAPACITY_MAX_RELATIONSHIPS" --capacity-refuse-percent "$KNOWLEDGE_CAPACITY_REFUSE_PERCENT" --capacity-warn-percent "$KNOWLEDGE_CAPACITY_WARN_PERCENT"
