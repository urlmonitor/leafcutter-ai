  path joined to it misses and the hook passes everything. Expected fallout when it starts
  working: docs/architecture/diagrams/c2-001 ... c2-006 declare `parent:
  agent_delivery_workflows.md` (GE-113c-4-i fixes them), and the two c2-fast-* diagrams use
