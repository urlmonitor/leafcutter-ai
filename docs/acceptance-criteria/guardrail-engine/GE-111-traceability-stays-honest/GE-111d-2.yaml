it_requirements:
  - "DURABLE RECORD MECHANISM (IT-PO resolution of open question #2): store the confirmation as a STRUCTURED amended_by entry on the AC YAML. The schema (config/ac_store_schema.json) already allows object items in amended_by, and ACS-400 governance (check_ac_governance.py) lists amended_by as an implementation-agent-writable field — so this collides with NO write-lock. Do NOT introduce a new top-level AC field."
  - "Confirmation entry shape: { reason: 'ge111-confirm', entry: '<the implemented_by value being confirmed>', source_fingerprint: '<sha256 hex of the confirmed source>', confirmed_at: '<ISO-8601>', confirmed_by: '<git user.name/email or agent id>' }. The 'entry' key makes the confirmation PER-LINK (keyed to one implemented_by entry), so confirming one link never masks drift in a sibling link."
  - "VERSION-AWARENESS (the re-flag mechanism): source_fingerprint is the sha256 of the confirmed source content read from the STAGED blob — at file tier, the whole staged file blob; at symbol tier, the source span of the named symbol (e.g. ast.get_source_segment of the symbol node). A confirmation clears AC-X for an entry iff its stored source_fingerprint EQUALS the freshly recomputed fingerprint of that entry's current staged source. When the source later changes (V1 -> V2), the recomputed fingerprint differs, the stored confirmation no longer matches, and AC-X re-flags (criteria scenario 2). No expiry/TTL — staleness is content-driven, not time-driven."
  - "Fingerprint must be computed the SAME way at confirm-time (when written) and at check-time (when matched) — mandate ONE shared pure helper for fingerprinting (file-blob vs symbol-span) used by both the write path and the verify path, so the two never drift (recurring leafcutter pattern: shared deterministic derivation must be one helper)."
  - "A confirmation only suppresses the SYMBOL-tier 'moved/renamed' drift for a SURVIVING file. It must NOT be able to clear a file-path-floor 'deleted' verdict (you cannot confirm code still satisfies an AC when the file is gone) — confirm is meaningless against a vanished file and must be rejected/ignored in that case."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4); reading/parsing amended_by and computing the fingerprint must wrap I/O and fail open (treat as no-confirmation => normal drift handling) on unexpected error."
  - "The deployed hook and packaged template source must round-trip in parity via build.py (ADR-001) if any config (e.g. the reason token) is added to commit_guardian.json."
