it_requirements:
  - "A host-resource-aware scheduler MUST decide keep/pause/start from live host-resource signals (e.g. RAM/CPU) rather than a fixed feature-count cap, mirroring upstream Claude Code supervisor behaviour (ADR-018 Decision §3, Migration §6)."
  - "Under memory pressure the scheduler MUST shed idle drives (drives doing no active work) and MUST prefer active, progressing drives over idle ones."
  - "Resource-signal probing and process control (pause/stop) MUST handle errors per the project error handling policy."
  - "The scheduler MUST live on a portable package surface (scripts/ or templates/scripts/) deployed by build.py."
