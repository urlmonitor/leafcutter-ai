criteria: |
  Given a developer's commit was blocked for a missing or invalid declaration
  When the developer opens the how-to guide for clearing the block
  Then the guide describes the guided autofix route and how to invoke it to add the
    correct component or AC declaration
  And the guide explains that the autofix prompts rather than guessing when the
    component or AC cannot be inferred unambiguously
  And the guide describes the deliberate per-item opt-out route, showing that it
    requires a stated reason and stays visible in the diff
  And the guide states that a reason-less opt-out and a global silent disable are
    not accepted
