criteria: |
  Given a person has asked to clear a workspace and been refused,
  When they open the how-to guide for clearing a workspace,
  Then it shows that a refusal naming a running program means nothing was
    deleted, and that leaving or stopping that program and asking again clears it,
  And it shows that asking again for a half-cleared workspace finishes it, what a
    refusal listing its remaining files means, and how to authorise their loss,
  And it shows that a workspace off its line of work is cleared or refused like
    any other, and how to deliver a commit the refusal names as unsent,
  And it gives no manual deletion steps that bypass the workspace maker,
  And the reference listing the maker's answer codes and fields describes each
    new refusal by its code and by the fields it carries: a program working
    inside the workspace, the program check being unavailable, a half-cleared
    workspace with its listed remaining files, and a workspace off its line of
    work.
