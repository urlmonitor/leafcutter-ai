package_surface: false
it_requirements:
- 'The cut-over is reachable through the same door: a maker verb (e.g. `worktree.py migrate-legacy`) rather
  than a second script; if a separate script is chosen it must be a named deploy-manifest entry. It is
  the ONLY place allowed to run `git worktree` commands, and only against legacy entries.'
- 'Per legacy workspace, the BO-4100c-1 holds-work verdict decides: nothing unsent -> remove its folder
  and its registration; unsent work -> bring over as a marker-bearing clone ONLY when provably lossless
  (every commit sha present on the new line, uncommitted and untracked content byte-identical), otherwise
  leave untouched and list for a human decision (Q10: never retired while it holds unsent work).'
- Stuck registration entries made from another platform (the WSL 'locked initializing' admin entries)
  are removed individually; nothing else is touched by their removal.
- Offers a no-change preview of what it would do; its report is one JSON object listing retired, brought_over
  and needs_decision entries.
- The maker never reads stdin and never prompts; every decision it needs arrives as an argument of the
  request, so an unattended caller can never stall on it.
- 'Must handle errors per the project error handling policy: a condition the maker cannot classify is
  an error answer (code INTERNAL_ERROR) whose message names it -- never an ok answer, and never a traceback
  on stdout.'
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
  build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
  minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
  must mutate the package and build its own copy says so and justifies it in its ticket.'
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_legacy_workspace_with_nothing_unsent_is_retired_folder_and_registration
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Each such legacy worktree's folder and .git/worktrees entry are gone.
- name: test_legacy_workspace_with_unsent_work_is_brought_over_intact_or_listed
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: Each such worktree is either a marker-bearing clone containing every original commit sha
    and identical uncommitted content, or untouched and listed in needs_decision.
- name: test_unfinished_foreign_platform_entries_are_removed_and_nothing_else_changes
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: The two stuck admin entries are gone; all other refs, worktrees and config are identical.
- name: test_old_style_register_lists_only_workspaces_left_for_decision
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: git worktree list afterwards lists only the needs_decision entries (plus the main checkout).
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
