notes: |
  THIS IS THE CORE DEFECT AND IT IS SPECIFIED NOWHERE ELSE IN BO-2900. The
  repository instructs authors, in 164 ticket files, to prove their work by
  driving the production entry point as a separate program, and explicitly forbids
  satisfying the requirement by importing the function directly. The observation
  behind the required rule watches only the process it runs in. So the mandated
  shape is invisible and the forbidden shape is the only one that can be seen.

  THE TWO MEASURED FAILURE MODES ARE OPPOSITE, which is why one record has to
  cover both. A proof that ONLY launches the unit imports nothing local, so no way
  in is found and the criterion passes with nothing having judged it — a
  phantom-done vector, handed to a sibling rule that fires for none of the store. A
  proof that BOTH imports and launches is refused and told it reached the code by
  direct import, when it ran the real command surface. An implementer who fixes
  only one half moves the population between the two rather than judging it.

  WHY TEST B IS NOT OPTIONAL. The cheap version of this AC reads what command the
  proof launched and accepts a successful finish. Test B passes that version and is
  a real defect: the program was launched, the way in was entered, and the code
  under proof was never reached. The measured prototype refuses it, so this is a
  demonstrated requirement rather than a hypothetical one.

  TWO NAMED SHIP BLOCKERS the implementer will hit, recorded here so they are not
  rediscovered. A launched program that installs an observation of its own
  displaces the one watching it, and the resulting record reads as "nothing was
  reached" rather than "the run was not watched" — that is a refusal manufactured
  out of a blind spot, and BO-2900a-2-ii is where its correct handling is
  specified. Second, whatever mechanism carries the observation into a launched
  program must tolerate already being present: a naive arrangement recursed 245
  times in the prototype.

  ONE PRACTICAL TRAP FROM THE PROTOTYPE, because it produces a false negative that
  looks like a correct one: a test that hands the launched program a wholly
  replaced environment drops whatever the observation travelled in, and the proof
  then reads as not reaching the code. The environment a test supplies must be
  merged with what the observation needs, not replace it.

  ALSO MATCH ON THE PROGRAM'S FILE, NOT THE NAME IT REPORTS FOR ITSELF. A script
  launched directly as a program reports itself under a generic name, so a
  mechanism keyed on the name a running program gives itself never matches the
  unit it is watching for. The prototype matched on the file instead.

  BOUNDARY. This AC governs WHAT the observation must span. What happens when it
  cannot span it is BO-2900a-2-ii. What question it is asked is BO-2900a-2-iii.
  What the answer is used for is BO-2900a-1. Do not restate any of those here, and
  do not let this AC's process-tree widening become an excuse to relax the
  parent's decoy-immunity or per-test attribution constraints — both are inherited
  in full, and the per-test clause above is restated only because a tree of
  programs makes it newly easy to lose.

  VERIFICATION MUST EXECUTE ALL THREE PROOFS. A judgement over hand-fed records
  proves the arithmetic and not the observation, and the observation is the entire
  content of this AC. The three cases belong in one exercise: S alone passes a
  mechanism that answers "reached" for everything, and B alone passes one that
  answers "not reached" for everything.
