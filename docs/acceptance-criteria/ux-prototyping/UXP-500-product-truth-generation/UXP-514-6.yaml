test_required: true
test_rationale: |
  This is the one check in the family with a live, reproducible failure in the real store, so
  the assertion can and should be made against a fixture built from the real shape rather than a
  minimal one. The every-copied-field clause needs a varying assertion: an implementation that
  compares only the description would satisfy the first clause forever and miss the next copied
  field somebody adds.
test_spec:
  - name: test_index_description_differing_from_the_source_is_reported_with_both_values
    target_dir: unit_tests/product_truth/
    description: "An index entry whose description differs from the journey's own produces a finding naming the artifact, the field and both texts."
    type: integration
    angle: failure
    framework: unittest
  - name: test_every_copied_scalar_field_is_compared_not_only_the_description
    target_dir: unit_tests/product_truth/
    description: "Altering any copied scalar field in the index, not just the description, produces a finding."
    type: integration
    angle: seam
    framework: unittest
  - name: test_matching_copied_fields_produce_no_finding
    target_dir: unit_tests/product_truth/
    description: "An index whose copied fields all equal their sources produces no finding."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  THE GAP D3 LEAVES. Measured 2026-09-07: all 14 of 14 journeys carry an index description
  differing from the journey file's own. Index copies run 89-218 characters; source descriptions
  run 365-938. Examples: how-acs-are-built 197 vs 938; author-product-truth 218 vs 731;
  checkout-and-pay 203 vs 748. UXP-514's D3 checks by_component / by_entity / by_flow / by_ac -
  the DERIVED LOOKUPS - and does not look at artifacts[] scalar fields at all, so nothing in the
  store covers this today.

  PLACEMENT RATIONALE. This surface is listed on UXP-700c as drift sub-surface 4, and it is
  authored HERE instead, under UXP-590 by way of UXP-514. Reason: the L0's own notes draw the
  line as UXP-590 = the record agreeing with ITSELF, UXP-700c = the record agreeing with THE
  CODE. An index description disagreeing with the journey file it was copied from is the record
  disagreeing with itself, so it is UXP-590's axis, not UXP-700c's. The growth that CAUSED the
  duplication is UXP-700e's and is recorded as UXP-700e-2; that AC removes the second copy,
  while this one guards it in the meantime. Both are wanted and neither supersedes the other.

  EXPECT THIS TO FAIL ON FIRST RUN against the live store, on all 14 journeys. That is correct
  and is the point; the remediation is UXP-700e-2, not a suppression.
