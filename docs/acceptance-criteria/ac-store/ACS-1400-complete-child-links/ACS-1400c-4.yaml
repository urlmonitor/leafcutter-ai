notes: |
  A DECISION GATE EXPRESSED AS A BEHAVIOUR, WHICH IS THE ONLY WAY IT SURVIVES
  INTO A BUILD. "Somebody should decide this first" in a note is not enforceable.
  Requiring the pass to abstain while the reference is silent, and to name the
  convention it applied once the reference speaks, makes the ordering a property
  of the tool.

  THE MEASURED POPULATION, RE-VERIFIED 2026-09-08, AND IT IS TWO DISTINCT SHAPES
  THAT THE L0 GROUPS TOGETHER. Shape one: a retired parent with active children —
  BO-100d-1 and BO-100d-2 are retired (superseded, oddly, by their own children)
  and carry three active children between them, and BP-100b is retired and carries
  eleven. Shape two: an active parent with retired children — TKT-100 is active
  and omits TKT-100a and TKT-100f, both retired, while listing the seven
  successors that replaced them. The two shapes may well warrant opposite answers,
  and a convention written for only one of them will be applied to both.

  TKT-100 IS THE CASE THAT SHOULD DECIDE THE ARGUMENT, AND IT ARGUES AGAINST
  REPAIR. Its omission reads as deliberate and arguably correct: "repairing" it
  would add two retired records back into an active parent's child list, which
  makes the parent's own finished-state harder to reason about rather than easier.
  A pass that treats every gap as drift gets this exactly backwards. That is the
  concrete reason this record exists rather than being folded into ACS-1400c-1.

  BP-100b SITS IN TWO POPULATIONS AT ONCE and is the reason the dispositions must
  be evaluated in a defined order rather than independently. It is retired AND its
  coverage list resolves to nothing, so both this AC and ACS-1400c-2 have a claim
  on its eleven children. Whichever abstention is reported, the record must appear
  exactly once with exactly one stated disposition — ACS-1400c-1 requires that,
  and this pairing is the case that will test it.

  THE DECISION ITSELF IS NOT TAKEN HERE. This AC is deliberately silent on what
  the convention should be; that is BrainCandy's call, and pre-empting it in a
  criterion would be the BA making a product decision in passing.
