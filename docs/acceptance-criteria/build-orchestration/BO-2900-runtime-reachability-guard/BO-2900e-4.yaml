notes: |
  Satisfies the parent L1's `documentation_triggers: [how-to]`.

  Intended agent is `documentation-expert` — left null per this run's instruction.

  A TABLE, NOT A FOURTH GUIDE — and the last clause makes that assertable. This tree
  already produces three procedural guides (BO-2900a-4, BO-2900b-4, BO-2900d-4). A
  fourth page re-explaining the same procedures from the message's point of view would
  be the copy that goes stale, and it would go stale invisibly, because the reader who
  needs it arrives from a refusal and never sees the original. What is genuinely missing
  is the index: refusal in hand, which of the three do I want. That is one table.

  REACHABLE FROM THE OUTPUT is the clause that decides whether this documentation is
  used at all. A reader who has been refused has a terminal window, not a documentation
  index. If the refusal does not carry a way to the table, the table serves only people
  who already know it exists — who are not the people who need it.

  THE EXEMPTION ROW IS THE ONE PEOPLE GET WRONG, which is why the table must say
  explicitly which refusals the exemption releases and which it does not. Left to
  inference, the exemption becomes the universal answer to every row (see BO-2900d-4's
  containment fence).

  PLACEMENT is left open: extending `docs/how-to/done-proof-enforcement.md` keeps it
  beside the gate a reader most often meets first, but the table spans more than the
  done-proof gate. The writer should choose one home and link the other guides to it —
  what this AC forbids is two homes.

  2026-08-13 (IT PO enrichment). Placement is now FIXED at
  docs/how-to/done-proof-enforcement.md rather than left open, so BO-2900e-1's emitted
  pointer has a stable target to be wired to. Leaving the home open would have made the
  reachable-from-the-output clause depend on the writer and the coder independently
  guessing the same destination.
