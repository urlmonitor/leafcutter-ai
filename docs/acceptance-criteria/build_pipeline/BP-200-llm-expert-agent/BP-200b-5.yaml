criteria: |
  Given the file docs/agents/llm-expert/PROJECT_CONTEXT.md exists,
  When Section 5 (Nesting / Spawn-Allowlist Rules) is read,
  Then it states the hard depth limit is depth 3 with a table showing:
    - Depth 0: user's direct session
    - Depth 1: first-level sub-agents (e.g. ticket-supervisor)
    - Depth 2: second-level sub-agents
    - Depth 3: third-level sub-agents (hard floor, must not spawn further)
  And it states that llm-expert runs at depth 1 (spawned by ticket-supervisor)
  And it documents the spawn_allowlist contract: agents invoking the Agent tool
    must declare which agents they may spawn
  And it documents the spawned_by contract: agents list which agents may spawn them
  And it states the llm-expert agent's spawn_allowlist is empty by default
