assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - 'This L2 is a roll-up: its production changes are made by its five children (BO-2500a-8-i
    to -v). Its own outcome is the last clause, agreement between the authoring check and
    the done gate, which holds only if both call the one shared reason-present predicate in
    scripts/ac_store/_done_proof_phase_helpers.py, never a second copy.'
  - 'Build order: BO-2500a-8-i first (it defines the refusal and creates templates/scripts/commit_guardian/_ac_test_rationale_validators.py);
    then -v in the same file, so -i and -v run one after the other in one lane; -ii and -iii
    in parallel after -i; -iv last (each backfilled record must pass -i''s and -v''s checks
    when it is committed).'
  - ADR-076 section 1.2 (templated reasons MUST be rejected) is now enforced mechanically
    for identical text only (BO-2500a-8-v). Near-duplicates and change_target-filled templates
    that differ in a word are policed by the planner's instructions (-ii) and by the user's
    batch approval (-iv).
test_required: true
test_intent:
  - clause: the declaration carries a reason written for that record from the moment it is
      authored, and a declaration without one is refused by the commit-time record check when
      the record is added or changed (BO-2500a-8-i)
    needs_test: false
    reason: Proven by BO-2500a-8-i's own tests of the commit-time refusal; this roll-up adds
      no behaviour here.
  - clause: the technical planner's instructions produce the declaration and its reason together
      (BO-2500a-8-ii)
    needs_test: false
    reason: Proven by BO-2500a-8-ii's with-and-without prompt comparison.
  - clause: a reference page for test-free declarations explains the declaration and states
      the reason field's two meanings apart, linking to the single exemption rulebook, and
      the guides a person reads point to that page (BO-2500a-8-iii)
    needs_test: false
    reason: A documentation outcome, verified as BO-2500a-8-iii's rationale states.
  - clause: every unfinished record already declared test-free without a reason gets a reason
      written for it and approved by the user, or is listed for the user's decision (BO-2500a-8-iv)
    needs_test: false
    reason: A one-time data backfill, verified by the user's batch approvals as BO-2500a-8-iv's
      rationale states.
  - clause: a reason identical, after normalising, to another record's reason is refused,
      so one reason cannot be copied across records (BO-2500a-8-v)
    needs_test: false
    reason: Proven by BO-2500a-8-v's own tests of the duplicate-reason refusal.
  - clause: for any record, the authoring side and the done gate (BO-2500a-1-ii) agree on
      whether its declaration is complete, so a record the authoring side accepts is never
      refused at done because its reason is missing
    needs_test: true
    reason: 'Agreement across the two layers is this parent''s own outcome: one boundary set
      of records run through check-ac-schema and through check_done_proof.py must get matching
      answers, which no single child''s test observes.'
