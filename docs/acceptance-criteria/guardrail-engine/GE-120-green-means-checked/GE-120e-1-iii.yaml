notes: |
  Found by a read-only review on origin/main 1b4a4b859 (2026-11-17). Test D replaced the real
  templates/scripts/commit_guardian/_authored_change.py with a stub that always raises and put
  the original back in a finally block. A SIGKILL, an OOM kill or a crashed pytest-xdist worker
  skips the finally block, leaving the real hook broken in the working tree, and under local
  pytest -n about 40 other test files run hooks from that directory and could load the stub
  while it was in place. CI runs without -n, so it was a local flake and a tree-corruption risk
  rather than a CI failure.

  PLACEMENT. An L3 constraint on GE-120e-1 because it constrains how GE-120e-1's own seam test
  proves its last clause; it adds no new behaviour to the checks.
