id: KM-400e-5
title: "Merged changes synchronize through an observable standalone operation"
component: knowledge-management
components: [knowledge_management]
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: in_progress
parent: KM-400e
criteria: |
  Given a configured canonical branch and a successful merge producing commit B
  When its synchronization job executes
  Then B's immutable source is validated and published independently of kernel execution
  And graph and semantic readiness are reported separately with published SHA and lag
  And repeated, missed or out-of-order merge events follow the same publication guarantees
  And retrieval observations retain request, decision, repository, generation and evidence correlation through the existing telemetry owner
  And operational instructions demonstrate setup, backend-off startup, rebuild, rollback, reclamation of generations outside the declared retention bound, and failure recovery without logging credentials
  And every generation outside the declared retention bound is reclaimed as part of the same successful publication, subject to unexpired pinned continuations
  And the job's result reports how many generations it reclaimed and how many it retained
  And every required backend setting is declared rather than substituted, so an unset one ends the job with a failure naming it
depends_on: [KM-400e]
