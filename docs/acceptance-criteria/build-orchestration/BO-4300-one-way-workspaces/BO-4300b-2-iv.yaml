  ac_id: BO-4300b-2-iii
  contract: The package folder inside the workspace, found from the workspace itself.
package_surface: false
it_requirements:
- 'The declaration is the install-config key workspace_install_command: a list of strings (argv, never a
  shell string), read from the config file the maker already derives for the workspace. Placeholders
  {python}, {workspace}, {config_path} and {package_dir} are replaced word by word; the command runs with
  the workspace as its working directory, with the same log-root flag handling as the default build.'
- An absent key, or an empty list, means the default build (BO-4300b-2-iii). Any other non-list or
  non-string value is BOOTSTRAP_FAILED naming workspace_install_command; {package_dir} with no package
  found is BOOTSTRAP_FAILED naming it.
- The key is documented in config/skills_config.schema.json and docs/reference/skills-config-fields.md.
- Proof runs the DEPLOYED maker as a separate process against real temporary git repositories with real
  bare hubs; the declared command is a fixture wrapper that runs the package's stub build, never the
  package's own scripts/build.py.
test_required: true
test_spec:
- name: test_declared_install_command_builds_the_workspace
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Shop declares a wrapper; ensure answers ok and both the package build's marker and the
    wrapper's own marker are present in the workspace.
- name: test_failing_declared_command_is_bootstrap_failed_quoting_it
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: A declared wrapper that exits 1 gives BOOTSTRAP_FAILED, no workspace_path, and the excerpt
    quotes the wrapper's own stderr.
- name: test_malformed_declaration_is_bootstrap_failed_naming_the_key
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: A string instead of a list gives BOOTSTRAP_FAILED whose excerpt names workspace_install_command.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer and the files the declared command left in the workspace.
