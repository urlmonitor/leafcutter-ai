    framework: pytest
    type: integration
    angle: boundary
    description: "review_date equals the approval file's answered_at; an inspection date key equal to it holds, one that differs is refused with a message naming both dates; no date key is also fine."
    proves_clause: "the review date is the time the answer was given as the approval file records it, and a date written into the inspection that differs from it is refused, naming both"
    code_file: scripts/ac_store/_inspection_approval.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_3_i_non_approve_answer_or_other_record_is_refused_as_unreviewed
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: failure
    description: "An approval file with answer 'reject', and one written for a different record, are each refused with a message saying the record is unreviewed."
    proves_clause: "an answer other than \"approve\", or an approval file for a different record, does not count and marking done is refused as unreviewed"
    code_file: scripts/ac_store/_inspection_approval.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_3_i_missing_unreadable_or_mismatching_file_fails_closed_naming_the_run_id
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
