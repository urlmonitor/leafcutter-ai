notes: |
  WHY THIS IS ITS OWN RECORD. "The produced document is accepted" is satisfied on any
  single run by a producer that handles one kind of picture well and the rest badly, and
  that is the shape a producer naturally grows: the first kind is built against the checks,
  the rest are copied from it. The three kinds that oblige a further field and the one
  that is a superseded alias are each capable of failing while the demonstrated kind
  passes. Without this record the tree's central promise is established on a sample.

  FALSIFIABILITY. Enumerate the kinds from the project's declaration — not from a list
  written into the observation — produce a document for each at each tier it can occupy,
  and run the full check set over every one of them. The record is falsified by any single
  document failing any single check, and equally by an observation whose enumeration is
  hard-written: add a kind to the declaration and change nothing else, and the coverage
  must grow by itself. That second arm is the one with teeth. A hard-written list is
  correct on the day it is written, survives review, and stops discriminating the moment
  the vocabulary moves — and this vocabulary has already moved once, which is how it came
  to contain a superseded alias.

  THE THIRD CLAUSE IS THE BOUNDARY, RESTATED WHERE IT CAN BE SEEN. Three declared kinds
  oblige a field whose value is content the author has and the producer cannot derive. The
  resolution taken across this tree is refusal, not a placeholder — see INF-1300a-3 for why
  a placeholder is actively harmful here and INF-1300d-4 for the refusal's own contract.
  Stating it in this record's criteria as well is deliberate: this is the record that walks
  the whole vocabulary, so it is the one where an implementer meets those three kinds, and
  a coverage sweep that quietly skipped them would look complete.

  A MEASURED CAUTION FOR WHOEVER IMPLEMENTS THE OBSERVATION. The obliged field is declared
  in the project's vocabulary file but, as the checks stand in this worktree, no commit-time
  check enforces its presence — the frontmatter check validates the kind's NAME against the
  declaration and stops there. So a document for one of those three kinds that simply omits
  the obliged field passes the check set today. That means the check set alone cannot
  observe the third clause, and an observation built only on "the checks passed" will report
  a green that says nothing about it. Assert the clause directly. This gap between what the
  vocabulary declares and what any check enforces is recorded here as a finding, not fixed
  here: closing it is the guardrail surface's work and is outside INF-1300's fence.

