title: "Parked entries remain unresolved so feedback-review still surfaces them"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given entry F1 was parked by the router (either below the confidence floor or
    as a blocker),
  When the router completes its run,
  Then F1 still has no resolved_at field in the feedback corpus,
  And a subsequent /feedback-review still lists F1 among the unresolved entries
    awaiting a human decision,
  And the router did NOT call resolve_feedback.py for F1,
  And parking an entry never removes it from or modifies its presence in the
    unresolved set.
depends_on: [ACD-1500b, ACD-1500b-2, ACD-1500b-3]
