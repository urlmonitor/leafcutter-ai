    relationship: implements
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Add a NEW `test` job to the existing .github/workflows/ci.yml alongside the current lint (blocking) and typecheck (informational, continue-on-error) jobs. The test job MUST be blocking: it must NOT set continue-on-error, so a failing test fails the job and the check."
  - "The test job MUST run the SAME documented command sequence as BP-1200a-2 (install requirements-dev.txt -> the build step + install_shims shim bridge per decided Approach 1 -> pytest over the integration + unit test directories) so local reproduction matches CI exactly."
  - "Pin the check NAME deterministically (a stable `name:` on the job) because BP-1200c-1 adds that exact name to the branch-protection required-status-checks list — the name is a cross-AC contract; if it changes, branch protection silently stops requiring it."
  - "HARD PREREQUISITE on BP-1200a-1: the job can only be trustworthy once the suite is green on a fresh clone (CI runs from a clean checkout via actions/checkout). Do not enable the blocking job before the ADR-016 fresh-clone fix (decided = Approach 1) lands, or every PR is blocked by the pre-existing ~36 import failures."
  - "Match the existing ci.yml conventions: actions/checkout@v4, actions/setup-python@v5 with python-version 3.13, install from requirements-dev.txt, runs-on ubuntu-latest, triggered on pull_request targeting main (and push to main consistent with the lint job)."
  - "Errors in the build/shim prepare step must fail the job loudly (non-zero exit) rather than skipping to a misleading green; the blocking guarantee must not be defeatable by a silently-skipped preparation."
delivers_to:
  ac_id: BP-1200c-1
  contract: "A named, blocking GitHub Actions check (stable job name set in .github/workflows/ci.yml) that branch protection on main requires as a status check. The exact check name string is the contract BP-1200c-1 adds to the required-status-checks list."
expects_from:
  ac_id: BP-1200a-1
  contract: "A documented CI test command that runs the full suite green on a fresh clone (post-ADR-016 Approach 1: build step + shim bridge), which this job invokes verbatim"
