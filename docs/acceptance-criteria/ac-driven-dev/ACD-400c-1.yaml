id: ACD-400c-1
components:
  - ac_driven_dev
title: "Only work whose approval has been recorded is offered by the build queue"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store holds three otherwise identical pieces of leaf-level work — each
    active, each still to do, none of them waiting on anything else, each carrying
    the same urgency and the same size — differing only in the approval state
    recorded against them: one recorded as approved, one as reviewed, one as draft,
  When the queue is asked, through the same command surface the build loop itself
    runs, which work is ready to be picked up,
  Then the approved piece is the only one offered,
  And the reviewed piece and the draft piece are each absent from the offer,
  And the missing approval is demonstrably the only reason they are absent: when the
    approval recorded against either of them is changed to approved and nothing else
    about the piece or the store changes, that same piece is offered on the next ask.
depends_on: [ACD-400c]
