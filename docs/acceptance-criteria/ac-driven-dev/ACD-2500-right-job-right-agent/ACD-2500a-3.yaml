  CONFLICT RESOLVED BY THIS AC: the technical planner's S2.8 table says python-coder
  "cannot act on .js", while ACD-1700b-1 (user decision 2026-08-11) pins a path-aware,
  first-match-wins map in which templates/workflows-js/**/*.js belongs to python-coder.
  Two tables answering one question already disagree. This AC makes the ACD-1700b-1 map
  the only source; ACD-2500e-2 deletes the S2.8 table. See ACD-2500a-3-i for the case
  that goes red if the old table survives.

  S2.8's partial-flag behaviour (BP-1100f-3-i: flag only the unmatched part of a mixed
  surface) is preserved by the second Then clause.
  The mechanical half of ACD-1700b's match belongs here; the judgment half (does the
  intent live in those files) belongs to ACD-2500d.
