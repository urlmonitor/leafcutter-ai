criteria: |
  Anything a reviewer finds is captured as a tracked item, not lost in a report.

  When a reviewer spots a problem, it is recorded as its own piece of work in the
  backlog so the normal fix process can pick it up -- nothing the review finds
  slips through or has to be re-discovered later.
