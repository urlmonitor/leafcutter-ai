notes: |
  WHY THE STATUS IS "pause record unreadable" AND NOT A NEW ONE. ACD-2100c-3-ii (approved,
  done) already says that when no attempt returns a readable record the run ends
  pause_record_unreadable and its message says the record could not be read (not that it is
  absent). A decline on every attempt is a case of "no attempt returned a readable record", so
  a new status would contradict a done record. What that record does not do is tell a decline
  apart from a damaged or retyped record -- its message is the same for both, and the remedy
  differs (a decline is a routing fault and a retry may run; a damaged record will not improve
  on retry). This record keeps the status and pins the message. If the IT PO prefers a
  distinct status, ACD-2100c-3-ii must be amended in the same change and every caller status
  list updated; flag, do not do it silently.

  "ON EVERY ATTEMPT" is deliberate: it holds whether the look-up is re-attempted (ACD-2100c-3-ii's
  bounded retry) or not (ADR-070 sec. 5.3: no re-send after a decline). The executor-choice
  conflict between those two is for the IT PO.

  Eleven drafts mirrors the recorded run (TQ-200d, 2026-10-30). Named mutation: map a
  decline to exists=false -- this record goes red on the nothing-to-resume clause and on the
  no-authoring-agent clause.
