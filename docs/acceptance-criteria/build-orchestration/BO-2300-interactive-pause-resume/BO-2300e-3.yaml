id: BO-2300e-3
components:
  - build_orchestration
title: "A pause-store read that could not run is reported as undetermined, never as 'no record'"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the workflow dispatches a peek-pause-record or read-pause-record
    operation to check whether a run has a pending pause,
  When the dispatched agent declines the request, the dispatch does not
    complete, or its reply cannot be parsed as a pause-record result,
  Then the workflow reports that outcome as "could not determine whether a
    pause record exists for this run" -- an outcome distinct from "no pause
    record exists",
  And the workflow does not proceed past the gate as though no pause record
    exists,
  And the workflow does not resume, clear, re-establish, or otherwise act on the
    run as if the check had found a legitimate empty result.
