assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "Each reviewer's seed must explicitly forbid drifting into another reviewer's angle and require it to declare its angle in its output."
  - "The aggregation step must validate angle coverage: if fewer than the three distinct angles are represented across the returned finding sets, the pass reports a review defect (missing perspective) rather than emitting a clean signoff."
  - "A missing-perspective outcome must be distinguishable from a genuine clean result in the consolidated output so the caller does not mistake it for success."
delivers_to: null
