title: "Architect produces C4 diagrams for structural changes"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the architect agent is processing a ticket that changes the structure
    of a component or introduces a new component,
  When the architect determines that the change affects system structure
    (new containers, new components, or changed relationships between them),
  Then it produces or updates a C4 diagram using the write-c4-diagram skill
  And the diagram covers the appropriate C4 level:
    - L1 (System Context) for new external integrations
    - L2 (Container) for new services, databases, or runtime boundaries
    - L3 (Component) for new modules or significant internal restructuring
  And the diagram file is written to docs/architecture/diagrams/

  Given an existing C4 diagram covers the component being changed,
  When the architect produces an updated diagram,
  Then the update is made to the existing diagram file (not a duplicate)
  And the diagram's metadata records the ticket ID that triggered the update
