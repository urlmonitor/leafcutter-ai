notes: |
  SETTLES THE TENSION GE-123e NAMED. Refusing on every commit means a fault in the
  merge-relief logic could block every merge. Chosen disposition: fail OPEN on that
  fault, VISIBLY, and only for the merge being concluded. Failing closed was
  rejected because it turns a relief-logic bug into a block on every merge in the
  repository. That is the outcome the component's fail-open convention exists to
  prevent, and the L1 says to fail open. The visibility clause and the
  could-not-check outcome stop that choice becoming a quiet skip (GE-120: a check
  that cannot run says so). Whether a could-not-check during a merge should ALSO
  block is a per-check decision under GE-120a-2. This record decides "announce,
  don't block" for this check.

  THE SECOND ARM IS UNASKED-FOR. Without it, an implementation can route every
  internal error, merge or not, to the same quiet pass and still satisfy arm one.

  FAULT INJECTION CAVEAT (for the IT PO / test designer). Corrupting the merge record
  so it names a commit the repository lacks may make git itself refuse to conclude
  the merge AFTER the pre-commit stage has run. The criterion is about the check's
  own verdict, warning and outcome on that real commit attempt. Pick a fault that
  lets git conclude the merge, or assert the check's verdict and output and not the
  final branch state. Do not replace the real commit attempt with a direct call to
  the check.

  TEST-EVIDENCE RULE (for the IT PO; non-negotiable). Every scenario is verified
  through REAL git commit calls in a scratch repository with the hook installed:
  a real conflicted merge concluded by a real commit, with both an inline -m message
  and a message file passed the way the shared commit step passes it. Hand-writing
  the last-commit-message file or setting the environment the check reads in place
  of a commit is NOT evidence (test-angles failure catalogue, FP-7).

  IT PO RESOLUTION (2026-11-16). Fault injection: assert the check's own verdict,
  warning and RESULT line on the real commit attempt. Prefer a fault that lets git
  conclude the merge (an unreadable incoming copy of the ticket file, with a valid
  MERGE_HEAD), and assert the branch state only when git concludes. IT PO CAVEAT,
  DERIVED from code reading: the shared change-set source does not check the exit
  status of its text diff. An unreadable incoming copy can therefore come back as
  could_not_check=False with an empty diff, which is a quiet pass. Whether
  _authored_change.py is fixed under this record (added to declared_files) or under
  its own record or KI is left for the person to decide. It is not declared here.

  RESOLVED (2026-11-16, person's gate decision). The shared source is fixed under this
  record: templates/scripts/commit_guardian/_authored_change.py is now in
  declared_files, with it_requirements for the fix and for re-running the consumers'
  tests. The defect is filed as
  KI-CG-20261116-authored-change-treats-a-failed-git-diff-as-an-empty-change.
