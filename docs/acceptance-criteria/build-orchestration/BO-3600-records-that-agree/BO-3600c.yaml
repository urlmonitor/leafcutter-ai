criteria: |
  Stale references inside the fault log are found, not inherited.

  A recorded fault that points at a requirement, a file or a place that has since
  moved or ceased to exist is flagged as needing attention. A reader can act on
  what the log says without first checking whether it is still true, and a
  finding does not quietly rot into a wrong instruction.
