notes: |
  Gates on enrichment COMPLETENESS (presence of file targets + a test contract), which
  is complementary to and distinct from the approval-readiness gate (ACD-1200b family)
  that gates on readiness status (reviewed -> approved).

  IT-PO enrichment (2026-08-12): canonical gate surface scripts/ac_store/scan_ac_store.py,
  aligned with edge child ACD-1600c-1-i; data-driven on field presence, advisory-then-required.

  AMENDMENT (2026-09-25, ACD-2500): the reason vocabulary is the single hold-reason list
  owned by ACD-2500b-2. Build order: this AC may build first (it owns the two original
  reasons and creates the one list if absent); ACD-2500b-2 already depends_on this AC and
  extends the list. work_status stays todo (unchanged by the amendment).

  AMENDMENT (2026-09-27, BA, user-directed): "missing file targets" now means the record is
  in the "no declared files" state (ACD-1600c-4-ii). Paths named in it_requirements or
  doc_links no longer satisfy it. work_status stays todo (nothing was built against the old
  keying). PENDING IT PO: the it_requirements bullets "(it_requirements naming file paths)"
  and "data-driven on field presence" and the test_spec descriptions of
  test_ac_missing_file_targets_flagged_not_ready still describe the old keying. MIGRATION
  CONSEQUENCE: no record written before ACD-1600c-4 has a declared list, so all of them carry
  this reason until their files are declared. The existing advisory-first and grandfathering
  requirement (ADR-026 rules 3-4) is what keeps that from stopping the store.
