readiness: approved
priority: high
title: "A below-threshold repetition is recorded so the next occurrence can trip the threshold"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the recurrence threshold is 3 occurrences,
  And an author writes an AC for a behavior that so far appears in only one other AC
    (this is the second occurrence),
  When the authoring run finishes,
  Then the AC is written standalone — no pattern is created at two occurrences,
  And the near-miss is recorded against the behavior, naming both occurrences and
    the count reached (2),
  And the record states which values already differ between the two occurrences.

  Given that recorded near-miss,
  When a later authoring run writes a third AC specifying the same behavior,
  Then the threshold is recognised as met on that run using the recorded count plus
    the new occurrence — the recurrence does not have to be rediscovered from
    scratch,
  And promotion happens in that run.
