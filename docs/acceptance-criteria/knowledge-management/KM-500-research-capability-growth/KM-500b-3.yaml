criteria: 'Given a candidate has passed the required tests, evaluation and review for its exact contents

  And the task holds explicit authorization for writes only to the configured query catalog

  When the governed registration step activates it

  Then the durable catalog atomically records the stable query identity, version, purpose, supported questions,
  typed input contract, bounded recipe, compiled query and verification provenance

  And activation rejects a stale, altered or mismatched candidate without replacing the previous valid catalog

  And readers of an already selected catalog version keep a consistent view during activation

  When a new independent research process starts after activation

  Then it discovers and can select the verified query without rebuilding the same ability

  And concurrent or repeated delivery of the same activation does not create conflicting active versions.

  And ordinary read-only permission cannot activate a query, broaden the writable scope or escalate through fallback

  And reopening the catalog checks persisted descriptor and verification provenance integrity before making an entry
  selectable.

  '
