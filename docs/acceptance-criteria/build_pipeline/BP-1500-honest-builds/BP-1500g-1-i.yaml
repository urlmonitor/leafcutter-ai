estimated_complexity: M
it_requirements:
  - "THE ENFORCEMENT POINT FOR THIS AC IS `clean_stale_artifacts` IN `scripts/build_phases.py`, DRIVEN BY `_MANAGED_ARTIFACT_DIRS`, AND IT IS A DIFFERENT POINT FROM BP-1500g-1's. Verified on origin/main 1cce5b48a: `--clean` is declared `action=store_true` and defaults to False, and the call is gated behind `if args.clean:` in `build.py`. So this path does NOT run on the reported no-flag reproduction, and BP-1500g-1's repair does not reach it: `clean_stale_artifacts` never consults `_PRE_CONSOLIDATION_PATHS` at all. Satisfying BP-1500g-1 and stopping here leaves KI-BP-009's originally-confirmed half live."
  - "THE MECHANISM IS TRAVERSAL THROUGH THE LINK, AND THAT IS WHY THE THIRD Then CLAUSE IS A PINCER AND NOT TWO CASES. `clean_stale_artifacts` resolves its managed directory under the target's `.claude/` and iterates it; because that path is a symlink into the generated tree, `iterdir()` walks INTO the generated tree, and the removal branch `rmtree`s any entry that is a real directory absent from the recomputed manifest. So the inside-the-generated-tree placement and the at-the-discoverable-location placement are ONE location reached two ways. An implementation that guards one and not the other has not closed the pincer, it has moved it."
  - "THE REMOVAL DECISION MUST OBTAIN THE SAME OWNERSHIP VERDICT BP-1500g-1 ESTABLISHES, not a second independently-maintained rule. Two rules that agree today are the same defect as two tables that agree today -- see BP-1500g-1's measured eight-of-eleven overlap. If this path cannot reach that verdict, that is a finding to raise, not a reason to re-derive it here."
  - "PRE-FLIGHT IS AN OUTCOME, NOT A NAMED OPTION. The last Then clause requires an adopter to be able to learn what this mode would remove WITHOUT the removal occurring; the surface is the implementer's to choose. The measured obstacle: `clean_stale_artifacts` takes no dry-run parameter and the `--clean` dispatch has no dry-run branch, which is exactly why KI-BP-009's first half sat unconfirmed for six days while the reporter -- correctly -- refused to run it. Whatever is built must be safe to run on a production install by someone who does not trust it."
  - "THE PRE-FLIGHT AND THE REAL RUN MUST AGREE EXACTLY. A preview that lists a different set from what the run removes is worse than no preview: it converts a known hazard into a trusted one. This is the same requirement BP-1500b-4 states for its own `--dry-run`; state it here for the mode that exists TODAY rather than pointing at that AC, whose sweep does not exist."
  - "KI-BP-010 IS IN THE SAME FUNCTION AND MUST NOT BE FIXED SILENTLY BY THIS WORK. `_MANAGED_ARTIFACT_DIRS` mixes two path conventions -- three bare subdirectory names and `workflows` carrying a `.claude/` prefix -- so the workflows entry resolves to a doubled segment and has never run. Normalising the dict while implementing this AC would ACTIVATE a removal path over a directory that has never been swept, on a build whose safety over adopter-occupied trees is the very thing under repair. KI-BP-010's own entry says to sequence the two deliberately. Either leave it and cite KI-BP-010, or fix it and prove the activated path obeys this AC -- do not normalise it in passing."
  - "Must be idempotent: running the opt-in mode twice leaves the adopter's content byte-identical after both runs and reports no second removal."
  - "Must follow the project error handling policy on every filesystem operation; a swallowed OSError in a removal loop turns a partial deletion into an unreported one."
test_spec:
  - name: test_bp_1500g_1_i_clean_mode_does_not_delete_an_adopter_capability_placed_inside_the_generated_tree
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: real_artifact
    surface_invoked: "python scripts/build.py --target-dir <scratch_adopter> --clean"
    description: "KI-BP-009's EMPIRICALLY CONFIRMED HALF, reproduced as a test and red against today's build. Place an adopter-authored capability inside the generated tree, run a real `--clean` build subprocess, assert it is present with identical bytes and does not appear in the output as a removed stale artifact. Confirmed destructive on 2026-08-25 on a scratch adopter."
  - name: test_bp_1500g_1_i_clean_mode_does_not_delete_an_adopter_capability_placed_at_the_discoverable_location
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: real_artifact
    surface_invoked: "python scripts/build.py --target-dir <scratch_adopter> --clean"
    description: "The other arm of the pincer, under the SAME mode. Adopter capability at the discoverable location as a real directory rather than inside the generated tree; a real `--clean` subprocess; survives byte-identical. Together with the entry above this is the third Then clause: neither placement forfeits the work. Two tests, one clause, and passing only one is the status quo."
  - name: test_bp_1500g_1_i_the_surviving_capability_is_still_discovered_by_name_after_a_clean_run
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "python scripts/build.py --target-dir <scratch_adopter> --clean"
    description: "The second Then clause. After the `--clean` run the adopter's capability resolves by its own name through the consuming tool's discovery path -- survives USABLE, not merely on disk."
  - name: test_bp_1500g_1_i_an_adopter_can_learn_what_clean_mode_would_remove_without_removing_anything
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: criterion
    description: "The last Then clause, asserted as an outcome rather than against a named flag: over a tree holding a genuine orphan and adopter content, the pre-flight surface names the orphan, and every file in the tree -- orphan included -- is byte-identical afterwards. The test must locate the surface from the build's own advertised interface, not assume a flag name, since the AC deliberately leaves the surface open."
  - name: test_bp_1500g_1_i_the_preflight_list_and_the_real_removal_list_are_identical
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: seam
    description: "Over one mixed tree: capture the pre-flight's set, then run the real mode on a pristine copy of the same tree and capture what it actually removed. The two sets are equal. A preview that under-reports is the failure that makes a pre-flight worse than none, and it is not reachable by testing either side alone."
  - name: test_bp_1500g_1_i_clean_mode_still_removes_a_genuine_package_orphan
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: failure
    description: "THE OVER-CORRECTION CONTROL, and the reason this contract is not satisfiable by disabling the mode. An artifact the package genuinely produced in an earlier version and no longer ships is still removed by the same run in which the adopter's content survived. Without this entry, `if args.clean: pass` passes every other entry here."
  - name: test_bp_1500g_1_i_two_consecutive_clean_runs_leave_the_adopter_content_byte_stable
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: criterion
    description: "Idempotency for the destructive mode specifically: the second run neither removes the adopter content nor reports a second removal."
test_rationale: |
  THE TWO PLACEMENT ENTRIES ARE THE CLAUSE, NOT A DUPLICATED CASE. The third
  Then clause is a pincer -- there must be NO placement in which running this
  mode forfeits the work -- and a pincer cannot be asserted by one test. The
  status quo passes each arm separately depending on where the fixture puts the
  file, which is precisely how the defect survived: the reporter found one arm
  in August and the other in September, and each looked like a complete
  finding on its own.

  THE ORPHAN-STILL-REMOVED ENTRY IS LOAD-BEARING AND IS THE FIRST THING A
  TRIMMED CONTRACT WOULD LOSE. Every other entry in this contract asserts that
  something SURVIVED, and a mode that does nothing satisfies all of them. This
  AC is about a destructive mode continuing to do its job safely, not about
  neutering it, and only a positive entry can tell those apart.

  THE PRE-FLIGHT PARITY ENTRY EXISTS BECAUSE HALF A PRE-FLIGHT IS A TRAP. A
  preview the adopter trusts and that under-reports converts a hazard they
  were correctly refusing to run into one they run confidently. Neither side
  tested alone catches divergence; only the differential does.

  ALL BEHAVIOURAL ENTRIES INVOKE A REAL BUILD SUBPROCESS. A direct unit test of
  `clean_stale_artifacts` over a synthetic directory does not traverse a real
  symlink into a real generated tree, and the traversal IS the mechanism -- a
  mocked fixture reproduces the bias that let this ship.

  RUNTIME. Seven entries, five real build subprocesses over small scratch trees.
  Inside the done-proof pytest budget as fixed by PR #706 (30s collection floor,
  300s per linked test file, overridable via
  LEAFCUTTER_DONE_PROOF_PYTEST_TIMEOUT_SECONDS). Not shaped by the retired 60s
  ceiling and not to be trimmed toward it.
