work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124e.yaml"
criteria: |
  Given a change under review, compared against the branch it targets
  And the criteria store contains the finished user-interface criterion
    UXP-607-2, which nothing on screen declares or pins
  And UXP-607-2's own record is one of the changed files
  When the reverse-direction gate runs
  Then UXP-607-2 is evaluated
  And the gate fails for UXP-607-2

  Given a change under review whose changed files include
    `components/flows/realization-badge.tsx`
  And that file declares UXP-607 at component level and pins UXP-607-1 on an
    element
  And neither criterion's own record is among the changed files
  When the reverse-direction gate runs
  Then both UXP-607 and UXP-607-1 are evaluated

  Given a change under review
  And the criteria store contains a finished user-interface criterion that
    nothing on screen declares or pins
  And that criterion's own record is not among the changed files, and no changed
    front-end file declares or pins it
  When the reverse-direction gate runs
  Then the criterion is not evaluated
  And the run does not fail on its account
  And the criterion is not recorded as exempt, deferred, or pre-convention, and
    appears in no count the run produces

  Given the same untouched criterion
  When the run reports which criteria satisfied the gate
  Then the untouched criterion is not among them — not evaluated is not a pass
