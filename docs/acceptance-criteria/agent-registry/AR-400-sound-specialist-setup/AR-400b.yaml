notes: |
  CHECKED AGAINST THE SPECIALIST'S OWN DECLARATION. The source analysis found
  today's check compares instructions against the DERIVED central copy, not
  the specialist's own grant. After AR-300c the own declaration is the truth;
  comparing against a copy re-opens the two-records problem one level up.

  CORRECTNESS OF RECOGNITION IS PART OF THE PROMISE. The current check misses
  real references (narrow phrasing, case) and flags false ones (a sentence
  saying NOT to use something, or describing another specialist). A check that
  is a fault rather than a warning must be right about what counts as an
  instruction, or it will be switched off. How it recognises one is the BA's.

  WHICH WAY TO FIX A MISMATCH IS A JUDGEMENT, NOT A RULE. For research-agent the
  grant is missing; elsewhere the instruction may be the error. The fix per
  instance is decided at decomposition; the check only names the mismatch.

  2026-10-21: test contract (test_spec, test_rationale) added for composite
  closure, at the user's decision ("Add parent tests, then close"), so this
  parent can be proven done by covering tests of its own. Criteria, readiness
  and every requirement-defining field are unchanged.
