  notes: |
    Add --exclude-structural-parent to the select_connected invocation string in
    templates/workflows-js/fast-lane-ship.js (the selectConnectedInvocation
    template literal). The sibling consumer templates/agents/build-ac.md already
    passes this flag; the fast lane is the only select_connected caller that does
    not, and the omission is drift rather than a decision — the flag landed in
    #409 and fast-lane-ship.js has been edited three times since without picking
    it up. Do NOT change the exclude_structural_parent=False default in
    fast_lane.py: BO-2600a-1 fixed that default as a backward-compatibility
    invariant and covers it with its own test.
test_spec:
  - name: test_fast_lane_select_connected_passes_exclude_structural_parent
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    description: "Resolves a real fixture AC whose depends_on names its own structural L0/L1 parent, invoking the resolver exactly as fast-lane-ship.js composes the command. Asserts the returned set contains only the target and its own descendants, and specifically does NOT contain the parent's other children. Asserting the resolved set rather than the command string is what makes this test fail if the flag is dropped again."
  - name: test_dropping_the_flag_reproduces_the_ballooned_set
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    description: "Negative control over the same fixture: invoking without the flag returns a strictly larger set that includes the structural parent's other children. Pins the two behaviours apart so a future change that silently reverts to the default is caught rather than absorbed."
test_rationale: "The defect being closed is a missing token in a command string, which is exactly the shape a grep-style test would appear to cover while proving nothing about the resolved set. Both tests therefore drive the real resolver over a real fixture store and assert on membership of the returned build set. The negative control is required: without it, an implementation that returns a small set for unrelated reasons — an empty store, a load failure — would satisfy the positive case, and the two tests together are what tie the size difference to the flag itself."
