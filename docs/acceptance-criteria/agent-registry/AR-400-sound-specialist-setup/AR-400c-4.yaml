    300,301,303 research-agent trading ids             -> AR-400a-3-i
    302 research-agent/knowledge-query                 -> AR-400b-3-i
    304 python-coder/collector-enforcer                -> AR-400d-1-ii
    305 python-coder/sign-off                          -> AR-400b-3-ii
    306,307,313-317,321-324 granted-not-mentioned (11) -> AR-400c-1 (+ AR-400c-2)
    308 retrospective-agent/route-learning             -> AR-400a-3-ii
    309,311 sql-coder/postgres, sql-test               -> AR-400d-1-i
    310 sql-coder/sql-query                            -> AR-400b-3-iv
    312 frontend-coder/frontend-design                 -> AR-400b-2-i
    318 architecture-diagram-author casing             -> AR-400b-3-iii
    319,325,326 live-surface-tester, BA, IT PO/signoff -> AR-400b-1 (control)
    320 onboard/webapp-testing                         -> AR-400b-2-iv
