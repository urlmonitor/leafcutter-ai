work_status: todo
criteria: |
  Given an authoring stage (product owner, business analyst, technical planner or the
    code-aware test-design step) has just added or changed 4 requirement records in one
    feature folder,
    and exactly one of them, ACD-9990a-2, declares it expects a contract from ACD-9990a-1
    while ACD-9990a-1 declares no delivery,
  When the requirement rule check runs at the end of that stage,
  Then it reports exactly one finding for ACD-9990a-2, and that finding names the record's
    file, the record id and the rule family "producer/consumer contract symmetry",
  And the overall result of the check is failed,
  And the authoring stage is not reported complete while the check result is failed,
  And the 3 records with no violation produce no findings,
  And the report states that 4 records were checked, and states 5 when a fifth record is
    added in the same stage and the check is run again,
  And a record that violates a rule the store's existing commit-time record check already
    enforces (for example an empty graph component list) produces exactly one finding for
    that rule, not one finding per check that knows the rule.
