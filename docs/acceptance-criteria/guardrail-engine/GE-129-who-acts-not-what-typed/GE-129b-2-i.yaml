id: GE-129b-2-i
title: "The same quoted text is a mention when it is passed as an argument and a commit when a shell runs it"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, a subagent named python-coder, and these
    pairs of commands carrying identical quoted text:
    (a) `echo 'git commit -m x'` and `bash -c 'git commit -m x'`,
    (b) `gh pr comment 12 --body "git -C ../wt commit"` and `sh -c "git -C ../wt commit -m x"`,
    (c) `printf '%s\n' "git commit -m x"` and `eval "git commit -m x"`,
    (d) a here-document containing `git commit -m x` redirected into notes.md, and the same
        here-document fed to `bash`,
  And two commands that run a commit in a nested shell without quoting it as an argument:
    (e) `(git commit -m x)` and `echo $(git commit -m x)`,
  When each is issued,
  Then the first command of each pair (a) to (d) runs and is not refused,
    And the second command of each pair (a) to (d) is refused as a commit and no commit is added,
    And both commands of (e) are refused as commits and no commit is added.
