id: GE-126b-1
title: "No way out of the check exists that has not first said where it looked and how much it examined"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the deployed AC-governance check is invoked out of process twice with the same
    invocation in two different working directories — first inside a directory tree that
    contains no acceptance-criterion store at all and then inside a working copy whose
    store holds one staged record that genuinely violates the rule the check enforces,
  When each run finishes,
  Then both runs state the root the check resolved for itself and the number of records
    it examined there before reporting any result whatsoever,
  And the first run states that it examined none and names the root at which it found
    no store while the second states that it examined one and names the root at which
    it found it,
  And the second run refuses that record naming it — so the count of one is corroborated
    by a verdict on a record known to break the rule rather than being an unverified
    number the check printed about itself,
  And the two runs report different outcome values a caller can distinguish without
    reading prose so the pair recorded on 2026-08-25 — same check same file same exit
    code with only the working directory differing — can no longer occur,
  And the statement is produced on every path out of the check including both of the
    paths that terminate before any record is read.

  Coverage note: covered only by executing the deployed check out of process from the two
  working directories and asserting on both statements and on the refusal. The refusal in
  the second run is the load-bearing assertion. A test that asserts only that a statement
  line appeared does not cover this criterion — a check can print a count and have
  counted the wrong thing. A test that searches the source for the statement's placement
  relative to the early returns does not cover it either; a grep-only test passes on dead
  code.
