it_requirements:
  - "The existence-vs-marker rule is implemented once, in the declared-files seam (ACD-1600c-4), and invoked by the check-ac-schema commit hook (load-bearing, both its jsonschema and manual-fallback branches) and by the agent-side validator; both must return the same refusals and reports for the same record and tree."
  - "Existence is judged against the repository tree at check time; the hook and the agent-side validator use the same judgement."
  - "'Finished' is read from the record's work_status (done) -- data-driven, never keyed on ids."
  - "A refusal blocks the commit; the 'marked to be created but already exists' report is a non-blocking warning emitted by the same run and never changes the exit status."
  - "Exactly one message per offending entry; no second message for the same entry from the JSON-schema layer."
  - "Scope is the population the criteria specify: the refusal applies to unfinished records. A finished record whose 'existing' entry is now absent is NOT refused here and must not block unrelated commits that touch the record; it is reported in the store-wide declared-files report instead (Q4, answered by ACD-1600c-4-iv)."
  - "Tests run against a temporary repository tree, never the live one: the criteria's example paths include scripts/ac_store/declared_files.py, a file this feature itself creates, so a live-tree test would change verdict when the feature ships."
  - "Existence checks must not spawn a subprocess per declared path; the check stays within the check-ac-schema hook's existing time budget for a commit touching 100 records."
