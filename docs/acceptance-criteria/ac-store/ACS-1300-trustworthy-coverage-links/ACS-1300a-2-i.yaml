notes: |
  REMOVAL IS THE ASYMMETRIC HALF AND DESERVES ITS OWN RECORD. Appending a link that
  turns out to be wrong leaves the previous evidence intact beside it; removing an entry
  destroys the only pointer that existed. The measured inverse-rot population is small
  — the L0 notes carry the provisional figure with its denominator — so there is no
  volume argument for a fast, loose removal rule, and every argument for a cautious one
  that reports each deletion individually.

  THE LAST CLAUSE IS THERE BECAUSE THE SAFE-LOOKING BEHAVIOUR IS THE WRONG ONE. A rule
  that declines to empty a coverage list entirely feels protective and is not: it leaves
  the record claiming proof that is wholly gone, which is precisely the false premise
  downstream gates read. Emptying it and saying so is the honest outcome.

  THE NAMED MISPARSE THIS RULE MUST NEVER ACT ON — measured 2026-09-01. GE-107 writes its
  coverage entry as `path.py:Class::test`, with a SINGLE colon before the class. A parser
  that splits on `::` turns that one entry into fragments that name no file on disk, and
  this removal rule would then delete four live links from a record whose coverage was
  perfectly correct. Detection is where that must be stopped — ACS-1300a-1 now carries a
  dialect clause requiring every form to be classified correctly — but the consequence
  lands HERE, because this is the AC that deletes. Treat GE-107 as a mandatory fixture for
  the removal path, not only for the detection path. The field's three legitimate dialects
  measured the same day: child record ids (3,586 entries), `path::Class::test` (162), and
  bare file paths (365).

  TWO ENTRIES THAT ARE PATH-SHAPED, PRESENT ON DISK, AND STILL NOT PROOF — recorded here
  because this rule will correctly leave them alone and someone will later ask why nothing
  flagged them. BP-1100e-3 names an architecture .md and UXP-530 names an eval.jsonl. Both
  files exist, so the absent-file rule does not fire and no validator anywhere objects, yet
  neither can ever be proof that work is done. That is a THIRD rot direction — an entry
  that resolves but is not a test — and it is deliberately NOT owned by this AC. The L0
  records it as undecided; do not widen this removal rule to cover it, because deleting an
  entry on a judgement about what counts as a test is a much larger claim than deleting one
  because the file is gone. Separately, ACD-300f names a child ACD-300f-5 that does not
  exist, which is the same shape on the child-id dialect.

  DO NOT EXTEND THIS INTO MOVED-FILE DETECTION. The tool cannot know a file moved rather
  than vanished, and a rename heuristic would write a link on a guess — worse than the
  missing evidence it replaces, and the exact drift toward heuristics ACS-1300a's notes
  forbid. Report the removal; a human or a later pass re-links.
