notes: >-
  OBSERVED IN THIS WORKTREE AT 468e0490f, 2026-09-07, AS SHAPE RATHER THAN AS COUNTS. Every
  wiring in the shipped settings surface invokes an interpreter on a path built by a shell
  fragment that first walks up the tree looking for the installed hook directory, then names
  the script beneath it. So the script is (a) inside a command string, (b) named in the
  installed layout while the file it refers to is authored elsewhere, and (c) accompanied in
  the same command by another path-shaped token. The same document also carries a list of
  permitted command patterns, which is a place a script name can appear while executing
  nothing. Each of those three facts defeats a different naive implementation, and all three
  are true of the file today.


  THE AVALANCHE IS THE FAILURE TO DESIGN AGAINST, NOT THE SILENCE. Most records in this family
  worry about a census that reports nothing. This one's dominant risk runs the other way: get
  the two-layout resolution wrong and the first run reports every installed hook as unwired.
  A census that raises a dozen false alarms on the day it lands has exactly one natural remedy
  — weakening it until it stops — so the resolution rule is required to be stated in the
  output, and the descriptor for it is written as an inequality that an unresolved census
  cannot satisfy.


  THE SYMLINK IS NOT INCIDENTAL. The installed hook directory and the installed settings
  surface are both reached through symlinks into the installed tree, and resolving a path
  through exactly those symlinks is the measured mechanism that makes this surface's own M9a
  exemplar match nothing on three of its four targets. A census built here without deciding
  the resolution rule reproduces its subject's defect while examining it.
