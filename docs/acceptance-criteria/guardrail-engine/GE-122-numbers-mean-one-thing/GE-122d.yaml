notes: |
  WHY THIS IS A SEPARATE BENEFIT FROM GE-122a. A correct rule that can be skipped
  is not a guarantee. GE-122a says what must be true; this L1 says how strongly
  it is held. The user asked explicitly for all three stages, and each earns its
  place for a different reason:
    - authoring time — earliest and cheapest, and the only stage that can hand
      the problem to someone who can fix it (see GE-122c);
    - commit time — stops the clash entering local history, but is skippable on
      purpose by anyone who chooses to bypass the commit checks;
    - the shared build — precisely because the commit-time stage IS skippable,
      this is the backstop that makes the guarantee real. It is the only
      unskippable one, and it is what stops a clash reaching everyone else.

  INHERITED STANDING RULE (do not restate it as a new rule, and do not contradict
  it). This project has a deliberate convention that a guard hitting an internal
  error should not hard-block an unrelated commit, and a sibling goal already
  establishes that a check which cannot run must SAY so rather than report
  success. Both apply here unchanged. The specific hazard for this AC is that a
  whole-collection check has more ways to be unable to run than a per-file one
  (it needs to see the whole collection, not one staged file), so "I could not
  read everything, therefore everything is fine" is the exact failure to design
  against. Decide per stage, explicitly at L2, whether a cannot-run condition
  blocks or only announces itself — there is no blanket answer.

  The component-diagram trigger covers the three-stage arrangement and which
  stage owns which promise; the reference-doc trigger covers the bypass rules, so
  that "which stage can I skip and what still catches me" is written down rather
  than folklore.

  ================================================================================
  WHAT IS GUARDED TODAY — COVERAGE MATRIX (BA, 2026-08-17)
  ================================================================================

  Established by reading .pre-commit-config.yaml (the live hook registry — note
  that templates/commit-guardian/commit_guardian.json's hooks_manifest holds only
  3 entries and is NOT the operative list), .github/workflows/ci.yml,
  templates/settings.json, scripts/ac_store/validate_ac_schema.py,
  templates/scripts/commit_guardian/check_ac_schema.py, check_adr_collision.py,
  check_ac_circular_deps.py, check_ac_pattern_refs.py, templates/hooks/
  ticket_frontmatter_guard.py, scripts/adr_refs.py and scripts/next_diagram_seq.py.

  The distinction that decides the whole matter is PER-FILE versus
  WHOLE-COLLECTION. A per-file validator opens one artifact and judges it alone;
  it is structurally incapable of observing that a second artifact elsewhere
  claims the same number, no matter how many rules are added to it. Every
  uniqueness cell below is "no" for exactly that reason.

  --- REQUIREMENT (AC) IDENTIFIERS ------------------------------------------
  (a) FORMAT     — GUARDED. check_ac_schema.py (pre-commit, registered) validates
      the id against the PREFIX-NNN regex in config/ac_store_schema.json, and the
      same job runs in CI ("AC store valid", pull requests only, diff-scoped).
      scripts/ac_store/validate_ac_schema.py is the agent-side twin. PER-FILE:
      both read one record at a time; the commit hook takes its file set from
      `git diff --cached` via _get_staged_ac_paths.
  (b) UNIQUENESS — NOT GUARDED. No hook, no CI job, no script performs an
      id-uniqueness pass. check_ac_schema.py does load the whole store, but only
      to compare CRITERIA text against pattern ACs — it never compares ids.
      The nearest whole-collection loader is check_ac_circular_deps.py, which
      builds a store-wide depends_on adjacency list and then reports only cycles
      touching a staged id; the load mechanism this feature needs therefore
      already exists in the hook family, aimed at a different question.
      CONSEQUENCE: the live GE-119 collision passed every gate.
  (c) REFERENTIAL INTEGRITY — PARTIAL. check_ac_pattern_refs.py verifies that an
      implements_pattern target exists store-wide, and check_ac_parent_covered_by
      verifies the parent back-link. depends_on targets are NOT verified to exist
      (documented as warn-only, must not block). `# covers:` tags are checked for
      PRESENCE by check_test_ac_tags.py, never for unambiguous RESOLUTION — which
      is why nine tags reading "GE-119" resolve to two different records today
      with nothing objecting.

  --- WORK-ITEM (TICKET) IDENTIFIERS ----------------------------------------
  (a) FORMAT     — GUARDED, weakly. ticket_frontmatter_guard.py (PostToolUse
      Edit|Write, live session) and check_doc_frontmatter.py (pre-commit) validate
      frontmatter shape; _check_status_folder checks that a work item's declared
      state agrees with its own folder. Both PER-FILE — the session hook sees the
      single file just written, the commit hook the staged set.
  (b) UNIQUENESS — NOT GUARDED. Nothing compares one work item against any other.
      _check_status_folder is the closest thing and is precisely the check that
      CANNOT see the defect: each of the 5 duplicated items has one copy whose
      folder legitimately matches its own declared state, so each copy passes on
      its own. This is the per-file blindness in its clearest form.
  (c) REFERENTIAL INTEGRITY — PARTIAL. _check_depends_on resolves a work item's
      declared dependencies to files; check_ticket_ac_status_parity reconciles a
      work item against the requirements it cites. Neither asks whether a cited
      identifier resolves to exactly ONE file.

  --- DECISION-RECORD (ADR) NUMBERS -----------------------------------------
  (a) FORMAT     — GUARDED implicitly by filename convention, enforced only in the
      sense that adr_refs.py's FILENAME_RE ignores anything not matching
      ADR-NNN-slug.md. No hook rejects a malformed name.
  (b) UNIQUENESS — NOT GUARDED IN PRACTICE, and this is the sharpest finding of
      the audit. templates/scripts/commit_guardian/check_adr_collision.py EXISTS,
      is written, is deployed to .leafcutter/, and compares staged decision
      numbers against those on origin/main and in-flight branches — but it is NOT
      REGISTERED in .pre-commit-config.yaml. The config registers check-adr-
      coverage and check-adr-cross-reference and nothing else for this namespace.
      The collision guard has therefore never run. It is also fail-open by
      contract (exit 0 on any internal error). A written, tested, deployed,
      unregistered guard is worse than none, because it appears in inventories as
      coverage — the same class of defect as the documented-but-dead remediation
      path in check_glossary_coverage.py.
      Note it is also WHOLE-COLLECTION-capable in the right way (staged versus all
      committed), so registering it is a large part of this namespace's answer.
      scripts/adr_refs.py does perform a true whole-repository duplicate/gap/
      dangling audit, but it is a manually-invoked CLI, not a gate.
  (c) REFERENTIAL INTEGRITY — NOT GUARDED at commit or in CI; available on demand
      via adr_refs.py, which reports dangling numbers and broken slugs.
      MEASURED CLEAN 2026-08-17: 33 records, 1..33 contiguous, zero duplicates,
      zero gaps, zero dangling. Guarding this namespace LOCKS IN a good state —
      there is no present defect to fix, and it should not be written up as if
      there were. Historical note from adr_refs.py's own decision history: four
      duplicated integers (004, 007, 017, 025) and one gap existed on 2026-08-13
      and were repaired, which is what the current clean state cost.

  --- DIAGRAM SEQUENCE NUMBERS ----------------------------------------------
  (a) FORMAT     — NOT GUARDED. scripts/next_diagram_seq.py ALLOCATES a correct
      next number (`^c([1-4])-(\d{3})-`, max+1, never reusing a retired number),
      but nothing verifies that a diagram's name matches. The allocator is
      referenced only from two agent templates, two unit tests, a build phase and
      two changelogs — enrolment is prompt-only.
  (b) UNIQUENESS — NOT GUARDED. No collisions exist (12 numbered diagrams, 12
      distinct level+sequence pairs), but that is the allocator's max+1 discipline
      holding, not a gate. check_mermaid_parent_link.py and
      check_mermaid_complexity.py are registered for this tree and check neither
      names nor numbers.
  (c) REFERENTIAL INTEGRITY — PARTIAL. check_mermaid_parent_link.py enforces
      bidirectional parent links between architecture documents. Nothing resolves
      a citation of a diagram by its sequence number.

  --- SUMMARY ---------------------------------------------------------------
  FORMAT is guarded for 2 of 4 namespaces (requirements, work items).
  UNIQUENESS is guarded for 0 of 4. Every validator that touches these namespaces
  is PER-FILE (or, for the one decision-number exception, whole-collection but
  unregistered), and a per-file validator cannot detect a duplicate even in
  principle. This is why the GE-119 collision, the 5 twice-held work items and the
  11 unnumbered diagrams all accumulated with every gate green.
  REFERENTIAL INTEGRITY is partial for 3 of 4 and absent for diagrams; crucially,
  no check anywhere asks whether a citation resolves to exactly ONE artifact,
  which is the property that actually breaks when a number is claimed twice.

  STAGE COVERAGE TODAY, against this L1's three stages:
    - authoring time — one guard exists at the PostToolUse Edit|Write point
      (ticket_frontmatter_guard.py) and covers work-item frontmatter only. It is
      the proof that the stage works, and the only precedent for GE-122c-1.
    - commit time — 40+ registered hooks, none checking uniqueness in any
      namespace.
    - shared build — the "AC store valid" job runs six requirement hooks through
      pre-commit, deliberately diff-scoped and pull-request-only, with a
      documented gap ("NOT YET IMPLEMENTED — whole-store run on push to main as a
      merge-vector backstop", deferred because 57 pre-existing orphans would make
      it red from the first run). Nothing there checks uniqueness either.
      GE-122e exists precisely so this feature does not inherit that deferral.

  ================================================================================

  BA DECOMPOSITION NOTE (2026-08-17) — the per-stage cannot-run decision.
  The L1 required this to be decided at L2 with no blanket answer. GE-122d-3
  decides it: an artifact in the collection that cannot be read or parsed BLOCKS
  at commit time and FAILS the shared build (a whole-collection check that could
  not see the whole collection has established nothing), while at authoring time
  it ANNOUNCES in-session without reverting the author's write. GE-122d-3-i then
  draws the boundary against the component's approved fail-open convention: an
  internal defect raised AFTER the collection was fully read is announced but does
  not block the commit, because a bug in the guard must not hold an unrelated
  change hostage — and that permission explicitly does not extend to the
  unreadable-artifact case. Both conditions are announced; only one blocks. That
  is how GE-119's "say so" and GE-116a-1-iii's fail-open are honoured together
  without either swallowing the other.
  GE-122d-1 expresses the single-shared-rule requirement BEHAVIOURALLY (change the
  rule once, all three stages change) rather than structurally, so it cannot be
  satisfied by a grep test over three registrations. GE-122d-2 requires not only
  that the build gate fail but that its name be in the shared branch's required-
  check set — an optional gate leaves the guarantee exactly as voluntary as the
  commit-time stage.

  BA ADDENDUM (2026-08-25) — the sixth child, and why the matrix above needed one.
  The matrix documented the unregistered-guard trap while describing
  check_adr_collision.py, and the commit-time numbering check built under this L1
  then fell into the same trap: written, tested to a green suite, adversarially
  reviewed six times, and registered nowhere. Verified 2026-08-25 —
  check_identifier_uniqueness.py appears in neither commit_guardian.json nor the
  deployed pre-commit registry. GE-122d-6 closes it for this guard by requiring a
  real commit in a real built install, and its L3 requires the passing path to
  state what was inspected so a pass is distinguishable from a hook that never
  ran. The family-wide interlock is deliberately NOT filed here — it belongs to
  GE-120c-6, because filed under this L1 it would protect this guard alone, which
  is exactly the mistake that produced four instances of one defect.
  A NOTE ON THE TWO MANIFESTS, since this matrix is where the ambiguity is
  recorded: both statements above are correct once the direction is stated.
  templates/scripts/commit_guardian/commit_guardian.json (55 entries) is the
  SOURCE a registration is authored in and the file the install deploys the
  registry from; the deployed .pre-commit-config.yaml is where the registration
  must be OBSERVABLE. templates/commit-guardian/commit_guardian.json (3 entries)
  is neither.
