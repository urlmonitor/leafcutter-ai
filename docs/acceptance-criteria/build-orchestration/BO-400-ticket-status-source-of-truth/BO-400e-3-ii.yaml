estimated_complexity: L
package_surface: false
declares_side_effect: true
it_requirements:
  - >-
    WHERE THE DERIVATION LIVES (cause 1 of the KI: the scoping is prose today). The closable set is
    computed by a new Python module, scripts/build_orchestration/finalize_closable_set.py. Its CLI
    prints one JSON object on stdout. finalize-feature.js only dispatches it. No agent prompt may
    carry set-selection logic: no git commands for finding candidates, no "only close tickets this
    branch changed" prose, no inbox or store walk. scripts/build_orchestration/ is deployed
    whole-directory by build_build_orchestration_scripts (scripts/build_phases_script_deploy.py),
    and the manifest is derived from the same directory scan, so no deploy-manifest tuple needs
    editing. If the module imports a helper from another scripts/ subdirectory, that helper must
    already be deployed, or be added to its phase's deploy list in the same change (CLAUDE.md, "New
    Hook / Gate Dependencies Must Be in the Build Deploy-Manifest"). Verify against the deployed
    layout, not only the source tree.
  - >-
    finalize-feature.js MUST NOT GROW. It is already 2,027 lines against a 1,000-line limit, and the
    size ratchet makes it shrink twice as much as it grows. Across the whole BO-400e-3-ii..ix change
    set, the net line count of templates/workflows-js/finalize-feature.js must be zero or
    negative. Pay for the new dispatches by deleting Step 3.5's sub-step B-E prompt string, which
    runs to about 90 lines. Snapshot comparison, closing, path-list building and outcome
    classification all go in the Python module, never in workflow JS.
  - >-
    MERGE-BASE COMPARISON, NEVER TWO-DOT. "Changed by the branch" is measured from the merge base of
    HEAD and the base ref finalize already uses (origin/main after Step 2's fetch). A path counts
    only when BOTH hold: (a) it differs between the merge base and HEAD (three-dot, git diff
    <base>...HEAD), and (b) at least one of the branch's own first-parent, non-merge commits since
    the merge base touched it. (b) is what makes the "took in main by merging it" scenario hold even
    when the local base ref predates the commit that was merged in. Content that arrived through a
    merge of main never qualifies. A file that the branch changed and then reverted is excluded
    by (a). The two-dot form (git diff origin/main HEAD), which today's B1 instruction uses, is
    forbidden.
  - >-
    BOTH BOUNDS, ALWAYS. A ticket is closable only when it is (i) the ticket the branch was built
    for (single-ticket branch) or inside tickets/00_inbox/epics/<BRANCH>/ (a branch whose name
    starts EPIC-), excluding Master_Plan.md, AND (ii) changed by the branch per the rule above.
    Source ACs enter the set only as the source_ac of a ticket that is in the set. An AC is never
    in the set because the branch changed it, or because it was found by walking the store.
  - >-
    DECISION 1, HOW THE BUILT-FOR TICKET IS IDENTIFIED: read from the branch record that BO-400e-3-ix
    writes at setup. That record is the git config key branch.<branch>.leafcutterTicket in the
    clone's shared config, holding the repo-relative POSIX path of the ticket. It is the ONLY
    source. The module never parses the branch name or reverses _derive_slug, never searches
    tickets for one that mentions the branch, and never treats "every ticket the branch changed" as
    a fallback. Why git config and not the alternatives: (1) It survives the lossy slug and the
    --branch override, because it is keyed by the real branch name. (2) It is not a file in the
    tree, so setting up a branch can never make the branch "change" its own ticket, which would make
    the "built-for ticket must be one the branch changed" scenario pass vacuously. A field written
    onto the ticket would do exactly that, and writing it on main needs a PR. (3) Every worktree of
    the clone sees it, and finalize always resolves its worktree from the same clone (git worktree
    list). (4) git branch -d/-D and git branch -m delete or move the section along with the branch,
    so a stale record cannot outlive its branch. A finalize argument was rejected as the primary
    source: /finalize-feature <BRANCH> is typed by hand, often in a later session, and an argument
    that has to be remembered is the guess this record exists to remove. If the branch moved the
    recorded ticket, the derivation follows the move (rename detection over the merge-base diff)
    rather than reporting it unchanged.
  - >-
    BRANCHES WITH NO RECORDED TICKET. These are worktrees from create-only (/quick-fix),
    create-fastlane-worktree (fast-lane/<slug>) and create-ac-worktree (ac-authoring/<name>), plus
    any single-ticket worktree created before BO-400e-3-ix shipped. Evaluation order, fixed: first
    the merge base (unknown means undeterminable, reason merge_base_unknown). Then the branch's
    changed tickets and ACs (none means nothing_to_close; no built-for ticket is needed when no
    record could be closed anyway). Only then, for a non-EPIC branch, the built-for ticket (absent
    means undeterminable, reason built_for_unknown). So a docs-only quick-fix or fast-lane branch
    finalizes cleanly with "nothing to close". A fast-lane or pre-existing branch that did change
    tickets or ACs closes NOTHING and says it could not tell which ticket the branch was built for.
    The report tells the person how to record the ticket by hand
    (git config branch.<branch>.leafcutterTicket <path>) and re-run.
  - >-
    THE "CANNOT BE IDENTIFIED" SCENARIO HALTS BEFORE THE MERGE. This record's criteria say only
    "the set is empty and no record changes status". BO-400e-3-viii (amended 2026-10-15, decided by
    BrainCandy) adds the rest: for built_for_unknown and merge_base_unknown, finalization stops
    before the merge to main, prints the fix, and makes no merge dispatch. That halt applies to this
    record's case too. The derive reply's outcome "undeterminable" is the signal finalize-feature.js
    halts on, using the same halt as BO-400e-3-vii's decline. "nothing_to_close" is never a halt.
  - >-
    THE SET IS FIXED BEFORE ANY WRITE AND THE CLOSER CANNOT ADD TO IT. The derive step persists the
    set it printed, with a content digest, to a file under the worktree's git dir (never in the
    tracked tree). The closing step (BO-400e-3-iv) reads only that file, takes no record list from
    its caller, and echoes the digest. finalize-feature.js compares the digest in the derive reply
    with the one in the close reply, and a mismatch is reported as a closure that did not complete.
    This is how the agent that relays the CLI output is kept unable to widen the set.
  - >-
    DETERMINISTIC. The same repository state yields byte-identical stdout: records sorted (tickets by
    path, then ACs by id), no timestamps or absolute temp paths in the set, and the same digest.
  - >-
    THE DISPATCH THAT RUNS THE CLI goes to an agent whose registry entry permits shell (see
    KI-BO-20260927). Its reply is parsed through parseAgentJson. A refused, unreadable or
    schema-invalid reply is "the set could not be worked out" (BO-400e-3-viii, FIN-100h). It is
    never an empty set and never "nothing to close".
  - >-
    Error handling per the project policy. git subprocess failures are caught as specific exceptions
    and reported as an undeterminable outcome with the failing check named. They are never reported
    as an empty set. The module performs no writes during derivation apart from the set file.
  - "Derivation completes within 10 seconds on a store of 5,000 AC records and 2,000 tickets, measured on the CI runner."
delivers_to:
  - agent: python-coder
    contract: >-
      stdout of `finalize_closable_set.py derive --worktree <abs> --branch <name> --base-ref
      <ref>`: a single JSON object {outcome: "closable"|"nothing_to_close"|"undeterminable",
      reason_code: null|"no_records_changed"|"built_for_not_changed"|"built_for_already_done"|
      "all_already_done"|"merge_base_unknown"|"built_for_unknown", branch: str, branch_kind:
      "epic"|"single_ticket", base_ref: str, merge_base: str|null, built_for_ticket: str|null,
      records: [{kind: "ticket"|"ac", id: str, path: str (repo-relative POSIX), status: str}] (sorted
      tickets-by-path then acs-by-id; empty unless outcome is closable), already_done: [str],
      changed_not_closable: [str], set_digest: str (sha256 hex of the canonical records array),
      set_file: str (absolute, under the worktree git dir)}. Consumed by BO-400e-3-iii, -iv, -v,
      -vi, -vii and -viii.
  - agent: python-coder
    contract: >-
      The set file named by set_file, containing exactly the records array and the set_digest. It is
      the closer's only input (BO-400e-3-iv) and the source of the commit path list that
      BO-4500a-5-iv's shared commit step is handed (BO-400e-3-v).
expects_from:
  ac_id: BO-400e-3-ix
  contract: >-
    git config key branch.<branch>.leafcutterTicket in the clone's shared (non-worktree) config,
    holding the repo-relative POSIX path of the ticket .md the branch was set up for. Absent means
    no recorded ticket.
test_required: true
test_spec:
  - name: test_control_branch_own_delivery_is_exactly_the_closable_set
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Real scratch git repo in the BA's background shape (M0, branch feat-close-x recorded for TICKET-X.md, main gains M1 editing TICKET-Y and BO-9200a-1, TICKET-Z and BO-9300a-1 untouched); the derive CLI's records are exactly TICKET-X.md then BO-9100a-1."
  - name: test_main_only_changes_are_excluded_where_two_dot_would_include_them
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Same repo; TICKET-Y.md and BO-9200a-1 are absent from the set. NEGATIVE CONTROL in the same test: assert `git diff --name-only origin/main HEAD` on that repo DOES list TICKET-Y.md, so the fixture is proven able to expose a two-dot implementation."
    must_catch:
      - "compare the branch tree with main's current tree (two-dot git diff origin/main HEAD)"
  - name: test_untouched_records_never_enter_the_set_and_no_store_walk_is_used
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "TICKET-Z.md (status todo, every phase signed off) and BO-9300a-1 are absent; a second variant adds an unchanged ticket inside the epic folder with closable frontmatter and asserts it is still absent."
    must_catch:
      - "walk tickets/00_inbox for open tickets with closable frontmatter"
  - name: test_records_brought_in_by_merging_main_are_not_the_branchs_own
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Branch merges M1 before derivation; set is still exactly TICKET-X.md and BO-9100a-1. Run twice: once with origin/main at M1 and once with the local base ref left STALE at M0, the second being the case only the first-parent own-commit rule survives."
  - name: test_ticket_edited_in_passing_is_not_closed
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Branch also edits TICKET-Q.md (todo, every phase signed off, source_ac BO-9400a-1 todo); set is exactly TICKET-X.md and BO-9100a-1 and TICKET-Q.md is listed under changed_not_closable."
    must_catch:
      - "treat every ticket the single-ticket branch changed as closable"
  - name: test_built_for_ticket_not_changed_by_branch_gives_empty_set
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Record names TICKET-X.md but no branch commit since the merge base touched it; outcome nothing_to_close, reason built_for_not_changed, records empty."
  - name: test_unrecorded_built_for_ticket_closes_nothing_without_fallback
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Same repo with the git config record removed (the pre-existing-worktree case) and the branch named feature/close-x so the slug would reverse to TICKET-X; outcome undeterminable, reason built_for_unknown, records empty."
    must_catch:
      - "reverse the feature/<slug> branch name into a ticket path"
      - "fall back to every ticket the branch changed"
  - name: test_epic_branch_is_bounded_by_its_own_folder
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Branch EPIC-Alpha changes EPIC-Alpha/alpha-01.md and EPIC-Beta/beta-01.md; set contains alpha-01.md and its source AC only, and no AC that is not the source_ac of an in-set ticket."
  - name: test_same_state_gives_identical_output_and_digest
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Two derive runs over the identical repo state produce byte-identical stdout (same order, same set_digest)."
  - name: test_closer_input_is_the_persisted_set_and_cannot_be_widened
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Hand the close step an extra record by every input it exposes (argv, env, an edited set file with a stale digest); it closes only the persisted set and an edited set file is refused, leaving every record unchanged."
  - name: test_finalize_dispatches_the_derivation_and_carries_no_selection_prose
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Drive finalize-feature.js through run_workflow_under_e2 (unit_tests/_workflow_engine_harness.py) with the derivation dispatch answered by the REAL CLI output from the scratch repo; assert the derivation was dispatched, the closing dispatch received no record list of its own, and no recorded dispatch prompt in Step 3.5 contains `git diff --name-only origin/main HEAD` or a candidate-finding instruction."
  - name: test_derivation_cli_runs_from_the_deployed_layout
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: deployed
    description: "Using the shared_reference_layout fixture (marked shared_layout_reader), run the deployed scripts/build_orchestration/finalize_closable_set.py against the scratch repo and get the same output as the source copy (no ModuleNotFoundError)."
test_rationale: >-
  The defect is a wrong set produced by a real git history: main moving after the branch point, a
  merge of main, an in-passing edit. A unit test over a mocked diff would reproduce whatever
  assumption the implementer made about git, so every behavioural test builds ONE real scratch
  repository in the BA's exact fixture shape and runs the real CLI against it. The two-dot negative
  control is in the test itself, so the fixture is proven able to expose the original defect and the
  test cannot pass vacuously. The stale-base variant exists because the merged-in-main scenario
  passes under a fresh origin/main with plain three-dot and fails only when the base ref is older
  than the merge. Workflow wiring is proven by driving finalize-feature.js through the existing E2
  harness with the real CLI output as the scripted reply, never by grepping the source (CLAUDE.md,
  "Gate / Workflow ACs: Verify Behaviorally, Not by Grep"). The deployed-layout test guards the
  deploy-manifest trap.
