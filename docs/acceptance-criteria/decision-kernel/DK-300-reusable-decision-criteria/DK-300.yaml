notes: |
  SOURCE REQUESTS (the user's, for traceability):
    - Original idea: the kernel often uses a similar decision basis and should
      reuse it; store and reuse categories, not only decisions; start by mining
      them; put them in a new file type (evaluated, see below) and also into
      Neo4j; make sure they can be clustered; only use LLMs to generate further
      categories when Jev thinks some are missing for a better decision.
    - 2026-10-02, decided by the user directly (NO decision record exists for
      this): mine from BOTH Langfuse traces AND published decision records.
    - 2026-10-02: the PO, BA and IT PO file the ACs on decision
      dec-93c1c730463c1f3c, and every AC links to it (doc_links, relationship
      governs).

  SETTLED. Do not re-open these at L2:
    1. The file type is dec-93c1c730463c1f3c, option
       opt.category_records_membership_refs.
    2. Mining reads both sources (the user requirement above).
    3. Mining is an offline job that produces CANDIDATES for human approval.
       The kernel never reads Langfuse on the hot path (ADR-058 section 6,
       ADR-056).

  STILL OPEN: the clustering method (DK-300b). Treat it as a needed capability
  with no method chosen yet.

  DISTINCT FROM PRECEDENT REUSE. The decision-retrieval flow reuses an earlier
  ANSWER: a whole published decision used as precedent. This goal reuses the
  earlier QUESTIONS: the criteria a decision is judged by. The two complement
  each other and neither replaces the other. Like a precedent, a reused category
  is evidence, never authority (ADR-060).

  WORDING MAP FOR BA / IT PO (customer word -> record term):
    - "question" -> a criterion inside a decision record (criteria[].question)
    - "category" -> a criterion category record (kind criterion_category)
    - "preferred wording" / "other wordings" -> pref_label / alt_labels (SKOS)
    - "broader category" -> broader
    - "shared library" -> the published category records
    - "review of past decisions and run history" -> the offline criteria-mining job
    - "learning store" -> the optional Neo4j colony memory store (ADR-065)
    - "project's knowledge graph" -> a Neo4j projection of the reviewed records
      (the ADR-062 projector; ADR-062 sits on the unmerged branch
      feature/knowledge-retrieval-v01)

  ROADMAP ALIGNMENT. Anchored at phase_kernel_2_knowledge ("reusable retrieval
  memory, so evidence is assembled before a specialist model is called"). That
  phase is planned, not active. The active kernel phase is
  phase_kernel_1_founding, and its exit criteria do not mention reusing
  criteria. DK-300f is anchored at phase_colony_1_collect. No roadmap change was
  made; the fit is flagged to the user.

  NON-GOAL. Using outcome statistics to choose or rank which categories are
  offered would let colony memory influence behaviour. That belongs to the
  INFLUENCE step after held-out evaluation (ADR-056 section 3,
  phase_colony_4_influence), not to this goal.

  COMPONENT DRIFT. colony_memory belongs in components (DK-300f), but the
  components enum in config/ac_store_schema.json does not contain it, although
  docs/components.json does. It is omitted until the enum is fixed.

  NAMESPACE. decision-kernel (DK). DK-100..DK-104 (superseded L2s) and DK-200
  (context enrichment) exist, and DK-300 was the next free hundred. A search of
  the whole store found no existing AC on reusing criteria.
