      exact outcome `test_filesystem_dependent_journaling_produces_zero_
      records_under_the_harness` exists to certify is impossible. Fixed with
      `Object.setPrototypeOf(__sandbox__, null)` before `vm.createContext()`.
      Verified closed for the primary route plus every sibling route the
      review named (`globalThis.__proto__...`, `({}).constructor.
      constructor`, the AsyncFunction and GeneratorFunction constructors) and
      for the exact file-write scenario, all in the new
      unit_tests/workflows/test_bp_1100b_4_sandbox_fidelity.py — each
      confirmed RED without the fix (direct execution, not a comment) and
      GREEN with it.

      The review also found strict mode was silently lost (F4): the pre-vm
      harness spliced the target body into a file whose first line is
      `'use strict';`, so the body inherited it; `vm.runInContext` compiles
      the body as a SEPARATE source unit with no directive prologue, so an
      undeclared assignment silently created an implicit global instead of
      throwing. Invisible to a line-level deletion audit — no line was
      deleted to cause it, the loss came from splicing into a NEW source unit
      rather than the old one. Fixed by prefixing `inner_source` with
      `'use strict';` in `_build_shim()`. Verified RED then GREEN in the same
      new test file.

      The review also found the injected-globals enumeration test (F6)
      checked 8 names present and 6 names absent rather than truly enumerating
      the namespace, and that the set was hand-typed a second time in
      test_bp_1100b_4.py in direct violation of this AC's own "declared ONCE"
