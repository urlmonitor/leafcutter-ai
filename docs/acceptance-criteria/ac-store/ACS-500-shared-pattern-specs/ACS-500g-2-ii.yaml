readiness: approved
priority: high
title: "A how-to guide walks a reader from a noticed repetition to a referenced pattern"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a reader who has noticed the same behavior specified in three ACs and has
    never promoted a pattern before,
  When they follow the how-to guide for promoting a pattern,
  Then the guide takes them through, in order: applying the four pattern-worthiness
    rules, naming the slots, writing the parameterised body, writing the pattern
    record, and converting the source ACs to reference it,
  And the guide shows one worked example end to end, with the before state (three
    standalone specs) and the after state (one pattern plus three references with
    their bindings),
  And the guide states how to run the store-wide retrospective sweep and how to
    read its candidate list,
  And the guide points at the authoring-patterns skill as the place the rules live
    rather than restating the rules itself.
depends_on: [ACS-500g-2, ACS-500g-1, ACS-500g-4, ACS-500g-5]
