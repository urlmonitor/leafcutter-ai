criteria: |
  Given the probe findings of GE-129a-1 and the behaviours of GE-129a-2, GE-129a-2-i, GE-129a-3,
    GE-129d-1 and GE-129d-2,
  When a reader opens the hooks reference,
  Then its hook input contract lists the agent identifier (agent_id) and the agent name
    (agent_type), and the permission mode, each with when it is present as the probe observed it,
    for the top-level session, an Agent-tool subagent, a workflow-dispatched agent, a nested
    subagent and a session launched by name, and the Claude Code version observed,
    And its hook catalogue has an entry for the commit guard naming what it matches and what it
    decides,
    And it holds one table of callers -- commit specialist subagent, any other subagent, top-level
    session in each observed permission mode, session launched under the commit specialist's name,
    caller whose identity cannot be established -- each with its outcome for a commit: goes ahead,
    prompted, or refused,
    And its Bypass / Escape Hatches table no longer lists any way to authorise a commit.
