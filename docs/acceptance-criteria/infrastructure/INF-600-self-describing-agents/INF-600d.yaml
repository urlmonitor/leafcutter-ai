criteria: |
  A per-agent spawn and dependency diagram showing orchestration position.

  Each agent card includes a diagram showing which agents or supervisors
  can invoke this agent, which agents this agent can spawn, and where it
  sits in the overall orchestration hierarchy. You can trace any agent's
  place in the pipeline without scanning the full spawn graph.
