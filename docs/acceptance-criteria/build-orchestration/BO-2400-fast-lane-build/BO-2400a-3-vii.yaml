title: "Unavailable git metadata fails the red-baseline gate closed"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the red-baseline gate cannot determine the worktree's merge-base with origin/main
    — the origin/main reference is missing, the directory is not a git worktree, or the
    git query fails,
  When the gate runs for the batch,
  Then it does not fall back to treating every covering test as newly-added, and does not
    fall back to any agent-reported list of written test files,
  And it returns a halt verdict whose reason is baseline_partition_unavailable and which
    names the git query that could not be answered,
  And the coder agent is not dispatched.
depends_on: [BO-2400a-3, BO-2400a-3-ii]
