id: ACS-1200a-2-i
components:
  - ac_store
  - commit_guardian
title: "A parked marker exempts only the record it is set on, never the records beneath it"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200a-2.yaml
criteria: |
  Given KM-200.yaml carries parked: true with a non-empty parked_reason and an
    empty covered_by,
  And its child KM-200a.yaml carries no parked field, has its own child
    KM-200a-1.yaml, and does not list KM-200a-1 in its covered_by,
  And KM-200.yaml, KM-200a.yaml and KM-200a-1.yaml are all staged,
  When the parent-back-link check is executed as a process against that staged
    set,
  Then the process exits non-zero,
  And it reports exactly one violation, naming KM-200a-1 as the child and
    KM-200a as the parent that does not list it,
  And it reports no violation for KM-200a, whose own parent KM-200 carries the
    marker,
  And the marker on KM-200 is not applied to KM-200a: a mixed tree yields one
    exempted link and one enforced link in the same run.
depends_on:
  - ACS-1200a-2
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: related
    status: exists
    relevance: "Parent-derivation algorithm the exemption lookup must reuse — the marker is checked on the derived parent only, not walked up the ancestry."
  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
    relevance: "Hook execution model: one process per staged set, all violations collected in a single run."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The exemption predicate is evaluated per staged child against the id returned by derive_parent_id for THAT child (scripts/ac_store/ac_parent_id.py). It must never walk further up the ancestry, and must never cache a marker found on one parent and apply it to a different parent in the same run."
  - "The run must not short-circuit on the first exemption or the first violation: the hook collects and reports every violation for the whole staged set, so a mixed tree yields one exempted link and one enforced link from a single process invocation."
  - "The exemption is granted by a marker found on an existing derived PARENT record only. A marker a record carries about itself grants that record nothing (the reciprocal rule ACS-1200b-2-i states for the orphan scan); both surfaces must apply the same directionality so they cannot disagree."
  - "Coverage must execute the hook as a process against a real staged git index and assert the exact violation set, not only the exit code — a check that silences the whole staged set still exits non-zero here if any one violation survives."
test_spec:
  - name: test_mixed_tree_exits_nonzero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Hook executed as a process over the three staged records exits non-zero."
  - name: test_exactly_one_violation_naming_child_and_its_parent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Exactly one violation is reported, naming KM-200a-1 as the child and KM-200a as the parent that does not list it."
  - name: test_no_violation_for_child_of_marked_parent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "KM-200a is not reported, because its own derived parent KM-200 carries the marker."
  - name: test_marker_not_inherited_by_intermediate_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The marker on the root grants KM-200a no exemption for its own missing back-link — one exempted link and one enforced link in the same run."
