criteria: |
  Given a run whose root went ahead as one decision,
  And a work item at depth 1 below the root holds the decision question of mock record
    dcp-split-bounds-mid-run: "Decide the bounds for a split: how many sub-questions one split may
    propose, how many child decisions one run may start, and whether children may run in
    parallel.",
  When the run reaches that work item,
  Then a split is started for that work item with subject kind decision_question, found mid-run,
    work-item depth 1 and no routing trigger,
  And the split's subject is the work item's question exactly as it stands, not the root goal,
  And the work item does not go ahead as one decision while its split is proposed and unanswered,
  And the split goes to the same split gate as a split found at routing.
