test_intent:
  - clause: 'the post-merge run is not green, and its verdict is did-not-complete with the stage named as the live-database start-up, worded differently from both a test failure and the correctness lane''s own did-not-complete stages'
    needs_test: true
    reason: A start-up failure read as nothing failed would report green, so the verdict and its distinct stage must be observed for the produced ending.
  - clause: 'no live-database test is reported as failing by node id for that run, so the notice, the held pull request''s comment and the hold''s output say "the live-database tests never ran" and never show a "failing tests" heading over connection errors'
    needs_test: true
    reason: Connection errors listed as regressions is the second misleading form this record exists to prevent, and only rendered output shows it.
  - clause: 'a database that fails to become healthy only on the retry''s fresh machine makes the run did-not-complete, never green and never "passed on retry"'
    needs_test: true
    reason: A retry job that executed nothing could be read as zero remaining failures and so as passed on retry.
  - clause: 'the notice lifecycle treats this ending as TQ-600a-13-v treats every did-not-complete ending: it raises the notice when none is open, updates the open one otherwise, closes no notice and lifts no hold'
    needs_test: true
    reason: A new stage value that the notice does not recognise could fall into a close or no-op branch, which only the notice write plan reveals.
  - clause: 'a correctness lane that was green in the same run does not turn the run green while the live-database lane did not complete'
    needs_test: true
    reason: Combining lanes is verdict logic where a wrong precedence would let the green lane win.
  - clause: 'each of these is demonstrated by producing the ending — a database instance that is started and never answers, and one that answers its health probe and then refuses the first connection — and observing the verdict, its stage and the notice write, never by reading the workflow''s health-check settings'
    needs_test: false
    reason: This clause prescribes how the other clauses are demonstrated rather than stating an outcome of its own.
