  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The refusing branch must not invoke the release step. Releasing on a run that never claimed would flip acceptance criteria a concurrent run legitimately holds in_progress back to todo (BO-2400f-8), handing the same work to two runs."
    - "The store assertion is made against real files on disk, before and after the run, not against an in-memory record set the run happened to hand back."
delivers_to: null
expects_from:
  ac_id: BO-2400f-12
  contract: "The refusal branch — the point at which the run ends on an unproducible resolved set, before the claim step."
test_required: true
test_spec:
  - name: test_refused_run_leaves_every_work_status_unchanged
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "An on-disk fixture store is snapshotted, the lane is run against a target whose set contains an unproducible member, and every acceptance-criteria file in the resolved set is byte-identical afterwards."
  - name: test_refused_run_does_not_dispatch_the_release_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Executed under the E2 harness, a refusing run records no release dispatch and no claim dispatch — it neither takes nor returns a claim."
  - name: test_refusal_is_repeatable_and_inert
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "Running the same refusing target twice against the same fixture store produces the same named refusal both times and leaves the store byte-identical after each run."
test_rationale: |
  The whole point of this criterion is a negative — that nothing happened. A test that
  greps the refusing branch for the absence of a call proves nothing, because the write
  can happen in a helper the grep never sees. Prove it the only way that holds: execute
  the run under the harness for the dispatch assertions, and diff a real on-disk store
  before and after for the state assertions. The repeatability test is what catches the
  half-fix in which the refusal writes something small — a status stamp, a marker file —
  and only diverges on the second run.
