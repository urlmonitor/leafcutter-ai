- 'Use the command names as built. IT PO defaults: python -m kernel criteria mine, python -m kernel criteria review, python -m kernel decisions publish --run-id R (which also publishes criterion categories), python -m kernel criteria validate and criteria index. Check each against --help before the guide is published.'
- 'Describe grouping as dec-a070edfb6465bced decided it: exact matches by code, one Jev choice per wording, merges only at p >= 0.8, code-made one-member candidates, no LLM, no broader-link suggestions.'
- Every step names the observable result to check (a JSON field, a file path or an exit code).
- Write it only after DK-500a-1, DK-500c-1, DK-500c-2 and DK-500c-3 are implemented. The guide documents behaviour and closes no behavioural AC.
