  - "Must preserve all existing S1 instructions — the knowledge-query step is additive"
  - "Must specify the exact Bash invocation syntax per the knowledge-query SKILL.md"
  - "Must not introduce dependencies on tools not already in the agent's allowed-tools list"
  - "Must position the knowledge-query step after the AC file reads but before the agent registry read, so graph results can supplement registry data"
  - "Must not violate ADR-009 — the added instructions must not direct the IT PO to read source code files"
