id: TQ-500g-3-iii
components:
  - testing_quality
  - build_orchestration
title: "An existing test the work changed that now asserts less, compares more loosely, or tolerates more stops the work, even when listed as strengthened"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given eleven tests in test_retry.py that existed before the work began, each
    still present and passing after the work, and the work's sweep list
    naming all eleven as strengthened —
      F: test_backoff_caps_at_five had three assertions
           assert delay == 5, assert attempts == 3, assert log.called
         and after the work has two (assert log.called is gone),
      G: test_first_delay asserted delay == 1 and now asserts delay >= 1,
      H: test_no_result asserted result is None and now asserts
           result in (None, ""),
      K: test_ok_status asserted response.status == 200 and now asserts
           response.status,
      I: test_jitter_bounds compared jitter == pytest.approx(0.5, rel=0.01)
         and now compares jitter == pytest.approx(0.5, rel=0.1),
      L: test_rejects_negative_delay checked with pytest.raises(ValueError)
         that compute_delay(-1) is refused, and the pytest.raises block is
         gone, leaving a plain call,
      J: test_retry_header asserted header == "Retry-After: 5" and now also
         asserts "5" in header, keeping the first assertion,
      M: test_retry_after_header asserted header == "Retry-After: 5" with no
         condition around it, and now the same assertion sits under
         if header:, so it is skipped whenever header is empty,
      N: test_backoff_resets asserted delay == 1 and attempts == 0 with
         nothing before them that could end the test, and now a return is
         inserted above both assertions when not retried, leaving them in
         place but unreachable on that path,
      P: test_parse_header already had its only assertion
           if raw: assert parsed == "5"
         at the base, keeps it under the same if, and changes only the
         input string,
      Q: test_retry_count kept assert attempts == 3 with no condition and
         adds if log.called: assert log.call_count == 1 beside it,
  When the work's tests are checked before commit,
  Then the work stops, naming each weakened test as <file>::<test> with its
      reason:
        test_retry.py::test_backoff_caps_at_five  fewer assertions (3 to 2),
        test_retry.py::test_first_delay           comparison loosened
                                                  (== became >=),
        test_retry.py::test_no_result             comparison loosened
                                                  (is became in),
        test_retry.py::test_ok_status             comparison loosened
                                                  (== removed),
        test_retry.py::test_jitter_bounds         tolerance widened
                                                  (rel 0.01 to 0.1),
        test_retry.py::test_rejects_negative_delay fewer assertions (1 to 0),
        test_retry.py::test_retry_after_header    assertion now conditional
                                                  (under if),
        test_retry.py::test_backoff_resets        assertion after an early
                                                  return,
    And J, P and Q are not reported (P's assertion was conditional before the
      work and still is; Q's new conditional assertion sits beside the
      unconditional one, which stays unconditional),
    And an assertion that had no condition at the base is reported as now
      conditional in the same way when, after the work, it sits inside a
      while loop, inside a try (including one whose failure is swallowed by
      except AssertionError: pass or except Exception: pass), or inside a
      function, lambda or class nested in the test that was not there at the
      base, naming which (for example "assertion now conditional (under
      try)"),
    And an assertion that nothing could cut off at the base is reported as
      after an early return or skip in the same way when, after the work, a
      newly added return, pytest.skip(...), pytest.xfail(...) or raise
      SkipTest / raise unittest.SkipTest comes before it in the same test,
      naming which (for example "assertion after an early skip"),
    And the sweep list marking F, G, H, K, I, L, M and N as strengthened does
      not prevent the stop,
    And the same changes in a test that the sweep list does not name are
      reported the same way, alongside the unlisted edit,
    And the decision is taken from the code of each test before and after the
      work, without running the tests and without a language model, so the
      same work gives the same result every time.
