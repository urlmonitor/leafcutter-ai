assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    cycle_adjacent_equivalence_guard:
      type: object
      description: "A constructed store fixture with a cycle, a cycle-dependent record, and a record reachable only through a cycle member. The guard asserts the resolved ordered id list is identical before and after the reading consolidation, and that the record set handed to the tree walk still contains the drained cycle members."
  reference_file_path: "unit_tests/build_orchestration/"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "The fixture is constructed in the test, written to a temporary directory as real YAML files serialised the way the store is actually written. Do not point the guard at docs/acceptance-criteria — that store is acyclic, so the guard would exercise nothing."
    - "The pre-change answer must be captured from the resolution as it behaves BEFORE the consolidation lands and recorded as the expected value, so the guard compares against observed prior behaviour rather than against what the author believes the answer should be."
    - "This guard lands with, or before, the consolidation change — never after it. A correctness guard authored after the change it guards is written against whatever the change happened to do."
delivers_to: null
expects_from:
  ac_id: BO-2400c-6
  contract: "The consolidated reading path — a tree walk fed a caller-supplied record index — whose equivalence with the prior behaviour this guard establishes."
test_required: true
test_spec:
  - name: test_cycle_adjacent_subtree_resolves_identically
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "On the constructed cyclic fixture, the resolved ordered id list matches the answer recorded from the pre-consolidation behaviour, member for member and in order."
  - name: test_record_reachable_only_through_a_cycle_member_is_not_lost
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "The record reachable from the target only by passing through a cycle member appears in the post-change answer whenever it appeared in the pre-change answer."
  - name: test_cycle_diagnostic_still_reported_after_consolidation
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "The resolution against the cyclic fixture still reports the cycle it found; consolidating the reading did not silence the diagnostic."
test_rationale: |
  This is the guard that separates a performance fix from a phantom-done regression.
  The naive consolidation — hand the resolver's existing index to the tree walk — is
  wrong in exactly one situation, produces no error, and returns a smaller build set.
  Nothing in the current suite would fail, because every existing test resolves against
  an acyclic store, and the live store is acyclic too.

  So the fixture is the whole test. A guard written against docs/acceptance-criteria
  would be green today, green after the regression, and green forever — the most
  expensive kind of test, because its presence is taken as coverage. Constructing the
  cycle is what makes the assertion mean anything.
