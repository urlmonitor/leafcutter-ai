test_rationale: "This AC's entire content is the behaviour of two real gates over three real repository states, including one state whose correct outcome is a pass. A direct-import unit test would hand each gate a pre-built inventory and would therefore assert nothing about the vacuity boundary — the finding this AC exists to carry. Worse, the state-one assertion is a claim about the INTERACTION of two independently-implemented gates (forward check silent, done-proof refusing); only executing both over the same fixture tree can establish it. The tests build each state as a real tree with an argparse surface and an automation script and drive the production entry points."
