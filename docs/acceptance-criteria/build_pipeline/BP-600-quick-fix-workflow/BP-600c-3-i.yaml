notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  THIS RECORD WAS NEVER FALSELY DONE — THE STORE WAS HONEST HERE. It carried
  work_status: todo for its whole life, correctly, because nothing implemented
  it. What went wrong was the reverse of phantom-done: its parent BP-600c-3 was
  marked done, so a reader who stopped at the parent would not have seen that
  this constraint on it was unbuilt. The defect was real — a fix that repaired
  its own test while breaking a neighbour reached the commit phase unchallenged,
  and the mutation proof does not catch it, because coupling-to-the-fix and
  collateral-damage are different questions.

  work_status is left at todo per the instruction not to change it, but that
  value is now stale in the safe direction: the behaviour is implemented in
  templates/workflows-js/quick-fix.js and covered by the two tests named in
  covered_by, each mutation-proved. Promoting it to done is a decision for the
  owner.

  OPEN TENSION IN THIS RECORD'S OWN it_requirements. The fourth entry says
  discovery "must use import/reference analysis, not directory-based
  heuristics", but the shipped discovery instruction also accepts tests that
  "live in the test directory that mirrors its package" — which is exactly a
  directory-based heuristic. It is kept in the requirement rather than quietly
  relaxed, because the requirement's reason is sound: a mirrored-directory
  match finds tests that never exercise the changed code and misses tests that
  do. Either the instruction should drop that clause or the requirement should
  be amended to permit it as a fallback. The fifth entry, a 10-second scan
  budget, is likewise unenforced and unmeasured by anything in the workflow.
