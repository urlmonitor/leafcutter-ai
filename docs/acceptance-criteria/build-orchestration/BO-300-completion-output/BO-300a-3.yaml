criteria: |
  Given build-epic.js returns a result object with `message`, `worktree_path`, and `manual_tests` fields,
  When build-feature.md processes the "On ok" block for epic completion,
  Then it renders the summary section from the result message,
  And it renders the worktree path section from `worktree_path`,
  And it renders the manual tests section from `manual_tests`,
  And it renders the finalize command section with the epic name pre-filled,
  And all four sections are presented to the user in the standard order.
depends_on: [BO-300a]
