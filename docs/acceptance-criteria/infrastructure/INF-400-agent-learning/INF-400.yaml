criteria: |
  Accumulated project knowledge makes each run better than the last.

  The more you use the system, the better it understands your project.
  Agents remember what they learned about your codebase, your preferences,
  and your domain conventions. They start each run informed, capture new
  discoveries automatically, and share knowledge across the pipeline. You
  never have to re-explain the same thing twice.
