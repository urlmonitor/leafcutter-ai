id: GE-125d-1
components:
  - security_scanner
  - commit_guardian
title: "A run that withheld a finding says how many and in which files, and never prints the value it withheld"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a throwaway git repository whose staged set is three files:
    "docs/retrospectives/2026-08-19-incident.md", carrying an opaque
    credential-shaped value with no recognisable keyword and no recognisable
    prefix on each of its 12th and 40th lines;
    "templates/skills/example-skill/scripts/helper.py", carrying one such value
    on its 7th line;
    and "src/app.py", carrying one such value on its 5th line,
  And the first two of those paths sit under locations to which this check
    applies reduced scrutiny and the third does not — a placement chosen
    deliberately, because the behaviour under test IS the announcement of that
    reduction, and a control file outside those locations is what keeps the
    scenario from passing on a check that announces everything,
  And no suppression entries are in force,
  When the staged set is checked on the path a real commit takes,
  Then a notice is written to the error stream that names the check, states that
    3 findings were withheld from the report across 2 files, and gives for each
    of those 2 files its repository-relative path, how many findings were
    withheld in it, and a stable name for the reduction that withheld them,
  And the value found in "src/app.py" is reported as a finding in the ordinary
    way and that file does not appear in the notice,
  Because a reduction nobody is told about is indistinguishable from a file that
    was read and found clean, and that indistinguishability is what let a
    whole-file exemption compiled into this check survive from the day it
    shipped until someone read the source.

  Given the same staged set, and a distinctive marker string embedded inside
    each of the three withheld values,
  When the staged set is checked on the path a real commit takes,
  Then that marker appears nowhere on the error stream and nowhere on the output
    stream,
  And neither stream carries the matched line, or any excerpt of it, for any
    withheld finding,
  Because a notice that reproduced the value the check declined to judge would
    write a candidate credential into the terminal, into whatever captures that
    output, and into any log that keeps it — turning a protection notice into
    the disclosure it exists to prevent. The absence of the marker is the
    assertion; matching the expected notice text is not, because expected text
    still matches when the value has been printed alongside it.

  Given a staged set consisting only of the two files under locations to which
    reduced scrutiny applies, with 3 findings withheld between them and nothing
    else reported,
  When the staged set is checked on the path a real commit takes,
  Then the notice is written exactly as above,
  And the run's exit status is success — the notice does not block the commit,
  Because this criterion is a visibility promise and not a blocking one, and
    that is decided here explicitly rather than inherited as a default. This
    check runs on every commit; a withheld finding is evidence of an unexamined
    region, not of a credential. Blocking on it would stop ordinary commits
    across a store of thousands of prose files, and the predictable response
    would be to switch the check off — the outcome this goal exists to prevent.
