notes: |
  MEASURED 2026-08-17 (BA, independently, matching the PO's count): 333 work-item files, 328
  distinct identifiers, 5 held twice. Four are intake + completed
  (TICKET-20260603-ConfigDrivenBuildPaths, TICKET-20260603-FeedbackAnalysisPipeline,
  TICKET-20260604-PullRequestAgentProjectContext, TICKET-20260605-ContractShrinkingSelfExclusion);
  one is intake + active (TICKET-20260629-BP-1200a-1-ii).

  THE SURVIVOR RULE IS TAKEN FROM THIS PROJECT'S EXISTING CONVENTION rather than invented: the
  declared state is authoritative and folder position is not. Four of the five pairs almost
  certainly resolve to the completed copy — the work is done and an intake copy was left behind —
  but the criterion is written to be decided by the declared state in each case rather than by
  that assumption, because assuming it is how the wrong copy gets deleted.

  THE CONTENT CLAUSE EXISTS BECAUSE THIS IS A DELETION. Two copies of a work item that have
  drifted may each hold something the other lacks — sign-off comments, a status history. The
  point of the repair is that one identifier means one thing, not that half the record
  disappears.

  ORDER MATTERS: run this repair BEFORE the work-item stage of the uniqueness guard becomes
  blocking, or every commit is stopped by five pre-existing conditions the author did not create.
  GE-120e-3 is the check that the ordering worked.
