notes: |
  THE CRITERION BINDS TO THE ANSWER REACHING SOMEONE, NOT TO THE JOB HAVING
  EXECUTED — this is the L1's explicit instruction and it is the whole difference
  between this AC and a cron entry. A scheduled job that runs, exits, and writes
  its output to a log nobody opens reproduces today's silence at higher cost.

  THE THIRD Then IS THE NOISE-VERSUS-MISS TRADE, MADE EXPLICIT. The L1 names noise
  as the failure mode to design against, which argues for saying nothing when
  there is nothing to say. But a delivery channel that is silent on a clean run is
  indistinguishable from a channel that has broken — and a broken channel is
  exactly how a store rots unobserved for fifteen months. The resolution is a
  recorded clean run rather than a broadcast one: the record exists, the reader is
  not interrupted.

  WHY A SEPARATE INSTRUMENT FROM ACS-1400a, RESTATED SO IT IS NOT COLLAPSED. A
  commit-time check is handed one commit's staged set; the fact in question is a
  property of the whole store. Even a perfect ACS-1400a is blind to a record
  nobody is touching. Measured 2026-09-08: of the 47 current orphans, none is
  under active edit, so a per-commit instrument would have surfaced none of them
  today.

  THE CADENCE AND THE DESTINATION ARE NOT SETTLED HERE. They are a choice, and the
  criterion is written to hold for any choice that satisfies it.
