assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The reaped tree must be derived from the build's resolved target root for the run in progress, and must be expressible as one derivation serving both layouts. Verified on disk 2026-09-07: `clean_stale_artifacts` computes `claude_dir = target_dir / '.claude'` (build_phases.py:3787) and then joins `_MANAGED_ARTIFACT_DIRS['workflows'] == '.claude/workflows'` (:3752) onto it. That doubled segment belongs to BP-100b-3 / KI-BP-010 and must not be re-diagnosed or re-fixed here."
  - "KI-BP-010's stated premise -- that the doubled path 'never exists, so the loop continues every time' -- is FALSE in the self-hosting layout and this AC exists because of it. `/home/henzeh/projects/leafcutter/.claude/.claude` is a symlink to `/home/henzeh/projects/leafcutter/leafcutter-ai/.claude` (verified, `ls -la`, created 2026-06-17) and that target holds nine real workflow files. So the reaper is currently aimed at the PACKAGE's own tree. Correcting the join without bounding the blast radius converts a silent no-op into a cross-tree deletion. Bound the radius in the same change, not after it."
  - "Before any deletion, the candidate path must be asserted to lie under the resolved target root AFTER symlink resolution of both sides. A candidate resolving outside it is a fault to surface, never a file to delete. Resolve-then-compare, not compare-then-resolve: string-prefix comparison on unresolved paths is what lets a link escape the bound."
  - "No layout-specific conditional. There must be no self-hosting-versus-adopter branch in scope resolution -- both layouts are served by one target-root derivation, or the criteria's 'no layout-specific special case' clause is unmet regardless of the observable outcome."
  - "Where a scope location is reached through a symbolic link, resolve it and walk the files it actually contains, and count those files in the reported scope. Declining to walk a link and continuing silently is the vacuous all-clear arriving by a different route; it is BP-1500b-3's scope count that goes wrong, so the two must be implemented together."
  - "The package's own source tree (templates/, and the package checkout generally) is never a deletion target under any layout, including the self-hosting one where it sits inside the workspace being built."
test_spec:
  - name: test_bp_1500b_1_i_a_self_hosting_rebuild_leaves_the_adopter_tree_untouched
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: boundary
    description: "Stand up two installed trees under one tmp root -- one self-hosting (package inside the target, installing into its own root) and one ordinary adopter -- both carrying the retired workflow. Rebuild the first; assert the second's tree and the package sources are byte-identical afterwards."
  - name: test_bp_1500b_1_i_an_adopter_rebuild_leaves_the_self_hosting_tree_and_package_sources_untouched
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: boundary
    description: "The mirror of the first: rebuild the adopter install; its orphan is gone and nothing in the self-hosting tree or in templates/ changed."
  - name: test_bp_1500b_1_i_both_layouts_reach_the_outcome_through_the_same_invocation
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: criterion
    description: "Parametrised over the two layouts with identical build arguments: each rebuild removes its own orphan. Behavioural, not structural -- it proves one code path serves both rather than grepping for the absence of a branch."
  - name: test_bp_1500b_1_i_a_symlinked_scope_location_is_walked_and_its_files_counted
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: seam
    description: "Point a scope location at a symlink whose target holds N artifacts (the .claude/.claude shape observed on disk). The sweep classifies those N files and the reported scope count includes them; a run that finds nothing there and continues fails."
  - name: test_bp_1500b_1_i_a_candidate_resolving_outside_the_target_root_is_surfaced_as_a_fault_not_deleted
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: failure
    description: "Plant a link inside the scope whose target resolves outside the resolved target root. The file survives, and the run reports a fault on the build's fault channel rather than removing it or passing silently."
  - name: test_bp_1500b_1_i_the_package_source_tree_is_never_a_deletion_target_in_the_self_hosting_layout
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Reproduces the observed geometry directly: the doubled path resolves into the package's own .claude holding nine real workflow files. After a self-hosting rebuild those nine are decided by the target's own scope, and no file under the package checkout is removed."
test_rationale: |
  THIS AC IS ENTIRELY ABOUT WHAT IS *NOT* TOUCHED, so its coverage has to be
  a pair of trees on one filesystem and a byte-comparison of the one that was
  not the subject of the run. A single-tree test cannot express "never a
  second tree on the same machine" at all -- there is no second tree in it to
  survive. That is why every entry here is an integration test over a
  two-tree fixture rather than a unit test of a path helper.

  A UNIT TEST OF THE PATH JOIN WOULD BE THE WRONG COVERAGE FOR A SECOND
  REASON: it would test BP-100b-3's defect, which this AC deliberately does
  not own. Asserting `claude_dir / '.claude/workflows'` is malformed proves
  nothing about blast radius; the dangerous case is the CORRECTED join
  reaching a real second tree, which only exists once two trees do.

  THE SYMLINK ENTRIES ARE NOT DEFENSIVE PADDING. The self-hosting workspace
  reaches its second tree through `.claude/.claude`, a real symlink verified
  on disk, and reaches its own artifact directories through shim symlinks. A
  fixture built from plain directories would be green while the real layout
  deletes across trees, which is the exact synthetic-fixture bias recorded in
  this repo's own retrospectives.
delivers_to: null
