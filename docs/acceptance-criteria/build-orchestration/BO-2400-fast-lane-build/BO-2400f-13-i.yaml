notes: |
  This is the case KI-BO-015 calls the more serious half: a build tool that cannot be
  re-run on the same input. At the time of authoring, worktrees/bo-1500a-5,
  worktrees/bo-2400e-3 and worktrees/bo-2900g-3 are all present on fast-lane branches,
  so re-running those three acceptance criteria aborts at the first phase today.

  The second scenario is where a plausible-looking wrong implementation lives. "Reuse
  the workspace" and "refresh it first" both look like helpfulness and both break
  BO-2400f-3's promise of the latest mainline — the operator would get a green result
  measured against a mainline that no longer exists, with no way to notice. Clearing it
  automatically is worse and was explicitly deferred by the Product Owner: the
  provably-clean-and-already-landed shortcut is a possible future criterion, not part of
  this one.

  IT enrichment note, 2026-08-25 (it-po), on the pull-request half — said plainly rather
  than specified into something that cannot be built. "Did that attempt open a pull
  request" has no cheap, reliable local answer. `setup_ticket_worktree.py` shells out to
  `git` and nothing else today; asking `gh pr list --head fast-lane/<slug>` would add a
  network round trip to the lane's FIRST-phase check, a `gh` binary dependency, and an
  auth surface this repo is already known to trip — an EMU-blocked account makes `gh`
  fail for reasons that have nothing to do with whether a pull request exists.

  So the criterion is met in two parts. The load-bearing, mandatory signal is LOCAL:
  `git rev-parse --verify --quiet refs/remotes/origin/fast-lane/<slug>` answers "did that
  attempt push its branch", which is what actually separates the residue of a finished
  run from the debris of one that died, and it is deterministic and testable without a
  network. The pull-request URL itself is best-effort, timeout-bounded and OPTIONAL; when
  it is not obtained the payload says `pr_lookup: unavailable` or `not_attempted`. What is
  NOT acceptable is rendering either of those as "no pull request was opened" — that is
  the same silent false negative as reporting an unread workspace as clean, and it is the
  reason `pr_lookup` is three-valued instead of `pr_url` simply being nullable.
