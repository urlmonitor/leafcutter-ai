notes: |
  The consumer half of BUG-01. BO-1900a-4 makes the resolver honest; this AC makes the
  honesty load-bearing.

  WHY BOTH ARE NEEDED. An honest marker that no consumer checks is a comment. In the
  observed run the wrong value was harmless only because the next step overwrote it,
  so there is currently no evidence that any consumer would have refused. Stating the
  refusal explicitly is what converts the marker from documentation into a gate.

  THE WRONG FIX TO WATCH FOR. Substituting the process's current location for an
  undetermined working copy looks like robustness and is the exact harm: it sends
  phase agents to work, and commit, in the shared clone. It is called out as a
  constraint and tested negatively, because it passes every positive test.
