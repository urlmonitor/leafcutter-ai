    relationship: describes
    status: exists
  - path: scripts/build.py
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: simple
it_requirements:
  - "Extend the BO-2000b-1 guard in scripts/build.py: a target that resolves to a subdirectory inside the active worktree root is treated the same as the root itself and refused, with a message identifying the target as inside the active worktree."
  - "Comparison must be on resolved/real paths (resolve symlinks and relative components) so a symlinked or relative target that lands inside the worktree is still caught."
  - "On the refusal path no output may be written inside the worktree and in-progress changes must be left unchanged."
  - "Keep scripts/build.py and its deployed copy in parity per ADR-001 (build.py round-trip)."
delivers_to: null
expects_from:
