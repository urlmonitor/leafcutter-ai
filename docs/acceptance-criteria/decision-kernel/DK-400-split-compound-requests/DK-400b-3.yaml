assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400b-2
  contract: found_at, work_item_depth and subject_kind on the split record, which the gate packet and the progress
    view render.
it_requirements:
  - 'The split gate interaction is built deterministically from the split record (template text, no host wording):
    it names the subject kind in words (a goal, a research request, a decision question) and the origin: from the
    person''s own request for found_at routing, found along the way at work-item depth N for mid_run.'
  - Every gate offers the same four answers whatever the subject kind or origin, validated by the same answer schema
    (DK-400d-1).
  - The progress view (DK-400f-1) shows the same subject kind and origin, read from the same record fields.
  - 'Companion surface outside this AC: the host skills relay the gate and progress unchanged (recommended llm-expert
    follow-up on kernel/adapters/claude_code/SKILL.md and kernel/adapters/codex/SKILL.md).'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_gate_names_subject_kind_and_origin_for_three_splits
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: For the reusable-criteria and reuse-threshold splits (routing) and the split-bounds split (mid-run,
      through the injected test producer of DK-400b-2) the gate packets offer the same four answers, name a goal,
      a research request and a decision question, and state the origin as the person's request twice and found along
      the way at work-item depth 1 once.
  - name: test_progress_view_shows_same_origin_as_gate
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: The envelope's split progress for each run carries the same subject kind, found_at and depth as
      its gate packet.
test_rationale: Gate and progress must agree because both read one record; the seam test checks the two real outputs
  against each other.
