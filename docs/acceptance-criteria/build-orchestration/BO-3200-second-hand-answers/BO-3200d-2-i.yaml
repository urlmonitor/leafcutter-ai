notes: |
  Moving the handover out of the reply creates a new way for it to be empty, and the three
  states it can be in are easy to collapse into one halt. They must not be, because they point
  at three different places: nothing was produced (look at the producer's failure), nothing was
  meant to be there (look at whether the step should have run at all), and something was
  produced that is not good enough (look at the content).

  ALL THREE HALT. This AC does not weaken the fail-closed posture BO-3200d-1-i protects — every
  one of the three stops the run. What differs is only what the halt says, and that is the
  whole content of the criterion, so the covering test must compare the reports rather than the
  outcomes.

  This is BO-3200e's distinction applied at the handover: a step that could not obtain what it
  was asked to read has not inspected anything, and must not report a finding about content it
  never saw. Reuse that vocabulary rather than inventing a second one.

  IT-PO ENRICHMENT NOTE (2026-08-26). One boundary the criteria imply and do not state: "empty"
  must mean zero-length content actually present at the handover, not the location being absent.
  Treating a missing location as empty would collapse the first two states through the back door
  — and it is the collapse most likely to happen by accident, because both read as "nothing
  there" to a naive check.
