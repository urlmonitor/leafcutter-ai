id: KM-500d-3-i
title: A comparison works out representativeness from the case set, and a self-declared representative flag changes nothing
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500d-3
criteria: |
  Given a baseline report and a proposal report measured on the same 12-case pack, which covers 6 of the 8 query families and has no category reaching its minimum
  And the pack's coverage block declares representative as true
  When the two reports are compared
  Then the comparison outcome is limited, and its reasons name the coverage conditions measured from the cases that are not met, for example "families covered 6 of 8" and each category below its minimum with its count
  And the declared representative value is shown as a claim made by the pack and does not change the outcome
  And comparing the same two reports again with only that flag changed from true to false, or removed, gives the same outcome and the same reasons

  Given a baseline report and a proposal report measured on a case set whose own category labels, target families and holdout meet the coverage requirement fixed with that set
  And the set's coverage block declares no representative value
  When the two reports are compared and the other promotion gates pass
  Then the comparison outcome is eligible
  And the representativeness result states the counts it was worked out from: cases per category, target families covered, holdout size and reviewers per case.
depends_on:
- KM-500d-3
- KM-500a-4-iv
