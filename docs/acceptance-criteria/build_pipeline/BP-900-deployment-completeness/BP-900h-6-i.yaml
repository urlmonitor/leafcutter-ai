title: "The use-the-install step mutates only a target it is entitled to destroy, and refuses anything else untouched"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: draft
priority: critical
roadmap_phase: phase_1
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-6.yaml"
criteria: |
  Given the use-the-install step's first actions against its target are destructive and
    irreversible in place — it initialises a git repository in the target, rewrites the
    target's skills_config.json, removes hook entries from the target's pre-commit
    registry, and creates a commit,
  And a target directory that is NOT a disposable install fixture — a developer's real
    working tree, the shared install tree the workspace's worktrees resolve their
    configuration through, or any directory that is already inside a git working tree
    holding commits the step did not create,

  When the step is invoked against such a target,
  Then it makes NO mutation of any kind before refusing: no git repository is created, no
    configuration file is rewritten, no hook entry is removed, no commit exists that did
    not exist before, and every path present in the target beforehand is still present
    afterwards with byte-identical content,
  And it exits non-zero, naming the target path and which entitlement condition the target
    failed,
  And its report does not carry the completed-adopter-commit result — a refusal is not
    reported in the same shape as a successful adopter experience,

  And given an entitled target whose pre-commit registry is a symbolic link resolving
    outside the target root — into a shared build artifact several installs read,
  When the step narrows or otherwise rewrites that registry,
  Then the shared artifact the link resolves to is byte-identical after the run: the step
    writes only paths that resolve inside the target root, either by replacing the link
    with a private regular file in the target or by refusing with the message above,

  And given a target the step IS entitled to destroy — a directory it created, or one
    handed to it empty and holding only a built install,
  When the step is invoked against it,
  Then the step runs to completion and produces the same result BP-900h-6 requires, so the
    entitlement test does not turn the step off for the case it exists to serve.

  REACHABILITY. Every clause above is asserted against the step as the job reaches it —
  the consumer-install entry point invoked as a subprocess with the use-the-install flag,
  in a real built install, using the command the runner parses out of the workflow file.
  An entitlement check that lives in the module but that the workflow's invocation never
  routes through is not covered by this criterion: at the time this AC was written the
  workflow's consumer-simulation step invoked that entry point WITHOUT the use-the-install
  flag, so the whole step was unreachable in CI while its module was present and green.
  Presence in a copy of the code, or in a helper called directly by a test, is not
  coverage.

  Coverage note: behavioral only. A test that greps the step's source for a guard name, a
  path-resolution call or a refusal string passes on dead code, and dead code is the exact
  state this step was in when the requirement was found. The only honest coverage runs the
  step against a target it must refuse and inspects the target afterwards — a census of
  paths and bytes taken before and after the invocation, plus the absence of a repository
  and of a commit — and separately runs it against a target it must accept and observes it
  complete.
