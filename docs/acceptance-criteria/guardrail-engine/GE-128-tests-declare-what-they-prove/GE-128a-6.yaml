criteria: |
  Given a reader looking up how the test-declaration check judges a change,
  When they open the reference entry for the test-declaration ratchet,
  Then it defines the counted quantity as the number of test functions in one
    file that declare no requirement, and names the record that owns what counts
    as a declaration (TQ-100b-5) rather than restating it,
  And it gives the verdict table: count higher after the change, refused; count
    the same or lower, allowed; file with no previous version, governed by
    GE-128b,
  And it lists the mode setting's two values (warning mode, error mode), where
    the setting is configured, and what the check reports when no mode is chosen,
  And every row of the verdict table matches GE-128a-2, GE-128a-3 and GE-128a-4.
