id: GE-113c-3-iv
components:
  - commit_guardian
title: "Direct unit tests for _is_suppressed cover both exploit paths"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
criteria: |
  Given the test suite for the secrets scanner,
  When the tests for _is_suppressed are executed,
  Then at least the following scenarios have dedicated test cases:
    - a path-qualified allowlist entry does NOT suppress a finding at a different
      directory with the same basename (Path A regression),
    - a longer allowlist path does NOT suppress a shorter finding path
      (Path B regression),
    - a bare-filename allowlist entry DOES suppress findings with that basename
      at any depth,
    - a path-qualified allowlist entry DOES suppress a finding whose path
      segments end with the allowlist segments (suffix match),
    - a path-qualified allowlist entry DOES suppress a finding with an exact
      path match,
    - a wildcard "*" allowlist path DOES suppress any finding for that rule,
  And the tests exercise _is_suppressed directly (not only transitively through
    higher-level scan functions),
  And all test cases pass.
