work_status: todo
roadmap_phase: phase_acbuild_2b_ticket_demotion
criteria: |
  Given the ticket generator is invoked for an AC id that cannot be resolved to a store file,
  When it runs,
  Then it aborts with an error naming the unresolved AC id,
  And it does NOT fall back to embedding a copy of any partial criteria into the ticket body,
  And no ticket file is written.
