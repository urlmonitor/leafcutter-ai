criteria: |
  The proof-of-protection check keeps giving a correct, safe answer even when the
  workspace has drifted from the main line, a check hangs, or the project has
  redirected where its checks live.

  You get a check that does not quietly go wrong under real-world messiness: a
  stale workspace is flagged rather than trusted, a check that never finishes is
  treated as a failure rather than a pass, and a project that keeps its checks in
  an unusual place is still found and verified.
