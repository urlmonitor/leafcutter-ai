notes: |
  This record is the reason the parent's risk is rated as it is. The parent change is
  mechanically trivial — one call site — and its failure mode is not. A smaller copy
  that happens to break the build early leaves every test in the file green while the
  file proves nothing, and nothing in the suite would report it.

  It is also the condition under which the parent's source-reading evidence becomes a
  result: every mutation site in the file was confirmed by reading to target a file the
  smaller helper provides, but reading cannot see a path a test reaches for indirectly.
  The omission refusal is what turns that blind spot into a loud failure.
