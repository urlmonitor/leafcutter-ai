criteria: |
  See what you are producing, what you are finishing, and the gap between.

  Everything this project makes — requirements, tickets, epics, tests, code,
  decision records, diagrams and the rest of the written material, changelogs,
  agents, skills, hooks, components, retrospectives — arrives at some point and
  is worked off at some point. Today only the arriving half is visible, and only
  to whoever happens to count it by hand. This goal makes both halves visible for
  every kind of thing the project produces: created means it was authored and
  added; consumed means it was closed, completed, retired, or replaced. Seeing
  the two side by side tells you at a glance whether you are keeping up, where a
  queue is quietly growing, and which kinds of work are being finished as fast as
  they are started. And because a single total hides very different populations,
  the counts distinguish real queued work from work still being written and from
  ideas that were deliberately parked — so thinking cheaply never looks like
  falling behind.
