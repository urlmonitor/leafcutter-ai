criteria: |
  Given /build-feature is driving an epic whose worktree the run resolved, in the
    spelling git reports on Windows, as
    `C:/Users/Hendrik/Code/leafcutter/worktrees/uxp-700-tranche-2`
  And the epic's ticket list names a ticket by the absolute Windows path
    `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2\tickets\00_inbox\epics\EPIC-TruthfulProjectRecord\07_TICKET-20260909-UXP-700a-3.md`
  When the workflow hands that ticket to its phase agents
  Then every phase agent receives one absolute path that names that same file
  And that path contains exactly one drive root — no second `C:` occurs anywhere after
    its first two characters
  And no stretch of the worktree path occurs twice in it
  And it uses one separator spelling throughout, never a mixture of `/` and `\`.

  Given the same run
  When the same ticket is instead named by the relative path
    `tickets/00_inbox/epics/EPIC-TruthfulProjectRecord/07_TICKET-20260909-UXP-700a-3.md`,
    and again by `tickets\00_inbox\epics\EPIC-TruthfulProjectRecord\07_TICKET-20260909-UXP-700a-3.md`,
    and again by a mixed spelling of the absolute path above
  Then each is resolved onto the worktree exactly once
  And all of them reach the phase agents as the same path the absolute form reaches them as.

  Given the same run
  When a ticket is named by an absolute path outside the worktree —
    `D:\elsewhere\07_TICKET-x.md`, `d:/elsewhere/07_TICKET-x.md`, or `\\fileserver\share\07_TICKET-x.md`
  Then that absolute path reaches the phase agents naming that same file
  And it is never joined onto the worktree or onto any other absolute path.

  Given a run on a POSIX system whose resolved worktree is
    `/home/henzeh/projects/leafcutter/worktrees/handoff-routing`
  When tickets are named by `/home/henzeh/projects/leafcutter/worktrees/handoff-routing/tickets/00_inbox/07_TICKET-x.md`,
    by `tickets/00_inbox/07_TICKET-x.md`, and by `/tmp/elsewhere/07_TICKET-x.md`
  Then the first two reach the phase agents as the same path inside the worktree
  And the third reaches them unchanged, never joined onto the worktree.

  Given a ticket whose `depends_on` names its predecessor
    `06_TICKET-20260909-UXP-700a-2.md` by an absolute Windows path, by a relative
    forward-slash path, or by a relative backslash path
  When the workflow decides which tickets are ready
  Then the predecessor resolves to the same path the run dispatches that predecessor
    under, in every one of those spellings
  And the dependency is judged satisfied or unsatisfied by that predecessor's real
    state, never reported as naming a ticket the run does not have.

  Given any other workflow script in the build workflows' script directory that
    resolves, joins, or compares ticket, epic, worktree, or store paths, or derives a
    name from such a path — at authoring time plan-feature and build-epic, besides
    build-feature
  When it is handed the spellings above
  Then it reaches the same outcomes stated above for build-feature
  And a name it derives from a path, such as an epic name, is the same whichever
    separator the path was written with
  And a script is not out of scope because the 2026-09-14 incident happened to be
    observed in build-feature.

  Given the Node-based workflow harness at unit_tests/_workflow_engine_harness.py,
    which runs a workflow script's own top-level body under mocked agent globals
  When this record is verified
  Then for EVERY workflow script that resolves, joins, or compares paths, or derives a
    name from one — build-feature, plan-feature and build-epic at authoring time — the
    Windows absolute, relative, and outside-the-worktree cases that script can receive
    are proven by running THAT script's own top-level body through that harness, and
    asserting on the paths and path-derived names actually present in the prompts it
    handed to its agents
  And for build-feature the depends_on case is proven the same way too, with the
    resolver stub reporting the Windows worktree above
  And a harness run of one script is never accepted as the proof for another, so a
    script with such path handling and no harness run of its own leaves this record
    not done
  And a script found later to contain such path handling needs its own harness proof
    before this record can be done
  And a test that calls an extracted path helper directly is welcome in addition, but
    is not accepted instead of the harness run
  And a test that searches the workflow source for a path expression is not accepted
    as coverage.
