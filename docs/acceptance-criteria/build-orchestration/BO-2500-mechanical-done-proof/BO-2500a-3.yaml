    type: unit
    description: "An active AC with at least one covers-linked test where all such tests pass is reported eligible to be marked done."
  - name: test_eligibility_requires_all_covers_tests_passing
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Eligibility requires every '# covers:<id>' test to pass, not merely one of several."
