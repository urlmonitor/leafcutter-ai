    type: integration
    angle: boundary
    description: "The entry carrying the deprecation marker is produced under its successor's rules — including the successor's requires_frontmatter obligation, which the alias entry itself declares as empty — and is not skipped."
  - name: test_obliging_kinds_are_complete_or_refused_never_produced_without_the_field
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: failure
    description: "ASSERTED DIRECTLY AGAINST config/diagram_types.json, not through the check set which does not enforce requires_frontmatter at all: for each kind declaring an obliged field, a request supplying it produces a document carrying it, and a request omitting it produces no file and exits non-zero."
  - name: test_emitted_skeleton_is_within_the_per_kind_complexity_thresholds
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: criterion
    description: "check_mermaid_complexity exits 0 over every produced document in the sweep, with a paired negative control per mermaid family that inflates the emitted skeleton past that family's threshold and must exit 1."
test_rationale: >-
  "The produced document is accepted" is satisfied on any single run by a producer that
  handles one kind well and the rest by copying, which is the shape a producer naturally
  grows. Three declared kinds oblige a further field, one is a deprecated alias, and
  check_mermaid_complexity applies different metrics per mermaid family — each is capable
  of failing while the demonstrated kind passes. The sweep must therefore be parametrised
  from the declaration rather than from a list, and the movement descriptor is what proves
  it: a hard-written enumeration passes the sweep on the day it is written and stops
  discriminating silently thereafter. The third clause additionally cannot ride on the check
  set at all — requires_frontmatter is declared in config/diagram_types.json and enforced
  nowhere in the codebase, verified by search — so an observation built on "the checks
  passed" would report a green that says nothing about it, and that descriptor asserts
  against the declaration directly.
