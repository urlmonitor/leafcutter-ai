assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "TWO SEPARATE CI JOBS OR TWO SEPARATE INVOCATIONS, NEITHER READING THE OTHER'S RESULT. check_ui_ac_declared.py and check_done_proof.py must have no data path between them: no shared verdict cache, no 'skip if the other already failed' short-circuit, no combined exit-code aggregation that lets one satisfy the other. The composition is ADDITION, never substitution — both must hold."
  - "DO NOT EXTEND check_done_proof.py TO ALSO CHECK DECLARATIONS. Folding the declaration obligation into the existing done-proof gate is the shortest path to 'one failure per criterion' and it is exactly the substitution GE-124g forbids: whichever obligation is checked first would then be able to short-circuit the other. Two gates, side by side."
  - "THEY MAY SHARE READ-ONLY INFRASTRUCTURE — the AC index (GE-124c-2-i) and the store path — but nothing that carries a VERDICT. Sharing the index is desirable (one walker); sharing a result is the defect."
  - "BOTH FAILURES MUST BE VISIBLE IN ONE RUN, not one-at-a-time. If the two jobs are separate CI jobs, both must run on the same commit rather than the second being gated on the first passing; a reviewer must see both obligations at once or they will fix one, re-push, and discover the other."
  - "EACH FAILURE NAMES ITS OWN OBLIGATION IN ITS OWN VOCABULARY: 'nothing claims it' for the declaration gate, 'nothing proves it' for the test-proof gate. Identical or near-identical wording is how a reader concludes they are two reports of one problem and dismisses one."
delivers_to: null
expects_from:
  ac_id: GE-124e-3
  contract: "The reverse-direction finding whose independence from the test-proof verdict this edge case fixes — no shared verdict path with check_done_proof.py in either direction"
test_spec:
  - name: test_ge_124e_3_i_declared_but_untested_criterion_fails_only_the_test_proof_gate
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "Run both real gates over one fixture where the criterion is declared on screen and has no covering test: the declaration gate passes, check_done_proof fails. Run both as subprocesses over the same store and test tree — this is a composition claim about two real programs and cannot be asserted in process."
  - name: test_ge_124e_3_i_tested_but_undeclared_criterion_fails_only_the_declaration_gate
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The mirror case: a covering test exists, nothing on screen claims it. check_done_proof passes, the declaration gate fails. The two half-finished states fail in OPPOSITE gates, and an implementation that wires them together passes one of these two and quietly fixes the other."
  - name: test_ge_124e_3_i_criterion_failing_both_produces_two_findings_naming_different_obligations
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Neither declared nor tested: two findings for the same criterion id from the two gates, with distinct messages — one naming that nothing claims it, one that nothing proves it. Assert both are present and that neither suppressed the other."
  - name: test_ge_124e_3_i_neither_gate_reads_the_other_s_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "Force check_done_proof to PASS for a criterion (give it a covering test) and independently force the declaration gate's evidence to be absent, then assert the declaration gate still fails — and the symmetric case. Any short-circuit or shared verdict cache makes one of the two pass. This is the behavioural form of 'no data path between them'."
test_rationale: |
  Every claim in this AC is about the relationship between two real programs, so every test runs
  both of them as subprocesses over one fixture; an in-process assertion about two functions
  cannot show that two CI gates compose by addition. The second and third scenarios are written
  as separate tests deliberately because they fail in OPPOSITE gates — an implementation that
  wires the two together will pass one of them, and a single combined test would let that
  through. The fourth test is the one with teeth: it forces each gate's inputs independently and
  asserts the other is unmoved, which is the only way to detect a short-circuit that happens to
  agree with the expected verdict on ordinary fixtures.
