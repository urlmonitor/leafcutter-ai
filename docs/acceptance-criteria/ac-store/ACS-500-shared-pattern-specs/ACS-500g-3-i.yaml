test_spec:
  - name: test_rule_value_in_agent_template_is_rejected
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Stage a fixture agent template that states a recurrence threshold value; run the hook's main() with HOOK_ROOT on the fixture repo and assert exit code 1 and that the message names the duplicated rule, the offending file, and the authoring-patterns skill."
  - name: test_skill_only_edit_is_accepted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Stage a change that edits only templates/skills/authoring-patterns/SKILL.md; run main() and assert exit code 0."
  - name: test_plain_reference_to_skill_is_not_flagged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Stage an agent template whose only mention is a value-free load instruction naming the authoring-patterns skill; run main() and assert exit code 0 — the false-positive guard for the third criteria scenario."
  - name: test_threshold_is_read_from_the_skill_not_hardcoded
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Change the fixture skill's canonical threshold from 3 to 2; assert the hook then flags a template declaring 2 and accepts one declaring 3 — proves the value is parsed from the skill and not baked into the hook."
  - name: test_guarded_globs_come_from_config_not_a_filename_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Add a brand-new agent template not named anywhere in the hook source, put a rule value in it, and assert it is flagged — proves scope is data-driven from the commit_guardian.json config section."
  - name: test_deployed_hook_runs_without_import_error
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "Build into a temp target dir, then execute the deployed scripts/commit_guardian/check_pattern_rule_duplication.py as a subprocess; assert it exits 0 or 1 and never raises ModuleNotFoundError — the deploy-manifest guard from the done_proof.py regression."
  - name: test_hook_id_present_in_generated_precommit_config
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "Run the build into a temp target dir and assert check-pattern-rule-duplication appears in the generated .pre-commit-config.yaml — a manifest entry that never reaches the generated config is an inert gate."
