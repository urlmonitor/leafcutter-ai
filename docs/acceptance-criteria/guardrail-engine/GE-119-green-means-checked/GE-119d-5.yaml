it_requirements:
  - "DOCUMENT: docs/how-to/managing-pre-commit-hooks.md, edited AFTER GE-119b-5's removal has landed on the same file. RE-READ the file as GE-119b-5 left it before editing — do not work from a copy taken before that edit. Two agents editing one document in sequence from separate ACs is the named hazard here."
  - "THE CONFIRM COMMAND IS THE SUBSTANTIVE ADDITION and it already exists: docs/how-to/verify-precommit-active.md and templates/scripts/commit_guardian/verify_precommit_active.py are both present (verified 2026-08-14). Use that command rather than inventing a second one, and cross-link the two documents so a reader is not offered two ways to check the same thing."
  - "Show the command's output in BOTH the healthy and the unhealthy case, quoting the message GE-119d-2's refusal path actually emits. Do not paraphrase it — a paraphrased error message is one a reader cannot match against what they see, and it silently rots when the real message changes."
  - "State the set-up guarantee and the refusal behaviour AS GE-119d-2 IMPLEMENTS THEM. Sequence this AC after GE-119d-2 lands so the documented behaviour is the one that exists rather than one the author expected."
  - "ANTI-REINTRODUCTION: the file must not regain the manual layout-link step GE-119b-5 removed, in ANY wording — including the 'if you are on WSL/NTFS, copy instead of symlink' variant and any 'if the checks seem to be skipped, link .leafcutter' troubleshooting note. Run GE-119b-5's absence guard before sign-off; a reviewer reading a diff will not reliably catch a re-added variant phrased differently from the deleted one."
  - "No instruction anywhere in this document may tell the reader to establish any part of the protection by hand. Removing the layout-link step while leaving a different manual step satisfies the letter and not the criterion."
  - "The file is a tracked how-to subject to check_doc_frontmatter, check_doc_length and check_doc_links; edit in place and keep it passing in the same commit."
