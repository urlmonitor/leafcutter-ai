implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  ESCAPE 1 of the two the PO requires be kept separate. It is an OPT-IN: every
  path that has not been listed blocks. The second and third scenarios are the
  two ways that guarantee gets broken in practice — an empty list read as "warn
  everywhere", and a listed prefix leaking to unlisted siblings.

  THE FINDING IS STILL REPORTED. A warn that suppresses the finding is
  indistinguishable from the file being out of scope, and an area on the warn
  tier is meant to be visibly unfinished, not invisible.

  Mock-data invariant: verdict == 'warn' implies the subject's tier is 'warn'.
  Its contrapositive is what GE-124d-1-i tests.

  IT-PO NOTE (2026-08-25). The criteria's third scenario tests leakage across
  two different applications, which almost any implementation gets right. The
  leak that actually happens is a sibling directory sharing a prefix
  (`components/` matching `components-legacy/`), so that case is added to the
  test contract rather than to the criteria.
