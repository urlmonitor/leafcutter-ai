id: GE-120b-4
title: "Which locations must carry a number, and which need not, is written down"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader who wants to know whether a kind of artifact they are about to add is expected
    to carry a number,
  When they read the enrolment section of the numbering reference document,
  Then it lists, per namespace, every location that is enrolled and every location that is
    exempt,
  And for each exempt location it states WHY it is exempt, so the list reads as a decision
    rather than as an inventory of what happens not to be numbered today,
  And it states that the exemption granted to the artifacts that were never numbered applies
    only to those artifacts as they stand, and does not extend to new artifacts added beside
    them,
  And it records that those artifacts are deliberately not being numbered retrospectively, and
    the reason — that an absent number is not ambiguous and breaks no reference, while renaming
    published files would break references that resolve today,
  And the section lives in the same document as GE-120a-3's numbering rules, not in a separate
    competing document,
  And the enrolment table it presents matches the enrolment rule the check actually applies.
depends_on:
  - GE-120b
  - GE-120a-3
