criteria: |
  Given a validated work envelope lists 4 changed files,
  When the commit phase executes the commit,
  Then all 4 files appear in a single git commit (not split across multiple commits),
  And no files outside the envelope's list are included in the commit,
  And the commit message matches the formatted message from the envelope.
