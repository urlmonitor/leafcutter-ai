notes: |
  DOCUMENTATION AC, produced because ACD-2000b declares
  `documentation_triggers: [reference-doc, state-diagram]`. This is the
  reference-doc half. The state-diagram half is ACD-2000b-3-i, authored as an L3
  under the reclaim behaviour it depicts rather than as a sixth L2 -- ACD-2000b's
  L2 cap is 5 (`_MAX_L2_PER_L1` in scripts/commit_guardian/check_ac_limits.py,
  tested as `child_count > limit`) and four behavioural leaves plus this one fill
  it exactly. Both triggered documentation types are therefore delivered; only
  the tree position differs. Flagged here so a later reviewer does not read the
  L3 placement as an omission.

  Craft deliberately LEFT UNSET this pass (assigned_agent / it_requirements /
  estimated_complexity / contracts are the IT PO's); the intended craft is the
  documentation surface. ACD-1800a-3 is the sibling precedent.

  THE OPERATOR IS THE PRIMARY AUDIENCE, which is why the final Then clause is a
  diagnostic capability. The failure this whole L1 addresses presents to a human
  as "this requirement has said in_progress for two days and nothing is
  happening". The documentation's job is to let that human tell the two causes
  apart -- live build versus abandoned claim -- and to know what to do about the
  second without inventing a procedure.

  THE FOOTPRINT SENTENCE NEEDS ITS "WHY", not just its rule. "Unknown footprint
  conflicts with everything" reads as needless caution until you know the
  inversion: an empty set intersects nothing, so a naive implementation makes
  exactly the least-analysable requirements the most parallel. That reasoning is
  what stops the rule being "optimised away" by the next author, and it is the
  same class of documentation obligation as ACD-1600g-5's worked counter-example
  for exclusions.

  THE TAKEOVER SECTION MUST INCLUDE THE MANUAL PATH. Whatever automatic staleness
  rule ACD-2000b-3 lands with, operators will occasionally need to release a
  claim by hand -- and a hand-release performed without checking whether the
  owner is alive re-creates the double-build this L1 forbids. The check to
  perform is documentation, not code.

  ACCEPTANCE IS COMPREHENSION, NOT PRESENCE -- verify by having a reader answer
  the diagnostic question against a real stuck requirement, not by checking that
  a heading exists.

  2026-08-17 (IT PO enrichment). Craft set to `documentation-expert` per the S7b
  mapping for the `reference-doc` trigger and the BA's recorded intent.

  PLACEMENT FIXED rather than left to the writer: the rule lives on a new
  `docs/reference/ac-claim-lifecycle.md`, and `docs/reference/ac-schema.md` gets
  the field rows plus a link. The split is deliberate -- the schema reference
  describes the FIELD, this page describes the RULE -- and it is stated as an
  it_requirement because the natural instinct is to append everything to
  ac-schema.md, where the operator-facing diagnosis would be buried inside a
  field table nobody reads under pressure.

  THE THRESHOLD VALUE IS THE PAGE'S LOAD-BEARING FACT. Without the actual
  configured default and its location, the diagnostic clause cannot be satisfied
  at all -- which is also why ACD-2000b-3 is required to make the threshold a
  named configurable rather than a literal at the comparison site. The two
  requirements are two halves of one guarantee.

  ORDERING: this is the last artefact in the L1. Written from the specifications
  rather than from what shipped, it will be confidently wrong about field names
  and the threshold, and a confidently wrong operator reference is worse than
  none.
