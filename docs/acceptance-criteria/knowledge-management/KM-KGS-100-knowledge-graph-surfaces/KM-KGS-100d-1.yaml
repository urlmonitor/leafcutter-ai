assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Validation must iterate over the declared surfaces map from paths.json and check each surface against its own declared edge_fields list — never against a hard-coded expected list of relationship kinds, so the validation set tracks the config automatically"
  - "An empty edge_fields list (e.g. the glossary surface) must be a valid declaration meaning 'contributes no edges', not a validation failure"
  - "Validation failures must report which surface and which declared edge_field is at fault, logged per the error-handling policy, so a misconfigured surface is diagnosable without reading code"
