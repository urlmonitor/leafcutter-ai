title: "Dependency graph uses frontmatter status to determine completed tickets"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic folder with 4 tickets (none in a done/ subfolder):
    - T1.md with `status: done`
    - T2.md with `status: in_progress`
    - T3.md with `status: todo` and `depends_on: [T1]`
    - T4.md with `status: todo` and `depends_on: [T2, T3]`,
  When /build-feature computes the next_ready_batch,
  Then T1 is excluded from the dependency graph (status: done)
  And T3 is included in the ready set
    (its dependency T1 has status: done, satisfying the depends_on)
  And T4 is NOT in the ready set (T2 is not done)
  And T2 is NOT in the ready set (status: in_progress, already being driven)
  And the computation never checks whether any file is in a done/ subfolder.
depends_on: [BO-400a, BO-100]
