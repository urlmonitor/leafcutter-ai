title: "During the migration window tooling accepts both metadata and name-derived hierarchy"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given the store contains a mix of requirements that already declare hierarchy
    metadata and requirements that have not yet been migrated (hierarchy still
    only inferable from their names),
  When any hierarchy-aware tool runs during the migration window,
  Then for a requirement that declares parent-pointer metadata the tool uses the
    metadata,
  And for a requirement that does not yet declare it the tool falls back to
    deriving the parent from the name,
  And the tool produces a single coherent tree across the mixed store without
    error,
  And once every requirement declares metadata the name-derived fallback is no
    longer exercised.
