notes: |
  Authored by /quick-fix. Root cause: The orphan scan runs before any resume handling and has no notion of 'this run's own pending drafts': any uncommitted PO/BA/IT-PO draft with readiness draft qualifies as an orphan, including the drafts the paused run itself produced and is waiting to have approved. pauseAtGate then writes a new record for the same run_id, replacing the record of the gate the run is actually paused at. Expected fix (this file only): when args.resume_answer is present, read the run's durable pause record (readPauseRecordWithRetry) before the orphan scan; if it exists, is not stale, and its context lists AC ids (context.acs), exclude exactly those ids from the orphan set (they belong to this run, not a crashed one), so a resume at gate-ba proceeds to apply the answer. Ids not listed in the record are still treated as orphans as today. If the record is unreadable, do not fall through to the orphan gate (that would overwrite it) - return the existing pause_record_unreadable terminal status. Tests must be behavioural through unit_tests/_workflow_engine_harness.py with stubbed agent() replies: (a) resume with record context.acs == drafted ids -> no orphan gate, answer applied path reached; (b) an extra uncommitted draft not in context.acs -> still offered as orphan; (c) no resume_answer -> behaviour unchanged; (d) the existing pause record is never rewritten to a different gate during a resume. FILE-SIZE RATCHET: plan-feature.js is over its 1000-line limit (GE-127); every added measured line must be offset by removing about two (e.g. redundant // comments or blank-line runs, no behaviour change), verified with scripts/commit_guardian/check_file_size.py run from the worktree. Edit only the template; .claude/workflows/plan-feature.js is build output..

  PLACEMENT: ACD-2100c is at its L2 cap of 5, and this is a technical constraint on the
  already-specified ACD-2100c-3 behaviour (a paused run resumes at the decision it was
  waiting on with the person's answer applied) -- the recovery scan must not divert the
  resume into a different decision. Hence an L3 Roman-suffix child, not a new L2 and not
  a child_limit_override. Sibling ACD-2100c-3-ii (pause_record_unreadable,
  readPauseRecordWithRetry) supplies the read this relies on.

  PARENT STATE: ACD-2100c-3 carries work_status: done. That claim did not hold on the
  live run named in the criteria; this todo child is the open constraint against it.
