notes: |
  USER DECISION Q4 (binding): must_catch is copied VERBATIM onto the generated
  work's test requirements, and the generated-work schema is widened. Both
  schemas reject unknown keys today, so this is a coupled change on both sides —
  the same copy-through coupling ac-schema.md already documents for framework
  and type.

  WHY ORDER AND EXACT TEXT ARE IN THE THEN CLAUSE. The value of the list is that
  the test writer sees exactly what the requirement author named. A generator
  that "normalises" wording (lower-cases, trims, dedupes, joins) silently turns
  a named wrong version into a different one; the verbatim clause is what makes
  that failure visible.

  NOT IN SCOPE HERE: running the named wrong versions against the finished code
  (TQ-500g), and who fills the list (TQ-500f-2-ii).

  IT-PO ENRICHMENT (2026-09-25)
  INTENDED must_catch: "generator drops must_catch" / "generator sorts or lower-cases the list"
  -> the verbatim test goes red; "generator emits must_catch: [] on every entry" -> the no-key test
  goes red; "only the AC-side schema is widened" -> the schema-conformance test goes red.
  LANE NOTE: pointing the fast lane at TQ-500f-2 pulls in TQ-500f-2-ii (llm-expert), and
  the producibility check refuses that set. Build TQ-500f-2 + TQ-500f-2-i in the fast lane
  by targeting TQ-500f-2-i only after TQ-500f-2 is built through /build-feature, or build the
  whole subtree through /build-feature.
