readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  New tests name what they prove, with no backlog to clear first.

  A requirement is only provably satisfied if some test says it is proving it. In
  a project of any age most tests never said, so the proof exists but nobody can
  find it, count it or rely on it — and every claim that a piece of work is
  finished rests on a link that may simply not be there. Switching the standard on
  is no help, because on the day it is switched on almost every test in the
  project breaks it, and switching it off protects nothing. After this goal, a
  test added from today names the requirement it proves; the tests already written
  are tolerated for as long as they need to be and never stop anyone working;
  rearranging existing tests is not mistaken for adding undeclared ones; a name
  that points at nothing does not satisfy the rule; and a test naming a
  requirement that has since been retired is a question surfaced for someone to
  answer, never an inconvenience to be silenced.
