      untouched.
superseded_by: null
covered_by: []
implemented_by: []
change_target: docs
risk_surface: internal
notes: |
  Authored to satisfy TQ-500b's state-diagram documentation trigger. The trigger is
  well placed: three of these five states present identically today, and a reader
  who cannot see the state space has no way to notice that two of them have
  collapsed into one.

  THIS AC'S DELIVERABLE IS THE DOCUMENT, AND ONLY THE DOCUMENT. It is deliberately
  not a proxy for any behavioural check in this tree. No behavioural AC here may be
  closed by pointing at this diagram, and the presence of a state in the diagram is
  not evidence that the state is produced by anything — that evidence is TQ-500b-1
  and TQ-500b-1-i.

  Also satisfies TQ-500a's and TQ-500d's need for a picture of the state space; they
  carry their own documentation triggers, answered by the how-to at TQ-500d-2 and the
  reference at TQ-500e-3 rather than by further copies of this diagram.
