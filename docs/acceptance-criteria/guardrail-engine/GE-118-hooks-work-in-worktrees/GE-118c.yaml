notes: |
  Authored by /quick-fix on 2026-08-18 as a loose L2 claiming GE-120.
  Renumbered to GE-118c on 2026-08-18 — see amended_by and the two sections at
  the end of these notes.

  ROOT CAUSE, verified by import rather than by reading:

      _DOC_TYPES_JSON = Path(__file__).resolve().parents[2] / "leafcutter" / "config" / "doc_types.json"

  From the deployed location .leafcutter/scripts/commit_guardian/, parents[2]
  is .leafcutter, so this resolves to .leafcutter/leafcutter/config/doc_types.json
  — a doubled segment that has never existed in any layout. From the source
  location templates/scripts/commit_guardian/ it resolves to
  templates/leafcutter/config/, which does not exist either. Observed:

      resolved path: .../.leafcutter/leafcutter/config/doc_types.json
      exists: False
      types actually loaded: ['adr', 'architecture', 'explanation', 'how-to',
                              'reference', 'retro', 'tutorial']

  So config/doc_types.json has never been read by anything. It declares ten
  types; seven are honoured. The canonical spelling `how_to` is rejected while
  the entry marked `_deprecated: true` (`how-to`) is the only one that works,
  and `card` — the type every generated agent card carries — is rejected, which
  makes agent cards uncommittable.

  WHY THIS IS WORTH AN AC RATHER THAN A ONE-LINE PATCH. build.py regenerates
  architect-review.md and business-analyst.md from this file, so agents are
  being told about document types the validator will reject. The file asserts
  in its own _comment that it is the single source of truth and that
  check_doc_frontmatter.py reads it at startup. Both statements are false
  today. This is the same failure class as BP-900g-7 (a registry naming
  something nothing consumes) and BP-900g-10 (a loader that degrades to a
  default instead of failing) — found while committing this very branch, when
  the hook rejected regenerated agent cards.

  WHY THE ID IS SUFFIX-SHAPED AND NOT A NEW ROOT NUMBER (2026-08-18).
  GE-124 was free by ADR-029's both-tests rule (no file, no citation,
  repo-wide) and was the obvious answer. It is the wrong SHAPE.
  check_ac_parent_covered_by.py and scan_ac_orphans.py both derive a record's
  parent STRUCTURALLY from its own id via derive_parent_id(), and neither
  reads the documented `parent:` escape-hatch field. derive_parent_id() returns
  None for a root-shaped id, so GE-124 would have carried a parent link that no
  gate could police — the record would satisfy its parent criterion on paper
  with no mechanical enforcement, which is precisely the failure mode the
  GE-122 tree exists to end. derive_parent_id("GE-118c") == "GE-118", so the
  back-link is enforced natively. This reasoning is inherited verbatim from
  GE-122e-1's it_requirements, which reached it the hard way during the GE-119
  repair. GE-118c is free by both tests as of 2026-08-18: no file, and no
  citation anywhere in the repository.

  WHY GE-118 IS THE PARENT, AND WHY THE OBVIOUS ALTERNATIVE IS FORBIDDEN.
  The semantically attractive parent is GE-120 itself. A guard that silently
  falls back to a narrower built-in list when it cannot read the file it was
  configured with is textbook "green when it could not actually check", and
  GE-120's own L0 notes reject GE-118 as a parent for exactly the fourth
  clause of this criterion's territory — arguing GE-118's scope is dependency
  RESOLUTION from the deployed layout ("hooks find their helpers") while a
  check can also degrade quietly "because of a parse error, a missing config".
  That argument is engaged with here rather than ignored, and it is correct on
  the merits about the CLASS. It is nonetheless RULED OUT on a mechanical
  ground that outranks the semantic one:

    - unit_tests/commit_guardian/test_ge_122e_1.py's
      test_goal_record_claims_a_new_id_and_its_folder_matches_origin_main
      asserts that `git diff origin/main -- docs/acceptance-criteria/
      guardrail-engine/GE-120-green-means-checked/` is EMPTY. Parenting here
      requires both placing this file inside that folder and appending
      GE-118c to GE-120.yaml's covered_by. Either edit turns that guard test
      RED. Every one of GE-120a..e is independently at the 5-child L2 cap, so
      the alternative — hanging this under an existing L1 — is also closed,
      and minting a new L1 means editing the frozen L0 anyway.
    - This is the SECOND occurrence of a trap GE-122e-1 already recorded for
      GE-119: "the obvious choice is forbidden ... because parenting under it
      requires adding the child to its covered_by, and that file is one this
      AC requires to be byte-identical afterwards." Verify the survivor set is
      untouchable BEFORE assuming a parent is available.

  GE-118 is the right home on the merits as well, not merely the residual
  option. GE-118b is a near-identical precedent in shape and in kind: the same
  hand-counted parents[2] plus a hardcoded "leafcutter" segment resolving to a
  path that never existed, so the gate silently no-ops; also authored by
  /quick-fix; also a level-L2 record hanging directly off the GE-118 L0 rather
  than under an L1. This record's PRIMARY root cause is that same resolution
  defect — the announce-on-failure clause is the second half of the fix, not
  its subject.

  THE COUNTER-ARGUMENT, STATED RATHER THAN SUPPRESSED. The guardrail-engine
  PROJECT_CONTEXT and GE-120's L0 notes both record a standing rule: "GE-118 =
  the point fixes that landed (GE-118a-1, GE-118b, both done); GE-120 = the
  class they are instances of. GE-118 was deliberately NOT amended or
  superseded." Adding GE-118c does amend GE-118. The distinction relied on
  here: that rule was written to stop the cross-cutting POLICY being grafted
  onto the point-fix tree, which would invert containment by putting the
  general rule beneath a specific instance. Adding a third point fix of the
  same shape does not invert anything — it extends a register of point fixes
  with a point fix. GE-118 goes from 2 of 7 children to 3 of 7.
  Related, and worth carrying forward rather than hiding: GE-120's L0 notes
  warn that "three prior point patches exist in this area (GE-112, GE-118a-1,
  GE-118b). Favour a structural fix; a fourth point patch is the failure mode
  to avoid." This record IS that fourth point patch, and it has already
  shipped. Filing it beside its three siblings makes the count visible in one
  place, which strengthens the argument for building GE-120 rather than
  weakening it.

  TWO TEST-SUITE GAPS, RECORDED BECAUSE THEY ARE REAL AND NOT FIXED HERE.
  Neither blocks done; both are honest limits of the coverage above.
    - Test 1 does not build into a temp target as its test_spec text literally
      requires. It exercises this repo's own .leafcutter/scripts/commit_guardian/,
      which is gitignored. That copy is byte-identical to the template today,
      but the consequence is that a fix applied to the DEPLOYED copy only,
      leaving the template broken, would pass this suite green — exactly the
      failure mode it_requirements #1 warns about, and the one thing this suite
      does not cover. The test module documents the substitution deliberately
      (self-hosted layout, ADR-001), so it is a scoping choice rather than an
      accident.
    - All four tests skipTest when .leafcutter/ is absent. On a fresh clone
      with no build step the module reports 4 skips, which reads as green. CI
      builds before pytest so it is latent, but it is a silent-pass vector of
      precisely the kind GE-120a-1 is being written to outlaw.

  REOPENED 2026-08-25 (was work_status: done; readiness stays approved — the requirement is
  correct, the implementation does not meet it in the layout the criteria name). The first
  clause is false for a consumer install, and the second recorded test-suite gap above is
  exactly why nobody saw it.

  The resolver was fixed as required: _find_doc_types_json() walks ancestors from __file__ and
  the hand-counted parents[2] is genuinely gone. But config/doc_types.json is NOT in the build's
  deploy manifest. Verified: .leafcutter/config/ contains only commit_guardian/ and
  feedback_categories.yaml. From a deployed hook at <install>/.leafcutter/scripts/commit_guardian/,
  the walk therefore finds nothing under .leafcutter/, escapes it, and continues up the consumer's
  own tree, where config/doc_types.json does not exist because it is a leafcutter file. The walk
  reaches the filesystem root, returns candidates_checked[0], and _load_doc_types() raises
  FileNotFoundError — so the guard does not accept a declared type, it crashes.

  It passes HERE for a reason that does not generalise: the git root is the package, so the walk
  escaping .leafcutter/ lands on this repo's own tracked config/doc_types.json. The AC is
  satisfied in the one layout that cannot distinguish the two failure modes, and its criteria
  are written about the other one. That is the self-hosting mask, and it is the same
  deploy-manifest omission class as KI-BP-003.

  Closing this needs the file added to the deploy manifest and a test that runs the deployed hook
  from a target directory that is NOT inside this repository. Re-running the existing suite will
  not show the defect: it exercises this repo's own gitignored .leafcutter/, as its module
  docstring admits.
