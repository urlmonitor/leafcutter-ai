notes: |
  child_limit_override: 7 is a TEMPORARY stopgap (the documented escape hatch from
  ACS-100h-6 scenario 3). It was added 2026-06-22 to admit ACS-100h-7 (the
  scaffold-time AC-tree-limit constraint, EPIC-CodeQualityHooks KI-4) without
  forcing a Pattern-C structural split mid-authoring. Before that addition this L1
  already held 6 ID-derived L2 children (h-1..h-6) against the default L1 limit of
  5 — i.e. the tree was already saturated.

  The tree-saturation hit here is itself an instance of the very problem ACS-100h-7
  prevents: adding requirements under an over-limit parent forces either an override
  or an ID-rename cascade. Per the ac-store PROJECT_CONTEXT (ACS-800), this override
  is to be RETIRED once ACS-800e lands (tooling will count children from metadata
  rather than from ID strings, so re-parenting no longer requires ID renames). Do
  not let it silently become permanent.

  Note: covered_by previously listed only h-1..h-5; h-6 (approved 2026-06-22) was
  added to covered_by in the same edit so the parent-child link is recorded from the
  parent's direction.
