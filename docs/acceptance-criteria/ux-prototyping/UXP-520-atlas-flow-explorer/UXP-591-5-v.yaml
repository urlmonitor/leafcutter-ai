id: UXP-591-5-v
title: "A filter change while 'Flow not found' shows clears the notice, re-picks a flow and replaces the address in place"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a new tab opened /flows/leafcutter/flow-render-pipline?step=resolve, so the tab has one
    history entry and shows the 'Flow not found' notice with no flow drawn, an empty breadcrumb
    and the filters Real, User, All,
  When the person sets the Kind filter to 'Architecture',
  Then the 'Flow not found' notice disappears,
  And "Product-truth in the leafcutter architecture", the only flow the selector lists under
    Real, Architecture, All, is drawn with a breadcrumb of only that flow and no drawer,
  And the address bar becomes /flows/leafcutter/product-truth-architecture with no ?step=: the
    unknown flow's ?step=resolve is not carried over,
  And the tab still has one history entry, because the current entry was replaced rather than a
    new one added,
  And when several flows match the new filters, the first one the selector lists is picked:
    setting the Source filter to 'Mock' from the same 'Flow not found' state draws
    "Checkout & pay (inside the buy-a-plant checkout step)" at /flows/fern-and-fig/checkout-and-pay,
  And after the person then picks "Customer buys a plant" in the flow selector and presses Back,
    the Atlas shows /flows/fern-and-fig/checkout-and-pay with that flow drawn, never
    /flows/leafcutter/flow-render-pipline and never the 'Flow not found' notice.
