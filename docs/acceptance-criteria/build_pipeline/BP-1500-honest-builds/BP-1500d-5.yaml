  - ac_id: BP-1500d-3
    contract: "The build's failure signal when the record cannot be produced: the exit status an automated caller sees and the text naming the record and the project. The reference documents this signal, so it must be settled before the reference is written or the reference will publish today's exit-0 behaviour as the contract."
  - ac_id: BP-1500d-4
    contract: "The two distinguishable check verdicts and their observable form -- all-clear versus could-not-read, as seen by a reader and by an automated caller. This is the raw material for the reference's central promise that a reader can tell an inert check from a passing one, and it must be settled first for the same reason as -3."
test_spec:
  - name: test_bp_1500d_5_following_the_reference_procedure_locates_and_reads_the_record_in_a_real_out_of_package_install
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Execute the reference's own documented procedure, step by step, against the out-of-package harness in its good state, and assert each step reaches the signal the reference says to expect. Drive the steps from the reference document itself -- parse its runnable steps rather than transcribing them into the test -- so the test goes red when the document and the behaviour diverge, which is the failure this entry exists to catch. A test that hard-codes its own copy of the procedure verifies the behaviour and says nothing about the document."
  - name: test_bp_1500d_5_the_procedure_runs_in_a_process_that_cannot_see_the_producing_package
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the commands quoted in docs/reference/build-record-portability.md, run verbatim from the out-of-package install"
    description: "THE READER'S ACTUAL POSITION. Run every quoted command as a SUBPROCESS with a working directory inside the relocated install and an interpreter search path containing no path under the package checkout, with the package copy absent from the tree and from every ancestor; assert those properties of the child process rather than assuming them. A procedure verified from this workspace is verified with the package present, which is the one situation the reference's reader is defined not to be in. Assert additionally that no quoted path resolves into the package or into this repository's workspace layout."
  - name: test_bp_1500d_5_the_procedure_reaches_the_documented_failure_signal_on_both_deliberately_non_portable_installs_and_the_success_signal_again_after
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE FALSIFIABILITY CONTROL THE CRITERION DEMANDS, as five runs of the SAME procedure: (1) good install -- documented success signal; (2) record filed with the producing package instead of the receiving project -- the documented failure signal, not silence and not a passing-looking result; (3) restore -- success signal again; (4) record keyed to a location it is not being read from -- the documented failure signal again; (5) restore -- success signal. Assert the signal reached MATCHES THE ONE THE REFERENCE DOCUMENTS, not merely that something failed: a procedure that produces an undocumented error in runs 2 and 4 leaves the reader exactly as stranded as silence would. Runs 3 and 5 attribute each failure to its breakage rather than to a procedure that cannot succeed."
  - name: test_bp_1500d_5_the_reference_documents_the_post_fix_signals_of_the_build_and_of_both_checks
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "THE INERT-VERSUS-PASSING PROMISE, which is the reference's central claim and the one most likely to rot. In the deployed out-of-package install, produce all three states the reference describes -- a build that cannot produce the record, a check that finds no readable record, and a check that read the record and found nothing wrong -- and assert that for each, the signal the deployed code actually emits matches the signal the reference documents for it. Assert specifically that the reference's could-not-read signal and its all-clear signal are DIFFERENT from each other as documented, and that the deployed code agrees; if the document describes two outcomes the code does not distinguish, the reference is teaching a distinction the reader cannot make. This entry is expected RED until BP-1500d-3 and BP-1500d-4 land."
test_rationale: |
  This AC carries a test_spec rather than test_required: false, and the reason is in
  its own criteria: "the reference is checked by following it against real installs,
  never by confirming that a document with the expected heading exists." That is a
  demand for an executable check. A documentation AC accepted on "the document exists
  and mentions the record" would be precisely the grep-shaped acceptance BP-1500d's
  mandatory proof shape refuses -- and would be especially hollow here, because the
  defect being documented is invisible from inside the producing package's own
  workspace. change_target remains docs and assigned_agent remains
  documentation-expert; the deliverable is the reference. The tests exist to make the
  falsifiability clause mechanically checkable rather than a matter of opinion.

  The single most important property of this contract is that entry 1 drives the
  steps FROM the document rather than transcribing them into the test. A test holding
  its own copy of the procedure verifies the behaviour and says nothing about the
  reference, which is the artifact under test. Driving from the document is what makes
  the test go red when the two diverge -- which is how a reference rots.

  Entry 4 is the one that protects the reference's central promise. A document can
  describe two outcomes the code does not actually distinguish, in which case it is
  teaching a reader a distinction they cannot make in their own terminal -- worse than
  saying nothing, because it manufactures false confidence in exactly the situation
  this L1 exists to fix. It is also the entry that pins the ordering: today the build
  exits 0 when it cannot produce the record and both checks warn and return 0 when
  they cannot read one, so a reference written now would publish the defect as the
  contract. Entry 4 is expected RED until BP-1500d-3 and BP-1500d-4 have settled.

  Entry 3 is the criterion's own mandated control, written as five runs rather than
  two reds, and it asserts the signal MATCHES the documented one rather than merely
  that something failed. A procedure that produces an undocumented error on a broken
  install leaves the reader as stranded as silence would; reaching a documented
  failure signal is the whole value of the reference.

  Entry 2 encodes the reader's actual position. The reference is defined for someone
  who does not have the producing package in front of them, so verifying its commands
  from this workspace verifies them in the one situation its reader is not in.

  Angles: criterion, reachability, deployed -- plus failure, which is conditional and
  consumes no slot. Three core angles, under the cap of four. seam is not charged: the
  document/behaviour boundary is real but is asserted structurally by entry 1 driving
  from the document, rather than as a producer-consumer signature. real_artifact is not
  charged because the artifact under test is prose, and the record's serialized form is
  charged on BP-1500d-2. boundary is not charged because the criterion names no range,
  count or limit.
