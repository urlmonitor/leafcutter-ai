    angle: failure
    description: "A constructed entry that is always_run and also carries a files condition is reported by the reachability judgement as self-contradictory and the run fails."
  - name: test_ge120h3i_location_anchored_entry_matching_nothing_is_unreachable_not_nothing_to_match
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A constructed entry anchored on a location the checkout holds no file under is classified UNREACHABLE and fails the run — the stronger verdict, distinct from NOTHING-TO-MATCH."
  - name: test_ge120h3i_no_entry_added_by_the_registration_is_in_either_failing_class
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    surface_invoked: "check_hook_trigger_reachability.py via run_hook.py"
    description: "The reachability judgement run over the real manifest after registration reports none of the five in either failing class."
  - name: test_ge120h3i_each_new_entry_declares_a_change_set_source_the_determination_credits
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "determine_change_set_sources over the real manifest places each of the five in a governed bucket and none in .failures — a declared source the determination will not credit fails this test."
test_rationale: >-
  The two failing arms need constructed entries because the real manifest must not
  contain either shape; they are exercised by running the existing reachability
  judgement over fixtures rather than by reimplementing its rules. The last arm is
  run over the real manifest because that is the only artifact whose correctness the
  criterion is about. The change_set_source test is the one this enrichment added
  beyond the literal clauses, and it is the load-bearing one: the criterion asks the
  entry to declare that the check derives its own change set, the manifest has a field
  that says exactly that, and the field is verified against the script's source — so
  the declaration can be written, look right, read right, and be false, with the
  current suite green. Asserting through determine_change_set_sources rather than
  against the literal string is what makes the declaration answerable to the code it
  describes.
