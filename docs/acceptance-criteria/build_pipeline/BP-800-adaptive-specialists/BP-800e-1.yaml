estimated_complexity: M
it_requirements:
  - "Detection must check TWO signals: (1) agent files without 'generated-by' metadata AND (2) absence of technology manifest"
  - "Must not trigger migration if a technology manifest already exists (even if legacy files are also present)"
  - "Must run detection before any specialist generation (fail-fast on legacy layout)"
  - "Must handle errors gracefully per the project error handling policy if agent files are unreadable"
  - "Must log at INFO level when migration is triggered (not WARNING — this is an expected first-run path)"
delivers_to:
  agent: python-coder
  contract: "Migration trigger signal — boolean indication that the migration pipeline (BP-800d-1 through BP-800d-3) should run before normal generation"
