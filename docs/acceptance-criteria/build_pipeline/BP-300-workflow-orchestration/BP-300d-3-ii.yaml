    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "With CLAUDE_CODE_VERSION unset and subprocess.run mocked to return the real `claude --version` format: '2.1.294 (Claude Code)\\n' installs with no 'version unknown' warning; '2.1.100 (Claude Code)' (below the minimum) skips with the minimum-version warning; output with no version number warns 'unknown' and installs."
