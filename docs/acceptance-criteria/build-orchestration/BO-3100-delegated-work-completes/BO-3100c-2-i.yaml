notes: |
  A sweep written against today's list of coordinators passes on the day it lands and stops
  working the first time someone adds one. That is precisely how the prompt-level fix rotted:
  building-epics §2.1-R1 was correct for the agent that loaded it and had nothing to say about
  the agent that stalled one level down, which had been added to the chain without the rule
  following it.

  THE SECOND SCENARIO IS A DELIBERATE SCOPE LIMIT, and it is where this AC could be argued
  either way. A coordinating specialist that exists but is unreachable is dead weight, not a
  live hazard, and reporting it would push the sweep back towards inventorying the source
  tree — which is the method BO-3100c-2 forbids because it gives wrong answers in both
  directions. Recording the reasoning here so a later implementer does not "improve" the sweep
  into a source scan. If unreachable coordinators are judged worth reporting, that is a
  separate criterion with a separate mechanism, not a widening of this one.

  IT-PO CONFIRMATION (2026-08-26). The scope limit is preserved deliberately and is now
  enforced twice over: as an it_requirement on this AC forbidding any source scan, and as a
  test on BO-3100c-2 asserting the sweep reaches its verdict with the source tree unreadable.
  Recorded here because the boundary was previously carried only in prose, where a future
  contributor could remove it without failing anything.
