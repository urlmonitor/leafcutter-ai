id: DK-300d-2-i
title: "A required provider envelope that cannot fit is rejected explicitly"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given the full unchanged goal and required classifier fields alone exceed the receiver's configured serialized limit,
  When provider admission checks the final request size including escaping and envelope overhead,
  Then classification is explicitly rejected before any model call,
  And the request is not made to fit by truncating, splitting or rewriting the goal,
  And if required fields exactly fit but optional context does not, the required request can proceed with optional context omitted and the omission recorded outside that full request.
