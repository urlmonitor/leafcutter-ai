id: BO-2500d-1
components:
  - build_orchestration
  - review_system
title: "The fast lane carries at most one LLM verdict, and that verdict can only withhold delivery — never confer done"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the fast-lane phase order,
  When its phases are enumerated,
  Then it contains no LLM validator agent, and no LLM fulfillment
    gate agent,
  And it contains at most one LLM agent whose verdict bears on whether the run's change
    is delivered,
  And the only completion arbiters it lists are the mechanical proof-of-done gates —
    red-baseline verification, green-plus-coverage verification, and the covers-tag
    linkage check, and nothing else.

  Given one fast-lane run over a resolved set of acceptance criteria,
  When the set of acceptance criteria that run records as done is compared with the set
    the mechanical proof-of-done gates alone would have permitted it to record as done,
  Then the first set is a subset of the second on every path the run can take,
  And no path exists on which an LLM verdict is the reason an acceptance criterion
    reaches done: the single reviewing agent can shrink the delivered set, and can never
    enlarge it.

  Given the same fast-lane run driven twice over the same resolved set and the same
    mechanical gate results — once with the reviewing agent returning a verdict that
    withholds delivery, and once with it returning a verdict that does not,
  When the acceptance criteria recorded done by each run are compared,
  Then the run whose verdict did not withhold records exactly the acceptance criteria
    the mechanical gates permitted,
  And the run whose verdict withheld records a subset of those — for the fast lane as
    it stands, none of them, because nothing is delivered,
  And neither run records an acceptance criterion done that the mechanical gates did
    not permit.

  Given a fast-lane run in which one of the mechanical proof-of-done gates does not
    pass, and the single reviewing agent returns a verdict that does not withhold
    delivery,
  When the run ends,
  Then the acceptance criteria the failing gate covers are not recorded done,
  And the reported outcome names the mechanical gate that did not pass, rather than
    reporting a clean review as the run's verdict.

  Given the same fast-lane run driven once with the single reviewing agent present and
    once with it absent from the lane entirely, all mechanical gate results held equal,
  When the acceptance criteria recorded done by each run are compared,
  Then removing the reviewing agent never turns a not-done acceptance criterion into a
    done one — the set recorded by the run without the reviewer is the set the
    mechanical gates permitted, and the set recorded by the run with it is a subset of
    that same set.
