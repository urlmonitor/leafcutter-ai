assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The surface is scripts/ac_store/scan_ac_store.py, which is in the build deploy_map (scripts/build_phases.py:795). Verified behaviour to pin, not to re-derive: _is_leaf at line 145 matches only L2/L3, and _is_approved at line 189 requires the literal string 'approved'. Those two predicates are why a parked stub is absent from the queue today — by accident of selection rather than by declared intent, which is exactly what this AC converts into a guarantee."
  - "SET IDENTITY, NEVER A COUNT. The 436 figure is a dated calibration; a live scan on 2026-08-14 returned 436 ready records and the number moves with every merge. The test must capture the baseline ready set at runtime and compare sets across the three states; a hard-coded count will be red on unrelated work and will be 'fixed' by editing the number."
  - "All three states must be measured in one run over the SAME store snapshot, so the comparisons are meaningful. Operate on a temporary copy of the real store; the committed records must be unchanged afterwards."
  - "The third state must assert exclusivity, not just presence: when a decomposed, approved L2 exists under KM-200, exactly that record joins the ready set and no other record from the tree does. A presence-only assertion passes when the whole tree floods the queue."
  - "Coverage must execute the scan as a process and compare returned sets; asserting the shape of _is_leaf or _is_approved in source satisfies nothing, and would in fact defeat the purpose — the point is to detect a future change to those predicates by its effect."
test_spec:
  - name: test_parked_state_ready_set_identical_to_baseline
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "With the marker and reason added to KM-200.yaml, the scan executed as a process returns a ready set identical, record for record, to the runtime-captured baseline."
  - name: test_unparked_undecomposed_adds_no_record_to_ready_set
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "After the un-park transition with no record below feature level authored, the ready set still contains no KM-200 record."
  - name: test_approved_l2_leaf_is_the_only_record_that_joins
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Once an L2 under KM-200 reaches readiness approved, exactly that record appears in the ready set and no other record from the tree does."
  - name: test_no_hard_coded_ready_count_in_the_assertions
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "All three comparisons derive their baseline at runtime; no literal ready-record count appears in the test, so concurrent authoring cannot make it falsely red or green."
  - name: test_real_store_unmodified_by_the_three_state_measurement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "The committed store records are byte-identical after the run."
