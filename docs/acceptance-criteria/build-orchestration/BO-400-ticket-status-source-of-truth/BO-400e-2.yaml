assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the completion-write step in build-feature.js and the twin step in build-ticket.js. Both must reach the same refusal, and both must change in the same commit."
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_bo_400e_2.py"
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_done_recording.py"
  constraints:
    - "VERIFY BY EXECUTION, NEVER BY GREP. The parity check already exists in the source, so a test that finds it there passes on the broken driver -- the defect is that nothing routes to it. Drive both the refused ticket and the control ticket through the real workflow via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert on the records the run wrote."
    - "THE REFUSAL IS ROUTED TO, NOT RE-IMPLEMENTED. BO-400a-2-i already specifies this refusal for the guarded writer, down to the message string, and is ratified. Do not restate it, do not duplicate it in the drivers, and do not add a second implementation of the same rule -- a second refusal implementation is a second door under another name."
    - "A REFUSAL MUST NOT MUTATE THE RECORD. Refusing is a read-only outcome. The ticket's record must come back exactly as it was found, with the outstanding step still named as needed -- not reclassified to not-needed, not marked excluded, not marked already satisfied, and not annotated as a side effect of having been refused. Rewriting the demand away is the failure mode this clause exists to catch."
    - "THE CONTROL CASE IS PART OF THE CONTRACT, NOT A TESTING STYLE. Every demonstration that the mechanism refuses must be accompanied, in the same run, by a ticket that IS written finished. BO-400a-2-iii established this the hard way: a driver reverted to never writing at all satisfies every refusal clause and looks correct."
    - "NO TOLERANCE, THRESHOLD OR GRACE PERIOD. The measured consequence is more halts -- roughly 316 tickets whose records demand a step they never got will now be refused reliably. That is the correct outcome and it must not be softened by a warn-only mode, a percentage allowance, a per-epic opt-out, or an escalating retry that eventually writes anyway. The remedy for a record that asks for the wrong thing is to correct the record."
    - "NO OVERRIDE-SHAPED ESCAPE. The blanket override also switches off the allowed-transition rules and is not a surgical exception; routing the refused close through it converges the two answers on the permissive one and satisfies nothing here."
    - "BOTH TWINS IN ONE CHANGE, per BO-400a-2-ii's standing constraint."
    - "TEMPLATES ARE BUILD SOURCES, NOT THE RUNNING ARTEFACT. Keep the deployed copy of the drivers in step (check-build-drift is the gate) and confirm the refusal through the deployed layout before sign-off."
