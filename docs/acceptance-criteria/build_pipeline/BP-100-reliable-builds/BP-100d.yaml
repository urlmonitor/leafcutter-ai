id: BP-100d
readiness: reviewed
priority: medium
title: "Hooks never block their own source code changes"
component: build-pipeline
level: L1
status: active
criteria: |
  Hook scripts can be staged and committed without triggering false self-detection.

  When a pre-commit hook's own source file is staged alongside production files,
  the hook does not misclassify its own patterns as violations. Developers can
  modify hook infrastructure without being blocked by the very hook they are fixing.
