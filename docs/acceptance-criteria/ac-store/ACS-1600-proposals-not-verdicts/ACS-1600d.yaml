criteria: |
  What cannot be established is left unclaimed, and said out loud.

  Every entry a tool adds to your requirements record reflects something it
  actually established. Where the evidence falls short, the record is left exactly
  as it was and the gap is reported as a gap, rather than being filled with the
  most plausible answer available. A record that says something false is worse
  than one that says nothing, and a shortfall passed over in silence is
  indistinguishable from a shortfall that was never there.
