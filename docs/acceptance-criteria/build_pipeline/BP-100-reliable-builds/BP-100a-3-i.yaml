criteria: |
  Given a test that constructs a unified diff where:
    - The diff header names the file "templates/scripts/commit_guardian/check_contract_shrinking.py"
    - The diff body contains a removed line with "pytest.mark.xfail"
      (a pattern that normally triggers a contract-shrinking warning)
  When the test passes this diff through the contract-shrinking scanner
  Then the scanner reports no production file changes
  And the commit is not blocked

  Given a second test scenario with the same diff content but the file path
    is "src/app/service.py" (a genuine production path)
  When the test passes this diff through the contract-shrinking scanner
  Then the scanner DOES report a production file change
  And the contract-shrinking warning IS raised
