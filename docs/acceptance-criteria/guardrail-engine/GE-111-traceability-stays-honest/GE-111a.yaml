notes: |
  PO authoring note (for the BA). This is the headline guarantee and the
  user-confirmed enforcement decision: BLOCKING, not audit-only. The user was
  explicit — "blocking, not audit-only" — so do NOT decompose a warn-only mode
  as the default behavior at L2. (A configurable warn tier may exist as a
  separate, deliberately-opted-into behavior, mirroring GE-100's warn-vs-block
  config, but the default and the headline behavior is BLOCK.)

  Scope boundary vs siblings: GE-111a owns the *block-the-commit* enforcement
  action and the actionable error message. WHAT counts as "the link is broken"
  (the detection) is GE-111b. The two reconciliation escape routes are GE-111d.
  documentation_triggers [how-to, sequence-diagram] because this introduces a
  new commit-time guardrail behavior the user must understand and a multi-actor
  commit-time interaction (developer -> hook -> AC store -> commit decision).
change_target: code
risk_surface: contract_boundary
