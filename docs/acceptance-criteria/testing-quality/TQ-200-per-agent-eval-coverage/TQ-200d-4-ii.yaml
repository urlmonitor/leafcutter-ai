    templates/agents/test-runner.md is a shipped agent template: only the template source changes; the
    build regenerates the deployed .claude/agents/test-runner.md, which is never edited by hand.
  - >-
    Sections in scope: frontmatter config_keys; the single-file sentence under '## Routing Table'; the
    'single <path>' bullet under '## Actions'. The live-trader routing table rows (the baked-in poetry
    commands) and the '## Output: Failure' rerun commands are out of scope unless they offer a plain-script
    run of a test file, which they do not today.
  - >-
    The instruction reads the setting at run time from the project's skills_config and gives the fallback
    'python -m pytest <file>' only when the setting is absent or empty.
  - >-
    DOCUMENTATION (part of done) - the template is the primary document. docs/reference/skills-config-fields.md
    gains a 'testing_context.test_command' row in the Testing Context table: type string, optional, no
    shipped default, 'The command that runs the project's tests; the test runner runs a named file as
    <test_command> <file>, and falls back to python -m pytest <file> when it is unset.'
  - >-
    DOC-DRIFT TESTS (part of done), in unit_tests/agents/test_runner_prompt/ (new folder): the template's
    frontmatter config_keys includes testing_context.test_command; the template body contains no plain-script
    run of a test file ('python <path>.py' or 'PYTHONPATH=. python <path>.py' in a run instruction); the
    single-file sentence names testing_context.test_command and the python -m pytest fallback; skills-config-fields.md
    has the testing_context.test_command row naming the test runner.
  - >-
    If docs/reference/produced-tests-eval-assertion-kinds-database-setting.md exists when this lands,
    the commands_ran_pytest entry's quoted template sentence is updated in the same change so the TQ-200d-1-ii
    quote test stays green.
  - >-
    KNOWN ISSUE: add to the Status line of docs/known-issues/testing-quality/open-low-ki-tq-20261025-test-runner-runs-a-test-file-as-a-script.md
    'configured-command part fixed by TQ-200d-4-ii'; the file moves when TQ-200d-4-iv lands.
  - >-
    CHANGELOG: one entry for TQ-200d-4-ii written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, naming the test runner's single-file command rule and the skills-config
    reference row.
  - >-
    Behavioural proof is the test-runner eval: the W2 row's commands_ran_pytest on a live run (user-triggered,
    local result) and TQ-200d-4-iv's trap row with recorded outputs.
test_spec:
  - name: test_template_declares_testing_context_test_command
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The frontmatter config_keys of templates/agents/test-runner.md includes testing_context.test_command.
    must_catch:
      - config key left out of the frontmatter
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_template_offers_no_plain_script_run_of_a_test_file
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      No run instruction in the template body runs a test file as 'python <path>.py' or 'PYTHONPATH=.
      python <path>.py'.
    must_catch:
      - revert the fix
      - plain 'python <file>.py' single-file form offered as an alternative
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_single_file_instruction_names_configured_command_and_fallback
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The single-file sentence under '## Routing Table' and the 'single <path>' action name testing_context.test_command
      with the file as its argument and 'python -m pytest <file>' as the fallback.
    must_catch:
      - fallback named as plain python instead of python -m pytest
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_skills_config_reference_lists_test_command
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      docs/reference/skills-config-fields.md has a testing_context.test_command row naming the test runner
      as a reader.
test_rationale: >-
  A prompt change cannot be unit-tested for behaviour; these tests hold the template's checkable claims
  (the declared key, the absent plain-script form, the named fallback) and the reference row. The behaviour
  is proved by the test-runner eval: the W2 row live and TQ-200d-4-iv's recorded trap row.
