notes: |
  Why the lane states the budget as well as the runner having a default: the runner's
  waiting is model behaviour and cannot be proved by a unit test, while the budget on the
  request is a fact a workflow test can read from the recorded dispatches. Stating it also
  makes each step's budget a decision someone took, rather than whatever the shell does.

  600 seconds is the floor, not a promise that the steps fit. On 2026-11-16 one store walk
  took 119 s at load average about 36, and the claim does two. Making the walks faster is
  out of scope here (store-walk speed-ups come later); the IT PO may set a higher budget for
  the claim, because the runner in BO-2400f-7-v waits on a background command beyond one
  shell call.
