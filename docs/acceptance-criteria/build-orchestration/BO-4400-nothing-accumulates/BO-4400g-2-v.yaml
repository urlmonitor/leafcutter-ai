criteria: |
  Given the project "shop" with a shared project whose main line has been fetched, no
    service that knows about pull requests reachable, and these workspaces of shop, each
    made by its workspace maker and each with two commits of its own that are pushed to
    its own line on the shared project but have not reached the main line:
    - "stale-1", holding nothing uncommitted, with no file in it changed for 15 days,
    - "ten-day-1", holding nothing uncommitted, with no file in it changed for 10 days,
    - "recent-1", holding nothing uncommitted, with a file in it last changed 3 days ago,
    - "stale-dirty", holding one uncommitted change to a tracked file made 15 days ago,
      with no file in it changed since,
    - "stale-ahead", holding nothing uncommitted but carrying one further commit, made 15
      days ago, that is on neither its own line on the shared project nor the main line,
      with no file in it changed since,
  When the landed-work pass is run for shop with no person available and no input given,
  Then "stale-1" is cleared through the same clearing door a single clearing request uses,
    and no folder of it remains,
  And the line of work of "stale-1" on the shared project, and the shared main line, are
    identical before and after, so its two commits can still be fetched,
  And "ten-day-1", "recent-1", "stale-dirty" and "stale-ahead" are each identical before
    and after,
  And the pass's one answer lists "stale-1" as cleared by work name and location, and
    lists as kept: "ten-day-1" and "recent-1" as not yet on the main line, "stale-dirty"
    as holding unsent work naming the file by path, and "stale-ahead" as holding unsent
    work naming the commit by identifier.
