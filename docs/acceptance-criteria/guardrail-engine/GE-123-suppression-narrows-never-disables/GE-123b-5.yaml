it_requirements:
  - "Edit the canonical source at templates/skills/security-scanner/SKILL.md and let build.py propagate it (ADR-001). Editing a deployed copy under .claude/, .gemini/, .leafcutter/, EPIC-*/ or worktrees/** leaves the shipped reference unchanged."
  - "The addition extends the existing allowlist section and its path-matching subsection. That subsection currently answers only 'does this entry match this file'; the new material answers 'and is it then honoured'. Keep it in the same section — a separate section on declined entries would leave the matching subsection reading as complete when it is not."
  - "Do not restate the suppression grammar or the accepted and rejected entry forms. GE-123c-5 owns that list and two copies of a grammar drift. This addition is about disposition, not about spelling."
  - "STATE THE COUNTED QUANTITY EXPLICITLY: the rules still able to report on the file, never the results the file currently produces. The findings-based reading is the natural one and it is wrong — under it, quieting the only result a file produces would read as a refusal, which contradicts the documented ordinary use of the allowlist. This one sentence is the difference between a reader who can predict the behaviour and one who cannot."
  - "STATE THE THREE BOUNDARIES a reader will otherwise cross by accident, because each is a case that stays honoured: an entry pinned to a single line number, an entry that leaves one rule still able to report, and an entry that names every rule but is pinned to one line. A reference that describes only the refusal reads as though breadth itself were forbidden."
  - "The notice description must reuse the announcement contract the sibling code ACs define — error stream, allowlist file path, 1-based line number, verbatim text, plus the affected file — and must not invent a second wording or a second set of fields for the document. Describe the INFORMATION carried, not a literal message string, so the wording stays free to change without the reference going stale."
  - "State plainly that the notice is not fatal: the commit is not stopped and the run's outcome is decided by the reported results alone. This is the half a reader is most likely to assume wrongly, and assuming it wrongly makes authors avoid a legitimate feature."
  - "PARITY, BOTH DIRECTIONS, and it is a review obligation rather than an automated one: check every declined case and every honoured case described here against the shipped scanner's behaviour at the time of writing, not against this AC's prose and not against the sibling ACs. Where the reference and the implementation disagree, THE IMPLEMENTATION IS AUTHORITATIVE — raise the disagreement as a defect against the code AC that owns it rather than documenting the intention as fact."
  - "SEQUENCING: this text describes behaviour the sibling code ACs under this L1 introduce, including the notice. Written before they land it documents an intention. Write it against the shipped result, or mark it explicitly as pending and re-check it once they are done."
  - "Examples must not contain credential-shaped literals, and any illustrative allowlist line must use an ordinary source filename. This file is scanned on every commit, and an environment-named example is unreachable in any case because such a path is short-circuited to its name-based result."
  - "Documentation check for this AC, in place of an automated test: (1) the section states that an entry which would leave a file with no rule able to report is declined for that file, with the file reported as though it were absent and no other file or entry affected; (2) it states that the judgement is made against every suppression in force for the file together, that the counted quantity is rules still able to report rather than results produced, and it names the three boundary cases that stay honoured; (3) it states the notice's fields and that the notice is not fatal; (4) PARITY, BOTH DIRECTIONS — every declined case listed is one the check declines and every honoured case is one it honours, verified against the shipped scanner with the implementation authoritative on disagreement."
  - "Verification is by review against the shipped behaviour. Do not author code tests for this AC, and do not add test descriptors to it."
test_required: false
test_rationale: |
  This AC changes prose only, so it carries no executable behaviour and
  test_required is false rather than test_spec being left empty. What is asserted in
  place of a test is the four-part documentation check recorded in it_requirements,
  whose last part is a two-directional parity review against the shipped scanner.
  Both directions of failure land on the reader in the same place: a reference that
  describes a refusal the check does not make tells an author they are protected
  from a mistake nobody is catching, and a reference that omits a refusal the check
  does make leaves an author reading their own restored results as a defect and
  filing it as one. Mechanising the parity would mean deriving the declined and
  honoured cases from the scanner and diffing them against prose, which is a code AC
  of its own and out of scope here; it is raised as a recommended follow-up rather
  than smuggled into a documentation AC.
