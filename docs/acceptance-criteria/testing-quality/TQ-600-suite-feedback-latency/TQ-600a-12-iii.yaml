assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    BUILD THE DEMONSTRATION AROUND THE TEST WHOSE VACUOUS OUTCOME IS A PASS. Using
    one of the "exactly one deploy" tests is easier — it goes red by itself — and it
    proves the weaker thing. The "produces nothing" test is the one that stays green
    while testing nothing, and a detector built only against the red case will not
    see it.
  - >-
    THE DETECTOR READS THE EXECUTION LOG, NOT THE TEST OUTCOME. Compare the observed
    deploy count against whether the test's root came from a seed. Deriving the
    verdict from pass/fail is exactly the blindness the third clause forbids.
  - >-
    THE BYPASS IS A TEST AFFORDANCE, NOT A PRODUCTION ONE. Provide a way to force a
    seed past the ineligibility list that is reachable from the test harness and
    inert in a normal run — and assert that it is inert in a normal run. A bypass
    that an ordinary invocation can reach re-creates the hazard it exists to
    demonstrate.
  - >-
    THE PAIRED CLEAN RUN IS NOT OPTIONAL. Run the same test unseeded in the same
    test method. Without it, a red caused by the bypass machinery is
    indistinguishable from a red caused by the seeding.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-12-ii
    contract: >-
      The ineligibility list, the per-test seed request, and a harness-only way to
      force a seed past the list so the detector has something to detect.
test_spec:
  - name: test_tq600a_12_iii_a_seeded_deploy_count_test_that_would_pass_vacuously_is_detected
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      THE LOAD-BEARING DESCRIPTOR. Force a seed onto the "produces nothing" test. It
      passes on its own terms; the run still exits non-zero and names it. NAMED
      MUTATION: derive the detector's verdict from the test's pass/fail outcome; this
      test must go RED.
  - name: test_tq600a_12_iii_the_diagnosis_says_seeded_not_merely_assertion_failed
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Assert on the message text: it identifies the cause as a deploy-count test
      handed a pre-warmed layout, and names both the test and the seed. A bare
      assertion-error message does not satisfy this.
  - name: test_tq600a_12_iii_the_same_test_unseeded_passes_in_the_same_run
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The paired control, in the same test method as the red case, so the red is
      attributable to the seeding and not to the bypass.
  - name: test_tq600a_12_iii_the_bypass_is_unreachable_from_an_ordinary_run
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      Start a child session with no harness affordance set and confirm no seed can be
      forced past the ineligibility list. The demonstration must not leave a hole
      behind it.
test_rationale: |
  An opt-in seeding mechanism with an exclusion list is a decision, and decisions
  rot. The exclusion list can stay in the file, correctly spelled, and stop being
  consulted — and nothing about the suite's output would change, because the tests it
  protects would be green and fast.

  The first descriptor is built on the worst case rather than the convenient one. The
  "exactly one deploy" tests go red by themselves when seeded, so a detector tested
  only against them can be a pass/fail observer and still look correct. The "produces
  nothing" test stays green. That is the whole hazard, and it is the only case worth
  building the demonstration around.

  The bypass-containment descriptor is included because this record necessarily adds
  a way to defeat the protection TQ-600a-12-ii installs. Leaving that reachable from
  an ordinary run would hand the next author exactly the foot-gun this pair exists to
  remove.
