implemented_by: []
notes: |
  Mechanism is deliberately not chosen here — marking the records terminally
  honoured, archiving the file they live in, or excluding them by a declared
  rule would each satisfy this AC. That choice belongs to the IT PO. The final
  clause is the PO's hard constraint made testable: whichever route is taken,
  the resting state must produce a zero, because a permanent non-zero destroys
  the signal INF-700a exists to provide.

  This AC is the successor to INF-400c-4-ii, which proposed carrying the same
  28 records into a second file. That would relocate the problem rather than
  resolve it: the records would remain unroutable, and the count would remain
  permanently non-zero, in the new location.
