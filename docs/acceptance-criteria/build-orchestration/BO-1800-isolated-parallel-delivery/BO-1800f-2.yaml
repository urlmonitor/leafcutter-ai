criteria: |
  Given a delivery that has already been brought up to date with the shared branch's
    current state, so nothing about it is out of date,
    and the delivery nonetheless takes away 40 lines of a file that the shared branch
    already has and that none of the copy's own commits set out to change -- the
    lines were dropped while the copy's work was being fitted onto that state,
    and the copy has declared no intended removals,
  When the workflow examines what the delivery would take away from the shared branch,
  Then no part of the delivery leaves the copy,
  And the refusal names that file and states that what it takes away was never
    declared,
  And given a second delivery identical in every respect except that it only adds
    lines, that delivery leaves the copy.
