criteria: |
  Given a ticket's source_ac is BO-200a
    and the AC file BO-200a.yaml was originally written with:
      title: "Atomic commit for multi-file deliveries"
    and during implementation the title was amended to:
      title: "Atomic commit with rollback for multi-file deliveries"
    and the amended_by field now contains a ticket path,
  When the pull-request agent assembles the PR at PR-creation time,
  Then it reads the AC YAML file from disk at that moment
  And the PR title is: "Atomic commit with rollback for multi-file deliveries"
  And the PR title is NOT the original pre-amendment text
  And no cached or in-memory copy of the AC is used.
