assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "CONFIG PREREQUISITE: the per-run artifact cap must be read from config/feedback_router.yaml under the key per_run_artifact_cap (an int, default 3). Do NOT hard-code the cap in feedback-router.js"
  - "feedback-router.js must track a created-artifact counter and stop initiating new /quick-fix or /create-ac dispatches once the counter reaches per_run_artifact_cap"
  - "Must report the count of artifacts created at the end of the run"
