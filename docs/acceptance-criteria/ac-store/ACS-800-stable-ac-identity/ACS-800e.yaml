criteria: |
  Limit checks, tree views, and traversal all stay correct after a move.

  Every tool that understands the requirement hierarchy reads it from the recorded
  parent, level, and order metadata instead of decoding the requirement's name — so
  child counts, tree rendering, and navigation reflect reality the moment a requirement
  moves, with no rename needed to make the numbers add up.
