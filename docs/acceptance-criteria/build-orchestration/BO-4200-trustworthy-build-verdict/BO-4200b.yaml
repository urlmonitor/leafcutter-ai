notes: |
  THIS RECORD IS THE FLOOR AND IT IS NOT THE CEILING — say both, because each half has
  been got wrong once. The origin entry's first occurrence prompted "just state the
  scope"; its second occurrence had a report that was already scrupulously qualified
  ("to the run's own knowledge", with a docblock naming the exact extent of that
  knowledge) and a broken pull request was opened regardless. So this record must not
  be treated as closing the goal, and BO-4200a must not be treated as making it
  unnecessary: a wide check reported in vague language is still a report a reader will
  over-trust, in the opposite direction.

  IT IS ALSO NOT AN INSTRUCTION TO HEDGE. A qualifier that appears on every result
  regardless of what ran is noise, and noise is how a caveat stops being read. What is
  asked for is that the statement track the checking — which means it must be capable
  of saying something different when the checking differs.

  BOUNDARY vs BO-2400f-4-vi (work_status done). That record owns a different sentence:
  a reported success must mean the delivered change is landable as far as the run can
  tell, and it explicitly scopes itself to "the required checks whose satisfaction the
  run itself determines before returning — today, the changelog-presence check", and
  explicitly not to remote checks. It is about a CLAIM OF LANDABILITY over a known
  list. This record is about a CLAIM OF SOUNDNESS carrying its own reach. They meet at
  the same surface and neither covers the other: a result can name every required
  check it knows of and still say "gates green" about tests it never ran. Note also
  that record's own 2026-09-07 coverage note, which found the list it reports is a
  fixed empty value at its only call site — evidence that the surface this record
  lands on already has a sincerely-written field that is not computed from anything.

  documentation_triggers: reference-doc. What a verdict asserts, and what it does not,
  is exactly the kind of thing a reader needs one authoritative page for; it is the
  vocabulary every other record in this tree is phrased against. No sequence diagram —
  nothing here changes the order of anything.
