title: "The test runner's 'Database Not Configured' message says the database tests were not run"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the database checker reports not_configured to the test runner,
  When the test runner stops and emits its fixed "Database Not Configured"
      message,
  Then the message names testing_context.db_connection_test by its full path,
      tells the user to set it in the project's skills_config.json, and holds
      the sentence "The database tests were not run.",
    And the rest of the fixed message is unchanged.

  Given a test-runner report for the "missing-setting-database-work" row that
      consists of the fixed message copied word for word and nothing else,
  When the row is scored,
  Then all six of the row's checks pass, including the not-run check,
    And the same report with the sentence "The database tests were not run."
      removed still fails the not-run check (proof that the sentence, and not
      a widened check, makes it pass),
    And a report holding the fixed message plus "The database tests ran and
      passed." fails the not-run check.

  Given the kept re-run 1 and re-run 2 test-runner reports for the row,
      recorded as probe fixtures,
  When the row is scored,
  Then both still pass, and the recorded gold output for the test-runner set
      still passes.

  Given the change is done,
  Then the report_says_not_run entry on the database-setting assertion-kind
      reference page quotes "The database tests were not run." as the
      test-runner template sentence and uses it as the passing example,
    And the drift test that holds each quoted template sentence equal to the
      template text stays green against the updated template,
    And the produced-tests section of the evals README names the sentence
      where it describes the test-runner set,
    And the known issue "test-runner not-configured block has no not-run
      sentence" is moved to resolved naming this AC and its proving tests,
      with the Open/Resolved count of the testing-quality known-issue register
      recounted,
    And one changelog entry names this AC, the template sentence and the
      resolved known issue,
    And no glossary term is added except through the glossary-triage flow.
