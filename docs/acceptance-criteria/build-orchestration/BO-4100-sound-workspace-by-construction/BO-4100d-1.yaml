notes: >-
  Observed 2026-09-14: every created branch was labelled a feature, so fixes, chores and
  hotfixes were silently relabelled. All four kinds are exercised deliberately -- the
  defect is invisible to a test that only requests a feature, because the substituted
  value and the requested value coincide for exactly that one case.
