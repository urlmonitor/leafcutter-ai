priority: medium
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Your approved decision criteria, reused instead of reinvented each time.

  Today every decision is judged by a fresh set of questions, even when earlier
  decisions already asked the same thing in other words, so the same concerns
  are reviewed again and again and nothing learned about them carries over.
  After this goal, the questions behind past decisions are gathered, grouped by
  what they really ask and approved by a person into a shared library that every
  new decision starts from. Fresh questions are written only when the library
  does not cover what a decision needs, and over time you can see how often each
  question was used and how the decisions that relied on it turned out.
