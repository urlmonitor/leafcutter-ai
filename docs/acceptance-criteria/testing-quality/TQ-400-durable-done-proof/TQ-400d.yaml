notes: |
  THIS L1 OWNS THE 244 — SAID HERE SO NOBODY AUTHORS IT AGAIN (2026-08-18, PO).
  Two live surfaces currently claim the untagged-done backlog is unowned:
  KM-ADM-005's notes ("leaving the 244 to be retired separately") and KI-KM-002 in
  docs/known-issues/knowledge-management.md ("That work has no AC and no owner").
  Both predate or overlooked this L1, which was authored 2026-08-17 with exactly
  that remit. It is owned. Do not open a new AC for it.

  DIVISION OF LABOUR WITH THE SHIPPED RATCHET:
    - KM-ADM-005 = the floor. The count cannot grow; a new work_status: done AC
      with no `# covers:` tag breaks the build. Already shipped and required.
    - TQ-400a = the store-wide sweep that produces the inventory.
    - TQ-400d (here) = the drawdown, with a recorded decision per record, and the
      party responsible for LOWERING HIGH_WATER_MARK as the pile shrinks. Note the
      practical consequence for TQ-400d-2 ("progress is measurable from one cycle
      to the next"): the high-water mark is already a machine-readable progress
      metric, and moving it down is the cheapest possible proof of progress. Reuse
      it rather than inventing a parallel counter.

  TWO COUNTS OF THE SAME PILE DISAGREE — RECONCILE BEFORE TRIAGING. TQ-400's L0
  notes record 240 of 641 done L2/L3 records untagged (2026-08-17). KM-ADM-005's
  ratchet records 244 of 607 done ACs untagged (2026-08-13, all levels, ids
  quote-stripped before joining). Different inclusion rules, different dates,
  neither citing the other, so the delta cannot be read as movement. TQ-400d-1's
  worked list must declare its own inclusion rule and state which of these two
  populations it is drawing from — the standing requirement in ACS-1100 (a figure
  arrives with the total it was measured against and the method behind it). Also
  inherit the join-key lesson baked into the ratchet: ids must be quote-stripped
  before matching `# covers:` tags, or four records are miscounted as unproven.
