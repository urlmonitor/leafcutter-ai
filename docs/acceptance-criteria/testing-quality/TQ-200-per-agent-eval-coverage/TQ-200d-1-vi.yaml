test_spec:
  - name: test_empty_window_report_accepts_equivalent_non_null_wordings
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Reports saying 'non-NULL', 'non-None', 'non-null' or 'non-`None`' in any case pass the empty-window row's
      report check (spec read from test-writer.jsonl), and the kept run1 and run2 reports pass.
    must_catch:
      - revert the fix
      - the backticked form 'non-`None`' rejected
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
      - scripts/evals/sets/test-writer.jsonl
  - name: test_empty_window_report_without_a_non_null_phrase_fails
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: unit
    angle: discrimination
    description: '''the check counts the values'' fails, and so does ''returns None when the feed is empty''.'
    must_catch:
      - a bare 'None' or 'NULL' outside a non-NULL phrase accepted
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
      - scripts/evals/sets/test-writer.jsonl
  - name: test_presence_report_accepts_known_expected_or_seeded_value
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      'known value', 'expected value', 'seeded value' and 'known expected value' in any case pass the presence-is-not-correctness
      row's report check, and the kept run1 and run2 reports pass.
    must_catch:
      - '''known expected value'' rejected'
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
      - scripts/evals/sets/test-writer.jsonl
  - name: test_presence_report_without_a_value_phrase_fails
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: unit
    angle: discrimination
    description: '''the test checks that each symbol has a value'' and ''the value is present'' fail.'
    must_catch:
      - a bare 'value' accepted
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
      - scripts/evals/sets/test-writer.jsonl
  - name: test_other_report_mentions_rows_keep_their_one_term
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      Every other report_mentions spec in test-writer.jsonl and test-runner.jsonl has no also_accepts, and a report
      holding only an equivalent wording of its term (for example 'non-None' against a row whose term is 'refresh_config')
      fails it with today's detail.
    must_catch:
      - the widening applied to every report_mentions row
      - also_accepts added to another row
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
      - scripts/evals/sets/test-writer.jsonl
      - scripts/evals/sets/test-runner.jsonl
  - name: test_test_writer_and_test_runner_gold_still_pass
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-writer --score-gold --results-file <tmp>
    description: >-
      The real CLI replays the test-writer and the test-runner gold outputs (--agent test-runner too) and every
      row passes.
  - name: test_report_mentions_entry_states_equivalent_wordings
    target_dir: unit_tests/evals/tq200d1vi/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The entry names also_accepts and the two rows using it, its examples score as stated, the README bullet links
      #report_mentions, and the known issue's parts 1 and 2 are struck with a note naming TQ-200d-1-vi.
    must_catch:
      - entry still describes a single term only
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
      - scripts/evals/README.md
test_rationale: >-
  The fix widens a substring check, so the weight is on what must still fail: a bare None or value, and every other
  row that must keep its single term (the boundary test is the guard against the widening spreading). The kept reports
  prove the falsely red rows now pass on real agent output.
