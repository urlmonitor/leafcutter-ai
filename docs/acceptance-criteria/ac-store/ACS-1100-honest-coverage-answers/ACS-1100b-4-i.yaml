notes: |
  WHY THIS EXISTS. ACS-1100b-4 removes the ground that a validator is relying on
  today. Removing it with nothing in its place would leave a project that has
  decided to backfill 36 entries with two options, both bad: halt on every run until
  the backfill finishes, or go back to saying nothing. This L3 is the third option,
  and it is the one the repository has already shipped once elsewhere — a declared
  count, a measurement date, and a ratchet that only lets the number fall.

  THE LOAD-BEARING DIFFERENCE from the ground ACS-1100b-4 forbids is that this one
  is finite and observable. Age is permanent and invisible: nothing about it ever
  changes, so nobody ever looks again. A dated, owned, monotonically shrinking count
  is a piece of work with a end, and a reader can tell from the answer alone whether
  it is moving.

  NOT A GENERAL EXEMPTION MECHANISM. This ground is available while a named record
  is backfilling a named population. It is not available for "we have decided this
  rule only applies going forward" — that is the narrowing decision, and per
  ACS-1100d-5 it is made by rewording the requirement, in the open, not by declaring
  an exclusion on the answer.
