notes: |
  Satisfies BO-3600e's documentation_triggers: [how-to].

  The burn-down is a human activity performed against a list, which is the one case
  where a how-to is load-bearing rather than decorative: BO-3600e requires the
  starting population to be worked through, and an undocumented procedure over a
  large list is how a backlog becomes permanent.

  The second scenario is the verification that matters and is deliberately harsh —
  followed end to end, by someone new, against the real store, with a real decision
  recorded at the end. A guide reviewed but never walked is the documentation
  equivalent of a check that never runs.

  assigned_agent deliberately unset — the how-to surface belongs to the IT Product
  Owner's assignment pass.
