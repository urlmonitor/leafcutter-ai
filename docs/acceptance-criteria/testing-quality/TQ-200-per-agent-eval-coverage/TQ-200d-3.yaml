id: TQ-200d-3
components:
  - testing_quality
  - llm_authoring
title: "The test designer has an eval set that checks it names wrong versions for fixes and gates, and does not force them on new behaviour"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: in_progress
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the test designer exists and has no eval set,
  When its eval set is added to the existing eval harness,
  Then the set holds at least these rows, each an input paired with the
      outcome expected of the test designer —
        "bug fix": for the requirement "a database outage no longer causes a
          retry storm; the refresh runs only when a refresh is due and a retry
          is due", the guarding test entry names "revert the fix" and at least
          one wrong version naming the condition involved, such as "drop the
          retry_due condition",
        "gate": for the requirement "a trade is blocked unless both the window
          is open and the position limit is not reached", the guarding test
          entry names one wrong version per condition ("drop the window-open
          condition", "drop the position-limit condition") and "the gate
          always allows",
    And the set holds at least one trap — "new behaviour": for the requirement
      "export the report as CSV", a test design that invents wrong versions
      such as "revert the fix" for behaviour that had no earlier version fails
      the row, and a design that names none passes it,
    And in every row the design's judgement of whether the requirement is a
      bug fix, a gate or neither is shown by the fields of its test entries,
      not by a free-text sentence: for a bug fix or a gate, at least one
      entry names wrong versions (must_catch) or is a discrimination test
      (angle: discrimination); for neither, no entry carries either,
    And a local run of the shared eval runner for the test designer picks up
      every row without anyone naming them, and reports a score for each row,
    And a result from such a local run is reported as a local result; nothing
      presents it as checked by CI.
depends_on:
  - TQ-200d
  - ACD-2500d-5
