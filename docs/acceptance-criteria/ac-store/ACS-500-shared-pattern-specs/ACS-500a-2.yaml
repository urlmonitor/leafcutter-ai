criteria: |
  Given a shared behavior pattern needs to be defined (e.g. "paginated-collection"),
  When the pattern AC is created,
  Then it is stored as a standard AC YAML file within
    docs/acceptance-criteria/<component>/<feature-folder>/,
  And it uses the same component field as the consuming ACs that reference it,
  And it appears in the parent AC's covered_by list like any other child,
  And no separate "pattern catalog" directory or registry file is created.
