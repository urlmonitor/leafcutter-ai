assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Every git read in check_adr_collision.py must be performed against the resolved
    repository, not against the invoking process's working directory. _run_git already
    accepts a cwd argument (line 87); the staged-set read at lines 139-141 is one call
    site, not the only one — audit EVERY _run_git call in the module in the same change
    and verify each passes the resolved context. A fix applied to the one reported call
    site leaves the rest inheriting the process working directory."
  - "A read that could not be performed must remain distinguishable from a read that
    found nothing. The module's existing ReadFailure boundary is the right seam and must
    not be widened into a return of an empty pending set."
  - "The resolution itself must come from the single ordered anchor sequence the parent
    L1 requires, with an explicitly named repository outranking the working directory.
    Do not add a second, module-local resolution route."
  - "No new module is required for this record — check_adr_collision.py measures 219
    lines against its 400-line limit (measured 2026-10-09 with the gate's own
    measurement rule), so there is headroom to add the resolution plumbing in place. If
    a helper is extracted anyway it must live in templates/scripts/commit_guardian/,
    which deploys wholesale; anywhere else needs a deploy-map entry in the same change."
  - "templates/scripts/commit_guardian/check_adr_collision.py is the SOURCE. An edit to
    scripts/commit_guardian/ or .leafcutter/scripts/commit_guardian/ alone is reverted
    by the next build — those paths are untracked build outputs in this checkout."
  - "Must not change the reference from which the already-claimed number sequence is
    read; that is a separate filed condition and no clause here depends on it."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_collision_named_from_non_repository_working_directory
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: templates/scripts/commit_guardian/check_adr_collision.py
    description: >-
      Arm 1. Real throwaway git repo with ADR-068 committed and a second ADR-068 staged;
      a separate directory that is NOT inside any work tree holding a deployed copy of
      the pre-flight and a declared anchor naming the repo. Invoke the pre-flight as a
      subprocess with cwd set to that non-repository directory and no repository
      argument. Assert non-zero exit, that 68 and the already-claiming record's path
      appear in the output, and that the 'unable to read the pending changes' text does
      NOT. No build.py spawn, no shared-layout fixture, so no marker.
    must_catch:
      - "restore the staged-set read without the working-directory argument, so git inherits the process working directory"
      - "verify only from the repository root, where the defect and the fix are indistinguishable"
  - name: test_same_verdict_from_repository_root_and_from_outside
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 2 paired with arm 1 as one assertion rather than two. Same staged collision,
      two runs — cwd=repository root and cwd=the non-repository directory — and the two
      verdicts must be equal. Stated as an equality because arm 2 alone passes today;
      only the pairing makes the working directory's irrelevance assertable. No marker
      (no layout fixture requested).
    must_catch:
      - "restore the working-directory-inherited read, under which the two runs disagree"
  - name: test_non_colliding_staged_record_passes_from_non_repository_directory
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      Arm 3. Stage an ADR claiming a number no committed record claims, run from the
      non-repository directory, assert exit 0 and a reported absence of collision. This
      is the arm that forbids a fix shaped as 'refuse whenever not run from the root'.
      No marker.
    must_catch:
      - "restore the staged-set read without the working-directory argument, so git inherits the process working directory"
      - "refuse unconditionally when the working directory is not the repository root"
  - name: test_unestablishable_repository_does_not_report_clean
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      Arm 4. Same staged collision, but the run is prevented from establishing which
      repository it belongs to (declared anchor removed or pointed at a non-repository).
      Assert non-zero exit AND that the output states the pending changes could not be
      read AND that no 'no collision' verdict is reported. The three assertions are
      separate because an implementation can refuse while still printing a clean verdict
      line. No marker.
    must_catch:
      - "on a read that cannot be performed, return an empty pending set and report no collision"
      - "swallow the failure and exit 0"
  - name: test_reported_colliding_set_grows_with_the_staged_set
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 5. Stage a second record claiming a second already-claimed number and re-run
      from the non-repository directory; the set of colliding numbers named must grow to
      include it. This is the only arm a fixed literal containing 68 fails. No marker.
    must_catch:
      - "replace the staged-set read with the set of numbers observed at implementation time"
  - name: test_deployed_pre_flight_resolves_its_imports_at_hook_runtime
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: deployed
    surface_invoked: scripts/commit_guardian/check_adr_collision.py
    description: >-
      The deploy-manifest arm. Runs the pre-flight from the real DEPLOYED layout, not the
      source tree, against a staged collision, and asserts it reaches a verdict rather
      than a ModuleNotFoundError. Requests the session-scoped shared_reference_layout
      fixture and declares @pytest.mark.shared_layout_reader — it only reads the layout,
      so it must not spawn its own build.py (one build costs 59.8s).
    must_catch:
      - "add a resolution helper module that the build does not deploy, so the deployed hook crashes while source-tree tests stay green"
test_rationale: >-
  Every entry invokes the pre-flight as a real subprocess against a real git index and
  reads the verdict out of exit status and output. None greps the source. That is not a
  stylistic preference here: a test asserting that _run_git is called with a cwd
  argument, or that a resolver is imported, passes on a program that never runs and on
  one whose other call sites still inherit the working directory — and CLAUDE.md's
  behavioural-verification rule outranks any test_spec that sanctioned the weaker form.
  Two choices are load-bearing. First, the non-repository directory must hold a deployed
  copy of the program: a harness invoking from an empty temporary directory reproduces
  'nothing to run', a different condition that proves nothing about this one, as the
  record's own notes state. Second, arm 2 is specified as an EQUALITY between two runs
  rather than as its own pass, because arm 2 passes against the defect; verifying only
  from the repository root cannot distinguish the fix from the bug. Markers: only the
  deployed-layout entry requests shared_reference_layout and therefore carries
  @pytest.mark.shared_layout_reader; the other five neither request the fixture nor
  build anything, so they are outside the marker-routing mechanism entirely and pay no
  build cost. Caveat carried forward from enrichment: arm 1 requires the pre-flight to
  reach a repository from a directory that is not one, which is only satisfiable via a
  DECLARED anchor (the install's own configuration naming its project root). The harness
  must provision that declaration; a downward filesystem search is not an acceptable
  substitute, because in the real workspace parent 78 candidate work trees exist and a
  search would have to pick one.
