readiness: reviewed
priority: medium
title: "A feature's missing documentation AC is filled in before its batch is promoted to reviewed"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given the IT PO is enriching a batch of ACs with technical fields,
    and a feature in the batch declares documentation triggers because it introduces new
    commands, flows, state machines or architectural components,
  When the requirement rule check (ACD-2500a-2-v) reports a trigger that has no matching
    documentation AC, naming the trigger and the specialist it expects,
  Then the IT PO adds the missing documentation AC, assigned to that specialist, before any
    AC in the batch is set to readiness: reviewed,
  And whether documentation coverage is complete is decided only by the requirement rule
    check -- the IT PO carries no coverage check or trigger-to-specialist table of its own,
  And no batch is promoted to readiness: reviewed while the rule check still reports a
    trigger without its documentation AC.
depends_on: [ACD-200, ACD-2500a-2-v]
