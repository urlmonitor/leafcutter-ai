    angle: boundary
    description: "A done L2 whose covered_by mixes a done-and-covered AC-id child with a test-file path produces NO violation — the test-path entry is ignored for compositeness and the composite is proven by its real AC-id child alone."
    covers:
      - BO-2500b-1-iii
test_rationale: |
  The defect is a classification mismatch between the static pre-commit hook (composite
  decided by level) and done_proof.py::_verify_composite_eligible (composite decided by
  non-empty covered_by), so the tests must drive the real check_staged_done_proofs entry
  point over real on-disk AC YAML and a real test tree. The triad mirrors BO-2500b-1-ii:
  the pass case alone could be met by skipping any AC with covered_by, so the
  unproven-child case keeps the composite path honest, and the empty-covered_by L2 case
  pins the leaf path and its exact reason string on this required gate. Two further
  boundary tests guard against the regression the first fix introduced: this store also
  uses covered_by on a LEAF to record its own proving test-file path(s) (this very AC's
  own record is the real-world example), so "composite" must be decided by AC-id
  children specifically, never by mere non-emptiness — one test pins the pure-test-path
  leaf case, the other pins a mixed AC-id-plus-test-path composite still resolving
  correctly.
