it_requirements:
  - >-
    STATEMENT BREAKS COME FROM THE LEXER THAT ALREADY READS THE FILE. Python: from the stdlib
    token stream, a statement starts after a top-level `;` and after the `:` ending a compound
    header (if, elif, else, for, while, try, except, finally, with, def, class, async) when its
    first token is on the separator's row; a lambda's own `:` is skipped; `match`/`case` are
    soft keywords and are left out. JavaScript family: a `;` outside any parenthesis opened
    since the innermost brace (so a callback body inside a call splits, a `for (;;)` header
    does not), followed on its line by anything but a closer, a separator, a comment or the
    line end. SQL and shell supply no breaks.
  - >-
    ONE SPLIT, IN spans.counted_keys. A line is split at its breaks and each piece is counted
    and keyed as if it stood on its own line, taking the line's indentation, so the measured
    length and the added-lines diff (GE-127d-3-iv) still come from the same pass. In Python
    the `;` itself is uncounted punctuation, so `a = 1; b = 2` keys exactly like two lines.
  - >-
    The published rule clause is generated by probing the measure on a joined line per
    language (rule_statement), never hand-written.
test_spec:
  - name: test_ge_127d_3_v_joined_statements_measure_as_if_each_stood_on_its_own_line
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Joined and one-per-line forms in .py, .js, .ts and .tsx measure equal, and more than
      the joined form's physical line count.
    must_catch:
      - "lines counted, not statements"
  - name: test_ge_127d_3_v_a_separator_that_separates_no_statements_does_not_split_a_line
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      for (;;) headers, separators in strings, templates and comments, lambda and annotation
      colons, a docstring on its header line, and SQL and shell lines measure their code lines.
  - name: test_ge_127d_3_v_semicolon_joins_key_exactly_like_the_split_form
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The counted-line keys of each `;` join equal those of its one-per-line form.
  - name: test_ge_127d_3_v_a_join_only_change_on_an_over_limit_file_adds_zero_and_keeps_its_length
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Through the gate in a temporary repository, joining J pairs (J varied) and the reverse on
      over-limit .py and .js files completes, states 0 added and quotes equal lengths.
  - name: test_ge_127d_3_v_a_join_does_not_hide_code_added_in_the_same_change
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A join plus K new statements on the joined line states K added and is refused.
  - name: test_ge_127d_3_v_the_published_rule_states_the_per_statement_count_only_while_it_holds
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      The generated rule carries the per-statement clause under the real measure and drops it
      under a measure that counts physical lines.
test_rationale: |
  The discrimination descriptor fails under the previous measure (joined lines measured
  fewer); the gate descriptors prove the join neither shortens the quoted length nor hides
  added code, which is the exploit shape; the boundary descriptor guards against false splits.
