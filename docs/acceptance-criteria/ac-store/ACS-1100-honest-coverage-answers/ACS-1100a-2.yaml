title: "The total is established without the query's own filters, so it cannot inherit the query's blind spot"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/ac-store/ACS-1100-honest-coverage-answers/ACS-1100a.yaml
criteria: |
  Given a store holding 180 records and a query whose own filter is misconfigured so
    that its pass reaches only 40 of them,
  When the answer is produced,
  Then the reported total is 180, established by enumerating the records under the
    store root without applying any of the query's own filters, match keys, or join
    keys,
  And the answer therefore reads 40 of 180, not 40 of 40,
  And the same holds when the query's pass reaches nothing: an answer whose join
    matched none of the 31 available records reads 0 of 31,
  And the same holds for a population the query never sees: when 9 records of a given
    kind exist under the store root and the query's pass surfaces none of them, the
    answer reports 9 in scope and 0 observed rather than omitting that kind entirely,
  And a measurement whose own argument handling collects no records from a location
    that holds records reports the count that location holds rather than reporting a
    clean outcome over an empty set: a validation run pointed at a directory holding 21
    requirement records reports 21 in scope, never "no records to validate" with a
    successful outcome,
  And the join between the enumerated population and the observed set is made on
    NORMALISED identifiers, so a record whose identifier is written with surrounding
    quotes — id: "GE-114-1" — matches the bare token GE-114-1 that the observing side
    carries, and that record is counted as observed rather than as a miss: the one
    shipped measurement of this shape mis-counted exactly four records this way until it
    stripped quotes from identifiers before joining,
  And a figure whose join fails on formatting variance alone does not satisfy this
    criterion, because a population that cannot match its own records on presentation is
    wrong for the same reason as a total drawn through the query's own filters — both
    report the shape of the measurement instead of the contents of the store — and the
    bug symptom this clause forbids is four records reported as unobserved purely because
    their identifier is quoted, with the resulting figure then frozen into a build gate
    as though it were the real count,
  And the normalisation the join applies is named in the answer's method as part of its
    inclusion rule, so a second measurement of the same population reproduces the join
    instead of arriving at a different number,
  And a total produced by applying the query's own filter set, match keys, or join keys
    does not satisfy this criterion, because it carries the same blind spot,
  And a single filter-free enumeration of the store root that yields both the total and
    the result candidates in one traversal DOES satisfy this criterion — the required
    independence is from the query's filters and keys, not from its traversal, and a
    filter-free enumeration has no blind spot for the total to inherit.
