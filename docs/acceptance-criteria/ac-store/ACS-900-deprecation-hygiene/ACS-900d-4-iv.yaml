readiness: approved
priority: high
title: "A retired child neither blocks nor proves its parent's done claim"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
criteria: |
  Given a commit stages a parent L1 record P with work_status "done" and
    covered_by: [P-1, P-2, P-3],
    And P-1 and P-2 are active, work_status "done", each with a passing test
    tagged as covering it,
    And P-3 is retired (status "superseded_by", superseded_by: [AR-400c-1],
    AR-400c-1 exists) with work_status "todo",
  When the done-proof gate runs on that commit,
  Then the gate does not refuse P on account of P-3 being unfinished,
  And P is judged proven from P-1 and P-2 alone;
  Given instead P-1 and P-2 are both retired and P-3 is the only active child,
    with P-3 at work_status "todo",
  When the done-proof gate runs on that commit,
  Then the gate refuses P as unproven, naming P-3 as the unfinished child;
  Given instead every child of P is retired and P is active at
    work_status "done" with no test tagged as covering P,
  When the done-proof gate runs on that commit,
  Then the gate refuses P for its missing covering test, because retired
    children supply no proof for a live parent.
