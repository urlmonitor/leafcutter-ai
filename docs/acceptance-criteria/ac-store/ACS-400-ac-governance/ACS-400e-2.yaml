criteria: |
  Given the repository contains 100 AC YAML files under docs/acceptance-criteria/,
  When a commit is staged that modifies only 2 of those files,
  Then the governance enforcement hook inspects only the 2 staged AC files,
  And the remaining 98 files are not parsed or validated by the governance hook,
  And the hook completes within 2 seconds regardless of total AC store size.
