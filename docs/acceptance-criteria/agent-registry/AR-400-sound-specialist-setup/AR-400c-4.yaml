    relationship: describes
    status: exists
    relevance: "Closes when this passes and the reference check is wired (AR-400a-1, AR-400b-4)."
  - path: docs/build-pipeline.md
    relationship: describes
    status: exists
    relevance: "The build whose ability/hand-off reporting this record's acceptance run inspects."
assigned_agent: python-coder
estimated_complexity: M
change_target: code
risk_surface: internal
package_surface: false
it_requirements:
  - "ACCEPTANCE RUN, NOT NEW LOGIC: the evidence is one real build of the checked-out package into a fresh target after every AR-400 record is done. Any residual warning line in the ability/hand-off part of the run is fixed at its cause in the owning record, never by filtering the output."
  - "The 'ability and hand-off part of the run' is bounded by the output of registry_validator.validate_agent_registry and agent_ability_gate.refuse_on_ability_findings (the two producers of the 2026-10-12 lines 297-326); the 14 compute_intra_package_closure 'A human should verify' lines and the version-probe line are outside it, as the criteria state."
  - "The 30-line mapping is recorded in this record's evidence (the notes table) and each mapped record's test is cited by path."
  - "The examined-specialists figure is derived from the tree at run time and compared with the number of templates/agents/*.md definitions with a registry entry -- never a hard-coded 63."
  - "Tests that need a deployed layout use the session-scoped shared_reference_layout fixture (read-only) rather than spawning their own build.py."
test_spec:
  - name: test_real_build_ability_and_handoff_output_has_zero_warning_lines
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: e2e
    angle: real_artifact
    description: "From the shared reference build of the checked-out package, the validation-phase output (registry validator + ability gate) contains zero [WARNING] lines and the build exited 0."
    must_catch:
      - "a residual warning is hidden by filtering stdout rather than fixing its cause"
  - name: test_examined_specialists_equals_definitions_in_tree
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: boundary
    description: "The examined-specialists figure the run reports equals the number of agent definitions derived independently from templates/agents/ and the registry."
  - name: test_reintroducing_a_2026_10_12_warning_cause_fails_the_run
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Negative control: in a copy of the real tree, restore ticket-supervisor's explicit llm-expert spawn entry; the validator fails with the redundant-entry finding (not a warning)."
test_rationale: >-
  The goal's own acceptance is a property of the real build's output, so the
  test reads that output from a real build; the control proves the clean
  output is not the product of a check that stopped looking.
