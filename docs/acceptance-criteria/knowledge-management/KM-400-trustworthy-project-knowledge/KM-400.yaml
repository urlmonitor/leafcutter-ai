criteria: 'Make informed decisions with evidence you can revisit.


  People and agents can find the requirements, rules and lessons relevant to their work, check where each answer
  came from, and return to the same project version later. Changes become available without disturbing evidence
  already in use. Missing or unavailable knowledge is visible, so an incomplete search cannot quietly become a false
  assurance.

  '
