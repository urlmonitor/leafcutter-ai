title: "Generating a ticket from a doc-triggering AC injects both the writer and the verifier"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200b.yaml"
criteria: |
  Given the ticket generator building a ticket from a leaf AC whose classification
    triggers a documentation demand (per the BO-2200a policy),
  When the generator injects `documentation-expert` into the ticket's agents map,
  Then it also sets the ticket frontmatter flag `documentation_required: true`.
  And it injects `documentation-verifier` into the same agents map with status `needed`.
  And when the AC does NOT trigger a documentation demand, the generator sets neither
    `documentation_required: true` nor `documentation-verifier`.
depends_on: [BO-2200b, BO-2200a-1]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-017-computed-quality-gates.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  Wire the generator so that whenever it injects documentation-expert it ALSO sets
  documentation_required: true in frontmatter and injects documentation-verifier: needed.
  This guarantees every AC-generated ticket that needs docs carries the enforcement gate
  automatically. Consumes the BO-2200a-1 trigger decision.
delivers_to:
  agent: python-coder
  contract: "Generated tickets carry documentation_required: true frontmatter and documentation-verifier: needed whenever documentation-expert is injected. Consumed by BO-2200b-5 (non-suppressibility) and BO-2200d (ordering)."
expects_from:
  ac_id: BO-2200a-1
  contract: "The documentation-trigger decision that gates when this injection fires."
