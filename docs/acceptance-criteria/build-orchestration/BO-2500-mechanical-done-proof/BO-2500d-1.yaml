    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "In a fully green executed run, the recorded agent-call sequence contains no LLM validator dispatch and no LLM fulfillment-gate dispatch, and at most one dispatch whose returned verdict is read by a guard on the delivery path."
  - name: test_heavy_pipeline_phase_order_is_unchanged_by_this_criterion
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The heavy-pipeline phase order still dispatches its review, validator and fulfillment-gate agents, so the fast-lane invariant did not leak into the thorough path (guards BO-2500d-2)."
