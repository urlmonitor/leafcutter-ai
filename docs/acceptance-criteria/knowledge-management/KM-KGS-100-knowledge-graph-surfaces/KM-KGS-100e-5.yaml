id: KM-KGS-100e-5
readiness: approved
priority: high
title: "Pre-existing items are backfilled with a component, and re-running changes nothing"
component: knowledge-management
components:
  - knowledge-management
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100e.yaml"
criteria: |
  Given the store contains items that predate component-membership enforcement and
    whose frontmatter carries no component membership, spanning acceptance criteria,
    tickets, and docs
  When the backfill is run across the store
  Then every item that is required to carry a component membership is assigned a
    non-empty component-membership value naming a component present in the registry
  And no item that is required to carry a component membership is left without one
  And running the backfill a second time over the same store changes no file
depends_on:
  - KM-KGS-100e
  - KM-KGS-100e-1
doc_links:
  - path: scripts/ac_store/backfill_readiness.py
    relationship: context
    status: exists
  - path: scripts/knowledge_query.py
    relationship: context
    status: exists
  - path: config/paths.json
    relationship: specifies
    status: exists
  - path: docs/components.json
    relationship: context
    status: exists
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Implement as an idempotent backfill script following the pattern of scripts/ac_store/backfill_readiness.py: assign a non-empty, registry-valid `components` list to membership-bearing items lacking one across the surfaces that declare `components` in config/paths.json (acs, tickets, docs, and the registries). Determine required-vs-exempt from paths.json edge_fields, never a hard-coded surface list."
  - "Idempotency is a hard requirement: a second run over the same store MUST change no file (byte-stable). Verify by running twice and diffing; the second run produces an empty diff."
  - "Infer the component from the item's location/content, and validate the inferred value against the registry BEFORE writing so backfilled values themselves pass the KM-KGS-100e-1 check."
  - "Preserve existing frontmatter and field ordering on write — insert only the `components` field, do not reflow or reserialize unrelated content (avoid the destructive whole-file-rewrite failure mode noted in project memory)."
  - "Follow the project error-handling policy; log per-item actions at an appropriate severity so a run is auditable."
delivers_to:
  agent: python-coder
  contract: "A store in which every membership-bearing item declares a non-empty, registry-valid `components` list, so a component query (KM-KGS-100e-6) returns a populated result"
