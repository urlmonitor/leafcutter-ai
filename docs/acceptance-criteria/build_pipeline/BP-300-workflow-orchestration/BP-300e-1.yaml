risk_surface: contract_boundary
notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with
  an input string of the form '{"...": "..."}\n\n## Anomalies\n<prose>' asserting the
  returned value equals the intended object. Also coverable by a workflow-level
  integration test that dispatches a stubbed agent returning object-plus-trailing-prose
  and asserts the run reaches its next stage. Belt-and-suspenders: the dispatched
  agents' "return ONLY structured JSON, no surrounding prose" contract is a separate
  reinforcement, not the guarantee this AC tests.
