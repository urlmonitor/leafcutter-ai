notes: |
  This is the "fail-open is not fail-silent" half of the package, split out from
  INF-500d-3 so that each AC covers one behaviour: INF-500d-3 makes a single
  failure legible; this AC makes a failure recoverable (hold and flush) and makes
  a run-wide pattern of failures visible (batch gate).

  THE HOLDING PLACE IS THE OS TEMPORARY DIRECTORY, NOT THE DURABLE LOCATION. An
  earlier draft said the holding place "must satisfy INF-500d-4's durability
  invariant", which is circular: the queue would be required to live in the very
  location whose unwritability is what triggered the hold. It only has to satisfy
  the weaker property that actually matters — survive removal of the temporary
  workspace. The OS temporary directory does, is already used by the submission path
  for the record-identifier fallback file (so it is proven reachable from inside
  every worktree and from plain checkouts), and is available when the durable
  location is not. It is not durable in the long term, which is exactly why the
  flush and the removal gate below both exist.

  THE IDENTIFIER IS MINTED AT HOLD TIME. Measured on 2026-08-13, the record
  identifier is generated fresh on each submission using a random salt, so a
  held-then-flushed report would be written under a NEW identifier and the identifier
  already cited in the run would never resolve — turning a rescued record into an
  orphan and leaving the operator with a citation that looks like data loss. The
  second and third scenarios pin mint-at-hold and carry-through-unchanged.

  THE GATE'S HOST WAS A NAME THAT DOES NOT RUN. An earlier draft placed the batch
  gate in the epic-archival check. Two problems, both fatal, both fixed above:

    1. It is not wired. Searched on 2026-08-13: the archival check skill has ZERO
       references anywhere in the workflow sources, and the finalization workflow's
       enumerated steps contain no archival step at all. A gate hosted there would
       never execute.
    2. Even if it were wired, it was a permanent stuck state. Archival happens after
       the workspace is gone, so the gate would trip precisely when the reports it is
       complaining about are already unrecoverable — no remediation could make it
       pass, and the operator's only exit would be to disable it.

  Moving the gate to the workspace-removal boundary fixes both: that step demonstrably
  exists and runs, and it sits immediately BEFORE the loss, so refusing is actionable.
  The explicit operator override is mandatory regardless — a gate whose failure
  condition is "data was already lost" must always have a way through, or it will be
  disabled wholesale the first time it fires.

  SINGLE-TICKET AND FAST-LANE COVERAGE IS NOW CLOSED, DELIBERATELY. The archival check
  skill states it must not be invoked for single-ticket branches, so hosting the gate
  there would have given standalone and fast-lane drives no loss detection whatsoever
  — the drives most likely to run unattended. Workspace removal happens on every drive
  shape, so the relocated gate covers all of them. If enrichment finds the removal step
  is not shared across drive shapes, that is a gap to report, not to quietly accept.

  The tolerated share is intentionally left as a configured value rather than a
  number fixed in the criteria: the right threshold depends on drive size, and
  freezing it here would make the AC fail for reasons unrelated to the behaviour.
  Whoever enriches this should pick a default and record it.

  The gate is deliberately a batch check rather than a per-submission blocker. A
  per-ticket blocker would contradict BO-2000a-3's approved fail-open guarantee and
  would let a telemetry outage halt real work — the precise trade-off the fail-open
  posture exists to avoid. At the workspace boundary, refusing costs nothing but an
  operator's attention, which is exactly what was missing when a whole drive completed
  with the sink unreachable and 23 failures went unnoticed.
