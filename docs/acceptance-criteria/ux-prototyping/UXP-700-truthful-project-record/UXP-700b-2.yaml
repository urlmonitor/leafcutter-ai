test_required: true
test_rationale: |
  A stated count on its own is satisfiable by a hardcoded number, and a test that asserts the
  count equals a literal is satisfied by the same hardcoded number. The only assertion no
  literal-carrying implementation can satisfy is a varying-population one: change the record,
  the stated figure must change by the matching amount. Both directions are needed, because an
  implementation that counts files found but never re-reads the directory passes the add case
  by accident on a cold cache.
test_spec:
  - name: test_each_check_states_the_number_of_records_it_read
    target_dir: unit_tests/product_truth/
    description: "The report carries a per-check examined figure for every check performed."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_adding_one_artifact_raises_the_stated_figure_by_exactly_one
    target_dir: unit_tests/product_truth/
    description: "Adding one journey raises the journey check's stated figure from N to N+1."
    type: integration
    angle: seam
    framework: unittest
  - name: test_removing_one_artifact_lowers_the_stated_figure_by_exactly_one
    target_dir: unit_tests/product_truth/
    description: "Removing one journey lowers the journey check's stated figure from N to N-1."
    type: integration
    angle: seam
    framework: unittest
  - name: test_stated_figures_are_not_carried_over_between_runs
    target_dir: unit_tests/product_truth/
    description: "Emptying the store between runs yields zero, not the previous run's figure."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  House style copied from BP-100n-4 per the BA memory note: state the measured populations in
  the Given and close with a varying-population clause. This is the record that makes UXP-700b-1
  falsifiable - without per-check figures, "it examined something" is an assertion the checker
  makes about itself with nothing behind it.
