assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "This edge case pins the specific fresh-clone failure: today the deployable-script broken-reference preflight aborts because the feedback source is gitignored and absent on a clone, so the build-prepare step (Approach 1) never reaches the shim/test phase. Once the feedback source is tracked (BP-1000a-5) the preflight must resolve it and the build-prepare step must complete on a fresh clone."
  - "Acceptance is measured at the build-preparation step of the documented CI command on a fresh clone: the preflight guard exits non-failing for the feedback scripts and the prepare step completes, enabling the suite to run."
  - "Consistent with ADR-016 Approach 1: the DEPLOYED scripts/feedback/ output remains gitignored and bridged via the install_shims shim_map for the tests; this AC only asserts that the build's READ source for feedback is tracked so the preflight no longer aborts. Do not resolve this by committing build outputs into source control."
  - "Acceptance is observable only — assert at the build-prepare boundary that the feedback broken-reference preflight does NOT abort; do not re-specify the relocation mechanism here (that is owned by BP-1000a-5). This L3 must stay a thin observable over BP-1000a-5's structural fix, per BP-1200a's decompose-the-outcome / defer-the-mechanism rule."
  - "The fresh-clone determinism this asserts must not depend on leftover working-tree files: the preflight verdict over the feedback source must be identical whether or not a stale scripts/feedback/ working copy happens to be present."
delivers_to: null
expects_from:
  ac_id: BP-1000a-5
  contract: "The build reads the feedback deployable-script source from the tracked templates/scripts/feedback/ mirror; this edge case asserts that, given that tracked source, the fresh-clone build-prepare preflight no longer aborts for a missing feedback source."
