notes: |
  This criterion is the reason the feature exists. Ordering the layers and inserting a
  marker is only worth doing if the bytes before that marker repeat exactly; a wiring
  that rebuilds the prefix slightly differently for each dispatch produces a perfectly
  well-formed bundle that never hits cache. The feature would then be decorative in a new
  way — wired, executing, and still buying nothing.

  It is deliberately asserted over dispatched prompts rather than over function output.
  The pure function's guarantee has been tested since 2026-07-21 and is not in doubt.
  What has never been observed is whether the lane calls it in a way that preserves the
  guarantee, and that can only be seen from the prompts the agents received.

  The suffix-differs assertion is not padding. Without it the cheapest way to make the
  prefix comparison pass is to send every agent the same prompt, which would satisfy the
  letter of the criterion while destroying the per-phase context the lane depends on.
