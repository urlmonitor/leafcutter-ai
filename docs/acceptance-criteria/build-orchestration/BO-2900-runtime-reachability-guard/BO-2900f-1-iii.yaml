id: BO-2900f-1-iii
components:
  - build_orchestration
  - supervisor_system
title: "The record check runs after every dispatched gate, so verification cannot hold on one work item and lapse on the next"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given one drive carrying three work items through the same set of gates,
    And on the first work item it is the test gate that reports success while leaving
      no entry,
    And on the second it is the review gate,
    And on the third it is the delivery gate,
  When the drive completes,
  Then all three work items report that gate as failed,
    And no work item reaches the end of its gates carrying a success that was never
      confirmed against its record,
    And the outcome is the same whichever gate and whichever work item it happened
      to be,
    And a reader given any one of the three work items afterwards can tell, from that
      work item alone, that the gate ran and did not record -- distinct both from a
      gate that was never requested and from a gate that was requested and skipped,
  So the guarantee is a property of the drive rather than a property of a lucky work
    item.
depends_on:
