notes: |
  ACS-500 post-implementation hardening, GAP A follow-up. ACS-500f-1 Phase 2
  loads the HEAD version of each modified AC via a project-root-resolved
  reference but discovers WHICH files were modified via a bare `git diff --cached`
  that relies on process cwd. When cwd is not the repository root (subdirectory
  or worktree invocation), the bare diff queries the wrong repository (or fails),
  so a staged removal of implements_pattern can go undetected and slip through.
  This sibling leaf requires the modified-file discovery to bind to the project
  root the same way the HEAD-version loader does (e.g. `git -C <project_root>
  diff --cached`), with no regression under the normal cwd-at-root pre-commit
  path, and preserving the fail-open convention from ACS-500f-1-i when the
  project-root resolution itself fails. priority intentionally left unset — the
  user sets priority at the final approval gate.
