it_requirements:
  - >-
    Decision (IT PO, 2026-10-30): an address is a postgres:// or postgresql:// scheme followed by a host
    (optionally user:password@ before it); a bare scheme followed by a space, 'or', ')' or the end of
    the text is not an address. The checker-message exemption is not added: the host rule covers the relayed
    message and the paraphrase, and keeps a real address after the message detectable. The placeholder
    exemption stays.
  - >-
    The change applies wherever report_names_no_address runs (the test-writer and test-runner sets); ADDRESS_RE
    users in the same module are checked for the same misread.
  - >-
    Unit tests never call a live model; recorded outputs and probe fixtures only. The five reports in
    the criteria are recorded report fixtures.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched; no new
    module is added at the top of scripts/evals/ (15-file density cap). Tests go in unit_tests/evals/tq200d4/
    (12 files; this AC adds one).
  - >-
    DOCUMENTATION (part of done) - the report_names_no_address entry on docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
    must state that an address is a scheme followed by a host, give the relayed checker message as a passing
    example and 'postgresql://dev:secret@localhost:5432/app' after the message as the failing example,
    and quote the checker's invalid message with its source scripts/db_check/_address.py. The entry names
    its passing and failing examples by the recorded probe files that the unit tests score, so a doc-drift
    test can score the named files and check each gives the result the page states.
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md produced-tests section gains (or updates) one
    line for report_names_no_address: a report names an address only when a scheme is followed by a host,
    so relaying the checker's own message passes, with a link to the kind's entry on the reference page.
    It states the rule in one sentence and does not restate the entry.
  - >-
    DOC-DRIFT TEST: the checker's invalid message quoted on the entry equals the message the checker returns
    today for an invalid address, so a change to the checker's wording fails the test instead of silently
    reopening this defect.
  - >-
    KNOWN ISSUES: git mv docs/known-issues/testing-quality/open-low-ki-tq-20261025-test-runner-row-fails-on-quoted-checker-message.md
    to docs/known-issues/testing-quality/resolved/resolved-low-ki-tq-20261025-test-runner-row-fails-on-quoted-checker-message.md;
    Status 'RESOLVED <date> by TQ-200d-4-i' with the proving test files; move its row in docs/known-issues/testing-quality.md
    to Resolved and recount the Open/Resolved line from the directory. Strike any item of docs/known-issues/testing-quality/open-low-ki-tq-20261024-produced-tests-db-scoring-residual-misreads.md
    this change fixes, with a note.
  - >-
    CHANGELOG: one entry for TQ-200d-4-i written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, naming the address rule, its reference entry and the resolved
    KI.
test_spec:
  - name: test_relayed_checker_message_and_paraphrase_pass
    target_dir: unit_tests/evals/tq200d4/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The report relaying the checker's invalid message word for word passes, and a report saying 'expected
      a postgresql:// URL' passes.
    must_catch:
      - revert the fix
      - bare scheme read as an address
      - only the exact checker message exempted, so the paraphrase still fails
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
  - name: test_real_addresses_still_fail_with_the_address_as_detail
    target_dir: unit_tests/evals/tq200d4/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      A report relaying the message and also naming 'postgresql://dev:secret@localhost:5432/app' fails
      with that address as detail; a report naming 'postgres://db.internal/app' fails; a report naming
      only the placeholder passes.
    must_catch:
      - any report that quotes the checker skipped entirely
      - host-only postgres:// address missed
      - detail no longer names the found address
      - exemption for the <user>:<password> template address dropped
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
  - name: test_test_runner_and_test_writer_gold_still_pass
    target_dir: unit_tests/evals/tq200d4/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-runner --score-gold --results-file <tmp>
    description: >-
      The real CLI replays the test-runner gold outputs (and the test-writer gold in a second call); the
      configured-database rows pass.
  - name: test_quoted_checker_message_matches_the_checker
    target_dir: unit_tests/evals/tq200d4/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The invalid message quoted on the report_names_no_address entry equals the message the db_check
      checker returns for an invalid address today.
    must_catch:
      - checker wording changed without updating the reference entry
    in_scope_files:
      - scripts/db_check/_address.py
      - docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
test_rationale: >-
  The defect reads the checker's own guidance as a leak, so the positive tests use the exact relayed text
  and a paraphrase, while the negative tests keep a real address after that text detectable. The checker
  quote test ties the scorer's example to the checker, which is where this defect would quietly return.
