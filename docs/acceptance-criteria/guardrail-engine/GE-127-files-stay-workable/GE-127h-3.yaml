superseded_by: null
covered_by: []
implemented_by: []
change_target:
  - code
risk_surface: contract_boundary
notes: |
  Today the stated rule reads "discards content inside triple-quoted strings and block
  comments; counts every remaining line, including blank lines and '#' comments."
  (describe_measurement_rule, ~L346 of _file_size_ratchet.py). GE-127d-1's agreement check
  compares every published place that states the rule, so this sentence and the reference
  doc (GE-127h-4) must change together.
