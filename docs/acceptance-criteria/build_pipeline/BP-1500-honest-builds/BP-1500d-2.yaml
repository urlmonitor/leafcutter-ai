assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: true
it_requirements:
  - "Record entries must be expressed relative to a root that is recoverable from inside the receiving project ALONE. Any entry that embeds an absolute path, or a path relative to the producing package's location, fails this AC even when the file it names is present in the relocated tree. Measured 2026-08-25: today's keys are relative to package_root.parent, so they carry the package directory's own name as a prefix and mean nothing once that directory is not an ancestor."
  - "AN UNRESOLVABLE ENTRY MUST BE REPORTED AS UNREADABLE, NAMING THE RECORD AND THE PROJECT. It must not degrade to an empty record, a skipped entry, or a zero-length key set. That degradation is the precise fail-open this AC exists against, and it is already observable: the reader looks for a key shape the writer did not produce in a differently-named layout and reports a count of 0 rather than an error."
  - "RELOCATION MUST CHANGE THE PATH'S DEPTH AND ITS PARENT, NOT JUST ITS NAME. A rename in place, or a move to a sibling at the same depth, passes a broken implementation whose keys happen to have the right number of segments. Move the project to a different depth under the temp root and assert from there."
  - "The producing package must be ABSENT from the relocated tree and from every ancestor of it during verification, so no entry can resolve by reaching back into the package. Assert that absence as a fixture precondition rather than assuming the move left it behind."
  - "Reading the record must not require the producing package to be importable, and must not require anything on sys.path that lives under the package checkout. A consumer has the deployed install, not the package's scripts/ -- a reader verified by importing from the source tree is verified in the one layout where the defect cannot appear."
  - "Must not require a rebuild at the new location. A record that only becomes readable after the build is re-run has not travelled; it has been regenerated, which is exactly what a relocated consumer cannot do."
  - "SCOPE BOUND -- this AC governs readability only. It must not introduce, replace or pre-empt any judgement about whether the install has fallen behind what the package now holds. That is BP-1500c's guarantee and this behaviour is its prerequisite, not a partial implementation of it."
  - "Must not break the record's readability in the producing package's own workspace. The canonical checkout and a git worktree with a different directory name must both read, since the differently-named worktree is where the key-prefix defect is already visible in this repo."
  - "Must handle a malformed or truncated record per the project error handling policy, and must distinguish it from a well-formed record whose entries do not resolve. Reporting both as the same condition loses the information the reader needs."
