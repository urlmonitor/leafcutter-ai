title: "A dispatch names each allowlisted pointer as an explicit named token"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a dispatch for a phase agent that carries the allowlisted pointers
    (ticket_path, worktree_path, branch, files_touched), each present and non-empty,
  When the supervisor assembles the dispatch and preflight validates it before spawn,
  Then the dispatch is accepted,
  And every allowlisted pointer the dispatch carries is named in the prompt the
    agent receives as an explicit token pairing the pointer's own name with its
    value -- name and value separated by ":" or "=", either side optionally
    quoted -- so a template that keys on the pointer name finds it,
  And a pointer that appears only inside narrative phrasing, such as "for ticket:
    <path>", does not satisfy that requirement, because the pointer name is not
    used as a name there,
  And the pointer tokens are carried inside the prompt rather than instead of it:
    surrounding briefing text is permitted and does not weaken the requirement,
  And each dispatch names the pointer values of the work item it is dispatched
    for, and names no other work item's values,
  So the dispatch never relies on the agent inferring its pointers from how the
    sentence happened to be phrased.
