notes: |
  WHY THIS EARNS ITS OWN CRITERION. The cheapest way to satisfy AR-300a-1 is to
  append a section unconditionally and let it come out empty for the 29 agents
  with no grant. That adds a heading claiming a category of capability to every
  agent that has none, and it destroys the only cheap signal a reader has for
  telling the two states apart -- which matters because the existing
  hand-written section, discussed in AR-300a-4, is exactly such a heading with
  no delivery behind it.

  THE PARTIAL CASE IS NAMED HERE ON PURPOSE. 'Complete section or no section,
  never a short one' is the same population claim AR-300a-1 makes, stated from
  the other end. A section naming 2 of an agent's 4 granted abilities is the
  failure this clause exists to exclude, and it is the shape a per-ability
  filter would silently produce.
