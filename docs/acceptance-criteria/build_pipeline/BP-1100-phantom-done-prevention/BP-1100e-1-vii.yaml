readiness: approved
priority: high
title: "A done ticket is detected regardless of status-value quoting; a quoted status is never silently skipped"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket whose frontmatter marks it done using a quoted status value —
    status double-quoted or single-quoted — as well as the unquoted status: done form
  When the pre-done reconciliation decides whether the ticket is a done ticket to
    reconcile
  Then it recognises the ticket as done in all three forms and proceeds to reconcile it
  And it does NOT silently skip a quoted-status done ticket (which would let a
    phantom-done ticket pass unreconciled — the exact failure this feature prevents)
