assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - '`python -m kernel decisions publish` is the only writer of docs/decisions/ (ADR-060): it runs
    only when a person invokes it, validates everything before writing, writes atomically, and exits
    0 ok, 3 refused (problems listed, nothing written), 5 environment error.'
  - 'During a run the kernel only reads the repository (ADR-060): no file under the repository root
    may change; the configured run root is the only place a run writes.'
  - Neither the kernel nor the /leafcutter skill runs publish on its own; the skill's allowed-tools
    never pre-approve it.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_nothing_is_written_until_publish_runs
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestPublish::test_nothing_is_written_until_publish_runs):
      a staged record does not reach docs/decisions/ until publish runs'
    covers:
      - DK-100d-1
  - name: test_bash_is_limited_to_run_resume_and_status
    target_dir: tests/kernel/adapters/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/adapters/test_skill_scope.py::TestAllowedToolsScope::test_bash_is_limited_to_run_resume_and_status):
      the /leafcutter skill cannot run publish unprompted'
    covers:
      - DK-100d-1
  - name: test_a_human_choice_stages_a_record_and_nothing_is_written_to_the_repository
    target_dir: tests/kernel/memory/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_learning_loop_e2e.py::TestRunOneStagesARecordThatPublishFiles::test_a_human_choice_stages_a_record_and_nothing_is_written_to_the_repository):
      a completed run publishes nothing'
    covers:
      - DK-100d-1
  - name: test_the_leafcutter_skill_leaves_publish_to_the_user
    target_dir: tests/kernel/adapters/host_skills/
    framework: unittest
    type: unit
    angle: criterion
    description: 'TO WRITE (in tests/kernel/adapters/host_skills/test_render_hosts.py): the rendered
      Claude Code skill lists decisions publish among the user''s commands and says not to run it'
    covers:
      - DK-100d-1
