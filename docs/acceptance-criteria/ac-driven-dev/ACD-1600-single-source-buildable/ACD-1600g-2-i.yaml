    relevance: "The source of the grain mismatch. Verified 2026-08-17: Tier 2 (block, ~line 120) matches on 'the file's top-level directory or component is listed in out_of_scope' and Tier 1 (soft, ~line 110) on 'the file is NOT named in out_of_scope' -- directory/component grain -- while the change surface derived by _build_files_touched() is a set of exact paths."
