criteria: |
  Given the file docs/agents/llm-expert/PROJECT_CONTEXT.md exists,
  When Section 2 (Agent Frontmatter Schema) is read,
  Then it lists required hand-authored fields including:
    name, description, model, tools, portable, signoff, domain, config_keys,
    adopter_notes, requires_verification, spawn_allowlist
  And it lists build-injected fields including inject_registry and config_keys
  And it states that build-injected fields must NOT be hand-authored
  And it documents valid values for the "model" field (haiku, sonnet, opus)
  And it explains that domain is null for portable agents
  When Section 3 (Skill Frontmatter Schema) is read,
  Then it lists required fields: name, description, allowed-tools
  And it explains the purpose of allowed-tools as a tool contract declaration
