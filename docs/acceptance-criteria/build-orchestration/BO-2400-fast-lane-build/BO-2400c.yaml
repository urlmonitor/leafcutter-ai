criteria: |
  Reuse context across steps, and show from the run record that the reuse occurred.

  Each step of a build reuses the stable groundwork and carries forward what
  earlier steps already worked out, rather than starting cold and re-deriving the
  same context repeatedly — so the same feature costs less and finishes sooner.
  The saving is reported, not assumed: after a run you can see from its own record
  whether the reuse held for the whole drive or broke partway through, so the cost
  claim is backed by evidence instead of by hope.
