id: TQ-400b-2-i
components:
  - testing_quality
  - ac_store
title: "The recorded reason is the record's own cause, not a generic label"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two finished records demoted in the same run — the first having no
    covering test at all, the second having a covering test that ran and did not
    pass,
  When both records are read after the run,
  Then their recorded reasons differ from one another,
  And the first names the absence of a covering test,
  And the second names the covering test that did not pass, identifying it,
  And neither record carries only a generic statement that its proof lapsed.
depends_on:
  - TQ-400b-2
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
    relevance: >-
      Where demotion_reason's contract (the oracle's cause, carried verbatim) is
      documented for future readers and writers.
  - path: scripts/ac_store/done_proof.py
    relationship: implements
    status: exists
    relevance: >-
      The two distinct causes already exist for free — "no linked test found for
      <id>" (:899) and "linked test non-passing: <nodeid>" (:962). Thread them
      through; do not compose a new sentence at the write site.
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The cheapest-green thesis: under this repo's TDD order, "a reason is
      present" is most cheaply satisfied by one constant string.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    demotion_reason must be the oracle's own cause string threaded through
    unchanged. done_proof.py already produces two distinct causes (:899 and
    :962); do not construct a new sentence at the write site.
  - >-
    The written reason must carry the discriminating detail: the covering test's
    pytest nodeid when one exists, the AC id when none does. Two records with
    different causes carrying identical reason text is a defect.
  - >-
    No default or fallback constant. If the oracle returns no cause for an
    unproven record, that is a bug in the verdict — the run must report it as an
    error rather than writing a placeholder reason.
  - >-
    Reason text must not be truncated or normalized on the way to the record
    (no shortening a nodeid to a filename); the reader must be able to run the
    named test from the reason alone.
  - >-
    Must handle errors gracefully per the project error handling policy; an
    unformattable cause is an error entry for that record, never a generic
    string written silently.
delivers_to: null
expects_from:
  ac_id: TQ-400b-2
  contract: >-
    The demotion_reason field and the single formatting site that populates it.
    This AC constrains its content: the oracle's per-record cause, with its
    discriminating detail intact.
