estimated_complexity: S
it_requirements:
  - "Assignment follows ACS-500g-6: the scoring rule is a section of the same pattern record's parameterised body, authored by business-analyst. It is written literally (it does not vary per agent) and therefore consumes no additional slot."
  - "BLOCKING INTEGRATION CONFLICT — the existing harness contradicts this rule. scripts/evals/agent_eval_config.json scores every registered agent against a FRACTIONAL `threshold` (pt-classifier: 0.7) and run_agent_eval.py exits non-zero only when the aggregate falls below it. That is precisely the percentage-averaging this AC forbids. Enforcing the all-or-nothing rule requires a `seeded_gap` scoring mode with per-round verdicts and threshold 1.0 in scripts/evals/run_agent_eval.py — a python-coder change NOT covered by this docs AC. Raise it as a follow-up AC under ACS-500g-6 before this rule is claimed as enforced."
  - "State the verdict as a three-valued round status — pass / fail / invalid (invalid is ACS-500g-6-ii's leaked-answer-key case) — and an overall verdict that is pass only when all three rounds are pass. Two states are not enough to express 'cannot be pass while any round is invalid'."
  - "Unseeded findings are recorded in a separate bucket with no effect on the verdict. Say this as a structural rule about the result record (two disjoint lists: reported_seeded, additional_findings), not as an instruction to the scorer, so a percentage over the union can never be computed by accident."
  - "The re-run rule needs a data property, not a name: 'a fresh set of seeded items' means a set disjoint from every set previously used for that agent, so the constraint must be checkable from the recorded history rather than from an operator's memory. Results are already persisted under scripts/evals/results/ — keep the history there."
  - "Earlier failing verdicts remain on record alongside the new one: results are append-only. A re-run must not overwrite the prior result file, or 'the earlier failing verdict remains on record' is unverifiable."
  - "Do not state a per-round seeded-item count in the pattern body — 4/6/5 are the example's values and belong in the {round_seeded_items} binding, not in the parameterised body."
delivers_to:
  agent: business-analyst
  contract: "The scoring section of the agent-evaluation pattern body: per-round pass requires every recorded seeded item reported; round status is pass/fail/invalid; the overall verdict is pass only when all three rounds pass, with no averaging or percentage path; unseeded findings live in a disjoint additional_findings list; re-runs draw a seeded set disjoint from all previous sets and append rather than overwrite the result history."
expects_from:
  ac_id: ACS-500g-6
  contract: "The three-round protocol body and the {round_seeded_items} slot that carries each round's recorded seeded items."
