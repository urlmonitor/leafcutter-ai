criteria: |
  Scratch work goes in one place and goes away; logs and evidence are kept.

  Automation and tests put their throwaway files in one designated place, each with
  a known owner and age limit, and every run deletes its own scratch when it ends --
  while logs and other records you rely on are kept and never treated as scratch.
