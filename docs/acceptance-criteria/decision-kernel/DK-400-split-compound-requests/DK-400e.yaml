criteria: |
  Approved parts run one at a time; earlier answers inform later ones.

  Approved parts are settled one at a time within the same piece of work, in
  the order their dependencies require, and each decided part gets its own
  decision record linked back to the request it came from. An earlier part's
  answer reaches the later parts as evidence that is still checked for fit,
  never taken as given.
