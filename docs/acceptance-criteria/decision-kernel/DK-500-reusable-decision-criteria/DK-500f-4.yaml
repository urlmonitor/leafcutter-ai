id: DK-500f-4
title: Usage counts and outcomes never decide which categories a decision is offered
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_colony_1_collect
criteria: |
  Given two fitting published categories, cat-1dc11c5a2ffa7310 with a usage count of 3 and cat-1df63b670163b54e with a usage count of 1,
  And outcome rows in which every decision of cat-1dc11c5a2ffa7310 was confirmed and every decision of cat-1df63b670163b54e was abandoned,
  When the same design decision is framed twice, once with these counts and outcomes and once with them swapped between the two categories,
  Then both runs offer the same categories in the same order,
  And neither run marks an offered category as preferred because of its usage count or its outcomes.
depends_on:
- DK-500f
- DK-500f-1
- DK-500d-1
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500d-1
  contract: Category lookup for a new decision.
change_target: code
risk_surface: internal
it_requirements:
- The reuse lookup (DK-500d-1) receives no usage count and no outcome as input, so the independence is structural, and a swap test proves it.
- No 'preferred' or similar mark derived from usage or outcomes appears in the approval payload.
test_required: true
test_spec:
- name: test_same_categories_same_order_when_counts_swapped
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Two runs with usage counts and outcomes swapped between cat-1dc11c5a2ffa7310 and cat-1df63b670163b54e offer the same categories in the same order.
- name: test_no_preferred_mark_from_usage_or_outcome
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Neither run marks an offered category as preferred because of usage or outcomes.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, the run report, trace events and call counts rather than internal helpers.
