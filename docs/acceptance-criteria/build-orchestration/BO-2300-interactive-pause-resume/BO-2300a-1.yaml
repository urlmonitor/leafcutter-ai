risk_surface: internal
notes: |
  Engineering shape (kept out of criteria prose): the E2 workflow engine
  (templates/workflows-js/*.js, run by the Workflow tool) today cannot prompt
  the user mid-run when headless/background, so at an interactive gate it
  cancels. This behavior requires that the gate PAUSE and persist a
  pending-question record keyed to the run id (resumable via the existing
  resumeFromRunId cache) rather than terminating the run.
