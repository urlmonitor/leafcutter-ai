criteria: |
  Given a worktree path is passed to the verification probe with a JSON-output flag,
  When the probe runs, it executes four checks in order:
    - Check A: the pre-commit executable is discoverable on PATH.
    - Check B: the worktree's `.pre-commit-config.yaml` resolves through the
      `.leafcutter` symlink to a readable file that parses as YAML and passes
      config validation.
    - Check C: the shared git hook at the effective hooks path contains the
      pre-commit sentinel.
    - Check D: a canary hook run emits the canary token.
  Then the probe prints a single JSON object to stdout with exactly these keys:
    `binary` (bool), `config` (bool), `git_hook` (bool), `canary` (bool),
    and `failing_checks` (a list of the check letters that failed, in A-B-C-D order).
  And when all four checks pass the probe exits 0 and `failing_checks` is the empty list.
  And when any check fails the probe exits with a non-zero code, stops at the
    first failing check, and stderr names that check (e.g. "Check B").
