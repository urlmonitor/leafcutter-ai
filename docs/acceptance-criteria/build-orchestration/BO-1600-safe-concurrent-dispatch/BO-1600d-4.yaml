    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The recovery entry point + step engine must have a package SOURCE home under the tree build.py deploys from — canonical: 'templates/scripts/git_recovery.py' (top-level of templates/scripts/, so build_template_standalone_scripts() auto-deploys it via its shallow glob('*.py') to the consumer's scripts/git_recovery.py). It is copied into the consumer's project by build.py so a fresh install gets it. The canonical source and the deployed copy must be kept in parity via the build.py round-trip (ADR-001)."
  - "BUILD-PHASE CAVEAT: build_template_standalone_scripts() scans templates/scripts/ SHALLOW (non-recursive glob('*.py')). If the recovery helper is placed in a SUBDIRECTORY of templates/scripts/ instead of at the top level, it will NOT be picked up — a NEW dedicated deploy phase in scripts/build_phases.py (mirroring build_knowledge_scripts / build_workflow_tools) is then required, plus its unit-test assertion. Prefer the top-level placement to avoid the extra phase."
  - "PORTABLE HOW-TO OBLIGATION (satisfies the BO-1600d L1 documentation_trigger: how-to WITHOUT a standalone doc-AC child — BO-1600d holds a hard 5-child L2 cap and stays at 4 behavior L2s): the recovery how-to must be authored in the deployable package source at 'templates/docs/how-to/' (e.g. templates/docs/how-to/git-recovery.md), which build deploys to the consumer's 'docs/how-to/'. The how-to must document the human-invoked, --dry-run-first, confirmation-gated flow. It must NOT live in (or depend on) the leafcutter repo's own root CLAUDE.md, which is not deployed to consumers."
  - "The guarantee is PORTABLE: no part of the recovery behavior or its how-to may rely on the leafcutter repo's root CLAUDE.md or any file not deployed to consumers (ADR-001). Verify a fresh install picks up both the helper script and the how-to (the BO-1400a-2 fresh-install-reachability lens is the precedent for this check)."
  - "This AC is the deployment/parity + portable-how-to wiring; the human-invoked-only gate (BO-1600d-1), dry-run-first (BO-1600d-2), and the repair steps (BO-1600d-3) define the behavior being deployed — do not re-derive them here."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
