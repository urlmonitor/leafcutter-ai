criteria: |
  Buildable means complete -- concrete files to change and a test to satisfy.

  A requirement is only released to a builder when it carries the concrete files
  to change and a clear test contract. A requirement missing those is flagged as
  not ready to build and held back for enrichment, instead of being sent to a
  builder who would have to guess what to do.
