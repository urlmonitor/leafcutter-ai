title: "Agent with empty inputs array is valid (utility agents spawned without payload)"
component: infrastructure
level: L3
status: active
work_status: todo
criteria: |
  Given an agent template for a utility agent that receives no
    structured input (e.g. brainstorm-worker, which receives only
    a freeform text question in the Agent tool invocation)
  When the frontmatter is parsed
  Then the `inputs` array is present but empty (inputs: [])
  And the `outputs` array contains at least one element
    (every agent produces something)
  And the `mutates` array may be empty if the agent does not
    write to any persistent surface
  And the card generator produces a valid card with an I/O Contract
    section showing "No structured inputs" rather than omitting
    the section entirely
