id: DK-500d-3
title: A reused criterion becomes a category member only after its decision is published, and only through a person's publish
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a design decision run that reused cat-1dc11c5a2ffa7310 unedited as its criterion crit.small_slice, approved by the person,
  And the run ended with its decision record staged,
  When the decision record is published,
  Then the pair of the new decision id and crit.small_slice joins the members of cat-1dc11c5a2ffa7310 only through a category change that a person publishes and that is reviewed like any other change,
  And the pair never joins while the decision record is only staged, and never by editing the published decision record,
  And once both are published, the usage count of cat-1dc11c5a2ffa7310 rises from 3 to 4,
  And a run whose decision is never published adds no member.
depends_on:
- DK-500d
- DK-500d-1
- DK-500c-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-500c-2
  contract: Stage-and-publish path for category records (decisions publish --run-id R, all-or-nothing).
change_target: code
risk_surface: contract_boundary
it_requirements:
- 'Q1, IT PO default (option 1 of the BA''s two; confirm with the user): the pair joins at publish. A run whose approved decision reused a category unedited, or accepted an in-run grouping suggestion, stages a membership addition {category_id, decision_id, criterion_id, approved_by, approved_at} beside its decision record under <run_root>/runs/<run_id>/staged/criterion_categories/. python -m kernel decisions publish --run-id R publishes the decision first and then applies the addition to the current published category record, in the same all-or-nothing publish.'
- 'The addition is never applied while the decision is only staged, and never by editing a decision record. A run whose decision is never published never adds a member: the staged addition goes away with the run root.'
- If the category was retired after the run, a single replacement receives the addition (following replaced_by), and several replacements cause a refusal naming them. A changed category is re-validated, never overwritten.
- The category's approved_by, approved_at and run_id record the decision's approver and run for this version of the record.
- The next mining round finds the pair already a member and reports nothing new (DK-500a-1-ii), and the usage index regenerated by the publish shows the new count.
test_required: true
test_spec:
- name: test_member_joins_only_through_published_category_change
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: After the decision is published with its run, the new (decision id, crit.small_slice) pair is in cat-1dc11c5a2ffa7310 as a working-tree change to docs/criteria/.
- name: test_no_member_while_decision_only_staged
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: While the decision is only staged, cat-1dc11c5a2ffa7310 is unchanged and no decision record is edited.
- name: test_usage_count_rises_from_3_to_4
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Once both are published, the usage count of cat-1dc11c5a2ffa7310 in docs/criteria/index.json is 4.
- name: test_unpublished_run_adds_no_member
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A run whose decision is never published adds no member.
- name: test_retired_category_addition_follows_single_replacement
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: An addition for a category merged since the run goes to its single replacement; a split category refuses, naming the replacements.
test_rationale: Exercise the review run and the publish command through their public CLI and RunService boundaries on a temporary repository copy and run root; assert staged files, published files, exit codes and byte-level before/after snapshots of docs/decisions/. Model-level unit tests alone would not prove that nothing is written outside the staged area or that publish is all-or-nothing.
