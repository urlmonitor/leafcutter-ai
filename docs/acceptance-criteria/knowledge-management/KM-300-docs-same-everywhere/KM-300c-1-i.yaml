title: "Backslashes outside link paths, such as in a page description, do not trip the separator check"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300c-1.yaml"
criteria: |
  Given the documentation map about to be committed has forward-slash link text
    and link targets on every entry
  And one entry's Description cell reads
    "Matches ticket ids with the pattern \d{8} and escapes \| in tables"
  And another entry's Description cell reads "Windows paths look like C:\Users\name"
  When the contributor commits
  Then the separator check does not refuse the commit
  And the check's verdict depends only on the characters inside link text
    ("[...]") and link targets ("(...)") of map entries, not on backslashes
    anywhere else in the map
