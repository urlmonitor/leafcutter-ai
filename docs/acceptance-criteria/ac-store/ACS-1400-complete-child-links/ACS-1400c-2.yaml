    relevance: "OWNS BYTE STABILITY AND ITS TEST SHAPE — inherit, do not restate. Byte stability means the file is never opened for writing, not that it is rewritten identically: a load-and-dump round trip preserves every value while reformatting quoting, key order and line wrapping, which at this store's size makes the diff unreadable."
