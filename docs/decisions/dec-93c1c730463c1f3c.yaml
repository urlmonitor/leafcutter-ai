rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.category_records_membership_refs] Category records
    (SKOS-style labels) that hold membership as (decision id, criterion id) references (required mean 0.65, 3/6 passed); 2.
    [opt.category_files_with_refs] One YAML record per criterion category, decisions reference categories, counts generated
    (required mean 0.34, 0/6 passed); 3. [opt.per_criterion_files] one YAML file per criterion in a new docs/criteria/ folder
    (required mean 0.34, 0/6 passed); 4. [opt.criterion_kind_in_decision_store] A new ''criterion'' record kind inside the
    existing decision store (required mean 0.27, 0/6 passed); 5. [opt.index_from_records] keep criteria inside decision records
    and generate a criteria index from them (required mean 0.27, 0/6 passed); 6. [opt.category_catalog] one catalog YAML of
    criterion categories, each listing its member criteria (required mean 0.23, 0/6 passed). human:user chose option [opt.category_records_membership_refs]
    Category records (SKOS-style labels) that hold membership as (decision id, criterion id) references (kernel rank 1 of
    6).'
