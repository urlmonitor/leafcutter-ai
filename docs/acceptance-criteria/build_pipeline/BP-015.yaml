title: "Worktree bootstrap provisions .env even when the checkout already contains one"
origin_agent: BrainCandy
created: 2026-08-14
criteria: |
  Given a new git worktree has been created by scripts/setup_ticket_worktree.py,
  And the worktree checkout already contains a `.env` entry at its root
    (`.env` is a tracked file in this repository, and has historically been
    committed as a symlink pointing at the main repo's absolute `.env` path),
  When _bootstrap() provisions the worktree's `.env`,
  Then any pre-existing `.env` entry at the worktree root is removed before the
    new one is created,
  And the worktree ends up with a usable `.env` resolving to the main repo's
    `.env` contents,
  And bootstrap does not abort with FileExistsError from os.symlink,
  And bootstrap does not abort with shutil.SameFileError from the copy fallback
    when the pre-existing entry resolves to the same path as the source,
  And a pre-existing entry that is a broken or self-referential symlink is
    removed without following it.
