notes: |
  USER DECISION 2 (BrainCandy, 2026-10-12), BINDING: empty = not configured,
  decided in ONE place every reader uses. The design names the readers: the
  config loader joins "" to the project root and tests existence rather than
  file-ness (rebuild log line 669: "could not read /home/henzeh/projects/
  leafcutter to check scaffold staleness: [Errno 21] Is a directory"); the
  scaffold installer skips silently; the referential-integrity check already
  treats "" as unset (the precedent).

  "EQUAL TO ABSENT" IS THE TEST. Comparing the empty-value run against the
  absent-key run step by step catches a reader that still special-cases "".
  The last clause stops a fix scoped to the one setting in the log.

  SUPERSEDED BY USER DECISION 11 (2026-10-12): empty and absent are no longer
  equal -- empty is off, absent is the shipped default. The paired runs remain
  the test, now asserting the two different outcomes (see amended_by).
