notes: |
  Found 2026-10-24 by Proof-of-done on #1342: tests/knowledge_live/neo4j_checks.py::
  test_live_idempotence_scope_metadata_and_rebuild failed on its second publish of the same
  snapshot with "generation identity already belongs to different content", on main as well
  (probe #1345, traceback from probe #1346). The digest was taken before the collapse, which
  changes the snapshot in place, so the second call hashed a different serialization. The
  live test runs only when a criterion it covers changes, so it went unnoticed from #1203
  (2026-10-14) until KM-400b-5 was marked done again.
