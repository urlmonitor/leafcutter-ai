notes: |
  Wave 1. User backfill decision (2026-10-25): hand-written rationales per record,
  approved by the user in batches; no templated text; the 46 finished records go to
  TQ-400d triage or the wave-2 migration. This replaces the brief's original idea
  of a script proposing a rationale per change_target.

  Population drift. The brief (2026-10-24) counted 97 todo records (ACD 37). The
  recount on 2026-10-25 finds 96 active todo (ACD 36) plus 3 in_progress records
  that also lack a reason. The 3 in_progress records are included because they are
  just as stuck at mark time; see the open question in the BA report.

  Population drift, second recount. Re-measuring on 2026-11-01 by the same rule gives
  97: 94 todo plus 3 in_progress (BO-2400a-6, -7, -8). Against the
  99 of 2026-10-25, todo fell by 2 (ACD 36 to 35, BO 17 to 16); the other prefixes are
  unchanged. The prefix figures in the criteria now cover all 97 records, so BO reads
  19 there (16 todo plus 3 in_progress); the 2026-10-25 figures covered todo only. The
  46 finished records are unchanged.

  The done hold in the criteria (user decision 2026-11-01) states what this record
  requires. Nothing in this record enforces it.

  assigned_agent is it-po because test_rationale is a field the technical planner
  owns. The planner drafts; the user approves; nothing is written before approval.

  Run report (2026-11-02).

  Starting population: measured 2026-11-01. Inclusion rule: active records,
  test_required false, test_rationale empty after whitespace stripping, work_status
  todo or in_progress. Count: 97 (94 todo, 3 in_progress).

  Classes and the user's class decisions (2026-11-01):
  - prose, 30 records: reasons proposed in batches (batches A and B below).
  - artefact-backed, 44 records: test_required set to true.
  - prompt, 20 records (9 classed prompt, 8 classed composite that are prompts,
    and ACD-300b-3, ACD-300b-3-i, BO-2500c-3): test_required set to true, proved
    by eval cases as BO-2500a-8-ii was; change_target fixed to prompt on the last
    three.
  - BO-2400a-6, BO-2400a-7, BO-2400a-8, parents proved through their children:
    test_required removed, change_target docs.

  Batch 1 (2026-11-01, 10 BP/GE records) wrote nothing. It judged the records by a
  stricter standard than this record states, which led to the definition of "a test
  can observe it" that the 2026-11-01 amendment added.

  Batch A (approved 2026-11-01): 15 proposed. 12 reasons written: ACD-1600a-3,
  ACD-1600a-4, ACD-1600b-3, ACD-1700a-3, ACD-1700c-6, ACD-1800b-3, ACD-1800b-4,
  ACD-1800c-3, ACD-1800c-4, ACD-1800d-2, BO-4400a-5, BO-4500a-5-ix. 3 moved to
  test_required true (BP-1400a-3, BO-4400d-5, BO-4500a-5-x), because a diagram label
  must match a real artefact.

  Batch B (approved 2026-11-02): 15 proposed. 3 reasons written: DK-400b-4,
  DK-500a-5, GE-117d-5. 12 moved to test_required true: BP-1400c-2, DK-400a-5,
  DK-400c-4, DK-400c-5, DK-400d-5, DK-400e-5, DK-500a-4, DK-500c-4, DK-500d-4,
  DK-500e-4, GE-116a-6, GE-117e-4.

  Closing count, measured 2026-11-02: 15 records given a reason; 82 listed with a
  decision by class or batch (59 test_required true, 20 prompt for eval proof, 3
  parents proved through children); total 97. Re-running the inclusion rule finds 0
  records.

  Hold: the 15 reasoned records are not marked done until BO-2500f-4 is built.
  Nothing enforces this mechanically; the user chose to build wave 2 next (ADR-076
  amendment).
