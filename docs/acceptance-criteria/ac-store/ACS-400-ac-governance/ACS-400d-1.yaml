  - path: docs/reference/ac-schema.md
    relationship: specifies
    status: exists
  - path: docs/reference/claude-code-hooks.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-007-ac-store-schema-id-format-enforcement.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must integrate with the existing build.py template compilation pipeline"
  - "Must inject governance rules into the instruction surface that agents read at invocation time"
  - "Must keep governance rule text in a single maintainable source (template partial or config) to avoid drift between the hook enforcement and the instruction text"
  - "Must not break existing CLAUDE.md content when appending governance rules"
  - "Governance rule text must be human-readable and concise (suitable for inclusion in an agent's context window)"
delivers_to:
  agent: python-coder
  contract: "Governance rules text block deployed into the consumer project's instruction surface. Format: markdown section with field classifications (protected vs open) and authorized agent list. Location: compiled into .claude/ output by build.py from a templates/ source."
