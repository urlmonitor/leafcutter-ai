title: "The automation never merges over a failed required check"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300b.yaml"
criteria: |
  Given an open pull request whose required checks include "Lint (ruff)"
  And the "Lint (ruff)" check has reported failure
  When the automation evaluates whether to merge
  Then it does not merge the pull request
  And it does not wait indefinitely for the failed check to turn green
  And the pull request remains unmerged with the failed required check recorded as the reason
depends_on: [BO-1300b-2]
doc_links:
