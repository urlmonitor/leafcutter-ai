title: "Prior-phase distilled outputs are threaded forward rather than re-derived"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a later phase runs in the same drive after an earlier phase produced a
    distilled output,
  When the later phase's prompt is assembled,
  Then the earlier phase's distilled output is included in the variable suffix
  And the later phase does not re-derive that context from the raw inputs the earlier
    phase already processed.
