criteria: |
  Given an epic folder contains L0, L1, and L2 AC files
    with depends_on relationships forming a directed acyclic graph,
  When the supervisor determines which tickets to build next,
  Then it reads the AC YAML files in the feature folder
    and constructs the build sequence from depends_on fields,
  And it does not read or require a separate epic plan document,
    execution manifest, or ordering configuration
    outside the AC hierarchy itself.
