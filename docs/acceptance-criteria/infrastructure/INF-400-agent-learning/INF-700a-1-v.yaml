readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-1.yaml"
criteria: |
  Given a /build-feature drive, of an epic or of a single ticket, in which the
    drive itself dispatches each ticket's commit phase (no ticket-supervisor),
  When a ticket reaches its commit phase,
  Then before the commit agent is spawned the drive runs the routing step's
    stage in the drive's worktree,
  And the commit agent is told to stage every path the stage reported, by
    name, and never by a sweep; a path that is not a plain relative path
    inside the worktree, or that is the sink's own log, is not named,
  And after the commit agent returns, on success and on failure alike, the
    drive runs exactly one observe, and that observation is the ticket's
    knowledge_routing,
  And the drive's result carries each ticket's knowledge_routing and the
    total written, unwritten and already_on_branch across the drive, for an
    epic and for a single ticket alike,
  And while one ticket's stage, commit and observe are in progress, no other
    ticket of the same drive starts its own stage or commit, because sibling
    tickets share one worktree and one run record,
  And no routing problem (a stage or observe that cannot run, or an
    unrecognised reply) changes the ticket's or the drive's own outcome: the
    figures read did_not_run, and a stage whose commit cannot be observed
    counts nothing as written.
depends_on: [INF-700a-1, INF-700a-1-iv]
