notes: |
  THE COST IS ASYMMETRIC, and BO-3600b's notes say to weight it that way. Wrongly
  leaving a fault open wastes a reader's attention; wrongly closing one deletes the
  only written record that something is broken. So the evidence bar sits on the
  retirement side only, and the second scenario makes an unevidenced retirement a
  failure rather than a default.

  The fourth scenario is the preservation clause. A register that shrinks by
  deletion would trade one kind of dishonesty for another, and the findings in this
  particular register are the project's accumulated understanding of its own failure
  modes.

  The first scenario asserts the change is on disk and survives a fresh read, in the
  shape TQ-400b-1 established: a run whose outcome exists only in its own output has
  not changed the record.
