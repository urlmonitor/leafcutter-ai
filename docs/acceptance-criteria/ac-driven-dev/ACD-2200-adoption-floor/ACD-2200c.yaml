criteria: |
  Tolerated is not forgotten — the backlog is counted and never grows.

  Everything a standard tolerates on the day it is adopted is counted and stays
  visible for as long as it is tolerated. That count can go down and never up.
  It is never reduced by loosening the standard or by writing the offenders onto
  a permanent list of exceptions.
