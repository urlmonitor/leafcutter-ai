criteria: |
  Given the guard must decide whether a project genuinely has no gates,
  When it makes that determination,
  Then it judges "no config" against the MAIN tree's authoritative state (located
    via the shared git dir / project root), not against the worktree's
    possibly-unmaterialized view,
  And when the state cannot be determined unambiguously, the guard fails closed
    (exits non-zero) rather than assuming no gates and taking the no-op path.
