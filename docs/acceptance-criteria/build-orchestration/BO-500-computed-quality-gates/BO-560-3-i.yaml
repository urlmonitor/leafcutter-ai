criteria: |
  Given a ticket has a manually-authored agents map:
    agents:
      python-coder: needed
      custom-review-agent: needed
      commit: needed
  And custom-review-agent is NOT a standard phase agent in agent_registry.json,
  And the ticket has change_type: flow_change,
  When ticket-supervisor computes and writes the replacement agents map,
  Then custom-review-agent is NOT present in the new map
    (it was not produced by the guardrails rules or registry)
  And the ticket-supervisor appends a comment to the ticket's ## Comments section:
    "Computed agent chain replaced manual agents map.
     Removed: custom-review-agent (not in computed chain).
     Added: architect-review, documentation-expert, test-writer, test-runner,
       pr-reviewer, pull-request."
  And the comment uses the standard signoff comment format

  Given the ticket had agents with status: signed_off in the old map,
  When the replacement occurs,
  Then signed_off statuses are preserved for agents present in both maps
  And the audit comment notes which agents retained their signed_off status:
    "Preserved: python-coder (signed_off), commit (signed_off)"
