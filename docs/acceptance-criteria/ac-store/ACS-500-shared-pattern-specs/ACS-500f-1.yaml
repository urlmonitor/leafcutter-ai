notes: |
  ACS-500 post-implementation spot-check, GAP A. The schema/binding-completeness
  hook exists in templates/scripts/commit_guardian/check_ac_schema.py and
  implements _validate_pattern_bindings_completeness plus implements_pattern
  preservation checks, but the deployed scripts/commit_guardian/commit_guardian.json
  hooks_manifest registers only check-ac-pattern-refs (check_ac_pattern_refs.py) —
  it does NOT register the schema hook. So the binding-completeness and
  field-preservation guarantees that the business-analyst and it-po templates
  tell agents to rely on are currently PROMPT-ENFORCED ONLY, not mechanically
  enforced at commit time. This is the integrity gap (priority high).
