notes: |
  USER DECISION CARRIED DOWN (BrainCandy, 2026-10-09, conditions_decisions.md
  item 9). The per-agent spawn allowlist is delivered in the AR-300 pull request
  with the same treatment skills received: one declaration in the agent's own
  frontmatter beside `tools:`, one generated section in the compiled prompt, the
  hand-written "Available Sub-Agents" tables removed, coverage by the AR-300b
  gate. The placement question is not re-opened here.

  WHY THIS SITS UNDER AR-300c. AR-300's own altitude note says the goal "survives
  swapping the thing granted: the second dead delivery ... is not a skills table
  at all". A permission to dispatch another agent is a granted ability in the
  L0's sense. AR-300c's promise -- one record, beside the permissions -- applies
  unchanged. AR-300c was at 4 of 5 L2s; this takes the last slot, so the
  consolidation, derived-copy, unresolvable-target and authoring-reference
  behaviours are L3s under this record rather than sibling L2s.

  THE MACRO DECISION -- KEPT AS A MACRO, EXPANDED AT COMPILE TIME. The registry
  convention `__ticket_phase_agents__` (ticket-supervisor today) is represented
  in the declaration as that single entry and resolved on every build. The
  alternative -- expanding it into a list of names during the migration -- was
  rejected because it makes the declaration correct on migration day and stale
  the first time a ticket-phase agent is added: the new agent would then need a
  second edit to ticket-supervisor's header, which breaks AR-300d's "no extra
  wiring" promise and re-creates the exact silent-omission shape this goal
  exists to end. Expansion-at-compile-time keeps "a new ticket-phase agent is
  permitted with no second edit" true; AR-300d-5-i pins it.

  WHERE TICKET-PHASE MEMBERSHIP LIVES -- NOT MOVED HERE. The macro resolves
  against each agent's ticket-phase flag. That flag is authored today in
  config/agent_registry.json (`is_ticket_phase`), not in agent frontmatter. This
  criterion does not relocate it. If the registry is later made fully derived,
  that flag needs a home in the agent's own header or the macro resolves against
  a derived copy; raised as an open item, not decided.

  A THIRD RIVAL SOURCE ALREADY EXISTS. Besides the registry field and the five
  hand-written body tables, four templates already carry a frontmatter
  `spawn_allowlist:` key (frontend-coder and onboard non-empty; ac-triage and
  onboard-config-section `[]`). Measured 2026-10-09 by the BA: the two non-empty
  ones agree with the registry. The documented key name is the natural candidate
  for the declaration, but naming is the IT PO's call.

  MEASURED FACTS (orchestrator probe, /home/henzeh/ar300_probe/spawn_divergence.py,
  production code): build_per_agent_spawn_table is defined and re-exported but
  nothing calls it, so no agent receives its spawn allowlist today. 25 agents
  hold a non-empty allowlist after macro expansion. `tools:` is a bare
  comma-separated string. These are measurements, not constants to hard-code.

  THE NEGATIVE CLAUSE IS THE TEST OF 'ONE PLACE', exactly as in AR-300c-1: a
  header that is authoritative and a header that is merely also read are the
  same implementation unless editing the registry alone is shown to change
  nothing.

  NO ASSIGNED AGENT, IT REQUIREMENTS OR TEST SPEC ON PURPOSE -- the IT PO's lane.
