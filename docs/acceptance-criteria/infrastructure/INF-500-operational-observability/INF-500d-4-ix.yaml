notes: |
  Follow-up asked for by BrainCandy on 2026-10-14, after PR #1169 (merge 818c301c0,
  ADR-069 accepted). The architect-review on tickets 03 (INF-500d-4-iv) and 05
  (INF-500d-4-vi) of EPIC-OneDurableLogRootForEveryWorkspace found that only
  emit_event's inline copy is pinned against sink_resolution. The other four copies
  can drift without any check noticing. The review recommended a follow-up AC and
  no new ADR. ADR-069 already decides the rule, and this AC only keeps the copies
  in step with it.

  PLACEMENT. This is an L3 under INF-500d-4, the composite whose rule the copies
  restate. It is not an L2 under INF-500d, which already has five L2s (d-1 to d-5)
  and so is at the 5-L2-per-L1 hard cap in check_ac_limits.py. The store caps only
  L1s per L0 and L2s per L1, so an L2 can take a ninth L3. Roman suffix -ix follows
  -viii.

  WHY THE SHELL COPIES ARE EXECUTED, NOT GREPPED. The repo rule (CLAUDE.md, "Gate /
  Workflow ACs: Verify Behaviorally, Not by Grep") is that a test that only looks
  for a string passes on dead code. The three shell copies are prompt and workflow
  text. The only proof that they agree is to run each one as written against the
  same layouts and read what it does.

  WHAT THE SHELL COPIES ACTUALLY RESTATE. All three get their stream from the
  location query, sink_resolution.py --print-location telemetry. That query runs
  the canonical shape rule, so on the shape rows they agree with the canonical rule
  by construction. Per ADR-069's implementation record, the query does NOT test
  staleness. Each snippet restates the stale rule itself (HOLDER = the log root's
  parent, or the project above it when that parent is debugging). So the
  vanished-root rows, in both layouts, are the rows that catch a drifted shell copy.
  The shape rows still matter: they catch a change to the query's refusal behaviour
  that a snippet doesn't follow, such as a query that starts printing a path for an
  unusable stream.

  WHY BOTH LAYOUTS. enduring_holder has two branches: a log root under debugging/
  (go up two levels) and one that is not (go up one). The existing parity test
  covers both (flat_root_live, flat_root_gone). A copy that hard-codes the
  conventional layout agrees on every conventional row and is wrong on the other
  layout, so the table carries both.

  THE INLINE-WORK GUARD IS A SPECIAL CASE. It reads only operational_log_root and
  keeps its own file, <root>/inline_work_guard.jsonl, which sits directly under the
  root by construction. Rows that vary only where the telemetry stream sits (outside,
  nested, relative, missing) don't change what the guard sees. The criteria
  therefore compare the guard against the canonical verdict for its own file under
  the declared root. They do not compare it against the telemetry stream's verdict,
  which would wrongly report it as drifted. BrainCandy: confirm this is the intended
  reading, or say if the guard should refuse whenever the declared stream is
  unusable.

  WRITABILITY IS OUT OF SCOPE. The two probes also test that the nearest existing
  directory is writable. That is not part of the usable-stream or stale-root rule.
  Every row's layout is writable, so writability never decides a verdict here.

  DEPLOYED, NOT SOURCE. The probe snippets carry a {{config.output_root}} token that
  the build resolves, and inject_config can rewrite literals in deployed text.
  Compare the deployed copies. The shared_reference_layout fixture (reader) is
  enough for the copies themselves. The row installs are cheap temp declarations,
  as in the existing parity test, and need no build of their own.

  NOT IN SCOPE. Adding a sixth copy is not covered by these criteria. If one appears,
  it should join the table under this AC rather than get a parity test of its own.
  The fourth scenario's copy count makes a missing copy visible. It does not find
  new ones.
