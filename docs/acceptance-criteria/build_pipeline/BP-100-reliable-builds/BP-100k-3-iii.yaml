  - "The four exemption entries are DATA in commit_guardian.json's drift_gate_exemption_registry, never a hardcoded filename check inside check_output_drift.py or _drift_exemptions.py — matching BP-100k-3's own constraint that the registry stay data-driven."
  - "Each of the four grounds must be specific to its own file's reason for being never-build-determined (adopter-owned machine settings; runtime-written lock state; the project's own build input rather than a build output; a write-if-absent scaffold appended to after seeding) — a single generic ground copy-pasted four times would pass a test that only checks non-blank but fails the intent of BP-100k-3's per-artifact ground requirement."
  - "The two orphaned artifacts (a deprecated skill's stale deploy, a deleted script's stale deploy) must NOT appear as keys in drift_gate_exemption_registry, before or after this AC — verified by loading the real registry and asserting their absence, not merely by their absence from a diff."
