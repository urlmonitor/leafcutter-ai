id: BP-100n-4-ii
components:
  - build_pipeline
title: "The check states how many gate scripts it compared, and a run that compared none is an unresolved run that fails — a comparison that never happened must not be able to look like a comparison that found nothing wrong"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the reachability check has completed a run,
  When it reports,
  Then its summary states four numbers — how many gate scripts it found on disk
    and compared, how many registry entries it read, how many scripts it reported
    as invoked by nothing, and how many it treated as declared non-gates — so a
    run that examined nothing cannot produce the same output as a run that
    examined everything,
  And given the place the gate scripts are kept cannot be listed, or is listed
    successfully and holds no gate scripts at all,
  When the check runs,
  Then it states that it could not establish which gate scripts exist, names
    which of those two situations it is in, and fails,
  And given the registry from which the commit-time gate configuration is
    generated cannot be read, or is read and cannot be parsed,
  When the check runs,
  Then it states that it could not establish which scripts are invoked, names the
    reason, and fails,
  And in neither of those situations does it state a count of zero scripts
    invoked by nothing, and in neither does it exit as though the comparison had
    been performed and had found every script invoked,
  And given a run in which every gate script on disk is invoked or declared,
  When it reports,
  Then the number of scripts it states it compared is greater than zero, and that
    stated number is what establishes the run as clean — a run is never reported
    clean on the strength of having found nothing to report.
depends_on:
  - BP-100n-4
