  Given a test that sets up:
    - A temporary directory acting as the canonical template path
    - A hook manifest list with one entry whose entry field references "check_missing.py"
    - The temporary directory does NOT contain "check_missing.py"
  When the test invokes the integrity check logic
  Then the test asserts that a warning was emitted
  And the warning message contains the hook identifier and the missing script name
  And no exception was raised during the check
