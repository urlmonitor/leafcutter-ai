criteria: |
  Given a deployable agent template references a runtime script by path
    (for example "python scripts/some_capability.py")
  And no deploy-source copy exists at the derived
    templates/scripts/some_capability.py
  And that script is NOT in the external-dependency allowlist
  When the registry-completeness check runs at the finalize merge gate
  Then the template-referenced-but-undeployed script is flagged as a
    completeness failure
  And the failure entry records that it was promised by a template reference and
    names the referencing template path (per BP-900e-4)
  And this finding is the MERGE-GATE complement of BP-900b's build.py PREFLIGHT
    script-reference guard: BP-900b catches the same missing-template-copy class
    earlier (at preflight, against the deployable manifest), and this check
    re-asserts it at the merge gate alongside the registry axis — the two are
    coordinated, not contradictory, and a script caught by both is reported once
    per surface with its origin stated
