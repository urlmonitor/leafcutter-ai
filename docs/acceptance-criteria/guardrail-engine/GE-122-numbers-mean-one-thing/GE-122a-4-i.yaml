notes: |
  WHY THIS IS A SEPARATE RECORD RATHER THAN A SIXTH CLAUSE ON GE-122a-4. It is the one condition
  under which a component that passes every one of GE-122a-4's scenarios still mints a duplicate.
  Both exclusions in the parent are about what the enumeration LOOKS AT; this is about whether
  the enumeration finished. An implementation can walk the whole tree to any depth, honour
  citations, and still skip the one file that raised on read — and every positive test in the
  parent stays green while it does, because the skipped record is not the one the fixture is
  about. That is the same shape as GE-122a-1-i's relationship to GE-122a-1, and it is kept as
  its own record for the same reason: so the rule survives a later rewrite of the parent.

  THE PROJECT NAMED THIS HAZARD BEFORE THIS AC EXISTED. GE-122d's notes state it directly — a
  whole-collection check has more ways to be unable to run than a per-file one, so "I could not
  read everything, therefore everything is fine" is the exact failure to design against. A
  minting component inherits that hazard in its most damaging form, because its output is not a
  verdict somebody reads but an identifier that gets written into a record, cited by tickets and
  code, and then cannot be withdrawn without the renumbering blast radius GE-122e documents.

  NO L4 EXISTS. The hierarchy stops at L3, so the degenerate sub-case — a namespace in which
  every record is unreadable — is folded into the criteria above rather than split out: it is
  the same disposition, not a different one.
