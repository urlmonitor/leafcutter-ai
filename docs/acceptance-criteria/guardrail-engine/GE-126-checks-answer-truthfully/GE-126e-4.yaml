    contract: "The derivation of the census population from the registration data and the reported registration source. The diagram must show the population as derived rather than held and must name the surface it is derived from."
  - ac_id: GE-126e-2
    contract: "The census report and the surface a reader invokes it from. The diagram places both as participants."
