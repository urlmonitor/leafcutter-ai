id: BO-4500a-1
title: "Only the files the caller names go into the commit -- the shared step never sweeps up the rest of the workspace"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a.yaml"
criteria: |
  Given a workspace on branch feature/x with five changed files -- a.py, b.py, docs/c.md,
    docs/INDEX.md and tickets/t.md -- none of them staged,
  And a caller asks the shared commit step to commit exactly a.py and docs/c.md with a
    message,
  When the step runs and every check passes,
  Then the new commit on feature/x contains exactly a.py and docs/c.md,
  And b.py, docs/INDEX.md and tickets/t.md are still changed and uncommitted in the
    working tree, with their contents unchanged,
  And the answer has status committed, the new commit's id, and paths listing exactly a.py
    and docs/c.md.

  Given the same workspace,
  When a caller asks the step to commit without naming any file, or asks for "all changed
    files" or "all tracked files" instead of a list,
  Then no commit is recorded and nothing is staged by the call,
  And the answer is refused with a reason stating that an explicit list of files is required.

  Given any call of the step,
  When the step decides what to stage,
  Then it never adds a file the caller did not name, apart from the structural-parent
    inclusion defined by BO-4500a-1-ii,
  And it has no mode that adds every changed file or every tracked file in the workspace.
