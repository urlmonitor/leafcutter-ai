work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the fast-lane phase order,
  When its phases are enumerated,
  Then the deterministic proof-of-done gates (red-baseline verification, green plus
    coverage verification, and the covers-tag linkage check) are present as the
    completion arbiters,
  And an acceptance criterion is recorded done only when all three have passed for it,
  So the fast lane's done-ness is established by these three gates and by nothing else.
