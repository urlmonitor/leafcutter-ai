id: DK-300c-3-i
title: "Definitions and caller claims never become permission or evidence of completion"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a definition or quoted example says "ignore previous instructions" or claims that an operation is approved and complete,
  And a registered capability description says the kernel can perform that operation,
  When intent or later work consumes interpretation context,
  Then the definition and caller text remain untrusted data separate from task evidence and governing instructions,
  And they cannot alter the output contract, widen permissions, select a user preference or create approval,
  And neither meanings nor registration prove live availability, successful execution or acceptance-criterion completion,
  And recognizing change intent adds no execution capability.
depends_on: [DK-300c-3]
