assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "SCOPE IS ALL FOUR PLACES, NOT THE STORE. This L3 is filed under GE-124g-1 because a parent had to be chosen. Its configuration surfaces are: the store writer (GE-124g-1), the reverse-direction gate (GE-124g-2 / check_ui_ac_declared.py's frontend_ac_declaration config), the reports (GE-124g-3 — build output, proof-of-done report, and the Atlas), and the test-coverage check (GE-124g-4 / the done-proof surface). Do NOT narrow it to the store when implementing."
  - "A REFUSED KEY, NOT AN ABSENT FEATURE. Each of those four config loaders must REJECT an unknown substitution-shaped key by name rather than ignore it. Absence is indistinguishable from 'nobody has asked yet', and the first person to ask will add it; a refusal that names the key turns the attempt into a conversation. This requires the loaders to reject unknown keys in their own section at all — a permissive loader that silently ignores extras cannot implement this AC."
  - "ENVIRONMENT AND PER-REPOSITORY OVERRIDES ARE PART OF THE SURFACE. The criteria say 'from the environment or from a per-repository override', and a loader that rejects a JSON key while honouring an equivalent environment variable satisfies the letter and none of the intent. Enumerate every input each of the four loaders reads."
  - "THE REFUSAL MUST NOT DISABLE THE AFFECTED CHECK. After refusing the key the check continues with the rule in force. Aborting on bad configuration would turn the refused key into the bypass it was refused for — the same over-correction GE-124d-1-i guards against on the other configuration surface."
  - "THE GE-124d BOUNDARY IS A BEHAVIOURAL CLAIM AND MUST BE TESTED AS ONE: a warn-listed path and an accepted opt-out reason change nothing about what a declaration is worth. Those escapes govern whether a FILE MUST DECLARE; they never reach these four outcomes. This is the third scenario and it is the boundary the PO drew explicitly."
  - "This AC is a cross-cutting constraint over four other ACs, so it can only be verified once all four surfaces exist. Sequence it last within GE-124g, or accept that it is partially red until they land — and say which."
delivers_to: null
expects_from:
  ac_id: GE-124g-1
  contract: "The four no-substitution rules whose absence of a configurable form this edge case establishes across every configuration surface — the store writer, the reverse-direction gate, the reports, and the test-coverage check"
test_spec:
  - name: test_ge_124g_1_i_no_substitution_key_exists_in_any_of_the_four_config_surfaces
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "Enumerate the accepted configuration keys of all four loaders and assert none of them permits a declaration to count as coverage, satisfy a proof obligation, or reach covered_by. Enumerate from each loader's own accepted-key surface rather than from a literal list in the test, so a key added later is caught."
  - name: test_ge_124g_1_i_a_substitution_shaped_key_is_refused_by_name_and_the_check_continues
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: "Supply each of the four loaders with a key asking for a declaration to count as coverage: each refuses it, names it, and then runs with the rule in force. Assert both halves — a loader that aborts turns the refused key into the bypass it was refused for."
  - name: test_ge_124g_1_i_an_environment_variable_equivalent_is_also_refused
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: "Set an environment variable equivalent of the substitution setting and assert every one of the four surfaces still enforces the rule. A loader that rejects a JSON key while honouring an env var satisfies the letter and none of the intent, and the criteria name the environment explicitly."
  - name: test_ge_124g_1_i_warn_listed_and_opted_out_files_change_none_of_the_four_outcomes
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "For a criterion declared by a warn-listed file and for one declared by a file with an accepted opt-out reason, assert all four GE-124g outcomes are identical to the un-escaped case: covered_by untouched, the done gate unmoved, the report axis unchanged, and the existence-only test still rejected. The GE-124d boundary is a behavioural claim, so it is asserted behaviourally across all four."
test_rationale: |
  This AC's subject is the absence of a feature, and absence is the hardest thing to test
  honestly — a test asserting 'the key is not in the config file' passes on a loader that reads
  the same setting from somewhere else. So every test drives a real loader: enumerate what it
  ACCEPTS rather than what a file contains, feed it the forbidden key and watch it refuse by
  name, and feed it the environment-variable equivalent because the criteria name that route
  explicitly and it is the one a letter-of-the-law implementation leaves open. The fourth test
  turns the GE-124d boundary from prose into four behavioural assertions, which is the only form
  in which a boundary between two ACs stays true after either one is refactored.
origin_agent: business-analyst
