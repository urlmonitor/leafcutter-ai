notes: |
  The parent L0 records the starting state to be re-measured rather than trusted: roughly 69
  dispatches currently use a read-only reporting specialist as a general-purpose errand runner.
  This AC is the absence half — BO-3200a-1 proves one path reads directly; without this one, a
  system with sixty-eight remaining relays passes it.

  THE SECOND SCENARIO IS WRITTEN TO FAIL A PARTIAL FIX, in the same shape as BO-3100c-2. A
  working direct read somewhere must not mask a surviving relay elsewhere, and the report must
  name the path so the remaining work is enumerable rather than estimated.

  THE THIRD SCENARIO IS THE SCOPE LINE THE PARENT DRAWS: "Judgement is the only thing worth
  asking a specialist for." A sweep that reports every dispatch would be trivially satisfied by
  deleting all delegation, which is not the goal and would be reverted. The distinguishing
  property is whether the build BRANCHES on the returned value — that is what makes a
  paraphrase, a truncation or a pointer able to change the outcome.

  A NOTE ON WHERE THIS IS HARD, recorded for the IT PO rather than hidden: fact-versus-judgement
  is easy to state and awkward to decide mechanically. The formulation above deliberately makes
  the observable property "the path still completes with no specialist available" rather than
  "the dispatch looks like a fact request", because the former is executable and the latter is
  a text heuristic. A path that needs a judgement will legitimately be unable to complete
  without a specialist, and must therefore be identified as out of scope by its contract before
  the sweep runs, not inferred from its prompt.

  IT-PO DECISION (2026-08-26) — THE DECLARATION MECHANISM, answering the BA's residual. Full
  specification is in it_requirements; the part worth restating is the one that makes it more
  than a self-certification:

  THE DECLARATION SELECTS THE ASSERTION, NOT WHETHER THE PATH IS EXAMINED. Every path is
  exercised with specialists unavailable, always. A path declared `fact` must obtain its value
  and proceed. A path declared `judgement` must reach a terminal outcome recording the judgement
  as unobtained. If a declared-judgement path CANNOT terminate without the value, the build was
  branching on it — the declaration is contradicted by observation and the path is reported.

  That is what closes the loophole the BA identified. A declaration that merely removed a path
  from the sweep would be narrowed to meaninglessness within a few sprints, one honest-looking
  exemption at a time; a declaration that changes which assertion is applied cannot be, because
  the false declaration fails DIFFERENTLY rather than silently. The reported exempt set is the
  second line of defence: even a correctly-declared judgement path stays visible and countable,
  so growth in the exemption set is something a reader can notice.
