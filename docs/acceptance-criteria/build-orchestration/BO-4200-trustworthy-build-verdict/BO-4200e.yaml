notes: |
  THE OPPOSITE ERROR TO ITS SIBLINGS, AND THAT IS WHY IT IS HERE. BO-4200a through d
  concern a verdict that passes work which is broken. This concerns a verdict that
  fails work which is sound. Same sentence, same harm — an operator acting on a
  statement that is not true — and the two are not reducible to one another. They also
  interact: widening what a run checks (BO-4200a) enlarges the population of work whose
  proof consults the project's history, so satisfying that record without this one
  makes this failure MORE frequent, not less. Building a before e would be a net loss
  for the operator who hits it.

  WHY IT IS NOT A CHILD OF THE PRODUCING STEP'S RECORD, which is where the symptom
  points. The observed halt blamed the producing agent and released the work; the real
  cause was a phase boundary. The origin entry's own summary — "the failure names the
  wrong culprit, which is what makes it worth an entry rather than a comment" — is the
  placement argument: a record that owns verdicts must own a misattributed one, or the
  misattribution gets fixed where it was seen rather than where it came from.

  WHAT THIS DOES NOT LICENCE, and the prohibition is the origin entry's, not this
  agent's. It may NOT be satisfied by relaxing the requirement whose proof needs the
  project's real history: that entry is explicit that the affected requirement demands
  a genuine copy because the condition it exists to catch cannot be reproduced any
  other way, and that weakening it "would make the lane green and the coverage
  worthless". It may equally not be satisfied by excusing the work — being unable to
  judge something is not the same as it being finished, and treating it so is the
  phantom-done route this whole family exists to close. Naming, and routing, is the
  promise; a pass is not.

  THE THREE CANDIDATE MECHANISMS ARE NOT DECIDED HERE — detection and routing,
  supplying such checks with a history-shaped source that is not the shared one, or
  permitting a reversible provisional step on the run's own branch. The origin entry
  ranks them and the Business Analyst should read that ranking, but the criterion above
  deliberately survives all three, because the operator-visible promise is identical
  under each.

  documentation_triggers: how-to. This is the one arm of the goal where the operator
  has something to do. A class of work that the quick route cannot currently complete
  at all, and whose failure currently points at the wrong place, needs a page saying
  how to recognise the answer and what to do next; the origin entry records that the
  diagnosis took reading a fixture and a hand-run of the same command to reach.
