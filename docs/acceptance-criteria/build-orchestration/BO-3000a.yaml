id: BO-3000a
title: "A handoff is routed by the target the handing-off agent named in its own result, and is refused diagnosably — never inferred from the ticket body — when that target is absent or unknown"
component: build-orchestration
components:
  - build_orchestration
status: active
level: L3
readiness: approved
priority: high
work_status: todo
origin_agent: BrainCandy
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given the agent templates that emit a handoff require the handing-off agent to
    name its target explicitly, as `handoff_target: "<agent>"` in the result it
    returns to the driver,
  And the agent's own result is therefore the only place the driver looks for the
    identity of the agent a handoff is addressed to,
  When a phase agent returns a handoff whose `handoff_target` names an agent the
    driver recognises as one of its phase agents, and that agent is a key in the
    ticket's own agents map (a key whose phase is marked not needed still counts),
  Then the driver re-dispatches exactly that agent before any later phase runs,
    And it dispatches that agent the way it dispatches any phase in its order, so
      every check the driver runs before dispatching a phase, and every read-back
      of the ticket record after it, applies to the re-dispatched agent as well,
    And the phase that handed off is not recorded as completed,
    And the drive does not advance to the next phase in its phase order while the
      handoff is unresolved.

  Given a phase H has handed off to a target T, and the driver has re-dispatched T,
  When T returns ok and the ticket record read back after T's dispatch confirms
    T's sign-off,
  Then the ticket continues in the same drive instead of stopping,
    And if that same read-back shows H still needed or failed, H is the next
      phase dispatched,
    And if it shows H already signed off, the drive resumes its normal phase
      order,
    And the ticket can reach completion in that drive, with no re-run required,
    And a T that itself returns a handoff is adjudicated by these same rules,
      while a T that returns a blocker or fails is adjudicated as any phase that
      does.

  Given a phase agent returns a handoff in one drive of one ticket,
  When any one of these holds:
      the same handing phase has already handed off to the same target once in
        this drive — a repeated from-to pair,
      honouring it would be the fourth handoff honoured for this ticket in this
        drive — no more than 3 are honoured,
      the target names the handing phase itself,
      the target is a phase agent the driver recognises but is not a key in this
        ticket's agents map,
      the target's phase is deferred for this drive, so it cannot run in it — for
        example pull-request on a ticket driven as an epic member, whose pull
        request the epic opens,
      the target was re-dispatched and returned ok, but the ticket record cannot
        confirm its sign-off — the record does not show it signed off, or the
        record cannot be read,
  Then the driver stops the ticket and its report states which of these held,
    And for a repeated pair or the per-ticket cap, the report names the chain of
      handoffs that led there and the target is not dispatched again,
    And for a self-handoff or a target missing from the agents map, no agent is
      dispatched,
    And for a deferred target, no agent is dispatched and the report names the
      deferred target,
    And for a target the record cannot confirm, no later phase is dispatched,
    And in none of these cases is the handing phase recorded as completed,
    So these six conditions, together with the two refusals below, are the only
      ways a handoff stops a ticket.

  Given a phase agent returns a handoff carrying no target at all — the key absent,
    empty, blank, or not a name,
  When the driver adjudicates that result,
  Then the driver dispatches no agent,
    And it stops the ticket with a refusal stating that the agent's result was
      read and named no handoff target,
    And it does not record the handing-off phase as completed.

  Given a phase agent returns a handoff whose target names something the driver
    does not recognise as a phase agent,
  When the driver adjudicates that result,
  Then the driver dispatches no agent,
    And its refusal reproduces the unrecognised value it was given,
    And it never resolves that value to some other agent, so a reader of the
      refusal can tell a misspelt agent from one that does not exist and can fix
      the emitter rather than re-running blind.

  Given a handoff that names no target, arriving on a ticket whose body does name
    agents in its own sections — one known agent, several, or none, whether under
    the per-agent task breakdown or the agent-contract section,
  When the driver adjudicates that result,
  Then the driver dispatches no agent,
    And the refusal it reports is the same one it reports for a ticket whose body
      names nobody, so the ticket's prose changes nothing about which agents run,
    So a section that tells a receiving agent WHAT it owes on a ticket is never
      read as telling the driver WHO to re-dispatch, and a handoff an agent emitted
      deliberately as a full stop — naming no agent precisely because it wants no
      agent — halts instead of spawning a phase nobody asked for.

  Given one phase whose result the driver cannot obtain or read at all, and another
    phase whose result is read intact but carries no handoff target,
  When each is adjudicated,
  Then both stop the ticket and neither is recorded as a completed phase,
    And the two are reported distinguishably — the first that no usable result was
      obtained from the phase, the second that a result was obtained and named
      nothing,
    So an agent that never reported is never diagnosed as an agent that reported
      badly, nor the reverse.

  Given the refusals BO-3000 already requires — a handoff never falling through to
    the completed-phase path, never advancing the phase order, and naming the phase
    that failed when it refuses,
  When this behaviour ships,
  Then every one of those refusals is still in force,
    And the five tests in unit_tests/workflows/test_bo_3000_handoff_routing.py
      still pass.

  Given the driver harness at unit_tests/prompt_assembly/_driver_harness.py, which
    runs build-feature.js's own top-level body,
  When this record is verified,
  Then each case above is proven by driving the real workflow through that harness
    and asserting on the agents the run actually dispatched and the refusal it
    actually reported,
    And a test that inspects the workflow source — for a field name, for the
      presence of a branch, or for the absence of a ticket-body scan — is not
      accepted as coverage, because the honoured path, the two refusals and the
      no-inference guarantee differ only in what the running driver does.
