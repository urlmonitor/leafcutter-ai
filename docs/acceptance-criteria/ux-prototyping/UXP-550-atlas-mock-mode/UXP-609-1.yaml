title: "A mis-set environment makes the drift-guard fail loudly, never false-green"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given the CI drift-guard runs in an environment where mock mode is NOT genuinely active
    (isMockActive() is false — the app would read the live repo, not the fixtures),
  When the drift-guard evaluates,
  Then it exits with a failure and names the reason (mock mode not active) instead of reporting
    a clean result,
  So a mis-configured environment can never produce a false "all clear" by silently checking the
    wrong data source.
