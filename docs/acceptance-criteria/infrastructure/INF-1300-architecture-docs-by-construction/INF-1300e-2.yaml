test_required: true
it_requirements:
  - >-
    MEASURED 2026-09-14 — THE TWO SURFACES DISAGREE TODAY, BEFORE ANYTHING IS BUILT.
    templates/skills/write-c4-diagram/SKILL.md §4 pins the invocation WITH --date and gives the
    reason inline ("the agent runtime may be in UTC while the project convention is local
    date"); templates/agents/architecture-diagram-author.md Step 4 pins the same invocation
    WITHOUT it. Whichever way this settles — keep --date required, or make it optional and
    delete the requirement from the skill — it must settle IDENTICALLY on both surfaces in the
    same change, and both must then be what arrives. Silently correcting one is the exact
    successor defect this record exists to catch.
  - >-
    MEASURED 2026-09-14 (consumer simulation into an empty target) — THE INSTRUCTED PATH DOES
    NOT RESOLVE. Both arrived surfaces instruct the bare relative path
    scripts/scaffold/new_arch_doc.py, while a real build deploys scripts under the output root
    (observed: <target>/.leafcutter/scripts/). The same defect is already live one section away
    in the same template: architecture-diagram-author.md instructs
    "python leafcutter/scripts/next_diagram_seq.py" while that script is deployed at
    <output_root>/scripts/next_diagram_seq.py. The path clause must be settled against the real
    deployed layout, and the fix must be applied consistently rather than only to the scaffold
    line.
  - >-
    The invocation must be stated using the project's output-root placeholder rather than a
    hard-coded prefix, so it renders correctly for an adopter whose output_root differs from
    this package's. A literal ".leafcutter/" written into a template is a second portability
    defect wearing the first one's fix.
  - >-
    THE COMPARISON MUST BE MECHANICAL, NOT EDITORIAL. Whatever establishes this must parse the
    argument set out of each arrived surface and compare it against the sets the arrived
    script's parser accepts and requires. A reviewer reading two documents and finding them
    mutually consistent is explicitly insufficient — the criteria are falsified by the case
    where both surfaces agree with each other and neither matches the means, and only a check
    that touches the means can see that case.
  - >-
    The widening owned by INF-1300a-2 must reach BOTH surfaces in the same change that reaches
    the means. A widening that lands on the means alone reproduces the present failure one
    version later, with the harder diagnosis: everything is present and the author still gets
    an error.
  - >-
    Whatever establishes the agreement must run on every build, alongside the existing
    consumer-install and propagation checks, rather than being a one-time reconciliation. A
    divergence introduced later must be reported, not rediscovered by the next adopter.
  - >-
    SCOPE FENCE, DO NOT CROSS. This record covers agreement between the ARRIVED copies only. It
    must not restate or re-decide INF-1300b-4 (surfaces-vs-produced-document agreement inside
    this package), and it must not touch the false ADR-015 legend attribution, which the sibling
    handling INF-1300b-4 owns. Where this record's corrections touch the same lines, they must
    be compatible with that retirement, not a competing edit to it.
test_spec:
  - name: test_arrived_surfaces_state_one_identical_invocation
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: deployed
    description: >-
      Parsing the mandatory invocation out of both deployed copies (the skill and the agent
      template) in a real consumer install yields the same script path and the same flag set.
      Fails today on --date.
  - name: test_every_flag_the_arrived_surfaces_name_is_accepted_by_the_arrived_means
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: seam
    description: >-
      Each flag named by an arrived surface is accepted by the deployed script's parser —
      invoked as a subprocess in the consumer layout, asserting no "unrecognized arguments".
  - name: test_arrived_means_requires_no_flag_the_arrived_surfaces_omit
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      Running exactly the invocation an arrived surface states, and nothing more, exits 0 — no
      "the following arguments are required" from a flag no instruction mentions.
  - name: test_path_the_arrived_instruction_states_resolves_from_the_authors_working_directory
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "the literal script path string extracted from the arrived write-c4-diagram SKILL.md section 4"
    description: >-
      The path string lifted verbatim out of the arrived instruction resolves to an existing
      executable file when interpreted from where that project's authors work. This is the
      clause the 2026-09-14 measurement already falsifies.
test_rationale: >-
  The three failure modes in the criteria are asymmetric and no single test sees all of them, so
  the contract is a set cover rather than a list of restatements: surface-vs-surface (descriptor
  1), surface-vs-means for arguments in both directions (2 and 3, which are genuinely different
  — an unaccepted flag and an unmentioned required flag fail on different sides), and
  surface-vs-layout for the path (4). Every one runs against the copies a real build deposited
  in a consumer project, because the record is falsified as an OBSERVATION if it is performed
  against this package's files: this repository has recorded a hook whose helper was undeployed
  and crashed on import in every consumer while passing every test here, and in that case the
  package's own copies agreed with each other perfectly. Descriptor 1 alone is the trap the
  criteria call out by name — two arrived documents can be perfectly consistent with each other
  and both wrong, which is why 2, 3 and 4 all reach past the text to the means and the layout.
delivers_to:
  agent: architecture-diagram-author
  contract: >-
    One mandatory invocation, stated identically in both arrived surfaces and accepted verbatim
    by the arrived means: the script path written output-root-relative via the project's
    placeholder, the seven pinned flags with their exact names and meanings
    (--tier --diagram-type --component --title --output --date --update-readme), and the three
    widened flags (--parent <path>, --root, --source-ticket <id>), with the --date question
    settled the same way on both surfaces.
expects_from:
  - ac_id: INF-1300e-1
    contract: >-
      The deployed location of the means in a consumer layout as an output-root-relative path,
      plus the accepted and required flag sets of the deployed script's parser. This record
      compares the arrived surfaces against exactly those two facts.
  - ac_id: INF-1300a-2
    contract: >-
      The widened argument contract (--parent, --root, --source-ticket) as finally settled, so
      the surfaces are corrected once to the final shape rather than twice.
