id: GE-120d-2
title: "Set-up refuses to hand over a working copy whose protection it could not establish"
component: guardrail-engine
components:
  - worktree_manager
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set-up command cannot locate the script that verifies the commit-time checks are
    active, or the script that installs the commit-time shims,
  When it reaches those steps,
  Then it does not continue with the behaviour observed today — a warning reading "not found
    ... graceful no-op" followed by a successfully created working copy,
  And it names the missing scripts and states the protection they would have established,
  And it fails the set-up, because the alternative is handing the caller a working copy in
    which the commit-time checks do not run,
  And the working copy it leaves behind, if any, is reported as unprotected so the caller
    cannot mistake it for a prepared one,
  And this block-rather-than-announce outcome is recorded as the deliberate per-case
    disposition required by GE-120a-2, with the stated reason that the artifact handed over is
    otherwise unprotected.

  Coverage note: cover this by running the real set-up command in a workspace where those
  scripts are genuinely unreachable, and asserting on the observed failure and the state of any
  copy left behind. This is the case that was observed live while creating the working copy
  this tree was authored in, so it reproduces without contrivance.
