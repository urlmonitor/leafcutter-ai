notes: |
  The no-false-positive / happy-path AC. A blocking hook is only trustworthy if
  the correctly-reconciled case passes silently. BA/IT-PO must specify the
  legitimate-pass cases explicitly so the hook does not over-fire:
    - implementing source file deleted in the same commit;
    - implemented_by entry removed / emptied;
    - for status: superseded_by, implemented_by re-pointed to the successor AC
      named in the superseded_by field (the code moved to the successor, not
      deleted — this MUST pass);
    - an empty implemented_by list (nothing was ever claimed -> nothing to block).
  This is the guardrail against the hook being so aggressive that teams disable it.
change_target: code
