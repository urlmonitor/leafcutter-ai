title: "persona_for field with non-string value is rejected by schema validator"
component: persona-management
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given an AC YAML file with persona_for set to an integer value (e.g., persona_for: 42)
  When the AC schema validator (check_ac_schema.py) runs against the file
  Then the file fails validation
  And the error message states that persona_for must be a string or null

  Given an AC YAML file with persona_for set to a list (e.g., persona_for: ["a", "b"])
  When the AC schema validator runs against the file
  Then the file fails validation
  And the error message states that persona_for must be a string or null, not a list
