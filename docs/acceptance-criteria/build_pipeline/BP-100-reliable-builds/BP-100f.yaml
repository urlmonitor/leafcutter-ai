id: BP-100f
title: "Git-dependent workflows degrade gracefully outside a repository"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  Workflows that need git never crash when git is absent — they warn and skip.

  When a workflow like finalize-feature or changelog-agent is invoked in a
  directory that is not inside a git work tree, it emits a clear warning
  identifying the missing context and skips all git-dependent steps without
  throwing a fatal error. The happy path (valid git context) is unchanged.
  Operators learn about the problem immediately and can fix it, rather than
  debugging an unhandled exception stack trace mid-drive.
