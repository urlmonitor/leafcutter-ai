test_rationale: |
  No covers-tagged test can be authored: the inline fallback template this AC
  describes lived in templates/workflows/build-feature.md, which was deleted in
  full (504 lines) by commit 63a846ac0, "feat(build): guardrail for template
  deploy-path collisions + de-conflict /build-feature (#228)". A parse-and-resolve
  test of the kind used for BO-300b-1 needs a document to parse; here there is
  none, and no other file in the tree defines a fallback completion template with
  WORKTREE_PATH and EPIC_NAME placeholder tokens. The it_requirement about keeping
  the fallback in sync with the JS-generated format is likewise moot with only one
  of the two formats still present.
