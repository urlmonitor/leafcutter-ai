title: "Once the fix exists, its tests are run against the wrong versions, and the runs decide"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A fix or gate isn't done while a named wrong version still passes its tests.

  After the code is written, each named wrong version, plus the fix simply
  undone, is actually applied, the guarding tests are run against it, database
  tests included, and the code is then put back exactly as it was. Any wrong
  version the tests fail to notice stops the work, and the verdict comes from
  those runs, read for what they actually showed — a test that failed in any of
  its cases never counts as passing — not from anyone's opinion of the tests.
  The same check guards every way work gets built, one piece or a whole batch,
  quick or full, so no route goes around it. Existing tests that lean on a
  changed check are part of that set; they may be strengthened, and every
  change to one is listed, but none may be weakened to get a green result.
