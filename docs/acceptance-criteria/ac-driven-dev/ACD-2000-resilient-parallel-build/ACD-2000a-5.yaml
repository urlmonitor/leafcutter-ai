it_requirements:
  - "PLACE THE DIAGRAM ON docs/architecture/agent_delivery_workflows.md. Its frontmatter description already claims 'blocker adjudication flows', and the ladder currently appears there only as a prose TIP (~line 362) with no diagram. Reconcile with that TIP in the same change -- amend it to point at the diagram -- rather than leaving prose and picture to drift apart, which is how this repository has produced stale second copies before."
  - "USE MERMAID stateDiagram-v2, NOT A SEQUENCE OR FLOW DIAGRAM. The subject is durable states and the transitions between them, not an ordered interaction. A sequence diagram cannot express the fourth criterion at all: two quiescent states that look identical from outside are a state-machine distinction, and a lifeline has no way to show them."
  - "DRAW ONLY STATES THE TRAIL CAN ACTUALLY REPRESENT AND BUDGETS THE RESOLVER CAN ACTUALLY REACH. The depends_on edges on ACD-2000a-1, -2 and -3 are load-bearing: a diagram drawn ahead of those three, or not revisited after them, is a confident wrong picture, which is worse than no picture. If a state you want to draw has no representation in the trail, that is a finding to report, not a state to invent."
  - "RENDER 'NEVER ATTEMPTED' AND 'BUDGET SPENT' AS TWO DISTINCT STATES, never as one resting node with a note. Both are quiescent and both look identical from outside, but one is ready work and the other is blocked work waiting on a person -- and every scanner, dashboard and operator reading the store has to tell them apart. A diagram that collapses them teaches the wrong model to everyone who reads it."
  - "DRAW THE TRANSITION OUT OF ESCALATED, caused by a person's recorded decision, and draw that decision as an APPEND to the trail -- not as a reset or an erasure. Escalation is the state most likely to be drawn as terminal, and terminal is wrong: ACD-2000a-2's fourth criterion requires a person to be able to make an exhausted requirement retriable again. A missing edge here makes the diagram contradict the behaviour."
  - "LABEL EVERY TRANSITION WITH ITS CAUSE (attempt failed, budget exhausted, person recorded a decision). An unlabelled edge in a durable state machine is an invitation for the next reader to invent one."
  - "DO NOT MERGE WITH ACD-2000b-5's CLAIM LIFECYCLE (available / taken / handed back / reclaimed). The two machines run on the same requirement at the same time and are independent; drawing them as one would imply transitions that do not exist. If a cross-reference is useful, link the two diagrams rather than combining them."
  - "SATISFY THE REPOSITORY DIAGRAM GATES: check-mermaid-drift, check-mermaid-parent-link, check-diagram-naming and check-mermaid-complexity. Take the diagram id from `python scripts/next_diagram_seq.py` rather than inventing one. If the complexity gate rejects the machine, split by concern (attempt lifecycle vs clearing procedure) rather than by dropping states -- dropping the fourth criterion's distinction to fit a node budget defeats the AC."
