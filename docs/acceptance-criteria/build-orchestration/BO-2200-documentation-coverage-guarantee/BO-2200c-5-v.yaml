title: "Writer and verifier agree on what 'satisfied' means -- a doc already correct passes without a diff"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a ticket whose contract line names an owned target, and the target already exists on disk
    and already states what the content constraint requires, and the writer reported it as
    "already satisfied" having changed nothing -- so the target appears in neither the
    branch-range diff nor the working-tree diff,
  When documentation-verifier asserts coverage,
  Then the target is satisfied and no blocker is produced.
  And the verdict names it as satisfied-without-change, distinct from satisfied-by-this-ticket, so
    reading the sign-off tells you whether this ticket wrote anything.

  And given a target likewise absent from both diffs, but whose contents on disk do NOT state what
    the content constraint requires -- or are placeholder text,
  When the verifier asserts coverage,
  Then a blocker is produced naming that target.
  And given a target absent from both diffs and absent from disk,
  Then a blocker is produced naming that target, exactly as today.

  And the satisfied-without-change verdict is reached by the verifier reading the file itself and
    applying the same content and placeholder checks it applies to a document that IS in the diff
    -- never by accepting the writer's report. A writer that claims "already satisfied" for a
    target that is missing, empty, or placeholder is blocked, so the claim is a hint about where to
    look and not a way past the gate.
