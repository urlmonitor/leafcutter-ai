it_requirements:
  - "CONTRADICTS INF-400c-2-i, which is work_status done and requires the opposite ('marks the event as processed so it does not retry indefinitely'). INF-400c-2-i must be superseded or amended by governance before this AC is implemented — the two cannot both hold."
  - "Retry must not become an unbounded reprocessing loop: an unroutable event stays retryable but must be reported on every run so the backlog is visible rather than silently growing"
  - "The distinction between 'nothing to route' and 'nothing could be routed' must be observable in both the summary and the exit status — a run that discards its whole input while reporting success is the false-green defect this AC closes"
  - "Must handle errors gracefully per the project error handling policy"
