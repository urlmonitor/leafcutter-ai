it_requirements:
  - 'SURFACE (IT PO decision): a workflow script templates/workflows-js/inspect.js, run through
    the Workflow tool, plus a thin slash-command shim templates/commands/inspect.md that passes
    the one record id (the fast-lane-build.md / fast-lane-ship.js and commit.js packaging).
    The build copies workflows-js/*.js to .claude/workflows/ (scripts/build_phases_workflows.py).
    The shim is llm-expert''s surface (templates/commands/**/*.md in config/surface_craft_map.yaml),
    so it is NOT declared here: a companion L3 for llm-expert is recommended (open question).
    The workflow is independent of plan-feature.js.'
  - Every new workflow must be listed in config/guardrail_gates.yaml knowledge_routing_wiring
    (wired or excluded with a reason), or build.py aborts (the knowledge-routing guard in
    scripts/build_phases_knowledge.py). /inspect makes no commit, so it is listed as excluded
    with that reason.
  - 'READ-ONLY HELPER. The workflow body has no filesystem access (ADR-024, E2), so scripts/ac_store/inspection_workflow.py
    offers two read-only subcommands, run by a dispatched agent: ''prepare <AC-ID>'' validates
    the draft (statement present, at least one path, every path exists, change_target allows
    inspection via BO-2500f-1''s validator), computes each blob with BO-2500f-3''s fingerprint
    function and prints JSON; ''verify <run_id>'' re-reads the written approval file and record
    and confirms they match the shown payload byte for byte. Neither subcommand writes anything.'
  - THE WRITE. On approve, the workflow body builds the approval file's exact JSON (run id,
    gate id, 'approve', answered_at taken when the answer arrives, ac_id, the SHOWN path/blob
    pairs, not recomputed) and the exact verified_by edit, and dispatches one write turn to
    an agent with Write and Edit tools, then runs 'verify'. No project CLI writes an approval
    file (BO-2500f-3-i clause 9). A mismatch at verify reports the failure and leaves the
    files for the person to discard; nothing is committed.
  - 'THE GATE IS LIVE-ONLY. The approve/reject question is asked through an interactive agent
    turn, as the E2 gates in finalize-feature.js do, but it does NOT use resolveGate''s resume_answer
    path: an answer supplied through workflow args could come from anyone. Headless or unanswered
    means ''no answer was recorded'' and nothing is written.'
  - 'Run id: ''insp-<YYYYMMDD>-<HHMM>-<AC-ID>''. If the approval file already exists, stop
    and create nothing. The record edit inserts gate_run and the blob on each inspected entry
    only, as a targeted edit: every other byte of the record is unchanged, and a test diffs
    the file to prove it.'
  - The approval folder holds .json only, never .yaml. Every AC-store walker found filters
    to *.yaml or *.yml (check-ac-schema and check-done-proof hook regexes, scripts/ac_store/_rc_records.py
    and _rc_changed.py, leafcutter-web/lib/data/ac-store.ts, templates/skills/ac-audit/scripts/audit_ac_area.py),
    so none treats '_inspections' as a component folder. If a later walker groups by folder
    name, it must skip folders starting with '_'.
  - 'USER-FACING SURFACE. The generated ticket sets user_facing_surface: slash_command and
    carries a Smoke Fixture. That field is a ticket field, not an AC field, so the AC store
    cannot carry it. Because the gate is live-only, the smoker (headless) can exercise only
    the stop paths: a record with no draft, a missing path, a code change_target, and an unanswered
    gate, each asserting that NOTHING is created. Approve and reject are proven by tests through
    unit_tests/_workflow_engine_harness.py with a scripted gate reply. The smoker''s ''git
    restore'' does not remove untracked files, so the fixture''s cleanup must also delete
    any file created under docs/acceptance-criteria/_inspections/.'
  - Every new module under scripts/ac_store/ is added to build_ac_store's deploy_map in scripts/build_phases_ac_store.py,
    and its import is proven in the DEPLOYED .leafcutter/ layout, not only the source tree
    (the BO-2500a-1-ii ModuleNotFoundError precedent).
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: the workflow computes the current content fingerprint of each inspected path and
      shows the person the record id, the statement, and each path with its fingerprint, before
      asking for an answer
    needs_test: true
    reason: The person must see what they approve; a test asserts the shown payload carries
      the record id, statement and every path with its current fingerprint before any question
      is asked.
  - clause: it asks the person to approve or reject the inspection, as an interactive question
      only a person at the gate can answer
    needs_test: true
    reason: The gate must not accept an answer passed in through workflow args; a run with
      a resume answer supplied must still record nothing.
  - clause: on approve, it creates the approval file for this run in the tracked approval
      folder, holding the run id, the gate id, the answer "approve", the time the answer was
      given, the AC id DK-210b-3, and each inspected path with the fingerprint that was shown
    needs_test: true
    reason: The approval file's content is the contract BO-2500f-3-i reads, and each field,
      especially the shown fingerprints, must be asserted.
  - clause: on approve, it fills the record's inspection with the run reference and the shown
      fingerprint for each inspected path, leaving the statement and every other field of
      the record unchanged
    needs_test: true
    reason: The record edit must add only gate_run and blobs; a byte diff of the record shows
      every other field is untouched.
  - clause: the approval file and the changed record are left for the person to commit together,
      and the workflow reports both paths
    needs_test: true
    reason: Nothing is committed by the workflow, and both paths are reported; a test asserts
      the git index is unchanged and both paths appear in the result.
  - clause: on reject, it creates no approval file and leaves the record unchanged, and reports
      that the inspection was rejected
    needs_test: true
    reason: Reject must create nothing; the git status of the fixture repo shows no new or
      changed file.
  - clause: when the answer is missing, cannot be read, or is anything other than approve
      or reject, it creates no approval file, leaves the record unchanged, and reports that
      no answer was recorded
    needs_test: true
    reason: Unreadable, missing and unexpected answers are three fail-closed routes, and each
      must create nothing.
  - clause: when the record has no inspection draft, its draft has no statement, it lists
      no inspected path, or a listed path does not exist, the workflow stops before asking,
      names what is missing, and creates nothing
    needs_test: true
    reason: Each incomplete-draft shape must stop before the question is asked, so a person
      never approves fingerprints of nothing.
  - clause: a record whose change_target rules inspection out (BO-2500f-1-i) is stopped in
      the same way, naming the change_target
    needs_test: true
    reason: A code change_target must be stopped up front, or the workflow manufactures an
      approval the done gate refuses later.
  - clause: the workflow runs on its own, without the feature-planning workflow, and starting
      it requires only the record id
    needs_test: true
    reason: The workflow must start from the record id alone, with no plan-feature run; a
      harness run with only the id shows it.
delivers_to:
  - agent: python-coder
    ac_id: BO-2500f-3-i
    contract: 'The approval file docs/acceptance-criteria/_inspections/<run_id>.json with
      shape {run_id: str, gate_id: str, answer: ''approve'', answered_at: ISO-8601 UTC str,
      ac_id: str, inspected: [{path: str, blob: 40-hex str}]}, created only by this workflow''s
      approve step, and the record''s verified_by inspection filled with gate_run and the
      shown blob per inspected path; both left for the person to commit together.'
  - agent: llm-expert
    ac_id: BO-2500f-3-iii
    contract: 'The /inspect workflow entry point: templates/workflows-js/inspect.js with meta.name
      ''inspect'', started as Workflow(''inspect'', { ac: ''<AC-ID>'' }) with the record id
      as its only input, returning one result object {status: ''approved''|''rejected''|''no_answer''|''stopped''|''error'',
      reason: str, approval_path: str|null, record_path: str|null}.'
expects_from:
  - ac_id: BO-2500f-1
    contract: 'validate_verification_record and the inspection draft shape (method: inspection,
      statement, inspected [{path}]), including the change_target restriction BO-2500f-1-i
      adds.'
  - ac_id: BO-2500f-3
    contract: The blob fingerprint function the mark-time comparison uses, so the shown fingerprint
      and the later comparison are computed the same way.
