id: TQ-500g-1-xv
components:
  - testing_quality
  - build_orchestration
title: "Every verdict row names the exact alteration it judged and where that alteration came from, and earlier manifests are kept so rounds can be compared"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work 07_TICKET-refresh-gate has had three gate runs for test T1's
    name "drop the retry_due condition" —
      run 1 prepared it as one replacement in refresh_config.py:
        "if refresh_due and retry_due" becomes "if refresh_due",
      run 2 took that replacement from the pin, after the coder had changed
        another line of refresh_config.py,
      run 3 prepared it again because its old text no longer matched, as
        "if refresh_due and retry_due:" becomes "if refresh_due:",
  When a reviewer reads the reports of the three runs,
  Then every row names the alteration it judged by an identity taken from its
      replacements alone (file, old text, new text), and shows the file, old
      text and new text of each replacement,
    And the rows of runs 1 and 2 carry the same identity, because the
      replacement is the same although the file changed elsewhere, and the
      row of run 3 carries a different one,
    And each row says where its alteration came from: "prepared: not pinned" in run 1,
      "pinned" in run 2, "re-prepared: target changed" in run 3, and
      "declared" for a replacement declared on the requirement
      (TQ-500g-1-xvii),
    And the manifests of all three runs are persisted, each under its own run,
      and none is deleted when a later run prepares its own,
    And each run's verdict is read from that run's own manifest only; a
      manifest of an earlier run is never read in its place, including when
      the current preparer's reply cannot be read and the current run has no
      manifest.
declares_side_effect: true
