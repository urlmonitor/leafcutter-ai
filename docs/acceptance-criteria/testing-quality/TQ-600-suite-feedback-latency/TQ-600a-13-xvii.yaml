id: TQ-600a-13-xvii
components:
  - testing_quality
title: "When the required hold check itself is broken, the owner has a documented, rehearsed and recorded way to merge its fix"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given `Post-merge suite status` is a required check (TQ-600a-13-x),
  And the ways it can break so that no exemption helps: it errors on every pull request,
    it never reports because `pull_request_target` runs are blocked, the correctness
    workflow cannot start, or a fix to the hold is itself held by the hold — and in each
    case every merge in the repository stops,
  And the fact that every agent acts as the same administrator account as the owner, so
    any standing bypass granted to that account is a bypass every agent holds for every
    required check,
  When the owner judges the hold check broken and follows the documented break-glass
    procedure,
  Then the procedure lets a pull request that repairs the hold merge without disabling,
    weakening or bypassing any of the other required checks,
  And it uses a deliberate, visible change — removing only `Post-merge suite status` from
    the ruleset's required checks — rather than a standing bypass,
  And each use leaves a record with the date, the reason, the repairing pull request and
    the time the requirement was restored, on the `post-merge-red` notice or, when none is
    open, in the procedure's own log in the repository's documentation,
  And the procedure ends by restoring the requirement and re-observing a held pull request
    reported unmergeable as TQ-600a-13-x requires,
  And the procedure is documented before the check first becomes required, and rehearsed
    once on the real repository within the first day after it does — removing and
    restoring the requirement with no repair pending — and the rehearsal is recorded with
    its date,
  And agents are told by the procedure that they never perform it.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-x
