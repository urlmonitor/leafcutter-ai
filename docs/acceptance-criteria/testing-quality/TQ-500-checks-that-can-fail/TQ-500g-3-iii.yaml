  contract: 'The loosened field of the check JSON (shape in TQ-500g-3-i delivers_to): loosened [{file: str (repo-relative
    POSIX path), test: str (function name or Class::method), what: ''fewer assertions''|''comparison loosened''|''tolerance
    widened''|''assertion now conditional''|''assertion after an early return''|''assertion after an early skip''|''assertion
    after an early xfail'', detail: str}], where detail names the counts or operators (for example "3 to 2", "==
    became >=", "== removed", "rel 0.01 to 0.1", "rel 0.01 to TOL"), for assertion now conditional the guard as
    "under <if|while|for|match|try|function|lambda|class>" (several joined by ", ", e.g. "under if, under try"),
    and for the early-exit items the exit as "return", "pytest.skip(...)", "self.skipTest(...)", "pytest.xfail(...)", "raise SkipTest"
    or "raise unittest.SkipTest". At most one item per (file, test, what); items sorted by file, then the test''s
    line in the working tree, then what in the order above. Any loosened item sets passed false, and reason ''loosened''
    when no earlier reason applies; finish carries it verbatim under sweep. The field is [] when nothing is loosened,
    never absent.'
