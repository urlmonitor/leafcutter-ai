notes: |
  Kept separate from BO-2400f-13-i because the operator's next move genuinely differs.
  On its own leftover the lane may offer to clear and re-run; on someone else's work it
  may offer nothing of the sort. Collapsing the two into one criterion would produce a
  single message that either offers a destructive option against work the lane does not
  own, or withholds the useful option in the case where it is safe.

  The last clause is the safety default, and it is the one to get right first: an
  occupant the run cannot confidently classify is foreign. Guessing "probably mine"
  offers a clearing option against work nobody can recover, and the guess is most likely
  to be wrong exactly when the directory is unusual — which is when it is least likely
  to be the lane's own.

  IT enrichment note, 2026-08-25 (it-po), on how own-vs-foreign is actually determined.
  The test is BRANCH IDENTITY, not the directory name: the occupant is this lane's own
  earlier attempt at this criterion if and only if `git worktree list --porcelain`
  contains a block whose `branch` line is exactly `refs/heads/fast-lane/<slug>` for THIS
  run's slug — either at the occupied location, or elsewhere when the location is free
  and the branch is checked out somewhere else. The directory name proves nothing;
  KI-BO-015 was found by a hand-made directory sitting at precisely the name the lane
  would have chosen.

  Two structural consequences follow. First, the classifier is written so foreign is the
  FALL-THROUGH and own_prior_attempt is the narrow, positively-established case; written
  the other way round, every new occupant shape silently inherits the destructive option.
  Second, detection needs both a porcelain read AND a filesystem stat, because
  `_worktree_exists` consults only registered worktrees and is therefore structurally
  blind to the bare directory that produced the defect. Extending that function with a
  `fast-lane/` prefix and stopping there fixes the tidy half only.
