title: "The harness raises even when the mock is set to return success for the instruction-less call"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given a workflow test whose dispatch test-double is configured to return a success value
    for any call,
  And the workflow under test dispatches a step whose request's first argument carries no
    instruction string,
  When the harness intercepts the dispatch,
  Then it raises the contract violation regardless of the configured success return, because
    the violation is on the dispatch contract itself, not on the test-double's return value,
  And a return-value stub cannot suppress the instruction-less-dispatch violation.
