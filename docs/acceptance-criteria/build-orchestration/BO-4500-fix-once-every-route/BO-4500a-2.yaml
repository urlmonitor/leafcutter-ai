id: BO-4500a-2
title: "The message the caller wrote is the message that lands, author credit included, whoever runs the step"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a.yaml"
criteria: |
  Given a message file whose content is the subject line
    "fix(build): stage the parent with the child", one blank line, a two-line body, one blank
    line, and the final line
    "Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>",
  And the caller hands that file to the shared commit step together with the files to commit,
  When the step is run by an agent whose own model is Claude Sonnet 5 and every check passes,
  Then the recorded commit message is identical to the file's content, line for line,
  And the trailer in the recorded message names Claude Opus 5.5 (1M context), not the model of
    the agent that ran the step.

  Given any call of the step,
  When the step composes the commit,
  Then the message comes only from the caller's file,
  And the step adds no line to it, removes no line from it, and changes no line of it.
depends_on: [BO-4500a]
doc_links:
  - path: docs/known-issues/build-orchestration/open-low-ki-bo-20260914-commit-agent-rewrites-co-author-trailer.md
    relationship: describes
    status: exists
    relevance: "Two confirmed occurrences (6a537708, 9e796a16). The second shows the dispatch-prompt workaround does not hold, because the agent discounts a relayed instruction. Moving the message into a file the step carries verbatim takes the decision away from the agent."
  - path: docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200c-4.yaml
    relationship: related
    status: exists
    relevance: "An approved subject line is never rewritten by hooks or re-staging. This record is wider (the whole message, trailer included) and is the step that makes BO-200c-4 hold on every route."
  - path: docs/acceptance-criteria/build-orchestration/BO-1100-smart-commit-routing/BO-1100.yaml
    relationship: related
    status: exists
    relevance: "Message KIND and authoring stay upstream of the step (BO-1100). The step carries what it is given."
assigned_agent: python-coder
estimated_complexity: S
package_surface: false
it_requirements:
  - >-
    The message is read only from a caller-supplied file path. The step offers no inline-message
    option, no template, no default trailer and no editor, so there is no input through which an
    agent's own model name or a rewritten trailer could enter.
  - >-
    The message must be recorded with no message cleanup at all (the version-control system's
    verbatim mode or an equivalent). The "whitespace" cleanup mode is NOT sufficient: it also
    collapses consecutive blank lines, which would break the line-for-line comparison.
  - >-
    The commit is recorded with the hooks that run at message time active like every other check.
    A message-stage check that would rewrite the message is incompatible with this record; if the
    project defines one, the step must report it rather than let it edit the message silently.
  - >-
    The same message file is used unchanged for the retry after a fixing check (BO-4500a-2-ii) and
    for every fresh call a caller makes; the step never writes to the caller's file.
  - The step carries the message it is given and never composes, rewords or appends to it; message authoring stays upstream (BO-1100, BO-4500a-5-v).
delivers_to:
  - agent: llm-expert
    contract: >-
      The step records the bytes of the caller's message file (path passed as an argument) as the
      commit message. The commit agent's brief (BO-4500a-5-v) relies on this: it writes a message
      file only when the caller gave none, passes a caller-supplied file unchanged, and never edits
      trailers.
expects_from: null
test_required: true
test_spec:
  - name: test_recorded_message_is_identical_to_the_file_line_for_line
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Commit through the real step with the five-part message file; the message read back from the new commit equals the file's content line for line."
  - name: test_trailer_names_the_caller_model_not_the_running_agent
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "With the environment describing a Claude Sonnet 5 runner, the recorded trailer still names Claude Opus 5.5 (1M context)."
    must_catch:
      - "the step appends its own Co-Authored-By footer"
      - "the step substitutes the running model's name into the trailer"
  - name: test_step_adds_removes_or_changes_no_message_line
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Across a corpus of message files (no trailer, two trailers, # lines, indented lines), the recorded message never gains, loses or alters a line."
test_rationale: >-
  KI-BO-20260914 recurred after a prompt-level fix, so the proof is the recorded commit object
  read back from git and compared byte for byte with the file -- not a template grep and not an
  import of a message helper.
origin_agent: business-analyst
created: 2026-10-12
amended_by: []
superseded_by: null
covered_by: [BO-4500a-2-i, BO-4500a-2-ii, BO-4500a-2-iii]
implemented_by: []
notes: |
  "Identical line for line" is the falsifiable form: a test reads the recorded message back and
  compares it with the file. Git's default message cleanup can drop lines (BO-4500a-2-iii); the step
  must not let it.

  MIGRATION RULE: no copy of this logic is hardened today -- every recipe passes the message through
  an agent that may edit it. The hardened behaviour is defined here and KI-BO-20260914's regression
  test (template states a caller-supplied trailer is preserved; no literal model name in the
  template) runs against the migrated commit agent in BO-4500a-5-v.
