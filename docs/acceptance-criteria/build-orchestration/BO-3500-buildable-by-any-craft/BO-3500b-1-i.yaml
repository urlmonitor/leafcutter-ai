notes: |
  THIS EARNS ITS PLACE BECAUSE THE RUN IS CODE-SHAPED THROUGHOUT. Its ordering assumes
  tests are written before code, its gates assume a red baseline exists before work and
  a green one after, and its finish step assumes a passing covering test. Every one of
  those assumptions is satisfied vacuously or not at all by a page-and-diagram group,
  and "satisfied vacuously" is the dangerous half: a gate that passes because there was
  nothing to check reports the same green as a gate that checked something.

  So this is not a hypothetical edge. Documentation-only and diagram-only areas exist in
  quantity — 152 not-yet-done requirements declare the documentation craft and 119
  declare the diagram craft — and a group drawn from one of those areas contains no
  code by construction.

  THE LAST CLAUSE MATTERS MOST. A run that produces both artifacts and then reports
  "nothing to build" is worse than one that refuses, because the operator believes the
  area is empty and stops looking at it.

  BOUNDARY: what proves the page and the diagram is BO-3500c, not this record. This one
  only asserts that the absence of a test does not by itself end the run — it takes no
  position on what does prove them, and must not be read as saying nothing needs to.
