notes: |
  UNDER-SPECIFIED, NOT INVENTED: WHAT HAPPENS TO THE COMMENT WHEN THE HOLD LIFTS. When
  the flag closes, or the PR declares a fix, the check passes — but a comment saying the
  PR is held remains on it. The design does not say whether that comment is edited to say
  the hold has lifted, removed, or left. Leaving it is misleading; editing it is the
  obvious choice; this record does not make it.
