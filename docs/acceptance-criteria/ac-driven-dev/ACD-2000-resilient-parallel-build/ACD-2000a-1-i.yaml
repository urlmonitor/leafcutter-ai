title: "A requirement being taken and handed back leaves its existing trail intact and complete"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement whose trail already holds three attempt records,
  When that requirement is taken for a build and then handed back, and taken and
    handed back again,
  Then the trail still holds exactly those three records, each with every
    attribute it started with,
  And no record has been reordered, merged, or emptied,
  And a hand-back that is interrupted part-way through writing leaves the
    requirement readable, with either the three records or the three records plus
    a complete fourth -- never a partial record and never a truncated file,
  And two efforts taking and handing back two different requirements at the same
    time each leave the other requirement's trail untouched.
depends_on: [ACD-2000a-1]
