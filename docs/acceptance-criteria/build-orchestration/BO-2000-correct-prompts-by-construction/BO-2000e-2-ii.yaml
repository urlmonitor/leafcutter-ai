  n_location_rule: "2 -- the pre-coder gate in build-ticket.js and its twin in build-feature.js, which must stay identical"
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_test_requirements_guard.py"
  notes: |
    Once test-writing is signed off it leaves the set of phases still needed, so it can
    never re-supply in-drive evidence; without a route that reads tests already on disk
    a re-run of the same ticket deadlocks permanently. Evidence from an earlier drive
    counts only when each recorded test file is confirmed present on disk at the time
    the gate runs.
    Test coverage: drive a code ticket with no Test Requirements and no scheduled
    test-writer phase, with previously written test files present, and assert the coder
    phase IS dispatched -- behaviorally, by recording which phase agents the workflow
    actually dispatched.
