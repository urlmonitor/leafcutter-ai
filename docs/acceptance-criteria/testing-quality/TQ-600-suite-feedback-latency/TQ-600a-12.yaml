notes: |
  THE PROGRAMME THAT EXISTS TO DELETE THE SUITE'S BUILD SUBPROCESSES IS THE SUITE'S
  LARGEST CONSUMER OF BUILD SUBPROCESSES. 27 tests, 1,535 s, 29% of measured time,
  0.5% of the measured tests. These are good tests — cross-process behaviour can only
  be proven by real processes — and the cost is not carelessness. It is one line:
  `run_key()` falls back to a per-process UUID, and every child session is a new
  process.

  THE HONEST OBJECTION, AND WHY IT DOES NOT BITE. "You are testing the fixture with
  the fixture." Seeding means a child's layout came from a copy this harness made
  rather than from a build the child ran. If the build broke, would the 17 eligible
  tests notice? No — and they do not notice today either. That is not their job. The
  three deploy-count files that stay on real builds notice, the roughly 20 build-guard
  tests notice, and every CI job that builds before pytest notices. The 17 assert
  routing, reporting and integrity comparison; a seed that is byte-identical to a
  built layout changes nothing any of them can observe. What makes this safe is
  TQ-600a-12-i (the seed is refused when it is not byte-equivalent) and TQ-600a-12-ii
  (the tests for which the deploy count IS the assertion can never be handed one).

  SIZING. Roughly 23 productions become roughly 6 real deploys for the three KEEP
  files, plus one seed build, plus roughly 16 copies: about 1,069 s down to about
  120 s, a saving near 950 s — about 16 minutes on an idle local run, and larger than
  the entire estimate for the build-sharing work this L1 was originally scoped
  around.

  INDEPENDENT OF TQ-600a-11. This record and the YAML-parser record share no code and
  no ordering. Build them in either order, or at the same time.
