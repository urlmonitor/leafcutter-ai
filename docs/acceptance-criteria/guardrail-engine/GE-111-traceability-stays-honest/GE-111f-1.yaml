notes: |
  Authored by /quick-fix. Root cause: The skip/xfail weakening patterns are matched against each added diff line in isolation: added skip lines are never netted against removed skip lines of the same kind in the same file, and files whose diff status is A (newly added) are judged even though a new file cannot weaken an existing test. Fix: per file, report a skip/xfail weakening only when the added count of that kind exceeds the removed count, and ignore files added in this diff; keep blocking a skip added to an existing test that had none. Recorded as KI-CG-20261023-contract-shrinking-counts-moved-skips-as-added (docs/known-issues/commit-guardian/open-low-ki-cg-20261023-contract-shrinking-counts-moved-skips-as-added.md); move it to resolved/ and update the register index when fixed. Note scripts/commit_guardian/check_contract_shrinking.py is the build output of the template and must stay in sync..
  components uses commit_guardian (registered in docs/components.json), matching the parent GE-111f and its siblings; there is no guardrail_engine entry in components.json.
