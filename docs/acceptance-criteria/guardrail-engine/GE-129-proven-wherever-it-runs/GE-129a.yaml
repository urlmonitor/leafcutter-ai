notes: |
  ==========================================================================
  THE SEAM AGAINST BP-1600a-1 — STATED ONCE, PROPERLY, AND NOT TO BE BLURRED
  ==========================================================================
  Same surface, two questions, and they are asked of two different populations:
    - BP-1600a-1 asks IS THIS SCRIPT IN THE INVOKED SET AT ALL. Its population is the
      scripts present on disk beneath the hook directory; its comparison is against what
      the settings surface executes; its verdict is wired / run-by-nothing / deliberately
      unwired-with-a-ground.
    - THIS RECORD asks CAN AN INVOKED ONE SAY NO. Its population is the entries the
      settings surface itself names, read at run time, restricted to those a tool-call
      event actually executes; its verdict is the four-value observed state.
  The worked example settles that neither implies the other: readme_read_guard.py is
  wired, so BP-1600a-1 reports it as wired and is correct, and it still cannot refuse.
  A script the census reports as run by nothing has no entry point to put an input
  through and is simply not in this record's population.

  WHY THIS IS NOT A depends_on, DELIBERATELY. This record never needs the disk walk. It
  reads the settings surface and takes the invoked set from it — both sides of that read
  are on the registration surface. Making BP-1600a-1 a prerequisite would park this record
  behind an unbuilt approved record for no mechanical reason and would invite the second
  error the fence exists to prevent, which is one of the two growing a census the other
  already owns. Fenced in doc_links, consumed nowhere, duplicated never.

  THIS TREE READS A REGISTRATION SURFACE AND DOES NOT WALK DISK. Inherited verbatim from
  GE-120f's tree-wide boundary and ADR-045 §2. A script registered nowhere is structurally
  invisible here and is BP-1600a-1's. Do not build a disk walk beneath this record, and do
  not read this record as covering the registered-nowhere case, because it cannot see it.

  ==========================================================================
  WHAT IS GENUINELY DIFFERENT ABOUT THIS SURFACE — THE BA'S REAL WORK
  ==========================================================================
  Three differences, all of them consequences of the surface's shape rather than of
  anybody's preference, and none of them a licence to re-decide ADR-045:
    1. NO IDENTIFIER TO BIND THE DECLARATION TO. A hooks_manifest entry is a JSON object
       with an id, so ADR-045 §3 attaches negative_control and entry_point to the entry
       itself. A settings.json entry is ALSO a JSON object — {type, command, timeout} —
       inside a matcher group, but it carries NO ID. Where a session hook's declaration
       lives, and how it is bound to the script so the binding cannot drift, is the open
       question. The constraint that is NOT open: reuse
       config/verification_flow.schema.json's names. A synonym set beside it is how a
       vocabulary with one reader becomes a vocabulary with none.
       CORRECTED 2026-09-15 — this clause previously read "a command string inside a matcher
       group, with no id and no fields", and was headed "NO PLACE TO HANG THE DECLARATION".
       Inherited unverified from BrainCandy's dispatch brief and false on its second half:
       verified at templates/settings.json:50-59, the entry is an object and there IS a
       place to put a value. What is genuinely absent is an IDENTIFIER, which is the half
       that matters and the reason this L1's GE-129a-2 derives the tie from particulars read
       off the surface at run time instead of looking it up by key. The open question is
       therefore not "where is there room" but "does the editor's own settings parser
       tolerate an unknown key" — a fact about that parser, not about this project, and the
       IT PO's to settle. Prior wording quoted rather than deleted.
    2. A DIFFERENT ENTRY POINT. The production way in is a harness tool-call event carrying
       its payload, not run_hook.py. Invoking one of these scripts as a bare command with a
       path in argv is NOT the entry point the protected surface uses, and a clean exit from
       a hook that was handed nothing is the never-attempted state wearing a pass — this
       repository's most repeated trap and ADR-045 §5's explicit requirement. Establish that
       the hook saw its input before reading its verdict.
    3. A DIFFERENT OBSERVABLE REJECTION. The worked example is a PreToolUse hook, so its
       refusal is the tool call being denied, not a commit being blocked. The declared
       rejection has to be expressed in terms this surface can produce.

  ==========================================================================
  THE WORKED EXAMPLE IS THE ACCEPTANCE TEST FOR THIS RECORD
  ==========================================================================
  readme_read_guard.py must end up examined and reported as never having demonstrated a
  refusal. Two things that will otherwise quietly defeat that, both already recorded in
  this family and both re-stated here because they bear directly on this one script:
    - ITS INERTNESS ARISES BY TWO MECHANISMS DEPENDING ON LAYOUT — an exception in the main
      workspace, a plain failed prefix match inside a worktree. A demonstration that covers
      only the first leaves every worktree unexamined, and worktrees are where the drives
      run.
    - THE COPY THAT IS EXAMINED MUST BE THE COPY THAT RUNS. templates/ is canonical;
      .claude/hooks/ is a build output reached through symlinks, and resolving paths
      through those symlinks is precisely what made this guard inert in the first place.
      An observation made against a copy the harness does not load fails GREEN, which is
      indistinguishable from a pass.

  ==========================================================================
  INHERITED, NOT REPEALED, AND NOT RESTATED
  ==========================================================================
  ADR-045 in full, and §7 in particular: anything built beneath this record is a verifying
  surface, so it must be guarded both by the regime it participates in and by at least one
  independent check that does not route through that regime, because its silent failure is
  byte-for-byte what a healthy repository with nothing to report also produces. That rule
  is already written; do not re-argue it, do apply it.

  This component's fail-open convention (GE-116a-1-iii) and GE-120's line over it: failing
  open on one bad input while the check still ran is fine; reporting success for a check
  that never ran is not. Block-vs-announce stays a per-stage L2 decision; the unit is
  visibility.

  ANTI-GREP BINDS EVERY DESCRIPTOR BENEATH THIS RECORD. Nothing here may be satisfied by
  asserting that a string appears in settings.json, that a declaration parses, or that a
  field is populated. The discriminator is ADR-045 §1's alter-and-revert pair: hold the
  declaration byte-identical, change the guard's behaviour, and require the recorded state
  to move.

  NO POPULATION FIGURE in any criterion or test expectation beneath this record. The
  13-and-11 measurement in the doc_links is dated evidence; GE-120f records the instance
  count as DISPUTED and forbids a figure below it. Assert by count-and-membership over the
  run's own output.

  DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME. On the commit that lands this, the session
  hooks will report that no refusal has ever been demonstrated, because none has. That is
  the true state; pre-suppressing it by seeding records or writing exemptions ahead of the
  first run is the failure mode, and a postponement is not a ground for an exemption.

  documentation_triggers is [reference-doc] and nothing else, matching GE-120f: the rule
  has to be written where the next session-hook author will find it, and what is written
  down today is a vocabulary with no reader. No component-diagram — ADR-045 §5 binds the
  execution surface to the existing harness, which is to be extended rather than drawn
  twice.

  Authored at the PO stage. L1 only. No L2, no L3, no test_spec, no it_requirements, no
  assigned_agent, no estimated_complexity and no declares_side_effect, by design.
