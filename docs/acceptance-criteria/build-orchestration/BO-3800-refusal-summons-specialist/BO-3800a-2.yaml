it_requirements:
  - >-
    THE COMMIT AGENT DOES NOT SPAWN. It runs at depth 1, where ADR-019 drops Agent calls
    silently. On a refusal whose declaration names a specialist, it returns {status:
    "handoff", handoff_target: <declared specialist>, remedy: {hook_id, skills, demand}}, the
    PHASE_RESULT_SCHEMA handoff shape that BO-3000a routes. It neither calls the Agent tool
    nor lets precommit-autofix Step 4a.3 attempt the dispatch for that hook.
  - >-
    THE PAYLOAD IS BUILT BY A SCRIPT, NOT BY THE AGENT. A deterministic helper turns the
    hook's structured refusal record (GE-132a-3) and the declaration into the payload. The
    agent passes its output through and never composes it from prose. This is BO-3100's
    standing constraint (mechanical enforcement) and BO-3000a's no-inference rule. It is the
    unit-observable seam: run the helper on real check-complexity output and assert the payload.
  - >-
    TWO DEPTH-0 CONSUMERS, ONE CONTRACT. In a drive, the driver consumes the payload
    (BO-3800b-3). For a commit-agent commit outside a drive, this record settles the
    mechanism: the /commit surface (templates/workflows/commit.md) dispatches the commit agent
    from a depth-0 workflow script under templates/workflows-js/. That script consumes the
    same payload, engages the specialist, then re-offers the commit. A prompt telling the
    session to "bring in the specialist" does not satisfy arm two.
  - >-
    A DIRECT COMMIT GETS NOTHING NEW. When a session or a person runs git commit, nothing is
    held, no handoff artifact is written and no party is dispatched. The GE-132a-3 refusal
    text is all they get.
  - >-
    The refusal path does not mutate the working tree or the index (BO-3800a-1). The
    re-offered commit runs the same hook chain.
  - >-
    COMPANION PROSE IN THE SAME TICKET. commit.md (the agent) Step 5 and precommit-autofix
    SKILL.md Steps 4 and 4a describe returning the handoff. That is an llm-expert surface,
    and the generated ticket's agents map includes llm-expert for it (BO-3000a precedent).
    Follow the CLAUDE.md error-handling policy. An unreadable declaration in the helper is a
    named failure, never an empty payload.
