amended_by:
  - reason: "Original criteria said an entry is carried when it exists 'on one of the merge's parents but not on the other' — binary phrasing that only fits a two-parent merge. The implementation initially matched that scope: it detected a merge via `git rev-parse -q --verify MERGE_HEAD`, which resolves only the FIRST line of MERGE_HEAD, so an octopus merge's third and later parents were never consulted and a genuinely-carried entry from one of them was still wrongly refused. Fixed by reading MERGE_HEAD off disk in full (one SHA per line) and generalised the criteria wording to 'at least one of the merge's parents ... including a parent named third or later in an octopus merge' so the record no longer describes a narrower behaviour than the code implements."
