it_requirements:
  - "THE REFUSAL TO ANSWER LIVES ON THE ANSWERING SIDE, NOT AT THE CALL SITE. The observation's own entry point must reject an empty, whitespace-only or None subject and return reached_through 'undecidable' with cause subject_not_named. Fixing only the caller is insufficient: today's call site passes \"\" (scripts/ac_store/_done_proof_entry_point_gate.py line 202, _observe_reachability(test_file, test['function'], \"\", entry_point)), and as long as an unnamed question can come back with a plausible negative, the next caller repeats the mistake and no test of that caller catches it."
  - "THE SUBJECT IS DERIVED FROM THE RUN AGAINST THE DECLARED UNIT, NEVER LOOKED UP IN A STORE FIELD. No field anywhere in the store names a callable: surface_invoked holds 271 records across 368 occurrences and ZERO are of '<module>:<callable>' shape (166 are free prose), and reference_file_path is schema-defined as a registration edit surface. The subject is therefore the SET of code belonging to the declared unit — every frame whose resolved co_filename equals the declared unit's resolved source path — and 'reached through' is true when any member of that set was entered while an entry-point frame of that same unit was a live ancestor."
  - "NO NEW STORE FIELD, NO NEW AC-RECORD KEY, NO SCHEMA CHANGE IS PERMITTED BY THIS AC. Reaching for a field to hold a function name recreates the empty-question defect with more ceremony — asking the store for a name it does not hold is how target_spec=\"\" arose in the first place."
  - "THREE DISTINGUISHABLE ANSWERS: 'reached', 'not_reached', 'undecidable'. 'undecidable' must not be representable as False, must not compare equal to 'not_reached', and must not be the default value of the field. A consumer that ignores the distinction must be structurally unable to produce a refusal from it: the refusal path must test for the literal 'not_reached'."
  - "entered_entry_point AND reached_through STAY TWO SEPARATELY READABLE FACTS, AND A CONSUMER READING ONLY THE FIRST MUST BE UNABLE TO REFUSE. That degeneration is the measured defect, not a hypothesis: with the subject empty, reached_through is structurally negative for every proof ever judged, so the rule fell back to the only fact left and now ACCEPTS a proof that calls main(['noop']) then calls the code directly, while REFUSING an honest direct-import proof. Both verified by execution."
  - "THE POSITIVE HALF IS PART OF THE CONTRACT. When the subject is named and a proof enters the way in for an unrelated action and then reaches the code by a separate route, the answer is 'not_reached' — a real, non-undecidable negative. Without this, 'always answer undecidable' satisfies the AC and the rule is inert."
  - "THE ANSWER IS PER (nodeid, declared unit), NOT PER RUN. A run reaching several members of the declared unit's code set answers once for the unit; a run reaching code belonging to some other unit contributes nothing to this answer, however thoroughly it was exercised."
  - "INHERITED, NOT RESTATED: ancestry remains one fact about one live call chain (BO-2900a-2), and no code path may read the proof's source text to decide any of this. This AC constrains only the well-formedness of the question and the arity of the answer."
delivers_to:
  agent: python-coder
  contract: "An observation answer that carries three distinguishable states for the reached-through question — reached through, not reached through, and cannot be decided because nothing named the code — consumed by BO-2900a-1 and BO-2900a-1-i. Concretely: reached_through: 'reached'|'not_reached'|'undecidable', with undecidable_cause: 'subject_not_named'|null, alongside the separately readable entered_entry_point: bool; the refusal path may fire only on the literal 'not_reached'."
expects_from:
  ac_id: BO-2900a-2
  contract: "The ancestry-aware observation whose question this AC requires to be well-formed: the amended reach_record, whose subject is the declared unit's code set derived from the run rather than a '<module>:<callable>' string looked up in a field. The parent already forbids computing reached-through as two independent booleans; this AC forbids asking for it without naming a subject, and widens the answer from a boolean to three values."
test_spec:
  - name: test_an_unnamed_subject_is_answered_undecidable_and_never_not_reached
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "scripts/ac_store/done_proof.py::_run_pytest_and_parse"
    description: "Runs the real observation over a real proof that DOES reach the code, first with the subject omitted and then with it named. Asserts the unnamed call answers undecidable with cause subject_not_named, the named call answers reached, and the two answers are not equal — the half that fails on today's code, where the unnamed question returns a plausible negative."
    must_catch:
      - "an observation that returns a false-y reached_through for an empty subject, which is today's behaviour"
      - "an implementation that raises on an empty subject so the caller's own except branch converts it into a refusal"
      - "an implementation that answers undecidable for the named call too"
  - name: test_a_named_subject_tells_reached_through_apart_from_reached_by_another_route
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Executes the exact pair the analysis measured, in one assertion block: a proof that calls main([action]) and reaches the code through it, and a ritual proof that calls main([noop]) and then calls the code directly. Asserts reached and not_reached respectively — the verdicts the shipped gate returns in the wrong order."
    must_catch:
      - "a predicate that degenerates to entered_entry_point and so accepts the ritual"
      - "a predicate that always answers undecidable"
      - "a predicate that credits any entry into the way in regardless of the action taken"
  - name: test_no_criterion_is_refused_from_an_undecidable_answer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Drives the real verify_done_eligible over a fixture whose observation answers undecidable, and asserts the returned verdict is equal in every key to the verdict the same evaluation returns with the rule not invoked. Separately asserts the undecidable case was announced, so an implementation that never reached the rule cannot pass on the equality alone."
    must_catch:
      - "an undecidable answer that produces a refusal"
      - "an undecidable answer that silently credits the criterion with no announcement"
      - "a rule never reached at all, making the equality assertion vacuous"
  - name: test_only_the_not_reached_answer_can_produce_a_finding_in_the_real_consumer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Feeds the real consumer in _done_proof_entry_point_gate.py each of the three answers as produced by three real runs, and asserts exactly one of them — not_reached — yields a finding. Proves the consumer discriminates on the value rather than on falsiness."
    must_catch:
      - "a consumer written as `if not reached_through:`, which fires on undecidable too"
      - "a consumer that treats undecidable as reached and stays silent on a genuine miss"
test_rationale: "Both halves must execute in one run. The unnamed-question half is what fails on today's code — the gate passes an empty subject and the answer is structurally negative for every proof ever judged — and the named-question half is what stops the fix being 'always answer undecidable', which would satisfy the first half perfectly while leaving the rule inert. A test handed pre-computed answers proves neither; it is the same shape of evidence that let the empty question ship in the first place. The second entry is the decisive one because it executes the measured pair directly: a ritual proof the gate ACCEPTS today and an honest proof it REFUSES today, asserted to swap. The fourth entry exists because the durable repair is on the answering side but the observable damage is on the consuming side, and a three-valued answer read with `if not x:` reproduces the defect exactly while every test of the observation still passes."
