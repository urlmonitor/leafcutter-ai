assigned_agent: python-coder
estimated_complexity: L
change_target: code
risk_surface: internal
package_surface: false
it_requirements:
  - "ONE RECOGNITION RULE, IN ITS OWN NEW MODULE (e.g. scripts/skill_ref_recognition.py): a pure function text -> list of recognised instructions. It replaces BOTH registry_validator._extract_skill_refs_from_template (deleted, AR-400a-1) and check_skill_refs._scan_text's imperative heuristic, and is the rule propose_agent_self_description.py reuses (AR-400e-3). No second regex set may remain anywhere in scripts/."
  - "The eight phrasings in the criteria are a FLOOR (the real tree on 2026-10-12): path form (.claude/skills/<id>/SKILL.md and templates/skills/<id>/SKILL.md), 'invoke/run/apply/load/resolve and load the <id> skill' with or without backticks, a written-out 'Skill: <id>' tool call, a table row whose cell holds a SKILL.md path plus an invoke verb, and a heading 'Load the <Id> Skill'. A purely descriptive sentence naming an existing ability is not an instruction."
  - "CASE: recognition is case-insensitive; each recognised instruction carries the text as written AND the canonical id it resolves to case-insensitively against the known ability set (or None). Whether a case-only variant is a fault is AR-400b-2-v's decision (orchestrator default Q1: fault with 'did you mean')."
  - "LINE NUMBERS are 1-based and refer to the file on disk; HTML comment blocks are blanked with newlines preserved (AR-400a-1-ii)."
  - "Recognition is applied to the template BODY only; frontmatter (including behavioral_patterns entries) is out of the body scan."
  - "Must complete within 2 seconds over the full real tree (about 63 agent templates plus every templates/skills/**/*.md) on a developer machine; the validator is on the commit path."
test_spec:
  - name: test_eight_real_phrasings_each_yield_one_finding
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Copied package slice with abilities a1..a8 created but not granted; probe-agent's body holds exactly the eight criteria lines; the validator CLI reports exactly eight findings, one per line, each naming probe-agent, the ability and the line; line 8's finding names canonical id 'a8'."
    must_catch:
      - "only the path form is recognised (today's check_skill_refs behaviour)"
      - "recognition is case-sensitive so 'A8' is missed"
      - "the table-row form is missed"
  - name: test_descriptive_mention_is_not_an_instruction
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "A ninth line 'The a9 skill's output is a table.' (a9 exists, not granted) produces no finding."
  - name: test_recognition_over_real_tree_completes_within_budget
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: boundary
    description: "Running the validator over the real tree completes within the 2-second recognition budget (measured around the recognition call, not the whole subprocess start-up)."
test_rationale: >-
  The eight lines are the real tree's own phrasings, so a rule that misses any
  of them re-hides a real fault; the ninth line is the counterweight that keeps
  the rule from flagging every mention.
delivers_to:
  - agent: python-coder
    contract: "The recognition rule: given a definition or guide, the list of (ability_text, canonical_id_or_none, file, line) instructions it contains -- consumed by AR-400a-1 (existence) and AR-400b-1 (grant). Python shape: recognise(text: str, known_ids: set[str], agent_ids: set[str]) -> list[{'ability_text': str, 'canonical_id': str | None, 'line': int, 'names_agent': bool}]; file is attached by the caller."
  - agent: python-coder
    contract: "The same function reused by scripts/propose_agent_self_description.py (AR-400e-3) so the proposer and the gate agree on what an instruction is."
