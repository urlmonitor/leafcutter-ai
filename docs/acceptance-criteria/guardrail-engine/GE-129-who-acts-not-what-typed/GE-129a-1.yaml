notes: |
  BLOCKS EVERY SIBLING. Every other GE-129 L2 lists this record in depends_on (user decision,
  2026-09-17, recorded on GE-129a). GE-129 L3s reach it through their parent L2.

  WHY THREE ATTEMPTS PER CALLER. A value that is present once is not an identity rule; the probe
  must show whether agent_id / agent_type are stable for the same caller. A single observation
  cannot distinguish a documented field from an incidental one.

  WHY THE SECOND SCENARIO LIVES HERE AND NOT UNDER GE-129d. GE-129d's notes ask for the permission
  prompt's behaviour per mode to be decided by observation "as part of GE-129a's live probe". It
  is the same scratch-repository run, and GE-129d-2's refusal set is defined by this finding
  rather than by a list of mode names.

  THE STOP RULE. Case (3) carrying no identity makes GE-129c unmeetable as framed: a workflow's
  commit specialist would be indistinguishable from the top-level session and refused wherever
  no person is reached. The criterion does not choose a fallback; it returns the decision to the
  user. Cases (2)/(4) missing identity would have the same effect on the Agent-tool path and are
  also reported, but the user's stop rule names case (3).

  CASE (6) IS THE INPUT TO GE-129a-4. If a user- or plugin-scope definition of the same name
  arrives with an agent_type indistinguishable from the package's, name-based identity cannot
  tell them apart at run time, and the parity check is the only safeguard (the stated limit,
  GE-129e-4).

  THE DISPATCH SCENARIO (added 2026-09-17, user decision). GE-129d-2-i refuses a top-level
  session's dispatch of the commit specialist in a no-person mode and leaves workflow runs'
  dispatches alone. Only this scenario can supply the value that tells the two apart. If it
  records that none does, GE-129d-2-i fails closed (the session's dispatch is refused -- which in
  that mode also refuses the workflow run's) and the finding goes back to the user.

  declares_side_effect: true -- derived from the first Then ("a findings record is written").

  ASSIGNMENT (BA proposal, IT PO to confirm): python-coder -- the probe is a scripted capture
  harness around a registered guard. Where the findings record lives is the IT PO's.
  IT-PO ENRICHMENT (2026-09-25).

  ASSIGNMENT CONFIRMED: python-coder, as the BA proposed. Three pieces, kept apart on purpose:
  a RECORDER registered in the scratch repository exactly as the real commit guard is registered,
  appending the whole PreToolUse stdin payload verbatim; a DRIVER that stands the scratch
  repository up through GE-120c-1's machinery and runs every case and mode it can run unattended;
  and a COLLATOR that reduces the capture log to the findings record. Capture and interpretation
  stay separate so the capture can answer a question nobody had thought to ask when it was taken.

  WHERE THE FINDINGS RECORD LIVES.
  templates/scripts/commit_guardian/caller_identity_findings.json - inside the directory
  build_commit_guardian copies verbatim, so the deployed guard can read it with no deploy-map
  entry. Its schema is config/caller_identity_findings.schema.json, read by the collator and by a
  commit-time validator and NEVER by the deployed guard, which reads only the findings file. That
  split is deliberate: a runtime schema read would be a second import out of the deployed
  directory and would raise ModuleNotFoundError-shaped failures in the field while source-tree
  tests stayed green.

  ITS SHAPE (machine-readable because GE-129d-2 refuses exactly the modes it names).
    observed_at    - Claude Code version and date, on EVERY entry. These observe a third-party
                     harness and they rot.
    callers        - cases (1)-(6): agent_id present yes/no/unobserved; agent_type value or
                     explicitly absent; stable across the three attempts yes/no/unobserved; for
                     case (6), whether user-scope and plugin definitions are distinguishable from
                     the package's.
    permission_modes - the four modes: prompt shown to a person, ran unanswered, permission mode
                     value received. Each yes/no/unobserved.
    dispatches     - one entry per (dispatcher, mode) pair: the harness-supplied values received
                     at dispatch and at the commit that follows, plus a per-mode discriminator
                     field whose value is either the field name that tells a session dispatch from
                     a workflow run, or the explicit value none.
    stop_verdict   - emitted by the collator when case (3) carries no agent_id or no agent_type.
  unobserved and none are first-class values that round-trip through the schema. An absent key
  never means anything - GE-129d-2 refuses on these values and GE-129d-2-i fails closed on none,
  so a gap that looks like a pass is the defect this tree exists to remove.

  WHAT CANNOT BE DRIVEN UNATTENDED IS RECORDED, NOT GUESSED. Whether a permission prompt reaches a
  PERSON in the default interactive mode is not establishable by a script. Those entries are
  operator-observed with their evidence; anything nobody ran reads unobserved.

  NEEDS THE USER:
    1. Confirm caller_identity_findings.json belongs inside templates/scripts/commit_guardian/
       (deployed with the guard) rather than under docs/ or config/. It is evidence, but it is
       evidence a deployed guard must read at run time, which rules out a docs-only home.
    2. Cases (1), (5) and the interactive-mode rows need a human at a terminal. Someone has to run
       them and paste the evidence; the probe cannot complete on its own, and the tree is blocked
       on its completion. Plan for that before the ticket is dispatched.
    3. The record's isolation requirement (the probe must be incapable of committing into the
       launching repository) is stated as a precondition here. Confirm that is strong enough, or
       whether it should be its own L3.
