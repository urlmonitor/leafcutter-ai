  - name: test_refusal_line_helper_excludes_exactly_one_submit_failed_line_and_stderr_lines_keeps_its_meaning
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Exercises the new refusal-line helper of _inf_500d_4_helpers.py (named refusal_lines in this design; the implementer may choose another name, the test follows it) on synthetic completed processes: one human line plus one submit-failed: line counts 1; two human lines plus one submit-failed: line counts 2; one human line plus two submit-failed: lines counts 2; a single submit-failed: line alone counts 0; an indented line that does not begin with submit-failed: is not excluded; a blank line is not counted. stderr_lines on the same inputs still returns every non-blank line including the submit-failed: one."
    proves_clause: the destination could not be written
    code_file: unit_tests/feedback/_inf_500d_4_helpers.py
    must_catch:
      - helper count widened to two lines
