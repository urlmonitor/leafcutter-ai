  contract: 'Grouping suggestion with placement: category id | none, and reason.probability for Jev placements.'
change_target: code
risk_surface: internal
it_requirements:
- 'The acceptance setting is dec-a070edfb6465bced''s Jev probability threshold: a placement is accepted only when Jev''s chosen option is an existing category and its probability is >= the threshold. Default 0.8, held in kernel config and never hard-coded at a call site.'
- 'An offline evaluation command (IT PO default name: python -m kernel criteria evaluate-grouping) scores the grouping on a labelled set at each configured setting (default 0.5, 0.7 and 0.8). It reports, per setting, the accepted merges, precision (correct / accepted), recall (correct / in-category) and the share of none-labelled wordings left at none, and selects the setting with the highest precision, recall breaking ties only. No minimum recall applies, because a missed merge stays a candidate.'
- 'The labelled set is the trial''s: 78 wordings against 7 categories (22 in-category, 56 none) plus 4 related-but-different pair probes. The trial is committed durably at docs/analysis/2026-10-03-jev-trial-criteria-grouping/ (results.json with the recorded per-wording Jev outcomes, summary.md with the figures and caveats; the run script itself is not kept, and summary.md states how the trial was run). The CI fixture is taken from that directory, either read from it or derived from it with its source named, so CI replays the recorded outcomes through a controlled Jev provider. The fixture never points at a session scratchpad.'
- A live re-evaluation against real Jev is an operator check, not CI. Its report names the model version, the date and the selected setting, and it never changes the configured threshold by itself; a person changes the config.
- Every wording gets exactly one outcome, one existing non-retired category or none. Below the threshold the outcome is none, never the nearest category, and a none wording stays its own candidate.
test_required: true
test_spec:
- name: test_every_wording_gets_one_outcome
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Replaying the 82-wording fixture, every wording gets exactly one existing non-retired category or none.
- name: test_below_threshold_gets_none_not_nearest
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A wording whose top Jev choice is below the threshold gets none, not that category.
- name: test_evaluation_reports_precision_recall_none_share_per_setting
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The evaluation reports accepted merges, precision, recall and the none share for 0.5, 0.7 and 0.8.
- name: test_highest_precision_setting_selected_over_higher_recall
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: On the trial fixture the selected setting is 0.8 (12 of 12, 55% recall) over 0.7 (15 of 16, 68% recall).
- name: test_none_wording_stays_candidate
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A wording left at none remains its own candidate in the pool.
- name: test_threshold_read_from_config
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Changing the configured threshold changes the accepted merges without a code change.
test_rationale: Drive the grouping through its public entry point with a controlled Jev provider that replays recorded probabilities and counts calls, plus a recording host port that fails on any request; assert placements, reasons and call counts, not internal helpers.
