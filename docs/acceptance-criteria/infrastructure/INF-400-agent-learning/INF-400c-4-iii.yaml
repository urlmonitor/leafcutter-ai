title: "Phase telemetry and knowledge emissions are separate streams, and the harvester drains only its own"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c-4.yaml"
criteria: |
  Given the operational stream at debugging/logs/agent_telemetry.jsonl is
    shared and is not a knowledge file: at 2026-09-07 its 33 lines are 28
    knowledge-capture records, 4 pre-drive writability probes carrying no
    `event` key, and 1 line that is not JSON, and further shapes are expected
    from the drive-telemetry emitter and from the capture-attempt ledger,
  And a knowledge record and an operational record have different lifecycles —
    an operational record is appended and aggregated indefinitely and is never
    consumed, while a knowledge record is drained exactly once and then
    watermarked,
  When an agent emits a knowledge record and a drive emits an operational
    record in the same run,
  Then the knowledge record is appended to the declared knowledge-emission
    sink and the operational record to the operational stream, and neither
    file receives the other kind,
  And both streams are declared the same way INF-400c-4 requires — an absolute
    path fixed when the package was built into the project, not a name each
    process finishes resolving — so an install holds ONE of each rather than
    one pair per working directory: an operational record emitted from inside
    an isolated working directory is written to the same file as one emitted
    from the project root, and that file still holds it after that working
    directory has been removed. Two streams is the outcome here, not two
    streams in every place work happened. A stream that fragments per working
    directory satisfies the neither-receives-the-other clause above while
    making the operational stream unaggregatable for the three consumers that
    read it, which is the argument the whole separation rests on,
  And the reader of knowledge records opens only the declared
    knowledge-emission sink: pointed at a sink holding no knowledge records it
    reports zero records read, and it does not fall back to, widen into, or
    otherwise open the operational stream when its own sink is absent or
    empty,
  And the operational stream is byte-identical before and after a run of the
    reader of knowledge records — the reader never opens it, so no run of it
    may leave a mark on it, and in particular no drain, no watermark and no
    rewrite reaches it,
  And no step of the work that separates the two streams moves records out of
    it, filters it, rotates it, archives it or rewrites it: the separation is
    achieved entirely on the producing side, and the operational stream is not
    touched at all,
  And every existing reader of the operational stream returns identical
    results over it before and after that change,
  And the separation is recorded in the architecture documentation as the
    reason one sink with a type discriminator was not chosen: a single file
    drained by a watermark and simultaneously appended for aggregation makes
    an unrouted record and an unaggregatable record indistinguishable.
depends_on: [INF-400c-4]
