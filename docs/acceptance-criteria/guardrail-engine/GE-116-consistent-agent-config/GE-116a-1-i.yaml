id: GE-116a-1-i
components:
  - commit_guardian
title: "Verification-required agent with an empty abilities list is blocked"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a staged agent definition whose settings declare that it must verify
    the changes it makes (requires_verification is true),
  And that agent declares an abilities list that is present but empty (no tools
    at all, so neither the ability to edit nor to create files is granted),
  When the commit is attempted,
  Then the commit is blocked fail-closed,
  And the block is reported as a failure of the consistency guard.
