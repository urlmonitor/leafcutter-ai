notes: |
  Satisfies BO-3200f's `component-diagram` documentation trigger.

  THE SECOND CLAUSE OF THE SECOND SCENARIO IS WHAT KEEPS THE DIAGRAM HONEST. A diagram that shows
  the executor correctly but omits the twenty-odd dispatches still addressed to status-checker
  passes the first scenario and teaches the target state as if it were the current one. Reading
  BO-3200f-3's listing makes the comparison mechanical.
