it_requirements:
- Path/root resolution must not hardcode the dev workspace layout (parent leafcutter/ with leafcutter-ai/
  child). Resolve repo root from the git toplevel of the invocation cwd (see ADR-001 self-hosting boundary).
- The isolated authoring worktree and AC store location must be derived from the resolved consumer repository
  root, not assumed dev paths.
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
