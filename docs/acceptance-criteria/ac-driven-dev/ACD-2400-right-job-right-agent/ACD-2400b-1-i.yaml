readiness: draft
priority: medium
title: "An outcome clause with no test-intent entry, or an entry for a clause that no longer exists, is reported"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a record whose criteria carry 4 outcome clauses and whose test intent has entries
    for only 3 of them,
  When the requirement rule check runs,
  Then one finding names the record and quotes the clause that has no entry,
  And when a test-intent entry names a clause whose text no longer appears in the criteria,
    a finding reports that entry as stale,
  And after a fifth outcome clause is added to the criteria, the next run reports the
    fifth clause as having no entry,
  And a record whose every outcome clause has exactly one entry produces no finding for
    this rule.
