id: BO-2900g-3
components:
  - ac_store
  - build_orchestration
  - testing_quality
title: "One set of words for a required proof, with the reached-the-real-way kind named once"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given exactly two definitions are in scope — the two that disagree today about
      WHICH KIND OF PROOF a required proof is:
      the ticket-facing one, whose permitted kinds are a single muddled list that
        mixes how heavy a test is with one kind-of-proof value, an older name for
        the reached-the-real-way proof, and which requires the way in to be named
        only for that one value,
      and the store-facing one, which already keeps the two apart and carries the
        kind-of-proof names, the reached-the-real-way name among them, on an axis
        of its own,
    And a THIRD, DIFFERENT thing that is NOT one of those two and is NOT in scope:
      the store-facing separate axis for how heavy a test is and where it runs,
      whose values name test levels and never name kinds of proof — the two
      definitions in scope do not disagree about it, and nothing here asks for it
      to change,
  When the two definitions in scope are reconciled into the project's single
    definition of the kind of proof being asked for,
  Then exactly one statement of the permitted kinds of proof remains, and every
    producer and every reader of a required-proof description resolves to it,
    And the reached-the-real-way kind is called by the name the test-angle
      taxonomy uses for it,
    And a described proof of that kind is required to name the way in, keeping the
      field the ticket-facing definition already used for that purpose,
    And the older name for that kind is absent from the permitted kinds, with no
      translation layer that accepts it as a synonym,
    And the how-heavy-and-where axis comes through untouched — its own values, its
      own meaning, and in particular not overwritten with a second copy of the
      permitted kinds of proof, so that saying how heavy a test is and where it
      runs remains sayable and goes on meaning what it meant before,
    And the kinds that one of the TWO DEFINITIONS IN SCOPE permits and the other
      does not are each either carried into the single definition or dropped from
      it — none is left permitted on one side only — where "dropped" reaches only
      the kinds of those two definitions and never a value of the third axis,
    And no value is dropped while records already held in the store still carry
      it: those records are found and moved onto a surviving value in the same
      change that narrows the permitted kinds, so that the narrowing breaks
      nothing and defers no failure onto whoever next touches such a record.
depends_on:
