title: "Complexity mapping rejects unknown estimated_complexity values with a warning"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given an AC has estimated_complexity set to an unexpected value
    (e.g., "XXL", "micro", or null),
  When the AC prioritizer attempts to map it to the unified priority scale,
  Then the AC entry is included in the output with priority "low"
    (conservative default),
  And a warning is emitted to stderr naming the AC ID and the unrecognized
    complexity value,
  And the prioritizer does NOT exit with an error (the unknown value is
    non-fatal).
