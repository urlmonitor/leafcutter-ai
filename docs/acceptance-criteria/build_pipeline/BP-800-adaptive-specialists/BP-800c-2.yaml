assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Validation must run at build time before agent generation (fail-fast on invalid knowledge files)"
  - "Must validate metadata header fields: technology_id (non-empty str), version (positive int), category (enum: language|framework|database)"
  - "Must validate section headings are present (case-insensitive heading match)"
  - "Validation error messages must be actionable — name the file, the missing field/section, and the expected format"
  - "Must not validate section content (only structure) — content quality is a human concern"
