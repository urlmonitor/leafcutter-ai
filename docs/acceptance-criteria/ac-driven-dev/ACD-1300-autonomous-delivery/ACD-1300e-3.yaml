delivers_to:
  - agent: architecture-diagram-author
    contract: >-
      Executor decision for ACD-1300e-5 (and the guide, ACD-1300e-4): every pause-record operation
      (the write, its read-back, the look-up, the resume read, the clear, its read-back and the
      leftover-record scan) is one plain command dispatched to shell-runner (agentType
      'shell-runner', ADR-070), whose reply is a result {command, exit_status, stdout, stderr} or a
      decline {declined: true, agent: 'shell-runner', reason} with no exit_status key.
      worktree-agent, status-checker and command-step-runner perform none of them.
  - agent: python-coder
    contract: >-
      For ACD-1300e-3-i, -iv, -v and -vi: the one pause-store step path in
      templates/workflows-js/plan-feature.js. Each step is a fixed shell-runner dispatch whose
      reply shellStepReply() classifies as a result (its exit_status and relayed stdout and stderr,
      with pause_store.py's JSON parsed from the stdout string), a decline (agent and reason;
      nothing ran), or a reply that is neither (kept as received, quoted up to 2 KB). The reads
      keep ACD-2100c-3-ii's bounded re-attempt; the write and the clear are sent once.
