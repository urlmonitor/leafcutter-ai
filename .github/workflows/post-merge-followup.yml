# Post-merge follow-up -- the human-facing notice (TQ-600a-13-iii).
#
# Runs when a post-merge workflow completes, from the DEFAULT branch's copy of this
# file (that is how workflow_run works), and applies the run's verdict to the single
# open `post-merge-red` issue. The notice is for people and is never the gate: the
# per-PR hold reads the run history (TQ-600a-13-vi), and this job's failure cannot
# touch the suite run's conclusion, which IS the verdict.
#
# The trigger lists all three post-merge workflows. The `notice` job is for the
# correctness suite only; its `if` makes that explicit. A timing-suite run is handled by
# the `timing-notice` job (TQ-600a-13-xii, its own `post-merge-timing` notice), and a
# fix-proof run (TQ-600a-13-xvi) completes this workflow without writing a
# `post-merge-red` notice; its own job is added to this file by that record.
#
# Idempotent: re-running the job on the same triggering run writes nothing further,
# which is the recovery path when the job failed. All logic lives in
# scripts/ci/post_merge_notice.py; no run: step carries a dollar-brace expression
# (context arrives through env:).

name: Post-merge follow-up

"on":
  workflow_run:
    workflows: ["Post-merge suite", "Post-merge timing suite", "Post-merge fix proof"]
    types: [completed]

permissions: {}

jobs:
  notice:
    if: github.event.workflow_run.name == 'Post-merge suite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
      contents: read
    # One notice job at a time: two applies must never interleave. A pending job
    # displaced by a newer one loses nothing, the newer run applies a newer verdict
    # and the description is the current state, not a log.
    concurrency:
      group: post-merge-followup-notice
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the default branch: the suspect-commit list is a graph walk.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A missing artifact must not fail the job here: the apply step treats an absent
      # verdict file as did_not_complete, taken from the triggering run's own record.
      # `steps.download.outcome` is `failure` for a failed download even though continue-on-error
      # keeps the job going; the apply step uses it to tell "no artifact" from "download failed".
      - name: Download the verdict
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: post-merge-verdict
          path: verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Which settled correctness run came just before this one (TQ-600a-13-xiii): a red followed by a
      # green at the same commit is named on the `post-merge-flaky` notice as a timing-lane candidate.
      # No previous run or an unreadable history leaves the output empty: no candidate is named.
      - name: Find the previous settled correctness run
        id: previous
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          previous="$(python scripts/ci/post_merge_previous_run.py --lane correctness --api-url "$API_URL" --repo "$REPO" --run-id "$RUN_ID")"
          echo "run_id=$previous" >> "$GITHUB_OUTPUT"

      # A missing or expired previous artifact is not a failure: it means no candidate is named.
      - name: Download the previous verdict
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: post-merge-verdict
          path: previous-verdict
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Apply the verdict to the notice
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: python scripts/ci/post_merge_notice.py apply --api-url "$API_URL" --repo "$REPO" --repo-dir . --run-id "$RUN_ID" --verdict-file verdict/post-merge-verdict.json --previous-verdict-file previous-verdict/post-merge-verdict.json --download-outcome "$DOWNLOAD_OUTCOME"

  # The timing lane's notice (TQ-600a-13-xii): the same machinery under `--lane timing`, which reads
  # ONLY post-merge-timing.yml's runs and lists and writes ONLY issues labelled `post-merge-timing`.
  # It never touches the `post-merge-red` notice, and the hold never reads it.
  timing-notice:
    if: github.event.workflow_run.name == 'Post-merge timing suite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
      contents: read
    # Its own group, so a timing apply never queues behind (or ahead of) a correctness one.
    concurrency:
      group: post-merge-followup-timing-notice
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the default branch: a lane entrant's commit is a `git log` over a range.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download the verdict
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: post-merge-verdict
          path: verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Which settled timing run came just before this one. No previous run (the first one) or an
      # unreadable history leaves the output empty: the notice then names no lane entrant.
      - name: Find the previous settled timing run
        id: previous
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          previous="$(python scripts/ci/post_merge_previous_run.py --api-url "$API_URL" --repo "$REPO" --run-id "$RUN_ID")"
          echo "run_id=$previous" >> "$GITHUB_OUTPUT"

      # A missing or expired previous artifact is not a failure: it means no entrants are named.
      - name: Download the previous verdict
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: post-merge-verdict
          path: previous-verdict
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Apply the verdict to the timing notice
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: python scripts/ci/post_merge_notice.py apply --lane timing --api-url "$API_URL" --repo "$REPO" --repo-dir . --run-id "$RUN_ID" --verdict-file verdict/post-merge-verdict.json --previous-verdict-file previous-verdict/post-merge-verdict.json --download-outcome "$DOWNLOAD_OUTCOME"
