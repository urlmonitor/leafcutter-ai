notes: |
  Whether transient failures (rate limit, server error, timeout) are retried before
  failing closed is not specified by the design and not decided here. Failing closed on
  the first transient error is the safe reading; a retry policy may be added without
  contradicting this record so long as the final outcome on persistent failure is a fail.
