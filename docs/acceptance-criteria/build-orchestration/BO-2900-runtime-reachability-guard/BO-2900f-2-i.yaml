notes: |
  Split out of BO-2900f-2 on 2026-08-13 (expert review). In its parent the halt
  case sat inside a Then block whose Given described a COMPLETED run, next to the
  clause "no requested gate is left with zero entries" — a direct contradiction
  that made neither clause testable.

  WHY THE CARVE-OUT NEEDS ITS OWN NEGATIVE SCENARIO. Without the second scenario
  the carve-out is an unbounded excuse: any missing entry can be attributed to a
  halt nobody has to evidence, which reproduces the silence BO-2900f exists to
  end. Pairing "no entry + halt recorded = legitimate" with "no entry + no halt
  record = defect" is what makes the parent's count invariant enforceable rather
  than advisory.

  BOUNDARY vs the parent: BO-2900f-2 owns the completed run and asserts a COUNT.
  This L3 owns the aborted run and asserts an EXPLANATION. An implementation that
  satisfies one and not the other has not landed the guarantee.

  2026-08-14 (IT PO enrichment). Two bounds added that the criteria imply but
  leave open, both aimed at the same failure: a carve-out that grows into a
  general excuse.

  - POSITIONAL BOUND. The criteria pair "no entry + halt recorded" against "no
    entry + no halt record", which leaves "no entry at gate B + halt recorded at
    gate D" undecided. An implementer reaching for the carve-out will land there,
    because it is the reading that makes their gap go away. The enrichment fixes
    it: a halt record licenses gaps at or after the gate it names, in the
    requested order, and the validator compares the halt position against the
    first gap.
  - ABNORMAL-TERMINATION BOUND. A halt record emitted only where the loop breaks
    cleanly misses the crash path, which is the path that strands runs in
    practice. The result is not a missing feature but a stream of false defect
    reports, and the natural response to those is to widen the carve-out until
    they stop — arriving back at the unbounded excuse from the other direction.
    The halt record is therefore required on every termination path.

  Both bounds are surface-agnostic and survive whichever record surface the user
  chooses.
