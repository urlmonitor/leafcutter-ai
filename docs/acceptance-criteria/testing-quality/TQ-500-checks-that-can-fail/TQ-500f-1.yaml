id: TQ-500f-1
components:
  - testing_quality
  - ac_store
  - build_orchestration
title: "\"Discrimination\" is a kind of test a requirement can ask for, and the work generated from it accepts it"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a requirement whose test plan has one entry
      name: test_retry_gate_runs_when_both_conditions_due
      angle: discrimination
    and a second requirement whose test plan has one entry with
      angle: discriminating   (a misspelling),
  When the requirement store's validator checks both requirements,
    And work is generated from the first requirement,
  Then the first requirement is accepted and the second is rejected with a
    message naming the entry, the field "angle", and the permitted values,
    which include "discrimination",
    And the generated work's test requirements carry that entry with
      angle: discrimination, and those test requirements conform to the
      schema that governs generated test requirements,
    And the test writer's taught set of test kinds lists "discrimination"
      beside the seven existing kinds, with its distinguishing rule: the test
      goes red under at least one named plausible wrong version of the code,
      not only when the code is absent,
    And the existing lockstep check between the permitted kinds and the
      taught set passes with the eighth kind present.
depends_on:
  - TQ-500f
doc_links:
  - path: config/ac_store_schema.json
    relationship: describes
    status: exists
    relevance: "test_spec[].angle enum — the requirement-side list of permitted kinds."
  - path: config/test_requirements.schema.json
    relationship: describes
    status: exists
    relevance: "tests[].angle enum — the generated-work-side list. additionalProperties is false, so a value legal on the requirement side and absent here yields generated work that violates its own schema."
  - path: templates/agents/test-writer.md
    relationship: describes
    status: exists
    relevance: "The TAUGHT-TEST-ANGLES start/end block — the taught set that must gain the eighth kind."
  - path: docs/testing/test-angles.md
    relationship: relates-to
    status: exists
  - path: docs/analysis/2026-09-25-test-writers-prove-failure-not-discrimination.md
    relationship: describes
    status: exists
    relevance: "Remedy item 1."
assigned_agent: python-coder
estimated_complexity: S
delivers_to:
  - agent: python-coder
    ac_id: TQ-500f-2
    contract: "A permitted kind 'discrimination' on both the requirement side and the generated-work side, so a test entry that names wrong versions to catch can also declare itself a discrimination test."
expects_from: null
it_requirements:
  - 'BUILD MODE (user decision at the IT-PO gate): NOT fast-lane, because the fast lane never
    changes templates. Build it as ONE manually orchestrated change: test-writer, then python-coder
    (both schema enums, the generator angle mirror, the widened lockstep test in TQ-500f-1-i),
    then llm-expert (the discrimination entry in the TAUGHT-TEST-ANGLES block of templates/agents/test-writer.md).
    python-coder is the primary assigned agent; llm-expert owns the template block. The change
    is committed only once all three lists agree and the lockstep test is green.'
  - '''discrimination'' must be added in ONE change to all three kind lists: config/ac_store_schema.json
    test_spec[].angle, config/test_requirements.schema.json tests[].angle, and the TAUGHT-TEST-ANGLES
    block in templates/agents/test-writer.md (source template only, never a deployed copy).
    The existing lockstep test goes red the moment one list moves alone, so the three edits
    cannot ship separately.'
  - 'Every other consumer of the kind vocabulary must accept the new value without a warning:
    the generator''s own mirror of the angle set (pinned to the schema by BO-2900g-3''s cross-source
    test) and done_proof''s permitted-angle reader. A value the schema accepts but the generator
    or done_proof warns about is a defect.'
  - 'The taught-set entry must state the criteria''s distinguishing rule (red under at least
    one named plausible wrong version, not only when the code is absent) and mark the angle
    as conditional: it fires for bug-fix or gate ACs, or when must_catch is present. It never
    takes one of the four slots by default and may share a test with criterion (user decision
    Q2).'
  - An unknown angle must be rejected by the validator that actually gates commits (validate_ac_schema.py,
    the check-ac-schema hook), not only by the JSON schema file. The message names the entry,
    the field 'angle' and the full permitted list.
  - 'Additive enum change only: every existing AC and ticket using the seven current kinds validates
    and generates exactly as before.'
  - Must not introduce any automatic classification of ACs as bug-fix or gate from criteria
    text (TQ-500 non-goal).
test_spec:
  - name: test_validator_cli_accepts_discrimination_and_rejects_misspelled_angle
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: scripts/ac_store/validate_ac_schema.py CLI (the check-ac-schema commit
      gate)
    description: 'The validator CLI exits 0 for an on-disk AC whose test_spec entry has angle:
      discrimination, and exits non-zero for angle: discriminating with a message naming the
      entry, ''angle'' and a permitted list that includes discrimination (must_block).'
  - name: test_taught_set_has_eight_kinds_including_discrimination_rule
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: The machine-extracted TAUGHT-TEST-ANGLES YAML block in templates/agents/test-writer.md
      parses to eight keys, one of them discrimination with a non-empty distinguishing rule.
      The block is parsed the way the lockstep test parses it, not searched as text.
  - name: test_generated_ticket_carries_discrimination_angle_and_conforms
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: 'A ticket generated by generate_ticket_from_ac.py from a real on-disk AC with
      angle: discrimination carries that angle on its Test Requirements entry, and the emitted
      block validates against config/test_requirements.schema.json.'
  - name: test_generator_and_done_proof_accept_discrimination_without_warning
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: real_artifact
    description: The generator emits no unrecognised-angle warning for discrimination, and done_proof's
      permitted-angle reader, reading the real on-disk schema, reports no unrecognised kind
      for a test tagged with angle discrimination.
test_rationale: Every Then clause is observable through the validator's verdict, the generator's
  real output checked against its schema, or the machine-extracted taught set. None needs
  a text search. The validator CLI is the production entry point (commit gate), so it carries
  the reachability floor.
