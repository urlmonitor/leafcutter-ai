notes: >-
  The silent fallback to a local copy is the mechanism by which a stale workspace gets
  handed over without anybody choosing it. Refusing is the only option that keeps the
  BO-4100a promise intact: there is no third state in which the shared tip is unknown
  AND the workspace is still guaranteed current. Distinct from BO-1700b (a workspace
  whose CHECKS cannot run fails closed) -- that is about gates, this is about the
  starting point, and neither implies the other.
