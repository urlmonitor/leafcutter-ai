notes: |
  Authored by /quick-fix. Root cause: The function is named get_staged_new_files, its docstring reads 'Get all staged new files', and the module docstring states the purpose three times as add-only ('block commits that add new files to the root directory'; 'Block commits that add unauthorized new files to the root directory'; 'files ... permitted to reside in the root directory'). But line 51 matches three git name-status codes rather than one: `if status.startswith("A") or status.startswith("M") or status.startswith("R"):`, under the inline comment '# Only check formally added (A), or modified (M) files just in case' — showing M was added defensively, not deliberately. Matching M means an ordinary edit to a file already tracked at the root is treated as an addition. Expected behaviour: flag a root file only when the change actually introduces it to the root, i.e. status A (and R only where the rename destination is a root path not previously present); a modification to an existing root file must not be blocked. Note R is arguably defensible and should be considered on its own merits rather than removed reflexively; M is the straightforwardly wrong one. The red baseline must be behavioural, not a grep: stage a modification to an existing tracked root file absent from allowed_files and assert the hook exits 0, AND keep a control asserting it still exits non-zero when a genuinely NEW unauthorised root file is added, so the fix cannot pass by disabling the gate. Out of scope, do not bundle: adding requirements-dev.txt to root_files.allowed_files (three config copies would need mirroring, and the A-only fix makes it unnecessary since the change in question is an M) — record it as a follow-up..

  PLACEMENT. Filed as an L3 constraint on GE-120e-1 rather than a new L2 because GE-120e is
  at the five-child cap and this is an edge case of the same rule: GE-120e-1 says a check
  reaches its verdict from what the author actually changed, and this pins the boundary
  where the path is in the author's change set but the property the check objects to — the
  file living at the root — is not something the change introduced. GE-120e's own note
  calls itself the FALSE-POSITIVE axis, which is exactly what this is: a red that is not
  about anything the author did.
