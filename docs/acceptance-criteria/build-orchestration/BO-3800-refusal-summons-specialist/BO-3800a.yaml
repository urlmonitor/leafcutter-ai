notes: |
  WHAT THIS RECORD OWNS: the fate of the change. Not who does the tidying (BO-3800b),
  not what they are told (BO-3800c), not what happens when it still fails (BO-3800d).

  THE TWO FAILURES IT EXCLUDES, BOTH OF WHICH LOOK LIKE SUCCESS FROM A DISTANCE. The
  change discarded or rolled back so the restructuring starts from a clean file and the
  author's work is silently gone; and the change forced through unchanged once someone
  has "dealt with" the refusal. Either satisfies a naive reading of "the handoff
  happened" while destroying the reason for having one.

  THE RETRY IS PART OF THIS PROMISE, NOT A SEPARATE ONE. Holding a change that is never
  re-offered is the same outcome as losing it, from the point of view of the person
  waiting for it to land. Decomposition must keep the two halves in one record so an
  implementation cannot satisfy the hold and quietly drop the retry.

  THE POPULATION THIS PROMISE COVERS: WORK BEING DRIVEN, AND ONLY THAT. DECIDED, NOT
  DEFAULTED. Everything above holds when the delivery attempt is part of a drive. A refusal
  outside a drive — a hand-run `git commit` at a terminal — is simply refused, exactly as it
  is today: the refusing standard's own message is the whole of what the author gets, the
  change is not held on anyone's behalf and no specialist is summoned. That is unchanged
  behaviour, not a regression, and not a gap left for a later reader to fill in by default.

  WHY THE BOUNDARY IS WHERE IT IS. Holding a change and re-offering it both need a party
  that outlives the refusal and can ask for another. Inside a drive that party exists — the
  depth-0 driver that owns the phase loop. Outside one there is no such party at all. The
  delivery step cannot be it, because ADR-019 records that "an agent running at depth 1
  cannot itself invoke the Agent tool. Any call beyond depth 1 is silently dropped — no
  error is raised, the tool call simply does not execute", and the delivery step IS a
  depth-1 agent. The alternative — that a hand-run commit must also summon a specialist —
  was considered and REJECTED, because no design for it exists under that constraint;
  specifying it would be promising something the platform cannot express.

  ADR-019 EXISTS BECAUSE THE DEPTH-1 CAP ALREADY BIT THIS REPO ONCE (verified in that ADR's
  Context section before being repeated here). /build-feature dispatched ticket-supervisor
  via the Agent tool, putting it at depth 1; it then tried to spawn its phase agents, whose
  calls sat at depth 2 and were silently dropped. No phase template ever applied on any run
  — each ticket appeared to progress while no implementation work happened on disk, no tests
  ran, and the TDD red/green cycle never fired. A specification that ignores the cap does not
  fail loudly; it ships a capability that quietly never runs, which is the same silent-drop
  shape this whole tree exists to prevent, one layer down.

  THIS WAS A PRODUCT DECISION TAKEN ON 2026-09-14, NOT AN IMPLEMENTATION CONVENIENCE. The
  child BO-3800a-1 was authored against the wider wording and deliberately raised the
  narrowing upward as an open question rather than settling it. The product owner settled it
  in this record; see the amended_by entry. The title is unchanged and remains true — it
  promises what happens to a change that is held, and never claimed a population.

  HOW IT IS PROVABLE. By observing a run: the change is still present and unaltered after
  the refusal, delivery is attempted again after the restructuring, and no later step ran
  in between. Per CLAUDE.md, a test that reads a workflow file for the presence of a retry
  branch is not coverage — it stays green on a branch nothing reaches.
