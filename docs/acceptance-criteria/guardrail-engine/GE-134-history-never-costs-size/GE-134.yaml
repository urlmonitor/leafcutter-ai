id: GE-134
title: "Keeping an honest record of why a file changed never costs that file its room"
component: guardrail-engine
components:
  - commit_guardian
level: L0
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  The written record of why a file was changed never counts against how big that
  file is allowed to be.

  Every file in this project may only grow so large, and that limit exists so that a
  person can still read and work in it. A file's record of its own decisions is
  different: it is there to be looked up when someone needs to know why, not read
  every time someone works in the file. When that record counts against the file's
  size, the people who keep it honest are punished for doing so: adding one more line
  of history can push a file over its limit or block a change to a file that is
  already large, and the easy way out is to stop writing history down.

  After this goal, a file's decision history costs it nothing, so writing down why a
  change was made never stands in the way of making the change. The size a file is
  judged by is the amount of working code it holds, and the published rule says
  plainly what is left out.
