notes: |
  BO-3600a's notes make this explicit: the check decides that two records disagree
  and must NOT decide which is right. This record is that instruction expressed as
  behaviour, because an instruction in a note is not enforceable and a silently
  picked side is exactly the failure the whole goal exists to prevent — a record
  changed by something that did not understand it.

  WORDING NOTE (2026-08-26). Two incidental phrases were reworded to stop the
  declares_side_effect derivation (BO-2900g-2) reading this record as asserting a
  durable effect. "where each claim is written" became "where each claim can be
  found", and a Given clause's "was written much more recently" became "carries a
  much more recent timestamp". Neither changed the meaning: this AC's whole point
  is that NOTHING is mutated — its second scenario requires both records to be
  byte-for-byte as they were before the run — so declares_side_effect is correctly
  absent, i.e. false.

  The derivation was matching on `\bis written\b` and `\bare written\b` inside
  descriptive prose about where an existing claim lives. Worth knowing, because it
  is not a wording quirk of this record: the deriver slices from the FIRST "Then"
  to the END of the criteria, so in a multi-scenario Gherkin block every LATER
  "Given" clause is scanned too. Its own docstring states that a durable-effect
  phrase "appearing only in a Given clause does not count" — true for a
  single-scenario record, false for every multi-scenario one. That is why the
  third scenario's Given tripped it. Reported separately rather than worked around
  silently; the reword here is the honest fix for THIS record, not a fix for the
  deriver.

  The second scenario is the one that makes this checkable without ambiguity: the
  files are compared before and after. The fourth stops the refusal to adjudicate
  becoming a refusal to be useful, which is how a detector ends up ignored.

  The third scenario closes the plausible-looking shortcut. Preferring the newer
  record is an adjudication rule wearing a heuristic's clothes, and in the material
  behind this goal it would have been wrong: KI-BO-028's own corrections include a
  register entry that was stale relative to a requirement record, and requirement
  records that were stale relative to entries.
