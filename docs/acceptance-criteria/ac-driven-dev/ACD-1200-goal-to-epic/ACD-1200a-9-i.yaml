    relationship: modifies
    status: exists
    relevance: "CLI facade only since the 2026-09-14 decomposition; it re-exports assemble_epic_folder but no longer defines it. The collision branch this AC specifies lives in the module below."
  - path: scripts/ac_store/epic_assembly.py
    relationship: modifies
    status: exists
    relevance: "Owns assemble_epic_folder, including the basename-collision branch that overwrites in place and emits the WARNING this AC requires."
