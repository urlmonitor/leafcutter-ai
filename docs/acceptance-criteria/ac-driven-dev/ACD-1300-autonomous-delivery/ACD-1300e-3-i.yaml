criteria: |
  Given five separate planning runs, each with no person attached, each reaching the same
    decision point with drafted criteria on disk, and the project's pause store writable,
  When each run records that it is waiting,
  Then all five end reported as waiting with a record present on disk for each run id,
  And none of the five ends as "pause persist failed",
  And the same holds when the five runs are started from a worktree of the project
    rather than from the project root,
  And when the pause store is not writable, the run reports the pause as failed, the
    report names the store write as the cause (not a refusal by the step performing it),
    and the drafted criteria are still present on disk unchanged.
