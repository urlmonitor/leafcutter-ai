id: GE-127e-1
title: "The refusal accounts for what is inside the file it refused, and names a division of that file in terms of those same parts"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked file of a kind the size standard covers is refused for its
    length,
  When the author reads the refusal,
  Then the refusal accounts for that file's measured length as a set of named
    constituent parts of that same file, each part named as it appears in the
    file itself and each stated with the portion of the measured length it
    accounts for,
  And every part the refusal names can be located in the refused file's own
    content,
  And the named parts together account for at least half of the measured length
    the refusal quotes for that file, so the author is not handed a list of
    fragments that explains nothing about where the size went,
  And the refusal names at least one division of that file, stated as which of
    those named parts fall on each side of it, together with the length each
    side would stand at,
  And the two stated side lengths reconcile with the measured length the refusal
    quotes for the whole file,
  And given instead a refused file whose measured length is accounted for by a
    single named part, so that no division between parts exists,
  When the author reads the refusal,
  Then the refusal states that no division of that file was found and names the
    single part accounting for it, rather than naming a division that does not
    follow from the file's own parts.
depends_on:
  - GE-127e
