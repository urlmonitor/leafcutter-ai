assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "Assignment follows ACS-500g-1: this is a section of templates/agents/pattern-steward.md (a scan/approve phase boundary in the agent template), so llm-expert owns it. workflow-architect is not a ticket-phase agent and cannot be dispatched."
  - "The steward's tools: frontmatter must make the read-only phase mechanically impossible to violate — the scan phase runs with Read/Grep/Glob only. Write and Edit are used solely in the post-approval promotion phase. If Edit or Write appear in tools:, the template MUST also declare requires_verification: true (registry_validator.py rule A) or build.py's install_shims step fails."
  - "Byte-for-byte unchanged must be provable, not asserted: the scan phase ends with `git status --porcelain docs/acceptance-criteria/` returning empty, and the agent reports that check. A scan that cannot show a clean worktree has failed this AC."
  - "The candidate report is an artifact, not chat output. Write it outside the AC store (e.g. reports/pattern-candidates/<timestamp>.md) so the report itself never trips check-ac-schema or the folder-density guard, and so approval can be reviewed as a diff-free document."
  - "On approval, each converted source AC must satisfy the existing commit-time gates in one pass: check_ac_schema.validate_pattern_bindings_completeness (one pattern_bindings key per declared slot) and check_ac_pattern_refs (the referenced pattern id must exist and pass _has_parameterized_slots). Convert-then-commit, never partially convert."
  - "Partial matches are left unconverted and reported for a separate deviation decision, per the deviation rule already documented in docs/reference/ac-schema.md § 'Pattern deviations — separate files, not inline overrides'. Do not restate that rule in the template; point at the doc."
delivers_to:
  agent: llm-expert
  contract: "The scan/approve phase boundary in templates/agents/pattern-steward.md: a read-only scan phase producing a candidate report under reports/pattern-candidates/, and a separate post-approval promotion phase that writes the pattern AC and converts full-match source ACs."
expects_from:
  ac_id: ACS-500g-1
  contract: "Pattern candidates emitted by the store-wide scan, each naming its source AC ids, the shared behavior body, the recurrence count, and the proposed slots."
