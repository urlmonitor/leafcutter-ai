assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - >-
    THREE VALUES PER CELL, NOT TWO. The template must define the outcome
    vocabulary as objected / did_not_object / not_exposed. A two-valued field
    forces "not exposed" to be written as "did not object", which in the recorded
    incident would have marked three sound tests inert and produced exactly the
    flood of false findings whose only natural remedy is to switch the check off.
  - >-
    THE PAIR IS THE UNIT OF RECORD. Each entry carries the test's identity, the
    alteration's identity, and one outcome value. A record shaped as one value
    per test loses the column axis and makes TQ-500c-3's reading impossible to
    build — the collapse survives one level of aggregation, which is why the
    granularity is stated here rather than left to the reader.
  - >-
    NO GROUP-LEVEL VERDICT MAY BE EMITTED ALONGSIDE THE PAIRS. The second Then
    clause is a prohibition on the record, not a preference: if a combined
    verdict exists, some reader will prefer it, and TQ-500c-2's contract depends
    on there being nothing to fall back to. Do not add a convenience summary, a
    ratio, or a count of tests that objected.
  - >-
    FOLLOW THE CONVENTION THE WRITER ALREADY KEEPS. templates/agents/test-writer.md's
    existing red_baseline block is already one entry per test carrying that test's
    actual error text. Shape the per-pair outcomes on it rather than introducing a
    second habit, and require the test's identity to be its real test-function
    name, not a paraphrase.
  - >-
    This record rides the same completion_manifest entry as TQ-500a-1's answer,
    nested inside the substitute shape. It is not a sibling key and not a second
    block.
delivers_to:
  - agent: python-coder
    ac_id: TQ-500c-2
    contract: >-
      Within the substitute answer: one outcome per test per alteration, each
      carrying the test's identity, the alteration's identity, and one of three
      values — objected, did not object, not exposed. No group-level verdict is
      emitted alongside them, so the reader has nothing to prefer over the pairs.
expects_from:
  ac_id: TQ-500a-3
  contract: >-
    The named alterations these outcomes are recorded against. This AC specifies the
    granularity of the outcomes, not the choice of alteration.
test_required: false
test_rationale: |
  Genuinely test-free at this AC's boundary, on the BP-1100g-5 precedent. The
  deliverable is the record shape defined in templates/agents/test-writer.md and
  templates/skills/signoff/SKILL.md; a test asserting the shape is described in a
  template is source-presence evidence and passes on an implementation that
  records nothing. The three-valued cell and the absence of a group verdict are
  asserted over emitted records by TQ-500c-2, TQ-500c-3 and TQ-500c-2-i, which
  carry the test contract — TQ-500c-3's fourth descriptor in particular fails
  outright if the record collapses not_exposed into did_not_object.
