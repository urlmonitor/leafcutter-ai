notes: |
  THE SUBJECT IS EXISTENCE, NOT HONESTY AND NOT CONSEQUENCE. This record is satisfied
  only by something wide actually running, and is NOT satisfied by a truthful
  description of a narrow check (BO-4200b) nor by what happens when the wide check
  fails (BO-4200c). Those are separate records because they fail separately: the
  current route would satisfy b and c with its narrow check intact and still deliver
  the broken result that prompted all three.

  WHAT MUST NOT BE READ INTO IT. It does not say the wide check is the same check, run
  the same way, as the narrow one the route already has; it does not say it runs at
  every attempt (BO-4200d fences that deliberately); and it does not name a tool, a
  command or a set of directories. The origin entry's own preferred shape — one run
  after the producing loop settles and before the reading phase — is a fix direction,
  not this criterion.

  THE REPOSITORY ALREADY HOLDS THIS RULE FOR THE OTHER ROUTE, which is the strongest
  argument that it is not a new demand. CLAUDE.md's "Full test suite + ruff at
  epic-finalize (before merge)" exists because per-item sign-offs run only that item's
  own checks and cross-cutting breakage slips through. The origin entry's words: "That
  is this defect exactly, one pipeline over. The fast lane was built after that
  instruction and did not inherit it."

  documentation_triggers: sequence-diagram. The run's phase order is what changes, and
  where the wide check sits relative to the producing loop, the reading phase and the
  hand-off is the whole of the operator-visible difference. No how-to: the operator
  types the same thing and does nothing new.
