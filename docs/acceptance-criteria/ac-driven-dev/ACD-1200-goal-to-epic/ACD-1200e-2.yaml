title: "/build-ac with an L0 or L1 AC automatically switches to epic-generation mode"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given AC ACD-050 exists in the store with level: L0
    and covered_by: [ACD-050a, ACD-050b] (a composite goal with children),
  When /build-ac is invoked with --ac ACD-050,
  Then the system detects that ACD-050 is a goal-level AC (level L0 or L1)
  And it switches to epic-generation mode:
    tree traversal, readiness gate, ticket generation, dependency wiring,
    target_epic stamping, and epic folder assembly
  And it does NOT follow the single-ticket path
  And the user sees: "ACD-050 is a goal — generating epic from all leaf ACs beneath it."

  Given AC ACD-050a exists in the store with level: L1
    and covered_by: [ACD-050a-1, ACD-050a-2] (a composite feature with children),
  When /build-ac is invoked with --ac ACD-050a,
  Then the system also switches to epic-generation mode
  And scopes the epic to only the leaves beneath ACD-050a.
