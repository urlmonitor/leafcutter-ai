criteria: |
  Given the registry-completeness check has found two promised-but-undeployed
    scripts: check_test_fixture_bloat.py (promised by a hook registry entry) and
    a script promised by an agent template reference
  When the check fails the merge gate
  Then the failure report lists every promised-but-undeployed script (not only
    the first one found)
  And for each listed script the report states its source path under scripts/
  And for each listed script the report states WHERE it was promised — for a
    registry entry, the hook id and the registry file; for a template
    reference, the referencing template file path
  And for each listed script the report states the suggested action: promote the
    script to its expected templates/scripts/ path (or remove the promise), and
    names that expected templates/scripts/ path
