id: GE-130f-1-i
title: A refusal counts only when the change is not carried out -- a guard that announces a block while
  the edit goes through has refused nothing
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a file protection whose response to its declared known-bad edit announces a refusal and
    names the file, but ends in the way a Claude Code session treats as allowing the call,
  When that edit is put through the entry point a session invokes the protection by,
  Then the edit is found to have been carried out, the protection's liveness record says the
    rejection was not observed, and the protection is named as one that announced a refusal
    the session did not act on,
  And given the same protection is changed only so that it ends in the way the session treats
    as a refusal, with its message word for word unchanged,
  When the same edit is put through again,
  Then the edit is found not carried out and the record says the rejection was observed,
  And in neither run is the record decided from the protection's message or from how it ended
    alone, only from whether the edit was carried out.
depends_on:
- GE-130f-1
