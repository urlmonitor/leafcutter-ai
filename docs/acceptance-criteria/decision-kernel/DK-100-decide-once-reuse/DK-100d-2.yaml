assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - '`python -m kernel decisions publish` is the only writer of docs/decisions/ (ADR-060): it runs
    only when a person invokes it, validates everything before writing, writes atomically, and exits
    0 ok, 3 refused (problems listed, nothing written), 5 environment error.'
  - Filter values are checked against the existing vocabularies only (docs/components.json, docs/roadmap.json,
    the ac_store_schema enums, rule-file globs; ADR-061); no new vocabulary is introduced by a record.
  - One validation run lists every problem; nothing is written while any problem stands.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
