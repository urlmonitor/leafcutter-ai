id: BO-4400g-2-iii
title: "A landed workspace that is in use, or gains work before its turn, is kept"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
declares_side_effect: true
criteria: |
  Given a workspace "busy-1" whose commits all reached the main line, in which a program
    started from the workspace is still running and holding files open,
  When the landed-work pass is run,
  Then "busy-1" is identical before and after and the program is still running,
  And the answer lists "busy-1" as kept with the reason that it is in use.

  Given the landed-work pass has assessed workspace "idle-1" as landed and holding nothing
    unsent,
  And before the pass clears "idle-1", one new uncommitted file is written into it,
  When the pass reaches "idle-1",
  Then "idle-1" is not cleared and the new file is byte-identical to what was written,
  And the answer lists "idle-1" as kept for holding unsent work, naming that file by path,
  And the pass goes on to the remaining workspaces.
depends_on: [BO-4400g-2, BO-4300e-2-ii]
