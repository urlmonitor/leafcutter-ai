  - build_orchestration
title: "A sequence diagram shows where the link gets recorded and which delivery paths miss that point"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a reader who knows a requirement's coverage link is sometimes not recorded and
    wants to know at which point in a delivery it should have been,
  When they read the sequence diagram,
  Then it shows the ticket route from the completion of work through to the link being
    written, with the link-recording step as an identified participant and the condition
    that triggers it shown on the interaction that reaches it,
  And it shows at least one delivery path that completes without that interaction ever
    occurring, so the reader can see the omission rather than infer it from the absence
    of an arrow,
  And it distinguishes a path that reaches the step from a path that is exempt from it,
    so the two are not read as the same outcome,
  And the participants and the ordering it shows match the delivery paths the
    enumeration classifies, so a reader who runs the enumeration and a reader who reads
    the diagram reach the same picture,
  And it does not depict the search behaviour of the link-recording step itself, which
    is not what this L1 is about.
