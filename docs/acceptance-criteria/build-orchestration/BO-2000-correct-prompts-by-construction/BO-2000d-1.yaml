title: "A package-surface AC missing required spec fields fails validation"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an AC assigned to python-coder in the build_pipeline or build-orchestration
    component (a package-surface AC),
    and its it_requirements is missing one or more of the config-schema fragment,
    the resolved reference-file path, the N-location rule, the required-skills list,
    or the post-write commands,
    and it does not carry the explicit "reference file pending" marker (ACD-2500d-2-i),
  When the AC is validated,
  Then validation fails,
  And the failure names each required spec field that is missing.

  And given a package-surface AC that carries the "reference file pending" marker because
    the file-aware step (ACD-2500d-2) has not yet run,
  When the AC is validated,
  Then validation does not fail it for the missing reference-file path,
  And it still fails, naming each one, for any of the other four fields that is missing,
  And once the file-aware step has named the reference file and cleared the marker, the
    five-field rule above applies unchanged.
