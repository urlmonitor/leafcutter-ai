criteria: |
  Given a user invokes /feedback-report,
  When the feedback-analyst agent is dispatched,
  Then it reads feedback.jsonl via the analysis scripts (aggregate.py,
    list_tags.py, trend_report.py),
  And it returns a structured Markdown report to the user containing
    an executive summary, category breakdown, and prioritized action items,
  And it does NOT modify feedback.jsonl or any other file,
  And it does NOT automatically create tickets (it presents
    recommendations for the user to act on).
