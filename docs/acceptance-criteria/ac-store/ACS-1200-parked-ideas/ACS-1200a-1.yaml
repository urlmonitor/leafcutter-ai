id: ACS-1200a-1
components:
  - ac_store
  - commit_guardian
title: "A parked tree is marked by a field its author sets on purpose, never by an empty child list"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200a.yaml
criteria: |
  Given an AC YAML record KM-200.yaml at readiness: draft whose covered_by is an
    empty list, and which carries the two fields parked: true and
    parked_reason: "captured as an outline; not decomposed yet",
  When the AC schema validator is executed as a process against that file,
  Then it exits 0 and reports the record as valid,
  And the same record with parked: true and parked_reason absent exits non-zero
    with a message naming KM-200, the field parked_reason, and the rule that a
    parked record must state its reason,
  And the same record with parked: true and parked_reason set to the empty
    string "" exits non-zero with that same message,
  And a record carrying neither field validates exactly as it did before this
    change, so both fields are optional for every record that is not parked,
  And both fields are read from the AC record itself: no separate registry,
    ignore-list, allow-list, or configuration file is consulted to learn that
    KM-200 is parked, so a reader of the record can see the state and the stated
    reason without opening a second file,
  And a record whose covered_by is empty and which carries no parked field is
    reported by the validator as NOT parked, so the absence of children is never
    by itself the signal.
