id: ACS-500g-1
components:
  - ac_store
readiness: approved
priority: high
title: "A pattern-steward scans the whole store and surfaces recurring behavior as pattern candidates"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the AC store contains three ACs in three different feature folders whose
    criteria each describe "a list view that filters on one text field and exports
    the currently visible rows",
  And the three ACs differ only in the field they filter on (customer name / part
    number / order id) and the export format (CSV / CSV / XLSX),
  And no pattern AC covering that behavior exists in the store,
  When the pattern-steward performs a store-wide scan,
  Then it reports exactly one pattern candidate for that behavior,
  And the candidate names all three source AC ids,
  And the candidate states the behavior the three share in one Given/When/Then body,
  And the candidate lists one proposed slot per value that differs across the three
    occurrences (a filter-field slot and an export-format slot),
  And the candidate states the recurrence count (3) that qualified it.

  Given the same store also contains two ACs that both use the word "table" but
    specify unrelated outcomes (one asserts row selection, the other asserts a
    printed footer total),
  When the same scan runs,
  Then those two ACs are not reported as a pattern candidate.
