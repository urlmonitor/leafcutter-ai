id: BP-1600a-1-i
components:
  - build_pipeline
  - precommit_hooks
title: "The census states how many hook scripts it examined and how many wirings it read, and a run that could not establish either population is an unresolved run that fails — an unlistable directory and a directory that lists empty are two different facts and must be named as two"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the wiring census has completed a run,
  When it reports,
  Then its summary states how many hook scripts it found in that place and
    examined, and how many wirings it read from the settings surface, so a run that
    compared nothing cannot produce the same output as a run that compared
    everything,
  And given the place the hook scripts are kept cannot be listed, or is listed
    successfully and holds no hook scripts at all,
  When the census runs,
  Then it states that it could not establish which hook scripts exist, names which
    of those two situations it is in, and fails,
  And given the settings surface cannot be read, or is read and cannot be
    understood as the wiring it is supposed to be,
  When the census runs,
  Then it states that it could not establish which scripts are run, names which of
    those two reasons applies, and fails,
  And in none of those situations does it state that no script is run by nothing,
    and in none does it exit as though the comparison had been performed and had
    found every script wired,
  And given a run in which every hook script present is either run by a wiring or
    carries a stated ground,
  When it reports,
  Then the number of scripts it states it examined is greater than zero, and that
    stated number is what establishes the run as clean — a run is never reported
    clean on the strength of having found nothing to report.
