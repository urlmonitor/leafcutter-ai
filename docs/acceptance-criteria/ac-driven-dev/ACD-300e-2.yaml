id: ACD-300e-2
readiness: approved
priority: medium
title: "PO v3 queries the knowledge graph during S1 to discover related L0/L1 nodes before framing"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the product-owner-v3 agent has reached S1 (Knowledge Acquisition)
    and has identified the target component for the user's request,
  When the agent executes its knowledge-acquisition steps,
  Then it invokes knowledge-query with a keyword derived from the user's request
    and a surface filter of "docs" to discover related documentation nodes,
  And it invokes knowledge-query with the component name to discover all
    existing nodes (agents, skills, ACs, docs) related to that component,
  And it uses the returned node list to identify:
    (a) existing L0/L1 ACs that overlap with the user's request,
    (b) documentation that describes current behavior in the target area,
    (c) related skills or agents that already serve the described need,
  And any overlapping L0/L1 ACs found are cited when the agent presents
    its framing to the user ("existing AC ACD-200a already covers X"),
  And the agent does not skip the query even if the S1 file reads
    return sufficient context on their own.
