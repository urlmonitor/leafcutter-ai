notes: |
  HOLE B, build-time half. A deployed script can import a module that is not
  deployed, and nothing notices until a consumer runs it.

  WHY THIS IS INVISIBLE BY CONSTRUCTION. The defect exists only in the deployed
  layout. In the package repo scripts/ is tracked source, so every sibling resolves
  and every source-tree test passes. This is the same shape as the done_proof.py
  incident recorded in CLAUDE.md ("New Hook / Gate Dependencies Must Be in the Build
  Deploy-Manifest") and as BP-811 in the test-angles failure catalogue, where the AC
  asserted the copy tier and never the reachability tier.

  WHY THE CRITERION DEMANDS A DERIVED SET. BP-900g-5's it_requirements already
  identified the manifest-overstatement defect one level down
  (_manifest_ac_store_scripts scans all ~23 files in scripts/ac_store/ while
  build_ac_store deploys an explicit 9-entry map) and asked for the manifest to derive
  FROM the deploy map. This AC states the converse and stronger requirement: the
  deploy set must derive from what the deployed code actually resolves. Deriving the
  guard's view from the same hand-maintained map it is supposed to police makes the
  two agree by construction and detect nothing.

  TEST ANGLES for it-po. Floor: criterion + reachability. `deployed` is triggered
  (the file ships through build.py and the claim is only true post-deploy) and
  `real_artifact` is triggered (the claim is about module load, so it must be verified
  in a genuinely fresh subprocess — importlib.reload re-executes in an already-
  populated namespace and masks cold-import errors, which is precisely how
  GenReviewFixes H-2 survived). One subprocess test that runs build.py into a temp
  target and then invokes the deployed script charges reachability, deployed and
  real_artifact together, which is how to stay inside the four-angle cap. must_block
  rides the reachability entry: withhold one dependency and require the build to fail.

  BOUNDARY. This AC is about the build refusing to ship an incomplete tree.
  BP-900g-10 covers what a deployed script must do when a dependency is nonetheless
  absent at runtime; BP-900g-9 covers a declared deploy entry whose source is missing.
  The three are deliberately separate: g-8 alone would still have shipped this defect,
  because _component_migration_map.py was never declared anywhere for g-9 to check.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO RULING (2026-08-17) — OPEN QUESTION 1, ESCALATED BY THE BA.
  Question: this AC's derived-closure requirement (derive the deploy set FROM the
  code) appears to push in the OPPOSITE direction to BP-900g-5's fifth
  it_requirement (make _manifest_ac_store_scripts derive FROM the deploy_map).
  BP-900g-5 is readiness: approved, work_status: done, so an implementer working its
  residual could satisfy it in a way that forecloses this AC.

  RULING: the two are NOT in conflict. They govern different edges of a three-set
  relationship that has been treated as two sets, and that conflation IS the defect
  class. Naming the three sets resolves it:

    SET A — what the deployed code actually RESOLVES.  (truth of need)
    SET B — the deploy_map: what a phase DECLARES it ships.  (declaration)
    SET C — _manifest_ac_store_scripts: the guard's MODEL of what shipped.

  BP-900g-5's fifth requirement is the edge C ← B. It is correct and it stands: C
  currently overstates, scanning ~23 files in scripts/ac_store/ while B ships 9, so
  the guard believes things are deployed that are not. Making C derive from B fixes
  an inaccurate model.

  This AC adds the edge B ⊇ closure(A), enforced by a build failure. That is a new,
  upstream constraint on B. It does not touch the C ← B edge and does not require B
  to be generated.

  WHICH DIRECTION WINS WHERE THEY MEET: BP-900g-8 wins on the SOURCE OF TRUTH for
  what must be deployed. B is checked against A and fails the build when it falls
  short. BP-900g-5 wins on the GUARD'S MODEL: C keeps deriving from B. The three
  forbidden shortcuts are enumerated in it_requirements.constraints and repeated here
  because they are the whole ruling:

    (a) Generating B from A — auto-deploying whatever the code imports. FORBIDDEN.
        It removes the declaration, so BP-900g-9 has nothing left to check, and a
        typo'd or accidental import silently changes what ships.
    (b) Deriving the CHECKER's view from B — i.e. computing "what needs deploying"
        from the deploy map. FORBIDDEN, and it is the specific trap this AC's
        criteria name: the guard and the thing it polices agree by construction and
        detect nothing.
    (c) Deriving C from A. FORBIDDEN. It restores the divergence between the guard's
        model and the actual deploy that BP-900g-5 was closing.

  PRACTICAL ORDERING FOR THE IMPLEMENTER: land the C ← B derivation (BP-900g-5's
  residual) FIRST, because it is behaviour-neutral by BP-900g-5's own assessment and
  makes the guard's model honest. Then add the B ⊇ closure(A) check. Doing it in the
  reverse order means the closure check runs against a guard model that overstates
  coverage, and its first failures will be noise.

  CAVEAT RAISED, NOT ACTED ON: BP-900g-5 is marked work_status: done and
  readiness: approved, yet the evidence in this AC's criteria (the deploy_map still
  hand-maintained at ~851-873, still carrying a live fourth instance) indicates its
  fifth it_requirement is not implemented. That is a store-accuracy question about an
  approved record owned outside this authoring pass; BP-900g-5 was NOT modified. It
  is flagged here so the implementer of this AC verifies the state of the C ← B edge
  before assuming it exists.
