criteria: |
  Given a component library catalog exists with entries for "navigation-bar",
    "data-table", "form-panel", and "card-grid" page types,
  When the UX designer agent receives a feature request that requires a list view,
  Then the agent reads the full component library catalog before composing any layout
  And the agent's prototype references only components present in the catalog
  And no component is invented or defined inline in the prototype output
