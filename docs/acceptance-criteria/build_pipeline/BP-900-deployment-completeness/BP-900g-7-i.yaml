id: BP-900g-7-i
components:
  - build_pipeline
title: "The registry-resolution rule distinguishes a named artifact from prose, and a missing one from a merely undeployed one"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-7.yaml"
criteria: |
  Given the registry-entry resolution rule of BP-900g-7,
  And a registry containing, in the same file: an entry naming an artifact that
    exists and is deployed; an entry naming an artifact that exists in the package
    tree but reaches no consumer; an entry naming an artifact that exists nowhere;
    and a descriptive free-text field that happens to contain a token shaped like a
    file name,
  When the reference-integrity preflight runs over that registry,
  Then exactly one finding is produced — the entry naming the artifact that exists
    nowhere,
  And the free-text field produces no finding, so a description mentioning a script
    is not mistaken for a declaration that ships one,
  And the entry naming an existing-but-undeployed artifact produces no finding from
    THIS rule, and is instead left to the deployment-completeness rules, so the two
    concerns report separately and an author reading a failure can tell whether the
    remedy is to write the artifact or to deploy it,
  And an empty registry, and a registry every one of whose entries resolves, both
    produce zero findings,
  And these four shapes are exercised through the same preflight entry point as the
    blocking case in BP-900g-7, against the real on-disk registry files rather than
    hand-built dictionaries,
  Because a resolution rule wide enough to flag prose gets suppressed within a week
    and a rule that conflates "was never written" with "was not shipped" sends every
    author to the deploy map for a defect no deploy map edit can fix — either outcome
    leaves the hole open while appearing to have closed it.
depends_on:
