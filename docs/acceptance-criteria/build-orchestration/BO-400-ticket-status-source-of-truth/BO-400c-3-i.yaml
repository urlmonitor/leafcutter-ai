it_requirements:
  - "Must distinguish a path change (add+delete or rename into done/) from an in-place modification of a file whose path is unchanged"
  - "Must only fire the prohibition when the staged change actually introduces a done/ path that did not exist at that path in HEAD"
  - "Must not emit any 'prohibited done-folder move' message for a file whose staged path equals its HEAD path"
  - "Must complete within the existing pre-commit hook time budget (<5 seconds)"
