notes: 'Approved requirements; implementation is under review; native Windows isolation remains unsupported, but dedicated WSL filesystem boundaries and deployed guard bootstrap are verified.
  Linux worker regression passed with 317 tests, 5 skipped and 10 subtests; 13 real native sandbox/bootstrap checks passed.
  Complete real local-model delivery acceptance remains unverified. Pattern inventory found
  no matching reusable worker behavior. User-selected technical constraints for IT PO: Qwen3.5 9B through
  Ollama; first workflow LangGraph with durable local-first state. No hosted database or global migration
