notes: |
  GE-119b-2 touches every check in the family at once. That is the right shape of fix and
  also the largest blast radius in this tree — the failure mode is a consolidation that
  quietly changes what one check finds in the layout where it already worked.

  The precedent is explicit in the store: GE-118a-1 carries "And the main-checkout behavior
  is unchanged (backward compatible)" as a criterion clause for exactly this reason, on a
  change one eighteenth this size.

  The third clause — no check that previously reported a violation now reports clean — is
  the one that matters most. A consolidation bug that makes a check stop finding things is
  invisible against a clean fixture, so the fixture must provoke a real violation for every
  check. That fixture is shared with GE-119b-4; build it once.
