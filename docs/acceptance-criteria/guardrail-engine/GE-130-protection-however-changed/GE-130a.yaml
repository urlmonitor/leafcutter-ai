notes: |
  Population: the three guards named in the user decision of 2026-09-17.
  DETECTION (user decision Q1, 2026-09-17): before a command runs, block only when
  the command clearly writes to a protected file; uncertain commands are left to
  GE-130c's after-the-fact check.
  ROLLOUT (Q3): all callers, warn-only first, blocking after GE-130d's measurement.
  ORDER (Q5): inline_work_guard may be widened immediately; documentation_guard and
  readme_read_guard only after GE-130f shows each blocking a known-bad edit.
  READ SIDE: readme_read_guard must accept a guide read with a command as read, or
  widening the write side alone creates new false blocks.
  The hooks reference catalogue matcher column must reflect the widening.
