title: "The /plan-feature command, skill, and workflow present one consistent execution model"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the /plan-feature command states that authoring must run via the
    Workflow tool and explicitly forbids an LLM-mediated manual alternative,
  When the command, its skill, and its workflow are read together,
  Then the skill body does not instruct the LLM to manually dispatch the
    authoring agents (triage, PO, BA, IT PO) or run the confirmation gates
    itself in contradiction of the command,
  And the command, skill, and workflow describe exactly one canonical execution
    path — the skill either defers to the workflow or the command's prohibition
    is reconciled so no contradiction remains,
  And no reader can find two mutually exclusive instructions for how
    /plan-feature runs.
depends_on: [ACD-300b]
