    description: "No project environment exists, so the gate falls back to the bare interpreter and every new test errors at conftest import. The verdict's reason is project_package_not_importable, never no_red_outcome_among_new_tests, and its refusal names the interpreter and the package."
  - name: test_resolver_order_configured_venv_uv_then_current
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: boundary
    description: "The resolver returns the uv run command for a uv-managed project without a .venv, and the interpreter running the gate when nothing applies."
notes: |
  FOUND IN THE DIAGRAPH ADOPTER (leafcutter v15.0.9, commit dcd93781). The
  build-feature red-baseline gate ran `python fast_lane.py heavy_lane_gate`
  with /usr/bin/python, which has pytest but not the diagraph package (that
  lives in the worktree's uv-managed .venv). conftest import failed with
  ModuleNotFoundError: No module named 'diagraph', pytest exited 4, every new
  test read ERROR, and the gate returned no_red_outcome_among_new_tests, so
  the coder was never dispatched. Under the project venv the same tests were
  genuinely red: 17 red, 1 green by design. The existing
  test_interpreter_unusable check only asked whether pytest imports, so it
  could not see this.

  L3 under TQ-500f-3 beside -3-ii and -3-iv: a technical constraint on the
  same red-baseline reader, not a new behaviour.
