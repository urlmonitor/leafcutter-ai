  - "The largest recognised size must be present in the fixture as the criteria specify. Without it, 'unreadable sizes rank last' and 'unreadable sizes are treated as the largest size' order the remaining records identically, and the test passes on a rule the AC does not state."
  - "The missing-size record must omit the field entirely and the unrecognised-size record must carry a value outside the recognised set; they are different author mistakes and the AC asserts they land in the same place, which a single fixture covering only one of them cannot show."
