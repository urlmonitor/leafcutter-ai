title: "Tree traversal for epic generation follows parent-pointer metadata"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a goal requirement and its descendants whose hierarchy is recorded in
    parent-pointer, level, and order metadata,
  When the tree is traversed to build the set of work items beneath the goal,
  Then the traversal walks from the goal to its children by matching each
    requirement's parent-pointer field to the current node's UID,
  And children are visited in the sequence given by their order field,
  And the resulting set of descendants is identical whether or not any
    requirement in the subtree has been re-homed since creation, because the
    traversal never reads the requirement names to infer structure.
