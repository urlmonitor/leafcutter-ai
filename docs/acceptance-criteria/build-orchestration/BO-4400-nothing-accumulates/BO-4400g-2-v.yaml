notes: |
  USER DECISION (2026-11-16, plan-feature gate): a workspace whose work is pushed to the
  shared project but never reached the main line -- a failed run, an abandoned or closed pull
  request, or one still open but untouched -- is cleared by the unattended landed-work pass once it holds nothing unsent
  (every commit on its own line on the shared project, nothing uncommitted) AND no file in it
  has changed for 14 days. The work stays on its line on the shared project and can be
  fetched again. A younger pushed but unmerged workspace stays kept as not yet on the main
  line. The 7-day rule for workspaces with no commits of their own is unchanged. The 14-day
  rule is the pass's alone, like the 7-day one: a flow still clears its own workspace only
  once its work has landed, or at once when it had nothing to deliver.

  GIT ONLY: the pass never asks a pull-request service whether a pull request is open, closed
  or abandoned; it cannot tell those apart and does not need to. The Given makes no such
  service reachable, so a pass that depends on one cannot clear "stale-1".

  STILL OPEN BUT IDLE IS NOT A BUG (user decision, 2026-11-16): because the pass is git-only, a
  workspace whose pull request is still open but whose files have not changed for 14 days is,
  to the pass, the same case as "stale-1", and it is cleared. That is intended. The work stays
  on its line on the shared project, the pull request is untouched, and asking the workspace
  maker for that work again makes a workspace that resumes the line. No separate scenario is
  written for it, since the pass sees nothing that would tell it apart from "stale-1".

  FIXTURES BEYOND THE USER'S THREE (BA additions, flagged): "ten-day-1" (idle 10 days) catches
  a pass that reuses the 7-day threshold for pushed but unmerged work, which "recent-1" (3
  days) alone would not. "stale-ahead" covers the "every commit on its own line" half of
  holding nothing unsent, which "stale-dirty" (uncommitted change) does not.

  Placed as an L3 of BO-4400g-2 (fifth child; the tree-limit hook caps only L1s per L0 and
  L2s per L1). Technical fields are left for the IT PO, including BO-4400g-2's LANDED RULE
  and IDLE AGE requirements, which still name one threshold and say a pushed but unmerged
  line is never cleared.
