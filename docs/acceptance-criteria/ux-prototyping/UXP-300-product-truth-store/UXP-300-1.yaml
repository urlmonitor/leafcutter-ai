id: UXP-300-1
title: A documented field must match its declared contract
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a node documents original_question as a required string and context as an optional array
  with default [] against a declared contract,

  When the Product Truth record is checked,

  Then those matching declarations are accepted,

  And an unknown contract or JSON path, incorrect type, incorrect immediate-container requiredness, or
  missing or incorrect known deterministic default is reported against its node and field,

  And wildcard paths are checked as each present item or map value rather than as a promise that an item
  exists,

  And an object field with an applied payload contract retains its object transport type while the payload
  is checked separately.'
depends_on:
- UXP-300
