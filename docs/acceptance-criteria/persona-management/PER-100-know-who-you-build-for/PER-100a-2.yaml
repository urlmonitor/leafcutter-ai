criteria: |
  Given a persona.yaml file for persona "field-service-engineer"
  When the file is loaded by a phase agent during discovery, design, development, or marketing
  Then the file contains the following phase-specific sections:
    - discovery (key questions to answer, research pointers)
    - design (UX preferences, accessibility needs, device constraints)
    - development (technical assumptions, integration points, performance expectations)
    - marketing (messaging hooks, value propositions, competitive alternatives)
  And each section can be read independently without requiring the full document
  And any section may be empty (no entries) but the key must be present
