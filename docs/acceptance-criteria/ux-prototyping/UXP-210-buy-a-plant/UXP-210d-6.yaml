criteria: |
  Given an 'authorized' Payment for an in-stock item,
  When the processor captures the payment,
  Then the Payment status becomes 'captured',
  And the Order status becomes 'paid',
  And the confirmation screen is shown with the order number and captured amount.
depends_on: [UXP-210d, UXP-210d-5]
