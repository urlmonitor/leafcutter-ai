notes: |
  Behaviour (c) of the four the parent BO-400e names.

  THE DEFECT IS TWO DOORS IN ONE PROMPT, NOT AGENT CAPRICE. The completion write dispatches
  a closing party with a prompt that does two things at once: it names the confirmed
  phases, and it says to edit the ticket's frontmatter so the status reads done. Two routes
  follow from that single instruction -- the guarded one, which reads the record and
  refuses, and the literal one, a direct edit that touches no check at all. Verified on
  origin/main: the epic driver contains ZERO references to the guarded mechanism by name.
  Three observed tickets were in identical states; the refusal came from the first route
  and the two done writes from the second.

  A FIX EXPRESSED ONLY AS BETTER PROMPT WORDING CANNOT HOLD. That is why the criterion
  requires one door rather than one instruction: the next prompt edit reopens the second
  door otherwise. The instruction clause above is real but it is the weaker half -- it is
  also the only clause a source-reading test can see, and a test that checks only it passes
  on an implementation where the second door is still reachable.

  THE LOAD-BEARING CLAUSE IS THE REFUSING-MECHANISM CASE. Make the checking mechanism
  refuse, drive the close, and assert nothing was written. That is the only observation
  that distinguishes "the second door is closed" from "the second door exists and was not
  taken this time".

  THE OVERRIDE IS THE LENIENT BRANCH WEARING A FLAG. A decomposition that converges the two
  doors by having the writer always pass the blanket override has recreated the permissive
  path and additionally switched off the allowed-transition rules. The override clause is
  in the criteria for that reason and must be exercised: a close carried out with the
  override does not satisfy this record.

  BOTH TWINS IN ONE CHANGE, per BO-400a-2-ii's standing constraint -- and here the twin
  clause is in the criteria itself, because a one-sided landing produces a system where the
  single-ticket driver closes through the door and the epic driver does not.
