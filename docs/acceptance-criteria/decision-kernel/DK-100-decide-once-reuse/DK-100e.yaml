roadmap_phase: phase_kernel_1_founding
criteria: |
  Earlier decisions resurface as evidence, and you choose to reuse or rethink.

  When a new question comes up, earlier published decisions that might apply are
  found, judged for whether they really fit, and cited as evidence; when one is a
  close match you are asked whether to reuse it or decide anew. An earlier
  decision informs the new one but never settles it on its own: reusing it is
  your fresh approval, and deciding differently marks the old one as replaced
  while keeping it on record.
