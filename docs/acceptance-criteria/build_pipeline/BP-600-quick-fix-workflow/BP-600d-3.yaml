assigned_agent: workflow-architect
estimated_complexity: S
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must dispatch the commit agent via the Agent tool — never call git commit directly (per CLAUDE.md commit delegation policy)"
  - "Must pass the AC ID to the commit agent so it appears in the commit message"
  - >-
    Must name the parent AC file explicitly in the staging instruction. Do not
    delegate the back-link to the hooks. As observed on 2026-08-25 they read the
    commit index, so an unstaged parent is unreachable to them; and if that ever
    changes, a hook reading the store would block this commit on the stale
    back-link rather than repair it. Explicit staging is the correct instruction
    under both regimes.
  - >-
    When the AC creation phase produced a Roman-suffix L3 child, the immediate
    parent to stage is that child's L2, not the L1 grandparent.
