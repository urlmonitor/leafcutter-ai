title: "A scoped test whose failure reaches the green gate masked as an expected failure is still counted red"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the green gate's scoped run for a batch reports outcome passed for 12 covering
    tests and outcome xfailed for 1 covering test of BO-2600b-4,
  And the run as a whole exits zero,
  When the green gate produces its verdict,
  Then the xfailed test counts as not passing and the green verdict is not green,
  And the failing-test list names that test with BO-2600b-4 and its raw reported
    outcome xfailed, so a reader can see the failure was masked rather than absent.

  Given the green gate's scoped run reports a covering test with outcome xpassed,
    skipped or errored, and every other covering test passed,
  When the green gate produces its verdict,
  Then the verdict is not green and that test is listed with its raw outcome — green
    requires every scoped covering test to be reported passed, and the gate decides
    from each test's own outcome, never from the run's exit status alone.

  Given the green gate's scoped run executes no covering test at all for the batch,
    because collection failed or the selection matched nothing,
  When the green gate produces its verdict,
  Then the verdict is not green and states that no covering test ran.
depends_on: [BO-2400a-4]
