id: DK-600d-2-ii
title: "A record naming an unknown component or roadmap phase stops with exit code 3 and writes nothing"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a staged record whose components name no_such_component, which is not in
    docs/components.json, or whose roadmap phase is phase_no_such_phase, which is not in
    docs/roadmap.json,
  When the publish command validates it,
  Then it exits with code 3 and its message names the unknown value,
  And no file under docs/decisions/ is created or changed,
  And once the record is changed to name known values only, the same publish command succeeds.
