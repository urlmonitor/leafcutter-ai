  The second refusal in the KI (attempt 2): retiring at todo hit the test-contract
  rule. INF-600a-1 only passes today because it happens to be readiness reviewed
  and change_target schema; the second Then forbids that as the route.

  IT-PO enrichment (2026-10-15): the refusal comes from
  _ac_schema_validators.validate_test_contract, called at check_ac_schema.py
  per staged file. It is not in scripts/ac_store/validate_ac_schema.py, which
  has no test-contract rule. Only the forward requirement is exempted. The
  contradiction check stays.
