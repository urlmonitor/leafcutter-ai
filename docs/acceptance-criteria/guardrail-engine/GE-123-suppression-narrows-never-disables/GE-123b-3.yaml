test_rationale: "Every other criterion under GE-123b pushes towards refusing more entries, and left alone that pressure produces an implementation that refuses ordinary well-scoped suppressions and warns about clean files — on a check that runs on every commit, its own outage. This record is therefore all guard rails, and its descriptors are deliberately green on arrival: they fail only when a sibling's implementation over-reaches. The two positive arms are also the strongest available test of the definition itself, because both are files that produce zero findings after suppression and are nonetheless fully covered; a findings-based implementation cannot pass either, which is exactly the reading that would put GE-123b in conflict with GE-123a-2. The unreadable-file descriptor asserts the absence of the lost-coverage marker rather than an empty error stream, because a global-silence assertion would forbid GE-120a from ever announcing unreadable files and would collide with GE-113c-3-v's malformed-entry warnings. The real-artifact descriptor mirrors the one GE-113c-3-v added for the same reason: a rule strict enough to fire on the repository's own allowlist would be a nuisance on every commit, and only the real artifact can prove it does not."
