status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement whose trail records that its rework budget for the coding
    stage is already spent,
  And a completely new effort that has no memory of those earlier attempts,
  When that new effort picks the requirement up and the coding stage fails
    again,
  Then the new effort stops and asks a person, rather than retrying,
  And a requirement whose trail records one attempt against a budget of two is
    retried by that same fresh effort rather than escalated,
  And the trail states whether a spent budget refers to this run or to the
    requirement's whole life, so that the two cannot be confused,
  And when the budget is per-lifetime, a person can record a decision that makes
    the requirement retriable again, and that decision is itself an entry in the
    trail rather than an erasure of the earlier ones.
depends_on: [ACD-2000a, ACD-2000a-1]
