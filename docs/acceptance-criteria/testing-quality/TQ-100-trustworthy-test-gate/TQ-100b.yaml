id: TQ-100b
title: "Tests for unfinished features watch quietly until the feature ships"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A test tied to a not-yet-done feature runs for information only; the moment
  that feature is marked done, the same test starts blocking — automatically,
  with no manual step.

  A test that is linked to an acceptance-criterion whose work is not yet
  complete runs in an informational mode: its result is visible but it never
  fails a pull request. When that acceptance-criterion is marked done — which,
  under move-on-main-only, happens when the feature merges — the very same test
  becomes enforced and will block any pull request that breaks it. No human has
  to flip a switch or move the test; the transition follows the feature's status
  by itself.
