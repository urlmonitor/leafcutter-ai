  WHY THIS RECORD EXISTS. On 2026-09-16 the user decided that the scenarios only a real dispatch
  can prove -- BO-3200f-2's first scenario and both scenarios of BO-3200f-2-i -- are proven by an
  opt-in live-dispatch test harness, not by a recorded manual run. Nothing in the unit suite
  dispatches a real agent today (BO-3200f-2's caveat). This record specifies that harness's
  observable contract; it does not restate what the three live scenarios assert.

  [SUPERSEDED 2026-09-17 -- the "no testing-quality L1 fits" conclusion below no longer holds:
  the user opened TQ-600a and the general mechanism moved there. Kept as history. See
  RELOCATION 2026-09-17 at the end of these notes.]
  PLACEMENT -- AN L3 UNDER BO-3200f-2, NOT A TESTING-QUALITY RECORD. Checked against the caps:
  BO-3200f is at 5 of 5 L2s and BO-3200 at 7 of 7 L1s, so neither can take a sibling. L3s under
  an L2 are not capped. The harness is test infrastructure in kind, so testing-quality was
  checked first, and no L1 there hosts it without distortion:
    - TQ-200b (the shared eval runner) is the nearest neighbour and has one free L2 slot, but its
      subject is SCORED evals against a noise-absorbing threshold, wired as a REQUIRED merge gate
      (TQ-200b-2, TQ-200b-4). This harness is pass/fail per scenario and must NEVER run by
      default -- the opposite on both axes. Its free slot is also the last one under an L1
      whose how-to and reference-doc triggers have no documentation children yet.
    - TQ-200c (judged proof routed to the eval harness) is full at 5 of 5.
    - TQ-100 (which tests gate main), TQ-400 (proof re-checked over time) and TQ-500 (a test
      shown able to fail) are adjacent axes, not homes.
  The BA cannot author an L1, so a dedicated testing-quality L1 is not available in this pass.
  Under BO-3200f-2 the record sits next to its only consumers, which is where an implementer
  will look. If a second agent's charter needs live proof, that is the signal for the Product
  Owner to open a testing-quality L1 and move the general mechanism there.

  [SUPERSEDED 2026-09-17 -- the general criteria now say "a case / the agent it declares" under
  TQ-600a-1; this record names the three scenarios because it is now the executor's consumer.]
  WHY THE CRITERIA NAME THE THREE SCENARIOS rather than "any agent". Criteria must be testable
  now, and the executor's three live scenarios are the only live-dispatch proof this tree asks
  for. Nothing here requires the mechanism to be executor-specific, and the IT PO should
  not let it become so.

  [SUPERSEDED 2026-09-17 -- scenarios 1, 2, 4 and 5 moved to TQ-600a-1-i, TQ-600a-1, TQ-600a-2
  and TQ-600a-1-ii; only scenario 3 remains here. The reasoning below still applies at its new
  home.]
  THE FIVE SCENARIOS AND THE SHORTCUT EACH ONE CLOSES.
    1. Opt-in. A harness that dispatches by default puts model cost, credentials and
       non-determinism into every local run and every CI run. A switched-off scenario that
       reports as passed is the phantom-done shape; it must read as not run.
    2. The real agent. A harness that loads a fixture charter, or answers with a scripted reply,
       proves the fixture. "As the repository registers it" is the whole point of going live.
    3. The discriminator for 2. Asserting "the shipped charter was used" passes on a harness
       that reads a frozen copy that happens to match today. Changing the charter in place and
       requiring the live scenario to fail is the shape only a harness reading the real charter
       can pass.
    4. Evidence. A live run leaves nothing behind unless the record is written, and a done-proof
       cannot cite a terminal scrollback. The charter and registry entry content are recorded so
       a later change to either makes the evidence visibly out of date. Whether stale evidence
       loses its standing over time is TQ-400's axis and is not claimed here.
    5. Fail loudly. Switched on and unable to dispatch is the case most likely to be reported as
       a skip, because that is what test frameworks do with missing credentials. A skip under
       an explicit switch is a silent pass by another name. The permission-request cause is
       listed because the user decided on 2026-09-16 that nothing is pre-approved (BO-3200f-2
       notes), so an unattended live run WILL meet permission requests; it must fail naming
       them rather than wait.

  [SUPERSEDED 2026-09-17 -- declares_side_effect is now false; the evidence-write scenario moved
  to TQ-600a-2, which carries true.]
  declares_side_effect: true -- derived from the fourth scenario's Then ("an evidence record is
  written"), and honest: the record is a durable artifact a done-proof cites.

  [SUPERSEDED 2026-09-17 -- the harness guarantee now lives in TQ-600a-1, TQ-600a-1-i,
  TQ-600a-1-ii and TQ-600a-2, which BO-3200f-2-i depends on directly. BO-3200f-2-i no longer
  depends on this record; this record depends on BO-3200f-2-i. See RELOCATION below.]
  ORDERING. BO-3200f-2 and BO-3200f-2-i are "not done until this record is satisfied".
  BO-3200f-2-i now carries a depends_on edge to this record (a sibling edge, no cycle). BO-3200f-2
  cannot: it is this record's parent, so the reverse edge would be a cycle. For BO-3200f-2 the
  rule is held by its notes and by this record being in its covered_by only.

  FOR THE IT PO -- OPEN, NOT DECIDED HERE.
    - What the switch is, and whether a CI job that sets it should exist at all (the first
      scenario only forbids CI running it WITHOUT the switch).
    - Whether dispatch reuses TQ-200b's eval runner mechanism (see doc_links) or not; and how
      this sits with TQ-200c, which routes proof of prompt behaviour to the eval harness.
    - Where the evidence record lives and its shape; how a done-proof cites it.
    - BO-2900g-3 retires the ticket-facing proof kind named "live_dispatch"; this record uses
      "live dispatch" only as plain words and must not revive that value.
    - The three LIVE DISPATCH descriptors on BO-3200f-2 and BO-3200f-2-i should name this
      record's harness as their entry point once it exists.

  IT-PO ENRICHMENT (2026-09-17) -- THE OPEN ITEMS ABOVE, DECIDED.

  THE SWITCH. One environment variable, LEAFCUTTER_LIVE_DISPATCH; '1' on, unset or '0' off, any
  other value a named failure. No CI job that sets it ships with this record: a switched-on CI job
  needs a model-service credential and a permission arrangement that does not contradict the
  user's "nothing is pre-approved" decision, and both are the user's to decide.

  REUSE OF TQ-200b's RUNNER -- THE TRANSPORT YES, THE RUNNER NO. scripts/evals/run_agent_eval.py
  dispatches a real agent through the headless agent CLI. Building a second way to reach the model
  service would fork credentials handling, model selection and launch-failure handling, so the
  transport is extracted into one shared module both use, with a regression test pinning the
  runner's behaviour. Everything that makes the runner an EVAL runner is not reused: its per-row
  scoring against a threshold that absorbs noise, its gitignored results directory, its trigger
  selector, its staleness guard and its required CI gate. The two differ on every axis the BA
  named -- scored versus pass/fail per scenario, always required versus never by default -- and on
  evidence: the runner overwrites a local, untracked result per agent; this harness appends a
  tracked, per-run record that a done-proof can cite. One warning carries over from the reuse: the
  runner today turns a launch failure into an empty prediction that scores (false-green M6,
  KI-TQ-20260908-0900). The harness must not inherit that through the shared transport; fixing it
  inside the runner stays with the testing-quality known issue and is not claimed here.

  THE TQ-200c BOUNDARY -- AND WHAT TQ-200c WOULD NEED TO CHANGE. TQ-200c's L1 says model behaviour
  under a prompt ("does the prompt actually elicit the intended behaviour") is judgement and that
  judged proof lands in the eval harness. Read literally, the three live scenarios fall on the
  judged side, because each asks whether the executor's charter elicits carrying a command out.
  The user chose a pass/fail harness instead. The boundary drawn here, so the two do not
  contradict: what decides whether a proof is judged is HOW ITS PASS IS DECIDED, not whether a
  model is in the loop. Each live scenario passes or fails on one deterministic assertion over one
  real reply -- the reply verifies as BO-3200f-1's capture of the dispatched command, or it does
  not -- so it is an ASSERTED proof that happens to need a live dispatch, and it lives here. A
  proof whose pass is a score over a set of rows against a threshold is JUDGED and lives in the
  eval harness; this harness takes no scores, thresholds or rows. TQ-200c's records are not
  edited here (outside this pass). For the two to agree in writing, TQ-200c would need: (1) its L1
  narrative to stop equating "model in the loop" with "judged" and to name this third case -- an
  asserted proof over a real dispatch; (2) TQ-200c-1's proof_mode definitions to say that
  'asserted' covers an assertion over a live model reply, not only a deterministic test with no
  model; (3) TQ-200c-2's router, which derives the kinds of proof from what the work says about
  itself, not to route charter work whose criteria are exact-output assertions to the eval
  harness only. Until then an implementer reading TQ-200c could reasonably demand eval rows for
  BO-3200f-2's first scenario. USER DECISION NEEDED on whether to amend TQ-200c accordingly.

  THE RETIRED PROOF KIND. BO-2900g-3 removed 'live_dispatch' as a ticket-facing proof kind in
  favour of the reachability angle plus surface_invoked. Live descriptors here and in the three
  records that use this harness keep type e2e and angle deployed and name the harness in
  surface_invoked; no schema, ticket or evidence value called live_dispatch is introduced, and a
  test pins that.

  EVIDENCE. A tracked directory, docs/testing/live-dispatch-evidence/, one new record per
  switched-on run, written for failed runs too. Tracked because a done-proof must be able to cite
  it from a fresh worktree; the eval runner's untracked results directory is the counter-example.
  The record stores charter and registry-entry content and digests so a later change to either
  makes the evidence visibly out of date; whether it then loses its standing stays TQ-400's.

  CAVEAT -- PERMISSION REQUESTS WILL FAIL UNATTENDED RUNS. With nothing pre-approved, a headless
  dispatch whose shell command is not already allowed by the operator's own settings meets a
  permission request and fails as permission_request_unanswered. That is the honest outcome under
  the user's decision and is why no CI job is shipped; an operator running the harness locally
  does so under their own settings.

  CAVEAT -- FIRST RUN COST. The declining-charter and failure-cause tests make real dispatches
  (some fail before reaching the model). risk_surface is cost for that reason; the switch is the
  only control and must stay off by default.

