notes: |
  Authored by /quick-fix. Root cause: the sink is resolved from __file__ (or a
  CWD-relative --jsonl override) and the resolved path is never reported, so a
  split is only discoverable by a workspace-wide find. Measured 2026-09-30: 787
  records across 18 feedback.jsonl files, 1 in the sink people check.

  Placement: INF-500d is at its cap of 5 L2 children. This is a constraint on
  INF-500d-4's existing behaviour (where a report lands): it pins that the
  landing place is stated at write time. It does not choose the durable
  location INF-500d-4 and INF-500d-4-i specify, and it must not be read as
  satisfying them - a reported path can still be the disposable one.

  Channel choice: stderr already carries the sidecar line, so every caller that
  shows or redirects stderr already tolerates a non-id line there. Callers that
  redirect stderr to a file (signoff §2a, ticket-supervisor) will find the sink
  line in that file rather than in the tool result; surfacing it in their
  output is a template change and out of scope here.
