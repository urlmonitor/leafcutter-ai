id: TQ-100a-2-ii
components:
  - testing_quality
title: "Scoping the identity write to the worktree is refused as the fix, because it aborts on a checkout that lacks the extension"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the written remediation for this defect names, as its first option,
      scoping the identity write to the worktree rather than writing it
      unqualified,
    And that form is legal only where the repository has the worktree-
      configuration extension switched on,
    And that switch lives in the repository's own configuration and is therefore
      absent from every fresh checkout — which is exactly what the pull-request
      test job creates,
  When a test sandbox issues a worktree-scoped identity write on such a checkout,
  Then the git invocation aborts with a fatal error stating that the worktree
      scope cannot be used across multiple working trees unless the worktree-
      configuration extension is enabled,
    And the test that issued it fails, so the required test job of the pull
      request is red and the change cannot merge,
    And therefore an implementation of TQ-100a-2 whose identity is supplied by a
      worktree-scoped configuration write is not accepted, however correctly the
      host repository behaves on the author's own machine,
    And an implementation whose identity is supplied through the inherited
      process environment IS accepted on that same checkout, because it needs no
      repository configuration of any kind,
    And the written remediation no longer presents the worktree-scoped write as
      an option to take, at either place the defect is written up, so the next
      reader is not sent down a path that ends in a red required job.
depends_on:
  - TQ-100a-2
