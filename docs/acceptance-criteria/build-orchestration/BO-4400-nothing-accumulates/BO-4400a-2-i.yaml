notes: |
  The decision to clear follows the workspace's verdict, not the run's success flag.
  Named wrong versions: (1) "only clear on success" -- first half red (workspace left behind
  with nothing in it, exactly the pile-up this L0 exists to stop); (2) "clear on any
  post-PR failure" without consulting the verdict -- the second half is still protected by
  the door's refusal, so the run must report the refusal as work kept, not as a clearing
  error.
