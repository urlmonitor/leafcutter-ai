notes: |
  This is the growth criterion of BO-3500a: it is the record that makes documentation,
  diagram, screen and prompt work actually get produced rather than merely not
  refused. Everything else under this L1 is about the two ways it can be asked for
  something it cannot do.

  THE THIRD SCENARIO IS NOT PADDING. A change that routes by declared craft is easy to
  build in a way that also perturbs the all-code case — an extra hand-off, an extra
  recorded outcome, a changed ending. The all-code set is the overwhelmingly common
  one today and its behaviour is already covered by the BO-2400f family; a regression
  there would be paid for on every run. Stated as a criterion so it is tested rather
  than hoped for.

  TESTABILITY. Provable only by executing a run and reading the hand-offs it actually
  made, together with the artifacts on disk afterwards. A test that inspects the source
  of the run for a craft name, a mapping table or a phase ordering is not evidence
  here — it passes unchanged when the mapping is built and never consulted, which is
  the exact failure this component has already shipped once (CLAUDE.md, "Gate /
  Workflow ACs — Verify Behaviorally, Not by Grep"). The load-bearing assertion is the
  pairing of hand-off and artifact: either alone can be faked.
