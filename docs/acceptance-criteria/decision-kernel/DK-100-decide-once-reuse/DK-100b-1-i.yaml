assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - Items a human adds or rewords are recorded as human-supplied and approved by that human (proposed_by
    and approved_by are the answering actor); new ids never collide with existing ones.
  - A declined proposal stays in the list as rejected and is never researched, assessed or brought
    back as pending on a later resume.
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_subset_approval_declines_the_unlisted_proposal
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_subset_approval_declines_the_unlisted_proposal):
      an unlisted proposal is declined and not assessed'
    covers:
      - DK-100b-1-i
  - name: test_edited_criteria_replace_the_proposals
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_edited_criteria_replace_the_proposals):
      edited criteria are assessed in the human''s wording'
    covers:
      - DK-100b-1-i
  - name: test_edited_criteria_are_approved_by_the_answering_actor
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_edited_criteria_are_approved_by_the_answering_actor):
      edited criteria are supplied and approved by the answering actor'
    covers:
      - DK-100b-1-i
  - name: test_a_human_adds_an_option_at_approval
    target_dir: tests/kernel/grounding/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/grounding/test_round5.py::TestAddedOptionsEndToEnd::test_a_human_adds_an_option_at_approval):
      an option added at approval reaches the assessment'
    covers:
      - DK-100b-1-i
  - name: test_a_revised_approval_researches_and_assesses_only_the_revised_set
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'TO WRITE (in tests/kernel/capabilities/test_decision_criteria_proposals.py): one
      answer approving 3 of 4 options, rewording one criterion and adding an option: the added option
      is opt.added.1 proposed_by the human, and the declined option is in neither the research request
      nor the assessment batch'
    covers:
      - DK-100b-1-i
