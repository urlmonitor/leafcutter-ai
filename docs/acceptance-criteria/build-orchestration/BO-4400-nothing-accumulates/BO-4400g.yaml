notes: |
  ORIGIN. /plan-feature request, 2026-10-25 (behavioral route, parent_l1_id BO-4300e):
  "Workspaces are cleared once their work has landed, from one central place any flow can
  call by the work's name." Evidence given: on 2026-10-25 the maker's landing place held 19
  workspaces (6 ac, 3 epic, 3 fastlane, 7 feature), 5.6 GB, on a ~50 GB WSL disk budget; most
  PRs were merged by hand after the flow had ended. Only finalize step 7 and the ship skill
  call the maker's clearing today; plan-feature, the fast lane, build-feature without
  finalize and quick-fix never clear.

  WHY HERE AND NOT UNDER BO-4300e (placement decided by the BA, flag for the PO/user):
  - BO-4300e holds 5 of 5 L2 children (L1 cap 5), so no new L2 fits under it.
  - The request asked for a NEW SIBLING L1 of BO-4300e, but BO-4300 already holds 7 of 7
    L1s (a..g; L0 cap 7, no child_limit_override). A BO-4300h would be refused by the
    tree-limit hook.
  - BO-4400 holds 6 of 7 L1s and its own boundary rule (PROJECT_CONTEXT, BO-4400 notes) says
    "that it IS cleared, by every route" belongs to BO-4400. The name-based clearing request
    and the landed-work pass are additions to the door that exist to serve that promise, so
    this L1 depends on BO-4300e and reuses it rather than restating it. This takes BO-4400's
    LAST L1 slot (7/7).
  - BO-4400a (route-end clearing) and BO-4400d (routine sweep) are each at 5/5 and were not
    usable hosts.

  OUT OF SCOPE, OWNED ELSEWHERE: the rule for which caller may tell a workflow agent to
  remove a workspace, and finalize step 7's authorization, belong to a separate record
  family owned by another session; this L1 neither restates nor references it. The
  discard token for unsent work stays BO-4300e-3 -- the landed-work pass never uses one.

  OPEN CONFLICT (flagged, not resolved): BO-4400's approved KEY FRAMING DECISION
  (2026-10-09) is that a route clears its workspace as soon as its PR is OPEN (pushed counts
  as sent, BO-4400a-1). This request says a flow clears once its PR is MERGED, else leaves the
  workspace to the landed-work pass. BO-4400g-4 is written so it holds under either answer;
  the user must say which timing wins before BO-4400a-1 or BO-4400g-4 is built.
