criteria: |
  Given the read index is enabled
  When a lifecycle boundary occurs that can change surface sources — a commit is made,
    a build completes, or a session starts
  Then a refresh runs at that boundary that updates the index to reflect the current
    sources, so subsequent reads usually find the index already fresh and do not need
    read-time self-heal
  And each refresh event updates the index rather than requiring a full rebuild from
    scratch except where a surface genuinely requires it
  And these proactive refreshes never replace the mandatory per-read staleness check of
    KM-KGS-100b-6 — a missed event still degrades to slower-not-wrong on the next read
