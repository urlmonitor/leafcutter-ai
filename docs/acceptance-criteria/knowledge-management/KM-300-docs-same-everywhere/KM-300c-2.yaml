assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Implement in the same hook as KM-300c-1 (templates/scripts/commit_guardian/check_doc_index_links.py), reusing its link recognition and inspected-link count"
  - "Existence must be judged against the commit's staged tree (the git index), not the working tree, so a page deleted in the same commit counts as missing and an unstaged new page does not count as present"
  - "Existence must be case-exact on every host (compare against the index's path list), never a file-system existence test, which is case-insensitive on Windows and macOS"
  - "Resolve each target from the folder containing the map, normalising ./ and ../ as POSIX paths; a target that climbs outside the repository is refused"
  - "Refusal message must name the map, each unresolvable line number, the target as written, the path it resolved to, and the regenerate command valid for the running layout"
  - "Must complete within 1 second for a map of 1,000 entries (one index listing, not one git call per link)"
  - "Must not ship before KM-300a-2 is merged, or it refuses every commit"
  - "Hook file must stay under the 400-line .py limit"
delivers_to: null
