notes: |
  Authored by /quick-fix. Root cause: check_done_proof.py has no level-awareness
  whatsoever — grep for `level` in that file returns only unrelated matches
  ("top-level import", "module-level attribute"). It demands a direct covers tag for
  every done AC regardless of level. That contradicts the model ac-fulfillment-gate
  states and implements, where L0/L1 fulfilment is DERIVED from children and the
  composite itself is skipped. A composite's implementation lives under its children's
  covers tags by construction, so the tag this check demands may not legitimately exist.
  The only exemption the check currently honours is test_required: false, which is the
  wrong instrument — setting it on a code AC to clear this gate would be a phantom-done
  dodge. DESIRED: a composite (L0/L1) is done-eligible when the ACs in its covered_by are
  themselves done and covered, rather than needing its own tag. Leaf ACs (L2/L3) keep the
  present requirement unchanged — no weakening. A composite whose children are NOT all
  done must still be refused and must still say why. Do NOT make composites pass by
  skipping them unconditionally: that would admit the falsely-done-composite defect
  (ACD-400a) this repo has 20 recorded instances of. This is a required CI gate, so the
  leaf path must be provably unchanged. Leave the existing hand-added `# covers: GE-127b`
  and `# covers: GE-127a` workaround tags in place.
