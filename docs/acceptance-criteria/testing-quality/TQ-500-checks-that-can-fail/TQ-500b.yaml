notes: |
  Three outcomes must stay distinguishable, and today two of them collapse:
  proof taken and satisfied; proof genuinely not required; proof owed and not
  taken. The third currently presents itself as the second. The customer harm is
  that the absence of the only meaningful check is indistinguishable from the
  check having been passed.
