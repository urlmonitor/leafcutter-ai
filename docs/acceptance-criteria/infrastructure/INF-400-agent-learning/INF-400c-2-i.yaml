title: "Harvester skips events with an unrecognized entry_kind without crashing"
component: infrastructure
level: L3
status: superseded_by
req_status: active
work_status: done
priority: high
readiness: reviewed
criteria: |
  Given the emission sink contains an event with entry_kind "unknown-future-surface"
    that does not match any surface in the route-knowledge taxonomy,
  When the harvester processes this event,
  Then it logs a warning: "Unrecognized entry_kind 'unknown-future-surface' — skipping event <event-id>",
  And it marks the event as processed (so it does not retry indefinitely),
  And it continues processing subsequent events in the sink,
  And the harvester exits with success status (not a failure).
depends_on: [INF-400c-2]
