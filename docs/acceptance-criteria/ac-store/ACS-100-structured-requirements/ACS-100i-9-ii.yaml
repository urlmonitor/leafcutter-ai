id: ACS-100i-9-ii
components:
  - ac_store
  - commit_guardian
  - agent_registry
title: "When the agent registry cannot be read, the check says it did not run instead of passing quietly"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the agent registry cannot be read — the file is absent, empty, or not
    parseable,
  When a record whose declared producer reads `finalize-feature-workflow` is
    checked at the commit-time entry point,
  Then it is not refused on that ground, so a single broken registry cannot
    block every commit in the repository,
  And the same run states that the producer-name check did not run, and why.

  And given the same unreadable registry,
  When every record in the store is validated in one pass,
  Then the run's summary states that the producer-name check did not run over
    any record, and a reader can tell that outcome apart from a run in which
    every record was checked and passed.

  And given the registry is readable again and nothing else has changed,
  When the same record is checked,
  Then it is refused.
depends_on:
  - ACS-100i-9
