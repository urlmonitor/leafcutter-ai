notes: |
  EXPECTED RESOLUTION — SUPERSEDED IN PART, read the suffix-shaped-identifier it_requirement
  above before acting on this paragraph. The direction is right: move the parentless record and
  leave the goal tree (32 files, measured) untouched, because one childless file is far cheaper to
  move than a whole tree. The specific target has changed. This paragraph originally said GE-121,
  a new ROOT number; that is now the second choice, because the store derives a record's parent
  from its id SHAPE and a root-shaped id has no derivable parent — so the parent link this
  criterion requires would exist in the file but be invisible to the gate meant to enforce it.
  Take a suffix under the chosen parent instead (GE-111f, verified free by both tests). The
  criterion remains written against "an identifier no other artifact claims" rather than any
  literal id, so a concurrent mint elsewhere still cannot invalidate the acceptance test.

  WHEN LISTING TAKEN IDENTIFIERS IN THIS NAMESPACE, scan the loose files as well as the folders.
  GE-114-*, GE-115 and the GE-119 record being moved all sit at the namespace root, so a
  folder-only listing under-reports what is taken. That listing error is a plausible way to
  produce a second collision while repairing the first.

  REPAIR IS NOT FREE, AND THIS CASE PROVES IT. The parentless record looks isolated, but it is
  cited from fifteen coverage tags across two test modules, from a guard source file, and from a
  release note — and the same bare identifier is cited by 33 requirement files and a second release note
  meaning the OTHER record. So a bare "GE-119" citation is genuinely ambiguous today, which is
  the goal's own thesis demonstrated on its own worked example. Any tool resolving a coverage tag
  named GE-119 currently gets two answers.

  DELETING EITHER CLAIMANT IS NOT THE ANSWER. Both describe real, wanted work: the goal record is
  an active five-child tree, and the parentless record documents a live defect in the
  contract-shrinking guard that is covered by fifteen passing tests.

  THE MOVED RECORD IS PARENTLESS TODAY and would be reported by an orphan scan regardless. Giving
  it a parent is required by the criterion because a record with a new identifier and no parent
  simply relocates the problem, and because the store's own back-link gate would reject it.

  IT PO CONFIRMATION (2026-08-17), PARTIALLY SUPERSEDED. The IT PO reported that it had verified
  all of the BA's measured facts independently. Two hold: the loose namespace-root files are
  GE-114-1..4, GE-115 and GE-119, and GE-121 owns no file and is cited by nothing. ONE DID NOT:
  both the BA and the IT PO stated the covers tags were "nine, in
  unit_tests/commit_guardian/test_ge_119_contract_shrinking_rename_aware.py". A repo-wide grep run
  before build found FIFTEEN, across that module (9) and
  unit_tests/commit_guardian/test_contract_shrinking_ignores_mentions.py (6).

  THIS IS THE MOST INSTRUCTIVE FACT IN THE TREE, so it is recorded rather than quietly patched.
  Two independent agents, both explicitly told that citations are where a renumbering does its
  damage, both enumerated citations by looking in the file whose NAME contained the identifier —
  and both missed the module that cites it without naming it. That is the same
  resolve-by-assumption error the whole GE-122 goal exists to eliminate, committed twice, on the
  AC that describes it. Two consequences are binding on anyone building this: enumerate citations
  by scanning content, never by filename; and treat "verified independently" in an agent report as
  a claim to re-check, not a fact — the verification here reproduced the original error rather than
  catching it.

  This AC depends only on GE-122e and is still the cheapest first move in the tree.

  POST-MERGE RECONCILIATION (2026-08-18, human user). While this repair was landing on this
  branch, a separate, concurrently-authored change on origin/main (PR #453) independently resolved
  the SAME GE-119 collision the opposite way: it renamed the goal-level 32-file tree from GE-119 to
  GE-120, rather than moving the parentless record as this repair did. After merging origin/main,
  both renumberings are in effect at once, and the criteria above have been rewritten to describe
  the joint outcome: GE-119 is retired and claimed by nothing; the goal tree claims GE-120; the
  contract-shrinking record claims GE-111f as this repair always intended. This tree itself
  (numbers-mean-one-thing) also collided with GE-120 as a result and was renumbered to GE-122 — see
  this file's own id and the sibling files in this folder.
