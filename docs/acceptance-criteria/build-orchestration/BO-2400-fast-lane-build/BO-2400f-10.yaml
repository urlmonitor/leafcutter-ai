estimated_complexity: M
test_required: true
test_spec:
  - name: test_failed_run_releases_claim_to_todo
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    description: "On a non-success exit every AC the run flipped to in_progress but did not transition to done is released back to work_status todo."
  - name: test_release_lands_as_status_only_change_on_mainline
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    description: "The release is landed on mainline as a status-only change touching only work_status, so no AC is left stuck in in_progress."
  - name: test_release_targets_only_own_claim_not_done_acs
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    description: "Release targets only this run's own claimed-but-not-done ACs, leaving already-done ACs and ACs claimed by other runs untouched."
