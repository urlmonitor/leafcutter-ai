notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "The exact canonical serialization of both state and classifier questions is the entity-path receiver budget; escaped characters, envelope keys, trust markers, limitations and redaction replacements count."
  - "Reserve unchanged original goal and required classifier fields before optional caller claims/cards; never raise max_state_chars to fit context."
  - "Provider projection is a copy and may reduce matches to representative plus occurrence_count; checkpoint identity provenance and full mentions stay intact."
  - "All native judgment consumers pass their real question envelope into projection, including intent and later decision/research assessments; audit every extended-signature call site."
test_required: true
test_spec:
  - name: "test_exact_receiver_envelope_fits_after_optional_context_reduction"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "boundary"
    description: "tests/kernel/entity_context/test_projection.py::test_exact_receiver_envelope_fits_after_optional_context_reduction: Project a long Unicode/escaped goal with oversized caller/cards through actual batch assembly and assert canonical {state,questions} length<=configured max, including overhead and omission metadata."
  - name: "test_projection_retains_identity_occurrence_provenance_without_mutating_checkpoint"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_projection.py::test_projection_retains_identity_occurrence_provenance_without_mutating_checkpoint: Assert surviving compact cards keep identity,count,meaning-only provenance/trust while full checkpoint matches remain byte-equivalent."
  - name: "test_native_judgments_share_the_actual_receiver_budget"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "seam"
    description: "tests/kernel/entity_context/test_projection.py::test_native_judgments_share_the_actual_receiver_budget: Capture intent and downstream native judgment calls at small receiver budgets and assert each passes real questions and preserves required task fields."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
