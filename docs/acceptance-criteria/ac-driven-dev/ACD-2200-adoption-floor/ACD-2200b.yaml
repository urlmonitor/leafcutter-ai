doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127b.yaml
    relationship: related
    status: exists
    relevance: >-
      THE ONE FULLY-SPECIFIED INSTANCE OF THIS PROMISE IN THE STORE — READ IT, DO
      NOT RESTATE IT. GE-127b owns the ratchet for file length and its notes already
      state the derivable three-arm shape (grew, refuse; same-or-smaller, allow even
      though still over; no previous size, out of scope) and mark the negative arm
      mandatory because every positive arm is satisfied by an implementation that
      permits everything. That last point transfers here verbatim and is the single
      most useful thing to inherit. What does NOT transfer is the scalar: line count
      is one number per file and most standards are not.
  - path: docs/known-issues/commit-guardian.md
    relationship: describes
    status: exists
    relevance: >-
      The per-gate entries are a catalogue of ratchet SHAPES and the catalogue is
      the point. Four distinct shapes appear across nine entries — a per-file
      scalar; a per-file COUNT of over-limit items where no single scalar exists
      (complexity, untagged tests, fixture bloat); a per-file BOOLEAN (did this
      ticket have test requirements before?); and SET MEMBERSHIP with no scalar at
      all (root files), where the census concludes the answer is a corrected
      allowlist rather than a ratchet. A criterion here that presumes one shape
      fits all four is wrong on three of them.
