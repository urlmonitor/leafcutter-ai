package_surface: false
it_requirements:
- 'The package folder inside a workspace is found from the workspace itself, in this order: the workspace
  root when it is the package (self-host); each submodule path the workspace''s own .gitmodules declares;
  each immediate sub-folder. A folder is the package only when it holds both scripts/build.py and
  templates/scripts/worktree.py. When none is found, a top-level scripts/build.py is still used (the
  existing fixture and legacy layout).'
- A submodule is initialised in the fresh workspace (git submodule update --init -- <path>, run in the
  workspace) only when the main checkout's copy at that path holds scripts/build.py and the workspace's
  copy is not yet the package; no other submodule is touched. The main copy need not carry the full
  package signature, because it may lag the recorded pin at a commit older than
  templates/scripts/worktree.py. The fetched copy is still checked in full. A failed initialisation is
  BOOTSTRAP_FAILED quoting git's own message.
- When no build entry point is found anywhere, the refusal stays BOOTSTRAP_FAILED and its excerpt still
  says scripts/build.py is absent, naming the places searched.
- Proof runs the DEPLOYED maker as a separate process against real temporary git repositories with real
  bare hubs (one for shop, one for the package); fixture builds are stubs, never the package's own
  scripts/build.py (CLAUDE.md 'Tests must not spawn their own build.py').
test_required: true
test_spec:
- name: test_submodule_adopter_workspace_is_ready_and_built_by_the_package
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Shop holds the package as a submodule and has no scripts/build.py; ensure answers ok, the
    submodule is populated in the workspace, and the install marker carries the package's stamp.
- name: test_submodule_is_fetched_when_the_main_checkouts_copy_predates_the_package_signature
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: The main checkout's submodule copy sits at a commit without templates/scripts/worktree.py
    (it lags the recorded pin); ensure still fetches the submodule into the workspace and answers ok,
    built by the package's build.
- name: test_adopters_own_build_entry_point_is_not_mistaken_for_the_package
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: Shop also keeps a failing scripts/build.py of its own; ensure still answers ok, built by
    the package's build.
- name: test_nested_package_folder_adopter_workspace_is_ready
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: The package is an ordinary tracked sub-folder (not a submodule); ensure answers ok, built
    by that folder's build.
- name: test_self_host_package_project_is_still_built_by_its_top_level_build
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: A project that IS the package is still built by its own top-level scripts/build.py and
    answers ok.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer and the state of the workspace afterwards. A direct-import unit test would pass while
  the deployed copy is stale (F13), and only real submodules show whether the fresh clone is populated.
