    relationship: constrains
    status: exists
    relevance: One YAML record per approved decision; published records keep their shape.
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400a-2
  contract: "The kept routing result (decision capability) the goal resumes with."
it_requirements:
  - The goal resumes from kept_routing (the same capability id and version, no re-routing and no second bundle question)
    as one decision from the precedent step, exactly as the split.enabled false run continues after routing.
  - The run is never blocked because of the split; the state is rejected_kept_whole and no part has a work item.
  - Once that decision's record is staged, whole_decision_id names it; the record's question is the goal as submitted
    and no part links to it (split_part null).
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default, which stays false until E3 merges (dec-9925ebf1895222f4,
    see DK-400a-1). A test asserting that no split starts must run with splitting on, or it passes for the wrong
    reason.'
  - The kept-whole item's output is what its one capability produces (leafcutter.decision_report.v1, or leafcutter.evidence_bundle.v1
    for a research step), exactly as in the split.enabled false run, and never leafcutter.decomposition.v1. The
    Decomposition (state rejected_kept_whole) is still exposed in the envelope's split block and its report line.
    This confirms ADR-067 §7 (Open Question 6c).
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_rejected_bundled_split_goes_ahead_as_one_decision
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rejecting the decision-records split resumes the goal at the decision's precedent step with the
      kept routing result and the run not blocked.
  - name: test_kept_whole_record_named_on_split_and_unlinked_to_parts
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: After the one decision is approved, whole_decision_id names its staged record, whose question is
      the goal and whose split_part is null.
test_rationale: The kept-whole path re-enters today's decision flow, so the test checks both the resume point and
  the record that flow stages.
