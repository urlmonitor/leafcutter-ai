  - name: test_bp_1300e_1_v_matching_version_commits_and_names_it
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Stub reports 0.15.15 and the fixture pin is 0.15.15: clean staged file commits; output names 0.15.15 as the version used; --json version_check is 'matched'. (Stubbed, not the suite's real ruff, so a developer whose local ruff differs from the pin gets a deterministic result.)"
  - name: test_bp_1300e_1_v_changing_only_the_ci_install_file_moves_the_required_version
