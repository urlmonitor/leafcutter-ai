    description: "Assert directly against the produced artifact - never via the hooks - that no document exists carrying the obliged field with an example path, an empty list, a value copied from a neighbouring document, or a value derived from the component or title."
  - name: test_supplied_fact_appears_verbatim_and_the_document_passes_the_real_hooks
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: deployed
    description: "Supply the fact with a value that points at something real, git add the produced document in the temporary repo, and run the real check_doc_frontmatter.py and check_diagram_naming.py over it. Assert exit 0 with a non-zero inspected count, and that a deliberately broken control document is rejected by the same hooks in the same harness."
  - name: test_placeholder_path_would_be_blocked_by_the_real_frontmatter_hook
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: boundary
    description: "Hand-author a document carrying a sample path in the path-valued obliged field, stage it, and run the real frontmatter hook. Assert it is rejected. This pins the measurement behind the no-stand-in rule rather than leaving it as an assertion in a notes field."
  - name: test_obligation_set_follows_the_declaration_when_it_changes
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "In a scratch declaration, make a kind that obliged nothing oblige a fact, change nothing else, and request it without the fact: assert it is now refused. Then remove an obligation and assert the same request is now accepted. This is the pair that separates reading the declaration from a private list of three kind names, which is correct today and wrong at the next change."
test_rationale: >-
  This record's first arm is unobservable through the project's own checks, and that is a
  measured fact rather than a caution: nothing in the repository reads requires_frontmatter,
  and of the three obliged fields only related_code is touched by any validator - and only
  when a value is present. A test that produced a document without the fact and concluded
  'the hooks passed, so it is fine' would therefore report success on precisely the defect
  this record exists to forbid. So the obliged field's presence and content are asserted
  directly against the produced artifact, and the hooks are used only where they genuinely
  discriminate: proving a supplied value is acceptable, and proving a placeholder is not.
  The last descriptor mutates a scratch declaration because the three-kind obligation set is
  correct today and a private copy of it passes every single-run assertion.
