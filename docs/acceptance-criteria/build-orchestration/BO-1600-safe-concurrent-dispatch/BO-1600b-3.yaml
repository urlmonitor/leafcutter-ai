criteria: |
  Given a previous supervisor was interrupted or failed mid-commit and its cleanup
    has run, leaving the shared worktree with no truncated object, a readable index,
    no stale index lock, and a released serialization guard
  When the next supervisor reaches its commit phase and acquires the git-write guard
  Then it completes its commit successfully without encountering debris from the
    failed commit (no truncated object, no stale lock, no poisoned index)
  And its commit is present in the repository history afterward
