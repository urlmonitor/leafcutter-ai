notes: |
  THIS IS THE STRUCTURAL HALF OF THE L1 AND IT IS WHAT STOPS A FIFTH LEG REPEATING THE
  FOURTH. Adding the roster to the procedure's prose and to the parity check's code
  separately fixes today's omission and rebuilds the mechanism that produced it. ACS-100i-9
  solved this exact problem and the L1 names it as the shape to reuse.

  THE ADD-A-LEG TEST IS THE ONLY HONEST TEST OF SINGLE-SOURCING. Asserting that the two
  surfaces currently agree passes on two hardcoded lists that happen to match. Asserting
  that a change to one declaration moves both surfaces cannot.

  ONE WORDING RATHER THAN TWO SIMILAR ONES is a criterion and not a nicety. The author who
  skipped a step reads the procedure; the report they receive later has to be recognisable
  as being about that step. Two paraphrases of the same requirement are how a reader
  concludes they are two different requirements.

  MEASURED AGAINST THE DECLARATION AND NEVER AGAINST A COUNT. A parity check that knows
  there are four legs is a third copy of the list wearing a number.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

