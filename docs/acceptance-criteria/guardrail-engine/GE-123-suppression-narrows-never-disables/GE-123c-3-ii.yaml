it_requirements:
  - "The warning trigger is a property of the entry as read and must be computed before any file is scanned. It must not depend, directly or indirectly, on how many findings the entry went on to suppress."
  - "Do not accumulate per-entry match counts, hit flags or last-matched state for the purpose of warning. Introducing that state is what makes the rejected second signal cheap to add later by accident."
  - "The never-matched-this-run signal is explicitly out of scope. If it is ever built, it belongs on a separate, deliberately-run surface and must not be delivered through this commit-time warning."
  - "Reuse the single allowlist-diagnostic convention and keep it non-fatal; nothing in this criterion may change the scan's exit status."
  - "Edit the canonical template at templates/skills/security-scanner/scripts/scan_secrets.py and propagate with build.py; never edit a deployed copy (ADR-001)."
  - "Tests must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root; every fixture allowlist lives under tmp_path/tempfile."
  - "Fixture files must use ordinary source filenames — the per-file scan short-circuits environment-named files and never reads their content."
test_spec:
  - name: test_entry_whose_target_no_longer_has_a_finding_is_silent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A well-formed entry pointing at a real file on disk that no longer produces the finding it was written for draws no warning of any kind, and the run's result is unchanged by its presence."
  - name: test_entry_for_a_file_outside_this_run_is_silent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A well-formed entry naming a file the run never scans draws no warning — most entries have nothing to match in most runs."
  - name: test_only_the_unmatchable_entry_warns_when_nothing_matches_at_all
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "With one unmatchable entry and two never-matched well-formed entries in the same allowlist and no finding anywhere in the run, exactly one warning is emitted and it names the line carrying the appended note — the discriminator proving the rule keys on the entry, not on the outcome."
test_rationale: |
  The first two descriptors are both satisfiable by an implementation that does
  nothing, so on their own they cannot tell a correctly-scoped rule from an absent
  one. The third is the discriminator: placing an unmatchable entry and two
  never-matched entries in one run with zero findings anywhere is the only shape
  that proves the trigger is the entry rather than the outcome. All three run
  against real files on disk through the multi-file scan entry point, because the
  claim is about what a run produces, not about what a predicate returns.
