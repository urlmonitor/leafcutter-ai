id: ACD-1300d-2
title: Notify on a new blocker or delivered proposal without repeated alerts
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given a feature enters a new blocked state or successfully delivers a draft PR
  When that outcome is recorded
  Then a desktop notification identifies the feature and directs the user to its durable inbox item or proposal
  And inspecting unchanged status does not repeatedly notify the same outcome
