assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The allow verdict must be a function of exactly two inputs, the file's undeclared count at HEAD and in the staged content; no project-wide or per-file maximum, percentage, goal or allowlist of files may be read or applied, and none may be added to configuration by this work."
  - "The same-count and lower-count arms must be implemented by the same comparison as the refusal arm in GE-128a-2 (after <= before allows), not by a separate exemption path, so the two arms cannot drift."
  - "An allowed file must produce no violation line for the undeclared tests it still holds; any informational report of the remaining count must not be phrased as a failure."
