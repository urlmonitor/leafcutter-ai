id: ACS-100i-1
title: "Parent ID is derived from child ID by stripping the last segment"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an AC YAML file with id "ACS-300h-1",
  When the validator parses the ID to determine its parent,
  Then it derives the parent ID as "ACS-300h"
    by stripping the last hyphen-delimited segment ("-1").

  And given an AC YAML file with id "ACS-300h-2-i",
  When the validator parses the ID to determine its parent,
  Then it derives the parent ID as "ACS-300h-2"
    by stripping the last hyphen-delimited segment ("-i").

  And given an AC YAML file with id "ACS-100",
  When the validator parses the ID to determine its parent,
  Then it determines the AC has no parent
    because the ID matches the root pattern (PREFIX-NNN with no additional segments).

  And given an AC YAML file with id "ACS-100a",
  When the validator parses the ID to determine its parent,
  Then it derives the parent ID as "ACS-100"
    by stripping the last hyphen-delimited segment ("-a" after PREFIX-NNN).
