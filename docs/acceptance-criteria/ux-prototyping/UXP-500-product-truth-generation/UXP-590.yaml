criteria: |
  As a product owner, I want the links between flows and acceptance criteria — each
  step's implementation status, the by_ac index, and the product_truth back-reference on
  every AC — to be generated by a single writer and validated for drift, so that
  "which steps are built" is always computed from the real AC work_status rather than
  hand-maintained, and CI fails the moment a derived link goes stale.
