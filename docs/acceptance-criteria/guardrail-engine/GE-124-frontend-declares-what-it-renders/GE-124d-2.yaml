notes: |
  ESCAPE 2 of two. Two properties make it an accountable exception rather than
  a bypass, and both are scenarios here:

  1. THE REASON LIVES WITH THE FILE. A reason parked in a central ignore list is
     invisible at review time and rots; a reason in the file header appears in
     the change a reviewer reads and can be argued with there.
  2. THE FILE IS LISTED, NOT DISAPPEARED. An opted-out file that vanishes from
     the report is indistinguishable from a file the check never saw.

  The worked case is the mock-data record `gf-commit-ui-kit-optout` — a
  presentational primitives file whose consuming components declare instead.
  Note this is the same file shape GE-124a-3's markup rule would pull IN, which
  is exactly the pressure the PO designed this escape to absorb.

  What counts as a usable reason is GE-124d-2-i; that an opt-out replaces the
  block rather than sitting beside it is GE-124d-3.

  IT-PO NOTE (2026-08-25). The two escapes have deliberately OPPOSITE storage:
  GE-124d-1's warn list is central because it excuses an area, and GE-124d-2's
  reason is in-file because it excuses an item and must be reviewable in the
  diff. An implementer who unifies them for tidiness destroys this AC.
