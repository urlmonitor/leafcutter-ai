notes: |
  ORIGIN (2026-09-28, user-directed follow-up C1 of the declared-files run). TKT-600a-3's
  notes flagged that ADR-010 names doc_links -> files_touched as THE derivation, while
  TKT-600a-3 makes it the legacy path. Left unamended, the ADR would keep teaching the
  derivation KI-ACS-002 shows to be wrong in both directions, and a reader following the
  ADR would re-introduce it for records that declare their files.

  PLACEMENT. TKT-600a owns the generated files_touched surface (3 of 5 L2s before this one).
  Documentation AC for the decision record, assigned to adr-author (the leaf author of
  decision records). This AC does not edit the ADR itself; the ADR text is the delivering
  work.

  ORDERING. The amendment records a rule; it must not be written as shipped before
  TKT-600a-3 / ACD-1600c-4 ship, hence depends_on. The ADR may state the rule as decided
  and pending implementation if it lands first -- whichever wording it uses, it must not
  claim the legacy derivation is gone.

  AMEND, DO NOT SUPERSEDE. The core decision of ADR-010 (the AC store is the authoritative
  backlog; tickets are derived artefacts) is unchanged; only one field mapping moves. A
  dated amendment section is the ADR convention for that (see ADR amendments elsewhere under
  docs/architecture/adrs/), not a new superseding ADR.
