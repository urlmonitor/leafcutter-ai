work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300a.yaml"
criteria: |
  Given the project's declared vocabulary of kinds of picture and its declared
    tiers,
  When a document is produced for every kind the vocabulary declares as current,
    at every tier that kind can occupy,
  Then every one of those documents passes the project's full set of commit-time
    document checks unmodified, on the same terms as a single document does,
  And the set of kinds covered is taken from the project's own declaration at the
    moment of the observation, so a kind added to that declaration is covered
    without anything else being edited, and a kind whose document cannot be
    produced correctly is a failure rather than an omission,
  And where a declared kind obliges a further field that only the author can
    supply, the document for that kind is either produced complete because the
    request supplied that field, or not produced at all — never produced without
    it,
  And a kind the declaration marks as superseded is covered by producing the
    document its successor's rules require, not by skipping it.
