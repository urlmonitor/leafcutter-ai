notes: |
  IT-PO enrichment (2026-08-12): change_target is prompt (agent-template prose), so
  test_required: false — the read-side-first resolver is a prompt-authoring change with
  no executable behaviour of its own, matching edge child ACD-1600b-1-i. Behaviour is
  exercised end-to-end by the generator (ACD-1600a-1) and the completeness gate.

  Ordering fix (2026-08-12, coverage review): depends_on was [ACD-1600b, ACD-1600a-1]
  but ACD-1600a-1 is the thin generator (phase_acbuild_2b_ticket_demotion) while this is a
  read-side change (phase_acbuild_1_foundation). A phase-1 AC must NOT hard-depend on a
  phase-2 AC — that inverts the read-side-before-write-side invariant (ADR-026). Dropped
  the ACD-1600a-1 dependency; it remains only as a non-blocking expects_from contract note.
  The agent can resolve source_ac independently of thinning (source_ac already exists on
  tickets today), so the dual-read change is buildable first.
