it_requirements:
- Validate complete feature obligations, including positive parent behavior and all required child scenarios;
  a leaf-only negative-test pass is insufficient.
- Bind the diff, checks and evidence to one immutable head/target pair; changed files after validation
  invalidate the package.
- Execute actual required project checks and preserve outputs; missing, failed or zero-inspected checks
  cannot count as passing validation.
- Return repairs to affected ACs under their existing shared counters, preserving the full accumulated
  worktree.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300g-1 (data handoff, not an additional build-order prerequisite): ACEvidence
  {run_id:string, feature_id:string, ac_id:string, obligation_ids:string[], source_revisions:object, workspace_id:string,
  head_sha:string, changed_files:string[], checks:[{command:string, exit_code:integer, evidence_ref:string}],
  outcome:passed|blocked|failed}.'
- 'Runtime interface from ACD-1300f-1 (data handoff, not an additional build-order prerequisite): FeatureCandidate
  {feature_id:string, ancestor_ids:string[], source_revision:string, obligations:[{ac_id:string, parent_id:string|null,
  level:string, criteria:string, revision:string}], remaining_ac_ids:string[], completed_context_ids:string[],
  readiness:object, estimates:object, unanswered_questions:object[], dependency_edges:object[]}.'
- 'Runtime interface from ACD-1300c-1 (data handoff, not an additional build-order prerequisite): ACBudget
  {run_id:string, ac_id:string, attempts_used:integer, implementation_elapsed_ms:integer, remaining_attempts:integer,
  remaining_ms:integer, exhausted:boolean}.'
test_spec:
- name: test_background_worker_full_feature_pass_produces_exact_revision_package
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Execute combined checks on accumulated feature; package contains full diff, all AC/ancestor
    obligation IDs, source refs and one exact validated head.
  covers:
  - ACD-1300g-2
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_negative_children_alone_cannot_validate_positive_parent
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Only negative g3-i-style checks pass while parent positive review behavior lacks proof;
    assert incomplete package and no reviewer dispatch.
  covers:
  - ACD-1300g-2
- name: test_background_worker_combined_check_failure_enters_bounded_repair
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: All leaf checks pass but combined check fails; assert affected AC budget retained and repair
    or blocker, never review-ready.
  covers:
  - ACD-1300g-2
- name: test_background_worker_changed_head_invalidates_validation
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: Mutate head after passing checks and assert stale package cannot be submitted as current
    validation.
  covers:
  - ACD-1300g-2
