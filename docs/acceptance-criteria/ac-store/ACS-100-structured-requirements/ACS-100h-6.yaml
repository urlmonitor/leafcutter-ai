notes: |
  Authored from EPIC-AcPatternEnforcementIsMechanically spot-check FINDING #1.
  The ac-tree-split Pattern C prose previously said moved L2 children keep their
  IDs and only need depends_on/covered_by rewiring. The check_ac_limits.py hook
  (registered as check-ac-tree-limits) counts a parent's children purely by
  ID-string derivation (_derive_parent_id), deliberately not via covered_by or
  depends_on (GE-106), so a covered_by-only Pattern C split did not reduce the
  overcrowded L1's ID-derived count and the commit stayed blocked. This AC makes
  the corrected (rename-based) procedure a tracked, testable requirement.
