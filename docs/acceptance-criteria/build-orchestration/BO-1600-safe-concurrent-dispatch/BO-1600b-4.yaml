criteria: |
  Given the interrupted-commit cleanup behavior described by BO-1600b and its
    behaviors BO-1600b-1, BO-1600b-2, and BO-1600b-3
  When a reader opens the component documentation for this feature
  Then a state diagram shows a commit moving through its states (guard acquired,
    writing objects, updating index, committed) and the transitions taken on
    interruption or failure into a cleanup state that releases the guard, removes
    any truncated object and stale index lock, and returns the worktree to a clean,
    usable state
  And the diagram makes visible that the clean state is the entry point a
    subsequent supervisor's commit relies on
