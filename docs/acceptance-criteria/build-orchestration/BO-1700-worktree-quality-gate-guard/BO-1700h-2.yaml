assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  Check D runs the canary with a bounded timeout; on expiry the invocation is
  killed and the verdict is FAIL. A timeout is an internal-indeterminate outcome
  and must fail CLOSED, never fail open (BO-1700b-1). Implemented in the shared
  probe helper (BO-1700a-1); ADR-001 deployed/template parity applies.
