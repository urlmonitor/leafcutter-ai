notes: |
  Retrospective type-specific refinement of the delivered KM-400a-3-i metadata contract.
  The field review distinguishes required-for-authoring fields from optional authored fields;
  this criterion does not require every AC to contain every optional schema field.
  The reader receipt verifies all 47 schema fields in a validated fixture and records prior
  failure, passing and mutation evidence. Criterion-specific test links were added during IT PO review. This reviewed specification
  does not assert user approval or a newly executed test result.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- 'Canonical AC validation remains authoritative: invalid input fails explicitly, and accepted input is not repaired
  by inserting schema defaults or inferred lifecycle fields.'
- Source containment and independent returned metadata must hold without changing the AC store or its authored requirement/test
  declarations.
