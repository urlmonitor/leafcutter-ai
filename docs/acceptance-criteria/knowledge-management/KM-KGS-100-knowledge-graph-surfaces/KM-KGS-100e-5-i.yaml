criteria: |
  Given the store contains an item lacking component membership whose correct
    component cannot be determined from its content or its location
  When the backfill is run
  Then the item is reported for human review rather than assigned a guessed component
  And the item's frontmatter is left unchanged
  And the report names the item and states why its component could not be inferred
