notes: |
  WHERE THE DECLARATION LIVES: the existing routing table's per-hook rules, extended with
  the author's instructions and the specialist's skills. The reasons:
    - The table already answers "who handles a refusal of hook X" for 18 gates. A
      second table would give two answers to that question, and they would drift.
    - The router and the gating list (BO-210a) already read this file. The remedy then
      sits next to the gating list rather than in a file the router never opens.
    - The hooks manifest stays the registry of which checks exist. Completeness is a
      cross-check between the two, the same parity shape GE-126d uses.
  Rejected alternatives: (a) a remedy field on each hooks-manifest entry. Registration
  and remedy would sit together, but the agent map already in the routing table would be
  duplicated. (b) An agent hint printed in each gate's own output. That needs code in
  every gate (1 of 67 does it today) and gives a second source that can disagree.

  "THE AUTHOR CLEARS IT" IS A VALID DECLARATION. Not every refusal needs a specialist,
  and GE-126d records that exclusion is legitimate. A declaration may say no specialist
  is brought in. It must still give the author instructions. What is refused is having no
  declaration at all.

  THREE CHILDREN. Presence (a-1), validity (a-2) and reaching the author (a-3) fail
  independently. Each can be complete while another is broken.

  FOLLOW-UPS, NAMED SO THEY ARE NOT SPECIFIED HERE:
    - Whether a declaration naming a specialist for a gate that is absent from
      blocking_hook_ids should be refused, since nothing would ever bring that specialist
      in. The natural end state collapses the roster into "gates whose declaration names a
      specialist", but that amends BO-210a and needs its own decision.
    - check-complexity's printed agent hint. Once the declaration exists it is a second
      source that can disagree with it. Retire the hint, or derive it from the declaration.
    - Writing declarations for the 49 currently undeclared gates.
