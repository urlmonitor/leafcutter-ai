assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The check must join the shared root resolution the rest of the family already imports rather than keeping a corrected private walk. A point fix that repairs the private walk is the fourth patch of a shape this component has patched three times and leaves this check out of step at the next layout change."
  - "The private root walk must be DELETED, not left in place as a fallback. A retained fallback preserves the working-directory dependence for exactly the case the shared resolution fails on, which is the case that produced KI-CG-018."
  - "No silent fallback to a relative store location is permitted. When the shared means resolves nothing, the check reports that and names the directory it started from - substituting a guess is what lets it answer about a place it never located."
  - "If joining the shared resolution introduces a new import for the deployed hook, that module must be in the build deploy manifest in the same change and the DEPLOYED copy exercised. A source-tree-only import raises ModuleNotFoundError at hook runtime and, once this gate is required, blocks every merge (CLAUDE.md, 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest')."
  - "Every assertion must be made against the copy the build deploys under .leafcutter/. The workspace-parent case is a property of the deployed layout and does not reproduce from the source tree."
  - "Must not change the exit status of any commit-time invocation that passes today; in pre-commit the working directory is already the repository root and that path must be untouched."
  - "Error handling must follow the four rules in CLAUDE.md; an unresolvable root is an expected condition to be reported, not an internal error to fail open on."
test_spec:
  - name: test_three_working_directories_resolve_one_identical_root
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Deployed check invoked by absolute path from the working-copy root, from the workspace parent that carries a project marker but no store, and from a deep subdirectory - all three report the same resolved root, compared to each other rather than to a literal."
  - name: test_all_three_working_directories_refuse_the_same_staged_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Each of the three runs refuses the same violating record by name. The resolved-root string alone does not cover this - a check can report a root it did not read from."
  - name: test_the_workspace_parent_run_no_longer_reproduces_the_2026_08_25_silence
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "The exact working directory KI-CG-018 reproduced from - the ADR-001 workspace parent carrying CLAUDE.md and no docs/acceptance-criteria/ - now resolves the store below it and refuses the staged violating record."
  - name: test_unresolvable_root_is_reported_and_never_silently_substituted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "In a tree where the shared means can resolve no root, the check names the directory it started from and reports the failure; it does not fall back to a relative store location and does not report an ordinary pass. A seeded violating record placed at the relative fallback location is NOT judged, proving the fallback is gone."
test_rationale: |
  Asserting the resolved root is the obvious test and it is insufficient in a specific
  way the criteria call out: a check can print a root it never read from, which is
  exactly the class of self-report this tree bars. Pairing each root assertion with a
  refusal on the same staged record is what binds the string to an inspection. The
  fourth descriptor is written negatively on purpose — a seeded violating record at the
  old relative fallback location must NOT be judged — because a retained fallback is
  invisible to every positive assertion and is the most likely form the cheap fix takes.
  The third descriptor reproduces the recorded working directory specifically, so the
  original observation is closed rather than merely made unlikely.
delivers_to:
  agent: documentation-expert
  contract: "The resolved root reported by every run, obtained through the shared family resolution rather than a private walk, plus the unresolvable-root report naming the starting directory. GE-126b-4 states that every run reports the root it resolved; that statement is only true once this record lands."
expects_from:
  ac_id: GE-126b-1
  contract: "The unconditional pre-exit statement, which carries the resolved root as one of its two facts. This record supplies the value that field reports and makes it independent of the caller's working directory."
