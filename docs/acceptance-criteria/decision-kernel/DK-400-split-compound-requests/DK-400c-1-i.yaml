assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400c-1
  contract: 'The converted proposal before the cut: parts in proposed order with their depends_on, after the quote
    check.'
it_requirements:
  - 'The offered parts are the first split.max_parts parts of the run order (dependency order, ties broken by proposed
    order: the same ordering function the scheduler uses in DK-400e-1), so the offered set is always dependency-closed.
    The others become not_covered entries in proposed order, each with its id, text and quote, reason ''beyond the
    five-part cap'' and no depends_on.'
  - Offered parts are shown in proposed order. not_covered entries are read-only; the answer schema refuses any
    review, edit or tick that names them.
  - The gate wording (template text) tells the person that the request holds more than five parts and that the not-covered
    ones can be asked again as a request of their own.
  - The run's remaining part allowance (split.max_parts_per_run) caps the offer the same way; fewer than two parts
    left within the allowance means no split (the DK-400c-3 path).
  - split.max_parts is bounded to 2..5 by the config schema, so the product invariant of 2 to 5 parts cannot be
    configured away.
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_seven_parts_offer_five_and_list_two_not_covered
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Seven quoted, independent proposals yield p1 to p5 offered and p6 and p7 listed read-only as not
      covered with text, quote and the more-than-five notice.
  - name: test_cut_keeps_offered_set_dependency_closed
    target_dir: tests/kernel/split/
    framework: pytest
    type: unit
    angle: boundary
    description: When p3 waits for p6 the offered five are p1, p2, p4, p5 and p6, p3 and p7 are not covered, and
      no offered part depends on a not-covered one.
  - name: test_answer_naming_not_covered_part_refused
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: A gate answer that ticks or edits p6 is refused and the gate stays open.
  - name: test_part_allowance_caps_the_offer
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: With three parts already offered in the run and split.max_parts_per_run 5, a second split of four
      proposals offers two parts and lists two as not covered.
test_rationale: Which five are offered is a deterministic rule, so it is pinned by a unit test of the cut with a
  crossing dependency, while the criterion test checks the gate a person actually sees.
