id: BO-1500f-2-i
components:
  - build_orchestration
readiness: draft
priority: high
title: "Two runs that ask for a workspace at the same moment are never granted the same one"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given two authoring runs for the same component request an isolated workspace at the same
    moment, with neither request having finished before the other begins,
  When both requests are resolved,
  Then at most one of the two runs is granted any given workspace,
  And the run that is not granted it obtains a workspace of its own instead of joining the
    first run's,
  And no ordering or interleaving of the two requests results in both runs holding the same
    workspace,
  And a run that cannot be granted a workspace of its own halts before authoring any
    criterion, rather than proceeding without one.
depends_on:
  - BO-1500f-2
doc_links:
  - path: templates/workflows-js/plan-feature.js
    relationship: modifies
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    workspace_claim:
      type: object
      description: "{ run_id: '<owning run>', claimed_at: '<timestamp>', outcome: granted | already_claimed }. The claim on a workspace must be established in one indivisible step, so two simultaneous claims cannot both report granted for the same workspace."
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "BA-supplied schema minimum — the IT PO refines this block during technical enrichment."
    - "A check-then-create sequence with any gap between the two steps is the defect: both runs can pass the check before either creates. The claim must be a single atomic operation whose failure mode is 'already claimed'."
    - "Test by driving two claims concurrently (two processes, not two sequential calls) against the same target; a sequential test cannot observe the race."
delivers_to: null
