notes: 'Thresholds copied from audit 2026-11-16 section 3.4 (S1) and the user request. Open point for the user: with
  selection_uncertain kept out of the accuracy denominator, a selector that answers selection_uncertain on every hard
  case can still reach 90% over decided cases. This record shows the uncertain share next to the accuracy so that is
  visible, but it sets no ceiling on it because none was given. A ceiling needs a user decision before the thresholds
  are frozen. Draft. OPEN QUESTION FOR THE USER (decided at the final plan-feature gate, not by the BA or the IT PO):
  should the selection threshold also cap the share of selection cases answered selection_uncertain, and if so, at
  what percentage? Until the user answers, no ceiling exists, and the S1 thresholds must not be frozen with one
  invented. BA 2026-11-17: KM-500a-4-ii added to depends_on so it matches the it_requirements reliance on all-real
  results; no cycle, because KM-500a-4-ii depends only on KM-500a-4 and KM-500a-4-i. IT PO 2026-11-17: expects_from
  KM-500a-4-ii added to match that depends_on (producer side added to KM-500a-4-ii delivers_to). expects_from
  KM-500a-4-x added, because the scorer scores against the frozen S1 oracle and the lock-fixed policy hash; the BA
  should add the matching depends_on KM-500a-4-x. No cycle: KM-500a-4-x depends only on KM-500a-4, KM-500a-4-iv and
  KM-500a-4-v. The selection_uncertain ceiling question above stays open for the user; the IT PO did not decide it, and
  the S1 lock cannot be written until it is answered. DECIDED 2026-11-17 at the final plan-feature gate by the user:
  the selection_uncertain share is capped at 10% of the selection cases (at most 10%); above it the selection
  threshold fails whatever the decided accuracy. Added to criteria, it_requirements, test_intent and test_spec;
  the open question above is closed.'
