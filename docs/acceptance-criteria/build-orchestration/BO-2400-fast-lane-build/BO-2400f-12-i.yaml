notes: |
  This exists because "refuse" has a plausible-looking wrong implementation: refuse,
  but first mark the offending member done or drop it from the set so the next run
  gets further. Either would make the lane appear to recover and would put a criterion
  nobody built into the done column — phantom-done through the front door, which
  KI-BO-013 names explicitly as the thing not to do.

  The release assertion is the subtler half. Every other pre-commit halt branch in this
  family MUST release (BO-2400f-10); this branch must NOT, because it precedes the
  claim. An implementer following the sibling pattern will add the release call, and it
  will look correct in review — it is only wrong in the presence of a concurrent run,
  which is exactly the case no reviewer simulates.
