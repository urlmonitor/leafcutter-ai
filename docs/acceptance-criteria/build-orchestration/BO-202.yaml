test_required: true
test_spec:
  - name: test_composite_with_an_unfinished_child_goes_to_in_progress
    target_dir: tests/ac_store/
    type: integration
    angle: criterion
    description: "In a real temporary AC store, an L2 composite with work_status todo whose covered_by lists two child AC ids, one still todo (the DK-400a-1 shape), is run through mark_ac_done.py --ac <id> --test-root <root>. Its work_status becomes in_progress, the run succeeds, and the output names the unfinished child."
  - name: test_composite_with_all_children_done_and_covered_goes_to_done_and_passes_real_done_proof
    target_dir: tests/ac_store/
    type: integration
    angle: real_artifact
    description: "Every child is done and carries a covers tag under the test root. The composite becomes done, and the real check_done_proof run over the same store accepts it."
  - name: test_leaf_is_marked_done_as_before
    target_dir: tests/ac_store/
    type: integration
    angle: boundary
    description: "A leaf, whether its covered_by is empty or holds only test-file paths, is marked done with today's message and exit. The composite rule does not affect it."
  - name: test_already_done_unproven_composite_is_refused_and_never_downgraded
    target_dir: tests/ac_store/
    type: integration
    angle: failure
    description: "A composite already done, with a child that is not done and proven, is refused with a non-success exit naming each unfinished child, and the file is byte-identical afterwards."
  - name: test_in_progress_composite_rerun_is_idempotent_until_children_finish
    target_dir: tests/ac_store/
    type: integration
    angle: boundary
    description: "Re-running on an in_progress composite whose children have not changed leaves the file byte-identical. Once every child is done and covered, the next run sets done."
  - name: test_mark_time_and_commit_time_agree_on_what_is_composite
    target_dir: tests/ac_store/
    type: integration
    angle: seam
    description: "For the same store and covered_by shapes (child ids, test paths, mixed, empty), mark_ac_done.py and check_done_proof classify each AC as composite or leaf identically and name the same unproven children."
  - name: test_in_progress_write_changes_only_the_work_status_line
    target_dir: unit_tests/ac_store/
    type: integration
    angle: real_artifact
    description: "The in_progress write is anchored and atomic. Only the work_status line changes; every other byte (comments, key order, block scalars) is identical."
test_rationale: "The gate is a prompt, so its decision is only provable where it executes: in mark_ac_done.py, the one writer the gate's Step 3a calls. The cases run the real script against a real temporary store and check the result with the real check_done_proof, so the agreement between the mark-time and commit-time composite rules is shown, not asserted. tests/test_ac_fulfillment_gate.py checks only the template's frontmatter and does not cover this. The template wording (Steps 2b, 2f and 3a) is reviewed, not unit-tested."
