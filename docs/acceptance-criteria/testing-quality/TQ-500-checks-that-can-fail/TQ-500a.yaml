title: "Work that cannot show the usual proof is asked for an equivalent one"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  No free pass when the ordinary before-and-after evidence is impossible.

  Where the usual demonstration — it objected before the work, it accepts after
  — cannot exist because the test is correct and passing the moment it is
  written, an equally strong substitute is required instead: break the guarded
  behaviour on purpose, show the test objects, put it back. Which of the two
  applies is stated by whoever does the work, so it is never guessed on their
  behalf and never quietly skipped.
