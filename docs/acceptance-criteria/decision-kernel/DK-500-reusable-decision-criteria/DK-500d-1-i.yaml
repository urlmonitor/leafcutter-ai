criteria: |
  Given a published category limited to the component ux_prototyping, a published category for the decision type planning, and cat-1dc11c5a2ffa7310, for design and not limited to a component,
  When a design decision scoped to decision_kernel is framed,
  Then of these three only cat-1dc11c5a2ffa7310 is offered,
  And when a design decision scoped to ux_prototyping is framed, both cat-1dc11c5a2ffa7310 and the ux_prototyping category are offered.
