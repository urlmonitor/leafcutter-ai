title: "The type check compares each changed file at the pull request's head with the same file at its merge base, and fails only on what the pull request adds"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Background:
    Given a pull request whose changed Python files lie in the type check's scope,
    And each changed file is type-checked twice with the whole repository around it:
      once as it is at the pull request's head, and once as it was at the merge base
      of the pull request and its target branch (under its old name when it was renamed),
    And an error is identified by the file's head path, its error code and its
      message, never by its line number.

  Scenario: Only what the pull request adds is charged
    Given a changed file that had type errors at the merge base,
    When the pull request leaves those errors in place, even on moved lines,
    Then the check passes and reports them as existing errors left untouched.

  Scenario: A new type error fails the check
    When the pull request adds a type error to a changed file,
    Then the check fails, naming the file, the head line, the error code and the
      message, with a one-line remedy to fix the type rather than silence it.

  Scenario: A new silencing comment fails the check
    When the pull request raises the number of `# type: ignore` comments in a
      changed file,
    Then the check fails, naming the file and the lines carrying the added comments.

  Scenario: Removed errors count in the pull request's favour
    When the pull request removes type errors that existed at the merge base,
    Then the check reports how many it removed and never fails because of them.

  Scenario: An empty or broken run is never a pass
    When the pull request changes no Python file in scope, the check says it
      inspected nothing and type-checked nothing,
    And when the type checker cannot run, the check fails and says it could not check.
