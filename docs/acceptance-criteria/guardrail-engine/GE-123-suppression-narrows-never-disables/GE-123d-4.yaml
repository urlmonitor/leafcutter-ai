assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Exclusion must arise from absence from the closed location and kind lists, never from an explicit deny list. An implementation containing a hard-coded exclusion for the how-to area, the configuration area or source directories satisfies the letter of the first three scenarios and fails their intent. The observable test of this is a cost invariant: adding a sixth prose location must require exactly one edit — an entry on the location list — and no edit to any exclusion anywhere."
  - "The verdict for a staged file must be computed only from that file's own repository-relative path and its own kind. No run-level or set-level state may influence it; a cache keyed on anything coarser than the individual path is forbidden, because the fourth scenario is precisely the case that distinguishes a per-file decision from a per-run one."
  - "The default for a path that is on no list is to report. This must be exercised against a directory name that appears nowhere in the implementation, so that the default cannot be confused with a hard-coded three-directory deny list passing by coincidence."
  - "The location gate must be anchored at the repository root, not satisfied by a same-named directory at any depth. This is the same constraint GE-123d-2 carries and must be met by the same shared mechanism, not solved a second time here."
  - "The how-to area's exclusion is a recorded decision, not an oversight. Whatever holds the location list must make it possible to see that the how-to area was considered and left off — a bare list of five strings with no accompanying reason invites the next author to add it by analogy, which is the failure this AC exists to prevent."
  - "This AC changes the boundary of one rule only; no other rule's behaviour in any location may change."
  - "ADR-001 parity: edit the canonical copy under templates/ and verify through the build.py round-trip."
delivers_to:
  agent: documentation-expert
  contract: "The boundary as an enumerated, closed rule — five named locations, four admitted file kinds, everything else treated as source — which GE-123d-4-ii writes down in the reference so that a reader can tell whether a given file is exempt without reading the check."
expects_from:
  ac_id: GE-123d-2
  contract: "The closed location list and closed file-kind list that together grant the exemption. This AC is the boundary arm on that grant: it fixes what the lists exclude and proves exclusion is by absence from the list, not by a judgement about the file."
test_spec:
  - name: test_credential_shaped_comment_in_a_source_file_is_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged Python file whose code comment carries the sentence that is exempt in a ticket file produces a finding and exit status 1 from the canonical pre-commit check"
  - name: test_markdown_outside_the_named_locations_is_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same sentence in a staged Markdown file in the how-to area is reported — an admitted kind in an unlisted location is not exempt"
  - name: test_yaml_in_the_configuration_area_is_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same sentence in a staged YAML file in the configuration area is reported — an admitted kind in an unlisted location is not exempt, and nothing a running program reads is prose"
  - name: test_mixed_staged_set_yields_exactly_three_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "All four files staged together in one temporary git repository and checked in a single invocation produce exactly three findings — the source, documentation and configuration files, none for the ticket file — and exit status 1"
  - name: test_a_directory_on_no_list_defaults_to_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "An admitted-kind file in a top-level directory named nothing like any prose location and nothing like any of the three excluded areas is reported and blocks — exclusion is by absence from the list, which a three-directory deny list cannot reproduce"
test_rationale: "The fourth entry is the load-bearing one and cannot be written any other way: only four real files staged together and checked in a single invocation of the real entry point can distinguish a per-file decision from a per-run one, which is the substance of this AC. Calling the exemption predicate four times proves four independent answers, not that one run produced them. The fifth entry exists because the first three, taken alone, are satisfied by an implementation that hard-codes exclusions for source, the how-to area and the configuration area — the exact shape the AC's notes call out as satisfying the letter and failing the intent — so the suite needs one directory that appears nowhere in the implementation to show the default really is report. All entries run the canonical templates/ copy as a subprocess in a throwaway git repository. The deployed angle is deliberately not charged: the project convention pins these tests to the canonical templates/ copy per ADR-001, with parity enforced by build.py and the hook-parity check."
