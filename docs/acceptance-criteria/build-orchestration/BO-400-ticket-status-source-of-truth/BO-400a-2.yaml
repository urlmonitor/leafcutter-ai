id: BO-400a-2
title: "ticket-supervisor sets status to done when all agents complete"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file with frontmatter `status: in_progress`
    and every entry in the `agents:` map is in the set {signed_off, not_needed},
  When ticket-supervisor determines the ticket is done-eligible
    (the pending list of needed agents is empty),
  Then it invokes set_ticket_status.py with --ticket <path> --status done
  And the script updates the ticket's frontmatter to `status: done`
  And the ticket file remains in its current folder
    (it is NOT moved to a done/ subfolder)
  And the script stages the modified ticket file via git add.
