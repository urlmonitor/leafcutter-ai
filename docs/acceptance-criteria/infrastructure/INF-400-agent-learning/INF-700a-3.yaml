assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "SATISFIES the how-to entry in INF-700a's documentation_triggers. Dispatch how-to-author for the body. The reference-doc entry is INF-700a-4's; keep the two apart — this document is task-shaped (do these steps, see this outcome), the reference is definition-shaped."
  - "THE COMMAND MUST BE RUNNABLE AS WRITTEN IN BOTH LAYOUTS. The routing step lives at scripts/knowledge/harvest_learnings.py in a package checkout and is deployed elsewhere in a consumer install; a how-to that gives one invocation and does not say which layout it assumes will be wrong for half its readers. This repository has already shipped a pre-drive check whose documented path was one directory too high and reported a missing file on every correctly-provisioned worktree for months."
  - "DO NOT GIVE A DEFAULT INVOCATION THAT POINTS AT A FILE THAT IS NOT THERE. Until INF-400c-4 lands, the routing step's default sink is debugging/logs/knowledge_emissions.jsonl, which has never existed, while records are in debugging/logs/agent_telemetry.jsonl. Name the sink explicitly in every example. INF-700c-3 carries the same warning for the reference; this is the same trap on the task surface."
  - "THE CONFIRMATION STEPS MUST END AT AN ARTEFACT, not at an exit code. 'Open the destination file and find the learning text' is the check that distinguishes a routing step that ran from a routing step that worked, and it is the check that would have caught the placeholder substitution INF-700c-1 removed."
  - "THE LAST CLAUSE IS CONDITIONAL AND MUST BE WRITTEN TO EXPIRE. While INF-700a-1 is unbuilt, ADR-034's standing rule applies — capture is not automatic and any document implying otherwise is wrong. Write that statement so the change that wires the first completion path also removes it, rather than leaving a document that describes a manual process the package no longer has."
  - "THE WIRED AND EXCLUDED LISTS ARE DERIVED, NOT RETYPED. INF-700a-1-i puts the single list in a top-level section of config/guardrail_gates.yaml, enforced by a build-time guard. This how-to must point at that section as the authority and name the paths only as illustration, saying so explicitly. A second typed copy of a five-item list in prose is how the two go out of step, and the guard cannot see a doc."
  - "THE ROUTING-STATUS STEPS MUST NAME A COMMAND, NOT A FUNCTION. INF-700a-2's answer is required to be reachable from a production entry point precisely so this document can give a runnable step. If at writing time the only way to obtain the answer is an import, that is a gap in INF-700a-2 to report back, not a step to write down."
  - "THE EXIT STATUSES THIS DOCUMENT CITES CHANGE UNDER INF-400c-4-iv. After that AC lands, an absent sink returns the no-work status rather than the sink-unreadable status, and exit 1 narrows to a sink that exists and cannot be read. Do not describe a recovery step that treats a missing sink as an error to fix — on a fresh clone it is the normal state."
test_required: false
test_rationale: |
  A how-to produces no executable behaviour, so there is nothing for
  test-writer to make fail. Its two mechanically checkable clauses are covered
  elsewhere or not covered by any gate that reaches it: the commands it gives
  are the ones INF-700a-1's and INF-700a-2's behavioural tests already exercise,
  and the "every path resolves in both layouts" clause is a review obligation
  because no existing gate parses prose-named paths in docs/ — the same gap
  INF-700b-5 records for the reference document. Asserting either by grep would
  pass on a guide that names the right command and describes the wrong outcome.
  test_required is set explicitly so test-writer skips with an accurate reason
  rather than the omission reading as an unauthored contract.
