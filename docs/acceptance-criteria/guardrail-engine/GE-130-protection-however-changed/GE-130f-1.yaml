notes: |
  FINDINGS THIS RECORD CLOSES (GE-130f notes, observed 2026-09-17): the guard signals its block
  in a form a PreToolUse call does not treat as a block, and its folder mapping names another
  project's folders, so nothing in this repository matches. Both must be fixed for the first
  Then clause to hold; the second project clause is the discriminator for the mapping fix (a
  mapping rewritten to this repository's folder names passes the first scenario and fails the
  second -- this is a portable package).

  REUSE, DO NOT RESTATE: the declaration shape, the entry-point rule and the four-value record
  are GE-120f-1's; the separate-working-copy harness is GE-120c-1's. This record only names the
  two inputs for this guard and requires the observed refusal.

  PAIRING: the acceptable input is in the same run on purpose -- a guard repaired into refusing
  every code edit satisfies the first Then clause alone (GE-120f-1-ii's shape).

  declares_side_effect: false -- the Then clauses assert that an edit is or is not carried out
  and what a refusal and a record say; no durable-effect phrase from the derivation list.
  IT-PO ENRICHMENT (2026-09-25).

  ASSIGNMENT CONFIRMED: python-coder. Both mechanisms are code - the refusal form and the map
  source - and the second scenario needs a built second project, which is harness code.

  PACKAGE SURFACE. This record creates session_hooks_manifest, a NEW TOP-LEVEL KEY in
  templates/scripts/commit_guardian/commit_guardian.json, which _package_surface_registry
  watches on its document top level ("" / mapping_keys). It is therefore declared, with the
  structured spec the declaration obliges. GE-130f-2 adds an ENTRY INSIDE that section, one
  level deeper, which is not watched - it denies the surface explicitly instead.

  WHY NOT templates/settings.json AND WHY NOT hooks_manifest.hooks. settings.json is parsed by
  the host and its hook entries are a fixed {type, command, timeout} shape; verification state
  does not belong in a file the user edits and the host validates. hooks_manifest.hooks holds
  COMMIT-time gates - members are counted by BP-1600a-2's census and emitted onto pre-commit
  entry lines, and a PreToolUse session guard put there would be miscounted as a commit gate.
  The new section keeps "held where the check is registered" honest by DERIVING from the
  registration: each entry names the settings.json matcher and command it corresponds to, and
  the run reconciles the two rather than trusting a second copy.

  THE DUPLICATED SOURCE IS THE DEFECT, NOT ITS CONTENTS. DOC_MAPPING is a second copy of a map
  docs/components.json already owns (primary_code plus detail_ref). The requirement is to read
  the owned source and DELETE the duplicate, not to correct the duplicate's entries.

  ORDERING CAVEAT FOR THE USER. currently is written by GE-120f-1's liveness runner, which is
  not built. This record's expects_from names GE-120f-1, but depends_on (BA-owned) lists only
  GE-130f. Either GE-120f-1 is sequenced first, or this record delivers the first writer for its
  own entry and GE-120f-1 absorbs it when it lands. Not decided here. [DECIDED 2026-09-25 (user): GE-120f-1 is built first; the depends_on edge enforces the order.]

  LOCATION DECIDED 2026-09-25. The user confirmed that session-hook verification state lives in
  a new top-level session_hooks_manifest section of
  templates/scripts/commit_guardian/commit_guardian.json - decided 2026-09-25.
