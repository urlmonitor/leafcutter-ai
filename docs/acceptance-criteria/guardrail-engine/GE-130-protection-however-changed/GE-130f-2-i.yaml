id: GE-130f-2-i
title: A whole-file write into a gated folder is checked -- the small-edit allowance never applies to
  a change that carries no before-and-after text
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a folder the guide-read guard gates, whose nearest guide has not been read in this session,
  When a new file inside it is created with the whole-file writing tool, and separately an
    existing file inside it is replaced whole with that tool,
  Then neither change is carried out, and each refusal names the file and the guide,
  And the allowance that lets a small edit through without the guide being read applies only to
    a change whose size the guard can measure from the request, so a whole-file write is never
    let through as a small edit because it carries no before-and-after text,
  And given the guide is then read in the same session with the reading tool,
  When the same two writes are made again,
  Then both are carried out with no refusal.
