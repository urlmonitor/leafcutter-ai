notes: |
  DECIDED 2026-09-17 (user) -- STOP ONLY ON POSITIVE ATTRIBUTION; NEVER STOP ON "CAN'T TELL".
  Three outcomes, kept apart:
    positively attributed to this caller   -> stops (GE-130c-2)
    looked, could not attribute            -> named, explained, run continues (this record)
    could not look at the files at all     -> stops (GE-130c-1-i)
  Resolves the earlier tension with GE-120e ("a block is always about something you actually
  did"): this caller is never stopped for a change that may be another agent's. The finding is
  not lost in a long unattended run -- GE-130c-2-ii persists it and lists it at the end of the
  drive. Whether weak attribution is acceptable at all is gated by GE-130d-3's rollout threshold.

  SCOPE: this policy applies to the documentation guard and the guide-read guard only. The
  task-lock guard (inline_work_guard) is unaffected: under the build lock it stops any writing
  command regardless of attribution, except the build workflow's own dispatched agents
  identified by caller identity (GE-130a-4).

  Named mutation that turns ONLY this record red: stop the run on an unattributed finding
  (GE-130c-2 and GE-130c-1-i stay green).

  SUPERSEDED 2026-09-17: the earlier OPEN paragraph (fail closed on an unattributable change) is
  replaced by the decision above; the old text is quoted in amended_by.

  declares_side_effect: false.
