title: "Doc-frontmatter transform fails open on parse uncertainty and no-ops when the docs layout is absent"
component: guardrail-engine
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given the doc-frontmatter transform hook is invoked,
  When the staged file's frontmatter cannot be parsed unambiguously (malformed YAML, ambiguous
    boundaries, or an unexpected structure),
  Then the hook makes no edit, leaves the file untouched, and exits with code 0 (fail-open),
  And when the project has no docs/ layout at all (the path the config targets does not exist),
  Then the hook no-ops silently and exits with code 0,
  And in neither case does the hook block the commit or raise an unhandled error.
