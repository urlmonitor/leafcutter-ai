it_requirements:
  - Same sibling module as BO-2500a-8-i (templates/scripts/commit_guardian/_ac_test_rationale_validators.py);
    build after BO-2500a-8-i, in the same lane.
  - 'NORMALISATION IS ONE FUNCTION: case-fold, replace every punctuation character (Unicode
    category P*) with a space, collapse every whitespace run to one space, trim both ends.
    Punctuation is REPLACED, not deleted; deleting it turns ''Docs-only'' into ''docsonly''
    and the Given''s two texts would no longer match. The same function is the uniqueness
    check BO-2500a-8-iv runs before showing a batch.'
  - 'Comparison population: every record in the store whose test_required is exactly False
    and whose reason is non-empty by the shared predicate (an empty reason is BO-2500a-8-i''s
    refusal, not a duplicate). Read it from the store index check-ac-schema already builds
    (_ac_store_index.get_ac_index, the shared mtime-keyed cache), never a second store walk.
    A staged record''s staged text replaces its stored text, so a record is never compared
    with its own previous version.'
  - Only staged records are refused; stored duplicates are reported by nothing until they
    are changed. The refusal names the changed record, the field test_rationale and every
    other record carrying the same normalised text, sorted by id.
  - 'Performance: one pass builds a normalised-text-to-ids map over about 3,200 records; the
    rule must add under one second to check-ac-schema on a warm index.'
  - 'Fail closed: if the store index cannot be read, a staged test-free record is refused
    with the reason that uniqueness could not be confirmed; it is never let through silently.'
  - 'check_ac_schema.py is 723 lines, over check-file-size''s 400-line limit, and may not
    grow net: the rule lives in the sibling module and the call-site change in check_ac_schema.py
    (passing the store index through) stays net non-growing.'
test_required: true
test_intent:
  - clause: the record is refused, because its test_rationale is identical to DK-210b-3's
      once both are normalised
    needs_test: true
    reason: The duplicate refusal is the rule itself, and only the Given's two differently
      written texts show normalisation is applied before comparing.
  - clause: normalising folds letter case, collapses every run of whitespace to one space,
      ignores punctuation, and trims both ends
    needs_test: true
    reason: Each normalisation step (case, whitespace, punctuation, trim) is a separate way
      two copies can differ, and each needs its own case, including punctuation replaced rather
      than deleted.
  - clause: the refusal names the changed record, the field test_rationale, and the other
      record that already carries the same text (DK-210b-3)
    needs_test: true
    reason: The message must name the other record, or the author cannot find which reason
      they copied.
  - clause: when the same text is carried by more than one other record, the refusal names
      every one of them
    needs_test: true
    reason: A rule that stops at the first match would name one record; a text shared by three
      records shows all are named.
  - clause: a test_rationale that differs from every other record's after normalising is accepted,
      even when it shares most of its words with one
    needs_test: true
    reason: A refuse-on-overlap rule would pass every refusal test, so a near-identical but
      different reason must be shown accepted.
  - clause: the comparison is made against every record in the store declared with test_required
      false, not only the records in the change being committed
    needs_test: true
    reason: Comparing only within the commit would miss the commonest case, a copy of a stored
      record's reason; the stored-record case shows the whole store is read.
  - clause: 'only records declared with test_required false take part: the test_rationale
      of a record whose test_required is true or absent (the justification of its test_spec)
      is never compared and never refused by this rule, even when it is identical to another
      record''s test_rationale'
    needs_test: true
    reason: test_rationale has a second meaning on records with a test_spec, and identical
      texts there must be shown never compared or refused.
  - clause: two records in the same change that carry the same normalised text are both refused,
      each naming the other
    needs_test: true
    reason: Two copies arriving in one commit have no stored original, so only a same-change
      pair shows both are refused and each names the other.
  - clause: a stored record left unchanged by the commit is not refused by it, even if its
      text duplicates another stored record's; it is refused the first time it is itself changed
    needs_test: true
    reason: 'Diff scope is behaviour: stored duplicates must not block an unrelated commit,
      which a store holding a duplicate pair shows.'
