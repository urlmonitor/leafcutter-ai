criteria: |
  Given incomplete evidence, unverified caller claims or instructions embedded in source text,
  When initial context is handed to intent classification,
  Then the enrichment outcome distinguishes what was established from what remains unknown,
  And source text or registered capabilities do not become user approval or proof of runtime availability,
  And a missing personal preference remains a question for the user.
