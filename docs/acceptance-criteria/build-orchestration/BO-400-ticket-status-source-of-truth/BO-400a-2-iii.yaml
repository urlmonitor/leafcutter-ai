assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the ticket-completion decision in build-feature.js and its twin in build-ticket.js, which must stay identical"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_done_recording.py"
  constraints:
    - "VERIFY BY EXECUTION, NOT BY GREP. A test that searches the workflow source for a guard condition passes on an implementation where the guard is computed and then ignored -- the precise failure fast-lane-build.js shipped. Each negative case must be driven through the real workflow via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and must assert that NO completion write was performed."
    - "FAIL CLOSED ON UNREADABLE EVIDENCE. An implementation that treats a record it cannot read as 'no outstanding phases found' converts an I/O failure into a done state. Absence of a readable record is the strongest not-done signal there is, and must be handled as its own case, not folded into the empty-list path."
    - "ONE NEGATIVE CASE PER CONDITION. Four conditions are named in the criteria -- held back before dispatch, dispatched and blocked, dispatched and unrecorded, record unreadable. A single combined test leaves three of them unexercised, and the observed run exhibited the third condition specifically."
    - "MUST LAND WITH BO-400a-2-ii. The positive write and this refusal are one change. Landing the write alone produces a driver that records done for tickets whose gates never ran -- turning an inverse-phantom-done defect into a real one."
delivers_to: null
expects_from:
  ac_id: BO-2900f-1-i
  contract: "The adjudication that a phase reporting success without leaving a sign-off is a failed phase -- the input that makes the third case here decidable"
test_spec:
  - name: test_phase_held_back_before_dispatch_blocks_the_done_record
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Drive a ticket whose needed phase is held back before it is dispatched and assert the run performed no completion write and reported the ticket as not completed, naming the outstanding phase."
  - name: test_phase_reporting_a_blocker_blocks_the_done_record
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Drive a ticket whose needed phase returns a blocker and assert no completion write occurred and the blocker's phase is named in the run's report."
  - name: test_phase_reporting_success_without_a_signoff_blocks_the_done_record
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The condition observed in the production run: a phase returns success but leaves no sign-off. Assert no completion write occurred."
  - name: test_unreadable_ticket_record_leaves_the_state_untouched
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Make the ticket record unreadable at the moment the completion decision is taken and assert the run wrote nothing and reported the ticket as not completed rather than as done."
  - name: test_a_fully_signed_off_ticket_still_records_done
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Control case: the same driver, one ticket with every needed phase signed off, asserted to record done -- so the four refusals above are attributable to their conditions and not to a driver that never writes at all."
test_rationale: |
  Every case here is an absence, and absences are exactly what a source-reading test
  cannot distinguish: the broken driver and the fixed one both contain completion
  code. Each descriptor therefore executes the real workflow and asserts on whether a
  write happened. The control case is not optional -- without it, a driver that was
  simply reverted to never writing at all would pass all four refusals and look
  correct, which is the state the store is in today.
