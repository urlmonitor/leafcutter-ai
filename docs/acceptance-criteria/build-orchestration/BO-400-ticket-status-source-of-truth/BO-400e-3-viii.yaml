id: BO-400e-3-viii
title: "With nothing to close, finalization closes nothing, says so and finishes; when the set cannot be worked out it closes nothing, says which part it could not establish, and stops before the merge -- never a success-shaped 'closure completed'"
component: build-orchestration
components:
  - build_orchestration
  - finalize
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given branch "feat-docs-only" changed no ticket and no acceptance criterion since it left main
  When finalization reaches its closure step
  Then no record changes status and no closure commit is made
    And the run reports "nothing to close: this branch changed no tickets or acceptance
      criteria", together with the point on main the branch was compared against
    And the run carries on to the merge and finishes; "nothing to close" does not stop it

  Given the branch "quick-fix-docs" has no recorded built-for ticket and changed no ticket and
      no acceptance criterion since it left main
  When finalization reaches its closure step
  Then the outcome is "nothing to close", exactly as for "feat-docs-only", and the run carries
      on to the merge and finishes
    And the missing built-for record is not reported as a problem, because no record could
      have been closed anyway

  Given the single-ticket branch "feat-close-x" was built for "TICKET-X.md", which it changed
      but which already reads done
  When finalization reaches its closure step
  Then no record changes status and no closure commit is made
    And the run reports "TICKET-X.md" by name as already done

  Given the single-ticket branch "feat-close-x" was built for "TICKET-X.md" but changed only
      "TICKET-Q.md", in passing
  When finalization reaches its closure step
  Then no record changes status and no closure commit is made
    And the run reports "nothing to close: this branch did not change the ticket it was built
      for (TICKET-X.md)", and names "TICKET-Q.md" as changed but not closable

  Given the point where "feat-close-x" left main cannot be determined -- main is not available
      locally, or the two share no history in the local copy
  When finalization reaches its closure step
  Then no record changes status and no closure commit is made
    And the run stops before the merge to main, as it does for a declined confirmation
      (BO-400e-3-vii), and does not merge leaving the records open
    And the run reports that it could not establish the point where the branch left main
    And this is reported even if the branch changed no tickets or acceptance criteria, because
      without that point the run cannot know whether it did
    And it does not fall back to any other way of choosing records
    And it does not report the closure as completed

  Given the single-ticket branch "feature/close-x" changed the ticket "TICKET-X.md" since it
      left main, and no built-for ticket is recorded for "feature/close-x"
  When finalization reaches its closure step
  Then no record changes status and no closure commit is made
    And the run stops before the merge to main and does not merge leaving the records open
    And the run reports that it could not establish which ticket the branch was built for
    And it prints the fix: the line
      `git config branch.feature/close-x.leafcutterTicket <path-of-the-ticket>`
      followed by an instruction to run finalization again
    And it does not fall back to treating "TICKET-X.md", or any other ticket the branch
      changed, as the built-for ticket
    And it does not report the closure as completed
  Because "nothing to close" and "could not tell what to close" call for different actions by
    the person finishing the feature: the first is a finished feature, the second is a feature
    whose tickets would land on main still open with no route left to close them but another
    pull request, so the run halts while a re-run can still close them.
