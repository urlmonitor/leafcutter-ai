notes: |
  THE LARGEST KIND BY A DISTANCE — 463 of the 660 not-yet-done requirements declaring a
  craft outside the roster declare this one. Whatever proof is chosen here is applied
  more often than the other four put together, so a weak choice here is most of the
  damage this tree could do.

  THE PRODUCT OWNER NAMED THIS ALONGSIDE A SCREEN as obviously beyond the written-page
  floor, and it is the harder of the two, because a prompt genuinely IS a file of text
  and the temptation to prove it by reading that text is overwhelming. It must be
  resisted for the reason this repository already knows: a check that inspects source
  text passes unchanged when the text is defined and never reached, and this project
  has shipped that exact failure — instructions present in a template that no surface
  ever loaded, green throughout.

  THE PROOF IS DELIBERATELY TWO-PART, AND THE FIRST PART IS THE AFFORDABLE ONE. That
  the consuming surface loads the prompt is cheap, mechanical and catches the dominant
  real failure, which is an orphaned instruction. That the behaviour differs in the
  described direction is the part that costs. What is NOT available is dropping the
  second part and keeping only the first: an instruction that is loaded and ignored is
  the second-commonest failure of this kind, and the first part alone cannot see it.

  THIS IS THE EXPENSIVE KIND, AND THE TREE ORIGINALLY GUESSED THE OPPOSITE (amended
  2026-08-31, finding F2). BO-3500c-2-iii assumed the screen was the hard one; verified,
  the screen is affordable today and this one is not. A model-consumed instruction's
  differential needs live model calls, is not deterministic, and needs a credential. And
  the exposure here is enormous: 463 records declare this craft, while only THREE of the
  project's sixty registered crafts have an evaluation set to compare against.

  SO THE TWO CASES ARE SPLIT, AND THAT IS THE SUBSTANCE OF THIS AMENDMENT. An instruction
  with a REPEATABLE consumer — one that behaves the same way every time on the same input
  — can have its differential taken cheaply, deterministically, with no credential, and
  can be a required check. An instruction consumed ONLY BY A MODEL cannot, and its honest
  endings are different: it costs money per proof, and where there is no credential or no
  stable answer it must be refused up front rather than finished on the load check alone.
  Collapsing the two would either make the cheap case needlessly expensive or, far more
  likely, make the expensive case quietly pass on the cheap case's proof — which is the
  borrowing BO-3500c-2 forbids and BO-3500c-1's receipt shape is built to expose.

  HOW MANY OF THE 463 FALL INTO WHICH CASE IS BEING MEASURED SEPARATELY and is not a
  blocker for this criterion. The criterion is written so that the answer changes the
  SIZE of each case and not the specification of either. If the measurement comes back
  showing most of the 463 have a deterministic consumer, this kind stops being the
  expensive one; if it comes back the other way, the third and fourth scenarios are where
  the cost lands and the refusal is already specified.

  DIFFERENTIAL, NOT ABSOLUTE, and that is the design. Asking what an agent produces
  from a prompt is not reliably repeatable. Asking whether its observable behaviour
  differs with the instruction present and absent is a comparison, and a comparison can
  be made stable where an absolute assertion cannot. Stated this way so the criterion
  does not force a flaky test.
