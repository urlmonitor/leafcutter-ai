notes: |
  THE LAST CLAUSE IS THE ANTI-VACUITY CONTROL ON THE CARVE-OUT, and it is the reason
  this AC has four pieces of work rather than three. Every clause about D, E and F
  asserts that nothing is reported. A reader that reports nothing at all satisfies
  all of them — it is a negative control in exactly the sense KI-TQ-010 describes,
  green on arrival and unable to fail. Piece G is what makes the scenario able to
  object.

  This AC is therefore a worked example of the tree's own subject, and its own
  falsifiability answer should be the substitute kind: the natural alteration is to
  widen the legacy carve-out until it swallows G, and these clauses must object
  under it.

  BOUNDARY. Adds no behaviour. It is satisfied only by a regression test over
  TQ-500b-1's reading and must not be closed by a change that special-cases the four
  fixture records.
