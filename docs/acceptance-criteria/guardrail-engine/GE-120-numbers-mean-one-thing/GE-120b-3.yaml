id: GE-120b-3
title: "An author with no prior knowledge can find out how to get a number"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an author who is adding a new artifact of one of the four numbered kinds and does not
    know how numbers are allocated in this project,
  When they follow the how-to guide,
  Then for each of the four namespaces the guide gives the concrete step that yields a free
    number — the command to run or the list to read — and the step succeeds when followed
    literally from a clean checkout,
  And it states where the new artifact must be placed for that number to be recognised,
  And it states what the author will see if they skip the step, quoting the wording the
    enrolment check actually emits, so the block message and the guide are recognisably the
    same thing,
  And it tells an author who has already been blocked what to do from that position, without
    requiring them to undo their work first,
  And the guide is reachable from the documentation index.
