notes: |
  Satisfies the sequence-diagram entry in BO-3200c's documentation_triggers.

  Drawing the person as a participant is the whole point. In the arrangement this replaces, the
  gate had a participant in that position and it was a specialist — and every diagram of it
  would have looked correct, because the shape of the interaction was right and only the
  identity was wrong. Requiring the diagram to show no specialist in the answering position
  states the correction where a future reader will see it before repeating it.

  Showing the pause path as an explicit alternative matters as much as the happy path: the
  pause is the behaviour that was missing, and a diagram that shows only the answered case
  leaves the unanswered case to whatever the implementer assumes.

  IT-PO ENRICHMENT NOTE (2026-08-26). One consistency obligation the criteria do not mention:
  docs/architecture/diagrams/c3-002-interactive-pause-resume-sequence.md already draws a pause
  and resume. This diagram must fit with it rather than become a second, competing picture of
  the same substrate — and if the existing one becomes wrong once a decision point can pause, it
  must be corrected there. Two diagrams that disagree about the same mechanism is how the
  topology records drifted in the sibling tree.
