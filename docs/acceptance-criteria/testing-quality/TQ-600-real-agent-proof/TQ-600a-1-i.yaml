title: "Left switched off -- the default and every CI run -- no real agent is asked and no such case counts as passed"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given the test suite run the way it runs by default, and the way continuous integration
    runs it, with the live-dispatch switch not set,
  When the run reaches the cases that ask a real agent,
  Then no agent is asked on behalf of any of them,
    And each is reported as not run because the live-dispatch switch is off, naming the
    switch,
    And none of them is reported as passed.

  Given the live-dispatch switch set explicitly to its off value,
  When the run reaches the same cases,
  Then the outcome is the same as with the switch not set: nothing is asked, each case is
    reported not run naming the switch, and none is reported passed.

  Given the live-dispatch switch set to a value that is neither its on value nor its off
    value, for example "true" or "yes",
  When the run starts,
  Then the run fails with a message naming the switch and the value it was given,
    And no agent is asked,
    And no case that asks a real agent is reported as not run or as passed.
