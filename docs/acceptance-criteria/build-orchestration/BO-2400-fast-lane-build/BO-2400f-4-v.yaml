implemented_by: []
change_target: pipeline
risk_surface: internal
notes: |
  Without this criterion, adding a changelog step buys nothing: a step that fails quietly
  puts the lane back exactly where KI-BO-001 found it — a pull request that cannot merge,
  reported as a success. The observed defect is not "no changelog step existed", it is
  "the run could not tell the difference between delivered and blocked".
