id: GE-130e-2
title: A session-time protection against changing files that watches only the editing tools or only shell
  commands is refused, including one added later
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the census GE-130e-1 produces,
  When the coverage check runs,
  Then a hook declaring itself a protection against changing files that is registered for the
    editing tools but not for shell commands, or for shell commands but not for the editing tools,
    is named with the way of changing a file it does not watch, and the check fails,
  And a hook so declared that is registered for both is not named, established in the same run,
  And a commit-time check enforcing the same rule does not count as watching either way,
  And given a new hook declaring itself a protection against changing files is added, registered
    only for the editing tools, and nothing else changes,
  When the coverage check runs again,
  Then that hook is named without any change having been made to the coverage check.
