id: BO-2900f-1-ii
components:
  - build_orchestration
  - supervisor_system
title: "A gate recorded more than once is adjudicated from its latest entry, and the duplication is surfaced rather than erased"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a work item whose record carries two entries for the same delivery gate,
    because that gate was reached twice within one drive -- retried after an
    adjudicated failure, or re-entered when the drive resumed,
  When the drive reads the record back to decide that gate's verdict,
  Then the verdict for that gate is taken from the LATEST entry for it and from no
    other entry,
    And when the earlier entry says the gate passed and the later one says it failed,
      the gate is adjudicated failed -- a stale pass never outlives a later failure,
    And when the earlier entry says the gate failed and the later one says it passed,
      the gate is adjudicated passed -- a retry's success is never discarded in favour
      of the failure that preceded it,
    And the drive reports the duplication to the operator, naming the gate and how
      many entries that gate carries, so a gate that was recorded twice is visible in
      the run's own output rather than silently tolerated,
    And the drive leaves the record exactly as its authors wrote it: it does not
      delete, rewrite, reorder or collapse an entry it did not itself write,
    And a gate carrying exactly one entry is adjudicated from that entry and is not
      reported as duplicated,
  So a gate reached twice still yields one correct verdict, and the audit trail that
    produced that verdict survives intact.
depends_on:
  - BO-2900f-1
