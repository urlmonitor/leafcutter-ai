title: "AC-coverage phase gates sort before commit/pull-request in the phaseOrder"
component: build-orchestration
status: active
created_by: "quick-fix: build-feature.js/build-ticket.js phaseOrder AC-gate ordering"
criteria: |
  Given the phaseOrder array in build-feature.js (and its twin build-ticket.js)
  When getPriority() is used to sort a ticket's needed phase agents
  Then ac-validator, ac-fulfillment-gate, and live-surface-tester each resolve
    to a canonical priority index that is strictly less than the index of commit
  And commit resolves to an index strictly less than pull-request

  Given a ticket whose agents map includes ac-validator or ac-fulfillment-gate
  When the per-ticket phase loop orders the phases by getPriority()
  Then those AC-coverage gates run before the commit and pull-request phases
  And the bug symptom ("AC-coverage/fulfillment gates fire after the commit/PR
    they were meant to gate") must not occur

  Given the phaseOrder arrays in build-feature.js and build-ticket.js
  When both files are compared
  Then their phaseOrder agent sequences are identical (the twin invariant holds)
