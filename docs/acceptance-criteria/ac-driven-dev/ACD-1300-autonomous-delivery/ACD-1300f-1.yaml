id: ACD-1300f-1
title: Admit complete approved S or M feature groups only
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given canonical parent relationships place two remaining required executable leaves under feature STATUS
  And every remaining required leaf and its inherited L0/L1/L2 obligations are approved and have no unanswered questions, and the executable work units are estimated S and M
  When the background worker evaluates the backlog
  Then STATUS is considered as one complete candidate containing both leaves without a separate feature opt-in
  And completed leaves are retained as context rather than selected again
  And the grouping follows the canonical L1 hierarchy rather than text similarity or a convenient subset
  And each executable leaf retains the required behavior inherited from its L1 and L2 ancestors, so a negative L3 scenario cannot replace its parent positive behavior
  And a draft or revoked required ancestor prevents admission even when its descendants are approved
