criteria: |
  Seamless specialist lifecycle — knowledge grows, legacy agents retire gracefully.

  Once specialists are generated, they do not become stale. Best-practice
  knowledge improves with every package update, old hardcoded agents are
  absorbed into the new system without losing any accumulated wisdom, and
  projects using the previous layout migrate automatically when they upgrade.
  You never have to manually maintain agent configurations or worry about
  losing capabilities during the transition.
