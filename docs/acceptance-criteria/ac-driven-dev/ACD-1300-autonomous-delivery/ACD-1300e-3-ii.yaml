notes: |
  WHY THIS IS NOT ALREADY ACD-1300e-3. The parent says WHO may perform the six record
  operations. It is silent on the SHAPE of the request. That gap is load-bearing: the
  one-command executor ADR-070 names (shell-runner) declines any command line that chains
  commands with &&, ||, ;, a pipe or command substitution (ADR-070 sec. 1.3). The pause-store
  command today is built as `cd <workspace> && REPO_ROOT=$(git rev-parse ...) ... || ...`.
  Switching the executor while keeping that line turns an intermittent decline into a
  certain one: every pause would be declined by charter. The 2026-10-25 decline gave the
  compound line as its second reason. Named mutation for the test designer: keep the
  compound line and switch only the agent -- this record must go red, the parent need not.

  EXECUTOR NAME -- FLAG FOR THE IT PO (not authored here; executor choice is the IT PO's).
  ACD-1300e-3's it_requirements (2026-10-16) choose command-step-runner, and its
  delivers_to contract to ACD-1300e-4/-5 names it too. ADR-070 sec. 2.2/2.3 reserves
  command-step-runner for the fast lane's command steps and sends every other workflow shell
  step to shell-runner, and this run's request names shell-runner. The criteria here are
  written so that both the parent and this record are satisfied only by the non-fast-lane
  executor. ACD-1300e-3's it_requirements and delivers_to need amending by the IT PO.

  STORE LOCATION. Removing the `cd` and the `$(git rev-parse --git-common-dir)` subshell
  removes the thing that anchors the store today. The location must still resolve to the
  repository-anchored store (ACD-2100a-4, ACD-1300e-3-i): a maker workspace is a clone, so its
  store is the workspace's own; a linked worktree's store is the main repository's.

  BO-2300a-1-ii is already status superseded_by, superseded_by ACD-1300e-3 (2026-10-16); its
  pinned test unit_tests/workflows/test_bo_2300a_1_ii.py still asserts worktree-agent and is
  amended when ACD-1300e-3 is built (parent it_requirements). No edit to BO-2300a-1-ii is needed.

  OUT OF SCOPE (from the request): the stage-end script steps (rule check, test design,
  approval holds, hand-back findings) -- tickets/00_inbox/TICKET-20261021-PlanFeatureScriptStepsToShellRunner.md;
  and the pause-store dispatches in finalize-feature.js.
