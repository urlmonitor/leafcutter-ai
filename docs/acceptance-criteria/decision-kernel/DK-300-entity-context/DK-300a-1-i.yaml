id: DK-300a-1-i
title: "Unpublished aliases and shared spellings do not invent equivalence"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given the glossary declares "Decision Kernel" without declaring "kernel" as an alias,
  And the spelling "reference" occurs in ordinary prose and in an explicit document-type cue,
  When those mentions are recognized,
  Then "kernel" receives no invented glossary definition and ordinary "reference" receives no document-genre card,
  And the type-cued mention can resolve to the owner's declared genre,
  And equal spellings in two owner namespaces remain distinct unless an owner declares their equivalence.
