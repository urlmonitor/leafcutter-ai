criteria: |
  Given the published reference for a project's record of what the build put there --
    where it lives, what it accounts for, and how to read it,
  When a reader who does not have the producing package's own workspace in front of
    them follows that reference against a project outside the producing package's own
    parent folder that received a real build,
  Then following the reference locates that project's record and reads it, and what the
    reader observes matches what the reference said to expect,
  And the reference states, in terms the reader can act on without reading any build
    source, that the record belongs to the project the build wrote into, travels with
    that project, and remains readable after the project is moved or copied,
  And the reference states what the build does when it cannot produce the record, and
    what a check does when it finds no readable record, so a reader can tell an inert
    check from a passing one,
  And the reference is demonstrated to be falsifiable, before it may be accepted: when
    the same procedure is followed against a deliberately non-portable install -- one
    whose record was filed with the producing package, and one whose record is keyed to
    a location it is not being read from -- the reader reaches the failure signal the
    reference documents, rather than silence or a passing-looking result,
  And that same procedure, followed again against the good install, reaches the
    documented success signal, so the failure reached above is attributable to the
    broken install and not to a procedure that cannot succeed,
  And the reference is checked by following it against real installs, never by
    confirming that a document with the expected heading exists.
