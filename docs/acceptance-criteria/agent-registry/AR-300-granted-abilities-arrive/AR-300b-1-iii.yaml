assigned_agent: python-coder
estimated_complexity: S
change_target: code
risk_surface: contract_boundary
it_requirements:
  - "THE SUB-AGENT SECTION IS A REGISTERED PREPARATION, NOT A NAMED ONE. It reaches the gate only through the slice-3 contract in scripts/agent_preparation_delivery.py (pinned by unit_tests/prompt_assembly/_ar_300b_support.py's docstring): the compiler computes it via compute_preparation('spawn_allowlist', agent, builder) and records it via register_preparation(preparation_name='spawn_allowlist', agent=<compiled prompt file stem>, content=<section text>, destination_offered=True); verify_preparations_delivered(compiled_roots, expected_prompt_count=..., preparations=None) then judges it like every other preparation, and refuse_on_undelivered_preparations turns any finding into a non-zero build exit. The gate module must contain no spawn-specific branch, constant or name -- that is the 'same check' clause."
  - "An agent permitted no sub-agents registers NO spawn_allowlist preparation (docstring A: an ungranted preparation is not registered), so it can never be reported for lacking the section. Do not express this as a filter inside the gate."
  - "A computed-but-unregistered spawn section is reported with cause `unregistered` by the computation ledger -- compute through compute_preparation, never call the builder directly, or the forgot-to-register guard cannot see it."
  - "Findings are per (agent, preparation, platform_root) across <output_root>/agents/ and <output_root>/gemini/agents/, resolved from the declared output root, never .claude/agents. A clean run lists 'spawn_allowlist' in preparation_kinds and counts it in inspected_preparation_kinds."
  - "Tests that strip a section COPY the shared reference layout's compiled roots into a temp dir and mutate the copy (the gate is runnable against a supplied compiled tree); they never mutate the shared layout and never spawn their own build.py."
  - "Consequence for AR-300b-1-i (clean path on the real population): it cannot pass until the sub-agent section is delivered (AR-300a-5) AND no unresolvable declared sub-agent remains (AR-300c-5-iii) -- architect-review-deep is removed by decision 10, but conflict-resolver-deep is a measured second unresolvable target still awaiting a user decision."
test_spec:
  - name: test_missing_sub_agent_section_in_one_root_fails_naming_agent_preparation_root
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: deployed
    description: "With one permitted agent's sub-agent section stripped from its gemini-root compiled prompt only (declaration and registry correct), the verdict has a finding naming that agent, preparation 'spawn_allowlist' and that platform root, and the build seam returns 1."
  - name: test_sub_agent_and_abilities_findings_come_from_the_same_verdict
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Stripping both an abilities section and a sub-agent section yields both findings in ONE verify_preparations_delivered verdict; renaming the spawn preparation in the registration alone changes the reported name with no gate edit."
    must_catch:
      - "a spawn-specific check written beside the generic gate"
      - "the gate iterates a hard-coded list of preparation names"
  - name: test_clean_run_counts_spawn_allowlist_among_preparation_kinds
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "On a compiled tree where every permitted agent carries its section, the verdict has no spawn_allowlist finding and lists 'spawn_allowlist' in preparation_kinds."
  - name: test_agent_permitted_no_sub_agents_is_not_reported
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: unit
    angle: failure
    description: "An agent with no or empty spawn_allowlist has no registered spawn preparation and produces no finding, though its compiled prompt has no section."
test_rationale: >-
  The 'same check' clause is the one a careless implementation fails while passing
  every other clause, so the two-findings-one-verdict descriptor carries must_catch
  for a parallel check and for a name list. Stripping in one root only proves the
  per-root granularity. The negative descriptor keeps the gate quiet on the
  majority of agents, which permit no one.
delivers_to: null
expects_from:
  ac_id: AR-300a-5
  contract: "One register_preparation(preparation_name='spawn_allowlist', agent, content, destination_offered=True) per permitted agent per compile, computed through compute_preparation."
