    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "PREREQUISITE (component-inference gap — user-confirmed): module-component VALIDITY resolves against docs/components.json (code-component ids, e.g. 'commit_guardian'), but components.json has NO directory/path-pattern field. The directory_patterns field lives only in docs/acceptance-criteria/index.yaml, whose ids are a DIFFERENT namespace (e.g. 'guardrail-engine'), so index.yaml patterns cannot be used to infer a components.json id. Therefore component auto-inference is NOT implementable until one of these lands: (a) a directory/primary_code-pattern-based inference is added to docs/components.json, or (b) a components.json<->index.yaml id bridge is added. UNTIL a prerequisite lands, the module-component autofix MUST PROMPT for the component (the GE-117e-1-i prompt behavior) rather than infer it. Do not silently insert a components.json id from an index.yaml directory_patterns match."
  - "AC-reference auto-inference (public symbol / decision-history entry) is UNAFFECTED by the above: when the surrounding commit context supplies a single AC, resolve it against the AC store via the shared _load_ac_by_id and insert it; on re-check the same commit produces a satisfied verdict."
  - "The autofix EDIT is applied to the staged working tree (module docstring gets the component name; symbol docstring or new decision-history entry gets the AC ref) and the observable success criterion is behavioral: re-running the guardrail on the corrected staged commit yields a satisfied verdict for that item."
  - "Ambiguous / no-confident-inference paths (multi-match, no-match, no single contextual AC) PROMPT and never fabricate — specified in GE-117e-1-i."
  - "Fail-open on INTERNAL error; edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together and verify via build.py round-trip (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "The applied-declaration edit (component name into module docstring; AC ref into symbol docstring or new entry) that turns a blocking verdict into a satisfied one on re-check"
expects_from:
  ac_id: GE-117d-1
  contract: "The block report identifying each offending file/surface/missing value that the autofix acts on"
