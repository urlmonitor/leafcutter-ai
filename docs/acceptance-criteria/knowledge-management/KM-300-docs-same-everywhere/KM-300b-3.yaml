test_spec:
  - name: test_generated_map_matches_host_neutral_golden
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Generates the map for a fixed fixture docs tree (with a table entry, a single-file entry, mixed-case names and non-ASCII text) and asserts the bytes equal a checked-in golden map under unit_tests/fixtures/ that uses LF, UTF-8 and forward slashes. The same golden is used on every CI host, which is the cross-OS byte-identity proof."
  - name: test_fresh_checkout_mtimes_do_not_change_map
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Commits the golden map in a temp git repo, clones it, sets every file mtime in the clone to now, runs the generator CLI and then the transform-doc-index hook, and asserts the map is byte-identical and git status --porcelain reports no change to docs/INDEX.md."
  - name: test_map_contains_no_host_specific_values
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Asserts the generated map contains neither the temp repo's absolute path, nor getpass.getuser(), nor socket.gethostname(), nor today's date unless it came from the existing front matter."
  - name: test_changed_doc_is_reflected_after_refresh
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Changes one page's description in the clone, refreshes, and asserts the map differs from the golden only in that row."
test_rationale: "CI cannot run one test on two operating systems, so a host-neutral golden map is the shared reference: every host must reproduce it byte for byte, which is exactly the cross-OS round trip. The fresh-clone mtime step is what separates this AC from KM-DBF-014 (same machine)."
notes: |
  Cross-OS extension of KM-DBF-014, which proves byte identity on ONE machine
  (done). This AC is the round-trip across hosts and checkouts. The fresh-clone
  condition is deliberate: KM-DBF-014's notes say per-doc dates must never come
  from the wall clock — a date taken from file modification time would pass
  KM-DBF-014 on one machine yet differ on every fresh clone.

  KM-DBF-014 adoption: the KM-300 L0 note suggests re-parenting KM-DBF-014
  under KM-300b. Not done by this BA run: KM-DBF-014 lives outside this feature
  folder (out of this run's write scope), and its compound KM-DBF prefix
  derives to parent "KM-DBF", so it would need an explicit `parent: KM-300b`
  field plus depends_on/covered_by. KM-DBF-014 is referenced here via
  depends_on instead.
