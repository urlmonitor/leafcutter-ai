notes: |
  THIS IS THE CLAUSE MOST LIKELY TO ROT, SO IT IS ITS OWN RECORD. Today there are
  three hand-kept copies of "what CI lints": the CI workflow, the manual
  run_ci_local.py mirror (already drifted), and BO-570-3's planned runner. A
  commit-time hook with its own copy would be the fourth. Parity has to come from
  one definition that every runner reads, CI included. Two copies plus a test
  comparing them is weaker, because the test is one more place to update.
  User decision 2026-10-09: the scope is declared in ONE place in package
  configuration, and this repository's CI reads that same declaration.

  THE EXCLUSION TRAP, FOR THE IT PO. The linter, given explicit file paths, ignores
  the configuration's exclude list unless told to force-exclude. A hook that passes
  staged filenames straight through would therefore refuse exactly the templates/
  files CI skips. The first scenario is the arm that catches this. An
  implementation that only ever runs on in-scope files never exercises it.

  The "widening" and "kernel rule set" arms are the anti-list arms: no
  implementation holding its own written-in tree or rule list can pass them.
