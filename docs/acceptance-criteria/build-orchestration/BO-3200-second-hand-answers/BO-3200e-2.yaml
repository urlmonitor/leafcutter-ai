notes: |
  THE PARENT L1 IS EXPLICIT: "fail-closed is correct and is not being weakened here. Halting on
  an unknown is the right behaviour. The requirement is only that the halt be REPORTED as an
  unknown rather than as a finding, because the two lead a reader to entirely different places."

  This AC exists because BO-3200e-1 is one careless step away from being read as permission to
  continue. Changing a substantive refusal into an unknown is a change of wording; if the
  unknown also stops being a refusal, the tree has replaced a false verdict with a false pass,
  which is strictly worse — the run proceeds on something nobody verified.

  THE SECOND SCENARIO IS THE CONSUMED-IN-CONTROL-FLOW CLAUSE required by CLAUDE.md "Gate /
  Workflow ACs — Verify Behaviorally, Not by Grep". A report that says one thing while the value
  a caller branches on says another is the false-success shape this repository has hit
  repeatedly, including the cancelled run that returned an ok status having authored nothing.

  PARTIALLY SHIPPED, DELIBERATELY NOT RE-SPECIFIED: PR #565 already made the workflow runtime
  refuse to count an undetermined agent result as a completed phase, ticket or epic. That is the
  runtime's side. This criterion is the check site's side — the check must produce an outcome
  the runtime can refuse, at every place a caller reads it, including callers that are not the
  workflow runtime.

  The third scenario pins the pair together so neither can be satisfied by collapsing the two
  reports into one.

  IT-PO ENRICHMENT NOTE (2026-08-26). The non-runtime consumers are the concrete remainder after
  PR #565 and are easy to miss when reading that PR as "already done": commit-guardian hooks and
  CI gates read check outcomes directly and each has its own pass/fail branch. An undetermined
  value that the runtime refuses and a hook treats as truthy is a false pass at the layer that
  actually blocks merges.
