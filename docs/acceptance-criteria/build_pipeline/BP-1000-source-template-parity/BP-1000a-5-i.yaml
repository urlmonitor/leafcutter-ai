  - "Idempotent / deterministic verdict: the build outcome must be identical whether or not a stale scripts/feedback/ working copy is present — the feedback resolution and preflight depend solely on the tracked mirror, never on leftover working-tree files."
  - "This is an end-to-end acceptance over BP-1000a-5's relocation; it asserts the observable (build succeeds from tracked-only files) and must not re-specify the relocation mechanism (owned by BP-1000a-5)."
