notes: |
  WHY THIS IS WORTH PINNING SEPARATELY. The 2026-08-18 workaround did not fail
  loudly; it disappeared. The person who applied it had every reason to believe the
  defect was fixed, and the next build silently restored the broken behaviour with
  no trace in any output. One line naming the file at install time would have closed
  that gap, and it costs nothing.

  THE THIRD CLAUSE KEEPS IT USABLE. Every generated file is replaced on every
  install; a message for each one is noise that gets filtered and then ignored. The
  statement is for files that actually diverged, which is also what makes the
  behaviour testable -- run the installer twice, change one file in between, and
  assert the statement appears exactly once and names exactly that file.

  THE INSTALL STILL WINS. This does not make the installer refuse or preserve the
  local change; build output is generated and must be regenerated. The requirement
  is that the loss is announced, not prevented.

  2026-08-25 (it-po): the shared-determination requirement is the load-bearing one and
  it is the reason this record has an expects_from edge at all rather than standing
  alone. Its depends_on already carries ACD-2100d-2, so the edge is visible to the
  build sequencer.
