notes: |
  CONCEPT B. The ticket is demoted from unit-of-work to grouping/scoping container.
  SUPERSESSION INTENT: this directly replaces the PREMISE of ACD-400b ("the
  generator produces a fully WIRED ticket -- per-ticket agents map + Agent Contracts
  + sign-offs -- that an agent completes"). Under this model an agent completes ACs,
  not tickets; a ticket is done when its grouped ACs are done. Do NOT edit ACD-400b
  here -- ACD-400b already carries a partial-supersession note and governance handles
  the amend/supersede step. Complements ACD-1600a (thin ticket references its AC):
  ACD-1600a says the ticket does not COPY the spec; this L1 says the ticket is not
  the UNIT OF WORK at all -- it is only a grouping of valuable features.
  Review gap (2026-08-12): added ACD-1800c-5 (the sign-off parity gate accepts AC-side
  sign-offs and requires no body ## Sign-offs section on a thin grouping ticket, GAP 2a) --
  the exact gate-parity concern already flagged in ACD-1800c-1's it_requirements.
