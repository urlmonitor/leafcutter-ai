notes: |
  EVERY GUARANTEE IN THIS L1 IS SATISFIED BY A TOOL THAT DOES NOTHING. That is the
  single most important design constraint here and it is why this is ONE record
  with several Then clauses rather than three or four tidy separate ones. "Left
  the parked records alone", "was byte-stable" and "changed no done-proof verdict"
  are all trivially true of a no-op. Split across separate runs, or separate ACs
  proved against separate fixtures, the safety half becomes vacuous and the tests
  will be green on a tool that has been quietly disabled. The first Then — a
  repair that genuinely happened — is what all the others are anchored to, and it
  must be in the same invocation.

  THE TWO "UNCHANGED VERDICT" CLAUSES ARE THE FALSIFIABLE PART AND ARE
  DELIBERATELY BOUND TO TWO DIFFERENT EXISTING READERS. Binding to what the
  done-proof reader actually concludes, and to what the back-link check actually
  concludes, ties the outcome to how the coverage field is really consumed rather
  than to a property of the file. This is the same construction ACS-1300a-3 uses
  for its equivalent claim; it is inherited, not re-derived.

  WHY THE DONE-PROOF CLAUSE IS THE ONE WITH TEETH. Re-verified 2026-09-08: ten
  parents in the current population hold coverage lists whose every entry resolves
  to nothing, and appending a child id to such a list flips the record from leaf to
  composite. ACS-1400c-2 keeps the pass away from those records; this clause is
  what catches it if some other repair reaches them by another route.

  BYTE STABILITY IS NOT A COSMETIC PREFERENCE AT THIS STORE'S SIZE. The existing
  repair tool's fallback branch rewrites a whole file through a load-and-dump round
  trip, which preserves every value while reformatting quoting, key order and line
  wrapping. Applied across the store that churns everything and makes the diff
  unreadable, which is how a wrong write hides inside a right one.
