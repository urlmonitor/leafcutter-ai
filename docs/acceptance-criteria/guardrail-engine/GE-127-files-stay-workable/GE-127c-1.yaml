it_requirements:
  - >-
    THE SCOPE LIST, PINNED. This is the enumeration the L0, the L1 and this record all
    deliberately withheld, and the user's 2026-09-01 decision deferred to technical
    enrichment. It belongs here and nowhere in any criterion. Set `file_size.checked_extensions`
    and `file_size.line_limits` in templates/scripts/commit_guardian/commit_guardian.json to
    exactly this, and re-run the build:
    IN SCOPE — ".py" limit 400 (unchanged); ".sql" limit 600 (unchanged); ".js" limit 1000
    (NEW); ".mjs" limit 1000 (NEW); ".ts" limit 400 (NEW); ".tsx" limit 400 (NEW); ".sh"
    limit 400 (NEW).
    OUT OF SCOPE, EACH FOR A STATED REASON, NOT BY OMISSION — ".md", ".yaml", ".json",
    ".css", ".html", and everything not listed. Grounds are given below, because the whole
    subject of this L1 is that a kind is outside scope by DECISION rather than by accident.
  - >-
    THE MEASURED BASIS FOR THE LIST, RE-MEASURED IN THIS WORKTREE AT b846121c9 UNDER THE
    GUARD'S OWN COUNTING RULE (docstrings and C-style block comments discarded). Tracked files
    only. ".py": 845 files, 200 over 400 — already in scope, the largest first-party files in
    the repository are here, and this is why widening scope is NOT a substitute for
    GE-127b-1's ratchet. ".sql": ZERO tracked files — in scope today and guarding nothing
    locally; retained because this is a portable package whose consumers do have SQL, and
    removing a shipped default costs consumers more than an inert entry costs us. ".js" +
    ".mjs": 13 files, 10 over 400, largest 2575 counted / 3066 raw — the single largest body
    of unguarded first-party work and the direct answer to why files keep growing. ".ts" +
    ".tsx": 99 files (leafcutter-web), 10 over 400, largest 882 — first-party and currently
    uncapped. ".sh": 3 files, largest 225 — zero present cost, closes a language before it
    grows one.
  - >-
    WHY ".js" AND ".mjs" ARE 1000 AND NOT 400, FROM THE DISTRIBUTION RATHER THAN BY
    INHERITANCE. The 13 tracked JavaScript files measure, under the guard's own rule: 4, 8,
    122, 435, 453, 555, 567, 1046, 1315, 1411, 1813, 2441, 2575. There is a clean empty band
    between 567 and 1046, so every threshold from 600 to 1000 selects the same six files —
    the six workflow bodies. 1000 is chosen as the top of that band because it leaves the
    largest compliant file (567) 43% headroom, so the gate does not fire on routine growth of
    build-epic.js or create-ticket.js, while still catching every file the goal is actually
    about. 400 would put 10 of 13 over and is precisely the number that arrives by omission;
    2600 would catch nothing. ".mjs" takes the same limit as ".js" deliberately: a different
    number, or omitting ".mjs", makes a rename the cheapest way past the gate.
  - >-
    ADDING AN EXTENSION TO checked_extensions WITHOUT A MATCHING line_limits ENTRY SILENTLY
    INHERITS 400. get_limit_for_extension does `FILE_LINE_LIMITS.get(ext, DEFAULT_LINE_LIMIT)`
    and DEFAULT_LINE_LIMIT is 400, so a half-registration produces a working gate at the wrong
    number with no error anywhere. Every extension added to checked_extensions MUST get an
    explicit line_limits entry in the same change, including the ones whose chosen limit
    happens to equal 400 — an explicit 400 is a decision, an inherited 400 is an accident, and
    only the explicit one survives a later change to default_limit.
  - >-
    ".md" IS OUT OF SCOPE BECAUSE IT IS ALREADY GOVERNED BY A DIFFERENT GATE, AND TWO GATES
    OVER ONE POPULATION IS THE DRIFT GE-127d EXISTS TO PREVENT. check-doc-length is registered,
    runs today on `^docs/.*\.md$`, and applies max_lines 300 / max_lines_adr 400 with severity
    "warn" (no `doc_length` section exists in commit_guardian.json, so all four values are
    config.py defaults). Bringing ".md" into file_size would put two gates with two limits and
    two counting rules over the same files. THE GAP THIS LEAVES IS REAL AND MUST BE STATED
    RATHER THAN GLOSSED: check-doc-length covers only `docs/`, so markdown under `templates/`
    (28 files over 400 raw) and `tickets/` (35 files over 400 raw) is capped by nothing at all.
    That gap belongs to check-doc-length's trigger, not to this gate's extension list, and is
    recommended as a follow-up AC under GE-127c rather than absorbed here.
  - >-
    ".yaml", ".json", ".css" AND ".html" ARE OUT OF SCOPE, EACH FOR A STATED REASON. ".yaml":
    3849 tracked files of which only 4 exceed 400 and the population is overwhelmingly the
    machine-authored AC store, whose size is already governed by the AC tree-limit and schema
    gates — a second, length-based rule over generated records would fire on records nobody
    hand-writes. ".json": configuration and registries, generated or registry-shaped, where
    length carries no comprehension cost of the kind this goal is about. ".css" (1 file, 128)
    and ".html" (6 files, max 389): asset surfaces with no file above any candidate limit and
    no first-party authoring pressure. All four may be revisited; none is excluded by omission.
  - >-
    THE NOT-FIRST-PARTY EXCLUSION, STATED POSITIVELY AS THE L1 REQUIRES. Only files TRACKED IN
    THIS REPOSITORY are in scope. Vendored, generated and installed content is excluded by
    virtue of being untracked (node_modules/, .next/, .venv/, __pycache__/ are all gitignored),
    which is a property of the material rather than a hand-maintained path pattern nobody
    revisits — so new vendored content inherits the exclusion automatically. The gate already
    reads its population from `git diff --cached`, so this exclusion is a consequence of the
    existing design and needs no new list. Do NOT add a path-pattern allowlist to express it.
  - >-
    THE SET IN FORCE MUST BE READ AT RUN TIME FROM THE CONFIGURATION, NEVER WRITTEN INTO THE
    GATE. The third clause of this record is the anti-grep clause and no implementation
    carrying a set of kinds inside itself can pass it, however that set is spelled. The kinds
    the outcome declares as measured MUST be derived from the same CHECKED_EXTENSIONS value the
    measurement decision uses — one read, two uses — so the declaration cannot drift from the
    behaviour. A literal list assembled for the message is the defect one level up.
  - >-
    RESOLVE THE FOURTH CLAUSE BY REMOVING THE UNREACHABLE ADVICE, NOT BY WIDENING SCOPE TO
    REACH IT. check_file_size.py's refusal carries a branch addressed to ".md" files, pointing
    at @documentation-expert, and ".md" is not in checked_extensions — so the branch cannot
    execute and is a claim of coverage that is not there. The BA left both reconciliations open;
    with ".md" deliberately out of scope per the constraint above, the consistent resolution is
    to DELETE that branch. Deleting advice for a kind the standard does not measure and adding
    the kinds it now does measure are the same change, and after it every remaining branch of
    dividing advice must be producible by some file of a measured kind.
  - >-
    NO PACKAGE SURFACE — MEASURED, AND THIS IS THE DETERMINATION MOST WORTH SHOWING THE WORKING
    FOR. This record's own doc_link warns that the scope decision lands on a watched package
    surface. It does not add a watched entry: `file_size` ALREADY EXISTS as a top-level key at
    commit_guardian.json line 13, one of the file's 36, and `line_limits` and
    `checked_extensions` are NESTED inside it. _package_surface_registry.WATCHED_REGISTRIES
    binds two containers on this file — `hooks_manifest.hooks` by list_ids, and dotted path ""
    by mapping_keys, which addresses the document's own top level only. A nested addition is
    invisible to both. package_surface is therefore FALSE and the plain-list spec is correct;
    the one watched addition in this whole tree is the hooks_manifest id declared on GE-127a-1.
    Do NOT mint a config_schema_fragment key for `file_size` to clear the validator — it is a
    real key and needs no fragment, and BP-100n-4-ii records what happened the last two times a
    fragment was authored for a key that did not exist.
  - >-
    ADDING A KIND ACTIVATES GE-127b-1's RATCHET OVER A POPULATION NEVER MEASURED AGAINST ANY
    LIMIT — THIS IS THE CONSEQUENCE THE L1 SAYS BELONGS WITH THE DECISION. At the pinned limits,
    six JavaScript files and roughly ten TypeScript files enter ratchet mode the day this lands,
    on top of the 200 Python files already there. Every one remains workable — that is what
    GE-127b-1 buys — but none may be grown. GE-127b-1 must land with or before this record; the
    two are not independently shippable, and shipping this one first makes six workflow bodies
    uneditable.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE. Edit
    templates/scripts/commit_guardian/commit_guardian.json only. scripts/commit_guardian/ and
    the repo-root .pre-commit-config.yaml are UNTRACKED build outputs; templates/commit-guardian/
    commit_guardian.json is a decoy with no file_size section at all. config.py:19 resolves
    commit_guardian.json beside the DEPLOYED script, so a limits change written only into the
    canonical template leaves the running gate on ".py" and ".sql" with no error whatsoever —
    the single most likely way for this record to appear done and change nothing. Re-run
    `python scripts/build.py --target-dir .` and verify the deployed copy carries the new list.
  - >-
    DO NOT WIRE EXCLUDED_DIRS INTO THIS GUARD WHILE ADDING THE EXTENSIONS. check_file_size.py
    imports only CHECKED_EXTENSIONS, DEFAULT_LINE_LIMIT and FILE_LINE_LIMITS and never imports
    EXCLUDED_DIRS, though config.py:90 exports it and README.md line 65 states the global list
    applies to ALL hooks. It will look like an omission to fix in passing. It is not: the global
    list is ["unit_tests", "alembic", "debugging", "legacy", "tests", "templates"] and every one
    of the 11 substantial JavaScript files this record brings into scope lives under
    templates/workflows-js/. Honouring that list ships the widened scope as a guaranteed no-op —
    the obvious hygiene fix silently cancels the feature. The README/behaviour discrepancy is
    GE-127d-1's subject.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around config and
    file I/O; log at WARNING or higher or re-raise; no bare or blind excepts. A configuration
    read that fails must not silently yield an empty set of kinds — an empty scope reports
    nothing and reads as a clean run, which is the failure GE-127b-1-i and GE-127a-1-i both
    exist to forbid on their own populations.
test_spec:
  - name: test_ge_127c_1_the_outcome_states_the_kinds_measured_and_that_other_staged_kinds_were_not
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Stage a commit containing files of several kinds, at least one of which is outside the
      scope in force, and run an ordinary commit. The outcome must state which kinds the
      standard measured on this run AND state that files of the remaining staged kinds were not
      measured. Both are read from the process output; neither is compared against a literal
      list of today's extensions.
  - name: test_ge_127c_1_an_unmeasured_kind_is_never_reported_as_within_its_permitted_length
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      A staged file of a kind outside the scope in force appears in no within-permitted-length
      class and is not counted among the files found to be within their limits. NAMED MUTATION
      (mandatory, run it, do not merely describe it — the BA's injection): report every staged
      file in the within-permitted-length summary regardless of whether its kind was measured.
      Under that injection this descriptor must go RED naming the out-of-scope file, and return
      to green on revert. Without the injection the clause is satisfied by a standard that
      reports nothing about anything.
  - name: test_ge_127c_1_changing_the_scope_in_force_moves_the_stated_set_of_measured_kinds
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE DECISIVE ANTI-GREP DESCRIPTOR — WRITE THIS ONE FIRST. Over a fixture configuration,
      run the gate and capture the stated set of measured kinds and the verdict for one file of
      a kind currently outside scope. Then add ONLY that kind to the scope in force, changing
      nothing else, and run again. The stated set must now include that kind and the file must
      be measured. Both facts are read from the gate's own output, never from a literal expected
      set. No implementation carrying a set of kinds written into itself — however that set is
      spelled — can pass this.
  - name: test_ge_127c_1_every_form_of_dividing_advice_is_producible_by_some_measured_kind
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Enumerate the distinct forms of dividing advice the standard can produce and require each
      to be produced by an actual refusal of a file of a kind the scope in force contains. This
      has a genuine red baseline and needs no mutation: the refusal currently carries a branch
      addressed to ".md" files, and ".md" is not in checked_extensions, so that branch cannot
      execute. Derive the set of advice forms from the gate's own behaviour over real refusals,
      not by reading the source for branch strings — a source-reading test passes on advice that
      is present and unreachable, which is the exact state being forbidden.
  - name: test_ge_127c_1_the_newly_scoped_javascript_and_typescript_kinds_are_measured_at_their_own_limits
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Guards the silent-inheritance hazard. With the pinned scope in force, a ".js" file at 1001
      counted lines is refused and a ".js" file at 999 is not, and a ".ts" file at 401 is
      refused and one at 399 is not — establishing that each newly scoped kind is judged at the
      limit chosen for it rather than at DEFAULT_LINE_LIMIT. An implementation that adds the
      extensions to checked_extensions without matching line_limits entries passes every other
      descriptor here and fails this one.
  - name: test_ge_127c_1_the_declared_kinds_reach_the_registered_hook_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate as a subprocess through the registered hook path and
      assert the statement of measured and unmeasured kinds appears in the hook's own output
      stream, and that the exit status is the commit outcome rather than an advisory note. A
      declaration computed by a function nothing at commit time calls is inert.
  - name: test_ge_127c_1_the_deployed_configuration_carries_the_pinned_scope_and_the_deployed_gate_applies_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, load the configuration the DEPLOYED gate actually reads — the
      commit_guardian.json sitting beside the deployed script, which config.py:19 resolves
      relative to __file__ — and assert its file_size.checked_extensions and
      file_size.line_limits carry the pinned scope. Then run the deployed gate in a cold process
      over a real oversized JavaScript file and require a refusal. This is the descriptor that
      catches the single most likely way for this record to appear done and change nothing: the
      canonical template edited and the build never re-run.
test_rationale: |
  The third clause is written first because it is the only one that cannot pass on an
  implementation whose scope is a constant, however that constant is spelled: it changes the
  scope in force and requires the stated set to move with it. Everything else here is
  satisfiable by a well-written literal, which is exactly the failure mode the parent L1 is
  designed against — a scope list written when the project used two kinds of file and never
  revisited as the project grew into others.

  The absence-asserting clause carries the BA's named injection verbatim rather than as prose,
  because on today's implementation, which reports nothing at any commit, it is green on
  arrival.

  The fourth clause is the one arm here with a real red baseline and deliberately has no
  mutation: the ".md" dividing-advice branch exists today and can never execute. Its descriptor
  derives the set of advice forms from real refusals rather than from source strings, because a
  source-reading test passes on precisely the present-but-unreachable state being forbidden —
  the same anti-precedent this component already carries a scar from, where a gate documented
  as dispatching a triage agent does not.

  Two descriptors exist that the criteria do not name and that the pinned scope decision makes
  necessary. The per-kind-limit boundary descriptor catches the silent inheritance of
  DEFAULT_LINE_LIMIT when an extension is added to checked_extensions without a line_limits
  entry — a half-registration that produces a working gate at the wrong number with no error.
  The deployed descriptor asserts against the configuration the deployed gate actually reads,
  because config.py resolves it beside the deployed script: a scope change written only into
  the canonical template is invisible to every source-tree test and visible only there.
delivers_to:
  - agent: python-coder
    ac_id: GE-127d-1
    contract: >-
      The set of kinds in force at run time, read once from file_size.checked_extensions and
      used both to decide what is measured and to state what was measured. GE-127d-1 compares
      that same set against every published description of the scope, so it must consume this
      value rather than re-read or re-derive the configuration independently.
  - agent: documentation-expert
    ac_id: null
    contract: >-
      The pinned scope and its per-kind limits, for the reference-doc that GE-127c's
      documentation_triggers require. The published description must state the same seven
      extensions and seven limits the configuration carries, and the stated grounds for the
      kinds deliberately excluded, because GE-127d-1's comparison will hold it to them.
expects_from:
  ac_id: GE-127a-1
  contract: >-
    The commit-time per-file verdict and the single outcome stream, plus the extension-to-limit
    resolution through the existing `file_size` configuration section. This record widens the
    set of kinds that resolution covers and requires the run to declare which kinds it measured;
    it introduces no second gate and no second outcome.
