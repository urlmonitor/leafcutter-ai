criteria: |
  A newly granted ability reaches its specialist the day you grant it.

  Granting an ability, or adding a specialist, is a single decision that takes
  effect on its own. Nobody goes round preparing each specialist to be able to
  receive what it was given, and the next specialist added is correct without
  anyone remembering a step.
