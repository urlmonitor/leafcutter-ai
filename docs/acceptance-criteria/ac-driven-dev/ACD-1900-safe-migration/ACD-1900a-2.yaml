title: "A new-shape requirement validates, and both shapes pass in one run"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC YAML file that carries schema_version: 2, a deliverable_checklist,
    and per-deliverable sign-off entries (a new v2 record),
  When the AC schema validation is run against that file,
  Then it exits 0 (accepted),
  And the same validation run over a batch containing both that v2 record and a
    sibling v1 record accepts both, proving the two shapes are valid simultaneously.
depends_on:
  - ACD-1900a
doc_links:
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: "schema_version field (integer; 1=legacy, 2=new) plus the optional deliverable_checklist and per-deliverable sign-off field definitions in config/ac_store_schema.json. This field is the v1/v2 data signal that ACD-1900c-3 counts and ACD-1900a-3-i / ACD-1900f-2 read."
expects_from:
  ac_id: ACD-1900a-1
  contract: "Legacy-tolerant validator (schema_version defaults to 1, absent new fields not an error) so v1 and v2 records validate in the same run."
it_requirements:
  - "Canonical source: config/ac_store_schema.json and scripts/ac_store/validate_ac_schema.py. schema_version: 2 with deliverable_checklist and per-deliverable sign-off entries must validate; both v1 and v2 records must pass in a single store-wide validation pass."
  - "A batch/store validation run must accept a mixed set (at least one v1 and one v2 record) without rejecting either — the two shapes are valid simultaneously."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_v2_ac_with_checklist_and_signoffs_validates
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A record with schema_version: 2, a deliverable_checklist, and per-deliverable sign-off entries validates and exits 0."
  - name: test_batch_with_v1_and_v2_records_both_accepted
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A single validation run over a mixed batch (one v1 + one v2 record) accepts both, proving both shapes are valid simultaneously."
