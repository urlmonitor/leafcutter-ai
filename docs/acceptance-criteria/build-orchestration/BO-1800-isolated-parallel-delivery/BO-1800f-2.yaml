  agent: python-coder
  contract: "A removal finding set: for each path the delivery would take away content
    from, {path, removed_line_count, declared: bool, attribution}. Consumed by
    BO-1800f-2-i (which adjudicates declared vs undeclared per path) and BO-1800f-2-ii
    (which reports attribution as two separate categories)."
expects_from:
  ac_id: BO-1800f-1
  contract: "The up-to-date delivery this record examines. BO-1800f-1 establishes currency; this record is evaluated on the result, which is what makes the guarantee hold even when currency is correct."
