work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and the command
    `git commit -m "chore: identity rule"`,
  When the command is issued by each of:
    (a) the commit specialist dispatched as a subagent, arriving with agent_id present and
        agent_type naming the commit specialist as recorded by the probe (GE-129a-1),
    (b) a subagent named python-coder, arriving with agent_id present,
    (c) a subagent named status-checker, arriving with agent_id present,
    (d) a subagent defined by the project whose name is commit-helper, arriving with agent_id
        present,
  Then in (a) the commit specialist commits the change,
    And in (b), (c) and (d) the commit is refused and no commit is added to the history,
    And each refusal names the agent name that was received and states that only the commit
    specialist may commit.

  Given a caller arriving with agent_type naming the commit specialist and no agent_id,
  When it issues the same command,
  Then it is not treated as the commit specialist: the go-ahead given in (a) is not given, and the
    decision is the one GE-129d makes for the top-level session.
