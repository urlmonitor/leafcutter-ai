id: BP-100k-4-iii
components:
  - build_pipeline
title: "Consumer installs count existing untracked, stageable files when checking hook reachability"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given Leafcutter is installed into a consumer repository that tracks only
    its initial project configuration and the Leafcutter submodule,
  And build.py has created untracked, unignored documentation and hook files
    that Git can stage in a later commit,
  When the hook-trigger reachability check evaluates the deployed registry,
  Then a valid trigger matching an existing stageable file is reachable and
    does not block merely because that file is not tracked yet,
  And a trigger naming only files ignored by Git remains unreachable,
  And an invalid regular expression or a whole-tree gate with a files filter
    still blocks in either layout,
  And the check still fails closed when Git cannot enumerate stageable paths.
