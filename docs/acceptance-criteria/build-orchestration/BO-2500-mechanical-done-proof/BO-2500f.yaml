title: "Work no test can prove still names what proves it done"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A requirement with no test names the check or review that vouches for it.

  Some work cannot carry a test: a guide, the wording of an instruction, a
  setting. Today a single sentence saying "no test needed" is enough to call it
  finished, and nothing ties that sentence to anything that was ever checked.
  Instead, each such requirement names how it is verified: either an automatic
  check that really runs as part of everyday work, or a dated review by a named
  person of the exact version they looked at. Whoever reads "done" can then see
  what confirmed it, a review stops counting once the material it covered has
  changed, and work whose real behaviour can be tested cannot use a review to
  dodge its test.
