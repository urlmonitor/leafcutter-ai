notes: |
  Motivated by BP-1000a: an L1 parent had 6 L2 children of which 2 were
  superseded, and the hook counted all 6 (over the cap of 5), forcing a
  child_limit_override waiver even though only 4 children were active. Excluding
  superseded children from the count frees the slot that superseding a redundant
  child is supposed to free, so the override is not needed. This is the count
  rule; the child_limit_override escape hatch (ACS-100h-7a) still layers on top
  and is exercised in ACS-100c-6-ii.
