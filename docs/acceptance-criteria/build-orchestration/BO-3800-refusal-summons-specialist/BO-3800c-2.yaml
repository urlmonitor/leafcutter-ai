id: BO-3800c-2
title: "The restructuring specialist brought in for a complexity refusal is given the file, each refused function, its complexity and the ceiling allowed, exactly as the refusal stated them"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven and check-complexity refuses its delivery, stating
    that plan_batches in scripts/planner.py has complexity 31 and only 30 is allowed,
  When the run engages the restructuring specialist,
  Then what the specialist is given names scripts/planner.py, plan_batches, the
    complexity 31 and the 30 allowed.

  Given the same run, with the refusal changed in one respect only: it names the new
    function parse_rules with complexity 16 where only 15 is allowed,
  When the run engages the restructuring specialist,
  Then what the specialist is given names parse_rules, 16 and 15, so the specifics
    change with the refusal.

  Given one refusal naming two functions in scripts/planner.py, plan_batches at 31 with
    30 allowed and parse_rules at 16 with 15 allowed,
  When the run engages the restructuring specialist,
  Then what the specialist is given names both functions, each with its own complexity
    and its own ceiling, and neither is dropped or merged into the other.
depends_on:
  - BO-3800c
  - BO-3800b-3
  - INF-800f-1
