work_status: todo
criteria: |
  Given UXP-100c describes a prototype approval gate with approve, reject,
    and request-changes paths,
  When a sequence diagram is produced for this workflow,
  Then the diagram shows the following actors: UX designer agent, user,
    pipeline orchestrator, and PO agent
  And the diagram shows the approval path: prototype presented, user approves,
    pipeline proceeds to implementation
  And the diagram shows the rejection path: prototype presented, user rejects
    with rationale, pipeline halts, PO notified
  And the diagram shows the revision path: prototype presented, user requests
    changes with feedback, UX designer revises, revised prototype re-presented
  And the revision path shows that the cycle repeats until approve or reject
