criteria: |
  Given a child requirement with UID 42 whose parent-pointer field holds UID 10,
  When the parent-child coverage check runs,
  Then it verifies that UID 10 lists 42 among its children, using UID 42's
    parent-pointer field to identify the expected parent,
  And it does not identify the expected parent by stripping a segment from the
    child's name,
  And it reports a violation when UID 42 points at UID 10 but UID 10 does not
    list 42 among its children.
