id: BO-1300a-4
readiness: approved
priority: high
title: "A direct push to main by the automation is treated as a defect and blocked"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300a.yaml"
criteria: |
  Given the automation is delivering a unit of work
  When the automation would otherwise push commits whose destination ref is main (bypassing a pull request)
  Then that push is treated as a defect: the automation stops before the push completes
  And it surfaces an operator-visible blocker stating that automated work must reach main through a pull request, not a direct push
  And no commits are written to main as a result of that attempt
depends_on: [BO-1300a, BO-1300a-3]
