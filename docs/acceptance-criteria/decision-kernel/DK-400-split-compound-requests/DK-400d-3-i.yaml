id: DK-400d-3-i
title: "Rejecting the split of a turned-away request: with no capability the run ends blocked with the gap recorded; when ambiguous it falls back to today's clarification question"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the trace-analyzers goal "Decide which recent kernel traces the trace analyzers read and
    how often they run, so their findings reach the next decision run.", turned away by routing
    (trigger jev_none) and offered as parts p1 and p2,
  When human:user rejects the split with the note "One question, not two: how often they run
    follows from which traces they read. I will ask it again as one question.",
  Then the run ends blocked,
  And the run records the same capability gap for the goal that it records today when routing
    turns a request away,
  And nothing is decided and no decision record is staged,
  And the split's state is rejected,
  And when the same split had been offered because routing found the goal ambiguous (trigger
    ambiguous) instead, the rejection does not end the run blocked: the run asks the person the
    clarification question it asks today for an ambiguous request and waits for the answer, the
    split's state is rejected and back to clarification (rejected_clarify), and no capability gap
    is recorded for the goal while that question is open.
