criteria: |
  Accuracy that does not depend on which path the work took to get here.

  When something is delivered outside the normal ticket route, the link between the
  requirement and the test that proves it is still recorded. The backlog cleared
  once stays cleared, instead of quietly refilling from every delivery path that
  nobody wired up.
