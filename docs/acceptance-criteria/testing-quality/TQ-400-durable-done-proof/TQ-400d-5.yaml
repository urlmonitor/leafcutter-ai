notes: |
  Satisfies the how-to entry in TQ-400d's documentation_triggers.

  SCALE IS THE POINT. Measured 2026-08-17: 641 finished L2/L3 records, 259 of
  them carrying no test with their coverage tag. A pile that size is worked by
  many hands over many cycles, so the guide's real job is to make two different
  people reach the same decision on the same record. That is why the criteria
  demand STATED CRITERIA for choosing between prove / redo / retire, not merely
  a list of the three options — an unguided choice among three verbs produces
  three different piles depending on who is holding the list.

  The refusal clause is deliberate. TQ-400d-3 makes a reasonless clear impossible;
  a guide that does not explain the refusal invites the reader to treat it as a
  bug and go looking for a way around it, which is exactly how the pile gets
  emptied in one gesture.

  The no-bulk-path clause is a negative documentation requirement, and it is the
  one most at risk of being violated by a well-meaning author trying to make 259
  records feel tractable.

  Written as reader outcomes rather than "a guide exists" because a triage page
  listing three decisions satisfies a presence check while leaving every hard
  question — which decision, on what grounds, and what happens if I skip it —
  unanswered.

  IT-PO ENRICHMENT NOTE (2026-08-18) — NEGATIVE REQUIREMENTS NEED MECHANICAL
  SCANS, NOT REVIEWER ATTENTION. Two of this AC's clauses forbid something rather
  than require it. A reviewer reads a diff of additions and has no reliable way to
  notice that a helpful-looking "process the oldest ten first" aside violates both
  the no-bulk and the no-age clause at once. Both are therefore covered by an
  absence scan in the seam entry, on the same reasoning the repo already applies to
  GE-119d-5's anti-reintroduction guard.
