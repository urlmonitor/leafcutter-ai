notes: |
  FLOW NODES: split-propose (step), split-dropped (branch).

  SETTLED: the host (Claude Code) proposes, through the new host operation
  host.decompose_goal (working name, from TICKET-20261002-KernelDecomposeMultiPartGoal).
  A proposal whose quote is not a verbatim span of the subject is dropped
  before the gate and shown read-only with its reason. It can never be approved
  or run, though the person can add its question back by editing (DK-400d).
  Each part names the parts it depends on, with no cycles.

  ADDED BY THE PO (flow-author open point a): "not forced into a split: you are
  told so plainly". This is the customer stance; the mechanism is open. Which
  case is which is a PO open question:
    - Fewer than 2 bounded parts: recommended to treat the request as one
      question after all. It goes ahead as one if it can be handled, or is
      recorded as a capability gap (DK-400a), and no split gate is shown.
    - More than 5 parts: options are (1) refuse and ask the person to narrow
      the request, (2) offer five parts and list the remainder as not covered,
      read-only, like dropped proposals, or (3) group the request into at most
      five parts. The PO recommends (1) or (2); never drop the remainder
      silently.
    - Fewer than 2 parts left AFTER dropping (for example 3 proposed, 2
      dropped): the same rule as fewer than 2 should apply. Confirm at L2.
  The flow and the mock data cover none of these cases yet. The flow-author
  should add a branch once the answer is chosen.

  DOCS: host.decompose_goal is a new host operation (component-diagram). The
  kernel, the host, the person and the child work all take part in a split
  (sequence-diagram).
