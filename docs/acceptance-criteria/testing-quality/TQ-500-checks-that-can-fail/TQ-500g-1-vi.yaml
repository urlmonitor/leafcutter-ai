notes: |
  WIRING ONLY — the rule lives in TQ-500g-1-i. Mirrors TQ-500f-3-ii for the
  later gate: /build-feature does not dispatch ticket-supervisor; its per-ticket
  driver is inlined JS and twinned in build-ticket.js, so this is a workflow-JS
  change. Respect the E2 leaf invariant and ADR-006 (no workflow() call from
  inside the workflow; run the runner through a depth-1 executor agent, as
  fast-lane-ship.js does).

  K4 (RESUME) IS THE NON-OBVIOUS CASE. A resumed ticket whose later phases are
  already signed off would otherwise skip straight to commit. The runs guard the
  code on disk now, not the code as it was when someone last signed off.

  PLACEMENT: after the coder's code is green and before commit. The exact phase
  position relative to review is IT-PO's call; never after commit.

  TESTABILITY: drive both twins under the workflow-engine harness with the K1
  to K4 responses and assert on the recorded dispatches; one seam test executes
  the recorded runner commands from this route and from the fast lane against
  the same fixture repo and asserts identical verdicts.

  IT-PO ENRICHMENT (2026-09-28)
  PLACEMENT DECIDED: right before the commit dispatch, after review. The BA
  left this to IT-PO.
  Lane: fast lane (python-coder) after -1-i..-iv. Can share a build with
  -1-v, but each AC keeps its own tests. The JS ratchet decision is open.

  IT-PO AMENDMENT (2026-10-14): THE THREE-STEP DESIGN ON MAIN
  Same sequence as TQ-500g-1-v: recover (resume), list, test-breaker (only
  when something is owed), then one finish call from the wrapper TQ-500g-1-v
  builds. Reply on stdin; a writer stop halts the ticket. The commit is reached
  only on finish's gate_passed true.
  NEW FOR THIS ROUTE: the batch runs in parallel in one shared worktree, so the
  sequence must not overlap a sibling's finish or commit. It uses the route's
  existing commit-phase exclusion; if there is none, that is a blocker before
  the build. Executor spawn reciprocity for build-feature.js and build-ticket.js
  must be settled (command-step-runner names only user and fast-lane-ship.js).
  CRITERIA CLAUSES FOR THE BA (criteria untouched here):
    - "Then the route makes the wrong-version runs through the one shared
      runner, with the same inputs the fast lane passes": still true. Proposed
      addition, so the preparation is part of the behaviour: "after asking the
      writer what is owed and, when anything is, having test-breaker prepare it
      from that list unchanged".
    - "And K4's resumed drive makes the runs again before commit rather than
      relying on any earlier sign-off": proposed addition "and puts back any
      code a cut-short earlier run left altered before anything reads it".
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-v (the
  wrapper), -iv or -ix (BA/user to add). The backfill caveat for must_catch
  entries without in_scope_files in TQ-500g-1-v's notes applies here too.
