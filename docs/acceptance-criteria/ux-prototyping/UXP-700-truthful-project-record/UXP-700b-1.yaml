risk_surface: contract_boundary
test_required: true
test_rationale: |
  The defect is that two runs are indistinguishable, so no single-run test can detect it. The
  contract can only be proved by running the checker twice - once over an empty record, once
  over a populated sound one - and asserting the outcomes differ. A test that asserts the empty
  run produces some particular message is satisfiable by a message change while the outcome a
  caller reads stays identical, which is the live defect.
test_spec:
  - name: test_empty_store_outcome_differs_from_populated_sound_store_outcome
    target_dir: unit_tests/product_truth/
    description: "Running the checker over a zero-artifact store and over a populated sound store yields two different machine-readable outcomes."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_empty_store_report_names_each_zero_record_artifact_type
    target_dir: unit_tests/product_truth/
    description: "The empty-store report names journeys, example data and screens as the types for which zero records were read."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_outcome_is_distinguishable_without_parsing_prose
    target_dir: unit_tests/product_truth/
    description: "A caller reading only the outcome value, not the message text, can separate the two runs."
    type: unit
    angle: seam
    framework: unittest
notes: |
  DIRECTLY OBSERVED AND REPRODUCED (2026-09-07, this repo). A completely empty product-truth
  store, with its derived index regenerated, produced:
      OK: 0 flows, 0 mock-data, 0 mockups, eval + index + derived data valid (0 warnings)
  and exit 0 - character-for-character the shape of a real pass. The hook that consumes it
  reads only the exit code, so nothing downstream can tell the two apart either. That is why
  the third clause is about what a CALLER can distinguish, not about the message.

  STANDING-RULE CAUTION inherited from GE-120 and restated on UXP-700b: this does NOT repeal
  the project's fail-open convention. Failing open on one bad input while the check still ran
  is fine; reporting success when the check never examined anything is not. The reconciliation
  is written as its own record, UXP-700b-1-i, so an implementer cannot satisfy this AC by
  making every degraded run fail.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
