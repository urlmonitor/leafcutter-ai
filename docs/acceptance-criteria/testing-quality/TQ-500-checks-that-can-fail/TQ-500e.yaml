notes: |
  Boundary with TQ-400 (durable done proof): TQ-400 re-examines finished work on
  a rhythm and withdraws the done badge when the evidence has lapsed. This L1
  does no re-examination — it makes the original demonstration legible at the
  time it is taken, so that a later reader (human or automated, including a
  TQ-400 sweep) has something to read. Neither absorbs the other.
