it_requirements:
  - "The change must land under templates/. The deployed workflow and the deployed pause-store script are both build output."
  - "All three pause-store sites -- the read, the write and the read-back verification -- must resolve through the same repository-anchored resolution. Fixing the write alone leaves a run that writes correctly and then cannot find its own record."
  - "The store location must be a function of the project being operated on, never of the caller's working directory, so that a writer in a worktree and a reader at the project root address the same location."
  - "The reported write outcome must be established by observing the record after the write, not by the absence of a thrown error. A writer that reports success while writing nowhere passes every return-value assertion."
  - "The write must be durable before the process exits -- a record buffered and lost on exit is indistinguishable from a run that never paused."
  - "Must satisfy the repository error-handling policy: the read, the write and the read-back are external I/O and each must log at WARNING or re-raise on failure."
  - "Must be idempotent: pausing the same run twice at the same decision point must leave one record, not two."
test_spec:
  - name: test_pause_record_written_from_a_worktree_lands_in_the_project_store
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The run is driven from a real worktree asserted to hold no installed support
      directory; after the process exits, the pause record is present at the project's
      own store location and no record exists anywhere under the worktree.
  - name: test_pause_record_is_found_by_a_second_process_started_elsewhere
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      A second, fresh process started with the project root as its working directory
      lists the run as waiting -- the real writer's real output read by the real reader
      across two different working directories.
  - name: test_reported_write_failure_matches_what_is_on_disk
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      With the store location made unwritable, the run reports the write as failed and
      no record is present; with it writable, the run reports success and the record is
      present. The report and the filesystem agree in both directions.
  - name: test_pause_write_is_reached_from_the_workflow_entry_point
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner to a decision point with no answering channel available"
    description: >-
      The record is produced by driving the real workflow to a real pause, not by
      calling the pause-store helper directly.
test_rationale: >-
  Writing and reading from the same working directory passes even when both resolve to
  the wrong place, so the read-back has to happen in a second process started from a
  different directory -- that is the only shape in which a cwd-relative store location
  fails. The report-matches-disk pair is the anti-phantom assertion: a writer that
  returns success while writing nowhere, or that writes beside the caller where the
  resuming run will never look, satisfies every assertion made against the return value
  alone. Asserting the absence of a stray record under the worktree is as load-bearing
  as asserting the presence of the real one.
