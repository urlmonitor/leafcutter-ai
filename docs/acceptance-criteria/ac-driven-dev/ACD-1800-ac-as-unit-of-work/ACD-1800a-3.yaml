it_requirements:
  - "Document in docs/reference/ac-schema.md (the canonical AC-schema reference): the deliverable-checklist field, the responsible-craft attribute, how the checklist is validated against the requirement's change surface, and a worked complete-checklist example."
  - "DEFINE NO LIST OF KINDS IN THIS SECTION (user decisions D1/D2/D3, 2026-08-31). It must POINT AT the store's existing change-target vocabulary as the source the checklist draws its kinds from, record that `diagram` is the single value added to that vocabulary, and state that a test is a proof of a code deliverable rather than a deliverable, so no `tests` kind exists. Do NOT enumerate the values in prose: cross-reference the change_target section of this same document, which is itself the reader's route to the shared enum in config/ac_store_schema.json."
  - "THE POINTER MUST BE MECHANICAL, NOT EDITORIAL. Adding or removing a value from the change-target vocabulary must not require this section to be edited for the two to agree. A prose sentence listing the values fails that property the day the enum changes -- and it fails it silently, because a stale correct-looking list reads exactly like a current one."
  - "This section REMAINS the single normative definition that the AC-store schema (ACD-1800a-1 / ACD-1800a-2-i) and the signoff skill mirror -- spec-parity, since a Python validator and a markdown skill cannot share a code import. What it is normative ABOUT is narrowed: it is normative for the checklist's shape, the craft attribute, the tests-are-not-a-kind rule, and the FACT that kinds come from the change-target vocabulary. It is NOT the definition of that vocabulary's values; that definition lives in config/ac_store_schema.json and this document's own change_target section."
  - "State the value of the narrowing explicitly for the next author: the previous arrangement made this section the origin every other surface copied from, so a wrong list here would have propagated into the schema and the skill and each copy would then have been correct-by-construction against it. Pointing rather than copying removes that failure mode without weakening spec-parity -- the schema and the skill still mirror one definition."
  - "Canonical source only: docs/reference/ac-schema.md in the package repo; never a deployed .claude/ copy or the workspace-parent build-output mirror (ADR-001)."
