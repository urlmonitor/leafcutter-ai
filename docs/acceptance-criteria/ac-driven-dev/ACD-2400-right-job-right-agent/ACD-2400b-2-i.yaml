title: "A requirement that reaches approved with its test design pending is still never built"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a leaf code requirement at readiness "approved" (set by hand) that carries test
    intent and no test design,
  When the implementation-readiness gate evaluates the buildable queue,
  Then the requirement is flagged not implementation-ready with the reason
    "test design pending", which is distinct from the reason "missing test contract",
  And it is excluded from the set dispatched to builders,
  And no test list is derived for it from its Then clauses (the per-clause fallback used
    when no test contract has been authored does not apply to a record that carries test
    intent),
  And the store's commit-time record check rejects a change that leaves it in this state,
    naming the file and "test design pending".
