notes: |
  THE INVARIANT THE REST OF BO-3500c HANGS FROM. Its siblings say what the proof IS for
  each kind of artifact; this one says a proof is required at all, that its absence is
  never a licence to skip, and that whatever was checked is written down.

  THE RECEIPT SHAPE (2026-08-31, user decision D5 — the most important change in this
  pass). "Record what was checked" was too weak: any sentence satisfies it. The receipt
  the second scenario now demands carries six things — the instrument, the exact
  invocation, the outcome that invocation returned, the first condition compared, the
  second condition compared, and the difference observed between them — and its shape
  DIFFERS BY CLASS OF PROOF. A proof that only reads the artifact carries no second
  condition at all. A proof that runs or renders something and reports the same value for
  both conditions has recorded a comparison that compared nothing.

  WHY THAT MATTERS MORE THAN THE WORDING SUGGESTS. BO-3500c-2's second scenario forbids a
  member of one kind being finished on the strength of the proof defined for a weaker
  kind. As written, nothing detects it: a borrowed proof and a correct one both end in
  "checked, passed". Once the receipt is shaped, the borrowing is a MISSING OR DEGENERATE
  FIELD — a running proof whose receipt has no second condition, or one whose two
  conditions are identical — which a validator sees at write time, on the record, without
  re-running anything and without re-executing the run that produced it. The two
  rejection scenarios are that validator's contract.

  THE LAST SCENARIO IS D4 AND IS NOT DECORATION. If the class of proof is a field an
  author types, the whole mechanism is defeated by typing: declare the screen deliverable
  to be a reading-class one and the receipt legitimately carries no second condition. So
  the class is resolved from the deliverable, not read from the record. Where it is
  resolved FROM is BO-3500c-2's third scenario and the IT PO's to make concrete.

  THE THIRD CLAUSE OF THE FIRST SCENARIO is not a restatement of the second. They close
  different doors, and both are open today. "No test, therefore finished" is the
  loosened gate. "No test, therefore not built" is the skip. KI-BO-013 warns against the
  second by name and BO-2400f-12 forbids it on the refusal path, but nothing anywhere
  forbids it once a group has been accepted — and an implementation reaching for the
  cheapest way to make BO-3500b pass will find it immediately.

  WHY THE RECORDED PROOF IS PART OF THIS CRITERION AND NOT A SEPARATE ONE. A proof that
  is established and then not written down is unfalsifiable an hour later. This
  component has twice found requirements marked finished with no recoverable evidence,
  and the audit needed to sort the real ones from the phantoms cost more than the
  original work. The record is what makes the difference between "a run said so" and
  "here is what was checked".

  BOUNDARY vs BO-2500 — restated because it will be misread. BO-2500 says only a
  mechanical check may confer finished-ness, never an opinion. That is not weakened
  here and must not be. This criterion asks that the mechanical check be the right
  instrument for an artifact that is not code. If any implementation of this tree ever
  reads as "some work is finished without a mechanical check", it has drifted and
  should be rejected.

  SEAM WITH ACD-1800b, which is ahead of this in the roadmap and owns how finished-ness
  is counted from per-deliverable sign-offs. This criterion is the build side: the run
  produces the artifact, establishes the proof, and writes the evidence that side
  counts. Treat its accounting as the target. The two must agree on where the evidence
  is written or the run will produce a record nothing reads.

  TESTABILITY. Execute a run over a group containing a non-code member, then read the
  real backlog on disk afterwards. Two load-bearing tests, not one:

    - The LAST scenario, run with the proof forced to fail: an implementation that
      establishes proofs correctly and then marks the member finished regardless
      satisfies every other assertion here.
    - The two REJECTION scenarios, which need no run at all — offer a degenerate receipt
      (two identical conditions on a comparing proof; a second condition on a reading
      proof) directly to the write path and assert it is refused. These are cheap,
      deterministic, and are the only tests in this tree that catch a borrowed proof
      after the fact.
