created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700a.yaml"
criteria: |
  Given a worktree where the pre-commit binary is on PATH (Check A would pass),
    the `.pre-commit-config.yaml` resolves and parses (Check B would pass),
    and the shared git hook contains the sentinel (Check C would pass),
  But the hook chain is broken so that invoking the canary produces no token,
  When the probe runs,
  Then Check D fails, the probe exits non-zero, `canary` is false in the JSON
    result, and `failing_checks` contains "D".
  And the overall probe verdict is FAIL — a configuration that merely appears
    installed but fires nothing is reported as broken, not trusted.
depends_on: [BO-1700a, BO-1700a-1]
