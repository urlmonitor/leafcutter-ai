it_requirements:
  - >-
    Template change in templates/agents/test-runner.md only (the shipped source; the deployed copy is regenerated
    by the build and is not tracked): inside the not_configured fenced block (:152-155) add the line 'The database
    tests were not run.' after the two existing lines, so the block reads: '## Database Not Configured' / 'testing_context.db_connection_test
    is not configured. Set it in this' / 'project's skills_config.json before running database tests.' / 'The database
    tests were not run.' Every other line of the block, the invalid / config_error and unreachable branches and
    the line 'Do NOT attempt to run the SQL suite unless the checker reports `reachable`.' (:172) are unchanged.
    No scorer code changes: report_says_not_run (scripts/evals/produced_tests_reports.py :105-112, NOT_RUN_RE :25-29)
    already reads 'were not run' as not-run; this AC must not widen it.
  - >-
    Package surface: the change edits an existing shipped template and adds no entry to a registry the build reads
    (agent_registry.json, skill_registry.json, paths.json, commit_guardian.json), so package_surface is false (config/ac_store_schema.json:
    the flag declares a new registry entry and triggers the structured it_requirements object). See the open question
    in notes.
  - >-
    Probe fixtures: test-runner/missing-setting-database-work/run1 and run2 (report.md and transcript.jsonl; the
    transcripts hold a local user path that is neutralised) copied per the common fixture rule. The 'fixed message
    only' report is built by the test from the fenced block it extracts out of templates/agents/test-runner.md at
    test time, paired with the run1 transcript (so the two command checks see the checker run), so reverting the
    template makes the test red. Unit tests never call a live model; they score recorded outputs and probe fixtures
    only. Kept live outputs are copied by the test-writer from the kept-outputs folder of the 2026-11-02 runs (<session
    scratchpad>/kept_runs/run1|run2/<set>/<row>/, local to the run machine, as the known issue names it) into unit_tests/evals/fixtures/tq200d-rerun/<set>/<row>/run1|run2/
    as flat '<name>.py.recorded' files plus report.md (and transcript.jsonl where the row reads commands), the gold-output
    form place_outputs reads, so a bare pytest never collects them. Absolute local paths in a copied file (for example
    a sys.path line naming a user temp folder) are replaced with a neutral placeholder and nothing else is changed.
    No committed file names the scratchpad path. If another TQ-200d re-run AC has already created a needed fixture
    file, it is reused, not copied again.
  - >-
    Tests that read the template go in unit_tests/agents/test_runner_prompt/ (4 files today); the eval-side tests
    go in unit_tests/evals/tq200d4v/ (unit_tests/evals/ is at its density cap).
  - >-
    DOCUMENTATION (part of done) - the report_says_not_run entry on docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
    replaces its quoted sentence with '> The database tests were not run.' followed by '- templates/agents/test-runner.md',
    and its 'Passing example' becomes the relayed not_configured block ending in that sentence. 'Used by' is not
    changed here (TQ-200d-4-vi moves the test-writer row to its own kind and updates it).
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md produced-tests section names the sentence where it describes
    the test-runner set: one bullet 'Not run. The test-runner's "Database Not Configured" message ends with "The
    database tests were not run.", so relaying it verbatim passes report_says_not_run' linking #report_says_not_run.
  - >-
    DOC-DRIFT TEST: the TQ-200d-1-ii quote test (unit_tests/evals/tq200d1ii/test_tq200d1ii_quotes.py) holds the
    new quote equal to the template; this AC's own test checks the entry's passing example is the block as extracted
    from the template.
  - >-
    KNOWN ISSUE: git mv docs/known-issues/testing-quality/open-low-ki-tq-20261102-test-runner-not-configured-block-has-no-not-run-sentence.md
    to docs/known-issues/testing-quality/resolved/resolved-low-ki-tq-20261102-test-runner-not-configured-block-has-no-not-run-sentence.md
    (the resolved-<bucket>- rename used for the earlier TQ known issues); set its Status line to 'RESOLVED <date>
