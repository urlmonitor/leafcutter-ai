notes: |
  All existing tooling that today derives structure from the id STRING must be updated
  to read the metadata (parent pointer + level + order from ACS-800b) instead. Known
  affected surfaces for the BA to enumerate at L2:
    - check_ac_limits.py — child-count derivation (today counts via id-string parsing;
      this is why a move that does not rename does not reduce the count, and why the
      child_limit_override stopgap was needed). Once this reads metadata, the override
      can be RETIRED.
    - check_ac_parent_covered_by.py — parent/child link verification.
    - goal_to_epic.py — tree traversal.
    - scripts/ac_store/ac_parent_id.py — derive_parent_id() (today the canonical
      id-string parent-derivation; becomes a metadata lookup).
    - config/ac_store_schema.json — id regex no longer carries hierarchy meaning.
  This is python-coder work across multiple scripts; estimated_complexity L.
