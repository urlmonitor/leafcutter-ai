notes: |
  THIS IS THE TERMINATION ARGUMENT'S OTHER HALF. BO-100e-2 bounds the number of
  looks; this record bounds what each look may see. Without it, "keep going until
  nothing further can be built" over a growing set has no stopping point at all —
  the exact reason BO-300a-5 settled mid-run additions the other way.

  The third scenario is the mirror of BO-100e-1-i: neither a failed prerequisite nor
  a vanished one may be read as a satisfied one.
change_target: pipeline
risk_surface: contract_boundary
