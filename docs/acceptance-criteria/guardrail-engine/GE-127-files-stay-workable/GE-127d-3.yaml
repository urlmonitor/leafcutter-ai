id: GE-127d-3
title: "A string literal's own content is never mistaken for the start of a discarded docstring or block-comment region"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the measurement rule this standard applies discards the content of
    triple-quoted strings and C-style block comments before counting a file's
    length,
  And a covered file contains a single-quoted, double-quoted or backtick
    -delimited string literal whose own text contains a block-comment-opening
    sequence, a block-comment-closing sequence, or a triple-quote sequence,
  When that file's length is measured,
  Then the string literal's content is counted exactly as any other code is
    counted, and no line before, inside or after that literal is discarded on
    account of the sequence appearing inside it,
  And given a covered file contains a REAL, unterminated-by-a-string
    triple-quoted string or a REAL block comment,
  When that file's length is measured,
  Then that region is still discarded exactly as it was before this record,
  And the bug symptom ("count_content_lines() strips C-style block comments
    with a regex applied to the whole file, with no notion of a string
    literal. A '/*' occurring inside an ordinary JS string (the tracked
    instance: the substring 'changelogs/*.md' inside a template literal in
    templates/workflows-js/fast-lane-ship.js) opens a PHANTOM block-comment
    span that runs to the next unrelated '*/' anywhere later in the file,
    silently discarding real, executable lines in between from the quoted
    length — so the size gate can be defeated with no intent at all.") must
    not occur.
depends_on:
  - GE-127d
