notes: |
  WHY GROSS IS NOT A PREFERENCE BUT THE ONLY READING THAT HAS A SOLUTION. Under a net
  reading, "added" is the file's growth, and the rule becomes: the file must end at or
  below its previous length minus its own growth. That is self-referential — the
  quantity being constrained appears on both sides — and for any change that does not
  grow the file it collapses to "the file must end at or below its previous length",
  which is GE-127b unchanged. A net reading therefore does not weaken this record, it
  deletes it. State it explicitly, because an implementer holding two lengths and
  needing a third number will reach for the subtraction that is already in hand.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: compute the number of lines the change added as the file's net growth —
  the length after the change minus the length before it, floored at zero — instead of
  reading it from what the change put into the file.
    - MUST GO RED: the five-line replacement arm and the 40-in-40-out arm. Under the
      injection both changes register as having added nothing, so both files are
      required only to stand where they already stood, and both commits complete when
      they must be refused.
    - MUST STAY GREEN: the 560 arm, the delete-only arm, and the unmeasured-content arm.
    - EXPECTED COUPLING, WHICH IS NOT A FAILURE AND MUST BE REPORTED RATHER THAN
      SUPPRESSED: this injection ALSO reddens GE-127f-1's refusal arms, because every
      one of them leaves the file at or below its previous length and so registers as
      zero growth. That direction of coupling is the point. GE-127f-1's own two
      mutations leave every arm of THIS record green, and the two facts together are
      what show the records are not duplicates: one owns the comparison, the other owns
      an input the comparison cannot check for itself.

  HOW GE-127b-1'S DELIVERED BOUNDARY DESCRIPTOR IS RECONCILED — READ THIS BEFORE
  TOUCHING THE TEST. GE-127b-1 is done and green.
  test_ge_127b_1_an_oversized_file_left_at_exactly_its_previous_length_commits asserts
  that a change leaving an already-oversized covered file at exactly its previous length
  commits, and GE-127b-1's it_requirements pin the boundary as strictly greater-than,
  not greater-than-or-equal. After this record lands, that statement is true of exactly
  one shape: a change that added no MEASURED lines. The descriptor's fixture today does
  not say which shape it exercises, so it must be made explicit rather than left to
  chance. The reconciliation, to be carried in the same change as the implementation:
    - The descriptor is NOT deleted and its assertion is NOT weakened. It is narrowed:
      its fixture is pinned to a change that adds no measured lines to the oversized
      file — a pure deletion, or an edit that only touches content the measurement rule
      does not measure — and its name and description are amended to say so.
    - The case the descriptor used to cover implicitly and no longer does — an
      already-oversized file left at exactly its previous length by a change that DID
      add measured lines — becomes this record's first arm, where it is refused.
    - GE-127b's strictly-greater-than boundary survives untouched as the boundary of
      GE-127b's OWN comparison. What changed is the threshold that comparison is judged
      against, not the direction of the inequality.
    - This is a deliberate narrowing of a delivered record, already recorded on
      GE-127b's amended_by by the Product Owner. It is not a regression and it is not
      licence to re-open GE-127b's criteria, which stay untouched.

  THE UNMEASURED-CONTENT ARM IS THE HONEST CONSEQUENCE OF CONSUMING GE-127d, NOT A
  LOOPHOLE THIS RECORD INVENTS. Counting the change's additions in any unit other than
  the one the file's length is measured in would be a second counting rule, which this
  tree forbids in four places. Counting them in the same unit means a change that adds
  only content the rule does not measure has added nothing and is free. That is correct
  and it is the same inheritance GE-127b-1 already carries. It is also the reason the
  arm is written down: it is the surviving shape of GE-127b-1's boundary descriptor, and
  an implementer who quietly counts raw added lines instead will break that descriptor
  for a reason that looks like an off-by-one and is not.

  WHAT THIS RECORD DOES NOT TOUCH. It says nothing about the cap, nothing about the
  permitted length, nothing about which files are in the population, and nothing about
  who removes the lines. Those are GE-127f-1's and GE-127f-3's. It also takes no
  position on whether deleting blank lines and hash comments ought to discharge a
  demand — that is GE-127d's call, it is named as a live exposure on GE-127f-1, and no
  arm above is satisfiable by it: the 560 arm and the delete-only arm both reach their
  end state by whole constituent definitions leaving the file.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. The named mutation above,
  including which arms must stay green and which coupling is expected, is written to be
  turned directly into test descriptors.
