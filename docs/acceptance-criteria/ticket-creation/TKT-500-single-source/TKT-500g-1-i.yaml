notes: |
  THE CONTRADICTION THIS RESOLVES, STATED PLAINLY. TKT-500f-7 (approved) requires
  that a requirement touching only docs/config paths produce no proof section and
  no warning. Fourteen of the 85 affected records are exactly that shape and DO
  author a demand — 12 assigned to documentation-expert, 2 to
  architecture-diagram-author. The behaviour that shipped in f3ac950c emits a
  proof section for them. Read literally, the shipped behaviour violates an
  approved AC.

  RULING: the shipped behaviour is right and TKT-500f-7 is under-specified. It
  was authored on 2026-06-22, before an authored proof demand was a first-class
  field on a requirement, so its only available input was the shape of the
  changed paths. Precedence is therefore: an explicitly authored demand outranks
  an inference drawn from path shape. Path shape answers "was a proof owed?" only
  when nobody said. TKT-500f-7's scope is narrowed to the no-authored-demand case
  and an amended_by entry to that effect is recorded on its file.

  WHAT WOULD CHANGE THE RULING. If a reviewer holds that a documentation record
  must never carry a proof obligation whatever its author wrote, then the fix is
  to reject the authored demand at authoring time with a named error — not to
  discard it silently at generation time. Silent discard is the one option
  excluded, because it is indistinguishable from the defect.

  IT-PO NOTE 2026-08-25 — BUILT BUT UNPROVEN. The behaviour ships today, but none
  of the seven tests in the authored-demand suite exercises the docs-only-AND-authored
  input, so the precedence rests on reading the code rather than on a red-then-green
  proof. Two of the three descriptors are shared with TKT-500f-7 deliberately: that AC
  is approved and unbuilt, and the pair must be implemented together or the narrowing
  is inert.
