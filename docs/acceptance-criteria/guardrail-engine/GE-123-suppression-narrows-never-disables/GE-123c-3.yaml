it_requirements:
  - "There are two places the scanner exists and only one of them gates a commit: the pre-commit check imports the DEPLOYED copy, resolved as a sibling of its own deployed location, and falls back to the configured scanner directory. A change present only in the templates/ source is inert on the real path. Edit the canonical template, run build.py, and verify the behaviour through the deployed layout (ADR-001)."
  - "The warning must be delivered on the error stream and the findings report on the standard output stream must remain free of it — the pre-commit check parses that stream, and a diagnostic leaking into it would read as a finding."
  - "The unmatchable-entry warning must never, on its own, change the check's exit status. The commit is blocked if and only if a finding survives suppression."
  - "Exactly one allowlist-diagnostic convention exists for this file after the change: the shape already established for outright-malformed entries, extended to the new class. Two shapes describing the same file is itself the defect."
  - "Per-line skipping is preserved: every well-formed entry in the same allowlist still loads and still suppresses, whatever its neighbours look like."
  - "This runs on every commit in this repository and in every project the package is installed into. Loading must stay a single linear pass and must not measurably lengthen the hook's runtime."
  - "The verification harness must run the pre-commit check as its own process against a temporary tree it owns — its own git repository, its own project root, its own allowlist — and must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root. The live file is what the hook actually reads, so a stray write would disable the real gate as a side effect."
  - "Fixture files must use ordinary source filenames — the per-file scan short-circuits environment-named files to a single filename-based finding and never reads their content, so such a fixture cannot produce the content findings these criteria depend on."
  - "The blocking-finding fixture must use a rule the pre-commit check never post-filters. Its prose exemption removes high-entropy findings for files under certain path prefixes, so a high-entropy finding is the wrong choice for the arm that proves the commit is blocked."
test_spec:
  - name: test_unmatchable_entry_warnings_reach_the_developer_on_the_precommit_path
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    description: "Deploy with build.py into a temporary target, stage files in a temporary git repository whose allowlist carries one entry of each unmatchable shape plus two well-formed ones, run the pre-commit secrets check as a subprocess, and assert three warnings on the error stream — one per offending line, each naming the allowlist file, its 1-based line number and its verbatim text."
  - name: test_wellformed_neighbours_still_suppress_and_only_the_uncovered_finding_blocks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: deployed
    description: "In the same run, the two well-formed entries still suppress their findings, the uncovered private-key finding is reported on the findings stream, and the process exits non-zero on that finding alone."
  - name: test_unmatchable_entries_alone_do_not_block_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: failure
    description: "With the same allowlist and a staged set in which no finding survives suppression, the three warnings are still on the error stream and the process exits zero — a cosmetic mistake in a file read on every commit must not become a repository-wide outage."
  - name: test_one_allowlist_warning_convention_and_none_of_it_on_the_findings_stream
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "Asserted as a property of the whole run's output: no allowlist diagnostic appears on the findings stream, and every diagnostic on the error stream matches one single shape — the same three-part shape already emitted for outright-malformed entries — so the new class did not fork the convention."
test_rationale: |
  This is the criterion every "the author is told" claim in the L1 rests on, and
  the component already contains a guard documented as bringing in a specialist
  that does no such thing — a placeholder that always reports success. Loading the
  allowlist directly and inspecting the message proves the string exists, not that
  it reaches anyone, so three of the four descriptors run the pre-commit check as
  its own process against a build.py-deployed copy in a temporary git repository.
  That single shape charges reachability, real_artifact and deployed at once, per
  the test-angles guidance, and it is the only shape that can distinguish a warning
  that is emitted from a warning that is received. The fourth descriptor is the
  one-convention guard and is deliberately written over the whole run's output
  rather than over any single message.
