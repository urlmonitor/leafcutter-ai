documentation_rationale: >
  No new user-facing surface, command, or interaction flow is introduced. This
  L1 adds one more class of finding to an existing merge-gate check whose timing
  and reporting are already documented by the BP-1000 family (the finalize merge
  gate it shares) and whose registry shape is documented by BP-100b-11. The
  failure report's content is fully specified behaviorally in BP-900e-4. The
  seam against BP-1000 / BP-900b / BP-100b-11 is captured in the AC bodies, which
  are the authoritative specification for the implementing agent.
