assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - '`python -m kernel decisions publish` is the only writer of docs/decisions/ (ADR-060): it runs
    only when a person invokes it, validates everything before writing, writes atomically, and exits
    0 ok, 3 refused (problems listed, nothing written), 5 environment error.'
  - 'A correction is explicit (--correct) and append-only: it changes only corrections and superseded_by
    of the older record and preserves the original selected option, evidence ids and assumptions.'
  - 'No real decision record has been superseded yet (2026-10-02): tests build their own fixture records;
    the ids in the criteria fix the expected shape, not the test data.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_correct_appends_one_entry_and_a_link_and_changes_nothing_else
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCorrection::test_correct_appends_one_entry_and_a_link_and_changes_nothing_else):
      one correction (reason, corrected_by, superseded_by, preserved), superseded_by extended, every
      other field equal'
    covers:
      - DK-300d-3-i
  - name: test_a_second_correction_appends_to_the_first
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCorrection::test_a_second_correction_appends_to_the_first):
      an earlier correction entry is unchanged'
    covers:
      - DK-300d-3-i
  - name: test_publishing_a_superseding_record_leaves_the_older_one_untouched
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCorrection::test_publishing_a_superseding_record_leaves_the_older_one_untouched):
      without --correct nothing changes'
    covers:
      - DK-300d-3-i
  - name: test_correct_without_a_superseding_staged_record_is_refused
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCorrection::test_correct_without_a_superseding_staged_record_is_refused):
      refused, nothing written'
    covers:
      - DK-300d-3-i
  - name: test_the_correction_records_its_time_and_the_new_option
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'TO WRITE (in tests/kernel/memory/test_publish_cli.py): the correction entry''s corrected_at
      equals the new record''s approved_at and new_selected_option_id its selected option'
    covers:
      - DK-300d-3-i
delivers_to: null
expects_from:
  ac_id: DK-300e-3-i
  contract: 'A staged kernel.memory.models.DecisionRecord at <run_root>/runs/<run_id>/staged/decisions/<new
    id>.yaml whose supersedes lists the older record id and whose precedents_considered holds {id:
    <old id>, action: set_aside, note: ''...chose a different option...''}; publish applies the correction
    only when --correct <old id> names a record that a staged record supersedes.'
