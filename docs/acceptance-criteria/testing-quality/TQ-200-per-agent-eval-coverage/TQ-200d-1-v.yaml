roadmap_phase: phase_1
criteria: |
  Given the test-writer "refresh-gate" row, whose wrong version is "drop the
      retry_due condition",
    And a produced test file with four tests tagged "# covers: TQ-9201":
      test_refresh_fires_when_both_due, test_refresh_blocked_when_retry_not_due,
      test_refresh_blocked_when_refresh_not_due and
      test_refresh_blocked_when_neither_due,
    And all four pass on the fixed version, and under the wrong version only
      test_refresh_blocked_when_retry_not_due fails,
  When the row's wrong-version check runs the tests,
  Then the check passes,
    And its detail names test_refresh_blocked_when_retry_not_due as the test
      that caught "drop the retry_due condition",
    And the three tagged tests that pass under the wrong version are not
      counted as blocking survivors,
    And a file whose tagged tests all pass under the wrong version fails with
      "not caught by the runner (survivor)",
    And a file in which a tagged test fails on the fixed version fails the
      check, even when another tagged test catches the wrong version,
    And a file with no "# covers:" tagged test still fails with "no
      '# covers: <AC-ID>' tagged test in the output",
    And a file whose only catching test is untagged fails.

  Given an acceptance criterion of real build work (not an eval row) whose
      record names a wrong version under must_catch on two tests,
  When the shared wrong-version runner judges a run in which one of the two
      survives,
  Then that verdict is unchanged by this fix: the survivor still blocks the
      gate.

  Given the kept live outputs of the 2026-11-02 first live run, re-run 1 and
      re-run 2 for the refresh-gate row, recorded as probe fixtures,
  When the check scores them,
  Then the re-run 1 and re-run 2 files pass, and a copy of each with the
      catching test removed fails (no false green),
    And the recorded gold output for the row still passes.

  Given the change is done,
  Then the wrong_version_run entry on the test-writer assertion-kind
      reference page states the one-catching-test rule, which tagged tests
      are blocking and which are not, and carries a passing example with
      more than one tagged test,
    And the wrong-version runs reference keeps describing the build-pipeline
      verdict as before,
    And the drift tests that hold the reference entries equal to the kind
      registry and to the quoted template sentences stay green,
    And the produced-tests section of the evals README states the rule in one
      line linking the entry,
    And the known issue "wrong-version run requires every tagged test to
      catch" is moved to resolved naming this AC and its proving tests, with
      the Open/Resolved count of the testing-quality known-issue register
      recounted,
    And one changelog entry names this AC and the resolved known issue,
    And no glossary term is added except through the glossary-triage flow.
