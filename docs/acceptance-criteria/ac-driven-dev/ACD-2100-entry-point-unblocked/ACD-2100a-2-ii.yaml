      AC-authoring worktree subcommand resolves to that repository and the requested
      worktree is present on disk under it after the process exits.
  - name: test_fastlane_worktree_subcommand_resolves_repository_by_search_when_script_lives_outside_any_repo
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The identical layout exercised through the fast-lane worktree subcommand; it
      resolves to the same single repository and the requested worktree is present on
