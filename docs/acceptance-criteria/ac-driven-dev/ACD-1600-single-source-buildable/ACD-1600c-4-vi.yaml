notes: |
  Authored by /quick-fix. Root cause: The it-po agent template never mentions declared_files (git log -S on templates/agents/it-po.md finds no commit that ever did), yet the pipeline after it requires the field: ACD-1600c-1 holds a record with no declared files back 'for enrichment' with reason 'missing file targets', and the test designer reads only declared_files. The enrichment stage that is meant to supply it was never told to. Fix: make declared_files part of the IT product owner's enrichment output for every record that changes code or docs: a top-level list placed before it_requirements, each entry `{path: <repo-root-relative, forward slashes>, state: existing | to_be_created}`, exactly the shape in docs/reference/ac-schema.md 'The declared_files Field' (validated by scripts/ac_store/declared_files.py). Rules to state: declare only files the record's own change edits or creates (a file it only reads stays a doc_link); edit templates, not build outputs (ADR-001); confirm an `existing` path is really present; never write an empty list (leave the key out for a record with no files, e.g. a pure decision record); keep it consistent with the it_requirements and doc_links 'modifies' links (the rule check's 'declared files versus modifies links' family). Add it to the description/outputs contract, a short section next to it_requirements, the checklist, and the worked example. Keep the template edit compact (agent templates have size limits); do not restate the schema reference, link to it..

  PLACEMENT. ACD-1600c is at its 5-L2 cap, and this is a constraint on the already-specified
  ACD-1600c-4 behaviour (a requirement lists the files its work changes): it names the
  authoring stage that must populate that list, so it is an L3 Roman child of ACD-1600c-4.
  Component: templates/agents/*.md matches agent-registry and agent-compatibility by
  directory pattern, but both are generic catch-alls for every agent template; the behaviour
  is /plan-feature AC enrichment, which ac-driven-dev's description names explicitly.
