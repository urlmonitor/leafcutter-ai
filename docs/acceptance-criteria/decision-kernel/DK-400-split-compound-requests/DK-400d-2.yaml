id: DK-400d-2
title: "Rewording and leaving out parts in one approval: reworded parts keep the proposal, left-out parts never run"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the split-bounds split waiting at the split gate with parts p1, p2 and p3,
  When the person human:user rewords p2 from "Decide how many child decisions one run may start" to
    "Decide how many child decisions one run may start, counting every split in the run",
  And unticks p3,
  And approves with the note "p2: count every split in the run. p3 left out: parallel children are
    out of scope; children run one after another.",
  Then p1 is recorded as kept, p2 as edited and p3 as left out,
  And p2 keeps its proposed text beside the reworded text, and its quote is unchanged,
  And p2 runs with the reworded text as its question,
  And p3 never runs,
  And the split keeps the person's note word for word.
