id: GE-127d-5
title: "The refusal's advice and every published statement of the size rule say that no comment counts, and none names a comment style that is free"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a staged covered file over its permitted length,
  When the author performs an ordinary commit and it is refused,
  Then the advice in the outcome states that comments of every style, and Python
    strings standing alone as statements (docstrings and bare strings alike), do
    not count toward the length, that a string which is used (assigned, passed,
    returned or part of a larger expression) does, and that blank lines do not
    count anywhere,
  And the advice does not state that comments of any one style count, does not
    state that removing comments or blank lines reduces the length, and does not
    name any comment style or form whose content is uncounted while another is
    counted,
  And the advice states that rewriting comments in another style, deleting
    comments, standalone strings or blank lines, and joining lines are not ways to
    bring the file within its limit,
  And the outcome's statement of what the quoted length measures states the same
    rule,
  And given every published place that states the size rule,
  When the published-versus-enforced comparison runs over the repository's real
    published places and the rule in force,
  Then each published place states that line comments, block comments and Python
    strings standing alone as statements are all uncounted, that used strings
    count, and that blank lines are not counted anywhere,
    and the comparison reports zero disagreements and a count of places compared
    greater than zero,
  And given one published place is left stating an earlier rule — that `#` or
    `//` comment lines count, that blank lines count, or that only block comments
    and triple-quoted strings are discarded — while every other place states the
    rule in force,
  When the author performs an ordinary commit,
  Then the comparison names that place, and the commit does not complete.
depends_on:
  - GE-127d
  - GE-127d-1
  - GE-127d-3
  - GE-127d-4
