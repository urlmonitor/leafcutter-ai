title: "Position is exact: a blank line or any other line before the feedback-id line fails the lint"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000g-3.yaml
criteria: |
  Given three synthetic examples in a skill file, each under the heading
    `### 2026-05-08 15:12 — python-coder (status: ok)`:
      (a) a blank line, then `feedback-id: fb_2026-05-08_aa112233`;
      (b) `red_baseline_results:`, then `  - test_name: test_foo`, then
          `feedback-id: fb_2026-05-08_aa112233`;
      (c) `completion_manifest:`, then `feedback-id: fb_2026-05-08_aa112233`,
  When the template lint runs,
  Then it fails on all three and names each heading's line number,
  And for (a) it reports a blank first body line, even though the commit-time
    feedback-id check (which looks up to two added lines below a heading) would accept
    (a) and (c),
  And when each example is changed so that the feedback-id line sits directly under the
    heading, with its other lines unchanged below it, the lint passes all three.
depends_on:
  - BO-2000g-3
doc_links:
  - path: templates/skills/signoff/SKILL.md
    relationship: describes
    status: exists
  - path: docs/known-issues/supervisor-system/open-low-ki-ss-20261009-comment-templates-omit-the-feedback-id-line.md
    relationship: describes
