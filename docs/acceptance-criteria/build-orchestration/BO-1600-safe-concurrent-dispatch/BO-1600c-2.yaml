criteria: |
  Given the drive has halted because the shared repository was found in a damaged
    state
  When the halt is reported to the operator
  Then the report states in plain terms that the shared repository is corrupted and
    the drive was stopped to avoid compounding the damage
  And the report names the specific damage found (for example which object is
    zero-byte or hash-mismatched, or that the index is unreadable)
  And the report tells the operator that the repository needs repair before the
    drive can be re-run, rather than implying the drive will recover on its own
