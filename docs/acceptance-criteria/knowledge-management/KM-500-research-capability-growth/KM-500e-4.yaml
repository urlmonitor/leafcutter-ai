notes: RQ7; ITPO-03 and RQE-05. Extend existing kind-level gap classification to required fields and source availability;
  preserve existing query admission and no arbitrary execution boundary. Authored using the business-analyst template
  under explicit user authorization to draft ACs; not approval or implementation proof.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Assess both catalog operation support and published generation kinds, directed relations, fields and disclosure
  availability against answer requirements. Capability metadata alone cannot prove the current generation can answer.
- Query-build eligibility is limited to a missing bounded registered operation over already supported canonical
  kinds/relations/fields under the existing recipe/compiler contract. Missing mappings or required source facts
  are not repaired by generating arbitrary Cypher.
- Classify missing query, unsupported mapping, missing required projection/disclosure field, evidenced absent canonical
  fact and unverified availability separately. Retain no-match, invalid input, permission denied, stale scope, budget
  exhaustion and retrieval outage as distinct outcomes.
- Classification has no registration, database mutation or external-provider side effect. Any eligible build follows
  existing authorization, verification, atomic catalog activation and resume controls.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_research_routes_supported_missing_query_to_governed_handoff
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Run RQE-05-P through public research with the operation withheld but required kinds, edges and fields
    explicitly supported; assert an attributable missing-query handoff and existing authorization gates, without
    immediate activation.
  must_catch:
  - Calling a query builder without checking field support or activating its result without permission.
  covers:
  - KM-500e-4
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_unsupported_mapping_cannot_become_query_build_eligibility
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Run RQE-05-N with Test/covered_by support absent and assert the unsupported mapping is identified
    and no builder or database-write action occurs.
  must_catch:
  - Treating a missing Test mapping as a missing registered operation that raw Cypher can fix.
  covers:
  - KM-500e-4
  requires_db: false
- name: test_query_fitness_retains_required_field_availability
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Feed actual requirements and operation/generation descriptors into the real capability assessment
    consumer for missing projection, omitted disclosure, evidenced source absence and unknown source state.
  must_catch:
  - Claiming canonical data does not exist merely because the projection or response lacks a field.
  covers:
  - KM-500e-4
  requires_db: false
- name: test_query_fitness_keeps_failure_classes_and_side_effect_boundaries
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Exercise no-match, denial, invalid request, stale source, exhausted budget and backend outage at
    the public dispatch boundary; assert distinct outcomes and no implicit catalog registration, source write or
    wider query permissions.
  must_catch:
  - Collapsing denied or unavailable retrieval into an empty successful answer or authorization to create a query.
  covers:
  - KM-500e-4
  requires_db: false
