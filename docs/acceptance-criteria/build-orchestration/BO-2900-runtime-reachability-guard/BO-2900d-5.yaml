notes: |
  Satisfies the parent L1's second `documentation_trigger` (`reference-doc`).

  Intended agent is `documentation-expert` — left null per this run's instruction.

  REFERENCE, NOT HOW-TO. This document states the contract as it is; the decision and
  the procedure are BO-2900d-4. The split matters here more than usual, because the
  audience differs: the how-to serves an author who has just been refused, the
  reference serves a reviewer deciding whether an accumulated set of exemptions is
  acceptable. A merged page serves the first and buries what the second needs.

  THE LAST CLAUSE IS THE NON-OBVIOUS ONE. By the time this ships the repository will
  have two distinct waiver vocabularies: this exemption (a unit legitimately has no way
  in) and BP-1100b-5's presence-only assertion waiver (an assertion is deliberately
  presence-only). Both are short reasoned annotations that make a check stop
  complaining, both live near the code, and they will be confused — an author will
  reach for whichever they saw last, get an unhelpful refusal, and conclude the guards
  contradict each other. One paragraph in each reference prevents that. This AC owns
  the paragraph on this side only; do not edit BP-1100b-5 from this tree.

  The BP-1100b-5 doc_link is recorded as `status: exists` because that AC was authored
  in the mainline store during the same session; it is not present in this worktree's
  checkout. Resolve the link against the merged store.

  2026-08-13 (IT PO enrichment). The IT PO's choice of a project registry FILE (rather
  than an in-source marker) strengthens this AC's final clause considerably: the two
  waivers now differ in medium as well as in scope, so the confusion the clause exists
  to prevent is much harder to fall into. Say so in the paragraph.
