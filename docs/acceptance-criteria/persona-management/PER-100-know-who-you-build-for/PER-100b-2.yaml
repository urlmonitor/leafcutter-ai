id: PER-100b-2
title: "persona_for value must reference an existing persona directory"
component: persona-management
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given an AC YAML file with persona_for: "field-service-engineer"
  And a persona directory exists at docs/personas/field-service-engineer/
  When the persona reference validator runs against the AC file
  Then validation passes without errors

  Given an AC YAML file with persona_for: "non-existent-persona"
  And no persona directory exists at docs/personas/non-existent-persona/
  When the persona reference validator runs against the AC file
  Then the validator emits a warning naming the unresolvable persona: "non-existent-persona"
  And the warning includes the AC file path and the AC ID
