id: KM-400a-1-ii
title: ADR metadata distinguishes authored document fields from decision status in its body
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given an ADR declares title, type, status, created, last_updated and components
  And it may also declare description, deciders, affects_diagrams, labeled related_docs or related_code references and extension fields
  When the ADR's native fields are exposed as graph metadata from the selected source revision
  Then every authored frontmatter value remains available with its original value and structure
  And the complete Markdown body is available separately from that frontmatter
  And document status active remains distinct from a body decision status Accepted
  And the first applicable body status table retains its ordered labels, raw values and source locations
  And a convenience decision status, date, author or supersedes value is supplied only from an unambiguous corresponding row
  And later unrelated tables and free prose cannot manufacture those convenience values
  And explicit source identity is retained, or the existing complete document identity is used without shortening it to an ADR number

  Given a legacy ADR omits frontmatter or fields required by current authoring guidance
  When its metadata is exposed
  Then its authored content remains available and the missing source fields remain absent
  And source diagnostics distinguish missing or unconventional fields from filled-in defaults
  And a body Supersedes value of None remains source text rather than becoming an invented null field
