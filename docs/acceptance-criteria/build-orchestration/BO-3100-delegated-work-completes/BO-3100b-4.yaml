notes: |
  Satisfies the sequence-diagram entry in BO-3100b's documentation_triggers.

  The diagram's job is to make the evidence-not-reply ordering visible, because that ordering
  is the whole fix and it is invisible in the code path: a diagram that shows the reply
  arriving and the verdict following looks identical whether or not the verdict was read from
  it. Showing the before-and-after state capture as separate interactions is what
  distinguishes the two.

  The second scenario is what stops this being decoration — the diagram is checked against a
  real re-run rather than against the author's intention.

  Sequenced after b-1 and b-2 because it depicts both the judgement and its consequence.

  IT-PO ENRICHMENT NOTE (2026-08-26). The coherence test needs the build record to be
  programmatically readable as an ORDERED trace, which is a real obligation on BO-3100b-2 and is
  written into this AC's expects_from rather than assumed. Without it the check degrades to a
  hand-authored comparison, which reproduces the author's assumption about the ordering — the
  assumption the diagram exists to record and the test exists to falsify.
