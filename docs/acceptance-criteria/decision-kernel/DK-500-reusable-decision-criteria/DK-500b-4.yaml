criteria: |
  Given a decision run in which a criterion was drafted for a gap, "Can the format be read into the knowledge graph as one reviewed kind?",
  And the published library holds cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c, cat-52b16c7b5a23106f, cat-d6ce5f78c181ebd1 and cat-1df63b670163b54e,
  When the drafted criteria are grouped before the approval of proposals,
  Then each drafted criterion is shown at that approval with its suggested existing category or with "none",
  And every Jev call spent on this grouping counts against the run's Jev budget,
  And a suggestion takes effect only when the person accepts it at that approval, and the person can change or undo it there,
  And in a run whose library holds no published category, no grouping call is made.
