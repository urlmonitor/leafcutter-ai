id: GE-133a-1
title: "Only the location the configuration declares is set aside: a feature family can cross the limit without a skipped check, a same-named source or test folder is still judged, and a declaration that cannot be read sets nothing aside"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the configuration declares one set-aside location, the AC store's root
    folder docs/acceptance-criteria/, with a stated ground that its folders hold
    records read by tools and navigated by nobody,
  And a feature folder under it, docs/acceptance-criteria/build-orchestration/
    BO-3800-refusal-summons-specialist/, held 15 countable files at the parent
    revision,
  When the author stages 4 further record files in that folder, taking it to 19,
    and in the same commit creates a new feature folder under a component folder
    of the store holding 20 record files, and performs an ordinary commit,
  Then the commit completes,
  And the configuration holding the declaration is byte-for-byte what it was
    before the commit, so a feature family joins the set-aside location without
    anyone adding it by name.

  And given the same declaration, and three folders outside the store that each
    held 15 countable files at the parent revision: the source folder
    templates/acceptance-criteria/, the test folder
    unit_tests/acceptance-criteria/, and docs/acceptance-criteria-archive/, whose
    path begins with the same characters as the declared location,
  When one commit adds one file to each of the three and 4 record files to the
    BO-3800 store folder, and the author performs an ordinary commit,
  Then the commit does not complete,
  And the folders it names as too dense are exactly those three, each at 16
    files, and the store folder is not named — a folder sharing the store's
    name, or the first characters of its path, is not thereby inside it.

  And given instead that the configuration holds no set-aside declaration at
    all,
  When the author stages the same 4 record files into the BO-3800 store folder
    and performs an ordinary commit,
  Then the commit does not complete, the store folder is named as too dense at
    19 files and is not reported as set aside,
  And the outcome states that the set-aside declaration could not be read and
    names where it was looked for,
  And given instead a declaration whose single entry names no location, the same
    commit is refused in the same way and the outcome names the entry it could
    not interpret.

  And given instead that the declaration is present, readable and lists no
    locations,
  When the author stages the same 4 record files and performs an ordinary
    commit,
  Then the commit does not complete and the store folder is named as too dense,
  And the outcome does not state that the declaration could not be read — an
    empty declaration is a decision that nothing is set aside, and is reported
    differently from one that could not be read.

  And given instead that the declaration names a different location,
    records/criteria/, and does not name docs/acceptance-criteria/,
  When the author stages the same 4 record files into the store folder and, in
    the same commit, takes a folder under records/criteria/ from 15 files to 19,
  Then the commit does not complete, the only folder it names as too dense is
    the store folder, and the folder under records/criteria/ is not named — so
    which location is set aside follows the declaration and is not a path built
    into the check.
