criteria: |
  Questions reach you while you are there and your answer continues the work.

  When the route needs a decision it asks you and carries straight on from your
  reply. Nothing stalls into a saved record you have to come back and revive
  and no answer is ever supplied on your behalf. Changing your mind mid-way
  costs a sentence rather than a restart.
