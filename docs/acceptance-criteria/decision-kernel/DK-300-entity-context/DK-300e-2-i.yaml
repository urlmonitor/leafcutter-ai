notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: M
it_requirements:
  - "An evaluation with zero selected cases is invalid, never a success-shaped empty aggregate."
  - "Fault injection must exercise a plausible wrong version of the production result/policy/scan and make the labelled evaluation fail even if unrelated outcomes pass."
test_required: true
test_spec:
  - name: "test_empty_recognition_corpus_cannot_pass"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_evaluation.py::test_empty_recognition_corpus_cannot_pass: Run the harness with zero selected cases and assert explicit invalid/failed result without passing aggregate."
  - name: "test_labelled_evaluation_rejects_identity_permission_and_tail_faults"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "discrimination"
    description: "tests/kernel/entity_context/test_evaluation.py::test_labelled_evaluation_rejects_identity_permission_and_tail_faults: Inject wrong identity, denied-source leakage and dropped-goal-tail faults separately; assert affected case expected/observed violations and failed aggregate despite unrelated correct answers."
    must_catch: ["A report that computes a passing result from an empty case list.","Checking final-answer quality while ignoring entity-label, permission or tail-scan failures."]
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
