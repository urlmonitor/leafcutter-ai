criteria: |
  Given the same three-file staged set as the parent criterion — two files under
    locations to which reduced scrutiny applies
    ("docs/retrospectives/2026-08-19-incident.md" and
    "templates/skills/example-skill/scripts/helper.py", placed there
    deliberately because the reduction is the subject) and one outside them
    ("src/app.py", the control),
  When the staged set is checked on the path a real commit takes and the two
    streams are captured separately,
  Then the output stream carries the finding for "src/app.py" in the report
    format it already uses, and carries no part of the notice — not the header,
    not a per-file line, not the count,
  And the error stream carries the notice and nothing that belongs to the
    findings report,
  Because the output stream is what the check's own summary and any log reader
    parse; a line of notice text mixed into it corrupts a report that other
    things already depend on, and a capture that merges the two streams cannot
    tell a correct notice from one that did exactly that.

  Given a staged set on which the check produces no findings at all and no
    withheld findings,
  When the staged set is checked on the path a real commit takes,
  Then the output stream is what it is today for a clean run,
  Because this record adds a stream, it does not renegotiate the existing one.
