title: "Your approved requirements are always what agents execute against — never a stale copy"
component: ticket-creation
level: L0
status: active
req_status: draft
work_status: todo
criteria: |
  One source of truth from approval through delivery — no copies, no drift.

  When you approve a requirement, that exact text is what every agent reads,
  signs off against, and delivers. There is no intermediate document that can
  go stale, contradict the original, or lose context in translation. The
  requirement itself carries its own dispatch state, progress tracking, and
  sign-off history. What you approved is what gets built — guaranteed.
