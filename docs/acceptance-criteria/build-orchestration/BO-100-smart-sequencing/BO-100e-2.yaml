notes: |
  TERMINATION IS PART OF THE CRITERION, not a detail — BO-100e says so explicitly. A
  loop that never returns empty is a hang, and a hang is a worse outcome than the
  shortfall being fixed, because the shortfall at least ends.

  The second scenario exists because the cheapest way to guarantee termination is to
  stop at the first empty look, which reintroduces KI-BO-025 exactly: at the moment
  the first layer is still in progress, nothing else is eligible.

  The third scenario is the anti-silence clause. Without it, a run that never
  re-looked and a run that re-looked and found nothing produce identical output, and
  the criterion cannot be falsified by a build that quietly kept the old behaviour.
