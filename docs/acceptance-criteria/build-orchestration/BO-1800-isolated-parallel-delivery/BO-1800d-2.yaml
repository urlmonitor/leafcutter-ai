assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Garbage collection / maintenance MUST run only when no drive is active against that repository (between drives), as a single-writer operation (git maintenance run / git gc), and MUST never start against a repository while a drive is writing to it (ADR-018 Decision §2, Migration §2)."
  - "Concurrent gc is documented to risk deleting an in-use, not-yet-referenced object -> corruption; the single-writer-between-drives rule prevents this."
  - "The scheduling logic MUST live on a portable package surface (scripts/ or templates/scripts/) deployed by build.py, and MUST handle gc/subprocess errors per the project error handling policy."
