notes: |
  ABSTENTION OVER ACTION, MADE FALSIFIABLE RATHER THAN MERELY WRITTEN DOWN. The
  rule is inherited from ACS-1300 and ACD-2300 in their own form and must not be
  re-derived in a competing one: untrustworthy evidence produces a REPORTED
  abstention — never a silent skip, and never a write. This record is where it
  becomes checkable for this class of tool.

  TWO HALVES, BOTH REQUIRED, AND THE SECOND IS THE ONE THAT GETS LOST. The first is
  "does not write what it could not establish". The second is "says which records
  it passed over and why". An implementation with only the first is a tool whose
  silence means three different things — nothing matched, something matched and was
  rejected, or the tool never looked — and the user cannot tell them apart. This
  component has been caught by exactly that shape repeatedly enough that it has its
  own register entry family; treat a silent skip as a defect, not as a conservative
  choice.

  THE EVIDENCE THIS TOOL ACTUALLY HAS, STATED PLAINLY SO THE BAR IS SET HONESTLY.
  It matches by text similarity and keyword heuristics against completed tickets.
  That is weak evidence and it is allowed to remain weak — this criterion does not
  demand a better matcher. It demands that what the matcher produces is recorded as
  what it is. A proposal recorded as a proposal is useful; a proposal recorded as a
  finding is the whole defect.

  MANDATORY NEGATIVE ARM. Every positive reading is satisfied by a tool that writes
  nothing and reports nothing. The arm that distinguishes real abstention from
  inactivity is a single run containing BOTH an established match that was recorded
  AND an unestablished one that was left alone and named in the report. Both halves,
  one invocation.

  INHERITED, NOT RESTATED: every figure this tool reports states the total it was
  measured against (ACS-1100, standing), and a record with nothing to repair is
  never opened for writing (TQ-400e-1 owns that rule and its test shape).

  BOUNDARY WITH ACS-1600b. That one refuses one field absolutely, whatever the
  confidence. This one governs every other field by the strength of the evidence.
  Read the L0's notes for why neither implies the other before merging them.
