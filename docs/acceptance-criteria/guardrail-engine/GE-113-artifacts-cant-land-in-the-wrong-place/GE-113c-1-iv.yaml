notes: "Architectural constraint reinforcing GE-113c-1's shared-resolver mandate: rather than each guard re-deriving the project root (the recurring source of the deployed-layout .leafcutter false-fail / ModuleNotFoundError bug class), all guards route through one corrected helper so the class cannot recur. Origin/main now carries THREE divergent resolvers (check_components_integrity _repo_root, _resolve_root.find_project_root, and check_doc_frontmatter _resolve_worktree_root from GE-115/#235) — direct evidence that per-guard fixes keep re-introducing the divergence this AC exists to end. IT-PO recommends the shared helper (it already exists as _resolve_root.py); this AC makes its universal adoption an explicit, testable constraint."
