assigned_agent: workflow-architect
estimated_complexity: S
it_requirements:
  - >-
    The main/master case must be handled by the same single isolation decision
    as the not-a-repo and detached-HEAD cases, not by a separate guard. A
    second, parallel branch check is a second mechanism that will drift from
    the first.
  - >-
    No confirmation prompt may be offered for committing to the default branch.
    Confirming it produced work that could not be pushed, so a gate there is not
    a safety feature but a slower failure.
  - "Must handle errors gracefully per the project error handling policy."
