notes: |
  Origin: the 2026-09-25 run failed first because bare git ran from the workspace parent
  (F3), and the installed copy of today's script cannot find the repository when it lives
  outside it (F11, KI-ACD-004). The resolvers also disagree on ambiguity -- one takes the
  first match, another refuses anything but exactly one. The customer intent is "refuse
  when ambiguous, never guess".

  Q5 where workspaces live -- DECIDED (user, 2026-09-28): in a SIBLING folder per project,
  <parent-of-project>/<project-dir-name>-worktrees/<slug>, outside the project so tools and
  tests never scan the clones and two projects in one parent folder never collide. It applies
  to the package's own dev layout too, unless an explicit --landing-root override is given,
  which the maker still validates (BO-4300b-2, BO-4300b-2-i).
  Q6 the package repository's own install copy -- DECIDED (user, 2026-09-28):
  leafcutter-ai/.leafcutter/ must NOT exist. It is deleted, and build.py refuses to build into
  the package repository itself unless an explicit --target-dir is given (BO-4300f-2). The
  resolver never reads any install copy (BO-4300b-2-ii), so "the right project is found" does
  not depend on the deletion.

  Distinct from ACD-2100a, which is the requirements entry route finding its OWN files
  from any folder. This record is about the workspace that any route receives.
  "Any platform" includes a Windows/WSL mix: decision 1 (clones embed no absolute path)
  is what makes that possible; paths handed back must be usable from either side.

