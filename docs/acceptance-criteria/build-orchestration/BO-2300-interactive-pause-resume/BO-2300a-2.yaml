  - path: docs/architecture/adrs/ADR-024-interactive-pause-resume.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-030-dual-engine-workflow-support.md
    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Run-status enum discriminating a resumable pause from a genuine cancellation."
    properties:
      status: {type: string, enum: [paused_awaiting_input, cancelled, running, completed]}
      resume_eligible: {type: boolean, description: "true only when status == paused_awaiting_input"}
    required: [status]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: implemented in the E2 workflow ENGINE (JavaScript). The JS engine must return the distinct status 'paused_awaiting_input' from a paused gate (never 'ok' and never 'cancelled'), and the persisted record's status field must record the same. This is the return-status change in the workflow files, not a standalone Python module."
    - "'paused_awaiting_input' and 'cancelled' must be distinct, inspectable run statuses; only 'paused_awaiting_input' is eligible for resume-by-answer."
    - "Status inspection must be read-only (must not mutate run state); reading the record is done via an agent() dispatch (the E2 body performs no direct fs read)."
    - "The distinction is load-bearing for the rest of BO-2300: resume/durability must target only pause records and never attempt to revive a truly-cancelled run."
    - "Deployed/template parity via the build.py round-trip (ADR-001); E2 top-level-body form (ADR-030)."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js) — a headless gate returns paused_awaiting_input while an explicit-cancel answer returns cancelled; assert the two are distinguishable and only the former is resume-eligible. Do NOT test a standalone Python module."
delivers_to: null
expects_from:
  ac_id: BO-2300a-1
  contract: "The durable pending-question record carrying a status field; this AC reads that status (via the resume/inspect agent dispatch) to distinguish paused_awaiting_input from cancelled and to gate resume-eligibility."
test_spec:
  - name: test_paused_status_distinct_from_cancelled
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via run_workflow_under_e2(plan-feature.js), a headless-paused run returns paused_awaiting_input; a run answered 'cancel' returns cancelled; the two are distinguishable."
  - name: test_only_paused_is_resume_eligible
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, only a paused_awaiting_input run is eligible to be resumed by supplying an answer; a cancelled run is not."
  - name: test_status_inspection_is_readonly
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, inspecting a run's state (record read) does not mutate the run or its persisted record."
