notes: |
  FINDINGS THIS RECORD CLOSES (GE-120f evidence, re-derived 2026-09-01; GE-130f notes): three of
  the four gated folders resolve through links out from under the prefix match and never match;
  the fourth (a migrations folder) does not exist in this repository. The last clause does not
  require every gated folder to exist -- the package installs into projects that may have one --
  only that one matching nothing is named rather than counted.

  Linked-working-copy layout and whole-file writes are separate records (GE-130f-2-ii,
  GE-130f-2-i) because a repair can fix this record and leave either inert.

  declares_side_effect: false.
  IT-PO ENRICHMENT (2026-09-25).

  ASSIGNMENT CONFIRMED: python-coder.

  WHY THIS GUARD IS THE HARDER ONE TO PROVE. KI-CG-20260917's probe shows it refusing an Edit
  correctly, with exit 2 and the right message, in a throwaway repo whose .claude/hooks is a
  real directory. Everything green, guard inert where it ships. The defect is entirely in path
  resolution under the installed layout, so no fixture-directory test and no in-process import
  can see it. Every descriptor here runs out of process against a built copy that reaches its
  gated folders the way the real project does.

  RESOLVE BOTH SIDES, THEN COMPARE. The edited path, each gated folder and the project root are
  all resolved to their real targets before containment is tested; a resolved path that leaves
  the project is an ordinary non-match rather than an exception. A gated folder is matched under
  both spellings, its in-project path and its resolved target. GE-130f-2-ii is the record that
  proves one fix did not leave the other layout inert.

  THE ACCEPTABLE INPUT GOES THROUGH readme_marker_recorder. It is registered on PostToolUse Read
  in the same settings.json. A harness that writes the marker itself proves the guard can read a
  file the test wrote - the adjacent false green, and one this tree would otherwise commit with
  its own tooling.

  PACKAGE SURFACE DENIED DELIBERATELY. This record adds an ENTRY inside session_hooks_manifest,
  which GE-130f-1 creates. _package_surface_registry watches commit_guardian.json's document
  top-level keys and hooks_manifest.hooks ids; an entry one level inside a new section is
  neither. package_surface: false records that as a decision rather than an omission.

  ORDERING CAVEAT FOR THE USER. Same as GE-130f-1's: currently is written by GE-120f-1's runner,
  which is not built, and depends_on (BA-owned) lists only GE-130f. This record additionally
  expects GE-130f-1's section to exist; both are siblings under GE-130f with no edge between
  them. Flagged, not decided. [DECIDED 2026-09-25 (user): GE-120f-1 is built first; the depends_on edge enforces the order.]
