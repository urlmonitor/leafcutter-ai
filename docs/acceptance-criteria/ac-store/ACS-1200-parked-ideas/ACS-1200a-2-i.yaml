title: "A parked marker exempts only the record it is set on, never the records beneath it"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200a-2.yaml
criteria: |
  Given KM-200.yaml carries parked: true with a non-empty parked_reason and an
    empty covered_by,
  And its child KM-200a.yaml carries no parked field, has its own child
    KM-200a-1.yaml, and does not list KM-200a-1 in its covered_by,
  And KM-200.yaml, KM-200a.yaml and KM-200a-1.yaml are all staged,
  When the parent-back-link check is executed as a process against that staged
    set,
  Then the process exits non-zero,
  And it reports exactly one violation, naming KM-200a-1 as the child and
    KM-200a as the parent that does not list it,
  And it reports no violation for KM-200a, whose own parent KM-200 carries the
    marker,
  And the marker on KM-200 is not applied to KM-200a: a mixed tree yields one
    exempted link and one enforced link in the same run.
