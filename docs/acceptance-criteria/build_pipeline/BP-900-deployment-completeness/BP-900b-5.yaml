id: BP-900b-5
components:
  - build_pipeline
title: "Every package script or config file a compiled prompt tells the agent to run, import or read is deployed into a consumer install"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a consumer install produced by build.py into a project that is not the
    package repository (the adopter layout: package scripts are deployed to
    <output_root>/scripts/, package config to <output_root>/config/, and there
    is no package scripts/ or config/ directory at the project root),
  When a compiled agent, skill, command or workflow prompt tells the agent to
    run a package script (python <path>.py), import one (sys.path.insert(...)
    followed by "from <module> import", or "call <function> from <path>.py"),
    or read, load, open, fall back to or conform to a package config file,
  Then the file that reference names is present in that install, under
    <output_root>/, because the build deploys it,
  And the documentation-verifier's placeholder scan (its step 6a) imports
    build_placeholder_detection from the deployed scripts directory, written
    through the {{config.output_root}} placeholder, and runs there without
    ModuleNotFoundError,
  And build_placeholder_detection.py is deployed together with the
    build_placeholder_table_context.py module it imports,
  And a reference to a file that is not a package deliverable at all (a
    host-project script, or an optional helper the prompt already says to skip
    when absent) is named explicitly, with its reason, rather than silently
    ignored,
  Because at leafcutter v21.0.93 (pin 67a7b443) the documentation-verifier told
    the agent to run sys.path.insert(0, '<worktree_root>/scripts'); from
    build_placeholder_detection import scan_for_placeholders, while the build
    never deployed that module. In the DIAGraph adopter the verifier failed
    closed with ModuleNotFoundError, so every ticket with a
    documentation-verifier phase was blocked (INF-120c-3 halted exactly this
    way). BP-900b-4 fixed the reads of config files the build does deploy and
    left the reads of files it never deploys out of scope; this AC covers them.
depends_on: [BP-900b]
