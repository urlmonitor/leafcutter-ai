criteria: |
  Given a ticket triggers the architect agent (because the guardrail mapping
    includes an architecture gate for its change_target and risk_surface),
  When the architect begins its work,
  Then it searches the docs/architecture/ directory for existing documentation
    related to the component named in the ticket's component field
  And it searches for existing ADRs in the docs/architecture/decisions/ directory
    that reference the same component or related components
  And it reads all discovered documents before producing any new artifact
  And the architect's output references which existing documents it found:
    "Discovered: docs/architecture/components/X.md, docs/architecture/decisions/ADR-NNN.md"

  Given the docs/architecture/ directory contains 3 relevant documents for
    the component "build-orchestration",
  When the architect processes a ticket for that component,
  Then all 3 documents are listed in the architect's discovery output
  And the architect's produced artifacts are consistent with the existing documentation
    (no contradictions unless explicitly flagged as a design change)
