id: BO-3100a-1
title: "An agent holding the means to hand off work with no cleared recipient fails assembly"
component: build-orchestration
components:
  - agent_registry
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the system holds two separate declarations about hand-off: each agent's own
    definition, which either grants or withholds the means to hand work to another agent,
    and that agent's registry record, which lists the recipients it is cleared to hand
    work to,
    And one agent whose definition grants the means while its registry record lists no
    cleared recipient,
  When the system is assembled,
  Then assembly stops with a failure that names that agent and states that its definition
    grants a hand-off its record does not clear,
    And no assembled output is produced.

  Given an agent whose definition grants the means to hand off work and whose registry
    record lists at least one cleared recipient,
  When the system is assembled,
  Then that agent is not reported and assembly completes.

  Given an agent whose definition grants no means to hand off work and whose registry
    record lists no cleared recipient,
  When the system is assembled,
  Then that agent is not reported, so an agent that never delegates is never made to
    declare anything.
