notes: |
  THIS DISCHARGES THE PARENT L1's documentation_triggers OF [reference-doc]. GE-123b
  declares that trigger and its other four children are all code ACs assigned to
  python-coder, so until this record existed the trigger had no owner. With this
  record GE-123b has five children, which is exactly the hard cap — any further
  documentation for this L1 must be authored as an L3 under the child whose content
  it records, as the neighbouring GE-123d-4-ii was.

  WHY THE REFERENCE IS PART OF THE FEATURE AND NOT A FOLLOW-UP. The suppression
  section as it stands answers exactly one question — does this entry match this
  file — and presents matching as the whole of the behaviour. After this L1 lands
  that description is not merely incomplete, it is wrong: there is a well-formed,
  correctly-matching entry that is nonetheless not honoured. A reader working from
  the unamended section will write such an entry, see the results they tried to
  quiet, and have nowhere to find out why.

  THE SECOND ARM IS THE LOAD-BEARING ONE, and it carries the two statements the
  reader cannot infer. The first is that the judgement is made against every
  suppression in force together: the existing task guidance encourages writing
  suppressions out longhand, one narrow entry per rule, so the accumulated form is
  the one authors will actually hit, and a reference that describes only single
  over-broad entries will read as though the longhand form were safe. The second is
  that the counted quantity is the rules still able to report rather than the
  results produced — the findings-based reading is the natural one and under it the
  ordinary, documented use of the allowlist would look like a refusal.

  THE THIRD ARM'S NON-FATAL CLAUSE IS NOT DECORATION. The disposition chosen by the
  sibling code AC is refuse-and-announce specifically because this check runs on
  every commit and a hard error over one too-broad line becomes a repository-wide
  outage. If the reference describes the notice without saying it is not fatal, the
  readers who most need the feature are the ones most likely to avoid it.

  THE FOURTH ARM IS A PARITY REQUIREMENT and is stated because this document is
  being changed by three ACs in the same tree: GE-123a-4 amends the detection-rules
  section, GE-123c-5 extends the suppression grammar, and this record amends the
  suppression modes. Three edits to one file in one feature is exactly the situation
  where a statement survives that no longer matches the code.

  SCOPE, AGAINST THE SIBLINGS. This record answers "when is a suppression declined,
  and what happens then". GE-123c-5 answers "is this suppression form accepted".
  GE-123a-4 answers "is a name-matched file's content examined". Cross-reference
  rather than restate; the grammar has exactly one home.
