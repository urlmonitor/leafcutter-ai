criteria: |
  Given the shape-tracking store contains 5 occurrences of:
    - directory pattern: "docs/architecture/**", file count: 2, extensions: [".md"]
  And a new commit is logged with:
    - directory pattern: "docs/architecture/**", file count: 4, extensions: [".md"]
  When the shape tracker determines whether this is the same shape,
  Then the two are treated as the same shape (identity is based on directory
    pattern and extension set, not file count),
  And the occurrence counter increments to 6,
  And the counter does NOT start a separate count for "file count: 4".
