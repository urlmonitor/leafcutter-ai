  WHAT A READER OF THIS RECORD COULD STILL BE MISLED ABOUT
  ==========================================================================
    - THE 13.25x FIGURE IS STILL QUOTED, in the first amended_by entry, in the
      analysis doc this record links, and in yaml_safe_loader.py's own BUSINESS
      CONTEXT. It was measured on validate_ac_schema.py, which is NOT on the fast
      accessor any more. It is a true fact about the PARSER and a false implication
      about that script. Every surface that quotes it now says so, but a reader who
      sees the number alone will reach the wrong conclusion.
    - THE SURVIVING BENEFIT IS SMALL IN ABSOLUTE TERMS: ~19-21 s per build.py run, in
      documentation generation. Whether the test suite's repeated build spawns multiply
      that is NOT MEASURED and must not be assumed — if someone wants that figure, it
      has to be measured, not inferred from the per-build number.
    - THIS RECORD'S CENTRE OF GRAVITY HAS MOVED from a speed claim to a NEGATIVE
      INVARIANT — where the permissive parser may not go. The speed clause is the
      falsifiable anchor; the invariant is what is actually worth the most, and it is
      the part a future "let's finish the rollout" pass would destroy.
    - "TWO REMAINING CALL SITES" OVERSTATES THE LIVE SURFACE. Both are in
      generate_agent_cards.py, and only ONE of them is reachable in production:
      build_agent_cards() calls `_scan_all_ac_assignments`, while
      `_scan_ac_assignments` has no production caller at all — grep at 2026-10-08
      finds its definition, its own DECISION HISTORY comments (which say it was "left
      in place" after the single-walk perf fix), and two unit tests. So the accessor's
      live production footprint is ONE call site, and the paired-arm timing test must
      exercise `_scan_all_ac_assignments` or it measures dead code.
    - THE DEPLOY-MAP ENTRY for the accessor still exists with a comment asserting
      every store reader resolves through it. Nothing deployed imports it. A reader who
      trusts that comment will reconstruct the retracted claim from the build layer.
    - "FOUR CLASSES OF INPUT ON WHICH THE TWO PARSERS ARE KNOWN TO DIFFER", as
      TQ-600a-11-ii still words it, reads as exhaustive and is not. The fifth class —
      a tab inside a flow sequence — is the one that caused the defects, and it was
