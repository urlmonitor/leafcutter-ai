notes: |
  INHERITED FROM TQ-400e-1, DELIBERATELY NOT RESTATED IN A COMPETING FORM. The rule and
  its rationale live there; this record's job is to make the rule bite on THIS tool's
  write path, because a guarantee stated only in a neighbouring tree is not enforced
  here. Where the two records could be read as differing, TQ-400e-1 is the source.

  THE LAST-MODIFIED CLAUSE IS THE ONE ADDITION, and it earns its place by separating two
  failure modes that byte-identity alone conflates. A tool that reads a file, decides
  nothing changed and writes the same bytes back passes a hash comparison and has still
  opened every file in the store for writing — which is a real defect in a repository
  where mtime drives build caching and where a run should be safely re-runnable against a
  working tree someone else is using. It is also the cheapest possible proof that the
  early-return branch exists rather than being simulated by a coincidentally identical
  serializer.

  THIS CANNOT BE RETROFITTED, which is why it is an L2 and not a note. If the write path
  is built as load-the-store, mutate, write-it-back, every untouched record is reformatted
  by the serializer and this criterion becomes unimplementable without a rewrite. The
  decision has to be made before the first line of the apply step is written, and that is
  the whole reason the ACS-1300c L1 exists separately from ACS-1300a.

  THE FINAL CLAUSE COVERS THE STEADY STATE. Once the backlog is cleared, the expected run
  is one where nothing needs changing — and that run touching every file would make the
  repair unusable as a routine check, which is what ACS-1300b needs it to become.
