readiness: approved
priority: medium
title: "Each contract line names a genre, a target doc path, and a content constraint"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200c.yaml"
criteria: |
  Given the `### documentation-expert` subsection is being generated for a documented AC,
  When the generator writes that AC's `- [ ] AC-N:` line,
  Then the line names the Diataxis genre required -- one of `how-to`, `reference-doc`,
    `sequence-diagram`, `state-diagram`, `component-diagram`, or `explanation`.
  And the line names the target documentation path where the doc belongs.
  And the line names a content constraint derived from that leaf AC's `criteria`, so the
    writer knows specifically what the doc must cover rather than receiving a generic nudge.
depends_on: [BO-2200c, BO-2200c-1]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    contract_line:
      type: object
      properties:
        genre:
          type: string
          enum: [how-to, reference-doc, sequence-diagram, state-diagram, component-diagram, explanation]
        target_path: {type: string}
        content_constraint: {type: string}
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Each AC-N line carries three parts: Diataxis genre, target doc path, and a content constraint derived from the leaf AC criteria."
    - "The genre vocabulary matches the documentation_triggers enum plus `explanation`."
delivers_to: null
