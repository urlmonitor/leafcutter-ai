notes: |
  OBSERVED AS A HARD DEADLOCK, NOT A HYPOTHETICAL. On 2026-09-14 the completion write
  refused ticket 01 of EPIC-WorkIsOnlyEverMarkedFinishedThroughThe with: "the latest
  sign-off entry for 'python-coder' in the record reads status 'handoff', not a passing
  outcome."

  Every other surface agreed the phase was finished. python-coder's frontmatter read
  signed_off, its Sign-offs checkbox was ticked, the sibling it handed to (test-writer)
  completed at 13:40, and pr-reviewer independently re-verified the work at 14:20. The
  only dissenting surface was the comment's status tag.

  WHY IT CANNOT RESOLVE ITSELF. `POSITIVE_SIGNOFF_STATUSES = ["ok", "signed_off"]`
  excludes handoff, so the phase is permanently outstanding. Nothing can clear it:
  selectDispatchableByStatus dispatches only `needed` and `failed` phases, and this one is
  `signed_off`, so it is never re-dispatched and can never append the `ok` the check wants.
  Any ticket whose agent's last action was a handover is therefore unclosable, forever, by
  any number of re-runs. Three consecutive /build-feature runs each refused the same ticket.

  THE DRIVER CONTRADICTS THE PROTOCOL IT ENFORCES. The signoff skill's routing table
  defines handoff as "Phase completed and explicitly hands to a named sibling" and routes
  it to "Spawns the named agent next". It is a completion status by that document's own
  words. The drivers disagree, and the drivers win at the close.

  WHY CONDITIONAL AND NOT BLANKET. Accepting handoff unconditionally would let a DANGLING
  handover pass -- work handed to a sibling that never ran, recorded as accounted for. That
  trades a visible deadlock for a silent phantom-done, which is strictly worse and is the
  precise failure this whole BO-400e family exists to prevent. The counter-cases in
  test_spec are not thoroughness; they are the difference between the two fixes.

  PLACEMENT. BO-400e is at its five-child cap, and this is a technical constraint on an
  existing L2 behaviour rather than a new one, so it is a Roman-suffix L3 on BO-400e-1 --
  the criterion whose own ticket the defect blocked. BO-400e-1 governs which steps a close
  is checked against; this record governs what the close accepts as one of them having been
  met. A ticket can satisfy BO-400e-1 perfectly and still be unclosable under this defect.
