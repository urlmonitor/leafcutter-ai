notes: |
  ADR-026 phase_acbuild_3_migration + non-negotiable rule 4 (grandfathering). A consumer-safe
  backfill: idempotent, dry-run, targets an arbitrary store dir (--ac-store-dir), preserves
  human-authored notes blocks, and GRANDFATHERS already-done ACs so migration never mass-reverts
  them. MUST be opt-in: never runs automatically inside build.py -- the store is the user's
  authored data. RE-HOME CANDIDATE: touches ac-store / build-pipeline; kept in ac-driven-dev for
  cohesion. risk_surface=contract_boundary because it mutates the consumer's authored store.
