notes: |
  DOCUMENTATION AC, produced because ACD-2000a declares
  `documentation_triggers: [reference-doc, state-diagram]`. This is the
  state-diagram half; ACD-2000a-4 is the reference-doc half. Craft deliberately
  LEFT UNSET this pass; the intended craft is the architecture-diagram surface,
  and the IT PO fills assigned_agent / it_requirements / estimated_complexity /
  contracts.

  WHY A STATE DIAGRAM IS THE RIGHT ARTEFACT HERE AND NOT PADDING. The
  adjudication ladder is a genuine state machine with four rungs, each with its
  own cap: templates/skills/building-epics/SKILL.md §3.1 respawn same agent (cap
  1 per phase per ticket, ~line 693), §3.2 respawn a named sibling (cap 1 per
  phase pair, ~708), §3.3 spawn brainstorm-lead (cap 1 per ticket, ~723), §3.4
  halt and escalate (~740). Today that machine's state lives in an in-memory
  counter dictionary (~789) and is described only in prose. Moving it onto the
  requirement makes the states durable and inspectable, and a diagram is how an
  operator reads a durable state machine.

  THE FOURTH THEN CLAUSE IS THE ONE THAT EARNS THE DIAGRAM. "Never attempted"
  and "budget spent" are both quiescent states in which nothing is happening,
  and they look identical from the outside -- but one is ready work and the other
  is blocked work waiting on a person. Every scanner, dashboard and operator that
  reads the store has to tell them apart. A diagram that renders them as one
  resting node will teach the wrong model to everyone who reads it.

  THE TRANSITION OUT OF ESCALATED (third Then) is the one most likely to be
  omitted, because escalation feels terminal. It is not: ACD-2000a-2's fourth
  criterion requires a person to be able to make an exhausted requirement
  retriable again, and that decision is recorded as a trail entry rather than an
  erasure. If that edge is missing from the diagram, the diagram contradicts the
  behaviour.

  CONSISTENCY OBLIGATION: the states drawn here must be the states ACD-2000a-1's
  trail can actually represent and ACD-2000a-3's budget can actually reach. A
  diagram drawn ahead of those two, or not revisited after them, becomes a
  confident wrong picture -- worse than none.

  DO NOT CONFLATE WITH ACD-2000b's LIFECYCLE. ACD-2000b-5 covers the claim
  lifecycle (available / taken / handed back / reclaimed). The two machines run
  on the same requirement at the same time and are independent; drawing them as
  one diagram would imply transitions that do not exist.

  2026-08-17 (IT PO enrichment). Assigned architecture-diagram-author rather than
  documentation-expert: the S7b documentation-gate mapping routes the
  `state-diagram` trigger to that craft, it is a dispatchable ticket-phase agent in
  the registry, and BO-2900a-5 is the recent sibling precedent for exactly this
  call. Complexity S.

  PLACEMENT DECISION MADE THIS PASS, with the collision check the BA asked for.
  Verified: docs/architecture/agent_delivery_workflows.md already claims "blocker
  adjudication flows" in its own frontmatter description, and the Blocker
  Adjudication Ladder appears there at ~line 362 as a prose TIP with NO diagram --
  the page has five Mermaid diagrams, none of them of this machine. So unlike
  BO-2900a-5 there is no incumbent diagram to supersede; the risk is the inverse,
  a diagram added without amending the prose TIP that currently carries the whole
  explanation. That reconciliation is recorded as an it_requirement.

  ONE CONSTRAINT ADDED BEYOND THE BA's LIST: the diagram must be stateDiagram-v2.
  The fourth criterion -- two quiescent states that must not read as one -- is
  expressible in a state machine and not in a sequence diagram or a flowchart, and
  "state diagram" in the title is otherwise easy to satisfy with a flowchart that
  loses exactly the distinction the criterion exists for.
