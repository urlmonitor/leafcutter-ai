id: INF-300a-2
readiness: reviewed
priority: medium
title: "PO and BA agents consult the surface map before placing knowledge"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given the product-owner or business-analyst agent produces an output
    that contains persistent knowledge (a convention, a decision, a definition),
  When that agent determines where to write the output,
  Then it consults the knowledge surface map (or invokes route-knowledge skill),
  And routes the knowledge to the correct surface based on the documented rules,
  And does NOT place:
    - Python/code conventions into memory files (belongs in CLAUDE.md),
    - Architectural decisions into CLAUDE.md (belongs in an ADR),
    - Terminology definitions into CLAUDE.md (belongs in glossary),
    - Structured requirements into ticket prose (belongs in AC store),
    - User preferences into CLAUDE.md (belongs in memory).
