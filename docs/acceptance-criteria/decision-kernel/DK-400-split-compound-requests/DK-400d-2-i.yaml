notes: |
  Settles the DK-400d CARRY TO L2 point left to the BA: the gate refuses an approval with
  every part unticked, rather than treating it as a rejection. A rejection has different
  consequences per trigger (blocked, or kept whole), so it must be the person's explicit answer,
  never inferred.
