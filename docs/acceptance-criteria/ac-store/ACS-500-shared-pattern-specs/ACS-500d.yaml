title: "Pattern updates propagate automatically through shared components"
component: ac-store
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  When a pattern evolves, all consumers inherit the change automatically.

  Updating a shared pattern's definition means every page or endpoint that
  references it immediately reflects the new behavior — no manual migration
  across individual page ACs is required. If a page needs to deviate from the
  updated pattern, that deviation is expressed as a conscious, explicit,
  separate AC on the consuming page.
