id: BO-4400a-2
title: "A run that stops or fails keeps its workspace, names it, and leaves it reclaimable once nothing is unsent"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
declares_side_effect: true
criteria: |
  Given the build of a single ticket halts after making two commits in its workspace
    and leaving one changed file uncommitted, before anything is pushed,
  When the run returns its final result,
  Then the workspace still exists with both commits and the changed file
    byte-identical to their state at the halt,
  And the run's final result names the workspace's location, the two commits by
    identifier and the changed file by path, as work that was kept,
  And the live set lists the workspace with the holds-work verdict,
  And when the two commits and the changed file are afterwards committed and pushed to
    the workspace's own line on the shared project by hand, the next listing shows the
    workspace with the holds-nothing verdict,
  And a clearing request made through the one shared clearing door then removes it,
    without any authorisation to lose work being given.
depends_on: [BO-4400a, BO-4400a-1, BO-4100c-1, BO-4100e]
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-2100-entry-point-unblocked/ACD-2100c-5.yaml
    relationship: constrains
    status: exists
    relevance: Work is thrown away only when the person chooses to; a halted run keeps it.
  - path: docs/acceptance-criteria/build-orchestration/BO-4100-sound-workspace-by-construction/BO-4100e.yaml
    relationship: related
    status: exists
    relevance: The complete listing in which a kept workspace must appear.
  - path: docs/acceptance-criteria/build-orchestration/BO-4300-one-way-workspaces/BO-4300e-2.yaml
    relationship: constrains
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  - agent: python-coder
    contract: >-
      Halt-path handling for every route: the route-end clearing request is still issued on a halted or failed
      run, its answer decides kept or cleared, and the final result keeps the run's own failed status. A kept
      workspace is relayed as {workspace_path: absolute, reason: the landed rule's kept reason (not_on_main or
      holds_unsent_work), commits: [sha], files: [repo-relative path]}. Consumed by BO-4400a-2-i (quick fix
      after its pull request opened).
expects_from:
  ac_id: BO-4100c-1
  contract: "Holds-work / holds-nothing verdict per listed workspace."
package_surface: false
declared_files:
  - path: templates/workflows-js/build-ticket.js
    state: existing
  - path: templates/workflows-js/build-feature.js
    state: existing
it_requirements:
  - >-
    HARNESS PREREQUISITE: the proof drives the single-ticket route with the real maker through the exec bridge
    that BO-4400g-4 adds to unit_tests/_workflow_engine_harness.py, so it is built after that bridge (through
    depends_on BO-4400a-1, which depends on BO-4400g-4). The maker's listing and remove verbs, named as the
    code under test, are exercised and not changed by this record.
  - >-
    A halted or failed run still issues the route-end clearing request (BO-4400a-1's shared step);
    whether the workspace is cleared follows the landed rule of BO-4400g-2 (the per-work command a route
    sends), never the run's success flag. The door's UNSENT_WORK refusal is relayed into the final result as kept work:
    {workspace_path: absolute, commits: [sha] from unsent.commits, files: [repo-relative path] from
    unsent.files}, reported as work kept, not as a clearing error.
  - >-
    No discard authorisation is ever passed on a halt path (BO-4300e-3; ACD-2100c-5 -- work is
    thrown away only by the person's choice).
  - >-
    Halting leaves nothing that makes the workspace un-clearable later: any run lock or in-use
    marker the route holds is released on every exit path, and the maker's workspace marker is left
    in its ready state, so the ordinary remove verb (and the BO-4400d sweep) clears it once the
    verdict flips.
  - >-
    The holds-work / holds-nothing figure in the listing comes from the maker's list verb /
    BO-4100e listing and BO-4100c-1 verdict; this AC adds no second verdict implementation.
  - >-
    PROOF: the single-ticket route is driven under unit_tests/_workflow_engine_harness.py on the
    deployed workflow with a scripted halt after two real commits and one uncommitted change; the
    follow-up push is done by the test with real git; the reclaim is a real remove request to the
    deployed maker. Byte-identity is checked by hashing every file and comparing commit ids before
    and after. Isolation and no-build.py rules as BO-4400a-1.
test_required: true
test_intent:
  - clause: the workspace still exists with both commits and the changed file byte-identical to their state at the halt
    needs_test: true
    reason: A route that clears unconditionally at its end loses the halted run's commits, which a snapshot catches.
  - clause: 'the run''s final result names the workspace''s location, the two commits by identifier and the changed file by path, as work that was kept'
    needs_test: true
    reason: The person can only recover the work from these named items, which are computed from the door's answer.
  - clause: the live set lists the workspace with the holds-work verdict
    needs_test: true
    reason: A kept workspace that the listing cannot see is never reclaimed, and the verdict is computed.
  - clause: 'when the two commits and the changed file are afterwards committed and pushed to the workspace''s own line on the shared project by hand, the next listing shows the workspace with the holds-nothing verdict'
    needs_test: true
    reason: The verdict must flip once the work is sent, or the workspace stays kept forever.
  - clause: a clearing request made through the one shared clearing door then removes it, without any authorisation to lose work being given
    needs_test: true
    reason: A lock or marker left by the halt would block the ordinary door later, which only a real reclaim shows.
test_spec:
  - name: test_halted_run_keeps_commits_and_changed_file_byte_identical
    proves_clause: the workspace still exists with both commits and the changed file byte-identical to their state at the halt
    code_file: templates/workflows-js/build-ticket.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "After the halt the workspace exists with both commits and the uncommitted file unchanged."
    must_catch:
      - "route clears unconditionally at the end"
      - "route deletes the folder itself instead of asking the door"
  - name: test_halted_result_names_location_commits_and_file_as_kept
    proves_clause: 'the run''s final result names the workspace''s location, the two commits by identifier and the changed file by path, as work that was kept'
    code_file: templates/workflows-js/build-ticket.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The final result names the workspace path, both commit ids and the changed file path as kept work."
  - name: test_listing_shows_holds_nothing_after_the_work_is_pushed_by_hand
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      After the two commits and the changed file are committed and pushed to the workspace's own line on the real
      hub by hand, the next listing shows the workspace with the holds-nothing verdict. Waits on BO-4100e and
      BO-4100c-1, since the list verb carries no verdict today.
    proves_clause: 'when the two commits and the changed file are afterwards committed and pushed to the workspace''s own line on the shared project by hand, the next listing shows the workspace with the holds-nothing verdict'
    code_file: templates/scripts/worktree_admin.py
  - name: test_listing_shows_holds_work_then_holds_nothing_after_hand_push
    proves_clause: the live set lists the workspace with the holds-work verdict
    code_file: templates/scripts/worktree_admin.py
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "The listing shows holds-work after the halt and holds-nothing after the work is committed and pushed by hand."
  - name: test_kept_workspace_is_reclaimed_by_the_door_without_authorisation
    proves_clause: a clearing request made through the one shared clearing door then removes it, without any authorisation to lose work being given
    code_file: templates/scripts/worktree_remove.py
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A remove request with no discard authorisation removes the workspace once nothing is unsent; no lock or marker blocks it."
  - name: test_halted_run_still_sends_the_clearing_command_and_keeps_its_failed_status
    proves_clause: the workspace still exists with both commits and the changed file byte-identical to their state at the halt
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). The deployed build-ticket.js is run
      under run_workflow_under_e2 with a scripted halt after the coder step, two real commits and one uncommitted file
      made in a real maker workspace; the clearing dispatch (shell-runner, per-work clear-landed) is recorded on the
      halt path, the run's own status stays failed, and the workspace is byte-identical. A live shell stand-in is
      needed for the real answer (the harness replays static label_responses today).
    code_file: templates/workflows-js/build-ticket.js
  - name: test_kept_answer_names_the_unsent_commits_and_files_as_the_door_lists_them
    proves_clause: 'the run''s final result names the workspace''s location, the two commits by identifier and the changed file by path, as work that was kept'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Against the deployed maker on the same fixture: clear-landed --kind K --slug S answers kept holds_unsent_work
      with commits equal to the two ids (full 40-character) and files equal to the changed file, and the door's own
      remove --path answer (UNSENT_WORK, unsent.commits and unsent.files, as test_bo_4300e_2 asserts today) lists
      the same; the route relays the kept entry as {workspace_path, reason, commits, files}.
    code_file: templates/scripts/worktree_remove.py
  - name: test_list_verb_verdict_depends_on_the_unbuilt_listing_and_is_not_a_property_of_list_today
    proves_clause: the live set lists the workspace with the holds-work verdict
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Correction note as a test: the maker's list verb today answers per workspace only kind, slug, branch, the path
      fields and a state of ready, incomplete or half-cleared (worktree_admin._list_entry), with no holds-work or
      holds-nothing verdict. test_listing_shows_holds_work_then_holds_nothing_after_hand_push above therefore waits for
      BO-4100e and BO-4100c-1 (both in depends_on). Until they are built, this test asserts the state field and the
      ready marker of the halted workspace through list, so the follow-up reclaim does not rely on a verdict that
      does not exist.
    code_file: templates/scripts/worktree_admin.py
test_design_authorship:
  step: test-designer
  date: "2026-11-16"
test_design_opened_files:
  - templates/workflows-js/build-ticket.js
  - templates/scripts/worktree_remove.py
  - templates/scripts/worktree_admin.py
test_rationale: >-
  The promise has two halves that only a real halt can show together: work survives byte-for-byte,
  and nothing about having halted blocks the ordinary door later. A mock of git or of the maker
  cannot show either.
