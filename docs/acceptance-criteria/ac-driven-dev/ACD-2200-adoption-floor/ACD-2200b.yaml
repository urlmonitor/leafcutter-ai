work_status: todo
roadmap_phase: phase_1
criteria: |
  Existing shortfalls never block your work — new ones are refused at the door.

  Working on something that already falls short of a standard is never refused
  for a shortfall it did not introduce, so nothing in the project becomes
  untouchable on the day a standard is adopted. Introducing a new shortfall, or
  making an existing one worse, is refused.
