id: DK-200a-2
title: "Resuming a run reuses the context already gathered for that run"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a fresh run has checkpointed entity interpretation and waits for human or host input,
  And canonical source content and the entity index change while the run waits,
  When the waiting run resumes,
  Then the run retains its original EntityContext snapshot,
  And no second recognition pass or context.recognized outcome is produced,
  And later evidence records changed source content separately from the saved meanings.
depends_on: [DK-200a]
covered_by:
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_resume_reuses_checkpointed_context_instead_of_reading_changed_files"
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_host_artifact_and_host_resume_retain_the_saved_context"
implemented_by:
  - "kernel/scheduler/nodes_enrichment.py"
  - "kernel/scheduler/graph.py"
  - "kernel/scheduler/state.py"
  - "kernel/contracts/__init__.py"
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Persisted EntityContext must survive fresh-service human or host resume without rebuilding the index or repeating recognition; routed evidence retrieval may read changed sources."
  - "Resuming the same run must not create a second context.recognized event or replace its checkpointed meanings."
delivers_to: null
expects_from:
  ac_id: DK-300d-1
  contract: "EntityContext version 1.0 checkpoint under state.entity_context; kind=entity_context; original_goal remains verbatim; caller_context and registered_capabilities are separate; entities contain compact typed meanings, canonical references and provenance, never body evidence; unresolved references, coverage, budgets and limitations describe the pass; status=recognized|no_matches|partial|unavailable|disabled. Human and host resume reuse the saved snapshot without recognition or index rebuilding. Historical EnrichedContext checkpoints retain their old channel and semantics."
test_required: true
test_spec:
  - name: test_resume_reuses_checkpointed_context_instead_of_reading_changed_files
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: reachability
    description: "After a human pause, source mutation and index rebuild, resume preserves identical EntityContext and exactly one context.recognized event; later evidence contains changed source content and provenance."
  - name: test_host_artifact_and_host_resume_retain_the_saved_context
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: seam
    description: "A valid host submission through a fresh service preserves prior EntityContext after source mutation and index rebuild, without re-recognition or a second context.recognized event."
test_rationale: "Human and host continuations are distinct entry paths; both require checkpoint round-trip evidence against a changed repository."
doc_links:
