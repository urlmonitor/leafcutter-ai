criteria: |
  A reusable audit capability that checks any template against six quality rules.

  Without modifying a file, you can run an audit that checks frontmatter
  schema compliance, tool allowlist accuracy, compound-bash violations,
  signoff protocol presence, spawn allowlist completeness, and stop-and-ask
  rule coverage. The audit returns structured findings so you know exactly
  what to fix.
