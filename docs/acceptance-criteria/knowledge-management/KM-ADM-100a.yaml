notes: |
  Both children are the same failure in two guises: a rating asserted from something
  other than the enforcement that actually happens.
    - KM-ADM-001 — rated from the PRESENCE of a hook script on disk rather than from
      the registry that decides which hooks run. check_ac_coverage.py exists and has
      never executed.
    - KM-ADM-005 — rated from the FACT that a hook blocks, with no statement of what
      it blocks over. check-done-proof is diff-scoped: new work only, never the back
      catalogue.
  The generalisation worth keeping: an enforcement rating has two parts — does it
  block, and over what. A rating carrying only the first part is a partial answer
  wearing the clothes of a complete one.

  KM-ADM-005 shipped the disclosure IN PROSE, on one edge note ("244 of 607 done ACs
  carry no covering test tag ... measured 2026-08-13 ... Do NOT read this edge as
  store-wide coverage"). That is a hand-written figure with a hand-written date. It
  is correct today and will rot. ACS-1100 is the mechanical version of the same
  promise; when it lands, this note should be regenerated rather than re-typed.
