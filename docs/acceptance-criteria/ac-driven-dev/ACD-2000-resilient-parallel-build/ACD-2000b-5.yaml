it_requirements:
  - "ONE HOME FOR THE RULE: a new docs/reference/ac-claim-lifecycle.md. docs/reference/ac-schema.md gains the claim FIELD rows and a link to it, and nothing else -- the schema reference documents the field, the claim page documents the rule. Two pages restating the rule is the failure mode; the second copy goes stale invisibly because operators arrive at only one of them."
  - "QUOTE THE STALENESS THRESHOLD'S ACTUAL DEFAULT and name where it is configured. The final Then clause is a diagnostic capability -- 'is this being worked on or abandoned?' is unanswerable without the number, and an operator who cannot answer it will edit YAML by hand, which is the behaviour this page exists to replace."
  - "NAME THE TWO FACTS THE OPERATOR READS OFF THE RECORD -- owner identity and claim instant -- using the field names that actually shipped, and show a worked example of a live claim beside an abandoned one. Write this against the landed record, not against ACD-2000b-1's specification; verify the names before publishing."
  - "THE MANUAL-RELEASE SECTION MUST LEAD WITH THE LIVENESS CHECK, not the release command. A hand-release performed without checking whether the owner is alive re-creates the double-build this L1 forbids, and it is the single most likely way an operator turns a visible stall into an invisible collision."
  - "THE EMPTY-FOOTPRINT RULE NEEDS ITS WHY, NOT JUST ITS STATEMENT. Give the inversion explicitly: the empty set intersects nothing, so a naive implementation makes precisely the least-analysable requirements the most parallel -- and note that an un-enriched requirement is the common case, not a rarity. That reasoning is what stops the rule being optimised away by the next author."
  - "STATE THAT BOTH ENTRY POINTS USE THE SAME RECORD and name them, so an operator knows the single-requirement fast path and a larger drive are looking at one place and not two."
  - "LINK, DO NOT REDRAW. The claim lifecycle state diagram is ACD-2000b-3-i's deliverable on docs/architecture/components/ac-driven-dev.md; reference it rather than restating the transitions in prose."
  - "Satisfy check-doc-frontmatter and check-doc-length, and add the new page to docs/INDEX.md in the same change."
  - "WRITE IT LAST. Every fact on this page comes from behaviour that ACD-2000b-1 through -4 define; a page written from the specifications rather than from what shipped will be confidently wrong about field names and the threshold value."
