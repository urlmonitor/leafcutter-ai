criteria: |
  Given the finalize-feature workflow has reached the parity gate (after the
    merge-origin/main step, before the PR-merge step)
  And the parity check reports no drift (every mirrored source-template pair is
    byte-identical)
  When the gate evaluates that outcome
  Then the workflow does not halt at the parity gate
  And the workflow proceeds to the PR-merge step as it would when no parity gate
    were present
  And the parity gate produces no warning or noise on the clean path — it passes
    silently, consistent with the other finalize steps on their pass path
