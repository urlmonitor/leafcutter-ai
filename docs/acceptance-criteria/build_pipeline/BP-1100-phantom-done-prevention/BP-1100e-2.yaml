title: "The reconciliation blocks by default and fails open on its own errors; advisory-only reporting is opt-in"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given the pre-done reconciliation produces a verdict that a ticket changed source
    files not present in its declared files_touched UNION out_of_scope
  When the reconciliation runs in its default configuration
  Then it blocks the ticket from being marked done until the scope is reconciled
    (it names the undeclared source files) — the default is block-on-mismatch
  And when advisory mode is explicitly opted into via configuration, the same
    verdict is reported only as an advisory and does not hard-block the ticket
    from reaching done
  And when the reconciliation itself cannot run (an internal error computing the diff
    or reading frontmatter), it fails open — it does not block the ticket on account
    of its own failure
