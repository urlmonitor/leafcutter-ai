id: DK-500d-2-i
title: A reused criterion the person rewords stays traceable to its category without changing the category
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the reused criterion "Can it be built and verified as one ticket?" from cat-1dc11c5a2ffa7310,
  When the person edits it at the approval of proposals to "Can it be built and verified as one ticket by one agent?",
  Then the approved criterion carries the new wording and states that it started from cat-1dc11c5a2ffa7310 and was edited,
  And cat-1dc11c5a2ffa7310's wordings are unchanged by the run,
  And the edited criterion is not counted as an unchanged reuse of cat-1dc11c5a2ffa7310,
  And a reused criterion the person approves unedited keeps its plain link to its category.
depends_on:
- DK-500d-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500d-2
  contract: Approval of proposals with edits.
change_target: code
risk_surface: internal
it_requirements:
- An edit at the approval changes the reuse kind to edited and keeps the started-from category id in the run state, the run report and the staged area. The run never changes the category record.
- An edited reuse stages no membership addition, because it is not an unchanged reuse. The edited wording reaches the category only as a grouping suggestion a person accepts (in the run, DK-500b-4, or in the next mining round).
- 'Whether a wording is edited is decided by the shared wording rule, so a whitespace-only or case-only change is not an edit. Wording equality (''exact match'', ''identical'', ''repeat'', label uniqueness) is one shared rule for every caller (offline grouping, in-run grouping, publish label checks, drafted-repeat removal, edit detection): Unicode NFC, trimmed, internal whitespace collapsed to one space, case-folded; punctuation and word order stay significant. No caller may apply a looser or stricter rule of its own.'
test_required: true
test_spec:
- name: test_edited_reuse_states_origin_and_edit
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The approved criterion carries the new wording and states that it started from cat-1dc11c5a2ffa7310 and was edited.
- name: test_category_wordings_unchanged_by_run
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: cat-1dc11c5a2ffa7310's record is byte-identical after the run.
- name: test_edited_reuse_not_counted_as_unchanged
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: No membership addition is staged for the edited criterion.
- name: test_unedited_reuse_keeps_plain_link
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: boundary
  description: A reused criterion approved unedited keeps its plain link and stages a membership addition.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, call counts and staged files rather than internal helpers.
