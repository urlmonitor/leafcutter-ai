criteria: |
  Given docs/components.json contains invalid JSON
    (e.g. a trailing comma after the last entry),
  When build.py attempts to compile an agent template
    containing {{components_table}},
  Then build.py exits with a non-zero code,
  And the error message identifies both the parse error
    and the file path "docs/components.json",
  And no partially-compiled agent files are written to the output directory.
