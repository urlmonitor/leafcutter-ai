    relationship: describes
    status: exists
assigned_agent: python-coder
delivers_to: {"agent":"python-coder","contract":"EntityContext (kernel.contracts.entity_context): schema_version='1.0', kind='entity_context'; entities:list[EntityCard] with family:glossary|doc_type|entry_kind|native_kind|symbol|artifact_id, identity:string, native_kind:string|null, meaning:string, signature:string|null, resolution:resolved|ambiguous, matches:list[{channel:string,record_index:int|null,start:int,end:int,surface:string}], provenance:{source_id:string,locator:string,snapshot:string,source_hash:string,projection_hash:string}. Offsets are half-open Unicode code-point positions in original channel text. Original goal and caller claims are separate from meaning projection. Context has original_goal:string (verbatim), caller_context, workspace_id, repository_root, registered_capabilities:string[], status:recognized|no_matches|partial|unavailable|disabled, unresolved:list[{family,reference,state,matches,candidates}], coverage:{scan_complete:bool,index_status,index_fingerprint:string|null,families,counts,by_family}, budgets:{lookups:int,serialized_chars:int,elapsed_ms:number,jev_calls:0}, limitations:string[]. Counts contain detected,resolved,returned,omitted,unknown,ambiguous. No evidence field."}
expects_from: {"ac_id":"DK-300c-1","contract":"kernel.entity_index.build_entity_index(repository_root,config,*,output_path=None)->EntityIndex and python -m kernel entities build --repository-root ABS [--config PATH] [--output PATH] prepare the local derived index outside a run. Runtime kernel.entity_context.recognize_entities(task_input,config,registry=None,*,redactor=None)->EntityContext consumes this index without rebuilding. Physical workspace identity is the canonical resolved checkout root plus manifest; arbitrary Scope.workspace_id labels need not equal a directory name."}
