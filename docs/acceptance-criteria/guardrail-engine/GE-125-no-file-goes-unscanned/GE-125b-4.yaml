notes: |
  THIS DISCHARGES THE reference-doc TRIGGER ON GE-125b, AND IT IS WRITTEN TO BE
  DISCHARGED ONCE FOR THE WHOLE GOAL. GE-125 carries the instruction plainly: all
  four L1s trigger reference-doc, each of them genuinely invalidates the current
  description, and they are to be satisfied by a SINGLE consolidated rewrite
  rather than four documents. The second scenario is that instruction written
  down as an acceptance condition rather than left as advice.

  RECONCILIATION NOTE FOR THE IT PO, AND FOR WHOEVER MERGES THIS TREE. GE-125a,
  GE-125c and GE-125d are being decomposed concurrently and each carries the same
  trigger. If a sibling tree has authored an equivalent documentation record,
  these must be reconciled to ONE record before build rather than built twice —
  the correct outcome is one documentation criterion for the goal, whichever L1
  it ends up hanging from, with the other three L1s' triggers noted as discharged
  by it. Do not resolve that by silently deleting a sibling's record; say which
  one survives and why.

  WHICH MATERIAL. The description in question is the one that tells a reader when
  the secrets check gives something less scrutiny than usual — today that is the
  scanner skill's own rules section, and the component's architecture page repeats
  part of it. Naming the exact files is left to the IT PO along with the doc_links;
  what this criterion fixes is that there is exactly one of them afterwards and
  that it is decidable by a reader.

  THE SCANNER'S OWN SCRIPT IS NAMED IN THE DOCUMENT ON PURPOSE, mirroring
  GE-125b-2. The worked example is what makes the rule legible; a general
  statement about file kinds does not tell a reader that the tool's own source is
  covered, and that is the first thing a reader of this document will want to
  know.

  FENCE. This document describes the EXISTING shapeless-value exemption as
  repaired by GE-125b. GE-123d-4-ii separately requires the PROPOSED
  keyword-rule exemption to be written down. If both land, the two descriptions
  sit side by side and must be distinguishable — two rules, two exemptions, two
  states of the world. Neither documentation obligation discharges the other, and
  nothing in the GE-123 tree may be edited from here.

  NO assigned_agent OR doc_links ARE SET HERE by instruction — this record is
  behavioural only and the IT PO enriches it. The natural implementer is the
  documentation surface owner rather than a coder, and the reference-doc trigger
  on GE-125b is what routes it.

  IT PO RECONCILIATION ANSWER, 2026-08-25. The adjudication in GE-125's notes
  settles the collision this record flagged: all four documentation records are
  KEPT, none is superseded, because they are four different CONTENT requirements
  on ONE passage rather than four claims on one artifact. This record's specific
  contribution is the both-conditions rule — a named location AND an admitted
  file kind — together with the enumeration of the four admitted kinds and the
  worked example naming the scanner's own script. What was actually missing was
  build ORDER, and it is now expressed as an it_requirement (check whether the
  section exists; create it if not, amend it if so) rather than as depends_on
  edges between the four, because the ordering constraint disappears the moment
  the passage exists.
