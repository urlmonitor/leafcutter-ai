priority: medium
roadmap_phase: phase_1
criteria: |
  Each step is checked against the result it exists to produce.

  Every step of a build is there to leave one particular thing behind — a change
  published where your team can see it, a review opened, a record filed. The
  build knows what each step is for and looks for that specific result once the
  step ends. A step that was busy but did not produce its own result is not
  counted as done, however confident and well-formed its report reads.
