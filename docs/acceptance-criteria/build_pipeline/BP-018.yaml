title: "Rebuilding agent cards preserves their provenance dates and rewrites nothing unchanged"
origin_agent: BrainCandy
created: 2026-08-14
assigned_agent: python-coder
criteria: |
  Given generate_card() in scripts/generate_agent_cards.py rebuilds each card's
    YAML frontmatter from scratch on every run,
  And build_agent_cards() already carries a compare-before-write guard that is
    meant to skip a card whose generated content matches what is on disk,
  And a committed card carries provenance the generator does not itself emit —
    a `created` date recording when the card first appeared, and a
    `last_updated` date maintained by the transform-doc-frontmatter commit hook,
  When a build regenerates a card whose agent template, registry entry and AC
    assignments have not changed since the last build,
  Then the card file on disk is left byte-for-byte untouched and is not counted
    as written,
  And this holds on a later calendar day than the one the card was last built
    on — the current date must not be what makes the generated content differ,
  And when the card IS rewritten because its substantive content genuinely
    changed, the `created` value already present on disk is carried through
    unchanged rather than replaced with today's date,
  And any `last_updated` value already present on disk survives the rewrite
    rather than being dropped from the frontmatter,
  And a card being generated for the first time, with no file on disk to read
    provenance from, is still written with `created` set to the current date,
  And the bug symptom ("a no-op rebuild rewrites every agent card, resetting
    each card's `created` to the build date and deleting its `last_updated`")
    must not occur.
