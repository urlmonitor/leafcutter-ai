change_target: prompt
risk_surface: contract_boundary
notes: |
  WHY THIS IS A SEPARATE CRITERION. Of the three routes, exactly one — the batch
  route — dispatches the supervisor that carries the defective skip rule. A
  demonstration against the per-phase driver, which already behaves correctly,
  would pass while the defect stays live for every requirement built inside a
  batch. This is the reachability question, and answering it with a stand-in for
  the route is the failure mode this criterion is written against.
