created: 2026-08-25
amended_by:
  - reason: "BA refresh, 2026-09-07. The original criteria opened with 'Given ADR-034 names knowledge_emissions.jsonl as the sink' and then asked only that both sides agree — so an implementation that repointed the READER at debugging/logs/agent_telemetry.jsonl satisfied every Then clause while producing the outcome ADR-011 rejected. The two candidate settlements were indistinguishable by the criteria. Rewritten to state the disagreement as the Given rather than the answer, to require the declared value be a knowledge-only stream, and to require the parity check to have a second failure branch that rejects the shared-file settlement. Decision recorded in notes with its evidence. Also added INF-400c-4-iv (an absent declared sink is a no-work outcome), which the repoint creates as a live condition: after the emitters move, the knowledge sink still does not exist until the first agent emits, and INF-700a's caller will run against exactly that state."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA housekeeping, 2026-09-07. Criteria unchanged. Evidence point 2 in the notes had expired: it cited INF-700c-2's it_requirements as making debugging/logs/agent_telemetry.jsonl byte-immutable, but INF-700c-2 is now work_status done and that constraint was explicitly scoped to the duration of that AC, so it is historical and holds nothing. The citation is withdrawn and replaced with a pointer to INF-400c-4-iii, which carries the live byte-identity invariant. The settlement is unaffected — the other three evidence points (the shared file is not a knowledge file; two lifecycles would share one file; reversing the direction needs an ADR amendment nobody has commissioned) each stand on their own, and point 2's three named consumers survive the withdrawal."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA rewrite, 2026-09-07, on a decision BrainCandy approved: THE SINK RESOLVES AGAINST THE REPOSITORY, NOT AGAINST THE PROCESS'S CURRENT DIRECTORY — one sink per repository, shared by every working directory of it. WHY THE OLD CRITERIA WERE NOT ENOUGH. They asked the two sides to agree on a name and to 'produce the identical absolute path resolving that declaration IN THE SAME WORKING TREE'. Both shipped defaults are bare relative names, and two bare relative names that are equal to each other do resolve identically in the same working tree — so the criterion was fully satisfied by editing one default string and leaving each process to finish the resolution against its own directory. That is the bug, not the fix: four of the five completion paths start their processes inside an isolated working directory that is removed after merge, so the file both sides agreed about is reclaimed with the directory. WHAT CHANGED: the Given now states the relative-resolution disagreement as a second disagreement underneath the first; the declaration is now a RULE for arriving at the sink rather than a name; two new outcome clauses give the discriminators (the same absolute path from an isolated working directory and from the main checkout, and a record still readable at that path after the working directory is removed); and the parity check gains a THIRD failure branch that blocks a declaration whose resolution varies with the current directory, stated to fire today. WHAT DID NOT CHANGE: the settlement itself. The emitters still move and the reader still stays; branches 1 and 2 and the knowledge-only-stream requirement are untouched, and the four evidence points in the notes still stand. ALTERNATIVES REJECTED BY THE APPROVED DECISION, recorded so they are not reopened on a hunch: an installed database or SQLite (portability is this package's proposition, a server is a dependency every consumer must provision, a binary file cannot be diffed or reviewed in a repository whose review trail is the point, and it fixes nothing — the defect is path resolution, and a database whose path is also resolved against the current directory has the identical bug); and an API that commits learnings to main immediately (main is PR-only here and a direct push is rejected by branch protection, and review is a feature rather than friction — the existing 28 records already carry 15 inconsistent entry_kind values, so unreviewed agent prose landing on memory files is how those files fill with near-duplicates). ALSO ADDED: INF-400c-4-v, which states the outcome in each of the two install layouts and owns the case where the work is not in a repository at all."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA revision, 2026-09-07, same day, replacing the ANCHOR chosen in the entry above while keeping everything else it settled. THE ANCHOR IS NOW A BUILD-TIME ABSOLUTE PATH: the build already receives the project root as an argument, unambiguously, in both install shapes; it fixes the sink to an absolute path from that root and writes it into the configuration it deploys, and both sides read it there. No run-time discovery, no walk-up. WHY THE PREVIOUS ANCHOR (the repository's common git directory) WAS DROPPED, both reasons found in review of it rather than after shipping: (1) 'the repository' is ambiguous in a consumer install, because the package subdirectory is a clone in its own right nested inside the consumer's, so the answer depended on where the asking process stood and both answers looked plausible; (2) the common directory is reported RELATIVE from a main checkout and ABSOLUTE from an isolated working directory — verified in both directions — so the obvious implementation reproduced the original relative-path defect in precisely the layout a developer would test in. Neither can arise now, because the path is absolute before any process starts. WHAT CHANGED IN THE CRITERIA: the declared value must be ABSOLUTE and build-determined rather than a rule anchored on a repository; branch 3 of the parity check now blocks a non-absolute declared value as well as a directory-dependent read. WHAT DID NOT CHANGE: the settlement (emitters move, reader stays), branches 1 and 2, the knowledge-only-stream requirement, the durability discriminators (same path from an isolated working directory and from the project root; a record still readable after that directory is removed), and the four evidence points in the notes. ALSO ADDED IN THIS REVISION: the concurrent-append clause, because a shared sink makes simultaneous writers the ordinary case — its routing counterpart is the new INF-700a-5-iii. AND RECORDED IN THE NOTES: the IT PO's config/paths.json declaration home is SUPERSEDED, since that file is a tracked project-relative SSOT and this value is an absolute per-install path produced by the build; the four properties that decision argued from are restated there as the test any alternative home must still pass."
    by: business-analyst
    at: 2026-09-07
