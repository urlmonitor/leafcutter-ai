created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124e.yaml"
criteria: |
  Given UXP-607-2 is a finished user-interface criterion
  And no front-end file names it in a component-level declaration and no
    rendered element pins it
  When the reverse-direction gate runs
  Then the gate fails
  And exactly one finding is reported whose subject is the criterion id
    UXP-607-2, not a file path
  And the finding states that both ways of satisfying it were absent — no
    component-level declaration and no element pin

  Given the same run also produced commit-tier findings about file paths
  When the reverse-direction findings are reported
  Then the reverse-direction findings are identified by criterion id and the
    commit-tier findings by file path, so a reader can tell which direction each
    failure came from
