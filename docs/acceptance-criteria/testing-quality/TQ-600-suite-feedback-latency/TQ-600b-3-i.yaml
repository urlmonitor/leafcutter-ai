notes: |
  WITHOUT THIS CARVE-OUT, TQ-600b-3 IS UNSHIPPABLE. A blanket prohibition on
  touching the run's own checkout would condemn a large, legitimate and necessary
  population: this package's own tests routinely read tracked files to check that
  a deployed artifact matches its source, and the project's conventions require
  exactly that comparison. A check that fires on all of them is turned off within a
  week, and then the real collisions return unobserved.

  THE THIRD CLAUSE IS THE SUBSTANTIVE ONE AND IT IS DELIBERATELY STRICT. Judging by
  command name is the tempting implementation and it is wrong in both directions:
  the same command reads in one form and writes in another, so a name-based rule
  both forbids safe reads and permits the write that corrupts the index. Deciding
  on observed state change is harder to build and is the only rule that holds.

  BOUNDARY: this AC does not relax anything about repositories a test creates for
  its own use. Those are unshared by construction and were never in scope.
