criteria: |
  Given the project's type checker, run with the project's own settings over
    scripts/ac_store/_test_intent.py, reports a union-attr finding at lines 64-65 (an
    attribute read on a value that can be None when a pattern does not match),
  When the reader is changed so that the no-match case is handled before the attribute is read,
  Then the type checker reports no finding for scripts/ac_store/_test_intent.py,
  And for a criteria text whose outcome clauses are "Then one row is written" and "And the
    count is 1", the reader returns the same clauses, in the same order, as before the change,
  And a criteria text with no outcome clause gives the same result as before the change,
    and raises no error.
