id: BO-3500c-1
components:
  - build_orchestration
  - testing_quality
title: "A non-code member is finished only with its artifact produced and a proof established and recorded"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a member of a group whose deliverable is not code, and for which no passing
    test can exist,
  When the run decides whether that member is finished,
  Then the member is finished only if its declared artifact was produced in this run
    and a proof appropriate to that artifact was established in this run,
  And having no test to point at is never on its own a reason to treat the member as
    finished,
  And having no test to point at is never on its own a reason to leave the member out
    of the group, to stop producing it, or to pass over it in silence.

  Given a non-code member the run has finished,
  When the backlog is read after the run,
  Then that member carries a receipt of what was checked, stating the instrument that
    was used, the exact invocation that was made, the outcome that invocation returned,
    and when it was made,
  And where the proof is one that compares two conditions, the receipt states both
    conditions and the difference observed between them,
  And where the proof is one that only reads the artifact, the receipt states no second
    condition at all,
  And a reader can therefore tell from the receipt alone which class of proof was
    applied, without re-running anything and without inferring it from the kind of
    artifact.

  Given a receipt offered for a member whose proof compares two conditions, in which
    the two conditions stated are the same condition,
  When the receipt is written,
  Then it is rejected at the moment of writing and the member is not finished,
  And the reason given is that a comparison recording no difference is not a
    comparison — so a proof borrowed from a kind that only reads the artifact is caught
    by the shape of the receipt rather than by trusting whoever produced it.

  Given a receipt offered for a member whose proof only reads the artifact, in which a
    second condition is stated,
  When the receipt is written,
  Then it is rejected at the moment of writing and the member is not finished.

  Given any receipt,
  When it is checked,
  Then the class of proof it is checked against is the one the member's deliverable
    resolves to, and never a class the receipt or the requirement claims for itself.

  Given a non-code member whose artifact was produced but whose proof could not be
    established,
  When the run reaches its ending,
  Then that member is not marked finished,
  And the run does not report success,
  And the reason given names the member and the proof that failed — not a missing test.
