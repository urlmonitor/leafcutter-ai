notes: >-
  Naming the items is part of the refusal and not a nicety: a bare refusal is
  indistinguishable from a false positive, so the operator's only route forward is to
  override it, and an override habit turns this guarantee off. The recorded loss this
  prevents is a concurrent session removing a workspace mid-drive and leaving a snapshot
  commit marked not-for-merge behind.
