notes: |
  THE setUpClass RE-DEPLOY TRAP, DETECTED RATHER THAN ONLY DOCUMENTED. The
  request asks that it be "documented and detected". The documentation half is
  TQ-500g-5 and the sql-test-writer prompt (TQ-500g-2); this is the detection.

  WHY BOTH D1 AND D2. D1 is the trap. D2 is the control: a detector that marks
  every database run invalid would pass D1 and make database wrong-version runs
  impossible. D2 also shows the straightforward remedy (alter the file the suite
  installs from), but the check must not rely on the remedy being used — it
  inspects what the database held.

  TECHNICAL DETAIL FOR IT-PO: "what the database held while the tests ran" can
  be read from the procedure's installed definition (for example its source in
  the catalogue) captured during or right after the test run, and compared with
  the wrong version and with the code as written. When the suite runs in its
  own transaction or drops the database, choose the capture point accordingly.
  The put-back must restore the database too, not only the file — a database
  left holding the wrong version poisons every later run.

  NEEDS THE CONFIGURED TEST DATABASE (INF-1100d). Without one, the run is not
  run (TQ-500g-2-ii), so this check never starts.

  IT-PO ENRICHMENT (2026-09-28)
  OPEN: how the catalogue is read without a leafcutter driver dependency. See
  the report's open questions. Lane: python-coder after TQ-500g-2 (prompt) is
  done. Otherwise the fast lane pulls the prompt L2 into a python-coder build
  set.

  IT-PO TECHNICAL ALIGNMENT (2026-10-22, lane fast-lane/tq-500g-2)
  RESOLVES the 2026-09-28 OPEN item. The catalogue is read by a pytest plugin
  (_wvr_db_plugin.py) loaded into the suite's own pytest process, in the same single run
  _wvr_pytest already makes with _kind_plugin. It uses the PostgreSQL driver that the
  suite's own interpreter can already import, so leafcutter gains no driver dependency;
  none importable gives not_run. The same plugin installs the wrong version at session
  start, captures after each requires_db test's call phase, and (through its own entry
  point) re-installs the code as written for the put-back. The runner-side comparison and
  gate live in _wvr_db.py, shared with TQ-500g-2-ii.
  The caller's brief said these notes already named the plugin design. They did not (they
  said OPEN); this paragraph records it as the aligned design.
  Build after TQ-500g-2-ii in this lane: the catalogue step sits behind -ii's
  check_test_db gate and requires_db scope.
  USER DECISIONS (2026-10-22, all the recommended options):
    OQ-2 (A) no live-database test. Accepted risk: the real PostgreSQL catalogue query is
         not tested in CI; the stand-in driver fixtures are the proof.
    OQ-5 (A) accepted. A re-deploy inside the test's own uncommitted transaction cannot be
         seen from the plugin's separate connection. It is a known limit and is to be
         documented on the TQ-500g-5 reference page (docs/reference/wrong-version-runs.md).
         Recorded here and not in TQ-500g-5's notes, because this pass edits only the
         TQ-500g-2 tree. TQ-500g-5's author should pick it up from here.

  IT-PO TEST SPLIT (2026-10-22, after review)
  The unreadable-catalogue case now STOPS the drive instead of only giving not_run +
  unfinished (user-approved review decision: an unverifiable put-back always stops; the
  put-back re-read hits the same unreadable catalogue). The criteria say nothing about an
  unreadable catalogue, so they are not in tension and were not changed. delivers_to and
  the put-back it_requirement were brought in line in the same pass. The in-run row is
  still not_run; only the verdict reason changes.
  The credentials test cannot catch "missing driver or unreadable catalogue read as
  caught" (that wrong version SURVIVED it: the put-back re-read also fails there, so the
  stop row masks the run's own row), so it does not carry that must_catch. Hence
  test_transient_run_read_failure_is_not_run_not_caught (round 3, angle discrimination):
  reads fail only in the run, the put-back verifies, the drive does not stop, and the
  run's own row must be not_run, never caught.
