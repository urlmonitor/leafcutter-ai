id: UXP-523-1
title: Fields are readable beneath input and output contract headings
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a flow step or branch binds original_question as a required string and context as an
  optional array with default [],

  When a person opens that node in Atlas,

  Then Inputs and Outputs group the selected fields by their contract,

  And each contract name appears as the group heading rather than a prefix repeated on every field,

  And each row retains the exact field path, permitted type, immediate-container requiredness and any
  declared default,

  And the root path is identified as the whole JSON value,

  And a wildcard path describes each present item or value without implying that an item must exist.'
