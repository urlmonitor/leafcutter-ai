created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200c.yaml"
criteria: |
  Given the ticket generator building a ticket that requires documentation,
  When it writes the ticket body,
  Then the body contains an `## Agent Contracts` section with a `### documentation-expert`
    subsection.
  And that section appears AFTER the `## Acceptance Criteria` section and BEFORE the
    `## Sign-offs` section.
  And the subsection lists one checklist item per documented AC using globally numbered
    `- [ ] AC-N:` lines (numbered across the whole ticket, not restarting per subsection).
depends_on: [BO-2200c]
