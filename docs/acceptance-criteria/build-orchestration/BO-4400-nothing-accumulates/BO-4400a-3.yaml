criteria: |
  Given two workspaces on a real test project: "done-1", holding nothing that has not
    reached the shared project, and "open-1", holding one unpushed commit,
  When a person asks to close each workspace using the close-a-workspace command, and
    again using the workspace agent's removal, with no authorisation to lose work given,
  Then for "done-1" the workspace is removed and the reply quotes the one shared
    clearing door's answer reporting it removed,
  And for "open-1" the reply quotes the door's refusal naming the unpushed commit by
    identifier, and "open-1" is byte-identical before and after,
  And neither the command nor the agent asks the person to confirm before clearing,
  And neither the command's nor the agent's instructions contain any other way of
    removing a workspace, including a forced removal or a direct folder deletion.
