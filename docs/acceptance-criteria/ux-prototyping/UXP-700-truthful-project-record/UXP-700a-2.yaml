test_required: true
test_rationale: |
  The observed workaround was a person rebuilding the derived index by hand before the checker
  would run. The test therefore has to start from no index at all; a test that starts from the
  repository's committed index proves nothing about the from-zero path.
test_spec:
  - name: test_generator_creates_index_from_zero_artifacts
    target_dir: unit_tests/product_truth/
    description: "Running the generator against empty artifact directories with no index present writes an index declaring zero artifacts."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_second_generator_run_on_empty_store_writes_nothing
    target_dir: unit_tests/product_truth/
    description: "A second run over the same empty store leaves every file unchanged."
    type: integration
    angle: criterion
    framework: unittest
notes: |
  Derived from the same 2026-09-07 reproduction as UXP-700a-1-i: the empty store only reached a
  verdict after the derived index had been rebuilt by hand. UXP-700a-1 makes the install lay an
  index down; this AC makes the generator able to produce one from nothing, so a record that
  loses its index, or was created before the install wrote one, is recoverable without hand
  authoring.
