id: GE-122a-4-i
title: "An enumeration that could not be completed yields no identifier at all"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a namespace in which one record cannot be read or cannot be parsed, so the set of
    identifiers that record declares is unknown,
  When a component tries to mint a new identifier for that namespace,
  Then no identifier is returned,
  And the caller is told that the enumeration was incomplete and which record could not be read,
  And the count of records successfully enumerated is stated alongside the total the namespace
    holds, so the size of the gap is visible rather than implied.

  And Given the same namespace with that record readable again,
  When a component mints a new identifier,
  Then an identifier is returned, and it is one no record declares and no live record cites.

  The property this criterion pins: a component may only mint an identifier from an enumeration
  it knows to be COMPLETE. An enumeration that skipped an unreadable record and carried on has
  established nothing about which identifiers are taken, and the identifier it returns is a
  guess presented as an answer. Silence about the skip is what makes it a guess nobody can
  detect.

  This does not repeal the component's fail-open convention for a guard that hits an internal
  defect after the collection was fully read. That permission is about not holding an unrelated
  change hostage to a bug in a checker. It does not extend to minting a fresh identifier from an
  admittedly partial view, because the artifact produced is durable and is published under that
  identifier.

  Coverage note: covered only by a test that makes a real record in a real on-disk namespace
  unreadable or unparsable, executes the minting step, and asserts that no identifier came back
  and that the unreadable record was named. A test that asserts an exception type is raised
  somewhere inside does not cover it — the failure this criterion excludes is a run that returns
  a plausible identifier and exits successfully.
