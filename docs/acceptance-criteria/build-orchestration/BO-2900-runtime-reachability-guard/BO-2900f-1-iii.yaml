assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the generic post-dispatch verification in build-feature.js and its twin in build-ticket.js; there must be exactly one such point per driver, not one per gate"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_phase_signoff_verification.py"
  constraints:
    - "ONE VERIFICATION POINT, NOT ONE PER GATE. The observed defect is not a broken gate, it is an inconsistently applied check. An implementation that adds the read-back at each gate's call site satisfies BO-2900f-1-i on the gates it touches and re-creates this defect for the next gate anyone adds. The verification belongs to the single generic path every dispatch returns through, and the sign-off must name that point."
    - "MULTI-ITEM RUN IS PART OF THE TEST, NOT AN EXTRA. A single-work-item test cannot express this AC at all. The harness must drive at least three work items in one run, each with a different gate silently failing to record."
    - "KEEP THE OUTCOME DISTINGUISHABLE. Reporting the ran-and-did-not-record case as skipped attributes a configuration cause to a recording failure, and sends the reader to turn on a gate that is already on. It is its own outcome, and per BO-2900f-2 a gate that was never requested still produces no entry at all."
    - "VERIFY BY EXECUTION. A source-reading test cannot observe that a check is applied uniformly across items -- that is a runtime property by definition."
delivers_to: null
expects_from:
  ac_id: BO-2900f-1-i
  contract: "The per-gate adjudication itself; this AC constrains where it is applied and requires that it hold for every dispatched gate on every work item in a drive"
test_spec:
  - name: test_three_work_items_each_missing_a_different_gate_entry_all_report_failed
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "One harness run, three work items, a different gate silently failing to record on each; assert all three report that gate as failed."
  - name: test_no_work_item_finishes_carrying_an_unconfirmed_success
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Across the same multi-item run, assert that for every work item and every gate the run reached, the outcome carried forward was derived from a record read-back -- there is no gate whose success went unchecked."
  - name: test_verification_point_is_reached_once_per_dispatch_over_the_real_phase_set
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Drive the canonical phase set and assert the number of read-back verifications equals the number of dispatches -- proving a single generic point rather than a set of per-gate call sites, and catching a newly added gate that bypasses it."
  - name: test_ran_and_did_not_record_is_reported_apart_from_skipped_and_from_never_requested
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "In one run, produce a gate that ran without recording, a gate that was requested and skipped, and a gate never requested; assert three distinguishable results, with no entry at all for the third."
test_rationale: |
  This AC's content is uniformity, and uniformity is unobservable from any single
  work item -- which is precisely why the production defect survived: each individual
  ticket looked like an ordinary incomplete ticket. Every descriptor therefore
  executes a run containing more than one work item or more than one gate, and
  asserts a property of the whole run. The third descriptor is the durable one: by
  tying the verification count to the dispatch count it fails the day someone adds a
  gate that returns through a different path, which is the mechanism by which this
  defect will otherwise come back.
