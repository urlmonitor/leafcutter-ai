it_requirements:
  - "AGENT CHOICE IS DELIBERATE: reference-author, the leaf author, not documentation-expert. A documentation-expert dispatch that then dispatches a leaf author is the sibling tree's defect."
  - "THE PAGE MUST CARRY THE TEST, NOT THE PROHIBITION. 'Do not use a specialist as an errand runner' is exactly the unacceptable form the parent L0 names. The page must give the author the sweep's own discriminating question, in the words BO-3200a-2 delivers -- would the build still reach a terminal outcome if nobody could be asked to judge, with only the chartered executor carrying out exact commands -- so guidance and enforcement cannot diverge."
  - "THE PAGE MUST DOCUMENT THE DECLARATION AS DATA: the result_use field and its three permitted values -- `fact` (a value the build branches on, addressed to the executor), `chore` (a side effect such as a claim or a release, addressed to the executor) and `judgement` (may go to a specialist, never to the executor, and requires judgement_reason) -- and the fact that ABSENCE MEANS `fact` and fails the sweep. An author who does not know absence fails will keep adding undeclared sites."
  - "THE PAGE MUST STATE THAT A JUDGEMENT DECLARATION IS VERIFIED, NOT TRUSTED — a path that declares judgement but cannot terminate without the value is reported. Omitting this invites authors to declare judgement to quiet the sweep, and they will discover the verification as a surprise failure instead of a documented rule."
  - "EACH PERMITTED/FORBIDDEN RULE MUST CARRY A CLAIM IDENTIFIER BOUND TO AN EXERCISED PATH, using BO-3100d-1's pairing mechanism rather than a second one, so the second scenario is enforced rather than intended."
  - "THE PAGE MUST STATE HOW TO OBTAIN A VALUE WITH NO JUDGEMENT REQUESTED BY LINKING, NOT RESTATING: it links to BO-3200f-4's executor reference (docs/reference/chartered-executor.md) for what the executor does, and does not carry the executor's result shape or could-not-check reasons itself. It names BO-3200a-1's resolver as the existing way to obtain a project fact -- a resolver whose call path makes only exact-command dispatches to the executor -- and BO-3200a-1-i's root-resolution rule; otherwise an author writes a new command-and-parse site or a new upward walk and re-creates the layout defect."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
delivers_to: null
expects_from:
