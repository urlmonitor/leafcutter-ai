created: 2026-09-25
amended_by:
  - date: 2026-10-06
    agent: business-analyst
    reason: "user decision 2026-10-06, flags F2 and F3 (build-tooling fix design, sections 2 and 8; delivered by tickets T3 and T1). F2: the gate result lived only in one drive's memory, so any resume after the coder had run re-ran the reader against the coder's uncommitted code, which now passes, and the ticket halted as all-green and could not move. The amendment narrows 'a resumed ticket re-runs the reader': on a pass the reader records its own verdict in the ticket frontmatter (time, worktree commit, source requirement ids, the red tests), and a resume reuses that record without running the tests again only when the source requirement ids match and every recorded red test is still among the newly added covers-tagged tests. In every other case the reader runs as before. The test writer never writes the record, and its sign-off claim never substitutes, so K1's guarantee holds. F3, option A: tickets whose tests are green before coding still halt, as 'green_at_baseline'. The halt lists the green tests and says to set the coder phase not needed with a comment naming the implementing commit. There is no automatic pass, so the recorded decision that every fast-lane halt reason applies unchanged stands. Lane parity is kept and made explicit: the verdicts are identical whenever the reader runs, and both lanes use the same command form (T1 moves both lanes to one interpreter token). work_status moved done -> todo because the amended behaviour is not built. readiness stays approved because the user approved the amendment. The it_requirements entry 'Resume safety: ... re-runs the reader before the coder rather than trusting the earlier sign-off' now conflicts with the reuse rule, and test_spec has no case for record, reuse or green_at_baseline. Both are left for the IT PO, who works on them next."
  - date: 2026-10-06
    agent: it-po
    reason: "it-po-build-tooling-fix: user decisions 2026-10-06, flags F2 and F3 (build-tooling fix design, sections 2, 3 and 8; tickets T1 and T3). Criteria untouched. it_requirements: the 'Resume safety ... re-runs the reader' entry conflicted with the reuse rule and now states it: reuse only with the same source_ac and every recorded red test still among the newly added covers-tagged tests; otherwise the reader runs; the test writer's claim never substitutes. Entries were added for the record format (frontmatter key red_baseline_gate with passed, recorded_at, head, source_ac and red [{file, function}]), the anchored atomic write, unrecorded and reused pass reporting, --ticket, the interpreter (python in both lanes, the verdict carries interpreter, test_interpreter_unusable when pytest is not importable), lane parity, green_at_baseline (option A) and the size ratchet. test_spec: fourteen cases added, nine on the gate subcommand against the real git fixture and five on the twin drivers. test_rationale and notes (IT-PO PASS 3) extended. estimated_complexity M -> L, because the amended scope spans the gate module, the CLI, three lane drivers and a skill. assigned_agent, work_status, readiness, covered_by and implemented_by untouched."
