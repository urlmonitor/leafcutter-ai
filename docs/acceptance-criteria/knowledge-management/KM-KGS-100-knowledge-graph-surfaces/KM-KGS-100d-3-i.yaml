notes: |
  WHY A COUNT AND NOT ONLY A MESSAGE. A message on the diagnostic stream is read
  by whoever is watching the build at the moment it scrolls past. The count sits
  beside the edge count and is read by anyone who later asks whether the map is
  complete — which is the question the silent drop made unanswerable. Both arms
  are in the criterion because either alone leaves the map's completeness a
  matter of trust.

  THE DISTINGUISHING CLAUSE IS THE POINT, AND IT IS EASY TO DROP. "Zero edges"
  and "zero edges because three entries were declined" render identically today.
  An implementation that reports declines only when there are some, without ever
  stating the denominator, reproduces the ambiguity on a smaller scale — a reader
  who sees no decline line cannot tell whether nothing was declined or nothing
  was looked at. State both numbers, always.

  THIS ARM SURVIVES THE FIX AND IS NOT DEAD CODE AFTERWARDS. Once
  KM-KGS-100d-3 lands, the labelled form is accepted, so the decline path is no
  longer exercised by the shape that motivated it. It remains exercised by every
  shape the resolver does not accept — including the two-key mapping GE-118d-2
  refuses on the guard side, which is the case where a document's author believes
  they declared two relationships and the map contains none of them. Without this
  record that case is silent in exactly the way the original defect was.

  BLOCK-VERSUS-ANNOUNCE IS SETTLED HERE AS ANNOUNCE, DELIBERATELY. The final
  clause says the build does not fail on a declined entry. The map builder is not
  a gate; failing a build over one malformed relationship in one document would
  make the map's integrity check a commit blocker by accident. The refusal belongs
  to the commit-time guard (GE-118d-1), which is the surface an author is already
  interacting with. Two records, two dispositions, stated rather than inherited.
