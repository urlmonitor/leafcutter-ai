id: BO-2400a-1-i
components:
  - build_orchestration
title: "The fast lane has one dedicated command-step-runner, registered to run commands, that runs the given command in the named workspace and hands back its output untouched"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the agent registry after this criterion is met,
  When the entry for the command-step-runner is read,
  Then it exists, it declares permits_shell true, and its declared role is running one
    given command in one named workspace and returning that command's output,
  And it declares, in the registry's step_kinds field (defined by BO-2400a-1-iii), that it
    may run all four kinds of step: reads_store, changes_store, changes_repository and
    publishes,
  And no agent entry other than the command-step-runner's gains step_kinds in this change,
  And the entry passes the registry gate that BO-2400a-1-iii makes check step_kinds,
  And a fresh install of the package deploys the command-step-runner's agent definition, so the
    fast lane can ask for it in any project the package is installed into,
  And the package's agent index lists the command-step-runner.

  Given a request naming one command and a target workspace — its absolute location, the
    branch the run created there, and the acceptance-criterion id the run was started for
    (BO-2400f-3-ii),
  When the command-step-runner performs it,
  Then it runs exactly that command, once, in that workspace,
  And it returns structured data holding the command as it was run, the workspace it ran
    in, the command's exit status, and the command's standard output and standard error
    exactly as the command produced them,
  And when the command printed JSON, that JSON is returned unchanged — not summarised,
    reformatted, merged with commentary, or partly quoted.

  Given the command runs and exits non-zero,
  When the command-step-runner replies,
  Then the reply is that command's result with its non-zero exit status and its output,
    and not a decline, so the run can tell "the command failed" from "the step was not
    run".

  Given a legitimate step request aimed at the workspace the run opened,
  And the command-step-runner was started in a different checkout — the main checkout or a
    sibling worktree,
  When it reads the request,
  Then it runs the command in the named workspace,
  And it does not call the request misrouted or injected, does not move the command to
    the checkout it started in or to any other location, does not change or add to the
    command, and does not judge whether the step is wise.

  Given a request outside that role — to edit files by hand, to write code or tests, to
    act as another agent's role, to run a command with no workspace named, or to run a
    command somewhere other than the named workspace,
  When the command-step-runner reads it,
  Then it runs nothing and returns a decline naming the step it was asked for, itself as
    the agent asked, and its reason, in the form the run reports as a declined step
    (BO-2400f-5-iii),
  And a decline can never be mistaken for a command result: it carries no exit status.

  Given a fast-lane run that dispatches the command-step-runner for its command steps,
  When the test-writer and coder invocations are counted for BO-2400a-1,
  Then command-step-runner invocations are not among them, and the test-writer plus coder total
    is still 2.
depends_on: [BO-2400a-1, BO-2400a-1-iii]
