assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-400a-1
  contract: The detection gate and bundle threshold of DK-400a-1; below the threshold no split record is created.
it_requirements:
  - 'A not-bundled single question reaches exactly today''s interactions: the same envelope sequence and the same
    Jev batches apart from the one added bundle question, no split record, and no split section in report.md.'
  - The check adds no provider call and no host operation to this run (see DK-400a-1).
  - The no-split outcome is recorded once per item and the bundle question is never asked again on a continuation
    or retry of the same item.
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_single_question_goes_on_as_one_decision_without_split
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: The retention-period question with bundle 0.1 proceeds to the decision's precedent step with no
      split record, no split interaction and no split section in report.md.
  - name: test_single_question_jev_calls_equal_split_disabled
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: The scripted provider records the same number of provider calls as the split.enabled false run.
  - name: test_bundle_question_asked_once_per_item
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: A continuation or retry of the same item carries no second bundle question.
test_rationale: This AC guards today's working path; comparing a whole run against the off-switch run is the only
  way to show nothing else changed.
