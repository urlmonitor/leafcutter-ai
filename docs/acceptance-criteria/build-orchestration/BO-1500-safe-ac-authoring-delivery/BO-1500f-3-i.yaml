notes: |
  The crashed-owner case is where a naive ownership check silently degrades back into the
  old adopt-anything behavior: the owner is gone, so the workspace looks unowned, so the
  next run walks into its drafts. Distinct from BO-1500b-2, which covers the owning run
  resuming its own committed work; this covers a DIFFERENT run meeting that wreckage.

  Re-homed 2026-08-14 from BO-1500a-10-i to BO-1500f-3-i by the Pattern C intermediate
  split of BO-1500a. Criteria text is unchanged.
