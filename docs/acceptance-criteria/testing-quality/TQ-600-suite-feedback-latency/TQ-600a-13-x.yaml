- reason: >-
    ADDITIVE ONLY -- A RECORDED DECISION NOT TO CHANGE ANYTHING. criteria, declared_files (all
    three entries left at `to_be_created`), it_requirements, test_spec, depends_on,
    work_status (todo), readiness (approved) and every other field are UNTOUCHED. One notes
    block is added and this entry. NO RE-APPROVAL IS OWED: nothing this record requires has
    changed, and the entry exists so three standing advisory reports are not read as neglect.


    THE QUESTION. This record declares scripts/ci/post_merge_hold.py,
    scripts/ci/post_merge_notice.py and scripts/ci/post_merge_tunables.json as
    `to_be_created`. All three now exist, none was created by this record's own work (hold.py
    by -vi, notice.py by -iii, tunables.json by -ii), and this record's own it_requirements
    describe it as EXTENDING the tunables file rather than creating it. So each of the three
    produces a standing "marked to be created but already exists" advisory report. Whether to
    flip them to `existing` was escalated to the owner on 2026-10-12 and delegated back to
    the BA to decide.


    DECIDED: LEAVE ALL THREE AS `to_be_created`. Four reasons, in descending weight; the full
    argument is in the notes block added by this entry.

    (1) THE MARKER IS A BUILD PRECONDITION -- "the work must not assume this path is present"
    -- not a claim that this record's own work creates the path, and not a historical note
    (settled in ACD-1600c-4-v). `to_be_created` is therefore the CORRECT AND SAFE declaration
    here: this record's build order relative to -vi, -iii and -ii is not guaranteed (it
    depends_on -vi only, and not on -iii or -ii at all), so it must not assume any of the three
    files is present. Flipping to `existing` would assert a precondition this record cannot
    guarantee. THIS REASON SURVIVES ALL THREE CANDIDATE READINGS OF THE FIELD, which is why the
    decision did not have to wait on the semantics: under the historical reading the
    declarations were true when made, under the precondition reading they are still true, and
    only under the ownership reading would they be wrong -- and that reading is dead (the
    two-value enum leaves nine such records unencodable, and a false ownership claim would have
    to refuse rather than report).

    (2) `existing` + absent + not-done is a BLOCKING REFUSAL in the declared-files check,
    where `to_be_created` + present + not-done is only advisory. Flipping arms a merge blocker
    on three files whose lifecycle this record does not control: if any is renamed or removed
    by revision of -vi, -iii or -ii before this record is built, every commit staging this
    record is refused. This record is `work_status: todo` against a hard 2026-11-02 deadline,
    which is the worst available moment to arm that.

    (3) These three are the ONLY VISIBLE INSTANCES of a condition measured at 15 declarations
    across the same three paths, 12 of which sit on `done` records and are silently exempted.
    Flipping them takes the count visible to a reader from 3 to 0 while the specification
    defect behind the exemption is still open in draft.

    (4) The advisory report is ACCURATE AND BENIGN here. ACD-1600c-4-i's own notes say the
    report covers both a stale marker AND the legitimate mid-build case where "the file was
    created by the work in progress". This is that legitimate case, one family member over.
  by: business-analyst
  at: '2026-10-12'
