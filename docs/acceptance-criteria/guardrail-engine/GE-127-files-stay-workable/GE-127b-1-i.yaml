it_requirements:
  - >-
    THE POPULATION THESE CLAUSES ARE ABOUT IS THE RESOLUTION OF THE PREVIOUS-LENGTH SOURCE,
    NOT THE PER-COMMIT SET OF STAGED FILES THAT HAVE A PREDECESSOR. READ THIS BEFORE
    IMPLEMENTING ANYTHING ELSE HERE — the wrong reading breaks the sibling. GE-127b-1's
    fourth arm requires a commit staging only newly added files to COMPLETE. Under the pinned
    HEAD-blob source, such a commit has no staged file with a predecessor, so a naive reading
    of this record's second clause ("the record holds a previous length for no file
    whatsoever" → refuse) would refuse exactly the commit the sibling requires to succeed.
    The two records are reconciled by taking the population to be the previous-length SOURCE
    resolved for the run — the repository's HEAD tree and the ability to read blobs from it —
    rather than the per-commit lookup results. Concretely: "cannot be read at all" means git
    is unavailable, the working copy is not a repository, or HEAD does not resolve (an
    initial commit with no parent); "read and cannot be interpreted" means HEAD resolves but a
    blob read fails or its content cannot be decoded in the encoding the standard reads;
    "established successfully and holds a previous length for no file whatsoever" means HEAD
    resolves and its tree contains no covered file at all. A commit adding only new covered
    files against a populated HEAD is NONE of those three and must complete. This reading is
    also the one that matches BP-100n-4-ii, whose two populations are both repository-wide
    (the gate-script directory listing and the registry) rather than per-invocation.
  - >-
    THE STATED COUNT IS THE NUMBER OF STAGED COVERED FILES ACTUALLY COMPARED AGAINST A
    PREVIOUS LENGTH, AND ITS POSITIVITY IS CONDITIONAL ON THERE BEING SOMETHING TO COMPARE.
    The criterion's fourth arm opens "given a run in which the previous lengths were
    established", which scopes the positive-count requirement to runs where at least one
    staged covered file has a predecessor. An all-new-files commit is outside that scope and
    must not be refused for a compared-count of zero. Implement the count as an unconditional
    statement in the outcome — always printed, whatever its value — and the refusal as a
    consequence of the SOURCE being unresolvable or empty, never of the count being zero.
    This is the positive-count form BP-100n-4-ii requires: make the empty state
    unrepresentable in the output, then derive the refusal from the source state rather than
    from the number.
  - >-
    NO PACKAGE SURFACE — MEASURED. This record adds no hooks_manifest.hooks id and no new
    top-level mapping key to commit_guardian.json, the only two containers
    _package_surface_registry.WATCHED_REGISTRIES binds on that file. It changes the outcome's
    summary line and adds the source-resolution floor. Do NOT mint a config_schema_fragment
    key to clear the structured-spec validator: BP-100n-4-ii records that BP-100k-4 and
    BP-100k-4-i each declared a key that was never created, and commit_guardian.json's 36
    top-level keys still contain neither. A second imaginary key would make the machine-checked
    spec less trustworthy than no spec at all.
  - >-
    REUSE BP-100n-4-ii's VERDICT VOCABULARY AND EXIT-STATUS CONTRACT UNCHANGED, AND THE SAME
    ONE GE-127a-1-i PINS. "INDETERMINATE: reason=<text>" naming which situation occurred, with
    exit 2; exit 0 for a clean run; exit 1 for a reported finding, which keeps GE-127b-1's
    grew-and-refused case distinguishable from an unresolvable one. Do not mint a third verdict
    set and do not widen the exit-status set. All three unresolvable conditions here — HEAD
    unreadable, HEAD uninterpretable, HEAD holding no covered file — report through that same
    line with different reason text.
  - >-
    ONE SUMMARY LINE, EXTENDED IN PLACE, NEVER A SECOND ONE. Whatever the run states about how
    many files it compared belongs in the single outcome the author already reads from this
    gate. A second summary printed elsewhere lets one line report a determinate run while the
    other reports an empty one, and the reader has no way to know which is authoritative. This
    is BP-100n-4-ii's one-summary rule applied here.
  - >-
    THE TWO UNAVAILABLE SITUATIONS ARE DISTINGUISHED BY NAME, NOT MERELY BOTH REFUSED. "The
    previous lengths could not be read" and "they were read successfully and there are none"
    demand opposite responses — a broken lookup versus a genuinely empty history — and
    collapsing them costs the reader the only information that separates them.
  - >-
    A SWALLOWED LOOKUP ERROR MUST NEVER BECOME AN EMPTY POPULATION, AND AN EMPTY POPULATION
    MUST NEVER BECOME A COMPLETED COMMIT. This is the exact shape all four cited precedents
    shipped — KI-CG-034 examined 169 files, compared zero and exited 0; KI-CG-012; KI-CG-018;
    the AC-store validator's bare-directory no-op that reported clean for eight days. The
    subprocess call to git is external I/O under the repo error-handling policy: specific
    exceptions only (subprocess.CalledProcessError, subprocess.SubprocessError, OSError,
    UnicodeDecodeError), log at WARNING or higher or re-raise, and the re-raise-equivalent here
    is the INDETERMINATE verdict.
  - >-
    EXERCISE THE UNAVAILABLE STATES FOR REAL. Make the previous-length source genuinely
    unavailable at run time — a working copy that is not a git repository, a repository with
    no HEAD commit, a HEAD whose blob read fails — and make the empty state genuinely empty.
    BP-100k-4-i's standing constraint applies unchanged: never assert that an error branch is
    present in the source, because such an assertion stays green on precisely the fail-open
    implementation this record exists to forbid.
  - >-
    HOST, LAYERING AND THE BUILD. The floor and the summary assembly belong in the same sibling
    module inside templates/scripts/commit_guardian/ that holds GE-127b-1's previous-length
    resolution — build_commit_guardian copies that directory whole, so no
    scripts/build_phases.py deploy entry is needed; a module imported from outside it does need
    one. templates/scripts/commit_guardian/ is canonical; scripts/commit_guardian/ and the
    repo-root .pre-commit-config.yaml are untracked build outputs; templates/commit-guardian/
    is a decoy. config.py:19 resolves the config beside the DEPLOYED script, so
    `python scripts/build.py --target-dir .` is part of this change.
test_spec:
  - name: test_ge_127b_1_i_an_unreadable_previous_length_source_is_named_as_such_and_refuses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      With the previous-length source made GENUINELY unavailable at run time — a working copy
      that is not a git repository, or a repository whose HEAD does not resolve — the executed
      gate states that the previous lengths could not be established, names this specific
      situation as the could-not-be-read one, and the commit does not complete. Exercised by
      breaking the lookup for real, never by asserting an error branch exists in the source.
  - name: test_ge_127b_1_i_an_uninterpretable_previous_length_source_names_its_own_reason_and_refuses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      A source that resolves but whose content cannot be interpreted — a HEAD blob that cannot
      be decoded in the encoding the standard reads — is reported with a reason naming that
      situation specifically, distinct in text from the could-not-be-read one, and the commit
      does not complete.
  - name: test_ge_127b_1_i_a_source_holding_no_previous_length_for_any_covered_file_is_the_third_named_situation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A source that resolves successfully and holds no covered file at all — a repository whose
      HEAD tree contains none — is reported as a DIFFERENT, separately named situation from
      both unavailable ones, and also refuses. Establishes that a successfully-empty resolution
      carries the same epistemic weight as a failed one while remaining distinguishable from it
      in the outcome.
  - name: test_ge_127b_1_i_a_commit_adding_only_new_covered_files_against_a_populated_history_completes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE SEAM DESCRIPTOR THAT KEEPS THIS RECORD FROM BREAKING ITS PARENT — the disambiguation
      pinned in it_requirements, made executable. In a repository whose HEAD already holds
      covered files, stage a commit consisting only of NEWLY ADDED covered files, all below
      their permitted lengths. The commit must complete, and the outcome must state a compared
      count of zero without that zero causing a refusal. An implementation that reads "holds a
      previous length for no file whatsoever" as the per-commit lookup result rather than as
      the resolution of the source refuses this commit and contradicts GE-127b-1's fourth arm.
      This descriptor and GE-127b-1's newly-added-file descriptor must be green simultaneously.
  - name: test_ge_127b_1_i_neither_unavailable_situation_reports_any_file_as_not_having_grown
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      In none of the three unresolvable situations is any file reported as not having grown, and
      in none does the commit complete as though every file had been compared and found not to
      have grown. NAMED MUTATION (mandatory, run it, do not merely describe it — the BA's
      injection): make the previous-length lookup yield an empty collection on error rather than
      raising or returning an unavailability signal. That is the ordinary fail-open shape and
      the one all four cited precedents actually shipped. Under the injection every file
      compares against nothing, the run states zero files compared, and the commit completes;
      this descriptor must go RED, and it must fail BY THE COMMIT OUTCOME as well as by the
      text, then return to green on revert.
  - name: test_ge_127b_1_i_the_stated_compared_count_moves_with_the_number_of_covered_files_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      ASSERT BY VARIATION, NEVER AGAINST A LITERAL. Run the gate twice over the same repository,
      staging a different number of covered files with predecessors each time, and require the
      stated compared-count read from the gate's own output to move with it. A fixed expected
      number satisfies a stated-count requirement while proving nothing about what was examined
      — which is the same defect one level up, and is how every one of the cited precedents
      passed its own tests.
  - name: test_ge_127b_1_i_a_clean_run_states_a_positive_compared_count_and_that_is_what_makes_it_clean
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Over a run in which at least one staged covered file has a predecessor and none has grown,
      the stated compared-count read from the gate's own output is greater than zero, and it is
      that positive number — not the absence of findings — that establishes the run as clean. A
      run reporting nothing while stating a compared count of zero must not be accepted as clean
      by this descriptor.
  - name: test_ge_127b_1_i_the_count_and_the_indeterminate_verdict_reach_the_registered_hook_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate as a subprocess through the registered hook path and
      assert that the compared-count appears in the hook's own output stream on a determinate
      run, that the indeterminate verdict and its named reason appear on an unresolvable one,
      and that the exit status is the commit outcome in both cases rather than an advisory note.
      A count computed by a function nothing at commit time calls is inert — which is the defect
      this whole family exists to close.
  - name: test_ge_127b_1_i_the_deployed_copy_fails_closed_when_the_previous_length_source_is_unavailable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold
      process — a helper outside templates/scripts/commit_guardian/ with no
      scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError rather than
      passing. With the previous-length source made genuinely unavailable to that deployed run,
      it emits the indeterminate verdict with its named reason and exits non-zero; over the real
      repository it states a compared count greater than zero and exits zero. Source-tree
      greenness cannot substitute: the hook runs from the deployed layout.
test_rationale: |
  Every clause here asserts what the gate must NOT do — must not report a file as not having
  grown, must not let the commit through, must not let a comparison that never happened look
  like one that found nothing. On today's implementation, which has no previous-length notion
  at all, all of them are green on arrival for the trivial reason that nothing is reported.
  That is KI-TQ-010's shape, and it is why the absence-asserting clause carries the BA's
  executable injection rather than a note. Requiring that injection to fail by the COMMIT
  OUTCOME as well as by the text is deliberate: a check that prints a worried message and then
  exits 0 is indistinguishable from a passing one to pre-commit, which reads only the status.

  The mutation is not hypothetical — an error path returning an empty collection instead of an
  unavailability signal is a reconstruction of KI-CG-034, KI-CG-012, KI-CG-018 and the AC-store
  validator's bare-directory no-op, all four of which shipped exactly that shape on this
  surface.

  The compared-count descriptor asserts by variation rather than against a literal because a
  hard-coded number satisfies a stated-count requirement while proving nothing about what was
  examined. BP-100n-4-ii requires the same construction for the same reason.

  One descriptor exists that the criteria do not name, and it is load-bearing: the
  all-new-files commit. The criteria as written use one population for both the source
  resolution and the per-commit comparison, and the per-commit reading of the empty-source
  clause refuses exactly the commit GE-127b-1's fourth arm requires to complete. That
  descriptor and GE-127b-1's newly-added-file descriptor must be green simultaneously, which
  is what forces the reading pinned in it_requirements and makes the two records consistent.

  Per BP-100k-4-i's standing constraint, every unresolvable state is exercised by making the
  lookup genuinely unavailable at run time; the reachability descriptor runs the registered
  hook entry point and the deployed descriptor runs the built copy, so a missing deploy-map
  entry cannot hide behind source-tree imports.
