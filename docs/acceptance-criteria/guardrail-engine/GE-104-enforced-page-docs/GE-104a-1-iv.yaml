assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Add a hooks_manifest.hooks entry to commit_guardian.json (resolves BA open question on hook id and config keys). Hook id: 'check-frontend-page-docs'. tier: 'judgment'. name: 'Check Frontend Page Documentation'. entry: 'python scripts/commit_guardian/run_hook.py scripts/commit_guardian/check_frontend_page_docs.py'. language: 'system'. files: '^site/app/.*page\\.tsx$' (matches frontend page files). stages: ['pre-commit']. pass_filenames: false (consistent with check-components-integrity, which lets the hook query git itself rather than receiving passed filenames)."
  - "Add a top-level config section keyed 'page_doc' (resolves BA open question on config key name) with: a '_comment' describing the hook, a 'mode' key whose allowed values are 'block' and 'warn' (default 'block'), a 'doc_dir' key defaulting to 'docs/reference/frontend' (the destination root for derived docs), and a 'page_glob' key defaulting to 'site/app/**/page.tsx' (the page-detection pattern). The hook reads page_doc.mode at runtime to decide block vs warn."
  - "The hook id used in the manifest entry MUST equal the id the hook itself reports and MUST be the key the block-vs-warn behavior keys off (page_doc.mode), so there is one stable identifier across manifest, config, and script."
  - "Self-hosting parity (ADR-001): apply the identical manifest entry AND page_doc config section to all three commit_guardian.json copies — scripts/commit_guardian/commit_guardian.json, templates/commit-guardian/commit_guardian.json, and templates/scripts/commit_guardian/commit_guardian.json — and verify parity via the build.py round-trip. Never edit one copy only."
  - "The entry must be valid JSON consistent with the existing hooks_manifest schema so build.py can emit it into .pre-commit-config.yaml without error."
delivers_to:
  agent: python-coder
  contract: "commit_guardian.json hooks_manifest entry { id: 'check-frontend-page-docs', files: '^site/app/.*page\\\\.tsx$', stages: ['pre-commit'], pass_filenames: false, entry: run_hook.py wrapper } plus a top-level 'page_doc' config section { mode: 'block'|'warn' (default 'block'), doc_dir: 'docs/reference/frontend', page_glob: 'site/app/**/page.tsx' }. The hook script (GE-104a-1) reads page_doc.mode at runtime."
expects_from:
  ac_id: GE-104a-1
  contract: "The hook script at scripts/commit_guardian/check_frontend_page_docs.py whose runtime block-vs-warn decision is driven by the page_doc.mode config key registered here."
