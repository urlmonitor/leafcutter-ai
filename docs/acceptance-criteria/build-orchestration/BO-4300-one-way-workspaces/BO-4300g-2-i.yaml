notes: |
  This is the regression guard. The fast lane's route was closed by re-pointing one dispatch,
  but plan-feature kept four of the same shape, and nothing stopped new ones from being added.
  The workflow set is derived, as BO-4300c-3 derives its consuming set, so a new workflow is
  covered without anyone editing a list.

  IT PO 2026-10-25: the check's "at least one removal-capable dispatch examined" assertion needs
  finalize step 7 to carry the authorization, so this record builds after (or with)
  BO-4300g-3; depends_on (BA field) now names BO-4300g-3 alongside BO-4300g-2 and BO-4300g-1.
  The contract is recorded in expects_from BO-4300g-3.

