assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The disqualifying fact must be derived from where the copy lives relative to the source-versus-deployed boundary that ADR-001 and ADR-013 define. It must NOT be derived from the outcome of importing the helper, from the helper's presence on disk, or from any other condition a reader could change."
  - "The dependency-satisfied arm must satisfy EVERY resolution route the copy offers - the package import, the script-relative lookup and the project-root walk that KI-CG-019 names - not just the easiest one. An arm that leaves one route failing is passed by an implementation still keyed on the import result and looks identical in the test report."
  - "The two refusals must be compared to each other for equality of outcome value AND of wording, not each against a literal. Two literals that happen to match today are the drift shape this tree keeps meeting; equality between the runs is the assertion the criterion actually states."
  - "The fixture that plants the helper must remove it afterwards and must leave the build-source tree byte-identical. A helper left behind in templates/ would be committed and would permanently change what that copy is."
  - "The deployed copy must be exercised in both situations. Without that arm the refusal could have become a property of the check rather than of the copy, and every commit in the repository would be refused."
  - "Error handling must follow the four rules in CLAUDE.md. Handling the import failure more loudly is explicitly NOT what this record asks for - that is the current behaviour with a different exit code, and it leaves the copy deciding what it is from an accident of its surroundings."
test_spec:
  - name: test_build_source_copy_refuses_with_every_dependency_route_satisfied
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_ac_parent_covered_by.py"
    description: "The helper is planted so that the package import, the script-relative lookup and the project-root walk all succeed; the build-source copy run by subprocess against a violating record still returns the refusal outcome and still names the enforcing copy. An implementation keyed on the import result cannot pass this."
  - name: test_the_refusal_is_byte_identical_with_and_without_the_dependency
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The refusal from the dependency-satisfied run and the refusal from the dependency-absent run are compared to each other - same outcome value, same wording - so a reader cannot tell the two situations apart and does not need to."
  - name: test_build_source_copy_never_produces_a_verdict_or_an_ordinary_pass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Across both dependency situations and against both a violating and a clean record, no run of the build-source copy returns a verdict on the record or the ordinary success value."
  - name: test_deployed_copy_blocks_in_both_dependency_situations
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_parent_covered_by.py"
    description: "With the helper planted in templates/ and with it absent, the deployed copy blocks the same violating record by name - the refusal is specific to the build-source copy and has not become a property of the check."
test_rationale: |
  This record exists to kill one wrong decomposition — "handle the import failure more
  loudly" — and only one descriptor can tell the right implementation from the wrong
  one: running the build-source copy with the dependency fully satisfied. An
  implementation keyed on the import result passes every other descriptor here and
  fails that one; an implementation keyed on where the copy lives passes it without
  effort. That is why the first descriptor also insists on satisfying all three
  documented resolution routes rather than the convenient one: an arm that leaves the
  project-root walk failing is still passed by the import-keyed version, and the test
  report looks the same either way. The byte-identical comparison is written as a
  comparison between the two runs, not against expected text, because the criterion is
  about their sameness rather than about their content.
delivers_to:
  agent: documentation-expert
  contract: "The fact that the build-source copy's refusal is a property of the copy rather than of its environment, and the boundary the check reads to know that. GE-126c-4 states the reason that copy can never run there; that reason is only accurate once the rule is keyed to location rather than to a dependency."
expects_from:
  ac_id: GE-126c-1
  contract: "The refusal outcome value carried by the build-source copy. This record fixes what that refusal is KEYED TO, without changing the value itself."
