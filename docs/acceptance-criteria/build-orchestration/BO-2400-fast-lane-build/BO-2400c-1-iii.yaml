id: BO-2400c-1-iii
components:
  - build_orchestration
  - injection_builder
title: "The prompt a dispatched fast-lane agent receives is the assembled bundle"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run that dispatches its phase agents to build a connected set,
  When each build-context-carrying agent is dispatched — at minimum the test-writer and
    the coder, the two that receive the run's working context,
  Then the prompt that agent receives is the bundle the prompt-caching layer assembled:
    the stable layers first, then the cache breakpoint, then this run's volatile layers,
  And the bundle reaches the agent verbatim — what the layer produced is what is sent,
    not a summary of it, a re-worded version of it, a subset of it, or a pointer to
    where it could be found,
  And the criterion is satisfied only by what the dispatched agent receives: a run that
    names the layer, invokes it, and then composes its prompts some other way does not
    satisfy it, however faithfully the layer was called.

  Given the assembling step has returned to the lane,
  When the lane inspects what came back,
  Then what came back is the bundle's content, in the lane's own hands — not a value
    naming somewhere that content may be found, because the lane cannot read a
    filesystem and a location it has been handed is not a bundle it has,
  And a returned value that is a filesystem path, a file: URI, or any other locator
    standing in for the content is refused as a reference rather than accepted as a
    bundle,
  And the size the lane expects is stated to whatever produces the bundle, so a step
    handling roughly twenty kilobytes of text is told plainly that returning the text
    itself is the ask — this refusal being a check on an already-small payload, never
    the thing that makes it small (BO-2400c-1-vi).

  Given the lane cannot use the bundle for this run,
  When it halts,
  Then its message names which one of three things happened, and names only that one:
    the bundle was never obtained, because the assembling step failed or declined and
    nothing came back; or the bundle was obtained and is unusable because it arrived as
    a reference, in which case the message says the assembly SUCCEEDED, gives the size
    and the location that were reported, and says the lane cannot follow a reference
    because it cannot read a filesystem; or the bundle was obtained and is unusable
    because its content is incomplete, the breakpoint marker being absent or a layer
    empty,
  And it does not quietly fall back to prompts composed some other way, so a lane that
    is not assembling its context is visibly different from one that is — rather than
    looking identical from the outside, which is how this went unnoticed.
depends_on: [BO-2400c-1, BO-2400c-1-ii]
