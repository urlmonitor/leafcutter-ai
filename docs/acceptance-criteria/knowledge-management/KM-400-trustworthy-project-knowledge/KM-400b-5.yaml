criteria: |
  Given a source revision, mapping version and graph evidence baseline
  When an empty database is rebuilt from that revision
  Then graph results have equivalent canonical identities, relationships and source provenance to the baseline
  When a retained generation is selected for rollback or an expired generation is cleaned up
  Then only the selected repository's projector-owned generation is affected
  And foreign repository data is unchanged
  And continuations for removed generations receive an explicit expiration result
