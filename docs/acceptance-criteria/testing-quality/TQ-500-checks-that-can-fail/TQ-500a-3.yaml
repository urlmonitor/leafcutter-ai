  - path: docs/testing/test-angles.md
    relationship: relates-to
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - >-
    THE ALTERATION FIELD MUST BE REQUIRED, NOT MERELY PERMITTED. Record U —
    claiming the substitute evidence while naming no alteration — is only
    detectable by TQ-500a-3-i if the template states the field as mandatory
    within the substitute shape. A field described as optional produces a
    conforming-looking record with nothing in it.
  - >-
    THE REVERT IS TWO SEPARATE STATEMENTS, NOT ONE. "Reverted" and "the tests
    returned to their pre-alteration outcomes after re-running" are different
    facts and TQ-500a-3-i detects their omissions by different mechanisms — a
    presence check for the first, a comparison of two outcome sets for the
    second. A template that folds them into one sentence makes record T
    indistinguishable from record R.
  - >-
    THE SPECIFICITY BAR IS "ANOTHER PERSON CAN REAPPLY IT WITHOUT ASKING". Set
    it against the precedent already in templates/agents/test-writer.md, whose
    red_baseline block requires the actual error text from the verification run
    rather than a paraphrase. "Broke the behaviour and the tests went red" is
    unfalsifiable prose and must be shown as a non-example.
  - >-
    Must not require or imply that the writer justify the alteration as the
    right one. Whether the alteration is the leak the requirement actually
    forbids is not establishable from any record, and a template that asks for it
    invites the self-certified non-vacuity KI-TQ-010 names.
  - >-
    Must carry the revert instruction as a safety obligation, not a formality:
    this is the only procedure in the pipeline that deliberately breaks working
    behaviour, and an unconfirmed revert leaves a live defect introduced by the
    act of proving the tests catch defects.
delivers_to:
  - agent: python-coder
    ac_id: TQ-500a-3-i
    contract: >-
      Within the substitute-evidence answer: a named alteration (behaviour changed,
      and what to), a revert statement, and a post-revert re-run result. Absent
      revert, non-restoring revert, and unnamed alteration are the three
      non-conforming states TQ-500a-3-i reads for and reports by name.
expects_from:
  ac_id: TQ-500a-1
  contract: >-
    The declaration that this piece of work's answer is of the substitute kind.
    This AC specifies what that answer must contain; it does not decide which
    pieces of work carry it.
test_required: false
test_rationale: |
  Genuinely test-free at this AC's boundary, on the BP-1100g-5 precedent. Every
  Then clause describes what a writer must state; the deliverable is template
  prose. The three non-conforming states this AC's contract names — revert not
  stated, revert did not restore, alteration not named — are asserted over
  emitted records by TQ-500a-3-i, which carries the test contract and names the
  injection for its own must-not-report clauses.
