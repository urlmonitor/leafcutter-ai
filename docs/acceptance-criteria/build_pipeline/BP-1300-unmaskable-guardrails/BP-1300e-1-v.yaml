notes: |
  USER DECISION 2026-10-09: a linter version that differs from the version CI
  uses REFUSES the commit. Decided, not open. Before this record the family only
  required the hook to PRINT its linter version (BP-1300e-1 it_requirements,
  constraint "PRINT THE RUFF VERSION USED", which says "This AC does not enforce
  the pin ... recorded as a caveat"). This record retires that caveat; the
  IT-PO should amend that constraint's wording when enriching, since the parent
  was edited here only to add covered_by.

  WHY IT PARALLELS BP-1300e-1-iii. -1-iii refuses when the linter is absent,
  cannot start, or its configuration cannot be read, because a verdict under
  different rules (e.g. built-in defaults) is not CI's verdict. A different
  linter version is the same defect by another route: new rules, changed rule
  behaviour and changed defaults between versions mean the same content can get
  a different verdict. So it gets the same disposition: refuse, name the reason,
  give the fix, never show "passed". Like -1-iii, "nothing to inspect" is
  decided first and is not blocked by the version, so a docs-only commit is
  never refused over a linter it had no use for.

  WHERE CI'S VERSION LIVES TODAY (verified 2026-10-09 in this worktree, cut from
  origin/main). Not in .github/workflows/ci.yml: the lint job's step "Install
  dev dependencies" runs `pip install -r requirements-dev.txt`, and
  requirements-dev.txt line 29 pins `ruff==0.15.15` (the only exact pin in that
  file's tooling block; pytest and mypy are ranges). The IT-PO's 0.15.15 is
