criteria: |
  Given the finalize-feature workflow is running in the background over several
    steps,
  When progress is surfaced into the main conversation,
  Then a progress line for a step appears in the conversation while the run is
    still in flight — before the run has finished — reflecting the step
    currently underway,
  And multiple distinct progress updates arrive in the conversation over the
    course of the run, rather than a single batch delivered only after the run
    completes.
