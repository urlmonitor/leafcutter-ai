test_spec:
  - name: test_tq400a6_three_checkers_call_one_verdict_source_and_carry_population_labels
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Parse the mermaid block and assert all four elements are present, that each
      of the three checkers has an edge INTO the single verdict node (and that
      exactly one verdict node exists), that each checker node carries a
      population label, and that the inventory node plus both consumer nodes are
      present. Four labelled boxes with no edges into a shared verdict node
      satisfies a presence check and is the failure this entry catches.
  - name: test_tq400a6_named_modules_and_symbols_resolve_in_the_repository
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      For every path in the diagram's frontmatter related_code, assert the file
      exists; for every module or symbol named in the mermaid body, assert it
      resolves to a real definition in that file. Read the diagram as the bytes on
      disk, not a fixture. An element drawn as present that names a module which
      does not exist must fail.
  - name: test_tq400a6_verdict_source_matches_the_sequence_diagram_and_the_real_caller
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      TWO SOURCES, ONE VOCABULARY. Assert the verdict-source symbol this diagram
      names is the same symbol docs/architecture/diagrams/
      c3-done-proof-evaluation-sequence.md names, AND the same symbol the
      commit-time and change-time checkers in
      scripts/commit_guardian/check_done_proof.py actually call. Two names for one
      oracle across two diagrams is the drift the depiction exists to prevent.
  - name: test_tq400a6_new_diagram_passes_the_real_naming_and_frontmatter_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      PRODUCTION ENTRY POINT, BOTH POLARITIES. Run
      scripts/commit_guardian/check_diagram_naming.py and
      scripts/commit_guardian/check_doc_frontmatter.py as subprocesses over the
      new file and assert they pass; then run them over a copy whose flight_level
      contradicts its c-prefix and assert they block (must_block). Re-implementing
      the naming regex in the test proves nothing about the gate that runs.
test_rationale: >-
  change_target is docs, but a diagram's failure mode is not absence — it is a
  well-formed picture of something that is not there. A file-exists test, and even
  documentation-verifier's real-diff assertion, are both satisfied by a diagram
  drawing the intended architecture rather than the delivered one; that is the
  precise artifact this AC's publication-accuracy clause forbids, so the contract
  has to reach past the file into the repository. NOT MECHANICALLY TESTABLE: "a
  reader can answer from the diagram alone which element would have to change to
  alter a verdict versus the set of records checked" is a comprehension claim. Its
  proxy is structural and deliberately narrow — one verdict node with three
  inbound checker edges, each checker carrying a population label — because that
  topology is what makes the two questions separable at a glance, and its absence
  is what makes them inseparable. Likewise "distinguishable as introduced" is
  proxied by requiring a declared legend convention rather than by asserting a
  reader noticed it. The real_artifact and seam entries carry the weight: they
  make every name in the picture falsifiable against the code and against the
  sibling sequence diagram.
