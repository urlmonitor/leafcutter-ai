notes: |
  FAIL SAFE, NOT FAIL FAST, AND DELIBERATELY SO. The alternative — refusing to run
  an undeclared test — was considered and rejected: it makes every future test
  author's first encounter with this machinery a hard stop, and the cost of the
  safe default is one extra 59.8s deploy for one test until somebody labels it.
  The reported name is what stops that one deploy becoming permanent.

  THE THIRD CLAUSE PREVENTS THE CHEAPEST WRONG IMPLEMENTATION. Routing by filename
  pattern — "anything matching test_bp_900g_8* gets its own copy" — satisfies
  TQ-600a-1 and TQ-600a-2 as written and fails the moment a fifth mutating test is
  added under any other name. Requiring the declaration to be the selector closes
  that.

  SCOPE NOTE: what form the declaration takes is not specified here and is an
  it-po decision. The criteria constrain only that some per-test declaration exists,
  that it is what selects the path, and that its absence is safe and loud.
