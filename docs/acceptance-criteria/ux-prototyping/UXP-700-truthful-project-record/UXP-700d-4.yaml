test_required: true
test_rationale: |
  This is the check that would have caught the current state, where 10 of 10 screens are
  example content and a reader looking at a populated mockups/ directory concludes the product
  is documented. The both-zero clause needs its own assertion because the obvious implementation
  divides by the total and produces a misleading example-only verdict, or an error, on an empty
  store - which would make this check the source of a fresh vacuous pass.
test_spec:
  - name: test_type_with_only_example_artifacts_is_reported_by_name
    target_dir: unit_tests/product_truth/
    description: "A store whose screens are all example content reports screens as example-only."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_per_type_project_and_example_counts_are_both_stated
    target_dir: unit_tests/product_truth/
    description: "The report carries two counts per artifact type and they sum to that type's population."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_type_with_no_artifacts_at_all_is_reported_empty_not_example_only
    target_dir: unit_tests/product_truth/
    description: "A type with zero project and zero example artifacts is reported as empty."
    type: unit
    angle: boundary
    framework: unittest
notes: |
  VERIFIED 2026-09-07: all 10 mockups in the store are fern-and-fig, and fern-and-fig is the
  only directory under mockups/. There are zero mockups of the real product. As the L1 puts it,
  for that artifact type the demo is not a corner of the record - it IS the record.

  This AC does NOT require anyone to author real mockups. It requires the state to be visible.
  Whether to author them is a product decision the report should provoke, not one this record
  makes.
