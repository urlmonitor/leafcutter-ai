title: "Every craft the run dispatches is checked, not only the one that writes code"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run that dispatches, in sequence, a craft that writes tests, a craft that writes
    code, and a craft that reads the change for defects, and each of the three has its own
    instructions requiring it to invoke at least one named capability,
  When the run prepares each of those three dispatches,
  Then a fit comparison is performed for every one of the three, not only for the craft
    that writes code,
    And a capability out of reach of the craft that reads the change is held back and named
      in the same way as one out of reach of the craft that writes code,
    And adding a further craft to the run brings that craft's own required capabilities into
      the same comparison without the comparison being restated for it,
  So the guarantee does not depend on which craft happened to be observed failing.
