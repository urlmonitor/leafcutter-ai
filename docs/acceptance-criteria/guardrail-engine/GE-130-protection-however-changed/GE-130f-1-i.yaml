notes: |
  WHY A SEPARATE RECORD. The documentation guard's defect is exactly this shape: it blocks in a
  form Claude Code does not act on. An observation that reads the guard's own "blocked" text, or
  any non-zero ending, records "observed" for the unrepaired guard and still passes GE-130f-1
  once the guard is repaired. Named mutation that turns ONLY this record red: decide the
  liveness record from the guard's message or ending status instead of from whether the edit
  landed.

  declares_side_effect: false.
  IT-PO ENRICHMENT (2026-09-25).

  THE RULE IS ENFORCED BY A SIGNATURE, NOT BY A CONVENTION. currently.state is produced by a
  function whose only arguments are the target path's before and after digests. Exit status and
  stderr are attached to currently.evidence after the fact. This is the mechanical form of the
  BA's "in neither run is the record decided from the message or from how it ended alone" - a
  reviewer-enforced version of that clause would not survive the next author, who will reach for
  the exit status because it is right there.

  THE SECOND VARIABLE, REMOVED. The two runs must differ in the ending and in nothing else, so
  the message bytes are asserted equal across them. Otherwise a repair that also reworded the
  message reads as evidence that the ending mattered.

  WHERE THE HOST CONTRACT LIVES. One decision interpreter in the harness, sourced from Claude
  Code's own hooks reference with the fetch date recorded, exercised by its own conformance
  case. docs/reference/claude-code-hooks.md cannot be that source until GE-130f-4 lands: its
  stdout table and its escape-hatch table disagree, and two shipped guards follow the table the
  general rule contradicts.
