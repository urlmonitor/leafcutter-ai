it_requirements: |
  ADR-018 Decision §4 (local) + Migration §4: retire the shared-local-main pattern;
  a clone's main is read-only. Historically scaffold commits landed straight on the
  one shared local main and clobbered it. IT-PO: this spans the drive step scripts
  and the worktree/clone-agent; the local pre-commit main-guard (advisory) is the
  edge-case enforcement in BO-1800e-1-i.
