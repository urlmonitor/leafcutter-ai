  - reason: "IT PO technical enrichment, 2026-08-26. Recorded that the resilience half of this AC is already satisfied by the existing continue-on-JSONDecodeError path, so the real work is the reporting half — line numbers, a fifth counter, and an outcome that distinguishes a whole read from a truncated one, none of which exists. Added the JSON-scalar case: json.loads accepts a bare string or number and the subsequent .get() raises AttributeError outside the caught exception type, so a line that is valid JSON but not an object still aborts the run today. Forbade a new exit code, since 0/1/2/3/4 are allocated and a corrupt input line is a data condition."
