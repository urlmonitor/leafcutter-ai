roadmap_phase: phase_1
criteria: |
  Given entry F1 was already resolved with a back-reference to ACD-1600a in run A,
  When the router is run again (run B) over the same corpus,
  Then F1 is skipped and no second artifact is produced for it,
  And F1's existing resolved_at and resolution_note are not overwritten or
    duplicated,
  And running the router any number of additional times over an unchanged corpus
    produces no new artifacts and no changes to already-resolved entries,
  And this holds even if resolve_feedback.py is invoked again for F1 (the writer
    is idempotent and the second call is a no-op).
