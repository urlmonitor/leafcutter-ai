criteria: |
  Given a changelog entry was emitted for AC BO-200a-1 (level: L2)
    and BO-200a-1.yaml has depends_on containing BO-200a
    and BO-200a.yaml (level: L1) has title: "Atomic commit for multi-file deliveries"
      and depends_on containing BO-200
    and BO-200.yaml (level: L0) has title: "Every delivery is all-or-nothing",
  When the changelog entry is rendered for display,
  Then the entry contains:
    - goal: "Every delivery is all-or-nothing" (from the L0)
    - feature: "Atomic commit for multi-file deliveries" (from the L1)
    - entry_title: (from the L2's own title)
  And the goal and feature fields are populated by traversing the depends_on
    chain upward through the AC YAML files until reaching L0.
