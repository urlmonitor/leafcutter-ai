criteria: |
  Given compiled workflow files exist at .claude/workflows/
  When the output-drift detection hook runs during a pre-commit check
  Then it scans .claude/workflows/ (not .agents/workflows/) for content changes
  And if a compiled workflow file has been manually edited (content differs from
    the source template fingerprint), the hook reports drift for that file
  And if all compiled workflow files match their source fingerprints, the hook
    passes with no drift warnings for the workflows category
