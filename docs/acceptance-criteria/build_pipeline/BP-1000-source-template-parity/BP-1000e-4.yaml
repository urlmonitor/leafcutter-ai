created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000e.yaml"
criteria: |
  Given a workflow source script exists with no mirror counterpart, or a workflow
    script exists only on one side of the templates/workflows-js/ <-> scripts/workflows/
    mirror relationship
  When the workflow-script parity check enumerates the pairs to compare
  Then a workflow script with no mirror counterpart on the other side is excluded
    from the comparison and never causes a false failure on its own
  And the verdict depends solely on the set of scripts present as a name-matched
    pair on both sides
  And the set of compared pairs is derived from which scripts actually exist on
    both sides, not from a hardcoded list
