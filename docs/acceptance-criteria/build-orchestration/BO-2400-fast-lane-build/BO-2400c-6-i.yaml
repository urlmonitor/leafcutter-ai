notes: |
  The third scenario is unusual — a criterion about how a test must be built rather
  than about product behaviour — and it is deliberate. The defect this guard exists to
  catch is invisible on the live store, so "we added a cycle test" is a claim that can
  be satisfied by a test that exercises nothing. Writing the fixture requirement into
  the criterion is the only way the requirement survives into review.
