  - "Must define buildable = a declared-files list naming at least one file (AC field declared_files, ACD-1600c-4) + a test contract (test_spec or test_required: false); state that 'missing file targets' is raised for the 'no declared files' state and is not satisfied by paths in it_requirements or doc_links; and that an AC missing either is held back for enrichment rather than dispatched once the gate is required. Must state the migration posture: while advisory, and for schema_version < 2 records, the reasons are reported but not held (ADR-026 rules 3-4). Links to the declared_files section written by ACD-1600c-5 rather than re-describing the field."
  - "Must clearly distinguish this enrichment-completeness gate from the approval-readiness gate (draft -> reviewed -> approved) described in ac-schema.md."
  - "Must list all five hold reasons and, for each, the check that raises it (readiness gate: missing file targets, missing test contract, test design pending; approval step: test design pending, reference file pending, file finding undecided) — matching the single list ACD-2500b-2 writes into docs/reference/ac-schema.md; must link to that list rather than define a divergent one."
