notes: |
  KI-FC-003 fix direction: the general defect is two lists (agent definitions and the
  feedback allowlist) that must agree with nothing checking that they do. Five agents were
  each added by hand after the same silent rejection (user-surface-smoker, frontend-coder,
  llm-expert, documentation-verifier, then ac-validator + ac-fulfillment-gate).
  The concrete fixture is live, not hypothetical: measured 2026-10-21 in this worktree,
  restructuring-specialist and change-scope-reviewer both carry signoff: true and appear in
  no allowed_writers list, so the check as specified would fail today's build. That is the
  class the KI warned about ("fix the instances you caught, miss the class"); INF-100c-5-iv
  registers them so the shipped build passes.
  The signoff flag lives in each agent definition's frontmatter, not in the agent registry
  file (the KI's wording); the registry carries zero "signoff": true entries.
