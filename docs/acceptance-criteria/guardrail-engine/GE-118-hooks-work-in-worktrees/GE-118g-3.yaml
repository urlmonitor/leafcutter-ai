id: GE-118g-3
title: "Where no repository can be established, each numbering tool says which situation it is in instead of answering about the directory it was started in"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a directory that is not inside any git work tree and has no git work tree
    beneath it, which contains a decision record claiming the number 68 and
    nothing else,
  When the author runs the collision pre-flight with that directory as the
    working directory and no argument naming a repository,
  Then it does not complete successfully, and what it reports states that no
    repository could be established and names the directory it was asked from,
  And it does not report a verdict about the number 68.

  And when the author runs the unclaimed-number audit from that same directory
    with no argument naming a scan root,
  Then it does not complete successfully, and what it reports states that no
    repository could be established and names the directory it was asked from,
  And it reports no claimed set and no unclaimed set — in particular it does not
    report 68 as claimed on the strength of the record sitting in that
    directory.

  And given a path that is named explicitly as the repository and that is not a
    git work tree,
  When either tool is run with that path named,
  Then it does not complete successfully and what it reports names that path and
    states that it is not a repository — it does not substitute the working
    directory, and it does not substitute the tree the program's own files live
    in.

  And given the same explicitly-named path, now a genuine checkout of this
    repository, run with a working directory that is a different checkout of the
    same repository,
  When either tool is run,
  Then the answer it reports is about the explicitly-named checkout — so an
    explicit instruction is honoured over the working directory rather than
    merged with it.
