id: GE-108e
components:
  - commit_guardian
title: "The exception hook finds ruff the same way the rest of the project does, so an installed ruff is never reported as missing"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  GE-108d made the PostToolUse hook's refusals readable by routing them to
  stderr. It did not change which refusals happen. The remaining half of
  KI-CG-20260914 is that the hook asks the operating system for a `ruff`
  executable, while the project's own lint step and every other caller reach
  ruff as a Python module (`python -m ruff`). On a machine where ruff is
  installed but exposes no console script on PATH — the configuration the
  known issue was first reported from — the hook takes its not-installed
  branch and blocks every Python write, while `python -m ruff --version`
  answers perfectly well two lines away.

  "Is ruff installed" must get the same answer here as it gets everywhere
  else in the project.

  Scenario: An importable ruff with no console script is found and used
    Given ruff is importable as a module,
    And no `ruff` executable is resolvable on PATH,
    When the hook runs over a Python file containing a bare `except:`,
    Then the hook finds ruff, analyses the file, and refuses with the E722
      violation,
    And it does NOT emit the not-installed message,
    Because the file genuinely has a violation and the tool to see it was
      available the whole time.

  Scenario: A clean file is still allowed through that path
    Given the same environment — ruff importable, nothing on PATH,
    When the hook runs over a clean Python file,
    Then it exits 0 and writes nothing to either stream,
    Because finding ruff by a different route must not change what a clean
      file does.

  Scenario: A genuinely absent ruff still reports itself as absent
    Given ruff is neither importable as a module nor resolvable on PATH,
    When the hook runs over any Python file,
    Then it still exits 2 and still emits the install instruction on stderr,
    Because the not-installed branch is correct behaviour when ruff really is
      not installed, and GE-108d's routing of that message must survive.
