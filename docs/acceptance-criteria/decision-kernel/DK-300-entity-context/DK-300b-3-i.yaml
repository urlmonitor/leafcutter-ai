id: DK-300b-3-i
title: "An expired recognition deadline exposes incomplete scanning"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given recognition reaches its two-second default deadline before completing a scan or lookup,
  When the next unit of recognition work would start,
  Then no further candidate lookup starts,
  And the result reports partial coverage and the exhausted deadline,
  And scan completeness is distinguished from candidates omitted after a complete scan,
  And intent retains the entire original goal rather than treating a scanned prefix as the full request.
