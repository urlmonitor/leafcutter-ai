it_requirements:
  - >-
    DO NOT CONVERT ANY FILE BETWEEN SELF-TARGETING AND DIRECTED. The ticket that
    produced this work assumed these files had the defect a prior change fixed
    elsewhere. They do not. Twelve are already directed or correctly self-hosting, and
    the thirteenth self-targets on purpose. A conversion here changes which code path
    is exercised and silently stops testing the criterion the file names.
  - >-
    DO NOT ROUTE THESE FILES ONTO THE SHARED REFERENCE LAYOUT. None of the thirteen
    references either marker or requests the shared fixture, and most are structurally
    incompatible with its reader/mutator model: they build fresh adopter projects from
    an empty directory, or alter package source before building. The fix is a private,
    per-file produce-once-then-copy pattern, not a migration.
  - >-
    THE SHARED PREPARATION IS HANDED OUT AS A COPY WHENEVER THE CONSUMER WRITES. A
    group member that only reads may use the artifact in place. Any member that
    alters it gets its own copy first. See TQ-600a-9-i, which is where this is proved.
  - >-
    COUNT THE SUBPROCESSES, DO NOT TRUST THE ESTIMATE. The 497 s adopter-family figure
    rests on a prior analysis's call-site count whose premise was verified but whose
    arithmetic was not re-derived. Instrument the run to count real build subprocesses
    before and after and report the measured difference.
  - >-
    EVERY TIMING CLAIM IS A RATIO TAKEN IN ONE SITTING. This workspace is a shared host
    under variable agent load. An absolute second count will be flaky and will be
    disabled by the next person who sees it fail.
  - >-
    TWO FILES ARE DELIBERATELY OUT OF SCOPE AND MUST NOT BE QUIETLY INCLUDED. The
    authored-test-spec file already memoises per input and is cited as exemplary; the
    fifth consumer-install file has no identical-setup pair. A change to either is
    scope creep against a file the evidence says is already minimal.
  - >-
    THE COUNTER THIS RECORD KEEPS DEMANDING DOES NOT REACH THESE FILES YET, AND
    BUILDING IT IS PART OF THIS CHANGE. The package already owns exactly one real
    build-subprocess counter: `emit_execution_signal` in
    scripts/suite_performance/_shared_layout_coordination.py line 100, which appends one
    `{"event": "deploy_executed", ...}` JSONL line per executed deploy and is a no-op
    unless LEAFCUTTER_SHARED_LAYOUT_EXECUTION_LOG names a file. It is called from
    exactly two places — _shared_layout_producer.py lines 187 and 200, and
    pytest_shared_reference_layout.py lines 276 and 290 — and NONE of the thirteen files
    in scope routes through either. Each runs its own builder: `run_build()` at
    unit_tests/portability/_bp1500g1_harness.py line 97 (shared by the six adopter
    files), five inline subprocess.run sites in test_inf_400c_4_i.py (lines 183, 226,
    271, 659, 667), `_run_build()` at test_build_leaves_tracked_files_clean.py line 29,
    `_run_build()` at test_acd_2100d_2_i.py line 115, and `_run_build_in_copy()` at
    test_bp_900g_8_ii.py line 234. Add the existing `emit_execution_signal` call to
    those builders. Do NOT write a second counter, and do NOT count by patching
    subprocess.run — a mocked build is not a build, and every count assertion in this
    record is about builds that really ran.
  - >-
    COUNT IN ONE PROCESS, AND REGENERATE THE DURATIONS FILE. Two facts constrain every
    count and every ratio here. First, produce-once-then-copy is scoped to one operating
    system process, while CI runs `python -m pytest tests/ unit_tests/ -q --splits 8
    --group N --durations-path .github/test_durations.json` (.github/workflows/ci.yml
    lines 405-410) and pytest-split's durations file is keyed per TEST ID, not per file —
    verified: test_bp_1500g_2_i.py holds nine separate entries. A shard boundary falling
    inside a sharing group silently restores one build per fragment, so a count taken
    under --splits is not reproducible. Take every count from a single child session with
    no --splits, using the existing `run_child_session()` helper at
    unit_tests/suite_performance/_test_helpers_tq_600a_5.py line 44. Second, after this
    change one member of each group carries the whole build cost and its siblings carry
    almost none, which is precisely the imbalance .github/test_durations.json exists to
    prevent — regenerate it in the same change, or the shard matrix degrades on the
    change that was meant to speed it up.
  - >-
    THE VERIFICATION MUST NOT COST MORE THAN THE SAVING, AND THE OBVIOUS GATE IS BROKEN.
    The descriptors below re-run whole subject files repeatedly: four runs of the
    collision file for the discrimination check, and a before-and-after across eight
    files that together hold roughly 54 builds. At the measured 13.3 s directed and 43 s
    self-targeting rates that is comfortably more per run than this record saves. The
    reflex is to suffix them `_MANUAL` — and TQ-600a-13 has just established that the
    suffix has ZERO enforcement in this repository: no registered marker, no -k/-m/
    --deselect in pytest.ini or ci.yml, and a `_MANUAL` test timed at 13.8 s in the
    durations record. So these tests must be placed behind a gate whose effect is shown
    by performing a collection and observing them absent, never behind a naming
    convention. See this record's expects_from.
