it_requirements:
  - >-
    NO FALLBACK AFTER A REFUSAL: once the door refuses, a flow stops clearing. It does not retry with a
    discard token, a forced or by-location request or --delete-remote-branch, and it does not delete the
    folder directly, run git worktree remove or send another agent. The door's refusal object appears
    unchanged in the flow's final result, and the workspace is reported kept. The one relay lives in the
    shared helper of templates/workflows-js/_shared/workspace-answer.js.
  - >-
    DERIVED SET: the flows, skills, commands and agent instructions checked are derived from what the install
    deploys (the deployed layout), never from a hand-written list, and no surface is exempted by name.
    Workflows are run under the engine harness. Prose surfaces are exercised by executing the clearing
    command they publish, the pattern BO-4400a-3 uses.
  - >-
    RECORDER DOOR: the door is replaced by a recorder that logs each request and can be told to refuse. It
    covers every maker verb that clears (remove, and the per-work clear-landed of BO-4400g-2 that flows send).
    A workspace that disappears without a recorded request for it fails the check, naming the surface and the
    step.
  - >-
    BUILDS ON, DOES NOT DUPLICATE: BO-4300g-2-i checks that every removal-capable dispatch carries an
    authorization, and BO-4400a-3 checks that the hand-run surfaces publish only the door's command. This
    record adds only the outcome checks: nothing vanishes without a recorded door request, and refusals are
    never worked around. It extends the same harness (recorded dispatch payloads) and the same deployed-set
    derivation instead of forking them.
  - >-
    THE CHECK PROVES IT CAN FAIL: a fixture flow that deletes its folder directly, and one that retries with a
    discard token after a refusal, are each reported. The real flows are not.
  - >-
    The check reads the deployed layout as a shared_layout_reader (the shared reference layout), spawns no
    build.py and makes no live model call, so it runs in CI.
test_required: true
test_intent:
  - clause: 'every flow''s workspace folder still exists, with its files identical to their state when the clearing request was made'
    needs_test: true
    reason: A flow that falls back to its own deletion after a refusal removes the folder, which only the disk shows.
  - clause: 'every flow''s final result contains the door''s refusal unchanged and reports the workspace as kept'
    needs_test: true
    reason: A refusal that is paraphrased or reported as success hides the unsent work from the person.
  - clause: no flow retried the clearing with a discard token or by any other route
    needs_test: true
    reason: A token retry turns a safe refusal into a loss of work, and the recorder shows every request made.
  - clause: every workspace that disappears during the run disappears only after a recorded clearing request for it
    needs_test: true
    reason: This is the falsifiable form of "no flow carries its own deletion logic", across every deployed surface.
delivers_to: null
expects_from:
  ac_id: BO-4400g-4
  contract: >-
    Every flow builds its name-based clearing request through the one shared helper and relays the door's
    answer verbatim in its final result.
