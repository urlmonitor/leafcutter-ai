id: BO-2000g-3
components:
  - build_orchestration
  - commit_guardian
title: "A template lint fails on any comment example whose first body line is not an approved feedback-id line"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000g.yaml
criteria: |
  Given the package's agent templates and skills (every file in the agent-template tree
    and the skill tree, at any depth),
  When the template lint runs as part of the project's automated checks,
  Then it examines every Comments-heading example in those files. A Comments-heading
    example is a line that begins, after any indentation and inside or outside a fenced
    block, with `### `, then a date slot and a time slot, then ` — ` (em-dash), then an
    agent name and a `(status: ...)` tag. The date and time slots may be digits
    (`2026-05-08 14:30`), the `YYYY-MM-DD HH:MM` placeholder, or angle-bracket
    placeholders (`<today> <time>`),
  And it passes an example only when the line directly under the heading is a
    `feedback-id:` line whose value is one of:
      - a concrete feedback id: `fb_`, a date, `_` and eight lowercase hex characters
        (`fb_2026-05-08_aa112233`);
      - a real-id placeholder spelling that the signoff skill documents;
      - the failure fallback exactly as the signoff skill documents it (today
        `(submit-failed)`);
      - `(not-a-signoff)`,
  And it fails on any other example, including one whose feedback-id value is empty,
    `TBD` or `none`, and it names the file, the line number of the heading, and the
    text it found on the first body line,
  And, run against the templates as they stand before BO-2000g-1 and BO-2000g-2, it
    fails and names at least the python-coder red-baseline example, the test-writer
    skip entry, the commit audit entry and the signoff skill's failed-path pr-reviewer
    entry.

  Given a synthetic skill file is placed in the skill tree, containing one example
    `### 2026-05-08 15:12 — python-coder (status: ok)` followed directly by
    `Implemented the parser. Tests green.`,
  When the lint runs,
  Then it fails and names that file and that heading's line number,
  And when the line `feedback-id: (not-a-signoff)` is inserted directly under the same
    heading, the lint passes that file.

  Given the templates and skills after BO-2000g-1 and BO-2000g-2 have landed,
  When the lint runs,
  Then it passes,
  And no template that already opened its examples with `fb_<date>_<short-hash>` or
    `<fb_id>` fails unless that template is rewritten to a documented spelling in the
    same change.
depends_on:
  - BO-2000g
  - BO-2000g-1
  - BO-2000g-2
