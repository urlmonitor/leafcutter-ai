id: DK-200b-4-i
title: "A request with no room for context remains valid without a context marker"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a valid judgment request has insufficient space even for a context truncation marker,
  When the kernel prepares that judgment,
  Then the base request is sent without added context or an oversized marker,
  And omission is reported,
  And the saved context remains unchanged.
depends_on: [DK-200b-4]
covered_by:
  - "tests/kernel/enrichment/test_projection.py::TestContextProjection::test_no_room_omits_context_without_altering_or_oversizing_the_request"
implemented_by:
  - "kernel/enrichment_projection.py"
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "When the base request leaves no room even for a minimal context marker, the provider request must remain exactly the base request."
  - "Context omission must emit an observable warning without enlarging the payload or changing the saved context."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_no_room_omits_context_without_altering_or_oversizing_the_request
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: unit
    angle: boundary
    description: "At a budget equal to the serialized base request, projection returns the unchanged base and snapshot and reports context omission."
test_rationale: "A zero-headroom case proves the marker itself cannot cause an oversized request; warning observation distinguishes honest omission from silent loss."
