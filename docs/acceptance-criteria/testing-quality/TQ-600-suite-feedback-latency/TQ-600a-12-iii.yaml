id: TQ-600a-12-iii
components:
  - testing_quality
  - build_pipeline
title: "A deploy-count test handed a pre-warmed layout is caught, not quietly green"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given one of the deploy-count tests of TQ-600a-12-ii and a layout that already
    exists, so the number of deploy signals that test would observe is zero,
  And the specific hazard this record exists for, which is that such a test does not
    merely fail — the one asserting "a worker with no scheduled consumer produces
    nothing" PASSES on zero deploys while having tested nothing at all,
  When that test is deliberately run against the pre-warmed layout, bypassing the
    ineligibility list,
  Then the run exits non-zero and names that test,
  And the diagnosis distinguishes the two cases rather than conflating them: a
    deploy count of zero observed where the test's subject is the deploy count is
    reported as a test that was handed a pre-warmed layout, not merely as an
    assertion that did not hold,
  And the case in which the vacuous outcome is a PASS is covered as well as the case
    in which it is a failure, since a detector that only inspects failing tests
    cannot see the pass,
  And the same test run without the pre-warmed layout passes, so the non-zero
    outcome is attributable to the seeding rather than to the bypass or to the
    harness,
  And this demonstration lives in the suite, so a later change that leaves the
    ineligibility list in place but inert turns a test red instead of leaving a
    report clean.
