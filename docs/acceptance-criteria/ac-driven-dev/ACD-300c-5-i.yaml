readiness: reviewed
priority: medium
title: "No /plan-feature message says \"Why why\""
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the three /plan-feature messages that today read "Why why" (a doubled word),
  When each of those messages is produced,
  Then it reads "Why" once, with the rest of the message unchanged character for character,
  And no message the workflow can produce contains the words "Why why" in any letter case,
  And the test that asserts one of these messages expects the corrected text, so the test
    and the workflow agree on the same single "Why".
depends_on:
  - ACD-300c-5
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-300c-5.yaml
    relationship: parent
    status: exists
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
- 'Word-only edits: no line is added or removed in templates/workflows-js/plan-feature.js. As found by
  the test designer, every ''Why why'' there is a code comment pointing to the rationale docs (about 13
  sites: ~L1660, 1694, 1721, 1734, 1806, 2299, 2344, 2365, 2370, 2401, 2581, 3079, 3189), not a producible
  message; all of them are corrected.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- 'unit_tests/test_final_gate_and_commit_message.py needs no change: it holds no ''Why why'' expectation.
  It stays declared only until the BA corrects the criteria (the messages and the test clause rest on
  a wrong premise); it then leaves declared_files, and test_intent is re-recorded against the corrected
  clauses.'
declared_files:
- path: templates/workflows-js/plan-feature.js
  state: existing
- path: unit_tests/test_final_gate_and_commit_message.py
  state: existing
delivers_to: null
expects_from: null
test_intent:
- clause: it reads "Why" once, with the rest of the message unchanged character for character
  needs_test: true
  reason: Each corrected message must read the same apart from the single word.
- clause: no message the workflow can produce contains the words "Why why" in any letter case
  needs_test: true
  reason: A case-insensitive sweep over the producible messages stops the typo coming back.
- clause: the test that asserts one of these messages expects the corrected text, so the test and the
    workflow agree on the same single "Why"
  needs_test: false
  reason: This clause is about the existing test's own expectation, which the corrected test satisfies
    by being edited.
test_spec:
- name: test_rationale_pointers_read_why_once
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Reads plan-feature.js: for each rationale pointer that read Why why (including those at
    about L1660, L1694 and L1721), the line now reads // Why followed by the same rest of the text, character
    for character.'
  proves_clause: it reads "Why" once, with the rest of the message unchanged character for character
  code_file: templates/workflows-js/plan-feature.js
- name: test_no_producible_text_says_why_why
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: reachability
  description: Runs plan-feature.js under run_workflow_under_e2 to the final gate and through a cancel;
    no returned message, agent prompt or logged line matches why why in any letter case.
  proves_clause: no message the workflow can produce contains the words "Why why" in any letter case
  code_file: templates/workflows-js/plan-feature.js
- name: test_workflow_source_has_no_why_why
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: A case-insensitive scan of the whole plan-feature.js source finds no why why.
  proves_clause: no message the workflow can produce contains the words "Why why" in any letter case
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - only the three named lines are fixed while the other Why why lines stay
  - the check is case-sensitive, so a WHY why or why Why survives
