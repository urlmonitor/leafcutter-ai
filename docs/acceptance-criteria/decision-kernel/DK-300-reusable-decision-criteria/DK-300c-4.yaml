criteria: |
  Given the approval, staging, publish and curation behaviours DK-300c-1 to DK-300c-3,
  When a reader opens the category state diagram,
  Then it shows the states candidate, staged, published and retired, and the exit of a rejected candidate,
  And each transition names who makes it: the mining or a person proposes, only a person approves, publishes, merges, splits or retires,
  And it shows that editing a published category goes back through staged and published and keeps the category's id,
  And it shows that a retired category points to its replacement.
