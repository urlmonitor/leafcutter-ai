assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Detect new pages strictly by the set-difference of page paths present-now minus present-before (staged page paths not in the previous commit). A pure deletion produces no added page path, so the added set is empty and the hook must allow the commit and demand no doc."
  - "A rename surfaces in the set-difference as a new destination page path (the destination did not exist before) and a removed source path; treat the DESTINATION as a newly-added page and run the standard derive-and-check against the destination route's derived doc path. The source path's deletion imposes no doc requirement."
  - "Do not rely on git rename-detection heuristics (similarity scoring) for correctness; the set-difference of page paths is sufficient and deterministic regardless of whether git classifies the change as a rename or as add+delete."
  - "When the destination page's derived doc is present (staged or on disk) the commit proceeds; when absent, the hook blocks in block mode (warns in warn-only mode) and the FIX message names the destination route's derived doc path."
  - "Must not raise or block on the absence of a source-page doc; only destination/added pages are gated."
delivers_to: null
