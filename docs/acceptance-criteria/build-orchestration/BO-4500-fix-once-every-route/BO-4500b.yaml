risk_surface: safety
criteria: |
  Write shared route logic once -- every route gets the same copy, and drift is caught.

  When several routes need the same piece of logic, it is written in one place and every
  route that uses it receives exactly that text. A fix to it reaches every route the next
  time the package is installed, no route can quietly keep an older or edited copy, and the
  first such piece is the one that decides what a route does with the answer it gets back
  after asking for its work to be saved.
