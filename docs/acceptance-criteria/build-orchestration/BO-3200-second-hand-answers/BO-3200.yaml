readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Facts are read at the source, actions are performed, decisions come from you.

  A build constantly needs three different things: to know a fact about your
  project, to make something happen, and occasionally to get a decision from you.
  Today all three are sometimes obtained by asking a specialist — and a
  specialist can paraphrase, truncate, hand back a pointer instead of an answer,
  or decline the job entirely. Any of those replies can be read as a confident
  answer, and builds have halted, discarded finished work, and left work stranded
  because of it.

  This goal draws the line. Judgement is the only thing worth asking a specialist
  for. Facts are looked up where they live, required actions are carried out
  directly, and a decision that belongs to you is put in front of you. Nothing
  the build depends on arrives second-hand.
