title: "The check runs at commit time as a pre-commit hook"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the project has the fixture-coherence check installed
    (registered in commit_guardian.json under a "check_fixture_coherence" key),
  When a developer stages a change to config/ac_store_schema.json
    that adds a new entry to the "required" array,
  And the developer runs git commit,
  Then the pre-commit hook system invokes the fixture-coherence check
    before the commit is created,
  And if the check finds stale fixtures, the commit is blocked
    with the violation report visible to the developer,
  And if no fixture violations exist, the hook passes silently (exit 0).

  Given a commit does NOT modify any JSON Schema file,
  When the developer runs git commit,
  Then the fixture-coherence hook exits 0 immediately
    without scanning any fixture files (fast path for non-schema changes).
