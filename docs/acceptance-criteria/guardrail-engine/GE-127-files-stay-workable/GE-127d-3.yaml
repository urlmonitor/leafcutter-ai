notes: |
  ROOT CAUSE, READ FROM SOURCE ON 2026-09-30. count_content_lines() stripped
  triple-quoted strings and block comments with three module-level regexes
  (_TRIPLE_DOUBLE_QUOTE_RE, _TRIPLE_SINGLE_QUOTE_RE, _BLOCK_COMMENT_RE),
  each applied via re.sub("", content) against the file's whole raw text, with
  no notion of a string literal. A "/*" occurring inside an ordinary
  single/double/backtick-quoted string opens a PHANTOM block-comment span
  under _BLOCK_COMMENT_RE that runs, non-greedily, to the NEXT "*/" anywhere
  later in the file — real or itself inside another string — discarding every
  line in between, including executable code, from the quoted length. The
  same hazard applies symmetrically to a stray triple-quote sequence inside a
  string, against the two triple-quote regexes. Because the size gate this
  measurement backs (GE-127a-1's threshold, GE-127b-1's ratchet) reads the
  quoted length as ground truth, this is a way to defeat the gate with no
  intent at all — a completely innocent string containing "/*" can make a
  file that grew substantially report as unchanged or even shrunk.

  THE OBSERVED INSTANCE, AND WHAT IS AND IS NOT TRUE OF IT TODAY.
  templates/workflows-js/fast-lane-ship.js line 1572 contains
  `...to confirm an added changelogs/*.md file is actually present...` inside
  a template literal built from `+`-joined backtick strings. Direct
  measurement in this worktree at authoring time found NO further `*/`
  sequence anywhere after that line in the file's current content, so under
  the pre-fix regex this particular occurrence does not currently have a
  bounded phantom span to swallow — it simply fails to match at all beyond
  that point (a non-greedy DOTALL match with no closing delimiter to find
  matches nothing). This record does NOT claim a specific line range is being
  swallowed in the file's CURRENT content; it claims, and the test suite
  proves, that the MECHANISM is real and general, that it does fire on other
  real content (see the blast-radius figures below), and that it can start
  firing on this exact file the moment any real block comment is added or
  reordered anywhere below line 1572 — which is precisely the kind of failure
  mode that must not depend on today's incidental file layout.

  BLAST RADIUS, MEASURED AT AUTHORING TIME (feature/ratchet-string-literal,
  tracked files only, templates/scripts/commit_guardian/_file_size_ratchet.py's
  OLD three-regex implementation versus the NEW scanner in this same commit,
  over every tracked .py/.js/.sql/.ts/.tsx/.sh file, 1568 files inspected).
  Full per-file results are reported in this record's implementing agent's
  own completion report rather than duplicated here in full, because the
  exact counts are a measurement over a moving tree and belong with the
  change that measured them; the qualitative and quantitative summary is
  recorded here because it is decision-relevant. FIRST PASS (string
  -literal-awareness only): 51 files changed count, several by triple-digit
  line counts in the WRONG direction (the scanner itself was found to have a
  second, symmetric defect — see LINE-COMMENT DEFECT below — before this
  fix could land). FINAL, LANDED MEASUREMENT (after also fixing the
  line-comment hazard): 24 files change count, ALL increases (the fix
  correctly stops under-counting; no file's count decreases as an
  unintended side effect, with one explained exception below), the largest
  a +425 delta on templates/workflows-js/finalize-feature.js (1802 -> 2227)
  and a +187 delta on templates/scripts/commit_guardian/check_doc_links.py
  (114 -> 301) — both JS/Python files whose real source contains a
  string-embedded or comment-embedded delimiter-lookalike that was
  previously causing a large phantom-discarded span. ZERO files newly cross
  their configured commit_guardian.json line_limits entry in EITHER
  direction — the single most decision-relevant fact for whether this
  lands. ONE file's count DECREASES by a small amount
  (unit_tests/commit_guardian/test_ge_127b_1.py, 414 -> 410): explained, not
  a regression — that file's own source contains the single-quote
  -wrapping-a-triple-quote idiom this fix is about (`'"""'`/`"'''"`, as a
  string-literal-content check inside its own test helper code), and the
  OLD implementation's own phantom-span behaviour on that exact line was
  itself already incorrect in a way that happened to inflate its count
  relative to a correctly string-aware scan; the NEW count is the more
  accurate one.

  LINE-COMMENT DEFECT, FOUND BY THIS SAME BLAST-RADIUS REQUIREMENT BEFORE
  LANDING. A first implementation draft protected only string literals
  ("/*" inside a JS string is never mistaken for a real block-comment
  opener) and left '#' (Python) and '//' (JS) line comments completely
  unprotected — a "/*" inside an ORDINARY COMMENT is exactly as capable of
  opening a phantom block-comment span as one inside a string, and the
  real, tracked instance is templates/scripts/commit_guardian/
  check_structural_change.py line 89's own comment, containing the glob
  pattern "collector/services/*/*.py". Under the string-only-aware draft,
  that file's count fell from a correct-ish 343 to 30 — a phantom span
  swallowing the majority of the file's real, executable content. Fixed in
  the same commit by giving '#'/'//' line comments the identical
  navigate-over-without-discarding treatment already applied to string
  literals. This is recorded here, in the AC's own notes, rather than only
  in the implementation, because it changes what "string literal" in this
  record's own title and criteria must be read to mean in practice: the
  scanner's job is to never let ANY opaque span — a string literal OR a
  line comment — be mistaken for a real discarded region, and an
  implementation that protects only the flavour named in the criteria's
  own Gherkin and not the sibling hazard the same mechanism creates does
  not fully discharge this record's intent.

  WHY THIS IS L2 AND A SIBLING OF GE-127d-2 RATHER THAN A REVISION OF IT.
  GE-127d-2 is about the published rule being TRUE and REPRODUCIBLE — which
  rule is applied and whether an author can arrive at the same number from
  it. This record is about count_content_lines() FAILING TO APPLY the
  already-correct, already-published rule on certain real inputs, which is a
  correctness defect in the implementation rather than a change to what the
  rule says. GE-127d-2's own criteria, its published statement, and its
  reproducibility descriptors are untouched by this fix and remain accurate,
  because describe_measurement_rule() and its probes read
  count_content_lines()'s behaviour empirically and were re-run against the
  corrected function with no change in their own assertions.

  WHY THE FIX IS A SCANNER AND NOT A THIRD REGEX. A regex-only fix (e.g.
  excluding matches that begin inside a quoted span) cannot be expressed
  without tracking scanner state across the match, because "is this position
  inside a string" is not a property of a single delimiter pair in isolation
  — it depends on everything that came before it in the file. The chosen
  fix is a small, single-pass, state-tracking scanner
  (_strip_discarded_regions plus three focused helpers) that stays
  proportionate to a measurement helper: it recognises exactly the five
  delimiter kinds this rule and this repo's two source languages need
  (Python's two triple-quote styles, C-style block comments, and the three
  JS string flavours needed only to correctly navigate OVER, never discard),
  and nothing else — no operator precedence, no nested template-expression
  awareness, no regex-literal detection.

  NOT AUTHORED WITH A FULL BUSINESS-ANALYST / IT-PO ENRICHMENT PASS. This
  record was authored directly by the implementing agent against a
  BrainCandy-directed defect investigation, following the GE-127b-2 precedent
  (a defect discovered outside the normal BA/IT-PO pipeline, authored directly
  with origin_agent BrainCandy once the fix existed) rather than the
  BA-then-IT-PO sequence the rest of this tree's records follow. If a
  BA/IT-PO pass later revisits this record, the it_requirements and test_spec
  above are what they will be reconciling against, not a blank slate.
