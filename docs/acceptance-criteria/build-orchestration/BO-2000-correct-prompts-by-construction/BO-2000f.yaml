criteria: |
  Hardening a phase-agent template actually changes what /build-feature does.

  When a user drives work through /build-feature, each ready ticket's needed phases
  are executed by dispatching each phase as its own phase agent under that phase's
  template -- exactly the flattened script-driver semantics -- instead of handing the
  whole ticket to a single inline supervisor agent that runs every phase itself. This
  holds for both the epic-batch path and the single-ticket path. Because each phase
  runs under its own template, the TDD separation (test-writer produces the failing
  baseline before the coder writes code) and the phantom-test / real-artifact guards
  those templates carry are actually in force on the /build-feature path. A structural
  regression check keeps the flattened driver wired in and blocks any reintroduction
  of whole-ticket inline phase execution. The rewiring preserves the existing
  worktree guard, planner batching, dependency ordering, and failure adjudication.
  This sits at how /build-feature executes a ticket's phases -- distinct from BO-2000c
  (what the dispatch string carries) and BO-2000e (whether a code ticket may reach the
  coder at all).
