work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Tests guard the tools that pick the next ticket to build and scan for leaked
  secrets against regressions.

  The prioritizer that ranks ready tickets — including how it handles parked
  tickets — and the scanner that flags secrets before they are committed are
  covered by tests. If a change causes the prioritizer to surface the wrong
  ticket or the scanner to miss a secret, a test fails instead of the mistake
  reaching a real drive.
