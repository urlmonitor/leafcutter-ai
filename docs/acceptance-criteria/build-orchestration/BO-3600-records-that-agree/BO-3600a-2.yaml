criteria: |
  Given a raised conflict between an open fault entry and a requirement that reads
    finished,
  When the reconciliation reports it,
  Then the report states that the two records make incompatible claims,
    And it does not state which of the two is correct,
    And it does not state which of the two should be changed.

  Given the same raised conflict,
  When the reconciliation has finished,
  Then the fault entry is byte-for-byte as it was before the run,
    And the requirement record is byte-for-byte as it was before the run,
  So detecting a disagreement never changes either account of it.

  Given a raised conflict in which one of the two records carries a much more
    recent timestamp than the other,
  When the reconciliation reports it,
  Then the more recent record is not presented as the correct one,
  So recency is not quietly used as an adjudication rule.

  Given a raised conflict,
  When the report is read,
  Then it carries enough of both records for a person to decide between them — what
    each claims, and where each claim can be found,
  So refusing to adjudicate does not mean refusing to inform.
