  Given the automation gates the merge on the pull request's required checks
  When a reader opens the architecture documentation for the merge gate
  Then a state diagram shows the states a pull request moves through: checks pending, all required checks green, and a required check failed
  And the diagram shows the transition from pending to green and from green to merged
  And the diagram shows that the failed state and the pending state both hold the merge (no transition to merged)
