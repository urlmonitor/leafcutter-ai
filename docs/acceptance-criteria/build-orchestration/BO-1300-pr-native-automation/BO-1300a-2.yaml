created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300a.yaml"
criteria: |
  Given the automation has committed a unit of work onto a non-main working branch and pushed that branch to the remote
  When the pull-request phase of the automation runs for that branch
  Then if no open pull request exists from the working branch into main, the automation opens one targeting main
  And if an open pull request from the working branch into main already exists, the automation updates that same pull request instead of opening a duplicate
  And exactly one open pull request from the working branch into main exists after the phase completes
depends_on: [BO-1300a, BO-1300a-1]
