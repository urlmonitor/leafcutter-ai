id: BP-1100b-1
title: "A ticket touching workflow JavaScript is never classified docs-only"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose files_touched contains a .js file under scripts/workflows/ or
  templates/workflows-js/ (for example scripts/workflows/plan-feature.js), and whose
  test_requirements block is empty,
  When ticket-supervisor decides whether to skip the test-writer phase,
  Then the ticket is not classified as docs-only or config-only,
  And the test-writer phase is dispatched rather than skipped,
  And the empty test_requirements block does not cause the behavioral safety net to
  be removed.
depends_on:
  - BP-1100b
doc_links:
  - path: docs/retrospectives/EPIC-CommitAcOutputPerStage.md
    relationship: describes
    status: exists
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "The docs-only / config-only skip classification must inspect files_touched; if any entry is a .js path under scripts/workflows/ or templates/workflows-js/, the skip is suppressed and test-writer runs."
  - "The classification must depend on the file path/extension, not on whether test_requirements is empty — an empty test_requirements block must not be sufficient grounds to skip test-writer for a workflow .js ticket."
delivers_to:
  agent: test-writer
  contract: "A classification rule that forces test-writer dispatch whenever a workflow .js file is in files_touched"
