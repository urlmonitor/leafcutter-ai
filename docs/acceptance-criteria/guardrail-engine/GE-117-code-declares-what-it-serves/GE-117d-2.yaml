notes: |
  The clean-pass counterpart to GE-117d-1's block. Two proceed cases: all in-scope
  declarations satisfied, and nothing in scope at all (out-of-scope-only diff). The
  second scenario guards against a false-positive block on a commit that only edits
  unchanged/private/legacy surfaces — the diff-only + public-only scope must let it
  through cleanly.
