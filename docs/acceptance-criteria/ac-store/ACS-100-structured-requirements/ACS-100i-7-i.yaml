title: "A record that declares a package surface is refused by the whole-store pass just as it is by a single-file check"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a copy of the acceptance-criteria store into which one record has been
    added carrying `package_surface: true` and implementation requirements
    written as a list of strings,
  When every record in that copy is validated in one pass,
  Then the pass refuses exactly one record, and it is that record,
  And the refusal names it by file path.

  And given the same copy,
  When only that one record is passed to the validator by file path,
  Then it is refused with the same message the whole-store pass produced.

  And given a directory path is passed to the validator instead of a file path,
  When the run completes,
  Then it does not report success for a run in which it examined no records —
    an empty examination is reported as such and is distinguishable from a pass.
