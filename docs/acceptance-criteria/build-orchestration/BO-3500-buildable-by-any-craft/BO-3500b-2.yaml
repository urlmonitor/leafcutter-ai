notes: |
  BO-3500b's notes forbid one solution by name: building the code members and dropping
  the rest. BO-2400f-12 already forbids it on the refusal path — refuse the set whole,
  do not build the remainder. What has no criterion anywhere is the same failure on the
  path this tree opens up: a group that was accepted because every craft was available,
  and then one craft did not deliver.

  WHY THAT IS THE MORE DANGEROUS OF THE TWO. On the refusal path nothing was built, so
  a partial delivery is conspicuous. Here the run has real code, real tests and a real
  pull request in hand, and the only thing missing is the page. Every incentive in the
  implementation points at opening the pull request anyway and mentioning the page in a
  warning. That is a partial delivery reported as a success, and the store afterwards
  cannot distinguish the missing page from a page nobody asked for.

  THE THIRD SCENARIO exists because the first two describe failure and an implementation
  can satisfy both while never failing — by reducing the group as soon as a craft looks
  unlikely to deliver, so the run that runs is a group it can complete. Stated
  positively, the successful ending is only available for the group as resolved.

  THE SECOND SCENARIO protects BO-3500d and the operator equally. "Refused before work"
  and "attempted and failed" have different costs and different remedies, and a run that
  reports them identically makes the coverage figure unable to tell a capability gap
  from a flaky craft.

  TESTABILITY. Execute a run with one craft stubbed to produce nothing, and assert on
  the store, the working tree and the absence of a pull request. Note what must NOT be
  asserted: that the produced artifacts were deleted. This criterion says the run does
  not claim them as the delivery, not that the work is thrown away — an operator
  inspecting the worktree afterwards should still find it.
