notes: |
  Item 3 (KI-CG-20261016-mermaid-parent-link-root-inside-package).
  templates/scripts/commit_guardian/check_mermaid_parent_link.py:49 sets
  REPO_ROOT = Path(__file__).resolve().parents[2]; that is templates/ for the source copy and
  .leafcutter/ for the installed copy (the one .pre-commit-config.yaml runs), so every staged
  path joined to it misses and the hook passes everything. Expected fallout when it starts
  working: docs/architecture/diagrams/c2-001 ... c2-006 declare `parent:
  agent_delivery_workflows.md` (GE-113c-4-i fixes them), and the two c2-fast-* diagrams use
  the same bare-name parent value. The c2-901/c1-901 names are fixtures.
