id: KM-500a-4-viii
title: The deterministic part of S1 runs in the required automated suite with no database and no model provider
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given the scripted-host, scripted-Jev variant of the S1 development cases
  And the real Git projection of S1's pinned revision loaded into the in-process graph backend
  When the required automated test suite runs with no database and no model provider configured
  Then every scripted S1 development case runs through the kernel research run and is labelled scripted
  And the explicit_known_operation, injected_provider_failure, injected_denied and injected_budget_exhausted categories are scored against their frozen thresholds, and any miss fails the suite
  And the categories that depend on model judgment run with scripted judgments to prove the path end to end, and are reported scripted with no quality verdict
  And the evaluation started without authorization returns not_run with no score in the same suite
  And the real-model variant is reported not_run in that suite with its unmet prerequisite, and is never counted, passed or left out of the report
  And no holdout case runs in the suite
  And if the evaluation is changed to call retrieval with an explicit operation for a several_plausible_one_correct case, the suite fails because that case shows 0 Jev selection calls.
