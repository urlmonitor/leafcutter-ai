  - agent: python-coder
    ac_id: BO-2500f-2
    contract: 'A valid check-form record: verified_by.check (source path of the check) and
      verified_by.wired_as (''pre-commit:<hook-id>'' | ''build-phase:<name>'').'
  - agent: python-coder
    ac_id: BO-2500f-3
    contract: 'A valid inspection-form record: verified_by.gate_run (str, the workflow run
      id), verified_by.statement (str), verified_by.inspected [{path: str, blob: 40-hex str}],
      optional verified_by.date.'
  - agent: python-coder
    ac_id: BO-2500f-3-ii
    contract: validate_verification_record(record) and the inspection draft shape; /inspect's
      prepare step calls it to refuse an incomplete draft or a change_target that rules inspection
      out.
expects_from:
