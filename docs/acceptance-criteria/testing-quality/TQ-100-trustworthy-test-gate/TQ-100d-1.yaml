assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "DESIGN DECISION (settled): the allowlist lives in a dedicated YAML config file at config/known_failing_tests.yaml, read by a known_failing_tests module under scripts/ (e.g. scripts/ac_store/ or a sibling). Each entry carries: test id/path, ticket_ref, expiry (ISO date). Entry matching is by exact test id/path."
  - "Only an entry that is present AND unexpired exempts its named failing test; every other failing test is treated normally — the exemption is narrow and per-named-test."
  - "Building this module ALSO resolves one of the missing-module collection errors that TQ-100a addresses (the absent known_failing_tests import) — this AC and TQ-100a are mutually reinforcing; mention the cross-link in implementation."
  - "Config read must follow the project error handling policy (CLAUDE.md Rules 1-4): a malformed/unreadable allowlist file is logged at WARNING and treated fail-safe (no test is exempted on a broken allowlist — the gate stays strict, it does not fail-open into exempting everything)."
  - "If config/known_failing_tests.yaml is consumer-facing, ensure the package ships a source/template copy a fresh install can reach (ADR-001) and that the deployed and template copies stay in parity via build.py."
  - "Exemption decisions must be deterministic under pytest-randomly: the same allowlist + suite yields the same exempted set across seeds/orderings."
delivers_to:
  agent: test-runner
  contract: "A known_failing_tests allowlist at config/known_failing_tests.yaml (each entry: test id/path + ticket_ref + expiry ISO date), read by a known_failing_tests module under scripts/, consulted during the run so a valid, unexpired entry exempts its named failing test from blocking the outcome."
