id: TQ-200d-1-iii
components:
  - testing_quality
title: "A live produced-tests run can keep what the agent produced for each row, so a failed row can be checked against the real output"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a live produced-tests eval run (no --score-gold) with the environment
      variable LEAFCUTTER_EVAL_KEEP_OUTPUTS naming a directory,
  When a row's agent run finishes and the row is scored,
  Then every file the agent produced for that row (its changed files, its
      to-run-later evidence, its report and, when captured, its transcript)
      is kept under <that directory>/<eval set name>/<row id>/ after the run
      ends, whether the row passed or failed,
    And a second run into the same directory replaces that row's kept files
      instead of mixing old and new ones,
    And with the variable unset, or in --score-gold mode, nothing is kept and
      the run behaves exactly as before,
    And the bug symptom ("a failed row's produced files, report and
      transcript are deleted with the run's temporary folder, so the failure
      cannot be checked") does not occur.
