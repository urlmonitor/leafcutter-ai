notes: |
  Retrospective type-specific refinement of KM-400a-3-i. ADR authoring guidance,
  scaffolds and mechanical validation disagree on some required fields; ingestion must
  preserve that source truth instead of repairing historical records. Extension fields
  such as amended, requires_ac and tags are retained when present, not required on every ADR.
  The receipt records source-corpus comparison and mutation evidence. Criterion-specific test links and IT PO review are recorded;
  this reviewed specification does not claim user approval or a new execution result.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Existing source identity and safe source decoding remain compatible with legacy ADRs; guidance disagreements are
  diagnostics, not permission to repair historical frontmatter.
- Derived status-table observations retain their own source attribution and must not be treated as an approved replacement
  for the authored document fields.
