notes: |
  Reconciliation route 2 (CONFIRM the code still satisfies the criterion). OPEN
  QUESTION the PO left for the BA/IT-PO.

  IT-PO RESOLUTION (2026-06-22) of open question #2 — the durable, version-aware
  confirmation record:
    - STORAGE: a structured amended_by entry (schema already permits object items;
      ACS-400b-2 / check_ac_governance permits implementation agents to write
      amended_by, so no write-lock collision). No new top-level field.
    - SHAPE: { reason: 'ge111-confirm', entry: <implemented_by value>,
      source_fingerprint: <sha256 of confirmed source>, confirmed_at: <ISO-8601>,
      confirmed_by: <identity> }. Per-link via the 'entry' key.
    - VERSION-AWARENESS: source_fingerprint = sha256 of the staged source
      (whole-file blob at file tier; symbol source span at symbol tier). Clears
      the block iff stored fingerprint == freshly recomputed fingerprint; a later
      source change makes them differ, so the AC re-flags automatically. Content-
      driven staleness, no TTL. ONE shared fingerprint helper used by both the
      write path and the verify path so they cannot drift.
    - BOUNDARY: a confirmation can clear a symbol-tier moved/renamed drift on a
      SURVIVING file only; it can NEVER clear a file-path-floor 'deleted' verdict.
  This is the field/format choice the BA explicitly deferred to the IT-PO.
