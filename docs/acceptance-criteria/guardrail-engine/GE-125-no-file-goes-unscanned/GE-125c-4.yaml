notes: |
  THIS DISCHARGES GE-125c's documentation_triggers OF [reference-doc]. The other
  three children of this L1 are code criteria, so without this record the trigger
  has no owner. Folding the wording into a code criterion's technical requirements
  is not a discharge: that criterion signs off on a passing test suite, and nothing
  fails if the sentence is never written.

  ONE REWRITE FOR THE WHOLE GOAL — THE L0 SAYS SO EXPLICITLY AND THIS IS WHERE IT
  IS SAID AT L2. All four L1s (GE-125a, GE-125b, GE-125c, GE-125d) carry
  reference-doc, and each independently invalidates the currently written
  description of when this check looks less. They are to be satisfied by a SINGLE
  consolidated rewrite of that material, not by four documents and not by four
  sections that each restate part of it.

  COORDINATION HAZARD, NAMED BECAUSE IT IS LIVE. The sibling L1s are being
  decomposed in parallel, so more than one documentation criterion may exist for
  one rewrite. That is not a duplicate to be deleted and it is not licence to write
  four texts: whichever of them lands first writes the consolidated description,
  and the rest are discharged by pointing at it and adding only the part their own
  L1 changes. If a sibling record has already claimed the same text when this is
  picked up, satisfy this one by review of that text against the three questions
  above rather than by writing a second version. Two homes for one statement drift,
  and the drifted copy is the one someone reads.

  SEQUENCING. This text describes behaviour that GE-125c-1, GE-125c-2 and
  GE-125c-3 introduce. Written before they land it documents an intention, which
  is the failure the third arm forbids. Write it against the shipped result, or
  mark it explicitly as pending and re-check it once those three are done.

  EXAMPLES MUST NOT CONTAIN CREDENTIAL-SHAPED LITERALS. This material is scanned on
  every commit, so a realistic-looking example would either trip the check or need
  a suppression of its own — describe the value shapes in words, as the neighbouring
  documentation criteria in the GE-123 tree do. Nor may an example be written as a
  long line whose interesting part sits past the 120th character: it would be a
  live instance of the defect being documented.
