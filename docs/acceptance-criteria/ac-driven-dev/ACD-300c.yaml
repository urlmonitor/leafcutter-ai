title: "The user confirms each authoring stage before the next agent begins"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: in_progress
criteria: |
  Between each authoring agent's output and the next agent's invocation, the
  workflow presents the produced ACs to the user and waits for explicit
  confirmation. The user can approve (continue to next stage), request edits
  (re-invoke the same agent with feedback), or cancel (abort the pipeline and
  keep any ACs already written as drafts). No downstream agent is invoked
  without prior-stage approval. The final gate additionally allows the user
  to set priority and promote readiness to approved.
depends_on: [ACD-300, ACD-300b]
