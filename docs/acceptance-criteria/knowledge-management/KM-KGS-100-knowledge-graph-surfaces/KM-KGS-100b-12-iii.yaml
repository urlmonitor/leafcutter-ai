assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The session-start trigger is carried by the `.claude/settings.json` SessionStart hook invoking a Python freshness-check entrypoint; it reuses the KM-KGS-100b-6 staleness check and the KM-KGS-100b-7 rebuild primitive."
  - "It detects surfaces now out of date with the current tree (or the absence of an index — e.g. a fresh worktree) and reconciles them (refresh affected surfaces, or build the index) before the first query of the session."
  - "It resolves the index path per KM-KGS-100b-11 so a freshly created worktree gets its own index built under its own root; the writer flag (default OFF) gates whether it runs."
  - "The hook must be non-blocking to session start and log at WARNING on failure; a missed reconciliation still degrades to slower-not-wrong via the next read's mandatory check."
test_spec:
  - name: test_session_start_detects_stale_after_branch_switch
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: integration
    description: "After a branch switch/pull that advanced sources, the session-start check detects the now-stale surfaces."
  - name: test_session_start_builds_index_for_fresh_worktree
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: integration
    description: "In a fresh worktree with no index, the session-start check builds the index under the worktree root before the first query."
  - name: test_first_read_after_session_start_needs_no_self_heal
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: integration
    description: "After session-start reconciliation, the first index-backed read reflects the current tree without its own read-time self-heal."
