assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'The AC-side step claim is the authored field specifies_steps: a list of {flow: ''<product>/<name>''
  (string, required), steps: [<step id>, ...] (non-empty list of unique strings, required)}; additionalProperties
  false on each entry; a flow id appears at most once in the list; an absent key means the AC makes no
  step claim. Example: specifies_steps: [{flow: leafcutter/generate-product-truth, steps: [map, derive]}]'
- 'The field must be accepted by every AC schema gate that runs: config/ac_store_schema.json (top-level
  additionalProperties is false, so this is the load-bearing gate for the check-ac-schema hook and .leafcutter/scripts/ac_store/validate_ac_schema.py)
  and its deployed copy .leafcutter/config/ac_store_schema.json, which must stay byte-identical to config/ac_store_schema.json
  (regenerated by the build, not hand-edited)'
- docs/reference/ac-schema.md must gain a field-table row for specifies_steps stating its shape, that
  it is AUTHORED (never generated, unlike the tool-owned product_truth), and that validate_product_truth.py
  compares it with flow steps' implements
- generate_product_truth.py and apply_flow_backlinks.py must never write, rewrite or drop specifies_steps;
  the claim is independent of the step links and of the generated product_truth back-reference
- The comparison must read the flow steps' implements lists and the ACs' specifies_steps only; it must
  never use product_truth or index.json by_ac as either side of the comparison
- New validator logic goes in a new module (e.g. docs/product-truth/scripts/product_truth_step_claims.py)
  or in product_truth_drift_checks.py (113 measured lines); generate_product_truth.py (399/400 measured
  lines) must not grow at all, and validate_product_truth.py (390/400 measured lines) may gain only the
  specifies_steps key in load_ac_records() and one call site, staying within 400 measured lines
- 'The check module must be pure: it takes the loaded flows and AC records as arguments and appends to
  the shared errors / warnings / checks lists like the other drift checks; no file IO of its own'
- 'Matching semantics: an AC carrying any specifies_steps entry is checked against the step links of every
  flow; a step link whose AC claims no such step in that flow (including an AC with no entry for that
  flow) is a mislink error, and a claimed (flow, step) whose implements list does not contain the AC is
  an unsupported-claim error. Both are errors (non-zero exit), consistent with UXP-514 drift checks being
  errors'
- Every error message must contain the flow id, the step id and the AC id, with the wording the criteria
  give; exactly one error per (flow, step, AC) finding, no duplicates
- 'Output must be deterministic: the same store yields the same errors in the same order on every run
  (sorted by flow id, step order, AC id)'
- The check must record its examined figure through the shared check bookkeeping (product_truth_outcome.record_check_executed
  / record_check_not_executed), so an empty input is reported as not exercised rather than as clean (UXP-514-5
  convention)
- Only flow steps are compared; branch implements links are out of scope for this check and must produce
  no step-claim finding
- The check must add no more than 1 second to a validator run over the current store (about 170 step links)
delivers_to:
  agent: python-coder
  contract: '(1) config/ac_store_schema.json and .leafcutter/config/ac_store_schema.json accept the top-level
    AC key specifies_steps: list of {flow: string, steps: list[string] non-empty, unique}; (2) docs/reference/ac-schema.md
    documents it; (3) validate_product_truth.py reports the step-claim errors. Consumed by UXP-590-4,
    which writes the claims on nine ACs'
expects_from: null
notes: |
  Why an AC-side claim: the product_truth back-reference is generated from the step links,
  so comparing the two can never detect a wrong link - both sides move together. A second,
  independently authored statement on the AC is the only deterministic source a mislink
  can disagree with. A judgment-based reading of step text against AC criteria was
  considered and not chosen as the gate: it cannot give the same answer on every run, so it
  cannot fail CI. It remains a possible advisory follow-up.
