notes: |
  This is the core payoff of ACS-800. A re-parent is ONE metadata-field change
  (the parent pointer from ACS-800b) — no id rename and no store-wide rewrite of
  depends_on / covered_by / delivers_to / expects_from / superseded_by references.
  PERMANENT FIX: this is what makes the repeated manual tree splits (ac-tree-split
  skill) and the child_limit_override stopgap on check_ac_limits.py unnecessary going
  forward — an over-cap branch is rebalanced by moving children, not by renaming them.
  The BA should specify at L2 the "no reference cascade" guarantee and the moved-child
  bookkeeping (parent's child list and the child's parent pointer stay consistent).
