notes: |
  WHY THIS IS AN AC AND NOT A COMMENT ON THE TICKET. The register is the first
  thing an implementer reads about this defect, it is authoritative in tone, and
  its remediation item 1 ships a broken required job. Without a criterion that
  refuses that path explicitly, the most likely outcome of this whole tree is an
  implementer doing exactly what the document says, watching it work on a clone
  that has the extension, and discovering the abort in CI on somebody else's
  pull request.

  THE DUPLICATE ID IS NOTED, NOT FIXED HERE. docs/known-issues/testing-quality.md
  carries KI-TQ-012 twice, at ~L589 and ~L840, for two framings of the same
  defect; the file itself records the collision at ~L1026. Renumbering is
  register hygiene and belongs to its own change. This AC only requires that
  neither write-up recommends the aborting form.

  ONE AGENT, TWO ARTEFACTS. The change touches test code and one prose passage in
  the same register the tests read. That is one commit by one implementer, not a
  hand-off — but if the store's owner prefers strict one-artefact-per-AC, the
  register correction splits cleanly into a sibling AC assigned to
  documentation-expert, with this AC keeping the first three descriptors.
