notes: |
  Wave 1. User decision 2026-10-25 (IT PO stage): check-ac-schema refuses a
  test_rationale whose normalised text (case, whitespace, punctuation folded) is
  identical to another record's test_rationale in the store, and the refusal names
  the other record.

  Scope (narrowed by the user 2026-10-25): only the test-free reason is compared,
  meaning the test_rationale of records with test_required false, and only
  against other test-free records. The test_spec-justification meaning on other
  records is out of scope.

  Interaction with existing duplicates: the store may already hold records that
  share a rationale. They are not refused until they are changed (last clause),
  the same on-change rule as BO-2500a-8-i, so the store does not block on day one.

  DK-210b-3 and the texts in the Given are examples.
