notes: |
  THE FALSIFIABLE HALF OF "EVERY CHANGE TO ONE IS LISTED" (TQ-500g criteria).
  W2 is the control: a check that stops every piece of work that touches an
  existing test would pass W1 and bring back the blanket ban.

  TECHNICAL DETAIL FOR IT-PO: "existed before the work began" is the file at
  the merge base the routes already use. Granularity (file or test function) is
  IT-PO's call; the criteria name tests, so a function-level comparison is the
  intent. Which route runs it: all of them, through one shared check (the
  both-lanes rule); wiring can ride the same step as the wrong-version runs.

  IT-PO ENRICHMENT (2026-09-28)
  GRANULARITY DECIDED: per test function (the BA left this to IT-PO).
  WIRING: through the same before-commit call as the wrong-version runs, to
  avoid more JS growth.

  IT-PO ALIGNMENT (2026-10-22): AGAINST MAIN AFTER TQ-500g-1-v/-vi
  WHERE THE CHECK LIVES: consumer_sweep.py check, called FIRST by
  wrong_version_gate.py finish. finish is already dispatched before every commit
  by the fast lane, /build-feature and the single-ticket route (and by /build-epic
  once TQ-500g-1-vii ships), so no route JS changes. A sweep stop sets stopped_at
  'sweep' and skips the writer and the runner: a weakened suite makes the
  wrong-version verdict meaningless.
  NOT A PRE-COMMIT HOOK: hooks see only the staged diff, run on every human
  commit (which has no list), and the nearest hook, check_contract_shrinking.py,
  is over the ratchet.
  HOW 'LISTED' IS PROVEN: the record step fingerprints each entry from the
  working tree. A stale, unaffected or forged entry excuses nothing.
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-v or -vi (BA to
  add). TQ-500g-1-v's delivers_to text says stopped_at null|"write"; it gains
  "sweep" here (additive; no route reads stopped_at).

  BA AMENDMENT (2026-10-22): USER ANSWERS Q2-Q4
  DEPENDS_ON: TQ-500g-1-v and TQ-500g-1-vi added (both done on main). TQ-500g-1-v
  is not edited: its finish output (stdout {gate_passed, stopped_at:
  null|'write', writer, verdict}) gains stopped_at 'sweep' and the sweep key
  through this AC, additively; no route reads stopped_at.
  Q2 FIXTURES AND HELPERS: an edit to non-test top-level code in an existing
  test file or conftest.py (fixture, helper, constant, pytestmark) must be
  listed like a test; an unlisted one stops the work, reported as
  <file>::<symbol>. The test-writer prompt (TQ-500g-3) tells the writer to
  list them.
  Q3 STRICT, ONLY THE TEST WRITER RECORDS: a coder or remedy edit to an
  existing test is unlisted and stops the work. This is deliberate: the stop
  is visible in finish's JSON and the ticket is re-driven so the test-writer
  sweeps again. No exemption path.
  Q4 ACCEPTED BEHAVIOUR, SHARED-WORKTREE PARALLEL BATCHES: in a /build-feature
  batch where several tickets share one worktree, a sibling ticket's unlisted
  edit to an existing test stops another ticket's finish too, because the
  diff against the base covers the whole worktree. check reads every recorded
  list under <git-dir>/leafcutter/work/*/, so a sibling's listed edits pass.
  Accepted as is; not a defect.
  WEAKENED ASSERTIONS: TQ-500g-3-iii adds a static before/after comparison of
  every changed existing test to the same check (loosened field).

  USER APPROVAL (2026-10-22): the criteria amendments Q2 (fixture, helper,
  constant and pytestmark edits must be listed; an unlisted one stops) and Q3
  (only the test writer records; a later coder or remedy edit stops) were
  approved by user 2026-10-22, answered directly by the user in the main
  session's AskUserQuestion.
