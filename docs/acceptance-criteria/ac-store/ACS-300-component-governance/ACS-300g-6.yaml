change_target: code
risk_surface: contract_boundary
test_spec:
  - name: test_repo_root_discovers_worktree_root_when_cwd_is_outside_the_repo
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      With GIT_DIR set to a linked worktree's gitdir and the process CWD set to a
      directory outside any repository (e.g. /tmp), _repo_root() returns the
      worktree top-level, NOT the CWD. This test must fail against the current
      CWD-anchored implementation; if it passes unchanged, the CWD was wrongly
      left at the worktree top and the test is void.
  - name: test_repo_root_is_never_the_cwd_under_hook_environment
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      Asserts the negative directly at the seam git establishes for hooks (GIT_DIR
      set, GIT_WORK_TREE unset): the returned root must not equal Path(os.getcwd())
      when the CWD is not the repository top-level.
  - name: test_detail_ref_resolves_against_repo_docs_not_leafcutter_docs
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: real_artifact
    description: >-
      Using a real components.json entry whose detail_ref points at an existing
      <repo>/docs/... file, and with the hook invoked through a .leafcutter
      install layout, validate_new_component passes instead of false-failing with
      "detail_ref file does not exist".
  - name: test_root_resolution_fallback_never_yields_the_leafcutter_directory
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      When root discovery fails (git unavailable or non-zero exit), the helper must
      not silently return <project>/.leafcutter from the __file__-anchored fallback
      — the original defect must not be reachable as a fallback path.
  - name: test_components_integrity_hook_uses_discovered_root_end_to_end
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      Runs the hook as git invokes it (GIT_DIR set, CWD not the top-level) and
      asserts the discovered root is actually threaded into the detail_ref checks,
      so the fix is wired into control flow rather than defined and ignored.
test_rationale: >-
  The obvious regression test for this AC cannot fail. Setting GIT_DIR while the
  CWD is already the worktree top-level returns the worktree root on the broken
  and the fixed implementation alike, so a test written that way is green against
  a defect — that is how this AC stayed done for six weeks. Every descriptor above
  therefore pins the CWD somewhere other than the repository top-level, and the
  seam test asserts the negative (root != cwd) explicitly rather than only the
  positive. A direct-import unit test that merely calls _repo_root() from the
  project root would be exactly the void test this AC's history warns about.
