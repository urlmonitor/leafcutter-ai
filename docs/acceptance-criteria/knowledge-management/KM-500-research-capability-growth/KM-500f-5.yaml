change_target: code
risk_surface: contract_boundary
notes: RQ6; CODER-04, QA-01, QA-03, QA-04. Reuse the TQ-500 discriminating-test conventions; this AC concerns the
  research answer, not another test-enforcement system. Draft behavioral specification under the user-requested
  BA pass; technical enrichment and proof remain pending.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Recommendations identify guarded behavior and inspected source/test/fixture evidence at a declared scope and revision.
  Filenames, coverage tags and work status alone cannot establish branch, mutation or executed proof.
- Where fixture content is actually available through an approved evidence route, state seeded facts, expected outcomes
  and real versus simulated actors. Otherwise identify missing content or test requirements.
- Negative-case recommendations distinguish no-match, unsupported scope, missing fields and unavailable execution
  according to the governing answer contract. Passing happy-path evidence does not fill a missing negative case.
- Bound rerun recommendations by inspected change/consumer scope and explain why each case is relevant. Without
  complete consumer evidence do not claim a smallest or exhaustive regression set, and do not create a separate
  test-enforcement system.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_regression_recommendation_cites_guarded_fixture_behavior
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Ask public research for regressions using approved inspected change, fixture and test evidence; assert
    guarded behavior, seed facts, expected outcomes, scope and real/simulated labels accompany each recommendation.
  must_catch:
  - Recommending a test solely from its filename while inventing fixture contents.
  covers:
  - KM-500f-5
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_regression_answer_exposes_missing_negative_case
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Supply a passing happy-path receipt but no negative control for unsupported data versus no-match;
    assert the missing discriminating case remains a gap.
  must_catch:
  - Claiming complete regression confidence because one happy-path test passed.
  covers:
  - KM-500f-5
  requires_db: false
- name: test_regression_consumer_preserves_declared_versus_executed_proof
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Feed declaration-only and executed-proof outputs from the real proof consumer into regression recommendation;
    assert recommendations retain missing test content/run evidence rather than upgrading references to execution.
  must_catch:
  - Crediting declaration-only test references as executed branch or mutation coverage.
  covers:
  - KM-500f-5
  requires_db: false
- name: test_regression_scope_does_not_claim_unproved_minimality
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: With a bounded change set and incomplete consumer graph, assert justified candidate reruns and explicit
    limits without a smallest/exhaustive claim or broader permission.
  must_catch:
  - Labeling a recommendation minimal despite uninspected consumers or missing runtime scope.
  covers:
  - KM-500f-5
  requires_db: false
