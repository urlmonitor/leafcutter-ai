estimated_complexity: M
it_requirements:
  - "buildFlowGraph in leafcutter-web/lib/data/graph.ts must group branches by their shared from-step and synthesize one decision node per branch (id decision:<stepId>:<j>), chaining them: step -> D0, each Dj 'no' handle -> D(j+1), and the last Dj 'no' handle -> the next ordered step."
  - "Each diamond's 'yes' handle must point to exactly one branch outcome; the fork must never be emitted as a single node with N outgoing edges."
  - "Column layout must reserve one column per diamond (stepColMap / branchDecisionCol in graph.ts) so the chain lays out left-to-right without overlap; sibling branch lanes are positioned by ExplorerInner in flow-explorer.tsx (BRANCH_LANE)."
  - "Chaining must be count-agnostic — it must handle arbitrary N >= 2 with no hard-coded branch count."
