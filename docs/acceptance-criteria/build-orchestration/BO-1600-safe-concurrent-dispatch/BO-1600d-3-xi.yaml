title: "Every step failure surfaces as an operator-facing stop-and-report, never a raw traceback"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600d.yaml"
criteria: |
  Given a recovery step fails during execution (a git subprocess error, or a BLOCKED or
    unrecoverable step)
  When the plan is executed
  Then recovery stops at the failed step and prints an operator-facing "Recovery halted"
    report that names the failure
  And it does not emit a raw Python traceback and does not continue to the next step on a
    partially-repaired store
depends_on:
  - BO-1600d-3
doc_links:
