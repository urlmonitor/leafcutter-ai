notes: |
  Fails closed, against the repository's general fail-open convention for pre-commit
  hooks, and the difference is deliberate. A pre-commit hook fails open so a script bug
  never blocks unrelated work. This gate is the opposite kind of object: its entire
  output is a claim that the coder's work is constrained by a failing test. When the
  partition cannot be derived, no such claim can be made, and a permissive fallback
  would silently readmit the unconstrained-implementation state the gate exists to
  prevent — a phantom red baseline is worse than no run.

  The practical cost is near zero: the fast lane always opens a fresh worktree off the
  latest origin/main, so the merge-base is available in every intended invocation. A
  halt here signals a broken environment, not a normal case.
