criteria: |
  Given a ticket that requires documentation and the documentation-verifier phase runs,
  When the ticket's git diff contains NO change to any of the required documentation
    files named in its documentation brief,
  Then the verifier reports a failure with `status: blocker`.
  And the blocker message names each required documentation file that is missing a
    real change.
  And the ticket cannot advance to commit or be reported as complete while the blocker
    stands.
depends_on: [BO-2200b, BO-2200b-1]
