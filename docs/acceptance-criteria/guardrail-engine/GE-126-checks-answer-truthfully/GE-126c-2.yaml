  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. GE-126c-4 has to describe the
  message a reader will actually meet, including the workaround that preceded it. That
  makes the wording a contract rather than an internal detail: if the coder changes what
  the refusal says, the reference record is describing something that no longer exists.

  THE ONE-SOURCE REQUIREMENT FOR THE MESSAGE AND ITS ROUTE is the ACS-100i-9 shape applied
  at small scale, and it is worth the line: assembling the message in one place and the
  deployed path in another is how a message ends up naming a location the build stopped
  writing to.

  AGENT AND SIZE. python-coder, S. Genuinely small - one message and one route - and the
  cost is entirely in the second test descriptor, which has to execute what the message
  says.

