notes: |
  This is the half of KI-BO-20260901-0920 the shared step can close on its own: a commit can never
  carry another caller's staged work, whatever else is in the index. The other half -- two git
  writes at the same instant -- is serialisation, owned by BO-1600a and consumed in BO-4500a-4-ii.
  The rollback scenario must leave OTHER callers' staging alone: a rollback that restores "the
  index as it was" by resetting everything would unstage the siblings' work (BO-200b-2 is scoped
  to one envelope's files, which is the reading taken here).
