criteria: |
  Given 3 ticket files have been generated for goal ACD-050 (title: "Validate API inputs"),
  When the system assembles the epic folder,
  Then it creates a folder named EPIC-ValidateApiInputs (derived from the goal's title)
    under the tickets inbox directory
  And all 3 generated ticket files are placed inside that folder
  And each ticket file is named with a numeric prefix reflecting dependency order
    (e.g., 01_validate-input-schema.md, 02_reject-oversized-payloads.md)
  And the folder structure is immediately usable by ticket-supervisor
    (no further manual assembly required).
