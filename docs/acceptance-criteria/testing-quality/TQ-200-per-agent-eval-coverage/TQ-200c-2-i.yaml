notes: |
  THE OVERCORRECTION THIS PREVENTS. The obvious over-reaction to "444 llm-expert
  requirements were asked for nothing" is "route every llm-expert requirement to an
  eval". That satisfies a naive reading of TQ-200c-2 and is wrong in three separate
  ways, which is why it is written down as a criterion rather than left to judgment:
    - It is keyed on the producer's name again — the exact defect TQ-200c-2's third
      clause forbids — merely with the sign flipped.
    - It is expensive and non-deterministic where the repository already has a cheap,
      deterministic answer. Verified 2026-08-18: artifact-mode eval rows in
      scripts/evals/agent_eval_config.json carry `timeout: 900` and a per-row sandbox
      copy of the product-truth store, and every row is a live model call. Turning
      unit_tests/test_bo_2100a_3_phase_order_gates.py — a structural membership check
      — into an eval buys nothing and costs a model invocation plus a flake surface.
    - It corrodes the distinction the whole L1 rests on. If everything prompt-shaped
      is judged, "judged" stops carrying information and the routing decision is once
      again a single boolean, just a different one.

  THE MIRROR CLAUSE IS NOT SYMMETRY FOR ITS OWN SAKE. Demanding an accompanying
  deterministic test of a purely judgment-shaped question is how the store filled up
  with named tests nobody wrote: an author asked for a deterministic proof of
  something no assertion can settle, and it stayed unwritten. Of the 124 named test
  contracts on llm-expert requirements, 115 do not exist anywhere in unit_tests/.
  Manufacturing a deterministic proof to satisfy a rule is the same failure being
  re-introduced from the other side.

  RELATIONSHIP TO c-3 — THESE ARE NOT IN TENSION. c-3 requires that BOTH layers CAN be
  asked for at once and that neither displaces the other. This L3 requires that both
  are not asked for when only one is needed. Together they say: the number of layers
  demanded is a property of the work, and every value from one to two must be
  reachable. An implementation that always demands both fails this L3; one that can
  only ever demand one fails c-3. The pair is what makes the router a router.

  THE LAST CLAUSE EXISTS BECAUSE THIS L3 IS THE OBVIOUS PLACE TO REINTRODUCE THE BUG.
  "Do not over-demand" is one careless step from "when in doubt, demand nothing",
  which is generate_ticket_from_ac.py:2773 again. Restraint here is bounded by
  TQ-200c-2's fourth clause, and the boundary is stated so an implementer cannot cite
  this L3 as licence for a default of silence.
