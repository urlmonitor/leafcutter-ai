criteria: |
  Given a drive clone with `gc.auto` set to 0 and a drive that produces enough loose
    objects to exceed git's normal auto-gc threshold (~6700 loose objects),
  When the drive keeps committing past that threshold,
  Then no automatic (background/detached) gc or repack runs against the clone during
    the drive,
  And the drive's commits continue without a concurrent repack touching its object
    store.
