criteria: |
  Given the mined completion-evidence record produced by the historical mining pass,
  When the reference documentation is published,
  Then it lists every field of a manifest-item record — the source ticket, the signing
    agent, the manifest item name, the recorded value, and the reason and remediation
    carried by an item expanded to a nested object,
  And it states how each of the five input cases is represented: an item recorded true, an
    item expanded to result false with a reason and remediation, an item recorded as a bare
    false, an item recorded with a non-boolean value, and an absent manifest,
  And it states that an item recorded false does not by itself mean a check caught a
    problem, giving the three cases that produce one — a negatively polarised item name
    where false is the desirable outcome, an intentional test-first red baseline, and a
    genuine failure — so a reader cannot read the false tally as a defect count,
  And it states that a missing manifest is tolerated and never blocks, so a reader cannot
    conclude that mining introduces a new blocking condition,
  And it states that this mined record is the baseline that the defect record below extends
    rather than replaces.

  Given the countable defect record and the per-gate problem-kind vocabularies,
  When the reference documentation is published,
  Then it lists every field of a defect record, including the emitting gate, the rule
    identifier, the free-text detail, the signature, and the signature method,
  And it states the signature rule exactly — that the signature is derived from the
    emitting gate and the rule identifier and from nothing else, and that the free-text
    detail and the artifact the finding was raised against are both excluded,
  And it defines the three signature-method values, stating which reports discount a
    heuristic figure and that an unclassified figure is not discounted,
  And it documents the declared vocabulary of each gate that reports findings, names the
    gates exempt from declaring one together with the reason, and states how an
    unclassified entry is promoted into a vocabulary and how the occurrences counted under
    its retired identifier are carried across,
  And it describes the recurrence report, stating that a rule identifier with a high
    recurring count is a candidate for promotion to a deterministic pre-commit check —
    cheaper than a language-model judgement and complete in its recall,
  And it states that a defect record's signature is a problem-kind identity rather than an
    instance identity, and is the identifier an override record must reference alongside
    that override's own instance discriminator.
