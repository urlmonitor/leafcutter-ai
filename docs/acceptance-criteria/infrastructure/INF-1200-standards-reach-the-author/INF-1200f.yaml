notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.

  WHY THIS IS NOT PART OF INF-1200b, SINCE THE MERGE IS TEMPTING. b promises
  one edit in one place; this promises no divergence between what was said and
  what is applied. They are independent, and the negative case is the current
  design generalised: if each specialist's brief continued to name the figure
  it wants while the values were filled in from the declaration, this criterion
  would hold and b would fail, because covering a new kind of file would still
  mean editing a specialist. Both are needed.

  THE DRIFT IS THE POINT, NOT THE FIRST-DAY CORRECTNESS. Any hand-built
  arrangement is faithful on the day it is built. What this criterion is
  actually about is the second day: the standard changes and one of the two
  surfaces does not. This project has already lived that exact failure on an
  adjacent surface, where a published description of a gate outlived a change
  to the gate's behaviour by long enough for people to plan around the wrong
  rule. A criterion satisfied by correcting today's figures is satisfied again
  the next time they diverge — which is to say, not satisfied.

  THE PRESERVATION OBLIGATION, STATED EXPLICITLY BECAUSE IT IS EASY TO LOSE IN
  A REWRITE. One pairing already delivers this property correctly, from a
  single declaration. Any generalisation must leave that pairing at least as
  faithful as it is now. A rebuild that regresses the working cell while
  covering more cells has made things worse, and a decomposition that does not
  say so invites exactly that trade.

  WHAT THIS DOES NOT CLAIM. It takes no position on whether a given standard or
  a given way of measuring is the right one — only that one figure is in play
  rather than two. Which figure is correct is the user's decision at approval;
  whether the measurement is reproducible is GE-127d's subject.
