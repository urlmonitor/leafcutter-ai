test_spec:
  - name: test_tq_400f_4_unresolvable_child_sets_are_counted_apart_from_both_other_outcomes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      One store, four abstaining parents — dangling covered_by id, unreadable child
      file, child-link cycle, duplicate id — each reported under
      evidence-not-trustworthy with the child-link cause key, counted separately from
      parents judged complete and from parents judged to have unfinished work.
      Construct the store so that folding the abstentions into either of the other two
      counts would produce a number a correct implementation must not print.
  - name: test_tq_400f_4_a_child_link_cycle_does_not_take_the_run_down
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      A subprocess run over a store containing a child-link cycle terminates inside
      the run's normal time budget, exits with a status the harness can read, and
      still emits verdicts for every OTHER record in the store. A recursive
      tree-shaped traversal hangs or raises RecursionError here and leaves the run
      with no verdicts at all — which is worse than the defect being fixed.
  - name: test_tq_400f_4_abstaining_parents_are_untouched_while_a_resolvable_one_is_demoted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      THE POSITIVE CONTROL, SAME RUN, APPLY ENABLED. sha256 all four abstaining
      parents before and after; identical. In that same invocation a fifth parent
      whose child set IS fully resolvable, with one unfinished descendant, is demoted
      on disk. Abstention is thereby shown to be a judgement about the evidence rather
      than the sweep giving up, and the byte-identity assertion is shown not to be
      riding on an inert run.
  - name: test_tq_400f_4_unreadable_child_is_produced_by_a_real_malformed_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The unreadable-child case must be produced by writing a genuinely malformed
      .yaml into a real-serializer store and letting the production loader fail on it
      — truncated YAML, a tab inside an indented block, and a permission-denied read
      are the store's actual failure modes. Monkeypatching the loader to raise
      reproduces the author's idea of the failure and is the same fixture bias that
      hid the files_touched parser no-op for an entire epic.
  - name: test_tq_400f_4_report_and_inventory_name_the_link_and_carry_a_partitioning_cause_key
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      For each abstaining parent the report names the literal unresolvable child id
      and the parent's repo-relative path; and the inventory entry carries a cause key
      that TQ-400e-2's coverage abstentions do NOT carry, so a downstream reader
      partitions the two by field value rather than by string-matching prose. Assert
      the partition against a store containing both kinds of abstention in one run.
test_rationale: >-
  The naive test gives a parent a covered_by entry pointing at a non-existent id and
  asserts it is not demoted. That stays green on three broken implementations. One
  that abstains by SKIPPING the record entirely, leaving it invisible — which is the
  exact condition the twenty bad parents accumulated under, so the naive test would
  certify the defect it was written to prevent. One that handles the dangling-id case
  and crashes on the other three failure shapes its fixture never exercises; the cycle
  in particular hangs or blows the stack in any traversal written for a tree and
  destroys every verdict in the run. And one that abstains correctly in preview and
  demotes with apply enabled, which is the whole defect and is invisible to any test
  that never passes the flag. Hence: a subprocess run with apply enabled, all four
  failure shapes in one store, a positive control demoted in that same run, and an
  explicit termination assertion on the cycle. The real_artifact entry refuses a
  monkeypatched loader because a hand-raised exception is the failure the author
  already knows how to handle, whereas truncated YAML and a stray tab are what the
  store actually produces.
change_target: code
risk_surface: contract_boundary
notes: |
  The asymmetry to preserve: uncertainty about a parent's children must resolve to
  abstention, never to demotion. This is TQ-400e's rule and TQ-400f inherits it
  unchanged. A dangling child link is a real defect in the store and it is worth
  reporting loudly, but demoting the parent on it punishes the wrong record and
  destroys the reason text — the reader is told the parent has unfinished children
  when what actually happened is that a link is broken.

  Why an abstention and not silence: a parent that were simply skipped is
  indistinguishable from a parent nobody evaluated, and that invisibility is
  precisely the condition under which the twenty bad records accumulated. The
  separate count in the report is what keeps the hole visible and shrinking.

  Three distinct resolution failures are named in the Given on purpose, because the
  natural implementation handles the first and crashes on the other two. A cycle in
  the child links in particular will hang or blow the stack in a traversal written
  for a tree, and it must produce a reported outcome, not an exception that takes
  the whole sweep down and leaves the run with no verdicts at all.

  Scope boundary: this AC does not repair dangling links, does not deduplicate them,
  and does not gate authoring on them. It owns one guarantee — whatever the store's
  residual link-integrity error rate, the sweep never takes a badge away on a child
  set it could not read.
