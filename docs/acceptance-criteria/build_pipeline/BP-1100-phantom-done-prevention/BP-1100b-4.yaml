notes: |
  Second of the two confirmed already-shipped grep-only tests. Sibling of the
  deleted BP-1100b-3; different test module, different workflow, same defect
  class.

  WHY THE INCUMBENT ASSERTION IS GREP-ONLY (this part stands): asserting that a
  function is declared with an append flag says nothing about whether it ever
  runs. The declaration regex cannot distinguish a working journal from a
  no-op one.

  TWO EVIDENCE CLAIMS IN THE EARLIER DRAFT WERE WRONG — corrected 2026-08-13:
    - "the append sits inside a catch that only logs" — it does not.
      `fs.appendFileSync` is inside the TRY (finalize-feature.js L577-578); the
      catch (L579-581) only logs. And `appendJournal` is not dead code: it is
      called by `narrate()` (L115) and `outcome()` (L153), which every numbered
      step invokes. The failure mode is that `require('fs')` throws under an
      engine that provides no module loader, and the catch then swallows it —
      not that the helper is never reached.
    - "zero journal files exist anywhere on disk" — true, but NON-PROBATIVE.
      `journalPath` is `WORKTREE_ROOT + '/run-progress.journal.jsonl'`
      (L563), and finalize's Step 7 removes the worktree on every successful
      run. An absent file is the expected observation whether journaling works
      or not, so it is not evidence either way. The real evidence is the
      injected-globals contract in ADR-017-dual-engine-workflow-support:51.

  THE PRESCRIBED REMEDY IS A FALSE-GREEN TODAY — this is why the second
  scenario exists. A reviewer executed `run_workflow_under_e2()`
  (unit_tests/_workflow_engine_harness.py) against finalize-feature.js: it
  wrote 9 journal records to disk, in step order, still present at run end —
  precisely the three assertions the first scenario demands, green with zero
  implementation. Cause: the harness writes a CommonJS temp file and runs it
  under plain `node`, where `require('fs')` resolves. The real engine injects
  only agent/parallel/pipeline/phase/log/args/workflow/budget and offers no
  filesystem access. Authoring the first scenario against today's harness would
  ship a test that certifies a behaviour the production engine cannot perform —
  the same phantom-done shape this L1 exists to eliminate, reproduced inside its
  own remediation.

  NO AC OWNS THE HARNESS FIX YET. The second scenario states the prerequisite as
  an assertable outcome rather than a footnote, but making
  `run_workflow_under_e2()` engine-faithful (strip `require`, expose only the
  injected globals) is a change to shared test infrastructure that every
  workflow test depends on, and it will turn other currently-green workflow
  tests red. Flagged for the IT PO: this may warrant its own AC and its own
  ticket, sequenced before this one. Do not let an implementer quietly relax the
  second scenario to get the first one green.

  IT-PO RESOLUTION (2026-08-17) of the "no AC owns the harness fix" flag: the
  harness fix is folded INTO this AC rather than split out. Grounds: the AC's
  own second scenario already states the harness behaviour as an assertable
  outcome, so splitting would either duplicate that scenario in a new AC or
  strand it here without an owner; and the two halves cannot be verified
  independently — scenario 1 is a false green until scenario 2 holds, and
  scenario 2 has no observable consumer except scenario 1. The cost is recorded
  as estimated_complexity L and as an explicit shared-test-infrastructure
  constraint in it_requirements: the workflow tests the harness change turns red
  are triaged inside the same diff, and re-admitting a module loader to keep one
  of them green is a violation rather than a fix. If the red-test fallout proves
  larger than one reviewable diff, split at that point with evidence, not in
  advance.

  Whether the correct outcome is a working journal or a removed journal is an
  implementation decision for the assignee; this AC constrains only that the
  coverage must be able to tell the difference.

  Tree note: BP-1100 (L0) has one L1 slot remaining (a-f of 7); no new L1 was created.
