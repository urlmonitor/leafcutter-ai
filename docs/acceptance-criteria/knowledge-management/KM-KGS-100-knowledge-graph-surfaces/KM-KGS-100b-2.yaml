criteria: |
  Given the knowledge map includes acceptance-criterion nodes and their edges to
    source files, tests, other criteria, and component hubs
  When the knowledge-graph visualization is generated
  Then the rendered graph data includes the acceptance-criterion nodes
  And the rendered graph data includes the edges connecting a criterion to its
    implementing files, its covering tests, its depended-on criteria, and its
    component hub
  And the acs surface appears in the visualization's surface legend so a viewer
    can distinguish acceptance-criterion nodes from other surfaces
