title: "Valid JSON wrapped in leading and surrounding prose is still parsed and the run continues"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: draft
priority: medium
work_status: todo
criteria: |
  Given a /plan-feature run dispatches a helper agent to return a structured result,
  And that agent wraps a complete, valid JSON object in surrounding prose — an
    explanatory sentence or heading BEFORE the opening brace and additional prose
    AFTER the closing brace,
  When the workflow reads the agent's reply,
  Then the workflow recovers the intended JSON object with every field intact,
    disregarding the text before and after it,
  And the run continues to its next stage instead of stopping on the surrounding
    wording.
