notes: |
  THE FAILURE THIS AC EXISTS TO PREVENT IS THE ONE THE STORE HAS ALREADY SUFFERED,
  ONE LEVEL OVER. 124 named test contracts exist on llm-expert requirements and 115
  of those named tests do not exist anywhere in unit_tests/. A name in a plan is not
  a proof. If routing (c-2) starts emitting judged demands and those demands become
  sentences in ticket bodies, the store gains 444 new unwritten obligations and the
  measurable state of the repository gets worse, not better, because the demand will
  look satisfied on the page. Hence the first clause is about the ARTIFACT and the
  second about its REGISTRATION, not about the demand being recorded.

  WHY THE EXISTING HARNESS AND NOT A NEW ONE. This is not greenfield. Verified
  2026-08-18: scripts/evals/run_agent_eval.py, scripts/evals/eval_selector.py,
  scripts/evals/agent_eval_config.json (three agents configured), scripts/evals/
  results/, .github/workflows/agent-evals.yml, and the tests unit_tests/evals/
  test_eval_selector.py and test_trigger_sha_stamp.py are all present and working.
  TQ-200b-3 is done and TQ-200b-4 is in_progress against this exact surface. A second
  scoring path would immediately fork the scoring modes, the thresholds, the trigger
  manifest and the freshness rules — and TQ-200b-4's staleness guarantee is keyed to
  the recorded trigger SHAs of results produced by THIS runner, so a row scored
  elsewhere would be invisible to it.

  READ agent_eval_config.json BEFORE IMPLEMENTING. Its per-agent key sets are not
  uniform and the variation is meaningful: label mode carries label_axes /
  derive_outcome / response_label_field, artifact mode carries artifact_type / schema
  / sandbox_copy / tools / timeout. That is TQ-200a-2's label / artifact / markup
  distinction already made real in configuration. A registration mechanism that
  assumes one uniform entry shape will not survive contact with the file.

  THE FOURTH CLAUSE IS THE HARD ONE, AND IT IS NOT TQ-200a-1's JOB. Three agents are
  configured today; 444 requirements are assigned to llm-expert alone. The realistic
  case is a judged demand for an agent with no set and no config entry, and the
  tempting behaviour is to drop it with a warning. The clause forbids that: the
  demand must result in a set the runner recognises. Note the division of labour —
  TQ-200a-1 owns WHICH agents are in scope for eval coverage and reports an in-scope
  agent with no set as a coverage gap; this clause owns what happens when a demand
  arrives for an agent that has no set YET. depends_on TQ-200a-1 is therefore a real
  edge, not a courtesy: the row shape ({id, input, expected}) and the one-set-per-
  agent rule are defined there, and a row authored before that shape is settled would
  have to be re-authored.

  THE FIFTH CLAUSE PROTECTS THE PARENT L1's OWN PREMISE. A written demand and a met
  demand must be distinguishable, or the pipeline can once again report the request
  as though it were the proof — which is exactly what generate_ticket_from_ac.py:2773
  does today when it records `PASS  non-code AC — no test contract required`. Keep
  this clause distinct from c-5: this one is about not CONFUSING a request with its
  fulfilment; c-5 is about being LOUD when a request cannot be honoured at all.

  DEPENDENCY REASONING.
    - depends_on TQ-200c-1: the demand must be expressible as judged before there is
      anything to land.
    - depends_on TQ-200a-1: the row shape and the one-set-per-agent rule come from
      there.
    - No edge to TQ-200c-2. Landing a judged demand correctly is testable against a
      hand-declared demand, and holding this behind the derivation work would delay
      the half of the tree that produces an executable artifact. Recorded so the edge
      is not added on aesthetic grounds.

  BOUNDARY. This AC does not change how the runner scores (TQ-200a-2, TQ-200b), does
  not decide which agents are in scope for eval coverage (TQ-200a-1), and does not
  make anything a merge gate (TQ-200b-4). It requires only that a judged demand ends
  up as a row the existing runner can find and score.
