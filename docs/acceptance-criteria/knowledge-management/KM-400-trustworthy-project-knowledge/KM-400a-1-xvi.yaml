  not a new authored-record surface. The receipt reports 17 passing cases and
  process-local negative controls. Population is exactly the supplied immutable
  SourceFile entities; no fresh file census, current existence or hash proof is
  implied. Projection-helper exclusions are enumerated in the linked contract.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
