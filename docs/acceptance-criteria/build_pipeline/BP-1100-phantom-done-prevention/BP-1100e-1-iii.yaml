readiness: approved
priority: high
title: "A docs-only or config-only ticket with legitimately narrow scope is not false-flagged"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket whose declared files_touched are documentation-only
    (e.g. ["docs/how-to/recovery.md"]) or config-only (e.g. ["config/paths.json"])
  And its actual changes touch only those same declared documentation/config files
    and no source file with a .py/.sql/.ts/.tsx/.js extension
  When the pre-done reconciliation runs
  Then it does NOT flag the ticket — a legitimately narrow docs-only or config-only
    change whose actual diff matches its declared scope is a clean pass, not a mismatch
  And the reconciliation only ever flags on an actually-changed SOURCE file that is
    undeclared, so a ticket that changed no undeclared source file is never flagged

  Given a docs-only or config-only ticket that DOES declare source files in out_of_scope
  When the pre-done reconciliation runs on a multi-ticket branch, where the changed-file
    set is computed over the branch range and so includes other tickets' source changes
  Then those out_of_scope entries count as declared, exactly as they do for any other
    ticket — the docs-only classification narrows what the ticket contributes of its
    OWN, it does not discard what the ticket explicitly disclaimed
  And the ticket is not flagged for them

  Given a docs-only or config-only ticket that declares NOTHING in out_of_scope
  When the pre-done reconciliation runs
  Then its declared scope is still empty
  And an undeclared source change is still flagged, so the narrow-scope guard cannot
    be used to absorb source a ticket never mentioned
