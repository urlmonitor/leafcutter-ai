it_requirements:
- 'Field shape (IT-PO decision, taking the BA''s suggestion): test_intent: list of {clause: str (the outcome
  clause text, verbatim from criteria), needs_test: bool, reason: str (one sentence)}; exactly one entry
  per Then/And outcome clause; no test names, directories, frameworks, types, angles or strategy. It is
  a new field and does not reuse or extend test_spec.'
- 'Must not ship before test_intent is a declared property in config/ac_store_schema.json (additionalProperties:
  false is enforced at commit time); ACD-2400b-1-i delivers that registration. See ordering caveat.'
- 'test_intent states which outcomes need proof and why; it carries no isolation level, strategy or must_catch
  content (BO-550-1-i: test_constraints stays the only strategy channel).'
- test_constraints and tests_after stay with the technical planner, unchanged (BO-550-1-i, TKT-500b-3).
- 'Prompt- or docs-only requirements keep test_required: false as today.'
- Records that already carry a planner-written test_spec are left untouched by the planner (ACD-2400b-3).
- Criteria stay byte-identical (TKT-300a-4).
