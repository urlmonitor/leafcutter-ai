title: "A build that cannot produce the record stops and says so, instead of warning once and reporting success"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: draft
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given a real build aimed at a project outside the producing package's own parent
    folder, under a condition in which the record of what the build put there cannot
    be produced,
  When the build runs to completion and its report and outcome are inspected,
  Then the build reports failure,
  And the outcome an automated caller observes is unsuccessful, so a script, a
    pipeline or an install step that reads only the outcome learns that the build did
    not finish its job,
  And the report names the record that could not be produced and the project the build
    was aimed at, so the reader knows which install is unprotected,
  And a single warning line accompanied by a successful outcome does not satisfy this,
    because the build's own report is the last place this failure currently shows up,
  And the identical build, run once the record can be produced for that same
    out-of-package project, reports success and leaves the record in place -- so the
    failure verdict is attributable to the unproducible record and not to a build that
    refuses every target outside its own parent folder,
  And both verdicts are taken from running the real build against a real project
    outside the producing package's own parent folder and inspecting its reported
    outcome and the resulting tree, never from reading the build's own source for the
    presence of a failure path.
