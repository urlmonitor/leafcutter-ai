notes: |
  Found while marking INF-700c-3 (a documentation AC, change_target docs,
  test_required false) done: the pre-commit hook refused with "no '# covers:
  INF-700c-3' ... tag found anywhere under ." and "exemptions in force: 0", so
  the documentation shipped while the store had to keep saying todo. The only
  exemption seam available was config/reachability_exemptions.yaml, whose schema
  is units and capabilities with no runtime entry point; an AC id is neither, so
  using it would have recorded a false statement to buy a pass.

  BP-1100f-6 is the evidence that this is a hole rather than a design: it is
  change_target docs, test_required false, work_status done, and has no covers
  tag anywhere in the tree. It is done today only because it landed before the
  gate reached it, or without its AC file staged -- the documented blind spot
  where these hooks read the git index rather than the store.
