notes: |
  User-confirmed enforcement decision: this is a BLOCKING pre-commit hook, NOT
  audit-only. The blocking posture was decided up front (not a default the IT-PO
  may relax to warn). The IT-PO should still apply the standard fail-open-on-
  script-error convention (a hook crash, parse error, or git failure must exit 0
  with a stderr warning so a script bug never hard-blocks an unrelated commit) —
  fail-open on internal error is orthogonal to the always-block-on-real-violation
  product decision.

  SCOPE / COMPLEMENT (load-bearing through decomposition — see ACS-900e): this is
  the lifecycle-ENFORCEMENT complement to the existing audit-only tooling. Today
  scripts/ac_store/cross_reference_audit.py can BACKFILL implemented_by links but
  cannot DETECT stale code left behind when an AC is retired. ACS-900 adds the
  detection-at-commit-time half. Do NOT re-implement backfill here, and do NOT
  duplicate cross_reference_audit.py's traversal — ACS-900e exists specifically to
  scope this work against that existing tool so the two are complementary, not
  overlapping.

  PLACEMENT rationale (reuse the ACS-800 precedent): minted as a NEW root L0
  (ACS-900 = next free hundred; 100-800 are taken) rather than an L1 under ACS-200
  (automated-verification) or ACS-400 (ac-governance). ACS-400 governs WHO may
  edit a requirement's definition (criteria-field authorship). ACS-200 governs
  test COVERAGE of LIVE ACs. Neither covers the code-side lifecycle of a RETIRED
  AC. Distinct concern => sibling L0, consistent with the ac-tree-split
  horizontal-split guidance and the ACS-800 placement note.

  "deprecated" vs "superseded" status forms: the schema accepts status: deprecated,
  superseded_by (canonical), and superseded (older alias). The enforcement must
  treat ALL THREE retired-status forms as triggers (per ac-schema.md Status
  Lifecycle). For superseded_by, "reconciled" legitimately includes re-pointing
  implemented_by to the successor AC named in the superseded_by field, not only
  outright code deletion — see ACS-900d.
change_target: code
risk_surface: contract_boundary
