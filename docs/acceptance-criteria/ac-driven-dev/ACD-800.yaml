title: "Existing implementations are automatically discovered and linked to their ACs"
component: ac-driven-dev
level: L0
status: active
req_status: active
work_status: todo
criteria: |
  Given the AC store contains ACs that describe behaviours already implemented
    by tickets created before the AC-driven flow existed,
  When the cross-reference audit tool is run,
  Then it discovers which done tickets match which unlinked ACs using text
    similarity and keyword heuristics,
  And it produces a reviewable report distinguishing high and medium confidence matches,
  And it optionally backfills the AC metadata (implemented_by, work_status) for
    verified matches,
  So that the scanner does not re-propose work that has already been completed.
