criteria: |
  Given outside-item clearing (BO-4400b-1, BO-4400b-1-i, BO-4400b-1-ii) is in place,
  When a person reads the reference page for a workspace's footprint,
  Then the page contains one table row for every item kind the clearing removes, and
    each row gives the item's kind, where it lives, what creates it, how it is matched
    to its own workspace, and how it is reclaimed,
  And the number of rows equals the number of item kinds in the declared inventory the
    clearing uses,
  And the page states what happens when an item cannot be removed, and that a later
    clearing or sweep picks it up,
  And the page states that the shared project's copy of a line of work is never
    deleted by clearing.
