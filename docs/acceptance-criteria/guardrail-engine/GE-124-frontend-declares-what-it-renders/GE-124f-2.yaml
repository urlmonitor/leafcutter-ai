notes: |
  OUTCOME 2 of three. The PO's framing: a self-declared status is the
  phantom-done pattern this repo exists to prevent, and the pins are what make
  the label checkable instead.

  THE COMPARISON IS OVER PINS, NOT PIXELS — deliberate and worth defending at
  the next review. Comparing rendered appearance is a different, much larger
  problem with a much worse signal-to-noise ratio; comparing which criteria each
  side claims to render is mechanical, stable, and answers the question the
  label actually makes.

  The third scenario is where the value lands: without precedence, the derived
  result is advice and the hand-written label still governs, which leaves the
  phantom-done pattern exactly where it was.

  AND STILL NOT COVERAGE — a matching comparison proves the built page CLAIMS
  what the design claims. It does not prove the behaviour behind it works. This
  is stated in the PO note and owned as a guarantee by GE-124g-3.

  IT-PO ENRICHMENT NOTE (2026-08-25) — THE ONE AC IN THIS TREE WITH A MISSING
  PREREQUISITE. Verified on disk: docs/product-truth/mockups/fern-and-fig/
  holds five rendered .html files, none carrying `data-ac`, and the
  .mockup.json records model screen / renders / entities with no per-criterion
  element mapping. GE-124f-2 therefore cannot produce a meaningful comparison
  until mockup markup starts carrying pins — work that belongs to mockup-author
  and is not covered anywhere in GE-124. This is the strongest candidate in the
  family for a follow-up AC, and the reason this AC is sized L.
