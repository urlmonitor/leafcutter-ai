assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the handoff branch in build-feature.js and its twin in build-ticket.js, which change in the same commit and must behave identically"
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "python scripts/build.py"
    - "python -m pytest unit_tests/workflows/test_bo_3000_handoff_routing.py unit_tests/workflows/test_bo_3000a_3700_dispatch_defects.py unit_tests/workflows/test_bo_3000b_statusless_reply_schema.py unit_tests/workflows/test_bo_3000c_handoff_continuation.py unit_tests/workflows/test_bo_3701_build_ticket_dispatch.py"
  constraints:
    - "Twin parity: build-feature.js and build-ticket.js change in the same commit and produce the same dispatch sequence and the same stop report for every case in this record. The covering tests are parametrised over TWIN_DRIVERS (unit_tests/prompt_assembly/_driver_harness.py), so drift between the twins fails a test. Cases that need an epic drive (the deferred pull-request target; an epic ticket completing after a resolved handoff) are build-feature.js only, because build-ticket.js has no epic loop."
    - "One dispatch path: an honoured handoff target is dispatched through the same per-phase dispatch every phase uses: the pointer block (BO-1900d-1), the test-requirements guard, the red-baseline gate, the record read-back and its check, the dispatched-agent bookkeeping, promoted-phase absorption and the tests_written evidence. No separate inline dispatch of the target may remain. The inline path is what let a handoff to python-coder run the coder with no red-baseline gate."
    - "Handoff budget: at most 1 honoured handoff per (from-phase, to-phase) pair per drive, matching building-epics section 4 ('1 per phase pair per ticket'), and at most 3 honoured handoffs per ticket per drive as a backstop against cycles. Exceeding either stops the ticket with classification handoff_loop, and the report lists the chain of from-to handoffs honoured so far. The budget is per drive, so a re-run starts with a fresh budget."
    - "Fail closed on confirmation: the only evidence that the target's ok resolved the handoff is the ticket-record read-back after the target's dispatch (a verified sign-off). An unverified sign-off or an unreadable record stops the ticket exactly as today (status blocked, classification cross_agent, handoff_target named) and dispatches no later phase. The target's own ok reply is never enough by itself."
    - "Handing-phase decision: whether H runs next is decided from that same post-target read-back. If H is needed or failed, it runs next, ahead of every other pending phase. If H is signed_off, the normal phase order resumes. The decision must agree with the completion decision's handoff-resolution rule (BO-400e-1-i), so one run gives one answer per condition (ADR-048)."
    - "Refusals that dispatch nobody: a self-handoff, a recognised phase agent that is not a key in the ticket's agents map, and a target whose phase is deferred for this drive. Each stops the ticket with a reason the report distinguishes from every other stop condition, and the deferred refusal names the deferred target. A target present in the agents map as not_needed is honoured. No stop of any kind records the handing phase as completed."
    - "Handoff context: the re-dispatched target's prompt names the handing phase and carries its handoff message (the existing re-dispatch and handoff-message sentence), so the target knows what it was asked to do."
    - "No regression: the two existing refusals (no target; an unrecognised target, reproduced verbatim), the no-inference-from-ticket-body guarantee and the distinguishable unobtainable-versus-targetless refusals are unchanged. test_bo_3000_handoff_routing.py (five tests), test_bo_3000b_statusless_reply_schema.py and the BO-3700/BO-3701 tests pass unchanged. Only test_handoff_naming_a_known_agent_redispatches_exactly_that_agent is re-cast (see test_spec)."
    - "Size ratchet: build-feature.js and build-ticket.js are both over the 1000-line .js limit, and the check-file-size growth ratchet (GE-127b-1) refuses any commit that makes either longer. Lines starting with // count toward the limit. Each file must end net-zero or shorter; deleting the inline re-dispatch block pays for the additions. If that budget cannot be met, move the decision logic into a Python helper the driver calls (the heavy_lane_gate precedent) instead of asking for a ratchet skip."
    - "ADR-001: edit only the templates/workflows-js/ sources, run python scripts/build.py, and stage the regenerated mirrors in the same commit, or check-build-drift fails."
    - "Test harness: the E2 harness (unit_tests/prompt_assembly/harness_build_ticket_guard.mjs, appendSignoff) gains two opt-in spec keys, record_handoff_target and flips_signed_off. They must be opt-in so every existing harness test keeps its behaviour. The default signoff-readback stub stays unconfirmed, which is why test_bo_3000_handoff_routing.py still halts before pr-reviewer."
    - "Companion prose in the same ticket: templates/skills/building-epics/SKILL.md (the handoff text around lines 659-670) and templates/skills/build-feature-ops-notes/SKILL.md must describe the continuation rule and the stop conditions. This is skill-body text, the llm-expert surface, and the ticket's agents map should include llm-expert for it. Out of scope: the status-checker handoff loop. A status-checker that hands off and stays needed now hits the pair cap; design defect 4 (ticket T5) fixes it separately."
delivers_to: null
