id: UXP-700c-3-iii
title: Contract errors reach both commit checks and continuous integration
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a proposed change touches Product Truth or a declared contract, model, receipt or authoring
  dependency,

  When the configured pre-commit checks run,

  Then the same Product Truth validator used by continuous integration checks the contract metadata and
  reports its actual failure verdict,

  And a change outside the declared pre-commit scope does not trigger that local contract check,

  And the continuous-integration contract job is not skipped because of the changed filenames,

  And a malformed contract or stale generated field cannot receive a passing contract verdict through
  either route.

  And continuous integration runs the Atlas contract display regression suite and the full TypeScript
  type check even when only Atlas UI files change,

  And a failed display regression or type check fails that CI lane.'
