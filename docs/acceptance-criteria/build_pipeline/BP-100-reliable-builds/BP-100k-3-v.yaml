assigned_agent: test-writer
estimated_complexity: S
declares_side_effect: false
package_surface: false
it_requirements:
  - "No production change is owed. The behaviour shipped in PR #1013 and is on origin/main. Any later change to check_output_drift.py or _drift_exemptions.py must keep the two covering tests named in test_spec green, unmodified in what they assert."
  - "The hash-mismatch path may consult only the VALIDATED exemption map (the output of the registry validation step). It must never consult the raw registry entries. A raw entry whose ground is whitespace-only is a non-empty, truthy string, so reading the raw form would turn a rejected entry into a working suppression."
  - "Exemption matching is exact, per recorded key. No glob, prefix, directory or wildcard matching, no 'ignore all drift' flag, and no inheritance of one key's entry by a sibling. Introducing any of these is a widening that must retire this record openly. It must not be done by amending a clause of BP-100k-3-iv."
  - "A ground that consists only of whitespace must be treated exactly as an absent ground."
  - "A rejected entry must be named in the gate's output together with the path it tried to excuse. It must suppress nothing. It must not abort the run, and it must not invalidate the other, well-formed entries in the same registry."
  - "Verify behaviorally only (repo rule 'Gate / Workflow ACs: Verify Behaviorally, Not by Grep'). Every verdict comes from executing check_output_drift.py as a separate process from a deployed-shaped layout and reading its emitted lines, RESULT line and exit status. Grepping the gate source is forbidden, and so is calling the validator or scan function directly in place of the gate."
  - "Before work_status may move to done, each covering test must carry a '# covers: BP-100k-3-v' tag, because check_done_proof requires it. Adding the tags is a test-file edit and must wait until the in-flight refactor of unit_tests/commit_guardian/ has landed. If that refactor renames or moves a covering test, covered_by and test_spec must be updated in the same change."
  - "Must follow the repo error-handling policy. No new I/O is introduced by this record."
test_spec:
  - name: test_exemption_is_scoped_to_its_own_key
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    surface_invoked: "check_output_drift.py copied from templates/scripts/commit_guardian/ into a synthesized .leafcutter/scripts/commit_guardian/ layout, run as a subprocess with HOOK_TEST_CONFIG pointing at a fixture registry"
    description: "EXISTS, passes on origin/main. With a grounded entry for the first drifted key only, the gate exits 1 and emits no 'DIRECT-DRIFT: EXEMPT <second key>' line. The positive 'second output is still drifted' count (drifted=1) is asserted on the identical fixture and registry by BP-100k-3-iv's test_declared_key_is_reported_as_direct_drift_exempt."
    must_catch:
      - "The exemption degrades into a blanket drift switch: any grounded entry in the registry suppresses drift on every recorded key."
      - "Exemption matching is by directory or prefix, so a sibling under the same directory inherits the first key's entry."
  - name: test_groundless_entry_cannot_suppress_drift
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    surface_invoked: "same deployed-shaped subprocess run as above"
    description: "EXISTS, passes on origin/main. With a whitespace-only ground on the first key and a non-blank ground on the second, the output contains 'REJECTED EXEMPTION ENTRY: <first key>', the gate exits 1, and the RESULT line reads drifted=1. The second key is validly exempted, so that one drifted artifact can only be the first key."
    must_catch:
      - "The hash-mismatch path reads the raw registry instead of the validated map, so a whitespace-only ground (a truthy string) excuses drift."
      - "Ground validation treats a whitespace-only string as non-blank."
test_rationale: |
  RETROFIT CONTRACT: BOTH TESTS ALREADY EXIST in
  unit_tests/commit_guardian/test_drift_exempt_recorded_key.py and pass on the
  current code. They are listed so the contract reads as satisfied, not so
  they are written again. Each is a discrimination test. It goes red under a
  named, plausible wrong version (see must_catch), not merely when the code is
  absent. The whitespace-only ground is chosen deliberately because it is the
  one input that separates "validated map" from "raw registry": it fails
  validation, yet it is truthy in the raw entry.

  HONEST RESIDUAL GAP: the per-key test asserts "the sibling is never
  reported exempt" and "the run blocks". It does not assert drifted=1 itself,
  because that count is asserted on the identical fixture by -iv's
  declared-key test. Together the two tests cover every Then clause of this
  record. Alone, the per-key test does not.
delivers_to: null
expects_from:
  ac_id: BP-100k-3
  contract: "validate_exemption_registry(entries: list) -> dict[str, str]. It drops any entry whose ground is missing, blank or whitespace-only, and names each dropped entry on stderr as 'REJECTED EXEMPTION ENTRY: <path> reason=<detail>'. The returned map, keyed by exact repo-relative path, is the only form of the registry the gate may consult after validation."
