it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-ticket.js
  n_location_rule: "2 -- the pre-coder gate in build-ticket.js and its twin in build-feature.js, which must stay identical"
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_test_requirements_guard.py"
  notes: |
    The deterministic dispatch loop (templates/workflows-js/build-ticket.js, a .js
    workflow body -- python-coder surface per the repo convention) must not spawn
    python-coder/sql-coder for a code ticket lacking Test Requirements and a test-writer
    red-baseline; it holds the ticket back with a reason.
    The gate is the run-time backstop for the authoring-time guard in BO-2000e-1; it must
    stay a depth-1 dispatch decision and must NOT chain a build supervisor inline (ADR-006).
    Test coverage: simulate a code ticket with no Test Requirements / no red-baseline and
    assert the coder phase is not dispatched and a held-back reason is recorded.
    The red-baseline half of this criterion is decomposed in BO-2000e-2-i (test-writer
    evidence from the same drive), BO-2000e-2-ii (tests written by an earlier drive) and
    BO-2000e-2-iii (fail-closed when evidence is missing, empty or stale).
