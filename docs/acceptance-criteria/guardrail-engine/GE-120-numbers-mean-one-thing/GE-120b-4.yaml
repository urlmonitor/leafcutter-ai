assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "The section is written into `docs/reference/artifact-numbering.md`, the file GE-120a-3 creates. This AC does not create a document and must not start one — a second numbering document is the drift the whole tree exists to prevent."
  - "The table must be GENERATED FROM, or verbatim quoted from, the declared enrolment rule data GE-120b-1 introduces — not retyped. 'Matches the rule the check actually applies' is only durable if there is one source; a retyped table is correct on the day it is written and wrong at the first rule change. If a generated table is impractical, quote the rule file's own content in a fenced block and name the file, so a reader can see which is authoritative."
  - "The WHY for each exemption must be the basis GE-120b-1 records in the rule data — an allocator exists for the diagrams location and for nothing else — not a post-hoc rationalisation derived from which files happen to be unnumbered today. The latter documents the drift as if it were a decision, which is exactly the failure the clause guards against."
  - "The scope-trim record must state the decision, its author (BrainCandy), its date (2026-08-17) and the reason, and must state that re-expanding it is new work under its own requirement. A future reader who finds eleven unnumbered diagrams and assumes an oversight is the specific reader this section is written for."
  - "Doc frontmatter and length are mechanically enforced (`check-doc-frontmatter`, `check-description-field`, `check-doc-length`) and `transform-doc-index` regenerates the index. If the combined three-section document exceeds the doc-length gate, split by section into linked documents rather than trimming the reasoning — the reasoning is the deliverable."
test_required: false
test_rationale: |
  change_target is docs and the deliverable is prose. The one clause with mechanical content —
  that the documented table matches the rule the check applies — is best satisfied structurally,
  by generating or quoting from GE-120b-1's rule data rather than by a test that compares two
  independently-maintained copies; a test that compares two copies legitimises having two. If
  the implementer chooses to retype the table rather than quote it, a parity test becomes
  mandatory and this field must be replaced by a test_spec asserting the documented table equals
  the rule file's content.
delivers_to: null
expects_from:
  ac_id: GE-120b-1
  contract: "The declared enrolment rule the check reads, so the documented table and the enforced rule are the same data rather than two statements of it."
