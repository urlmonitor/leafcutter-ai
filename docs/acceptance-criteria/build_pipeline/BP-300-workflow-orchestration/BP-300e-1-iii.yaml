notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader by
  passing a native object and a native array (not strings) and asserting each is
  returned identical (same reference/value) with no string parsing attempted. Guards
  the degenerate "input is not a string" branch that must precede any parse attempt.
