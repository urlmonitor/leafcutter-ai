notes: |
  BO-3600a's notes say it directly: use the live instances as the fixture, do NOT
  hard-code them, since they will be resolved and the check must keep finding new
  ones. This record is the test of that instruction, and the third scenario is its
  sharpest form — a pair whose identifiers the check has never seen.

  The fourth scenario is the completeness clause. Without it, a check that reports
  the first conflict it finds passes every other scenario here while leaving the
  store as unreconciled as before. BO-3600e owns the SCOPE of the traversal; this
  clause owns the completeness of the reporting within whatever was traversed.

  The second scenario matters because a detector whose output is a growing list of
  historical findings is one a reader stops opening — the fate BO-3600d's notes
  record for every long-lived detector in this repo that lacked a disposition path.
