notes: |
  SATISFIES THE how-to LEG of GE-126a's documentation_triggers. The reference-doc leg is
  GE-126a-5.

  THE REMOVAL CLAUSE IS DELIBERATE. GE-120b's how-to trigger was written as a
  REPLACEMENT rather than an addition for the same reason: leaving the old advice in
  place beside the new procedure means half the readers keep following the old one. Any
  documented statement that a silent run or a bare exit code constitutes verification is
  the thing being replaced.

  THE EXECUTABLE WORKED EXAMPLE IS WHAT MAKES THIS AN ACCEPTANCE CRITERION rather than a
  request for prose. A documented procedure nobody runs is the documentation analogue of
  the defect this whole goal exists to close, and this component already has a recorded
  instance of it: a hook documented as dispatching an agent that has never dispatched
  one.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

