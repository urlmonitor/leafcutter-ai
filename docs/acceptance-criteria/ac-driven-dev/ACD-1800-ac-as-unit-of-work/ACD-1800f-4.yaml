test_rationale: "Every failure this AC forbids is produced by the interaction between a real git working tree and a real surface invocation, so any test that stubs the invocation also stubs away the entire hazard -- the tree is never mutated, the unconditional restore never runs, and a shared-tree implementation passes. Each descriptor therefore drives the real check over a real multi-member work item in a real temporary git worktree with proofs that genuinely mutate files. The bundled and standalone runs are both asserted because the fourth Then clause is half the point of moving proofs onto the requirement, and it is currently unmet in a verified way: fast-lane-ship.js has no observation phase and fast_lane.py has zero references to the smoke craft. The attribution descriptor is separated from the pass/fail one because a set-shaped aggregation satisfies 'the bundle failed' while losing the only information a reader needs."
