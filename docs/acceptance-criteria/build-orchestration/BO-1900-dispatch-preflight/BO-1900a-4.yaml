notes: |
  BUG-01, observed at the second journal entry of run wf_09a91c7e-d5f. The resolver
  returned an epic target whose isolated-working-copy value was a verbatim copy of the
  epic's work-store folder. A work-store folder is not a working copy.

  WHY THIS IS RECORDED EVEN THOUGH NOTHING BROKE. In the observed run the value was
  overwritten by the very next step, so the drive behaved correctly. That is luck, not
  design: any consumer that reads the resolved target before that step -- and every
  new consumer is written against the resolver's stated output -- would run phase
  agents against the shared clone rather than the epic's branch, and commit there.
  The failure mode is silent, is a wrong-place write, and is discovered after the
  fact.

  WHY THE FIX IS A CONTRACT AND NOT A CORRECTION. There is no correct working-copy
  value to emit at resolution time, because none has been created yet. The only honest
  output is that the question is not yet answered, said in a way a consumer cannot
  mistake for an answer. Emitting a plausible substitute is the specific behaviour
  being forbidden.

  WHY IT SITS UNDER BO-1900a. The L1 is that nothing is spawned against a target that
  has not been proven fit. A target whose working copy is undetermined is by
  definition not yet fit to dispatch against; the companion L3 BO-1900a-4-i states the
  refusal.
