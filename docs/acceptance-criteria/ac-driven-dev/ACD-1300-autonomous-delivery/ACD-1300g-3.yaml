estimated_complexity: L
it_requirements:
- Implement initial Codex SDK and Claude Agent SDK adapters behind one versioned result contract; configure
  executor/provider/model separately and validate supported combinations/credentials without substitution.
- Review has scoped read/check authority and must not silently edit the feature; bind invocation and result
  to the validated exact head and complete package.
- Increment and persist review invocation identity/count before dispatch; replay, repair or SDK failure
  cannot reset the maximum two automatic reviews.
- Normalize failed, malformed, timed-out and head-mismatched results to nonapproval; findings remain tied
  to AC IDs and head for local repair.
- Repair invalidates prior validation/approval; all review and nested calls use global capacity and off
  admission rules.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
