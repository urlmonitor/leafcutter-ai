created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  When a commit fails a gating hook whose tier requires judgment, the auto-fix path
  reads the originating agent identity from the hook's own output, loads that agent's
  latest context capsule from the ticket, and re-dispatches the SAME agent type to
  fix only what the hook requires — honoring the capsule rationale, reusing the
  consumers already checked, and never re-deriving the design. Mechanical-tier hooks
  keep the existing generic light-model route. The commit is retried once. The
  re-dispatched coder runs without spawning any sub-agents and degrades gracefully
  when no capsule exists.
depends_on: [BO-210, BO-210a, BO-210b]
