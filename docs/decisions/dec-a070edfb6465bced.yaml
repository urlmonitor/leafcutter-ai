options:
  - id: opt.wording_match
    title: deterministic wording or label matching
    description: 'Code groups a candidate with a category when its wording equals a preferred or alternative label, or shares
      the criterion id; otherwise content-word overlap with the category''s labels above a set threshold suggests membership.
      Everything else becomes its own one-member candidate category worded as the candidate, with no LLM. Cold start: with
      no categories, every candidate is its own candidate category. In a run: the same code check, no Jev call. No broader-link
      suggestions.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:refined_after_review
    approved_by: human:user
  - id: opt.embedding_assign
    title: embedding-similarity clustering of criterion questions
    description: 'Every criterion wording is embedded through a user-supplied embedding gateway (criteria become a new vector-eligible
      kind); a new candidate is assigned to the nearest published category above a similarity threshold, never re-clustering
      the library. Unassigned candidates are clustered among themselves by similarity into new candidate categories. Cold
      start: cluster all candidates. In a run: one embedding call per drafted question. Needs embeddings enabled and a model
      chosen.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:refined_after_review
    approved_by: human:user
  - id: opt.jev_pick_existing
    title: Jev judging 'same question?' for candidate pairs against existing categories
    description: 'Code first groups exact label or criterion-id matches. Then Jev answers one bounded choice per candidate
      over ALL existing categories (preferred plus alternative labels) plus ''none'' while the library fits one choice question;
      a merge is suggested only at p >= 0.8 (the trial''s 100% precision point). Candidates Jev leaves unassigned become one-member
      candidate categories made by code, worded as the candidate; no LLM. Cold start: no categories, so all candidates are
      one-member candidates. In a run: one Jev choice per drafted question within the run''s budget. No broader-link suggestions.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:refined_after_review
    approved_by: human:user
  - id: opt.llm_groups_all
    title: an LLM proposes the groupings for human approval
    description: 'Each mining round the host LLM reads all candidates and the published categories and proposes the full grouping:
      categories with preferred and alternative labels, members, broader links and a reason each, regrouping where it sees
      fit. Cold start: the LLM proposes the first library. In a run: an LLM call places a drafted question. A person approves
      every suggestion.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:refined_after_review
    approved_by: human:user
  - id: opt.cascade_adr053
    title: a staged mix ordered by ADR-053
    description: 'Code groups exact label or criterion-id matches. Jev then picks one existing category or ''none'' per candidate
      over all categories, accepted at p >= 0.8. Only the candidates still unassigned go to the host LLM, which groups them
      into new candidate categories, words their preferred labels and suggests broader links with a reason. A person reviews
      every suggestion. Cold start: the first round has no categories, so the LLM groups all candidates once; later rounds
      are mostly code and Jev. In a run: one Jev choice per drafted question; an unplaced question waits for the next mining
      round (no LLM in a run).'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:refined_after_review
    approved_by: human:user
