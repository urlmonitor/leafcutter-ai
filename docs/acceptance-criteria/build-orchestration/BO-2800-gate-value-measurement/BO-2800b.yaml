criteria: |
  Caught problems become countable instead of disappearing into prose.

  When a check catches something, it is recorded as an identifiable, categorised
  problem rather than a paragraph of English — so the same problem recurring
  across different pieces of work is recognisable as one recurring problem, and
  you can finally see what each check actually finds and how often.
