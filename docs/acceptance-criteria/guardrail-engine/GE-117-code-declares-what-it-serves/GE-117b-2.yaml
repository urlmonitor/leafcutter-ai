id: GE-117b-2
readiness: approved
priority: medium
title: "A well-formatted AC reference that points to no existing AC fails as invalid"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117b.yaml"
criteria: |
  Given a public function is new or changed in the staged commit
  And its docstring references an acceptance criterion whose identifier is well
    formatted but names no AC that exists in the store
  When the declaration check evaluates the symbol
  Then the check produces an invalid-declaration verdict for that symbol
  And the verdict records the unresolved AC identifier that was declared
  And the invalid verdict is distinct from the missing-declaration verdict (a
    reference to a non-existent AC is not treated the same as no reference)

  Given a public function is new or changed in the staged commit
  And its docstring references an acceptance criterion whose identifier resolves to
    an AC that exists in the store
  When the declaration check evaluates the symbol
  Then the check produces a satisfied verdict for that symbol
depends_on:
  - GE-117b
  - GE-117b-1
doc_links:
  - path: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117b.yaml"
    relationship: parent
