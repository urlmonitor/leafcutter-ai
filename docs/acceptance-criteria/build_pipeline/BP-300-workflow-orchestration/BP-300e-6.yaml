    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "status-checker.md's body contains an explicit 'return ONLY the JSON object/array, no prose or headings before or after' instruction for the machine-parsed dispatch path (template-content check, in the style of test_agent_self_description_validation.py)."
  - name: test_status_checker_template_carries_anomalies_inside_payload
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "status-checker.md's structured/example output carries anomalies inside the JSON payload (e.g. an 'anomalies' field) and no longer appends a trailing '## Anomalies' markdown section on the machine-parsed path."
  - name: test_all_machine_parsed_producer_templates_instruct_json_only
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Every agent template dispatched as a JSON.parse'd producer by templates/workflows-js/*.js (status-checker, ac-triage, pt-classifier, worktree-agent) carries the 'return ONLY JSON' output contract — class-level assertion derived from the workflow dispatch sites, not a hard-coded name list."
