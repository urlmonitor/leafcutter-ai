id: DK-100b-2
title: "The ranking is shown as advice, and the decision waits for your choice"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given options ranked by Jev's per-criterion scores, for example opt.kernel_entry_point ranked 1
    with a required-criteria mean of 0.80 and opt.consult_precedent ranked 2 with 0.48,
  When you are asked to choose,
  Then each option is shown with its rank, its result on each criterion and the evidence it cites,
    as evidence for your choice,
  And the decision stays unresolved until you answer: no option, including the one ranked 1, is
    selected for you,
  And every ranked option can be chosen, including one ranked below first.
