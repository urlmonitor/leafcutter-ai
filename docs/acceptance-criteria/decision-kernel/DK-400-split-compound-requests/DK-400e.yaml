notes: |
  FLOW NODES: split-run (step).

  SETTLED: children are work items of the run that split. They run one after
  another (no parallel children), and a part starts only after every part it
  depends on has settled. Each decided part stages its own decision record,
  whose question is the part's text (as edited, if the person reworded it). A
  research part returns findings, not a record. Every earlier decided part is
  named as precedent for the later ones, and its applicability is still judged,
  never assumed.

  This L1 carries the second half of TICKET-20261001-KernelCompoundGoalSplit:
  one decision record per sub-decision, linked to the goal. The link is
  Decision.split_part, a derived reverse view rather than a field of the record
  file, so published decision records keep their shape.

  CARRY TO L2 / IT PO:
    - FAILURE IS NOT IN THE FLOW. A part may fail to settle: its own decision
      is blocked, hits a gap or a budget stop, or is cancelled. DECIDED on
      2026-10-05: the PO recommendation is the default the BA uses (see DK-400
      "DECISIONS AT THE PO GATE", Q5). The parts that depend on it are marked
      not run with the reason, independent parts carry on, and the report says
      which is which. The mock data allows the outcome "not run", but the flow
      has no branch for a part that fails yet; the flow-author should add one.
    - Each child decision still goes through its own approval steps (options,
      criteria, the final choice). A split multiplies the questions a person is
      asked, which matters for the bounded-count setting the IT PO owns.
    - settled_by_human (a person answers a part directly) exists in the mock
      data only for the hand split. DECIDED on 2026-10-05 (DK-400 "DECISIONS AT
      THE PO GATE", Q4): hand splits are history only, so the kernel path does
      not offer settled_by_human (see DK-400f).

  DOCS: the kernel, its child work items and the person's gates interact in
  order (sequence-diagram).
