it_requirements: |
  ADR-018 Decision §1: the isolation primitive is an independent clone with its
  own object store, replacing the shared-`.git` worktree. Surface is the
  worktree-agent -> clone-agent migration (templates/agents/worktree-agent.md,
  templates/skills/feature/SKILL.md) plus the create/remove lifecycle helper.
  Object-store-sharing shortcuts (`git clone --shared`, `--reference` WITHOUT
  `--dissociate`, and `git worktree`) are explicitly disallowed for autonomous
  drives. IT-PO: confirm whether the clone mechanic lives in a python helper, the
  worktree-agent template, or both; keep the create/remove interface stable so
  /build-feature and finalize call sites are unchanged.
