  agent: approve_acs
  date: '2026-10-01'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  A GATE THAT ALWAYS FIRES GETS TURNED OFF, WHICH IS THE SAME OUTCOME AS NO
  GATE. This is the negative control for AR-300b-1 and the reason the counts are
  restated on the clean path: without them, 'no delivery failure' and 'the
  delivery check did not run' produce the same output, which is precisely the
  ambiguity AR-300b exists to remove.
