criteria: |
  Given the documentation set for the build pipeline,
  When a reader opens the web-app CI gate documentation,
  Then a sequence diagram shows the flow from a pull request that changes the web
    app, through the automated build/type-check check running, to the pass/fail
    result being reported on the pull request and gating the merge decision,
  And the diagram identifies the participating actors: the pull request, the CI
    system running the check, and the merge gate.
