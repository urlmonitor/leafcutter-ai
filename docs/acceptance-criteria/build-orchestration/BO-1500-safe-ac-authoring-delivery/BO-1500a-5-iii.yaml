assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Parse ONLY the last non-empty line of wtParsed.output: split on /\\r?\\n/, trim each line, drop
    empty ones, and JSON.parse the last one. Never parse the whole output, never the first line, and
    never search earlier lines for the first or any line that parses -- a payload followed by
    further output is not a confirmed setup."
  - "Keep the fail-closed posture of BO-1500a-5 / BO-1500a-5-i unchanged: when the last non-empty
    line does not parse, or parses to something with no non-empty worktree_path, fall through to the
    existing no_workspace_named / silent_success halt exactly as today. Do not add any new path that
    continues without a payload."
  - "Keep the change line-neutral or shrinking. templates/workflows-js/plan-feature.js is over the
    check-file-size ratchet: fold the existing 3-line `if (...) { wtPayload = JSON.parse(...); }`
    block into one line. Never SKIP check-file-size."
  - "Edit only templates/workflows-js/plan-feature.js (the canonical source); the deployed
    .claude/workflows/plan-feature.js is regenerated by the build."
  - "Do not touch the producer: setup_ticket_worktree.py already writes only the payload to stdout
    (BO-1500a-1-ii). This record tolerates the setup AGENT's relay merging stderr into the reported
    output, which the producer cannot control."
test_spec:
  - name: test_progress_lines_before_the_payload_still_confirm_isolation
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: "templates/workflows-js/plan-feature.js run under the E2 harness (run_workflow_under_e2)"
    description: "Stubs the 'worktree-setup' reply with exit_code 0 and an output of the three
      '[already_installed] <stage>' lines from the live incident followed by a create-ac-worktree
      JSON payload naming a worktree_path, branch and ac_store_path; asserts the run does not halt
      with any setup_failure_kind, that the first authoring agent (ac-triage) is dispatched, and that
      a post-setup dispatch prompt carries the payload's worktree_path, proving the payload was
      adopted rather than defaulted."
    must_catch:
      - "the original defect: JSON.parse of the whole trimmed output, which fails on the leading progress lines and halts as no_workspace_named"
      - "parsing the FIRST line of the output, which is a progress line"
      - "the parse is tolerated but authoringWorktreePath is left null or defaulted, so the run continues without the payload's worktree_path"
  - name: test_trailing_blank_lines_and_crlf_endings_after_the_payload_are_ignored
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Same stub as above, but every line ends in CRLF and the output ends with an empty
      line and a whitespace-only line after the payload; asserts the run still proceeds to ac-triage
      with the payload's worktree_path adopted."
    must_catch:
      - "taking the literal last line (split on newline, no blank-line skip), which is empty or whitespace and fails to parse"
      - "dropping only zero-length lines without trimming first, so a CRLF output's trailing '\\r' or whitespace-only line counts as the last non-empty line and fails to parse"
  - name: test_non_payload_last_line_still_halts_as_no_workspace_named
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Stubs the 'worktree-setup' reply with exit_code 0 and an output whose earlier line is
      a well-formed payload but whose last non-empty line is a progress line; asserts the run halts
      with status 'error' and setup_failure_kind no_workspace_named and that no authoring agent
      (ac-triage, pt-classifier, product-owner, business-analyst, it-po) appears in agent_calls."
    must_catch:
      - "scanning every line for the first or any line that parses as JSON, which accepts a payload followed by unrelated output and loosens the fail-closed gate"
      - "a parse failure on the last line falls through to authoring instead of reaching the no_workspace_named halt"
test_rationale: "The defect is in how the Pre-Stage-0 result handler interprets the setup agent's
  relayed reply, so every test drives the real handler in templates/workflows-js/plan-feature.js under
  the E2 harness and asserts on the one observable that separates a working gate from a broken one:
  whether the first authoring agent is dispatched, and with which workspace. A direct test of a
  line-splitting helper would stay green while the handler kept calling JSON.parse on the whole
  output. The positive case reproduces the live incident's exact output, which is what the original
  code halts on. The boundary case is separate because the two cheapest wrong implementations -- take
  the literal last line, or drop empty lines without trimming -- both pass the positive case and fail only
  when trailing blank lines or CRLF endings appear, which is the normal shape of shell output on this
  Windows host. The discrimination case is the one that keeps this fix from loosening BO-1500a-5's
  fail-closed gate: an implementation that searches all lines for any parseable JSON passes both
  positive tests and is rejected only when a payload is followed by further output. The existing
  four-shape tests in test_bo_1500a_5_i.py are the regression guard for the halt paths and are not
  repeated here."
