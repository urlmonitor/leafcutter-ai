title: "The pre-existing orphan backlog is not swept up by the exemption"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200b.yaml
criteria: |
  Given the real AC store, over which the store-wide orphan scan reports a
    baseline of 60 orphans before this feature lands, of which 54 belong to
    trees that pre-date the parked convention and carry no marker,
  When the orphan scan is executed as a process over the same store after the
    exemption lands, with the marker added only to KM-200.yaml,
  Then all 54 pre-existing orphans are still reported, each by id,
  And the reported total falls by exactly the number of records excused by a
    marker on their derived parent, and by no more,
  And no record disappears from the report unless a marker exists on its derived
    parent,
  And the two runs are compared record by record rather than by total alone, so
    an equal count made up of a different set of records does not satisfy this
    criterion.
depends_on:
  - ACS-1200b
  - ACS-1200b-2
