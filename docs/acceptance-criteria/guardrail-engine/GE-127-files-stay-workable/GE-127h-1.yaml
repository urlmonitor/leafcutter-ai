notes: |
  Item 7, user decision D1. Measured by the BA on 2026-10-16 with the rule in force
  (_file_size_ratchet.count_content_lines): it ALREADY discards triple-quoted strings and
  block comments and counts every other line, including "#" and "//" comments. So a history
  block inside a module docstring or a /* */ header is already free today, and the history
  block in its doc-enforcer form (line comments, usually at the end of the file) is counted.
  This record therefore removes the line-comment history block only and keeps every other
  part of the rule "as before", as GE-127h says. See the open question in the BA report on
  D1's wording "docstrings and JSDoc still count". Forms found in scripts/ and templates/ on
  2026-10-16: about 245 "# DECISION HISTORY" line-comment headings, of which ~160 have "="
  rule lines above and below, ~50 have none and ~36 only below; one "// DECISION HISTORY" in
  JavaScript. The block definition therefore must not require a rule line.
