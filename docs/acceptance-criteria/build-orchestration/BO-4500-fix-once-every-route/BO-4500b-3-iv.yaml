notes: |
  (c) and (d) are the discriminators for the plausible wrong version "decide by the code's prefix":
  it would retry step_disk_full and stop on policy_made_up. BO-4500a-4 requires membership in the
  published list. The second scenario proves the list reaches the block from configuration (the
  BrainCandy final-gate rule "not part of the code but some config file"), not from a copy typed into
  the block. (e) is fail-closed on a contract the block was not written for, even on a success.
