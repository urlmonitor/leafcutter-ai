    date: '2026-09-01'
    by: safety-security-expert
    entry: >-
      DO NOT flip this to done just because covered_by is fully done. Nothing here
      changed except this note; criteria, title, level and depends_on are untouched.

      TKT-600a-1 went done on 2026-09-01, and it is the only child. That normally
      licenses closing the parent, so the reason it stays open is recorded here
      rather than left to be inferred: this L1 asks that files_touched "name only
      real edit-surface files", and one case still escapes — an illustrative path
      that both has a file extension and exists on disk is still harvested. The
      child's criteria were deliberately narrowed to exclude that case, because
      deciding it requires reading intent out of English prose and two mechanisms
      for that were tried and rejected. See TKT-600a-1's amended_by entry of
      2026-09-01 for the measurements.

      So the child is honestly done against what it now promises, and this parent is
      honestly not, against what it still promises. Closing this needs either a new
      child covering the remaining case with a mechanism that is not phrase-matching,
      or an explicit decision to narrow this L1 too.
