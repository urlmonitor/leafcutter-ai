    relevance: >-
      Its notes: an implementation permitting the undeclared population to grow
      under any routine condition (a generated block, a large mechanical edit, a
      merge) breaks the promise even if every hand-written scenario passes; any
      exception must be decided explicitly and recorded, never defaulted.
  - path: templates/scripts/commit_guardian/check_test_ac_tags.py
    relationship: modifies
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The verdict must not depend on the size of the change, the number of tests added, whether the content looks generated, or whether a merge is in progress (MERGE_HEAD present); no such condition may short-circuit the comparison unless an exemption is explicitly configured and recorded."
  - "For a merge commit the 'before' count is the file's undeclared count at HEAD (the branch being merged into), the same baseline an ordinary commit uses."
  - "The check must actually run on merge commits. As registered today (stages: [pre-commit] only, pass_filenames: true, change set handed by the commit path) it is likely never invoked on a merge made by `git merge`, which runs the pre-merge-commit hook rather than pre-commit, and even when invoked the pre-commit framework hands a clean, conflict-free merge few or no filenames. The implementer must verify this on a real merge and, if it holds, close the gap (for example by having the hook derive the merge's changed test files itself); a merge path that skips the check is the defect this record forbids, not an accepted limitation."
  - "The refusal output for a bulk or merge increase must use the same format as a one-test increase (file, before, after, new undeclared names)."
delivers_to: null
expects_from:
  ac_id: GE-128a-2
  contract: "The per-file ratchet verdict { path: str, before: int, after: int, new_undeclared: list[str], verdict: 'refuse' | 'allow' } computed against the file's HEAD version; this record requires the same verdict for bulk, generated and merge changes."
