id: INF-500b-3-i
title: "Trend detection uses >20% threshold for rising/falling classification"
component: infrastructure
level: L3
status: active
work_status: todo
created_by: "tickets/00_inbox/TICKET-20260603-FeedbackAnalysisPipeline.md"
criteria: |
  Given feedback entries spanning two 7-day windows
  When the current window count exceeds the previous by more than 20%
  Then the trend indicator for that category is "rising"
  When the current window count is below the previous by more than 20%
  Then the trend indicator is "falling"
  When the difference is within 20%
  Then the trend indicator is "stable"
