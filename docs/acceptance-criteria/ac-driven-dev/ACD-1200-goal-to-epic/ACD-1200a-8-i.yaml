    target_dir: unit_tests/ac_store/
    type: integration
    angle: failure
    description: "Running the commit-time gate over the generated Master_Plan with a copy of the real configuration whose required set has one extra field rejects the file. This proves the coverage follows the gate's own required set. The test holds no list of field names of its own."
  - name: test_requires_rollup_with_no_ticket_values_still_passes_both_gates
    target_dir: unit_tests/ac_store/
    type: integration
    angle: boundary
    description: "An epic whose tickets declare no requires_diagram or requires_adr value still produces a Master_Plan that both real gates accept."
  - name: test_master_plan_gates_hold_through_the_goal_to_epic_entry_point
    target_dir: unit_tests/ac_store/
    type: integration
    angle: reachability
    description: "The same acceptance holds when the epic is generated by running goal_to_epic --ids as a subprocess, rather than by calling the renderer directly."
test_rationale: "The defect is a producer drifting away from its gates, so a test that lists field names is a second copy that drifts the same way. Only running the real gates over a really generated file proves acceptance, and it keeps proving it when a gate's required set changes; the added-field case shows the test notices that change. The title round trip is separate because EPIC titles routinely contain ':', which a hand-assembled line breaks."
