id: BO-2500b-1-ii
components:
  - build_orchestration
  - commit_guardian
title: "A done composite is proven by its children, not by a covers tag it can never legitimately carry"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an L0 or L1 composite acceptance criterion whose work_status is done, and whose
    every child listed in covered_by is itself done and does carry a "# covers: <child-id>"
    or "// covers: <child-id>" tag somewhere under the test root,
  When the pre-commit proof-of-done check scans that staged composite record,
  Then the check treats the composite as proven by its children and reports no violation
    for it, without demanding a covers tag naming the composite's own id,
  And a done composite whose children are NOT all done-and-covered is still reported as a
    violation, naming the unproven children, so composites are never skipped unconditionally,
  And an L2 or L3 leaf acceptance criterion marked done still requires its own covers tag,
    reported with the unchanged message, so the leaf path is not weakened,
  And the bug symptom ("An L0/L1 composite acceptance criterion marked work_status: done is
    reported as a violation — "no '# covers: <id>' or '// covers: <id>' tag found anywhere
    under <test_root>" — and blocks the commit, even when every one of its children is itself
    done and properly covered. Observed live on 2026-09-07 committing GE-127b (an L1 whose
    only child GE-127b-1 was done and tagged): the commit was refused until a
    `# covers: GE-127b` tag was hand-added to a test. The same wall was hit again on
    GE-127a.") must not occur
