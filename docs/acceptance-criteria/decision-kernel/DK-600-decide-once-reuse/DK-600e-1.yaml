assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - Lookup reads only docs/decisions/index.json and the files it lists; a file whose sha256 no longer
    matches its index entry is skipped with a warning, never served.
  - A missing or unreadable index or store yields no precedent and a warning; the decision continues
    without it.
  - Thresholds, caps and limits are read from the kernel configuration by key (config/kernel_config.default.json);
    no number quoted in the criteria is hard-coded, and a test that pins a default also shows the
    behaviour follows an overridden value.
  - 'During a run the kernel only reads the repository (ADR-060): no file under the repository root
    may change; the configured run root is the only place a run writes.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
