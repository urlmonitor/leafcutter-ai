it_requirements:
  - "Edit the canonical template at templates/skills/security-scanner/scripts/scan_secrets.py and propagate with build.py; the deployed copies are build outputs and must never be edited directly (ADR-001)."
  - "Reuse the single allowlist-diagnostic convention already established for this file — a message on the error stream carrying the allowlist file path, the 1-based line number and the verbatim line text, one message per offending line. Do not introduce a second message shape for the new class."
  - "Classification is never fatal: an unmatchable entry must not raise and must not change the scan's exit status, which stays determined by the surviving findings alone."
  - "Allowlist diagnostics go to the error stream only. The findings report on the standard output stream, which the pre-commit check parses, must stay free of them."
  - "The decision must be reachable from the entry text alone, with no filesystem access per entry: an entry is judged on what it says, never on whether the file it names exists."
  - "The value classified must be exactly the value the loader stores for that field, so the accepted/rejected boundary is the same one the matcher later compares against — a divergence between the value validated and the value stored reintroduces the defect in a new place."
  - "Do not repair, strip or otherwise guess at the author's intent for a rejected value; the entry is reported and skipped."
  - "This code runs on every commit: classification must remain a single linear pass over the allowlist with no per-entry I/O, and must not measurably lengthen the hook's runtime for an allowlist of a few hundred entries."
  - "Load-time rejection must not weaken the matcher's own independent guard against directly-constructed allowlist tuples (GE-113c-3-v); both layers stay in force."
  - "Tests must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root — the live file is what the commit hook actually reads, so a stray write would disable the real gate as a side effect. Every fixture allowlist lives under tmp_path/tempfile."
  - "Fixture files must use ordinary source filenames. The per-file scan short-circuits environment-named files to a single filename-based finding and never reads their content, so such a fixture cannot produce the content findings these criteria depend on."
test_spec:
  - name: test_appended_note_in_line_number_field_warns_and_suppresses_nothing
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "With a tempfile-backed allowlist whose fourth line is a three-field entry followed by a trailing note, and a real source file on disk carrying a high-entropy token, the multi-file scan entry point still returns the ENTROPY_HIGH finding, the error stream carries exactly one warning naming the allowlist path, line 4 and the verbatim line text, and the entry is absent from the loaded set."
  - name: test_non_numeric_line_number_fields_each_warn_and_are_skipped
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Two entries whose third field is a word-spelled number and a digit-plus-letter value each produce their own warning with their own 1-based line number and verbatim text, neither is loaded, and the finding they aimed at is still reported."
  - name: test_wildcard_and_decimal_line_numbers_load_silently_and_suppress
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "The two accepted values for the field — the wildcard marker and a decimal line number — load with an empty error stream and both target findings are suppressed, so the rule cannot be satisfied by warning about ordinary entries."
test_rationale: |
  Every arm is exercised with a real tempfile-backed allowlist and real files on
  disk through the multi-file scan entry point the pre-commit check calls, because
  a sibling audit in this family found two criteria that passed while calling the
  matcher with hand-built tuples and describing situations the real entry point can
  never produce. A direct-import test of the loader would prove the string exists;
  it would not prove the finding survives to the caller, which is the whole claim.
  This is the deliberate tempfile departure recorded in the existing suppression
  test module, not a break with its conventions.
