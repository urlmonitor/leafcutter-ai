criteria: |
  Given the configurable confidence floor is set to 0.75,
  And entry F1 was classified with confidence exactly 0.75,
  When the router applies the confidence-floor gate,
  Then F1 is treated as meeting the floor and is allowed to proceed to its
    routing destination (the comparison is "confidence is at or above the floor",
    not "strictly above"),
  And an entry classified at 0.7499 is parked while an entry at 0.75 proceeds,
  And the boundary behavior is identical on repeated runs with the same floor.
