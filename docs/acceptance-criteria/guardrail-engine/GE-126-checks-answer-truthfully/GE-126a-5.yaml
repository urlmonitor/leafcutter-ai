assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "The three clauses must be written so a test can read them out of the shipped document and drive one behavioural case per clause. A prose paragraph that states all three in one sentence cannot be walked, and the coverage note demands that it is."
  - "The reference must name check_ac_governance explicitly and must not assert the contract holds for any other member of the family. GE-126e is what would establish that; asserting it now ships an unmeasured claim as documentation, which is how this defect family propagates (L0 standing rule)."
  - "The dated observation must be recorded as a dated observation - the date and what was run - not paraphrased as a rule. This component has repeatedly had measurements repeated at higher confidence than they were recorded at."
  - "The removal clause is a deletion obligation: assert the superseded statement is ABSENT from the reference material, not merely that the contract has been added."
  - "The contract must be stated once. If any other document needs it, that document routes to this one rather than restating it - ACS-100i-9's finding is that two paraphrases of one rule become two rules."
  - "The reference must state that the contract governs the interrogation surface and does not by itself decide whether a commit is blocked, so a reader does not infer that the component's deliberate fail-open convention (GE-116a-1-iii) has been repealed."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the page."
test_spec:
  - name: test_each_documented_clause_is_driven_against_the_deployed_check
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "The test reads the three contract clauses out of the shipped reference and, for each, runs the deployed check in the case that clause describes - named-and-resolved, named-and-unresolved, nothing-named - asserting the observed outcome matches the clause."
  - name: test_named_and_resolved_clause_is_proven_by_a_refusal_not_a_pass
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: criterion
    description: "The first clause's case is driven with a record that genuinely violates the rule, so 'is examined' is proven by a refusal. Driving it with a clean record proves nothing - a check that dropped the argument also passes that."
  - name: test_reference_names_only_the_repaired_check_and_asserts_nothing_wider
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "The reference names check_ac_governance as the carrier of the contract and makes no claim about any other member of the family or about the family as a whole."
  - name: test_pass_on_an_unread_argument_advice_is_absent_from_the_reference
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: failure
    description: "No statement remains anywhere in the reference material that a check may report success on an argument it did not read - the deletion is asserted, not just the addition."
test_rationale: |
  The distinguishing risk for a reference page is that it states a contract the code
  does not honour, and no amount of string assertion detects that. Reading the clauses
  out of the shipped document and driving one behavioural case per clause is what binds
  the two, and it is why the first descriptor is an integration test against the
  deployed copy rather than a docs unit test. The second descriptor exists because the
  natural case for "a named target is examined" is a clean record, and a clean record
  is passed identically by a check that never read it — the same trap GE-126a-1 names.
  The third descriptor enforces the L0's no-widening rule mechanically rather than
  leaving it to a reviewer's memory.
