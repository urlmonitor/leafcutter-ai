estimated_complexity: S
it_requirements:
  - "The target document has no suppression section today — its headings cover creating, modifying, disabling and deleting a hook, and troubleshooting. This is a new section, not an edit to an existing one, and it must be reachable from the document's own navigation rather than buried at the end."
  - "The warning text shown must be COPIED from what the check actually prints, not paraphrased. Take it from the implementation settled by the announcement criterion, after that criterion is green — a how-to that shows a message nobody ever sees sends the reader looking for the wrong thing."
  - "Keep the task guidance here and the grammar-plus-rejection list in the reference document. Two copies of the same grammar drift, and the sibling reference AC owns that copy."
  - "Illustrative entries must use ordinary source filenames and must not contain credential-shaped literals: this file is itself scanned on every commit, and a realistic-looking example would either trip the check or have to be suppressed, which is a self-inflicted instance of the defect being documented."
  - "Do not use an environment-file name as a generic example. The per-file scan short-circuits those to a single filename-based finding and never reads their content, so such an example would be unreachable and misleading."
  - "Documentation check for this AC: (1) the document contains a suppression section that names the allowlist file and describes all three parts of an entry, including that the third part is either a decimal line number or the marker meaning every line; (2) it shows the rejected appended-note spelling and the accepted note-on-its-own-line spelling side by side; (3) it states that an unmatchable entry is reported naming the file and the line, is then ignored, and does not on its own block the commit; (4) the warning wording it shows is character-identical to what the check prints."
  - "Verification is by review against the shipped behaviour, not by an automated test. Do not author code tests for this AC."
test_required: false
test_rationale: |
  This AC changes prose only, so it carries no executable behaviour and
  test_required is false rather than test_spec being left empty. Its verification
  is the four-part documentation check recorded in it_requirements, performed
  against the behaviour the announcement criterion actually ships. The one clause
  that could rot silently is the quoted warning wording; it is protected here by
  ordering — this AC depends on the announcement criterion — and by the parity arm
  the sibling reference AC carries.
