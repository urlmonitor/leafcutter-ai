work_status: todo
criteria: |
  Given a ticket has change_target: infra and risk_surface: contract,
  When the guardrail engine resolves the applicable quality gates,
  Then the resulting guardrail set contains these mandatory gates:
    - plan_review: a dry-run or plan output is generated and reviewed before apply
    - blast_radius_label: the ticket is labeled with the scope of affected systems
    - standard_tdd: tests are written before implementation and verified after
  And the plan_review gate requires a human or architect sign-off before the
    change is applied
  And the blast_radius_label gate produces a label identifying which downstream
    systems or environments are affected
