title: "A craft's sign-off carries no outcome for a capability it had no means to invoke"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a craft completed its work in a run that left one of the two quality capabilities
    its own instructions require out of that craft's reach,
  When the craft's sign-off is assembled,
  Then the sign-off offers no pass-or-fail outcome for the capability that was out of
    reach,
    And it instead names that capability as one the run made unavailable to it,
    And a sign-off that states an outcome for a capability the craft could not invoke is
      refused by the run,
  So no craft produces a result line for a check that never ran.
