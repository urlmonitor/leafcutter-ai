documentation_rationale: >
  No new user-facing surface, command, or interaction flow is introduced. This
  L1 adds one more class of finding (untracked deployable-script source) to the
  build's existing deployment-completeness guard family, whose timing and
  reporting conventions are already documented by BP-900b/BP-900c and the
  PROJECT_CONTEXT boundary map. The seam against BP-900b / BP-900e / BP-1000a is
  captured in this AC body and the child AC bodies, which are the authoritative
  specification for the implementing agent.
