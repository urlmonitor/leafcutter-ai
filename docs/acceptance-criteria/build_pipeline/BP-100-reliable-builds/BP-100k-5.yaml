    entry: "Corrected the H-1 evidence, which overcounted. The original notes claimed ~512 unrecorded deployed files under the runtime deploy tree (97%); that double-counted the agent-platform directories, which are symlinks into the runtime tree and are already covered under their canonical keys. Accurate measurement (manifest keys vs files on disk, __pycache__ excluded): 253 of 528 deployed files unrecorded (48%), broken down as 2 skills, 56 gemini, 181 scripts, 5 config, 5 deployed-claude, 4 miscellaneous. The sharper finding now recorded in notes: only 2 of the 253 produce a GAP line; the other 251 are silent, and all 181 deployed script files — every commit-guardian hook, including both drift gates — are policed by nothing. Rewrote notes; corrected the scope-warning constraint from 'several hundred' to ~253; added four it_requirements constraints (the _canonicalize_output_path/_OUTPUT_REL_TO_CANONICAL root cause, the record-a-failed-translation-as-manifest-data rule, the 251-silent-vs-2-reported shape, the gates-must-police-the-gates requirement, and a symlink double-counting warning); sharpened the check_output_drift.py and build_helpers.py doc_link relevance; added three test_spec descriptors (unresolvable-mapping recorded not dropped, multi-segment mapped directory not excluded, deployed gate scripts in the examined population); softened one criteria phrase from 'several hundred deployed files' to 'a substantial share of the deployed files' so no criterion carries the retracted number. criteria substance, id, title, level, assigned_agent, estimated_complexity, priority, readiness, work_status, delivers_to's core contract and expects_from otherwise unchanged."
