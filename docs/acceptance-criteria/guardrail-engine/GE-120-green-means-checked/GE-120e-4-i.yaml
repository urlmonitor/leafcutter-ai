notes: |
  THE SIGNAL-AVAILABILITY EDGE CASE. GE-120e-4 requires two signals — the states the commit
  is built on, and the record of the operation in progress. This case is the one where the
  second has expired and the first has not, and it is the natural trap for an implementation
  that reads the operation record first and treats its absence as "ordinary commit". Every
  merge fixture in this L1 has the record present, so nothing else here can fail on it.

  It is also not hypothetical: revising a merge is the routine response to a check blocking
  that merge, which makes it the very next thing the author does after hitting the defect
  this L1 removes. A fix that works on the merge and breaks on the revision hands the author
  back the override reflex one step later.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
