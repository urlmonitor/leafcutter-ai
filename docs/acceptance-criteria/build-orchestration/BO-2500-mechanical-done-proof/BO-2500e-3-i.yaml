id: BO-2500e-3-i
components:
  - build_orchestration
  - testing_quality
title: "When the JS runner is unavailable, JS-covered ACs fail closed"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC covered only by "// covers:<id>" tests but the JS test runner (vitest) cannot
    be invoked (not installed or unavailable in the environment),
  When the done-status of that AC is evaluated,
  Then the AC cannot be marked done and the verdict names the unavailable JS runner as the reason,
  And the oracle does not skip the JS-covered AC or treat the missing runner as a pass,
  So an absent runner fails closed rather than silently passing front-end work.
