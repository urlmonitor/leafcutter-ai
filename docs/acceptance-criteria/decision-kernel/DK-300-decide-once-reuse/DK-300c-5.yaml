  waits on documentation.

  Produced because DK-300c declares documentation_triggers: [reference-doc,
  sequence-diagram]. Four staging steps plus two documents exceed the five-L2 cap,
  so the two documents sit as L3s under this one documentation L2 rather than
  under a behaviour: hanging them under DK-300c-2 or DK-300c-3 would make those
  behaviours composites that could not be done until the documents were written,
  and the staging steps would never show as built in the Atlas. Precedent for
  documentation L3s: ACD-2000b-3-i.

