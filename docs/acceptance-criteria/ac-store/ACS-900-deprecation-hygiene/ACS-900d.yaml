criteria: |
  Remove the code, or re-point it to the successor, and the retirement commits without friction.

  When a requirement is retired and its implementing code has genuinely been
  removed — or, for a superseded requirement, correctly re-pointed to its
  successor — the commit proceeds with no block. The check produces no false
  positives, so developers trust it instead of working around it.
