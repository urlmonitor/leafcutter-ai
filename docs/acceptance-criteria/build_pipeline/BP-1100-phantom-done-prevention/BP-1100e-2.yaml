assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "CONFIG MODEL — mirror the existing duplicate_code / diff_coverage gating contract EXACTLY: add a top-level 'files_touched_reconciliation' section to commit_guardian.json with two boolean keys 'enabled' and 'strict', BOTH defaulting to false. Do NOT introduce a single 'mode' key — consistency with the existing enabled+strict commit_guardian contract wins. enabled:false means the check is off; enabled:true + strict:false = ADVISORY (report, do not block); enabled:true + strict:true = BLOCK on a real mismatch. The advisory/fail-open posture is the shipped default."
  - "Fail-open on INTERNAL error is orthogonal to the enabled/strict config: any exception in computing the verdict causes the check to not block (report to stderr, exit non-blocking), so a script error never strands a ticket — regardless of the strict setting."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): specific exception types, log at WARNING or higher, never swallow silently."
  - "PORTABLE per ADR-001: the check + its commit_guardian.json 'files_touched_reconciliation' section (enabled:false, strict:false defaults) ship to consumers via build.py, kept in parity via the build.py round-trip (canonical source = templates/scripts/commit_guardian/commit_guardian.json); it must NOT rely on the leafcutter repo's own root CLAUDE.md."
