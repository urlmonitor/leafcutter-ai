level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a subagent named python-coder (not the commit specialist),
    and each of these commands, none of which records a commit:
    (a) `gh pr create --title "docs: rule" --body "git commit must never be called directly"`,
    (b) `grep -rn "git commit" docs/`,
    (c) `awk '/git commit/ {print FILENAME}' CLAUDE.md`,
    (d) `git log --grep "git commit" --oneline`,
    (e) `echo "then run git -C ../wt commit -F msg.txt" > handover.txt`,
    (f) `git status && echo "next step: git commit"`,
    (g) `git commit-graph verify`,
  When each is issued,
  Then none is refused by the commit guard: each runs and its output is returned to the caller,
    And no refusal or warning naming the commit rule is produced for any of them.

  Given the same seven commands issued by the top-level session in the default interactive mode,
  When each is issued,
  Then the commit guard raises no commit permission prompt for any of them.
