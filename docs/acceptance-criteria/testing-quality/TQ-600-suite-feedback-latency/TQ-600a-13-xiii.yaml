it_requirements:
  - >-
    WHERE THE HISTORY COMES FROM. The correctness workflow's verdict job reads the
    `post-merge-verdict` artifacts of the previous four settled runs on main (`actions:
    read`; a bounded, fixed number of reads) and counts each test's passed-on-retry
    occurrences. Reading the run history rather than the notice keeps the escalation
    inside decision A: the verdict never depends on an issue. A missing or unreadable
    earlier artifact counts as zero occurrences for that run, and the verdict file says
    how many earlier runs were actually read, so a short history is visible rather than
    mistaken for a clean one.
  - >-
    THE THRESHOLD — ACCEPTED BY THE OWNER AS A TUNABLE DEFAULT (2026-10-08): two in the
    last five settled runs, current included, read from `flaky_red_threshold` and
    `flaky_window_runs` in scripts/ci/post_merge_tunables.json (TQ-600a-13-x), never a
    literal. At about ten merges a day five runs is about half a day. "Settled" is
    scripts/ci/_run_history.py's rule, so superseded cancellations never fill the window.
  - >-
    THE READS ARE BOUNDED AND FROM MAIN'S OWN RUNS. One run-history page (already read by
    the verdict job's selection) plus, per earlier settled run (at most window-1 = 4), one
    artifact list and one artifact download — at most 9 requests, `actions: read`. The
    window is computed in the verdict job and written into the verdict file
    (`pass_on_retry_window`, `window_runs_read`, TQ-600a-13-ii), so the notice job writes
    the flaky notice without re-reading history.
  - >-
    THE NOTICE is the follow-up workflow's notice job with a third label
    (`post-merge-flaky`), non-holding, description rewritten each run, closed when the
    window is clean. NOT-REPRODUCED REDS (red at commit X followed by green at X) are
    detected by the same run-history function as TQ-600a-13-x's demotion counter and the
    failing ids named come from the red run's verdict artifact (one extra read on that
    path only).
  - >-
    THE TESTS COST UNDER 0.3 s. In-process verdict computation over served earlier
    artifacts and notice writes against the shared fake server.
delivers_to:
  - agent: python-coder
    ac_id: TQ-600a-13-ii
    contract: >-
      The `repeated_pass_on_retry` list in the verdict file, non-empty only when the
      threshold is met, which makes `verdict` red.
expects_from:
  - ac_id: TQ-600a-13-ii
    contract: >-
      Per-run `passed_on_retry` lists in the `post-merge-verdict` artifact, the verdict
      job's `actions: read` scope, scripts/ci/_run_history.py and the tunables file.
  - ac_id: TQ-600a-13-iii
    contract: >-
      The notice job and applier, extended to the `post-merge-flaky` label.
test_spec:
  - name: test_tq600a_13_xiii_repeated_pass_on_retry_is_red
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_suite.py's verdict computation, in-process, against the recording fake server serving earlier runs' verdict artifacts"
    description: >-
      Test B passed on retry in one of five: green, B on the flaky notice with count 1.
      In two of five: red, B in `repeated_pass_on_retry`.
  - name: test_tq600a_13_xiii_the_count_ignores_the_notice
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_suite.py and post_merge_notice.py against the fake server"
    must_catch:
      - "the count is read from the flaky notice, so a closed or never-written notice resets it"
      - "a timing-lane test escalates"
      - "an unreadable earlier artifact is treated as a clean run without saying so"
      - "the flaky notice changes the hold verdict"
    description: >-
      Serve two earlier passed-on-retry occurrences with no flaky notice at all: red.
      Serve one unreadable earlier artifact: the verdict states four runs read. A
      timing-lane verdict with two passed-on-retry occurrences: green. A superseded
      cancellation inside the window is skipped, not counted as a run.
  - name: test_tq600a_13_xiii_the_flaky_notice_lifecycle_and_not_reproduced_reds
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py's applier, in-process, against the recording fake server"
    must_catch:
      - "a run with no passed-on-retry test writes to the flaky notice"
      - "the flaky notice stays open after a clean window"
      - "a red followed by green at the same commit is not named as a timing-lane candidate"
    description: >-
      A verdict with one passed-on-retry id: notice created with the id, the run link and
      its window count. A clean verdict inside a dirty window: no write. A clean window:
      notice closed. A red at X then green at X: the failing ids named as candidates.
test_rationale: |
  The escalation rule is what turns "pass on retry may be the defect" from a sentence
  into a gate. Its count must come from run history, or decision A's independence from
  issue state is lost through the back door. Milliseconds; under 0.3 s.
