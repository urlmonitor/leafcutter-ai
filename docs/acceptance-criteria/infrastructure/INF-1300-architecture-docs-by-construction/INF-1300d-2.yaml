id: INF-1300d-2
title: "A place that is already taken is reported as taken, and nobody's document is overwritten"
component: infrastructure
components:
  - documentation_system
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300d.yaml"
criteria: |
  Given a document already exists at the destination asked for,
  When production is requested,
  Then nothing at that destination is altered and nothing is written, and the
    refusal names the destination and says it is occupied,
  And given instead the destination is free but the collection already holds a
    document at the same tier and number under a different name,
  When production is requested,
  Then it is refused on that ground, the refusal names the document already
    holding that tier and number, and says which number at that tier is free,
  And the number reported as free is one that no document in the collection uses,
    found by looking at the collection as it stands rather than by counting
    entries in any one folder,
  And in neither case is any other file touched — not the intended parent's list
    of the documents below it, not the collection's index, and not a partially
    written file at the destination.
