test_required: true
test_rationale: |
  A test that asserts specific example artifact names are absent is satisfiable by renaming
  them. The load-bearing assertion is the total count being zero, which no renaming can
  satisfy, paired with an assertion that the example product is still reachable on request so
  the requirement is not discharged by deleting it.
test_spec:
  - name: test_fresh_install_record_holds_zero_artifacts_of_every_type
    target_dir: unit_tests/product_truth/
    description: "Enumerating the installed project's record returns zero journeys, zero example datasets and zero screens."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_example_product_is_still_obtainable_on_explicit_request
    target_dir: unit_tests/product_truth/
    description: "Asking for the example product by name returns its artifacts, so the separation is not achieved by deletion."
    type: integration
    angle: criterion
    framework: unittest
notes: |
  BOUNDARY WITH UXP-700d. This AC is about what the INSTALL writes into a consumer project.
  UXP-700d is about how the example content is kept apart from a project's own record and its
  own work queue INSIDE a store that holds both. They are different failures closed by
  different code: this one by the deploy manifest, that one by the store's structure.
