it_requirements:
  - >-
    THE ACCESSOR IS A GUARDED IMPORT, NEVER A HARD ONE. The C parser class is absent
    whenever PyYAML was built without libyaml, which is a real configuration for
    adopters of this package. The accessor must take the shape the in-repo precedent
    already uses — `getattr(yaml, "CSafeLoader", yaml.SafeLoader)`, or the equivalent
    `try: from yaml import CSafeLoader as _Loader / except ImportError: from yaml
    import SafeLoader as _Loader`. A bare `from yaml import CSafeLoader` makes the
    package uninstallable for those adopters, and the failure arrives at import time
    on an unrelated command.
  - >-
    DO NOT RE-MIGRATE. SUPERSEDES THE ORIGINAL "ADOPT IT EVERYWHERE" INSTRUCTION.
    The wholesale migration this record originally demanded was built (~113 call sites
    across 67 files) and produced 12+ real defects over two verification rounds, all
    from one cause: the two parsers differ in ERROR behaviour, and several sites
    depended on that. 83 of 85 call sites were reverted on 2026-10-07. A later agent
    reading this record must not read the remaining accessor usage as an incomplete
    rollout and finish it. Widening the accessor's footprint is a REGRESSION of this
    AC, not progress toward it.
  - >-
    THE INVENTORY IS DERIVED, AND IT IS NOW THE INVENTORY OF ADOPTERS, NOT OF
    HOLDOUTS. Search the source at implementation time for every site that resolves
    the C-backed parser — accessor import or inline `getattr(yaml, "CSafeLoader", …)`
    — and compare that derived set against the declared set. The old direction (list
    every reader naming the pure-Python parser, demand each one change) is retracted:
    that list is now ~81 source files and growing, and each of them is correct as it
    stands. An allowlist of exceptions is the wrong shape when the exception is the
    rule; invert it, so the small bounded list is the one that needs maintaining.
  - >-
    REACHABILITY STILL MATTERS, BUT THE CONTEXT CHANGED. No deployed commit-guardian
    hook imports the accessor any more, so the deployed-hook reachability check is
    retired. The accessor's one caller is a build.py PHASE running from the package
    tree, which reaches it through a `sys.path` insertion of scripts/ac_store/ — a
    fragile seam of a different kind. Verify by running the card-generation phase the
    way build.py runs it, and decide explicitly whether the now-vestigial deploy-map
    entry in scripts/build_phases_ac_store.py is pruned or kept with a corrected
    comment. Either answer is acceptable; leaving the stale comment is not.
  - >-
    ERROR FIDELITY OUTRANKS SPEED AT EVERY DECISION POINT. Before admitting any new
    call site, read its `except` branches. If a raised parse failure means "reject",
    "report a violation", "skip as malformed", or "block the commit", the site is
    disqualified no matter how much volume it parses. The defect class is silent: the
    fast arm returns a VALUE where the slow arm raised, so a fail-open guard turns
    from "skip this file" into "accept this file" with nothing in the logs.
  - >-
    GREP FOR PARSER-ERROR STRING ASSERTIONS BEFORE CHANGING ANYTHING. The two parsers
    raise the same exception family but differ in message text and in some mark
    positions. Any existing test that asserts on a parser error STRING will change
    behaviour. Find them first; a surprise at green phase reads as a regression.
  - >-
    THE SPEED CLAIM IS COMPARED WITHIN ONE SITTING. This workspace is a shared WSL
    host under variable agent load, so an absolute second count measured today is not
    reproducible tomorrow. Take the pure-Python baseline and the accessor figure in
    the same process or the same script run, and assert the RATIO. A test that pins
    an absolute wall-clock number will be flaky and will be disabled, which is the
    same as not having it.
  - >-
    DO NOT WIDEN THE SAFETY POSTURE. CSafeLoader is the C implementation of the SAME
    safe schema; the change must never reach for yaml.load with the unsafe full
    loader, or for yaml.Loader, as a way to go faster.
