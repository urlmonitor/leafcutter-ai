it_requirements:
  - "ONE LOCATOR FOR THIS FAMILY: templates/scripts/commit_guardian/_ruff_locator.py, stdlib only, returning the argv prefix to run ruff or a typed not-installed result. Rule per GE-108e, in this order: module form [sys.executable, '-m', 'ruff'] first, bare executable (shutil.which('ruff')) as fallback. Module absence is detected by a non-zero exit WITH 'No module named ruff' on stderr -- never by non-zero exit alone, which a real violation also produces. Probe once per run with '<prefix> --version' and keep the version string for the output. check_lint_gate.py, run_ci_local.py (through the CLI) and BO-570-3 (through the CLI) all go through this one locator."
  - "WHY THIS IS NOT LITERAL REUSE OF GE-108e's CODE, AND HOW PARITY IS HELD INSTEAD (substitution accepted by the user 2026-10-09). GE-108e's rule is implemented inline in templates/hooks/check_exception_handling_hook.py, a Claude Code PostToolUse hook deployed to .claude/hooks/ whose header and GE-108e's own it_requirements forbid importing any leafcutter module. It therefore cannot import _ruff_locator.py, and _ruff_locator.py must not import from .claude/hooks/. Do NOT relax the edit-time hook's self-containment to force reuse. Hold 'is ruff installed gets one answer' with a behavioural cross-check test that runs BOTH the edit-time hook and the lint gate as subprocesses in three real environments -- module importable with no executable on PATH, executable on PATH with the module unimportable, neither -- and asserts they agree on installed / not installed in each."
  - "DECIDE NOTHING-TO-INSPECT BEFORE PROBING RUFF. Compute the in-scope staged set first using the declaration and git alone. If it is empty, emit RESULT: nothing_to_inspect, print a visible line of the form 'nothing to inspect: 0 of <N> staged files are in the declared lint scope', and exit 0 -- even when ruff is absent. Membership filtering that needs ruff (its include/exclude) happens only after at least one staged file falls under a declared step's paths; if ruff is then unavailable, that is could_not_check, not nothing_to_inspect."
  - "EVERY CANNOT-RUN CAUSE BLOCKS, AND THE REASON IS NAMED. Emit RESULT: could_not_check and exit non-zero, with a reason line, for: ruff not installed (state both forms were tried; install instruction: `pip install -r requirements-dev.txt` where that file exists, otherwise `pip install ruff`); ruff present but exits before inspecting (name its stderr); ruff configuration unreadable (ruff exits 2 naming the file, e.g. 'Failed to parse'; name the file and that it could not be read); leafcutter-lint.json unreadable (BP-1300e-1-i); a governing ruff configuration with unstaged edits (BP-1300e-1-ii) or outside the project (BP-1300e-1-iv); a local ruff version different from the version CI installs, or a declared version source that cannot be read (BP-1300e-1-v); no repository (BP-1300e-1-iv); the check's own failure (cannot list staged files, cannot read a blob, unparseable ruff output, an unexpected exception). Never retry with --isolated, never retry without the configuration, never fall back to ruff's built-in defaults."
  - "WHY INTERNAL DEFECTS ALSO BLOCK HERE, CONTRARY TO THE COMPONENT'S FAIL-OPEN CONVENTION. pre-commit prints 'Passed' beside any hook that exits 0, whatever the hook writes. An exit-0 fail-open on an internal defect is therefore a printed false green, which scenario 5 forbids. The only exit status for which pre-commit prints anything other than Passed is non-zero, so this check's GE-120a-2 disposition is BLOCK for every could_not_check cause. State this decision in the module's docstring DECISION HISTORY so a later 'consistency' refactor does not restore exit 0."
  - "THE OUTERMOST GUARD EXITS NON-ZERO. main() catches the specific exceptions it expects (OSError, subprocess.SubprocessError, ValueError, json.JSONDecodeError, UnicodeDecodeError) and converts them to could_not_check. A last-resort guard for anything else is allowed ONLY at the outermost level, must log the exception type and message at WARNING to stderr, must emit RESULT: could_not_check, and must exit non-zero -- the opposite of the component's usual exit-0 tail. It must not print a Python traceback as the only explanation."
  - "run_hook.py IS UNCHANGED BUT VERIFIED. Confirm the deployed run_hook.py wrapper propagates check_lint_gate.py's non-zero exit unchanged and that its own could_not_start path (check_outcome.emit_not_run) covers the case where the script cannot be launched. No edit to run_hook.py is expected; if one proves necessary it is a separate change."
  - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4) applies to the locator: each subprocess call in a specific except; no try/except around pure parsing of 'ruff --version'."
test_spec:
  - name: test_bp_1300e_1_iii_ruff_not_installed_refuses_with_install_instruction_and_no_passed_banner
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    must_catch:
      - "exits 0 with a warning when ruff is missing"
    description: "Hook interpreter cannot import ruff and PATH has no ruff executable (the GE-108e test mechanism: PATH emptied to git's directory, module made unimportable for the child). A staged in-scope .py: commit refused; output states ruff is not installed with the install instruction; pre-commit's line for the hook ends 'Failed' and no line for it reads 'Passed'."
  - name: test_bp_1300e_1_iii_ruff_that_cannot_start_refuses_naming_the_startup_error
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: "A stub 'ruff' module on the hook interpreter's path writes 'boom: cannot start' to stderr and exits 2 before reading input; commit refused and the output contains 'boom: cannot start'."
  - name: test_bp_1300e_1_iii_malformed_ruff_config_refuses_and_never_uses_default_rules
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    must_catch:
      - "retries with --isolated or without the configuration when it cannot be parsed"
    description: "ruff.toml is invalid TOML and the staged file is clean under ruff's defaults; commit is still refused as could_not_check naming ruff.toml as unreadable."
  - name: test_bp_1300e_1_iii_nothing_in_scope_commits_and_says_nothing_to_inspect_even_without_ruff
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Docs-only staged change, ruff absent: commit completes; visible output contains RESULT: nothing_to_inspect and the 'nothing to inspect' line, and never 'inspected' with a non-zero count."
  - name: test_bp_1300e_1_iii_internal_defect_says_could_not_check_and_is_never_shown_as_passed
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: "A `git` wrapper first on the hook's PATH delegates every subcommand to real git except `diff --cached`, which exits 128; real commit: output says the lint check could not check this commit and why, RESULT: could_not_check, and the pre-commit line for the hook is 'Failed', not 'Passed'."
  - name: test_bp_1300e_1_iii_edit_time_hook_and_lint_gate_agree_on_whether_ruff_is_installed
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: seam
    description: "In three environments (module only; executable only; neither) run the deployed check_exception_handling_hook.py and check_lint_gate.py as subprocesses; both report installed in the first two and not installed in the third."
test_rationale: >-
  The pre-commit banner is the load-bearing observable: an exit-0 fail-open
  writes a perfectly honest stderr line beneath a 'Passed' banner, so every
  cannot-run test asserts on pre-commit's own status line for the hook, not only
  on the hook's text. Environments are manipulated for real (PATH, an
  unimportable module, a stub module, a git wrapper) rather than by patching the
  locator, because the defect class is about what the process discovers in the
  environment it is given (GE-108e's rationale). The malformed-config arm uses a
  file clean under ruff's defaults so a default-rules fallback would pass it. The
  cross-hook test is what substitutes for code reuse with the self-contained
  edit-time hook. Commit-path tests reuse _bp_1300e_lint_gate_fixture.py and
  declare @pytest.mark.shared_layout_reader with
  @pytest.mark.usefixtures("shared_reference_layout").
