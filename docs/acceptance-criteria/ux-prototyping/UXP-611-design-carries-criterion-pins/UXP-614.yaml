notes: |
  WHY BOTH SURFACES AND NOT JUST THE MARKUP. The markup is what a comparison
  reads; the record is what a person reviews and approves. A design whose
  criterion claims live only inside a rendered HTML file cannot be reviewed as
  data, cannot be queried, and cannot be diffed in a pull request without
  reading a wall of style rules. The record is also the surface the existing
  schema already governs — `screen`, `renders`, `entities` are all there and a
  per-criterion mapping is the field that is conspicuously absent.

  TWO SURFACES MEANS THEY CAN DISAGREE, AND THE DISAGREEMENT IS THE POINT. The
  third scenario refuses the tempting shortcut of designating one side
  authoritative and regenerating the other from it. Silent regeneration turns a
  detectable drift into an undetectable one: an author edits the markup, the
  record is rewritten to agree, and the fact that the approved record changed
  is never surfaced to the person who approved it.

  THE FOURTH SCENARIO IS TODAY'S REALITY FOR EVERY SCREEN IN THE STORE. Ten
  registered screens, five of them not yet drawn (`renders: null`). An empty
  mapping must be an ordinary state or this AC makes the whole existing store
  invalid on its first run — which is precisely what UXP-616's diff-scoping
  exists to prevent.
