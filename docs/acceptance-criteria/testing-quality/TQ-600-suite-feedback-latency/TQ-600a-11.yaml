      once with the loader forced to pure-Python. Exercise the walk the BUILD calls
      (`_scan_all_ac_assignments`) — its sibling `_scan_ac_assignments` has no
      production caller, so timing that one measures dead code. Assert (a) the accessor arm takes at
      most ONE FIFTH of the forced-pure arm, as a RATIO — never an absolute second
      count, this host has shown 3.8x-10.74x variation with no code change; (b) the two
      arms return EQUAL output, so the ratio is about the same work; (c) each arm
      reports the number of record files it parsed, the two counts are equal, and the
      count equals the files on disk, so a fast arm that parsed nothing fails; (d) both
      raw arm figures are printed on failure, so "the host was loaded" and "the walk
      left the accessor" are distinguishable. Expected ~10-13x; the floor is five.
  - name: test_tq600a_11_no_undeclared_call_site_resolves_the_c_backed_parser
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      REPLACES test_tq600a_11_no_store_reader_names_the_pure_python_parser_directly AND
      its _DOCUMENTED_EXCEPTIONS allowlist, both of which are inverted by the
      amendment. Derive mechanically from the source the set of call sites that resolve
      the C-backed parser — importing/calling the shared accessor, OR the inline
      `getattr(yaml, "CSafeLoader", …)` idiom, which must count the same or the seam is
      bypassable by copy-paste. Assert that derived set equals a small DECLARED set
      (currently: the two whole-store-walk call sites in scripts/generate_agent_cards.py,
      plus the pre-existing inline site in scripts/render_effective_prompt.py). An
      undeclared adopter FAILS. Also assert the declared set contains no
      commit-guardian hook, not scripts/ac_store/validate_ac_schema.py, and nothing that
      decides BLOCK or PASS. Assert the set is NON-EMPTY, so deleting the last adopter
      is a failure rather than a vacuous pass. Do NOT assert anything about the ~81
      files that name the pure-Python parser: that is the default and needs no test.
  - name: test_tq600a_11_the_required_store_validation_gate_rejects_a_record_the_c_parser_accepts
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: discrimination
    description: >-
      The behavioural guard on the RETRACTION, so the choice of error fidelity over
      speed at the required gate is enforced rather than merely documented. Feed the
      store-wide schema validation entry point a record containing a tab character
      inside a flow sequence (`key: [\t]`). Assert it reports a violation / exits
      non-zero. In the SAME test, assert the accessor parses that identical input to
      `{'key': []}` without raising — so the test proves the divergence is real on this
      install and that the gate sits on the strict side of it. This test must go RED if
      anyone re-routes that gate onto the accessor; a version that only greps the
      source for `yaml.SafeLoader` does not satisfy this descriptor.
  - name: test_tq600a_11_the_accessor_is_reachable_the_way_the_build_reaches_it
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      REPLACES test_tq600a_11_the_accessor_is_reachable_from_a_deployed_commit_hook,
      which now tests a relationship that no longer exists — no deployed hook imports
      the accessor. The real seam is that the accessor's one caller is a build.py phase
      running from the package tree and reaching scripts/ac_store/ through a `sys.path`
      insertion. Import and run the card-generation walk the way the build phase does
      and assert it completes and returns non-empty agent groupings. If the
      now-vestigial deploy-map entry is kept, assert the deployed copy still imports;
      if it is pruned, assert no deployed module imports it.
test_rationale: |
  The obvious weak test for this change is a unit test that imports the accessor and
  asserts it returned the C class. That test passes on a change nobody adopted, on a
  store of three fixture files, and at a call site that must not have it — which are
  precisely the ways this has already shipped broken, twice in opposite directions.

  So: the speed claim is asserted over the REAL store, because the cost is entirely a
  function of the store's size and a synthetic fixture reproduces none of it; it is
  asserted at the ENTRY POINT that is supposed to benefit, not at the parser, because
  a fast parser attached to nothing is what the first round of this AC shipped; and it
  is paired with an output-equality and a parsed-count assertion, because the cheapest
  way to make any of this look fast is to parse fewer files.

  The seam test is INVERTED relative to the original. Asserting "no reader names the
  pure-Python parser" was a demand on a population of ~81 files that grows every week,
  and the _DOCUMENTED_EXCEPTIONS allowlist that softened it had to grow with them.
  Asserting "no UNDECLARED site resolves the C parser" is a demand on a bounded set of
  three, and it fails in the direction that actually hurt: silent re-spread of a
  permissive parser into a guardrail path. One of those two framings has to be
  maintained forever; it should be the short one.

  The discrimination descriptor exists because a retraction that lives only in prose
  gets re-litigated. Someone will read the 13x figure and re-route the required gate.
  A test that goes red when they do is the only durable form of that decision.

  The ratio form is deliberate. An absolute threshold on a shared host under agent
  load is a flaky test, and a flaky guard is removed within a month. This record's own
  first amendment was caused by reasoning from absolute figures taken in a different
  sitting; do not do it a third time.
