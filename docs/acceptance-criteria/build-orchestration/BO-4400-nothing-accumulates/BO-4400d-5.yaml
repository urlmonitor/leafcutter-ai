id: BO-4400d-5
title: "Component diagram: the routine sweep and the capabilities it uses"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: docs
risk_surface: internal
criteria: |
  Given the routine sweep (BO-4400d-1, BO-4400d-2, BO-4400d-3) is in place,
  When the component diagram for the routine sweep is read,
  Then it shows the sweep as one component with its session-start trigger,
  And it shows the sweep's connections to each capability it uses: the landed-work pass
    for workspaces, which itself uses the complete workspace listing, the holds-work /
    holds-nothing verdict, the in-use check and the one shared clearing door; the
    outside-item inventory; and the scratch age and ownership rule,
  And it shows the sweep's two outputs: the preview / real report, and the durable
    report log,
  And it shows no direct connection from the sweep to deleting a workspace folder
    other than through the one shared clearing door.
depends_on: [BO-4400d, BO-4400d-1, BO-4400d-3, BO-4400g-2]
doc_links:
  - path: docs/architecture/components/worktree-manager.md
    relationship: describes
    status: exists
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400g-2.yaml
    relationship: constrains
    status: exists
    relevance: The landed-work pass the sweep's workspace part runs (ONE RULE, user decision 2026-11-16).
assigned_agent: architecture-diagram-author
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4400d-1
  contract: "Final sweep structure."
package_surface: false
it_requirements:
  - >-
    C4 component diagram under docs/architecture/diagrams/; the id is allocated with
    scripts/next_diagram_seq.py immediately before publishing (CLAUDE.md 'Sequential Resource Paths
    Go Stale'). Linked from docs/architecture/components/worktree-manager.md.
  - >-
    Component and connector names match the built sweep (BO-4400d-1) and its config key; the only
    edge to workspace deletion goes through the one maker's remove verb. Connector names, confirmed 2026-11-16
    (ONE RULE): sweep to "landed-work pass (worktree.py clear-landed)" for workspaces; the pass to "workspace
    listing (workspace records and landing place)", "unsent-work check (the door's, with the content check
    of BO-4400g-2)", "program check (the door's in-use check, BO-4300e-2-iv)" and "clearing door
    (worktree.py remove)"; sweep to "outside-item inventory (BO-4400b-1)" and "scratch age and ownership rule
    (BO-4400f-1)"; outputs "preview / real report" and "durable report log". There is no edge from the sweep
    to the door except through the pass.
test_required: true
test_intent:
  - clause: it shows the sweep as one component with its session-start trigger
    needs_test: true
    reason: Under the 2026-11-01 user decision a diagram label must match a real artefact, so the component and trigger names are checked against the built sweep and hook.
  - clause: 'it shows the sweep''s connections to each capability it uses: the landed-work pass for workspaces, which itself uses the complete workspace listing, the holds-work / holds-nothing verdict, the in-use check and the one shared clearing door; the outside-item inventory; and the scratch age and ownership rule'
    needs_test: true
    reason: A diagram that still draws the sweep straight to the verdict contradicts ONE RULE, and the edges can be read from the diagram source and compared with the confirmed connector names.
  - clause: 'it shows the sweep''s two outputs: the preview / real report, and the durable report log'
    needs_test: true
    reason: Both outputs are real artefacts of the built sweep, so their labels are checkable against it.
  - clause: it shows no direct connection from the sweep to deleting a workspace folder other than through the one shared clearing door
    needs_test: true
    reason: A drawn shortcut to deletion would document a route the door exists to forbid, and the diagram's edge list shows it.
test_spec:
  - name: test_diagram_shows_the_sweep_with_its_session_start_trigger_matching_real_artefacts
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Finds the sweep diagram under docs/architecture/diagrams/ by its content (the label "landed-work pass (worktree.py
      clear-landed)"; the test fails when none or two match, since its c3-NNN id is allocated at publish time) and
      parses its edge list. The sweep appears as one component with a session-start trigger edge whose labels equal real
      artefacts of the build: the hook file under templates/hooks/ and the sweep entry point under templates/scripts/.
    proves_clause: it shows the sweep as one component with its session-start trigger
    code_file: docs/architecture/components/worktree-manager.md
  - name: test_diagram_edges_are_the_confirmed_connector_names
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      The sweep has edges to "landed-work pass (worktree.py clear-landed)", "outside-item inventory (BO-4400b-1)" and
      "scratch age and ownership rule (BO-4400f-1)", and the pass has edges to the four capabilities of the confirmed
      connector names; there is no edge from the sweep straight to the verdict. The component entry in
      worktree-manager.md links the diagram. The verbs named in the labels are checked against the deployed maker's
      real verb table.
    proves_clause: 'it shows the sweep''s connections to each capability it uses: the landed-work pass for workspaces, which itself uses the complete workspace listing, the holds-work / holds-nothing verdict, the in-use check and the one shared clearing door; the outside-item inventory; and the scratch age and ownership rule'
    code_file: docs/architecture/components/worktree-manager.md
  - name: test_diagram_shows_both_outputs
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      The diagram has exactly the two outputs "preview / real report" and "durable report log", and the durable log
      label names the debugging/logs location the built sweep writes (BO-4400d-3).
    proves_clause: 'it shows the sweep''s two outputs: the preview / real report, and the durable report log'
    code_file: docs/architecture/components/worktree-manager.md
  - name: test_diagram_has_no_workspace_deletion_edge_except_through_the_door
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      Over the parsed edge list no edge leaves the sweep for workspace deletion except the one through the pass to
      "clearing door (worktree.py remove)". A planted fixture diagram with a direct sweep-to-deletion edge fails the
      same check, so the check is shown able to fail.
    proves_clause: it shows no direct connection from the sweep to deleting a workspace folder other than through the one shared clearing door
    code_file: docs/architecture/components/worktree-manager.md
test_design_authorship:
  step: test-designer
  date: "2026-11-17"
test_design_opened_files:
  - docs/architecture/components/worktree-manager.md
