notes: |
  WHY THE FALLBACK STAYS, VISIBLY. Every record written before ACD-1600c-4 is in the
  'no declared files' state. Refusing to generate for them would stop all existing work at
  once; silently using the derivation would re-create KI-ACS-002 under a name that looks
  fixed. So the old derivation keeps running for these records only, and is labelled as
  derived everywhere it appears.

  WHO HOLDS. The generator does not hold records -- one gate holds, and it is the
  implementation-readiness gate (ACD-1600c-1, amended 2026-09-27 to key 'missing file
  targets' on the 'no declared files' state). ACD-1600c-1 ships advisory first and
  grandfathers older records (ADR-026 rules 3-4), so during the migration a legacy record
  can still be built -- with the derived surface marked as such.
