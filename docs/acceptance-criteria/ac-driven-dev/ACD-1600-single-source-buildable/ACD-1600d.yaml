title: "Every file a requirement names is the one you actually edit"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Requirements point at the real source, never a generated copy.

  Every file path a requirement hands a builder -- the targets to change, the
  links back to what implements it, the supporting docs -- points at the canonical
  source that is edited by hand, never a generated or deployed copy of it. A
  builder can always locate the exact file to change without hunting.
