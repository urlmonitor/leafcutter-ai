created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900e-3.yaml"
criteria: |
  Given a script path is promised (registered in commit_guardian.json or
    referenced by a deployable template) but has no copy under templates/scripts/
  And that script path is listed in the external-dependency allowlist
    (build_propagation_audit.EXTERNAL_DEPENDENCY_ALLOWLIST), consistent with the
    allowlist seam BP-900b-1-1 already honors
  When the registry-completeness check runs at the finalize merge gate
  Then the allowlisted script is treated as resolved
  And it does NOT appear in the promised-but-undeployed list
  And it does not fail the merge gate
  And the merge gate passes (assuming no other completeness violations exist)
