it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "The class must be closed by one mechanism covering every decision whose answer is a human choice -- not by five per-site edits. Two of the five sites appear in no known issue, and one of those can delete drafts; per-site patching is how those two get missed."
  - "A new decision point added later must inherit the rule by virtue of being a human-decision gate, not by someone remembering to route it. A mechanism that must be opted into at each site is the same defect deferred."
  - "The property must be observable from outside the run: the run's own record of what it dispatched is the evidence. A test that asserts a particular agent name is absent from the source passes as soon as the dispatch target is built from a variable."
  - "The route must not proceed past a decision point on a timeout or a default. What happens when the channel reaches nobody is ACD-2100c-2's subject and must be reached, not bypassed."
  - "Must satisfy the repository error-handling policy on the channel interaction, which is external I/O."
  - "Must not change what any of the five decisions offers or means -- only who is asked. The covered-route and orphan-resolution decisions keep their existing choices."
test_spec:
  - name: test_each_of_the_five_decision_points_is_put_on_the_user_channel
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The run is driven to each of the five decision points in turn and each question
      appears on the channel that reaches the person running the route.
  - name: test_no_dispatch_is_made_to_obtain_an_answer_to_any_of_the_five
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner to each decision point, with the run's own dispatch record read back afterwards"
    description: >-
      Across all five, the run's record of every dispatch it made contains no dispatch
      whose purpose was to obtain a gate answer -- read from the record the run
      produced, not from the workflow source.
  - name: test_run_does_not_advance_past_a_decision_point_before_an_answer_arrives
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      With the channel open but no answer supplied, no step after the decision point
      executes for the duration of the run.
  - name: test_a_newly_added_human_decision_point_inherits_the_rule
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      A sixth human-decision point introduced into the run is put on the user channel
      and produces no dispatch, without any per-site registration -- the guard is on
      the class, not on a list of five.
test_rationale: >-
  The property is only observable from outside: run the route, then read what it
  dispatched. A test that asserts a particular agent name is absent from the source
  passes the moment the dispatch target is built from a variable, and per CLAUDE.md an
  AC about a gate is covered by a test that executes the gate path. Naming all five
  sites in the criteria rather than three is deliberate -- the two the known issue omits
  include the orphan-resolution decision, which can delete drafts. The sixth-point test
  is the one that distinguishes a class-wide mechanism from five per-site patches;
  without it, five passing per-site assertions look identical to a solved problem.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100c-4
    contract: "A decision-point mechanism in which an answer carries the channel it arrived on, so that provenance is a property of the answer the acceptance test can read -- rather than something to be inferred from the answer's content."
  - agent: architecture-diagram-author
    ac_id: ACD-2100e-1
    contract: "The final set of decision points and the channel each is put on, which the sequence diagram depicts rather than re-derives from the source."
