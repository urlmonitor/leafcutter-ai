id: TQ-600a-13-xxvii
components:
  - testing_quality
title: "The live lane's own real-database test runs only inside the live-database lane, so the correctness lane, which starts no database, is not turned red by it"
component: testing-quality
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the post-merge correctness lane selects every `manual` test under tests/ and
    unit_tests/ (TQ-600a-13-xxi keeps that selection unchanged) and starts no database,
  And tests/knowledge_live/lane/test_tq_600a_13_xxi.py, the live lane's real-database test,
    is marked `manual` and, by design, fails rather than skips when a database is
    unreachable,
  When the correctness lane executes that test,
  Then the test is skipped with a reason saying it runs only inside the live-database lane,
    and does not fail, so it can no longer turn the post-merge verdict red from a lane that
    has no database
  And the skip is decided by an explicit lane marker that only the live-database lane sets
    for its own pytest child, after its database check has passed — the post-merge
    `live_run` and `live_retry` executions and the fix proof's live session — and never by
    whether a database happens to be reachable
  And inside the live-database lane the test still fails, never skips, when an instance is
    unreachable
  And the correctness lane's pytest child does not carry the lane marker, so every other
    correctness test sees the environment it saw before.
