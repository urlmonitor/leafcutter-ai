criteria: |
  Given test intent (ACD-2500b-1), the test-design-pending state (ACD-2500b-2) and the
    legacy treatment (ACD-2500b-3),
  When the reference documentation is authored,
  Then it defines test intent as a per-outcome needs-test decision with a reason, and states
    that it is not a test contract,
  And it states who writes intent (technical planner) and who writes the design (the
    code-aware test-design step),
  And it states that a requirement with intent and no design cannot be approved or built,
  And it states that designs written before the change are kept and how to tell them apart.
