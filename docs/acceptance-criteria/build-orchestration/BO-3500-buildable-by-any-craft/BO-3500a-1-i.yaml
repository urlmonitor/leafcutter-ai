notes: |
  The Product Owner named this constraint explicitly on BO-3500a and it applies to both
  of the two situations that L1 distinguishes, which is why it is recorded once here
  rather than twice in BO-3500a-2 and BO-3500a-3.

  WORDING NOTE — DO NOT "IMPROVE" THE THIRD THEN-CLAUSE BACK (KI-BP-20260831-0940).
  That clause reads "no craft produces an artifact on that member's behalf". The natural
  phrasing is "no artifact is written on that member's behalf", and it was written that
  way first. It cannot be used: derive_declares_side_effect() scopes correctly to Then
  blocks but is NEGATION-BLIND inside them, so "no artifact is written" matches the
  durable-effect phrase "is written" and derives true. This record is a refusal — its
  entire content is that nothing happens — so true would be false, and the field is
  derived rather than authored by opinion (BO-2900g-2), leaving no honest way to set it
  by hand. The reworded clause means exactly the same thing and derives false, which is
  correct. Verified minimal case: "Then the run refuses and nothing is written to disk"
  also derives true. Once the derivation handles negation, restore the plainer wording.

  WHY IT IS A SEPARATE RECORD AND NOT A CLAUSE. Substitution is the cheapest way to make
  every other criterion in this tree pass. A run that hands a diagram to the code craft
  produces a file, satisfies a naive existence proof, opens a pull request and reports
  success — every visible signal is green and nothing anybody asked for was made. Making
  it a criterion in its own right means a test exists whose only job is to fail when
  that happens.

  Note the last clause of the first scenario: rewriting the declaration is substitution
  with the evidence removed. A run that quietly changes a member's declared craft to one
  it can dispatch destroys the very field BO-3500d counts, so the backlog figure would
  improve while nothing improved.
