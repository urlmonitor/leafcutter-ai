test_spec:
  - name: test_label_mode_passes_the_template_through_a_system_prompt_file
    target_dir: unit_tests/evals/
    framework: pytest
    type: unit
    description: "With subprocess.run recorded, invoke_via_cli with a 60 KB system prompt builds an argv that contains --system-prompt-file <path> and no --system-prompt argument and no argument longer than 30,000 characters; the file named by the path held exactly the prompt during the call and no longer exists afterwards."
  - name: test_artifact_mode_passes_the_template_through_an_append_file
    target_dir: unit_tests/evals/
    framework: pytest
    type: unit
    description: "With subprocess.run recorded, the artifact-mode agent invocation builds an argv with --append-system-prompt-file <path> and no --append-system-prompt argument; the file held exactly the prompt during the call and is removed afterwards."
  - name: test_prompt_file_is_removed_when_the_cli_call_raises
    target_dir: unit_tests/evals/
    framework: pytest
    type: unit
    description: "When subprocess.run raises OSError, the runner still reports 'claude CLI could not be launched' and the prompt file no longer exists."
