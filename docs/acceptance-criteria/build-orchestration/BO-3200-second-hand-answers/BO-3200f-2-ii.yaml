criteria: |
  Given the executor's three live scenarios -- BO-3200f-2's first scenario and both scenarios
    of BO-3200f-2-i --
  When they run with the live-dispatch switch set, as cases of the mechanism TQ-600a-1
    specifies,
  Then each case asks the executor as the repository registers it and names the acceptance
    criterion it proves,
    And each passes or fails on one definite check of its own reply: whether that reply verifies
    as BO-3200f-1's capture of the exact command the case dispatched,
    And the run's evidence record (TQ-600a-2) names all three scenarios, with the executor as
    the agent asked.

  Given the executor's charter as the repository holds it, changed so that it declines every
    command,
    And the live-dispatch switch set,
  When the three live scenarios run,
  Then BO-3200f-2's first live scenario fails, and its failure names the decline,
    And that failure comes from the scenario's own check on the executor's reply, with no change
    made to the mechanism that asks the executor.
