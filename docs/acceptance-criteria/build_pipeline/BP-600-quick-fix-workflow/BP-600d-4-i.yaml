assigned_agent: workflow-architect
estimated_complexity: S
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - >-
    Must create the PR only behind an explicit user-confirmation gate: detect
    the absence of a PR, present the proposed title and body, and wait for an
    affirmative reply before invoking PR creation. A negative or absent reply
    means no PR — report the compare URL and stop.
  - >-
    Must run `gh auth switch --user urlmonitor` before any `gh pr` command, on
    every run. The default account is EMU-blocked for the createPullRequest
    mutation and PR creation fails with an authorization error without it.
  - >-
    Must pass the PR body with `--body-file`, never inline `--body`. A body
    containing a bare identifier such as an AC id is shell-interpolated and a
    "command not found" line has been published into a real PR body this way.
    The body file must be produced with the Write tool, never a heredoc or an
    inline interpreter.
  - >-
    Must not merge the PR, and must not treat an existing PR as an error: when
    `gh pr list --head <branch>` already reports one, report its URL and skip
    the creation gate entirely.
  - >-
    Push failure is a halt, not a warning. The fix is committed locally but
    invisible on the remote, and the work is not closed until the push succeeds.
