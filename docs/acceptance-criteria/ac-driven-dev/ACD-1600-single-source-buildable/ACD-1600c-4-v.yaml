title: "The to-be-created marker is a build precondition, not a claim of ownership and not a historical note, so it is spent once the work is finished and a precondition a sibling satisfied early is reported as that rather than as a stale marker"
component: ac-driven-dev
level: L3
status: active
req_status: draft
