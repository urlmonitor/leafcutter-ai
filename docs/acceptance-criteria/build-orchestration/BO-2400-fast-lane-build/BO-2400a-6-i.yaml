test_rationale: |
  Prose documentation. The store's convention for this tree is test_required: false, as on
  the parent BO-2400a-6 and its siblings BO-2400a-7 and BO-2400a-8. The one mechanically
  checkable clause (every halt kind named exists in the lane) is verified by the author at
  sign-off and by review, not by a unit test. A text-match test on a how-to would pin
  wording, not correctness.
