criteria: |
  Given a ticket whose captured claim is "the build passes" with the reproduction command
    being the build, and locally the build exits 0 because stale deployed skill artifacts
    mask two dangling skill pointers,
  When the pre-inbox-exit premise verification runs the build against a clean, CI-equivalent
    tree that has no stale deployed artifacts,
  Then the clean-tree build surfaces the two dangling skill pointers and exits non-zero,
  And the verification reports the local-vs-clean discrepancy and blocks the ticket from
    leaving the inbox,
  And the "build passes" premise is not allowed to become load-bearing.
