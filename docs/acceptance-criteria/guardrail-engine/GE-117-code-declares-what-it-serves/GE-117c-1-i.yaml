assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Determine the enclosing symbol of a new decision-history entry from the same ast parse used for GE-117b (map the entry's source line into the enclosing FunctionDef/ClassDef span); inheritance applies only when that enclosing symbol has a RESOLVED AC reference."
  - "Precedence: an entry's OWN resolvable AC reference always wins over the enclosing symbol's (scenario 2); inheritance is a fallback only when the entry carries no own reference."
  - "A module-level entry (no enclosing symbol) with no own reference has nothing to inherit and yields a missing verdict (scenario 3); do not silently pass it."
  - "Reuse the shared _load_ac_by_id resolver for both the entry's own ref and the inherited ref; no separate resolution path. Edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together; verify via build.py round-trip (ADR-001)."
delivers_to: null
