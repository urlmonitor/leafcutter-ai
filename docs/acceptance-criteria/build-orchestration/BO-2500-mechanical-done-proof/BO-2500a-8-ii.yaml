it_requirements:
  - Edit templates/agents/it-po.md only, never the deployed copies (.claude/agents/it-po.md,
    .leafcutter/, compiled platform output; ADR-001), and rebuild afterwards.
  - 'Every passage that mentions test_required: false must carry the pair. Three passages
    describe it alone today (2026-10-25): section 2.7 (around line 517; the brief''s ''445-452''
    has moved), the S7 write rules (around line 786) and the S8 checklist item 12 (around
    line 825). Clause 5 covers all of them.'
  - Do not restate which records may be test-free. Link to the TQ-400e-6 entry in docs/reference/ac-schema.md;
    if TQ-400e-6 is not built yet, link to the existing test_required and test_rationale rows.
  - Quote BO-2500a-8-i's refusal message as delivered, not paraphrased; build after BO-2500a-8-i.
  - 'The template is 1114 lines and every it-po run pays for its length: keep net growth to
    what the clauses need.'
  - Prompt proof per BO-3500c-2-iv as two eval entries, with the runner unchanged (decision
    2026-10-25). In scripts/evals/agent_eval_config.json, 'it-po' points its template at templates/agents/it-po.md,
    and 'it-po-without-reason-rule' points at scripts/evals/fixtures/it-po.before-bo-2500a-8-ii.md.
    Both share scripts/evals/sets/it-po.jsonl, which holds a docs-only requirement. The proof
    passes when 'it-po' meets its threshold and 'it-po-without-reason-rule' does not. Each
    entry's triggers name only its own template and the shared set. With no credential, the
    run reports 'no model credentials', not a score; the agent-evals CI job stays informational.
  - 'The fixture is a byte copy of templates/agents/it-po.md at the merge base, before BO-2500a-8-ii''s
    edit. It is the honest before-state baseline and is never regenerated or updated later.
    It is a data fixture, not a deployed template: the build must not copy it into .claude/.'
  - 'Lanes: the template edit is llm-expert''s. The eval config entries, the set and the fixture
    are the proof harness and are written in the test-writer phase of the same ticket. No
    .py changes; scripts/evals/run_agent_eval.py is not touched.'
test_required: true
test_intent:
  - clause: the instructions direct it to write test_required false together with a test_rationale,
      and present the two as one declaration, never the first alone
    needs_test: true
    reason: Whether the template presents the two fields as one declaration is observable
      in its text, and a later edit splitting them again would otherwise pass unnoticed.
  - clause: 'they state that the reason must be specific to the record: it names what the
      deliverable is and why no executable test can observe it'
    needs_test: false
    reason: This is wording about what a good reason says; its effect is observed by the with-and-without
      comparison in the last clause, and a phrase-match test would only restate it.
  - clause: they state that one sentence reused across records, or text filled in from the
      record's change_target, is not a reason
    needs_test: false
    reason: Wording about what is not a reason; observed through the comparison run, and a
      phrase-match test would only restate the sentence.
  - clause: they state that the commit-time record check refuses the declaration without a
      reason (BO-2500a-8-i) and that the done gate refuses it at mark time (BO-2500a-1-ii)
    needs_test: false
    reason: Citation wording; the cited refusals are proven by BO-2500a-8-i's and BO-2500a-1-ii's
      own tests.
  - clause: no passage in the instructions describes setting test_required false as complete
      on its own
    needs_test: true
    reason: Three passages mention test_required false alone today, and a scan of the whole
      template is what catches one left behind.
  - clause: for which records may carry a test-free declaration at all, the instructions point
      to the exemption reference entry (TQ-400e-6) and do not restate that rule
    needs_test: false
    reason: Whether a passage restates a rule or points to it is a judgement on prose, made
      at review, not a string match.
  - clause: a planner run on a docs-only requirement with these instructions loaded writes
      both fields, where the same run without the new instruction writes test_required false
      alone
    needs_test: true
    reason: 'This is the prompt proof BO-3500c-2-iv defines: the planner run with and without
      the instruction on a docs-only requirement, comparing which fields it writes.'
test_spec:
  - name: test_every_passage_declaring_test_required_false_presents_it_with_a_test_rationale
    target_dir: unit_tests/ac_driven_dev/it_po_prompt/
    framework: pytest
    type: unit
    angle: criterion
    description: "In unit_tests/ac_driven_dev/it_po_prompt/test_bo_2500a_8_ii_reason_with_declaration.py, using the paragraph and section helpers of the sibling prompt tests (unit_tests/ac_driven_dev/test_designer_prompt/_file_findings_prompt_support.py). Section 2.7 (the test_required false paragraph), the S7 write rule and S8 checklist item 12 of the it-po template each name test_rationale in the same passage as test_required false, and present the two as one declaration. Reads the template body without frontmatter. Expected red today: all three passages describe test_required false alone."
    proves_clause: "the instructions direct it to write test_required false together with a test_rationale, and present the two as one declaration, never the first alone"
    code_file: templates/agents/it-po.md
  - name: test_no_passage_anywhere_in_the_template_describes_test_required_false_as_complete_alone
    target_dir: unit_tests/ac_driven_dev/it_po_prompt/
    framework: pytest
    type: unit
    angle: boundary
    description: "In unit_tests/ac_driven_dev/it_po_prompt/test_bo_2500a_8_ii_reason_with_declaration.py, using the paragraph and section helpers of the sibling prompt tests (unit_tests/ac_driven_dev/test_designer_prompt/_file_findings_prompt_support.py). Scans every paragraph, list item and checklist item of the whole template (not just the three known passages) for test_required false, and fails naming each passage that does not also carry test_rationale. Catches a fix to section 2.7 that leaves the S7 or S8 passage behind, and any passage added later. Expected red today."
    proves_clause: "no passage in the instructions describes setting test_required false as complete on its own"
    code_file: templates/agents/it-po.md
  - name: test_rendered_planner_prompt_carries_the_declaration_instruction
    target_dir: unit_tests/ac_driven_dev/it_po_prompt/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "scripts/render_effective_prompt.py as a subprocess"
    description: "The consuming surface loads the template: the real scripts/render_effective_prompt.py CLI is run as a subprocess for the it-po agent (pointed at a temp repo root holding a verbatim copy of templates/agents/it-po.md and one ACD-2500 record, as rendered_prompt_paragraphs in the sibling support module does), and every paragraph of the rendered prompt that mentions test_required false also mentions test_rationale. Proves the instruction reaches the prompt the planner receives, not only the template file. This is the repeatable half of the BO-3500c-2-iv proof and is never sufficient alone."
    proves_clause: "the instructions direct it to write test_required false together with a test_rationale, and present the two as one declaration, never the first alone"
    code_file: templates/agents/it-po.md
  - name: eval_it_po_writes_both_fields_for_a_docs_only_requirement_with_the_instruction_and_one_without
    target_dir: scripts/evals/sets/
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/evals/run_agent_eval.py --agent it-po (claude headless CLI, label mode), run by the Agent evals (affected) CI job"
    description: "Eval case in the agent-eval suite, the prompt proof BO-3500c-2-iv defines for a model-only consumer. Format: JSONL rows in the new file scripts/evals/sets/it-po.jsonl, shaped like scripts/evals/sets/restructuring-specialist.jsonl (id, input, expected, reason). Two entries in scripts/evals/agent_eval_config.json, both label mode with the same eval_set, input_field, label_axes (test_required_false and test_rationale), response_label_field declares and model: it-po, whose template is the real templates/agents/it-po.md (the with condition), and it-po-without-reason-rule, whose template is scripts/evals/fixtures/it-po.before-bo-2500a-8-ii.md, a stored byte copy of it-po.md at the merge base with origin/main (the without condition, instruction absent). The runner needs no change. Each row gives the agent one docs-only requirement (a guide with no executable behaviour) and asks it to end its reply with a JSON object declares holding two booleans: whether its enrichment writes test_required false, and whether it writes a non-empty test_rationale. The rows expect both true. Pass criterion: it-po meets its threshold (1.0, every row writes both fields) and it-po-without-reason-rule does not (it writes test_required false alone, so it scores below threshold); the proof holds only when both are true, and a build that adds nothing is caught because the two entries would then score the same. Cost: 3 rows per entry, 6 live model calls per run at about 20k input tokens each (the template is 1114 lines), roughly 120k input tokens at sonnet pricing. It is an eval case, not a pytest test, and pytest.ini gets no marker for it (user decision of 2026-10-25: a pytest live-model marker would be refused by scripts/suite_performance/check_exclusion_compensation.py). The non-required CI job 'Agent evals (affected)' (.github/workflows/agent-evals.yml) runs both entries when the template, the eval set, the fixture or the shared harness changes (each entry lists them in triggers), and treats a missing ANTHROPIC_API_KEY as an infrastructure failure: the preflight step fails before any row runs and no score is printed, so it is refused, never passed. It also runs locally: python scripts/evals/run_agent_eval.py --agent it-po, then --agent it-po-without-reason-rule. Expected red today: the working template equals the stored copy, so both entries score the same."
    proves_clause: "a planner run on a docs-only requirement with these instructions loaded writes both fields, where the same run without the new instruction writes test_required false alone"
    code_file: templates/agents/it-po.md
