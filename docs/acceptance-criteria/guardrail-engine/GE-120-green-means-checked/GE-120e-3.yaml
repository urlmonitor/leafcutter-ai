it_requirements:
  - "EXTEND GE-120c-1'S HARNESS WITH AN OPERATION-SHAPE DIMENSION; DO NOT FORK IT. Home is unit_tests/portability/, where the out-of-process harness already stands up a real working copy, builds the deployed layout into it and runs a check as a subprocess. GE-120b-4 sweeps the same manifest on the LAYOUT axis; this sweep adds the OPERATION axis. Two dimensions of one harness, not two harnesses."
  - "ONE AUTHORED-CONTENT FIXTURE FEEDS BOTH ARMS. Build the ordinary arm and the merge arm from a single authored-content definition so the arms cannot drift. Two hand-written fixtures that were meant to be identical is how a differential test quietly stops being differential."
  - "THE MERGE ARM MUST BE A REAL git merge. Perform the merge as a repository operation producing a real staged merged tree with a large incoming changeset — the observed case was 479 files. A hand-staged approximation of a merge does not reproduce the two-parent state that the whole L1 turns on."
  - "ASSERT ONLY ON THE SUBPROCESS'S OBSERVABLE OUTPUT: exit status and the text it wrote. Never import a check module, a commit_guardian helper, or _resolve_root.py into the verification — importing from the source tree reintroduces the blindness the harness exists to remove."
  - "PRINT BOTH ARMS SIDE BY SIDE UNCONDITIONALLY, not only on failure. The criterion is that a disagreement is READ directly; output produced only inside a failure branch is unavailable to the reader diagnosing a pass that looks wrong."
  - "COMPARE OBJECTED-TO CONTENT, NOT ONLY STATUS. Two arms that both block for different reasons is a disagreement. Status-only comparison would have called the observed merge 'agreement', because contract-shrinking would also have blocked the ordinary arm had the author really deleted a test."
  - "ITERATE THE MANIFEST-DERIVED SET FROM GE-120e-2 at run time. No hand-written check list, no hard-coded entry count. A self-deriving check registered tomorrow must join this sweep by being registered."
  - "RUNTIME. Two arms per self-deriving check, each a subprocess, on top of a real merge fixture. Build each repository ONCE per sweep and mark the sweep slow. Narrowing the subject list to keep the suite fast turns this AC into the always-green assertion it exists to eliminate."
  - "A SETUP FAILURE IS A REPORTED FAILURE, NEVER A SKIPPED CASE (GE-120c-1-i), and never an xfail. This repository has a recorded history of xfail-masked AC enforcement where CI under-reported failures; a pair that could not be run must be loud."
  - "Error-handling policy applies to the harness's own subprocess, git and filesystem calls: specific exceptions, logged at WARNING, never swallowed. Clean up any worktree or temporary repository even on failure."
test_spec:
  - name: test_ge120e3_pair_runs_both_arms_as_processes_against_real_repositories
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Each pair executes the check as a subprocess in the commit path's own invocation shape, once on an ordinary commit and once on a real merge."
  - name: test_ge120e3_merge_arm_is_a_real_merge_carrying_a_large_incoming_changeset
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The merge arm's staged state comes from an actual git merge with a large incoming changeset, not from hand-staged files."
  - name: test_ge120e3_pair_fails_when_the_two_arms_disagree_on_status
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A planted status disagreement makes the verification report a failure — the sweep can be made to fail."
  - name: test_ge120e3_pair_fails_when_arms_object_to_different_content_at_the_same_status
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Two arms that both block for different reasons is reported as a disagreement, not as agreement."
  - name: test_ge120e3_both_arms_output_is_printed_side_by_side
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Per check, the recorded status and reader-facing text from each arm are printed together, on passes as well as failures."
  - name: test_ge120e3_pair_is_run_for_every_manifest_recorded_self_deriving_check
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The subject set is read from GE-120e-2's manifest determination at run time, with no hand-written list and no pinned count."
test_rationale: "The pair IS the evidence, and neither arm is evidence alone: the merge arm on its own cannot distinguish a check that now correctly ignores carried-in work from a check that objects to nothing at all, and the ordinary arm on its own cannot see the defect. The test contract therefore keeps both arms inside the same case rather than splitting them, and drives them from one authored-content fixture so they cannot drift apart. Both arms must be real repository states executed as subprocesses because the defect is a property of what git reports to a check at commit time, which no in-process fixture reproduces. The two planted-disagreement cases exist because a sweep that has never been observed to fail is not evidence — the standard GE-120c-1 already sets for the layout axis."
