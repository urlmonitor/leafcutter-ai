change_target:
  - code
  - schema
risk_surface: contract_boundary
test_required: true
test_rationale: |
  Freshness cannot be tested from a single snapshot: the assertion is about a change between
  two states, so the test must construct a store, record a confirmation, mutate a described
  thing, and re-check. A test that only asserts a confirmation field exists would pass against
  a field nobody ever compares - which is the exact shape of the fourteen hand-written index
  summaries this L1 was written from.
test_spec:
  - name: test_journey_is_reported_behind_after_a_described_thing_changes
    target_dir: unit_tests/product_truth/
    description: "Confirming a journey, then changing an acceptance criterion it describes, causes the journey to be reported behind naming that criterion."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_journey_is_not_reported_when_nothing_it_describes_changed
    target_dir: unit_tests/product_truth/
    description: "A confirmed journey whose described things are untouched is absent from the report."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_compared_journey_count_rises_with_the_number_of_journeys
    target_dir: unit_tests/product_truth/
    description: "Adding one journey raises the stated compared count by exactly one."
    type: integration
    angle: seam
    framework: unittest
notes: |
  Sub-surface 2 of the four the L1 lists (freshness). This is the CONTENT TIER above the
  UXP-700c-1 floor: the floor asks whether the target exists, this asks whether it still says
  what the record claims.

  The store today has no freshness stamp of any kind - the asof fields present on impl_summary
  and on the by_ac back-references record when the DERIVED data was regenerated, not when a
  human confirmed the journey against the code. Reusing those fields for this purpose would
  make every journey permanently current, since the generator rewrites them on every run. The
  IT PO must not resolve this AC onto the existing asof fields.
target_epic: EPIC-TruthfulProjectRecord
