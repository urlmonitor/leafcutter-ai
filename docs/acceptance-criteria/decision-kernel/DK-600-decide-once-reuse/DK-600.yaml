notes: |
  ORIGIN (2026-10-02, product-owner, for TICKET-20261002-DecisionLifecycleACs).
  First tree in the new decision-kernel namespace (prefix DK). The brief: a
  person using Leafcutter gets design decisions made on evidence, recorded, and
  reused later instead of re-decided, with L1s mirroring the lifecycle (form,
  stage, publish, reuse). Derived from the five decision flows under
  docs/product-truth/flows/leafcutter/ (30 steps, 12 branches, 42 acceptance
  scenarios).

  WHAT I CHANGED FROM THE BRIEF, AND WHY
  - Forming is split into TWO L1s (DK-600a evidence, DK-600b your call).
    Forming alone holds 15 of the 42 scenarios, three times any other stage, and
    it carries two benefits that are answered by different work: "the
    comparison rests on real evidence" and "nothing is decided without you".
    Merged, one L1 would need 15 scenarios folded under a 5-L2 cap.
  - "You stay the one who decides" is stated at this L0, not as its own L1. It
    has no flow steps of its own; as an L1 it would duplicate the human decision
    points that already belong to b, c, d and e. Each child carries its own
    slice of it.
  - Corrections (append-only supersession) stay inside DK-600d instead of a
    separate L1, so every flow step and branch maps to exactly one L1. That
    keeps the step-to-AC wiring in each flow's implements list mechanical.

  FLOW-TO-L1 MAP (journey level; sub-flow maps are in each L1's notes)
    decision-lifecycle step form    -> DK-600a + DK-600b
    decision-lifecycle step stage   -> DK-600c
    decision-lifecycle step publish -> DK-600d
    decision-lifecycle step reuse   -> DK-600e
  Scenario totals: lifecycle 4 + forming 15 + staging 5 + publishing 10 +
  retrieval 8 = 42.

  DONE ONLY WITH EVIDENCE (KI-ACS-004). This L0 and its L1s are composites. None
  is marked done at authoring. A composite is done only when every direct child
  is done, with covered_by listing direct children only. Leaf ACs are marked
  done only with a resolving implemented_by (kernel/... file plus symbol) and a
  resolving covered_by (tests/kernel/... test). That is the BA's and coder's
  work, not this record's.

  OUT OF THIS TREE: gated direct publishing
  (TICKET-20261002-KernelGatedDirectPublish) carries no ACs by user decision and
  is not specified here. See DK-600d's notes for how its wording survives that
  change.

  SCOPE NOTE. The decision kernel lives in leafcutter-ai only and is not shipped
  to adopters (docs/components.json decision_kernel), hence risk_surface
  internal.

  ROADMAP. phase_kernel_1_founding, taken from the ticket. Advances the exit
  criterion "a real question is researched when necessary, returned with
  evidence, and traceable end to end". No vision or roadmap change was needed or
  made.

  PRIORITY. medium by authoring default. The originating ticket is high; the
  user sets AC priority at approval.

  IDENTIFIER. DK-600 is the first id in a new namespace. No DK- id exists
  anywhere in the worktree or on origin/main (checked 2026-10-02).

  TRUE STATUS (2026-10-02): work_status in_progress, derived from the direct children by the
    rule above: done only when every direct child is done; todo only when none has started;
    otherwise in_progress.
  BA QUESTION 3, ANSWERED (2026-10-02): the journey decision-lifecycle steps (form, stage,
    publish, reuse) link the L2s in their implements, not the L1s: form -> DK-600b-3, stage
    -> DK-600c-3, publish -> DK-600d-3, reuse -> DK-600e-1 and DK-600e-3. Documentation ACs
    stay out of every implements.
