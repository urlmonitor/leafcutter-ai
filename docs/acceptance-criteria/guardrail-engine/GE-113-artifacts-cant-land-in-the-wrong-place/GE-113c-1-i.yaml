criteria: |
  Given the guard scripts run from the source-repo (non-deployed) layout where
    they live under the repository's own scripts directory,
  When a guard resolves the project root for its check,
  Then the resolved project root is the source repository root,
  And the project-root resolution behaves the same as in the deployed layout
    rather than regressing for the source-repo case.
