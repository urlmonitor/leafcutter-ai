criteria: |
  One list of a specialist's abilities, wherever you look it up.

  The specialist's briefing, its published card, the architecture diagrams and
  the knowledge graph all show the same abilities for every specialist,
  because there is only one derived list for them to read. Which list a
  specialist happens to appear in no longer depends on its history.
