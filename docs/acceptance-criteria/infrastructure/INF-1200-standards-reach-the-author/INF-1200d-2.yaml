notes: |
  THE HAZARD THE L1 SAID WOULD BE MISSED, WRITTEN AS THE RECORD THAT CATCHES IT. Every
  standard on disk today is a threshold. A decomposition shaped around thresholds will
  produce a mechanism that cannot carry a standard expressed as a rule, a prohibition or
  an exclusion — and it will pass every other record in this tree, because every other
  record's fixtures will be thresholds too. The narrowing will not appear as a bug. It
  will appear as a working feature with a shape nobody chose.

  THE L1 IS EXPLICIT ABOUT THE ALTERNATIVE AND SO IS THIS RECORD. If enrichment decides
  to constrain the shape of what can travel — for good reasons, such as an existing
  declaration format that has nowhere to put prose — that must be an explicit, recorded
  decision with its own record, not an artefact of the first four examples. Discovering
  at implementation time that this record cannot be satisfied without reshaping the
  declaration is a legitimate finding and should be raised as one. Silently satisfying
  the threshold arms and leaving the rest is not.

  WHY THE THIRD ARM PAIRS A RULE WITH A THRESHOLD ON THE SAME KIND OF FILE. Two
  standards of different shapes governing one kind of file is where a carrier that
  models "the standard for a kind of file" as a single value fails, and it is the
  smallest configuration in which that failure is visible. A carrier that holds one
  value per kind of file passes both single-standard arms and loses one of the two here.

  WHY THE FOURTH ARM EXISTS. A carrier can pass the arrival arms by emitting a fixed
  sentence whenever a non-threshold entry is present — "this kind of file is subject to
  additional rules" — which is arrival without content, and is the non-numeric
  equivalent of a pointer. Changing the declared wording and requiring the statement to
  MOVE is the only arm that separates carrying the standard from acknowledging that one
  exists.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: derive each carried standard by reading a numeric value out of its
  declaration, skipping any declaration from which no number can be read. Under that
  injection:
    - the arrival arm must go RED, because the non-threshold standard is dropped;
    - the two-standards arm must go RED, because only the threshold survives;
    - the changed-wording arm must go RED;
    - every arm of INF-1200d-1 must STAY GREEN, because a newly declared THRESHOLD
      standard still arrives with no delivery step of its own.
  All four outcomes must be observed together and all must revert. The green outcome is
  the point: this mutation is a fully general, correctly derived, genuinely
  future-proof carrier that has silently decided a standard is a number.

  A SECOND MUTATION FOR THE FOURTH ARM. MUTATION: state a fixed sentence for any
  non-threshold standard rather than its declared wording. Under it the first two arms
  stay green and the changed-wording arm goes RED. It is the cheapest way to pass an
  arrival assertion and it tells the specialist nothing it did not already know.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above are written to be turned directly into test descriptors.
