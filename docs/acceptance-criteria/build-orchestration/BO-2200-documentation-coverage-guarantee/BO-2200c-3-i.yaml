      type: object
      description: "Unresolved parent (derive_parent_id None, missing file, or absent documentation_triggers) yields a genre-less line with an explicit marker, not a crash."
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Parent resolution must fail soft: derive_parent_id returning None, a missing parent file, or an absent documentation_triggers must produce a genre-less line (path and content constraint still written), not a crash."
    - "Represent the missing genre explicitly (e.g. an '(unspecified genre)' marker) so the omission is visible."
    - "Log at WARNING per the error-handling policy; never swallow silently."
