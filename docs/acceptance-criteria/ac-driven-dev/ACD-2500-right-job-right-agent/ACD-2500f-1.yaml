title: "The product owner, business analyst and test designer profiles say they change and produce requirement records"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the published profiles of product-owner, business-analyst and test-designer, which
    today declare that they produce "analysis",
    and the product-owner and business-analyst profiles declare they change nothing, although
    all three write requirement records,
  When each profile, its generated agent card and its agent registry entry are read,
  Then each of the three profiles declares it produces "requirement_records",
  And the product-owner and business-analyst profiles each declare one change surface, the
    requirement store (docs/acceptance-criteria/), with a description of the fields that
    agent writes, instead of "none",
  And the test-designer profile keeps its existing change-surface entry unchanged,
  And each agent card and registry entry shows the same produces value as its profile,
  And the it-po profile, already corrected by ACD-2500e-1, is unchanged character for
    character,
  And the list of agents declaring "requirement_records" is exactly it-po, product-owner,
    business-analyst and test-designer.
