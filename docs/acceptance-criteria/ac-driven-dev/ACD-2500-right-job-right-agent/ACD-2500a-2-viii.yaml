id: ACD-2500a-2-viii
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: high
title: "A rule-check run given no before-state repairs nothing and says which families it could not evaluate"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a feature folder holds 3 records at readiness "approved" and work_status "done",
    and a fourth record ACD-9990a-4 whose parent ACD-9990a lacks the back-link to it,
  When the requirement rule check is run by hand on that folder with neither a before-state
    revision nor a before-state snapshot,
  Then no record file in the folder is changed: all 3 records still read readiness
    "approved", and ACD-9990a's covered_by is unchanged,
  And the readiness family and the protected-field family list every record as
    "not evaluated: no before-state",
  And the missing back-link is still reported, with disposition "needs a decision" and the
    id that would have been added, instead of "fixed",
  And the report states, before any finding, that no before-state was given and that the
    run therefore repaired nothing,
  And the same folder checked with a before-state taken from the last commit repairs the
    back-link ("fixed") and leaves the 3 approved records approved.
depends_on:
  - ACD-2500a-2
  - ACD-2500a-2-iv
doc_links:
  - path: docs/known-issues/ac-store/open-low-ki-acs-20261015-rule-check-without-before-state-demotes-approved.md
    relationship: related
