risk_surface: contract_boundary
package_surface: false
criteria: |
  Given 150 live workspaces, among them:
    - "pushed", whose branch carries two commits that are on its own line of work
      on the shared project but not on the shared main line, its pull request open
      and unmerged, and which has no uncommitted change,
    - "squashed", whose three commits reached the shared main line only as one
      combined commit with the same content under a new identifier, and which has
      no uncommitted change,
    - "rebuilt", whose commits are all on the shared main line and whose only
      uncommitted changes are tracked files that the build-output rule of
      BO-4300c-1-iii identifies as changed by a build rather than by the work,
    - "unsent", carrying one commit that is on neither its own line of work on the
      shared project nor the shared main line, one changed tracked file the work
      made, and one new file the project's ignore rules do not exclude,
  When the live set is assessed,
  Then every one of the 150 carries exactly one of two verdicts: holds work, or
    holds nothing,
  And no workspace is left without a verdict,
  And a workspace carries the holds-nothing verdict only when both of these are
    true of it: every commit on its branch is on its own line of work on the shared
    project or on the shared main line, a commit counting as on the shared main line
    when its content arrived there under a different identifier; and it has no
    uncommitted change other than tracked files that the build-output rule of
    BO-4300c-1-iii identifies as changed by a build,
  And every other workspace carries the holds-work verdict, which follows from any
    one of these on its own: a commit on neither its own line of work on the shared
    project nor the shared main line; a modified tracked file that the build-output
    rule does not identify as changed by a build; a staged change; an untracked file
    the project's ignore rules do not exclude; or a stash entry belonging to it,
  And every holds-work verdict names each commit that produced it by identifier,
    each file that produced it by path, and each stash entry that produced it,
  And "pushed", "squashed" and "rebuilt" each carry the holds-nothing verdict,
  And "unsent" carries the holds-work verdict naming exactly its one commit, its
    one changed tracked file and its one new file.
depends_on: [BO-4100c, BO-4300c-1-iii]
