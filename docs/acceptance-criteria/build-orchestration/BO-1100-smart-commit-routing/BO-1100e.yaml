criteria: |
  Pattern recognition is fast and cost-effective thanks to targeted filtering.

  When the specialist analyses history to detect recurring commit shapes, it
  uses a filtering skill that narrows git log output to structurally similar
  commits before analysis begins. It never reads thousands of unrelated log
  entries. The result is lower latency, fewer tokens consumed, and accurate
  pattern detection even in repositories with long histories.
