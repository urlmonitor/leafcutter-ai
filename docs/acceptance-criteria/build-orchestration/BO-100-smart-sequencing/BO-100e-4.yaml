notes: |
  THE CHEAP WRONG FIX THIS CLOSES: making the loop terminate by ending the run at
  the first failure. That satisfies BO-100e-2 trivially and destroys the value
  BO-100e-1 buys, because a 37-piece body of work with one failing piece would then
  build less than today's single-pass behaviour does.

  The third scenario keeps the containment rule honest: containment must not turn a
  run that built nothing into a run that ends without saying so. What it says is
  BO-300d's subject; that it does not claim success is this record's.
