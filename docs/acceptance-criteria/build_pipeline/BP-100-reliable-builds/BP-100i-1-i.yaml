criteria: |
  Given the commit_guardian.json contains a "hook_parity" section with:
    "excluded_scripts": ["check_legacy_only.py"]
  And the runtime source directory contains "check_legacy_only.py"
  And the canonical template directory does NOT contain "check_legacy_only.py"
  When the parity check runs at pre-commit time
  Then no violation is reported for "check_legacy_only.py"
  And the hook exits with code 0
  And any other scripts that ARE missing from the canonical template
    (and are NOT in the exclusion list) still trigger a blocking violation
