id: BO-2500a-8-i
components:
  - build_orchestration
  - ac_store
title: "A record cannot be written declaring no test is needed unless it also states why"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a requirement record being added or changed that sets test_required to
    false,
  And its test_rationale is absent, null, an empty string, or only whitespace,
  When the commit-time record check (check-ac-schema) checks the record as part of
    the change being committed,
  Then the record is refused,
  And the refusal names the record id, the field test_rationale, and that a
    test-free declaration needs a stated reason,
  And the refusal applies at every readiness (draft, reviewed, approved) and for
    every change_target, so the authoring side can no longer produce a record the
    done gate refuses at mark time,
  And the same record carrying a non-empty test_rationale is accepted,
  And a record whose test_required is true or absent is checked exactly as before,
    with test_rationale still optional for it,
  And the test "is the reason non-empty" applied here is the same shared rule the
    done gate applies (BO-2500a-1-ii), so for any record the authoring check and the
    done gate agree on whether a reason is present,
  And a stored record that lacks a reason and is not part of the change being
    committed is not refused by that commit; it is refused the first time it is
    itself changed,
  And the refusal is made by the commit-time record check alone: the store schema
    carries no conditional rule for it, and its only change is a clearer
    description of test_rationale stating both meanings (with test_required false,
    the reason no test can prove the record; alongside test_spec, the
    justification for that test contract's shape),
  And the whole-store baseline test that validates every stored record against the
    schema is unchanged and still passes with the 99 stored records that lack a
    reason.
depends_on: [BO-2500a-8, BO-2500a-1-ii]
