id: BP-1500d-1-i
components:
  - build_pipeline
title: "The record describes the producing end truthfully -- where the package stood, and which of its files the deployment came from -- or says plainly that it cannot"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: draft
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given the same real build run in one session against two receiving projects on
    disk -- one laid out so the producing package and the project's own root are
    genuinely the same directory, and one laid out so the producing package sits
    beside the project and nowhere inside it or above it,
  When each project's record is read back afterwards from the bytes that project's
    own build wrote into it,
  Then each record describes the producing end of its own deployment: where the
    producing package stood in relation to that record, and which of that package's
    own files the deployment was taken from,
  And in the first project both halves of that description are stated, and both are
    true of the project the record sits in,
  And in the second project neither half is silently reduced to nothing: the record
    either describes the producing end in terms that hold for that project as it now
    sits, or says plainly that the producing end cannot be described from there --
    it never records the answer it would have given had the package been in the same
    place, and never records an empty account of the package's files as though the
    package had shipped none,
  And the two halves agree with one another, so a reader that takes the stated
    position of the producing package together with the stated names of that
    package's files arrives at files that exist; a truthful position paired with
    names that cannot be read from it is no more usable than either alone,
  And the unavailable answer is distinguishable, to a reader and to an automated
    caller, from the answers a legitimately same-directory install produces, so "the
    package is right here and these are its files" and "I could not work out where
    the package was, and so recorded none of its files" cannot be received as the
    same answer,
  And the first project is the control that makes the second verdict attributable: a
    record that says same-place and names the package's files from there, and a
    record that says same-place and names none because the build could not express
    the answer, are otherwise the same shape -- so only running both layouts in one
    session separates a build that reports the producing end from one that reports a
    default,
  And the description is demonstrated to FAIL, before it may be accepted as passing,
    on a record whose stated producing end does not hold for the project it sits in
    -- which must be reported as a description that does not hold, rather than
    followed, and rather than read as an absence of anything to describe -- and both
    good records are read again after that breakage and still give their own correct
    and different answers, so the red is attributable to the breakage and not to a
    fixture that was already broken,
  And this behaviour concerns only what the record SAYS about the producing end and
    whether that statement is true where the record sits; the verdict a check gives
    when it can find no readable record at all, and the vocabulary in which a check
    reports what it did and did not compare, are separate judgements that this
    behaviour neither makes nor replaces,
  And every verdict is taken from records that are written into real projects on
    disk by real builds and read where they sit, never from reading the build's own
    source for the presence of an unavailable answer.
depends_on:
  - BP-1500d-1
