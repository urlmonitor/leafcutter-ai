criteria: |
  Commit-time lifecycle enforcement fills the gap the backfill-only audit cannot catch.

  The existing audit tooling can reconcile and backfill which code implements which
  requirement, but it cannot detect code left stranded when a requirement retires.
  This capability adds exactly that missing detection at commit time, reusing the
  audit's traceability data rather than re-implementing it, so the two work
  together with no overlap.
