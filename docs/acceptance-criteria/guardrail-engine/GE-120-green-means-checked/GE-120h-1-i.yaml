notes: |
  WHY THIS EDGE CASE NEEDED ITS OWN RECORD. The parent's clauses are all about what the
  reconciliation reports when it CAN read everything. Every one of them stays green on
  an implementation that swallows a read failure and continues with three surfaces
  instead of four — and that implementation is strictly worse than no reconciliation at
  all, because it produces an authoritative-looking clean result. This repository has
  already recorded the same shape four times over (silence is not a pass), including one
  check that printed "skipping check (fail-open)" and exited 0 while the same check on
  the same files blocked with six violations elsewhere.

  THE TWO ARMS ARE DIFFERENT DECISIONS AND THE GROUNDS ARE DIFFERENT. GE-120's standing
  rule says block-versus-announce is decided per check, explicitly, with no default, so
  both are decided here rather than left open:
    - AN ADVERTISING PLACE CANNOT BE READ -> announce, do not refuse. The claims of the
      other places are still worth reconciling, the author's own change is probably
      unrelated to the unreadable artifact, and refusing would make an unrelated file's
      permissions a commit-stopper. The whole obligation is that the result is not
      mistaken for agreement.
    - THE EXECUTING LIST CANNOT BE READ -> refuse. There is nothing to compare anything
      against; every claim in the repository becomes unreconcilable at once. A clean
      result in that state is a statement about a comparison that did not occur, which
      is the exact thing GE-120's L0 exists to forbid. This is also self-limiting in
      practice: that file being unreadable means the commit path itself is broken.

  NAMED MUTATION — EXECUTE IT, DO NOT DESCRIBE IT. Every clause here asserts an absence
  or a distinction and is green on an implementation that reports nothing at all.
  INJECTION: make the reconciliation treat an unreadable place as carrying no claims and
  continue. Under that injection the first arm must go RED — the run reports agreement
  for a repository in which one surface was never read, and its stated count silently
  covers claims nobody looked at. Revert must return it to green. If the mutation does
  not go red, the fixture is not actually making the artifact unreadable; fix the fixture
  before believing any result from it.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's fields.

  ---- IT PO ENRICHMENT, 2026-09-14 ----

  HOW THE NAMES IN it_requirements WERE VERIFIED. The four advertising places and the
  executing list were each opened in this worktree on 2026-09-14 (README.md, config.py,
  commit_guardian.json with its 38 top-level keys and 62-member hooks_manifest.hooks,
  and templates/scripts/precommit-autofix.json). KI-CG-026's discarded-passing-path
  stdout is not asserted from memory either: the manifest entry for
  check-identifier-uniqueness carries verbose: true with a comment giving that exact
  reason, which is the precedent cited. No configuration key is named anywhere in this
  record's enrichment, so there is nothing here of the shape
  KI-CG-20260831-fictional-config-schema-fragment warns about.

  THE verbose: true POINT IS A DEPENDENCY ON THE PARENT'S UNSETTLED SHAPE. It only
  applies if the reconciliation lands as a registered pre-commit entry. That question is
  open on GE-120h-1 and is flagged in its notes together with the package_surface
  consequence; this record inherits the same open question rather than resolving it.
