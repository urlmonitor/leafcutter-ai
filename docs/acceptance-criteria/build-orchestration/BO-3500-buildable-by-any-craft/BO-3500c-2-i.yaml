    reason: "Finding F3 — the reachability clause was circular. It required the page to appear in the project's documentation index, which is GENERATED during the same build the run executes, so the proof and the thing proved shared a producer; and the known-issues register records that index being overwritten with an empty stub by a mis-rooted build, so the check can also fail for an unrelated reason. Reachability is now required from a hand-authored surface, and a second scenario rejects a generated-index-only route explicitly."
