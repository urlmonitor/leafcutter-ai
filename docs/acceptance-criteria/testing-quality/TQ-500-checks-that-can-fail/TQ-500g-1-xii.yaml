    contract: >-
      Pin store <git-dir>/leafcutter/pins/<work-key>.json through _wvp_store, keyed by
      _wvr_scope.norm_name, and the plan module _wvp_plan with its decision record {name, source, reason,
      alteration_id, replacements}.
