criteria: |
  Given a ticket has change_target: code and risk_surface: internal,
  When the guardrail engine resolves the applicable quality gates,
  Then the resulting guardrail set contains exactly one mandatory gate:
    - standard_tdd: tests are written before implementation and verified after
  And no additional gates are included (no architecture review, no migration plan,
    no consumer notification)
  And the guardrail set is returned as a list containing one gate identifier

  Given a second ticket also has change_target: code and risk_surface: internal,
  When the guardrail engine resolves its quality gates,
  Then it produces the identical guardrail set as the first ticket
  And the mapping is deterministic for the same (target, surface) input
