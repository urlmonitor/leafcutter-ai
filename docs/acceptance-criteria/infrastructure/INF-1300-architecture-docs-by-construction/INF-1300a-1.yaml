it_requirements:
  - "SOURCE PLACEMENT AND DEPLOY REACHABILITY — MEASURED, NOT ASSUMED. Both authoring surfaces pin the runtime path `scripts/scaffold/new_arch_doc.py`, a NESTED path. `scripts/build_phases.py::build_template_standalone_scripts` globs `templates/scripts/*.py` FLAT (its own comment: 'Shallow scan — only top-level .py files; subdirectories have their own phases'), and every existing `templates/scripts/` subdirectory (ac_store, commit_guardian, feedback, sync_platforms) has a dedicated phase. No `scaffold` phase exists anywhere in scripts/build.py or scripts/build_phases.py. So a file placed at `templates/scripts/scaffold/new_arch_doc.py` is deployed by NOTHING today. The source must live under `templates/scripts/` and a deploy route to `scripts/scaffold/new_arch_doc.py` must exist; authoring/registering that route is INF-1300e's. This AC must not be signed off against a copy that exists only under `scripts/`."
  - "THE CHECK SET MUST BE DERIVED, NOT LISTED. Determine which checks apply by evaluating each hook entry's `files:` regex in the hooks manifest against the produced document's repo-relative path, filtered to tier `judgment`. The four checks the criteria name are the FLOOR, not the set: the same regexes also match check-description-field and check-surface-components-e2. Exclude only check-mermaid-drift, which the L0 fences out explicitly."
  - "THE PRODUCED DOCUMENT MUST SATISFY `description:` AND `components:` ITSELF. check_description_field blocks any `docs/**/*.md` lacking a non-empty `description:` frontmatter field, and SKILL.md section 6's frontmatter checklist omits that field entirely. The transform tier (transform-doc-frontmatter, transform-description-field) must be DISABLED in the observation: a value injected by a repair step is a follow-up step, and the last criterion forbids one."
  - "VACUOUS-GREEN GUARD 1 — the argv-blind hooks. check_diagram_naming.py and check_mermaid_parent_link.py ignore argv entirely and read `git diff --cached`; only check_doc_frontmatter.py accepts a path (`--file` or positional). Handing a path to the first two makes them examine the staged set, which may be empty. Every check in the sweep must therefore be run over a genuinely STAGED produced file."
  - "VACUOUS-GREEN GUARD 2 — the root-resolution split. check_mermaid_parent_link.py sets `REPO_ROOT = Path(__file__).resolve().parents[2]` as a MODULE-LEVEL constant derived from the hook file's own location, while its staged-file list comes from the process cwd's git index. A scratch repository outside the hook's own tree makes every `abs_path.exists()` false, so `_check_arch_doc` returns an empty list and the hook exits 0 having validated nothing. The scratch collection must be produced where the hook's `__file__`-relative root and the cwd-relative staged index resolve to the SAME directory — e.g. by copying scripts/commit_guardian/ and config/ into the scratch repo at the same relative depth."
  - "VACUOUS-GREEN GUARD 3 — the bypass token. check_mermaid_parent_link._bypass_active() reads the LAST COMMIT's subject (`git log -1 --format=%s`), and check_diagram_naming reads `.git/COMMIT_EDITMSG`. Either containing `[NO-ARCH-UPDATE]` silences the hook. No commit message or COMMIT_EDITMSG anywhere in the harness may contain that token, and the harness must assert this rather than assume it."
  - "EACH CHECK MUST PRODUCE POSITIVE EVIDENCE IT EXAMINED THE FILE, and the result must be recorded per check, never in aggregate. Available evidence: check_doc_frontmatter prints `PASSED: N doc(s) passed frontmatter validation` and emits an explicit RESULT line for the nothing-to-inspect and could-not-check outcomes. For the hooks that emit no such count, the evidence is a PAIRED NEGATIVE CONTROL: an otherwise-identical file at the same staged path, corrupted in exactly the dimension that hook owns, must exit non-zero with that hook's named violation. A zero exit with no evidence is a could-not-check and must be reported as a failure of this record, not as a pass."
  - "NO CHECK MAY BE SKIPPED, RELAXED, REORDERED, SUPPRESSED OR EDITED to obtain the result. The hook files used by the observation must be byte-identical to the repository's own, and the harness must assert that identity."
  - "Deterministic and idempotent: two runs with identical inputs produce a byte-identical document. No network access, no wall-clock read when `--date` is supplied, no reliance on the ambient locale or timezone."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4): every filesystem and subprocess boundary wrapped with a named exception type; nothing swallowed silently; failures logged at WARNING or higher or re-raised."
  - "The seven pinned flags keep their exact names and meanings (--tier --diagram-type --component --title --output --date --update-readme). Additions are additive only: --parent <path>, --root, --source-ticket <id>."
