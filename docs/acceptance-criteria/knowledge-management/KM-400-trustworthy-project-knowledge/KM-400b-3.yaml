id: KM-400b-3
title: "Readers never see partial or regressed generations"
component: knowledge-management
components: [knowledge_management]
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-400b
criteria: |
  Given A is active and descendant revisions B then C are scheduled
  When B is interrupted during construction or finishes after C has been published
  Then readers continue to see a complete published generation
  And delayed B cannot replace active C
  And concurrent publication attempts have one observable winner
  And a retrieval begun against A stays pinned to A while it is retained
