notes: |
  WHY THE MECHANISM IS IN THE CRITERIA AND NOT A FOOTNOTE. "Do not pollute the
  host" is unimplementable advice on its own, because the polluting call looks
  correctly scoped: it is issued with the sandbox as its working directory, and
  every intuition says a command run inside a directory affects that directory.
  The third Given states the fact that defeats that intuition, and the last Then
  closes the one escape hatch a reader would otherwise reach for.

  WHY THIS SITS UNDER TQ-100a. TQ-100a is the containment L1 — one test's
  malfunction must not reach past itself — and this is the same property one
  scope wider: past the run, into the repository the run borrowed. The fit is
  imperfect and the imperfection is on the record: TQ-100a's own criteria speak
  about the suite finishing despite an unloadable file, not about state outside
  the process. No existing L1 in this component covers test-environment
  isolation. An L1 along the lines of "a test never mutates state outside its own
  sandbox" would be the right home; authoring one is the product owner's call,
  not this agent's.
