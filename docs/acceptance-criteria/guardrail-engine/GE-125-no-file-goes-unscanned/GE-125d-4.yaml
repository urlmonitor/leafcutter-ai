test_required: true
test_spec:
  - name: test_answer_lists_one_entry_per_reduction_with_rule_condition_and_survivors
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Asking the deployed check what it declines to examine, with nothing staged, returns one entry per reduction in force, each naming the removed detection rule, the condition, and the rules that still apply — including that ENTROPY_HIGH is the only rule removed and the four regex rules survive"
  - name: test_answer_is_obtainable_without_reading_the_source
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "The answer is obtained by invoking the check through its own query surface as a subprocess — proving a reader can reach it without opening the file, which is the failure mode the original exemption embodied"
  - name: test_classification_from_the_answer_agrees_with_observed_treatment_for_both_paths
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "src/vendor/tickets/handler.py and src/app.py are each classified using only the conditions the answer states, then each is actually checked in a throwaway repository with an opaque credential-shaped value in it; the derived classification matches the observed treatment for both. THE LOAD-BEARING ENTRY: it fails an answer that reports the intent ('four prose directories') rather than the substring behaviour"
  - name: test_answer_carries_no_credential_shaped_value_line_or_file_content
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The answer contains no credential-shaped value, no matched line and no content from any file, so it stays safe to print into a terminal, a CI log or a documentation build"
  - name: test_asking_the_question_has_no_side_effects_on_exit_status_or_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Asking the question exits without blocking, writes no file, performs no scan, and leaves a subsequent ordinary commit in the throwaway repository behaving exactly as it did before"
  - name: test_zero_argument_invocation_path_is_unchanged_by_the_new_query_surface
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Invoking the check with no arguments, as pre-commit does, still discovers the staged set and returns the same integer exit code as before the query surface existed — the regression the addition of a CLI most easily causes"
  - name: test_query_surface_works_in_the_deployed_layout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "After `python scripts/build.py --target-dir .`, the deployed scripts/commit_guardian/check_secrets.py answers the same question with the same entries and imports nothing missing from the deploy manifest"
test_rationale: "Asking a check to describe itself is cheap and is usually satisfied by printing a hand-written paragraph, so the coverage has to be shaped around the ways that fake passes. The agreement entry is the load-bearing one and is a seam test rather than a criterion test: the producer is the answer and the consumer is the classification of a real path, and the only evidence that matters is the real producer's real output driving the real consumer to a verdict that matches what the check actually does. Both halves must be executed — obtain the answer, then scan the path — because verifying by reading the source reproduces the exact method this goal exists to replace: the original exemption was fully visible in the source and stayed unnoticed for the life of the check. The zero-argument entry exists because check_secrets.py has no CLI today; adding one is the change most likely to break the pre-commit invocation, and no other entry would see it. The deployed entry exists because CLAUDE.md records a hook dependency omitted from the build deploy manifest crashing the deployed hook with ModuleNotFoundError while the source-tree tests stayed green, and this hook is a required gate. Fixture credential content is assembled at runtime from fragments, following unit_tests/commit_guardian/test_scan_secrets_suppression.py, and the path pair is chosen to differ at the time the test runs rather than hard-coded to a verdict a sibling may change."
