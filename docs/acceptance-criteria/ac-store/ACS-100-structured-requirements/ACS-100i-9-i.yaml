id: ACS-100i-9-i
components:
  - ac_store
  - commit_guardian
  - agent_registry
title: "Both readers of the store yield the same producer name, whatever quoting the record was written with"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a record whose declared producer is written with surrounding quote
    characters in the file — 16 records do this today, 10 reading
    `"python-coder"`, 5 `"test-failure-triage"` and 1 `"documentation-expert"` —
    and given the two ways this store is read: a real YAML parse, which returns
    the name without the quotes, and the fallback reader used when that parser
    is unavailable, which returns the line's value as written and so keeps them,
  When the same record is checked once under each reader,
  Then both reach the same verdict about it,
  And that verdict is the one a dispatcher would act on, because a dispatcher
    reads the parsed value.

  Given the fallback reader specifically,
  When it reads a quoted producer name,
  Then the name it yields is the same name the real parser yields, so a record
    is never accepted by one reader and refused by the other purely because of
    how it was written.

  Given any record the producer rule reports on,
  When the check finishes,
  Then the record still carries the value it had — the check reports and leaves
    the correction to an author.
depends_on:
  - ACS-100i-9
