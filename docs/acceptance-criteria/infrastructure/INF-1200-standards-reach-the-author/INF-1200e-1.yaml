it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED, AND IT FOLLOWS FROM THE SURFACE DECISION BELOW.
    Under the recorded decision that the examination is a non-blocking part of the build's own
    outcome rather than a pre-commit gate, it registers nothing: no hooks_manifest.hooks id, no
    new top-level key on commit_guardian.json, no agent entry, no skill entry, no paths.json
    surface. Plain-list spec form; no fictional config_schema_fragment. THE TRIGGER: if the user
    later decides the condition must BLOCK, the natural home is a commit-guardian hook, which
    means one watched hooks_manifest.hooks id and a per-check top-level section — at which point
    this record must be re-declared package_surface: true with a real fragment. Do not
    pre-emptively add either.
  - >-
    THE SURFACE DECISION THE L1 EXPLICITLY LEFT TO ENRICHMENT, DECIDED AND REASONED. Whether an
    uninformed pairing should merely be REPORTED or should STOP something is settled here as:
    REPORTED, on the delivery run's own outcome, non-blocking, and additionally runnable
    standalone against the project as it stands. Two measured reasons, neither of them
    preference. FIRST: the population of uninformed pairings is owned in part by two other
    approved records — an unowned kind of file is AR-100's gap and an unregistered check is
    BP-1600a-2's — so a gate that refuses commits on this condition would block work on a
    condition this tree cannot fix, creating a cross-record deadlock. SECOND, and decisive: this
    project's hook framework has NO warn tier. The manifest `tier` field takes only "judgment"
    and "transform" and is not a severity; run_hook.py has no advisory handling; so a hook is
    block-or-nothing and "report but do not block" is not expressible as one. What is NOT open,
    per the L1, is visibility: the condition must be nameable, one pairing at a time, and it is.
  - >-
    INFORMEDNESS IS JUDGED BY READING THE BRIEF, NEVER THE CARRIER'S ACCOUNT — AND THIS IS THE
    RECORD'S CENTRE OF GRAVITY. The examination has three inputs: config/agent_registry.json,
    templates/scripts/commit_guardian/commit_guardian.json, and the COMPILED briefs on disk under
    .claude/agents/. Whether a specialist counts as told is decided by reading the third. No
    in-memory hand-off from the carrier, no emitted-standards log, no return value of the
    injection function, and no shared data structure may be consulted. They agree until they do
    not — a compilation step that drops content, a deployment that ships a stale brief, a marker
    that fails to resolve — and reading the carrier's account is what an implementer reaches for
    because the data is already in hand. It produces a report that is a restatement of the
    delivery's intentions.
  - >-
    THE UNIT IS A PAIRING AND THE REPORT MUST NAME ALL THREE OF ITS PARTS. Specialist, kind of
    file, and the standard it has not been told. A per-specialist verdict cannot express the
    third arm — a specialist owning two covered kinds and told one of them must be named ONCE,
    for the kind it was not told about, and not for the one it was. Model the finding as a
    pairing from the outset; a per-specialist boolean cannot be widened into one later without
    rewriting every consumer.
  - >-
    THE NEGATIVE ARM IS MANDATORY AND ITS POSITIVE CONTROL IS SINGULAR — MEASURED. Every positive
    arm is satisfied by an examination that names every pairing all the time; such a thing is
    never wrong and means nothing. Whether the report is worth reading is decided entirely by
    whether it can decline to name someone. Measured in this worktree, exactly one pairing is
    correctly informed today: templates/agents/python-coder.md states the .py line limit at five
    points, all resolving from the declaration. That is the only positive control drawn from
    reality that exists, and the negative arm must be exercised against it before any clean
    result from this examination is worth anything.
  - >-
    THE UNINFORMED FIXTURES ARE ALSO REAL AND ARE THE POSITIVE CONTROL FOR THE POSITIVE ARM —
    MEASURED. sql-coder owns '.sql', which carries a declared limit of 600, and its template
    states no standard at all. Three further standards (complexity 15, sql_complexity 75,
    folder_density 15) are fully configured and no specialist anywhere is told any of their
    figures. Those pairings are known-uninformed and the examination must demonstrably find them
    against the project as it stands. A census that has never been shown to find a real gap is
    the shape CLAUDE.md records three times over.
  - >-
    FENCED FROM BP-1600 AND FROM INF-1200d-1-i. BP-1600 owns a check working out its own subject
    matter from what is really there rather than from a list; reuse its shape and do not build a
    second reachability census. The populations do not overlap — a fully registered, fully
    running standard can still have an audience of nobody. And a standard whose audience is EMPTY
    has no pairing at all, so this examination structurally cannot see it; that hole is
    INF-1200d-1-i's, closed on the delivery's own outcome, and must not be closed a second time
    here.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around all three
    reads; log at WARNING or higher or re-raise; no bare or blind excepts. The degraded path is
    INF-1200e-2's subject and is not optional here: a read that fails must not yield an empty set
    of pairings that reads as "no gaps found".
test_spec:
  - name: test_inf_1200e_1_an_uninformed_pairing_is_named_with_its_specialist_kind_of_file_and_standard
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      With a standard declared for a kind of file whose assigned owner's compiled brief does not
      state it, run the examination and read its outcome. That pairing is named, and all three
      parts are present: the specialist, the kind of file, and the standard it has not been told.
      A per-specialist verdict fails this descriptor, because it cannot say which of a
      specialist's kinds is missing.
  - name: test_inf_1200e_1_a_fully_informed_specialist_is_not_named_at_all
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE NEGATIVE ARM, AND IT IS THE ONE CARRYING THIS RECORD. For a specialist whose material
      states the standards for every kind of file the ownership record assigns it, the examination
      does not name it at all. Exercised against the ONE positive control that exists in reality —
      the single pairing correctly informed today — rather than against a fixture the test
      authored, because a report that names everybody passes every positive arm and is never
      wrong.
  - name: test_inf_1200e_1_a_partly_told_specialist_is_named_once_for_the_kind_it_was_not_told_about
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      For a specialist owning two kinds of file that carry standards, whose material states one of
      the two, the examination names it ONCE — for the kind of file it was not told about — and not
      for the one it was. Two assertions on one outcome: the presence of exactly one finding for
      that specialist, and the identity of the kind of file that finding names.
  - name: test_inf_1200e_1_a_brief_that_lost_its_standard_downstream_is_named_even_though_the_carrier_reports_the_same_work
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE FOURTH ARM, AND THE SUBTLE ONE. Build normally so the carrier does its work and reports
      it, then damage the compiled brief on disk so a standard it stated is gone — the realistic
      causes are a compilation step that drops content, a deployment that ships a stale brief, and
      a marker that fails to resolve, so use one of those rather than deleting a line by hand where
      possible. Run the examination. That specialist is named. Whether a specialist counts as told
      is decided by reading the material it begins work from, never by any account the carrier gives
      of what it carried.
  - name: test_inf_1200e_1_the_name_everyone_injection_reds_the_negative_and_partial_arms_and_leaves_the_first_green
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's FIRST NAMED MUTATION, CARRIED VERBATIM. MUTATION: name every pairing of a specialist
      and a kind of file it owns, regardless of what that specialist's material states. Under that
      injection the first arm must STAY GREEN, the negative arm must go RED, and the partially-told
      arm must go RED. Both greens and both reds must be observed and all must revert. This is the
      report that says "everyone" and means nothing, and it is what an examination degenerates into
      the first time somebody makes it pass in a hurry.
  - name: test_inf_1200e_1_the_carriers_account_injection_reds_only_the_fourth_arm
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's SECOND NAMED MUTATION, CARRIED VERBATIM. MUTATION: decide whether a specialist counts
      as told by consulting the carrier's own record of what it emitted, rather than the material
      the specialist begins work from. Under that injection the first three arms must STAY GREEN —
      the carrier's account is accurate whenever nothing downstream has gone wrong — and the fourth
      arm must go RED. Both outcomes must be observed and both must revert. AN INJECTION RUN THAT
      REDDENS THE FIRST THREE MEANS THE FIXTURE IS NOT EXERCISING A HEALTHY DELIVERY and the result
      is not the one this mutation is for.
  - name: test_inf_1200e_1_the_examination_finds_the_known_uninformed_pairings_in_the_project_as_it_stands
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "python scripts/build.py --target-dir <temporary target root>"
    description: >-
      PRODUCTION ENTRY POINT AND POSITIVE CONTROL IN ONE. Run the examination through the surface it
      actually runs on — the build's own outcome, per the recorded surface decision — against the
      project as it stands, and assert it finds the pairings measured as uninformed today (a
      database-code owner told nothing about its declared limit; three further configured standards
      whose figures reach nobody) and does NOT name the one pairing measured as informed. An
      examination that only ever runs in a test harness is inert, and a census that has never been
      shown to find a real gap is the shape this project's root instructions record three times
      over.
test_rationale: |
  Today a specialist that was told nothing and a specialist for which no standard exists produce
  identical evidence: nothing. Every other criterion in this tree can therefore be reported
  satisfied by something that covers one pairing and stops — which is precisely the state the
  project is in, and it has looked fine for as long as it has existed. So the descriptors here are
  built around the two things that make a census worth reading: that it can decline to name someone,
  and that it reads the truth from the brief rather than from the thing that was supposed to write
  it.

  The negative arm is exercised against the ONE positive control that exists in reality. Measured in
  this worktree, exactly one pairing is correctly informed — python-coder and .py, stated at five
  points, all resolving from the declaration — and the known-uninformed pairings are equally real: a
  database-code owner with a declared limit of 600 and no statement of it, plus three fully
  configured standards whose figures reach nobody. Both halves of the control are therefore drawn
  from the project rather than authored, per CLAUDE.md's real-artifact rule.

  The fourth arm is the one that is not redundant with the others, and it is asserted by damaging the
  compiled brief AFTER a healthy build rather than by constructing a broken delivery. There are two
  places the truth could be read from — the material the specialist begins work from, and the
  carrier's own record of what it emitted — and they agree until they do not. Reading the carrier's
  account is easier, it is what an implementer reaches for because the data is already in hand, and
  it produces a report that is a restatement of the delivery's intentions. This project's own history
  is the argument: three separate defences reported clean for days or weeks while examining nothing,
  and each time the clean result was believed because it came from the thing that was supposed to
  know.

  Both of the BA's mutations are carried verbatim and both are mixed-outcome. The first keeps the
  first arm GREEN while reddening the negative and partial arms; the second keeps the first THREE
  green and reddens only the fourth, with the explicit failure condition that an injection reddening
  the first three means the fixture is not exercising a healthy delivery. Neither stay-green half may
  be dropped: they are what distinguish a report that discriminates from one that says "everyone".
delivers_to:
  - agent: python-coder
    ac_id: INF-1200e-2
    contract: >-
      The examination's outcome object: the set of named pairings, the count of pairings examined,
      and the per-input read status for each of its three inputs (ownership record, declaration,
      compiled briefs). e-2 requires that outcome to state an inability and which input caused it,
      to carry a coverage count greater than zero on a healthy run, and to be distinguishable
      between a run that examined everything and found nothing and a run that examined nothing.
expects_from:
  ac_id: INF-1200b-1
  contract: >-
    The set of (specialist, kind of file, standard) pairings the build-time join yields, which is
    the DENOMINATOR of this examination — which pairings OUGHT to exist. Informedness itself is
    never taken from this contract: it is decided by reading the compiled brief on disk, which is
    the fourth arm's whole subject.
