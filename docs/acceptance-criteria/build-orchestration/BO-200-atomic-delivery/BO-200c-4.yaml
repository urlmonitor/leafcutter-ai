id: BO-200c-4
components:
  - build_orchestration
title: "An approved commit message subject line is never rewritten by hooks or subsequent staging"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the user has approved a commit message subject line in Step 3 of the commit workflow,
  When a pre-commit hook auto-fixes files and re-stages them,
  Then the original approved subject line is preserved verbatim,
  And only the commit body may be amended to reflect the additional staged files,
  And no hook or agent overwrites the subject line the user already confirmed.
depends_on: [BO-200c]
