estimated_complexity: S
it_requirements:
  - "Period construction is scripts/agent-health/weekly_health.py::iso_week_starts(today, weeks) -> list[date] and must take the reference date as an ARGUMENT rather than reading the clock. The command-line surface must expose that argument (the --today flag documented in scripts/agent-health/README.md) so any run is reproducible; a function that called date.today() internally would make every scenario above untestable without freezing time."
  - "Every returned date must be a Monday, derived by subtracting the reference date's own weekday index. A reference date that is already a Monday must map to itself and must not be pushed back a week."
  - "The list must be ordered oldest first and its last element must be the Monday of the week CONTAINING the reference date, so the most recent period is the current, still-incomplete week rather than the last completed one. Both properties are consumed by the renderers, which read left to right and describe the final period's partial day count in the header."
  - "A weeks argument below 1 must be clamped to 1 rather than returning an empty list or raising. Every downstream section indexes the most recent period, so an empty period list would leave the report with nothing to describe."
  - "A defect here corrupts all four report sections at once and does so invisibly — the tables still render and the trends still move, they are simply about the wrong days. Any change to this function must be accompanied by assertions against FIXED reference dates; a test that derives its expectation from the current date passes every day of the week while asserting nothing about the Monday rule, and is exactly the shape that lets an off-by-one week survive."
test_spec:
  - name: TestIsoWeekStarts::test_returns_requested_number_of_mondays
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "4 weeks relative to Wednesday 2026-08-26 produces exactly 4 periods and every one of them begins on a Monday."
  - name: TestIsoWeekStarts::test_last_entry_is_the_monday_of_the_reference_week
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "3 weeks relative to Wednesday 2026-08-26 ends on Monday 2026-08-24 — the current, still-incomplete week."
  - name: TestIsoWeekStarts::test_ordered_oldest_first
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "The returned periods equal their own sorted order, so every trend reads left to right."
  - name: TestIsoWeekStarts::test_a_monday_reference_maps_to_itself
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "1 week relative to Monday 2026-08-24 yields exactly [2026-08-24], not the preceding Monday."
  - name: TestIsoWeekStarts::test_zero_weeks_is_clamped_to_one
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A request for 0 weeks produces exactly 1 period rather than an empty list."
test_rationale: |
  Every descriptor pins a FIXED reference date — Wednesday 2026-08-26 and Monday
  2026-08-24 — rather than deriving one from the clock. That is the whole point
  of the contract: a test built on the current date would pass on six days out of
  seven while asserting nothing about the Monday rule, and an off-by-one week
  would survive it indefinitely. Because iso_week_starts takes the reference date
  as an argument, direct-import unit tests can reach both boundary cases (a
  mid-week reference and a Monday reference) with no time freezing and no
  fixtures. The count, the weekday of every entry, the final entry and the
  ordering are asserted separately, since a function that returned the right
  number of wrong days would satisfy any one of them alone.
delivers_to:
  agent: python-coder
  contract: "iso_week_starts(today: date, weeks: int) -> list[date]: the reporting periods every other section is computed per, as Monday dates ascending, length max(1, weeks), last element the Monday of the week containing today. Consumed by build_report and, through it, by INF-500e-1's movement computation, INF-500e-2's renderers and INF-500e-2-i's coverage floor, which takes the FIRST element as the oldest reporting week."
