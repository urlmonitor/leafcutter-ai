notes: |
  EDGE CASE PINNED: the difference between failing and failing usefully.

  WHY THE LOG-TEXT EXCLUSION IS EXPLICIT. The current behaviour already logs the
  missing source accurately. Every fact an author needs is emitted today, and the
  defect shipped anyway, because the exit code said success. A test that asserts the
  failure text is present is therefore green against BOTH the fixed and the broken
  implementation — it is the purest available example of the grep-shaped false green
  this repo keeps hitting. The assertion has to be the exit code and the target
  directory's contents.

  WHY THE POST-FAILURE TARGET STATE IS IN SCOPE. A build that fails after copying two
  of five declared files leaves a target that looks deployed. The next thing to run in
  that directory — a hook, a workflow, a consumer's own command — cannot tell the
  difference, which converts a caught build failure back into the silent runtime
  failure BP-900g-10 exists to catch.

  TEST ANGLES for it-po. `boundary` (three findings in one run versus one; and the
  all-resolve case as the false-positive control) and `reachability` with must_block
  through the real build entry point. `deployed` is triggered in the weak sense that
  the assertion inspects a produced target directory; one subprocess test that runs
  build.py into a temp target and then inspects the tree charges both and stays inside
  the cap.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO ENRICHMENT NOTE (2026-08-17). One clause was under-specified for
  implementation and has been pinned in it_requirements rather than in the criteria.

  "A state an author can recognise as failed" admits two implementations — write an
  explicit failure marker into the target, or do not leave a partial tree at all — and
  they have different consequences for the next process that opens that directory. The
  AC does not need to choose, but the IMPLEMENTATION does, and if the choice is left
  implicit the clause gets satisfied by whatever the code happens to do. The constraint
  therefore requires the implementer to declare which mechanism was chosen in the
  sign-off and to assert it. Failing-path idempotency (run the failing build twice, same
  recognisable state) was added for the same reason: a marker written non-deterministically
  is not a state anything can rely on.

  `deployed` is charged here despite the parent declining it. That is deliberate and
  not a contradiction: BP-900g-9's observable is the build process's own exit, while
  this AC's third clause is a claim about a directory the build produced, and the only
  way to judge it is to produce one and look.
