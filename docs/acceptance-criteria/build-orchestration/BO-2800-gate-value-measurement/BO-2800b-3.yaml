criteria: |
  Given three recorded findings — (a) one emitted by an owned gate carrying a rule
    identifier drawn from that gate's declared vocabulary, (b) one mined from the frozen
    historical corpus carrying only English prose and no rule identifier and emitted by no
    gate that still declares a vocabulary, and (c) one emitted live by a gate whose rule
    identifier is absent from, or not present in, that gate's declared vocabulary,
  When each finding's identity is derived,
  Then the signature method recorded on each is drawn from a closed set of exactly three
    values — "declared" for (a), "heuristic" for (b), and "unclassified" for (c) — and no
    fourth value is written,
  And (b)'s identity is derived by normalising its prose, while (a)'s and (c)'s are not,
  And a finding that carries a declared rule identifier never has its identity re-derived
    from prose.

  Given an aggregate reporting occurrence counts over findings of all three methods,
  When the aggregate is produced,
  Then the declared, heuristic, and unclassified contributions are reported as three
    separate figures rather than one blended total,
  And a report that would present a heuristic-derived count as if it were exact is not
    produced,
  And an unclassified count is not presented as heuristic and is not discounted as
    approximate, because its occurrences were counted from a rule identifier rather than
    guessed from prose.
