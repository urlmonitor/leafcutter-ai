expects_from:
  ac_id: DK-100a-4
  contract: 'Ranked options as list[kernel.contracts.decision.OptionRanking], best first: {option_id:
    str, rank: int >= 1, required_passed: int, required_total: int, required_mean: float 0..1, supporting_mean:
    float | null, scores: {criterion_id: float 0..1}}. Order: required_passed desc, then required_mean
    desc, then supporting_mean desc. Held in DecisionContinuation.design_ranking and shown as HumanQuestion
    choices {id: option_id, label: ''#<rank> <title>'', consequences: per-criterion band and score
    plus the cited evidence locators}. Input to the human choice only, never a decision.'
