notes: |
  BOTH LANES, SHARED SCRIPTS (user direction at the Phase A BA gate,
  2026-09-25): an ADDITIONAL guard beside verify_red_baseline and
  verify_green_and_coverage, never a replacement and never a lane-specific
  copy. Build one shared command constructor with TQ-500g-1-vi so the routes
  cannot drift (the TQ-500f-3-ii precedent).

  F3 IS THE CONTROL. Most fast-lane work names no wrong version; it must not be
  slowed or stopped, and it must never be reported as verified by runs that
  never happened.

  TESTABILITY: drive fast-lane-ship.js under the workflow-engine harness and
  assert on the recorded dispatches (runner invoked after the green check and
  before commit; the verdict consumed in control flow). A grep of the workflow
  source for the runner's name is not acceptable (CLAUDE.md, Verify
  Behaviorally, Not by Grep).

  IT-PO ENRICHMENT (2026-09-28)
  Placement refined: before commit AND after Review. So a review-driven
  change can never follow the runs.
  Lane: fast lane (python-coder) after -1-i, -1-ii, -1-iii and -1-iv. The JS
  ratchet decision is open (see the growth it_requirement).

  IT-PO AMENDMENT (2026-10-14): THE THREE-STEP DESIGN ON MAIN
  The runner (TQ-500g-1-i/-ii/-iii, #1044), the read-only test-breaker
  (TQ-500g-1-iv) and the writer with its list and write steps (TQ-500g-1-ix,
  #1206) are on main. The route sequence before commit is: recover (resume
  only), list, test-breaker (only when something is owed), then one finish
  call that writes the manifest and runs the runner. The commit is reached only
  on finish's gate_passed true.
  DECISIONS:
    - Reply transport: stdin, through a quoted here-document in the finish
      command. The workflow body cannot write files, and a reply file would need
      an extra executor step.
    - Writer stop: halt the work. The runner is never called without a manifest.
    - New Python entry: scripts/build_orchestration/wrong_version_gate.py
      finish, owned and built by THIS AC (first in the route build order);
      -vi and -vii consume it, and -viii adds the record pass-through. It holds
      no rule of its own. If the user rejects it, the fallback is two executor
      dispatches (write, then run) with a fail-closed parse of each.
    - Every must_catch test entry names in_scope_files, so this AC's own
      wrong-version runs have files to alter.
  CRITERIA CLAUSES FOR THE BA (criteria untouched here):
    - "And F3 goes on with "wrong-version runs not applicable: no test names a
      wrong version" in its outcome": the runner on main prints "wrong-version
      runs not applicable: no covering test declares a wrong version or the
      discrimination angle". Proposed: "And F3 goes on with the runner's own
      not-applicable outcome in its outcome, never "verified"."
    - "Then the fast lane makes the wrong-version runs through the one shared
      runner, with the same requirement ids, test root and base the other routes
      pass": still true, but it says nothing about the preparation. Proposed
      addition: "after asking the writer what is owed and, when anything is,
      having test-breaker prepare it from that list unchanged".
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-iv or -ix
  (BA/user to add). Existing must_catch entries without in_scope_files list
  their names with files [], so test-breaker can prepare nothing for them and
  the runner reports them unfinished. Wiring this route before those entries
  are backfilled stops every fast-lane work whose ACs carry such entries.

  IT-PO AMENDMENT (2026-10-15): AFTER TQ-500g-1-x
  TQ-500g-1-x is merged: owed names without a declaration now get a derived
  scope (scope "derived") from the files the work changed against --base-ref,
  which replaces the files [] case in the follow-up above. --base-ref goes to all three steps; finish
  forwards it to the write step as well as the runner. The route passes owed
  (with its scope key) to test-breaker unchanged.
  LIST SPEED (user decision 2026-10-15): list took 82 s for one id here
  against a 2 s / 50 ids budget. Fix it in the shared reader before wiring the
  route, proven by a timing test on the real repo. No second reader.
  in_scope_files on every must_catch entry now name the files this AC touches
  (fast-lane-ship.js, fast_lane.py, wrong_version_gate.py); the timing test
  names the reader modules (_wvr_scope.py, _wvw_list.py).

  IT-PO AMENDMENT (2026-10-21): LIST-SPEED GATE IS SCALING PLUS A CEILING
  The absolute 2 s budget failed 3 times in a row in CI's Proof-of-done job
  (its own runner) while passing in every test shard, on Windows and in a
  Linux replica. User decision: gate on scaling (50 ids <= 2.0 x 1-id time
  + 1.0 s, catches a per-id rescan at any machine speed) plus a 15 s ceiling
  per run (catches the original 82 s defect). The 2 s figure stays a target
  measured on a developer machine, not a CI gate.

  IT-PO RECONCILIATION (2026-10-23): PINNING (TQ-500g-1-xi, -xii)
  Before: test-breaker dispatched whenever owed was non-empty, with owed.
  After: the list step gets --work-key, test-breaker is dispatched only when
  the list's to_prepare is non-empty, with to_prepare unchanged; with
  to_prepare [] no test-breaker dispatch happens and finish runs with an
  empty stdin. The "to prepare" list comes from the shared list step
  (_wvp_plan via wrong_version_writer.py list --work-key), never from the JS.
  The list-speed test runs list without --work-key and is unaffected. This
  record is done; the change and its route tests are built under
  TQ-500g-1-xi (which declares fast-lane-ship.js), so this record's own tests
  need their list stubs to carry to_prepare in that same change.
