doc_links:
  - path: scripts/ac_store/done_proof.py
    relationship: related
    status: exists
    relevance: "WHY THIS POPULATION IS A DANGEROUS WRITE AND NOT A TIDY-UP. `_has_resolvable_child` decides composite-versus-leaf by whether ANY coverage entry resolves to a real record, and `verify_done_eligible` routes on that decision — a composite derives its proof from its children, a leaf must carry its own test. A parent whose entries all resolve to nothing reads as a leaf today; appending one child id flips it to composite and changes what the store believes about whether it can be finished. Re-measured 2026-09-08: 25 of the 47 current gaps sit under such a parent, across ten parents, of which BP-100b alone carries eleven."
  - path: docs/acceptance-criteria/ac-store/ACS-1400-complete-child-links/ACS-1400d.yaml
    relationship: related
    status: exists
    relevance: "THE DECISION THE ABSTENTION NAMES. This population exists because one field carries two meanings with no discriminator, and it cannot be repaired safely until child links and test links have separate homes. ACS-1400d is currently held at L1 pending a scope ruling and has deliberately not been decomposed, so this abstention is open-ended by design rather than a temporary staging step — the pass must be correct and complete with this population permanently outstanding."
  - path: docs/acceptance-criteria/ac-store/ACS-1300-trustworthy-coverage-links/ACS-1300a-3.yaml
    relationship: related
    status: exists
    relevance: "ABSTAINS ON THE MIRROR IMAGE OF THIS POPULATION AND SUPPLIES THE PATTERN. Its rule — classify by whether entries RESOLVE, never by entry shape, by the level field, or by the id string — is the one to inherit, because a legacy record can hold test-file paths where child ids would go and both proxies are wrong for exactly the records at issue."
  - path: docs/acceptance-criteria/testing-quality/TQ-400-durable-done-proof/TQ-400e-1.yaml
