criteria: |
  Given a requirement with UID 42 whose parent-pointer field holds UID 10,
  When code asks for that requirement's parent,
  Then the answer is read from the parent-pointer field and is UID 10,
  And the id-string parent-derivation routine that today computes a parent by
    stripping a segment from a requirement name is no longer the source of parent
    truth,
  And any remaining caller that still computes a parent from a name does so only
    through the documented migration-window compatibility path, not as the
    primary mechanism.
