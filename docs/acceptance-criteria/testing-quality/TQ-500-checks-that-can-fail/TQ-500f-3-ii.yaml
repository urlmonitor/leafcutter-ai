notes: |
  USER DIRECTION AT THE BA GATE (Q3): the fast lane and /build-feature must use
  the SAME existing scripts rather than reinvent them.

  WHAT HAPPENS IN THE HEAVY LANE TODAY (per the user's gate answer; the BA did
  not read the source to confirm): /build-feature has no mechanical red-baseline
  reader. The only evidence is the test writer's own statement, the red_baseline
  block in its sign-off comment. The record shows only that such a block exists
  (red_baseline_captured). Nothing re-runs the tests or classifies the red
  before the coder is dispatched. K1 is the case that statement cannot catch.

  WHY THIS IS SEPARATE FROM TQ-500f-3-i. That AC owns the rule inside the
  reader. This one owns wiring the reader into the heavy lane's phase sequence
  (ticket-supervisor / the build workflow). Either can ship and fail on its own.

  FOR IT-PO: the wiring surface is the /build-feature workflow and
  ticket-supervisor path, not the test-writer prompt. Place the call so a
  failure halts before the coder, matching the fast lane. Do not put it after
  commit: test-angles.md records gates that run after commit as a known process
  failure. Covering tests must drive the workflow under the workflow-engine
  harness and assert on the recorded dispatches. A grep of the workflow source
  for the script name is not acceptable (CLAUDE.md "Verify Behaviorally, Not by
  Grep").

  IT-PO ENRICHMENT (2026-09-25)
  WIRING SURFACE CONFIRMED FROM ARCHITECTURE (ADR-006, build-feature.js header): /build-feature
  does not dispatch ticket-supervisor. Its per-ticket driver is inlined JS (driveTicketPhases)
  and twinned in build-ticket.js, so this is a pure workflow-JS change -> python-coder. The
  ticket-supervisor path (/build-epic, building-epics skill) is NOT covered. Recommend a
  follow-up llm-expert AC.
  INTENDED must_catch: "gate placed after the coder" / "gate dispatched but verdict ignored" /
  "trusts red_baseline_verified" -> the K1 test goes red; "build-ticket.js twin not updated" -> the twin
  test goes red; "heavy lane passes different ids or omits the AC root" -> the seam test goes red.
  REGRESSION RISK: the heavy lane now inherits every existing verify_red_baseline halt reason
  (e.g. no_new_covering_tests when heavy-lane tests lack a '# covers: <source_ac>' tag). That
  follows from "verdicts identical", but it may block tickets that pass today. See open question.

  USER DECISION AT THE IT-PO GATE: tickets WITH source_ac get the full shared
  reader, including its existing halt reasons. The regression risk above is
  accepted: a heavy-lane ticket that lacks covers-tagged tests now halts as it
  would in the fast lane. Tickets WITHOUT source_ac record "red-baseline reader
  not applicable" and continue. K3 in the criteria. IT-PO: add a K3 case to
  test_spec (the outcome is recorded, the coder is dispatched, and nothing
  says it was verified).

  IT-PO PASS 2 (2026-09-25): K3 case added (failure angle). The it_requirement for tickets
  without source_ac now states the decided outcome. Added must_catch: "run the reader for K3 and halt on
  no_new_covering_tests" / "record K3 as verified" -> the K3 test goes red.

  IT-PO PASS 3 (2026-10-06; user decisions F2 and F3; build-tooling fix design sections 2,
  3 and 8; tickets T1 and T3). The resume it_requirement now states the record-and-reuse
  rule. Entries were added for the record format, the anchored atomic write, unrecorded and
  reused pass reporting, --ticket, the interpreter, lane parity, green_at_baseline and the
  size ratchet. Fourteen test_spec cases were added.
  SEQUENCING: T1 (interpreter) lands before T3 (record and reuse), because both edit the
  same gate command line and module. T2 (BO-3000a) sits between them in the JS lane.
  EXISTING TESTS TO RE-CHECK, NOT DELETE:
  - unit_tests/workflows/test_tq500f3ii_h3_resume_gate.py. Its name says it pins the resume
    path, which now reuses a valid record; a resume with no record must still run the reader.
  - The seam test's wrapper_only_keys gains the new wrapper keys.
  - Its _run helper must replace a leading python3? token, not only python3.
  OPEN FOR THE TICKET, NOT DECIDED HERE:
  - The gate executor is status-checker, which has permits_shell: false (KI-BO-20260927).
  - architect-review may want an ADR for a durable field the gate writes into the ticket
    record.
