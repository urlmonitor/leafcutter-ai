test_spec:
  - name: test_agent_eval_pattern_is_recognised_by_the_deployed_predicate
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Load the real agent-evaluation pattern AC from the on-disk store and call check_ac_pattern_refs._has_parameterized_slots on it; assert True — executes the same predicate the commit hook and the BA inventory scan run, against the real artifact."
  - name: test_agent_eval_pattern_declares_slots_in_both_places
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Run the {word} placeholder regex over the real record's criteria and compare both directions against pattern_slots; assert every declared slot appears as a placeholder and every placeholder is declared."
    covers:
      - ACS-500g-6
      - ACS-500g-2-i
  - name: test_agent_eval_pattern_declares_the_three_required_slots
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Assert the real record declares at least three slots covering the agent under test, the per-round task sets, and the per-round seeded items."
  - name: test_agent_eval_pattern_is_not_itself_a_consumer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Assert the pattern record leaves implements_pattern unset and pattern_bindings empty — a pattern that references another pattern would break the producer/consumer distinction this AC establishes."
notes: |
  Deliberate dogfooding. This is simultaneously (1) the first real pattern the
  producer half emits — proving the mechanism end to end with real slots and a
  real consumer (ACS-500g-7) — and (2) the project's agent-quality gate: no new
  or modified agent is treated as verified until it has been run through this
  protocol. Slot names are described in prose here rather than written as
  placeholders so this requirement AC is not itself mistaken for a pattern
  record.
