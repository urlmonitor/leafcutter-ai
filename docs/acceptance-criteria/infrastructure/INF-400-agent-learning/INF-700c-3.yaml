created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700c.yaml"
criteria: |
  Given the content of a knowledge surface and the count of knowledge waiting
    to be written are both things a person reads to judge whether the loop is
    working,
  When a reader opens the reference documentation for the agent knowledge
    system,
  Then it states what makes a record eligible to be written to a knowledge
    surface, and states that a record with no learning text is not eligible,
  And it states what the waiting count means, and that history already honoured
    is not part of it,
  And it records the disposition reached for the retained body of records and
    the reason for it,
  And it does not describe a recovery or a drain of that body as pending work,
  And every claim it makes about a count or a file is one a reader can check
    against the artefact named.
depends_on:
