criteria: |
  Commits either succeed completely or leave your working directory untouched.
  All changes are committed as a single unit with a properly formatted message
  referencing the ticket. If something goes wrong mid-commit, the system retries
  automatically and rolls back cleanly if retries are exhausted — no half-committed
  states, no lost work.
