id: AR-300a-5
title: "Every agent permitted to dispatch sub-agents has them named in its compiled prompt, and an agent permitted none gets no such section"
component: agent-registry
components:
  - agent_registry
  - template_compiler
  - injection_builder
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of agents whose own declaration permits at least one sub-agent
    -- 25 on the tree this criterion was authored against once the "every
    ticket-phase agent" entry is resolved, among them ticket-supervisor, whose
    permission is mostly that one entry,
  When the working instructions each agent actually receives after the build
    has compiled them are read, in every platform the build compiles for,
  Then each of those compiled instructions carries one section naming that
    agent's permitted sub-agents, with the "every ticket-phase agent" entry
    shown as the agents it resolved to on that build and each sub-agent named
    once,
    And every sub-agent the declaration permits appears in that section, so the
      section is the whole permission and not a sample of it,
    And an agent whose declaration is absent, or present and empty, carries no
      such section -- in particular no heading followed by an empty list,
    And the evidence is taken from the compiled instructions alone, never from
      the central record or the source definition, and the comparison
      enumerates every agent the build compiled and states how many it examined
      and how many held a permission,
  So an agent knows which specialists it may call on before it begins, instead
    of receiving nothing, as every agent does today.
depends_on:
