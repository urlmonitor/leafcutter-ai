notes: |
  ORIGIN (2026-08-18, BrainCandy). This L1 exists because of a confirmed defect and
  a design insight that the obvious fix would destroy. Both are recorded here so the
  next author does not relitigate either.

  THE DEFECT — VERIFIED, DO NOT RE-DERIVE.
  generate_ticket_from_ac.py asks one question about a piece of work and branches the
  entire proof demand on it:
    - line 2740  is_code_ac = _computed_map_has_production_code_producer(agents)
    - line 2068  _computed_map_has_production_code_producer -> _agent_produces_production_code
    - line 1055  _agent_produces_production_code -> _load_production_code_agents (line 658)
                 with a hardcoded _FALLBACK_PRODUCERS frozenset of 9 names at line 1073
                 (python-coder, sql-coder, frontend-coder + six sql-* specialists)
  Consequences, all read directly from the source on 2026-08-18:
    - line 2773  the else branch records PASS with "non-code AC — no test contract
                 required". The pipeline reports the ABSENCE of any proof demand as a
                 SUCCESS. This is the phantom-done pattern one level up: not a missing
                 test, but a missing REQUEST for a test, wearing a green label.
    - line 2776  readiness check #4 ("would the generated Test Requirements pass the
                 ticket guard?") is itself gated on `is_code_ac`, so for judged work it
                 is not merely failed — it is never attempted.
    - line 2783  the it_requirements check is gated the same way.
  Measured over the real store (figures supplied with this authoring request, taken
  from a real generation run over the real store; the two I could re-derive cheaply
  I did): 3,061 ACs, of which 444 are assigned to llm-expert (RE-VERIFIED 2026-08-18:
  `grep -rlc "assigned_agent: llm-expert" docs/acceptance-criteria/ --include=*.yaml`
  returns exactly 444 files; a full-store find returns 3,062 .yaml files, one more
  than the quoted 3,061, consistent with concurrent authoring in this worktree).
  124 named test contracts exist on llm-expert ACs; 115 of those named tests do not
  exist anywhere in unit_tests/; 85 of the missing ones sit on ACs already marked
  work_status: done, across 39 distinct ACs — BO-2400a-1 is done and neither of its
  two named tests was ever written. An authored test_spec on an llm-expert AC is
  silently discarded even when it names five proofs.

  ANOMALY — ONE PREMISE OF THE AUTHORING REQUEST IS FALSE, AND IT MAKES THE TREE
  STRONGER. The request states that no agent in config/agent_registry.json declares a
  `produces` field, so the registry lookup cannot override the fallback frozenset.
  That is NOT true in this worktree. `produces` is populated broadly across the
  registry (production_code, test_artifact, documentation, review_verdict,
  orchestration, analysis, prompt), and llm-expert itself declares
  `produces: "prompt"` at line 3127. The frozenset at line 1073 is therefore only the
  unavailable-registry fallback, and appending "llm-expert" to it would change
  nothing on the normal path. The live defect is one level up and worse: the consumer
  collapses a genuine seven-value self-description into a single boolean
  (`agent.get("produces") == "production_code"`, line 684), so `prompt` is treated
  identically to `orchestration` — a value that legitimately needs no proof. The
  material the routing decision needs is ALREADY on disk and is being discarded at
  the point of use. TQ-200c-2 is written against that reality: it demands the
  decision be derived from what the work says about itself, which the registry
  already partly says, rather than from any enumeration of names — and the frozenset
  is then merely the most visible symptom, not the disease.

  THE INSIGHT THIS TREE PROTECTS — WHY "TREAT llm-expert LIKE python-coder" IS WRONG.
  Demanding pytest of prompt work would be a second defect, not a fix. Prompt,
  template and skill work splits into two layers:
    (a) MECHANICALLY CHECKABLE — frontmatter validity, the requires_verification
        rule, registry/template parity, phaseOrder membership, deploy-manifest
        presence, a captured dispatch sequence, one definite check over the reply of a
        real registered agent (BO-3200f-2-ii). Ordinary deterministic tests. The
        repository ALREADY writes these by hand: unit_tests/agents/
        test_test_writer_seam_rule_scope.py and unit_tests/test_bo_2100a_3_phase_
        order_gates.py are both present and both cheap. Nothing in this tree may
        convert that class of proof into an eval.
    (b) JUDGMENT — does the prompt RELIABLY elicit the intended behaviour, settled
        by a score over a set of rows held against a threshold. No single assertion
        settles this. This is an eval.
  Most real llm-expert ACs need BOTH. The missing capability is therefore a ROUTER,
  not a rule: given a piece of work, decide which layer(s) of proof it needs and ask
  for each in the right form. That is why this is a new L1 rather than a leaf under
  TQ-200a (which owns WHICH agents get eval sets) or TQ-200b (which owns HOW the
  runner scores them).

  WHY A THIRD L1 UNDER TQ-200 AND NOT A LEAF ELSEWHERE.
    - TQ-200 had 2 of a maximum 7 L1 children (_MAX_L1_PER_L0 = 7, templates/scripts/
      commit_guardian/check_ac_limits.py:81; no child_limit_override present), so a
      third needs no waiver and leaves four slots.
    - TQ-200a and TQ-200b each stand at 4 of a maximum 5 L2s (_MAX_L2_PER_L1 = 5,
      same file line 82), so neither could absorb five new behaviours anyway — but
      the real reason is subject, not capacity. TQ-200a answers "which agents get an
      eval set"; TQ-200b answers "how is a set scored and gated". Neither asks
      "should this piece of work have been asked for an eval in the first place, and
      what else should it have been asked for at the same time". That question sits
      upstream of both, which is why TQ-200c depends_on TQ-200a and TQ-200b rather
      than the reverse: the router may only emit a judged request into a harness
      whose set-shape (a) and scoring/gating (b) already exist. Emitting requests at
      a harness that cannot receive them is the prose-in-a-ticket failure TQ-200c-4
      is written to prevent.

  THIS L1 IS AT THE L2 CAP. Five children, limit five. A sixth behaviour needs an
  ac-tree-split, not a quiet addition. The five are deliberately non-overlapping:
  c-1 makes the request EXPRESSIBLE, c-2 makes the decision DERIVED, c-3 makes the
  two layers SIMULTANEOUS, c-4 makes the judged half LAND SOMEWHERE REAL, c-5 makes
  failure LOUD.

  ORDERING — THE ONE EDGE THAT IS NOT OPTIONAL. c-1 (vocabulary) precedes c-2
  (routing), because a router cannot emit a request the vocabulary cannot express;
  build them the other way round and the router's only available output is the
  existing binary, which is the defect. c-3, c-4 and c-5 also depend on c-1 for the
  same reason and are otherwise independent of c-2 — see each child's own notes for
  why its edge to c-2 was considered and deliberately not added.

  BOUNDARY — WHAT THIS TREE DOES NOT COVER, ON PURPOSE.
    - A NARROW, GENERATOR-LOCAL "never silently discard an authored test_spec" AC is
      being authored concurrently under ACD-400b by another author. TQ-200c-5 must
      NOT be read as a duplicate of it and must not be satisfied by it: theirs is a
      single program's handling of one field, mine is the statement that the ROUTING
      DECISION itself may not report an unhonoured proof contract as a pass. Assume
      theirs exists, assume it stays generator-local, and do not let an implementer
      close one and mark the other done.
    - THE REMEDIATION AUDIT IS OUT OF SCOPE AND MUST NOT BE LOST. 39 distinct ACs are
      already marked work_status: done while carrying 85 named tests that were never
      written (of 115 missing named tests across 124 named contracts on 444
      llm-expert ACs). That is an audit and a backfill, not a requirement, and no AC
      in this tree covers it. Recording the number here so the debt is visible when
      someone decides to schedule it.
    - WHICH SPECIFIC AGENTS GET EVAL SETS is TQ-200a-1 and its L3s. Nothing here
      enumerates agents.
    - HOW THE RUNNER SCORES is TQ-200a-2 (label/artifact/markup) and TQ-200b.
      TQ-200c-4 requires only that the judged request ARRIVES in a form the existing
      runner can score; it says nothing about the scoring itself.
    - CONVERTING EXISTING DETERMINISTIC PROMPT TESTS INTO EVALS is prohibited by
      TQ-200c-2-i and is not a licence granted anywhere in this tree.

  AMENDMENT 2026-09-17 — ASSERTED PROOF OVER A LIVE DISPATCH (user decision).
  The original text treated "a model is in the loop" as meaning "judged". That
  collided with BO-3200f-2-ii, whose live scenarios ask whether the executor's
  charter gets a command carried out and settle it with one deterministic check of
  the real reply. The boundary, adopted from that record's IT PO notes: a proof is
  judged when its pass is a score over rows against a threshold, and asserted when
  its pass is one definite check — with or without a live model reply. Consequences
  for this tree: proof_mode keeps exactly two values; asserted proofs that need a
  live dispatch are NOT routed to the eval harness only; judged proofs still are.
  No proof kind, angle or schema value named live_dispatch may be introduced
  (BO-2900g-3). The live-dispatch mechanism's home is TQ-600a (opened the same day
  by user decision); this L1 does not own running such proofs, only asking for them.
  KNOWN ALTITUDE GAP, RECORDED NOT FIXED (user decision 2026-09-17): the parent L0
  TQ-200 reads "guarded by an eval set", while this L1 already asks for asserted,
  non-eval proof and now says so explicitly. TQ-200 is deliberately not amended;
  revisit if TQ-200 gains another L1 whose proof is not an eval.
