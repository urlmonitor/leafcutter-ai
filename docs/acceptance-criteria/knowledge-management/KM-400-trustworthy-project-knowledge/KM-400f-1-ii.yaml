notes: |
  Authored 2026-10-12. A generation whose publication failed was never retired, so it
  carries no retirement time at all — measured on the live store on 2026-10-12, all 12
  generation records were in exactly that state. KM-400f-1's minimum-retirement-age test
  falls back from the retirement time to the creation time when the former is absent. That
  fallback is currently an accident of implementation rather than a stated criterion: it
  appears in no AC, so an implementer is free to change it, and an operator reading
  "reclaimable because it is older than 24 hours" cannot tell which clock produced the
  figure. This record makes the basis stated. It does not change what the fallback IS —
  creation time remains the basis when there is no retirement time — it requires the
  evaluation to say so.

  The third scenario is the honest-reporting case and is the reason this is a separate
  record rather than a clause: an age that cannot be determined must not pass the minimum
  age test by default. The failure being prevented is an absent timestamp read as an
  arbitrarily old generation, which would make the most poorly recorded generations the
  first ones reclaimed.

  Settled design decision, not reopened here: immutable generations are KEPT, pinning
  (KM-400b-3) outranks the bound, and the active generation is never reclaimable
  (KM-400f-1-iii).
it_requirements: null
test_required: true
test_spec:
  - name: test_never_retired_generation_is_aged_from_a_stated_basis
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: With two generations recording failed publications, no retirement time, and
      creation times 40 hours and 2 hours ago, assert the evaluation names the time each age
      was measured from, reports the older one reclaimable and the younger one not, and
      names the same basis for both.
    covers: [KM-400f-1-ii]
    must_catch:
      - "apply the age test silently, reporting a verdict without naming the time it was measured from"
      - "treat a missing retirement time as an age of zero, so no never-retired generation is ever reclaimable"
      - "treat a missing retirement time as unbounded age, so a 2-hour-old generation is reclaimable"
    requires_db: false
  - name: test_retired_generation_is_aged_from_its_retirement_time_not_its_creation_time
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: With one generation created 40 hours ago but retired 2 hours ago, assert it
      is reported not reclaimable and that the evaluation names the retirement time as the
      basis, distinguishing it from the creation-time basis used for never-retired
      generations.
    covers: [KM-400f-1-ii]
    must_catch:
      - "use creation time for every generation, making a freshly retired one reclaimable"
    requires_db: false
  - name: test_undeterminable_age_is_never_a_satisfied_minimum
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: With a generation carrying neither a retirement nor a creation time, assert
      its age is reported undetermined, the absent times are named, and it is reported not
      reclaimable rather than passing the minimum-age test.
    covers: [KM-400f-1-ii]
    must_catch:
      - "substitute a zero or epoch timestamp for the missing one, making the generation infinitely old and reclaimable"
      - "omit the generation from the report entirely because its age could not be computed"
    requires_db: false
test_rationale: >-
  KM-400f-1's existing tests are built on a fixture of completed and retired generations, in
  which the retirement time is always present, so the fallback this record governs is never
  once exercised and any fallback — or none — passes. Every fixture here reproduces the REAL
  observed shape instead: generations whose publication failed and which therefore carry NO
  retirement time, because a fixture that supplies a retirement time rebuilds precisely the
  bias that hid this. The two must_catch entries on the first test name the two opposite
  wrong fallbacks (missing time read as age zero, missing time read as unbounded age) since
  both produce a plausible-looking report and they fail in opposite directions, so a test
  asserting only one verdict would pass under the other. The undetermined-age test is
  separate because its wrong version is a substituted epoch timestamp, which is silent: it
  produces a confident reclaimable verdict on the least well recorded generation in the
  store.
