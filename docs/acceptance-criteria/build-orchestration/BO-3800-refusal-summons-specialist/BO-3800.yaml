  - supervisor_system
  - commit_guardian
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A refusal brings in the right specialist — your change waits, then lands.

  When work is turned away at the last step for not meeting a standard, the only
  party present today is whoever happened to be making the change. They satisfy
  the standard themselves, under pressure, and the cheapest thing that clears the
  bar is rarely the right thing — which is how a rule meant to improve the code
  ends up making it worse.

  After this goal, a refusal that calls for a particular craft brings in someone
  who has it. The change is held rather than lost or forced through, the
  specialist is told exactly what is being asked of which file, and the work is
  delivered once the standard is genuinely met. When it cannot be met, you are
  told plainly and promptly rather than left in a loop or handed a quiet pass.
