id: TQ-300c-2
title: "Secret scanning is covered by tests"
component: testing-quality
components:
  - testing_quality
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: code
risk_surface: internal
criteria: |
  Given a file containing a high-entropy secret-like string,
  When the secret scanner scans it,
  Then it reports a finding that names the file and the offending line.

  Given a file containing only ordinary non-secret text,
  When the secret scanner scans it,
  Then it reports no findings.

  Given a secret-like match whose file-and-line is listed in the security
    allowlist,
  When the scanner scans that file with the allowlist applied,
  Then the allowlisted match is suppressed and not reported as a finding.

  Given an allowlist entry that uses a wildcard line marker for a path,
  When the scanner scans that path,
  Then every matching line under that path is suppressed rather than only a
    single fixed line number.
depends_on:
  - TQ-300c
