it_requirements:
  - >-
    Keep, don't delete (resolves the conflict with TQ-500g-1-ix decision 2f). The write step's first
    filesystem action (today _wvw_write._clean) MOVES the alterations.json and copies/ an earlier
    preparation left in <git-dir>/leafcutter/work/<work-key>/ into
    <git-dir>/leafcutter/work/<work-key>/history/<NNNN>/ (four digits, one more than the highest existing
    number, starting 0001), before the reply is read. Only a leftover alterations.json.tmp (a partial
    write, never a manifest) is deleted. The move is os.replace per item within the same filesystem; a
    move that fails stops the step with exit 1 and no new manifest, so the earlier manifest is never left
    at the current path. plan.json and the pin store are not moved.
  - >-
    The TQ-500g-1-ix guard stays true: after the move no manifest remains at
    <git-dir>/leafcutter/work/<work-key>/alterations.json, so an unreadable reply leaves no manifest to be
    read in its place; the runner reads only the --alterations path finish hands it and never lists,
    searches or falls back to history/. Nothing in history/ is ever deleted, overwritten, rewritten or
    handed to the runner; the moved manifests keep their altered_copy paths as written (history is
    read-only evidence).
  - >-
    Identity in every row. The runner copies three additive keys from the manifest entry onto every
    result row of that wrong version: alteration_id (TQ-500g-1-xi: "sha256:" + 16 hex over the ordered
    replacements alone), source, and replacements ([{path, old, new}], so a reader sees each file, old text
    and new text). For "the fix undone" source is "fix undone", replacements is null, and alteration_id is
    computed by the same _wvp_store function over [{path, base content SHA-256}] of the restored files.
    Baseline rows (wrong_version "") carry null for all three. Rows keep test, wrong_version, result,
    blocking and detail unchanged.
  - >-
    Source vocabulary, one set across TQ-500g-1-xi, -xii, -xiii, -xvi and -xvii, written by the write step
    from the plan: "prepared: not pinned" (no pin held for the name), "pinned", "re-prepared: <reason>"
    (target changed, old text found N times, did not load, changes nothing, changes no line the tests
    naming it run, not in scope, pin reset by the operator), "declared". The runner never derives a source
    itself; it only copies it.
  - >-
    Retention: history/ is unbounded (BA decision; it lives under the worktree's git directory and goes
    with the workspace). The write step logs at INFO the number of history folders it keeps, so growth is
    visible; no cap is added here.
  - >-
    Deterministic: the manifest content stays byte-identical for the same reply, plan and code (no run
    number or time inside it); only the history folder number depends on how many runs came before.
  - >-
    wrong_version_runner.py stays at or under 400 counted lines (at 309); the row-labelling helper lives in
    _wvr_verdict.py. No new module; nothing to add to any deploy list.
test_spec:
  - name: test_identity_comes_from_the_replacements_alone
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: python scripts/build_orchestration/wrong_version_gate.py finish
    description: >-
      Three finish runs as in the criteria (run 1 prepared, a change elsewhere in refresh_config.py, run 2
      from the pin, run 3 re-prepared with the colon form). The rows of runs 1 and 2 carry the same
      alteration_id, run 3 a different one, and each row shows refresh_config.py with its old and new text.
    must_catch:
      - identity computed from the altered copy or the diff, so run 2 gets a new identity
      - identity that ignores the new text, so run 3 keeps run 1's identity
    in_scope_files:
      - scripts/build_orchestration/_wvr_verdict.py
      - scripts/build_orchestration/wrong_version_runner.py
  - name: test_each_row_says_where_its_alteration_came_from
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      The three runs' rows read source "prepared: not pinned", "pinned" and "re-prepared: target changed";
      a declared replacement's rows read "declared"; the fix undone's rows read "fix undone".
    must_catch:
      - source dropped from the row when the runner builds it
    in_scope_files:
      - scripts/build_orchestration/_wvr_verdict.py
      - scripts/build_orchestration/_wvw_write.py
  - name: test_every_runs_manifest_is_kept_under_its_own_run
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      After the three runs, history/0001/alterations.json and history/0002/alterations.json hold runs 1 and
      2 byte for byte as they were written, and the current alterations.json holds run 3; no earlier
      manifest was deleted.
    must_catch:
      - the earlier manifest deleted instead of moved
      - a later run overwriting an earlier history folder
    in_scope_files:
      - scripts/build_orchestration/_wvw_write.py
  - name: test_unreadable_reply_never_reads_an_earlier_manifest
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      Run 4 with a cut-off reply: the writer stops with exit 1, no manifest exists at the current path, run
      3's manifest is in history/0003/, and finish never calls the runner. A direct runner run handed the
      now-absent current manifest path reports every owed name unfinished and reads nothing from
      history/.
    must_catch:
      - the runner falling back to the newest history manifest
    in_scope_files:
      - scripts/build_orchestration/_wvw_write.py
      - scripts/build_orchestration/wrong_version_runner.py
  - name: test_failed_move_never_leaves_the_earlier_manifest_at_the_current_path
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      Added 2026-10-29 (coordinator) after the wrong-version gate found this name survived the test above,
      which never makes a move fail. Run 1's copies folder is made unmovable (no write permission), so the
      move to history stops part-way: the writer stops with no new manifest, nothing is at the current path,
      and run 1's manifest is in history/0001/. Skipped when run as root.
    must_catch:
      - the earlier manifest left at the current path after a failed move
    in_scope_files:
      - scripts/build_orchestration/_wvw_write.py
test_required: true
test_rationale: >-
  Identity, source and history are observable on disk and in the verdict, so every entry drives the real
  gate, writer and runner CLIs across three or four fresh-process runs on one temp repo and asserts on the
  rows and the files under the git directory. The discrimination entry is the criteria's runs 1 to 3: same
  replacement after an unrelated edit gives the same identity, a different replacement a different one.
  The failure entry proves the "never read an old manifest" guard survives the change from delete to move.
