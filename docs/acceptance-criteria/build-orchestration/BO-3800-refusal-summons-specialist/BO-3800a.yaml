id: BO-3800a
title: "Your change is held while the file is put right, and lands once it is"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Turned away is not lost — during a drive, the change waits then goes through.

  When a standard refuses work that is being driven, the change is kept exactly
  as it was left while the file is put right, and it is delivered afterwards
  without anyone having to start again, re-do the work by hand, or push it past
  the standard.

  This promise covers work that is being driven, and only that. A refusal met by
  someone running delivery by hand is simply a refusal, as it is today: the
  refusing standard's own message is the whole of what the author gets, nothing
  is held on their behalf and no specialist is brought in.
