notes: |
  WHY THIS RECORD IS NOT A FORMALITY DISCHARGING A TRIGGER. The parent L1 carries a
  reference-doc trigger because its whole promise is that whether a document is judged is a
  STATED, REVIEWABLE property. An unpublished scope decision is reviewable by nobody and
  the promise is half-kept. That is also the concrete reason this defect recurred: the
  present exclusion list is readable only by opening a configuration file, so each time a
  card was refused the next person rediscovered the mechanism rather than reading about it.

  THE SECOND CLAUSE IS THE ONE THAT MATTERS AND THE ONE MOST LIKELY TO BE DROPPED. Listing
  the declared locations is the easy half and goes stale the moment a second generated
  surface appears. Stating the PROPERTY that earns an exemption — regenerated whole, no
  human author — is what lets the next author with a generated surface reach the right
  answer without a discussion. The project already has a second instance waiting: a
  generated roadmap mirror stood at 286 lines against a 300-line limit when this was
  authored, under the limit and climbing. If the published text names only the agent-card
  directory, that case will be rediscovered rather than looked up.

  WHAT IS DELIBERATELY NOT REQUIRED HERE. No diagram, no how-to, and no new document is
  mandated — the obligation is that the information exists on a published surface an author
  would reach, and the parent's other children define the behaviour it describes. A
  documentation deliverable that restates the declaration verbatim and nothing else
  satisfies the first clause and fails the second.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's.
