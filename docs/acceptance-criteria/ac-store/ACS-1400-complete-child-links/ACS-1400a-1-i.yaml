doc_links:
  - path: templates/scripts/commit_guardian/check_ac_parent_covered_by.py
    relationship: related
    status: exists
    relevance: "THE EXISTING NARROWING THIS AC PROTECTS — it is already in `_get_staged_ac_paths` and must survive the strengthening. A merge stages the entire incoming branch, so a plain staged diff names every requirement record the other side ever touched; the current code intersects that with the diff against the other merge parent so only content the merge itself introduces is gated. The in-code comment states the consequence plainly: without it, the only way through is to bypass the hook, and a habitual bypass is how a real missing back-link later slips past."
