it_requirements:
  - "Clause (a) is decided by a call to _unproven_composite_children looked up as an attribute of the _done_proof_composite module when the ratchet runs (the way untagged_done_count.py already reaches is_covers_tag_waived through its _helpers module), never a name bound by from-import, a copy or a re-typed rule. Patching that module attribute must change the ratchet's verdict. The ratchet adds no child judgement of its own (no check of a child's work_status, tag or waiver): the rule's empty or non-empty answer is the whole of clause (a)."
  - "scripts/ac_store/_done_proof_composite.py is not edited: it is 592 lines, already over the check-file-size cap. All new logic goes in scripts/ac_store/untagged_done_count.py (162 lines today), which must stay under the 400-line limit, plus the ratchet test file."
  - "The tagged-id set handed to the composite rule is built with the done gate's own covers-tag pattern, COVERS_TAG_RE in scripts/ac_store/test_enforcement.py, read at run time (for example through the gate's own collector _collect_all_covered_ids) over the ratchet's existing test roots. The ratchet's own _COVERS_RE set keeps deciding the 'tagged' bucket only and is never passed to the composite rule; the two sets stay separate."
  - "Bucket order is fixed: tagged, superseded, waived, proved through its children, untagged, and each finished record lands in exactly one bucket. The composite rule is consulted only for a record that reaches the fourth test and already satisfies conditions (c) and (b), so it runs for few records."
  - "Condition (b) reads the whole store, not only finished records: every record whose parent field, or whose id-derived parent (ac_parent_id.derive_parent_id), is the composite and which the shared retirement predicate (ac_retirement.is_retired, the one the composite rule itself uses) does not retire must be among the composite's AC-id children as _composite_child_ids reads covered_by. No re-typed parent or supersession rule; a structurally invalid supersession counts as live, so the parent stays counted (fail closed). derive_parent_id mis-derives ids with a two-part prefix (KM-ADM-100a gives KM-ADM), so either source naming the composite makes a record its child, and the builder reports how many records in the store it could relate only through the parent field."
  - "Condition (c) accepts level L0 or L1, or a change_target that is the string 'docs' or a list whose only member is 'docs'. An absent or null change_target, any other value, or a list mixing 'docs' with another target keeps an L2 or L3 counted (fail closed)."
  - "The ground string is declared once, as a module constant in untagged_done_count.py added to PUBLISHED_GROUNDS beside the two existing grounds (ACS-1100b-1 remains their eventual owner; no second list). Its wording says the children's tags were read and their tests were not run, and contains no claim that a test passed or that anything was verified."
  - "The measurement carries the ids excluded under the new ground, sorted, and the ratchet run prints them beside that ground's count on every run. The sum check and the unexplained-shortfall check are unchanged in meaning and still run on every ratchet run."
  - "The new import works in both layouts the module already supports: the flat sibling import with scripts/ac_store on sys.path (as the ratchet test arranges) and the package-style fallback. _done_proof_composite itself flat-imports ac_retirement and test_enforcement and reaches its waiver through done_proof, so an import that cannot resolve fails the ratchet loudly; it never degrades silently into a measurement without the fourth ground."
  - "Store-wide inputs (the store id set, the parent index, the gate's tagged-id set) are computed once per measurement, not once per record. The ratchet test on the live store must finish within 120 seconds; the builder measures its run time on the branch and reports it."
  - "Errors are handled per the project error handling policy: unreadable records stay listed in 'unreadable' and fail the sum as today, and an exception raised by the composite rule propagates and fails the ratchet instead of being caught and turned into a bucket."
  - "HIGH_WATER_MARK is lowered in the same change: re-measured on the branch at build time and recorded in the comment beside it (the file's existing style) with the measured value, the measurement date, the commit measured and the inclusion rule including the new ground. The 162 measured on 4ba177be7 is the expectation only; a different measured figure is reported, never forced. The mark is never raised and never left at 209."
  - "A changelog entry is required in the same change (changelogs/, written through the changelog agent), stating the new exclusion ground, which composites it covers and which stay counted, and the old and new mark with the measurement behind it."
  - "The change lands on its own, with no done-gate change first or alongside: check_done_proof.py, done_proof.py and mark_ac_done.py are not edited. The ratchet is then stricter than the gate on code, schema, pipeline, config and prompt L2 composites, which is the intended result."
  - "No new dependency beyond the standard library and PyYAML, which the module already uses. The existing KM-ADM-005-1 tests (unit_tests/ac_store/test_km_adm_005_1_untagged_done_count.py and the ratchet file's own tests) stay green unchanged."
test_required: true
test_intent:
  - clause: 'the composite leaves the count under the ground "proved through its children (tags read, tests not run)" only when all three of these hold: (a) the done gate''s own composite rule, looked up when the ratchet runs and given the set of ids tagged by the done gate''s own covers-tag pattern, finds no unproven child; (b) its covered_by is complete: every live (not superseded) record on disk whose parent is this record is listed in it; (c) it is level L0 or L1, or its change_target is exactly "docs"'
    needs_test: true
    reason: The three-way conjunction is the new exclusion, and a rule that drops any one condition lets a composite leave the count it should stay in.
  - clause: 'every finished record is placed in exactly one bucket, tested in this order: tagged, superseded, waived, proved through its children, untagged'
    needs_test: true
    reason: The bucket order decides which ground a record is reported under, and a wrong order double-counts or mislabels records silently.
  - clause: a finished L1 X-100a whose children X-100a-1 and X-100a-2 are both finished and each tagged by a collected test leaves the count under the new ground
    needs_test: true
    reason: This is the main positive case, and a ratchet that still counts a proved L1 keeps failing correct closes.
  - clause: a finished L1 X-100a whose child X-100a-2 has work_status todo stays counted, even when X-100a-2 carries a covers tag
    needs_test: true
    reason: A rule that reads the child's tag but not its work_status would let an unfinished child prove its parent.
  - clause: a finished L1 X-100a whose finished L2 child X-100a-1 is itself an untagged composite with an unfinished or untagged child X-100a-1-i stays counted
    needs_test: true
    reason: Only the recursive case shows the gate's rule is applied down the whole subtree and not to direct children alone.
  - clause: a finished L2 X-100a-1 whose change_target is code, schema, pipeline, config or prompt stays counted while it has no covers tag of its own, even when every one of its children is finished and tagged
    needs_test: true
    reason: A rule applied to every level would exclude code L2s whose children prove only edge cases, which is the defect this record avoids.
  - clause: a finished L2 X-100a-1 whose change_target is "docs" and whose children are all finished and tagged leaves the count under the new ground
    needs_test: true
    reason: A level-only rule would keep counting docs aggregators, so the docs case must be shown to leave the count.
  - clause: a finished L1 X-100a whose covered_by lists X-100a-1 but omits a live child X-100a-2 that exists on disk stays counted, while a superseded child X-100a-3 missing from covered_by does not keep it counted
    needs_test: true
    reason: The completeness check reads the store beyond covered_by, and both the live and the superseded omission must be judged correctly.
  - clause: a child whose only mention of its id is a prose "covers:" line that the done gate's covers-tag pattern does not accept does not prove its parent, even when the ratchet's own tag reading counts that child as tagged
    needs_test: true
    reason: Only this case tells the gate's tag set from the ratchet's looser one, so passing the wrong set would go unnoticed without it.
  - clause: when the done gate's composite rule is replaced at run time by one that reports an unproven child for every record, a composite that left under the new ground is counted untagged again, and when it is replaced by one that reports none, a composite with an unfinished child leaves the count if (b) and (c) hold
    needs_test: true
    reason: A copied or import-bound rule, or a ratchet-side child check, ignores the replacement, and only patching the rule at run time exposes it.
  - clause: the ground's published wording states that the children's tags were read and their tests were not run, and never states or implies that any test passed
    needs_test: true
    reason: The ground string is published output, and wording that claims a passed test would overstate the evidence the ratchet gathered.
  - clause: the ratchet's published measurement lists, by id, each record excluded under this ground, beside the ground's count
    needs_test: true
    reason: The id list is computed output of the run, and a count without the ids would hide which composites left.
  - clause: the new ground is on the published list of legitimate grounds (ACS-1100b-1), and untagged plus every exclusion count plus tagged still equals the number of finished records enumerated
    needs_test: true
    reason: A ground missing from the published list turns into an unexplained shortfall, and the sum is arithmetic that breaks silently on a misplaced bucket.
  - clause: in the same change the recorded high-water mark is lowered to the count measured at build time, with that measurement's date, commit and inclusion rule recorded beside it, and is never left at the old value or raised
    needs_test: false
    reason: The new mark is a measured constant written once with its provenance; review compares it with the measurement, and a test would only restate the number.
test_spec:
  - name: test_composite_leaves_the_count_only_when_a_b_and_c_all_hold
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: discrimination
    description: "On a fixture store written with yaml.safe_dump and a fixture test tree holding real '# covers:' lines, measure() leaves a finished L1 composite out under the new ground only when its children are proved (a), covered_by is complete (b) and level or change_target qualifies (c); breaking any one of the three keeps it in untagged."
    proves_clause: 'the composite leaves the count under the ground "proved through its children (tags read, tests not run)" only when all three of these hold: (a) the done gate''s own composite rule, looked up when the ratchet runs and given the set of ids tagged by the done gate''s own covers-tag pattern, finds no unproven child; (b) its covered_by is complete: every live (not superseded) record on disk whose parent is this record is listed in it; (c) it is level L0 or L1, or its change_target is exactly "docs"'
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_km_adm_005_1_untagged_done_count.py
    must_catch:
      - a rule that checks only (a) and ignores covered_by completeness (b)
      - a rule that checks only (a) and (b) and ignores level and change_target (c)
      - a rule that accepts a change_target list mixing 'docs' with another target, or an absent change_target, on an L2
      - a rule that never consults the gate and trusts covered_by alone
