id: BO-100e-1
title: "A four-deep chain of prerequisites is carried to the end by one start, in prerequisite order"
component: build-orchestration
components:
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a body of work of four pieces present in the set before the run begins,
    And piece A carries no prerequisite,
    And piece B's only prerequisite is A, piece C's only prerequisite is B, and
      piece D's only prerequisite is C, so the four form a single chain four layers
      deep and only A is eligible at the moment the run starts,
  When the run is started once and left to run to its own end, with no further
    instruction given to it,
  Then all four pieces are built within that one run,
    And B is not begun before A has finished successfully, C not before B, and D
      not before C,
    And the run ends having built the whole chain rather than only A,
  So the depth of the chain changes how long the run takes and not how many times
    it has to be started.

  Given the same four-piece chain,
  When the run is started once,
  Then the eligibility of B, C and D is decided more than once during that run,
    each time against what has finished by that moment rather than against what had
    finished when the run began,
    And this is established by observing the later pieces actually being taken on
      during the run, not by observing that a decision was made.

  Given a body of work of four pieces in which none carries any prerequisite,
  When the run is started once,
  Then all four are built, and the run does not take longer than a run over four
    pieces needs to, so carrying the chain case has not made the flat case slower
    by forcing it through layers it does not have.
