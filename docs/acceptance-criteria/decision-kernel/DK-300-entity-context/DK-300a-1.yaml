id: DK-300a-1
title: "Canonical owners supply glossary and typed category meanings"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a permitted current index containing an authored glossary phrase and declared document genres, knowledge destination kinds and native artifact kinds,
  When the request explicitly mentions those terms or typed categories,
  Then each recognized item carries its canonical identity and the meaning authored by its owner,
  And glossary terms, document genres, destination kinds and native artifact kinds retain distinct families,
  And an owner-declared alias resolves to its canonical identity,
  And the returned meaning contains no full document, routing record or artifact body.
depends_on: [DK-300a]
