title: "On a mock-default deployment, an override back to live shows the real badge"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: done
criteria: |
  Given a deployment whose LEAFCUTTER_MOCK env sets mock as the DEFAULT data source,
  When a request arrives carrying a runtime override to live (e.g. ?mock=0) and the seam
    resolves the effective source to the real repo,
  Then the mock/live badge reads "live"/real (not "mock"),
  And every view on that page is served from the real repo,
  So a mock-default deployment still tells the truth when a visitor overrides back to live.
