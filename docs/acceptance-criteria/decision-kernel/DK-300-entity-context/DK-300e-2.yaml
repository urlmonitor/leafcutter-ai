id: DK-300e-2
title: "Independent recognition labels and paired intent outcomes produce separate reports"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a versioned labelled corpus covering every supported entity family, ordinary prose, long goals, repetition, ambiguous symbols, absent and malformed IDs, denied sources, stale indexes, small budgets and hostile definitions,
  When the production recognition path is evaluated independently of intent and final answers,
  Then each case checks exact identities, original mention spans, aliases, resolution states, provenance, permission boundaries, configured bounds and actual lookup counts,
  And the report gives expected and observed results plus precision, recall and coverage by entity family,
  And a separate paired intent comparison uses the same caller context for the current baseline and entity-context cases and records labels, clarification behavior and actual model-call counts,
  And a classifier-consumption check demonstrates that the live kernel path uses the retained entity context,
  And historical DK-200 tests and earlier enrichment scores are identified as historical evidence rather than proof of the new recognition contract.
depends_on: [DK-300e]
