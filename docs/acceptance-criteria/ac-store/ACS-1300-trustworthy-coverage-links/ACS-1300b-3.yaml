notes: |
  WITHOUT THIS AC THE TREE FIXES A SNAPSHOT. ACS-1300a clears the backlog once and
  ACS-1300b-2 wires the paths bypassing today; neither prevents the next delivery path
  from being added unwired, and the backlog refills at whatever rate paths get added.
  This is the ratchet, and it is what makes "the backlog cleared once stays cleared" in
  the parent L1 a property rather than an aspiration.

  THE CLEAN-RUN CLAUSE COMES FIRST DELIBERATELY. A guard that fires on everything
  carries no signal and the reasonable response to it is to switch it off — the same
  reasoning done_proof already applies to an empty permitted-angle set. Requiring a
  genuinely clean repository to produce no report, in the same criterion that requires
  the unwired path to be reported, is what keeps the guard worth leaving on.

  THE CONSUMED-RESULT CLAUSE IS NOT OPTIONAL POLISH. A computed verdict nobody reads is
  the phantom-done shape one level up, and this repository has shipped it before: a
  fast-lane runner passed its structural tests while never executing the gates it
  computed. The single-line deletion mutation is the cheapest available proof that the
  wiring exists.

  THE LAST CLAUSE COVERS REGRESSION, NOT JUST ADDITION. A guard keyed only on new paths
  misses the more likely event — someone refactoring an existing path and dropping the
  hand-off — which is the same event ACS-1300b-2's third clause uses as its mutation.
