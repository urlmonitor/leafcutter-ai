id: GE-120c-4
title: "The remediation flow is drawn once per stage, showing who can act at each"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a reader trying to understand what happens after a numbering clash is detected,
  When they read the sequence diagram,
  Then it shows three participants — the author, the guard, and the specialist that performs the
    renumbering,
  And it shows the authoring-time flow in which the guard's response reaches the author's live
    session and the specialist is brought in,
  And it shows the commit-time and shared-build flows in which the specialist participant is
    NOT engaged, and the flow terminates at the author with a message,
  And the reason the specialist cannot be engaged at those two stages is stated on the diagram
    rather than left as an unexplained asymmetry,
  And the diagram carries a sequence number allocated by the project's own allocator, and is
    placed where the enrolment rule expects a numbered diagram,
  And it is linked from its parent architecture document in both directions.
depends_on:
  - GE-120c
  - GE-120c-1
  - GE-120c-2
doc_links:
  - path: docs/architecture/components/commit-guardian.md
    relationship: modifies
    status: exists
    relevance: "The parent architecture document this diagram must link to and from."
  - path: scripts/next_diagram_seq.py
    relationship: context
    status: exists
    relevance: "The allocator that must be used for this diagram's sequence number. This AC is the tree's own first opportunity to comply with GE-120b rather than add a twelfth unnumbered diagram."
  - path: docs/architecture/diagrams/c3-002-interactive-pause-resume-sequence.md
    relationship: context
    status: exists
    relevance: "An existing correctly-numbered c3 sequence diagram in the enrolled location — the shape, level and naming convention to follow."
  - path: docs/reference/claude-code-hooks.md
    relationship: describes
    status: exists
    relevance: "The hook contract that supplies the stated reason for the asymmetry: only the PostToolUse channel returns output into a live session, so only that stage can reach anything able to act."
assigned_agent: architecture-diagram-author
estimated_complexity: S
it_requirements:
  - "The sequence number MUST come from `python scripts/next_diagram_seq.py` at authoring time, not from reading the directory and adding one. The allocator encodes never-reusing a retired number, which a max+1 scan does not, and this AC is the tree's own first chance to comply with the rule it is writing."
  - "The file goes in `docs/architecture/diagrams/` — the location the enrolment rule declares enrolled — at level c3 (an interaction over time), so the name takes the form `c3-NNN-<slug>.md`. A c2 level would place it with the container views and misrepresent what it shows."
  - "The stated reason for the asymmetry must be the mechanical one, not a policy one: a pre-commit hook is a subprocess and a build job is a container, and neither has a channel back into a live session; only the PostToolUse Edit|Write hook's output is returned into the running agent's context. A reason phrased as a choice invites a future contributor to un-choose it."
  - "The specialist participant must be absent from the commit-time and build-time flows, not present-and-unused. A greyed-out or unlabelled participant reads as an omission and is what a later contributor 'fixes' by adding the missing arrows."
  - "`check-mermaid-parent-link` enforces bidirectional links between architecture documents and `check-mermaid-complexity` caps diagram size, both at commit time on `docs/architecture/**`. Add the back-link in `docs/architecture/components/commit-guardian.md` in the same change; a one-directional link fails the gate."
  - "Must agree with GE-120d-4's component diagram on which stage engages the specialist. The two are drawn from the same arrangement — this one the interaction, that one the structure — and a disagreement between them is a documented contradiction in the architecture surface."
test_required: false
test_rationale: |
  change_target is docs and the deliverable is a Mermaid diagram; there is no executable
  behaviour to assert. The mechanically checkable properties are already gated at commit time:
  check-mermaid-parent-link enforces the bidirectional link this AC's last clause requires, and
  check-mermaid-complexity caps the diagram. The numbered-and-placed clause is verified by the
  enrolment check GE-120b-1 builds — this diagram is deliberately the first artifact that gate
  will see, so a separate test here would only duplicate it.
delivers_to: null
expects_from:
  ac_id: GE-120c-1
  contract: "Which stage engages the specialist and which do not, so the diagram states the arrangement that is actually built."
origin_agent: business-analyst
