it_requirements:
  - "THE CHECK GATES THE PATH EVERY PACKAGE BUILD TAKES. It must run inside build.py (including --validate-only) and fail it before success is reported. A check that runs only as an optional standalone command or only as a commit hook does not satisfy the criteria; if it is also wired into a commit-time gate, the build stays the load-bearing enforcement point."
  - "BOTH LISTS ARE READ FROM THEIR SOURCES, NEVER RESTATED. The signing-off set comes from the signoff field in each agent definition's frontmatter (templates/agents/*.md), not from config/agent_registry.json, which carries no signoff flags. The writer lists come from the feedback categories file the build deploys. No agent name, category name or count (24 agents, nine categories) is hard-coded, so a new agent or category is checked with no edit to the check."
  - "WRITER RESOLUTION AGREES WITH SUBMISSION. A category counts for an agent only if submit_feedback.py would accept that agent for that category, sentinels included (INF-100c-5-ii). There must be one resolution rule shared by submission and the check; a second copy that can drift from submission is a defect."
  - "ALL VIOLATIONS IN ONE RUN. The failure names every signing-off agent with no category, in a stable sorted order, in one message, and never stops at the first."
  - "The check is read-only and deterministic: it writes no file, and two runs on the same inputs give byte-identical output."
  - "An unreadable or malformed agent definition or categories file must fail the build with a message naming the file, per the project error handling policy. It must never be skipped silently, which would let the check pass having checked nothing."
  - "Every module the check imports must be in the build deploy manifest, so the check works in a deployed layout (CLAUDE.md 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest')."
  - "Must add under 1 second to the build for the shipped roster."
  - "Deployed/template parity (ADR-001): edit templates/ and verify the deployed copies through the build round-trip."
  - "This record and INF-100c-5-iv must land in the same change set. restructuring-specialist and change-scope-reviewer are unregistered today, so the check alone turns every package build red until -iv's registrations land."
test_intent:
  - clause: the build fails before it reports success
    needs_test: true
    reason: Failing the build is the whole enforcement, and a check that only logs would let the two lists disagree silently again.
  - clause: the failure message names restructuring-specialist as an agent that signs off but can write to no feedback category
    needs_test: true
    reason: The named agent is computed from two files, so a wrong join would name the wrong agent or none.
  - clause: when two such agents are missing (restructuring-specialist and change-scope-reviewer) the one failure message names both, not only the first found
    needs_test: true
    reason: Stopping at the first violation is the easy wrong implementation and would hide every later omission.
  - clause: after restructuring-specialist and change-scope-reviewer are added to the complete category's allowed_writers, the same build passes this check
    needs_test: true
    reason: A check that cannot pass once the omission is fixed would block every build, so the passing direction needs its own proof.
test_spec:
  - name: test_validate_only_build_exits_nonzero_when_a_signing_off_agent_has_no_category
    target_dir: unit_tests/feedback/
    framework: pytest
    type: integration
    angle: reachability
    description: Copies scripts/, templates/ and config/ of the package into a tmp package root (no deploy, so no 60s build), removes restructuring-specialist from every allowed_writers list, runs that copy's scripts/build.py --validate-only as a subprocess and asserts a non-zero exit and no success line.
    proves_clause: the build fails before it reports success
    code_file: scripts/build.py
  - name: test_failure_message_names_the_signing_off_agent_with_no_category
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: Runs the check on a tmp agents dir and a tmp categories file in which only restructuring-specialist signs off and is listed nowhere, and asserts the failure text names restructuring-specialist as signing off but able to write to no category, and names no other agent.
    proves_clause: the failure message names restructuring-specialist as an agent that signs off but can write to no feedback category
    code_file: scripts/build_phases_feedback_writers.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_submit_feedback_unknown_agent.py
    must_catch:
      - a check that reads signoff from config/agent_registry.json, which carries no signoff flags, and so names nobody
      - a check that joins the wrong way round and names a listed agent instead of the unlisted one
      - a check with the agent names or the count of 24 hard-coded
  - name: test_one_failure_message_names_every_missing_agent_sorted
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: Runs the check with restructuring-specialist and change-scope-reviewer both missing and asserts the missing_writers result and the single failure message list both, in sorted order, and that two runs give byte-identical output.
    proves_clause: when two such agents are missing (restructuring-specialist and change-scope-reviewer) the one failure message names both, not only the first found
    code_file: scripts/build_phases_feedback_writers.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_submit_feedback_unknown_agent.py
    must_catch:
      - a check that raises on the first missing agent and never names the second
      - a check that emits one message per agent so the first message names only one
      - a check that lists the agents in directory order instead of sorted order
  - name: test_check_passes_once_both_agents_are_added_to_complete
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: Runs the check on the two-missing fixture, adds restructuring-specialist and change-scope-reviewer to the complete category only, re-runs it and asserts missing_writers is empty and the check passes.
    proves_clause: after restructuring-specialist and change-scope-reviewer are added to the complete category's allowed_writers, the same build passes this check
    code_file: scripts/build_phases_feedback_writers.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_submit_feedback_unknown_agent.py
