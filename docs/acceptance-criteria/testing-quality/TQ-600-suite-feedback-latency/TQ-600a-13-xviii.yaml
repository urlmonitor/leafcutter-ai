id: TQ-600a-13-xviii
components:
  - testing_quality
title: "An agent whose pull request is held by Post-merge suite status treats it as an external hold, not as its own failure to fix"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that most pull requests here are opened and driven by agents following the
    package's runbooks, which react to failing checks by debugging their own change,
    retrying, or halting with a regression report,
  And that a failing `Post-merge suite status` means the correctness lane on main is not
    green or has no fresh verdict — a condition the pull request did not cause unless it
    is the fix,
  When an agent following any of the package's runbooks that react to pull-request checks
    finds `Post-merge suite status` failing on its pull request,
  Then it reports the hold as external, quoting the check's held state and linking the
    run and the notice,
  And it does not edit its own change to make that check pass, does not push an empty or
    no-op commit, and does not re-run the check in a loop,
  And it never edits the post-merge workflows, their modules, the ruleset, or the notice
    issues,
  And it adds a fix declaration to its pull request only when its change touches a test
    named in the notice's failing set or the code those tests exercise, and never as a way
    to pass the check,
  And it treats every other failing check on the same pull request exactly as before,
  And each runbook's behaviour is demonstrated by presenting it a recorded pull-request
    state in which this check is the only failing one, and a second in which it fails
    beside a real test failure, and observing the decision it reaches.
