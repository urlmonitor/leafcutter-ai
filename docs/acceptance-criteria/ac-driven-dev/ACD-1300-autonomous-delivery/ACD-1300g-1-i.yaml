id: ACD-1300g-1-i
title: Local execution failure cannot silently consume a cloud implementation allowance
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given local inference or its tool-capable harness becomes unavailable after admission
  When the next implementation call is attempted
  Then the feature is blocked with the unavailable capability and preserved progress
  And it performs no substitute cloud implementation call
  And missing tool execution or a claimed but unperformed check cannot count as passing AC evidence

  Given discovery or implementation returns an empty, unreadable or contradictory reply, an unsupported handoff, an explicit refusal or an execution error
  When the worker considers the next phase
  Then the run remains blocked for operator attention with the affected AC, phase, reason and preserved progress
  And no automatic redispatch, substitute provider call or coordinator execution of the refused action occurs
  And no dependent work, validation, review or publication is authorized by that reply
  And explicit operator recovery retains the original attempt and elapsed-time budgets
  And this communication blocker remains distinct from failed project checks eligible for bounded repair
