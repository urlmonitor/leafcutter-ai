    type: integration
    angle: reachability
    description: "Five real admitted-kind files, one in each named prose area, each carrying the words-shaped, bracketed-placeholder and masking-character values, staged together in a temporary git repository, produce exit status 0 and no generic-credential line on stdout from the canonical pre-commit check"
  - name: test_project_identifier_values_exempt_in_the_acceptance_criteria_store
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged store file whose two credential-shaped lines carry a ticket identifier and an epic name is not reported, and the same two tokens are treated as benign by the high-entropy path in the same run — one recogniser, one verdict"
  - name: test_unrecognised_value_shape_in_prose_is_reported_and_blocks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged ticket Markdown file whose quoted value matches no recognised shape produces exit status 1 and a stdout line naming the file and its 1-based line number — the closed list defaults to reporting"
  - name: test_prose_location_with_unadmitted_kind_reports_all_three_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same three exempt lines in a file of an unadmitted kind inside a named prose area produce three findings and exit status 1 — location alone never grants the exemption"
  - name: test_location_gate_is_anchored_at_the_repository_root
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A file in a nested directory whose name equals a prose-location name, but which is not that location relative to the repository root, is reported and blocks — resemblance never grants the exemption"
  - name: test_same_verdict_for_relative_and_absolute_path_forms
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The canonical scanner invoked directly with an absolute path and with a dot-slash-prefixed path returns the same generic-credential verdict as the hook does for the repository-relative form of the same file"
  - name: test_second_credential_match_on_an_exempt_line_still_blocks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A single line in a staged ticket file carrying both a recognised placeholder value and an opaque sixteen-character value is reported and blocks — the exemption is not granted on the first match alone"
test_rationale: "All seven entries run the canonical templates/ copy of the pre-commit check as a subprocess against real files staged in a throwaway git repository, with that repository as the working directory. The predicate-level alternative is specifically insufficient for this AC: the location gate operates on the repository-relative path that git diff --cached produces, and the failure this AC most needs to exclude — a same-named directory at another depth inheriting the exemption — is invisible to a test that hands the predicate a path string it chose itself. The repo-root-anchoring and absolute-versus-relative entries exist because the two entry points receive path forms of different shapes; only running both can show they agree. The multi-match entry covers the fact that the rule reports at most one finding per line, which is not visible from the criteria. The deployed angle is deliberately not charged: this project's convention pins these tests to the canonical templates/ copy per ADR-001, and source/deployed parity is enforced by build.py and the hook-parity check."
