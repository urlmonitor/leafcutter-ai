criteria: |
  Given the workflow function run() is a single async function with sequential awaits
  And the halt gate in Step 3 uses an early return statement when blocks_finalization=true
  When the Step 3 halt fires (blocks_finalization=true)
  Then the function returns immediately from within the Step 3 code block
  And no subsequent line of code in the function body executes
  And specifically the Step 4 code (PR state probe, confirmation prompt, merge dispatch)
  Is physically located AFTER the return statement in the source
  And is therefore unreachable by any execution path when the halt fires
