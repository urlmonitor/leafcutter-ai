  agent: python-coder
  contract: Implement and prove KM-500a-4 through the existing knowledge/kernel or operational interface; return
    measured evidence and preserve explicit not-run prerequisites.
test_spec:
- name: test_jev_evaluation_public_contract
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Exercise the public research evaluation runner with deterministic controls: missing authorization
    returns not_run before provider setup; explicit operation consumes no Jev call; report includes versions,
    budgets, failures and case denominators.'
  covers:
  - KM-500a-4
  requires_db: false
- name: test_authorized_real_jev_planning_evaluation
  target_dir: tests/knowledge_live/
  framework: pytest
  type: integration
  angle: real_artifact
  description: After explicit authorization, run reviewed cases through the configured real Jev and pinned
    actual graph/catalog. Compare clarify/select/build/unsupported outcomes with independent labels and retain
    measured call and latency evidence; never substitute scripted Jev.
  covers:
  - KM-500a-4
  requires_db: true
