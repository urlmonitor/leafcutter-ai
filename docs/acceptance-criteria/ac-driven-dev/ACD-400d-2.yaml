title: "Equally urgent work is separated by size and then by identifier, giving one settled order every time"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given five pieces of work are ready to be picked up and all record the same
    urgency,
  And three of them record sizes of S, M and L, while the remaining two both record
    a size of S,
  When the queue is asked which work is ready,
  Then within that urgency the S pieces are offered before the M piece and the M
    piece before the L piece,
  And the two pieces that match on both urgency and size are offered in ascending
    order of their identifiers,
  And that order does not depend on how the records happen to be stored: with the
    same five records held under names whose alphabetical order is the reverse of
    their identifiers, the queue offers the identical list,
  And asking the same unchanged store the same question a second time returns the
    identical list again.
