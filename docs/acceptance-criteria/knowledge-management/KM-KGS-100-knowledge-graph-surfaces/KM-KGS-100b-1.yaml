criteria: |
  Given the knowledge map contains a node for acceptance criterion KM-EX-010 and
    that criterion's implemented_by, covered_by, depends_on, and components fields
    each produced their edges
  When the knowledge map is exported in machine-readable form and a reader collects
    the outbound edges of node KM-EX-010
  Then the implemented_by edges name the source files that deliver the criterion
  And the covered_by edges name the tests that prove it
  And the depends_on edges name the other criteria it depends on
  And the component_membership edge names the part of the product it belongs to
  And no extra outbound relationship kind is returned beyond these four
