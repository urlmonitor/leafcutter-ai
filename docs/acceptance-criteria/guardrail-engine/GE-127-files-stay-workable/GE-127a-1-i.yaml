notes: |
  PARENTED UNDER GE-127a-1 RATHER THAN DIRECTLY UNDER GE-127a, AND THE REASON IS
  MECHANICAL AS WELL AS SEMANTIC. Semantically this is the negative edge of the
  commit-time length verdict GE-127a-1 specifies, not a behaviour of its own.
  Mechanically, the store's id regex admits no roman-suffixed child of an L1: a
  `GE-127a-i` would fail the id-format check outright, so an L3 must hang from an
  L2. Both reasons point the same way.

  THIS IS THE LINE GE-120 DREW, APPLIED TO THIS GUARD. The component's deliberate
  fail-open convention is not repealed here and must not be decomposed away:
  failing open on one bad input while the check still ran is acceptable.
  Reporting SUCCESS for a check that never ran is not. A file the standard could
  not measure has not been checked, so calling it "within its permitted length"
  is the forbidden half, and the L0 says so in as many words.

  WHY THE PAIRED READABLE RUN IS PART OF THE CRITERION AND NOT A NICETY. A
  refusal on an unreadable file is also produced by a guard that refuses
  everything. The paired run — same file, made readable, under its limit, commit
  completes — is what makes the first arm a statement about measurability rather
  than a check that has stopped working. This mirrors GE-126a-2-i's construction
  in this same component.

  NAMED MUTATION — MANDATORY, EXECUTE IT. "That file is not listed among those
  found to be within their permitted length, and no length is stated for it"
  asserts an absence, and on today's implementation — which refuses nothing at
  commit time because it runs at no commit — it is green on arrival. MUTATION:
  restore the swallow-and-return-zero behaviour, so that a file whose contents
  cannot be read yields a measured length of zero instead of an unavailability
  signal. That is the exact shape presently in the source and the shape every
  cited precedent shipped. Under the injection the file is reported as within its
  permitted length at a length of zero and the commit completes; this clause must
  go RED, failing BY THE COMMIT OUTCOME as well as by the text, and must return
  to green on revert.

  EXERCISE THE UNMEASURABLE STATES FOR REAL. An unreadable file must be made
  genuinely unreadable at run time — bytes that are not valid in the encoding the
  standard reads, or permissions that forbid opening it — never by asserting that
  an error branch is present in the source. A source assertion stays green on
  precisely the fail-open implementation this record exists to forbid.

  TWO SITUATIONS, NAMED SEPARATELY, AND NOT COLLAPSED. "The contents are not
  readable as text" and "the file cannot be opened at all" are different facts
  about the world. Collapsing them into one message costs the author the only
  information that distinguishes a genuinely binary file from a permissions or
  path problem. This is BP-100n-4-ii's rule for the two disk situations, applied
  here.

  ONE STATE DELIBERATELY LEFT OUT OF SCOPE, AND FLAGGED RATHER THAN SMUGGLED IN.
  A staged DELETION presents a path that does not exist, which today takes the
  same return-zero route. Whether a deleted file should be measured at all is a
  scope question, not a measurability question, and it is not in the set approved
  for this run. It is recorded here so the implementer does not resolve it
  silently while fixing the read path.

  VERDICT VOCABULARY IS THE IT PO'S TO PIN, AND THE RECOMMENDATION IS EXPLICIT.
  The criteria above name no exit status, deliberately. The recommendation is to
  reuse the existing contract unchanged — an INDETERMINATE line naming the reason
  with exit 2, alongside exit 0 clean and exit 1 for a length that was measured
  and found over — so that this guard and the reachability guard speak one
  language. The alternative (treating an unmeasurable file as an ordinary
  finding) satisfies the criteria too but costs the distinction in the third
  clause; if it is chosen, it must be chosen explicitly and recorded.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
