title: "A bulk repair with no adjudication behind it is refused rather than performed"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing a deliberately parked tree, a parent whose coverage
    list resolves to no record at all, and a parent that simply omits a child it
    has,
  When a repair is requested over that store without an adjudication naming a
    disposition for each affected record,
  Then no file in the store is modified,
  And the request is refused with a message naming the records that have no stated
    disposition,
  And when the same repair is requested with an adjudication that covers every
    affected record, the records dispositioned for repair are repaired in that same
    run.
