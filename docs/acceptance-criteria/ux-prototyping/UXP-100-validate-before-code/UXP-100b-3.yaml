title: "Gap report distinguishes near-matches from entirely new components"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the component library catalog contains "data-table" (tabular display
    with sortable columns) and the prototype requires a "tree-table" (tabular
    display with expandable row hierarchy),
  When the UX designer agent detects the gap,
  Then the gap report classifies "tree-table" as "near-match: data-table"
    with an explanation of what extension is needed ("add row-expand capability")
  And the gap report classifies a completely novel requirement (e.g. "3d-viewer")
    as "new-component" with no near-match reference
  And the research request for a near-match includes the base component ID as
    a starting point for the researcher
