title: "A requirement without a declared-files list is in the named state 'no declared files', and its documentation links never stand in for one"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given requirement L carries no declared-files list,
    and L's documentation links name scripts/build.py as a file the work modifies
    and docs/reference/ac-schema.md as describing the work,
  And requirement E carries a declared-files list with no entries,
  When the store is asked which files each one's work changes,
  Then the answer for L is the state "no declared files", naming L, and contains no path,
  And neither scripts/build.py nor docs/reference/ac-schema.md is reported as a file L's work
    changes,
  And a check that needs declared files lists L as "not evaluated: no declared files" and does
    not count L as passed,
  And L is accepted into the repository: having no list is a reported state, not a refusal,
  And E is refused with a message naming E and stating that a requirement with no files to
    declare leaves the list out rather than declaring it empty,
  And the store-wide report of records in the "no declared files" state names every such record
    and states their total.
