title: "Gate after the business analyst shows L2/L3 ACs and offers approve, edit, or cancel"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the business analyst has written L2/L3 ACs to the AC store with readiness: draft,
  When the workflow presents gate 2 to the user,
  Then it displays: the AC ids, titles, criteria text, and the parent L1 each
    L2/L3 decomposes,
  And it offers three actions:
    - "approve" — proceed to the technical planner's enrichment,
    - "edit" — provide feedback text; the business analyst is re-invoked once with the
      feedback, rewrites the L2/L3 ACs, and gate 2 is shown again,
    - "cancel" — abort the pipeline; all ACs remain with readiness: draft,
  And if the user chooses "edit" a second time at gate 2, the run aborts with an error
    stating that the business analyst did not produce satisfactory ACs after 2 attempts,
    nothing from the business analyst's stage is committed, and its L2/L3 ACs remain in
    the store with readiness: draft,
  And if the user approves, the workflow commits the business analyst's L2/L3 ACs to the
    authoring branch as that stage's own commit, naming the approved AC ids and the run
    id; that commit is the record of the approval, and the technical planner (it-po),
    whose stage has no human gate of its own, starts only after it succeeds,
  And if that commit fails, the run stops with an error and the technical planner
    does not start.
