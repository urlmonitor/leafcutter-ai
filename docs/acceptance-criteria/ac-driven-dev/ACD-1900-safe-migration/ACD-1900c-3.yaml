title: "enforce can only be turned on once no old-shape requirements remain"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given the store still contains at least one schema_version < 2 record,
  When ac_unit_of_work.enforce is set to true,
  Then the flip is refused with an error naming the remaining v1 records;
  And when zero schema_version < 2 records remain, setting enforce = true is accepted.
