notes: |
  THE THIRD OF THE THREE NAMED COLLISION SOURCES, AND THE QUIETEST. The other two
  corrupt something. This one produces a test that passes or fails depending on
  what an unrelated test happened to be doing a millisecond earlier — the flake
  that gets rerun until green and never diagnosed. That is corrosive in a
  particular way: it teaches everyone that a red run means nothing, which
  dismantles the safety net just as effectively as a slow suite does.

  THE COUNT CLAUSE IS SEPARATE FROM THE CONTENT CLAUSE ON PURPOSE. A per-test view
  filtered by the test's own identifier satisfies the first clause while a test
  asserting "the sink now holds three entries" still fails under load. Both shapes
  exist in suites of this kind and only the second is caught by the count clause.

  THE LAST CLAUSE IS THE ONE THAT CANNOT BE SKIPPED. Concurrency defects are
  probabilistic: a parallel run that happens not to interleave proves nothing, and
  the first two clauses are both satisfiable by a run where the collision simply
  did not occur. Forcing the simultaneous emission is what converts this from an
  observation into a proof.
