  - name: test_ge122d3ii_second_install_leaves_an_edited_placeholder_untouched
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The install is run a second time over a project whose scaffolded README the adopter has edited; the file is byte-identical afterwards. Create-if-absent, never rewrite."
test_rationale: "This criterion is a boundary, and the reason it must be tested from both sides in one module is that each side alone certifies the wrong implementation: teaching the pass that an absent root means zero satisfies every first-block assertion perfectly and is the precise defect the AC exists to forbid, while the block-on-missing-root assertions alone say nothing about whether a new adopter can commit. Only the pair forbids anything. Every descriptor therefore runs against a real installed project built from an EMPTY directory — a fixture copied from this repository already contains all four roots, so it reproduces the source-tree bias behind the seven consumer-install defects of 2026-08-13..17 and cannot fail on the defect under test. The relocation and no-hardcoded-root descriptors are separate because the third block is a change of MECHANISM, not a restatement: a pass that scaffolds correctly and still resolves the diagrams root from a literal path passes the first two blocks and silently scans the wrong directory for any consumer who moved their store. The grandfathered-files and second-install descriptors pin the two ways a scaffold step can do collateral damage to content it did not create."
