test_spec:
  - name: test_protocol_declares_a_per_round_seeded_items_slot
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Run slot extraction over the real on-disk pattern record and assert a per-round seeded-items slot is declared and placed, since the scoring rule is meaningless without it."
  - name: test_verdict_is_fail_when_any_round_misses_a_seeded_item
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Compute the overall verdict for a round record of 4/4, 6/6, 4/5 and assert 'fail' — executes the verdict computation rather than asserting the rule's prose is present."
  - name: test_verdict_has_no_averaging_or_percentage_path
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Assert that a 14-of-15 aggregate (93%) still yields 'fail' and that no configured threshold below 1.0 can make the seeded-gap mode pass a partial round."
  - name: test_unseeded_findings_never_turn_a_failing_round_into_a_pass
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score a round with 4 of 5 seeded items reported plus 10 additional unseeded findings; assert the round is 'fail' and the extras land in additional_findings."
  - name: test_rerun_uses_a_seeded_set_disjoint_from_previous_runs
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Given a recorded failing run for an agent, assert a re-run's seeded set shares no item with any previously recorded set for that agent, and that the earlier result file still exists afterwards."
