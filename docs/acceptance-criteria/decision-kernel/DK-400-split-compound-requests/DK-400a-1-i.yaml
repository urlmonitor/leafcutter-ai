id: DK-400a-1-i
title: "An ambiguous routing result on a bundled goal starts the same split, recorded as ambiguous"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose root goal is "Decide the storage format for reusable decision criteria,
    and find which published decision records already repeat the same criteria",
  And routing finds the decision capability and the research capability equally fitting, so its
    result is an ambiguous gap rather than one capability,
  When routing runs on the run's root,
  Then a split is started for the goal with trigger ambiguous, not jev_none,
  And the top routing candidate is not picked silently to run the whole goal,
  And the run waits for the host to propose the parts, exactly as for a split with trigger
    jev_none.
