notes: |
  ==========================================================================
  THE RETIRED TEST CONTRACT (moved here from test_spec, 2026-10-09).
  NONE OF THIS IS WORK WAITING TO BE DONE. DO NOT AUTHOR ANY OF THESE TESTS.
  ==========================================================================
  test_spec is now null and test_required is false. The three descriptors below stood
  in test_spec until this retirement; they are recorded here because the field is a
  present-tense instruction to test-writer and these describe a contract against code
  that no longer has a caller.

  (1) test_tq600a_11_i_accessor_falls_back_when_the_c_parser_class_is_absent
      — unit / failure. With the C safe parser class removed from the yaml module
      namespace, resolving the accessor yielded the pure-Python parser and raised
      nothing, restoring the attribute afterwards so the removal could not leak into
      other tests.

  (2) test_tq600a_11_i_results_are_equal_with_and_without_the_c_extension
      — unit / criterion. Parsed a real store record both ways inside the
      simulated-absence window and asserted the two objects equal. The point was that
      "it ran" is a weaker claim than "the values match".

  (3) test_tq600a_11_i_a_store_entry_point_completes_with_the_c_parser_absent
      — integration / reachability. Ran the store-wide schema validation entry point
      in a FRESH subprocess with the C class made absent, asserting it exited zero and
      named a non-zero file count. The fresh process was the whole point: an
      in-process patch applied after the module cached its choice proves nothing.
      FOR WHOEVER REVIVES THE PORTABILITY CONCERN: the risk is real and permanent —
      an adopter whose PyYAML was built without libyaml must not get an ImportError
      at module load or an AttributeError where the parser is chosen. After the
      static-cards change the ONLY site in the package resolving the C class is the
      pre-existing guarded inline `getattr(yaml, "CSafeLoader", yaml.SafeLoader)` in
      scripts/render_effective_prompt.py, which already has the right shape. So the
      risk is closed by construction rather than by a test, which is weaker. If it is
      to be asserted rather than assumed, it belongs on a record about that one site.

  THE ORIGINAL test_rationale, PRESERVED BECAUSE ITS WARNING GENERALISES. "The whole
  value of this record is that it covers a branch nobody in this workspace can take
  by accident. That makes the ordinary failure mode specific: a test is written, it
  never enters the fallback, and it passes for the wrong reason — the same shape as a
  check that examined nothing." Hence the simulation named as the mechanism, the
  restore named so the removal could not leak, and the fresh subprocess. Any future
  test of an unreachable-here branch has the same failure mode and needs the same
  three precautions.

  Why this is a separate record rather than a clause of TQ-600a-11: the parent is
  measured in this environment, where the C extension is present and the fallback is
  dead code. A record that bundles "it is faster here" with "it still works there"
  is satisfiable by proving only the first, and the second is the one that decides
  whether the package remains installable for adopters.
