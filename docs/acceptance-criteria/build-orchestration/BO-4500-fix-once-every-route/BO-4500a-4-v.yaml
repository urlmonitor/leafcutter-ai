criteria: |
  Given the workspace's index is held by another version-control process that has not
    released it,
  When the shared commit step tries to stage the named file a.py,
  Then no commit is recorded,
  And the answer is one JSON object with status refused, sha null, and a reason that quotes
    the version-control system's own error text,
  And a.py's working-tree content is unchanged.

  Given the version-control system reports an error while the commit is being recorded,
    after every check has passed,
  When the step answers,
  Then the answer's status is refused with the error quoted in the reason, never committed and
    never nothing_to_commit,
  And no partial commit exists on the branch.
