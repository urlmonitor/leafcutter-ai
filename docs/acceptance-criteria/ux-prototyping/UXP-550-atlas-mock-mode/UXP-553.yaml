id: UXP-553
readiness: draft
priority: medium
title: "LEAFCUTTER_MOCK env sets the default mock state; a runtime override takes precedence"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the Atlas is deployed,
  When the server resolves whether to serve mock data for a request,
  Then the LEAFCUTTER_MOCK server env variable sets the DEFAULT mock state
  (LEAFCUTTER_MOCK=1 defaults to mock on; unset or 0 defaults to real),
  And the app CAN override that default at runtime via an in-app control (cookie or
  ?mock query-param),
  And when a runtime override is present it takes PRECEDENCE over the env default, so an
  on-page toggle can switch the current session between mock and real,
  And when no runtime override is present the env default decides,
  And this precedence is subject to the optional production lock in UXP-553-1.
depends_on:
