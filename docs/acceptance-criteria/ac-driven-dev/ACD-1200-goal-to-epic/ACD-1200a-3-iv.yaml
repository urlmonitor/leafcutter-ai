notes: |
  WHY THIS IS A SIBLING OF ACD-1200a-3-iii AND NOT AN AMENDMENT TO IT. ACD-1200a-3-iii is
  work_status: done and its promise was kept — "...InThe" ends on a complete word and passes its
  trailing-character assertion. Reopening a kept promise to make it mean something stricter would
  destroy the record of what was actually delivered. The new requirement is a distinct property
  of the same derivation: not WHERE the boundary is, but WHICH boundary to stop at.

  THE FIX IS NOT SPECIFIED HERE, DELIBERATELY. KI-ACD-011 offers two directions — drop trailing
  function words after truncating, or cut at the last content-word boundary in the first place.
  Both satisfy this criterion, they differ in where the cap is applied, and choosing between them
  is an implementation decision. What the criterion pins is the observable property of the name,
  which is what a test can assert either way.

  KEEP THE CAP. The defect is where the cut lands, not that a cut happens. An implementation that
  satisfies the function-word clause by abandoning the length limit fails the third clause and
  regresses ACD-1200a-3-iii.

  THE DEGENERATE CASE IS FOLDED IN RATHER THAN SPLIT OUT because the hierarchy stops at L3 and
  this record is already L3 — it can have no child. It is a real case, not a hypothetical: a
  title that opens with several short function words can put the cap inside the opening phrase,
  and an implementation that unconditionally strips trailing function words would then return
  nothing at all.

  WHERE THIS BEHAVIOUR WAS SUPPOSED TO LIVE. scripts/goal_to_epic.py cites ACD-1200a-6 six times
  as the governing criterion for concise epic naming, and no record with that id exists in the
  store. This AC is deliberately NOT authored at that id — see the sign-off note on
  ACD-1200a-8-i, which carries the same finding. Reclaiming ACD-1200a-6 for a new promise would
  silently rewrite what those six live citations mean.
