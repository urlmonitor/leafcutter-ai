    state: existing
  - path: templates/workflows-js/plan-feature.js
    state: existing
  - path: templates/workflows-js/fast-lane-ship.js
    state: existing
  - path: templates/workflows-js/build-feature.js
    state: existing
  - path: templates/workflows-js/finalize-feature.js
    state: existing
  - path: templates/workflows-js/quick-fix.js
