test_rationale: |
  Grepping either reader for a quote-stripping expression is not evidence: it
  cannot tell a normalisation that runs from one that is defined and never
  reached, and it cannot show the two readers agreeing, which is the whole
  subject of this criterion.

  The load-bearing test runs BOTH readers over the same record and compares what
  they yield. Anything that exercises only one of them proves nothing here — the
  defect is a disagreement, and you cannot observe a disagreement from one side.
  Take a record whose producer is written with surrounding quotes, read it once
  through the real parse and once through the fallback, and assert the two names
  are equal and equal to the unquoted form.

  Build the fixture byte-for-byte as the store's own writer emits it, not as a
  hand-typed indented literal. The repo has already shipped a parser that was a
  complete no-op on every real record because synthetic fixtures reproduced an
  indentation bias the real serializer does not have
  (EPIC-PhantomDoneFilesTouched).

  Cover the second reader explicitly. There are two fallback paths, not one —
  `load_yaml_manual` and the `ImportError` branch of `load_yaml_from_string` —
  and fixing only the first leaves the second disagreeing while every test that
  goes through the first passes.

  Assert the acceptance, not a refusal. A quoted spelling of a registered agent
  must be ACCEPTED under both readers. An implementation that refuses quoted
  records would satisfy a naively-written test here and would refuse 16 valid
  records in the live store; this criterion was amended precisely because an
  earlier revision asked for that refusal.

  Pin the neighbours. The fallback readers also fail to resolve null, booleans
  and integers, and `validate_manually` compensates by treating the STRING
  "null" as missing, while ACS-100i-10-i depends on a valueless key arriving as
  the empty string. Assert both still behave after the unwrap, or this fix
  silently breaks the criterion next door.

  Assert the no-mutation scenario separately: read the fixture back after the
  run and assert its bytes are unchanged. The check reports; it never writes.

  Guard the empty run: assert on the count of records the run reports examining,
  not only on the exit code (KI-ACS-001 — the store-wide validator printed
  success on a run that resolved to zero files for eight days while the
  instruction to use it was already in CLAUDE.md).
declares_side_effect: false
notes: |
  DECISION: refuse, do not normalise. Three reasons, in order of weight.

  1. Every downstream reader does an exact string match, and they are spread
     across two languages. `generate_ticket_from_ac.py` uses the value as a dict
     KEY in the phase map; `build-feature.js` dispatches `agentType: phaseName`
     from that map; the agent cards group records by the raw value; the fast lane
     is about to join them. A normaliser would have to be replicated at every
     read site, and the one site that gets missed fails open — silently, in the
     dispatcher. A rule that refuses at authoring time has exactly one site.

  2. Normalising makes the text on disk differ from the value the system acts
     on. That gap is the entire class of defect this AC set exists to close;
     reintroducing it as the fix would be self-defeating.

  3. The correction is a two-character edit, and there are 16 of them. The cost
     of refusing is trivial; the cost of a silently-normalised store is a value
     nobody can grep for.

  COUNTS ARE FROM THE LIVE STORE at 2026-08-25 on branch
  acs-assigned-agent-validation: `"python-coder"` x10, `"test-failure-triage"`
  x5, `"documentation-expert"` x1. All three unquoted names ARE registered
  agents, which is why these 16 are separated from the 24 in ACS-100i-11 that
  name something that is not an agent at all — different defect, same field.
  Re-measure at implementation time; the numbers drift as other work lands, and
  a test that pins 16 without re-measuring will fail for the wrong reason.

  WHY THIS IS AN EDGE CASE AND NOT A SECOND RULE: quoting does not make the name
  wrong, it makes it unmatchable. Left unhandled, a registry-membership rule
  would refuse `"python-coder"` with the message "no agent named
  \"python-coder\" is registered", which is true, useless, and sends the author
  looking for a missing agent instead of a stray quote. The value this criterion
  adds is the message, not the refusal.

  ---
  IT-PO TECHNICAL ENRICHMENT, 2026-08-25 — ONE FINDING THAT CHANGES THE
  IMPLEMENTATION, RAISED AS A CAVEAT RATHER THAN AS AN EDIT TO THE CRITERIA.

  The criteria describe the 16 values as ones "none of which string-match their
  unquoted twins". Verified on this branch, that is true on ONE of the two parse
  paths and false on the other:

    - On the PyYAML path — the real one, since PyYAML is installed and
      check_ac_schema.py's jsonschema branch is authoritative — the source line
      is ordinary YAML double-quoting and yaml.safe_load returns the bare name.
      It DOES string-match its unquoted twin. A store-wide scan of parsed values
      finds 24 refusable records, not 40.
    - On the manual-parse path (load_yaml_manual, and the ImportError branch of
      load_yaml_from_string) the value is value.strip() of the raw text, so the
      quote characters survive and it does NOT match.

  Both halves of the criterion's intent survive this, but the implementation does
  not: the refusal must be driven by the record's RAW SOURCE LINE, not by the
  parsed value, or it will find nothing in the live store. That is why the
  helper's signature gains raw_text and why the reference file for this criterion
  is the entry point that owns the Path, not the parser.

  The third scenario — that a quoted and an unquoted record are not treated as
  two different producers by anything that groups by producer — is already
  satisfied on the PyYAML path and is violated only on the manual-parse path,
  which is where the seam test belongs.

  Fourteen of the 23 finalize-feature-workflow records are ALSO quoted, so a
  single record can fail both this rule and the parent's membership rule at once.
  The message-ordering constraint above exists for those 14.

  ---
  IT-PO SECOND PASS, 2026-08-25, AFTER THE CRITERIA WERE AMENDED. Everything in
  this notes field ABOVE this line predates the amendment recorded in amended_by
  and is retained only as history. Where it conflicts with what follows, this
  section governs; where it conflicts with the criteria, the criteria govern.

  WHAT IS NOW STALE ABOVE, explicitly:
  - The "DECISION: refuse, do not normalise" block and its three arguments. The
    premise it rests on — that a quoted record is a distinct, unmatchable value —
    is false on the parsed path. No record is refused for being quoted.
  - "WHY THIS IS AN EDGE CASE AND NOT A SECOND RULE", which describes a refusal
    message that will never be emitted.
  - My own first-pass paragraph directly above concluding "the refusal must be
    driven by the record's RAW SOURCE LINE". The finding was right; the
    conclusion I drew from it was not. Detecting the quoting was never the goal —
    making the two readers agree is.

  WHAT THE IMPLEMENTATION IS NOW: converge the fallback readers up to the real
  parser. `load_yaml_manual` (line 105) and the ImportError branch of
  `load_yaml_from_string` (line 144) each build their result with
  `value.strip()`, which removes whitespace and nothing else. Teach both to
  unwrap a matched surrounding quote pair. That is the entire behavioural change,
  it is generic across every field rather than special-cased to assigned_agent,
  and it makes the second criterion scenario true by construction.

  THE raw_text SEAM SURVIVES WITH A DIFFERENT JOB. It is no longer how the rule
  detects quoting; it is how the rule can NOTICE that the two readers disagreed.
  Supplied with the source line, the helper can compare the value it was handed
  against what a real parse of that line yields and report the divergence. Cheap,
  and it converts precisely the class of silent drift that produced this
  criterion into an explicit diagnostic.

  RESOLVED 2026-08-25, after the IT PO flagged them. The IT PO was not permitted
  to edit `title` or `test_rationale` in its pass and correctly recorded that both
  still asserted the pre-amendment reading rather than silently leaving the
  contradiction standing. Both have since been corrected by the same hand that
  made the criteria amendment:
  - `title` read "...is refused as the distinct value it is, not quietly
    unwrapped" — which asserted the exact opposite of the criterion beneath it,
    since nothing is refused now and the fix IS an unwrap. It now states the
    reader-agreement guarantee.
  - `test_rationale` instructed the test author to "assert a non-zero exit that
    names each offending record" and framed the choice as "refuse vs. normalise".
    It is rewritten around the load-bearing comparison — run BOTH readers over
    one record and assert they agree — and now says explicitly that a quoted
    spelling of a registered agent must be ACCEPTED, because an implementation
    that refused it would satisfy a naively-written test and refuse 16 valid
    records in the live store.
  No field now disagrees with the criteria; the earlier "test_spec is
  authoritative" instruction is retired rather than left standing.

  ONE THING THE AMENDMENT DOES NOT CHANGE: the fallback readers are wrong about
  more than quotes. They do not resolve `null`, booleans, integers or lists
  either — `assigned_agent: null` arrives as the STRING "null", which
  `validate_manually` compensates for at line 183 by treating (None, "", "null")
  as missing, and a valueless key arrives as "" which ACS-100i-10-i's
  empty-string constraint depends on. Both compensations must still hold after
  the unwrap lands, which is why there is a regression test for them.
