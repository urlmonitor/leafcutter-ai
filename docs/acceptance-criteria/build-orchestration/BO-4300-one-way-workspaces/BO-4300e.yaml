criteria: |
  Find or clear a workspace without risking work the team never got.

  Any workflow or person can ask where the workspace for a piece of work is and get a
  definite answer from the same one door that made it. Clearing one away is refused while
  it still holds changes that have not reached the shared project, unless that loss was
  explicitly authorised beforehand -- so unattended runs can tidy up without stalling on
  a question nobody is there to answer, and nothing is ever deleted by accident.
