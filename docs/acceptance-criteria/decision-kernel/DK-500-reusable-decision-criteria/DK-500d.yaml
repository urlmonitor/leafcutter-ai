notes: |
  Only PUBLISHED categories are offered. Candidates, staged and retired
  categories are not. The kernel finds them through reviewed records in Git,
  never through Langfuse (ADR-058 section 6).

  The human approval gate stays. Reused criteria are proposals at the
  approve-proposals step exactly like generated ones (ADR-060: evidence, never
  authority). This L1 must not create a path where a reused category skips that
  step.

  DISTINCT FROM PRECEDENT. The precedent step (decision-retrieval flow) may
  offer an earlier ANSWER. This L1 offers earlier QUESTIONS. The two can apply
  in the same run.

  OPEN, for BA / IT PO: "each reused question stays linked to its category".
  Membership lives only in the category record as (decision id, criterion id)
  pairs, and decision records stay unchanged. How a NEW decision's reuse of a
  category becomes a member pair is not settled by the decision. Two options:
  the category record gains the pair when the new decision is published, or the
  next mining round (DK-500a) picks it up. DK-500f's usage and outcome counts
  depend on this.
