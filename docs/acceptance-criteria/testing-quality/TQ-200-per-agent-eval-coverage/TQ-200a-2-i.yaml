criteria: |
  Given an agent whose output is a label — the pt-classifier deciding needs_flow,
    needs_mock_data, and needs_mockup (and the derived outcome),
  When its eval rows are scored,
  Then each row passes only when the produced label matches the expected label
    exactly,
  And the scorer reports precision and recall computed per routing axis (per each
    of needs_flow, needs_mock_data, needs_mockup),
  And the overall score for the set is derived from those per-axis figures.
