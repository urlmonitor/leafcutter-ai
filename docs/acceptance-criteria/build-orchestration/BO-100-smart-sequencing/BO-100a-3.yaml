id: BO-100a-3
title: "Diamond dependency resolves correctly without duplicate dispatch"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic contains tickets A, B, C, D where B.depends_on=[A],
    C.depends_on=[A], and D.depends_on=[B, C] (diamond shape),
  When build_graph() constructs the dependency graph,
  Then the graph contains four nodes with edges A->B, A->C, B->D, C->D,
  And compute_ready() on the initial state returns ready=[A],
  And after A is done, compute_ready() returns ready=[B, C] (both unblocked),
  And after both B and C are done, compute_ready() returns ready=[D],
  And D is never placed in the ready set while either B or C is still pending,
  And D appears exactly once in the ready list (no duplication from having
    two satisfied predecessors).
