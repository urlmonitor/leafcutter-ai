id: GE-130d-2
title: Before blocking is switched on, real agent shell commands are replayed through the protections
  and every command that only looks at files that would have been stopped is named
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a sample of shell commands that agents actually issued in this project's recorded
    sessions, taken from those records rather than written for the measurement,
  When the sample is replayed through the documentation guard, the guide-read guard and the
    task-lock guard on the command path, in warn-only stage,
  Then the measurement states how many commands it replayed, and names every command a protection
    would have refused or stopped, with the protection and the file,
  And every named command that only looks at files is reported as a false block against that
    protection, and the measurement fails for that protection,
  And a protection with no false block in the sample is reported as having none,
  And given one command is added to the sample and nothing else changes, the stated count is one
    greater,
  And a sample containing none of the looking-only kinds (status, difference, history, printing,
    listing, searching, test runs) fails as a measurement that could not reach a verdict, rather
    than reporting no false block.
