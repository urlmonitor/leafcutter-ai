id: BO-3200f-1-i
title: "An executor dispatch that fails, comes back incomplete or is declined is reported as could not check, never as the command's outcome or a finding about the subject"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a check that reads the agent registry through the chartered executor, where the registry
    is present, readable, and permits the agent the check asks about,
    And the dispatch to the executor fails with a transport error before any result returns,
  When the check reports,
  Then it reports that it could not tell, and names the executor dispatch as what could not be
    completed and the transport error as why,
    And it reports no exit status for the command, because none was returned,
    And it does not report that the agent is denied, nor that the registry is missing,
    unreadable or malformed.

  Given the same check, where the executor's reply has no exit status part, or its standard
    output part is cut short of what the command emitted,
  When the check reports,
  Then it reports that it could not tell, names the incomplete result as why, and reports no
    finding about the registry.

  Given the same check, where the executor replies that it declines to carry out the command,
  When the check reports,
  Then it reports that it could not tell, and states that the executor declined rather than that
    the command ran and failed,
    And it reports no exit status for the command and does not name the registry as missing,
    unreadable or malformed.

  Given the same check, where the executor carries out the command and the command itself exits
    with status 1 because no registry is at the path given,
  When the check reports,
  Then it reports that it could not tell, and gives as why the path, the command's exit status
    of 1 and its error stream,
    And the reason it gives differs from the reason given in each of the three cases above.
