criteria: |
  Given a maintainer wants to add a new source of knowledge to the map
  When they open the how-to guide for declaring a new surface
  Then the guide shows where surfaces are declared and the fields each entry needs
    (a path and the relationship fields it contributes as edges)
  And it states that adding the entry is the only step — no map-building code is edited
  And it uses the acceptance-criteria store as a worked example of one declared surface
