title: "Split children receive matching cross-agent contracts"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an L2 AC is split into child "X-1a" (assigned to agent-A)
    and child "X-1b" (assigned to agent-B)
    where agent-B consumes output from agent-A,
  When the split procedure completes,
  Then "X-1a" has a delivers_to field naming agent-B
    with a contract describing the data shape delivered,
  And "X-1b" has an expects_from field referencing "X-1a"
    with a matching contract describing the same data shape,
  And the original AC's status is set to "superseded_by"
    with the superseded_by field listing both child AC ids.
depends_on: [TKT-300e, TKT-300e-1]
