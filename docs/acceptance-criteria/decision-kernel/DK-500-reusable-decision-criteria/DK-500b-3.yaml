id: DK-500b-3
title: Code places what it can, Jev places what code cannot, and a language model proposes only for what both leave unplaced
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given three new wordings: "Can it be built and verified as one ticket?", identical to the preferred wording of cat-1dc11c5a2ffa7310; "Does it keep human approval as the only source of authority, so that no record self-authorizes?", close to but not identical with an other wording of cat-d15d52392d7aa94c; and "Does the option keep secrets out of the published records?", asked by no category,
  When groupings are suggested,
  Then the identical wording is placed in cat-1dc11c5a2ffa7310 without any Jev or language-model call,
  And Jev is asked only about the two wordings that are not identical to a label,
  And a language model is asked to propose a new category only for wordings that both code and Jev left at "none", and never for a wording already placed,
  And a category a language model proposes is a candidate like a mined one, waiting for a person's approval.
depends_on:
- DK-500b
- DK-500b-1
covered_by:
- DK-500b-3-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-500b-1
  contract: 'Grouping suggestion with placement: category id | none, and reason.'
change_target: code
risk_surface: internal
it_requirements:
- 'Order, per dec-a070edfb6465bced: (1) code places a wording that equals a preferred or other label of an existing category, or whose criterion id equals a member''s criterion id, with no Jev or model call; (2) Jev answers one bounded choice question per remaining wording; (3) wordings Jev leaves at none or below the threshold become one-member candidate categories made by code, worded as the wording.'
- No language model and no host request is used anywhere in grouping, offline or in a run, and the tests count zero host or LLM requests. The criteria's language-model clauses are therefore satisfied with no language-model call at all (see the caveat in notes).
- 'Jev question form: one choice question per wording. The options are every existing non-retired category the caller can see (published, plus staged and open candidates when offline), each described by its preferred and other labels, plus ''none''. Category ids are opaque option keys; criterion ids and sources are not shown to Jev. Questions are batched up to jev.max_questions_per_call per call.'
- 'Bound: Jev is asked only while the full option list fits one choice question within the configured Jev request bounds (jev.max_state_chars). When it does not fit, no Jev call is made, the wordings stay at none with reason library_exceeds_choice_bound, and the condition is reported. The option list is never truncated or silently shortlisted.'
- A criterion-id placement carries reason criterion_id so the person sees it at review, because decision-local criterion ids can collide across decisions (dec-93c1c730463c1f3c, crit.stable_identity).
- 'Wording equality (''exact match'', ''identical'', ''repeat'', label uniqueness) is one shared rule for every caller (offline grouping, in-run grouping, publish label checks, drafted-repeat removal, edit detection): Unicode NFC, trimmed, internal whitespace collapsed to one space, case-folded; punctuation and word order stay significant. No caller may apply a looser or stricter rule of its own.'
- Each wording's placement reason and its Jev and model call counts are exposed in the result; these are the criteria's observables.
- 'Cold start: with no existing category no Jev call is made, and every wording becomes a one-member candidate.'
test_required: true
test_spec:
- name: test_identical_wording_placed_without_model_call
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: '''Can it be built and verified as one ticket?'' is placed in cat-1dc11c5a2ffa7310 with zero Jev and zero model calls for it.'
- name: test_jev_asked_only_for_non_identical_wordings
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Jev receives exactly two choice questions, for the two wordings that are not identical to a label.
- name: test_no_language_model_request_in_grouping
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A recording host port receives no request during grouping.
- name: test_unplaced_wording_becomes_code_made_candidate
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The secrets wording left at none becomes a one-member candidate, proposed and awaiting a person's approval.
- name: test_cold_start_makes_no_jev_call
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: With no existing category, grouping makes no Jev call and every wording becomes a one-member candidate.
- name: test_library_exceeding_choice_bound_makes_no_call
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: When the option list exceeds jev.max_state_chars, no Jev call is made and the wordings get none with reason library_exceeds_choice_bound.
test_rationale: Drive the grouping through its public entry point with a controlled Jev provider that replays recorded probabilities and counts calls, plus a recording host port that fails on any request; assert placements, reasons and call counts, not internal helpers.
