assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  - ac_id: ACD-2500d-5
    contract: >-
      The registered test-designer (templates/agents/test-designer.md; config/agent_registry.json id
      test-designer), dispatched as plan-feature.js dispatchTestDesign does: record ids, the verbatim
      JSON report of python scripts/ac_store/design_prepass.py --ids <ids> --store-root <store>
      --repo-root <root>, and ac_store_path. It edits only test_spec, test_design_authorship and
      test_design_opened_files (test-design group) of each record, field by field, and replies one
      JSON object {status: ok|blocked, records: [{id, test_design: written|pending|not_needed,
      file_findings: written|none, reason}], anomalies: [str]}.
  - ac_id: TQ-200d-1
    contract: >-
      The produced-tests scoring_mode and modules (OQ-1 decided: scripts/evals/produced_tests_mode.py
      and scripts/evals/produced_tests_scoring.py), the row expected object ({negative, fixture,
      gold_output, assertions}), the git-initialised sandbox, local_only handling and the scored-row
      record. Not a depends_on edge: build after TQ-200d-1 so the mode has one author.
test_required: true
package_surface: false
it_requirements:
- 'No longer blocked: ACD-2500d-5 is done and templates/agents/test-designer.md exists. TQ-500f-2-ii
  (the must_catch duty in the designer''s procedure) is still todo and is not a build dependency. The rows
  may fail until it lands, which is the eval''s red baseline. The live before-score is deferred, recorded
  later as a separate step the user triggers (OQ-11 decided).'
- 'Join the existing harness (TQ-200c-4). Register test-designer in scripts/evals/agent_eval_config.json
  as agents["test-designer"] (template templates/agents/test-designer.md, model sonnet and tools Bash,
  Read, Write, Edit per its frontmatter, local_only true per OQ-6). ONE set of {id, input, expected} rows
  goes at scripts/evals/sets/test-designer.jsonl, with fixture projects and recorded outputs under scripts/evals/sets/test-designer/
  (OQ-2 decided). Use the produced-tests scoring_mode of TQ-200d-1 (OQ-1 decided): new assertion kinds
  go into its scoring module, and no third mode is added. run_agent_eval.py (1087 counted lines) must
  not grow.'
- 'The designer produces no test files: its output is edited requirement records. Each row''s sandbox
  (the git-initialised temp copy of TQ-200d-1) therefore holds a small code fixture and an AC store of
  its own. The store has one leaf record per requirement (bug fix, gate, new behaviour), each with test_intent
  written and test design pending, and the fixture code it declares (the refresh gate, the trade gate,
  a report module). Fixture ids use a prefix that does not exist in the real store, and the fixture store
  lives outside docs/acceptance-criteria/, so no repository hook or scanner reads it as real requirements.'
- 'The row input is built from the same ingredients as plan-feature.js dispatchTestDesign: the record
  ids, the verbatim report of scripts/ac_store/design_prepass.py run on the sandbox, and ac_store_path.
  The dispatch asks for the test-design group only (the template allows a single-group dispatch). OQ-13
  decided: the eval builds the input from those ingredients and accepts that the prompt wording may drift
  from plan-feature.js; the seam test pins the ingredients.'
- 'Score the records after the run structurally, using the runner''s own matching rules (wrong_version_key
  and ALIASES in scripts/build_orchestration/_wvr_scope.py, so "revert the fix" and "the fix undone" are
  one name). Bug fix: an entry carries must_catch with the revert alias and at least one wrong version
  naming the retry_due condition. Gate: one wrong version per condition (window open, position limit)
  plus "the gate always allows". OQ-15 decided: "revert the fix" and "the gate always allows" match exactly after trimming and case-folding, through the runner''s alias rule; a condition-naming wrong version matches when its condition token (retry_due, window open, position limit) appears in the entry.
  New behaviour (trap, expected.negative true): an invented revert alias fails the row (OQ-14 decided:
  only a revert alias fails the trap; any other wrong versions named on that record are reported, not failed). Each produced record must also pass python scripts/ac_store/validate_ac_schema.py.'
- 'The designer''s stated bug fix / gate / neither judgement is read from the record as TQ-500f-2-ii''s
  2026-09-27 user decision defines it: an entry with must_catch or angle discrimination is the stated
  bug-fix-or-gate judgement, and their absence states neither. There is no separate classification field,
  and a judge, if any, is secondary and never the only scorer (OQ-5 decided). OQ-12 decided:
  the criterion''s "in its own words" is read this way. The criterion wording needs a business-analyst
  amendment to say so; the orchestrator dispatches the BA, and this pass does not change criteria.'
- 'Local only (user decision; KI-TQ-20260907; OQ-6 decided): agents["test-designer"].local_only true,
  so eval_selector.py keeps it out of the "Agent evals (affected)" job and out of --check. The payload
  carries run_context "local" and the report says so. Nothing claims TQ-200b-2. The agent list in unit_tests/evals/test_agent_eval_config_triggers.py
  is updated, which is an existing-test edit for the TQ-500g-3 sweep list.'
- Unit tests never call a live model. Row pickup and scoring are proven through --score-gold with recorded
  gold records, and through the scoring module with recorded bad records.
- Every new or changed .py file stays at or under 400 counted lines. Files already over the limit (run_agent_eval.py,
  1087) must not grow, and scripts/ac_store/design_prepass.py (156) and _wvr_scope.py (275) are reused,
  not edited.
test_spec:
- name: test_test_designer_set_registered_and_every_row_scored
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: python scripts/evals/run_agent_eval.py --agent test-designer --score-gold --results-file
    <tmp>
  description: The subprocess exits 0 and scores exactly the bug fix, gate and new behaviour rows, with
    no --row.
  must_catch:
  - test-designer entry missing from agent_eval_config.json
  in_scope_files:
  - scripts/evals/agent_eval_config.json
- name: test_new_behaviour_trap_fails_invented_wrong_versions
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: discrimination
  description: On the real trap row, a recorded design whose new-behaviour record carries must_catch "revert
    the fix" fails, and so does one spelling it "the fix undone". A design naming no wrong version passes.
  must_catch:
  - new-behaviour trap passes a design that names 'revert the fix'
  - alias spelling 'the fix undone' not matched
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
  - scripts/evals/sets/test-designer.jsonl
- name: test_gate_row_requires_one_wrong_version_per_condition
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: criterion
  description: A gate design missing "drop the position-limit condition" fails, and so does one missing
    "the gate always allows". The gold design passes.
  must_catch:
  - gate row passes with one condition's wrong version missing
  - gate row passes without 'the gate always allows'
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
- name: test_bug_fix_row_requires_revert_and_a_condition_naming_version
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: criterion
  description: A bug-fix design carrying only "revert the fix" fails, and so does one naming only "drop
    the retry_due condition". The gold design carrying both passes.
  must_catch:
  - bug-fix row passes with 'revert the fix' alone
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
- name: test_stated_judgement_read_from_record_fields
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: boundary
  description: A design whose bug-fix entry carries must_catch but neither angle discrimination nor any
    other declaration still counts as stated. A gate record with no must_catch and no discrimination angle
    fails as having stated neither. A produced record that fails validate_ac_schema.py fails its row.
  must_catch:
  - judgement read from the reply text instead of the record
  - schema-invalid record accepted
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
- name: test_designer_row_input_carries_the_real_prepass_report
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: seam
  surface_invoked: python scripts/ac_store/design_prepass.py --ids <fixture ids> --store-root <sandbox store>
    --repo-root <sandbox>
  description: The input the mode builds for a row embeds, verbatim, the JSON report design_prepass.py
    prints for the row's sandbox, names the fixture record ids and the sandbox store path, and asks for
    the test-design group only.
  must_catch:
  - pre-pass report built by the eval instead of design_prepass.py
  - dispatch asks for the file-findings group too
  in_scope_files:
  - scripts/evals/produced_tests_mode.py
- name: test_test_designer_local_result_never_presented_as_ci
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: failure
  description: The score-gold payload and report carry the local-run marker, and eval_selector.py does
    not list test-designer as affected by a change to templates/agents/test-designer.md.
  must_catch:
  - eval_selector lists test-designer as affected
  in_scope_files:
  - scripts/evals/eval_selector.py
  - scripts/evals/agent_eval_config.json
test_rationale: As TQ-200d-1, recorded good and bad designs go through the real runner CLI and the scoring
  module, with no live model. The must_catch lists are compared structurally, with the wrong-version runner's
  own alias rule, because a judge would be the opinion TQ-500 exists to replace. The trap carries the
  over-reach the designer is likely to show. The seam test pins that the designer sees the same pre-pass
  report the real pipeline gives it.
