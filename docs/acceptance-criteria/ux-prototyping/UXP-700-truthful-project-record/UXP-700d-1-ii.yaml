level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a journey authored by the project itself, describing the project's own product, stored
    under the project's own product root,
  When the project's own record is enumerated,
  Then that journey is returned,
  And it is absent when the example product is asked for by name,
  And it is not counted among the artifacts set aside as example content.
