notes: |
  Real-artifact proof (the user named this as the first real use). The synthetic
  fixtures in -i..-iv can reproduce a fixture bias; this one runs the gates on
  the two records that exposed the defect, exactly as they sit on main.

  Once this passes, the KI can be resolved and the false "done" on the two INF
  records is replaced by an honest retirement. AR-400c-1 is deliberately not in
  depends_on: it is an agent-registry record and is referenced here only as the
  successor value.

  IT-PO enrichment (2026-10-15): the gate list is pinned, and so is the proof
  that each hook inspected the staged files, because the AC hooks ignore argv.
  One run uses the deployed layout to catch a predicate module that was never
  deployed. The real store edit to the INF records rides in the same PR. The
  test works on copies so it does not depend on that edit.
