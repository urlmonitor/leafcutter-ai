id: TQ-500e-2
components:
  - testing_quality
  - ac_store
title: "A later reader retrieves what a test was shown to catch, without re-running anything"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store of finished work in which some pieces carry substitute evidence, some
      carry a reasoned negative, some carry ordinary before-and-after evidence, and
      some were finished before any falsifiability answer was recorded,
  When a later reader asks, for one named piece of finished work, what its tests were
    shown to catch,
  Then the answer recorded at the time is returned, without re-running any test and
    without re-deriving the answer from the tests as they stand now,
    And a piece carrying a reasoned negative returns that negative together with its
      reason, which is distinguishable from returning nothing,
    And a piece finished before any answer was recorded returns no answer recorded,
      which is distinguishable from a reasoned negative,
    And the answer returned is the one the run emitted, so a piece of work whose run
      recorded nothing returns nothing regardless of how its tests behave today.
depends_on:
  - TQ-500e
  - BP-1100g-5-i
