title: "The sign-off parity gate accepts AC-side sign-offs and requires no body Sign-offs section on a thin ticket"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a thin (v2) grouping ticket that carries no "## Sign-offs" section in its
    body but whose grouped AC records carry AC-side per-deliverable sign-offs,
  When the ticket sign-off parity validator runs,
  Then the validator does NOT require a body "## Sign-offs" section for that ticket,
  And it accepts the AC-side per-deliverable sign-offs as the sign-off record,
  And the ticket passes the parity check;
  And given a legacy fat ticket that carries a body "## Sign-offs" section listing the
    needed agents as signed off,
  When the same validator runs,
  Then that fat ticket still passes, its body sign-offs honoured during the
    dual-record window.
depends_on:
  - ACD-1800c
  - ACD-1800c-1
  - ACD-1800b-1a
