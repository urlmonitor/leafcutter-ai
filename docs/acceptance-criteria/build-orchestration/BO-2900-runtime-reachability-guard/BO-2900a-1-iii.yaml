notes: |
  THE CLASS THIS AC DESIGNS AGAINST. Not "this predicate was wrong" but a
  required check whose real behaviour was set by something nobody declared: an
  argument spelling, an alphabetical sort, an empty string. A refusal path shipped
  before anyone ran it over the proofs it would judge is the general form, and it
  recurs unless arming the refusal is made a consequence of a measurement rather
  than a choice.

  WHY THE CORPUS MUST BE DRAWN FROM THE STORE AND NOT WRITTEN FOR THE OCCASION.
  Every hand-authored fixture reproduces its author's assumptions about what a
  proof looks like. The shapes that broke this rule are precisely the ones nobody
  would think to write: a test method that needs a fixture from the suite, a test
  in a package whose imports only resolve under the real runner, a proof that
  launches the unit instead of importing it. Those shapes are already on disk in
  their thousands; sampling them is cheaper than imagining them and is the only
  version of this exercise that can fail.

  THE ZERO-PROOF CLAUSE IS NOT PEDANTRY. This repository has three recorded cases
  of a documented defence that examined nothing and reported clean — a validator
  whose bare-directory glob matched no files for eight days, a pre-drive check
  reading a path that never existed, and a merge audit comparing against a stale
  ref. An exercise that resolves to an empty corpus and reports success would be
  the fourth, and it would arm the refusal on the strength of having looked at
  nothing.

  BOUNDARY. This AC says nothing about which criteria the rule should judge —
  that is the scoping question, and the analysis this record derives from
  recommends deferring it on the ground that today's numbers are artifacts of a
  blind judgement. Do not let an implementer settle scoping here.

  VERIFICATION MUST EXECUTE. The corpus exercise is itself the evidence, and it
  must be a thing that can be run and that fails when a shape is answered wrongly
  — not a document asserting that the shapes were considered. A test that checks
  the exercise exists, or that counts the shapes named in a list, passes on an
  exercise that never runs a proof.
