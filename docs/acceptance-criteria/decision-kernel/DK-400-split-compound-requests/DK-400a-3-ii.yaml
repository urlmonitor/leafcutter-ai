id: DK-400a-3-ii
title: "A caller-supplied decision request is never checked for bundling, even when its question bundles several"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run started with a caller-supplied decision request (leafcutter.decision_request.v1)
    whose question is "Decide which fields a decision record needs, which folder layout the
    records use and how record files are named",
  And the request names its own two options, "One YAML record per decision under docs/decisions"
    and "One JSON record per decision under docs/decisions", and its own three criteria,
    "Git-reviewable", "findable by later runs" and "keeps the human approval",
  When routing runs on the run's root,
  Then the request is not checked for bundling and no split is offered,
  And the run has no split record,
  And the person is asked no question about splitting,
  And the run goes ahead as the one decision the caller named, with the caller's question, two
    options and three criteria unchanged.
depends_on:
