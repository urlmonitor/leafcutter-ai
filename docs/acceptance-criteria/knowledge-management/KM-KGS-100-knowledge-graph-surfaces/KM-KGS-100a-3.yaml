    relationship: describes
    status: exists
  - path: config/ac_store_schema.json
    relationship: context
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "extract_edges currently reads a hard-coded _SURFACE_EDGE_FIELDS dict that does NOT include the acs surface or the implemented_by/covered_by fields; the per-surface edge_fields must instead be sourced from the surface's declared edge_fields in paths.json so the acs surface's four fields produce edges with no surface-specific code branch (this is the declaration-driven invariant the KM-KGS-100c ACs depend on)"
  - "The components field must continue to emit the component_membership edge type (existing _COMPONENT_FIELDS behavior), while implemented_by, covered_by, and depends_on emit edges whose type equals the field name"
  - "Target-id resolution for file-path edge fields (implemented_by source files, covered_by test files) must reduce a path value to the same node-id form used for those target nodes, consistent with the existing depends_on path-stem resolution, so the edge lands on the real target node rather than a phantom id"
  - "implemented_by values may carry an optional #symbol anchor per the AC schema; the anchor must not corrupt the resolved target node id (resolve to the file/path node, ignoring or stripping the anchor for edge-target purposes)"
delivers_to: null
expects_from:
  ac_id: KM-KGS-100a-2
  contract: "One acs-surface node per acceptance-criterion file, keyed by the criterion id, with the criterion's frontmatter available for edge extraction"
