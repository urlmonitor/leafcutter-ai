id: AR-200b-3
title: "An agent permitted to dispatch sub-agents is permitted the tool by which an agent is dispatched"
component: agent-registry
components:
  - agent_registry
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of agents whose own definition declares at least one permitted
    sub-agent,
  When each such agent's permission is compared against the tools its own
    definition permits it to use,
  Then every one of them is permitted the tool by which another agent is
    dispatched, matched as that exact tool and not as part of a longer tool
    name,
    And an agent that permits sub-agents without that tool is reported, naming
      the agent, the sub-agents it is permitted and the tools it does declare,
      and the build stops until the tool is granted,
    And the remedy the report suggests is to grant the tool, never to remove the
      permission,
    And both sides of the comparison are derived from the agents' own
      definitions, so an agent given a permission tomorrow is checked with no
      edit to the comparison,
    And the comparison states how many agents it examined and how many held a
      permission, so a comparison that resolved to no agents is not read as one
      that found no violations,
  So a specialist told it may call on another specialist can actually make the
    call, rather than silently doing the work itself.
depends_on:
  - AR-200b
