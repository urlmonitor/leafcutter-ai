notes: |
  Filed from KI-KM-010 (severity high, 2026-08-26), second half and fix
  direction item 3: "Re-key `_event_hash` on fields that are actually
  populated, and add a collision test using two same-day same-destination
  same-kind records." The known issue's trap applies directly: "The hash
  defect is invisible today — no collisions exist among the 28 (verified). It
  becomes reachable the moment emissions resume at any volume, which is
  exactly when the loop is repaired. Fix it with the repair, not after."

  Scope boundaries. INF-400b-2-ii owns which fields the record has; this AC
  owns only which of them establish identity. INF-700b-1 owns `text` and this
  AC must not key on it. KI-KM-011 (a valid-JSON non-object line crashing the
  per-line loop) touches the same function's neighbourhood and is a separate
  defect — do not fold it in.

  Independently reproduced 2026-08-26 at branch
  fix/inf400-h1-h4-knowledge-loop: digest tuple confirmed at
  harvest_learnings.py:129-135; 28/28 records lack `ticket`; 17/28 timestamps
  are day-resolution; 0 collisions present.
