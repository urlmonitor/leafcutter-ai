id: GE-127g
title: "A document nobody writes by hand is not judged by a limit written for one, and you can see that it was set aside"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
  - agent_registry
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  The size standard protects a reader. Where there is no author to protect it
  from, it does not apply — and where it does not apply, that is said out loud.

  A document a generator rewrites whole has no human author deciding how long it
  is, and no reader working through it from end to end. Holding it to a limit
  written for prose stops work on everything else: the generator's output grows
  because unrelated work landed elsewhere, so the next person to commit anything
  is refused for length they did not write and cannot shorten, and the advice
  they are given — move a section out and leave a link — is advice nobody can
  act on, because the next regeneration overwrites it.

  After this, whether a document is held to the standard is a stated, reviewable
  property of the kind of document it is, in the same way the sibling standard
  for code already states which kinds of file it does not cover and why. A
  document set aside is reported as set aside and for which stated reason, so a
  run that judged nothing can never be read as a run that found nothing — and so
  an exclusion that has grown too wide is visible rather than silent. Nothing
  about this makes a document a person actually writes any easier to grow.
