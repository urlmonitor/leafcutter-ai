notes: |
  POPULATION DECIDED BY BRAINCANDY, 2026-10-16: the backstop applies ONLY to files already
  over their limit — previous measured length strictly greater than the permitted length,
  measured with the rule in force now (GE-127d-3-iii). A file at or under its limit is never
  refused by the backstop, even when its measured length falls while its total line count
  rises. Reason: with every comment uncounted (GE-127d-3), "removed code and added more
  comments" is an honest change, and the exploit this canary watches for (KI-CG-20261013)
  happened on oversized files under ratchet pressure. For over-limit files the honest shape
  is still refused, at a bounded cost: the refusal tells the author to make the reduction
  and the commenting in separate commits, and each passes on its own (comment-only additions
  leave the measured length unchanged).

  Known residue, accepted: a measure gap on an under-limit file is not caught by this
  backstop; the crossing refusal (GE-127a-1) still applies once the file goes over.

  WHY THIS IS AN L2 OF GE-127d AND NOT AN L3 OF GE-127d-3. It is a second, independent check
  that exists precisely in case GE-127d-3's measure is wrong; filing it under that measure
  would make the canary a child of what it watches.
