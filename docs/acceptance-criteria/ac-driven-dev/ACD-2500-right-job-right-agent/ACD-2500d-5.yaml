id: ACD-2500d-5
components:
- ac_driven_dev
- agent_registry
- testing_quality
readiness: approved
priority: high
title: One code-aware planning agent is registered and writes the test design and the file findings as
  two separate outputs
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the agent registry and the planning agents' templates after this change,
  When the code-aware planning agent's profile and registry entry are read,
  Then exactly one new agent exists whose role is to read the code and existing tests before the
    build, and it is pinned to the Sonnet model tier,
  And its tools let it read and edit files and include no repository-wide search tools,
  And its profile declares that it changes requirement records in the requirement store and
    produces two outputs: a test design (ACD-2500c) and file findings (ACD-2500d),
  And one run writes the two outputs to separate fields, so a run that produces only one of them
    leaves the other field untouched,
  And it reads the pre-pass report for the requirements it is given before opening any file,
  And the technical planner's profile still declares no source-code access.
depends_on:
- ACD-2500d
doc_links:
- path: docs/architecture/adrs/ADR-033-agent-model-tiers.md
  relationship: describes
  status: exists
- path: docs/architecture/adrs/ADR-009-itpo-no-source-code-access.md
  relationship: describes
  status: exists
- path: docs/architecture/components/agent-registry.md
  relationship: describes
  status: exists
- path: docs/architecture/adrs/ADR-006-flatten-supervisor-chain.md
  relationship: describes
  status: exists
assigned_agent: llm-expert
estimated_complexity: M
package_surface: true
it_requirements:
  config_schema_fragment:
    type: object
    required:
    - id
    - name
    - model
    - template_path
    - produces
    properties:
      id:
        const: test-designer
      model:
        const: sonnet
      is_ticket_phase:
        const: false
  reference_file_path: config/agent_registry.json
  n_location_rule: '1'
  required_skills:
  - llm-expert
  - add-agent-to-package
  post_write_commands:
  - python scripts/build.py
  constraints:
  - Working agent id 'test-designer' (user to confirm at the final gate); it must not collide with
    a slash-command name (ADR-033 §2.8).
  - Canonical source is templates/agents/test-designer.md; the registry entry and the build-generated
    card match its frontmatter (profile honesty, ACD-2500e-1-i).
  - 'Structural pattern to follow: templates/agents/test-writer.md (Sonnet, reads code, internal).'
  - Model tier Sonnet (ADR-033 §2.1); tools Bash, Read, Write, Edit (tier floor), no Agent, no Grep/Glob/MCP
    search (§2.6). The optional Opus sub-call for must_catch is deferred until must_catch exists; when
    added it takes the §2.3 Sonnet-gatekeeper route.
  - 'Visibility internal: spawned only by the plan-feature workflow and the single-record redesign path
    (ACD-2500b-3); never user-invoked.'
  - 'Returns one machine-parseable JSON value: Agent id ''test-designer'' (working name, user to
    confirm). Machine-parsed result: one JSON value {status: ''ok''|''blocked'', records: [{id: str, test_design:
    ''written''|''pending''|''not_needed'', file_findings: ''written''|''none'', reason: str|null}], anomalies:
    [str]}; the workflow judges success from on-disk record state, the JSON only routes.'
  - 'ADR-009 stays in force for it-po. Recommended follow-up: an ADR (adr-author) recording why this pre-build
    agent may read source.'
  - Deployed/template parity via the build (ADR-001).
delivers_to:
- agent: python-coder
  contract: 'Agent id ''test-designer'' (working name, user to confirm). Machine-parsed result: one
    JSON value {status: ''ok''|''blocked'', records: [{id: str, test_design: ''written''|''pending''|''not_needed'',
    file_findings: ''written''|''none'', reason: str|null}], anomalies: [str]}; the workflow judges success
    from on-disk record state, the JSON only routes. Consumed by plan-feature.js (ACD-2500c-2).'
- agent: llm-expert
  contract: Agent template skeleton that ACD-2500c-1 (test design) and ACD-2500d-1/-2/-3 (file findings)
    fill with their procedures.
expects_from:
  ac_id: ACD-2500d-5-i
  contract: 'Pre-pass report (JSON, deterministic, sorted): {batch: [ac_id], records: [{id: str, declared_files:
    [{path: str, state: ''exists''|''to_be_created''|''neither''}], test_dirs: [{path: str, exists: bool}],
    reference_files: [{path: str, exists: bool, same_type: bool, same_area: bool}]}]}; paths repo-root-relative
    POSIX. Non-zero exit and no report on error.'
test_spec:
- name: test_test_designer_registered_on_sonnet
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: config/agent_registry.json has exactly one new code-aware agent entry with model sonnet
    whose template exists.
- name: test_test_designer_tools_exclude_search
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: The agent's tools include Read/Write/Edit/Bash and exclude Grep, Glob and MCP search tools.
  angle: boundary
- name: test_test_designer_profile_declares_two_outputs
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: The profile declares it mutates the requirement store and produces requirement records
    (test design and file findings).
- name: test_it_po_still_declares_no_source_access
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: The it-po template still carries the no-source-access declaration.
  angle: seam
origin_agent: it-po
