notes: |
  DECIDED 2026-09-17 (user): a small in-place command edit (sed -i on one word) in a gated folder
  is refused while the guide is unread, even though the same one-word change through the Edit tool
  would pass the small-edit allowance. Follows GE-130f-2-i's Write rule (no measurable
  before/after text => not small). Size parity on the command path would need a measured
  before/after, which would push it into GE-130c's after-the-fact check; not chosen.

  READ SIDE FIRST: depends on GE-130a-3. Widening the write side without the read side creates
  false blocks for any agent that reads guides with cat (GE-130a notes).

  declares_side_effect: false.
