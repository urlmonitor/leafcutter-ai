    description: "No instructional text in docs/how-to/ or docs/reference/ tells a reader to skip the parent-back-link check to record an idea — the removal clause, asserted separately from the additions so it cannot be quietly skipped."
  - name: test_howto_links_to_the_schema_reference
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    description: "The how-to links to docs/reference/ac-schema.md for field definitions instead of restating them, and the link target exists."
