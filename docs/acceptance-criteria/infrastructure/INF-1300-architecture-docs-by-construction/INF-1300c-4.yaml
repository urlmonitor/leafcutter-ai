created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300c.yaml"
criteria: |
  Given a request to produce a document that does not ask for the document to be
    listed,
  When the document is produced,
  Then the index is not modified in any way, and no index is created where none
    existed,
  And the produced document is identical to the one produced by the same request
    with the listing asked for, so asking for the listing changes the index and
    nothing else,
  And nothing anywhere in the project is written except the new document and the
    single entry the new document's parent gains in its list of the documents
    below it,
  And this is established by comparing the whole project before and after, not by
    inspecting the places a change was expected.
