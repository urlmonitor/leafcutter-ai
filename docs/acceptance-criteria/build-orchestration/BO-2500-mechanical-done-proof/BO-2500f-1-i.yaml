id: BO-2500f-1-i
components:
  - build_orchestration
  - ac_store
title: "An inspection cannot verify a record whose change can be tested"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a test-free record whose change_target is code, schema or pipeline, alone
    or as one value in a list,
  When it carries an inspection verification record and is marked done,
  Then marking done is refused, and the refusal names the change_target value that
    rules inspection out,
  And the same record carrying a check verification record that holds may be
    marked done,
  And writing or changing such a record without marking it done is not refused
    for this reason (BO-2500f-1),
  And a record whose change_target values are only docs, prompt or config may carry
    an inspection,
  And a record with no change_target is treated as ruling inspection out, so a
    missing declaration never opens the weaker method,
  And where the kind of the record's deliverable is determined from where its
    declared files sit (BO-3500c-2) and that kind is code, schema or pipeline, a
    change_target stating docs does not lift the refusal, and the disagreement is
    reported as a defective declaration rather than adopted.
depends_on: [BO-2500f-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-3500-buildable-by-any-craft/BO-3500c-2.yaml
    relationship: related
    status: exists
    relevance: "The kind of artifact is derived from where the deliverable sits; a record's own statement of its class is never honoured."
  - path: docs/architecture/adrs/ADR-076-verification-methods-for-non-test-requirements.md
    relationship: describes
    status: exists
    relevance: 'The decision this record implements: wave 1 (section 1) or wave 2 (section 2)
      of the verification-method rule.'
assigned_agent: python-coder
estimated_complexity: S
declared_files:
  - path: scripts/ac_store/_verification_record.py
    state: to_be_created
it_requirements:
  - Added to BO-2500f-1's validator as one more problem kind, naming the ruling change_target
    value. Applied at mark time only; never at write time.
  - change_target is read as a scalar or a list. code, schema or pipeline rule inspection
    out; an absent or empty change_target fails closed. Only docs, prompt and config allow
    it, so any other value (ui, infrastructure, model, dependency) also rules inspection out.
  - 'The derived kind comes from BO-3500c-2''s derivation (derive_proof_kind, per that record''s
    contract), applied to the record''s declared_files. No second path-to-kind table lives
    here. BO-3500c-2 is draft and unbuilt, so clause 6 cannot be met until it lands (open
    question: wait, or ship clauses 1 to 5 first).'
  - When the declared change_target and the derived kind disagree, the record is reported
    as a defective declaration naming both values, and the derived kind decides.
test_required: true
test_intent:
  - clause: marking done is refused, and the refusal names the change_target value that rules
      inspection out
    needs_test: true
    reason: This refusal is the loophole guard, and without it an inspection could close code
      work.
  - clause: the same record carrying a check verification record that holds may be marked
      done
    needs_test: true
    reason: 'The guard must not over-block: the check method stays open to code records.'
  - clause: writing or changing such a record without marking it done is not refused for this
      reason (BO-2500f-1)
    needs_test: true
    reason: Silence at write time is behaviour, and a write path calling the rule would break
      it.
  - clause: a record whose change_target values are only docs, prompt or config may carry
      an inspection
    needs_test: true
    reason: The allowed set is the other edge of the guard and needs its positive case.
  - clause: a record with no change_target is treated as ruling inspection out, so a missing
      declaration never opens the weaker method
    needs_test: true
    reason: Failing closed on a missing change_target is the case a lenient default gets wrong;
      23 test-free records had none on 2026-10-24.
  - clause: where the kind of the record's deliverable is determined from where its declared
      files sit (BO-3500c-2) and that kind is code, schema or pipeline, a change_target stating
      docs does not lift the refusal, and the disagreement is reported as a defective declaration
      rather than adopted
    needs_test: true
    reason: A self-declared docs target escaping the derived kind is the exact bypass this
      clause closes.
delivers_to: null
expects_from:
  - ac_id: BO-2500f-1
    contract: "The validated verification record whose method this rule restricts."
  - ac_id: BO-3500c-2
    contract: "The derived kind of a deliverable from its declared location; this record adds no second kind vocabulary."
test_spec:
  - name: test_bo_2500f_1_i_inspection_on_code_schema_or_pipeline_target_is_refused_through_the_hook
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "the real check_done_proof.py --mode precommit CLI, as a subprocess"
    description: "Real precommit CLI subprocess with BO-2500f-4's switch turned on through its declared mechanism: a staged done test-free record with a valid inspection record is refused (exit 1) for change_target code, schema and pipeline, as a scalar and inside a list such as [docs, schema]; the message names the ruling value (schema for the list case)."
    proves_clause: "marking done is refused, and the refusal names the change_target value that rules inspection out"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
    convention_test_file: unit_tests/commit_guardian/test_done_proof_test_required_rationale_gate.py
    must_catch:
      - "a rule that reads only a scalar change_target"
      - "a rule that reads only the first list element"
      - "a refusal that does not name the ruling value"
  - name: test_bo_2500f_1_i_check_record_that_holds_may_be_marked_done_on_a_code_record
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: criterion
    description: "With bo-2500f-4's switch turned on through its declared mechanism, a done record with change_target code and a check verification record whose check is tagged and wired exits 0 through the precommit CLI; the refusal is specific to the inspection method."
    proves_clause: "the same record carrying a check verification record that holds may be marked done"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
    convention_test_file: unit_tests/commit_guardian/test_done_proof_test_required_rationale_gate.py
  - name: test_bo_2500f_1_i_writing_such_a_record_without_marking_it_done_is_not_refused
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: criterion
    description: "A staged in_progress record with change_target code and an inspection verification record passes check-ac-schema and the precommit done check (exit 0); no write-time path calls the rule."
    proves_clause: "writing or changing such a record without marking it done is not refused for this reason (BO-2500f-1)"
    code_file: templates/scripts/commit_guardian/check_ac_schema.py
    convention_test_file: unit_tests/commit_guardian/test_check_ac_schema.py
  - name: test_bo_2500f_1_i_docs_prompt_and_config_targets_allow_inspection_and_other_values_do_not
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    description: "Targets docs, prompt, config (scalar, list, mixed among themselves) allow an inspection; ui, infrastructure, model and dependency rule it out, each refusal naming the value."
    proves_clause: "a record whose change_target values are only docs, prompt or config may carry an inspection"
    code_file: scripts/ac_store/_verification_record.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_1_i_absent_or_empty_change_target_rules_inspection_out
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: failure
    description: "A record with no change_target key, change_target null, [] and '' is treated as ruling inspection out; the problem says the declaration is missing."
    proves_clause: "a record with no change_target is treated as ruling inspection out, so a missing declaration never opens the weaker method"
    code_file: scripts/ac_store/_verification_record.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
    must_catch:
      - "a lenient default that allows inspection when change_target is absent"
  - name: test_bo_2500f_1_i_declared_docs_target_does_not_lift_a_derived_code_kind
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: discrimination
    description: "A record declaring change_target docs whose declared_files sit where BO-3500c-2's derive_proof_kind returns code, schema or pipeline is still refused for an inspection, and the output reports a defective declaration naming both 'docs' and the derived kind; the derived kind decides. Depends on BO-3500c-2 (draft, unbuilt), so this test stays red until that lands."
    proves_clause: "where the kind of the record's deliverable is determined from where its declared files sit (BO-3500c-2) and that kind is code, schema or pipeline, a change_target stating docs does not lift the refusal, and the disagreement is reported as a defective declaration rather than adopted"
    code_file: scripts/ac_store/_verification_record.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
    must_catch:
      - "a rule that trusts the self-declared change_target over the derived kind"
      - "a second path-to-kind table kept in this module"
