notes: |
  WHY THIS IS AN L3 UNDER GE-127e-3 AND NOT A FIFTH L2 UNDER GE-127e. GE-127e has
  four L2 children against a cap of five, so a sibling would fit — the constraint is
  not capacity, it is shape. GE-127e-3 already owns "the refusal offers only help
  that actually arrives". This record does not add a new behaviour; it pins WHERE
  that obligation reaches: one hop past the refusal's own text, into the artifact the
  refusal names. That is a technical constraint on an already-specified behaviour,
  which is what the Roman-suffix level is for. Filing it as an L2 would put two
  records in the tree claiming the same promise and let an implementer satisfy
  whichever is cheaper.

  WHAT THIS RECORD DOES NOT CLOSE. GE-127e-3 has three other arms — no future-tense
  promise, "already done" claims checked against the run that produced the refusal,
  and a bare verdict being explicitly compliant. Landing this record does NOT make
  GE-127e-3 done, and its work_status must not be flipped on the strength of this
  fix alone. One instance of a violation removed is not the criterion satisfied.

  THE DEFECT'S SHAPE, WHICH IS THE REASON THE RECORD IS WORTH HAVING. Every hop but
  the last resolved. The guard names a command; the command exists and is deployed;
  the command names a script; the script does not exist. Any check that stopped at
  "does the slash command resolve" reported healthy. The generalisable lesson is that
  a pointer chain is only as good as its last hop, and the only way to know is to
  follow it all the way down — which is what the descriptors do.
