  n_location_rule: "1"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python -m pytest tests/test_live_surface_startup.py -q"
  notes: |
    The orphan-match pattern must be anchored tightly enough that no unrelated process
    is ever selected — a partial command-line resemblance must not be sufficient to
    match. Only PIDs that BOTH match the pattern AND are absent from the registry may be
    killed. Before killing, the scan must verify the PID still refers to a live-surface
    server, guarding against OS PID reuse of a recorded PID. Process inspection and kill
    must follow the project error-handling policy (handle ProcessLookupError /
    permission errors explicitly, no bare or silent excepts).
