assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "all"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Surface: the finalize-feature workflow IS the .js workflow-body
    (templates/workflows-js/finalize-feature.js). Per repo precedent (BP-1000,
    ".js workflow body + Python glue = python-coder"; the finalize-feature agent
    is is_ticket_phase:false so there is no prose surface to split out for the
    workflow-body edit), this is python-coder work, not llm-expert.
    Policy constraints (state WHAT, coder picks HOW):
    - The start-of-step line must be emitted BEFORE the step's work is dispatched
      (ordering is load-bearing for BO-1000a-1-i), not after it returns.
    - Emit through the workflow's existing narration/progress channel so the line
      reaches the live progress view; do not use a side channel that bypasses it.
    - A start-of-step line is mandatory for EVERY non-error step — coverage must
      not depend on a step entering an error/malformed-result branch.
    - Prefer a single shared narration helper invoked at each step's entry over
      per-step ad-hoc strings, so format and the "Step X of N" scheme stay
      uniform (shared with BO-1000a-2's N/counter and BO-1000b-1's outcome line).
    - ADR-001 self-hosting: the template workflow source is the canonical edit;
      re-run build.py so the deployed copy stays in parity. No new config key.
delivers_to: null
