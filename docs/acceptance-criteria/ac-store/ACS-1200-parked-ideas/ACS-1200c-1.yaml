notes: |
  The PO asked for this L1's evidence to be in the NEGATIVE, and this is the
  primary instance: the proof is a decomposed tree with a genuinely missing link
  STILL being blocked after the change, not the parked tree being allowed.

  The before/after comparison against the pre-change implementation is what
  makes "still full-strength" measurable rather than asserted. Without it, a
  weakened check that happens to block this one case would pass.

  The unmarked CHILDLESS tree — a stub minus the marker, which looks identical
  to a parked one — is ACS-1200c-3. This AC deliberately covers the decomposed
  case only.
