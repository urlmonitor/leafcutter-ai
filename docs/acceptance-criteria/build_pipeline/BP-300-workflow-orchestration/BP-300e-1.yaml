title: "Valid JSON object followed by trailing prose is still parsed and the run continues"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: draft
priority: medium
work_status: todo
criteria: |
  Given a /plan-feature run dispatches a helper agent to return a structured result,
  And that agent replies with a complete, valid JSON object immediately followed by
    a trailing explanatory markdown section (for example a "## Anomalies" heading and
    a paragraph of prose after the closing brace),
  When the workflow reads the agent's reply,
  Then the workflow recovers the intended JSON object with all of its fields intact
    and ignores the trailing prose,
  And the run continues to its next stage and produces the requirements it was asked
    for rather than stopping on the extra wording.
