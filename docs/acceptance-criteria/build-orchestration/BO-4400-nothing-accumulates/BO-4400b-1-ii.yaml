criteria: |
  Given a workspace holding nothing unsent whose Python environment outside its folder
    cannot be deleted because one file inside it is read-only to the current user,
  When the workspace is cleared through the one shared clearing door,
  Then the workspace's folder, branch and registration are removed,
  And the answer is not a plain success: it states the clearing was partial and names
    the environment's location and the reason it could not be removed,
  And the bytes still held by the remaining environment are not counted in the
    answer's total space freed,
  And a later clearing request or sweep that finds the same environment removable
    removes it, even though the workspace itself no longer exists.
