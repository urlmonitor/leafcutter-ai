title: "Two requirements created concurrently never receive the same UID"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given the highest assigned stable UID in the store is the integer 41,
  When two separate creation operations each attempt to create a new requirement
    at the same time,
  Then one operation is assigned UID 42 and the other is assigned UID 43,
  And no two requirements in the store ever share the same UID,
  And neither operation observes the other's in-flight allocation as its own.
