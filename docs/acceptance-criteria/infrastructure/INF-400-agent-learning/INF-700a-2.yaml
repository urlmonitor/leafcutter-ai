it_requirements:
  - "THE CLAUSE THIS AC REPLACES, and why it had to be replaced. INF-700a's own L1 criteria say an unwired pipeline 'shows up as a number someone can see'. That was true when the 28 retained records read as a permanent backlog. It stopped being true on 2026-08-26 when INF-700c-1 and INF-700c-2 landed: a textless record is ineligible and is not outstanding, the corpus reports zero, and the run exits 0. The waiting count is now zero for a healthy loop AND for a loop with no caller. The visibility the L1 asks for therefore cannot come from that count and must come from run recency. Do not restore a non-zero backlog to recreate the signal — INF-700c's hard constraint forbids exactly that."
  - "THE GITIGNORE TRAP, and the honest way around it. debugging/logs/ is excluded from version control (.gitignore:60), so any last-run marker written there is absent from a fresh clone and from every consumer install. That does NOT make the marker wrong — 'never run in this tree' is the correct answer for a fresh clone. What is forbidden is reporting that absence as an error, as a zero, or as a run that happened. Do not solve this by committing runtime state into the tracked tree; INF-700c-2 rejected that shape for the same reason."
  - "NON-COLLISION WITH INF-700b-3, whose it_requirements already settle the rules: different inputs (that report reads the capture-attempt ledger; this reads the routing side), different denominators (that counts AGENT RUNS, this counts RECORDS and run timestamps), shared surface allowed but shared number forbidden. This AC adds a third figure to that surface — routing-run recency — and the same three rules apply to it. Never derive any of the three from another."
  - "THE SINK-EXISTENCE CLAUSE IS NOT DECORATIVE. The condition it makes visible is the live one: the reader's default names a file that has never existed, so a run today reports a confident zero over a path with no producer. After INF-400c-4 the same shape is reachable by a misconfiguration. Reporting whether the named sink exists costs one stat call and is the only thing distinguishing a working loop from a loop pointed at nothing."
  - "MUST NOT READ THE HARVESTER'S ROUTING COUNTERS AS A HEALTH SIGNAL, per INF-700b-3's constraint — skipped_unknown and no_learning_text describe the shape of the corpus, not whether the loop is running."
  - "THE ANSWER MUST BE OBTAINABLE FROM A PRODUCTION ENTRY POINT A PERSON CAN RUN, not only from an importable function. INF-700a-3's how-to is required to give the steps to establish whether the routing step has ever completed in the tree the reader is standing in, and a how-to cannot give a step that is an import. A subcommand or flag on the existing harvester CLI is sufficient and preferable to a new script — one more entry point is one more thing the how-to has to get right in two layouts."
  - "THE SINK-EXISTENCE FIELD MUST BE A STAT, NOT AN INFERENCE FROM THE LAST RUN. Reporting the sink as existing because a previous run read it is how a stale figure gets reported as a current one; the criteria ask what is true now. Stat the path at answer time, and report the resolved path alongside the boolean so a reader can tell an unemitted-to sink from a misconfigured one."
  - "THE MARKER MUST NOT BE CREATED BY THE ANSWER. Reading the status must not write, create or touch the last-run marker or its directory — for the same reason INF-400c-4-iv forbids the reader creating the sink. A status query that creates the marker turns the first query into a run that never happened, and never-run then becomes unreachable forever after."
  - "Must handle errors gracefully per the project error handling policy"
delivers_to:
  agent: documentation-expert
  contract: "A routing-side status answer — last completed run and its sink, whether that sink exists, and a distinct never-run case — that INF-700a-4's reference describes and INF-700a-3's how-to tells a reader how to obtain"
