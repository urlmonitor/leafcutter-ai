criteria: |
  Given the user's request describes a behavioral addition or refinement to an
    existing feature that already has an L1 AC in the store,
  When the Haiku triage agent evaluates the request against the AC store,
  Then it classifies the route as "behavioral",
  And the classification signal includes: matching L1 parent found in the AC store,
    request adds scenarios or edge cases to existing behavior rather than new
    capability,
  And the routing decision dispatches to: BA v3 -> IT PO v3
    (skipping PO v3 since the L1 already exists),
  And the routing decision includes the parent L1 AC id for BA v3 to decompose under.
