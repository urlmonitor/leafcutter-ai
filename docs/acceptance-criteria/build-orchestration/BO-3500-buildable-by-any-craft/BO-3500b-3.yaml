notes: |
  THE OBVIOUS IMPLEMENTATION OF A MIXED RUN IS A FIXED CRAFT ORDER — all the code, then
  all the documentation, then all the diagrams — and it is right about eighty per cent
  of the time by accident, which is what makes it worth a criterion. It is wrong exactly
  when a code member depends on something a non-code craft produces, and the third
  scenario is there to fail it.

  WHY THE PAGE ORDERING IS NOT COSMETIC. A page produced before the code it documents
  can only describe the intention, and this repository has an expensive history of
  documentation that describes an intention as though it were the state of the system.
  The observable being claimed is what the page craft was given, not a judgement about
  the prose — that keeps the criterion testable without anybody grading writing.

  THE SECOND SCENARIO — order-independence for unrelated members — is what makes the
  covering tests non-flaky. Without it, any test of a mixed run implicitly asserts one
  particular interleaving and starts failing the moment anything is parallelised.
  Stated as a criterion, it becomes the thing that must hold rather than an accident
  that will not.

  BOUNDARY. This is about order within an accepted group. Whether the group is accepted
  at all is BO-3500b-1; what happens when a member fails is BO-3500b-2. Dependency
  resolution itself already exists and is not being re-specified — what is new is that
  it must survive members being produced by different crafts.
