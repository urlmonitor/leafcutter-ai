id: AR-300c-5-i
title: "Moving sub-agent permissions into each agent's declaration carries the union of every rival record, and says what came from where"
component: agent-registry
components:
  - agent_registry
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the three places that record which sub-agents an agent may dispatch
    today -- the central registry, a header entry already present in four agent
    definitions, and a hand-written sub-agent table in the body of five,
    And two of those disagree -- python-coder's table names test-runner, which
      its registry record does not, and architect-review's registry record
      names architect-review-deep, which its table omits,
  When the permissions are consolidated into each agent's own declaration,
  Then every agent that any of the three gives a permission has a declaration
    afterwards,
    And each agent's declared sub-agents are the union of what the three
      recorded for it, so no permission is dropped -- python-coder ends permitted
      test-runner, and architect-review ends permitted architect-review-deep,
    And no agent is declared a sub-agent that none of the three recorded for
      it, so no permission is invented,
    And the "every ticket-phase agent" entry is carried across as that one
      entry, not replaced by the names it stood for on the day of the move,
    And the consolidation reports every agent by name with the source or
      sources each permitted sub-agent came from, names separately each agent
      whose sources disagreed, and states how many agents each source held,
    And no new empty declaration is written for an agent that none of the
      three gives a permission, while an explicit empty declaration already
      present is left as it is,
  So no permission is silently lost or granted in the move, and the user sees
    the consequence of every disagreement before it takes effect.
depends_on:
