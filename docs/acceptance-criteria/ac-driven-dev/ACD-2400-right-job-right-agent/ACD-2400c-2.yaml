title: "The test design is produced after technical planning and before the approval gate"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the feature-planning workflow has finished the technical planner stage for a batch
    of 4 leaf code requirements,
  When the workflow continues,
  Then the code-aware test-design step runs on those 4 requirements before the final
    approval gate is shown,
  And the approval gate shows each requirement's test design next to its criteria,
  And a requirement the step could not design (for example its declared files could not
    be opened) is shown at the gate as "test design pending" and is not offered for approval,
  And when the step is skipped or fails for the whole batch, none of the 4 is offered for
    approval.
