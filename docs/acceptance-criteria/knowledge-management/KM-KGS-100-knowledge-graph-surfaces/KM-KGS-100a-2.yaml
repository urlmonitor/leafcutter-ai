assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "AC store files are .yaml (not .md), so node extraction for the acs surface must read the YAML files under the surface directory recursively — the existing markdown-only directory ingestion (which globs **/*.md) does not cover the acs surface and must be extended to handle the acs surface's file type"
  - "The node id must be taken from the criterion's id frontmatter field (not the filename stem), so that ids match the KM-EX-NNN form regardless of file name"
  - "Surface ingestion must stay declaration-driven: the acs surface is discovered from the paths.json surfaces map, with no surface name special-cased in a hard-coded branch beyond what is needed to read its file type"
  - "Build must remain stdlib-only with no third-party YAML dependency, consistent with the module's stated stdlib-only architecture, or reuse the existing in-repo frontmatter/AC parsing already used by the AC store tooling"
