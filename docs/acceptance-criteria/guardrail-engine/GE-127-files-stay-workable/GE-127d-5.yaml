it_requirements:
  - >-
    The statement of what a quoted length measures is generated from the shared measure
    (GE-127d-2), so it follows GE-127d-3 without hand edits; the README rule text and the
    file_size._comment do not, and must be rewritten in this change.
  - >-
    The advice may keep telling authors that formatting-only reductions are not the
    remedy and may point at restructuring (GE-127e / GE-127f). It must not recommend
    deleting blank lines; it states that blank lines do not count, so deleting them is not a
    remedy (BrainCandy 2026-10-21).
  - >-
    THE GENERATED STATEMENT IS PROBED PER LANGUAGE (IT PO). The probe set GE-127d-2 built
    (triple-quoted, block comment, hash comment — language-blind) is replaced by probes run
    through the shared measure for EVERY extension in file_size.checked_extensions: each line
    and block comment form the language's lexer declares, and for Python (2026-10-20 rule) a
    docstring, a BARE standalone string statement away from docstring position (mid-module,
    and a trailing module-level block), a string ASSIGNED to a name, a string passed as an
    argument, and a standalone f-string — plus blank-line probes for every extension (a
    whitespace-only line between code lines, and one inside a used multi-line string or
    template literal), each of which must measure as UNCOUNTED. The generated statement must
    say standalone strings are uncounted, used strings (and f-strings) are counted, and blank
    lines are not counted anywhere, only because those probes measured that way; a measure
    that counted a blank line again would change the statement. The statement is
    built from what the measure actually did with each probe, never from a table of what it
    is supposed to do, so a change that made any one style counted again changes the
    statement in the same call (GE-127d-2's seam). The per-file Measures line may use the
    refused file's own language; the published statement covers every checked extension.
  - >-
    THE PARITY GATE GAINS A FOURTH FACT — THE MEASUREMENT RULE — AND FOR THIS FACT SILENCE IS
    A DISAGREEMENT. Extend check_file_size_rule_parity.py; do not add a parallel check. The
    enforced side is the generated statement above. The published side is each configured
    surface's measurement-rule passage, located by a fixed marker and compared WHOLE against
    the generated statement, so a surface carrying the new sentence beside an old one still
    disagrees. Unlike the other three facts (where a surface that makes no claim is not
    compared), a configured surface with no measurement-rule passage is a DISAGREEMENT naming
    that surface, because the criteria require every published place to state the rule. The
    passage on README.md must sit where the gate's anchor-line narrowing can see it. Surfaces
    come from file_size.published_rule_surfaces only; an unreadable one stays INDETERMINATE
    (exit 2); the outcome keeps stating the count of surfaces compared.
  - >-
    THE GATE MUST FIRE WHEN ONLY THE MEASURE CHANGES. Widen the check-file-size-rule-parity
    hooks_manifest entry's `files` trigger to also match _file_size_ratchet.py and every
    module under _file_size_measure/, in both templates/scripts/commit_guardian/ and
    scripts/commit_guardian/, and update that hook's consumer-layout ground entry
    (commit_guardian.json, the second check-file-size-rule-parity entry) so it names the same
    set. A widened `files` regex on an existing hook id is not a hooks_manifest.hooks id
    registration, so package_surface stays false. Rebuild (`python scripts/build.py
    --target-dir .`) so the generated .pre-commit-config.yaml carries it.
  - >-
    THE ADVICE IS REPLACED, NOT APPENDED TO. _HELPS_MARKER, _NO_HELP_MARKER and
    _print_asymmetry_advice's two sentences go; the replacement is shared by both refusal
    printers (FILE TOO LARGE and FILE GREW) as today, states the rule from the generated
    statement, says restyling comments, deleting comments or standalone strings and joining lines are
    not remedies, names no comment style as counted or free, does not recommend deleting blank
    lines, and stays consistent with GE-127d-4's separate-commits remedy. Update every test
    and fixture that references the removed markers (_ge_127d_2_fixture.py) in the same change.
  - >-
    NO AGENT OR SKILL PROSE NEEDS TO CHANGE — CHECKED, SO NO llm-expert COMPANION IS AUTHORED.
    Searched templates/agents/ and templates/skills/ on 2026-10-16 for statements of the size
    rule: python-coder.md (File-Size Limit: states only the limit), restructuring-specialist.md
    ("measured lines", no rule), complexity-reduction (complexity scoring, not file size),
    pr-reviewer.md, precommit-autofix (routing only) — none states which lines count. The only
    surfaces stating the old measurement rule are check_file_size.py's advice, the
    file_size._comment, the code comments in _file_size_ratchet.py, and two known-issue entries
    (KI-CG-20261013 and KI-BO-20260930), which are history, not published rule. If an
    implementer finds prose stating the rule after all, it is routed to llm-expert as a
    follow-up, not edited by python-coder.
  - >-
    The `_comment` change is a nested key under file_size: no new top-level key, no
    config_schema_fragment (the BP-100k-4 fictional-key precedent is not repeated).
  - >-
    Must follow the repo error-handling policy: specific exceptions around surface reads and
    JSON parsing; an unreadable surface is never folded into agreement.
test_spec:
  - name: test_ge_127d_5_the_refusal_advice_states_the_rule_and_names_no_free_comment_style
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Run the hook in a temporary git repository on an over-limit .py file and an
      over-limit .js file, through both refusal paths (crossing and growth), and read the
      advice from the hook's own output: it states that every comment style and standalone
      Python strings (docstrings and bare strings) are uncounted, that used strings count, and
      that blank lines are not counted anywhere, and it contains no statement that one style
      counts or that removing comments or blank lines reduces the length. Then verify the
      advice by behaviour: deleting every comment, every standalone string and every blank
      line from the refused file leaves the quoted length unchanged on the next run.
    must_catch:
      - "the incumbent advice: '#' comments count and removing them WILL reduce it"
      - "advice says block comments do not count but is silent on line comments"
      - "advice still says blank lines count (the 2026-10-16 rule)"
  - name: test_ge_127d_5_the_real_published_surfaces_agree_with_the_rule_in_force
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      Using the shared deployed layout, run the published-versus-enforced comparison over
      the real published surfaces and real configuration: zero disagreements, surfaces
      compared greater than zero, exit 0.
  - name: test_ge_127d_5_a_surface_left_stating_the_old_measurement_rule_refuses_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      In a fixture tree, restore the pre-2026-10-16 MEASUREMENT RULE paragraph to one
      published surface only and run the comparison through its hook entry point: it names
      that surface and the commit does not complete; reverting it returns to clean. Repeat
      with the old sentence ADDED beside the new one, and with the passage deleted from one
      surface: both are disagreements naming that surface.
    must_catch:
      - "comparison checks scope, timing and limits but not the measurement rule"
      - "comparison passes a surface that carries the new sentence beside an old one"
      - "a surface with no measurement passage treated as agreeing"
  - name: test_ge_127d_5_changing_the_measure_alone_changes_the_generated_rule_and_the_gate_reports_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      In a fixture copy, make the in-force measure count one comment form again (e.g. `--` in
      SQL) without touching any surface: the generated statement changes and the comparison
      reports a disagreement on every surface. The check-file-size-rule-parity hook's
      registered `files` trigger, applied as pre-commit applies it (re.search on the staged
      path), selects a staged change to _file_size_ratchet.py and to each module under
      _file_size_measure/.
    must_catch:
      - "statement built from a table of expected behaviour rather than probing the measure"
      - "parity trigger still blind to the measure modules"
test_rationale: |
  The advice test reads the hook's real output and then checks the advice against
  behaviour (deleting comments does not move the number), so wording that names a free
  style fails either way. The surface descriptors evaluate the published side and the
  enforced side together, as GE-127d-1 requires, and the seam descriptor plants the exact
  stale paragraph that is on disk today, plus the two partial-fix shapes (old beside new,
  passage missing). The discrimination descriptor proves the enforced side is read from the
  measure's behaviour and that the gate is actually triggered by a change to the measure
  alone — today it is not.
