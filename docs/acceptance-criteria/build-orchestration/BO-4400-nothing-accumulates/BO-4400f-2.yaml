risk_surface: safety
criteria: |
  Given the project's test-runner settings as shipped,
  When a suite of three tests runs in which two pass and one fails, each writing a
    10 MB scratch file,
  Then after the run no scratch from the two passing tests remains anywhere,
  And the failing test's scratch is retained inside the one designated scratch location
    and its location is printed in the run's failure output,
  And no scratch was written inside the project's durable log folders or anywhere else
    inside the project,
  And given a run started with its scratch base pointed at a folder inside the
    project's durable log folders,
  When the run starts,
  Then it stops before running any test with a message naming the folder as a durable
    location that may not hold scratch.
