id: TQ-300b-1
title: "The package audit and its report formatting are covered by tests"
component: testing-quality
components:
  - testing_quality
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: code
risk_surface: internal
criteria: |
  Given a package layout with a known mix of compliant and non-compliant items,
  When run_audit executes,
  Then it returns audit findings that include every non-compliant item and omits
    items that comply.

  Given an audit item of a known kind (for example a portable item missing from
    the template, or a project-specific item),
  When _classify_item is called on it,
  Then it returns the expected classification category for that item.

  Given a classified audit item,
  When _suggest_action is called on it,
  Then it returns the remediation action that matches that classification.

  Given a set of audit findings,
  When format_markdown renders them,
  Then the output is a Markdown report that lists each finding with its category
    and suggested action, and rendering an empty findings set produces a report
    that explicitly states no package gap was detected.
depends_on:
  - TQ-300b
doc_links:
