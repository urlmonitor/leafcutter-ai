notes: |
  A REFUSAL, NOT A WARNING (AR-400a; user wording "failing the build instead of
  printing noise"). The build's current skill-reference lines are all
  [WARNING]; this AC is the first that makes one of them stop the build.

  PREFER WIRING WHAT EXISTS. The design names an existing, unwired checker
  (KI-BP-007) as the base for this behaviour and asks that it be wired into the
  registry validation the build already runs, rather than a third checker
  being written. That is a preference recorded for the IT PO, not a criterion.

  DISTINCT FAULT KINDS ARE PART OF THE BEHAVIOUR. "Does not exist" and "is not
  granted" ask for opposite fixes (author or remove the reference, versus add
  the grant). A single undifferentiated message re-creates the "nobody can act
  on it" harm this goal removes.

  THE PROJECT-SUPPLIED CASE IS AR-400d's. A grant marked as supplied by the
  project is not "nonexistent" because the package does not ship it; see
  AR-400d-2 for what happens when the project does not have it either.
