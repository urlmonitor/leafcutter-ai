id: BP-1100b-2
title: "Test-writer produces an executing behavioral-replay test for modified workflow JavaScript"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given test-writer is dispatched for a ticket that modifies a function in a .js file
  under scripts/workflows/ (for example commitStageOutput in plan-feature.js),
  When test-writer authors the tests for that function,
  Then at least one test loads the modified function and executes it in a mocked
  context (mocked agent dispatcher and mocked git subprocess),
  And the test asserts the function's runtime outcome — such as the agent type the
  function dispatches, that an unparseable result maps to a failure status rather than
  a success status, and that the staging step uses the required untracked-files flag —
  And no test substitutes a plain text-presence scan of the source file for executing
  the function.
