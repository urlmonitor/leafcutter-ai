notes: |
  A FIFTH deployment-gap axis, and the first that is not about scripts at all.
  Keep it distinct from the four already in this component (see
  memory/feedback_ba_bp1000_source_template_parity.md and
  memory/feedback_itpo_bp900f_tracked_source_axis.md):
    - BP-1000 (a-d): byte-equality of scripts present in BOTH scripts/ and templates/.
    - BP-900b: build preflight, template SCRIPT references vs the deployable manifest.
    - BP-900e: a registered or referenced SCRIPT has a deploy-source copy at all.
    - BP-900f: a deployable SCRIPT's source is tracked in git.
    - THIS (h-4 + g-8-ii): the DATA and CONFIGURATION files a deployed guardrail
      reads. Every one of the four above is expressed in terms of scripts, so a
      configuration JSON is not a dependency as far as any of them can tell.

  The division of labour with BP-900g-8-ii is deliberate and should not be collapsed:
  g-8-ii makes the BUILD refuse to ship an install whose declaring files are not in
  the deploy manifest; this AC proves EMPIRICALLY, in a real install, that they
  arrived. They fail independently — a derived closure can miss a read it cannot see
  statically, and an empirical inspection cannot tell you which manifest entry was
  forgotten.

  The load-bearing clause is the resolution rule, not the presence assertion. An
  inspection that simply checks "does this path exist" will pass in the self-hosted
  workspace for exactly the same reason the original defect was invisible there.
