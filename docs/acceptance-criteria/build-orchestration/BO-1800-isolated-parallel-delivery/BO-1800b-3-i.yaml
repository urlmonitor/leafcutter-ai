criteria: |
  Given the hub `main` protection is configured with bypass disabled,
  When an operator runs an admin-override merge (for example `gh pr merge --admin`)
    on a pull request whose required checks have not passed,
  Then the hub rejects the merge and `main` is unchanged,
  And landing the change still requires the required checks to pass and the merge
    queue to perform the merge.
