title: "What a check covers is measured against what you actually have, not against a list someone maintains"
component: build-pipeline
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Nothing goes unchecked because it was left off a list.

  When a check decides what to examine, it works out its own subject matter by
  looking at what is really there, at the moment it runs. It never takes that
  subject matter from a list a person has to remember to extend, because
  anything missing from such a list is exempted silently and looks, in every
  report, exactly like something that passed.

  Anything that exists but that nothing accounts for is named and the run
  fails. You are protected in the places you actually have, not only in the
  places somebody remembered to write down.
