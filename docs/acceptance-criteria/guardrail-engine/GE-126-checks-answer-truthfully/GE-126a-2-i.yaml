notes: |
  THIS EXISTS BECAUSE THE L1 NAMES IT AS THE MOST LIKELY REGRESSION and asks for it to
  be stated here rather than cross-referenced. Every commit-time invocation of the AC
  check family runs with an empty scope most of the time. A repair to GE-126a-2 that
  treats "no targets" the same as "targets that did not resolve" would fail every such
  commit.

  IT IS AN L3 RATHER THAN AN L2 BECAUSE IT PINS THE NEGATIVE EDGE of GE-126a-2's rule
  rather than adding a behaviour of its own. It is nonetheless mandatory coverage: the
  paired run with a violating record is what stops this criterion being satisfied by a
  check that reports success unconditionally.

  SAME SENTENCE AS GE-120a-4 AND NOT THE SAME RECORD. GE-120a-4 states this boundary
  for the agent-side store validator, which is source-only and exempt from the template
  round-trip. This record states it for the deployed commit-guardian check. Neither
  closes the other and the GE-120 folder must not be edited to link them.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL: it produces no artifact, value or contract that any other record in this
  tree consumes. It is a fence around a value GE-126a-2 introduced, asserting the one
  region where that value must not appear. Nothing downstream can be built on a
  prohibition. DO NOT REFILL — a later pass that reads this null as unenriched and
  invents a consumer would be inventing one.

  AGENT AND SIZE. python-coder, S. The implementation cost is near zero; the whole
  weight of this record is in its four test descriptors, one of which is a real commit
  in a scratch repository.

  WHY THE FOURTH DESCRIPTOR CAPTURES A PRE-CHANGE BASELINE. A regression fence that
  asserts against a hand-written expectation is asserting against the author's belief
  about today's behaviour. Capturing the value from the deployed copy BEFORE the
  GE-126a work lands makes it a measurement. The coder must take that capture first —
  once the change is in, the baseline is unrecoverable without a checkout.

