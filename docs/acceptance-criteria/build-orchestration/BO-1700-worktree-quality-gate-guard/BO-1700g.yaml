title: "A workspace that only looks protected can't slip past the check"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  A configuration that appears healthy but has been quietly truncated, spoofed,
  or left incomplete for some kinds of checks is still caught -- the proof cannot
  be faked.

  You get protection you can trust even against a workspace that has been tampered
  with to look correct: the required checks must genuinely all be present, the
  proof-of-life signal must genuinely come from a real check run, and every kind
  of check that matters is accounted for -- not just the easy ones.
