notes: |
  The route body cannot read files at run time (ADR-030), so the configured ceiling has to reach the
  block at install -- the same path BO-4500b-1's third scenario establishes for placeholders. The
  fourth scenario mirrors BO-4500a-4's step_config_unreadable rule on the caller side: no silent
  built-in 3. Retries are fresh calls the route makes; the step itself never retries (BO-4500a-4).
