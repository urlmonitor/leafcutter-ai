created: 2026-09-07
amended_by:
  - reason: "BA amendment, 2026-10-09, on BrainCandy's 2026-10-08 decision fixing the confirmation mechanism for the INF-700a-5 family (recorded in PR #1071, merged as 235a210b). THE DECISION: a record is never marked routed at write or commit time; before claiming, each run checks whether the record's text is already on origin/main and claims only those; the only accepted failure is a duplicate, never a loss. WHY IT WAS CHOSEN: nothing on fast-lane-ship or quick-fix ever observes its own pull request merge, so the alternatives were 'never confirm' (every later pull request re-carries every learning) or 'confirm at commit' (an abandoned branch leaves a learning lost while marked routed, which INF-700a-5 forbids). WHAT CHANGED IN CRITERIA, and why it had to: the clause 'that record's learning is written to its destination file once and not twice, and the run that did not write it says it did not' contradicted the accepted mechanism — two runs on parallel branches that both stage the same record before either merges both carry it, and if both merge the learning is written twice. That clause is RETRACTED and replaced by: a learning is never lost between concurrent units of work (each run that does not find the text on the base branch writes it, and the record stays unmarked until the text is on the base branch); a duplicate across concurrently unmerged branches is the accepted, bounded failure (at most one copy per branch that staged the record without finding its text on the base branch); once the text is on the base branch no later run writes it again; and concurrent runs sharing the claim store do not both claim the same record. A given-clause now states the confirmation rule itself, a clause requires every degraded path (base branch unfetchable or unresolvable, arbitration unobtainable) to fail toward the duplicate, the bookkeeping clause is re-sited on the claim store, and the reachability clause is re-sited from writes to claims — with arbitration on, two unmerged overlapping runs still write twice, so the arbitration's observable effect is one claim versus two, not one write versus two. The duplicate-versus-loss asymmetry clause is kept and sharpened. TITLE changed to match ('do not route the same learning twice' was the retracted promise). TEST_SPEC: three descriptors asserted the retracted behaviour and were rewritten, each marked AMENDED 2026-10-08 in its description — test_two_overlapping_routing_steps_write_the_same_learning_once (renamed; asserted one copy in the merged tree), test_neither_run_concludes_the_other_has_it (its second assertion required the record not be left eligible after a write), and test_removing_the_arbitration_makes_the_write_once_test_fail (renamed; contrasted two writes against one). The other three descriptors are unchanged. WHAT IS NOT ACCEPTED: a loss — a learning absent from the merged tree while its record is marked routed — in any path, concurrent or degraded; and marking a record routed before its text is on the base branch, whether at write time, at commit time, or on another run's behalf. UNCHANGED: work_status (todo), implemented_by, covered_by, depends_on, delivers_to, expects_from, and every it_requirements line. FLAGGED TO THE IT PO, not edited because it_requirements are the IT PO's: line 2 ('a run with the arbitration disabled to produce two writes') and line 5 ('the mechanism itself is deliberately left open') are now stale against this amendment and the 2026-10-08 decision."
    by: BrainCandy
    at: 2026-10-09
