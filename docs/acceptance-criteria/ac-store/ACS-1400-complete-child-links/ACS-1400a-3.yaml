title: "A check handed nothing does not look like a check that found nothing"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a commit that stages no requirement records at all,
  And a second commit that stages one child record whose structural parent names
    it and one whose structural parent does not,
  When each is checked at the moment it lands,
  Then the first states that it examined no requirement records,
  And the second states how many requirement records it examined and reports the
    one violation it found among them,
  And the two outcomes are told apart from the check's own output without reading
    its exit code.
