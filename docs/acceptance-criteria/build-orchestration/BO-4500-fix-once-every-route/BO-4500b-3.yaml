criteria: |
  Given the COMMIT-ANSWER block's decision is taken with no route and no workflow engine running,
    on a first attempt, with the shipped transient-retry ceiling of 3,
  And it is given, in turn, a commit agent reply whose commit_answer is:
    (a) status committed;
    (b) status refused with reason_code policy_protected_branch;
    (c) status refused with reason_code step_index_locked;
    (d) status hook_failed carrying a handoff that names code-refactoring-specialist;
    (e) status hook_failed with no handoff, reason_code check_failed;
    (f) status nothing_to_commit with reason_code nothing_changed,
  When the decision is taken for each reply,
  Then (a) is continue,
  And (b) is stop, with no further attempt,
  And (c) is retry, offering the identical path list and message file again,
  And (d) is engage code-refactoring-specialist, then re-offer the identical path list and message
    file,
  And (e) and (f) are report,
  And every stop and report decision carries the reply's status, reason_code, reason, hook_name and
    failing_files unchanged.

  Given the COMMIT-ANSWER block's source as the change that adds it is reviewed,
  When each part of it -- reading the reply, the stop and retry rules, and the engage-then-re-offer
    loop -- is traced to where it came from,
  Then the change names, for each part, the existing copy it was taken from (the /commit route's
    engage-then-re-offer loop, the fast lane's halt-on-any-non-ok reading of replies) and the known
    issues that copy was fixed for,
  And no part was taken from a copy that a sibling copy had already fixed and it had not,
  And the regression test of every such known issue exercises the block's decision itself.
