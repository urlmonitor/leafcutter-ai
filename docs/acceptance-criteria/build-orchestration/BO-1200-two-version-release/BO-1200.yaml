criteria: |
  Two clear states: stable prod for real users, dev on main for continuous agent delivery.

  Your product always has two faces. The stable production version is the one
  you show to people, demo to stakeholders, and trust to work. The dev version
  (main) is where agents continuously land completed features. A deliberate
  release process promotes work from dev to prod -- not a timer, not a
  merge-when-green, but a conscious decision backed by the AC lineage that
  proves what shipped and why. Every feature's journey is traceable: AC
  authored, feature built, landed in dev, promoted to prod.
