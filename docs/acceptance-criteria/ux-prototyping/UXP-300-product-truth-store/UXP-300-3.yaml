notes: 'The test writer verified the Python contract suites: 49 tests plus 16 subtests passed. Coverage
  strips metadata from all 26 existing flow identities, separates explicit gaps from checked fields/examples,
  and exercises both CLI reports.


  The user accepted the displayed feature and authorized completing its AC/test coverage and merging after
  green checks. Readiness remains reviewed: BA and IT PO reviewed these newly authored criteria; no separate
  individual-AC user sign-off is claimed. Work status records locally verified implementation. At the local verification recorded on 2026-10-05,
  hosted CI and merge had not yet run. GitHub PR checks and merge status track release completion. This leaf does not claim production retrieval integration or completion
  of its broader parent.'
estimated_complexity: M
change_target:
- code
- schema
risk_surface: contract_boundary
it_requirements:
- Apply the metadata rule to existing and new node identities without a hard-coded legacy bypass. Preserve
  valid empty consumer stores.
- Missing bindings document genuinely undefined proposals; they cannot replace existing implemented wire
  contracts or disable checking of known bindings.
- A source-reviewed schema is a reviewed transcription, not automatic source parity. Illustrative design
  authority must not be upgraded by a schema-valid result.
expects_from:
  ac_id: UXP-300-1
  contract: 'Flow JSON at docs/product-truth/flows/**/*.flow.json: contract_definitions is a map from
    reference label to {schema?: string, model?: string, authority?: runtime|source_reviewed|illustrative_design,
    note?: string}; each node has io_contracts with consumes/produces arrays of {contract: string, fields:
    [{path: JSON-pointer string, types: JSON-type string[], required: boolean, default?: JSON value, applies?:
    string}]}. Optional means absent, not null unless explicitly allowed. Contract labels are not payload
    wrapper keys.'
delivers_to:
  agent: frontend-coder
  contract: 'The same flow JSON carries io_contracts.examples: [{contract: string, mode: full|projection,
    origin: observed|illustrative|reconstructed, label: string, value: JSON value, source?: {path: repository-relative
    string, pointer: JSON-pointer string}}]. Observed requires source. Definition authority/note and node
    missing_bindings [{name: string, direction: consumes|produces|both, reason: string, source: repository-relative
    string}] or a genuine not_applicable string remain distinguishable from checked runtime fields.'
test_spec:
- name: test_existing_flow_id_cannot_bypass_contracts_after_migration
  target_dir: unit_tests/product_truth/
  description: Removing metadata from every existing flow identity fails the canonical rule.
  framework: unittest
  type: integration
  angle: failure
- name: test_undefined_binding_is_counted_and_named_not_claimed_as_checked_wire
  target_dir: unit_tests/product_truth/
  description: Reports enumerate proposed gaps separately from checked fields and examples.
  framework: unittest
  type: integration
  angle: criterion
- name: test_gap_requires_reason_and_existing_bounded_source
  target_dir: unit_tests/product_truth/
  description: Blank reasons and missing or unbounded evidence sources fail.
  framework: unittest
  type: integration
  angle: boundary
- name: test_gap_does_not_disable_known_field_or_example_checks
  target_dir: unit_tests/product_truth/
  description: A proposed gap cannot suppress checks on known fields and examples.
  framework: unittest
  type: integration
  angle: failure
- name: test_source_reviewed_schema_requires_visible_authority_explanation
  target_dir: unit_tests/product_truth/
  description: Source-reviewed authority includes its nonblank visible limitation note.
  framework: unittest
  type: integration
  angle: criterion
- name: test_real_retrieval_needs_wire_cannot_be_replaced_with_a_gap
  target_dir: unit_tests/product_truth/
  description: Known runtime wire contracts cannot be downgraded into design gaps.
  framework: unittest
  type: integration
  angle: failure
- name: test_empty_consumer_store_is_not_reported_as_checked_contracts
  target_dir: unit_tests/product_truth/
  description: An empty installed consumer store remains valid and makes no checked-contract claim.
  framework: unittest
  type: integration
  angle: boundary
- name: test_proposed_binding_gap_is_visible_through_both_real_clis
  target_dir: unit_tests/product_truth/
  description: Both canonical CLI report surfaces expose gap counts and details.
  framework: unittest
  type: integration
  angle: reachability
test_rationale: The all-identity mutation proves migration cannot be undone silently. Explicit gap and
  empty-consumer tests keep honest limitations distinct from a bypass or a claim that production retrieval
  is complete.
test_required: true
declares_side_effect: false
