id: BO-2500f-4-i
components:
  - build_orchestration
  - testing_quality
title: "A verification record that cannot be read or checked never waives the missing test"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given four test-free records with no covering test: one whose verification record
    is not a mapping, one naming a check file that cannot be opened, one listing an
    inspected file whose current content cannot be fingerprinted, and one whose
    approval source cannot be reached,
  When each is evaluated by the shared done rule,
  Then none of the four has its missing test waived, and each is refused,
  And each refusal names the record and what could not be read or reached,
  And a failure to evaluate is reported as such, never as "holds" and never
    silently as "no verification record",
  And the same four records evaluated at the commit-time check and at the CI sweep
    receive the same refusal.
depends_on: [BO-2500f-4]
doc_links:
  - path: docs/architecture/components/phantom-done-prevention.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-076-verification-methods-for-non-test-requirements.md
    relationship: describes
    status: exists
    relevance: 'The decision this record implements: wave 1 (section 1) or wave 2 (section 2)
      of the verification-method rule.'
assigned_agent: python-coder
estimated_complexity: S
declared_files:
  - path: scripts/ac_store/_done_proof_waiver.py
    state: to_be_created
it_requirements:
  - 'Three-valued verdict: holds, does not hold, could not evaluate. ''Could not evaluate''
    refuses exactly as ''does not hold'' does and says what could not be read or reached.
    No exception escapes the shared rule: each is caught at the rule''s boundary, logged at
    WARNING or higher, and turned into a refusal.'
  - 'The four causes map to: verified_by not a mapping (BO-2500f-1''s validator), a check
    file that cannot be opened (BO-2500f-2), an inspected file that cannot be fingerprinted
    (BO-2500f-3), an approval source that cannot be reached (BO-2500f-3-i).'
  - The same verdict object is produced in pre-commit and CI modes; tests assert the CLI's
    exit code and message in both modes.
test_required: true
test_intent:
  - clause: none of the four has its missing test waived, and each is refused
    needs_test: true
    reason: Each of the four unreadable shapes is a fail-open risk, and one case each shows
      that none waives.
  - clause: each refusal names the record and what could not be read or reached
    needs_test: true
    reason: The refusal must name the record and the cause, or the four failures look identical
      to the reader.
  - clause: a failure to evaluate is reported as such, never as "holds" and never silently
      as "no verification record"
    needs_test: true
    reason: Collapsing 'could not evaluate' into 'holds' or 'no verification record' is the
      fail-open bug this record names.
  - clause: the same four records evaluated at the commit-time check and at the CI sweep receive
      the same refusal
    needs_test: true
    reason: Both layers share the rule, and running the four records through both CLI modes
      shows they agree.
delivers_to: null
expects_from:
  - ac_id: BO-2500f-4
    contract: "The shared done rule whose failure path this record bounds."
test_spec:
  - name: test_bo_2500f_4_i_none_of_the_four_unreadable_shapes_waives_the_missing_test
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: "the real check_done_proof.py --mode precommit CLI, as a subprocess"
    description: "Real precommit CLI subprocess with BO-2500f-4's switch turned on through its declared mechanism: a verified_by that is not a mapping, a check naming a file that cannot be opened, an inspected file that cannot be fingerprinted (a directory, a path outside the repo) and an approval source that cannot be reached (an approval path that is a directory) each exit 1."
    proves_clause: "none of the four has its missing test waived, and each is refused"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
    convention_test_file: unit_tests/commit_guardian/test_done_proof_test_required_rationale_gate.py
    must_catch:
      - "a rule that catches the exception and treats it as waived"
      - "a rule that lets the exception escape so the hook skips"
      - "a rule that treats the unreadable record as no verification record"
  - name: test_bo_2500f_4_i_each_refusal_names_the_record_and_what_could_not_be_read
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "The four refusals each print the record id and the specific thing that could not be read or reached (the verified_by value, the check path, the inspected path, the approval file), so no two read alike."
    proves_clause: "each refusal names the record and what could not be read or reached"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
    convention_test_file: unit_tests/commit_guardian/test_done_proof_test_required_rationale_gate.py
  - name: test_bo_2500f_4_i_failure_to_evaluate_is_reported_as_could_not_evaluate
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    description: "The verdict object for each of the four is 'could not evaluate' with the cause; it is never holds and never the text for a record with no verification record; the exception is logged at WARNING or higher."
    proves_clause: "a failure to evaluate is reported as such, never as \"holds\" and never silently as \"no verification record\""
    code_file: scripts/ac_store/_done_proof_waiver.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_4_i_the_same_four_records_get_the_same_refusal_at_precommit_and_ci
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "check_done_proof.py --mode precommit and --mode ci, each as a subprocess"
    description: "The same four committed fixtures run through check_done_proof.py --mode precommit and --mode ci as subprocesses give the same exit code and the same refusal message per record."
    proves_clause: "the same four records evaluated at the commit-time check and at the CI sweep receive the same refusal"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
    convention_test_file: unit_tests/commit_guardian/test_done_proof_test_required_rationale_gate.py
