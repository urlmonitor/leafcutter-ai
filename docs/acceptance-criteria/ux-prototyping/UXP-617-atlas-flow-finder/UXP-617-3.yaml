notes: |
  Derived from flow leafcutter/explore-flows-in-atlas v6, step 'actorBadge'. Owner decision
  (2026-10-12): Jev is its own actor value. This L2 also hosts the other flow-page quick wins
  of UXP-617 as L3 children (keyboard drawer access, tab titles, AC chip links). They are flow
  steps and branches, not edge cases of the badge; they sit here because UXP-617 has five L2
  slots, two of which its documentation triggers take, and the folder holds at most 15 files.
  Open: the flow contract allows a step's actorKind to be null; the dataset assumes every node
  has one. What a card with no stored actor shows is not specified.

  IT-PO 2026-10-14: Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx vitest run` (180 s timeout). Known gap: the build pipeline's red-baseline and done-proof checks cannot read vitest tests yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was. No Playwright: the harness is deferred by the owner. Expected numbers come from replaying the leafcutter/atlas-flows v4 records against the frozen finder-index fixture (leafcutter-web/fixtures/flow-finder/), never from pinning counts against the live store.
