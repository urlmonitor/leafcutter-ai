it_requirements:
  - "The referential-integrity check must be wired into the pre-commit hook framework so it fires when a commit_guardian.json registry file is staged."
  - "The build path (build.py / scripts/build_phases.py) that regenerates the deployed registry must surface a failure rather than emitting a deployed-only or dangling registry entry."
  - "Exit 0 (fail-open) on unexpected errors; exit 1 only on a detected dangling or deployed-only entry."
