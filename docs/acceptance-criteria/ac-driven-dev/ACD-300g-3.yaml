id: ACD-300g-3
components:
  - ac_driven_dev
readiness: approved
priority: medium
title: "The commit message identifies the workflow run, stage, and AC IDs produced"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the /plan-feature workflow creates a commit after a stage approval,
  When the commit is recorded in git history,
  Then the commit message first line contains: the text "plan-feature",
    the stage name (one of "PO", "BA", "IT-PO", "TEST-DESIGN-HANDBACK" for the test
    design committed before a hand-back round, or "TEST-DESIGN" for the final commit),
    and the target component name,
  And the commit message body lists every AC ID included in the commit
    (e.g. "ACD-300g, ACD-300g-1, ACD-300g-2"),
  And the commit message body states whether this is a mid-pipeline commit
    or the final commit of the run,
  And a reviewer reading only the git log can determine which /plan-feature stage
    produced each committed AC file without opening the files.
depends_on: [ACD-300g]
