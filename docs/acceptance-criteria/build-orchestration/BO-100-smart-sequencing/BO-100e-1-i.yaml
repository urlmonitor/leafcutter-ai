id: BO-100e-1-i
title: "A prerequisite that did not finish successfully never makes the work behind it eligible"
component: build-orchestration
components:
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a chain in which piece B's only prerequisite is piece A,
    And in the first case A is attempted and ends unsuccessfully,
    And in the second case A is attempted and ends without any outcome being
      recorded for it at all,
    And in the third case A is attempted and finishes successfully,
  When the run decides again which work is eligible,
  Then in the first case B is not eligible and is not begun,
    And in the second case B is not eligible and is not begun, because an outcome
      the run does not hold is not a successful one,
    And in the third case B is eligible and is begun,
    And in the first two cases the run states that B was withheld and names A as
      the prerequisite that was not satisfied,
  So the re-decision cannot turn "this piece stopped being in progress" into "this
    piece is finished".
