assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - >-
    THE TOKEN IS FIXED AND MUST BE SPELLED VERBATIM IN BOTH WRITING SURFACES.
    Use `falsifiability_answer` as the completion_manifest key, written
    identically in templates/agents/test-writer.md and in a new section of
    templates/skills/signoff/SKILL.md alongside §2b.2. Verified during
    enrichment: `falsifiability_answer` has zero occurrences anywhere on
    origin/main, so nothing validates its spelling until TQ-500b-1's reader
    exists — a divergence between the two templates would be silent.
  - >-
    THIS IS A SECOND KEY ON AN EXISTING READING, NOT A SECOND RECORD. BP-1100g-5
    (PR #626) defines the first key on this surface, `cross_layer_seam_answer`,
    in the same completion_manifest block. Add `falsifiability_answer` beside
    it. Do not introduce a second manifest, a sidecar file, or a prose block.
  - >-
    MIRROR THE BP-1100g-5 SHAPE DELIBERATELY AND SAY SO. The two conforming
    shapes are nested objects on the §2b.2 model —
    {result: red_baseline, objecting_tests: [...]} and
    {result: substitute, alteration, per_test_outcomes: [...]}. What keeps this
    key clear of the §2b Bare-False Rule's auto-retry is the nested-object
    STRUCTURE, not the enum string. Spell the outcome as a named result value,
    never as a bare boolean.
  - >-
    THE `not_applicable` SPELLING IS LOAD-BEARING AND UNGUARDED. If this key
    reuses the not-applicable outcome that BP-1100g-5 introduced, note that
    `not_applicable` is a brand-new enum value in the completion_manifest
    context with no other occurrence under templates/ or scripts/ (the only
    matches on main are an unrelated boolean in
    config/verification_flow.schema.json). BP-1100g-5-i is the only thing that
    will ever validate its spelling. A typo here is undetectable until that
    reader lands, so keep the spelling byte-identical to §2b.2's.
  - >-
    ONE ENTRY PER WORK ITEM, NEVER PER RUN. The template must instruct the
    writer to derive each work item's answer from that work item's own work, and
    must forbid copying a sibling's answer forward within one run — the same
    instruction PR #626 added for the seam key, for the same reason
    (BO-1000b-1-i shipped a double-recording defect on exactly this shape).
  - >-
    THE SECOND THEN CLAUSE MUST APPEAR AS AN EXPLICIT PROHIBITION IN THE
    TEMPLATE TEXT, not merely as an omission. State that the writer declares the
    kind and that nothing downstream may derive it from the requirement's
    wording, its expected-outcome shape, or its notes. An omission reads as an
    oversight to the next author and gets "helpfully" filled in.
  - >-
    Must not state or imply that an immediate pass is itself an answer — that
    exit is closed by TQ-500d-1 and reopening it here would contradict a sibling
    in the same tree.
  - >-
    Must not add any obligation to work that captured an ordinary red baseline
    beyond stating the answer it already has. TQ-500d-3 is the observable form
    of this constraint; a template that asks all work for a substitute fails
    there.
delivers_to:
  - agent: python-coder
    ac_id: TQ-500b-1
    contract: >-
      One falsifiability answer per piece of work, riding the existing hand-off
      record under a single fixed token, in one of two conforming shapes: ordinary
      before-and-after evidence naming the objecting tests, or substitute evidence
      naming the alteration and the per-test outcomes under it. Absent and
      duplicated are the non-conforming states TQ-500b-1 reads for. The reader must
      not need to inspect any requirement text to tell the two shapes apart.
expects_from: null
test_required: false
test_rationale: |
  Genuinely test-free at this AC's boundary, on the BP-1100g-5 precedent. Every
  Then clause here describes what a WRITER must state in a template; the
  deliverable is template prose in templates/agents/test-writer.md and
  templates/skills/signoff/SKILL.md. A test asserting that an instruction is
  present in a template is exactly the source-presence proof the anti-grep
  constraint forbids — it passes on an implementation that never records
  anything. The falsifiable half of this AC is TQ-500a-1-i, which asserts over
  the records a run actually emitted, and it carries the test contract.
