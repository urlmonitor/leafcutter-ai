it_requirements:
  - "A .py path is NOT a qualifying implementation file when its basename matches test_*.py or *_test.py, or when it is under a tickets/ directory. These are excluded by the same classification helper used in TKT-500f-6."
  - "Exclusion of test and tickets-path .py files must not exclude a genuine implementation .py present in the same files_touched list — classification is per-entry, and any single qualifying implementation entry triggers the section."
