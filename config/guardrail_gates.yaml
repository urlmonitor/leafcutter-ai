# ---------------------------------------------------------------------------
# flow_change_gates
#
# Identifies (change_target, risk_surface) pairs that are "flow-change" — i.e.
# structural or pipeline-modifying changes that require design review and
# documentation planning BEFORE any coder runs.
#
# For these pairs, the mandatory_agents list is UNIONED into the computed agent
# map on top of the per-surface gate list.
#
# risk_surface values MUST be from the ADR-017 blast-radius vocabulary:
#   internal, contract_boundary, auth, privacy, safety, cost
#
# Migration note (ticket 08): legacy labels 'production' → 'contract_boundary'
# and 'all' → 'safety'. 'contract_boundary' captures the highest-scrutiny
# boundary-crossing scenario; 'safety' captures the cross-all-surfaces catch-all.
#
# mandatory_agents: agents that must appear in the computed agents map for this
#   pair (deduplication against the per-surface gate list is the caller's
#   responsibility).
# phase_constraint: human-readable note on the ordering requirement (enforced
#   by ticket-supervisor's canonical phase ordering, not by this YAML alone).
# ---------------------------------------------------------------------------

flow_change_gates:
  - change_target: code
    risk_surface: contract_boundary
    mandatory_agents:
      - architect-review
      - documentation-expert
      - python-coder
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before python-coder (priority 6) and
      sql-coder (priority 7).

  - change_target: code
    risk_surface: safety
    mandatory_agents:
      - architect-review
      - documentation-expert
      - python-coder
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before python-coder (priority 6) and
      sql-coder (priority 7).

  - change_target: schema
    risk_surface: contract_boundary
    mandatory_agents:
      - architect-review
      - documentation-expert
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before sql-coder (priority 7).

  - change_target: schema
    risk_surface: safety
    mandatory_agents:
      - architect-review
      - documentation-expert
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before sql-coder (priority 7).

  - change_target: config
    risk_surface: contract_boundary
    mandatory_agents:
      - status-checker
      - pr-reviewer
    phase_constraint: >
      status-checker must verify boundary impact before
      config changes are merged; pr-reviewer gates the merge.

# ---------------------------------------------------------------------------
# documentation_gates
#
# Declarative policy that controls when documentation-expert is required based
# on the AC's change_target(s).  Consumed by
# generate_ticket_from_ac.py::_build_agents_map — the generator reads
# change_target_triggers at call-time and adds documentation-expert to the
# agents map as 'needed' when any change_target intersects the trigger list.
#
# Adding or removing a value here is a configuration edit only — no generator
# code change is required (BO-2200a-1).
#
# change_target_triggers: ADR-017 change_target values that mandate
#   documentation-expert regardless of risk_surface.  Each value in this list
#   independently triggers the requirement.
#
# risk_surface_triggers: ADR-017 risk_surface values reserved for future use
#   (a risk-surface–driven documentation gate layered on top of the
#   change-target gate; not yet read by the generator).
# ---------------------------------------------------------------------------

documentation_gates:
  change_target_triggers:
    - ui
    - schema
    - pipeline
    - docs
  risk_surface_triggers:
    - contract_boundary
    - safety
    - auth
    - privacy
