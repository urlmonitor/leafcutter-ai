criteria: |
  Given a ticket is being driven and every delivery attempt in it is accepted — no
    standard refuses anything,
  When the run completes,
  Then no restructuring specialist appears anywhere in the ordered record of
    parties the run engaged,
  And the parties engaged and the order they were engaged in are the same as they
    are for that same ticket before this capability exists,
  And on account of this capability the run reads no file, engages no party and
    runs no standard that it would not have run before this capability existed —
    the only additional work it may do on a delivery that is not refused is none,
  And given the same accepted run measured before and after this capability
    exists,
  When the two durations are compared,
  Then the run is not measurably slower than it was.
