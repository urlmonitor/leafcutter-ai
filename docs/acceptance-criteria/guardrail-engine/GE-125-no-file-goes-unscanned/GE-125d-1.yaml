    angle: deployed
    description: "After `python scripts/build.py --target-dir .`, the deployed scripts/commit_guardian/check_secrets.py produces the same notice on the same stream as the canonical templates/ copy, so a template-only or deployed-only edit cannot pass"
test_rationale: "The claim is that a notice reaches a person, and this component already ships a guard documented as dispatching a specialist that never does — so a test asserting the message string exists in the source would reproduce the exact anti-precedent the AC's notes cite. Every entry therefore runs the check as a subprocess on the path a real commit takes, over real files staged in a throwaway git repository, and captures the two streams SEPARATELY: a merged capture cannot distinguish a correct notice from one that corrupted the findings report, which is GE-125d-1-i's subject. The never-echo entry is asserted NEGATIVELY, by embedding a distinctive marker inside each withheld value and requiring its absence from both streams, following GE-123d-5's established shape — an assertion that the notice text looks right still passes when the value has been printed alongside it, so it cannot prove a value is absent. Credential-shaped fixture content is assembled at runtime from fragments, as unit_tests/commit_guardian/test_scan_secrets_suppression.py does, so the fixture file written into the throwaway repository is byte-identical to real content while no rule fires on the test source itself. The reduced-only entry exists because main() returns 0 today before emitting anything on exactly that path, so it is the entry that fails an implementation which hangs the notice off the findings-printing block. The deployed entry exists because the file ships through build.py and check_hook_parity enforces four copies."
