notes: |
  TQ-200d SUGGESTED SPLIT, ITEM 2 (sql-test-writer).

  THE NON-OBVIOUS WORDING CHOICE. The PO's suggested row was "every answer
  labelled reasoned, none claiming an observed run" — true only while the
  database writer does not run its tests (TQ-500f-4-i). TQ-500g-2 makes it run
  them, and the row would then fail a correct agent. The row is therefore keyed
  to evidence ("observed only where a quoted run backs it"), which holds before
  and after TQ-500g-2. The trap row keeps the strict form, because with no test
  database there can be no run.

  NEGATIVE CASE (TQ-200a-4): "no test database".

  LOCAL ONLY (user decision at the PO gate): see TQ-200d-1 notes; path to CI is
  TQ-200b-2.

  PLACEHOLDER ADDRESSES ONLY in any row input:
  postgresql://<user>:<password>@<host>:<port>/<database> (INF-1100d-4).

  IT-PO ENRICHMENT (2026-09-28)
  Lane: fast lane, after TQ-200d-1 (shared scoring type). Not a depends_on,
  so either order builds, but TQ-200d-1 first avoids two authors of the
  scoring type.
