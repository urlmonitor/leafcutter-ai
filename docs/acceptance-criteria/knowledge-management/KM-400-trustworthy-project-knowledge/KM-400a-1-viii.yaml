notes: |
  Retrospective type-specific refinement of KM-400a-3-i. Four phase fields are
  required by the reviewed schema and three are optional; listing all seven does
  not make optional fields mandatory. Authored root update text remains text.
  The reader receipt includes actual roadmap parity and mutations for invented
  defaults, lost extensions and root-context conflation. IT PO review and criterion-specific test links are recorded; no source roadmap
  change is authorized by this refinement.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Roadmap context is separately attributed and must not overwrite phase-owned values or select a phase status on
  the caller's behalf.
- Source/phase shape validation and duplicate identity detection remain explicit; configured paths cannot escape
  the selected source snapshot.
