notes: |
  THIS IS ONE OF THE TWO AXES OF THE GRID AND IT IS ANSWERED BY WALKING THE OWNERSHIP
  RECORD. INF-1200d is the other axis and is answered by walking the standards
  declaration. Merged, an implementer satisfies whichever is cheaper — which is exactly
  how the project arrived at a grid with one cell filled.

  THE MOVEMENT ARM IS THE ONLY ONE WITH TEETH AND IT IS NOT NEGOTIABLE. "Every
  specialist that owns a covered kind of file is told" is satisfied on any single run
  by a list of today's three specialists written by hand. Such a list is correct on the
  day it is written, survives review, and rots silently. The before-and-after pair is
  the only observation that can fail on it, and the pass condition is that the standard
  LEFT the previous owner as well as arriving at the new one — an audience that only
  ever grows is a broadcast, not a derivation.

  THE EXCLUSION ARM IS WHAT MAKES "REACH" MEAN ANYTHING. Every positive clause in this
  record, and in INF-1200a-1 and INF-1200d-1, is satisfied by giving every specialist
  every standard. That implementation is trivial, it is defensible in a review ("more
  information cannot hurt"), and it silently empties INF-1200e's report of all content
  because nobody is ever uninformed. Stating the exclusion here rather than only in e
  means the delivery is wrong at source rather than merely unreportable.

  THE LAST ARM NAMES THE CHEAP SUBSTITUTES EXPLICITLY BECAUSE THEY ARE THE ONES THAT
  LOOK LIKE DERIVATION. Selecting the audience by matching a specialist's name against
  a technology, or by a category field, or by "the coder agents", produces an audience
  that varies plausibly and is not read from ownership at all — and it passes the
  movement arm in the narrow case where the reassignment happens to align with the
  naming. Reassign between two specialists whose names do not signal the kind of file
  in question, and the substitute is exposed.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: select the audience for each standard from a fixed enumeration of
  specialists compiled when the delivery was built, rather than from the ownership
  record as it stands at the moment of dispatch. Under that injection:
    - the first arm must STAY GREEN, because a list compiled today is correct today;
    - the movement arm must go RED in BOTH of its halves — the standards do not arrive
      at the new owner, and they do not leave the old one;
    - the exclusion arm must STAY GREEN, because a specialist absent from the fixed
      list is still told nothing.
  All three outcomes must be observed together and all must revert. The two green
  outcomes are load-bearing: a mutation that reddened everything would mean the arms
  are not independent, and it is the movement arm alone that carries this record.

  MEASURED BY GREP OVER EVERY SPECIALIST TEMPLATE, 2026-09-09. Exactly one specialist
  mentions a standard anywhere in its instructions. The ownership record assigns kinds
  of file to two further specialists — one covering database work, one covering
  interface work — and neither is told any standard at all, including for a kind of
  file that already carries a distinct configured limit. The user's own example falls
  to the interface specialist, which is the one told nothing. Those pairings are the
  positive control INF-1200e-1 also relies on.

  DELIBERATELY NOT NAMED IN THE CRITERIA: any specialist and any kind of file.
  Following GE-127c's precedent, this record survives a specialist being added, renamed
  or split. A test that enumerates today's three specialists has re-created the
  fixed-list implementation inside the test suite and will pass after the mutation is
  applied.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The
  mutation above, including which arms must stay green, is written to be turned
  directly into test descriptors.
