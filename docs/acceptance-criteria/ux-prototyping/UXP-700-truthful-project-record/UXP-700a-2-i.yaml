test_rationale: |
  An absent map and an empty map are indistinguishable to a test that only checks truthiness of
  the lookup result. The test must assert the key is present and its value is empty, which is
  what stops a consumer crashing on a lookup during a project's first week.
test_spec:
  - name: test_zero_artifact_index_has_every_derived_lookup_present_and_empty
    target_dir: unit_tests/product_truth/
    description: "Each of the four derived lookups is a present key whose value is an empty collection."
    type: unit
    angle: boundary
    framework: unittest
notes: |
  The four lookups are index.json by_component, by_entity, by_flow and by_ac. Named here rather
  than in criteria so the criterion survives a rename of the index fields.
