id: BO-2900b-3
components:
  - build_orchestration
  - build_pipeline
title: "Only an actual invocation counts as a caller — a capability's name in text does not"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an automation script that runs the command surface with the capability
    `mark-done` and its arguments,
    And that same script contains the text `claim` in a comment, in a message it
      prints to the operator, and in the name of one of its own local variables,
    And it never runs the command surface with the capability `claim`,
  When the invocations that automation makes are collected,
  Then `mark-done` is collected as an invocation,
    And `claim` is not collected as an invocation,
    And the collected set is unchanged when the comment, the printed message and the
      local variable are renamed,
    And, in consequence, a registered `claim` capability is reported as having nothing
      that runs it.
