id: GE-117b-1-i
readiness: draft
priority: medium
title: "A private symbol is never required to declare an AC, and __all__ overrides the underscore rule"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117b.yaml"
criteria: |
  Given a function named "_helper" is new or changed in the staged commit
  And the module does not define __all__
  And the docstring of "_helper" references no acceptance criterion
  When the declaration check evaluates the symbol
  Then the check produces no missing-declaration verdict for "_helper"

  Given a module defines __all__ that does NOT list the public-named function
    "widget"
  And "widget" is new or changed in the staged commit
  And the docstring of "widget" references no acceptance criterion
  When the declaration check evaluates the symbol
  Then the check treats "widget" as not public
  And produces no missing-declaration verdict for "widget"

  Given a module defines __all__ that lists a function named "_public_api" whose
    name starts with an underscore
  And "_public_api" is new or changed in the staged commit
  And the docstring of "_public_api" references no acceptance criterion
  When the declaration check evaluates the symbol
  Then the check treats "_public_api" as public
  And produces a missing-declaration verdict naming "_public_api"
depends_on:
  - GE-117b-1
