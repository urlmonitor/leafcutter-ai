id: BP-1300e-1-v
components:
  - precommit_hooks
  - commit_guardian
  - build_pipeline
title: "A linter whose version differs from the one CI installs refuses the commit, naming both versions — a verdict from a different linter is never shown as passed"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Background:
    Given the version of the linter CI's required lint check installs is declared
      exactly, as the single version string "0.15.15",
    And "differs" means the two version strings are not identical, character for
      character — no range, no "same minor version", no "newer is fine".

  Scenario: A different linter version refuses a clean commit
    Given the linter available to the commit-time check reports version "0.15.14",
    And a staged change to an in-scope Python file that carries no violation,
    When the commit is attempted,
    Then the commit is refused,
    And the refusal states that the local linter version "0.15.14" differs from
      the version CI uses, "0.15.15",
    And the refusal gives an instruction that installs exactly version "0.15.15",
    And no output of the commit presents the lint check as passed.

  Scenario: Findings reached under a different version are not presented as CI's verdict
    Given the linter available to the commit-time check reports version "0.15.14",
    And a staged in-scope file that introduces rule E741 at line 12,
    When the commit is attempted,
    Then the commit is refused for the version mismatch, naming both versions,
    And the output does not present any finding as the verdict CI's required
      check would reach.

  Scenario: A newer patch version is refused just as an older one is
    Given the linter available to the commit-time check reports version "0.15.16",
    And a staged change to a clean in-scope Python file,
    When the commit is attempted,
    Then the commit is refused, naming "0.15.16" and "0.15.15".

  Scenario: The matching version is judged normally
    Given the linter available to the commit-time check reports version "0.15.15",
    And a staged change to a clean in-scope Python file,
    When the commit is attempted,
    Then the commit completes,
    And the output names "0.15.15" as the linter version used.

  Scenario: The required version is the version CI installs, by construction
    Given the one place CI's lint check reads its linter version from is changed
      from "0.15.15" to "0.15.16", and nothing else is changed,
    When a commit carrying a clean staged in-scope file is attempted with a local
      linter reporting "0.15.15",
    Then the commit is refused, naming "0.15.15" as local and "0.15.16" as CI's,
    And with a local linter reporting "0.15.16" the same commit completes,
    And no second copy of the version needed editing for either result.

  Scenario: Nothing in scope completes whatever the linter version
    Given the linter available to the commit-time check reports version "0.15.14",
    And a staged change that touches no in-scope Python file,
    When the commit is attempted,
    Then the commit completes,
    And the check reports that it had nothing to inspect,
    And it neither refuses for the version nor states that it inspected files.

  Scenario: An adopter's own version declaration governs
    Given an installed project whose own dependency declaration pins the linter
      exactly at "0.14.2",
    And the linter available to the commit-time check reports "0.15.15",
    When a commit carrying a staged in-scope file is attempted,
    Then the commit is refused, naming "0.15.15" as local and "0.14.2" as the
      project's declared version,
    And this package's own pinned version plays no part in the decision.

  Scenario: An adopter who declares no exact version is told no version check applies
    Given an installed project that declares no exact version for the linter
      (no declaration at all, or only a range such as ">=0.15"),
    And the linter available to the commit-time check reports "0.15.15",
    When a commit carrying a clean staged in-scope file is attempted,
    Then the commit completes,
    And the output states explicitly that no exact linter version is declared for
      the project, so no version check was applied,
    And the output names "0.15.15" as the linter version used.
