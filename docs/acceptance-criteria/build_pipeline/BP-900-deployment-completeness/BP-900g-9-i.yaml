criteria: |
  Given the fail-closed deploy loop of BP-900g-9,
  And a declaration in which three separate entries name source files that cannot be
    found,
  When the build runs,
  Then the single failure names all three, in one report, so one build yields the
    whole remediation set,
  And the build's exit is non-zero exactly once — the run does not report success at
    any point before exiting, so no caller reading only the final status can conclude
    the deploy completed,
  And given the same run, the target directory is left in a state an author can
    recognise as failed: it does not contain a subset of the declared files presented
    as if it were the complete deploy,
  And given a declaration in which every entry resolves, the build completes with a
    zero exit and the target contains every declared file, so making the loop
    fail-closed does not make an unrelated correct build red,
  And these shapes are exercised through the build's real entry point as a subprocess
    with an inspection of the resulting target directory — asserting on the log text
    the loop emits does not satisfy this criterion, because the defect being replaced
    is precisely a run that logged the truth and exited zero,
  Because a guard that halts at the first missing entry turns a set of N stale
    declarations into N build-fix-build cycles in which every intermediate build is
    green, and an author who stops at the first green has shipped the remaining N-1.
