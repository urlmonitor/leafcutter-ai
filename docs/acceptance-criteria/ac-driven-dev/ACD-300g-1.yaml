  - "Must handle errors from the git commit operation gracefully per the project error handling policy"
  - "Must be idempotent -- re-running the workflow after a successful commit must not re-commit already-committed files"
  - "Must log each commit operation to the telemetry sink per the existing workflow telemetry convention"
