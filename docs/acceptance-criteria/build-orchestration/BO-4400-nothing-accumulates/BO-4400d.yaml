criteria: |
  A routine sweep reclaims finished leftovers and tells you what it freed.

  On a regular rhythm, finished workspaces and expired temporary files that piled up
  are reclaimed automatically; you can preview what would go first, and every sweep
  reports how many items it cleared and how much space it gave back.
