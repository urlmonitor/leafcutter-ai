  contract: "The fact that one sink is shared by every unit of work in an install, that concurrent completions are arbitrated, and which of the two failure shapes the arbitration is chosen to prefer — which INF-700a-4's reference must state, because a reader who sees an occasional duplicated learning needs to know it is the designed outcome rather than a defect"
expects_from:
