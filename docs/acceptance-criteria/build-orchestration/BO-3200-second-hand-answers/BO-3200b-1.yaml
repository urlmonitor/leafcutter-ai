id: BO-3200b-1
title: "A run that stops after claiming work releases the claim in the store that outlives it, from every failure point"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run that has claimed work in a store that outlives the run,
    And the run then stops because a later step failed,
    And an environment in which no party can be asked to judge anything -- the only party that
    can be dispatched is one chartered to carry out an exact command and return its output
    verbatim, whose charter admits every exact command so it has no grounds to decline one, and
    which treats whatever it receives as a literal command and so gives no answer to a request
    to look, decide, interpret or summarise; every dispatch to any other party fails
    immediately,
  When the run ends,
  Then every item it claimed is back in its unclaimed state in that same store,
    And every dispatch made while releasing the claim went to that chartered party and carried
    an exact command, and none was addressed to any other party.

  Given that ended run,
  When a new run selects work from that store,
  Then it is able to claim the same items, so the failed run did not make its own target
    unbuildable.

  Given a run driven separately to each distinct point at which it can stop after the claim,
  When it ends at each of those points in turn,
  Then every item it claimed is back in its unclaimed state after each one.
