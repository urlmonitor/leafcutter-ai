    where retention and capacity now live. It was authored as KM-400e-7 and is renamed
    to KM-400f-4 because parentage in this store is derived from the id string. The
    rename is safe only because the id was one day old and referenced nowhere outside
    this file and its parents — no test covers tag, no ticket, no implemented_by entry.
    Criteria, test_spec, test_rationale and must_catch are unchanged; the id, parent,
    depends_on, the references in doc_links and the delivers_to/expects_from contracts,
    the covers tags and the approval fields were updated, and two notes paragraphs were
    corrected because they asserted a placement rationale that the split made untrue
    (sweep mode sitting under KM-400e rather than KM-400b, and the documentation clause
    being folded in to avoid pushing KM-400e past its child cap). The doc_link to
    KM-400e-5 is retained deliberately: this AC still extends that existing status
    operation rather than adding a parallel one. readiness moved to approved and
    priority to high at the user's approval gate."
