test_rationale: >-
  The defect is a route recomputed against a store the run itself has changed, so each
  test drives the real workflow code through the engine harness with stubbed agent()
  replies rather than grepping the template. The final-gate case reproduces the observed
  run and proves the answer is applied; the pause-context case pins the data the fix
  depends on; the fresh-run and covered-gate-resume cases are the discrimination guards
  that keep today's triage behaviour where it is still correct.
