id: BP-100k-3-iii
components:
  - build_pipeline
title: "The known never-build-determined files in a worked-in tree are declared exempt with distinct grounds, and a stale orphan with no template left to produce it is removed rather than exempted"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a fully built workspace, worked in rather than freshly cloned, holding
    four files inside a directory check-output-drift scans that no run of the
    build can ever produce deterministic content for — a machine-local
    settings file the adopter edits on this machine, a lock file a scheduled
    task writes at run time carrying a session id and a timestamp that
    changes on every acquisition, the project's own build-input configuration
    file (the file every build phase reads FROM, never one a phase writes
    deterministic content TO), and a write-if-absent scaffold the project
    appends its own content to after seeding — and each is present on disk
    and recorded in neither the build manifest nor the exemption registry,
  When check-output-drift is run over that workspace,
  Then each of the four is reported as a declared exemption naming a
    non-blank ground, the four grounds are pairwise distinct rather than one
    copy-pasted ground reused four times, and none of the four is counted
    among the run's gaps,
  And given, in a directory the same gate scans, a file that WAS once
    deployed by a template this package shipped but whose template no longer
    exists to produce it — a stale artifact left behind after its source was
    deprecated or deleted outright, present on disk and recorded in neither
    the build manifest nor the exemption registry,
  When that file is classified,
  Then it is never added to the exemption registry on the strength of being
    unrecorded — an orphaned artifact with no template able to produce it is
    the "candidate for manual deletion" class the registry's own governing
    comment already warns against exempting, not a hand-maintained file the
    build deliberately leaves alone — and the file is removed from disk
    instead, so that a subsequent run finds nothing there to report,
  And a check-output-drift run over the same workspace, after the four
    exemption entries are declared and every such orphan is removed, reports
    gaps=0, drifted=0, missing=0, and unreadable=0, and exits 0,
  And this is shown by running the deployed gate as a subprocess and reading
    its RESULT line and per-artifact UNCOMPARABLE lines, never by reading the
    exemption registry's JSON for the presence of a well-worded entry.
