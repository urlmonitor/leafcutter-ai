notes: |
  THE TRAIL ITSELF -- successor to the ticket's `## Comments` section.

  VERIFIED: THE STORE HAS NO VOCABULARY FOR THIS AT ALL (do not re-investigate).
  config/ac_store_schema.json has ZERO matches for `comment`, `blocker`,
  `adjudicat` and `escalat`. The only free-text slot is `notes` (~line 505),
  typed as a plain `"type": "string"` -- an unstructured blob with no per-entry
  author, timestamp, phase or status. The five attributes named in the second
  Then clause (who / when / which stage / outcome / decision) are exactly the
  attributes `notes` cannot carry, and they are chosen to match what the
  adjudication ladder actually reads, not to be thorough for its own sake.

  WHY PER-REQUIREMENT AND NOT PER-CONTAINER (the load-bearing argument, from
  ACD-2000a): adjudication is per-attempt-at-a-requirement. Under ACD-1800c a
  ticket groups N requirements, so a container-level log conflates N independent
  retry budgets into one stream -- two failures on two different requirements
  read as "retry 2" on both, tripping caps early, while a bundle re-run resets
  all N at once. The trail must be at the same grain as the thing being retried.
  Grain-invariance matters too: the fast lane
  (scripts/build_orchestration/fast_lane.py) builds a single AC with no ticket at
  all, and today that path has no adjudication record whatsoever.

  APPEND-ONLY IS A BEHAVIOURAL REQUIREMENT, NOT A STYLE PREFERENCE (third and
  fourth Then clauses). A retry count that any writer can silently reset is not a
  cap -- ACD-2000a-2's stop condition is only as trustworthy as this property.
  The fourth clause deliberately forbids "correct in place" because that is the
  natural thing to do when a later phase learns the earlier verdict was wrong,
  and it is indistinguishable from a reset.

  THE YAML ROUND-TRIP HAZARD IS THE IMPLEMENTATION TRAP, and it is why
  ACD-2000a-1-i exists as a separate leaf: `_update_ac_work_status()` in
  scripts/build_orchestration/fast_lane.py (~lines 113-125) does a full
  `yaml.safe_load` -> `yaml.safe_dump` rewrite of the ENTIRE AC record on every
  claim and every release. Any trail added here is round-tripped through that on
  every ACD-2000b claim; key order and comments are not preserved and a partial
  write truncates the log.

  SCHEMA CONSTRAINT: a new structured field, so
  additionalProperties:false (enforced today -- see ACD-1800f's verified notes)
  makes ACD-1900a's additive-first, optional-field landing a hard prerequisite.
  Absence = legacy mode: a requirement with no trail has made no recorded
  attempts, which must not be an error. Mirror any shape validation into
  scripts/commit_guardian/check_ac_schema.py, its manual fallback
  scripts/commit_guardian/_ac_schema_validators.py, and
  scripts/ac_store/validate_ac_schema.py.

  TESTABILITY. Append three attempts to a real on-disk requirement through the
  real writer and assert the file's contents after each. Asserting the schema
  permits a list would pass on a list nothing ever appends to.

  2026-08-17 (IT PO enrichment). Assigned python-coder: the deliverable surface is
  a JSON schema slot plus a Python writer/reader and three Python validation
  points -- all extensions python-coder owns. No cross-craft surface, so no split.
  Complexity L: a new module plus edits to config/ac_store_schema.json,
  scripts/ac_store/validate_ac_schema.py, scripts/commit_guardian/check_ac_schema.py,
  scripts/commit_guardian/_ac_schema_validators.py and, if a hook imports the new
  module, scripts/build_phases.py.

  ONE FINDING ADDED BY THIS PASS, against the code. The BA's notes say the round
  trip does not preserve key order; verified more precisely -- line 122 is
  `yaml.safe_dump(data, fh, allow_unicode=True)` with sort_keys left at its
  PyYAML default of True, so the whole record is re-keyed ALPHABETICALLY on every
  claim and release, and line 121 opens the LIVE path in mode "w", which truncates
  before a single byte is written. Both are stated as verified facts in
  it_requirements rather than as risks, and the atomicity half is ACD-2000a-1-i's.
