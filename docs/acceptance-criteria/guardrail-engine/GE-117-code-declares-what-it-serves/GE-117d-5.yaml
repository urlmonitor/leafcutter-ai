criteria: |
  Given a reader wants to understand how a commit is checked and blocked for
    missing or invalid declarations
  When the reader opens the sequence diagram for the declaration guardrail
  Then the diagram shows the developer initiating a commit and the commit-time
    guardrail being invoked on the staged diff
  And the diagram shows the guardrail consulting the component registry and the AC
    store to resolve declared component and AC references
  And the diagram shows the two outcomes: a satisfied result that lets the commit
    proceed, and a missing-or-invalid result that rejects the commit with an
    actionable report
  And the diagram shows the developer's route back through fix or opt-out to a
    passing commit
