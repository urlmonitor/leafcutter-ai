readiness: reviewed
priority: medium
title: "Unauthorized changes to compiled workflows are caught automatically"
component: build-pipeline
level: L1
status: active
criteria: |
  Drift detection, parity testing, and pre-commit hooks guard compiled outputs.

  If a compiled workflow file is manually edited, the drift detection hook
  catches it before commit. A parity test cross-validates all four
  infrastructure layers so that no category can fall out of sync silently.

  That guarantee rests on the comparison itself being sound: the build records a
  comparable fingerprint for every artifact it manages, the gate can actually be
  triggered by a change, it draws from the whole deployed population rather than
  the part it already knew how to reach, and anything it could not compare is
  reported as a declared exemption or a coverage gap instead of being folded into
  a pass.

  Reporting an absence — an artifact the build recorded but that is now gone, a
  capability that produced no output, a platform never exercised — is covered by
  the sibling L1 BP-100n, split out of this one on 2026-08-26.
