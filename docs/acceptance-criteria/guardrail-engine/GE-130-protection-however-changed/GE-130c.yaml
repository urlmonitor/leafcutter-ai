id: GE-130c
title: "When a protection cannot see what a command changed, it tells you"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  No silent pass for a change the protection could not see.

  Where a command's effect on protected files cannot be told in advance, the
  protection finds out afterwards what actually changed, names any protected file
  that changed, and stops the run, so a quiet result is never mistaken for a
  checked one.
