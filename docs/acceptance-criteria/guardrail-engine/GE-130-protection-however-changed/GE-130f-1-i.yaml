delivers_to:
- agent: python-coder
  ac_id: GE-130f-2
  contract: >-
    The observation rule and the seam that enforces it - a single decision interpreter for the
    PreToolUse block contract, and a record writer whose only arguments are the target path's
    before and after digests. GE-130f-2, GE-130f-2-i and GE-130f-2-ii record their refusals
