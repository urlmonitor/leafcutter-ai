level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader trying to understand what happens after a numbering clash is detected,
  When they read the sequence diagram,
  Then it shows three participants — the author, the guard, and the specialist that performs the
    renumbering,
  And it shows the authoring-time flow in which the guard's response reaches the author's live
    session and the specialist is brought in,
  And it shows the commit-time and shared-build flows in which the specialist participant is
    NOT engaged, and the flow terminates at the author with a message,
  And the reason the specialist cannot be engaged at those two stages is stated on the diagram
    rather than left as an unexplained asymmetry,
  And the diagram carries a sequence number allocated by the project's own allocator, and is
    placed where the enrolment rule expects a numbered diagram,
  And it is linked from its parent architecture document in both directions.
