assigned_agent: test-writer
estimated_complexity: S
declares_side_effect: false
package_surface: false
it_requirements:
  - "No production change is owed. The behaviour shipped in PR #1013 and is on origin/main. Any later change to check_output_drift.py or _drift_exemptions.py must keep the three covering tests named in test_spec green, unmodified in what they assert."
  - "The verdict line for a recorded, compared and drifted key that is excused must stay lexically distinct, by its line prefix alone, from the verdict line for an unrecorded artifact that is excused. Today these are DIRECT-DRIFT: EXEMPT and UNCOMPARABLE: EXEMPT. A consumer that reads only the prefix must be able to tell 'content question' from 'registration question'."
  - "The ground printed on the drift-exemption line must be the declared ground's text. Trimming leading and trailing whitespace is allowed, and the validator already does it. Truncating the text, rewording it or replacing it with a generic label is not."
  - "RESULT-line compatibility: existing fields keep their names and relative order. Any new column is appended after the last existing field, following the precedent set when unreadable was added (B-2). The positional regex in the covering test suite must keep matching."
  - "OPEN QUESTION, DELIBERATELY NOT ENCODED: whether a drift-exempt key belongs in uncomparable, in a separate drift_exempt column, or in neither is going to an ADR. Neither this record nor its tests may assert the uncomparable value for a drift-exempt key. If the ADR changes what exempt counts, the exempt=1 / exempt=2 clauses and the matching test assertions must be amended in the same change as the code."
  - "Verify behaviorally only (repo rule 'Gate / Workflow ACs: Verify Behaviorally, Not by Grep'). Every verdict comes from executing check_output_drift.py as a separate process from a deployed-shaped layout and reading its stderr lines, RESULT line and exit status. Grepping the gate source is forbidden, and so is importing the scan function to inspect its return value."
  - "Before work_status may move to done, each covering test must carry a '# covers: BP-100k-3-iv' tag, because check_done_proof accepts only covers-tagged tests as proof. Adding the tags is a test-file edit and must wait until the in-flight refactor of unit_tests/commit_guardian/ has landed. If that refactor renames or moves any covering test, covered_by and test_spec must be updated in the same change that tags it."
  - "Must follow the repo error-handling policy. No new I/O is introduced by this record, so the constraint is met by leaving the existing, already-compliant I/O in the gate untouched."
test_spec:
  - name: test_drifted_and_unexempt_still_blocks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    surface_invoked: "check_output_drift.py copied from templates/scripts/commit_guardian/ into a synthesized .leafcutter/scripts/commit_guardian/ layout, run as a subprocess with HOOK_TEST_CONFIG pointing at a fixture registry"
    description: "EXISTS, passes on origin/main. Control case for the first clause. With an empty registry the gate exits 1, the RESULT line reads drifted=2 exempt=0, and no DIRECT-DRIFT: EXEMPT line is emitted. This proves the fixture is genuine drift before any exemption is applied. It asserts the drifted COUNT, not that each of the two keys is named individually."
  - name: test_declared_key_is_reported_as_direct_drift_exempt
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "same deployed-shaped subprocess run as above"
    description: "EXISTS, passes on origin/main. With one grounded entry, the output contains 'DIRECT-DRIFT: EXEMPT <declared key>' and 'ground=<ground>' verbatim, and the RESULT line reads exempt=1 drifted=1 gaps=0."
  - name: test_both_keys_declared_yields_a_clean_exit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "same deployed-shaped subprocess run as above"
    description: "EXISTS, passes on origin/main. With both drifted keys grounded, the gate process exits 0 and the RESULT line reads verified=3 exempt=2 drifted=0 missing=0."
test_rationale: |
  RETROFIT CONTRACT: THESE THREE TESTS ALREADY EXIST in
  unit_tests/commit_guardian/test_drift_exempt_recorded_key.py and pass on the
  current code. They are listed so the ticket generator and test-writer see the
  contract as satisfied, not so they are written again. All three run the real
  gate as a subprocess and assert on the emitted lines, the RESULT line and
  the exit status. That is the only shape that distinguishes a wired exemption
  from a defined-but-ignored one, so the shape is right.

  HONEST RESIDUAL GAPS between the criteria and what the tests assert. None of
  these blocks, and none is planned here as new work:
    (a) "distinguishable from the existing verdict for an exempted artifact
        the build never recorded". The tests assert that the DIRECT-DRIFT: EXEMPT
        prefix is present. They do not assert that no 'UNCOMPARABLE: EXEMPT
        <declared key>' line appears too, so a gate that printed both lines
        would still pass.
    (b) "on its own line ... echoes that ground verbatim". The key and the
        ground are asserted as two separate substrings of the combined output,
        not as parts of the same line.
    (c) The control asserts drifted=2 as a count. It does not assert that each
        edited output is named individually.
  If the record is later tightened, (a) is the one worth a one-line
  assertNotIn. It is a cheap discrimination check against a double-reporting
  regression.
delivers_to: null
expects_from:
  ac_id: BP-100k-3
  contract: "The drift_gate_exemption_registry mechanism, read from templates/scripts/commit_guardian/commit_guardian.json (or from HOOK_TEST_CONFIG in tests), plus its validation. validate_exemption_registry returns a dict[str, str] mapping each recorded key to a non-blank ground, and rejected entries are excluded. Also the stderr RESULT line 'check-output-drift: RESULT verified=<int> uncomparable=<int> exempt=<int> gaps=<int> drifted=<int> missing=<int> unreadable=<int>'. This record adds one per-artifact stderr line shape, 'DIRECT-DRIFT: EXEMPT <repo-relative key> ground=<ground text>', and adds no RESULT column."
