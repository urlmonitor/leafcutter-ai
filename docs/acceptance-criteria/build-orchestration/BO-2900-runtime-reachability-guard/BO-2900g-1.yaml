    relationship: related
    status: exists
    relevance: "The verdict-layer prohibition. This AC only settles what is ASKED FOR at planning time; nothing here may be offered as evidence that any work was reached."
  - path: docs/architecture/components/phantom-done-prevention.md
    relationship: describes
    status: exists
    relevance: "Component page for the surrounding guarantees; the planning-time floor must be described there without being read as a completion signal."
assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: true
it_requirements:
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m pytest unit_tests/ac_store/ -q"
  config_schema_fragment:
    type: object
    description: "Shape of every descriptor emitted into a ticket's ## Test Requirements block, on every planning route."
    required:
      - name
      - file
      - covers
      - angle
      - asserts
    properties:
      name:
        type: string
      file:
        type: string
      covers:
        type: array
        items:
          type: string
      angle:
        type: string
        enum:
          - criterion
          - reachability
          - seam
          - real_artifact
          - deployed
          - boundary
          - failure
      asserts:
        type: string
  constraints:
    - "The floor must be attached at the ONE place a plan is finalised for a piece of work (the single return path that produces the ## Test Requirements descriptor list), not added a second time on the authored-spec route. A route-local fix satisfies the first two Then clauses and re-creates the gap the moment a third route exists. That single attachment point is what n_location_rule: '1' means here."
    - "The discriminating check is route-agnostic: a newly introduced descriptor-producing route must inherit the floor WITHOUT that route being modified. If satisfying the criteria requires editing every route, the attachment point is wrong."
    - "An authored test_spec must survive byte-identical and in authored order through the change: same entries, same key order within each entry, same sequence. Re-deriving or normalising an authored plan discards a human test contract to satisfy a mechanical rule and is a worse defect than the one being fixed."
    - "The floor is exactly two named kinds (criterion + reachability) and no more. The change must not promote authored plans to the full seven-value taxonomy."
    - "Planning-time only. Nothing this AC emits may be consumed as evidence that any work is reached — see BO-2900a-2. The generator must not gain any read of a test file, a test result, or a coverage record on this path."
    - "Generation must remain a single pass over one AC record: no additional read of the AC store, and single-AC generation must stay under 2 seconds on a cold process."
    - "Must be idempotent: generating a ticket twice for the same AC produces byte-identical ## Test Requirements output."
delivers_to:
  - agent: test-writer
    contract: "The generated ticket's ## Test Requirements YAML block always contains exactly one descriptor with angle: reachability, whose asserts string either names the production entry point (when one was authored upstream) or states that the entry point is not declared and must be resolved before the test is written. Shape per descriptor: {name: str, file: str, covers: list[str], angle: str, asserts: str}."
expects_from: null
test_spec:
  - name: test_bo_2900g_1_authored_spec_plan_gains_reachability_request
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "An AC carrying a hand-authored test_spec of three entries, none of them reachability, yields a plan containing exactly one angle: reachability descriptor alongside the three."
  - name: test_bo_2900g_1_authored_entries_survive_unaltered_and_in_order
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "The three authored descriptors appear in the emitted plan in their authored order with every authored field unchanged; only the appended reachability entry is new."
  - name: test_bo_2900g_1_reachability_floor_present_via_generator_cli
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT: run `python scripts/ac_store/generate_ticket_from_ac.py --ac <id> --ac-root <tmp store> --tickets-root <tmp>` as a subprocess against a real on-disk AC YAML that authors its own test_spec, then read the ticket file the CLI wrote and assert its ## Test Requirements block carries the reachability entry. Must not import _build_test_requirements_section or any other internal."
  - name: test_bo_2900g_1_new_plan_route_inherits_floor_unmodified
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: "Introduce a third descriptor-producing route in the test (a plan source that is neither the criteria-derived fallback nor an authored test_spec), pipe its real output through the real finalisation path, and assert the reachability request is present without that new route having been given any knowledge of the rule."
test_rationale: |
  A direct unit test of _derive_tests_from_criteria cannot see this AC's defect: that
  function already appends the floor and is already green. The defect lives on the OTHER
  route and at the attachment point, so the discriminating tests are (a) the seam test
  that adds a third route and asserts inheritance, and (b) the CLI test that reads the
  ticket the real entry point actually wrote. A test that calls the internal builder
  directly would pass on a route-local fix that re-creates the gap.
