criteria: |
  Overrides are counted, so a check that mostly cries wolf can finally be dropped.

  When a check blocks and the work goes ahead anyway, that override is recorded
  against the check rather than left as a passing remark — so you can see how
  often each check is wrong, and retiring one becomes an evidence-backed decision
  instead of an argument nobody can win.
