title: "An agent recording an outcome for a gate it has already recorded updates that entry instead of appending a second"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a work item whose record already carries one entry for a gate, written by the
    agent that owns that gate,
    And that same agent is invoked again for the same gate on the same work item --
      retried after a failure, or re-entered when the drive resumed -- and reaches an
      outcome,
  When it records that outcome,
  Then the record carries exactly one entry for that gate, not two,
    And that single entry states the later outcome and the later timestamp,
    And that single entry also states that the gate was recorded more than once and
      what the earlier outcome was, so the earlier attempt is not erased by the
      update,
    And every entry for every other gate is byte-for-byte unchanged,
    And when the same agent records a gate that has no entry yet, one entry is
      appended -- the rule is update-if-present, never write-nothing,
    And an agent never alters an entry belonging to a gate it does not own.
  So the work item's record ends a drive with one entry per gate that reached an
    outcome, and the count of entries is a usable completeness signal rather than a
    count of dispatches.
