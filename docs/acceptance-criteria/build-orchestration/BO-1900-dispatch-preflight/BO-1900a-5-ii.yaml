notes: |
  THE ASYMMETRY IS THE POINT. In the observed incident the only reason anyone learned the
  capabilities were unreachable is that the craft volunteered it. Nothing in the run would
  otherwise have differed from a clean run — and an outcome in which a degraded run and a
  healthy run look identical is this repository's central failure mode, not an edge case.

  BOTH HALVES ARE LOAD-BEARING. The second Then clause is as important as the first: an
  implementation that always emits a caveat satisfies the first clause and destroys the
  signal, because a warning present on every run is read as boilerplate. The clean-run case
  must be asserted in the same breath as the degraded one.

  THIS AC DOES NOT DECIDE WHETHER THE RUN SHOULD CONTINUE. BO-1900a-5 holds the dispatch
  back. This AC governs the case where continuing was nonetheless chosen — a deliberate
  override, or a capability judged advisory. Whether such an override should exist at all is
  not settled here; if it does, it may not be silent.

  PROOF OBLIGATION. Compare the outcomes of two executed runs — one with a capability
  withheld, one with all present — and assert they differ in the stated way. A test that
  inspects only the degraded run cannot detect an implementation that caveats unconditionally.
