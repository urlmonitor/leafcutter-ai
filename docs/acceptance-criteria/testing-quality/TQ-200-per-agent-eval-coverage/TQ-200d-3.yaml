notes: |
  TQ-200d SUGGESTED SPLIT, ITEM 3 (test-designer). BLOCKED until the agent
  exists: depends_on ACD-2500d-5 is carried on THIS L2, never on TQ-200d (the
  fast lane pulls every unmet dependency into the build set, so an L1-level
  edge would drag ACD-2500d-5 into every TQ-200d build). TQ-500f-2-ii (the
  must_catch duty in the designer's procedure) is not a build dependency: the
  rows may exist before it and will fail until it lands, which is the eval's
  red baseline.

  THE TRAP IS THE DIRECTION TQ-500f-2-ii's R3 LEAVES OPEN. R3 says new behaviour
  is not REQUIRED to carry must_catch. The failure a designer is likely to show
  is the opposite over-reach: "revert the fix" on work with nothing to revert,
  which would send the wrong-version runs an absence (TQ-500g-1-ii) and stop the
  work for nothing.

  "IN ITS OWN WORDS" keeps TQ-500f-2-ii's rule that bug-fix / gate is the
  designer's stated judgement, not an automatic classifier's output (TQ-500
  non-goal). A judge scores that statement; the must_catch lists are compared
  structurally where possible.

  LOCAL ONLY (user decision at the PO gate): see TQ-200d-1 notes.

  IT-PO ENRICHMENT (2026-09-28)
  Not buildable until ACD-2500d-5 (llm-expert, todo) is done.
