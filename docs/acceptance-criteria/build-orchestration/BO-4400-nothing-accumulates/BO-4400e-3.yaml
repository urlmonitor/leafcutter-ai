id: BO-4400e-3
title: "Under WSL the Windows drive holding the Linux disk is checked too, and the lower free space decides"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given the refusal limit is set to 5 GB, and the project runs under WSL where the
    Linux volume reports 200 GB free while the Windows drive holding the Linux virtual
    disk has 2 GB free,
  When a workspace is requested from the one workspace maker,
  Then the answer is a refusal that names the Windows drive and its 2 GB free as the
    reason, and also states the Linux volume's 200 GB free,
  And given the same machine with the Windows drive at 50 GB free, the answer is ready
    with no space warning,
  And given a machine that is not running under WSL, only the volume where workspaces
    are created is measured and no Windows drive is named in the answer.
depends_on: [BO-4400e, BO-4400e-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400e.yaml
    relationship: constrains
    status: exists
    relevance: Notes record that the WSL virtual disk grows on the host and cannot be capped after creation.
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: BO-4400e-1
  contract: "Free-space check entry point."
package_surface: false
it_requirements:
  - >-
    WSL detection from the kernel release / WSL environment markers; on WSL the check also measures
    the Windows drive that holds the distro's virtual disk and the LOWER free figure decides; the
    answer names both volumes and their free space.
  - >-
    Locating the host drive is a bounded probe (Windows interop query of the distro's base path,
    then the free space of that drive through its /mnt/<letter> mount), timeout default 5 s; a
    failure falls under BO-4400e-1-i (warn, name the drive, proceed).
  - >-
    The WSL detector and host-drive locator are reachable through the same documented test seam as
    BO-4400e-1 so the behaviour is testable on non-WSL CI; the real probe is additionally exercised
    once on a WSL host as a behavioural spot-check before the AC is marked done.
  - >-
    On a non-WSL machine no interop call is attempted and no Windows drive appears in the answer.
test_required: true
test_spec:
  - name: test_wsl_low_host_drive_refuses_naming_host_drive_and_linux_volume
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Linux 200 GB free and host drive 2 GB free yields a refusal naming the Windows drive's 2 GB and stating the Linux 200 GB."
    must_catch:
      - "only the Linux volume measured under WSL"
  - name: test_wsl_ample_host_drive_yields_ready_without_warning
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "With the host drive at 50 GB free, the answer is ready with no space warning."
  - name: test_non_wsl_machine_measures_only_landing_volume
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Off WSL only the landing volume is measured and no Windows drive is named."
test_rationale: >-
  The Linux figure alone is the blind spot; only a case where it disagrees with the host drive shows
  the lower figure decides.
origin_agent: business-analyst
created: 2026-10-09
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  The Linux volume of a WSL distro reports the virtual disk's own free space, which can be
  far larger than what the host drive can actually supply -- the exact blind spot that lets a
  host run out silently. Locating the host drive for the virtual disk is the IT PO's call; a
  failure to locate it falls under BO-4400e-1-i (warn, name the drive, proceed).
