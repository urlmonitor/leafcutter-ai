estimated_complexity: M
it_requirements:
  - "The red-baseline gate runs the batch's tests via a deterministic, exit-code-driven invocation (fixed test collection for the batch, stable ordering) — the pass/fail decision is derived from the process exit code, not an agent judgment."
  - "The coder must be dispatched only after the red-baseline check confirms that at least one newly added covering test for the batch is red; the gate is a hard precondition on coder dispatch, not advisory. (Amended 2026-08-17 from 'every newly added batch test fails' — see amended_by and BO-2400a-3-v.)"
  - "The set of 'newly added' batch tests must be identified from the batch under build, at test-function granularity, from the worktree's git state relative to its merge-base with origin/main — not from the whole suite, not from file-level diffs, and not from an agent-reported list of written test files (BO-2400a-3-ii). Tests that carry a matching covers tag but already existed at the merge-base are pre-existing and are excluded from the verdict (BO-2400a-3-iv)."
  - "Per-test outcome classification is not binary: failed and xfailed are red, passed and xpassed are green, skipped and errored are inconclusive (BO-2400a-3-vi). The repository's AC test-enforcement plugin converts failures to xfail for any AC that is not yet done, which is every AC in a fast-lane batch, so a gate that recognises only 'failed' as red sees no red tests in a real run."
  - "The gate must be idempotent — re-running it against the same tree yields the same verdict."
