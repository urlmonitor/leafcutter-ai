estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: ACD-1900c-1
  contract: "The ac_unit_of_work.emit flag defined in config/guardrail_gates.yaml whose flip-to-true this guard intercepts; the guard refuses the flip and keeps emit=false unless the read-side surfaces are deployed."
it_requirements:
  - "Canonical source: the emit-enable path in scripts/ac_store/ that reads the ac_unit_of_work.emit flag from config/guardrail_gates.yaml (templates/scripts/ac_store/ does not exist, so scripts/ac_store/ is the canonical source for this python surface; it mirrors the enforce-enable guard ACD-1900c-3). Setting emit=true MUST be refused unless the dual-read spec resolver (ACD-1900b-1) AND the migrated read-side agent and gate templates are ALL present in the DEPLOYED layout."
  - "Presence MUST be verified from the DEPLOYED layout (e.g. .claude/agents/ and the deployed scripts/), NOT the source tree -- the source tree masks the gap (the done_proof.py ModuleNotFoundError precedent, ADR-026 rule 2). The refusal error MUST NAME each missing read-side surface, and on refusal ac_unit_of_work.emit remains false (no partial flip)."
  - "This is the emit-flag analogue of the deploy-manifest guard ACD-1900d-3-i and implements ADR-026 rule 6 (the thin generator and universal dual-read ship in the SAME self-build). The required read-side surface set must be data-driven (iterate the declared set of required surfaces), never a single hard-coded path -- new read-side surfaces inherit the guard automatically."
  - "Gate/workflow AC (CLAUDE.md 'verify behaviorally, not by grep'): the test MUST exercise the emit-enable path against a deployed-layout fixture with the read-side surface ABSENT (expect refusal naming each missing surface, emit stays false) and PRESENT (expect acceptance), verified from the deployed layout -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML/import I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_emit_true_refused_when_readside_absent_names_surfaces
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Setting ac_unit_of_work.emit=true from a deployed-layout fixture missing the dual-read resolver / migrated read-side templates is refused with an error naming each missing read-side surface, and emit remains false."
  - name: test_emit_true_accepted_when_readside_present
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Setting ac_unit_of_work.emit=true from a deployed-layout fixture where the resolver and migrated read-side agent/gate templates are all present is accepted."
