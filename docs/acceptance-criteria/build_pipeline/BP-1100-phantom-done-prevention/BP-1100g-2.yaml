notes: |
  GAP D of BP-1100g, second half, and the part the parent L1 names as the hardest:
  "Do not let an L2 assume the way in is given."

  WHY THIS IS SEPARATE FROM BP-1100g-1. Teaching the writer the names
  (BP-1100g-1) is a vocabulary contract between two static sources. Resolving a
  way in is a judgement the writer makes per piece of work, on the ~80% of work
  where nothing upstream can make it for them. They fail differently, they are
  produced by different things, and they are observable in different places.

  WHY A RECORDED ANSWER RATHER THAN A BETTER INSTRUCTION. An instruction with no
  artifact is the exact asymmetry GAP F is about. The failure mode named in
  docs/testing/test-angles.md is that "a reachability mandate can quietly be
  satisfied by a renamed criterion test" — the writer, handed an unresolvable
  request, does the cheapest thing and nothing downstream can tell. Recording the
  resolved way in does not prove the test entered it; it makes the writer's
  choice visible to a human reader and to the observer that later judges it.

  THE HONEST NEGATIVE IS REQUIRED HERE TOO. Some work genuinely has no runtime
  way in — that population is what BO-2900d's exemption exists for. A writer that
  must name one will invent one. "No way in found, here is what I looked for" is
  a valid recorded answer and a useful input to that exemption.

  BOUNDARY. The record is a DECLARATION. It contributes to no done, pass or
  eligibility decision, and nothing here inspects a test to check the declaration
  is true. That question belongs exclusively to BO-2900a's execution observer.

  IT-PO ENRICHMENT NOTE (2026-08-17). declares_side_effect is deliberately NOT
  set: the durable artifact here is written by an LLM agent, not by code, so
  routing user-surface-smoker would produce a phase agent with nothing runnable
  to smoke. Verified during enrichment: completion_manifest has no code reader
  anywhere under scripts/ — it is parsed only by the supervisor. That is why the
  it_requirements insist on ONE fixed key token: it is the difference between
  BP-1100g-5-i's reader being extendable to this key and a second convention
  having to be built.
