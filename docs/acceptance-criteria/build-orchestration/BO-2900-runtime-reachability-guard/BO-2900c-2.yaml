notes: |
  The rename is the scenario the parent L1 was written for, and it is the one case
  where both directions fire on a single change. Isolated as its own L2 because the
  interaction between the two checks is not observable from either one alone.

  WHY THE FINDINGS MUST STAY DISTINGUISHABLE. A rename produces N stale-caller findings
  plus one uncalled-capability finding. If the checks report into one undifferentiated
  list, the author reads "three problems" where there is one cause and one fix, and the
  natural response is to treat the uncalled-capability finding as noise and exempt it —
  permanently exempting the new capability while fixing only the callers. Keeping the
  kinds distinct is what makes the single remedy legible.

  THE REMOVAL CLAUSE IS A DELIBERATE ASYMMETRY, and it is the clause most likely to be
  got wrong. Removing a capability leaves stale callers but creates no uncalled
  capability — there is nothing left to be uncalled. An implementation that models the
  rename as "one finding of each kind" will emit a phantom uncalled-capability finding
  on a removal, naming a capability that no longer exists. Asserting the removal case
  here prevents that.

  TWO CALLERS, NOT ONE, in the fixture is intentional: a check that reports only the
  first stale caller satisfies a single-caller scenario, and the author then fixes one
  script and re-runs into the same wall. BO-2900e-2 states the general
  report-them-all rule; this AC exercises it on the case where it matters most.

  BOUNDARY: this AC asserts the interaction and the finding shapes. The wording of
  either message belongs to BO-2900e; the invocation-collection rule belongs to
  BO-2900b-3. Do not restate either.

  Verification must EXECUTE both checks over all three fixture states (rename without
  updates, rename with updates, removal without updates) and assert the findings in
  each.
