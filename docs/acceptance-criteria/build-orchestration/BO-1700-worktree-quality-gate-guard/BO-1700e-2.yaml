criteria: |
  Given the project is building itself and the guard runs inside a worktree,
  When the guard needs the authoritative pre-commit config or shared hooks,
  Then it resolves the shared git directory (via `git rev-parse --git-common-dir`)
    to the main checkout, and reads the config and shared hooks from there,
  And this resolution is available to the probe (BO-1700a-1) for locating the
    worktree's config, shared hook, and the main tree's current config.
