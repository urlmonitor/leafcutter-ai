notes: |
  WHY HERE AND NOT UNDER TQ-500g (PO decision, Phase B planning 2026-09-28).
  TQ-500f promises that an absence-only red never proves a test guards existing
  code. TQ-500f-3-i/-ii keep that promise on the fast lane and /build-feature;
  on /build-epic it is unmet. So it belongs under TQ-500f-3, beside -3-ii.
  L3s have no cap. Id -iv because -iii is taken (TQ-500f-3-iii, on main via
  PR #926).

  PROMPT-ONLY. /build-epic dispatches ticket-supervisor, which follows the
  building-epics skill; the wiring is instruction text and cannot be
  unit-tested without a template text search (forbidden). The rule is
  deterministic and already tested in TQ-500f-3-i. Substitutes: pr-reviewer
  against the Then clauses, and a live /build-epic drive of a fixture epic with
  K1 to K3. MECHANICAL BACKSTOP (user decision Q3 at the BA gate):
  TQ-500g-1-viii stops the commit of any /build-epic ticket for which this
  reader's verdict is missing or unreadable, so this AC must leave the reader's
  own verdict on record in a form that check can read.

  PAIR WITH TQ-500g-1-vii. Both add a shared gate call to the same
  ticket-supervisor phase sequence. They may be built together as one
  llm-expert change, but each keeps its own AC and can pass or fail on its own.

  CARRIED OVER FROM TQ-500f-3-ii (user decisions at its IT-PO gate): tickets
  WITH a source requirement get the full shared reader, including every
  existing halt reason (for example no newly added test tagged as covering the
  requirement); tickets WITHOUT one record the not-applicable outcome and go on.

  IT-PO ENRICHMENT (2026-09-28)
  Composite effect: TQ-500f-3 already has prompt-only children. This
  test_required: false child joins them, so TQ-500f-3 cannot be marked done by
  the pre-commit done-proof path until
  KI-CG-20260914-done-proof-precommit-ignores-test-required is fixed.

  IT-PO AMENDMENT (2026-10-14)
  Shipped with TQ-500g-1-vii and -viii, so its fields were checked against
  the design now on main. The red-baseline step does not use test-breaker,
  the writer or the runner. Only the record wiring changed: --record
  <ticket-key> (TQ-500g-1-viii), with the same key the wrong-version step
  uses. heavy_lane_gate with no ids already prints the not-applicable outcome
  that K3 names, word for word. The criteria still match; no clause needs the
  BA.

  IT-PO ALIGNMENT (2026-10-21): AGAINST MAIN AT adb0c2e61
  heavy_lane_gate on main has --source-ac (optional), --test-root, --ac-root
  and --ticket; no --record. --ticket writes a red_baseline_gate line into the
  ticket's frontmatter and reuses it on a later call. /build-feature passes it,
  so this route does too ("the same inputs"). /build-feature skips the CLI for
  K3 and writes the outcome string itself; this route calls the CLI for K3
  because the backstop needs the record, and the CLI prints the identical
  outcome, so the verdict stays identical.
  QUOTING: /build-feature's and build-ticket.js's red-baseline calls are still
  unquoted on main (KI-BO-20261021). This AC pins a quoted line and an input
  check; it does not fix those two sites.
  OPEN QUESTION Q1 (for the user): a resumed drive that spawns commit but no
  coder (the earlier drive stopped after the coder) would never run the reader
  in this drive. If no red_baseline.json exists from the earlier drive (for
  example a ticket in flight before this change), the hook blocks the commit
  as "missing". The it_requirements choose: run the reader once before the
  wrong-version sequence in that case; --ticket reuses the recorded pass, and
  without one the reader halts honestly. Alternatives: (b) accept the hook's
  block and have the user re-run test-writer; (c) let the hook accept a
  frontmatter red_baseline_gate record as a fallback. Recommendation: keep (a).
  PACKAGE SURFACE: false. Template-only edits; no registry entry is added.

  USER DECISIONS (2026-10-22)
  Q1 (a): when a resumed drive will spawn commit but spawns no coder, run
  heavy_lane_gate (with --ticket and --record) once before the wrong-version
  sequence. --ticket reuses the recorded pass; without one the reader halts.
  Q1 is closed; the it_requirements timing rule stands as written.
