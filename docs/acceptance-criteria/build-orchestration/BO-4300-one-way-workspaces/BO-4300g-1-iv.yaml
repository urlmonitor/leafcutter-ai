notes: |
  User decision 2026-10-25: the proof of BO-4300g-1 is itself a behaviour that needs its
  own criteria. An agent's answer is the thing under test, so it cannot also be the
  evidence: the KI's first run reported a removal it had not been asked for only after the
  fact, and an answer can just as well under-report. The proof therefore reads the git
  state of the throwaway project and its stand-in shared project before and after every
  trial, and counts the agent's removal requests to the workspace maker from outside the
  agent. Zero tolerance per user decision A: 5 trials per scenario, one failing trial
  fails the scenario.

  BA ASSUMPTIONS, for IT PO to confirm or replace:
  - The deterministic no-model scoring is the CI half of the proof; the live trials stay
    manual-run because CI holds no model credential (user decision A, recorded on
    BO-4300g-1).
  - "Stand-in actors" are scripted replacements for the agent that change real git state
    in the throwaway project; they are not mocks of git.

  IT PO 2026-10-25: both BA assumptions confirmed (it_requirements "TWO MODES OF ONE SCORER").
  change_target corrected from the provisional 'prompt' to 'code': every declared file is a
  Python harness, its config or its eval set; no agent template changes here. The eval-harness
  files moved here from BO-4300g-1 on the user's decision (BO-4300g-1 keeps only the charter,
  llm-expert); the live tests of BO-4300g-1 and its L3s use this record's scorer (delivers_to).
  depends_on (BA field) names BO-4300g-1 only for its answer/authorization contract; the two are
  built in the same build (user decision D with BO-4300g-3), so neither waits on the other's merge.
  declares_side_effect stays false: the Then clauses assert the scorer's verdicts, not a durable
  user-facing side-effect.

