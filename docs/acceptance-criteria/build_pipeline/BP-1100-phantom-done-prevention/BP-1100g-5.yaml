notes: |
  GAP F of BP-1100g. The rule already exists and is one of the highest-value rules
  in the corpus; what it lacks is any way to tell whether it was followed.

  THE OBSERVED ASYMMETRY. Rule 1 mandates an exact machine-checkable token in the
  work record ("(classification: test_drift | production_drift | consumer_drift)")
  and is therefore auditable. Rule 3 mandates nothing observable at all, and
  neither the completion manifest nor the red-baseline record has anywhere to put
  it. A violation of Rule 3 is undetectable by construction — not hard to detect,
  undetectable.

  THE HONEST NEGATIVE IS A FIRST-CLASS OUTCOME. A great deal of work genuinely
  sits at no layer boundary. A mandate with no legitimate negative answer gets
  rubber-stamped, and a fabricated seam claim is worse than no artifact at all:
  it costs a real test's worth of effort and produces a false record. "No seam
  applies, because this work is a pure function with no consumer outside its own
  module" is a good answer.

  CARRY THE KNOWN TRAP FORWARD. BO-1000b-1-i's implementation shipped a
  double-recording bug — a skip-branch record was added while the pre-existing
  unconditional record after the if/else was left in place — and the structural
  test was blind to it because its regex matched only quoted-string arguments and
  not template literals. Assert cardinality BEHAVIOURALLY, from the records a run
  actually produced, never by grepping for the presence of a call. The last Then
  clause (per piece of work, not per run) exists for the same reason: a run-level
  answer lets one piece of work inherit another's.

  BOUNDARY. The answer is a DECLARATION by the writer. It is not evidence that
  the seam test is any good, it feeds no done or pass decision, and nothing here
  inspects a test to check it.

  IT-PO ENRICHMENT NOTE (2026-08-17). declares_side_effect is deliberately NOT
  set: the record is written by an LLM agent, not by code, so routing
  user-surface-smoker would give a phase agent nothing runnable to smoke. The
  ONE-FIXED-KEY-TOKEN requirement is the load-bearing constraint here — it is
  what makes BP-1100g-5-i's reader buildable, and the same requirement is stated
  on BP-1100g-2 for the entry-point key so both ride one reader.
