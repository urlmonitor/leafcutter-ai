id: INF-400f-3
title: "Cross-agent knowledge flows through shared persistence, not agent-to-agent message passing"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
criteria: |
  Given the v3 pipeline runs agents sequentially (PO -> BA -> IT PO),
  And each agent persists learnings to the filesystem via capture-learning
    (memory files, README.md, PROJECT_CONTEXT.md),
  When the downstream agent (BA after PO, IT PO after BA) starts its pre-flight step,
  Then the downstream agent reads the same filesystem paths that the upstream agent
    wrote to (because all agents share the same working tree),
  And knowledge transfer happens through the filesystem (Channels 2, 3, and 9
    of the knowledge plane), NOT through:
    - A message-passing API between agents,
    - A shared in-memory context structure,
    - Explicit "hand off this learning" instructions in the pipeline orchestrator,
  And this design requires no changes to the harness or Claude Code SDK
    (it relies solely on file reads that the harness already performs at spawn time).
