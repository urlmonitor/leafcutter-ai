notes: |
  TRANSITION RULE. Every record written before this AC has no list. Treating its doc_links
  as the list would carry KI-ACS-002's imprecision into the new field under a new name, so
  the answer is a named, countable state instead. The phrase "not evaluated: no declared
  files" is the one ACD-2500a-3 already uses for its record S; this AC makes it the store's
  vocabulary rather than one check's. A record leaves the state only when someone declares
  its files -- nothing back-fills them automatically.

  HOW THE HELD ACD-2500 ACs ARE SATISFIED. ACD-2500a-3, ACD-2500c-1-i, ACD-2500d-1 and
  ACD-2500d-5-i depend on ACD-1600c-4 (and ACD-2500a-3 also on this AC, for its record-S
  clause). They can then read declared files and markers from the one answer, and report a
  record in this state as not evaluated, never as passed.

  EMPTY LIST IS REFUSED (BA decision, flagged to the user): work that changes no file is not
  a buildable requirement, so an empty list carries no meaning distinct from an absent one
  and would only create a second spelling of the same state.
