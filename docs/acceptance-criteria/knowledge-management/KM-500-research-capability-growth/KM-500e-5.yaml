expects_from:
- ac_id: KM-500e-1
  contract: 'Answer requirements: original_question, required_fields with meanings, repository_id, requested_source_sha,
    population/root_id, levels, root_excluded versus terminal_leaf_only inclusion rule, completeness_required, unresolved_scope
    and clarification state, preserved across run/resume.'
- ac_id: KM-500e-2
  contract: 'Attributed field evidence: canonical_id, repository_id, source_sha, source_locator, disclosed_values
    keyed by canonical field, field_availability (present, source_absent, projection_absent, disclosure_omitted,
    truncated, unknown), exact_clause completeness and limitations; lifecycle status, req_status, work_status and
    readiness remain separate.'
- ac_id: KM-500e-3
  contract: 'Count evidence: resolved scope, source_sha/generation, unique canonical IDs, known_count, complete
    flag and cause, exact_total only when complete, work_status breakdown with unknown bucket, continuation state
    and limitations; no unproven global or execution count.'
- ac_id: KM-500e-4
  contract: 'Capability assessment: answer_requirements, operation identity/version, generation-supported kinds/relations/fields,
    availability evidence, classified gap, query_build_eligible with reason, unresolved facts and existing authorization
    prerequisites; no side effect in classification.'
- ac_id: KM-500f-1
  contract: 'Declared-impact evidence: source_sha(s), root canonical ID, relation kind/direction/depth, attributable
    edges and unique dependent IDs, complete flag/limitations, known subset and exact total only when complete;
    declared links and inferred effects are distinct.'
- ac_id: KM-500f-2
  contract: 'Verification evidence: canonical AC/test reference identity, reference/anchor/execution identity distinction,
    source_sha versus tested_sha, run/artifact locator if present, environment, actor authenticity, execution status
    and research fulfillment, proof kind and missing/unverified evidence.'
- ac_id: KM-500f-3
  contract: 'Readiness assessment: candidate facts with evidence IDs, supplied policy identity and clauses, fulfilled/unresolved
    prerequisites, justified recommendation separately labeled from canonical status, deployment evidence state
    and explicit missing inputs.'
- ac_id: KM-500f-4
  contract: 'Implementation explanation: inspected source evidence and locators/revision, bounded field-flow stages
    when supported, declared implementation references, runtime-attempt evidence if supplied, inference label, unsupported
    scope and missing inspection authorization.'
- ac_id: KM-500f-5
  contract: 'Regression recommendation: changed scope and revision, guarded behavior, attributable inspected fixture
    facts and expected outcomes, real/simulated labeling, inspected test or execution evidence, negative-case gaps,
    bounded recommendation rationale and unverified completeness.'
