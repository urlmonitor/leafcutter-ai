id: BP-600c-3-ii
components:
  - build_pipeline
title: "Quick-fix's mutation proof reverts and restores the fix without touching the shared stash stack"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: high
work_status: done
criteria: |
  Given the mutation proof of BP-600c-3 must revert the fix, observe red,
    restore the fix and observe green,
  And the git stash stack is shared by every session and every agent operating
    in the same repository, and `git stash pop` with no argument pops whatever
    entry is on top of it rather than the entry the popper pushed,
  When the workflow performs that revert-and-restore,
  Then it does not use `git stash push` or `git stash pop` to do so,
  And it reverts by writing the file's HEAD content over the working copy after
    first saving the fixed copy to a path outside the repository,
  And it restores by copying that saved copy back, never by popping a stack
    entry it cannot prove is its own,
  And the HEAD content is materialised into a temporary file and checked before
    anything overwrites the target, so a failed lookup cannot truncate the fix,
  And restoration is verified by comparing the target byte-for-byte against the
    saved copy rather than by inferring it from `git status`,
  And when the proof cannot complete, the recovery instructions it emits name
    the saved copy's path, not a stash entry.

  And separately, where the workflow advises a human to set aside their own
    uncommitted work before a run, it does not advise a bare `git stash` /
    `git stash pop` pair, but a stash labelled with `-m` that is located in
    `git stash list` and popped by its own ref.

  And the bug symptom ("the prescribed `git stash push` / `git stash pop` pair
    popped a concurrent session's stash entry instead of the one quick-fix
    pushed, destroying that session's uncommitted work — recoverable only by
    digging the stash commit out of the object store") must not occur.
