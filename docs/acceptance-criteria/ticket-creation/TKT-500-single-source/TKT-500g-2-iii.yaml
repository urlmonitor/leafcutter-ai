it_requirements:
  - "The parent link must resolve to a page that exists. docs/architecture/components/ticket-creation.md is not in the tree today, so either it is created as part of this change or the diagram is parented to an existing component page — a diagram whose parent link dangles fails the commit-time parent-link check and ships unreachable."
  - "Four in-pipeline participants plus one beyond the boundary is the budget. A fifth in-pipeline participant means the span was chosen wrongly, not that the budget should rise."
  - "The boundary must be drawn, not implied. A reader who cannot see where this pipeline ends will read the downstream refusal as a guard this pipeline has — which is the exact false comfort the diagram exists to remove."
  - "Reuse the participant and message vocabulary of the neighbouring diagram rather than minting a third set of words for the same objects. Two diagrams naming one participant differently is the prose form of the defect this tree is about."
  - "The guarded-versus-unguarded marking must describe the state as of the change this diagram ships with. Drawn before TKT-500g-2 lands, it would document the intended state as if it were current — a documentation instance of the same phantom-done shape."
test_required: false
test_rationale: |
  Genuinely proof-free as executable behaviour: the observable is one sequence diagram
  and the AC's central content — that a reader can see which of two drop points is
  guarded, and that no message crosses an explicitly drawn boundary — is a comprehension
  property no unit test evaluates. The mechanical properties (naming convention, parent
  link, participant budget) are already enforced by dedicated commit-time checks and must
  not be duplicated here.
