notes: |
  THIS IS THE DEFECT ITSELF, IN ITS MEASURED FORM. KI-SEC-001 ran a 5.17-entropy
  token through the real exemption logic and recorded
  "templates/skills/some-skill/scripts/helper.py  EXEMPT — not reported". The
  first arm is that measurement inverted into a requirement; the red baseline for
  it is therefore already recorded rather than needing to be discovered.

  THE SECOND ARM IS A MANDATORY NEGATIVE CONTROL, not a courtesy. Deleting the
  exemption outright passes the first arm perfectly and reintroduces exactly the
  false positives GE-123d exists to remove. The two arms together are the
  acceptance shape; neither alone is.

  THE THIRD ARM IS THE FIXTURE-TRAP CONTROL and it is the one most easily left
  out. Every path in the first two arms contains one of the four listed names, so
  each of them measures the exemption as much as the scanner. A run in which the
  exempt paths are silent proves nothing unless the same token, in the same run,
  in the same repository, is reported somewhere the exemption does not reach.
  "scripts/build_probe.py" was chosen for that and only that: KI-SEC-001 measured
  the neighbouring "scripts/build.py" as reported, so it is a known-live path.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED (L0 verification standard).
    - Every fixture is a real file inside a throwaway git repository created for
      the test, at the repository-relative path named in the criteria. The paths
      mirror the real project's layout because the layout IS the subject; the
      files must NOT be written into this repository's own working tree, which
      would put credential-shaped content into the real tree and require an
      allowlist entry.
    - The token must be assembled at runtime from fragments rather than written
      as a source literal, following the discipline already established in
      unit_tests/commit_guardian/test_scan_secrets_suppression.py, so that no
      suppression is needed anywhere in this repository for this tree.
    - Exercise this through the path a real commit takes — the pre-commit secrets
      check over a staged set — never by calling the exemption logic with a path
      string the test chose. A green predicate-level test does not discharge any
      arm of this criterion.
    - EVERY SILENT FIXTURE HERE IS MARKDOWN, AND SINCE 2026-08-25 THAT IS LOAD-
      BEARING RATHER THAN INCIDENTAL. The admitted-kind list narrowed to .md and
      .txt when the product owner decided the acceptance-criteria store shall be
      scanned. No arm of this record moved, because .md survived the narrowing —
      but a store .yaml fixture added here to "strengthen" the negative control
      would now invert. That assertion belongs to GE-125b-1-i, where it is a
      reported arm.

  RELATIONSHIP TO GE-125a. Every path here is a listed location at the repository
  root, so all three arms hold both before and after the reach of the entitlement
  is anchored. This criterion is about what the entitlement covers once it
  arrives, not about where it arrives.

  THE FENCE WITH GE-123d-4-i, AND IT RUNS BOTH WAYS. GE-123d-4-i requires a
  file-kind gate on a PROPOSED exemption for the keyword-based rule that has not
  been built. This criterion requires one on the EXISTING exemption for the
  shapeless-value rule, which has been measured. They are complementary and must
  be closed independently: GE-123d-4-i is not discharged when this lands, and
  this is not discharged when GE-123d-4-i lands. Do not record either as a
  duplicate of the other, do not repair one while building the other, and do not
  edit any GE-123 record from this tree — six of them cite this defect by its
  original identifier as a deliberate out-of-scope fence.

  THE COORDINATION POINT, NOT A MERGE — AND THE TWO LISTS NO LONGER MATCH.
  GE-123d-4-i already anticipates that the two rules may share the location data,
  and requires that if they do, the kind gate is applied on both sides or the
  sharing does not happen. The admitted-kind list chosen in GE-125b-3 was
  deliberately the same four kinds GE-123d-2 chose, so that sharing later would be
  a decision someone could take safely. That is no longer true: on 2026-08-25 the
  product owner narrowed this side to .md and .txt so the acceptance-criteria
  store would be scanned, while GE-123d-2 — a different, still-proposed exemption
  in a fenced tree — keeps all four. Sharing the location data therefore now
  requires reconciling the two kind lists FIRST, as an explicit decision by
  whoever proposes it. The divergence is recorded in full in GE-125b-3's notes.
  Adopting a list, diverging from it, and merging the two records remain three
  different things, and only the first two have happened.

  SEQUENCING, recorded in prose deliberately and nowhere else: KI-SEC-001 asks
  that this hole be closed before GE-123d's widening is built on top of it. That
  is a scheduling preference expressed from this side of the fence. No depends_on
  edge into the GE-123 tree may be added to express it.
