id: BP-1000e
title: "Shipped workflow scripts match their tested source too"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Every deployed workflow script is provably identical to the source the maintainers edited.

  Workflow scripts ship as deployed copies alongside their canonical source, so
  a copy can quietly fall behind the version that was actually tested. This
  feature extends the source-to-shipped parity guarantee (BP-1000a) to the
  workflow-script mirror set: the canonical workflow source and its deployed
  copy must stay byte-for-byte identical, enforced mechanically, so a workflow
  edit that updates one but not the other is caught before it can ship a stale
  copy.
depends_on: [BP-1000]
