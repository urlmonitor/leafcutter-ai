id: TQ-400f-4
components:
  - testing_quality
  - ac_store
title: "A parent whose children cannot be worked out is reported as undecidable, never knocked back"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given finished parent records whose set of children cannot be resolved — one
    listing a child that names no record anywhere in the store, one whose child
    file is present but unreadable, and one that is reachable from itself through
    the child links,
  When the whole-store honesty sweep evaluates those parents and applies its
    outcome,
  Then each is reported under the sweep's existing "evidence not trustworthy"
    outcome, counted separately from both the parents judged complete and the
    parents judged to have unfinished work beneath them,
  And each of their files is byte-identical after the run: no demotion, no
    knocked-back reason, no date,
  And the report names, for each of them, the specific link that could not be
    resolved and the record it was found on, so the defect is fixed at its source
    rather than absorbed as a demotion,
  And a parent whose children ARE all resolvable, one of them unfinished, is
    demoted in that same run, so the undecidable outcome is shown to be a
    judgement about the evidence and not the sweep giving up.
depends_on:
  - TQ-400f
  - TQ-400f-1
  - TQ-400e-2
