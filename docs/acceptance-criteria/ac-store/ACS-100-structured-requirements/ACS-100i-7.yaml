criteria: |
  Given the acceptance-criteria store exactly as it stands, with no record
    edited and no record carrying `package_surface: true`,
  When every record in the store is validated in one pass,
  Then the number of records refused for lacking a structured implementation
    spec is zero,
  And that number was 243 on the same corpus before the change.

  And given the same pass,
  When its refusals are compared against the refusals recorded before the
    change,
  Then the remaining refusals are exactly the 37 that were failing for other
    reasons — the same file paths and the same messages, none added and none
    removed.

  And given the specific records BO-2000d-1, BO-2000d-2, BO-2000d-1-i,
    BP-006a-1 and BO-1800a-1 — all previously refused on this rule and none of
    them edited —
  When each is validated on its own,
  Then each is accepted.

  And given a commit whose diff contains one of those records unchanged
    alongside an unrelated edit elsewhere,
  When the commit-time acceptance-criteria check runs,
  Then it does not block, and no skip directive is needed to complete the
    commit.
