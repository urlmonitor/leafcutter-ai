roadmap_phase: phase_1
criteria: |
  Given the exemption mechanism is in place,
  When a reader consults the project's reference documentation for the reachability
    guard's exemption,
  Then a reference document states the exact shape of a recorded exemption — where it
    is recorded, the item it names, and the reason it carries,
    And it states that an exemption applies only to the item it names and confers
      nothing on siblings, folders, or later items reusing the name,
    And it states that an exemption with an empty reason does not exempt,
    And it states that every exemption in force, with its reason, appears in the
      guard's output on every run together with the total in force,
    And it states which refusals an exemption releases and which it does not,
    And it names the adjacent presence-only assertion waiver as a separate mechanism
      with a separate scope, so the two waiver vocabularies are not confused.
