notes: |
  The readiness scenario is deliberate and load-bearing. The lane's L1 promise says in
  terms that a not-yet-approved acceptance criterion is still built, and BO-2400f-2
  makes selection readiness-agnostic. A new pre-flight gate is the natural place for
  an approval check to reappear by accident — it sits in the same code path, reads the
  same records, and refusing unapproved work would look like prudence to a reviewer.
  Writing it down as a criterion is cheaper than finding it later.

  The default-producible scenario protects against the opposite over-reach. 87 not-done
  records carry test_required: false today; the great majority of the store carries no
  such field at all. A predicate that treats silence as a declaration would refuse
  nearly everything, and would do it on the first run after the change, which is the
  worst possible time to discover it.
