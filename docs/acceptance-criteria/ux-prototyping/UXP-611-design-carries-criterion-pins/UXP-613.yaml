title: "A rendered mockup names the screen it is, using the screen id the store already registers"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the screen registered in the product-truth store as `cart`
  When its rendered HTML file is written
  Then the page root element carries `data-screen="cart"`
  And that value is character-for-character the `screen` id in the screen's
    own *.mockup.json record — not a re-derivation from the file name, the
    title, or the artifact id

  Given a rendered mockup file
  When the file is inspected
  Then exactly one element in it carries `data-screen`
  And no element below the page root carries `data-screen`, so a rendered file
    can never claim to be two screens

  Given a rendered mockup whose `data-screen` value names a screen that no
    mockup record registers
  When the mockup is checked
  Then the mismatch is reported as a named defect identifying the file and the
    unresolvable value
  And it is never treated as a screen that merely has no design
