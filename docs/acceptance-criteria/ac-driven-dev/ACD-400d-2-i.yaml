notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Refines ACD-400d-2.

  ONE FIXTURE, TWO SEPARATE VERDICTS, AND THE XL PIECE IS WHY IT NEEDS TO BE ONE
  FIXTURE. A missing size and an unrecognised size are different author mistakes, and it
  is not obvious from the outside that they land in the same place. The XL piece is in
  the fixture to make the assertion discriminating: without it, "unreadable sizes come
  last" is indistinguishable from "unreadable sizes are treated as the largest size",
  which is a plausible and different rule that would order the list identically among
  the other three. With XL present, the two rules diverge and only the shipped one passes.

  THE STILL-OFFERED CLAUSE IS THE ONE THAT CARRIES RISK. The queue's two fields behave
  oppositely on unreadable input — an unreadable size demotes, an unreadable approval
  withholds entirely (ACD-400c-1-ii). Stating the size verdict as a demotion, explicitly,
  is what stops a future change from silently importing the approval field's harsher
  posture on the grounds that it is "more consistent".

  NO PRODUCT QUESTION IS RAISED FOR THIS FIELD. The equivalent question on the urgency
  field IS escalated (ACD-400d-4), because there a typo demotes work that an author
  believed they had marked critical. A mistyped size cannot misrepresent urgency, so the
  consequence is proportionate and the shipped behaviour is simply recorded.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L3.
