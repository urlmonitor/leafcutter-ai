assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    manifest_template_fingerprint_coverage:
      type: object
      description: "Manifest section recording a comparable fingerprint for every template artifact the build treats as managed, keyed by the artifact's repo-relative template path, so the template-drift gate can compare any inspected template rather than only the agent-template family."
  reference_file_path: "scripts/build_helpers.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The manifest writer currently records fingerprints for the agent-template family only; the recorded set must be derived from the same template inventory the build actually copies, not from a second hardcoded list that can drift from it."
    - "Coverage must be derived, not enumerated by hand: adding a new template family to the build must extend manifest coverage without a separate edit, or the omission must fail the build."
    - "Verify behaviorally — run the build, then execute the template-drift gate against a real staged template outside the agent-template family and assert the gate emits a match/drift verdict rather than an absent-from-manifest notice; do not grep the manifest writer's source."
    - "Must follow the repo error-handling policy: specific-exception try/except around file and JSON I/O, log at WARNING or higher or re-raise; no bare or silent excepts."
delivers_to:
  agent: python-coder
  contract: "A build manifest whose template-fingerprint section covers every managed template artifact, consumed by the template-drift gate to produce a match/drift verdict per inspected artifact."
