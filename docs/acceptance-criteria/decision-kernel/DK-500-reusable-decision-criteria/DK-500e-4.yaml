criteria: |
  Given reuse (DK-500d-1), the gap verdict (DK-500e-1), gap drafting (DK-500e-2), in-run grouping (DK-500b-4) and the empty-library branch (DK-500e-3),
  When a reader opens the sequence diagram of framing a decision with the criteria library,
  Then it shows, in order, the reuse of published categories, Jev's gap judgement, drafting by the host for the gap only, the grouping of drafted criteria, and the person's approval of proposals with the reused marks and the verdict,
  And it shows the empty-library branch, in which nothing is reused and no gap is judged,
  And it shows that the categories are read from the reviewed records and never from the run history.
