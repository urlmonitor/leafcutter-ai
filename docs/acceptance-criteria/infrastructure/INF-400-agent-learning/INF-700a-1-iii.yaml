declares_side_effect: false
it_requirements:
  - "THE HARVESTER DOES NOT NAME WHAT IT WROTE. scripts/knowledge/harvest_learnings.py prints HarvestResult.summary() as one prose line and logs per-event destinations only at DEBUG under --verbose, for every unprocessed event rather than only the ones it wrote. So the routing agent observes the writes instead: it snapshots git status --porcelain --untracked-files=all immediately before and after the harvester command and reports the paths whose entry is new as written_paths. A destination that was already dirty before the harvester ran is not detected this way; the machine-readable manifest INF-700a-5's it_requirements call for is the complete answer and stays with that AC."
  - "Confined to templates/workflows-js/quick-fix.js. The other completion paths and the commit prompts generally are INF-700a-5's wiring."
  - "Fail-open: the routing reply is classified by the existing classifyKnowledgeRouting(); only a recognised case contributes paths, and any malformed entry is dropped rather than failing the run."
delivers_to:
  agent: python-coder
  contract: "A fix commit on the quick-fix path that publishes the routing step's in-worktree writes"
expects_from:
  ac_id: INF-700a-1
  contract: "The routing step dispatched before the path's own commit, which this AC makes that commit consume"
