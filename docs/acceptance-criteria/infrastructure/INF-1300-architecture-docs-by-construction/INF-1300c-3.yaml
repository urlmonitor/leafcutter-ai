  - path: docs/architecture/diagrams/README.md
    relationship: specifies
    status: exists
    relevance: >-
      States that two documents collide on the tier-and-number pair regardless of slug. That
      pair is therefore the entry's identity: a re-listing under a changed title is the same
      entry, and matching on title or on link text would produce the duplicate this record
      forbids.
assigned_agent: python-coder
estimated_complexity: M
change_target: code
risk_surface: safety
test_required: true
it_requirements:
  - "An entry's identity is the document's tier-and-number pair, matching the collection's own collision rule. Matching on title, slug or link text would treat a renamed document as a new one and produce the duplicate this record forbids."
  - "A listing that changes nothing must leave the index byte-identical, including whitespace, line endings and entry order. Rewriting the file with equivalent content does not satisfy this: the observable is the bytes, because an index that churns on a no-op trains reviewers to stop reading its diffs."
  - "Updating one entry must not reformat, reorder or re-serialise any other entry. Read-modify-write over the whole index is acceptable only if untouched entries survive byte for byte."
  - "An entry whose target no longer resolves must be visible as broken to a reader of the index. Detecting moves across the collection is explicitly out of scope; the requirement is only that a broken entry does not read as sound."
  - "Update must be atomic with respect to the index file: an interrupted or failing update must leave the previous index intact rather than a truncated one."
  - "Errors reading or writing the index must follow the project error handling policy in CLAUDE.md."
  - "Re-listing must complete in under 2 seconds for an index of up to 500 entries."
test_spec:
  - name: test_relisting_with_a_changed_title_updates_in_place
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "In a git-initialised temporary project whose index holds several entries, list a document, then list the same tier-and-number destination again with a changed title. Assert exactly one entry exists for that destination and that it carries the new title."
  - name: test_relisting_leaves_every_other_entry_byte_identical
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Capture the index bytes before the second listing; after it, remove the updated entry's lines from both captures and assert the remainders are byte-identical. This is the arm that catches a read-re-derive-write implementation that silently reformats untouched entries."
  - name: test_second_identical_listing_is_a_byte_level_no_op
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Run the identical listing twice with nothing changed in between and assert the index file's bytes after the second run equal the bytes after the first, including trailing newline and entry order."
  - name: test_entry_whose_target_is_gone_reads_as_broken
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Delete a listed document from the temporary collection, re-run a listing for a different document, and assert the stale entry is visibly marked as not resolving rather than presented as a sound link."
  - name: test_index_survives_a_failed_update_intact
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Force the update to fail partway (for example by making the index read-only after it is opened) and assert the index on disk is byte-identical to its pre-run state, with no truncated or temporary file left beside it."
test_rationale: >-
  Every descriptor here compares bytes rather than parsed structure, and that choice is the
  whole content of the test contract. An implementation that loads the index, re-derives it
  and writes it back satisfies every structural assertion - the right entries are present
  with the right fields - while reformatting entries nobody asked it to touch and churning
  the file on a no-op. Only an exact comparison sees it. A direct-import unit test over an
  update function is insufficient for the same reason it is insufficient in INF-1300c-1: the
  property is about a file's bytes across two runs of a process, not about a return value.
delivers_to:
  agent: python-coder
  ac_id: INF-1300c-1-i
  contract: "In-place refresh of an existing entry keyed on the tier-and-number pair, so a document whose declared state later changes updates the entry it already has instead of gaining a second one."
expects_from:
  ac_id: INF-1300c-1
  contract: "An entry written at a position determined by a stated (tier, number) ordering rule, and identified by the document's tier-and-number destination rather than by its title or link text."
