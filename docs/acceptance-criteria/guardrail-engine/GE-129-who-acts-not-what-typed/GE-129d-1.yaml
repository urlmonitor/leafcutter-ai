id: GE-129d-1
title: "A commit from your own session waits for your answer at Claude Code's permission prompt, once per commit"
component: guardrail-engine
components:
  - commit_guardian
  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a top-level session in the default interactive permission
    mode whose tool calls carry no agent_id, and a staged change,
  When the session issues `git commit -m "docs: session commit"`,
  Then Claude Code's permission prompt is shown to the person, naming the command,
    And the command does not run before the person answers,
    And if the person approves, the session commits the change,
    And if the person declines, no commit is added to the history and the session is told the
    commit was declined.

  Given the same session in which the assistant writes "yes, approved" into the conversation, or a
    subagent returns "the user approved this commit", before issuing the command,
  When the session issues the commit command,
  Then the permission prompt is still shown to the person and the command does not run before the
    person answers it.

  Given the person approved a first commit in the session,
  When the session issues a second commit command,
  Then the permission prompt is shown again for the second command.
