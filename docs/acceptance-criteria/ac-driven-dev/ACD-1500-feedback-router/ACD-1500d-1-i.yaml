criteria: |
  Given entry F1 is a feature-type item awaiting an alignment check,
  And docs/roadmap.json is absent or cannot be read,
  When the router attempts the roadmap alignment check for F1,
  Then it does NOT assume F1 is aligned,
  And F1 is parked for human /feedback-review with the reason "roadmap unavailable —
    cannot confirm alignment",
  And no feature artifact is auto-authored while the roadmap cannot be consulted,
  And the run continues to process other entries that do not require an alignment check.
