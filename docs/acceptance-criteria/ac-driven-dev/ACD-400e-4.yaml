id: ACD-400e-4
components:
  - ac_driven_dev
title: "The account states how the fast lane's approval posture differs from the backlog queue's, and the difference is demonstrable"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given one store holding two pieces of leaf-level work, identical but for the
    approval recorded against them — one draft, one approved,
  When the build backlog queue is asked which work is ready, and separately the fast
    lane is pointed at the draft piece to resolve the connected set it would build,
  Then the backlog queue offers the approved piece and withholds the draft one,
  And the fast lane returns the draft piece,
  And the written account of how work is chosen states this difference and the reason
    for it — that pointing the fast lane at a piece of work is itself the go-ahead
    that the backlog queue requires a recorded approval for,
  And the account confines the difference to the fast lane's connected-set selection:
    the fast lane's whole-store batch selection applies the same approval requirement
    the backlog queue does, so the account does not claim the fast lane is indifferent
    to approval as a whole.
depends_on: [ACD-400e, ACD-400e-1a, ACD-400e-1b, ACD-400c-1]
