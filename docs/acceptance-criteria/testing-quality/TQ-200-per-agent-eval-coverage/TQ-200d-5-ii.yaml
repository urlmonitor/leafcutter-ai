    The IT PO decides the setting's form (environment variable or eval config
    key) and name, and how a resolved .cmd is started (through the shell or by
    preferring a native claude.exe). A .cmd started through the shell must not
    reintroduce the command-line limit TQ-200d-5 removed: the instructions
    still do not travel on the command line.
  - >-
    Unit tests patch the lookup and the process start; they prove a .cmd-only
    path is started, the setting wins over the path, and Linux behaviour is
    unchanged. No test calls a live model.
