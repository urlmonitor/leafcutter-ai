notes: |
  WHY THIS LEVER IS DIFFERENT FROM EVERY OTHER CHILD OF TQ-600a. The rest of this L1
  is about not repeating an expensive deploy. This one is about a single operation
  being 13x slower than it needs to be in a library the package already depends on.
  Three consequences follow, and they are the reason it should be built first:

    - IT DOES NOT DECAY AS THE TQ-600a MIGRATION LANDS. The deploy-sharing levers are
      worth less as the migration completes. The store is not a build artifact; it
      only gets bigger. 3,340 records in August, 4,635 in October — a 39% rise in
      seven weeks. Every month this is deferred, it is worth more.
    - IT IS PARTLY A CORRECTNESS CONCERN, NOT ONLY A SPEED ONE. The done-proof gate
      runs an AC's linked tests under a 60 s budget. A test that sweeps the store
      inside that budget is on a timer, and when it trips, the gate reports every
      linked test as "not run" — which reads as a COVERAGE FAILURE, not as a timeout.
      That is a false phantom-done signal produced by a parser. One author already
      worked around it with a raw-text pre-filter; at 1.86 s a sweep the workaround
      is unnecessary.
    - IT PAYS OUTSIDE THE TEST SUITE. The required "AC store valid" pull-request
      check and the AC pre-commit hooks both pay it, on every pull request and every
      commit respectively.

  PLACEMENT, STATED HONESTLY. This record and its three children are filed under
  TQ-600a because TQ-600a is where the suite-cost work lives and the user needs this
  built now. It is an imperfect fit: TQ-600a's criteria name SHARING as the mechanism
  ("produced once and shared"), and a parse cannot be shared across operating-system
  processes — this lever makes the work cheap rather than making it happen once. The
  natural home is a fourth L1 under TQ-600 along the lines of "the tools stop reading
  the store the slow way", which only the product owner may author. Re-parenting is
  two fields (this record's depends_on and the parent's covered_by) and should happen
  at the next PO pass over the TQ-600 tree.
