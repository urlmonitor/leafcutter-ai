id: TQ-300b-2
title: "Selection-criteria evaluation and its DSL are covered by tests"
component: testing-quality
components:
  - testing_quality
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: code
risk_surface: internal
criteria: |
  Given a selection-criteria DSL expression that a candidate ticket-context
    fully satisfies,
  When evaluate runs against that context,
  Then it returns a positive match result.

  Given a selection-criteria DSL expression that a candidate ticket-context does
    not satisfy,
  When evaluate runs against that context,
  Then it returns a negative (non-match) result.

  Given DSL expressions that combine conditions with AND and with OR,
  When evaluate resolves them,
  Then the boolean outcome follows the declared logical composition for each
    combination (AND binds tighter than OR).

  Given a criterion that cannot be resolved deterministically and requires a
    model judgement,
  When evaluate encounters it,
  Then it raises LLMEvaluationRequired rather than silently returning a match or
    non-match.
depends_on:
  - TQ-300b
