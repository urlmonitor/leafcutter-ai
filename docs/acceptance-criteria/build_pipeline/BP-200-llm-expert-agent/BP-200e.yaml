id: BP-200e
title: "Prompt quality problems are caught at authoring time, not at runtime"
component: build-pipeline
level: L1
status: active
req_status: active
work_status: done
criteria: |
  Shift-left for prompt quality — mistakes surface before they reach production.

  Instead of discovering that an agent misbehaves because its instructions
  violate a convention, the specialist catches the violation during the
  authoring phase. This eliminates the feedback delay between writing a
  prompt and learning it was wrong, reducing rework across the entire
  agent development cycle.
