notes: |
  Measured on origin/main 67a7b443 (2026-11-16), fixture repo holding only docs/ and
  project.txt: cProfile of a full build showed 1,606 parse_frontmatter calls
  (29.6 s cumulative of 56.5 s profiled), 1,574 of them reaching yaml.load. Counting
