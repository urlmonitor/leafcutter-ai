notes: |
  Split out of BO-2900f-2 on 2026-08-13 (expert review). In its parent the halt
  case sat inside a Then block whose Given described a COMPLETED run, next to the
  clause "no requested gate is left with zero entries" — a direct contradiction
  that made neither clause testable.

  WHY THE CARVE-OUT NEEDS ITS OWN NEGATIVE SCENARIO. Without the second scenario
  the carve-out is an unbounded excuse: any missing entry can be attributed to a
  halt nobody has to evidence, which reproduces the silence BO-2900f exists to
  end. Pairing "no entry + halt recorded = legitimate" with "no entry + no halt
  record = defect" is what makes the parent's count invariant enforceable rather
  than advisory.

  BOUNDARY vs the parent: BO-2900f-2 owns the completed run and asserts a COUNT.
  This L3 owns the aborted run and asserts an EXPLANATION. An implementation that
  satisfies one and not the other has not landed the guarantee.
