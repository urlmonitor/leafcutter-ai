estimated_complexity: S
it_requirements: |
  `cp --reflink=auto` silently degrades to a full copy on non-CoW filesystems; the
  strategy layer must detect reflink UNsupport explicitly and prefer the
  reference+dissociate clone over an accidental full byte copy, so the intended
  ordering is honored. IT-PO: decide the reflink-capability probe.
