assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  The trigger closure is DATA, not code: each agent entry in
  scripts/evals/agent_eval_config.json carries a `triggers` list of repo-relative
  globs covering its template, the shared instructions/skills it loads, the
  schema(s) it satisfies, the oracle artifacts its golden cases derive from, its
  eval set, and the shared harness (run_agent_eval.py) + config. A selector (later
  ticket) intersects a change/diff file list against each agent's globs to compute
  the affected-eval set; only affected evals run but ALL affected ones do. The run
  report enumerates ran vs skipped-as-unaffected so truncation is visible, never
  silent. This AC delivers the trigger MANIFEST (the globs); the selector that
  consumes it is out of scope here.
delivers_to:
  agent: eval-runner
  contract: "Per-agent dependency-closure trigger globs the selector intersects against a change to compute the affected-eval set."
