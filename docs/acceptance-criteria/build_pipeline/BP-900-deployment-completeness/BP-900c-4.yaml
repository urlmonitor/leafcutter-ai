test_spec:
  - name: test_one_report_assigns_three_remediations_by_entry_state
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "One build run over a tree seeded with all three states emits three entries whose suggested_action values are three DIFFERENT strings, each matched to its own missing_path: the individually-declared deleted path carries the declaration-already-exists remediation (naming the declaration and both resolutions), the source-directory-plus-directory-phase path carries BP-900c-3's commit-the-source remediation, and scripts/brandnewtool/run.py carries BP-900c-3-i's add-a-deploy-phase remediation; the declared path's entry must NOT carry the add-a-deploy-phase text. All three are asserted from the one report, so an implementation emitting the corrected text unconditionally fails."
  - name: test_three_entries_are_parsed_from_build_py_stderr_jsonl_subprocess
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "python scripts/build.py --target-dir <seeded tree>, run as a subprocess"
    description: "The entries under assertion are parsed as JSONL objects from the stderr the build itself wrote when invoked through its real entry point, and the run exits non-zero. Calling the remediation selector directly, reading a log line, or asserting only that a finding was emitted does not satisfy this test — the current implementation already emits a well-formed record with an accurate missing_path, so those assertions are green against the broken code."
  - name: test_declared_path_case_reproduces_against_the_real_knowledge_scripts_declaration
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The declared-path fixture is the real 2026-08-31 case: a copy of the actual package tree with scripts/knowledge/harvest_learnings.py deleted, the real knowledge-scripts declaration in scripts/build_phases.py still naming that exact path, and the real template agents/knowledge-harvester.md still referencing it — not a hand-authored declaration module, which would reproduce the directory-shaped bias that hid this defect."
  - name: test_every_emitted_entry_still_has_exactly_the_three_keys
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: boundary
    description: "Every entry in that same run has exactly the key set {missing_path, referencing_template, suggested_action}, asserted as set equality rather than containment, so the new branch is proven to change a value and not the schema BP-900c-2 fixed — and no check-identifying fourth key has been added."
test_rationale: |
  Two false-green shapes have to be excluded, and each needs a specific test shape.

  A test that asserts "a finding was emitted", or that the corrected remediation text
  appears somewhere in the report, is green against BOTH the current broken code and the
  fixed code: the build already emits a well-formed JSONL record with an accurate
  missing_path for this path, and only the VALUE of suggested_action is wrong. So the
  emitted record must be parsed from a real build invocation (the reachability entry) and
  the assertion must be on which value landed on which entry.

  A single-entry assertion is green against an implementation that emits the corrected
  text unconditionally — which would silently make the other two states wrong while every
  existing BP-900c test stayed green, because each of those inspects only its own entry.
  So the unit of assertion is one run containing all three states with three distinct
  values (the criterion entry).

  real_artifact is charged because the incumbent predicate's defect IS a fixture-shape
  bias: it recognises directory-shipping phases, and a hand-written declaration stub would
  most likely be written in that same shape. boundary is charged for the exact-three-key
  set equality, which is the only assertion that would fail if a coder resolved the state
  by adding a fourth key instead of by consulting the declarations.
