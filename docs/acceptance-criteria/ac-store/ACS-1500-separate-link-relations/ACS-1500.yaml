notes: |
  New root L0 in ac-store, authored 2026-09-08 (product-owner, on BrainCandy's
  ruling), slug folder ACS-1500-separate-link-relations/. Next free hundred —
  100 through 1400 are occupied; ACS-1500 verified free by grep across docs/,
