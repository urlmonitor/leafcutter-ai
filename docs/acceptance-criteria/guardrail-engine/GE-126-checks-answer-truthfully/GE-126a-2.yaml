id: GE-126a-2
title: "A target you named that resolves to nothing is a caller error and never a pass"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the deployed AC-governance check is invoked out of process and named exactly
    one target that resolves to no file — a path that does not exist on disk,
  When the check finishes,
  Then it reports that the target it was named could not be resolved and names that
    target verbatim in what it reports,
  And the outcome value it reports is not the ordinary success value a clean run
    produces so no caller can read it as a pass,
  And in the same run no acceptance-criterion record anywhere in the store is treated
    as having been inspected,
  And when the same invocation names two targets of which one resolves to a record
    that genuinely violates the rule and one resolves to nothing the run both refuses
    the violating record by name and reports the unresolved target by name rather than
    reporting only one of the two.

  Coverage note: covered only by a test that executes the deployed check in a separate
  process with an unresolvable target and asserts on the outcome value and the named
  target. The mixed-target arm is not optional — it is what prevents an implementation
  that abandons the whole run at the first unresolvable target and so stops inspecting
  the records it could have inspected.
