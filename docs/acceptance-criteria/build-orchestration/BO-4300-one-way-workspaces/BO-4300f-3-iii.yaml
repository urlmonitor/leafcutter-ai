change_target: code
risk_surface: safety
criteria: |
  Given four old-style workspaces -- "m" in the middle of a merge with an
    unresolved conflict, "s" whose line of work has a stashed change, "i" holding
    a change staged for commit but not committed, and "l" locked by its user with
    the reason "on USB drive" --
  When the cut-over is run,
  Then "m", "s" and "l" are each left untouched and listed as needing a decision,
    each with the reason it was kept,
  And "i" is either brought over with the change still staged and its content
    identical, or left untouched and listed as needing a decision,
  And no folder, register entry, stash entry or branch of the four is changed,
    even where nothing of it is unsent.
