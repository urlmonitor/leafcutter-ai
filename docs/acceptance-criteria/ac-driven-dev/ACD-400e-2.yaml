assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Every pytest invocation used to run or verify this check must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "AMENDING A CRITERIA BODY REQUIRES AN AUDIT-TRAIL ENTRY OR THE COMMIT IS REFUSED. check_ac_governance.py treats `criteria` as a protected field and, on any change to an existing record's criteria, requires that record's `amended_by` list to gain a NEW entry relative to HEAD (ACS-400c-2 / ACS-400c-2-i — a list that exists but is not extended is refused just as an untouched one is). All three amended records need their own new entry in the same commit. This is the gate that actually runs and nothing in the criteria mentions it."
  - "THE AMENDMENT MUST BE MADE UNDER AN IDENTITY THE GOVERNANCE GATE AUTHORISES. check_ac_governance.py permits protected-field writes only from product-owner, business-analyst, it-po, or an identity absent from agent_registry.json (i.e. a human). A coder identity present in the registry is refused. If the implementing agent runs with its own identity set, the amendment half of this AC is blocked and must be escalated rather than worked around by unsetting the identity."
  - "`amended_by` is the ONLY lifecycle-adjacent field this AC may write, and it may write it only as the audit trail the gate above demands. ACD-400a is work_status: in_progress after a documented correction from a false done; work_status, readiness, req_status, status, priority and covered_by on all three records must be identical before and after."
  - "The red baseline must be captured with the SAME check that later reports green — not a separate ad-hoc probe. Run it against the three records as they stand, record the three disagreements it reports, then amend, then re-run. Two different checks either side of the change prove nothing about the change."
  - "The queue must be untouched. scripts/ac_store/scan_ac_store.py must be byte-identical before and after this AC, and the offer it returns for any store must be unchanged. Making the record and the queue agree by editing the queue satisfies every clause of the criteria and silently redirects every subsequent build — it is the specific hazard ACD-400c was raised to close."
  - "The check must reach its verdict by building the store each record describes and asking the queue, never by comparing the record's wording against the scanner's source text. Both sides here are text, which makes this an unusually inviting place to write a check that passes on dead prose."
  - "Reuse the checker delivered by ACD-400e-1b rather than authoring a second, parallel comparison. Two independent implementations of prose-versus-queue agreement will disagree with each other before either disagrees with the queue."
