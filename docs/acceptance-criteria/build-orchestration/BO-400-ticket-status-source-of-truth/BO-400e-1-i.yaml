id: BO-400e-1-i
components:
  - build_orchestration
  - supervisor_system
title: "A phase that finished by handing work on has finished, provided the work was actually picked up"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose record shows a phase that completed by handing its work to a
    named sibling rather than by finishing outright,
    And the sibling it named subsequently recorded a passing outcome of its own,
    And nothing afterwards returned work to the first phase,
  When the close of that ticket is decided,
  Then the handing phase counts as accounted for,
    And it is not reported as outstanding merely because the last thing it recorded
      was a handover rather than a completion,
  And given a second ticket whose record shows the same kind of handover but where
    the named sibling recorded nothing afterwards, or recorded a failure,
  When its close is decided,
  Then the handing phase IS reported as outstanding, and the refusal names it,
  And given a third ticket in which a phase handed work on and was later handed work
    back by a reviewer, and has recorded nothing since,
  When its close is decided,
  Then that phase is outstanding too, because the last thing the record says about it
    is that somebody wanted more from it,
  So a handover is read as what the sign-off protocol says it is -- a phase that
    completed and passed the baton -- while a baton nobody picked up still stops the
    close, and neither case depends on the handing phase being asked to speak again.
