notes: |
  SCOPE: the closing commit only. A merge commit made while catching up with main belongs to the
  future "catching up with the shared line safely" sibling of BO-4500a (C6's sync_with_main) and is
  out of scope here, as is the PR step. Finalize has no AC id for a run, hence the run name.

  The unrelated-epic scenario is the cross-epic closure shape the user's memory records against
  finalize step 3.5 (flips every inbox ticket). Explicit paths stop the COMMIT carrying it; whether
  step 3.5 edits those files at all is a separate finalize defect, not closed here.
