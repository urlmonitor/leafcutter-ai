test_spec:
  - name: test_opaque_credential_in_a_ticket_is_reported_and_blocks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "A real ticket Markdown file staged in a temporary git repository, carrying a credential keyword and a quoted sixteen-character value matching no recognised shape, makes the canonical pre-commit check exit 1 and print the file path with its 1-based line number"
  - name: test_one_exempt_line_does_not_carry_the_file_out_of_scope
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged acceptance-criteria-store file with a words-shaped value and, three lines later, the opaque credential produces exactly one finding, at the credential's line number, and exit status 1"
  - name: test_private_key_and_cloud_access_key_still_reported_in_prose
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged ticket Markdown file carrying a private-key header line and a cloud access key in the AKIA form yields both findings and exit status 1 — only one rule was widened"
  - name: test_a_single_appended_space_does_not_make_a_credential_word_shaped
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Three staged retrospective files carrying the opaque value with one space appended, one prepended and one embedded are each reported and each block — the whitespace shape is not satisfiable by one keystroke"
  - name: test_unclassifiable_value_defaults_to_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "A staged prose file whose quoted value resembles no entry in the shape vocabulary is reported and blocks — the closed list fails closed, and the residual cost the AC accepts is the observed behaviour rather than an intention"
test_rationale: "This is the counter-arm for the whole GE-123d widening, so the standard of proof is higher than for the ACs it guards, not lower. Each entry runs the canonical templates/ copy of the pre-commit check as a subprocess against real files staged in a throwaway git repository and asserts on the process exit status, because the specific thing being claimed is that the commit is blocked — an exemption predicate returning false proves only that the predicate answered, and cannot distinguish a finding that was correctly retained from a finding the run never produced. The per-finding entry asserts an exact count of one for the same reason: both zero and two are reachable from plausible implementations, and an assertion of at-least-one would pass on the file-level shape this AC exists to forbid. All five entries must be red before the implementation lands, and specifically must fail against a file-level exemption and against a naive contains-whitespace test; a suite that stays green against either of those has not discharged the AC."
