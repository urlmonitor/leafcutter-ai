notes: |
  THE ROSTER IS NOT THE DEFECT and no part of this criterion opens it or defaults new
  checks into it. Not every check should have a fixer dispatched at it and a closed roster
  is the right design — ADR-035 is the precedent for a roster made data while staying
  closed. The defect is that membership is a registration leg the procedure that exists to
  enumerate the legs does not mention.

  WARNING NOT BLOCK — the L1 decides this and this record records the decision. Exclusion
  is legitimate, so the omission must be reported by name alongside the route rather than
  refused. The criterion is that the choice becomes explicit, not that it becomes
  forbidden.

  THE SILENCE OF THE ALREADY-REGISTERED CHECKS IS AN ASSERTION AND NOT A COURTESY. The
  L1 calls them the regression boundary. Without that clause the cheapest passing
  implementation prints the same advisory for every check in the manifest, which is
  indistinguishable from noise and will be suppressed within a week — the fate KI-CG-017
  records for a detector whose verdict arrived in the wrong form.

  THE FIXTURE MUST BE REGISTERED THE DOCUMENTED WAY rather than hand-placed. The L1 is
  explicit that the acceptance shape is the omission and not the procedure text: a test
  asserting the procedure document mentions a fourth step passes on a sentence nobody
  reads.

