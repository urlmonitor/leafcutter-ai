notes: |
  RELOCATED FROM BO-3200f-2-ii (user decision, BrainCandy, 2026-09-17). The user chose to
  home the live-dispatch harness in testing-quality now. BO-3200f-2-ii's five scenarios
  split along the line TQ-600a's notes drew: scenarios 1, 2, 4 and 5 name no agent and
  moved here; scenario 3 (the executor's declining charter makes BO-3200f-2's first live
  scenario fail) and the list of the executor's live scenarios stay in build-
  orchestration as the first consumer.
    - BO-3200f-2-ii scenario 2 (the real agent, pass/fail on its own reply) -> this record,
      first scenario, generalised from "the three live scenarios / the executor" to "a
      case / the agent it declares".
    - BO-3200f-2-ii scenario 1 (switched off) -> TQ-600a-1-i.
    - BO-3200f-2-ii scenario 5 (switched on, cannot ask) -> TQ-600a-1-ii.
    - BO-3200f-2-ii scenario 4 (evidence record) -> TQ-600a-2.

  WHAT WAS ADDED IN GENERALISING, AND WHY.
    - "no score, threshold or averaging" was an IT PO it_requirement on BO-3200f-2-ii
      (PASS/FAIL PER SCENARIO, NO SCORE). It moves into criteria because it is now the
      defining boundary of this L1 against TQ-200 (TQ-200c amendment 2026-09-17).
    - The changed-instructions scenario is the general form of BO-3200f-2-ii's
      discriminator. The executor's version asserts a verdict (the scenario fails naming
      the decline) and stays in BO-3200f-2-ii. The general version asserts only that the
      second request runs under the changed instructions, which any agent can show,
      and which the old seam test on the invocation already specified.
    - The two-agents scenario is BO-3200f-2-ii's AGENT-AGNOSTIC MECHANISM it_requirement,
      moved into criteria because generality is the reason this record lives here. The
      executor is the first user, not a special case. BO-3200f-2-ii's WHY THE CRITERIA
      NAME THE THREE SCENARIOS note said the mechanism must not become executor-specific;
      this scenario makes that testable.

  WHY THE WORD "live-dispatch switch" SURVIVES. "Live dispatch" stays plain words; it is
  not a proof kind, angle or schema value (BO-2900g-3). Keeping the phrase lets the
  consumers' existing descriptors read unchanged.

  declares_side_effect: false -- no Then clause here asserts a durable effect. The
  evidence record is TQ-600a-2's.

  NOT COVERED, DELIBERATELY. How often an agent passes across many runs: a reliability
  rate is a scored question and belongs to TQ-200 (TQ-600 BOUNDARIES). Which agents and
  which cases are asked: declared by each consumer (today BO-3200f-2-ii).

  FOR THE IT PO. BO-3200f-2-ii carries a full IT PO enrichment for this mechanism
  (it_requirements, delivers_to, expects_from, test_spec, test_rationale, six added
  doc_links). It is NOT copied here, on purpose: IT PO fields are the IT PO's to carry
  over. See BO-3200f-2-ii's 2026-09-17 business-analyst amendment for the item-by-item
  list of what goes to which new record.
