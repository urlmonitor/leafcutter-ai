title: "implements_pattern referencing a deprecated pattern is rejected"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a pattern AC (PTN-001) has status: deprecated,
  And a new AC is authored with implements_pattern: "PTN-001",
  When the schema validator runs at commit time,
  Then the commit is blocked with an error stating:
    "implements_pattern references deprecated pattern PTN-001;
    use its successor (see PTN-001 superseded_by field) or remove the reference"
  And the error names the consuming AC file path.
