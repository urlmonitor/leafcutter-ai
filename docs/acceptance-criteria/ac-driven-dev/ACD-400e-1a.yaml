notes: |
  CREATED 2026-09-08 by IT PO v3 as one half of a split of ACD-400e-1 (now
  status: superseded_by). Sibling: ACD-400e-1b.

  WHY THE SPLIT. ACD-400e-1 as the BA wrote it carries two deliverables in two
  file types owned by two different agents: a written account in a Markdown
  reference page, and a verification harness that builds a store from each
  statement, executes the queue and reports disagreements. documentation-expert
  cannot author the harness and python-coder should not be authoring the
  reference prose. Left whole, the AC was also circular against ACD-400e-3: its
  last clause requires a disagreement REPORT that nothing in the tree builds
  until ACD-400e-3, which depends on ACD-400e-1 completing first.

  Splitting resolves both. This AC owns the account and, critically, the SHAPE
  of the account — the machine-readable verdict block that makes the prose the
  source a checker reads rather than a copy a checker duplicates. ACD-400e-1b
  owns the checker. ACD-400e-3 then extends the checker with the drift
  properties rather than inventing it.

  CRITERIA ARE VERBATIM. This AC holds the Given clause and the first Then
  clause of ACD-400e-1 unaltered; ACD-400e-1b holds the same Given plus the
  remaining When/Then/And clauses unaltered. Their union is the original text.
  No behaviour was invented, narrowed or added in the split.

  DISCHARGES ACD-400e'S reference-doc TRIGGER. ACD-400e declares
  documentation_triggers: [reference-doc]; this AC is that deliverable, and the
  S7b documentation gate is satisfied by it. No separate documentation AC is
  authored, for the reason ACD-400e-1's notes gave and this split does not
  change: a second record describing the same page would recreate the
  divergence the tree exists to end.
