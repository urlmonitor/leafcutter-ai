it_requirements:
  - "HOME: docs/architecture/components/commit-guardian.md, with the diagram reachable from that component page — not filed only under a testing document, which is the criterion's last clause. docs/architecture/components/worktree-manager.md is the related page for the copy-creation path and should cross-link."
  - "SATISFY THE DIAGRAM GATES IN THE SAME CHANGE: check_mermaid_drift, check_mermaid_parent_link, check_mermaid_complexity and check_diagram_naming all fire on diagram commits. Parent-link and naming conventions are enforced mechanically, so a diagram that reads well but breaks them will not land."
  - "NODES THE DIAGRAM MUST CONTAIN, drawn from the harness AS BUILT rather than as intended: the harness in unit_tests/portability/; the second working copy it creates; build.py producing the .leafcutter deployed layout inside that copy; the run_hook.py subprocess invocation of each deployed check (plus the direct-script shape used by precommit-canary); and hooks_manifest.hooks[] in templates/scripts/commit_guardian/commit_guardian.json as the coverage source."
  - "THE LOAD-BEARING ELEMENT IS THE CONTRAST. Show the existing in-process unit tests (unit_tests/commit_guardian/, importing from the source tree) BESIDE the out-of-process path, and mark explicitly which one can observe this defect class and which cannot. A diagram without that contrast does not satisfy the criterion — the reason the defect survived is that a reasonable engineer saw a directory full of passing tests and concluded the checks were covered."
  - "Draw the source-tree boundary that does not cross into the process under test as an EXPLICIT boundary element, since that boundary is the single property the harness exists to enforce."
  - "SEQUENCE AFTER GE-120c-1 IS BUILT. A diagram of the author's intention has to be corrected later, and in practice is not."
