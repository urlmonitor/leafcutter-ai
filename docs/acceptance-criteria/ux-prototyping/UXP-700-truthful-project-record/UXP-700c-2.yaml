id: UXP-700c-2
title: "The record states what it was last confirmed against, and says so when that has moved"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a journey that describes behaviour implemented by a set of acceptance criteria and by
    files in the project,
  When the record is checked,
  Then each journey states the state of the things it describes at the moment it was last
    confirmed against them,
  And a journey whose described things have changed since that moment is reported as behind,
    naming the journey and each described thing that changed,
  And a journey whose described things have not changed since that moment is not reported,
  And the check states how many journeys it compared, and that figure rises by one when a
    journey is added.
depends_on:
  - UXP-700c
  - UXP-700c-1
created_by: "docs/acceptance-criteria/ux-prototyping/UXP-700-truthful-project-record/UXP-700c.yaml"
