criteria: |
  Given a reader wants to see where committing happens after the migration,
  When they open the component diagram,
  Then it shows the shared commit step as one component, and every route that reaches it --
    plan-feature, quick-fix, fast-lane-ship, finalize-feature and build-feature -- with a
    connection to it through the commit agent,
  And it shows the commit agent's remaining responsibilities as message authoring and autofix
    judgement, and the step's as staging, checks with one retry, branch refusal and the answer,
  And it shows the project's checks and the commit serialisation guard as components the step
    uses,
  And it shows no connection from any route to the version-control system that bypasses the
    step.
