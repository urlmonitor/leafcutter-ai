test_spec:
  - name: test_write_emits_exactly_the_bytes_of_its_content
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: unit
    description: "Writing LF content through the build's text writer leaves a file whose bytes equal the content's UTF-8 encoding exactly -- no CR inserted."
  - name: test_forced_rewrite_repairs_a_line_ending_only_divergence
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: unit
    description: "An existing file holding the CRLF spelling of the content is rewritten to the LF bytes on a forced run, instead of being counted unchanged. Fails on every platform against the text-mode comparison, since read_text normalises CRLF everywhere."
  - name: test_byte_identical_file_is_still_skipped
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: unit
    description: "A file already byte-identical to the content is skipped and counted as up to date, so the byte comparison introduces no churn."
