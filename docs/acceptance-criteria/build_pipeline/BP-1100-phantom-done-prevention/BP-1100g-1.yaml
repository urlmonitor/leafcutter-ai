id: BP-1100g-1
components:
  - build_pipeline
  - testing_quality
  - llm_authoring
title: "Every kind of proof the plan can ask for is a kind the test writer has been taught"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the planning side can request a proof by any name drawn from its own set of
      kinds,
    And the instructions the test-writing side works from define some set of names,
  When the two sets are compared against each other,
  Then they are the same set — no name the planning side can emit is undefined for
    the test-writing side, and no name the test-writing side is taught is one the
    planning side can never emit,
    And for each name, the instructions state what distinguishes a proof of that
      kind from a proof of the behaviour alone, in terms the writer can act on
      without further interpretation,
    And when a name is added to either side while the other is left alone, the
      mismatch is reported naming that specific name and the side that lacks it,
    And the comparison reads both sets from where they really live, so a copy of
      either set made for the comparison's own convenience cannot make the two
      agree while the real sources disagree.
