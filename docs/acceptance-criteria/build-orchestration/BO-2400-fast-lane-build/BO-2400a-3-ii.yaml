id: BO-2400a-3-ii
components:
  - build_orchestration
  - testing_quality
title: "Newly-added covering tests are derived from git at test-function granularity"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fast-lane worktree branched from origin/main, whose merge-base with
    origin/main is commit M,
  And the batch's covering tests are the test functions carrying a "# covers:" tag that
    names one of the batch acceptance-criterion ids,
  When the red-baseline gate assembles the baseline set for the batch,
  Then every covering test function that is absent from the version of its file at M is
    classified newly-added — including test functions in files that are untracked in the
    worktree and test functions that are still uncommitted,
  And every covering test function that is already present at M is classified
    pre-existing,
  And the two classes are disjoint and together contain every covering test found for the
    batch, so no covering test is left unclassified,
  And the classification is computed from the worktree's git state alone: the gate
    consumes no agent-reported list of written test files, and supplying such a list to
    the gate changes no test's classification.
