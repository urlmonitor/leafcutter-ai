id: BO-2900d-1
components:
  - build_orchestration
  - testing_quality
title: "Code with no way in passes only on a recorded exemption carrying a reason, never by convention"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a unit of code that exposes no runtime way in of its own and exists only to be
    used by other units,
    And no exemption is recorded for it,
  When the reachability guard evaluates it,
  Then it is reported as having no way in and the change is refused.

  Given the same unit with an exemption recorded against it, stating a reason,
  When the guard evaluates it,
  Then it is not reported,
    And the exemption, the unit it covers and its stated reason appear in the guard's
      output as an accepted exemption rather than passing silently,
    And a criterion whose implementing code is that unit becomes eligible to be marked
      done, with no other change.

  Given a unit with no way in and no recorded exemption, whose name, file extension
    and containing folder all match those of exempted units,
  When the guard evaluates it,
  Then it is reported, because nothing other than a recorded exemption grants a pass.
