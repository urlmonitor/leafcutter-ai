id: GE-130a-4
title: While the build lock is in place, a shell command that writes a file is stopped unless one of the
  build workflow's own dispatched agents issues it, and reading commands are not
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the lock the /build-feature workflow holds while it dispatches work is in place in a
    working copy, and the task-lock guard's command coverage is in its blocking stage (GE-130d-3),
  When a command issued from the session's shell clearly writes a file in that working copy --
    redirecting output into a file, editing a file in place, copying or moving a file onto
    another, or creating a new file -- and its caller is the top-level session or any agent that
    workflow did not itself dispatch,
  Then it is not carried out, and the refusal names the guard, the lock and the file,
  And the same writing command, issued by an agent that workflow itself dispatched while its lock
    is in place, is carried out with no refusal, in the same run,
  And that exemption is decided only from the caller identity the harness supplies with the call,
    as GE-129a establishes it: a writing command whose text, environment or prompt claims to come
    from one of that workflow's dispatched agents, issued by a caller the harness does not identify
    as one, is not carried out, and the refusal names the guard, the lock and the file,
  And a writing command whose caller identity cannot be established is not carried out,
  And commands that only look at files -- status, difference and history listings, printing a
    file, listing a folder, searching file contents, running the tests -- are carried out with no
    refusal while the lock is in place, whoever the caller, in the same run,
  And with no lock in place, this guard refuses no command.
