  The "match the findings" clause is what keeps this how-to from asserting a mode's behaviour the
  probe did not observe. The absence of token wording is checked mechanically by GE-129e-1.

  The how-to does not recommend dispatching the commit specialist from a no-person mode: the user
  decided on 2026-09-17 that this dispatch is refused (GE-129d-2-i), so it is not a workaround.
  This record's criteria were not changed by that decision; saying so in the how-to is allowed but
