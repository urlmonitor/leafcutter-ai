readiness: draft
priority: medium
title: "The skip question is stated once, and a route that answers a different question is reported by name"
component: ticket-creation
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the rule that decides whether the proof-writing phase may be skipped is
    stated once, in a single place, as the one question every route must ask,
  When each route's own description of that decision is compared against that
    single statement,
  Then each route's description matches it,
  And when one route's description is changed so that it would skip on an input
    the single statement says must not be skipped, the comparison reports a
    disagreement naming that route and the input it disagrees on,
  And a route that decides by asking which kind of worker is needed, rather than
    by asking whether a proof was demanded, is reported as a disagreement even
    when it happens to reach the same answer on the example at hand.
depends_on: [TKT-500g-2]
