notes: |
  ACS-500 post-implementation spot-check, GAP C. config/ac_store_schema.json's id
  pattern (^[A-Z]{2,6}-[0-9]{3}$) and additionalProperties:false reject the actual
  store's real id format (e.g. ACS-500a-1 — lowercase L1 segment plus trailing -N)
  and reject the pattern_slots field entirely (it is not a declared property). Real
  records pass commit today only because nothing enforces the JSON schema at commit
  time (see GAP A / ACS-500f-1). The schema is stricter than reality and out of sync.
  This AC brings the schema into line with the real, valid store contents so the
  documented schema matches what the store contains and could be enforced without
  rejecting valid records. The superseded_by id pattern (also ^[A-Z]{2,6}-[0-9]{3}$)
  may need the same widening if hierarchical ids can appear there.
