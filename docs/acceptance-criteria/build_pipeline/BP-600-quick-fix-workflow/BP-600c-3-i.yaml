    relevance: >-
      The related-tests dispatch sits between green verification and the
      mutation proof, ahead of the commit phase, and halts with
      related_tests_broken. Its prompt also instructs the runner to judge only
      against what the related tests did BEFORE the fix, so a test already
      broken on the branch for unrelated reasons is not misread as collateral
      damage.
assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - "Related-test discovery must use import/reference analysis, not directory-based heuristics"
  - "Must complete related-test scan within 10 seconds for typical repository sizes"
  - >-
    Must run the related tests under the same strict enforcement as the new
    test. A related test covering a not-yet-done AC would otherwise have its
    failure downgraded, which is the same masking BP-600c-2 guards against,
    reappearing on a wider population.
  - >-
    An empty discovery result and a clean run are different outcomes and must
    be reported differently. "No related tests found" is an absence of
    evidence; presenting it as a pass turns a discovery failure into a
    green light.
  - >-
    Must exclude the new test file from the related set — it was just verified,
    and re-running it here would let its green stand in for the neighbours'.
