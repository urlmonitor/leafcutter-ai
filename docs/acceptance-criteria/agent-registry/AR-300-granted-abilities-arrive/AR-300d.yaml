notes: |
  THIS IS THE CRITERION THE CHEAP FIX FAILS. The whole defect exists because
  delivery was made conditional on each specialist carrying a marker that
  nothing required and nobody added -- correct-looking machinery that reached
  nobody for as long as it existed. Reinstating the marker across 60 specialists
  would satisfy AR-300a on the day it ships and re-open the same hole for the
  sixty-first.

  THE NEGATIVE CASE THAT PROVES THIS IS NOT AR-300a. A repair that hand-edits
  every specialist template so the table arrives satisfies AR-300a completely
  and fails this criterion completely. That is precisely today's design, made
  correct once by hand.

  A RULE THAT RESOLVES TO NOTHING PASSES FOREVER. Any evidence for this criterion
  must show it examined the whole population of specialists, not that it found no
  problems. This repository has already shipped a check that matched zero files,
  printed a success line and exited clean for eight days.
