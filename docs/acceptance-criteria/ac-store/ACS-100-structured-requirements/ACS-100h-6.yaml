title: "Pattern C documentation is consistent with the ID-derivation child-counting rule"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Scenario: Documented Pattern C renames moved children to the new parent's prefix
    Given the ac-tree-split skill's Pattern C (Intermediate Split) procedure,
    When an overcrowded L1's L2 children are moved to a new sibling L1,
    Then the procedure instructs that each moved L2 child is RENAMED so that
      its ID prefix matches the new parent L1
      (e.g. "<OLD-L1>-k" becomes "<NEW-L1>-m"),
    And the procedure requires updating every depends_on, covered_by,
      delivers_to, expects_from, superseded_by, and amended_by reference —
      store-wide, not only within the moved subtree — from each old child ID
      to its new ID,
    And after the documented procedure is followed, the originally-overcrowded
      L1's ID-derived child count (as computed the same way the limit check
      derives a parent from a child's ID string) is at or below its effective
      child limit.

  Scenario: Pattern C documentation must not claim a covered_by-only rewrite clears the limit
    Given the child-limit enforcement counts a parent's children by deriving
      the parent from each child's ID string (not by reading covered_by,
      depends_on, or any other reference field),
    When the Pattern C procedure is read,
    Then the procedure does NOT state or imply that rewiring covered_by or
      depends_on alone (while leaving the moved children's ID prefixes
      unchanged) is sufficient to bring the overcrowded L1 below its limit,
    And the procedure explicitly states that the child IDs themselves must be
      changed for the overcrowded parent's count to drop.

  Scenario: Documented alternative when a structural split is not yet warranted
    Given a parent for which a structural split is not yet warranted,
    When the Pattern C procedure is read,
    Then it documents child_limit_override on the parent as the auditable
      escape hatch to raise that parent's effective child limit instead of
      performing a rename-based redistribution,
    And it frames child_limit_override as a temporary exception to be removed
      once a structural rebalance is performed.
