criteria: |
  Given a ticket exists in an epic folder,
  When any supervisor, gate, or query needs to know the ticket's lifecycle state,
  Then it reads the `status:` field from the ticket's YAML frontmatter,
  And it never infers state from the ticket's folder position (root vs. done/),
  And the status field supports at least: todo, in_progress, done.
