id: DK-400b-2-i
title: "A mid-run split's quotes are checked against the work item's own words, not the root goal"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the mid-run split of the split-bounds decision question at work-item depth 1,
  And the root goal's text contains the words "children are counted per run", which the work
    item's question does not contain,
  When the host proposes part p1 quoting "how many sub-questions one split may propose", part p2
    quoting "whether children may run in parallel" and part p3 quoting "children are counted per
    run",
  Then p1 and p2 are kept, because their quotes are in the work item's question,
  And p3 is set aside read-only with the reason that its quote is not found in the subject,
    although its words appear in the root goal.
