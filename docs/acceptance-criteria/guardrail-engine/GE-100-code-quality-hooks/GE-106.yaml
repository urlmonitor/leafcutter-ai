criteria: |
  Given an AC store where an L2 AC declares its structural parent via its
       hierarchical id (e.g. "INF-400e-1" has parent "INF-400e") AND also lists
       a non-parent dependency to a sibling subtree's L1 in its depends_on
       (e.g. depends_on includes "INF-400a")
  When check_ac_limits builds its parent->children map during pre-commit
  Then the L2 AC is counted as a child ONLY of its id-derived parent
       ("INF-400e"), and is NOT counted as a child of the cross-linked sibling
       ("INF-400a")

  And given a parent L1 whose number of id-derived L2 children is within the
      limit (<=5) but which is named in the depends_on of additional ACs that
      live under other parents
  When the hook computes that L1's child count
  Then the count reflects only its true id-derived children, so no false
       "exceeds max 5" block is raised

  And the bug symptom ("Parent 'INF-400a' (L1): 9 L2 children exceeds max 5"
      raised when INF-400a has only 4 id-derived children) must not occur
