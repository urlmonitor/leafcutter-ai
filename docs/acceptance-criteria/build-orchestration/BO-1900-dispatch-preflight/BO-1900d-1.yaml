  - "Each pointer must reach the agent as a named token (pointer name, then ':' or '=', then the value) embedded in the prompt string. The prompt is the only channel available: the agent(prompt, opts) call accepts opts of only {agentType, schema, label, phase, model, effort, isolation}, and any extra key placed in opts is dropped before the agent sees it."
  - "Every dispatch on every work item must carry its own pointer values; a pointer hardcoded to one work item is worse than an absent one, because the receiving gate then acts on the wrong record."
