assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The compare-before-write guard must compare BYTES, not decoded text. A text-mode read applies universal-newline translation on every platform, so a CRLF file and its LF content compare equal and the divergence can never be seen, let alone repaired."
  - "The writer must emit the content's bytes untranslated. A text-mode write translates LF to os.linesep, which is CRLF on Windows."
  - "The documented contract of the writer is unchanged: it already promises a byte-identical comparison; this criterion makes the code honour it rather than adding new behaviour."
  - "Genuinely identical files must still be skipped and counted as up to date, so the fix introduces no mtime churn on a correct install."
