notes: |
  THE FAIL-CLOSED REGRESSION GUARD. It is a separate behaviour from the three
  reporting records because the realistic way this L1 goes wrong is not a bad
  message -- it is somebody deciding that since three of the four causes are not
  really permission problems, three of the four should be warnings. That would
  reintroduce the exact hazard the BO-1500f-1 gate was built for. That AC is
  `work_status: done`; this L1 refines its reporting and must not supersede it.

  THE LAST CLAUSE IS DELIBERATE AND IS NOT KI-ACD-006. It asserts only that a run
  halted at this check does not report itself as having succeeded. It does not
  specify the vocabulary of the return status, and it does not touch the
  cancellation return path -- KI-ACD-006 is explicitly out of scope for this tree.
  Without it the guard is satisfiable by a run that stops and still reports
  success, which is the same false-success family the halt exists to prevent.

  ASSERT IT BEHAVIOURALLY. Observe the absence of the dispatch in the run's own
  record of what it dispatched, and the absence of the worktree on disk. Reading
  the source to confirm a `return` follows the check proves nothing about whether
  the check is reached. Per CLAUDE.md, an AC about a gate is covered by a test that
  executes it.

  DEPENDS_ON CARRIES ORDERING, NOT PARENTAGE. Its three siblings are listed because
  the four conditions are only distinguishable once they are implemented; structural
  parentage is derived from the id.

  2026-08-25 (it-po): the it_requirement about outcomes beyond the enumerated four is
  the one that stops this guard being written as a four-branch table. ACD-2100b-3-i
  already demonstrates a fifth outcome the enumeration misses; a guard keyed to the
  list of four is fail-open on it. All three expects_from edges have depends_on mirrors
  already in place, so the sequencer will honour them.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
