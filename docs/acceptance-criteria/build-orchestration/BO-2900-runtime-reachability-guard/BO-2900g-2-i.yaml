assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: true
it_requirements:
  reference_file_path: "scripts/commit_guardian/_ac_schema_validators.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/commit_guardian/ unit_tests/ac_store/ -q"
  config_schema_fragment:
    type: boolean
    description: "The same derived declares_side_effect value as BO-2900g-2, asserted as a property that holds for a record authored AFTER any sweep and with the sweep never run at all — the sweep must not appear in the causal chain."
  constraints:
    - "The guarantee must hold with the one-off sweep DISABLED entirely. An implementation that satisfies the first three clauses by re-running the sweep on every authoring pass fails the fourth, and must: re-deriving the whole store on every author is a different guarantee and does not survive the store growing."
    - "The property must be asserted across two runs differing in exactly the suspected cause (sweep-run vs sweep-never-run), not by inspecting one run's output. Same shape as BO-2900f-1's entry-count invariance across an all-enabled and an all-disabled run."
    - "The new record must be produced by a path that has no knowledge of the field: the test must not pre-seed declares_side_effect anywhere in its input, and must not call the derivation directly on the record it then inspects."
    - "The guarantee must hold across at least two distinct routes by which a record enters the store, and adding a third route must not require that route to be modified — the same route-agnostic constraint as BO-2900g-1."
    - "Per-record derivation cost must stay bounded: authoring or validating one record must not read more than that record plus its schema. A whole-store re-derivation on every authoring pass is explicitly disallowed by the fourth criterion and is also the performance failure mode."
delivers_to: null
expects_from:
  - ac_id: BO-2900g-2
    contract: "A derivation function over a single AC record's criteria text that returns the declaration value, invoked at the enforcement point chosen and recorded in BO-2900g-2's sign-off, and independent of any store-wide pass."
test_spec:
  - name: test_bo_2900g_2_i_record_authored_after_the_sweep_carries_the_declaration
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Run the sweep over a temp store, then add a new durable-effect record through the ordinary authoring path with no mention of the field anywhere in the input, and assert the count of durable-effect records lacking the declaration is zero again with no second sweep run."
  - name: test_bo_2900g_2_i_guarantee_holds_with_the_sweep_never_run
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "The discriminating two-run test: identical inputs, one run with the sweep executed and one with the sweep removed from the pipeline entirely. The post-authoring state of the new record must be identical in both, which no sweep-dependent implementation can satisfy."
  - name: test_bo_2900g_2_i_second_authoring_route_inherits_the_derivation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT: author the record through a second real route — `python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/check_ac_schema.py <new AC yaml>` as a subprocess (the pre-commit path), rather than the route used by the first case — and assert the same outcome without that route having been modified."
test_rationale: |
  The parent's property is invisible in any single record: a record set by a sweep three
  weeks ago and a record derived at authoring time are byte-identical. So every test that
  inspects one record passes on the sweep-only implementation. The two discriminating
  observations are (a) a SECOND record authored after the sweep by an author with no
  knowledge of the field, and (b) the same run with the sweep removed. A direct unit test
  of the derivation function proves neither.
