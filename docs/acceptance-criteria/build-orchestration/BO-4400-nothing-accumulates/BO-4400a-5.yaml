test_rationale: A sequence diagram under docs/architecture/diagrams/ that follows a route from
  pushing and opening its pull request, through its merge, the clearing door, its holds-work
  verdict and the main-line check, to the removed, refused-and-kept or kept-until-merged outcome,
  plus the nothing-to-deliver path and the single clearing after an epic's last ticket. Whether
  those branches are told faithfully to the built route is a reading judgement. The architecture
  reviewer checks the drawing against BO-4400a-1, BO-4400a-1-i and BO-4400a-2; after wave 2, a
  verified_by inspection does.
