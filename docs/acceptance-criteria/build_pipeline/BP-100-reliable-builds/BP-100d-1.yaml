criteria: |
  Given a staged diff modifies the file "templates/scripts/commit_guardian/check_contract_shrinking.py"
  And the diff contains patterns that would normally trigger a contract-shrinking warning
    (e.g., removing a pytest.mark.xfail decorator)
  When the contract-shrinking hook classifies the changed files
  Then the commit_guardian file is NOT classified as a production file
  And no contract-shrinking block is raised for that file

  Given a staged diff modifies the file "templates/commit-guardian/check_contract_shrinking.py"
    (legacy path)
  When the contract-shrinking hook classifies the changed files
  Then the legacy-path file is also NOT classified as a production file

  Given a staged diff modifies a genuine production file (e.g., "src/trading/engine.py")
  And the diff removes a pytest.mark.xfail decorator
  When the contract-shrinking hook classifies the changed files
  Then the production file IS classified as production code
  And the contract-shrinking block IS raised as before
