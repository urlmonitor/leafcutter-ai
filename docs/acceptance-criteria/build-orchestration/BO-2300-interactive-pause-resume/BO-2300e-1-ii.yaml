it_requirements:
  config_schema_fragment:
    type: object
    description: "No-op resume result when no pending pause exists."
    properties:
      resumed: {type: boolean, description: "must be false"}
      answer_applied: {type: boolean, description: "must be false"}
      state_unchanged: {type: boolean}
      report: {type: string, description: "e.g. 'nothing to resume' — not an error"}
    required: [resumed, answer_applied, report]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: asserted against the E2 workflow ENGINE (JavaScript). The no-op-resume guard lives in the shared JS helper's resume entry: if the record read (via the resume agent() dispatch) finds no paused_awaiting_input pause for the run, it returns 'nothing to resume' from the workflow body rather than erroring. Not a standalone Python module."
    - "Submitting an answer/resume for a run with no pending question (running, completed, or cancelled) must be a safe no-op: no step resumed, no answer applied, existing state unchanged, and the submission reported as 'nothing to resume' rather than erroring."
    - "Guards the resume side against being invoked when nothing is waiting — must be a safe no-op, not a crash or a spurious re-run."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js) resuming a run whose record has no pending pause; assert the harness run reports 'nothing to resume', applies no answer, and does not error. Do NOT test a standalone Python module."
  delivers_shape:
    description: "No-op assertion surface; no downstream producer."
delivers_to: null
