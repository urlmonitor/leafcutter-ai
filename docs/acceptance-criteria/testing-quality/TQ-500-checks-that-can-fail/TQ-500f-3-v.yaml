it_requirements:
  - >-
    Reading rule, one rule for every step it serves: the answer is the whole relayed text, trimmed, when
    that parses as one JSON object (not an array, not a scalar, not null); otherwise the one DISTINCT line
    that, trimmed (surrounding whitespace and a trailing carriage return removed), parses on its own as a
    JSON object. Zero such lines, or two or more distinct such lines, is no answer (null). A line is a
    candidate only as a whole: a JSON object embedded in a line with other text (N5) is never read. Identical
    repeated lines count once. A multi-line JSON object is read only when it is the whole text.
  - >-
    Every caller still fails closed on null (TQ-500f-3-ii): the red-baseline gate halts before the coder
    with "could not be verified"; a wrong-version step halts with that step named (recover, list, finish on
    the twins; recover, and gate-marker open where its reply is checked, on /build-epic); no later
    wrong-version step and no commit follows. The per-step shape checks already on main are unchanged:
    gate_passed must be a boolean, recover ok must be true, list owed must be an array and error null,
    finish gate_passed must be a boolean.
  - >-
    The lines around the answer are never read as part of it, and an "exit: N" line is neither parsed,
    cross-checked nor allowed to override any field of the answer. A failing verdict found around noise
    halts with its own reason and the tests it names, never as "could not be verified".
  - >-
    Where the rule applies: build-feature.js and its TWIN build-ticket.js, in wvStep (wrong-version
    recover, list, finish) and in the red-baseline gateVerdict parse of the gate reply's output field;
    build-epic.js in gvStep (the drive-head wrong-version recover step and the gate-marker close-all, open
    and close steps). build-epic.js has no wrong-version list step and does not parse the red-baseline
    verdict in JS (ticket-supervisor runs it from prompt text, TQ-500f-3-iv).
  - >-
    ONE copy of the reader, in templates/workflows-js/_shared/workspace-answer.js (the single source of the
    shell-step reply rules), which the build copies between the WORKSPACE-ANSWER markers every route already
    carries (BO-4300c-3, BO-4500). No route template holds its own copy. Amended 2026-10-23 (main session):
    this replaced an earlier three-copy design after main gained the shared-block mechanism; the reading
    rule is unchanged.
  - >-
    Out of scope: fast-lane-ship.js keeps its own strict parse of the relayed stdout and is not changed
    here (owned elsewhere). The ticket-supervisor prompt rules (TQ-500f-3-iv, TQ-500g-1-vii) are not
    changed by this AC. No Python changes; the commands' own output is unchanged.
  - >-
    JS growth: thin, pure helper only (about 10 counted lines per file, plus the call-site swaps). The three
    files are over the 1000-line .js limit, so the file-size ratchet needs the same one-time user-approved
    skip as the TQ-500g-1-v / -vi precedent; record the measured growth in the commit message.
  - >-
    Existing neighbouring workflow tests (the tq500f3* and tq500g1* families, including
    test_tq500f3ii_gate_reply_fail_closed.py and the "not json" cases of test_tq500g1vi_route_halts.py) stay
    green unchanged.
test_spec:
  - name: test_a_red_baseline_answer_around_relay_noise_is_acted_on_and_no_answer_still_halts
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: templates/workflows-js/build-feature.js and build-ticket.js under unit_tests/_workflow_engine_harness.py
    description: >-
      For each twin, a PASSED red-baseline verdict relayed as '<json>\nexit: 0' (R2) and as a log line,
      the verdict with a trailing carriage return and 'exit: 0' (R4) dispatches python-coder. A FAILING
      verdict (absence_only_red) after the log line and before 'exit: 1' halts with its own reason and not
      "could not be verified". N1-N6 each dispatch no coder and halt with "could not be verified".
    must_catch:
      - the whole relayed text parsed as JSON, so a trailing exit line halts a passed gate
      - a relayed gate reply with no single verdict in it read as a pass
      - a failing verdict around noise reported as "could not be verified" instead of its own reason
    in_scope_files:
      - templates/workflows-js/build-feature.js
      - templates/workflows-js/build-ticket.js
  - name: test_a_list_answer_after_the_writers_log_line_is_read_and_no_answer_still_halts
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: templates/workflows-js/build-feature.js and build-ticket.js under unit_tests/_workflow_engine_harness.py
    description: >-
      For each twin, the wrong-version list answer relayed after the writer's log line "base ref HEAD: 0
      names declared, 1 derived" (R3) is read: the route does not halt at list, test-breaker is dispatched
      with the owed versions and finish runs once. N1-N6 each halt blocked with wrong_version_step "list",
      with no test-breaker and no finish dispatch after it.
    must_catch:
      - stdout parsed whole, so the writer's own stderr log line turns the list answer into null
      - a list reply carrying no single answer read as nothing owed
    in_scope_files:
      - templates/workflows-js/build-feature.js
      - templates/workflows-js/build-ticket.js
  - name: test_build_epic_reads_a_recover_answer_around_relay_noise_and_no_answer_still_halts
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: templates/workflows-js/build-epic.js under unit_tests/_workflow_engine_harness.py
    description: >-
      build-epic.js's drive-head recover answer relayed after a log line and before 'exit: 0' is read: the
      drive returns ok and dispatches the one ticket-supervisor. N1-N6 each halt the drive blocked with
      wrong_version_step "recover" before any ticket-supervisor is dispatched.
    must_catch:
      - build-epic's step reader left on the whole-text parse while the twins were fixed
    in_scope_files:
      - templates/workflows-js/build-epic.js
test_required: true
test_rationale: >-
  Behavioral, per CLAUDE.md: each test drives the real templates under the E2 harness and asserts on the
  recorded dispatches and the terminal payload, never on source text, and pairs its noisy-answer case with
  the N1-N6 no-answer cases in the same run, so a reader that accepts anything fails. Mutation-proven on
  2026-10-23: with the template changes stashed all three fail with the live halt messages ("red-baseline
  gate reply could not be verified", "Wrong-version list step did not pass: null", and the recover halt);
  with them all three pass, and the 49 neighbouring tq500f3* / tq500g1* tests stay green.
