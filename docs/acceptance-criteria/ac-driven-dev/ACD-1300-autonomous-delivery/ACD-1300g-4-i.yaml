    name to be declared by implementation)
- name: test_background_worker_timeout_after_remote_create_reconciles_one_pr
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: Create remote draft then lose response; explicit recovery finds it and asserts one PR rather
    than duplicate create.
  covers:
  - ACD-1300g-4-i
- name: test_background_worker_failed_push_remains_publication_blocked
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: failure
  description: Push failure retains evidence/remote identity and actionable blocker, never delivered status.
  covers:
  - ACD-1300g-4-i
