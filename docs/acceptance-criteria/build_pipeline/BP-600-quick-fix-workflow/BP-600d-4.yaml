notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  PRE-EXISTING GAP, RECORDED NOT ERASED — the "minimal ticket file". This was
  the third and last place the ticket-file clause appeared; the other two were
  BP-600d-3 ("and minimal ticket file" in the staged set) and BP-600d-4-i ("the
  ticket lifecycle still closes normally with status: done"). None of the three
  was ever implemented. Neither the previous in-place workflow nor the current
  templates/skills/quick-fix/SKILL.md and templates/workflows-js/quick-fix.js
  creates, stages, or references a ticket file at any phase; the skill states
  the boundary outright — "this skill does not create tickets or epics". The
  clause was specified across three records, silently dropped at build time,
  and asserted for the whole interval all three were marked done. If a ticket
  artifact is genuinely wanted from /quick-fix, that is new scope needing its
  own AC — it is not recoverable by reinstating these clauses.

  DANGLING REFERENCE, LEFT AS FOUND. implemented_by points at
  tickets/00_inbox/TICKET-20260608-BP-600d-4.md, which does not exist in the
  repository. It is also a ticket path in a field the schema defines as source
  file paths. Left untouched deliberately — correcting it is a provenance
  decision, not a criteria amendment, and silently deleting the only surviving
  pointer to how this record was built would destroy the evidence. Worth noting
  that the one ticket this AC family does reference is itself missing, in a
  family whose defining gap is a ticket artifact that was never produced.
