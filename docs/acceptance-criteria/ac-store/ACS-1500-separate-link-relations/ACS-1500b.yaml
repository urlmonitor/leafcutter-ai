doc_links:
  - path: scripts/ac_store/done_proof.py
    relationship: related
    status: exists
    relevance: "THE READER THAT MATTERS MOST AND THE REGRESSION ORACLE FOR THIS WHOLE L1. `_has_resolvable_child` infers the relation from whether entries resolve; this L1 makes the inference unnecessary but its VERDICT must not move for any record. Compute the real function's composite-versus-leaf answer for every record before and after, and assert equality — per ACS-1300a-3, a re-implementation of its rule inside a test will pass while production uses a different rule."
  - path: templates/scripts/commit_guardian/check_ac_parent_covered_by.py
    relationship: related
    status: exists
    relevance: "THE SECOND VERDICT TO PIN, AND A TRAP IN HOW IT IS INVOKED. It requires a parent to name each of its children. It reads the git index or HOOK_TEST_FILES and NEVER argv, so passing a path on the command line does not make it check that path — any verification must first confirm the hook actually saw the file. An exit 0 from a hook handed nothing is not a pass. It also has three separate silences (unstaged parent, parent-not-in-child's-depends_on, parent-absent-fails-open) documented in ACS-1400's notes."
  - path: scripts/ac_store/ac_coverage_resolver.py
    relationship: related
    status: exists
    relevance: "A READER THE ac-schema.md TABLE OMITS. `_CHECKED_FIELDS` includes covered_by and the record check fails the field on EMPTINESS alone — it reads the field as 'is there any evidence at all', which is neither of the two relations. Under a split it must be told which emptiness it cares about, or it starts reporting every test-covered leaf as missing its parts."
  - path: templates/scripts/commit_guardian/_ac_schema_validators.py
    relationship: related
    status: exists
    relevance: "THE SUBTLEST UNLISTED READER — leafness is decided by `bool(assigned_agent) and not covered_by` around line 481, i.e. by the field being EMPTY. Splitting the field changes what emptiness means here silently, with no test failing. This record is named specifically so the enumeration starts from a reader that no table anywhere lists, which is the evidence that the enumeration must be derived from the repo rather than copied."
  - path: docs/reference/ac-schema.md
    relationship: related
    status: exists
    relevance: "ITS TABLE OF FIVE TOOLS IS THE STARTING POINT, NOT THE ANSWER. Named there: check_ac_parent_covered_by, scan_ac_orphans, done_proof `_resolve_all_child_ids`, approve_acs, check_ac_limits. Measured 2026-09-08, roughly forty files under scripts/ and templates/ mention the field. A table is a claim about readers; re-derive the list and state how many you found against how many you examined."
