notes: |
  THE FIRST L2 MUST BE THE ENUMERATION, AND IT MUST BE DERIVED FROM THE REPO.
  Every subsequent behaviour in this L1 is scoped by a list, and a list copied
  from ac-schema.md's table of five is wrong by roughly an order of magnitude.
  One unconverted reader is a permanent silent wrong answer, and the two most
  dangerous ones found so far (ac_coverage_resolver.py, _ac_schema_validators.py)
  appear in no table. State the population examined and the population found —
  ACS-1100, inherited.

  THE DANGEROUS READERS ARE THE ONES THAT CONSULT EMPTINESS. A reader that
  iterates the entries is obvious and will be found by grep. A reader that
  branches on `not covered_by` is treating the field as a single yes/no about
  evidence-in-general, and after the split there are two independent emptinesses
  it could have meant. Grep for the field name finds both; only reading each one
  tells them apart.

  BIND THE OUTCOME TO REAL VERDICTS, NOT TO FIELD PRESENCE. The falsifiable
  claim is that done_proof reaches the SAME composite-versus-leaf verdict for
  every record before and after, and that the back-link check reaches the same
  verdict too. Computed against the real functions on the real store. This is
  exactly how ACS-1300a-3 binds its equivalent claim and the shape should be
  copied rather than reinvented.

  THE DEPLOY-MANIFEST TRAP IS LIVE FOR THIS L1 SPECIFICALLY. Several readers here
  are pre-commit hooks that run from the DEPLOYED layout, not the source tree. A
  hook importing a module that is not in the build deploy list raises
  ModuleNotFoundError at hook runtime while every unit test passes — and once
  those gates are required, that blocks every merge. Verify by running the
  deployed hook after build.py, never by unit tests alone. CLAUDE.md documents
  the precedent (done_proof.py itself, omitted from build_ac_store's deploy_map).

  COLLISION WATCH: ACS-800e already commits to updating every tool that derives
  structure from the id string and names check_ac_parent_covered_by.py among
  them. Same file, same era, different reason. Sequence or combine deliberately.
