id: GE-113c-1-vi
components:
  - commit_guardian
  - agent_registry
title: "The commit-time agent-registry check finds the package wherever it is laid out, and never passes having checked nothing"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
criteria: |
  Given a commit that stages a file inside the agent-registry check's scope — the agent
    registry, its schema, or an agent template,
  And the package is laid out in any layout it really ships in: at the repository root,
    as in this repository, where the registry is the repository's own
    config/agent_registry.json; inside a leafcutter/ subdirectory of a consumer project;
    or any further layout the package's build deploys,
  When the commit-time agent-registry check runs,
  Then it locates the package root for that layout and validates that layout's registry,
  And it locates the package root by the same convention the build and the other
    commit-time checks use, not by a location of its own.

  Given the same staged file,
  And no package root can be located by that convention,
  When the check runs,
  Then it does not report a pass,
  And it reports that it could not locate the package, naming the locations it looked in
    and the staged file it therefore did not check,
  And it exits non-zero, so the commit does not complete,
  And its message is its own — distinct from the message for a registry that was read and
    found invalid — so the output alone tells "could not find the package" apart from
    "found an error in the registry".

  Given a commit that stages no file inside the check's scope,
  When the check runs, whether or not a package root can be located,
  Then it reports an ordinary pass, because nothing in its scope was offered to it
    (the empty-scope rule of GE-120a-4).

  Given this repository, and a staged registry in which the agent entry "fixture-agent"
    names a template file that does not exist,
  When the commit-time check runs,
  Then it exits non-zero, the commit does not complete, and the output names
    "fixture-agent" and the missing template,
  And the same registry validated by the build without building reports the same error,
  And given the registry is corrected, the same commit passes the check.

  Given the live copy of the check and its packaged copy,
  When each is run on the scenarios above,
  Then both give the same verdicts and name the same errors, and the commit-time parity
    check between the two copies passes.

  Given the check starts actually inspecting this repository's registry at commit time,
  And the registry already holds errors no commit-time run has reported before,
  When the change that turns it on is made,
  Then each such error is either fixed in that same change or recorded as a known issue
    naming the error and the agent entry it sits in,
  And the check is not switched off, narrowed, given an exemption or allow-list entry,
    or made to warn instead of block to let that change through, so the check is
    enabled with at least the scope it had before.
depends_on: [GE-113c-1, GE-120a-1]
