  - path: templates/scripts/commit_guardian/commit_guardian.json
    relationship: modifies
    status: exists
    relevance: >-
      The scope decision is a configuration decision on a watched package surface,
      which is why the set of kinds in force must be readable at run time rather
      than written into the standard. The concrete set of kinds is pinned at
      technical enrichment, NOT in this record and NOT in this doc_link.
  - path: templates/scripts/commit_guardian/check_file_size.py
    relationship: modifies
    status: exists
    relevance: >-
      Two facts read from source in this worktree on 2026-09-01, both of which
      this record's clauses turn on, and neither of which may be re-expressed as
      an extension list in the criteria. First, a staged file whose kind is
      outside scope is skipped by an early continue: it appears in no reported
      class at all, so the outcome cannot distinguish "measured and fine" from
      "never looked at". Second, the refusal carries a branch of dividing advice
      addressed to a kind of file that the configured scope does not contain, so
      that branch cannot execute — the fourth clause disposes of it as a
      consequence of the rule rather than as a special case, which is why the
      clause is written over ALL forms of advice and names none of them.
  - path: docs/pre-commit-hooks.md
    relationship: related
    status: exists
