notes: |
  This is the single most important edge case in the tree and the reason the L1 insists the
  UNIT OF INSPECTION is the point. It is kept as its own record rather than folded into
  GE-122a-1 because it is the one condition under which a plausible, well-written, well-tested
  implementation of GE-122a-1 still fails to catch the defect the goal exists to prevent.

  It is also the condition that reproduces the actual incident: the parentless GE-119 record was
  minted by /quick-fix from a different working copy than the GE-119 goal tree. The two files
  have never appeared in a single change set, so every diff-scoped gate in the repository saw a
  clean change.

  OPEN FOR THE IT PO — not a behavioural question, so deliberately not decided here: whether a
  pre-existing collision in which NEITHER claimant is in the change set should BLOCK the current
  author or only be reported to them. The criterion above requires only that it be REPORTED.
  Blocking on it is safe only once GE-122e has repaired the store; before that it would stop
  every unrelated commit. Note the ci.yml "AC store valid" job already documents this exact
  trade-off for the 57 pre-existing orphans and resolved it by diff-scoping the ATTRIBUTION
  while leaving the rule itself intact.

  RESOLVED BY THE IT PO (2026-08-17): attribution is diff-scoped, inspection is not. At least
  one claimant in the change set blocks; no claimant in the change set reports with a visible
  count and does not block. The tolerance must be derived from the change set, never from a
  configured allowlist — GE-122e-3 asserts no such configuration exists. See it_requirements.
