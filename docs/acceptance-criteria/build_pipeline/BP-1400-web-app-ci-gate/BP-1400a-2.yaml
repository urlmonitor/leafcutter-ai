notes: |
  Path-scoping is authored as a behavior (not merely an edge case) because "the
  check runs when it should and does not needlessly block unrelated changes" is
  independently testable and is the trigger contract the other web-app checks
  follow. The precise path-filter mechanism (workflow path filter vs. required-
  check-on-changed-paths wiring) is an implementation decision left to it-po.
