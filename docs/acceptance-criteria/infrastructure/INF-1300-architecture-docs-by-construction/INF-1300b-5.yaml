notes: |
  WHY A REFERENCE AND WHY THIS ONE ANSWERS THE MISSING-KEY QUESTION. INF-1300b's notes place
  the trigger here rather than on INF-1300a and say why: the shape and the key are lookup
  material, and this is the natural home for the answer to a question that currently has
  none. Both authoring surfaces tell an author the explanatory key comes from ADR-015 and
  must not be altered; ADR-015 is about honouring an inline exception-handling suppression
  and defines no key. INF-1300b-2 settles what the key actually is — derived per kind from
  the notation the picture uses — and INF-1300b-4 retires the false attribution from the
  surfaces. Neither of those makes the answer FINDABLE by an author who is holding a document
  and wondering which parts are theirs. That is this page, and it is the reason the trigger
  exists.

  FALSIFIABILITY, AND WHY EVERY ARM POINTS AT SOMETHING RUNNABLE. Read the declaration and
  require a bijection with the page's per-kind entries. Produce a document for each kind and
  require the page's account of its notation to equal the key that document carries, in both
  directions. Run the partition over each produced document and require the page's
  produced-versus-authored column to equal it. Read the obliged-fact column against the
  declaration. Then move the world and require the page to notice: add a kind, retire a kind,
  change the notation one kind's picture uses — each with nothing else altered, and each must
  redden. The record is falsified by any disagreement, and equally by a suite that survives
  any of those three movements, because a reference that cannot fail is one that will be
  believed long after it stopped being true.

  WHAT WILL NOT FALSIFY IT. Searching the page for the name of each kind. Comparing the page
  against a stored copy of the tables — that construction passes exactly when page and copy
  are equally stale, which is the construction INF-1300b-1 already rules out for section
  shapes and the same reasoning applies unchanged. And running the project's checks over
  documents the page describes: the checks have no opinion about what a page says, and in the
  one place it matters most — the obliged-fact column — the obligation is declared in the
  vocabulary and enforced by nothing, so a green from the check set would say nothing
  whatever about the column most likely to be wrong.

  THE MEASURED IRREGULARITIES THE TABLE MUST CARRY RATHER THAN TIDY AWAY. The vocabulary is
  eleven entries and is not uniform: three kinds oblige a further fact and eight do not; one
  name is a retired alias whose own entry declares an empty obligation while the successor it
  defers to obliges one, so a table built by reading each entry in isolation drops that
  obligation silently; and one entry is not a kind of picture at all. A reference that
  presents eleven equal rows is easier to write and is wrong in three separate ways. The
  retired alias in particular must appear — an author who meets that name in an existing
  document needs to be told it is retired and what replaced it, which is exactly the lookup
  this page exists for.

  FENCED. WHAT the key contains and WHERE it derives from is INF-1300b-2's; the partition it
  describes is INF-1300b-3's; the section shape it enumerates is INF-1300b-1's; the surfaces'
  corrections are INF-1300b-4's. This page owns only that all of it becomes findable in one
  place and stays in step with what is produced. Where architecture documents LIVE remains
  docs/reference/architecture-docs-layout.md's subject and is linked, not absorbed.
