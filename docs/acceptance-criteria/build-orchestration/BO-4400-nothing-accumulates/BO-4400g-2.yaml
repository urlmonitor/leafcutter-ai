delivers_to:
  - agent: python-coder
    contract: >-
      The maker verb clear-landed (clear-landed --preview for BO-4400g-3) answers one JSON object per
      BO-4300c-2. A completed pass is status ok, code OK, exit 0, verb clear-landed, preview (bool), with three
      lists. cleared holds [{kind, slug, branch, location, answer}], where answer is the door's own remove
      answer verbatim; in a preview this list is would_clear, with the same items minus answer. kept holds
      [{kind, slug, branch, location, reason, commits: [full 40-character id], files: [workspace-relative path,
      forward slashes, sorted]}], with reason exactly one of not_on_main, holds_unsent_work, no_own_work,
      in_use, landing_unconfirmed and shared_project_unreachable. already_gone holds [{kind, slug, branch,
      location}] for a workspace another request cleared first. location is absolute. A pass whose shared
      project cannot be reached is status refused, code FETCH_FAILED, exit 2: nothing is cleared and every
      workspace is listed in kept with reason shared_project_unreachable. Every list is sorted by kind, then
      slug. Any later field is additive. The per-work mode (clear-landed --kind K --slug S, or --branch B)
      answers in the same shape for its one work. Consumed by BO-4400g-2-i..-v and BO-4400g-3 (whole pass and
      preview), by BO-4400g-4 and BO-4400a-1 (per-work mode at a flow's end), and by BO-4400d-1 and BO-4400d-2
      (the sweep's workspace part and its preview).
  - agent: llm-expert
    contract: >-
      The per-work command clear-landed --kind feature --slug <name>, run by the absolute deployed maker path,
      and its one-work answer: cleared (with the door's own remove answer) or kept with reason not_on_main or
      holds_unsent_work. Used by the ship skill (BO-4400g-4-ii).
  - agent: documentation-expert
    contract: >-
      The clear-landed and clear-landed --preview commands, the per-work form, the answer shape above, the
      closed set of kept reasons with what each means, and the two idle rules (7 days for no work of its own,
      14 days for pushed but unmerged work), for the how-to of BO-4400g-5.
expects_from:
  - ac_id: BO-4400g-1
    contract: >-
      remove by work name (--kind/--slug or --branch) through the door, answering ok with removed_path, a
      refusal naming the unsent commits and files or the programs found, or the definite no-workspace answer
      of BO-4400g-1-i.
