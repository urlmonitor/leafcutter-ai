created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500c.yaml
criteria: |
  Given the authoring pipeline has produced and committed one or more stages on
    the authoring branch but the user cancels before giving final approval,
  When the workflow ends due to the cancellation,
  Then no pull request is opened,
  And the AC files already committed on the authoring branch remain on the branch
    (the work is not deleted),
  And those AC files are not present on main,
  And the user can resume the run later (per BO-1500b-2) to reach approval and
    delivery.
