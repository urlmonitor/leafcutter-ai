criteria: |
  Given a requirement whose wording claims a property of every entry in a 45-entry
    registry,
  And the only evidence offered for finishing it is a verdict from a validator that
    examined the 1 entry present in the change and found no violation,
  When that requirement is put forward as finished,
  Then finishing it is refused, and the refusal states the population the
    requirement claims (45), the count the evidence covered (1), and the 44 entries
    no evidence speaks for,
  And the refusal names the two routes that would close it — evidence whose covered
    count equals the 45 the requirement claims, or the requirement reworded to the
    narrower claim the evidence actually supports — and the closed record states
    which of the two routes was taken,
  And a verdict that examined 1 of 45, found no violation and returned success does
    not close the requirement, whatever exit status that verdict carried,
  And a requirement whose wording claims a property of one named record closes on
    evidence covering that one record, so the comparison bites only where the
    requirement itself claims a property of a population,
  And a requirement already standing as finished, whose evidence is later measured
    as narrower than its claim, is reported in the same terms rather than left
    standing: ACS-300h-1 and ACS-300i-2 each claim a property of every entry in
    docs/components.json, each is covered by a test of a validator that examines
    only the entries appearing in the change, and 36 of the 45 entries break the
    claimed property, counted directly against the file on 2026-08-25,
  And the bug symptom this criterion forbids is a requirement standing as finished
    for weeks because the validator it cites was truthful about the change and
    silent about the registry.

  Coverage note: exercise this by putting forward a requirement whose wording claims
  a population, together with a verdict carrying a covered count smaller than that
  population, and asserting on the refusal text — the claimed population, the
  covered count, the shortfall, and the two named routes. Assert separately that a
  single-record requirement closes unchanged, or the fix makes every requirement
  in the store unclosable.
