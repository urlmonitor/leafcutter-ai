it_requirements:
  config_schema_fragment:
    reachability_verdict:
      type: object
      description: "Extension of the verify_done_eligible() verdict dict with the third eligibility condition: { eligible: bool, reason: str, refusal_cause: 'proof_not_through_entry_point'|'no_entry_point_reaches_code'|null, unit: '<repo-relative source path>'|null, entry_point: '<repo-relative source path>:<callable>'|null, offending_test: str|null } merged into the existing keys. refusal_cause null preserves today's two-condition behaviour verbatim. 'proof_not_through_entry_point' is this rule's only cause and is set only from a reach record whose reached_through is the literal 'not_reached'; 'no_entry_point_reaches_code' belongs to BO-2900a-3 and is listed only because the two rules share the verdict dict. There is NO cause for an unwatched run or an undecidable question: such a record yields no verdict and leaves every key of the verdict exactly as the rule-not-invoked evaluation returns it (BO-2900a-2-ii, BO-2900a-2-iii). While the rule is report-only (BO-2900a-1-ii) none of these keys is written to the verdict at all; the same facts travel on the structured finding instead."
  reference_file_path: "scripts/ac_store/done_proof.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "Extend verify_done_eligible() in scripts/ac_store/done_proof.py — do NOT create a second eligibility oracle. The two incumbent conditions (at least one '# covers:<id>' test exists; every such test PASSES) run first and are unchanged; reachability is evaluated only after both pass, so today's failure messages are untouched."
    - "'The unit exposes a runtime way in' is decided mechanically, for the unit the AC's own record names and for no other (BO-2900a-1-iv): the unit is drawn from the AC's implemented_by .py entries, and it exposes a way in when it defines a module-level callable main(argv) — the same surface `python <module> <action> ...` reaches (cf. fast_lane.main, scripts/build_orchestration/fast_lane.py:925). Never select the unit from the proof's imports or from any other module that happens to import the implementing code, and never name in a finding a unit the record does not name. Record the resolved entry point as '<repo-relative source path>:<callable>', identified by resolved file path, never by module stem and never by a build-output copy (BO-2900a-1-iv). Never infer an entry point from filename, folder, docstring, or an `if __name__` text match."
    - "THE SCOPE FENCE IS MECHANICAL: when the declared unit exposes no way in, this rule returns no verdict at all and hands off to the BO-2900a-3 no-way-in rule. When the record declares no resolvable unit, this rule returns no verdict and no finding and does not guess a unit (BO-2900a-1-iv). Two disjoint refusal_cause values, never one merged 'unreachable' verdict — BO-2900e-1 specifies two different messages with two different clearing actions."
    - "The reached-through fact is CONSUMED from the BO-2900a-2 observation record. This AC must not re-derive it and must not fall back to any source-text signal (import-statement scan, subprocess-string search, entry-point-name grep) when the observation is missing, unwatched or undecidable. A record whose observation is 'unwatched' (BO-2900a-2-ii) or whose reached_through is 'undecidable' (BO-2900a-2-iii) gives NO VERDICT: the criterion is neither refused nor credited on that basis, a criterion whose every linked proof is such a record gets a verdict equal in every key to the rule-not-invoked verdict, and the case is announced through the BO-2900a-1-ii finding channel naming the proof and the unwatchable_cause or undecidable_cause, with no clearing action. It is never a refusal and never carries a refusal_cause. The refusal may fire only on the literal reached_through 'not_reached' — never on falsiness, never on entered_entry_point alone, and never on the derived observation_ok alias."
    - "The verdict must carry the unit, the un-entered entry point and the offending test nodeid so BO-2900e-1's first message is composable without re-deriving anything, and must be idempotent for a given tree plus test-run result."
    - "done_proof.py is deployed via build_ac_store's deploy_map (scripts/build_phases_ac_store.py, alongside the existing scripts/ac_store/done_proof*.py and _done_proof_*.py entries; re-verified 2026-10-21 — the list moved out of scripts/build_phases.py). Any NEW module it imports (the BO-2900a-2 observer) MUST be added to that deploy_map in the same change or the deployed check_done_proof hook and the REQUIRED CI done-proof job crash with ModuleNotFoundError — see CLAUDE.md 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest'."
delivers_to:
  agent: python-coder
  contract: "Extended verify_done_eligible() return dict: { eligible: bool, reason: str, refusal_cause: 'proof_not_through_entry_point'|'no_entry_point_reaches_code'|null, unit: '<repo-relative source path>'|null, entry_point: '<repo-relative source path>:<callable>'|null, offending_test: str|null, passing_tests: [str], failing_tests: [str], dangling_tags: [dict] }. unit and entry_point name the unit the AC's implemented_by declares, never a module stem or a build-output copy (BO-2900a-1-iv). An unwatched or undecidable reach record adds no key and changes no key (BO-2900a-2-ii, BO-2900a-2-iii). While the rule is report-only (BO-2900a-1-ii) the dict is equal in every key to the rule-not-invoked verdict and the facts travel on the structured finding { unit, entry_point, offending_test, refusal_cause } instead. Consumed by scripts/commit_guardian/check_done_proof.py in all three modes (precommit, ci, ci-changed) and by the BO-2900e-1 message layer."
expects_from:
  ac_id: BO-2900a-2
  contract: "The AMENDED reach_record of BO-2900a-2 (its it_requirements.config_schema_fragment is authoritative), one per (proof test, declared unit), derived by watching the proof test execute — never from its source text. This AC asks the question naming the declared unit it drew from the AC's implemented_by (BO-2900a-1-iv), so the subject is never empty (BO-2900a-2-iii), and reads these fields: { test_nodeid: str, unit: '<repo-relative source path>', entry_points: ['<repo-relative source path>:<callable>'], entered_entry_point: bool, reached_through: 'reached'|'not_reached'|'undecidable', undecidable_cause: 'subject_not_named'|null, observation: 'watched'|'unwatched', unwatchable_cause: 'non_python_child'|'isolated_interpreter'|'observer_displaced'|'recorded_nothing'|'propagation_failed'|'unknown'|null }. Only reached_through == 'not_reached' can lead to a refusal; 'undecidable' or observation 'unwatched' gives no verdict; entered_entry_point is read only to word the reason and can never produce a refusal by itself. observation_ok is a derived alias and is not read for the verdict. reached_code and processes are carried by the record but not needed by this rule."
