notes: |
  THIS L1 IS THE GUARD ON THE GUARD AND IT WAS NOT IN THE BRIEF'S FOUR JOBS. It was
  added because BrainCandy asked that both traps be encoded as constraints on
  acceptable behaviour, and because a constraint stated only in the parent's prose
  is not something anyone can fail. The cheapest implementation of ACD-2300a, b and
  c satisfies all three of them completely while violating every clause here.

  THE ONE SENTENCE THE WHOLE TREE TURNS ON, taken from the user's own framing:
  BOTH TRAPS SHARE ONE ROOT CAUSE — AUTOMATION THAT WRITES AN ASSERTION OF PROOF
  RATHER THAN AN OBSERVATION OF EVIDENCE. Every clause in the criteria above is that
  distinction made checkable at a different field.

  THE FOUR CLAUSES AND WHY EACH IS SEPARATELY NECESSARY:

    1. TRACEABLE. Anything written can be followed back by a person to what was
       observed. Without this the other three are unverifiable in principle, because
       there is nothing to compare the record against.

    2. NEVER MARKS WORK FINISHED. Trap 2. This is INHERITED FROM ACS-1300, whose L0
       states it as a refusal rather than a phasing decision — "no AC in the tree, at
       any level, may write the finished-state field ... not to be revisited by the
       BA, the IT PO, or an implementer who notices how easy it would be." That
       sentence is reproduced here because the temptation is stronger in this tree,
       not weaker: a backfill run that has just observed a criterion, its code and
       its passing test is one field away from a completion badge, and it will have
       assembled everything that makes awarding one look obviously correct. The
       disagreement raised in ACD-2300's notes was resolved on 2026-09-09 in this
       tree's favour: ACD-800, which promised the opposite, is retired (status
       deprecated, no successor). This L1 remains where the refusal is made
       falsifiable, and that has become MORE important rather than less — ACD-800's
       implementation shipped and is still deployed
       (scripts/ac_store/cross_reference_audit.py line 457 writes work_status),
       so the behaviour this L1 refuses is live in the repository even though no
       requirement asks for it any more. This L1's guarantee is what a future
       implementer will be checked against; the retired record no longer competes
       with it.

    3. NEVER RECORDS PROOF IT DID NOT SEE, AND ABSTAINS OUT LOUD. Trap 1's general
       form. The abstention must be REPORTED, never a silent skip — ACS-1300's
       inherited rule is "a skipped record is invisible, and invisibility is the same
       defect one level down." A tool that quietly processes 4,000 of 5,566 items and
       reports success has told the reader something false about the other 1,566.

    4. REVIEWABLE IN PIECES. This is the clause that makes the other three real
       rather than ceremonial, and it is the one an implementer will treat as a
       preference. Every safeguard above depends on a human actually looking. A
       proposal set of five thousand items is not reviewed, it is accepted — and an
       accepted-in-bulk proposal set is Trap 1 with a signature on it. Batch size is
       therefore a correctness property of this capability and not a usability nicety.

  A NEGATIVE CONTROL IS MANDATORY AND A GREP IS NOT EVIDENCE. Every clause above is
  a promise about what does NOT happen, and this repository's recorded history is
  that such promises pass their tests while being false. CLAUDE.md's "Gate / Workflow
  ACs — Verify Behaviorally, Not by Grep" exists because the fast-lane feature, built
  specifically to defeat phantom-done, shipped a runner that passed its grep-only
  structural tests while never executing its own gates. The BA must specify at least
  one behaviour per clause where the tool is fed evidence it cannot trust and the
  correct outcome is a reported refusal to write, proved by running it.

  BYTE STABILITY IS INHERITED, NOT RE-DERIVED — see TQ-400e-1 in doc_links. It also
  serves clause 4 directly: a run that reformats every record it opens produces a
  change nobody can review, which defeats the review promise even when every
  individual write is correct.

  WHAT THIS L1 DOES NOT COVER, SO IT IS NOT MISTAKEN FOR A UNIVERSAL HONESTY
  CONTRACT: whether a check that reports success actually ran is GE-120's and
  TQ-500's; whether an answer states its denominator is ACS-1100's, inherited by this
  whole tree. This L1 governs only what THIS capability writes into the record.
