criteria: |
  Given build-feature.md defines an inline fallback completion message template
    (used when build-epic.js does not return a structured result),
  When the fallback template is rendered,
  Then it includes a summary section with the epic title,
  And it includes a worktree section with a WORKTREE_PATH placeholder,
  And it includes a manual tests section with generic smoke-test suggestions,
  And it includes a finalize section with an EPIC_NAME placeholder in the /finalize-feature command,
  And all four sections appear in the standard order.
