criteria: |
  Adopt the new build model safely -- nothing breaks, and undo it in one step.

  The move to the new way of building requirements arrives as a series of safe,
  reversible steps rather than one risky switch. At every stage the build keeps
  working, existing requirements and already-finished work are preserved untouched,
  and any change can be undone in a single step. New capabilities are proven on our
  own project first, before any other project is ever asked to adopt them, and each
  project only ever moves at its own pace. The result: you gain the new model's
  benefits without downtime, broken builds, or lost work.
