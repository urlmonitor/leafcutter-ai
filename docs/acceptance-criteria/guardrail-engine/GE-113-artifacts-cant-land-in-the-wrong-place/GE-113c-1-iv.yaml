    relationship: describes
    status: exists
  - path: docs/acceptance-criteria/guardrail-engine/GE-113-artifacts-cant-land-in-the-wrong-place/GE-113c-1.yaml
    relationship: related
    status: exists
  - path: docs/acceptance-criteria/guardrail-engine/GE-115.yaml
    relationship: related
    status: exists
  - path: docs/acceptance-criteria/ac-store/ACS-300-component-governance/ACS-300g-6.yaml
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Single shared helper mandate: every guard under scripts/commit_guardian/ that needs the project root must obtain it through the ONE shared _resolve_root helper (the GE-113c-1 shared resolver). Forbid per-guard Path(__file__).resolve().parents[N] root literals, any resolution that follows the .leafcutter symlink to the workspace parent, and any bespoke per-guard resolver that duplicates the shared one."
  - "Consolidate the THREE currently-divergent mechanisms now present on origin/main into ONE: (a) the ACS-300g-6 _repo_root() inside check_components_integrity.py (git toplevel + __file__ fallback); (b) _resolve_root.find_project_root() (walks up for .git/CLAUDE.md, follows the .leafcutter symlink — still used by check_secrets.py); and (c) the _resolve_worktree_root() that GE-115/#235 added inside check_doc_frontmatter.py (git rev-parse --show-toplevel + find_project_root fallback). The last two were added independently to fix the same class of bug per-guard — exactly the divergence this AC forbids. Fold all three into the single shared helper and migrate every guard onto it."
  - "The shared helper's canonical algorithm is `git rev-parse --show-toplevel` (CWD-relative, correct in worktrees) with a safe deterministic fallback when git is unavailable; reconcile _resolve_root.find_project_root()'s existing walk-up semantics to this (or vice versa) so there is ONE behaviour, not two."
  - "Regression-proofing as a testable invariant: no guard in the commit_guardian guard set derives the project root by any mechanism other than the shared helper. State the WHAT (e.g. a meta-test or repo assertion that finds no residual parents[N] / symlink-following / bespoke _resolve_worktree_root root derivation across the guard set) and let python-coder choose the HOW."
  - "The git-unavailable graceful fallback (wrap the subprocess, no bare except, warn, safe deterministic fallback per the project error handling policy and ACS-300g-6) lives ONCE in the shared helper, not duplicated per guard."
  - "Deployed/template parity (ADR-001): the shared helper and every migrated guard are edited under templates/scripts/commit_guardian/ and round-tripped to scripts/ via build.py — never edit only one side."
  - 'Guard classification (test-design input, 2026-10-21; scope templates/scripts/commit_guardian/*.py and hooks/*.py). MIGRATE, parents[N] or __file__-relative project root: check_components_integrity (module REPO_ROOT = parents[2] plus its own _repo_root(): git toplevel with a parents[2] fallback), check_structural_change (dead REPO_ROOT = parents[2] at L83; project_root already comes from find_project_root), check_workflow_meta (parents[3] in main(): lands outside the project from the installed .leafcutter copy), check_ac_coverage and check_v2_ac_store_alignment (_repo_root(): script_dir.parent.parent.parent with a cwd fallback), hooks/check_ac_limits (_find_project_root(): __file__ ancestor walk with a parent.parent.parent fallback).'
  - 'Guard classification, MIGRATE, bespoke HOOK_ROOT env override plus cwd-ancestor walk for .git/CLAUDE.md (seven byte-identical copies of _find_project_root): check_ac_schema, check_ac_circular_deps, check_ac_governance, check_ac_parent_covered_by (also its strategy-3 cwd walk for ac_parent_id.py), check_ac_pattern_refs, check_surface_components_e2, check_surface_components_e3; plus check_ac_limits (_find_ac_store_root: HOOK_ROOT plus the same cwd walk).'
  - 'Guard classification, MIGRATE, bespoke git rev-parse --show-toplevel resolver, each with its own miss behaviour (cwd, skip, raise, empty string, or find_project_root): check_doc_frontmatter (_resolve_worktree_root), check_agent_diagrams, check_architecture_scaffolds (_git_root), check_diagram_naming, check_doc_types_agents, check_glossary_coverage, check_mermaid_drift, check_paths_integrity (_git_root), check_placeholder_defaults (inline toplevel plus _find_repo_root walk), check_roadmap_schema (_find_root), check_package_surface_declaration (_repo_root), hooks/check_agent_spawn_consistency (_get_repo_root plus an inline toplevel in the registry disk fallback), hooks/check_files_touched_reconciliation (_get_repo_root), transform_doc_index (_resolve_repo_root), transform_agent_registry (_resolve_repo_root), regenerate_roadmap_mirror (_find_repo_root).'
  - 'Guard classification, ALREADY COMPLIANT (root only through _resolve_root): check_secrets, check_build_drift, check_output_drift, check_agent_registry, check_lint_gate (find_git_toplevel_strict) and every guard that imports find_project_root. OWNED ELSEWHERE: check_mermaid_parent_link (GE-113c-4) and check_adr_cross_reference (GE-113c-5).'
  - 'Guard classification, DOCUMENTED EXCEPTIONS (package-relative or not a project-root question; they stay and are the only allowed matches of the regression scan): check_secrets _DEPLOYED_SIBLING_SCANNER_DIR (parent.parent.parent to its sibling skills/security-scanner/scripts), hooks/check_ac_done_on_merge (parent.parent.parent to its sibling ac_store/mark_ac_done.py), transform_doc_index parents[1] (its sibling generate_doc_index.py), diagram_type_validators, doc_type_validators and check_exception_handling (__file__ ancestor walk for the package''s own config JSON), _ac_store_locator (__file__ ancestor walk to locate the done_proof.py code module), hooks/check_agent_spawn_consistency sys.path.insert of parent.parent (imports its sibling modules one directory up), _frontmatter_path_resolver_locator (_HERE for a sibling module), check_build_drift and check_output_drift (_HOOK_FILE handed to the shared resolve_manifest_path), ensure_precommit_config (_PACKAGE_ROOT = parents[1] as the main-tree fallback: resolves the git commondir, not the project root, and is standalone by ADR-031), run_hook.py (compares toplevels to detect a secondary worktree and walks cwd ancestors for a Poetry pyproject.toml; the runner, not a guard), install_pre_commit_shims.py (installer CLI, not a guard). _work_items_scanner derives its root from a caller-supplied config path, not from its own location, and is not a guard.'
  - 'Migrated guards may use either entry point of the one shared module: find_project_root() (never fails, safe fallback) or find_git_toplevel_strict() (NO_REPO on a miss). What a miss MEANS (skip, warn, block) stays each guard''s own policy, as _resolve_root.py already states for the manifest lookup; only the resolution is shared.'
  - The HOOK_ROOT test/CI override that the cwd-walk guards honour today when they resolve the project root keeps its meaning after migration and is honoured for root resolution in one place, the shared module, so their existing tests keep passing without per-guard copies. HOOK_ROOT used only as a git -C target (check_ac_governance, check_ac_pattern_refs, _ac_governance_baseline) is not root resolution and is out of scope.
  - 'Guard classification, NOT IN THIS RECORD (flagged for a decision): guards that take the project root as the bare process cwd, with or without a HOOK_ROOT override, and no resolver of their own: check_hook_parity, check_hook_trigger_reachability, check_identifier_uniqueness, transform_component_vocab, doc_validators, verify_precommit_active, _hook_trigger_census, _remedy_declarations, and check_ac_schema main() (HOOK_ROOT or cwd, besides its declared _find_project_root). They do not duplicate the shared resolver, but they read the wrong root when run from a subdirectory.'
test_required: true
test_intent:
- clause: each guard obtains the project root exclusively through that one shared helper
  needs_test: true
  reason: Routing every guard through the shared helper is the consolidation itself, and a guard left
    on its own resolver reads the wrong root from the installed copy.
- clause: no guard re-derives the project root via Path(__file__).resolve().parents[N], via following
    the .leafcutter symlink to the workspace parent, or via its own bespoke resolver duplicated from the
    shared one
  needs_test: true
  reason: A residual parents[N] or bespoke resolver is exactly the wrong-root defect, and only a check
    over the guard sources finds one before a commit hits it.
- clause: a new guard added later that needs the project root reuses the same shared helper rather than
    introducing its own resolution mechanism, so this wrong-root bug class cannot recur
  needs_test: true
  reason: Only a standing check over the guard set, with a closed list of allowed exceptions, stops a
    future guard from bringing its own resolver back.
