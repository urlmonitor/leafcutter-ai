test_rationale: >-
  Every case drives the reconciliation as a process against a fixture repository,
  because the one assertion that matters cannot be made against today's tree: a test
  over the real repository asserts the disagreements that exist today, which is true
  the day it is written and can never fail on the day the next check is advertised —
  the day this AC exists for. The added-advertisement arm is the decisive one and is
  repeated per place, because the cheap implementation holds a written-in list of
  surfaces, and such a list passes a single-place test while silently skipping the
  other three. The config.py case is separated out because that surface is executable
  code and the tempting reader is an import, which both changes the result under
  import side-effects and converts GE-120h-1-i's unreadable-place outcome into a
  crash.
declares_side_effect: false
delivers_to:
  agent: python-coder
  contract: >-
    Per run, the reconciled population as a structured result: for each advertised
    check, its name, every advertising place that claims it (one of the four, named),
    and whether any hooks_manifest.hooks entry runs it — plus the count of
    advertisements actually reconciled and, per GE-120h-1-i, the set of places that
    could not be read and are therefore excluded from that count. Per-place
    attribution must survive into the result: GE-120h-1-i cannot name an unread place
    and GE-120h-2 cannot ratchet a population it cannot enumerate if the result is
    flattened to a bare list of names. Consumed by GE-120h-2 (the ratchet), GE-120h-1-i
    (the unread-place reporting) and GE-120h-4 (the page whose per-check statements
    must agree with it).
