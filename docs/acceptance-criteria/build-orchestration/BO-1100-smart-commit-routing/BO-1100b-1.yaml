criteria: |
  Given the routing config classifies staged files into groups,
    and the staged files are:
      - tickets/02_in_progress/TICKET-001.md  (group: "tickets")
      - scripts/commit_guardian/new_hook.py    (group: "implementation")
  When the commit agent finishes classification and detects 2 distinct groups,
  Then the commit agent pauses before composing any message,
  And the commit agent presents a warning to the user indicating:
    "Mixed commit detected: staged files belong to 2 groups."
  And the warning is presented BEFORE any subject line is drafted.
