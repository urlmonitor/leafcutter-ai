change_target: code
risk_surface: contract_boundary
test_required: true
test_rationale: |
  A two-valued verdict forces every pointer the checker does not understand into one of the two
  buckets. Classifying it as sound hides real drift; classifying it as broken produces noise an
  adopter learns to ignore, which hides real drift a second way. The test must assert the third
  value exists and that the unresolvable pointer appears in neither of the other two lists.
test_spec:
  - name: test_unclassifiable_pointer_is_reported_as_unresolvable
    target_dir: unit_tests/product_truth/
    description: "A pointer of an unknown target kind is reported as unresolvable with a stated reason."
    type: unit
    angle: boundary
    framework: unittest
  - name: test_unresolvable_pointer_is_in_neither_the_resolved_nor_the_broken_set
    target_dir: unit_tests/product_truth/
    description: "The unresolvable pointer is excluded from the resolved count and absent from the broken list."
    type: unit
    angle: boundary
    framework: unittest
notes: |
  Named mutation: fold unresolvable into resolved. UXP-700c-1's tests all stay green because
  every pointer it feeds is classifiable; only this record turns red. That asymmetry is why it
  is a record of its own rather than a clause of the parent.
