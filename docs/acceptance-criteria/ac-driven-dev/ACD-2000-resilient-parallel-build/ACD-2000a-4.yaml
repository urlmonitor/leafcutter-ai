it_requirements:
  - "EXTEND docs/reference/ac-schema.md -- do NOT start a second reference. It is the incumbent field reference for the AC record; a field documented away from the schema reference is a field nobody finds. If the writer believes a standalone page is warranted, the burden is to move the whole field reference, not to fork it."
  - "DO NOT PUBLISH THIS DOC BEFORE ACD-2000a-2 HAS SETTLED PER-RUN VS PER-LIFETIME. The second criterion requires a statement of fact, and a reference that says 'it depends' fails the operator use the fourth criterion names. The depends_on edges on ACD-2000a-1, -2 and -3 are load-bearing for this AC, not decorative."
  - "IF THE SETTLED SCOPE IS PER-LIFETIME, DOCUMENT THE CLEARING PROCEDURE AS AN OPERATIONAL RUNBOOK STEP -- who does it, exactly what they write, and where. Without it the first exhausted budget becomes a support incident. State explicitly that clearing is an APPEND (a recorded decision) and never a deletion of the earlier attempts."
  - "STATE THE APPEND-ONLY RULE TOGETHER WITH ITS CONSEQUENCE, not just the rule. The consequence is the load-bearing half: the trail IS the retry budget, so any rewrite silently resets the cap and turns a crash into an infinite retry loop. A doc that states the rule without the consequence produces the next author who tidies up the log."
  - "STATE EXPLICITLY THAT A DECLARED BUDGET OF ZERO MEANS ESCALATE ON THE FIRST FAILURE AND IS NOT THE SAME AS DECLARING NOTHING. Readers collapse that distinction by default, and collapsing it silently doubles the budget of every requirement that asked for none."
  - "INCLUDE A WORKED DIAGNOSTIC EXAMPLE, not only a field table: a real stuck requirement's trail as it appears on disk, and the two sentences an operator reads off it -- how many attempts remain, and what to do next. The fourth criterion is a comprehension test and a field table alone does not pass it. Use a real record from the store, per CLAUDE.md's real-artifact convention, not an invented minimal one."
  - "DOCUMENT THE FIELDS BY THE IDENTIFIERS THE STORE ACTUALLY USES, so a reader can match what they see in a YAML file to a section. Reconcile with the slot names ACD-1900a registers -- if this doc and the schema disagree on a name, the schema wins and the disagreement is a defect to report, not to paper over."
  - "LINK, DO NOT RESTATE. The claim / hand-back / reclaim lifecycle is ACD-2000b-5's reference doc and the state machine is ACD-2000a-5's diagram. Duplicating either creates the stale second copy this migration keeps producing."
  - "Must pass the repository doc gates: check-doc-frontmatter, check-doc-length and check-doc-index. Register the change in docs/INDEX.md if the guide's index entry changes."
