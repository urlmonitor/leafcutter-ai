readiness: draft
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c-4.yaml"
criteria: |
  Given two record shapes exist in this system: a phase-telemetry record
    carrying event_type, timestamp, ticket_path, agent_name and payload
    (the shape INF-400g-2 pins for the drive-telemetry emitter), and a
    knowledge-capture record carrying event, timestamp, agent, component,
    destination and entry_kind,
  And they have different lifecycles — telemetry is appended and aggregated
    for trend analysis and is never consumed, while a knowledge emission is
    drained exactly once and then watermarked,
  When a drive writes both kinds of record,
  Then the phase-telemetry records are written to the telemetry sink and the
    knowledge-capture records are written to the knowledge-emission sink, and
    neither file receives the other kind,
  And the harvester reads only the knowledge-emission sink, so a run over a
    corpus containing no knowledge records drains nothing and reports zero
    records read rather than zero records recognised,
  And the aggregation surface that reads the telemetry sink returns the same
    results before and after the split, because no telemetry record moved,
  And the split is recorded in the architecture documentation as the reason a
    single sink with a type discriminator was not chosen: one file drained by
    a watermark and simultaneously appended for aggregation makes an unrouted
    record and an unaggregatable record indistinguishable.
