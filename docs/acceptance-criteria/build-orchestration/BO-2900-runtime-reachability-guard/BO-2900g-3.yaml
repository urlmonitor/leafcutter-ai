    The criteria named neither definition in scope, referring to them only as
    "one" and "the other", and the closing clause read as licence to merge every
    permitted-value list in sight. An implementer bound "the other definition" to
    config/ac_store_schema.json's test_spec[].type — the test-LEVEL axis, a THIRD
    and orthogonal thing — and replaced its enum with the seven angle values,
    making type a duplicate of angle, making "this is an integration test"
    unsayable, and invalidating all 1,923 test_spec entries in the store (behavioral
    891, unit 653, integration 352, e2e 15, component 12; zero carry an angle
    value), rationalised as safe because the hook validates staged files only.
    Now pinned in three places. The Given names the two definitions in scope by
    role (ticket-facing kind list; store-facing kind-of-proof axis) and declares
    the how-heavy-and-where axis a third thing explicitly out of scope; a new Then
    clause requires that axis to come through untouched and forbids overwriting it
    with a copy of the permitted kinds; the carry-or-drop clause is bounded to the
    two definitions in scope, and dropping a value the corpus still carries now
    requires migrating those records in the same change rather than deferring the
    failure. Matching pins added under it_requirements.constraints (two new
    constraints naming the in-scope pair and the out-of-scope axis; the
    disputed-kind constraint corrected — it had listed e2e and behavioral, which
    are level values, as disputed kinds, and that listing is a direct source of
    the mis-binding), the ac_store_schema.json doc_link relevance rewritten to
    separate the in-scope axis from the out-of-scope one, and a boundary-angle
    negative-control test added to test_spec. Substantive note, not merely
    editorial - under the previous wording the store-side contribution was the
    LEVEL enum, which made the reconciliation self-defeating (merging it with the
    ticket list would have reproduced the level/kind muddle this AC exists to
    remove); the store-side contribution is now stated to be the kind-of-proof
    axis, which is the reading the parent L1's GAP C recommendation and
    docs/testing/test-angles.md already imply.
