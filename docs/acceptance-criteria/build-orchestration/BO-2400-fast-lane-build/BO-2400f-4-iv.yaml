risk_surface: internal
notes: |
  An earlier draft of this criterion required breaking to be derived as
  "any built AC declares risk_surface contract_boundary", on the reasoning that
  over-reporting is cheap. Both halves were wrong and it was rewritten before any
  test or code was authored.

  Wrong on accuracy: risk_surface marks the area a criterion touches, not the
  compatibility of the change made to it. Most contract-boundary work is additive or
  corrective. TKT-600a-1 is the worked counter-example — contract_boundary, genuinely
  non-breaking.

  Wrong on cost: a wrongly-true flag auto-cuts a MAJOR release tag on merge and cannot
  be withdrawn, while a wrongly-false flag sits in the PR diff where review can catch
  it. And because contract_boundary is common and rarely means breaking, the rule would
  have produced mostly-wrong trues — which is worse than no signal, because it teaches
  reviewers to ignore the field.

  The honest position is that the run cannot know. So it emits the recoverable value and
  says out loud that it did not decide, rather than dressing a guess as a derivation.
