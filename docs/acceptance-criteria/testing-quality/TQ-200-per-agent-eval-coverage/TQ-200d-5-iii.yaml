    state: existing
  - path: scripts/evals/produced_tests_mode.py
    state: existing
  - path: scripts/evals/agent_launch/command.py
    state: to_be_created
  - path: scripts/evals/README.md
    state: existing
  - path: docs/how-to/run-a-live-agent-eval.md
    state: to_be_created
