notes: |
  WHY THIS IS A SIBLING OF ACD-2200d RATHER THAN PART OF IT. They are one
  moment in time but two guarantees with different failure modes: d is about
  what is recorded, e is about what is exposed. Splitting them also keeps each
  inside the 5-L2-per-L1 cap, which a combined "commit and publish" L1 would
  strain.

  THIS IS A CONSENT GATE AND INHERITS THE ACD-2200b RULES. The question at the
  end is a user decision. It may not be answered by an agent and a well-formed
  agent reply carrying an explicit answer is still not consent (ACD-2100c-1 /
  ACD-2100c-4). If the run genuinely cannot reach a person the correct default
  is the conservative one -- do not open.

  DECLINING MUST NOT BE A DEAD END. If the answer is no the user needs a stated
  way to open it later. An opt-in that strands the work is worse than an
  unconditional one, because the ceremony reappears as manual recovery.

  ENVIRONMENT CONSTRAINT FOR THE IT PO, not a requirement of this AC: in this
  workspace opening a pull request is blocked at the CLI level under the EMU
  account and needs either an account switch or the REST endpoint. Whatever
  carries out the affirmative answer must surface that failure as a failure --
  a silent non-open after the user said yes is the mirror image of the defect
  this L1 fixes.
