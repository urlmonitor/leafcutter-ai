title: "Quick-fix workflow operates in current worktree without branch switching"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given a user is on branch "EPIC-SomeFeature" in an existing worktree,
  When they invoke /quick-fix with a diagnosis specifying a file and root cause,
  Then the workflow performs all operations (AC creation, test writing, fix,
    commit) in the current worktree,
  And git branch --show-current returns the same branch name both before
    and after the workflow completes,
  And no new worktree directory is created during execution.
