it_requirements:
  - "Which kinds oblige which facts, and the names of those facts, must be read from the requires_frontmatter list in config/diagram_types.json at the moment of the request. No list of three kind names and no list of field names may be held in the producer or in the tests."
  - "A request for an obliging kind without the fact is a refusal under INF-1300d-3's contract: nothing written anywhere, non-zero outcome, and a message naming the kind, the obliged field and the sort of value it takes."
  - "No stand-in may ever be written for an obliged fact: not an example, not an empty list, not a value copied from a neighbouring document, not a value inferred from the component or the title. Omitting the field entirely is equally forbidden - it passes today's checks and teaches every future author that the declared obligation is optional."
  - "When the fact is supplied, the produced document must carry the supplied value verbatim and must be accepted by the project's full commit-time check set as produced."
  - "MEASURED CONSTRAINT ON THE OBSERVATION: the check set cannot see this obligation. frontmatter_validators.validate_paths only tests related_docs, related_code and architecture_diagrams for path existence, and nothing anywhere reads requires_frontmatter. So related_surfaces and related_agents are unobserved by every hook, and even related_code is only observed when a value is present. 'The checks passed' is therefore not evidence for this AC's first arm; the presence, absence and content of the obliged field must be asserted directly against the produced artifact."
  - "The path-valued case explains why omission-plus-placeholder is the worst option available: a sample path in related_code turns a document the project would have accepted into one it blocks, so the most helpful-looking implementation produces exactly the outcome INF-1300a exists to prevent."
  - "Reading the declaration must follow the project error handling policy in CLAUDE.md, and a declaration that cannot be read is a refusal rather than an assumption that nothing is obliged."
