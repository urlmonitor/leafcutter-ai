criteria: |
  See the real distance to each standard before you switch any of them on.

  Before a standard is taken up you are shown how far the project currently sits
  from it — counted from what is actually in the project, alongside the total it
  was counted against. Adopting, deferring or reshaping a standard becomes a
  decision made on a measurement rather than on a guess.
