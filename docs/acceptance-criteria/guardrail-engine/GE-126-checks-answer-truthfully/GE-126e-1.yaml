  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND IS NOT TERMINAL. This record produces the per-check
  classification that the whole rest of the branch is built on: GE-126e-2 aggregates it,
  GE-126e-3 decides whose classifications are produced, GE-126e-2-i constrains delivery,
  GE-126e-4 draws it and GE-126e-5 publishes the first measurement of it. The contract is
  written per-check rather than as a report, because the report is GE-126e-2's deliverable
  and conflating the two lets an implementation satisfy both with a summary nobody can
  re-run.

  expects_from IS NULL AND THAT IS A DECISION. Head of the GE-126e chain. Not an unenriched
  field. DO NOT REFILL.

  THE TEST CONTRACT IS DELIBERATELY NOT A SPOT-CHECK OF THE THREE KNOWN HOOKS, and this is
  the point most likely to be lost in implementation. Not one descriptor names
  check_ac_governance, check_ac_parent_covered_by or check_hook_parity. Every descriptor
  turns on a fixture whose correct classification is fixed in advance. A suite that
  substitutes 'the census finds the three known instances' is testing the census against
  the answer it was written from, and it expires the moment GE-126a to GE-126c land.

  A CHECK THE CENSUS WILL VERY LIKELY SURFACE, RECORDED HERE RATHER THAN ACTED ON. While
  using check_ac_limits.py during this feature's authoring, the business analyst observed
  that it carries the census's target shape itself: three silent exit-0 returns, argv
  ignored in favour of the HOOK_TEST_FILES seam, and no diagnostic on any path - so its
  silence is fail-open in three ways and is not evidence of a pass. It was not filed as a
  known issue and it is NOT in scope for this tree. It is written down here because
  GE-126e's census is the mechanism that should surface it, and because a census that runs
  and does NOT surface it would be worth investigating. Do not widen any record here to
  repair it; GE-126e-2-i is explicit that the census reports and does not repair.

  THE EXECUTION-ISOLATION AND TIMEOUT REQUIREMENTS ARE MINE, NOT THE BA'S. Roughly seventy
  checks executed twice is on the order of a hundred and forty process launches, several of
  which mutate whatever tree they are pointed at. Without disposable trees the census
  corrupts its own measurement after the first mutating check; without a timeout one
  hanging check makes the whole census unrunnable and therefore unrun.

  SIZED L. A process-isolated execution harness, four-way outcome classification, and
  disposable-tree management. This is the largest single record in the tree.

