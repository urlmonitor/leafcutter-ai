id: GE-124c-2-ii
readiness: approved
priority: high
title: "A check that cannot read the criteria store says so instead of passing"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given the staged set contains an in-scope screen component whose declaration
    names a criterion id
  And the acceptance-criteria store cannot be reached, so no id can be resolved
  When the commit-tier declaration check runs
  Then the check reports that it could not resolve any id and names the reason
  And its report is distinguishable from a clean pass — it does not print a
    success message and does not report zero findings as though every id had
    resolved
depends_on:
  - GE-124c-2
