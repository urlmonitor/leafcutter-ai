id: ACS-100h-7b
title: "/create-epic runs the AC-tree-limit check before stub generation and blocks on violation"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the /create-epic scaffold procedure (Phase 1 — Scaffold, which writes
    Master_Plan.md and N ticket stub files),
  When the procedure runs,
  Then BEFORE writing any Master_Plan or ticket stub file it invokes the shared
    AC-tree-limit check (ACS-100h-7a) against the target AC subtree,
  And if the check returns one or more violations, the procedure does NOT write
    any scaffold file and instead returns a blocking error that names each
    over-limit parent (ID, level, ID-derived child count, effective limit) and
    directs the author to split the AC tree first using the ac-tree-split
    procedure,
  And if the check returns no violations, the procedure proceeds to stub
    generation exactly as it does today.
depends_on: [ACS-100h, ACS-100h-7, ACS-100h-7a]
doc_links:
  - path: templates/agents/create-epic.md
    relationship: specifies
    status: exists
  - path: templates/skills/ac-tree-split/SKILL.md
    relationship: related
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: related
    status: exists
assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "The limit check MUST be invoked before any scaffold file is written; on violation, zero scaffold files exist afterwards (no partial Master_Plan or orphan stubs left on disk)"
  - "The blocking error MUST name each over-limit parent and point the author to the ac-tree-split procedure — state the remedy, not just the failure"
  - "create-epic is is_ticket_phase: false (supervisor tier); this AC edits its agent-template body (templates/agents/create-epic.md). The template change is llm-expert work, not python-coder"
  - "MUST call the single shared callable from ACS-100h-7a rather than re-deriving the limit rule in the template prose, so commit-time and scaffold-time enforcement stay identical"
delivers_to: null
