notes: |
  Sequenced behind TQ-400e-3 on the product owner's instruction: without a working
  exemption path the pile is padded with records that can never be proven, and a
  pile that cannot be finished is a pile nobody works.

  Scale at authoring time (measured 2026-08-17 over unit_tests/): 259 of 641
  finished L2/L3 records have no test carrying their coverage tag. That is the
  starting population, minus whatever the exemption path legitimately removes.

  The "not yet decided" state is deliberate and must be explicit rather than
  implied by absence — an undecided record and a record nobody has looked at must
  not be the same thing, which is the distinction TQ-400d-3 then enforces.

  Both final clauses are completeness controls: one stops the list from silently
  shrinking, the other stops it from being padded with everything.

  IT-PO ENRICHMENT NOTE (2026-08-17). The exempt-exclusion clause is the one most
  likely to be implemented as a local filter (`if rec.get("test_required") is
  False: skip`), which would work today and drift the moment TQ-400e-4 starts
  refusing reasonless declarations — at which point the pile and the sweep would
  disagree about the same 37 records. it_requirements state the consumption
  obligation and test_spec makes it falsifiable by flipping a declaration and
  observing the record enter the list.

  ==========================================================================
  THE LIST MUST DECLARE ITS INCLUSION RULE (2026-08-18, BA).
  ==========================================================================
  VERIFIED, AND WORSE THAN THE BRIEF SAID: this pile has THREE recorded counts, not
  two, and no two of them agree.
    - 244 of 607 — KM-ADM-005 criteria + notes, measured 2026-08-13, all record
      levels, identifiers quote-stripped before joining. Frozen as HIGH_WATER_MARK
      in the shipped ratchet, so it is the only one of the three that a build gate
      currently enforces.
    - 240 of 641 — TQ-400's L0 notes, measured 2026-08-17, finished L2/L3 records
      only.
    - 259 of 641 — THIS record's own scale note and its it_requirements, measured
      2026-08-17, same stated rule as the 240 and the same date, differing by 19
      with no explanation anywhere in the store.
  The third figure is the sharpest evidence of all: two figures in the SAME tree,
  taken on the SAME day, under the SAME stated inclusion rule, that disagree. A
  reader cannot tell whether the pile grew, shrank, was counted twice, or was
  counted correctly twice under rules that were never written down. Nobody can act
  on that, which is exactly the failure ACS-1100 describes.

  WHY THIS AMENDS d-1 RATHER THAN ADDING AN L3. The inclusion rule is a property of
  the list itself on its normal path — the list is not correct without it, and the
  same tests that assert membership must assert it. An L3 would frame "says what it
  counted" as an edge case of a list whose whole purpose is to be a count that
  people act on. It is also the clause TQ-400d's own notes ask for by name
  ("TQ-400d-1's worked list must declare its own inclusion rule and state which of
  these two populations it is drawing from").

  INHERITED, NOT DUPLICATED. The standing contract is ACS-1100 (ac-store,
  scope: standing) and this record stays in testing-quality. The clauses added here
  are this list's instance of ACS-1100b-1's method record and ACS-1100a-2's join
  normalisation; they are not a second specification of either, and the join rule
  is copied from the shipped ratchet rather than re-derived.

  DO NOT RESOLVE THE THREE COUNTS BY PICKING ONE HERE. The criterion requires the
  BUILT list to state which count it continues and why the others differ, computed
  at run time. Hand-typing a fourth reconciled constant into this record would
  reproduce the defect one more time.

  RE-APPROVAL. This record was readiness: approved on 2026-08-18 and these clauses
  widen its scope after that approval. readiness has been left as approved rather
  than silently downgraded, but the amendment is flagged in amended_by and should
  be put back in front of the approver.
