id: ACD-1600a-2
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "Generated ticket omits requirement and contract copies, keeping only the checklist"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given an AC ACS-100a-1 that carries it_requirements and delivers_to / expects_from contracts,
  When the ticket generator produces the ticket for ACS-100a-1,
  Then the ticket body does NOT restate the it_requirements values,
  And the ticket body does NOT restate the delivers_to or expects_from contract values,
  And the ticket carries only a lightweight workflow checklist plus the source_ac reference,
  And no spec field (criteria, it_requirements, contracts) appears in both the ticket and the store.
depends_on: [ACD-1600a, ACD-1900b-5]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Canonical source to change: scripts/ac_store/generate_ticket_from_ac.py (source-only Python; no templates/ counterpart)."
  - "The generator must stop emitting the ## Implementation Notes block built from it_requirements (currently _build_implementation_notes_section) and must not restate delivers_to / expects_from contract values in the ticket body."
  - "The emitted ticket must carry the source_ac frontmatter pointer plus a lightweight workflow checklist and no copied spec field."
  - "Single-source invariant: after generation, no spec field (criteria, it_requirements, contracts) is present in BOTH the ticket body and the store record."
  - "GOVERNANCE CAVEAT: this reverses ADR-400b / ADR-400b-1 (verbatim spec in ticket body) and is gated behind the ac_unit_of_work.emit flag per ADR-026 phase_acbuild_2_cutover; the flag-off path must still produce a valid ticket."
delivers_to: null
expects_from: null
origin_agent: BrainCandy
created: 2026-08-11
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
test_spec:
  - name: test_ticket_body_omits_it_requirements
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A generated ticket for an AC carrying it_requirements contains no ## Implementation Notes / it_requirements values in its body."
  - name: test_ticket_body_omits_delivers_and_expects_contracts
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The ticket body does not restate delivers_to or expects_from contract values."
  - name: test_ticket_carries_source_ac_and_checklist_only
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The ticket carries the source_ac pointer plus a workflow checklist and no copied spec field (single-source invariant holds)."
notes: |
  Ordering dependency added (2026-08-12, review GAP 1): depends_on ACD-1900b-5 so the
  fulfillment-gate dual-read (accepts source_ac coverage, not just ac_traceability) is in place
  BEFORE this AC drops the ac_traceability-bearing spec copy from the generated ticket. Without
  that ordering, thinning the ticket first would send a thin ticket carrying only source_ac into
  a gate that still skips ("absent ac_traceability -> ok") and verifies nothing = phantom-green.
