title: "Every switched-on run leaves an evidence record that a later done-proof can cite and read correctly"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a switched-on run in which cases that ask a real agent ran,
  When the run ends,
  Then an evidence record is written for that run naming, for each case: the case, the
    acceptance criterion it proves, whether it passed, failed or was not run, the agent
    asked, the model that answered, when it ran, the exact instructions and registry entry
    content it ran under, and the reply received,
    And a done-proof that cites that record can tell a case that passed from one that failed
    or was not run.

  Given a switched-on run in which one or more cases could not ask their agent,
  When the run ends,
  Then its evidence record is still kept, naming for each such case that it failed and which
    cause stopped it,
    And the run as a whole reads as failed in the record.

  Given an evidence record kept by an earlier switched-on run,
  When a later switched-on run ends,
  Then the later run adds its own new record and the earlier one is left unchanged.

  Given a switched-on run in which every case passed, but whose evidence record cannot be
    kept,
  When the run ends,
  Then the run is reported as failed, naming that its evidence could not be kept.

  Given an evidence record whose recorded instructions or registry entry differ from the
    ones the project ships now,
  When a done-proof reads that record,
  Then the record is reported as out of date for that agent.
