  - "For each referenced script, the completeness failure fires only when the derived templates/scripts/ copy is entirely ABSENT — the same missing-copy condition as the registry axis, applied to the template-reference promise source."
  - "Coordination decision (documented in BP-900e body): this L1 COMPLEMENTS BP-900b for template references rather than subsuming it. BP-900b stays the preflight; this check re-covers the same class at the merge gate and additionally covers the registry source BP-900b does not read. Avoid double-reporting within a single surface."
  - "Template-reference findings land in the SAME BP-900e-1 verdict as registry findings, carrying promised_by='template' with referencing_template set (and registry_entry_id null) so BP-900e-4 renders the correct origin — do not emit a second, separate verdict stream for the template axis."
