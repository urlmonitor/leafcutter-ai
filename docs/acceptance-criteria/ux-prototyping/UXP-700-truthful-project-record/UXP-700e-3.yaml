id: UXP-700e-3
title: "The record's labels come from declared vocabularies, so one thing has one name"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the labels a journey carries - the component it belongs to, and the tags it is filed
    under,
  When the record is checked,
  Then each component label resolves to a component registered in the project, and one that
    does not is reported naming the artifact and the label,
  And each tag matches the declared shape for a tag, and one that does not is reported the same
    way,
  And the check states how many labels it resolved, so a run over a record carrying no labels is
    distinguishable from a run in which every label resolved,
  And a label that differs from a registered one only by case or by spacing is reported as the
    registered one having been meant, rather than as a new label.
