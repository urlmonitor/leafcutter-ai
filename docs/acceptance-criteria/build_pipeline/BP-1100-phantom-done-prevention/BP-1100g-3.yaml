notes: |
  GAP E of BP-1100g, first half: the axis itself. BP-1100g-4 is the forcing
  function that stops it decaying to zero.

  THE OBSERVED STATE. The repo carries 2,266 tags of the existing coverage axis
  and zero of this one. The 2026-08-17 authoring pass objected that a declaration
  nothing reads back has no forcing function and would decay to the same 0% that
  the side-effect declaration sits at today. The user accepted the objection and
  widened the scope exactly as far as BP-1100g-4 and no further. DO NOT
  RE-LITIGATE.

  ONE SCANNER, TWO AXES. The scanner that collects the existing coverage tags is
  already fail-closed about non-passing outcomes and is already the place tests
  are associated with work. A second scanner would drift from it, and drift
  between two scanners of the same files is the EPIC-ComputedQualityGates layer-3
  failure again. Extending it also makes the one-reader-one-pass clause true by
  construction.

  THE FOURTH CLAUSE IS THE BOUNDARY AND IT IS NOT NEGOTIABLE. The existing axis
  decides which FAILING tests block. This axis must never touch that decision;
  its consequence lands in BP-1100g-4 and is about a MISSING test, at commit
  time, never about a failing one. An implementation that lets a kind tag change
  which failures block has converted a planning declaration into a verdict, which
  is the thing the parent L1 forbids. BP-1100g-3-i makes that clause falsifiable.

  IT-PO CAVEAT (2026-08-17) — MIXED SURFACE, NOT SPLIT. change_target is
  [prompt, code] and the two halves have different owners: clauses 2-4 are
  scripts/ac_store/done_proof.py (python-coder, and the load-bearing observable),
  clause 1 is the tag-authoring convention in templates/agents/test-writer.md §2i
  (llm-expert). A split into two L2 siblings was rejected because BP-1100g is at
  child_limit_override: 7. RECOMMENDED FOLLOW-UP for the user to apply: either an
  L3 child BP-1100g-3-ii (llm-expert) carrying clause 1 alone, with
  BP-1100g-3.covered_by extended to [BP-1100g-3-i, BP-1100g-3-ii]; or fold the
  tag-authoring convention into BP-1100g-1's llm-expert template pass, which
  already edits the same file. Until one of those happens, python-coder builds a
  reader for a tag nothing is instructed to emit.

  IT-PO ENRICHMENT NOTE. A second live reader of the same tag surface was found
  during enrichment and is now doc_linked: scripts/commit_guardian/
  check_test_ac_tags.py, a pre-commit hook with its own COVERS_REGEX running in
  warn mode. It is named in the constraints so the extension does not silently
  desync the two readers. it_requirements uses the package-surface OBJECT form:
  the JSON schema's root if/then does not fire for component: build-pipeline
  (kebab is absent from its enum), but scripts/ac_store/validate_ac.py's
  is_package_surface_ac ALSO reads the components list and does classify this AC
  as package-surface — the object form satisfies both.
