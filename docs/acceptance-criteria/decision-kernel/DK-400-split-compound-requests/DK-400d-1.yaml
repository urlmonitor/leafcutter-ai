criteria: |
  Given the reusable-criteria split waiting at the split gate with parts p1 to p4,
  And the gate shows the goal exactly as submitted beside every part,
  When the person human:user approves the split as shown at 2026-10-05T09:30:00Z,
  Then every part is recorded as kept,
  And the split records the answer approved, given by human:user at 2026-10-05T09:30:00Z,
  And the parts are released to run in dependency order,
  And no part had started before that answer.
