    type: unit
    angle: failure
    description: "A verified_by.check path that is absent (the post-rename state) gives holds false with a reason naming the check path; nothing raises."
    proves_clause: "a named check that does not exist fails the verification, naming the check"
    code_file: scripts/ac_store/_enforces_tags.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_2_check_without_an_enforces_tag_for_this_id_fails_naming_check_and_tag
