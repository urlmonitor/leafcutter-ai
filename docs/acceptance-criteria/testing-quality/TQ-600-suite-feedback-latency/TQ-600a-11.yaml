test_spec:
  - name: test_tq600a_11_store_sweep_is_at_least_five_times_faster_than_the_pure_python_parser
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Over the REAL on-disk store, in one process, time a full sweep with the
      pure-Python parser and a full sweep through the shared accessor. The accessor
      sweep takes at most one fifth of the pure-Python sweep. Assert the ratio, never
      an absolute number of seconds.
  - name: test_tq600a_11_no_store_reader_names_the_pure_python_parser_directly
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      Derive the reader inventory from the source and assert each entry resolves its
      parser through the shared accessor. The one documented exception is
      scripts/render_effective_prompt.py, which already uses the fast idiom inline;
      either route it through the accessor too or name it explicitly in the test.
  - name: test_tq600a_11_the_required_store_validation_check_beats_a_quarter_of_its_baseline
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      Exercise the store-wide schema validation entry point end to end over the real
      store, with and without the accessor, in the same sitting. Ratio at most one
      QUARTER. This is the required pull-request gate, so the deployed path is the
      one that matters. The threshold is a regression floor, not the target: parsing
      is 81.8% of this run, so 5.50x is the ceiling an instantaneous parser would
      reach and a fifth is unreachable by any parser choice. Measured at
      implementation: 30.16s -> 6.96s, a ratio of 4.33, against a predicted 7.34s —
      the change beat its own prediction and still could not have hit a fifth. Do
      NOT restore a fifth here without first reducing the 5.48s of non-parse work.
  - name: test_tq600a_11_the_accessor_is_reachable_from_a_deployed_commit_hook
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      After a build, import and run a commit-guardian hook that uses the accessor
      from the DEPLOYED layout. A ModuleNotFoundError here is the documented
      deploy-manifest failure and must be red before the fix, not discovered when the
      required gate blocks every merge.
test_rationale: |
  Three of the four descriptors exist because the obvious weak test for this change
  is a unit test that imports the accessor and asserts it returned the C class. That
  test passes on a change that nobody adopted, on a store of three fixture files, and
  on a helper that is never deployed — which are precisely the three ways this ships
  broken.

  So: the speed claim is asserted over the REAL store, because the cost is entirely a
  function of the store's size and a synthetic fixture reproduces none of it; the
  adoption claim is asserted against a mechanically derived inventory, because a
  change applied to three of seventy-six files looks identical to a change applied to
  all of them from inside any one of them; and the reachability claim is asserted
  from the deployed layout, because this repository has already shipped a hook whose
  dependency was absent at hook runtime while every unit test stayed green.

  The ratio form is deliberate. An absolute threshold on a shared host under agent
  load is a flaky test, and a flaky guard is removed within a month.
