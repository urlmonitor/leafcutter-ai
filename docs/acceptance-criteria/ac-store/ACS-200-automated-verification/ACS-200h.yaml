notes: |
  The backstop that makes ACS-200g-2's change-scoped exemption safe. Several of
  the store's rules are cross-record — the per-parent child limit, dependency
  acyclicity, and the parent/child back-link all depend on records a single
  pull request may never touch — so a purely change-scoped verdict can be green
  on both sides of a merge and wrong after it. Running the full rule set on the
  protected branch converts that class from "never detected" to "detected at
  the merge that caused it".
  Deliberately NOT specified here: whether the protected-branch run blocks
  anything (nothing is left to block once the change has landed) versus raising
  a visible failure. The observable outcome this AC owns is the failing result;
  what is done with it is a follow-on decision. Flagged for the IT PO / user.
