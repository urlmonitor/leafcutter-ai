it_requirements:
  - "_get_status must pass its captured value through _strip_yaml_value so a double- or single-quoted status resolves to the bare token. A quoted status previously failed the == 'done' trigger check, causing the ticket to be skipped entirely — a silent under-block (phantom-done slips through), the most severe failure direction."
  - "This is the done-ticket TRIGGER guard, distinct from the declared-list parsing of BP-1100e-1-v: a regression here fails toward a silent miss, not a safe false-positive, which is why it is captured separately."
  - "PORTABLE SURFACE: this lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py) pinned in BP-1100e-1; ADR-001 build.py round-trip parity applies."
