criteria: |
  Given a release has been prepared with version 0.5.0
    and 3 changelog entries exist for this release:
    - "Build tickets in dependency order" (goal: "Smart sequencing")
    - "Atomic commit for multi-file deliveries" (goal: "Atomic delivery")
    - "Cycle detection in dependency graph" (goal: "Smart sequencing")
  When the CHANGELOG rendering step runs,
  Then a Markdown file is produced containing:
    - a level-2 heading: "## 0.5.0 (2026-06-05)"
    - a level-3 heading for each goal group: "### Smart sequencing", "### Atomic delivery"
    - a bullet item for each entry under its goal group
  And the file is written to the project's CHANGELOG location
  And any existing content in the CHANGELOG file is preserved below the new entry
    (newest-first ordering).
