criteria: |
  As a person who wants to review or share the leafcutter Atlas without access to a
  live repo, I can run the Atlas in MOCK MODE so that every view renders from a bundled,
  schema-valid fixture repo instead of the real repo. One data-layer seam swaps the whole
  app to fixtures at once (no per-page hacks); a visible badge tells me I am looking at
  mock data; the LEAFCUTTER_MOCK server env sets the DEFAULT mock state, the app can
  OVERRIDE that default at runtime (cookie / query-param / in-app toggle), and a
  deployment that must guarantee real data can set an optional production LOCK that
  forbids overrides; and the fixtures are validated against the same schemas and parsed
  through the same loaders as real data so the mock output can never silently drift from
  the real shape. The Atlas stays read-only throughout; mock mode only changes what it reads.
