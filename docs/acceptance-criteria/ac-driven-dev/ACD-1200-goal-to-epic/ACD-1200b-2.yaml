id: ACD-1200b-2
readiness: reviewed
priority: medium
title: "User can proceed with approved-only subset or request bulk review"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the readiness report shows 2 of 5 leaf ACs are unapproved,
  When the system prompts the user with:
    "Proceed with 3 approved ACs only? (yes / review-all / cancel)"
  And the user answers "yes",
  Then ticket generation proceeds with only the 3 approved ACs
  And the 2 unapproved ACs are excluded from the epic
  And a summary confirms: "Generating epic with 3 of 5 ACs (2 excluded as unapproved)."

  Given the same readiness report,
  When the user answers "review-all",
  Then the system dispatches IT PO v3 to enrich and review the 2 unapproved ACs
  And after IT PO v3 completes, the readiness check is re-evaluated
  And any newly-approved ACs are added to the generation set.

  Given the same readiness report,
  When the user answers "cancel",
  Then no epic is generated
  And no tickets are created
  And no ACs are modified.
depends_on: [ACD-1200b, ACD-1200b-1]
