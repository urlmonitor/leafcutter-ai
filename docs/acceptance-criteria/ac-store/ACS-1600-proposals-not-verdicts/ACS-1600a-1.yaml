title: "A retired requirement is not offered as something to change"
component: ac-store
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
criteria: |
  Given the project holds both a requirement still in force and one that has
    been retired,
  And neither has yet been linked to the code that implements it,
  When a tool assembles the set of requirements it will propose changes to,
  Then the retired requirement is absent from that set,
  And the requirement still in force is present,
  And the retired one is left out on the grounds of its retirement alone —
    not because anything else about it happens to differ.
