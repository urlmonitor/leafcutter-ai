estimated_complexity: S
it_requirements:
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - 'During a run the kernel only reads the repository (ADR-060): no file under the repository root
    may change; the configured run root is the only place a run writes.'
  - Cancel needs a human actor (--actor human:<id>), is first-actor-wins, and leaves the run cancelled
    with no pending interaction; a later answer is rejected (cancelled_or_superseded).
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_an_unanswered_decision_leaves_no_record
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_decision_precedent.py::TestOnlyHumanApprovalStagesARecord::test_an_unanswered_decision_leaves_no_record):
      a decision waiting on its question stages nothing'
    covers:
      - DK-300b-2-iii
  - name: test_cancel_while_waiting_human_cancels_the_question
    target_dir: tests/kernel/integration/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/integration/test_cancel.py::TestCancelWhileWaiting::test_cancel_while_waiting_human_cancels_the_question):
      cancel at a human question ends the run cancelled'
    covers:
      - DK-300b-2-iii
  - name: test_cancel_then_resume_is_refused
    target_dir: tests/kernel/adapters/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/adapters/test_cli.py::TestCancel::test_cancel_then_resume_is_refused):
      python -m kernel cancel --run-id R --actor human:demo, then resume exits 3'
    covers:
      - DK-300b-2-iii
  - name: test_cancelling_at_the_ranked_question_stages_no_record
    target_dir: tests/kernel/integration/
    framework: unittest
    type: integration
    angle: criterion
    description: 'TO WRITE (in tests/kernel/integration/test_cancel.py): cancel while the ranked-choice
      question is open: unresolved, the run''s staged/decisions folder is empty and docs/decisions/
      unchanged'
    covers:
      - DK-300b-2-iii
