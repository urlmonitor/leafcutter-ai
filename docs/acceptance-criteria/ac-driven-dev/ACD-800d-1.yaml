  THIS RECORD'S OWN REASON. It is the concrete JSON schema for the report
  retired at ACD-800d, and it is where the dependency on the retired method is
  most explicit: the schema literally pins `"confidence": "high" | "medium"`
  and a `ticket_path` join. Both are the matcher's vocabulary. With no matcher
  there is no confidence tier to serialise and no ticket to point at.

