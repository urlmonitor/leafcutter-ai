notes: |
  THE DEFECT: a defect caught by a check exists only as English prose. No
  identifier, no category, no cross-ticket count. Evidence supplied by the user:
  the same defect fired four times within a single epic and was counted zero
  times.

  THE DEDUP KEY IS THE HARD PART, and it must be GATE-DECLARED. Each check
  declares the vocabulary of problem kinds it is capable of reporting, and every
  finding it emits is labelled from that vocabulary. Do not attempt to infer
  categories from the prose after the fact — a text-similarity clusterer is a
  different (and much weaker) feature, and would leave the count as untrustworthy
  as the prose it replaced. If an L2 proposes free-text clustering as the dedup
  mechanism, reject it.

  Because each check declares its own vocabulary, this L1 has a PROMPT surface as
  well as a code surface: the gate agents' templates must state their vocabulary.
  Expect a mixed python-coder / llm-expert split at L2 — see the IT-PO
  "agent assignment by technical surface" convention.

  DEPENDS ON BO-2800a for the record schema: a's mining pass establishes what a
  recorded finding looks like, and b extends it with identity and category rather
  than inventing a parallel format.
