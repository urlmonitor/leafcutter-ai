criteria: |
  Given a reader wants to follow one commit from a route to its answer,
  When they open the sequence diagram,
  Then it shows, in order, the route dispatching the commit agent, the agent authoring a message
    when none was given, the agent calling the shared step, the step refusing on a protected or
    missing branch, the step running the checks, a fixing check changing a named file, the
    single second run of the checks, and the step's answer returning to the route,
  And it shows each of the four answers and what the route does on each,
  And it shows the hook_failed path returning to the commit agent for autofix judgement before
    any fresh call of the step,
  And it shows no path that runs the checks a third time within one call.
depends_on: [BO-4500a-5]
