id: FIN-100f
title: "Step ordering guarantees tests complete before PR merge"
component: finalize
level: L1
status: active
criteria: |
  The workflow enforces a strict ordering where the PR merge decision cannot
  execute until the test-and-triage gate has passed.

  Given the finalize-feature step sequence,
  When the workflow is executed,
  Then Step 2 (merge main into worktree) executes before Step 3 (run tests),
  And Step 3 (run tests + triage) executes before Step 4 (merge PR to main),
  And Step 4 is unreachable if Step 3 halted due to regressions,
  And no code path exists that allows the PR merge to bypass or execute
  concurrently with the test gate,
  So that the invariant "tests pass on the integrated code before it reaches
  main" is structurally enforced, not merely conventional.
