it_requirements:
  - "Produce a sequence (or C4-dynamic) diagram as a new architecture doc under docs/architecture/diagrams/, following the existing c2-NNN naming and authoring convention used by the sibling diagrams in that folder (c2-001 through c2-006)."
  - "Depict the planning-time path: a ticket's files_touched listing a new site/app/<route>/page.tsx drives agent selection (the documentation-expert selection_criteria trigger in config/agent_registry.json), which resolves documentation-expert from its default_status not_needed to needed."
  - "Depict the commit-time path: the hook check_frontend_page_docs.py reads the git staged diff, calls derive_doc_path to compute the expected docs/reference/frontend/<name>.md, runs a doc-exists check (staged OR on disk), and then blocks (exit non-zero) or warns (exit 0 with FIX message) according to the configured mode: block|warn."
  - "Make the shared page-to-doc derivation explicit: show that both the planning-time path and the commit-time path call the SAME derivation step (derive_doc_path / the single shared helper from GE-104a-1-i), and annotate that this shared step is the single point preventing the two layers from drifting on the mapping rule."
  - "Diagram content must match the enforcement behavior actually shipped by GE-104a-1 and GE-104a-2 — do not depict steps, config keys, or paths that diverge from the implemented hook and registry trigger."
