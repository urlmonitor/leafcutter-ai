notes: |
  Observed 2026-09-23 on the first fast-lane run made after BO-2400f-7-iii shipped. The
  run reached the claim step, claimed all 25 members of the connected set successfully,
  and then halted saying "the claim was never attempted". The claim had in fact been
  made: the payload carried all 25 ids in "claimed" and target_refused false.

  WHAT ACTUALLY HAPPENED. BO-2400f-7-iii's usability gate tested that BOTH "claimed" and
  "excluded_claimed" were arrays. The dispatch immediately above it declares only
  ["claimed", "target_refused"] as required, leaving "excluded_claimed" optional. A
  performer that claims everything and excludes nothing has no reason to send an empty
  optional array, and did not. The gate therefore rejected a reply that satisfied the
  contract the run itself had asked for, and routed it to the halt whose whole purpose is
  to describe a claim that never happened.

  WHY IT IS THE SAME FAMILY AS THE DEFECT IT FOLLOWS, INVERTED. BO-2400f-7-iii existed
  because a decline was reported as contention: the run described a state that was not
  the one it was in. This is that error mirrored — an attempt that succeeded reported as
  an attempt never made. Both come from a consumer whose reading of a reply is not the
  reading the contract specifies, and in both the operator is sent after a cause that
  does not exist.

  COST AND CONTAINMENT. The halt happens after the claim has already flipped 25 records
  to in_progress in the run's own worktree, so a run that fails this way leaves its set
  claimed and abandons it. In the observed instance nothing was stranded on the mainline,
  because the claim is written inside the lane's worktree and that worktree was discarded
  uncommitted. That containment is incidental to this defect rather than a defence
  against it, and is the reason the observed blast radius was one wasted run.

  THE NARROW FIX IS THE RIGHT ONE. Requiring less is safe here and requiring more is not:
  the alternative — adding "excluded_claimed" to the dispatch's required list — would make
  the contract conform to the over-strict consumer, and would begin rejecting replies that
  are valid under today's contract. The record forbids that direction explicitly.
