id: BO-100e
title: "One run carries the work through every layer of its prerequisites"
component: build-orchestration
components:
  - build_orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Start the build once and it finishes the whole thing, however deeply layered.

  A run keeps going until there is genuinely nothing further it can build: work
  that only becomes eligible once earlier work is finished is picked up within
  the same run, without being asked again. How many layers of prerequisites the
  work happens to have changes how long the run takes — never how many times
  you have to start it.
