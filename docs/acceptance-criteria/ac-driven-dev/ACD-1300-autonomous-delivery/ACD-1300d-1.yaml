it_requirements:
- Status/inbox read from durable local state and preserve run/request identities across processes; do
  not infer delivered or merged state from prose.
- Apply credential redaction and stable evidence references to both machine-readable and human-readable
  output.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300c-2 (data handoff, not an additional build-order prerequisite): BlockedRun
  {run_id:string, feature_id:string, ac_id:string|null, reason:string, required_action:string, checkpoint_revision:string,
  workspace_id:string, evidence_refs:string[], budget:object}.'
- 'Runtime interface from ACD-1300g-4 (data handoff, not an additional build-order prerequisite): PublishedProposal
  {run_id:string, feature_id:string, publication_id:string, remote:string, branch:string, target_ref:string,
  head_sha:string, validated_sha:string, reviewed_sha:string, pr_id:string, pr_url:string, draft:true,
  outcome:delivered}.'
- 'Runtime interface from ACD-1300a-2 (data handoff, not an additional build-order prerequisite): Selection
  {feature_id:string|null, ordered_ac_ids:string[], effective_priority:string|null, reasons:[{ac_id:string|null,
  reason:string}], snapshot_revision:string}.'
test_spec:
- name: test_background_worker_reopened_cli_shows_durable_run_and_request_identity
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Create waiting, blocked and draft-delivered outcomes; new CLI process shows same IDs, reasons,
    answer request, evidence and PR revision links.
  covers:
  - ACD-1300d-1
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_local_reviewed_and_merged_states_stay_distinct
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Provide local checks and draft review approval without target merge proof; status never
    reports target completion.
  covers:
  - ACD-1300d-1
- name: test_background_worker_status_does_not_expose_credentials
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Inject credential-bearing adapter diagnostics and assert displayed/persisted attention
    payload excludes secret values.
  covers:
  - ACD-1300d-1
