  contract: "An unambiguous not-yet-determined marker on the resolved target, distinguishable from a real location without external comparison -- the input this refusal reads"
test_spec:
  - name: test_no_phase_agent_is_dispatched_while_the_working_copy_is_undetermined
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive the real workflow with the resolved target's working copy undetermined and assert the harness recorded zero phase-agent dispatches."
  - name: test_the_holdback_reason_names_the_undetermined_working_copy
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Assert the run's outcome states why it stopped and names the undetermined working copy, so an operator is not left with a silent no-op."
  - name: test_the_ambient_location_is_not_used_as_a_fallback
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Run with the undetermined marker and assert no dispatch carries the process's current location, the epic's work-store folder, or any other substitute as the working copy."
  - name: test_the_phase_dispatches_once_a_working_copy_is_established
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Control case: supply an established working copy and assert the expected phase agents are dispatched -- so the refusal above is attributable to the undetermined marker and not to a driver that stopped dispatching."
test_rationale: |
  The behaviour is which agents ran and where, and the existing harness measures
  exactly that -- which is why every descriptor drives the real workflow and reads the
  dispatch record. A source-reading test cannot separate a consumed guard from an
  ignored one, and an ignored guard is the expected regression here because the value
  the guard inspects used to be a plausible path. The third descriptor is the
  fail-closed clause made falsifiable: an implementation that substitutes the ambient
  location satisfies the first two by never reaching the refusal at all, and is
  indistinguishable from a fix until something commits in the wrong repository.
