title: "Every route that can drive the work asks one question before skipping the proof phase"
component: ticket-creation
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a generated work item whose proof section lists at least one proof
    statement,
  And no worker on that work item is classified as producing production code,
  When any route that can drive that work item reaches the proof-writing phase —
    the per-phase driver, the supervisor the epic route dispatches, or the
    runbook that supervisor follows,
  Then every one of those routes runs the proof-writing phase,
  And no route records that phase as complete without it having run,
  And the reason each route records for its decision cites whether a proof was
    demanded, never which kind of worker is needed,
  And all three routes reach the decision by asking that one question, so
    whether a proof gets written cannot depend on which route happened to build
    the work item.
depends_on: [TKT-500g, TKT-500g-1]
