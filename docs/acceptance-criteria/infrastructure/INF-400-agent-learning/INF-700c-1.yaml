notes: |
  This closes the substitution the harvester performs today: when learning text
  is absent it composes a placeholder from the kind and the ticket, and the
  ticket field is absent from all 28 retained records, so the composed line
  reads "[agent-assignment-pattern] Learning from " with nothing after it.
  Nine curated files between 3.6 KB and 23 KB are named as destinations by
  those records, so the substitution is not a cosmetic defect — it degrades
  real, hand-written knowledge.

  Boundary: INF-400c-5 owns which kinds are recognised; this AC is indifferent
  to the kind. A record with a perfectly canonical kind and no learning text is
  still not written.
change_target: code
risk_surface: contract_boundary
