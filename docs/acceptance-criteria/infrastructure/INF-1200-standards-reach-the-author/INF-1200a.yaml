criteria: |
  The standard arrives before you write, not after you are turned away.

  Whoever is about to work on a kind of file knows what that kind of file has
  to satisfy at the moment the work starts, so the standard shapes the work
  while shaping it is still a single small decision — instead of surfacing as a
  refusal once the work is finished and expensive to reopen.
