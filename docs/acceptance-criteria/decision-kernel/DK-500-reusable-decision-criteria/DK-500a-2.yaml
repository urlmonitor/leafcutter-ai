id: DK-500a-2
title: Making a decision never reads run history and never waits on mining
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the run history in Langfuse cannot be reached,
  And a mining run is in progress, or the last mining run failed,
  And the published library holds cat-1dc11c5a2ffa7310 and cat-d15d52392d7aa94c,
  When a person makes a design decision in a kernel run,
  Then the decision run makes no request to the run history,
  And it reaches the approval of proposals without waiting for the mining run,
  And it offers the same categories and spends the same number of Jev calls as the same decision made when no mining run has ever happened.
depends_on:
- DK-500a
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from: null
change_target: code
risk_surface: internal
it_requirements:
- The decision, research, host and scheduler code paths hold no Langfuse read client and no reference to the mining store; the tracer stays write-only (ADR-058 section 6).
- Reuse (DK-500d-1) reads only the published category library in Git through its generated index, so a mining round in progress, a failed round or an unreachable Langfuse cannot change what a decision run offers or how many Jev calls it spends.
- The guard is proven through the public run entry point with a Langfuse read port that fails the test if it is called, in three mining states (never run, in progress, last round failed).
test_required: true
test_spec:
- name: test_decision_run_makes_no_run_history_request
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A design decision run with an unreachable Langfuse makes no request to the run history (a failing read port is never called).
- name: test_decision_run_does_not_wait_for_mining
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With a mining round in progress or failed, the run reaches the approval of proposals without waiting.
- name: test_same_categories_and_jev_calls_across_mining_states
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The offered categories and Jev call count are identical across never-run, in-progress and failed mining states.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port; assert the approval payload, call counts and staged files. A direct-import unit test of a helper would not prove the forming flow wires the step.
