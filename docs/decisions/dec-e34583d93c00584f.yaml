options:
  - id: opt.declare_then_merge
    title: build GE-133 with both stores declared, then commit the E1 merge
    description: 'Approve GE-133 with GE-133a-1 amended to declare two entries: docs/acceptance-criteria/ and docs/decisions/,
      each with its stated ground. Build GE-133a-1 and GE-133a-2 on main in one PR. Then E1 rebuilds, merges main again, and
      commits with every hook running; its two records ship in the E1 PR.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.hold_then_restore
    title: commit the merge now without E1's two records, restore them inside the E1 PR
    description: One E1 commit removes the two records and regenerates the index, so the merge commits today with every hook.
      In parallel, GE-133 is built with both stores declared (as above). When it lands, E1 merges main and puts the two records
      back before the E1 PR merges.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.hold_and_defer
    title: commit the merge now without the records, re-publish them in a later tracked PR
    description: As above for the merge. A tracked ticket re-publishes both records to main in a separate PR once the store
      has room (by GE-133 or another change); the E1 PR merges without them.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.exempt_index_file
    title: exempt the generated index.json by filename, then merge
    description: A small change on main adds index.json to exempt_filenames. The merge then holds 15 counted files and passes;
      main's next record is refused again.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.shard_by_prefix
    title: shard the decision store by id prefix, then merge
    description: Correct dec-ef8ddcb79d668a67 and change the kernel to store records as docs/decisions/<first id hex>/<id>.yaml
      (index, file_store, validate, publish and their tests); then E1 moves its two records and merges.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
