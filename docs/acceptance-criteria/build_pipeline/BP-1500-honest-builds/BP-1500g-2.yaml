notes: |
  THIS AC EXISTS TO MAKE ONE PARTICULAR PASS INTO A FAILURE. The cheapest repair
  for BP-1500g-1 is to stop installing the link that makes the package's
  capabilities discoverable. That trades a visible data loss for an invisible
  broken install: the adopter's work survives, nothing warns anybody, and the
  package's capabilities quietly never arrive. The L1's third criteria paragraph
  says both must work at once, in the same project, after the same ordinary build,
  and this is the record that holds an implementation to it.

  "SAME RUN" IS THE LOAD-BEARING WORD IN THE THIRD Then CLAUSE. Two runs with
  different inputs can each demonstrate one half. Only one run demonstrates
  coexistence, which is the property actually at issue. An implementation
  verified across two runs has not been verified.

  REACHABILITY, NOT PRESENCE -- AND THIS IS WHERE THE CURRENT DESIGN GOT ITS
  SHAPE. The tool that consumes these capabilities looks in exactly one place,
  which is why the package claims that place wholesale, which is why the adopter
  has nowhere to stand. Any repair that relocates the package's capabilities
  somewhere the tool does not look satisfies a presence check and delivers a
  project with no capabilities. The second Then clause is written as discovery by
  name and successful execution for that reason, and it names no location.

  THE FOURTH Then CLAUSE GUARDS A SECOND CHEAP PASS. An implementation that
  installs the package's capabilities only when it finds nothing of the adopter's
  in the way would satisfy the first three clauses on the fixture that has adopter
  content in it. The clean-project case catches that.
