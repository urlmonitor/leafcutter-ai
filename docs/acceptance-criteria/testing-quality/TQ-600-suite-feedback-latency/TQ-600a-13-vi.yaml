id: TQ-600a-13-vi
components:
  - testing_quality
title: "Every pull request is held while a nightly-red issue is open, by a check that reads one flag and runs no tests"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the flag TQ-600a-13-iii maintains — open issues labelled `nightly-red`,
  And the owner's decision to hold immediately, with no grace period, once the flag is
    raised,
  And the reason this check exists at all: the expensive tests were taken off the per-PR
    path to remove their cost from it, so a per-PR check that runs any of them, or
    builds anything, defeats the change it belongs to,
  When the check named `Nightly suite status` evaluates a pull request whose description
    and labels carry no fix declaration (TQ-600a-13-viii covers those that do), with the
    issue service replaced by a double serving a stated set of issues,
  Then with no open issue labelled `nightly-red` the check passes,
  And with one or more open issues labelled `nightly-red` the check fails, and its output
    names each open flag by number and link,
  And closed `nightly-red` issues and open issues without the label have no effect on
    the verdict,
  And the verdict is computed from a fresh read of the flag on every evaluation and
    never from a stored earlier verdict: a pull request that passed before the flag was
    raised fails on its next evaluation, and a pull request opened after the flag was
    raised fails on its first,
  And the check is evaluated when a pull request is opened, when it is reopened, and on
    every push to it,
  And one evaluation sends exactly one request to read the flag, starts no test session
    and no build, and reads nothing from the repository's test suite — shown by counting
    the requests the double receives and the processes the evaluation starts,
  And the pass and fail outcomes are shown by executing the check against the double
    for each flag state, never by reading the workflow file for the request it makes.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-iii
