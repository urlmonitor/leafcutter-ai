criteria: |
  Given a person who has just installed the tooling into a project of their own and has never
    read this repository,
  When they open the how-to for starting a project record,
  Then it states what the empty record contains and where each artifact type lives,
  And it walks through authoring the first journey, the first example dataset and the first
    screen, in that order, with a worked example at each step,
  And it states what the checker reports for a record that is still empty and how that report
    differs from the report for a record that was checked and found sound,
  And it states that the example product ships separately, is obtained by asking for it, and is
    not part of the reader's own record.
