criteria: |
  A requirement only joins the buildable queue once a person has approved it.

  The queue that decides what the build system works on next admits approved work
  and nothing else — not half-written ideas, not requirements still under review,
  and not records whose approval was never recorded at all. Because that admission
  rule is written down and proven, it cannot be widened or narrowed without the
  change being visible.
