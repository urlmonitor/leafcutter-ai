criteria: |
  Given both the instruction and the means have arrived in an adopting project,
  When the invocation the arrived instruction tells the author to perform is
    compared with the invocation the arrived means accepts,
  Then every argument the instruction names is accepted, the means requires no
    argument the instruction does not name, and the place the instruction says the
    means occupies is the place it occupies,
  And where more than one arrived surface carries the instruction, those surfaces
    state the same invocation as each other,
  And the comparison is made against the copies that arrived in the adopting
    project, not the copies held in this package,
  And a difference between any two of them fails this criterion even when each,
    read on its own, is internally consistent and works.
