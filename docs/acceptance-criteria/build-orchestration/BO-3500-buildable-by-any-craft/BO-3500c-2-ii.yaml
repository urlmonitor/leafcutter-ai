id: BO-3500c-2-ii
components:
  - build_orchestration
  - documentation_system
title: "Proof for a diagram: its source is valid against the schema it declares, and every project element it names resolves to something that exists"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a member whose artifact is a diagram held as structured data,
  When its proof is established,
  Then the diagram's source is checked against the schema that source declares, and is
    valid against it,
  And the source contains at least the elements and connections the requirement asked
    the diagram to show,
  And every element the source names as a part of this project resolves to a part of
    this project that exists, in the project's own registers of its parts, its crafts
    and its skills,
  And no picture is produced in order to establish any of this — the proof is
    established from the source alone, so it costs no renderer and holds in a project
    that has none installed.

  Given a diagram whose source is valid but names a component this project does not
    have,
  When its proof is established,
  Then the proof fails, naming the element that does not resolve.

  Given a written page and a diagram in the same run,
  When their proofs are established,
  Then both are established by the same reading instrument, which differs between the
    two only in how it extracts the references out of the source it is given,
  And a change to what counts as a resolvable part of this project takes effect for
    both without either being changed separately.

  Given a member whose artifact is a diagram held in a form this instrument cannot
    extract references from,
  When a run resolves a group containing it,
  Then it is treated as a kind whose proof cannot be established here and is refused
    before any craft is dispatched,
  And it is never finished on the strength of the source merely existing or having
    changed.
depends_on: [BO-3500c-2]
