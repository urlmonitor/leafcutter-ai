notes: |
  ORIGIN: user request via /plan-feature, 2026-10-23. Finalize's step-7 workspace removal (line
  1777 at the user's reference point) is the only dispatch that removes by design. Once
  BO-4300g-1 lands, that dispatch removes nothing unless it carries the authorization, so this
  record and BO-4300g-1 must ship together. Otherwise finalize's teardown stops working.
  BO-4300e-2 already removed the interactive "yes" at this step. This record adds the explicit
  authorization from the caller.

  Proof runs the deployed finalize workflow under the workflow engine harness and asserts on the
  recorded step-7 dispatch. It never greps the workflow source.

  USER DECISIONS 2026-10-25 (recorded by IT PO): D -- built together with BO-4300g-1 in one
  build. F -- step 7 gets its workspace and branch from a NEW maker locate at step 7
  (worktree.py locate --kind <kind> --slug <slug>, read-only, through shell-runner); the
  authorization is built only from a definite ok answer for the expected branch. No new maker
  verb. The test-designer's step-7 tests that say "ensure and locate run against a real fixture"
  already fit this choice.

  must_catch ON THIS RECORD'S test_spec: kept. This record closes the KI-BO-20260921 route
  around the authorization at finalize step 7 (bug-fix, fail-closed guard), the case the
  test-designer rule allows must_catch for; otherwise kept as test-quality guidance, none deleted.

