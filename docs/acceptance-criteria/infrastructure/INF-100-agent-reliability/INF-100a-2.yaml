id: INF-100a-2
title: "PROJECT_CONTEXT.md contains EMU identity guard that switches GitHub account before PR creation"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
created_by: "tickets/00_inbox/TICKET-20260604-PullRequestAgentProjectContext.md"
criteria: |
  Given the file .agents/agents/pull-request/PROJECT_CONTEXT.md exists,
  When the agent reads the EMU account restriction section of that file,
  Then the file instructs the agent to run gh auth status before any gh pr create call,
  And the file instructs the agent to compare the active GitHub user to "urlmonitor",
  And if the active user differs from "urlmonitor" the file instructs the agent to run gh auth switch --user urlmonitor,
  And the file instructs the agent to warn the user that the account was switched.
