title: "Null-baseline recovery attempt is an extracted, independently testable named unit"
level: L2
component: finalize
status: active
parent: FIN-100c-4
criteria: |
  Given the null-baseline recovery attempt currently inlined in the finalize
    workflow's Step 3 (the block guarded by the baseline being null and a
    non-empty post-merge failure set)
  When the recovery logic is invoked
  Then the recovery attempt is expressed as a single named unit (a function or
    helper) that accepts the post-merge failing test IDs and the recovery result
    as inputs and returns either the recovered baseline list or null
  And that named unit is exercised by at least one unit test in isolation —
    without running the full finalize workflow — that asserts: given a recovery
    result reporting that a subset of the post-merge failures also fail on main
    HEAD, the unit returns exactly that subset as the recovered baseline
  And a second isolated test asserts that a rerun-unavailable recovery result
    (checkout failed, build/deploy failed, or unparseable output) makes the unit
    return null
  And the main Step-3 flow delegates to this named unit rather than restating the
    recovery logic inline, mirroring the existing Step 0 / cleanupBaselineWorktree
    extraction pattern
