superseded_by: null
covered_by:
- unit_tests/prompt_assembly/test_implementation_notes_emission.py::TestReferencePatternResolution::test_ac3i_unresolvable_pattern_errors
- unit_tests/prompt_assembly/test_reference_pattern_resolution.py::TestAmbiguousReferencePatternIsAnAuthoringError::test_pattern_matching_more_than_one_file_raises_an_authoring_error
- unit_tests/prompt_assembly/test_reference_pattern_resolution.py::TestNoImplementationNotesEmittedOnFailure::test_no_implementation_notes_emitted_on_zero_match
- unit_tests/prompt_assembly/test_reference_pattern_resolution.py::TestNoImplementationNotesEmittedOnFailure::test_no_implementation_notes_emitted_on_multi_match
