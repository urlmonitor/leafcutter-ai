id: GE-132a-2
title: "A remedy declaration naming a specialist or a skill that does not exist, or giving the author no instructions, is refused"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given check-complexity's remedy declaration names the restructuring specialist,
    names the complexity-reduction skill, and gives the author the instruction "bring
    in the restructuring specialist to apply the complexity-reduction skill to the
    named function; never raise the limit",
  And check-doc-links' remedy declaration names no specialist because the author clears
    it, and gives the author the instruction "fix or remove the broken link",
  When a change to the remedy declarations is committed,
  Then the commit is not refused on account of either declaration.

  Given check-complexity's declaration instead names the agent complexity-fixer, which
    no agent definition provides,
  When that change is committed,
  Then the commit is refused, naming check-complexity and complexity-fixer as an agent
    that does not exist.

  Given check-complexity's declaration instead names the skill complexity-reducer, which
    no installed skill provides,
  When that change is committed,
  Then the commit is refused, naming check-complexity and complexity-reducer as a skill
    that does not exist.

  Given check-doc-links' declaration instead gives the author instructions that are
    absent, empty or only whitespace,
  When that change is committed,
  Then the commit is refused, naming check-doc-links as a declaration that tells the
    author nothing.
depends_on:
  - GE-132a
  - INF-800f-1
