assigned_agent: python-coder
estimated_complexity: M
change_target:
  - code
  - pipeline
risk_surface: contract_boundary
test_required: true
it_requirements:
  - >-
    MEASURED 2026-09-14 — THE DEPLOY PHASE GLOBS FLAT. The only phase that deploys from
    templates/scripts/ is build_template_standalone_scripts (scripts/build_phases.py), and it
    scans with templates_scripts_src.glob("*.py") under the comment "Shallow scan — only
    top-level .py files; subdirectories have their own phases". A source committed at
    templates/scripts/scaffold/new_arch_doc.py is therefore deployed by NO existing phase.
    Delivery requires a new, dedicated deploy phase. A consumer simulation run on 2026-09-14
    confirmed this empirically: the "Template standalone scripts" section deployed seven flat
    files and no scaffold/ subtree.
  - >-
    THE EXISTING GLOB MUST NOT BE WIDENED TO rglob. scripts/build.py's
    _manifest_sync_platforms_scripts documents this exact fix as already considered and
    rejected (KI-BP-023): widening would register scripts/<name> deploy keys for files the
    phase never writes, adding FALSE entries to the propagation-audit manifest and generating
    spurious findings. The sanctioned shape is the build_sync_platforms /
    _manifest_sync_platforms_scripts pairing — one deploy phase plus one manifest helper that
    mirrors that phase, not its directory.
  - >-
    A NEW DEPLOY PHASE MUST SHIP WITH ITS MANIFEST HELPER IN THE SAME CHANGE. A phase with no
    corresponding _manifest_* helper registered into the propagation-audit manifest set puts
    its entire deployed subtree outside the guard with no warning and no error — the KI-BP-023
    defect, in which a whole deployed Python package sat unguarded.
  - >-
    The manifest helper must emit the key exactly as the authoring surfaces reference it —
    "scripts/scaffold/new_arch_doc.py". That string is the key space the propagation audit
    resolves references in, and INF-1300e-4's two-run construction resolves against this exact
    key and nothing else.
  - >-
    MEASURED 2026-09-14 — THE INSTRUCTED PATH IS NOT THE DEPLOYED PATH. A real build into an
    empty target deploys scripts under the output root (observed: <target>/.leafcutter/scripts/).
    The means will therefore land at <output_root>/scripts/scaffold/new_arch_doc.py, while both
    arrived surfaces instruct the bare relative path scripts/scaffold/new_arch_doc.py. Resolution
    in the guard's layout-agnostic scripts/<rel> key space does NOT establish that the instructed
    path resolves from where an adopting project's authors work. Settling that is INF-1300e-2's;
    this record must not assume it, and its arrival test must invoke the real deployed path.
  - >-
    The observation must be performed with no copy of this package's working tree reachable
    from the adopting project. unit_tests/portability/_bp900h4_layout_helpers.py already
    provides make_package_checkout / remove_package_checkout for exactly this negative half;
    reuse them rather than reinventing a weaker isolation.
  - >-
    The second-install clause must be exercised by running the real build twice into the same
    target directory. The update path is genuinely different code — _should_overwrite, the
    force flag and the compare-before-write guard only engage on a run where the file already
    exists — so a single build does not test it.
  - >-
    The script source must be committed under templates/scripts/ (the tracked deploy-source
    mirror). A copy placed only under scripts/ is build output, is unreachable by a fresh
    install, and is precisely the failure this record exists to prevent.
  - >-
    The new phase must be idempotent: a second build over unchanged sources must write nothing
    and must not churn mtimes, matching the compare-before-write contract every sibling phase
    already honours.
  - >-
    Must not regress the existing consumer-install CI gate — scripts/ci/check_consumer_install.py
    must still exit 0 for a real build into an empty scratch directory (BP-900h-1).
test_spec:
  - name: test_scaffold_means_arrives_in_a_consumer_install
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: deployed
    description: >-
      After a real build.py into an empty temp target with no package tree beside it, the
      scaffold script is present under that project's deployed output root. Asserted against
      the deployed tree read back off disk, never against templates/.
  - name: test_author_in_consumer_layout_runs_the_mandatory_step_and_gets_a_document
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "the deployed new_arch_doc.py CLI, invoked as a subprocess with cwd set to the adopting project root"
    description: >-
      Invoking the deployed means with the full pinned + widened argument set, from where that
      project's authors work, exits 0 and the --output path exists afterwards.
  - name: test_consumer_run_succeeds_with_the_package_checkout_removed
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: boundary
    description: >-
      The negative half. With the package checkout removed via
      _bp900h4_layout_helpers.remove_package_checkout and nothing copied into the project by
      hand, the same invocation still succeeds — proving the success was not borrowed from the
      source tree.
  - name: test_scaffold_means_survives_a_second_install_of_a_later_package_version
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: deployed
    description: >-
      Building twice into the same target (the update path) leaves the means reachable and the
      invocation still succeeding, so delivery is durable rather than a one-time placement.
test_rationale: >-
  Every descriptor here executes the behaviour in a real consumer layout produced by the real
  build, and reads its verdict off that layout. That is not decoration: this record's entire
  subject is the difference between the source tree and the deployed one, so the obvious cheap
  test — asserting templates/scripts/scaffold/new_arch_doc.py exists, or importing the module
  directly — is not a weaker version of the right test, it is a test of a different and already
  true proposition. It would have passed on 2026-09-14, when the measured deploy phase globs
  flat and the file reaches no adopter at all. The isolation (removing the package checkout) and
  the second build are each a named clause of the criteria and each closes a false-green path
  this repository has recorded: an artifact reachable only because the source tree was beside
  it, and an artifact that arrives on first adoption through a path a later update does not
  repeat.
delivers_to:
  - agent: llm-expert
    contract: >-
      The two facts INF-1300e-2 compares the arrived surfaces against: (a) the deployed
      location of the means in a consumer layout, as an output-root-relative path
      "<output_root>/scripts/scaffold/new_arch_doc.py"; and (b) the argument sets the deployed
      script's parser ACCEPTS and REQUIRES, as two explicit sets of flag names covering the
      seven pinned flags (--tier --diagram-type --component --title --output --date
      --update-readme) plus --parent, --root and --source-ticket.
  - agent: python-coder
    contract: >-
      A propagation-audit manifest key of exactly the string "scripts/scaffold/new_arch_doc.py",
      emitted by a manifest helper in scripts/build.py that mirrors the new deploy phase and is
      registered into the manifest set the audit unions. INF-1300e-4's allowlist removal is only
      correct if this key is what resolves the reference.
expects_from:
  - ac_id: INF-1300a-1
    contract: >-
      An executable Python CLI committed at templates/scripts/scaffold/new_arch_doc.py that
      writes a committable architecture document to the path given by --output and exits 0 on
      success, non-zero on refusal.
  - ac_id: INF-1300a-2
    contract: >-
      The widened argument contract — --parent <path>, --root (flag, top-tier self-declaration)
      and --source-ticket <id> alongside the seven pinned flags — so the arrival test invokes
      the final contract rather than a superseded one.
