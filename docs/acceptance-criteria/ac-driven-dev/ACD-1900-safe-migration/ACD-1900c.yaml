  - "2026-08-14 ORDERING CONFLICT RESOLVED — read before re-ordering. This file's notes said 'Depends on ACD-1900b being in place first (the kill-switch is only safe because dual-read exists)'. A 2026-08-14 sequencing analysis reached the opposite conclusion (dual-read needs a flag to branch on). Both are half-true, and encoding both would be a depends_on CYCLE that check_ac_circular_deps rejects. Resolution: split the two senses. DECLARING the flag (both stages off, inert) is a prerequisite of ACD-1900b, so the edge runs 1900c -> 1900b. DEMONSTRATING the kill-switch guarantee (flipping back restores green) genuinely requires dual-read to exist, but that is an ordering constraint on this L1's ACCEPTANCE, not on its implementation, and belongs at L2. Do not add a 1900c -> 1900b depends_on edge; it would close the cycle."
