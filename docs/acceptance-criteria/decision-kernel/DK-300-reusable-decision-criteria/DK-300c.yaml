criteria: |
  You approve, publish, merge, split and retire categories; nothing slips in.

  Every candidate stays a proposal until a person approves it; an approved
  category waits beside the run that approved it and joins the shared library
  only when a person publishes it through the same review as any other change.
  Later, a person can merge, split or retire categories without touching the
  decisions that used them, and a retired category always points to the one
  that replaced it.
