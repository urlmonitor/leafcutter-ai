test_spec:
  - name: test_statusless_reply_fails_only_on_missing_status
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Incident replay: load PHASE_RESULT_SCHEMA from build-feature.js by evaluating the real JS (node), validate a reply `{input: '<json string>'}` with jsonschema Draft 7, and assert it is rejected, that `status` is reported missing, and that no error mentions handoff_target or the `then` branch."
  - name: test_handoff_without_target_is_still_rejected_for_handoff_target
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A `status: handoff` reply with no handoff_target is still rejected naming handoff_target; one that names its target is accepted — the fix must not disable the BO-3000a conditional."
  - name: test_every_currently_valid_reply_stays_valid
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Each valid non-handoff status, with and without handoff_target, and a handoff reply with a target, all still validate."
  - name: test_build_ticket_twin_schema_behaves_identically
    target_dir: unit_tests/workflows/
    framework: unittest
