    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Durable pending-question record persisted on pause, keyed by run id."
    properties:
      run_id: {type: string}
      status: {type: string, enum: [paused_awaiting_input, cancelled, running, completed]}
      question: {type: object, description: "shape defined by BO-2300b-1"}
      context: {type: object, description: "snapshot, shape defined by BO-2300c-1"}
      pause_point: {type: object, description: "resume marker referencing the existing resumeFromRunId run-resume cache"}
      answer: {type: [object, "null"]}
    required: [run_id, status, question, pause_point]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "This is the defect being fixed: at an interactive gate with no reachable answerer the E2 engine today resolves the gate as blocked and CANCELS headless. The run must instead PAUSE and persist, discarding no committed work."
    - "The pending-question record must be keyed to the run id and written to a run-scoped durable store that survives the workflow process exiting; align with how the existing crash-resume run state is persisted (the workflow body itself stays stateless per docs/reference/workflow-constraints.md)."
    - "Every interactive gate that today cancels headless must be migrated to pause: apply the same mechanism across templates/workflows-js/plan-feature.js, build-feature.js, and finalize-feature.js (hence n_location_rule=all) so no gate silently retains the cancel-on-headless bug."
    - "All state-store reads/writes are external I/O and must follow the project error-handling policy (typed except, WARNING+ log, no bare except, no silent swallow)."
    - "Authored in E2 top-level-body form per ADR-017; do not use Date.now()/new Date()/Math.random() in the workflow body (pass any timestamp/seed via args); the build-time E1 shim is regenerated by build.py, never hand-authored."
    - "Engine JS under templates/workflows-js/ and any Python glue under scripts/ must keep deployed/template parity via the build.py round-trip (ADR-001)."
    - "Pausing must be idempotent: re-reaching the same gate for an already-paused run must not create a duplicate pending-question record."
    - "Pause/persist transitions must be logged at an appropriate severity for observability."
delivers_to:
  agent: python-coder
  contract: "Durable pending-question record keyed by run id: { run_id: string, status: 'paused_awaiting_input', question: <object, shape from BO-2300b-1>, context: <snapshot, shape from BO-2300c-1>, pause_point: <resume marker referencing the existing resumeFromRunId cache>, answer: null }, written to a run-scoped durable state store that survives process exit. Consumed by the distinct-state (BO-2300a-2), apply/resume (BO-2300d-1), and durability (BO-2300e-1) behaviors."
expects_from: null
test_spec:
  - name: test_gate_pauses_instead_of_cancelling
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "A headless run reaching an interactive gate enters the paused state and does not cancel."
  - name: test_pause_preserves_completed_work
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Work committed before the gate is retained (not discarded) when the run pauses."
  - name: test_pending_question_record_keyed_to_run
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "On pause a pending-question record tied to the run id is written to the durable store."
  - name: test_pause_is_idempotent_on_same_gate
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Re-reaching the same gate for an already-paused run does not create a duplicate pending-question record."
