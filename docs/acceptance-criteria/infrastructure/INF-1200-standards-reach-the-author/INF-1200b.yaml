criteria: |
  One decision, in one place, and nobody has to be told twice.

  Setting a standard for a kind of file — or changing one, or covering a kind
  of file that was not covered before — is a single statement in a single
  place. Nothing else has to be revised for every specialist that works on that
  kind of file to be correct afterwards.
