notes: |
  TIER 1 of the resolved file-vs-symbol design question. This is the always-on
  floor: it depends only on whether the recorded implemented_by path resolves to
  a file in the staged tree. No jcodemunch dependency, so it can never be
  degraded by missing tooling — it is the guarantee that survives even when the
  symbol tier (GE-111b-2) cannot run (see GE-111b-2-i fail-open).

  IT-PO enrichment (2026-06-22): pinned the canonical verdict object shape (the
  spine all of GE-111a/b/c/d/e exchange) and the staged-tree resolution +
  git rename-detection mechanics, while leaving the exact data structures to
  python-coder. This is the load-bearing contract referenced by every sibling.
