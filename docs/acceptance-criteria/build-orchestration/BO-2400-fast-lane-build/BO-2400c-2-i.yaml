assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    context_reuse_break_statement:
      type: object
      description: "The not-held form of the per-drive context-reuse statement: anchor_held false, a distinct-prefix count, the identity of the first invocation whose prefix differed, and a shared count strictly below the context-carrying invocation count."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The break statement must come from the same single construction site as the held statement (BO-2400c-2). A separate not-held path is how the two forms drift until one of them stops being emitted."
    - "The cause of the difference is out of scope and must not be inferred or reported. The record states that the prefixes differed, where, and how many distinct ones there were — nothing about why. A guessed cause in a run record is worse than no cause."
    - "Omitting the statement, emitting it empty, or defaulting anchor_held to true when the comparison cannot be completed are all failures of this criterion. An unmeasurable drive reports that it could not measure; it never reports a held anchor."
    - "This criterion has nothing to do with a cache lifetime. There is no TTL to elapse — leafcutter issues no model API call and configures no provider cache — so the only observable break is a change in the bytes the drive itself presented."
delivers_to: null
expects_from:
  ac_id: BO-2400c-2
  contract: "The per-drive context-reuse statement and its single construction site, whose not-held form this criterion specifies."
test_required: true
test_spec:
  - name: test_mid_drive_prefix_change_is_recorded_as_not_held
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "In an executed harness drive whose later context-carrying dispatch is presented a prefix differing by one byte, the terminal payload reports the anchor did not hold."
  - name: test_break_statement_names_first_differing_invocation
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The not-held statement identifies the first invocation whose prefix differed from the drive's first prefix, and reports the number of distinct prefixes presented."
  - name: test_shared_count_is_below_total_when_prefixes_differ
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "On a drive with differing prefixes the reported shared count is strictly less than the context-carrying invocation count — the total is never reported as the shared count."
  - name: test_statement_present_and_populated_on_a_broken_drive
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "A drive whose anchor broke still carries the statement with its counts, so it is distinguishable from a drive that produced no measurement."
test_rationale: |
  The break case can only be produced by driving the lane: the harness
  (run_workflow_under_e2 with label_responses) is used to make a later
  context-carrying dispatch carry a different prefix, and the assertion is read from
  HarnessResult.result. A test that calls a comparison helper with two hand-written
  strings proves the helper compares strings; it proves nothing about whether the drive
  records the break, which is the whole criterion. The fourth test exists because the
  cheapest way to make the first three pass is to emit the statement only when the anchor
  holds — which would leave a broken drive silently indistinguishable from an unmeasured
  one, the exact failure this criterion is here to prevent.
origin_agent: BrainCandy
created: 2026-07-21
amended_by:
  - agent: BrainCandy
    date: "2026-08-19"
    reason: "Re-specified as the edge case of the MEASUREMENT rather than of a TTL. The prior version described a cache TTL elapsing mid-drive and the prefix being re-sent to re-prime the provider cache. There is no TTL: no cache_control anywhere in scripts/, templates/ or config/, and leafcutter issues no model API call, so nothing in the product can observe or cause a TTL expiry. Its honest-reporting instinct is preserved verbatim in the new subject — when the stable prefix changes mid-drive, for any reason, the record shows the break rather than reporting a clean anchor. Stripped from it_requirements: the ttl_expiry_reprime fragment and both constraints referencing cache_control / the provider default short TTL / cache-miss telemetry."
superseded_by: null
covered_by: []
implemented_by: []
change_target: pipeline
risk_surface: internal
notes: |
  Boundary with BO-2400c-1-iv (done). BO-2400c-1-iv already requires that drift between
  dispatches be surfaced at the moment it occurs, and its
  test_prefix_drift_between_dispatches_is_surfaced covers that. This criterion is about
  what the drive's persisted record says afterwards: not-held, where it broke, and how
  many distinct prefixes there were. Surfacing is a live signal to whoever is watching;
  the record is what remains when nobody was. They are covered separately because the
  cheap implementation of BO-2400c-1-iv — log a warning and carry on — satisfies that
  criterion completely while leaving the terminal payload reporting a clean anchor, which
  is precisely the dishonest outcome the parent L1's amendment exists to close.
