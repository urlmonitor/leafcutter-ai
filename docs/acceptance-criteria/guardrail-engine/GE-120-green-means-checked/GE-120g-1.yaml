id: GE-120g-1
title: "An ordinary commit leaves the working copy holding exactly the content it held before, whether the checks let it through or refuse it"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a working copy that excludes nothing from version control, so that anything
    appearing beside the installed checks becomes tracked content rather than being
    passed over,
  And the byproducts an earlier run of those checks left beside them are already
    tracked content in that working copy,
  And a change is staged that every registered check accepts,
  When the author performs an ordinary commit — no extra command, no extra flag, and
    nothing invoked by hand,
  Then every check whose declared role is to judge reports that it found nothing to
    object to,
  And when the attempt is over the working copy's tracked content is identical to
    what it was before the attempt began, and the attempt has left nothing new of
    any kind beside the installed checks,
  And the commit completes,
  And given instead a change is staged that one of those same checks objects to,
  When the author performs an ordinary commit,
  Then the commit does not complete,
  And the working copy's tracked content is again identical to what it was before
    that attempt began — being looked at leaves the work untouched whether the
    looking ends in acceptance or in refusal.
