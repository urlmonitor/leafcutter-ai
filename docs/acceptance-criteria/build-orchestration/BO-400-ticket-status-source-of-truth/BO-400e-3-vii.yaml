notes: |
  Requested by BrainCandy 2026-10-15 (KI-BO-20260930).

  INTERIM, WITH A NAMED RETIREMENT CONDITION -- decided, with reasons. This record should be
  superseded (superseded_by set, not deleted) once BO-400e-3-ii, BO-400e-3-iii, BO-400e-3-iv
  and BO-400e-3-v are all work_status done with behavioural tests that run the closure step
  against a real scratch repository (a branch with main-only changes, a merged-in main, and
  unrelated dirty edits). At that point the set is a computed, tested result and a per-run
  human stop buys little that the listing (BO-400e-3-vi, permanent) does not, while it costs
  a human at every finalize and blocks any unattended finalize. Until then the KI's own words
  apply: Step 3.5 "cannot currently be trusted to scope itself".

  Why stop BEFORE the merge on decline, rather than merge without closing: the closure commit
  is made on the feature branch precisely so the PR carries it to main atomically
  (finalize-feature.js :1259-1262; main is PR-only). Merging without it leaves the delivered
  tickets open on main with no route to close them except another PR. Stopping keeps the
  re-run path open.
  Decided by BrainCandy 2026-10-15: stop before merge, because the closure commit must ride the PR to main.

  Why an agent's "yes" counts as no answer: KI-BO-20260925 records that finalize's existing
  gate never checks the answer came from the person. A gate that an agent can pass is not a
  check on the agent.
