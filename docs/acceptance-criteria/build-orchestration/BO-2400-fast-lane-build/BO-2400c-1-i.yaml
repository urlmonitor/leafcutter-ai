  - path: docs/architecture/components/injection-builder.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    stable_prefix_checksum:
      type: string
      description: "Checksum of the stable prefix recorded per invocation within a drive; a mismatch across invocations intended to share the cache flags churn."
  reference_file_path: "scripts/injection_builders.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Compute a checksum of the stable prefix for each invocation and compare across invocations in the same drive that are intended to share the cache; a difference must be flagged, never passed silently."
    - "Use one shared checksum helper for the compute-and-compare so the record and verify paths cannot drift."
    - "The churn must be surfaced (logged at WARNING or higher) so unintended cache-busting is observable."
delivers_to: null
