id: GE-116c-3
components:
  - commit_guardian
title: "Only staged agent definitions are checked, not the whole tree"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given the project already contains an agent definition on disk that requires
    verification while granting no ability to edit or create files,
  And that pre-existing contradictory definition is not part of the current
    commit (it is not staged),
  And the current commit stages only unrelated, consistent changes,
  When the commit is attempted,
  Then the consistency guard inspects only the staged agent definitions,
  And it does not block the commit for the pre-existing unstaged contradiction,
  And the commit proceeds as far as this guard is concerned.
