criteria: |
  Given an existing persona at docs/personas/field-service-engineer/persona.yaml with:
    - goals: ["Minimize equipment downtime", "Complete repairs on first visit"]
    - frustrations: ["Incomplete service history"]
  When the persona expert agent is invoked with: "Add a goal about mobile connectivity and a frustration about documentation gaps"
  Then the persona.yaml file is updated to include:
    - goals now contains the original 2 goals plus a new goal related to mobile connectivity
    - frustrations now contains the original 1 frustration plus a new frustration about documentation gaps
  And the identity section is preserved unchanged
  And the updated file passes the persona validation script
  And a changelog entry is appended to the persona directory (e.g., docs/personas/field-service-engineer/history.md)
    documenting what changed and why
