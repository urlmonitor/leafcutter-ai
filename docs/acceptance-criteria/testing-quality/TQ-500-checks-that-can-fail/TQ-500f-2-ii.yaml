notes: |
  AMENDED 2026-09-27 (business-analyst) — OWNER MOVED TO THE TEST DESIGNER.
  See docs/known-issues/ac-driven-dev/open-high-ki-acd-20260927-tq-500f-2-ii-contradicts-acd-2500.md.
  must_catch names wrong versions by the condition or input they change; only a
  step that has read the code can do that. The approved ACD-2500 tree moves test
  design out of the technical planner (ACD-2500b) into a code-aware step
  (ACD-2500c), carried by one new agent, working id test-designer (ACD-2500d-5).
  This AC now targets that step.

  FOR THE IT-PO STAGE (fields left untouched by this amendment, all stale):
    - doc_links, it_requirements and test_rationale must move from
      templates/agents/it-po.md to templates/agents/test-designer.md (created by
      ACD-2500d-5; the test-design procedure is written into it by ACD-2500c-1).
      it-po.md must gain NO must_catch text.
    - it_requirements' wording "the enricher ... in its enrichment note" must be
      restated for the test designer. Where the designer records its bug-fix /
      gate declaration is open: ACD-2500c-3 keeps test_spec items closed
      (unknown keys rejected), so either an existing field carries it or a schema
      AC must add one first.
    - ACD-2500c-1 and ACD-2500d-5 both say "the optional Opus sub-call for
      must_catch is deferred until must_catch exists". must_catch now exists
      (TQ-500f-2, PR #911); decide whether this AC takes that route (ADR-033 §2.3).
    - expects_from should also name ACD-2500d-5 (the template this AC edits).

  ORDERING — WHY THE DEPENDENCY SITS HERE AND NOT ON TQ-500. ACD-2500's notes
  ask that "any L0 authored for that analysis should list ACD-2500 in
  depends_on". Deliberately NOT done: the fast lane pulls every unmet
  dependency into the build set, so an L0-level edge on TQ-500 would drag the
  whole ACD-2500 tree into every unrelated TQ-500 build. The ordering is carried
  at the one AC that actually needs the test designer: this one, via ACD-2500c
  and ACD-2500d-5. Building this AC therefore pulls ACD-2500c's subtree and
  ACD-2500d-5 into its build set; that is intended. ACD-2500c-1-i and
  ACD-2500d-5-i are still readiness: reviewed (held on a declared-files schema
  AC), so this AC is effectively blocked until they clear.

  ORIGINAL NOTES (2026-09-25; "enricher" below now reads "test designer"):

  PROMPT-ONLY. This is an instruction to the enricher; no deterministic unit
  test can show that an LLM names good wrong versions. The observable output is
  the enriched requirement records themselves (an eval over R1/R2/R3 can check
  them), but a unit test asserting the instruction is present in the enricher's
  template is the text-search proof CLAUDE.md forbids. IT-PO: say so in
  test_rationale (test_required: false, or an eval-shaped test_spec) rather than
  writing a grep test.

  R3 is the control: an enricher that stamps must_catch on everything would
  pass R1 and R2 and add noise to every new-feature requirement.

  The last Then clause keeps TQ-500's non-goal intact: the judgement is
  DECLARED by the enricher, never inferred from requirement text by a
  classifier.

  IT-PO ENRICHMENT (2026-09-27), after the BA amendment
  TARGET MOVED. doc_links, it_requirements and test_rationale now point at
  templates/agents/test-designer.md (ACD-2500d-5), not it-po.md. it-po.md gains
  no must_catch text. expects_from also names ACD-2500d-5. assigned_agent stays
  llm-expert.

  USER DECISIONS AT THE BA GATE (2026-09-27, binding):
    1. Where the bug-fix / gate declaration lives: in the EXISTING fields. A
       test_spec entry carrying must_catch or angle: discrimination IS the test
       designer's stated judgement. No new schema key.
    2. Opus sub-call for must_catch: not now. must_catch authoring is
       Sonnet-only. The ACD-2500 owner session takes the ADR-033 section 2.3
       question to its own user.

  KNOWN CONFLICT, OWNED ELSEWHERE. ACD-2500c-3 still keeps must_catch out of the
  test designer's allowed test_spec keys. It is being amended by the ACD-2500
  owner session on branch ac-authoring/itpo-followups; this AC does not edit the
  ACD-2500 tree. Until that amendment lands, this AC stays blocked behind
  ACD-2500c (already in depends_on).

  TEST CONTRACT. test_required stays false; no behavioural unit test exists for
  prompt text. The real behavioural check is an eval over incidents 1 and 2
  (R1/R2/R3 as gold rows) once test-designer exists. That needs a follow-up AC.
