    description: "The report states the count in each end state, the measurement date and the inclusion rule (finished, active, test_required false, no covers tag by the shared scanner), and the counts sum to the measured population on a fixture store."
    proves_clause: "the run reports the count in each end state, with the population's measurement date and inclusion rule"
    code_file: scripts/ac_store/migrate_verification_records.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_4_ii_migration_module_imports_in_the_deployed_layout
    target_dir: unit_tests/ac_store/
    framework: pytest
