id: AR-300c-5
title: "Which sub-agents an agent may dispatch is declared once, in its own definition beside its permitted tools, and delivery reads only that"
component: agent-registry
components:
  - agent_registry
  - template_compiler
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an agent definition that declares which other agents it may dispatch,
    in the same header block that declares which tools it is permitted to use,
  When the build compiles that agent's prompt,
  Then the sub-agents named in the compiled prompt are exactly the sub-agents
    that header declares -- none added from elsewhere, none omitted,
    And changing only that header changes the compiled prompt accordingly on the
      next build, with no other definition or record edited,
    And changing only the central registry's record of permitted sub-agents,
      while the header is left alone, does not change the compiled prompt,
    And a declaration may name "every ticket-phase agent" as a single entry,
      which stays that one entry in the header and is resolved to the agents
      that are ticket-phase agents on each build -- so marking a further agent
      as a ticket-phase agent permits it to every agent holding that entry, with
      no edit to any of their headers,
    And both halves of the declaration -- the sub-agents permitted and the tools
      permitted -- can be read from the same block, so the two can be compared
      against each other without consulting a second file,
  So there is one place to change who an agent may call on, and no second place
    that can disagree with it.
