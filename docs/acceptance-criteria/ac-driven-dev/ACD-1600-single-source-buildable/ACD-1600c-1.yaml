  Gates on enrichment COMPLETENESS (presence of file targets + a test contract), which
  is complementary to and distinct from the approval-readiness gate (ACD-1200b family)
  that gates on readiness status (reviewed -> approved).

  IT-PO enrichment (2026-08-12): canonical gate surface scripts/ac_store/scan_ac_store.py,
  aligned with edge child ACD-1600c-1-i; data-driven on field presence, advisory-then-required.

  AMENDMENT (2026-09-25, ACD-2500): the reason vocabulary is the single hold-reason list
  owned by ACD-2500b-2. Build order: this AC may build first (it owns the two original
  reasons and creates the one list if absent); ACD-2500b-2 already depends_on this AC and
  extends the list. work_status stays todo (unchanged by the amendment).
