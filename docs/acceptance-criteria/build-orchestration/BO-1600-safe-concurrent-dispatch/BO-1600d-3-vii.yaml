criteria: |
  Given a fresh-worktree fallback has already created a recovered worktree for the
    damaged worktree in a prior recovery run
  When recovery performs the fresh-worktree fallback again for that same damaged worktree
  Then it creates a new, distinctly-named recovered worktree that does not collide with
    the worktree created by the previous run
  And the second run completes without error
