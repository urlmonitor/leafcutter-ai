      concurrency group, exit 5 concluding red). This record extends that file and keeps
      its name, triggers and concurrency group unchanged.
test_spec:
  - name: test_tq600a_13_xii_every_test_is_in_exactly_one_collection
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "four real `python -m pytest --collect-only -q` subprocesses of a synthetic project — default, correctness lane, timing lane, unfiltered"
    must_catch:
      - "a test marked both `manual` and `timing_ratio` is collected by both lanes"
      - "a `timing_ratio` test without `manual` is in the default run and the timing lane"
      - "a test falls in no collection"
    description: >-
      The three filtered sets are pairwise disjoint and their union equals the unfiltered
      set.
  - name: test_tq600a_13_xii_a_timing_failure_never_holds
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_suite.py lane verdicts in-process, then scripts/ci/post_merge_hold.py against a served history with a red timing run and a green correctness run"
    must_catch:
      - "the timing lane is a job of the correctness workflow, so a timing failure makes the hold's run red"
      - "the hold reads the newest run of any post-merge workflow rather than the correctness workflow's"
      - "the timing failure is reported nowhere"
    description: >-
      A red timing run: the hold passes; the timing notice names the failing test. A red
      correctness run: the hold fails.
  - name: test_tq600a_13_xii_a_new_timing_lane_entrant_is_named
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py against the fake server, with two successive timing verdicts whose lane membership differs, and a scratch repository commit that added the marker"
    description: >-
      The second run's notice names the entrant and the commit that marked it.
test_rationale: |
  The lane split exists because a gate that holds on noise gets turned off. The
  disjoint-union descriptor uses real collections because the marker arithmetic is
  exactly where a test lands in two lanes or none. The never-holds descriptor crosses
  into the hold module because the property is about the pair (covers -xii and -vi;
  written once -vi exists). Under 1.2 s.
