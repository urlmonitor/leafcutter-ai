title: "The platform turns its own agents' feedback into shipped improvements"
component: ac-driven-dev
level: L0
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Agent feedback stops piling up unread and starts becoming finished work on its own.

  Your agents constantly leave behind observations -- gaps, quality concerns,
  tooling friction, recurring success patterns. Today the only way out of that
  pile is for a human to triage every entry by hand. This goal closes the loop:
  the high-confidence portion of that feedback is automatically classified,
  routed to the right next step, and marked resolved -- so the system learns
  from how it is actually used without anyone babysitting the queue. When the
  feedback itself is too thin to act on confidently, the platform flags its own
  feedback process for improvement, so every cycle leaves the corpus richer than
  the last. Anything uncertain is always handed back to a human.
