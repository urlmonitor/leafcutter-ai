notes: |
  INHERITED AND NOT REPEALED. This project's standing convention that a check which
  could not do its job must say so, rather than reporting success, applies here in its
  natural form. That rule was written about checks; this is its equivalent on the
  telling side, and it is being applied, not re-litigated.

  THE CAUTION IN THE L1's NOTES IS NOT A GENERAL WORRY, IT IS THIS PROJECT's OWN RECORD.
  Three defences documented in the root instructions each reported clean for days or
  weeks while examining nothing, and each time the clean result was believed. The
  sharpest of the three is instructive because the command was never wrong — only the
  reference it compared against was stale, so the broken tree and the stale reference
  agreed. An examination that reports a number it examined cannot fail that way silently;
  one that reports only "no gaps" can, indefinitely.

  THE COVERAGE NUMBER IS THE CHEAP HALF AND THE VALUABLE HALF AT ONCE. It costs nothing
  to emit and it converts every future silent-input failure from invisible into obvious
  — a reader who sees zero pairings examined knows immediately what happened, and a
  reader who sees the expected number knows the clean result means something. The
  greater-than-zero clause is what stops it degenerating into an ornament.

  WHY THE FOURTH ARM IS STATED AS TWO RUNS SIDE BY SIDE. "The outcome is different" is
  the only form in which indistinguishability is testable, and indistinguishability is
  the actual defect. An implementation can satisfy the first three arms and still emit
  two outcomes that a reader, or a downstream consumer, cannot tell apart — for
  instance by putting the inability on one stream and the clean result on another, so
  that whichever is read first wins.

  THIS RECORD TAKES NO POSITION ON WHETHER AN INABILITY SHOULD STOP ANYTHING. Per the
  L1, that decision is explicitly left to enrichment, per surface, with the reasoning
  recorded. What is not open is that the inability is stated and is distinguishable.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: when either input cannot be read or yields nothing, return an empty set of
  pairings and continue. Under that injection:
    - the inability arm must go RED, because nothing states that the examination could
      not be carried out;
    - the does-not-state-clean arm must go RED, because an empty set of gaps is
      indistinguishable from no gaps;
    - the side-by-side arm must go RED;
    - the coverage arm on a HEALTHY run must STAY GREEN, so the mutation is shown to
      affect only the degraded path.
  All four outcomes must be observed together and all must revert. This is not a
  hypothetical shape and it is not a careless one — returning an empty collection on a
  failed read is the most common defensive idiom there is, and it is precisely how each
  of the three documented incidents above came about.

  A SECOND MUTATION WORTH RUNNING. MUTATION: emit the inability on a different stream
  from the finding, so that a consumer reading the finding sees a clean result and the
  inability appears elsewhere. Under it the first arm may stay green while the
  side-by-side arm goes RED. A stated inability that the reader of the result never sees
  is the same silence with a paper trail.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above are written to be turned directly into test descriptors.
