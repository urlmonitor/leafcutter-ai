notes: |
  WHY THIS EDGE AND NOT ANOTHER. The route has five decision points and a supplied
  answer is a small structure carrying an action. Nothing in the shape of an answer
  for the covered-route decision distinguishes it from an answer for the final
  approval -- both may legitimately say "proceed" or "stop". So the natural
  implementation of resume, which applies whatever answer it was handed to whatever
  decision it happens to be paused at, silently converts an answer to one question
  into an answer to another. Given that one of the five decisions can delete drafts,
  the failure is destructive rather than merely wrong.

  IT IS THE SAME DEFECT AS THE PARENT L1, ONE LEVEL IN. ACD-2100c-4 refuses an
  answer that did not come from the person; this refuses an answer that came from
  the person but was about something else. Provenance and subject are two separate
  bindings and an answer needs both.

  STAY PAUSED RATHER THAN FAIL. The person is still owed the question, so the record
  must survive the mismatch and the report must say which decision is outstanding --
  otherwise the recovery from a mistyped resume is to start the whole run again.

  2026-08-25 (it-po): the check-before-acting requirement is stated separately from
  the not-applied clause because an implementation that validates the subject after
  dispatching on the action satisfies "the answer is not applied" in the reported
  result while having already taken a side effect. The fourth test is built to catch
  exactly that, which is why it supplies a destructive choice from another decision.
