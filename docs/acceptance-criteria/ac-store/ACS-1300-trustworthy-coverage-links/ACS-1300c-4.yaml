notes: |
  SATISFIES ACS-1300c's documentation_triggers: [reference-doc]. The parent's notes give
  the reason and it is evidence-backed rather than procedural: guarantee 1 is a standing
  rule the next tool author must not re-derive, and TQ-400f — authored and then closed
  unbuilt on 2026-09-01, partly for approaching this line — is the proof that it does get
  re-derived. A refusal that lives only in an acceptance criterion's notes is unfindable
  by someone who is not reading that criterion, which is everyone writing the next tool.

  THE FOURTH CLAUSE IS WHAT SEPARATES THIS FROM A SUMMARY. "The section mentions the
  refusal" is satisfied by a sentence. "A tool built from this section alone passes all
  three checks" fails when the section states the rule but omits what it takes to comply —
  which is the realistic defect, and the reason the byte-stability clause insists on the
  do-not-write form. An author who reads "write the same values back" will build the
  bulk-rewrite that ACS-1300c-2 says cannot be retrofitted.

  THE FIFTH CLAUSE IS ABOUT REACHABILITY, and it is the difference between a rule and a
  rule someone finds. Documented under a heading about this repair, the refusal is
  invisible to the author of the next unrelated tool that writes the same field — and
  that author is exactly the person it exists to stop.

  THE FIREWALL: this AC's deliverable is the document. No behavioural AC in this tree may
  be closed by pointing at it, and in particular the refusal is enforced by ACS-1300c-1
  and its L3, never by the existence of this section.

  ONE HOME, NOT THREE. The refusal is stated here; ACS-1300a-4's how-to points at it and
  the tree's notes point at it. Three copies of a standing rule drift, and the copy the
  reader happens to find is the one that governs.
