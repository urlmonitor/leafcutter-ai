work_status: todo
created_by: docs/acceptance-criteria/infrastructure/INF-100-agent-reliability/INF-100c-5.yaml
criteria: |
  Given a freshly built installed project whose feedback sink is writable,
  When ac-validator submits feedback in the knowledge-gap category for AC GE-122e-2,
  Then the submission is accepted and returns a feedback id,
  And a feedback record naming agent ac-validator and category knowledge-gap is written
    to the feedback log,
  And the agent records that feedback id at sign-off, not "(submit-failed)".

  Given the same installed project,
  When ac-fulfillment-gate submits feedback in the blocker category,
  Then the submission is accepted and returns a feedback id,
  And a feedback record naming agent ac-fulfillment-gate and category blocker is written
    to the feedback log.

  Given the same installed project,
  When ac-validator submits feedback in the quality-concern category (reviewer-only),
  Then the submission is rejected with a message naming ac-validator and quality-concern,
  And no feedback record is written to the feedback log.
