id: TQ-200d-5
components:
  - testing_quality
  - llm_authoring
title: "A live eval hands each agent its instructions outside the command line, so an agent with long instructions can be scored on Windows"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the test writer's instructions, rendered for one row, are about
      67,700 characters long, more than twice the 32,767-character limit of a
      Windows command line,
    And a live eval run of the test writer's 8 rows is started on Windows 11
      with model credentials available,
  When the run starts the agent for each row,
  Then every row's agent session starts and the row is scored on what the
      agent produced; no row fails at launch because of the length of its
      instructions or of its input,
    And no command line the run builds to start an agent is longer than
      32,767 characters, whatever the length of the instructions or the row
      input,
    And the agent receives its instructions character for character as
      rendered for the row, including every quotation mark, every newline and
      the sandbox location written in place of each placeholder,
    And the agent receives the row's input character for character,
    And the same holds for each of the three ways the harness starts an agent:
      label evals, artifact and produced-tests evals, and produced-tests evals
      that record the agent's commands,
    And instructions that replaced the agent's default instructions before
      this change still replace them, and instructions that were added to the
      defaults are still added,
    And once a row has been scored, no copy of its instructions is left in the
      row's sandbox or in the project tree.
depends_on:
  - TQ-200d
