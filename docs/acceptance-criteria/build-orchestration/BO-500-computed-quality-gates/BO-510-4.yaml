title: "llm-expert populates the produces trait on every existing agent template"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the produces field enum is defined (production_code, documentation,
    configuration, prompt, review_verdict, orchestration, test_artifact, analysis),
  And there are N agent templates in templates/agents/ that do not yet have
    a "produces" field in their YAML frontmatter,
  When the llm-expert agent is spawned with instructions to populate the trait,
  Then it reads each agent template's description, role, and existing
    frontmatter fields to infer the correct produces value
  And it writes the "produces" field into the YAML frontmatter of each template
  And it updates the corresponding entry in agent_registry.json with the same value
  And after completion, the validation test (BO-510-3) passes with zero errors

  Given the llm-expert is populating templates where the role field
    unambiguously maps to a produces value (e.g. role: coding -> production_code),
  When it writes the trait,
  Then it uses the mapping without requiring human confirmation:
    coding -> production_code
    documentation -> documentation
    review -> review_verdict
    orchestration -> orchestration
    quality -> test_artifact
    analysis -> analysis
    commit -> orchestration
