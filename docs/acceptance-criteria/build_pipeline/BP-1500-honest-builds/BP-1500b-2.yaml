notes: |
  WHY THIS IS A SEPARATE AC FROM BP-1500b-1. An implementation could satisfy
  BP-1500b-1 completely by adding the single string "fast-lane-build.js" to a
  list of names to delete. It would pass its own tests on the day it was written
  and catch nothing ever again. This project has patched a hand-maintained
  deploy list four times for the mirror-image defect; the "no edit to any list"
  clause is what makes that shortcut fail, and the "a capability whoever built
  the sweep has never heard of" premise is what makes it impossible to
  pre-populate.

  ON THE RECORD-OF-PAST-BUILDS CLAUSE, which is the least obvious of the four
  and was derived from disk rather than from the brief. Two build manifests were
  inspected on 2026-09-07:

    - The workspace-root manifest (last written 2026-09-01 10:52) STILL maps
      leafcutter-ai/templates/workflows-js/fast-lane-build.js ->
      .claude/workflows/fast-lane-build.js, for a source that no longer exists.
    - The package-root manifest (last written 2026-09-07 16:30) no longer
      mentions the workflow at all; the entry was pruned when the template went.

  Both states are hazardous, in opposite directions, and a derivation phrased
  only as "an installed path absent from the manifest is an orphan" handles
  exactly one of them:

    - Against the PRUNED manifest that rule works, because the entry is gone.
      This is also the mechanic the parent's notes call out: pruning the record
      before computing staleness destroys the only evidence the file was ever
      ours.
    - Against the STALE manifest that rule FAILS SILENTLY. The path is still
      listed, so the orphan is classified as legitimate and survives -- and this
      is the manifest belonging to the very tree the reporter ran
      `build.py --force` against.

  So the manifest is a record of a past build, not a statement of what the
  package can currently produce, and it cannot be the definition of the
  comparison set. The producible set must be recomputed from current sources
  (second Then clause); the manifest's role is provenance -- it can tell you a
  path was once ours, which is what distinguishes an orphan from an adopter's
  own file in BP-1500b-4 -- and a manifest entry whose source has vanished is
  itself a positive orphan signal (third Then clause).

  This is a correction to the brief that produced this decomposition, which
  proposed "an installed path in neither the template account nor
  output_mappings, and not a shim symlink, is an orphan". Applied literally to
  the stale manifest, that rule does not flag the one real orphan the same brief
  requires the work to go red on.
