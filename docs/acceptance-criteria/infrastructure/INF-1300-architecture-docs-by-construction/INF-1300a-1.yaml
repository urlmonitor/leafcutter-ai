id: INF-1300a-1
title: "The document handed to the author is committable exactly as produced, with nothing added by hand"
component: infrastructure
components:
  - documentation_system
  - doc_compliance
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300a.yaml"
criteria: |
  Given a request to start a new architecture document that supplies every input
    the invocation declares — the tier, the kind of picture, the component, the
    title, the destination, the date, the document above it and the originating
    ticket,
  When the document is produced,
  Then the produced file, with not one character altered by a person, is offered
    to the project's full set of commit-time document checks — the check on the
    filename and its agreement with the declared tier, the check on the
    frontmatter fields, the check on the two-directional link to the document
    above, and the check on the size of the picture — and every one of them
    passes,
  And those checks are the project's own, run as the project runs them, over the
    produced file as it sits on disk: a check that was not run, or that was run
    over a copy the observation assembled rather than over what was produced,
    counts as a failure of this criterion and not as an absence of evidence,
  And no check is skipped, relaxed, reordered, suppressed by a bypass token, or
    edited in order to obtain that result — a pass bought by changing a check is
    a failure of this record,
  And the same result holds when the produced file is the only thing offered: no
    second file, no hand edit and no follow-up step stands between production and
    the checks passing.
depends_on:
  - INF-1300a
