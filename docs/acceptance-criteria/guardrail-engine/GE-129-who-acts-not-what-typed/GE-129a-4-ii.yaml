id: GE-129a-4-ii
title: "A customised commit specialist definition passes the parity check only with a recorded exemption that states a reason, and the exemption never excuses a duplicate"
component: guardrail-engine
components:
  - commit_guardian
  - agent_registry
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given five installed projects whose commit specialist definition differs from the shipped one in
    the same one line of its instructions, and in which no other definition declares the commit
    specialist's name unless stated:
    (x) the project records an exemption for its commit specialist with the reason "adds the team's
        sign-off trailer to every commit message",
    (y) the project records no exemption,
    (z) the project records an exemption for its commit specialist whose reason is empty,
    (w) the project records an exemption for its commit specialist whose reason is three spaces,
    (v) the project records the same exemption as (x), and a second definition declaring the commit
        specialist's name exists at user scope,
  When the commit specialist parity check runs on each project,
  Then (x) passes, and its result states that the definition differs from the shipped one under an
    exemption and quotes the stated reason,
    And (y) fails as GE-129a-4's case (b) does, quoting the first differing line and the shipped
    line it replaced,
    And (z) and (w) each fail, stating that the exemption gives no reason, and quote the first
    differing line,
    And (v) fails, naming the installed location and the user-scope location that declare the
    commit specialist's name, so an exemption for a customised definition does not excuse a second
    definition of the same name.

  Given project (x) with its exemption removed and nothing else changed,
  When the commit specialist parity check runs on it,
  Then it fails as (y) does.
