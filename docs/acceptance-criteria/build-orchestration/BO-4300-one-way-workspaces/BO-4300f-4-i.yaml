estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4300f-4
  contract: Fixture API.
package_surface: false
it_requirements:
- A session-level guard snapshots the developer repository (`git worktree list --porcelain`, `git for-each-ref`,
  `git config --local --list`) before the workspace proof suite and compares after; any difference fails
  the session. Fixture git runs with isolated HOME / GIT_CONFIG_GLOBAL / GIT_CONFIG_NOSYSTEM so no fixture
  identity reaches the real config.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_developer_repo_registrations_branches_and_config_unchanged_by_suite
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: The before/after snapshots of the developer repository are identical.
- name: test_no_temporary_project_is_registered_in_or_linked_from_developer_repo
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: No worktree entry, remote, alternates file or config value in the developer repository
    points into the suite's temp directory.
test_rationale: F14 was a test leaking a worktree into the real repository; the assertion is therefore
  made on the real repository's own records.
