notes: |
  Mixed-case names (EPIC- vs epic-) are deliberate in the example: Windows
  file systems are case-insensitive and a locale-aware or case-folding sort can
  order them differently from a byte-wise sort. Which rule is chosen is the
  IT PO's call; that the rule is fixed and host-independent is the behaviour.
