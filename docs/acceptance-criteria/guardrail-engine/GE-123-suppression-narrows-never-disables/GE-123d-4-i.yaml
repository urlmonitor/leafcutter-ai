notes: |
  THIS IS THE CARELESS-WIDENING CASE THE PRODUCT-OWNER WARNED ABOUT, and it is
  reachable today rather than hypothetical. The five prose locations were chosen
  to mirror the existing high-entropy exemption list, and one of those entries —
  the skill-prompt area — contains executable Python. The secrets scanner's own
  script lives inside it. Copying the location list across to the
  generic-credential rule without a file-kind gate would exempt a live
  credential written into the scanner's own source. That is strictly worse than
  the false positives the feature exists to fix, and it is one careless line of
  reuse away.

  IT IS ALSO WHY THE KIND GATE EXISTS AT ALL. Without this case the kind gate
  looks like belt-and-braces and would plausibly be dropped as redundant during
  implementation or review. This AC is the standing argument against dropping
  it, and the second scenario — two files in one directory differing only in
  kind — is the shape that makes the gate observable rather than inferred.

  A NARROWER ALTERNATIVE WAS CONSIDERED: drop the skill-prompt area from the
  location list entirely, rather than admitting it and gating on kind. Rejected
  because the prompt text in that area is exactly the kind of writing that
  describes credential shapes — it is where the security-scanner skill documents
  its own rules — and because the same conflict recurs wherever prose and code
  share a directory. Gating on kind solves the class; dropping one directory
  solves one instance.

  VERIFICATION STANDARD (inherited from the L0): both files must be real files
  staged together and checked through the pre-commit secrets check. A test that
  calls the exemption predicate with two paths cannot show that the reported
  finding actually blocked the commit.

  CONFIRMED AND FILED, 2026-08-18. The hazard this AC anticipates is not only
  reachable — for the OTHER rule it has already happened, and it has now been
  measured and recorded as KI-CG-004 in docs/known-issues/commit-guardian.md:
  the high-entropy rule is exempted for whole files under a prefix list that
  includes the skill-prompt area, so a token of Shannon entropy 5.17 goes
  unreported in the secrets scanner's own source today while the same token is
  reported under the build scripts directory. That strengthens this AC's
  argument and changes none of its scope. The relationship is fenced in
  it_requirements so the two are not later merged: KI-CG-004 is an existing
  defect in an existing rule and is separate work; this AC is the guarantee that
  the NEW exemption does not acquire the same shape, and it must not be closed
  by anything done to KI-CG-004.
