it_requirements:
  - "THE INSTRUCTION TO DELETE is CLAUDE.md -> 'Pre-Drive Checklist' -> 'Worktree pre-commit config (MANDATORY for worktree-based drives)', including its Option A symlink recipe and its Option B copy recipe for NTFS/WSL2. Delete the section, do not soften it."
  - "The LATENT HAZARD paragraph in that same section — .security-allowlist resolving via the .leafcutter symlink target rather than the worktree root, with the dual-update rule — must be removed with it or rewritten to describe the behaviour that now holds. Leaving it orphaned re-teaches the workaround by implication, because a reader cannot follow a suppression rule about a link they were never told to create."
  - "SWEEP THE WHOLE DOCUMENTATION SET, not just the two named files: docs/how-to/managing-pre-commit-hooks.md, docs/how-to/verify-precommit-active.md, docs/how-to/drive-epic-manually.md, BOOTSTRAP.md, SETUP.md, and any templates/ copy of these. The criterion is NO SURVIVING OCCURRENCE anywhere. Verify by an explicit repo-wide search and record the command and its empty result in the sign-off."
  - "The replacement text states the guarantee (the checks reach the same verdict from any working copy) and gives ONE confirm command. Use the SAME command GE-120d-5 documents — docs/how-to/verify-precommit-active.md and templates/scripts/commit_guardian/verify_precommit_active.py already exist and are the natural home — so the two how-to edits agree rather than offering a reader two different commands."
  - "ORDERING — HARD CONSTRAINT: this AC lands only after GE-120b-4 demonstrates family-wide parity AND after GE-120d-4 demonstrates it end-to-end on a working copy nobody repaired by hand. Deleting the workaround while the defect is still live removes the only thing protecting drives from it."
  - "CLAUDE.md and the how-to files are tracked documents subject to check_doc_frontmatter, check_doc_length and check_doc_links; edit in place and keep them passing in the same commit."
test_spec:
