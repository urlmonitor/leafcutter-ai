title: "The phase dispatch tells the agent to fill the reply tool's fields directly, never to return a JSON string"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the deterministic dispatch in templates/workflows-js/build-feature.js (and its
    declared twin templates/workflows-js/build-ticket.js) is about to spawn a phase
    agent whose reply the driver enforces against PHASE_RESULT_SCHEMA through the
    reply tool,
  When it assembles the phase dispatch string (both the per-phase dispatch and the
    retry/re-dispatch prompt that currently say "Return a JSON result with at minimum
    { "status": ... }"),
  Then the string instructs the agent to fill the reply tool's fields directly --
    `status` (ok | blocker | failed | handoff), `message`, and `handoff_target` naming
    the next phase agent when status is handoff -- and never to pass the reply as a JSON
    string or inside an `input` field,
  And the string no longer describes the reply as "a JSON result", and names every
    status value the schema accepts, including `handoff`,
  And the bug symptom ("Phase agents sometimes return their whole result as a JSON
    string inside a single `input` field instead of filling the reply tool's fields.
    documentation-expert did so on all five retries in run wf_e1f3e873-096 on
    2026-09-25 (and ac-fulfillment-gate once in wf_ee4e9d81-680); the schema rejected
    every attempt, the five-retry cap was reached, and the epic drive halted with the
    ticket's work already done.") must not occur
