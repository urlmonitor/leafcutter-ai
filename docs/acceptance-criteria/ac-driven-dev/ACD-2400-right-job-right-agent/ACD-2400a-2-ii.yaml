readiness: approved
priority: high
title: "The graph component list is filled only when the namespace maps to exactly one graph id"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given record A has namespace component "ac-driven-dev" and an empty graph component list,
    and the store's namespace-to-graph mapping gives exactly one graph id, "ac_driven_dev",
    for "ac-driven-dev",
    and record B has an empty graph component list and a namespace component for which the
    mapping gives two candidate graph ids,
    and record C lists the graph component "ac-driven-dev" (the namespace spelling, which is
    not a graph component id),
  When the requirement rule check runs,
  Then A's graph component list reads ["ac_driven_dev"] and is reported "fixed",
  And B is left unchanged and reported "needs a decision" naming both candidate ids,
  And C is left unchanged and reported "needs a decision" naming "ac-driven-dev" as a value
    that is not a graph component id.
depends_on:
  - ACD-2400a-2
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Fill only when the mapping yields exactly one graph id and that id exists in docs/components.json.
- A non-empty components list is never rewritten, even when it holds invalid values.
- 'Every write is a field-targeted edit: only the named field changes and every other byte of the record
  is preserved (no whole-file YAML load/dump rewrite; see the fast_lane.py round-trip hazard in the ac-driven-dev
  PROJECT_CONTEXT).'
delivers_to: null
expects_from:
  ac_id: ACD-2400a-2
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
test_spec:
- name: test_single_mapping_fills_components_and_reports_fixed
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Record A's components becomes ['ac_driven_dev'] and is reported 'fixed'.
- name: test_two_candidates_left_unchanged_naming_both
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Record B is unchanged and reported 'needs a decision' naming both candidate ids.
- name: test_namespace_spelling_value_reported_not_graph_id
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Record C is unchanged and reported 'needs a decision' naming 'ac-driven-dev' as not a graph
    component id.
  angle: boundary
