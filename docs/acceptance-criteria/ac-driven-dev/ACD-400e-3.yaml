id: ACD-400e-3
components:
  - ac_driven_dev
title: "A written account that stops matching the queue is caught when it stops, not months later"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the written account of how the queue chooses and the queue itself agree,
  When the two are made to disagree from either side — the queue is changed to
    consult a further key when ordering the offer, or the account is edited to
    describe an order or an admission test the queue does not use,
  Then the disagreement is reported at the point the change is introduced, naming
    both the statement that no longer holds and the answer the queue actually gave,
  And the report is reached by asking the queue rather than by inspecting how it is
    written: a change that alters only wording the queue never consults is still
    caught, and a change that alters what the queue does while leaving every expected
    word in place is caught too,
  And while the two agree the check reports nothing, so a store in which nothing has
    drifted is not made to look like one in which something has.
depends_on: [ACD-400e, ACD-400e-1a, ACD-400e-1b, ACD-400e-2]
