id: BP-100k-4
components:
  - build_pipeline
title: "A registered commit gate whose activation condition can never match anything the repository is able to stage is reported as unreachable and blocks — a gate that cannot fire is not protection"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a commit gate is registered in the guardian registry with an activation
    condition that selects which staged paths cause it to run,
  And no path this repository is able to stage can ever match that condition —
    because it names a location that exists in no layout this repository is ever
    checked out in, or because every location it names is excluded from version
    control,
  When the registry's own reachability check runs,
  Then it names that gate, states which part of its activation condition nothing
    can match, and fails,
  And given a gate that inspects the whole tree rather than the staged file list,
  When the same check runs,
  Then a path-based activation condition is rejected as that gate's trigger,
    because a gate that never consults the staged file list must not have its
    execution decided by one — it is required to declare that it always runs,
  And given every registered gate's activation condition matches at least one
    path the repository actually tracks,
  When the check runs,
  Then it reports zero unreachable gates and permits the commit,
  And a registry that contains even one unreachable gate cannot produce a
    passing commit — the reachability verdict is part of the commit outcome, not
    an advisory note.
