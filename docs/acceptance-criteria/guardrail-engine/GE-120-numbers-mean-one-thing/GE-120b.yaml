criteria: |
  No opting out — new work joins the numbering instead of sitting outside it.

  When you add something that is supposed to carry a number, it gets one. Work
  can no longer stay invisible to the numbering by simply never asking for a
  number, so the guarantee that every number means one thing actually covers
  everything, rather than only the things that chose to participate.
