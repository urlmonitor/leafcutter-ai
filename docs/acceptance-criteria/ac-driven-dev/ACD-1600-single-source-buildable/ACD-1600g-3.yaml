roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement that declares the release workflow as deliberately
    excluded from its work,
  And a build of that requirement whose pending changes include the release
    workflow alongside the files the requirement was meant to change,
  When the change under review is compared against the requirement's boundary,
  Then the review does not conclude on its own -- it stops and surfaces the
    release workflow for a person to decide about,
  And the report names the release workflow specifically and names the
    requirement whose boundary it crossed,
  And a build whose pending changes stay inside the boundary concludes without
    surfacing anything,
  And the same requirement built inside a bundle of four other requirements
    produces the same outcome for the same pending changes.
depends_on: [ACD-1600g, ACD-1600g-1, ACD-1600g-2]
