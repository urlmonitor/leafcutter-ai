notes: |
  TQ-200d SUGGESTED SPLIT, ITEM 3 (test-designer). BLOCKED until the agent
  exists: depends_on ACD-2500d-5 is carried on THIS L2, never on TQ-200d (the
  fast lane pulls every unmet dependency into the build set, so an L1-level
  edge would drag ACD-2500d-5 into every TQ-200d build). TQ-500f-2-ii (the
  must_catch duty in the designer's procedure) is not a build dependency: the
  rows may exist before it and will fail until it lands, which is the eval's
  red baseline.

  THE TRAP IS THE DIRECTION TQ-500f-2-ii's R3 LEAVES OPEN. R3 says new behaviour
  is not REQUIRED to carry must_catch. The failure a designer is likely to show
  is the opposite over-reach: "revert the fix" on work with nothing to revert,
  which would send the wrong-version runs an absence (TQ-500g-1-ii) and stop the
  work for nothing.

  THE JUDGEMENT IS THE DESIGNER'S OWN. Per TQ-500f-2-ii, bug fix / gate /
  neither is the designer's judgement, not an automatic classifier's output
  (TQ-500 non-goal). The designer expresses it through the test_spec fields it
  writes (must_catch, angle: discrimination; absence = neither), and the eval
  scores those fields structurally (OQ-12). A judge is optional and secondary,
  never the only scorer (OQ-5).

  LOCAL ONLY (user decision at the PO gate): see TQ-200d-1 notes.

  IT-PO ENRICHMENT (2026-09-28)
  Not buildable until ACD-2500d-5 (llm-expert, todo) is done.
  IT-PO TECHNICAL ALIGNMENT (2026-10-23, claimed into the TQ-200d lane)
  Criteria, title, depends_on and readiness untouched. Mismatches with the
  earlier enrichment:
    - "BLOCKED until ACD-2500d-5": ACD-2500d-5 is done and
      templates/agents/test-designer.md exists. The it_requirement is
      rewritten, and the test-designer.md doc_link is now status exists.
    - The designer writes no test files. Its output is test_spec,
      test_design_authorship and test_design_opened_files, edited field by
      field into the requirement record, plus one JSON reply. The row
      sandbox therefore carries a small AC store, and scoring reads the
      edited records.
    - The dispatch input is the plan-feature.js dispatchTestDesign shape,
      built around the report of scripts/ac_store/design_prepass.py.
    - "States, in its own words, whether the requirement is a bug fix, a
      gate or neither": TQ-500f-2-ii's user decision of 2026-09-27 carries
      that judgement in existing fields (must_catch, angle discrimination)
      with no new key, so no free-text classification surface exists
      (OQ-12).
    - The template has no {{config.output_root}} placeholders, so OQ-3
      rendering does not apply to this agent.
  Shared decisions OQ-1, OQ-2, OQ-5, OQ-6 and OQ-11 apply as recorded
  below, together with OQ-12 to OQ-15.

  USER DECISIONS (2026-10-23, answered in the main session; all IT-PO
  recommendations accepted)
    OQ-1  A: one new produced-tests scoring_mode in sibling modules
          scripts/evals/produced_tests_mode.py, produced_tests_scoring.py and
          (TQ-200d-1-i) produced_tests_runs.py; run_agent_eval.py dispatches
          it and offsets the lines by moving out the unused text-assertion
          scaffold. No test_ prefix on these modules.
    OQ-2  Sets at scripts/evals/sets/<agent>.jsonl, fixture projects and
          recorded outputs under scripts/evals/sets/<agent>/{projects,recorded}/,
          recorded test files with the suffix .py.recorded; bad outputs for
          unit tests under unit_tests/evals/fixtures/ with the same suffix.
    OQ-3  A: render {{config.output_root}} to the sandbox and copy the scripts
          the template names (scripts/db_check; for runner callers also
          scripts/build_orchestration and scripts/ac_store) into it.
    OQ-4  The scorer writes the sandbox AC record after the agent runs, from
          its # covers: tagged tests, with the must_catch from the row. The
          agent works on the pre-fix code; the scorer installs the fix and
          calls the runner with base_ref at the pre-fix commit.
    OQ-5  Deterministic report and fixture checks everywhere, the judge
          optional and secondary; the runner-backed check for the refresh
          gate, offered for test B.
    OQ-6  A: config key local_only: true; eval_selector.py keeps such agents
          out of affected and out of --check; payload run_context "local".
    OQ-7  A: the mode's own invoker captures a stream-json transcript and
          scores Bash tool-call inputs structurally.
    OQ-8  Accepted: the placeholder makes the checker report invalid; no row
          reaches a database.
    OQ-9  Structural check of produced SQL; a live run is optional later work.
    OQ-10 TQ-200d-1 and TQ-200d-1-i are built in one fast-lane run.
    OQ-11 The live before-score is DEFERRED: recorded later as a separate
          step the user triggers, after PR #1324 merges, stamped with
          trigger_shas. No build step calls a model.
    OQ-12 The bug fix / gate / neither judgement is read from the record
          fields (must_catch, angle discrimination; absence = neither), per
          TQ-500f-2-ii's 2026-09-27 decision. The criterion's "in its own
          words" needs a BUSINESS-ANALYST AMENDMENT to say so; the
          orchestrator dispatches the BA. Criteria are not changed here.
    OQ-13 The eval builds the dispatch input from the same ingredients as
          plan-feature.js dispatchTestDesign (ids, verbatim design_prepass.py
          report, ac_store_path, test-design group only) and accepts wording
          drift; the seam test pins the ingredients.
    OQ-14 Only a revert alias fails the new-behaviour trap; other wrong
          versions on that record are reported, not failed.
    OQ-15 "revert the fix" and "the gate always allows" match exactly after
          trimming and case-folding (runner alias rule); a condition-naming
          wrong version matches by its condition token.
