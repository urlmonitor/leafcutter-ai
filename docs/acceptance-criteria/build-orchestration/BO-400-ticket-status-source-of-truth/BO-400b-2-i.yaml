title: "Script handles missing status field gracefully"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given a ticket file with valid YAML frontmatter
    (delimited by opening and closing `---` lines)
    but no `status:` field present in the frontmatter block,
  When the script is invoked with --status in_progress,
  Then it treats the missing field as equivalent to `status: todo`
  And the transition todo -> in_progress is valid per the allow-list
  And it inserts `status: in_progress` into the frontmatter
    (after the opening `---` line, preserving existing field order)
  And it exits with code 0
  And it prints: "status: (absent, treated as todo) -> in_progress"
  And a subsequent read of the file shows `status: in_progress`
    in the frontmatter block.
