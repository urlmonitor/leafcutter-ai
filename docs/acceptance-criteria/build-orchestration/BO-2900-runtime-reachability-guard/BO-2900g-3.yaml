test_spec:
  - name: test_bo_2900g_3_single_permitted_kind_set_resolves_from_the_real_config_files
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Load config/ac_store_schema.json and config/test_requirements.schema.json from disk in a fresh subprocess with json.load (no fixture copies) and assert exactly one permitted-kind set is resolvable, identical on both sides."
  - name: test_bo_2900g_3_retired_kind_is_absent_and_not_accepted_as_a_synonym
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "The retired name is absent from the permitted kinds, and a description carrying it is rejected rather than rewritten — assert the rejection, and assert no code path maps it to the surviving name."
  - name: test_bo_2900g_3_generator_test_angles_equals_the_schema_enum
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: "Cross-source set-equality between the real producer's _TEST_ANGLES and the real schema enum, both read from where they live. The FP-1 layer-3 control: a comparison against a convenience copy reproduces the defect it is checking for."
  - name: test_bo_2900g_3_test_level_axis_is_unchanged_by_the_reconciliation
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: boundary
    description: "NEGATIVE CONTROL for the out-of-scope third axis: read config/ac_store_schema.json from disk and assert test_spec[].type still permits the test-LEVEL values and is NOT equal to the permitted-kind set — and that every test_spec entry in the real store still validates against it, so the reconciliation invalidated no existing record."
  - name: test_bo_2900g_3_deployed_ac_schema_gate_rejects_a_retired_kind
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier: run `python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/check_ac_schema.py <AC yaml>` as a subprocess on a real AC file whose test_spec declares a retired kind, and assert a non-zero exit naming the offending value — proving the reconciled vocabulary is enforced on the gate that runs, not only in the inert schema."
test_rationale: |
  Three things can go wrong here that a schema-shaped unit test cannot see. First, the
  change can be applied to the definition nothing reads, leaving the live gate on the
  old vocabulary — hence the deployed-hook test with a known-bad input (must_block).
  Second, the third copy of the enum inside the generator can drift, which is the exact
  shape of the ComputedQualityGates layer-3 incident — hence the cross-source set-equality
  test that reads both real sources rather than a fixture. Third, and found the hard way
  on 2026-08-18, the reconciliation can over-reach onto the out-of-scope test-LEVEL axis
  and invalidate the whole corpus while every schema-shaped test stays green — hence the
  negative control that reads the real store back through the changed schema.
