criteria: |
  Given a ticket held back by preflight during an automated drive,
  When the drive continues to the next ticket,
  Then the held-back ticket is reported in the drive's surfaced outcome (the structured
    result the operator sees at the end of the batch), not only appended to a log line,
  And the report names the held-back ticket id and its failing check,
  And the drive does not mark the held-back ticket as done or as dispatched.
