  - git_vcs_operations
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Fix it once, fixed everywhere -- every route hands over your work the same way.

  Whichever way work gets done on your behalf -- a full build, a quick fix, the fast
  lane, planning requirements or wrapping up a feature -- the routine steps that save,
  deliver and prepare that work behave identically, because there is only one of each.
  When one of those steps is improved, every route gets the improvement the same day,
  and no route is left carrying an old mistake that another route already outgrew. Moving
  a route onto the shared step never makes it worse than it was: the shared step starts
  from the best version that already exists, and every problem that version was fixed
  for stays fixed.
