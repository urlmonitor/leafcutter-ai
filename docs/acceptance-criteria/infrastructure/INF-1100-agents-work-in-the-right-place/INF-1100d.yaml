notes: |
  ORIGIN. Request item 8 from the discrimination initiative (TQ-500f/g). User
  decision Q3: the adopter address postgresql://trader:trader@localhost:5403/LIVE
  is removed from ALL shipped defaults and templates — seven source places found
  by the PO, including the default for testing_context.db_connection_test in the
  shipped skills-config default, the test-writer and test-runner agent templates,
  the test workflow, the skills-config schema, the skills-config field reference,
  and the testing README (generated copies follow from the build). A missing
  connection is reported, never guessed. Phase A: decompose in this pass.

  WHY HERE AND NOT UNDER TQ-500. This is portability, not test discrimination.
  INF-1100 ("Agents always do their work where your project keeps it") already
  owns "your configuration, not a hard-coded guess, decides where agents work";
  the database a project tests against is one more such place. Searched first:
  BP-900 (installed capabilities work) is at 8 L1s under an override and is about
  missing scripts; BP-1500 is about what a build writes; neither fits better.

  DELIBERATE CONTRAST WITH INF-1100a. INF-1100a-1-i lets a missing test folder
  fall back to a documented default — a harmless default. For a database address
  there is NO safe default: a guessed address can point tests at a real database
  (the shipped one is named LIVE). So this L1 has no fallback; absence is
  reported. The BA must not copy INF-1100a's fallback pattern here.

  FOR IT-PO: the shipped value also embeds a username and password; consider
  whether the risk surface should be raised beyond contract_boundary.
