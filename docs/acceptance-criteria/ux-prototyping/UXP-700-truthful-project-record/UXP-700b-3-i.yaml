test_required: true
test_rationale: |
  UXP-700b-3 alone is discharged by a check that always reports not-exercised - a guard that
  refuses everything is as useless as one that refuses nothing. The two-scenario shape is
  deliberate: it is one behaviour (the boundary at a population of one) and both halves must be
  asserted together or the boundary is not pinned.
test_spec:
  - name: test_single_satisfying_record_reports_the_rule_holds_and_one_examined
    target_dir: unit_tests/product_truth/
    description: "Population of one that satisfies the rule yields a holds verdict with an examined figure of one."
    type: unit
    angle: boundary
    framework: unittest
  - name: test_single_violating_record_reports_the_violation_by_name
    target_dir: unit_tests/product_truth/
    description: "Population of one that violates the rule yields a violation naming that record, not a not-exercised report."
    type: unit
    angle: failure
    framework: unittest
notes: |
  Two Given/When/Then scenarios in one record is intentional: this is the negative control for
  UXP-700b-3 and a control needs both its arms in the same record, or one arm can be
  implemented and the other quietly dropped.
target_epic: EPIC-TruthfulProjectRecord
