it_requirements:
  - Documentation states only behaviour that a test proves on main; where the code and an existing
    doc disagree, the doc is corrected, never the other way round.
  - 'Every answer example is a literal leafcutter.human_answer.v1 payload the kernel accepts as written
    (schema plus the decision''s semantic checks), checked rather than written from memory. There is
    no executable test (test_required false): the author checks every example against
    kernel/schemas/leafcutter.human_answer.v1.schema.json and the semantic checks in
    kernel/interaction/submissions.py with a scratch script outside the repository, and names the
    command and its result in its sign-off comment. documentation-verifier confirms only that the
    how-to changed on the branch and holds no placeholders; it does not re-run the check, so the
    sign-off record is the evidence.'
  - 'A words answer at the ranked question is re-assessed with the words as constraints and ranked
    again. DK-600b-2-ii is work_status done and its covered_by test
    tests/kernel/capabilities/test_design_ending.py::TestHumanChoiceResolves::test_a_words_answer_at_the_ranked_question_is_reassessed_and_ranked_again
    proves it: state it once that test passes on this branch, and correct the ''recorded only''
    sentence in run-the-decision-kernel.md at the same time.'
  - State that edited_criteria replaces the whole proposed criteria set (unlisted pending criteria
    are declined) and that approved_criterion_ids is ignored when edited_criteria is present.
  - How-to genre (Diataxis); link to run-the-decision-kernel.md for reference detail rather than copying
    it.
  - 'Target file (fixed 2026-10-10 by business-analyst for tickets/00_inbox/TICKET-20261010-DecisionLifecycleDocs.md): docs/how-to/answer-the-decision-kernel-questions.md (new how-to beside run-the-decision-kernel.md), plus the ''recorded only'' correction in docs/how-to/run-the-decision-kernel.md.'
test_required: false
