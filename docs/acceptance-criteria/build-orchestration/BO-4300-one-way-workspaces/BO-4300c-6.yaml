notes: |
  Origin: user decision dec-0ed3e2e3a1cd8340 (2026-10-10), taken on the 2026-10-09
  investigation of the stage canaries that BO-4300c-1-ii delivered. Placed as a sibling of
  BO-4300c-1 at the user's choice, so BO-4300c-1 and its done children are not reopened.
  BO-4300c-1-ii still owns "every declared protection fires"; this record only corrects how
  the canary reads its own inputs, and how its inertness is proven. readiness is draft, not
  the siblings' approved: check-ac-schema refuses an approved code AC that has no test_spec,
  and the test contract is the IT PO's to write. The decision approved the behaviour text
  these criteria render; the Gherkin wording was written afterwards by the business analyst,
  so promotion to approved follows the IT PO pass.

  One scenario per defect found (the canary is precommit_canary.py --stage <stage>; "the
  rejection signal" is the PRECOMMIT_CANARY_REJECTED marker readiness counts):
  (1) git running but exiting non-zero (corrupt index, rc 128; invalid GIT_DIR, rc 129) was
  read as "reserved path not found": exit 0, git's stderr discarded, so readiness refused
  HOOKS_INACTIVE without being able to say why. "git could not start" already failed closed
  (exit 1, no marker), so the two were inconsistent; this record makes "git ran and failed"
  match it. Exposure in real pre-commit runs is low, because pre-commit's own staged-file
  listing fails first.
  (2) post-merge lumped a missing ORIG_HEAD (nothing merged: a hand run, a fresh clone) together
  with broken-repository errors; only the missing ORIG_HEAD is "nothing merged".
  (3) commit-msg decoded the message as UTF-8, so a cp1252 message (b"Gr\xf6\xdfe") raised an
  uncaught UnicodeDecodeError, exited 1 with a traceback and blocked an ordinary commit. The
  approved fix compares the first line as bytes.
  (4) unit_tests/build_orchestration/test_bo_4300c_1_real_install.py::
  test_registered_canary_hooks_are_inert_for_ordinary_input ran the hooks outside any git
  repository, where git falls into --no-index mode and lists nothing, so it could not fail: a
  mutant rejecting every staged path passed it. The fifth scenario is its replacement, with a
  discrimination arm in the same repository.

  Reuse, do not re-derive: failing closed on a check that cannot look, with the raw error
  surfaced, is BO-1700b-1 and KI-CG-20260901 ("reports false where it means could not look");
  the reserved inputs come from the install's own declaration (BO-4300c-1-ii), never hard-coded
  in the criteria.

  For the IT PO: the approved option requires the proof to run the DEPLOYED canary as a separate
  process against real temporary git repositories, under the BO-4300 proof rules in
  BO-4300c-1-iii's it_requirements (deployed copy via the BO-4300f-4 locator, temp-dir only,
  isolated global and system git config, no mock of git, no grep of source); canary commits and
  merges run with git's working directory set to the project, never `git -C <path> commit`.
  Analyst additions beyond the approved text, each guarding a regression a byte comparison or a
  new test could introduce: the line-ending clause and the empty-message case (commit-msg), and
  the after-merge discrimination arm alongside the commit-time one. Not in the approved option,
  so not in these criteria: whether the maker's HOOKS_INACTIVE answer carries the canary's git
  report through to its caller.
