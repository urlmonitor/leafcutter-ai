id: BO-1500a-5-iii
components:
  - build_orchestration
readiness: approved
priority: high
title: "The setup outcome is read from the last non-empty line of the reported output, so progress lines before the payload cannot halt authoring"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given an AC-authoring run's isolated-workspace setup step ran
    `setup_ticket_worktree.py create-ac-worktree` to success,
  And the setup agent reports an output whose last non-empty line is that
    command's single-line JSON payload naming worktree_path, branch and
    ac_store_path, preceded by progress lines such as
    '[already_installed] commit-msg' that the agent's shell combined from the
    command's stderr,
  When the workflow evaluates that setup outcome, before it dispatches the
    first authoring agent,
  Then it interprets the payload from the last non-empty line of the reported
    output alone, ignoring every line before it and any blank or
    whitespace-only lines after it, whether lines end in LF or CRLF,
  And it adopts that payload's worktree_path as the authoring worktree and its
    ac_store_path as the AC store location, and the run goes on to dispatch
    its first authoring agent,
  And when the last non-empty line of the reported output is not a JSON object
    naming a worktree_path, the run still halts before any authoring agent is
    dispatched with setup_failure_kind no_workspace_named, even when an earlier
    line holds a well-formed payload,
  And the bug symptom ("/plan-feature halts every run with setup_failure_kind no_workspace_named although setup_ticket_worktree.py create-ac-worktree succeeded and printed its JSON payload as the last line: the setup agent reports output='[already_installed] commit-msg\n[already_installed] manual\n[already_installed] post-merge\n{"worktree_path": ...}' (it merges stderr into output; since BO-1500a-1-ii those progress lines are on stderr, but the agent's shell still combines them)") must not occur.
depends_on:
