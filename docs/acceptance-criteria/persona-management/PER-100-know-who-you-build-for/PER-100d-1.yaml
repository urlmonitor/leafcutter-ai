    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must use an injection channel compatible with the Agent Knowledge Plane (channel 2, 4, or 9)"
  - "Must complete persona directory scanning and summary generation in <500ms for up to 50 personas"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must not block agent spawn if the docs/personas/ directory does not exist"
  - "Summary must be concise enough to fit within 500 tokens of context"
delivers_to:
  agent: llm-expert
  contract: "Persona summary text block available for injection into agent context at spawn time; format: one line per persona with name and archetype"
expects_from:
