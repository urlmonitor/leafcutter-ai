  - "2026-08-25 [it-po]: technical enrichment. Required both real gate messages (declaration and test-proof) to be reproduced side by side from captured output rather than paraphrased, asserted the routing from the check's own failure text, and required both diff-scoping facts including the untouched-is-not-passed half. criteria untouched."
