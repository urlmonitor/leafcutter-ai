title: "A shared preparation is never handed to a test that writes to it, and never makes an assertion true by construction"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a group of tests that now obtain one preparation between them instead of one
    each,
  And the two ways this change can be wrong while every test still passes: a member
    that alters the shared artifact leaves the next member reading something no build
    produced, and a member whose assertion was previously independent now inspects a
    property the shared artifact carries regardless of the behaviour under test,
  And the specific shape the second failure takes here, which is not hypothetical:
    four tests that assert survival of a planted file, the content of a message, the
    agreement between a declared winner and a resolved one, and the agreement between
    winners on different platforms — three of which could be satisfied by a fixture
    that always produces the expected artifact,
  When a member of a group alters anything the shared preparation contains,
  Then it receives its own copy before the alteration, and the shared artifact the
    other members see is unchanged by it,
  And when the members of a group are run in any order, and when any single member is
    run alone, each member reaches the same verdict it reaches in every other
    arrangement,
  And for each member of a group, breaking only the property that member names turns
    that member red and leaves the other members of the group green,
  And a member that cannot be made red by breaking its own subject is reported as a
    failure of this change rather than accepted as a passing test.
