  ac_id: ACD-2100d-5
  contract: >-
    The start contract: Workflow('plan-feature', {userInput, workspace: <the maker's answer>})
    passes every check before triage with no verdict. This record extends it to the resume
    re-invocation, which also carries resumeFromRunId and args.resume_answer.
declared_files:
