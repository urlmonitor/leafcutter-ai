# 6 L2 children = 5 behavioral guards + 1 mandatory sequence-diagram doc AC
# (BP-1100f-6, required by documentation_triggers: [sequence-diagram]), not an
# extra behavior. Waiver approved during /plan-feature (BrainCandy, 2026-07-21).
child_limit_override: 6
roadmap_phase: phase_1
criteria: |
  A feature is done only when its real effect is proven, not because a step ran.

  When the pipeline hands a piece of work to an automated helper to make a real
  change, it confirms the change actually happened -- the real result exists and
  can be observed -- rather than treating "a step took place" as proof on its own.
  When a work item's stated intent (who is meant to do it and how it will be
  checked) contradicts the actual thing being changed, that contradiction is caught
  before the work begins, not discovered afterward. And a step that is supposed to
  produce a lasting result must carry a real, actionable instruction; an empty or
  content-free step is caught instead of quietly passing. Any project that installs
  leafcutter and runs build.py gets this the same way. This complements BP-1100e-1,
  which already flags source files changed but not declared; here the focus is
  proving the change's real result and its stated intent, not merely that a step
  occurred.
