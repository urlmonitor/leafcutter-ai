assigned_agent: python-coder
estimated_complexity: L
delivers_to: null
expects_from:
  ac_id: TQ-500f-3-i
  contract: "The one red-baseline reader, carrying the absence-only rule, callable with requirement ids and a test root."
it_requirements:
  - 'Wire the call into /build-feature''s per-ticket phase driver in templates/workflows-js/build-feature.js
    AND its declared twin templates/workflows-js/build-ticket.js (see the TWIN rule in the build-feature.js
    header): after the test-writer phase and before the first coder dispatch, never after commit.'
  - 'Invoke the same CLI the fast lane invokes (fast_lane.py verify_red_baseline) with the same
    inputs: the ticket''s source_ac id(s), the ticket worktree as test root, and the AC store
    root if TQ-500f-3-i adds one. Build the command with one shared constructor or template
    string so the two lanes cannot drift.'
  - The workflow must consume the reader's JSON verdict in control flow. gate_passed false halts
    the ticket with the reader's report, which names the test and the absence-only red, and
    dispatches no coder. The test writer's red_baseline_verified or sign-off claim is never
    a substitute.
  - 'Tickets WITH source_ac get the full shared reader, including every existing halt reason
    (e.g. no_new_covering_tests), exactly as in the fast lane (user decision; the regression
    risk is accepted). Tickets WITHOUT source_ac record the exact outcome ''red-baseline reader
    not applicable: no source requirement'' in the drive''s recorded outcome and continue to
    the coder. They are never recorded as verified, and red_baseline_verified from the writer
    is not promoted to verified.'
  - "Resume safety (amended 2026-10-06, F2): a resumed ticket reuses the reader's own recorded
    pass, without running the tests, only when all of these hold: the red_baseline_gate record
    exists and parses, its source_ac equals the source_ac the ticket carries now, and every
    recorded red (file, function) is still among the newly added covers-tagged tests. That last
    check is a subset check, because a later test-writer handoff may add tests. Making this
    decision must not run pytest. In every other case (no record, an unreadable or malformed
    record, a different source_ac, a recorded red test renamed or removed) the reader runs
    exactly as on the first drive, and its verdict decides. A test-writer red_baseline_verified
    or sign-off claim never stands in for the record."
  - 'Respect the E2 leaf invariant and ADR-006: no workflow() call from inside the workflow.
    Run the gate with a depth-1 executor agent, the same pattern fast-lane-ship.js uses.'
  - Edit only the templates/workflows-js/ sources. Deployed mirrors regenerate through build.py.
  - 'Out of scope, recorded as a gap: /build-epic dispatches ticket-supervisor (building-epics
    skill, prompt text), which this AC does not wire. That needs its own llm-expert AC.'
  - 'Record format: one ticket-frontmatter key, red_baseline_gate. Its value is a single-line
    flow mapping {"passed": true, "recorded_at": <ISO-8601 UTC timestamp>, "head": <the
    worktree HEAD sha>, "source_ac": [<the AC ids the reader ran for>], "red": [{"file":
    <repo-relative test path>, "function": <test name>}, ...]}. It is written only when the
    reader verdict is gate_passed true, and only by the heavy-lane gate: never by the test
    writer, never by the driver JS. After the write, the ticket must still pass the real
    ticket_frontmatter_guard and check-doc-frontmatter, with no change to, or exemption from,
    either gate. Document the key in templates/skills/ticket-authoring/SKILL.md in the same
    ticket.'
  - "Anchored atomic write: the record write inserts or replaces only the red_baseline_gate line
    inside the ticket's frontmatter block and leaves every other byte of the file unchanged.
    It is atomic, so an interrupted write leaves either the old file or the new one, never a
    partial ticket. It follows the same anchored-write rule mark_ac_done already meets
    (ACS-200f-3). A later write for the same ticket replaces the line instead of adding a
    second one."
  - "Unrecorded and reused passes are reported: if the record cannot be written (no --ticket, a
    missing or unreadable ticket, a write error) the pass still stands, the verdict carries
    recorded: false and a record_error naming the cause, and the drive's recorded outcome
    states that no record was written and why. A reused pass carries reused: true with the
    record's recorded_at and head, and the drive's outcome reports it as reused."
  - "--ticket <path>: the heavy-lane gate subcommand accepts the ticket path, and fast_lane.py
    passes it through. build-feature.js passes the worktree ticket path and build-ticket.js
    passes its ticket path. Both append it to the existing gate command line without adding
    lines to either twin."
  - "Interpreter: every red-baseline gate invocation in both lanes (build-feature.js,
    build-ticket.js and fast-lane-ship.js) starts with the same interpreter token, python,
    which every hook in templates/settings.json already uses. Do not use python3: on a Windows
    venv it resolves to a different interpreter, and every test errors. The verdict always
    carries interpreter, the reader's own sys.executable. Before running any test, the shared
    reader checks that pytest is importable by that interpreter. If it is not, the reader
    returns gate_passed false with reason test_interpreter_unusable, never a red-outcome
    reason, and the heavy-lane halt message prints the interpreter. set_ticket_status.py
    invocations are out of scope, because that script uses only the standard library. A
    configurable python_command key belongs in a separate ticket. Record in the changelog that
    a Linux host with no python on PATH now fails the gate, just as it already fails the hooks."
  - "Lane parity: the record and reuse logic lives only in the heavy-lane gate wrapper, never in
    the shared reader (verify_red_baseline), so whenever the reader runs, the two lanes give
    an identical verdict. The only keys allowed to differ are the wrapper-only keys (recorded,
    record_error, reused and the reuse provenance), which the seam test excludes from its
    comparison. The interpreter check and its reason live in the shared reader, so both lanes
    get them."
  - "green_at_baseline (F3, option A): the reader's verdict is unchanged and identical to the
    fast lane's for the same tests. The heavy-lane drive halts before the coder with
    classification green_at_baseline. The halt lists every newly added covering test that was
    green and says to set the coder phase not_needed with a comment naming the ticket or
    commit that delivered the behaviour. The drive never sets the coder phase itself
    (TKT-600b-4), and never lets the ticket reach the coder because its tests are green."
  - "Size ratchet: build-feature.js and build-ticket.js are over the 1000-line .js limit, and
    the check-file-size growth ratchet (GE-127b-1) refuses any commit that makes either longer.
    Lines starting with // count toward the limit. The JS changes here (the --ticket argument,
    the interpreter token, the halt text) must leave each file net-zero or shorter. The
    decision logic belongs in the Python gate."
test_spec:
  - name: test_build_feature_runs_red_baseline_reader_between_test_writer_and_coder
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js driven under unit_tests/_workflow_engine_harness.py
      (single-ticket target)
    description: The recorded dispatch sequence has a verify_red_baseline execution after the
      test-writer phase and before any python-coder dispatch, carrying the ticket's source_ac
      and worktree.
  - name: test_build_feature_halts_k1_before_coder_despite_writer_claiming_red
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: 'K1: the test writer returns red_baseline_verified true, and the gate executor
      returns gate_passed false with an absence refusal. No coder is dispatched, and the halt
      payload names the test and the absence-only red (must_block). K2: gate_passed true, and
      the coder is dispatched as today.'
  - name: test_heavy_and_fast_lane_invocations_yield_identical_verdict
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: seam
    description: The gate commands recorded from build-feature.js and fast-lane-ship.js, executed
      for real against the same fixture repo and AC store (K1 and K2), produce identical JSON
      verdicts.
  - name: test_build_ticket_twin_gates_coder_identically
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: deployed
    description: build-ticket.js, driven under the same harness with the K1/K2 responses, halts
      K1 before the coder and dispatches the coder for K2, so the twin cannot drift from build-feature.js.
  - name: test_build_feature_records_reader_not_applicable_for_ticket_without_source_ac
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: 'K3 (no source_ac): no verify_red_baseline execution is dispatched, the drive
      records ''red-baseline reader not applicable: no source requirement'', the coder is dispatched,
      and no recorded field marks the red baseline verified.'
  - name: test_gate_pass_writes_a_record_the_real_ticket_guards_accept
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Against the real git fixture (_tq500f3i_fixtures.py), a K2 pass writes exactly one red_baseline_gate line holding passed, recorded_at, head (the fixture HEAD sha), source_ac and red [{file, function}]. Every other byte of the ticket is unchanged, and the real ticket_frontmatter_guard.validate and check_doc_frontmatter accept the written ticket."
  - name: test_resume_reuses_the_recorded_pass_without_running_pytest
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "After the pass is recorded, the fixture's production code changes so the new tests pass, standing in for the coder's uncommitted work. Re-running the gate returns gate_passed true and reused: true with the record's recorded_at and head, and pytest is never invoked."
  - name: test_renamed_recorded_red_test_makes_the_reader_run
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "With a valid record, a recorded red test is renamed after coding. The gate does not reuse the record, the reader runs, and its verdict (all new tests green at baseline) decides, so the gate fails."
  - name: test_different_source_ac_makes_the_reader_run
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "A record made for a different source_ac than the one the ticket now carries is not reused. The reader runs and its verdict decides."
  - name: test_tests_added_after_the_record_do_not_block_reuse
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "A later test writer adds another covers-tagged test while every recorded red test is still present. The record is still reused, because the check is a subset check, not equality."
  - name: test_writer_red_claim_without_a_record_makes_the_reader_run
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "A ticket whose test-writer sign-off claims red_baseline_verified but which has no red_baseline_gate record runs the reader. The claim is never treated as a record, so K1's guarantee holds."
  - name: test_missing_ticket_passes_with_recorded_false
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "A K2 pass with --ticket naming a file that does not exist still passes, with recorded: false and a record_error naming the cause."
  - name: test_unimportable_pytest_yields_test_interpreter_unusable
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: failure
    description: "With pytest made unimportable for the reader's interpreter (find_spec patched), the reader returns gate_passed false with reason test_interpreter_unusable and runs no test."
  - name: test_real_verdict_carries_the_interpreter
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "A verdict from a real subprocess run of the gate carries interpreter, equal to the interpreter that ran it."
  - name: test_green_at_baseline_halts_before_the_coder_and_lists_the_green_tests
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "K4: the gate executor returns the reader's all-green verdict. Both twins (TWIN_DRIVERS) stop K4 before any coder dispatch with classification green_at_baseline. The halt lists every newly added covering test that was green and says to set the coder phase not_needed with a comment naming the delivering commit. The drive does not change the ticket's agents map."
  - name: test_reused_pass_dispatches_the_coder_and_reports_reuse
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "When the gate executor returns gate_passed true with reused: true, both twins dispatch the coder, and the drive's recorded outcome reports the pass as reused, naming recorded_at and head. A pass with recorded: false is reported with its record_error."
  - name: test_both_twins_gate_command_carries_the_ticket_path
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: reachability
    description: "The gate command recorded from build-feature.js and the one recorded from build-ticket.js each carry --ticket with that drive's ticket path."
  - name: test_all_lanes_start_the_gate_with_the_same_interpreter_token
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: seam
    description: "The gate commands recorded from both heavy-lane twins and from fast-lane-ship.js all start with the same interpreter token, python."
  - name: test_interpreter_unusable_halt_names_the_interpreter
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "When the gate executor returns reason test_interpreter_unusable, both twins halt before the coder, and the halt message prints the interpreter from the verdict."
test_rationale: 'A workflow gate is only proven by driving the workflow and asserting that
  its verdict is consumed in control flow (coder dispatched or not). A grep of the workflow
  source for the script name is forbidden by CLAUDE.md. The seam test executes the recorded
  commands for real, so ''same reader, same inputs'' is proven rather than asserted. The twin
  test uses the deployed angle''s slot: build-ticket.js is the second production surface the
  same change ships to. The record and reuse cases run the gate subcommand for real against
  the real git fixture and then run the real ticket guards over the written ticket, because a
  record the guards reject would break every later edit of that ticket. The interpreter cases
  compare the recorded commands of all three lane drivers, because one shared command form is
  the parity promise.'
