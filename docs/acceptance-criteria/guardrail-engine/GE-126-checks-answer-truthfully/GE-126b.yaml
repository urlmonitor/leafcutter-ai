criteria: |
  Every answer a check gives arrives with what it looked at.

  A run that examined nothing is told apart from a run that examined everything
  and found it clean — and the two reasons for examining nothing are told apart
  from each other too. Nothing a check can report leaves you guessing which of
  the three happened.
