it_requirements:
  - "This edge encodes the whole point of BP-1000b: the gate's pre-merge position is what converts a post-release discovery into a pre-merge block. Verify that the HALT (BP-1000b-2) is reached strictly before the PR-merge step for the KI-2 regression input, so no drifted pair can land on main."
  - "The verification must reproduce the KI-2 jscpd scenario specifically (source has the measured%/threshold% logic; templates/ copy does not) and confirm the gate HALTs before the PR-merge step rather than the divergence being left for a post-merge spot-check."
  - "Contrast with the historical EPIC-CodeQualityHooks behavior where the drift was found only post-merge — the test must assert there is no pass-through path that defers detection past the merge."
