id: BO-1100c-2
title: "Adding a new routing pattern requires only a single entry addition"
component: build-orchestration
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the routing configuration file contains 5 existing pattern entries,
  When a user or agent appends a 6th entry to the array with fields:
    - group: "architecture-docs"
    - path_pattern: "docs/architecture/**"
    - template: "docs(architecture): {summary}"
  Then the commit agent recognises the new entry on its next invocation,
  And no existing entries are modified, reordered, or invalidated by the addition,
  And no agent prompt file needs to be edited to activate the new pattern.
