title: "A claim with a command but an empty or placeholder result is flagged"
component: ticket-creation
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose motivating claim carries a reproduction command but whose observed
    result is empty or a placeholder (for example "TODO" or "see above"),
  When the premise-capture check runs before the ticket may leave the inbox,
  Then the check flags the ticket because the observed result is not a concrete captured
    output,
  And the violation states that the result is empty or a placeholder,
  And the ticket is not cleared to leave the inbox until a concrete result is captured.
