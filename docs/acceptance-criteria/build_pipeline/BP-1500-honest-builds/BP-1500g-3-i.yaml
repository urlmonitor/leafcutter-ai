id: BP-1500g-3-i
title: "The adopter's work is not kept safe by a rule that also stops the package's own content being brought up to date"
component: build-pipeline
components:
  - build_pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a project holding both an adopter-authored capability and a capability the
    package ships, and the package's own version of the capability it ships has
    changed since that project was last built,
  When that project is rebuilt with the ordinary everyday command,
  Then the copy of the package's capability in that project matches the package's
    current version of it,
  And the adopter's capability is present and unchanged by that same run,
  And the run does not need to be told which of the two is which by a list of
    names someone maintains, so a capability either party adds tomorrow gets the
    same treatment as the ones present today.
depends_on:
  - BP-1500g-3
