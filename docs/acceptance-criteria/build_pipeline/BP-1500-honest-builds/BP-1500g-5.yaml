notes: |
  SATISFIES THE reference-doc ENTRY IN BP-1500g's documentation_triggers.

  THE DUPLICATION RISK IS REAL AND IS FLAGGED RATHER THAN AVOIDED BY DROPPING
  THIS AC. BP-1500b-5 already requires reference documentation about what a sweep
  will and will not remove, and a careless implementation of either would produce
  most of the other. They were kept separate because they answer different
  questions about the same tree and become true at different times: BP-1500b-5
  describes a sweep that does not exist yet and is gated behind building it, while
  the boundary this AC describes is a property of the build as it stands today and
  is what an adopter needs in order to place their own work at all. Collapsing
  them would have put the adopter's answer behind the residue feature, which is
  the same sequencing mistake the L1 was split out of BP-1500b-4 to avoid.
  Whichever lands first should be cited by the second, not repeated.

  THE LAST CLAUSE IS THE FALSIFIABLE ONE and is the reason this is not a
  documentation-shaped restatement of BP-1500g-1. "Given any one thing in the
  tree, predict the outcome from the documentation alone" is checkable by handing
  a reader items they have not seen, including ones nobody thought about when the
  page was written. A page that lists categories without letting a reader classify
  a new item fails it.

  PRIORITY IS medium AGAINST THE L1's high, DELIBERATELY. The reference statement
  is what makes the guarantee durable; the how-to (BP-1500g-4) is what an adopter
  reaches for first and what unblocks them. Neither is the data-loss repair
  itself. Recorded so the deviation is visible rather than inherited by accident;
  adjust at approval.
