id: GE-124d-1
readiness: approved
priority: high
title: "A named path can be put on the warn tier, and every path that is not stays blocking"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124d.yaml"
criteria: |
  Given the warn list names the path `storefront-jsx/src/components/`
  And the staged set contains `storefront-jsx/src/components/CartSummary.jsx`,
    an in-scope screen component with no component-level declaration
  When the commit-tier declaration check runs
  Then the commit proceeds
  And a finding is still reported for that file with the verdict "warn" and the
    code "missing-component-declaration"
  And the finding states that the path is on the warn list and that every other
    path blocks

  Given the warn list is empty
  And the staged set contains an in-scope screen component with no
    component-level declaration
  When the commit-tier declaration check runs
  Then the commit is rejected with the verdict "block"

  Given the warn list names `storefront-jsx/src/components/`
  And the staged set contains `storefront-vue/src/pages/PlantListingPage.vue`
    with no component-level declaration
  When the commit-tier declaration check runs
  Then the commit is rejected with the verdict "block" for the Vue file
depends_on:
  - GE-124d
  - GE-124c-1
