  - path: scripts/ac_store/validate_ac_schema.py
    relationship: modifies
    status: exists
    relevance: "_validate_file must pass the file's raw text to the shared helper alongside the parsed dict; today it passes only the parsed dict."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    assigned_agent_quote_rule:
      type: object
      description: "Extension of the shared helper's signature: assigned_agent_field_errors(data, agent_ids, raw_text=None). When raw_text is supplied the helper additionally inspects the record's own `assigned_agent:` source line and refuses a scalar wrapped in a matched pair of literal quote characters, reporting {offending_value: str (verbatim, quotes included), suggested_value: str (the unwrapped form), file_path: str}. When raw_text is None the quote rule does not run and the helper says so rather than reporting a pass."
  reference_file_path: "scripts/ac_store/validate_ac_schema.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria"
  constraints:
    - "THE PARSED VALUE HAS NO QUOTES — THIS RULE MUST READ RAW SOURCE. Measured on this branch 2026-08-25: all 16 records spell the field with ordinary YAML double-quoting in the SOURCE line, and yaml.safe_load returns the bare name. A store-wide scan of PARSED values therefore finds exactly 24 refusable values (23 finalize-feature-workflow + 1 create-ticket), not 40 — the 16 are INVISIBLE to any parsed-value rule. Implement the quote check against the record's own assigned_agent source line and pass that raw text into the shared helper. An implementation that inspects only the parsed dict satisfies its unit tests and does nothing whatsoever to the real store."
    - "THE SAME RECORD YIELDS TWO DIFFERENT VALUES DEPENDING ON THE PARSER, AND BOTH MUST REFUSE. _ac_schema_validators.load_yaml_manual and the ImportError branch of load_yaml_from_string do value.strip() only — no unquoting — so with PyYAML absent the value carries the quote characters literally. With PyYAML present it does not. The helper must reach the identical refusal on both paths: refuse when the raw source scalar is quote-wrapped, AND refuse when the parsed value itself still carries leading or trailing quote characters. Covering only one path leaves exactly the drift this criterion's parent exists to close."
    - "REFUSE, NEVER NORMALISE — AND NEVER WRITE. The check reports; it does not edit. Do not add a strip-quotes call to any reader (generate_ticket_from_ac.py, the agent-card grouping, the fast lane), because the read site that gets missed fails open in the dispatcher. Repairing the 16 records is ACS-100i-11's job, applied by an author, not by the validator."
    - "The refusal message must show the offending value verbatim WITH its quote characters and name the unquoted form as the replacement. The parent's generic membership message is true, useless, and sends the author hunting for a missing agent — the value this criterion adds is the message, not the refusal."
    - "Handle the single-quote and mixed spellings too. The rule is 'the scalar is wrapped in a matched pair of literal quote characters', not 'the scalar starts with a double quote'. A rule keyed to the double-quote character alone would pass a single-quoted spelling on the manual-parse path."
    - "Do not couple this to the registry lookup. A quote-wrapped name that is ALSO unregistered — measured: 14 of the 23 finalize-feature-workflow records are quoted — must produce the quote message, not two messages and not the membership message alone. Order the checks so the quote verdict is reported first and is self-explanatory."
    - "Re-measure the 16 at the implementing commit. The counts drift as other work lands, and a test pinning 16 without re-measuring fails for the wrong reason — a test that fails for the wrong reason gets deleted."
delivers_to:
