work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an operator wants to build an AC,
  When they invoke the fast-lane build command with a single AC-id argument,
  Then that one argument is the only required input, and it triggers the full arc
    (resolve connected set -> worktree -> lean loop -> commit -> PR),
  And the command is a thin shim that dispatches the orchestration workflow with the
    AC id (mirroring the build-feature command -> workflow pattern),
  And the workflow is auto-discovered by the build so no manual registry entry is
    required for it.
