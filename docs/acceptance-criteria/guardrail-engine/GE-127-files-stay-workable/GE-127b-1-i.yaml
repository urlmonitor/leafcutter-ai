notes: |
  WHY THIS IS NOT PARANOIA. The ratchet introduces a population that did not exist
  before — a previous length per covered file — and a population that must be
  resolved is a population that can come back empty. This repository has shipped
  guards that exit 0 having examined nothing at least four times on this surface
  alone, and every one of them shipped the same shape: an error path that yields
  an empty collection rather than an unavailability signal. GE-127b-1 without this
  floor is the fifth.

  THE POSITIVE-COUNT FORM IS THE REQUIREMENT AND THE REFUSAL IS DERIVED FROM IT.
  "Refuses when it compared nothing" and "states how many it compared" are
  different requirements. The first is satisfiable by a guard on one code path;
  the second makes the empty state unrepresentable in the outcome, so a reader —
  human, agent, or a log being grepped — can tell a run that compared everything
  from a run that compared nothing without knowing which branch was taken.
  Implement the second and derive the first from it.

  THE THREE UNRESOLVABLE SITUATIONS MUST BE DISTINGUISHED BY NAME, NOT MERELY ALL
  REFUSE. They are: the previous-length source could not be reached at all; it was
  reached and what it returned could not be interpreted; it was established
  successfully and holds no covered file at all. Those are three different facts
  about the world and they demand three different responses — a broken
  environment, a source that resolves but carries content that cannot be read, and
  a genuinely empty history. Collapsing any of them into a shared message costs
  the reader the only information that separates them.

  A FOURTH STATE EXISTS, IS NOT AMONG THE THREE, AND MUST NEVER BE FOLDED IN: the
  source is established and populated, and the particular commit stages only newly
  added covered files, so there is nothing to compare on this run. That commit
  COMPLETES. It is the state this record originally conflated with the third, and
  keeping it visibly outside the refusing set is what keeps this record consistent
  with GE-127b-1's fourth arm. The distinction is between the SOURCE having nothing
  to compare against, which refuses, and a COMMIT having nothing to compare, which
  does not.

  NAMED MUTATION — MANDATORY, EXECUTE IT, DO NOT MERELY DESCRIBE IT. The clause
  beginning "in neither of those situations is any file reported as not having
  grown" asserts an absence, and on any implementation that reports nothing it is
  green on arrival — which is today's implementation exactly. MUTATION: make the
  previous-length lookup yield an empty collection on error rather than raising or
  returning an unavailability signal. That is the ordinary fail-open shape and the
  one all four cited precedents actually shipped. Under the injection every file
  compares against nothing, the run states zero files compared, and the commit
  completes; this clause must go RED, and it must fail BY THE COMMIT OUTCOME as
  well as by the text, then return to green on revert. Requiring failure by the
  outcome is deliberate: a check that prints a worried message and then lets the
  commit through is indistinguishable from a passing one to everything downstream
  of it.

  ASSERT THE STATED COUNT BY VARIATION, NEVER AGAINST A LITERAL. Vary the number
  of covered files staged between two runs and require the stated compared-count
  to move with it. A fixed expected number satisfies a stated-count requirement
  while proving nothing about what was examined — which is the same defect one
  level up, and is how every one of the cited precedents passed its own tests.

  EXERCISE THE UNAVAILABLE STATES FOR REAL. Make the lookup genuinely unavailable
  at run time — absent, unreadable, or present and not interpretable — and make
  the empty state genuinely empty. Never assert that an error branch is present in
  the source: a source assertion stays green on precisely the fail-open
  implementation this record exists to forbid.

  ONE SUMMARY, NOT TWO. Whatever the run states about how many files it compared
  belongs in the single outcome the author already reads. A second summary printed
  elsewhere lets one of them report a determinate run while the other reports an
  empty one, and the reader has no way to know which is authoritative.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
