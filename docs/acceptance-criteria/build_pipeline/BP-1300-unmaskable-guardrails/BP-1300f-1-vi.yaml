id: BP-1300f-1-vi
components:
  - build_pipeline
title: "The type check states what it inspected: a pass names its counts, a run with nothing to inspect says so, and a run that could not type-check never passes"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Scenario: A pass names what it checked
    Given a pull request that changes 1 Python file in scope carrying 2 type errors it
      inherited and adds none,
    When the check runs,
    Then it exits 0 with the summary line
      "mypy ratchet: 1 file, 0 new errors (2 existing errors untouched, 0 removed), 0 new type-ignores".

  Scenario: Nothing in scope is not a pass on content
    Given a pull request that changes only docs/notes.md and a Python file outside the
      job's pathspecs,
    When the check runs,
    Then it exits 0,
    And it states that it inspected 0 files and that no type check ran,
    And it prints no "0 new errors" summary.

  Scenario: A type checker that cannot finish is could-not-check, never a pass
    Given a pull request whose changed file has a syntax error, so mypy stops with
      exit status 2,
    When the check runs,
    Then it exits non-zero,
    And it states that it could not type-check and shows mypy's own output,
    And it prints no pass summary.

  Scenario: A missing type checker, or one that lists nothing, is could-not-check
    Given the interpreter that runs the check has no usable mypy, so
      "python -m mypy" answers "No module named mypy" with exit status 1,
      or a mypy that exits with status 1 without printing a single error line,
    When the check runs,
    Then it exits non-zero, states that it could not check, and prints no pass summary,
    And on a usable mypy its output names the mypy version it ran.

  Scenario: A base that cannot be resolved is could-not-check
    Given the base given to the check names no revision in the repository,
    When the check runs,
    Then it exits non-zero, states that it could not check and names the base.
