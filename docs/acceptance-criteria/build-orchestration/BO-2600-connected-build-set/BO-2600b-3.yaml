title: "How-to: what a fast-lane run picks up when you aim it at one criterion"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the fast lane resolves its build set with structural-parent prerequisites always
    excluded, and states the resolved scope in its run record before it builds,
  When an operator reads the fast-lane how-to to decide which criterion to aim a run at,
  Then the how-to states which work a run picks up for a given target — the target, the
    work beneath it, and its genuine prerequisites,
  And it states that sharing a parent is never on its own a reason for a criterion to be
    pulled into a run, and that an operator who wants a whole branch aims at the branch,
  And it points at where in the run's own record the resolved scope is stated, so an
    operator can confirm the scope of a run rather than infer it from what got built.
depends_on: [BO-2600b, BO-2600b-1, BO-2600b-2]
