  Cross-cutting portability invariant for every leafcutter guardrail (per BO and
  BP PROJECT_CONTEXT): the benefit must reach any installing project via build.py
  and must never rely on the leafcutter repo's own root CLAUDE.md (ADR-001).
  The BO-1600d L1 documentation_triggers [how-to, sequence-diagram] are satisfied
