readiness: approved
priority: high
title: "Entries in the documentation map appear in the same order on every operating system"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300b.yaml"
criteria: |
  Given the docs/retrospectives folder contains exactly these files:
    - EPIC-ACDrivenDevelopment.md
    - EPIC-AcPatternEnforcementIsMechanically.md
    - epic-lowercase-example.md
    - 2026-05-22-epic-antigravity-support.md
  And the files were created in a different order from their names' order
  When the documentation map is generated on a Windows host and, separately, on
    a Linux host from identical file contents
  Then the Retrospectives section lists the four entries in the same order on
    both hosts
  And that order is determined solely by the entries' paths under one fixed
    comparison rule stated in the map's generator documentation — not by the
    order the file system happens to return files, by file creation time, or by
    the host's locale or case-sensitivity setting
  And the same holds for the order of the sections themselves and the order of
    entries in every other section
depends_on:
  - KM-300b
doc_links:
  - path: docs/INDEX.md
    relationship: describes
    status: exists
  - path: scripts/generate_doc_index.py
    relationship: implements
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The fixed comparison rule is: case-sensitive Unicode code-point order over the forward-slash repo-relative path, compared segment by segment (the ordering a PurePosixPath gives on every host). Sorting host path objects directly is not acceptable, because Windows path objects compare case-insensitively"
  - "The rule must be stated in the generator's module docstring (the generator documentation the criteria refer to)"
  - "Section order must come from the generator's declared section list, never from file-system enumeration order"
  - "Must not depend on locale, file creation time or modification time"
  - "check-file-size ratchet: scripts/generate_doc_index.py is 480 lines against the 400-line .py limit (already over). The change must leave it no longer than at HEAD (net-zero or shrink). If new logic does not fit, extract it to a new module and add that module to every deploy list that already names generate_doc_index.py (scripts/build_deploy_manifest_helpers.py, scripts/build_phases_knowledge.py, scripts/build_phases_workflows.py) so the deployed transform-doc-index hook can still import it"
  - "Record the change in the generator's DECISION HISTORY with the AC id, per the doc-enforcer convention"
delivers_to:
  agent: python-coder
  contract: "Host-independent entry and section ordering; consumed by KM-300b-3's cross-OS byte-identity check"
expects_from: null
origin_agent: business-analyst
created: 2026-09-25
