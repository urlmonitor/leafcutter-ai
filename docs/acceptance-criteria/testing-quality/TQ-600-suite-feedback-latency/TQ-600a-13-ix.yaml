id: TQ-600a-13-ix
components:
  - testing_quality
title: "A hold check that could not read the run history fails and says so, rather than passing"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the check passes when it finds a fresh, green, settled post-merge run on main
    and an active workflow (TQ-600a-13-vi, -xiv),
  And that "found nothing wrong" and "could not look" can both end with no failure in
    hand, so a check that does not tell them apart passes every pull request whenever the
    read fails — the failure class this repository's guidance names three times, of a
    check that examined nothing looking like a check that found nothing,
  When the read of the workflow's state or of its run history is refused for lack of
    authorisation or permission, returns not-found, is rate-limited, returns a server
    error, times out, fails to connect, or returns a body that is not the expected shape,
  Then the check fails, and its output states that the post-merge run history could not
    be read and names the cause, in wording distinct from every other held state,
  And the check never passes on any of those outcomes,
  And when the verdict has been computed from a successful read but a later read on the
    held path fails — the notice issue, or the proof run of TQ-600a-13-xvi — the verdict
    is unchanged: a held pull request is still held, no exemption is granted, and the
    output notes what could not be read,
  And when the verdict has been computed but creating or editing the pull request comment
    of TQ-600a-13-vii, or recording an exemption on the notice, is refused, the verdict is
    unchanged: a held pull request still fails, a passing one still passes, and the output
    notes that the write could not be made,
  And a pull request from a fork receives the same verdict a pull request from the
    repository itself receives for the same run history,
  And a successful read of a fresh green run is a pass, so the check is not satisfied by
    failing on everything,
  And each outcome is demonstrated by executing the check against a double that returns
    it, never by inspecting the check's error handling.
