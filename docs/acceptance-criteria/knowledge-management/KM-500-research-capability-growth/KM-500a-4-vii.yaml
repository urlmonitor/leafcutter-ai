id: KM-500a-4-vii
title: S1 is scored per category against thresholds frozen before scoring, with every denominator shown
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given these S1 thresholds are fixed with the set before any scored run:
    explicit_known_operation: 100% of cases match deterministically, with 0 Jev calls beyond the deterministic validation
    injected_provider_failure, injected_denied and injected_budget_exhausted cases reported as missing_query: 0 allowed
    missing-query precision, over the cases the system reported as missing_query: at least 95%
    clarification recall, over missing_typed_input and ambiguous_population: at least 90%
    unnecessary clarification, over fully_specified_no_clarification: at most 10%
    selection accuracy, over one_suitable_query and several_plausible_one_correct: at least 90%
    selection_uncertain share, over one_suitable_query and several_plausible_one_correct: at most 10%
  When a run is scored
  Then the report gives each category's result as a numerator over a denominator, and each threshold verdict names the categories and the denominator it was computed over
  And selection_uncertain outcomes are counted in their own column, as neither correct nor wrong, and the selection result shows the accuracy over decided cases beside the selection_uncertain count and its share of the selection cases
  And a selection_uncertain share above 10% of the selection cases fails the selection threshold even when accuracy over decided cases is at least 90%
  And a single injected failure, denial or exhausted budget reported as missing_query fails that threshold whatever the other figures are
  And a threshold whose denominator is 0, for example missing-query precision when the system reported no missing_query at all, has the verdict not_run, never pass
  And a threshold changed after a scored run invalidates comparison with that run until the set and thresholds are fixed again
  And an explicit_known_operation case with even one extra Jev call fails that threshold although its selected operation is correct.
depends_on:
- KM-500a-4
- KM-500a-4-i
- KM-500a-4-ii
- KM-500a-4-iv
- KM-500a-4-v
- KM-500a-4-x
