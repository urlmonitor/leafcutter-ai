notes: |
  MEASURED BEFORE THE CHANGE (pytest 9.0.3, pytest-xdist 3.8.0, 2026-11-16). With outcome
  "xfailed" the masked test printed the progress letter F, the verbose word XFAILED, and
  the summary counted it as "1 xfailed" (pytest keys its stats by the outcome string). The
  exit status was unaffected and --maxfail did not count it (pytest counts only
  report.failed). But JUnit XML wrote it as a plain passing <testcase/> with no skipped
  element, and the suite's tests total was one short of the testcases it listed (tests="3"
  for four testcases, skipped="0"). xdist gave the same picture. The post-merge lane
  report recorded it as "passed".

  WHY THE GATES NEVER SAW IT. Every CI and post-merge pytest step sets AC_ENFORCE_STRICT=1,
  and done_proof, the kind reader, the fast lane and the wrong-version runner set it in
  their child environment, so masking never happens where a gate reads results. The wrong
  classification showed in local runs, in JUnit consumers and in anything reading flags.
