id: TQ-100a-1-i
title: "A test file importing a nonexistent module does not stop the other files"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100a.yaml
criteria: |
  Given a suite of three test files where the first file's top-level import
    statement names a module that does not exist anywhere on the import path,
    and the second and third files import only modules that do exist,
  When the suite is run with collection-error isolation enabled,
  Then the first file is reported as a single collection error
  And every test in the second and third files is collected and executed
  And the results of the second and third files are present in the run report
  And the run does not stop at the first file.
depends_on:
  - TQ-100a-1
