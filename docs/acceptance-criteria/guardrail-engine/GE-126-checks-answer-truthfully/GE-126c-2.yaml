notes: |
  THE MESSAGE IS A CRITERION AND NOT POLISH — the L1 says so and the reason is that the
  reader's next action depends entirely on which situation they are in. A message that
  reads as a setup problem sends them to fix their environment, which cannot work, and the
  workaround they land on is the one recorded in KI-CG-019: reading the parent record by
  hand rather than trusting either exit code.

  THE FULLY BUILT WORKSPACE IN THE GIVEN IS THE FENCE AGAINST GE-120b-1-i. That record's
  correct message names an unbuilt workspace. Running this criterion's arm in a built one
  makes the two mutually exclusive rather than merely different, so neither can be closed
  by the other and a reviewer can tell them apart mechanically.

  THE FOLLOW-THE-ROUTE CLAUSE IS WHAT BINDS THE MESSAGE TO REALITY. Any string assertion
  can be satisfied by a string. Requiring that the named route actually produces a verdict
  on the same record means the message has to name something that works.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

