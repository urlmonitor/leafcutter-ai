it_requirements:
  - "Keep generate_doc_index.py's contract (its categories carry the docs/ prefix; it takes the root that CONTAINS docs/). The build step passes the parent of the resolved docs_root folder, per KI-BP-016's review note option 1."
  - "When docs_root does not end in a folder named docs, keep the old scan root (the build target) and emit a warning naming the folder."
  - "The fail-safe is a skip with a warning and return 0, not a crash, so one bad scan does not abort the whole build."
  - "check-file-size ratchet: scripts/build.py is already over its limit, so the change must not grow its counted lines."
