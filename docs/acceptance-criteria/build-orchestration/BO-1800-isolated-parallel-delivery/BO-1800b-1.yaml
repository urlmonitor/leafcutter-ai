title: "The hub's main accepts changes only through a pull request; direct push, force-push, and branch deletion are rejected server-side"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800b.yaml"
criteria: |
  Given branch protection is configured on the hub (authoritative `origin`) `main`,
  When any client attempts to update `main` other than by merging a pull request,
  Then a direct `git push` to `main` is rejected by the hub,
  And a force-push to `main` is rejected by the hub,
  And deletion of the `main` branch is rejected by the hub,
  And the rejection happens at the source of truth (server-side), independently of
    whatever local hooks or tooling the client is running.
depends_on: [BO-1800b]
