  - "NO ADR REQUIRED: This is a message-only cosmetic fix to the BLE001 violation text — it does not change the enforcement scope, so no ADR is needed (unlike GE-108a and GE-108b)."
  - "DETECTION INVARIANCE: The change must touch only the human-readable BLE001 message string construction (the type-label rendering). The set of violations emitted, their codes, and their reported line/col must be byte-for-byte unchanged from before the fix."
  - "AST-ONLY: The tuple-rendering must read the caught types from the AST except-clause node — no regex over source text."
  - "The rendered tuple must preserve the order in which the caught types appear in the source `except` clause."
