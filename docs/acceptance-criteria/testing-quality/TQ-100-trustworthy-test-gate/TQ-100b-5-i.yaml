assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "BLOCK means block: a non-zero exit from the entry point, or the blocker recorded in the payload the caller actually acts on. A printed warning, a logged message, or an advisory line that leaves exit status 0 does not satisfy this AC. If the parity verdict is wired behind the commit_guardian test_ac_tag_enforcement key, which runs reader 2's check in warn mode today, the change must move the parity verdict onto a blocking path and name in the ticket which key gates it."
  - "The one-sided change must be applied to a REAL copy of a reader module and the check run as a process. Handing the comparator two fabricated result sets exercises the diff and leaves the readers themselves unproven — that is the fabricated-pair failure this AC exists to rule out."
  - "All three runs — agree then pass, one-sided then block, mirrored then pass — must go through the identical entry point over the identical tree, so the outcome difference is attributable to reader behaviour rather than to a different check being invoked. Recording the entry point invocation verbatim in the test is the cheapest way to make that auditable."
  - "Mutation must be confined to a temporary copy or temp checkout. The test must never leave the working tree, templates/, or the deployed layout modified, including on failure or on early abort — a reader left patched by a crashed test silently poisons every later run."
  - "The mirrored-change run must mirror into reader 2's SOURCE (templates/scripts/commit_guardian/check_test_ac_tags.py), not only its build.py-generated copy under scripts/. A third run that passes against a patched deployed copy passes for a reason the next build erases."
  - "The block message must name the diverging capture and which of the two readers changed its answer. 'Parity check failed' with no operand is not actionable and does not satisfy the criterion."
  - "The one-sided change used in the test must be a genuine recognition difference (accept a spelling the other rejects, or reject a shape the other accepts), not a cosmetic edit. A whitespace or comment change that leaves behaviour identical must NOT block — assert that too, or the guard is indistinguishable from a file-hash comparison."
test_spec:
  - name: test_agreeing_readers_pass_through_the_parity_entry_point
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Run 1 of 3. Invoke the parity check through its production entry point as a subprocess over the committed tree with both readers unmodified, and assert it passes with a zero exit status. Establishes the baseline the next two runs are measured against."
  - name: test_one_sided_reader_change_blocks_at_the_same_entry_point
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "Run 2 of 3, and the must_block negative control. Apply a genuine recognition change to a temp copy of ONE reader (reader 1 accepts a spelling reader 2 still rejects), leave the other untouched, and invoke the IDENTICAL entry point over the IDENTICAL tree as a subprocess. Assert a non-zero exit / blocker in the payload the caller acts on — a warning with exit 0 fails this entry. Also assert a cosmetic-only edit to the same reader does NOT block, so the guard is proven to key on behaviour rather than on file contents."
  - name: test_block_output_names_the_diverging_capture_and_the_reader_that_changed
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "On the blocking run, assert the emitted message names the captured value, the file, and which of the two readers accepted it. A bare 'parity check failed' fails this entry; so does a message that names a count instead of the operand."
  - name: test_mirroring_the_change_into_the_second_reader_source_restores_pass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "Run 3 of 3. Mirror the same recognition change into reader 2's SOURCE (templates/scripts/commit_guardian/check_test_ac_tags.py, rebuilt), rerun the identical entry point over the identical tree, and assert it passes again. Closes the three-run proof and pins the producer/consumer vocabulary re-alignment at the real seam — mirroring only the deployed copy under scripts/ must not be sufficient."
