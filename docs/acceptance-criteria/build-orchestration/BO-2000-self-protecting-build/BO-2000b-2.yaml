it_requirements:
  - "Add a standing rule to templates/agents/python-coder.md: dual-tree files (present in both the templates/ package source and a deployed location) are edited in the templates/ source copy and reconciled by direct comparison / edit-to-match, and are never regenerated by running a build over the active worktree to 'sync' them."
  - "Anchor the rule to ADR-001 (self-hosting boundary) so the rationale is traceable."
  - "Consider mirroring the same standing rule into the sibling coder templates (templates/agents/sql-coder.md, templates/agents/frontend-coder.md) if they also touch dual-tree files, so the convention does not drift per agent."
  - "Edit the templates/ source and keep the deployed .claude/agents/python-coder.md copy in parity per ADR-001 (build.py round-trip)."
