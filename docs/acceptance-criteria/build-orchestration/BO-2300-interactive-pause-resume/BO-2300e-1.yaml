id: BO-2300e-1
components:
  - build_orchestration
title: "A paused run's state survives process exit and is resumable later"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run has paused with a pending question and captured context,
  When the workflow process that was running it ends and is no longer active,
  Then the pending question, its context, and the run's place are still held in
    durable storage,
  And later, in a new process, submitting a valid answer for that run resumes it
    from the pause point,
  And the stages the run had committed before the process ended are carried
    forward and not redone.
depends_on: [BO-2300e]
assigned_agent: python-coder
estimated_complexity: L
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-017-dual-engine-workflow-support.md
    relationship: describes
    status: exists
  - path: docs/reference/workflow-authoring-contract.md
    relationship: describes
    status: exists
  - path: docs/reference/workflow-constraints.md
    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Durable, cross-process resumable pause state."
    properties:
      persisted: {type: boolean, description: "record survives the workflow process exiting"}
      run_id: {type: string}
      question: {type: object}
      context: {type: object}
      pause_point: {type: object, description: "resumeFromRunId marker"}
    required: [persisted, run_id, pause_point]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The pending-question record, its context snapshot, and the run's pause point must survive the workflow process exiting (durable on-disk/run-scoped store, not in-memory); a fresh process must be able to load it and resume."
    - "Resume in a new process must use the existing resumeFromRunId cache so committed prior stages are carried forward, not redone."
    - "Durable-store access is external I/O and must follow the project error-handling policy (typed except, WARNING+ log, no silent swallow)."
    - "E2 bans wall-clock/random in the workflow body (ADR-017): any staleness timestamp must be written into the record at pause or passed via args, never computed with Date.now() in the body."
    - "Deployed/template parity via the build.py round-trip (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "Durable, cross-process resumability: pending question, context, and pause_point held in durable storage after the workflow process ends; a new process supplying a valid answer resumes from pause_point with committed stages carried forward. Consumed by idempotency (BO-2300e-1-i), no-op-resume (BO-2300e-1-ii), and stale-pause (BO-2300e-1-iii)."
expects_from:
  ac_id: BO-2300a-1
  contract: "The pending-question record and its run-scoped durable store; this AC guarantees that record (question, context, pause_point) survives process exit and is loadable by a fresh process for resume."
test_spec:
  - name: test_pending_state_survives_process_exit
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "After the workflow process ends, the pending question, context, and pause point remain in durable storage."
  - name: test_new_process_resumes_from_pause_point
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "In a new process, submitting a valid answer for the run resumes it from the pause point."
  - name: test_committed_stages_carried_forward_across_process
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Stages committed before the process ended are carried forward and not redone on cross-process resume."
origin_agent: BrainCandy
created: 2026-07-20
amended_by: []
superseded_by: null
covered_by: [BO-2300e-1-i, BO-2300e-1-ii, BO-2300e-1-iii]
implemented_by: []
change_target: pipeline
risk_surface: internal
notes: |
  Durability means the pause outlives the workflow process; resume happens via
  the existing resumeFromRunId cache which already preserves committed prior
  stages. This is the reliability backbone for "come back minutes or hours later".
