id: TKT-300d
title: "Epics as goal containers"
component: ticket-creation
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given the v3 pipeline is in use,
  When an "epic" is referenced,
  Then it is treated as a goal container — a label applied to a set of related
    ACs for filtering, reporting, and roadmap alignment only
  And epics own no execution semantics: no supervisor dispatch, no ticket
    ordering, and no worktree creation
  And the L0 AC IS the epic goal statement; L1 ACs grouped under it ARE
    the epic's scope
  And the build-orchestration system dispatches work by AC dependency graph,
    not by epic membership
  And the old epic-supervisor dispatch model (read Master_Plan.md, batch
    tickets by depends_on) is deprecated for all v3-created work.
