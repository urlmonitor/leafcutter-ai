id: BO-400e-3-v
title: "The closure commit contains the closed records' own files and nothing else -- never a whole folder, and never another record's uncommitted edits"
component: build-orchestration
components:
  - build_orchestration
  - finalize
  - git_vcs_operations
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given finalization of "EPIC-Alpha" closed the ticket "alpha-02.md" and marked its source
      acceptance criterion "BO-9100a-2" done
    And the worktree also holds uncommitted edits to the ticket
      "tickets/00_inbox/epics/EPIC-Beta/beta-01.md" and to the acceptance criterion
      "BO-9200a-1", made by someone else and unrelated to the closure
  When finalization records its closure commit
  Then the commit contains exactly the files of "alpha-02.md" and "BO-9100a-2"
    And neither "beta-01.md" nor "BO-9200a-1" is in the commit
    And after the commit both of those files still carry their uncommitted edits, unstaged,
      exactly as they were before the run

  Given a closure in which a path outside the closed records -- a ticket or an acceptance
      criterion alike -- ends up among the files about to be committed
  When finalization checks the files before committing
  Then no closure commit is made
    And the run reports each out-of-set path by name
    And the run does not report the closure as completed
  Because whatever the closure commit carries is merged to main with the feature, so a commit
    that sweeps up a folder publishes other people's half-finished edits and false "done"
    states as if this feature had delivered them.
