criteria: |
  Given the reference material a developer reads to learn what the credential
    check looks for, which today lists the high-entropy rule among the rules that
    are applied and says nothing anywhere about that rule being switched off,
  When a reader wants to know whether there is anywhere the check looks less,
  Then the reference states that there is, names the four locations, and states
    that they are recognised as locations at the top of the project,
  And it states that a folder anywhere below the top that reuses one of those
    names is scanned in full,
  Because a reader who cannot find the exemption in the reference at all has no
    way to know it exists, and the reading they arrive at by default — that the
    listed rules are applied everywhere — is the one this L1 is making true only
    for reused names.

  Given the same reference,
  When a reader wants to know what "less scrutiny" removes at one of those four
    locations,
  Then the reference states that it removes the opaque-token rule only, and that
    the keyword and fixed-prefix rules still apply there,
  Because an author who believes a chosen location is unscanned will avoid
    putting anything in it, and one who believes it is fully scanned will trust a
    clean result it cannot give — both readings are available from a reference
    that mentions the exemption without bounding it.

  Given the same reference and the sibling criteria under GE-125b, GE-125c and
    GE-125d, each of which also changes what is true of when this check looks
    less,
  When all four have landed,
  Then a reader finds ONE passage describing when the check looks less, amended
    once per behaviour, rather than four descriptions in four places,
  And this criterion's contribution is an amendment to that passage rather than a
    document of its own,
  Because four separate accounts of one behaviour disagree with each other within
    a release, and the goal's own instruction is that the four triggers are
    discharged by a single consolidated rewrite.

  Given the reference as amended and the check as it actually behaves,
  When the two are compared,
  Then every statement the reference makes about where the check looks less is a
    statement the check bears out, and every place the check looks less is one
    the reference does not omit,
  And where the two disagree the check is authoritative and the disagreement is
    raised as a defect against the criterion that owns the behaviour, rather than
    written down as fact,
  Because a reference that overstates coverage produces exactly the false
    confidence this goal exists to remove, and one that understates it sends an
    author hunting for a protection they already have.
