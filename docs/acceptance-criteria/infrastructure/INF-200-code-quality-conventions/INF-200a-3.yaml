title: "No-print convention lives in the logging rule, not CLAUDE.md"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given the templates/rules/logging.md rule file (trigger: glob, globs: *.py),
  When an agent touches a .py file and the rule fires,
  Then the rule includes a section that states:
    - Never use bare print() for diagnostic output,
    - Use logger.debug() instead,
    - print() is only allowed in CLI entry points (main() or __main__ guard),
  And this convention is NOT duplicated in CLAUDE.md (CLAUDE.md may reference
    the rule but must not restate it),
  And the rule content is consistent with what check_no_print enforces.
