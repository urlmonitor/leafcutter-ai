it_requirements:
  - "The fast-lane phase order must list the deterministic proof-of-done gates as its completion arbiters: red-baseline verification and green+coverage verification (from BO-2400) plus the covers-tag linkage / done-proof check (from BO-2500a)."
  - "The gates must be positioned so completion cannot be signed off before all of them pass (they are the terminal arbiters of the fast lane)."
  - "These three gates are the whole of what establishes done-ness in the fast lane, and that is what makes BO-2500d-1's directional guarantee satisfiable: with nothing left for an LLM verdict to confer, the single reviewing agent's verdict can only withhold delivery. BO-2500d-1-i is the guard that rejects any later change removing one of these gates or letting a verdict substitute for one."
  - "Covering tests must EXECUTE the lane under unit_tests/_workflow_engine_harness.py (run_workflow_under_e2) and assert on the recorded mark-done dispatches with each gate stubbed failing in turn. A test that greps the workflow source for a gate name is not acceptable evidence — it passes on dead code, which is how this criterion has been green since 2026-07-21 against an orphaned runner (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
  - "The replacement tests must carry the SAME '# covers:' ids as the assertions they replace, so scripts/ac_store/done_proof.py sees no change in linkage."
delivers_to:
  agent: llm-expert
  contract: "The set of mechanical proof-of-done gates present in the fast-lane phase order, which is the whole of what establishes done-ness there — the premise BO-2500d-1's veto-only guarantee and BO-2500d-1-i's substitution guard both rest on."
expects_from:
  ac_id: BO-2500a-3
  contract: "The covers-tag linkage / done-proof eligibility check (BO-2500a) that, together with the BO-2400 red-baseline and green+coverage gates, forms the fast-lane completion arbiters."
test_required: true
test_spec:
  - name: test_each_mechanical_gate_alone_can_prevent_mark_done
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "For each of the three gates in turn, an executed harness run with that gate stubbed failing and the other two passing records no mark-done dispatch for the ACs it covers."
  - name: test_all_three_gates_passing_permits_mark_done
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "An executed harness run with all three gates stubbed passing records a mark-done dispatch for every AC in the resolved set."
  - name: test_mark_done_is_unreachable_without_reading_every_gate_result
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "On every executed path, the mark-done dispatch occurs only after all three gate results have been read, so a gate that is dispatched but whose result is never consumed cannot let a run through."
origin_agent: BrainCandy
