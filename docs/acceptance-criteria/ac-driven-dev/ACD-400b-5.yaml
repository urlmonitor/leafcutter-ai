id: ACD-400b-5
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Generator renders the ## Agent Contracts section for both single-mapping and list-shaped delivers_to/expects_from"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given a source AC id ACS-100a-1 whose delivers_to is a LIST of mappings
    (e.g. [{agent: python-coder, contract: "a wired ticket"},
           {agent: test-writer, contract: "a red test suite"}])
    and whose expects_from is a single mapping
    (e.g. {ac_id: ACD-400a, contract: "the AC is identified as ready"}),
  When the generator is invoked with --ac ACS-100a-1,
  Then generation completes successfully without raising an error,
  And the generated ticket body contains a "## Agent Contracts" section,
  And that section renders one entry per delivers_to list element, each entry
    naming its Agent and its Contract text (both list entries appear, not just one),
  And the single-mapping expects_from renders one entry naming its AC and Contract,
  And given a different source AC whose delivers_to is the legacy single-mapping
    form (e.g. {agent: python-coder, contract: "a wired ticket"}),
    when the generator is invoked for that AC,
    the "## Agent Contracts" section renders that one entry identically to the
    equivalent single-element list form (backward compatible).
depends_on: [ACD-400b, ACD-400b-1]
doc_links:
  - docs/reference/ac-schema.md
  - scripts/ac_store/generate_ticket_from_ac.py
  - unit_tests/test_generate_ticket_from_ac.py
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Generation must complete without raising for both the single-mapping (legacy) and the list-of-mappings shapes of delivers_to/expects_from."
  - "The single-mapping form and its equivalent single-element-list form must render byte-identical ## Agent Contracts output (backward compatible)."
  - "Shape normalization must be isolated in a pure, side-effect-free helper (_as_contract_entries) so it is independently unit-testable per the project error-handling policy."
delivers_to:
