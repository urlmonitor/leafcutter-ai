id: GE-124f-2
readiness: approved
priority: high
title: "Built page against approved design becomes a mechanical comparison, not a self-declared label"
component: guardrail-engine
components:
  - ux_prototyping
  - frontend_coding
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124f.yaml"
criteria: |
  Given a built page that realises the design `plant-listing`
  And the design's own rendered markup carries element pins for the criteria
    UXP-100d-2 and UXP-100d-3
  And the built page carries an element pin for UXP-100d-2 only
  When the built page is compared against the design
  Then the comparison reports UXP-100d-3 as present in the design and absent
    from the built page
  And the comparison names the design, the built page, and each criterion that
    differs

  Given a built page whose element pins match the design's element pins exactly
  When the built page is compared against the design
  Then the comparison reports no difference
  And the page's realisation label is derived from that comparison rather than
    from a value someone wrote by hand

  Given a built page whose realisation label was set by hand to "built"
  And the comparison finds criteria present in the design and absent from the
    page
  When the realisation label is resolved
  Then the derived result takes precedence over the hand-written value
