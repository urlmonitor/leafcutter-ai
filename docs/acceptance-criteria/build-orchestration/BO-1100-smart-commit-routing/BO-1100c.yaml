criteria: |
  A single configuration file lists all known routing patterns.

  Adding a new commit-message pattern is a one-line configuration edit, not a
  prompt rewrite. The file is human-readable, version-controlled, and the
  commit agent consults it on every invocation to determine which pattern
  applies to the current staged set.
