test_spec:
  - name: test_entry_point_proof_and_direct_import_proof_get_opposite_verdicts_in_one_run
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Executes the adversarial fixture pair — test P invoking main([...]) and test Q direct-importing with the entry point's name in a comment, a docstring and an uncalled helper — under the real observer, and asserts P is reached_through True and Q is reached_through False in the same assertion block."
  - name: test_verdict_is_unchanged_when_every_textual_mention_is_deleted
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Re-runs the observer over test Q with all three decoys stripped from the file and asserts a byte-identical ReachRecord — the property no text-based implementation can satisfy."
  - name: test_observer_that_records_nothing_reports_observation_unavailable
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "With the recorder disabled or unable to install, the observer returns observation_ok False rather than reached_through False, so an inert harness is reported instead of silently blocking every AC."
test_rationale: "This AC is entirely about the MECHANISM by which a fact is established, and every wrong mechanism produces a correct-looking predicate under direct-import testing: a substring scan, a comment-stripping scan and an import-graph scan all return the right answer for hand-fed inputs. Only executing the two real fixture tests under the real observer — and then re-executing test Q with the decoys deleted — distinguishes an execution-derived judgement from a text-derived one. The third test exists because the two silent failure modes of an observation harness (records nothing / records everything) are invisible to any test that asserts only the P-versus-Q verdict."
