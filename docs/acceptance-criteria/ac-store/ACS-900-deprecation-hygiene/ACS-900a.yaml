notes: |
  This is the DETECTION trigger half. The status-transition (active -> deprecated /
  superseded / superseded_by) is what arms the check; the targets to inspect are
  the paths in that AC's implemented_by list. BA: treat all three retired-status
  forms as triggers. "No longer references the retired behavior" is deliberately
  broader than "file deleted" — the BA/IT-PO define at L2/L3 what counts as the
  code being gone (file absent, anchor absent, or path no longer present), but
  ACS-900d owns the legitimate-reconciliation cases.
