id: GE-124g-2
readiness: approved
priority: high
title: "Passing the declaration gate never finishes a criterion, and never says it did"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124g.yaml"
criteria: |
  Given the criterion KM-ADM-004 is pinned on a rendered element and has no
    covering test
  When the reverse-direction declaration gate passes for it
  Then the criterion is still treated as unfinished by the done gate
  And no tool marks it finished on the strength of the declaration gate passing

  Given the same criterion
  When the reverse-direction declaration gate reports its pass
  Then the message says the criterion is declared and names where
  And the message does not describe the criterion as verified, covered, proven,
    tested or satisfied

  Given a criterion that is declared and untested, and a criterion that is
    tested and undeclared
  When each is assessed for whether it is finished
  Then both are unfinished, and each report names the specific obligation that
    is unmet

  Given any attempt to configure the declaration gate to satisfy, relax or stand
    in for the test-proof obligation
  When the configuration is loaded
  Then no such setting exists and the two obligations remain independent
