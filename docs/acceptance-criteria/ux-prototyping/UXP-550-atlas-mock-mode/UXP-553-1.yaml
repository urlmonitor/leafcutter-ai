id: UXP-553-1
readiness: draft
priority: medium
title: "An optional production lock forbids runtime overrides so a deployment can guarantee real data"
component: ux-prototyping
components:
  - ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a deployment that must guarantee real data and therefore sets the production lock
  LEAFCUTTER_MOCK_LOCK=real,
  When a request arrives carrying a runtime mock override (e.g. a leftover mock cookie or
  a ?mock=1 query-param from a prior mock session),
  Then the Atlas ignores the override and serves real data — no view renders fixture
  content and no mock badge is shown,
  And given an UNLOCKED deployment (LEAFCUTTER_MOCK_LOCK is unset — the dev/preview default),
  When the same runtime override arrives,
  Then the override is honored so the in-app toggle switches the session to mock,
  So the production lock is the explicit, opt-in way to forbid overrides, while unlocked
  deployments keep the in-app toggle working.
depends_on:
  - UXP-553
doc_links:
