notes: |
  PHASE B PLAN ITEM g-1 (request item 3). Structured on the Phase A precedent
  (TQ-500f-3-i rule / TQ-500f-3-ii wiring): the runner's rule and its two
  failure modes are their own L3s, and each route's wiring is its own L3, so a
  route can ship or fail on its own.

    -i    the runner's rule (which tests, which wrong versions, per-test
          answerability, put-back, verdict)                      python-coder
    -ii   a wrong version is caught only by a test that reached the code
          (an unloadable or no-op wrong version never counts)    python-coder
    -iii  the code is put back exactly even when a run is cut short
                                                                 python-coder
    -iv   named wrong versions are turned into concrete alterations
          (agent conduct, PROMPT-ONLY)                           llm-expert
    -v    fast-lane wiring                                       python-coder
    -vi   /build-feature and its build-ticket.js twin wiring     python-coder
    -vii  /build-epic wiring (ticket-supervisor / building-epics, PROMPT-ONLY)
          — may be built together with TQ-500f-3-iv          llm-expert
    -viii /build-epic mechanical backstop: no commit without both gate
          verdicts on record (user decision Q3)              python-coder

  BUILD ORDER: TQ-500g-4 first (depends_on). The runner reuses, never forks:
  the shared pytest outcome reading (TQ-500g-4), the kind-of-red rule of the
  red-baseline reader (TQ-500f-3-i: fast_lane.py verify_red_baseline,
  done_proof_kind_support, _kind_plugin), and done_proof's fail-closed outcome
  classifier.

  SCOPE, DECLARED NOT INFERRED (TQ-500 non-goal): only tests whose AC test_spec
  entry carries must_catch or angle: discrimination. Wrong-version runs are slow
  on database-backed suites, so every test is never in scope.

  NOT RE-SPECIFIED HERE: per-test, per-wrong-version outcomes (TQ-500c); a run
  that was owed and never taken reads as incomplete (TQ-500b); what was broken
  and what each test did is kept with the work (TQ-500e).

  "THE FIX UNDONE" is the changed files as they stood before the work began
  (the merge base the route already uses for its red baseline). It is prepared
  mechanically, never by an agent.

  PLACEMENT: after the green-and-coverage check, before commit. Never after
  commit (test-angles.md records post-commit gates as a known process failure).

  PHASE C (agent-proposed wrong versions beyond the named ones) stays deferred
  in TQ-500g's notes.
