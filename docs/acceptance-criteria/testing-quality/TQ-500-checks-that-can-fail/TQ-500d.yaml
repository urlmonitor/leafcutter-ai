notes: |
  The sharpest part of the recorded defect is not that a check is absent — it is
  that its absence is currently documented as correct. Everyone who followed the
  written rule behaved properly and none of them had reason to ask the next
  question. Until the guidance stops asserting the inverse, every other part of
  this goal is advice competing with a rule.
