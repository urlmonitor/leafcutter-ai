change_target: pipeline
risk_surface: internal
notes: |
  THIS EXISTS TO KEEP TKT-600b-4 IMPLEMENTABLE. Read alone, "the drive never edits the
  phase record" forbids sign-offs too, and sign-offs are the record's whole purpose. An
  implementer facing that contradiction would either weaken the prohibition until it
  stopped biting or freeze the record entirely and break every drive. Neither is
  intended.

  THE LINE IS AUTHORSHIP, NOT WHETHER A WRITE OCCURRED. A phase that ran recording its
  own outcome is the record doing its job: the party that did the work says so, and the
  completion gate later reads that testimony. The drive recording an outcome on behalf
  of a phase it chose not to run is the record being made to agree with the drive, which
  is the thing TKT-600b-4 excludes. Same file, same field, opposite meanings.

  DELIBERATELY SILENT ON RE-DISPATCH. Whether a phase re-dispatched after a failure must
  write a fresh entry is not decided here. It is the subject of KI-BO-20260831-1931 (a
  phase that returned ok and wrote no comment left an earlier failing comment as the
  newest, blocking every future run), and that record's fix direction — which of two
  in-file sources is authoritative for completeness — must be settled before this can be
  stated without pre-empting it. Left for the IT PO to note as a sequencing dependency
  rather than resolved here.
