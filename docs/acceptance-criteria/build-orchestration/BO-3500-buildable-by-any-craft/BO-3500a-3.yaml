id: BO-3500a-3
components:
  - build_orchestration
  - agent_registry
title: "A craft that exists but is absent from this run is reported as a capability gap, judged against the run's own crafts"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a not-yet-done requirement whose declared producing craft is one this project
    has, and a run whose available crafts do not include it,
  When the run resolves a build set containing that requirement,
  Then the run stops before any craft is dispatched,
  And it reports a capability gap, naming the requirement, the craft it declares, and
    the fact that this run has no place for that craft,
  And the report says the requirement is correct and the automation is behind — it does
    not suggest the requirement is wrong or should be edited.

  Given the same requirement,
  When it is built by a run whose available crafts do include the craft it declares,
  Then the run proceeds and no capability-gap report is produced,
  And this holds without the requirement being edited and without any list of refused
    crafts being edited — the verdict is read from the crafts the run actually has, so
    adding a craft to a run makes the requirements that declare it build, by itself.

  Given a run and any craft this project has,
  When an operator asks what that run can produce,
  Then the crafts the run can dispatch are readable from the run itself, so an operator
    can tell before starting whether a capability gap is coming.
depends_on: [BO-3500a]
doc_links:
