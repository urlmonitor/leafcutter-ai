notes: |
  ABSENCE OF EVIDENCE IS NOT SUCCESS, at the scale of the whole run. This is the
  clause that makes BO-3600e-1's counts consequential: counting how many records
  were examined is only useful if a shortfall changes the verdict.

  The third scenario is the one an implementation will get wrong first. Examining
  most of the store and finding nothing feels like a clean result and is not one —
  the eight records behind this goal were exactly the kind of long-untouched records
  a partial pass tends to miss.

  The fourth scenario separates a failed run from a successful empty one, which are
  identical from the outside unless one of them says so.
