notes: |
  WHY ACTIONABILITY IS A SEPARATE GUARANTEE AND NOT POLISH. This standard is
  unusual among the project's gates: the correct fix for being stopped is sometimes
  not available to the person being stopped. If no requirement covers what the test
  proves, the author cannot declare one honestly, and the two remaining moves are
  both bad — invent a name, which GE-128c refuses, or switch the rule off, which is
  how every dormant gate in this component became dormant. A refusal that leaves
  only those two options manufactures its own circumvention.

  THE THIRD OPTION MUST BE POINTED AT, AND ITS HONESTY MATTERS MORE THAN ITS
  CONVENIENCE. Authoring a requirement is a real path in this project and the
  refusal should name it. What it must NOT do is claim to start that path on the
  author's behalf unless it genuinely does. This component has already shipped one
  gate documented as dispatching an authoring agent that does nothing of the kind,
  with a placeholder standing in for the promised behaviour — and the damage there
  was not the missing feature, it was that people believed they were covered. Point
  at the path, or do it; never describe doing it.

  THREE DISTINCT MESSAGES, AND FLATTENING THEM LOSES THE VALUE:
    - No declaration at all. Next step: declare the requirement this test proves.
    - A declaration naming something that does not exist. Next step: correct the
      name, or author the requirement — and note the name may be a typo, which is
      the common case and the cheapest to fix if the message shows what was read.
    - A declaration naming a retired requirement. Next step is GE-128d's and is
      emphatically not "delete the declaration"; the message must not suggest it.

  MANDATORY NEGATIVE ARM. Every positive reading is satisfied by a message that
  prints all three explanations every time. Assert that the refusal names the
  specific test, and that the explanation given matches which of the three
  conditions actually occurred — a message that is always right because it says
  everything is not actionable, it is noise.
