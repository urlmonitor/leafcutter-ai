id: UXP-300-2
title: Example claims are checked at the strength of their declared evidence
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a contract example is labeled full or projection and observed, illustrative or reconstructed,

  When the Product Truth record is checked,

  Then a full example is checked as a complete contract value and a projection still obeys its selected
  fields'' type, enum and unknown-field constraints,

  And an observed example resolves an existing JSON receipt and matches the claimed value or selected
  fields with JSON scalar types preserved,

  And the complete receipt and any declared applied payload are checked even when the displayed example
  is a projection,

  And an invented observed value, invalid full value or invalid projected field is rejected,

  And full runtime-model examples obey model validation while projection validation is not represented
  as proof of every runtime invariant.'
depends_on:
- UXP-300
