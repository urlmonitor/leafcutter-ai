notes: |
  PRODUCTION BEHAVIOUR IS PART OF THIS L1, NOT AN AFTERTHOUGHT — the PO's
  reasoning is that if stripping is left unspecified, the first performance
  review deletes the attribute wholesale instead.

  The retention half is the load-bearing half and is easy to lose. GE-124f-3
  derives a Playwright / Testing-Library selector from this attribute; a
  transform that strips it in the TEST build would break every such selector
  while leaving production correct, so the failure would surface as flaky,
  unexplained test breakage rather than as a configuration mistake.

  "Configured in one place" is stated because two independent strip lists drift
  — the same reason GE-111, GE-117 and GE-124 share one AC-id resolver.

  IT-PO ENRICHMENT NOTE (2026-08-25), two facts verified in the working tree.
  (1) leafcutter-web/next.config.mjs contains `const nextConfig = {}` and
  nothing else — there is no existing data-testid strip to extend, so the
  criteria's "the same transform that already strips data-testid" is the target
  state and this AC builds it. (2) leafcutter-web is the only front-end
  application in the repository; storefront-vue, storefront-svelte and
  storefront-jsx appear only in the mock-data artifact. Since Next.js
  reactRemoveProperties is React-only, "one place" is achievable today and would
  need a per-framework equivalent the day a Vue or Svelte app lands. That gap is
  routed to GE-124b-5's reference doc rather than left implicit.
