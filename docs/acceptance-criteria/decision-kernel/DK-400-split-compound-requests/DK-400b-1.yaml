notes: |
  The user's "(and other things)": the split is not tied to goals. DK-400b notes: a research
  request split this way runs research children only. What happens to a host proposal that names
  decision for a part of a research request (refuse and repair, like any malformed host answer,
  or re-label) is for the IT PO.
  IT PO (2026-10-05): settled a decision part in a research request (BA open point 6): the host's
  answer is refused and repaired like any malformed host answer; the kernel never re-labels a part's
  capability.
