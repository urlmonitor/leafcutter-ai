id: DK-300a-2-i
title: "A precedent alone never counts as grounding"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a decision goal whose precedent step has already added the published record
    dec-ef8ddcb79d668a67 as prior_decisions evidence (applicability 0.62),
  And no repository evidence has been retrieved for the goal yet,
  When the kernel decides whether grounding research is needed,
  Then grounding research runs against the repository,
  And the precedent is not counted as grounding evidence,
  And the evidence handed to Claude Code for proposing options includes repository items, not only
    the precedent.
