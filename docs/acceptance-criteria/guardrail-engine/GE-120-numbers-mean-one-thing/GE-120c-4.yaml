notes: |
  Satisfies GE-120c's documentation_triggers: [sequence-diagram]. The L1 names both reasons for
  the trigger: three participants, and a flow that differs by stage.

  THE ASYMMETRY IS THE CONTENT. A diagram that shows the specialist at all three stages would be
  a drawing of the thing this tree exists to prevent. Requiring the reason to appear ON the
  diagram is what stops a later reader "fixing" the apparent inconsistency by adding the missing
  arrows.

  THE NUMBERED-AND-PLACED CLAUSE is deliberate: this tree adds a diagram to the very location
  whose unnumbered population motivated GE-120b. Producing an unnumbered one here would be a
  small but perfect failure.
