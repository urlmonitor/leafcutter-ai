    detail: "Criteria untouched. Assigned python-coder at S. Authored six it_requirements. The first records what the code actually does today rather than assuming it: the findings report in check_secrets.py is written by bare print() with no file= argument and therefore goes to stdout; the only existing stderr write in that file is the git-listing WARNING; and the scanner already sends allowlist-parse warnings to stderr with a docstring stating 'never stdout'. The convention this record adopts therefore already exists. Added the requirement that the pre-change and post-change output streams diff empty over identical input, so 'does not renegotiate the existing stream' is checkable rather than aspirational, and the requirement that every covering test capture the two streams separately, because a merged capture is what makes this arm silently droppable. Authored a five-entry test_spec plus test_rationale, including one deployed-layout entry for the build.py round trip. GE-113c-3-v and GE-123d-5 are cited as doc_links and in prose only: no depends_on edge crosses into the GE-113 or GE-123 trees and no file in either was edited. readiness draft->reviewed; work_status and priority untouched."
