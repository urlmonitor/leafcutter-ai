id: BO-2400f-7-vii
components:
  - build_orchestration
title: "A command step whose reply carries no exit status and is not a decline ends as 'state unknown', never as declined or never attempted"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run asks the command-step-runner to perform one of its command steps,
  When the reply carries no exit status and is not a decline — it is an unfinished reply
    (BO-2400f-7-v), a reply saying the command was moved to the background, an empty reply,
    or text that is not one of the runner's reply shapes,
  Then the run halts at that step as "state unknown", a halt kind distinct from a declined
    step, a command that ran and failed, a held claim and a gate failure,
  And the halt names the step and the agent asked, and quotes what came back or says that
    nothing came back,
  And the halt says the command may have run and that what it changed is not known,
  And the halt does not say the step was declined or never attempted, and does not say the
    set is held by another run.

  Given the reply is a decline — it says declined, names the step, the agent and a reason,
    and carries no exit status (BO-2400a-1-i),
  When the run reads it,
  Then the run halts as a declined step (BO-2400f-5-iii), not as state unknown.

  Given the claim-step reply observed on 2026-11-16 — the runner's one shell call passed
    120 seconds, was moved to the background, and the runner replied without an exit status
    and ended its turn,
  When that reply is given to the run at the claim step,
  Then the run halts as "state unknown" at the claim step,
  And the claim is reconciled as BO-2400f-10-iv requires rather than taken as never made.

  Given a release step whose reply is "state unknown",
  When the run reports the release,
  Then every acceptance criterion the run claimed is reported as not confirmed released and
    possibly left at in_progress, as BO-2400f-10-ii's fail-closed reading requires,
  And the release is not reported as declined.
depends_on: [BO-2400f-7, BO-2400f-5-iii, BO-2400f-7-v]
