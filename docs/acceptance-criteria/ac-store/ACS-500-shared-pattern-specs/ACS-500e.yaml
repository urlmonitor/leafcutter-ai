work_status: todo
criteria: |
  Atomic components compose into named composites, all reflected in the store.

  The AC hierarchy captures how atomic components (a sortable table, a filter
  bar, a detail card) wire together into composite patterns when connected to
  a specific data shape. Composites are themselves reusable components —
  available for further composition or direct reference by consuming pages.
  The layering from atomic to composite to page-specific is visible in the
  AC parent-child structure.
