criteria: |
  Given the project configuration declares a test location of "tests/"
    (test_root: "tests/" in skills_config.json),
  When an agent that produces a test file resolves where that test must go,
  Then the resolved base location is "tests/" taken from the configuration,
  And the resolution does not fall back to any value baked into the agent itself.
