id: BP-1300e-2
components:
  - precommit_hooks
  - commit_guardian
title: "Nothing the package shows a contributor claims a commit-time lint check that differs from the one that actually runs"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario: The edit-time hook's missing-linter message points at a check that exists
    Given the edit-time exception hook is run on a Python file while the linter
      is not installed,
    When it emits its not-installed message,
    Then any commit-time lint check the message names is one that runs on an
      ordinary commit, with the rule set the message attributes to it,
    And the message no longer states that violations "will still be caught at
      commit time" by a check that does not cover them.

  Scenario: The hook configuration describes the lint rules where they really live
    Given the exception-handling section of the commit-guardian configuration,
    When its explanatory text is read,
    Then it names the lint configuration file the repository actually has, and
      not a file that does not exist,
    And it attributes to that file only the rules that file actually selects,
    And no key in that section lists lint rules unless something reads that key
      to decide what is checked.

  Scenario: A claim that drifts from what runs is caught
    Given one of the texts above is edited to claim a commit-time lint rule that
      neither the declared rule set nor the commit-time check applies,
    When that edit is committed,
    Then the commit is refused, naming the text and the rule it claims that is not
      applied.

  Scenario: The edit-time hook's behaviour is unchanged
    Given the edit-time exception hook is run on a file with a bare `except:` and
      separately on a clean file, with the linter installed,
    When it runs,
    Then it refuses the first and allows the second exactly as before,
    Because this record changes what the package SAYS, not what the edit-time
      hook detects (GE-108d and GE-108e own that hook's behaviour).
