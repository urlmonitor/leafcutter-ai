readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader deciding whether a fault entry can be closed,
  When they open the state diagram for a fault entry's lifecycle,
  Then it shows each state an entry can be in, including open, open with an
    ambiguity recorded, and retired,
    And it shows the transition into retired as requiring evidence that the entry's
      subject was delivered,
    And it shows no transition into retired that does not carry that evidence.

  Given the diagram,
  When it is compared against the states real entries occupy and the transitions
    they actually make,
  Then every state the diagram shows is one a real entry occupies,
    And every transition a real entry makes appears in the diagram.

  Given the diagram,
  When a reader looks for a transition that changes a requirement record,
  Then the diagram shows none,
  So the picture cannot be read as one in which retiring an entry also demotes or
    finishes a requirement.

  Given the diagram,
  When a reader looks for what happens to an entry's text on retirement,
  Then the diagram shows the text preserved in the retired state,
  So retirement is documented as a change of state and never as a removal.
