id: TQ-200c-1
title: "Ticket prioritization, including parked-ticket handling, is covered by tests"
component: testing-quality
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a set of tickets with depends_on relationships where some predecessors
    are not yet done,
  When prioritize ranks the tickets,
  Then only tickets whose dependencies are all satisfied appear in the ready set,
    and blocked tickets are excluded.

  Given several ready tickets with differing priority values,
  When prioritize ranks them,
  Then the returned order is sorted with the highest-priority ticket first.

  Given a ticket whose frontmatter status marks it as parked,
  When prioritize builds the ready set,
  Then the parked ticket is excluded from the ready set even if all of its
    dependencies are satisfied.

  Given a set of tickets containing a dependency cycle,
  When prioritize processes them,
  Then it reports the cycle and identifies the tickets involved rather than
    surfacing an arbitrary ticket as ready.
