notes: |
  Anti-duplication / scoping AC. cross_reference_audit.py BACKFILLS implemented_by
  but does NOT detect stale code behind a retired AC. The new hook reuses its
  traceability-resolution logic (the AC<->source mapping in _load_ac_yamls and
  the implemented_by reads) and adds the missing detection-at-commit-time half.
  Detection must not duplicate or invoke backfill.

  IT-PO enrichment (2026-06-22): inspected cross_reference_audit.py. The reusable
  unit is _load_ac_yamls (AC dict load + implemented_by read); it currently lives
  inline with CLI/backfill code, so the it_requirement mandates EXTRACTING it into
  an importable shared module (not import-from-CLI, not copy-paste) with a no-regression
  guarantee on the audit script. Added a delivers_to contract naming the extracted
  helper. NOTE the audit script's implemented_by usage is ticket-path-oriented and
  never checks SOURCE-file existence — so the source-presence + #anchor logic is
  genuinely new and correctly NOT a duplication. See caveats in the run summary about
  the extraction surface being a coder decision.
