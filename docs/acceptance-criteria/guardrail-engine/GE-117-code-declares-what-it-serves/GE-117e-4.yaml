criteria: |
  Given a reader wants to understand how a developer recovers from a declaration
    block
  When the reader opens the sequence diagram for the escape-hatch flow
  Then the diagram shows the guardrail returning a block with the offending items
  And the diagram shows the autofix path: the developer invoking the autofix, the
    autofix resolving a component from the component registry or an AC from commit
    context, inserting the declaration, and the guardrail re-checking to a pass
  And the diagram shows the autofix prompting the developer when inference is
    ambiguous
  And the diagram shows the deliberate opt-out path: the developer adding a
    reason-bearing per-item marker and the guardrail proceeding for that item
