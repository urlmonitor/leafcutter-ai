it_requirements:
- Chosen mechanism is deterministic typed candidate eligibility before the existing finite Jev operation-selection
  judgment; reuse current LangGraph/kernel retrieval without a new planner, classifier, decision tree or retry loop.
- Use eligible, unknown and incompatible fit distinctions; exclude only authoritative contradictions in requested
  versus returned population, kind or anchor role. Missing metadata stays unknown. Hydratable source fields and
  possible truncation are not incompatibility proofs.
- For returned_entities with original exact IDs, unequal population labels or an indirect route alone are not disjointness
  proof. Native self endpoints and admitted saved round trips with possible identity overlap remain unknown/offered;
  Jev chooses suitability and actual answer assessment checks all original obligations.
- Explicit named populations still require matching population identity and completeness metadata. Possible ID overlap
  cannot promote a saved endpoint or dependency read to an exhaustive hierarchy answer; retain disjoint result-kind
  exclusions and unknown-kind conservatism.
- Builtin facts must match actual operation contracts. Saved descriptor prose, supported-question text and result
  descriptions are not authoritative population/completeness metadata; retained saved choices keep immutable version/digest.
- Keep selected-operation probability 0.80 and decision confidence 0.50. A nonempty set receives one existing operation-selection
  judgment; any distinct target or answerability judgment is separate. Do not force the sole candidate.
- All candidates proved incompatible yields ordinary unsupported with no paid operation-selection call, graph query,
  requests or new bundle assessment. Do not synthesize unsupported_population because this local candidate set is
  empty.
- Confidence refusal preserves RetrievalChoice.operation=uncertain, knowledge_selection=uncertain, partial/unavailable
  coverage and paid usage; selection_uncertain is a knowledge_status diagnostic only. No unresolved assessments,
  human requests, retries or build handoffs.
- Feed actual ordinary-unsupported and uncertain results through sibling merge, guard and resumed research tests.
  Established unsupported_population assessments retain their completeness guard; no global relaxation of assessment
  merge/guard.
- GraphOffer has positional consumers with five and seven arguments. Any metadata is additive and defaulted without
  changing existing field order, original arguments, or public selector/result signatures.
- Fit facts count toward the existing pre-call serialized payload budget before charging Jev. Preserve full original
  question, identities, fields, source/revision/read roots, immutable catalog identity and cumulative usage rather
  than trimming obligations.
- Initial selected-query execution and later existing progressive disclosure are distinct phases. A retained relation
  or saved query may return partial evidence at disclosure0 before get_entities hydrates the same requested facts
  at disclosure3; verify original requirements, IDs, source locators and budgets across both phases. Do not require
  every subsequent read to use the initial operation or claim discovery already disclosed source content.
- Use actual KernelService public research and retrieve.repository wiring. Descriptor admission, explicit-operation
  validation, read authority, original-target obligations and disclosure boundaries stay intact.
- Missing-user-meaning clarification, source-capability limits, provider failures and empty successful retrieval
  remain distinguishable. Controlled dispatch proves neither live-provider quality nor complete counts.
