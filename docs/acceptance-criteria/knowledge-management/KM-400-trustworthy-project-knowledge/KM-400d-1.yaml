criteria: |
  Given an entity with title, declared relationships, approved summary and canonical text
  When it is requested successively at disclosure levels zero, one, two and three
  Then discovery returns compact identity, title and minimal provenance
  And structure adds only bounded relationships
  And explanation adds the approved summary and correction context
  And source adds only the selected bounded excerpt
  And each response retains the same entity revision and source identity
