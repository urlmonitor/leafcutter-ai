id: ACS-100i-11
components:
  - ac_store
title: "The 24 records the new rule would refuse are corrected in the same change that introduces the rule, and before it"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the 24 records the producer-name rule would refuse — every one of them
    naming something that is not an agent at all: 23 reading
    `finalize-feature-workflow`, which is a workflow script, and 1 reading
    `create-ticket`, a slash command retired by ADR-012,
  When the correction is applied,
  Then each of those 24 records is written to disk carrying a producer that the
    agent registry lists, chosen to match the surface that record changes,
  And no other record's producer value is written at all — in particular the 16
    records whose producer is written with surrounding quote characters are NOT
    rewritten, because their parsed value is already a registered agent name and
    changing them would be a cosmetic edit dressed as a correction.

  And given the corrected store,
  When every record in it is validated in one pass,
  Then no record is refused for naming a producer the registry does not list,
    and the pass states how many records it examined, so the result cannot be
    an empty run reported as a clean one.

  And given the correction and the rule are part of one change,
  When the rule is applied to the store as it stood before the correction,
  Then it refuses 24 records — which is why the correction is applied first
    within that change, and why the rule is never introduced against a store it
    would immediately reject.

  And given the store-wide sweep that the project's own instructions prescribe
    before a finalization drive,
  When it is run after this change lands,
  Then it reports clean on this rule, and it did so without any record being
    exempted from the rule.
