  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Each deliverable on a completed requirement must record the concrete artifact that delivered it (implemented_by at deliverable grain); the record must be navigable both ways (requirement->artifact and artifact->requirement)."
  - "Each recorded reference MUST resolve to the canonical hand-edited source under templates/ or scripts/ per ACD-1600d -- never a build-output/deployed copy under .claude/ or the workspace-parent mirror. Reuse the ACD-1600d canonical-source resolver; do NOT inline a second copy (drift risk)."
  - "Carry-forward + reframing of ACD-400b-2 (implemented_by back-reference) at AC/deliverable grain; ACD-400b-2 stays active and is not superseded."
  - "Ship advisory (warn) before required, and grandfather schema_version < 2 (ADR-026 rules 3-4)."
  - "Canonical source only: scripts/ac_store/ (the writer in generate_ticket_from_ac.py plus the resolver/validator); never a deployed copy."
delivers_to:
  agent: python-coder
  contract: "Per-deliverable back-reference (implemented_by at deliverable grain) that resolves to canonical hand-edited source and is navigable both ways; consumed by the canonical-source edge case ACD-1800d-1-i."
expects_from:
  ac_id: ACD-1800a-1
  contract: "deliverables[] checklist items ({kind, craft}) that each per-deliverable back-reference attaches to."
