criteria: |
  Given a git commit is made that touches files belonging to exactly one declared
    surface
  When the post-commit refresh runs
  Then it determines the changed paths from the commit via git diff-tree and maps them
    to their owning surfaces
  And it rebuilds only the surface whose files changed
  And the index portions for all other surfaces are left untouched (not rebuilt) by
    that refresh
