notes: |
  WHY THIS IS NOT PART OF BO-3800d-1, AND THE MUTATION THAT PROVES IT. A system that stops
  cleanly at the bound and reports a single line — "restructuring failed" — satisfies every
  arm of BO-3800d-1 and leaves the author in the state BO-3800d's notes call the worst of
  the three: holding a refusal with no explanation, which is indistinguishable from the
  feature not existing at all. Conversely a system that accounts beautifully and loops
  forever never produces an account, because it never stops. The two records fail in
  opposite directions and injection (1) below leaves BO-3800d-1 entirely green, which is the
  evidence they are not one record.

  THE PARTIAL-PROGRESS DECISION, TAKEN EXPLICITLY HERE AS BO-3800d's NOTES REQUIRE RATHER
  THAN INHERITED. The question is whether a file the specialist improved without bringing it
  to the demand keeps that improvement at the stop or has it discarded. THE DECISION TAKEN:
  the improvement is KEPT, and the account must say where the file now stands and that the
  specialist's work is still in place. Three reasons, recorded so the decision is not
  re-litigated at enrichment:
    - Discarding contradicts the tree's own hold promise one layer in. BO-3800a-1 forbids
      reverting the author's change on the refusal path, for the reason that work destroyed
      to make a recovery tidy is work lost. The specialist's work is in the same position.
    - Discarding requires a rollback the hold path does not otherwise need, and a rollback
      that must distinguish the specialist's edits from the author's inside one working tree
      is exactly the separation this tree has already established is not observable.
    - The stated hazard of keeping — "a stopped run leaves the file in a state nobody chose"
      — is answered by the account rather than by the rollback: the arm above requires the
      stop to state where the file stands and that the specialist's changes remain, so
      nobody has to discover it. That is why the two arms are in one record.
  This is a decision, not a discovery, and it is open to being overturned by the user or the
  IT PO on the record — but it must not be quietly reversed by an implementation that finds
  a rollback convenient.

  WHAT IS DELIBERATELY LEFT TO ENRICHMENT. The surface the account appears on. BO-3800d's
  notes leave it open, the adjudication ladder's existing "Halt & Surface to User" rung is
  the obvious home, and pinning it in criteria would make this record fail for a reason
  unrelated to its promise the first time the surface moves.

  THE THIRD ARM IS NOT DECORATION. Requiring the successful run to produce NEITHER account
  is what stops the two accounts being emitted unconditionally — a stop-shaped report printed
  on every handoff, including the ones that worked, tells a reader nothing and makes the
  first two arms trivially satisfiable.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can lift
  them verbatim into test descriptors.

  (1) THE BARE FAILURE. MUTATION: replace the account with a single line stating that the
      restructuring specialist did not resolve the refusal.
      MUST GO RED: every arm of this record except the third.
      MUST STAY GREEN: EVERY arm of BO-3800d-1 — the bound holds, the stop happens, nothing
      is delivered — and every arm of BO-3800a-1, BO-3800b-1, BO-3800e-1 and BO-3800e-2.
      That green half is the separability evidence for this record and must be observed
      rather than assumed. It is also the state the repository is in today: the author is
      handed a refusal and nothing else.

  (2) THE COLLAPSED ENDINGS. MUTATION: report the same account for the fell-short ending and
      for the could-not-be-engaged ending.
      MUST GO RED: the told-apart arm only.
      MUST STAY GREEN: every other arm of this record, and every arm of BO-3800d-1. The
      narrowness of this injection is the point — it costs the reader the one piece of
      information that says whether the file is hard or the machinery is broken, and it
      changes nothing else that any descriptor can see.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs after
  this pass — including the surface the account appears on.
