id: ACD-1600e-1
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "Criteria embedding an authoring-pipeline precondition is flagged"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an implementation AC whose criteria opens with an authoring-pipeline precondition,
    for example "Given IT PO v3 has enriched the batch and set readiness: reviewed",
  When the authoring-quality check evaluates the criteria,
  Then the criteria is flagged for embedding a planning/authoring precondition rather than
    the behaviour to build,
  And the flag quotes the offending clause,
  And the AC is held for correction until the clause is removed.
depends_on: [ACD-1600e]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Canonical source to change: scripts/ac_store/validate_ac.py (AC authoring-time validation; source-only Python)."
  - "The authoring-quality check must flag criteria whose Given embeds a planning/authoring-pipeline precondition (authoring roles like 'IT PO v3', readiness-state transitions, enrichment steps) rather than the behaviour to build, and quote the offending clause."
  - "A flagged AC is held for correction until the offending clause is removed."
  - "The distinction must key on planning-pipeline markers, not the mere presence of a Given clause — a legitimate runtime/domain precondition must NOT be flagged (ties to ACD-1600e-1-i)."
  - "Ship advisory before required and diff-scope the check so it grandfathers pre-existing (schema_version < 2) ACs (ADR-026 rules 3-4): older stores contain many ACs with authoring-framed criteria (the empirical motivation for this gate), so a required, non-diff-scoped check would retroactively hold a whole legacy store on upgrade."
delivers_to:
  agent: python-coder
  contract: "The authoring-quality check: given an AC's criteria, decide whether it embeds an authoring-pipeline precondition and quote the offending clause; consumed by the false-positive edge case ACD-1600e-1-i."
expects_from: null
