it_requirements:
  - >-
    A BREAK CARRIES AN INDENT STEP. Each lexer returns (offset, step) pairs: step 1 after a
    Python compound header's `:`, after a block's `{` and after shell `then`/`do`/`else`; step -1
    before a block's `}` and before shell `fi`/`done`/`esac`/`else`/`elif` after a `;`; step 0
    otherwise. spans.counted_keys moves the piece's indentation by one language unit per step
    (registry: four spaces for Python, two for every other language), so a joined form and its
    expanded form give identical keys when the file uses that unit.
  - >-
    A BLOCK IS A BRACE PAIR DIRECTLY HOLDING A `;` STATEMENT SEPARATOR (outside any parenthesis
    opened since that brace). Object literals and destructuring patterns hold commas, not `;`,
    so they never split; type literals and interface bodies whose members end in `;` split like
    their one-member-per-line form. JSX expression containers and template `${}` are scanned in
    their own context and are not blocks.
  - >-
    SQL breaks come from the same lexer pass that finds comments, after a `;` outside strings,
    quoted identifiers and comments; breaks inside a dollar-quoted body are kept only when the
    body lexes, exactly like its comments. Shell breaks come from the shell scanner, after `;`
    or `;;` (a `;` before `then`/`do` keeps the header on its line) and after `then`/`do`/`else`
    in command position only; a lone `;` that splits is uncounted punctuation in the key.
  - >-
    The independent TypeScript-compiler oracle applies the same block rule to the compiler's
    own tokens and must agree with the measure on every tracked JS/TS file.
test_spec:
  - name: test_ge_127d_3_vi_one_line_blocks_measure_and_key_like_their_expanded_forms
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      One-line JS/TS blocks, Python compound bodies, joined SQL statements and joined shell
      commands each measure, and key, exactly like their expanded forms.
    must_catch:
      - "brace lines of a one-line block not counted"
      - "a joined compound body keyed with the header's indentation"
  - name: test_ge_127d_3_vi_object_literals_strings_and_argument_keywords_do_not_split
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Object literals, destructuring, empty blocks, braces or `;` inside strings, SQL comments,
      shell `&&`/`||` lists, substitutions and `echo do it` each measure their code lines.
    must_catch:
      - "every brace pair treated as a block"
      - "shell keywords split outside command position"
  - name: test_ge_127d_3_vi_joining_or_splitting_blocks_on_an_over_limit_file_adds_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Through the gate in a temporary repository, on over-limit .py, .js, .sql and .sh files,
      a join-only change and its reverse each complete, state 0 added and quote equal lengths.
  - name: test_ge_127d_3_vi_the_published_rule_names_sql_and_shell
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      The generated rule's per-statement clause names Python, JavaScript, TypeScript, SQL and
      shell under the real measure.
test_rationale: |
  The discrimination descriptor fails on the GE-127d-3-v measure (blocks counted once per
  statement, compound bodies keyed at the header's indentation, SQL and shell unsplit). The
  boundary descriptor guards the false splits a brace or keyword rule invites. The gate
  descriptor proves the repayment diff, not only the length, is unmoved by joining in both
  directions, which is what the indent-aware keys exist for.
