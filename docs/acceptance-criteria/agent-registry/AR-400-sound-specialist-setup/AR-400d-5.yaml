    description: "Extract the example `skills:` block from docs/reference/agent-template-frontmatter.md, place it in a fixture specialist's frontmatter, and run the build's declaration-shape check: no finding; changing its provided_by value to 'vendor' produces one."
test_rationale: >-
  The only falsifiable clause is the example's validity; running the real
  shape check over the extracted block, with a mutated control, tests it.
