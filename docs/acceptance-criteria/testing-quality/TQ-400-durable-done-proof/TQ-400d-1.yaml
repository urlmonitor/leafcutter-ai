risk_surface: internal
notes: |
  Sequenced behind TQ-400e-3 on the product owner's instruction: without a working
  exemption path the pile is padded with records that can never be proven, and a
  pile that cannot be finished is a pile nobody works.

  Scale at authoring time (measured 2026-08-17 over unit_tests/): 259 of 641
  finished L2/L3 records have no test carrying their coverage tag. That is the
  starting population, minus whatever the exemption path legitimately removes.

  The "not yet decided" state is deliberate and must be explicit rather than
  implied by absence — an undecided record and a record nobody has looked at must
  not be the same thing, which is the distinction TQ-400d-3 then enforces.

  Both final clauses are completeness controls: one stops the list from silently
  shrinking, the other stops it from being padded with everything.

  IT-PO ENRICHMENT NOTE (2026-08-17). The exempt-exclusion clause is the one most
  likely to be implemented as a local filter (`if rec.get("test_required") is
  False: skip`), which would work today and drift the moment TQ-400e-4 starts
  refusing reasonless declarations — at which point the pile and the sweep would
  disagree about the same 37 records. it_requirements state the consumption
  obligation and test_spec makes it falsifiable by flipping a declaration and
  observing the record enter the list.
