id: BO-1500a-1-ii
components:
  - build_orchestration
  - worktree_manager
readiness: approved
priority: high
title: "The authoring-worktree command's stdout holds only its JSON answer; child-process progress goes to stderr"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given an AC-authoring run invokes `setup_ticket_worktree.py create-ac-worktree`,
    and the child processes that command starts -- the pre-commit shim installer
    (which prints '[<result>] <stage>' for each hook stage), the dependency install
    and build run during bootstrap, and git itself -- each print their own
    progress lines,
  When the command runs to success, either on a first run that creates and
    bootstraps the authoring worktree or on a re-run that reuses it,
  Then the command's stdout holds exactly one JSON object -- the payload naming
    worktree_path, branch, ac_store_path and created -- with nothing before or
    after it,
  And every progress line from those child processes appears on the command's
    stderr instead of being dropped,
  And the command's exit code and the payload's fields are the same as before,
  And the bug symptom ("`setup_ticket_worktree.py create-ac-worktree` prints non-JSON lines (e.g. '[already_installed] commit-msg', and on a first run 1100+ lines of build output) to stdout before its single-line JSON payload, so /plan-feature's worktree-setup parse (JSON.parse of the whole output) fails and halts every run with setup_failure_kind no_workspace_named even though the worktree was created") must not occur.
depends_on:
