notes: |
  WHAT THIS RECORD FIXES AND WHAT IT DELIBERATELY LEAVES OPEN. Fixed: that a bound exists,
  that it is at least one, that reaching it STOPS, that stopping does not deliver, and that
  success inside the bound ends the attempts immediately. Left to enrichment, following
  GE-127f-3's precedent in the sibling tree: the bound's value. Two things belong in that
  decision rather than in the criteria — a file that resists restructuring resists it
  identically on the second and tenth attempt, so a high bound buys nothing but cost; and
  every attempt engages a specialist, so the bound is the main lever on what a hard file
  costs before it is reported.

  WHAT THIS RECORD MUST NOT BECOME, RESTATED FROM THE L1. A claim that the file is eventually
  always restructured successfully. Some files will not be — the nine files in this repository
  standing above 1,500 lines are named in GE-127f's notes as exactly that population. This
  record promises an honest stop, not a guaranteed success.

  THE LAST ARM LOOKS LIKE A COURTESY AND IS NOT. "Success inside the bound ends the attempts"
  excludes the loop-shaped implementation that engages the specialist exactly `bound` times
  and checks afterwards. That build satisfies every other arm here, costs the full bound on
  every refusal including the easy ones, and makes BO-3800e's cost promise false for the
  population that is one small restructure away from compliance — which GE-127f's measured
  census puts at 78 of the 212 oversized files.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can lift
  them verbatim into test descriptors.

  (1) THE QUIET PASS. MUTATION: on reaching the bound, deliver the change anyway and record
      the delivery as successful.
      MUST GO RED: the change-is-not-delivered arm.
      MUST STAY GREEN: every arm of BO-3800d-2 — the run still stops and still accounts for
      itself, it merely accounts for the wrong ending — and every arm of BO-3800a-1's hold,
      BO-3800b-1, BO-3800e-1 and BO-3800e-2. That green half is the separability evidence
      between this record and BO-3800d-2 and must be observed rather than assumed.
      WHY THIS ONE MATTERS MOST: BO-3800d's notes call it worse than the loop, because it
      reopens the standard for exactly the files the standard exists for, and it looks like
      the feature working.

  (2) THE UNBOUNDED RETRY. MUTATION: engage the restructuring specialist repeatedly until the
      file meets the demand, with no bound at all.
      MUST GO RED: the bounded-engagements arm and the run-stops arm — the run does not
      terminate.
      MUST STAY GREEN: both arms of BO-3800e-1 and BO-3800e-2 — a refusal that asks for no
      craft is unaffected by how many times this one asks.
      EXPECTED COUPLING, TO BE REPORTED RATHER THAN SUPPRESSED: under this injection
      BO-3800d-2's descriptors cannot reach their assertions at all, because no stop is ever
      reached to read. That is a true consequence of an unbounded loop and NOT evidence that
      the two records are one; record it as an unreachable result rather than as a red.

  (3) THE SPENT QUOTA. MUTATION: engage the restructuring specialist exactly `bound` times on
      every specialist-disposition refusal, and evaluate the file only after the last one.
      MUST GO RED: the last arm — success inside the bound must end the attempts.
      MUST STAY GREEN: every other arm of this record, every arm of BO-3800d-2, and
      BO-3800e-1. This injection is cheap to write by accident, because a counted loop reads
      as the natural implementation of a bound.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs after
  this pass — including the bound's value.
