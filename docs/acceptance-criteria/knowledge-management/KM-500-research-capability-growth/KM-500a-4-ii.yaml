id: KM-500a-4-ii
title: Scripted, mixed and real results are labelled per actor, and a real-model figure needs three repetitions
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given a kernel-path evaluation run of 20 cases that uses a scripted host and the real configured Jev
  When the report is produced
  Then each case result labels the host as scripted and Jev as real, and the run-level evidence label is mixed, not real
  And only results in which every judging actor is real count toward a real-model quality figure, while scripted and mixed results appear in separately labelled sections with their own denominators
  And a real-model quality figure is given only after 3 repetitions of the same frozen case set under the same configuration identity, with the minimum, maximum and mean of each category figure across the repetitions
  And with fewer than 3 completed repetitions the real-model figure is marked limited, states how many repetitions completed, and carries no threshold verdict
  And a repetition that stops partway counts as one attempt, its unfinished cases are reported not run, and none of its cases are dropped from the denominators
  And a synthetic example case, one not drawn from the frozen reviewed set, is labelled synthetic and never counts toward a real-model figure.
depends_on:
