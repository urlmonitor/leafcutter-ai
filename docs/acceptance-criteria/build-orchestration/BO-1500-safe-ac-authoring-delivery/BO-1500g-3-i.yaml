      type: object
      description: "{ present_at_workspace_ready: ['<path>', ...], delivered: [] }. Anything already changed in the workspace at the moment it becomes ready is recorded as not-authored-by-this-run and must never appear in the delivered set."
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
