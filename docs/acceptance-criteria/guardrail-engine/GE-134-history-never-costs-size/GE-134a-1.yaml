id: GE-134a-1
components:
  - commit_guardian
readiness: approved
priority: high
title: "A file's decision-history block adds nothing to its measured length, in every covered language"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given a Python file made of code, ordinary "#" comments and blank lines, and a copy of it
    followed by a decision-history block of 25 comment lines: a rule line of "=" characters,
    the heading "# DECISION HISTORY", a second rule line, and 22 entry lines each starting
    "# - " or "#   ",
    and a JavaScript file and a copy of it whose header carries a decision-history block of
    15 "//" comment lines (the heading "// DECISION HISTORY" with no rule lines, then 14
    entry lines),
  When the length of each file is measured,
  Then each copy carrying a block measures exactly the same as the same file without it,
  And the same holds for the line-comment form of every other language the standard covers
    (for example "-- DECISION HISTORY" in SQL and "# DECISION HISTORY" in shell),
  And the same holds when the decision-history text sits inside a standalone Python string
    (for example a trailing module-level string) or a block comment, so no line is
    subtracted twice and the file with the block measures the same as the file without it.
depends_on:
  - GE-134a
  - GE-127c
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-134-history-never-costs-size/GE-134a.yaml
    relationship: parent
    status: exists
  - path: templates/skills/doc-enforcer/SKILL.md
    relationship: related
    status: exists
    relevance: Section 3 and 8 define the decision-history block's heading, underline and entry form per language.
  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'NO HISTORY-SPECIFIC MECHANISM (IT PO, 2026-10-23, BrainCandy: GE-127d-3 supersedes this rule). A
  decision-history block is uncounted because GE-127d-3''s one measure (the shared measure behind
  _file_size_ratchet.py, with its per-language lexers in templates/scripts/commit_guardian/_file_size_measure/)
  counts a line only when it holds a code token: every comment, every standalone non-f Python string and
  every blank line is uncounted, in every checked extension. There is no DECISION HISTORY heading
  detection, no rule-line attachment, no block-end scan and no DECISION_HISTORY_COMMENT_PREFIXES (or any
  other prefix) constant; reintroducing one is a second rule beside the measure and is a defect, even
  if it changes no count today. Exemption is by syntactic role only, never by the words DECISION HISTORY.'
- Every gate that measures length (crossing refusal, growth ratchet, added-lines count, published-rule
  agreement) uses that one measure on both the previous and the staged content (GE-127d-3-iii); a file
  whose measured length drops because of the rule change is not reported as a violation, and no stored
  baseline needs a hand edit.
- 'The published rule is GE-127d-5''s generated statement; this record adds no sentence of its own to it
  (GE-134a-3 is superseded by GE-127d-3).'
- 'Tests derive every expected length from the content at run time (an independent counter or the
  with-block/without-block equality the criteria state), never from figures pinned under the
  pre-2026-10-16 rule; a pre-change count may appear only as a contrast showing the fixture still tells
  the two rules apart.'
- Measuring stays linear in file length.
declared_files:
- path: templates/scripts/commit_guardian/_file_size_ratchet.py
  state: existing
delivers_to:
  agent: python-coder
  contract: 'The size standard''s measured length of a file (int >= 0) is GE-127d-3''s measure: a line
    counts only when it holds a code token, so every comment (including any decision-history block in
    line-comment or block-comment form), every standalone non-f Python string (including a trailing
    DECISION HISTORY string) and every blank line is uncounted. A file with a decision-history block
    therefore measures exactly what the same file without it measures. Before- and after-lengths use the
    same measure.'
expects_from:
  ac_id: GE-127d-3
  contract: 'The single shared measure (content, extension) -> int under the 2026-10-21 rule, with no
    history-specific exclusion.'
test_intent:
- clause: each copy carrying a block measures exactly the same as the same file without it
  needs_test: true
  reason: The user-visible promise; both the Python ruled '#' form and the JavaScript unruled '//' header
    form must be proven, and through the size check's own output.
- clause: the same holds for the line-comment form of every other language the standard covers (for example
    "-- DECISION HISTORY" in SQL and "# DECISION HISTORY" in shell)
  needs_test: true
  reason: Every covered language must get the same result, and a lexer that misses one comment syntax would
    go unnoticed.
- clause: the same holds when the decision-history text sits inside a standalone Python string (for example
    a trailing module-level string) or a block comment, so no line is subtracted twice and the file with
    the block measures the same as the file without it
  needs_test: true
  reason: Double subtraction is a computed edge case that would under-count files.
test_spec:
- name: test_ge_134a_1_python_and_javascript_history_blocks_are_not_measured
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'The 80-line Python body plus its 25-line ruled ''#'' history block (rule, heading, rule,
    22 entries) and the 120-line JavaScript body whose header carries a 15-line unruled ''//'' block:
    measure_current_length gives each file''s code-line count (64 and 96 for the shared fixture, derived
    by an independent counter at run time), and the Python body without its block measures the same 64.
    The pre-change counts (105, 135) are asserted only as a contrast that the fixture still separates
    the two rules.'
  proves_clause: each copy carrying a block measures exactly the same as the same file without it
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_134a_1_history_block_is_left_out_of_the_length_the_size_check_quotes
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Stage the Python example (with its history block) under a limit equal to its independently
    derived length (64) and run the fixture copy of check_file_size.py as a subprocess: it exits 0 and
    lists the file at that length; the same file with one more code line exits 1 quoting Lines: 65 against
    Limit: 64. Uses _ge_127d_2_fixture.build_fixture_tree (a copy of the production modules in a temporary
    git repository, no build.py, no POSIX flock).'
  proves_clause: each copy carrying a block measures exactly the same as the same file without it
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_134a_1_line_comment_block_is_left_out_in_every_covered_language
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Parametrised over every extension in the shipped file_size.checked_extensions, each with
    that language''s own line-comment prefix (''#'' for .py and .sh, ''//'' for .js, .mjs, .ts and .tsx,
    ''--'' for .sql, held in the test fixture, not in production code): a 10-line body (8 code lines, one
    ordinary comment, one blank) plus a block headed ''<prefix> DECISION HISTORY'' with 4 entries measures
    8, and the same body without the block measures 8. A shipped extension with no known prefix fails the
    test rather than being skipped.'
  proves_clause: the same holds for the line-comment form of every other language the standard covers
    (for example "-- DECISION HISTORY" in SQL and "# DECISION HISTORY" in shell)
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - the .sql lexer misses '--' comments, so '-- DECISION HISTORY' in a .sql file is still counted
  - a checked extension such as .mjs falls back to a raw or regex count instead of its lexer
  - a history-specific prefix constant or heading scan reintroduced beside the per-language lexers
- name: test_ge_134a_1_lines_outside_the_block_measure_as_before
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'NAME KEPT, PROMISE CHANGED (GE-127d-3, 2026-10-21). The lines around a history block are
    not counted either: a Python file with ordinary ''#'' comments, a docstring, blank lines, a ''#''
    comment directly above the block''s rule line and a ruled block measures its 2 code lines, and a
    JavaScript file with ''//'' comments, a JSDoc /** */ block, blank lines and a ''//'' block measures its
    2 code lines (the Python figure re-derived by the independent counter).'
  proves_clause: each copy carrying a block measures exactly the same as the same file without it
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - a comment directly above a rule line treated as code because a block-boundary rule claimed the rule line
- name: test_ge_134a_1_file_without_a_history_block_measures_as_before
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'NAME KEPT, PROMISE CHANGED. Python, SQL and JavaScript files without a block but with rule
    lines, comments that mention DECISION HISTORY, near-miss headings, docstrings, block comments and
    blank lines measure their code-line count (3, 1 and 2; the Python one re-derived by the independent
    counter) -- the mention and near-miss lines add nothing because they are comments, and the code line
    LABEL = ''DECISION HISTORY'' counts. Their pre-change lengths (8, 5, 6) are asserted only as a contrast.'
  proves_clause: each copy carrying a block measures exactly the same as the same file without it
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_134a_1_block_inside_a_docstring_or_block_comment_is_not_subtracted_twice
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'A module whose history sits inside a trailing standalone triple-quoted string (the form
    _file_size_ratchet.py itself uses), a module whose ''#'' history lines sit inside a standalone string
    followed by ''#'' comments after its closing delimiter, and a JavaScript file whose ''//'' history lines
    sit inside a /* */ header followed by ''//'' comments each measure exactly their 1 code line -- never
    below it. Control row: the same block as plain line comments also measures 1.'
  proves_clause: the same holds when the decision-history text sits inside a standalone Python string (for
    example a trailing module-level string) or a block comment, so no line is subtracted twice and the
    file with the block measures the same as the file without it
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - an uncounted region's lines subtracted a second time, so the file measures below its code-line count
  - a block comment or standalone string closed early by a '#' or '//' marker inside it, so the code line
    after it is lost or a comment after it is counted
