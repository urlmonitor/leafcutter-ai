id: ACD-1800e-1
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: medium
title: "Re-deriving work from a requirement produces no duplicate deliverables, tickets, or sign-off slots"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement from which buildable work has already been derived once, so its
    deliverable checklist and its grouping ticket already exist,
  When work is derived from the same requirement a second time,
  Then no duplicate deliverable checklist item is created,
  And no duplicate grouping ticket is created,
  And no duplicate sign-off slot is created,
  And the second derivation resolves to the existing work rather than creating a
    second copy of it.
depends_on: [ACD-1800e]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Re-deriving buildable work from a requirement must be idempotent: no duplicate deliverable checklist item, no duplicate grouping ticket, and no duplicate sign-off slot is created; the second derivation resolves to the existing work."
  - "Reuse the generator's existing idempotency guard in scripts/ac_store/generate_ticket_from_ac.py (carry-forward of ACD-400b-3) rather than a parallel one; ACD-400b-3 stays active."
  - "Re-derivation must infer-then-validate before write, insert ONLY missing items (never rewrite the whole checklist/file), and be byte-stable on an already-complete AC (run-twice-and-diff yields no change) -- the standard backfill idempotency contract."
  - "Existing per-deliverable sign-offs must be preserved exactly across a re-derivation (resume, not clobber)."
  - "Canonical source only: scripts/ac_store/generate_ticket_from_ac.py; never a deployed copy."
delivers_to:
  agent: python-coder
  contract: "Idempotent work-derivation from a requirement (no duplicate deliverable items, grouping tickets, or sign-off slots; resolves to existing work); constrained by the partial-re-derivation edge case ACD-1800e-1-i."
expects_from:
  ac_id: ACD-1800a-1
  contract: "deliverables[] checklist items whose partial-vs-complete set this re-derivation reconciles idempotently, preserving existing items and their sign-offs."
test_spec:
