readiness: approved
priority: medium
title: "Unchanged HEAD and max-mtime short-circuit the full per-file stat sweep"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the read index recorded, at build time, the git HEAD commit sha and the
    maximum last-modified time observed across each surface's files
  When an index-backed read runs and the current git HEAD equals the recorded sha and
    no surface's current maximum last-modified time is later than the recorded maximum
  Then the read serves the indexed data without performing the full per-file stat
    sweep of every surface source file
  And when either the HEAD sha differs or any surface's maximum last-modified time has
    advanced, the read falls through to the full per-file stat comparison defined in
    KM-KGS-100b-6
depends_on:
  - KM-KGS-100b-6
doc_links:
  - path: scripts/knowledge_query.py
    relationship: describes
    status: exists
  - path: docs/architecture/components/knowledge-management.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The index header records the git HEAD sha at build time and, per surface, the max mtime observed across that surface's files; the short-circuit compares only these two cheap signals before any per-file sweep."
  - "The short-circuit is an optimization of KM-KGS-100b-6, never a bypass: when HEAD differs OR any surface's current max-mtime has advanced OR HEAD cannot be resolved, the read must fall through to the full per-file stat sweep, so a drifted file is always detected."
  - "In a layout with no resolvable git HEAD (e.g. an exported/deployed tree without .git), the short-circuit condition must be treated as not-satisfied and the full stat sweep runs."
test_spec:
  - name: test_unchanged_head_and_maxmtime_skips_full_sweep
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "When HEAD equals the recorded sha and no surface max-mtime advanced, the read serves indexed data without the full per-file stat sweep."
  - name: test_head_change_falls_through_to_full_sweep
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "A differing HEAD sha forces the full per-file stat comparison of KM-KGS-100b-6."
  - name: test_advanced_maxmtime_falls_through_to_full_sweep
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "An advanced surface max-mtime (HEAD unchanged) still forces the full per-file stat sweep so the drifted file is detected."
  - name: test_no_git_head_forces_full_sweep
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "When git HEAD cannot be resolved, the short-circuit is treated as not-satisfied and the full stat sweep runs."
