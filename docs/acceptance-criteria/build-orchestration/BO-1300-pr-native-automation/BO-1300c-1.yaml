assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Surface is agent/skill prose: the operator-facing blocker is the structured escalation payload the supervisor raises. MODIFY templates/skills/building-epics/SKILL.md (blocker escalation to the user, §3 failure adjudication / structured blocker payload) and the finalize-feature merge-gate path so a RED verdict is turned into a blocker, NOT a silent stop. This is prompt/skill-body wording — llm-expert, not python-coder."
  - "The blocker text must consume the structured RED verdict from BO-1300b-2-i: name the failing required check(s) verbatim (e.g. 'Lint (ruff)') and identify the blocked PR (number/URL). Do not re-derive the failing check in prose."
  - "Must align with the existing blocker/escalation schema in building-epics (status: blocked + reason) so the supervisor routes it like any other blocker; do not invent a new escalation channel."
  - "Must leave the PR unmerged: the prose must forbid any fall-through to merge after a RED verdict."
