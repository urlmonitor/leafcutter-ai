risk_surface: internal
notes: |
  The product owner's phrasing is "a rhythm you actually see". A report that exists
  but must be asked for is the state we are already in: the per-record verdict has
  been computable all along, and the 259-record backlog stayed invisible anyway
  because nothing put it in front of anybody.

  Test-angle constraint: the last clause is what makes this more than a static
  check. Complete a second run with deliberately different figures and observe the
  surfaced numbers follow. Asserting that a template contains a placeholder for
  the figures passes on a surface wired to nothing.

  The three-way split (proven / not proven / exempt) is deliberate: collapsing
  exempt into proven would let the 37 records currently carrying a test-free
  declaration inflate the good news.

  SURFACE SETTLED BY THE USER (2026-08-18) — THE PULL-REQUEST CHECK LIST, AS A
  NON-BLOCKING CHECK. This supersedes the IT-PO caveat that stood here through two
  enrichment passes, which recorded the surface as an unresolved blocking ambiguity.
  The decision and its evidence are recorded here so the question is not re-litigated.

  The evidence it was decided on:
  - The repository has ZERO GitHub issues, open or closed (verified via
    `gh issue list --state all`). An issue-based surface would be a new habit
    nobody has.
  - reports/ holds six ad-hoc audit dumps, the most recent from 2026-08-11. It is a
    passive archive, not a surface anyone reads unasked.
  - The pull-request check list is the only surface in this repository read unasked,
    by everyone, on a fixed rhythm — and a sibling done-proof verdict ("Proof-of-done
    coverage check (BO-2500b)") already appears there, so the reader needs no new
    habit and no new tool.

  WHY NON-BLOCKING IS NOT A DETAIL. 259 of 641 done leaf records are unproven today.
  A blocking whole-store check would be red on every pull request from its first run,
  including pull requests that touch none of the affected records, and would be
  switched off within days. .github/workflows/ci.yml records that reasoning verbatim
  (around lines 199-207) as the reason the whole-store variant ACS-200h was
  deliberately NOT implemented; this AC is written to be consistent with that comment
  rather than to contradict it.

  WHY IT REPORTS RATHER THAN RE-RUNS. Re-running the sweep per pull request puts a
  whole-store cost on every pull request and makes the figure differ between two pull
  requests for reasons unrelated to either. The check publishes what the schedule
  already computed — TQ-400c-1's dated report.

  WHY A STALE OR FAILED SWEEP NEEDS ITS OWN STATE. A non-blocking check that renders a
  failed or lapsed sweep as a clean pass is worse than no check: it actively reports
  health. The failed representation itself is TQ-400c-4's subject and is referenced,
  not restated, here; what this AC adds is that the check must also say how old the
  figures are, so a reader can tell a fresh verdict from an ageing one without opening
  anything.

  WHY THE SUMMARY LINE IS LOAD-BEARING. Non-blocking decays into unread unless the
  figures are legible in the check list itself. A check whose content is reachable only
  by clicking into the job log has reproduced "behind a command" with extra steps —
  the exact failure the parent L0 exists to remove.

  IT-PO ENRICHMENT NOTE (2026-08-18) — LAPSED CADENCE.

  WHY LAPSED IS NOT TQ-400c-4's JOB. TQ-400c-4 owns "the scheduled run did not
  complete". Lapsed is "the last run that DID complete is now old" — the schedule
  stopped firing at all, so there is no failed occurrence to render. A check that
  handles only the failure case reports a silently-dead schedule as clean, and that is
  the worse of the two modes precisely because nothing anywhere turns red.

  ONE SOURCE FOR THE THRESHOLD. The cadence comparison must be derived from the
  schedule's own cron (TQ-400c-1's `on: schedule`), not a second constant. A duplicated
  threshold drifts when the cron changes, and it drifts toward calling a stopped
  schedule fresh — the failure direction that hides itself.

  THE TWO TRAPS IN TESTING IT. A fixed timestamp in the fixture rots and then fails for
  a reason unrelated to the behaviour; and a single wildly-stale case passes on an
  off-by-one and on a threshold effectively set to infinity. The contract is therefore a
  relative-age PAIR straddling the declared cadence.

  ANGLE CAP RESOLUTION. Four angles are now charged — reachability, seam, criterion,
  boundary — which is the cap. `failure` is triggered in the neighbourhood (the
  three-state distinguishability includes TQ-400c-4's failed occurrence) but is not
  given a label here, because the failure state itself is TQ-400c-4's subject and is
  referenced rather than owned. Its one demand on this AC — that lapsed and failed are
  distinguishable from each other and from clean — rides inside the boundary entry as a
  hard condition and is restated in it_requirements, so it cannot be lost by an
  implementer counting labels. This follows the precedent recorded in BP-900g-10.
