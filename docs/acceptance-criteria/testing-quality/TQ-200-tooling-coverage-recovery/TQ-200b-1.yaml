it_requirements:
  - "Author fresh unit tests in tests/test_package_audit.py (new file). Source PR is closed — write from scratch and verify run-to-green before sign-off."
  - "Functions under test (scripts/package_audit.py): run_audit(project_root, package_root, boundary_config_path), _classify_item(filename, items_map), _suggest_action(classification, in_template), format_markdown(audit). Import by bare module name after adding scripts/ to sys.path."
  - "Build a tmp_path fixture with live/template directory pairs plus a package_boundary.json describing sections and items; run_audit is filesystem-driven and reads that config."
  - "Assert run_audit findings include every non-compliant (portable, missing-from-template) item and omit compliant items; total_missing counts only action=='move' items."
  - "Assert _classify_item returns the expected category from items_map (portable / project-specific / unknown), and _suggest_action returns 'move' / 'mark-boundary' / 'none' matching classification + in_template."
  - "Assert format_markdown lists each finding with its category and action, and that an empty AuditReport renders the explicit 'No package gap detected' no-issues line."
