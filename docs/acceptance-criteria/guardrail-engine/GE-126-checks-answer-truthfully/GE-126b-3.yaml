id: GE-126b-3
title: "The check finds the same store from wherever you happen to be standing"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a working copy whose acceptance-criterion store holds one staged record that
    genuinely violates the rule the deployed AC-governance check enforces,
  When the check is invoked out of process by absolute path from the working copy root
    and again from the parent directory that carries a project marker but no store and
    again from a subdirectory several levels inside the working copy,
  Then all three runs resolve the same root and report the same root in their statement,
  And all three runs refuse the same record naming it so the resolution is corroborated
    by a verdict rather than by the root string alone,
  And the check reaches that root by the same means the rest of the check family already
    uses rather than by a walk it carries privately so a later layout change moves all of
    them together,
  And when no root can be resolved by that shared means the check reports that it could
    not resolve a root and names the directory it started from instead of quietly falling
    back to a relative location and answering about a place it never located.

  Coverage note: covered only by out-of-process runs of the deployed check from the three
  working directories asserting both the resolved root and the refusal in each. Asserting
  the resolved root alone does not cover this criterion; a check can report a root it did
  not read from.
depends_on:
