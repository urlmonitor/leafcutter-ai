id: GE-113a-1-iii
title: "A non-test file outside the test root is not blocked by the test-placement guard"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the configured test location is "tests/",
  And a commit stages a non-test source file at "scripts/etl/pipeline.py" which is
    outside the configured test location,
  When the pre-commit guard for test placement runs,
  Then the commit is not blocked by the test-placement guard for that file,
  And no misplaced-test message is emitted for that file.
