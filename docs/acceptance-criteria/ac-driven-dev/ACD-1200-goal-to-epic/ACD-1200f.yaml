roadmap_phase: phase_1
criteria: |
  Walking a goal's AC tree yields precisely the set of buildable leaf ACs — every one that should become a ticket, each exactly once.

  When the command resolves a goal or feature reference, it traverses the AC
  tree beneath it and collects the leaf-level ACs (L2/L3 behaviors and edge
  cases) that become tickets, while passing through composite L0/L1 nodes. A
  leaf reachable by more than one path is collected once, so the resulting set
  is complete, scoped to the chosen subtree, and free of duplicates.
