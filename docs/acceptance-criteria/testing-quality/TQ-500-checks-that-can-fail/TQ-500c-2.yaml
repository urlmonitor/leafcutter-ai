implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  THE THIRD AND FOURTH CLAUSES ARE THE FALSE-POSITIVE AND FALSE-NEGATIVE CONTROLS,
  and neither is optional. Without the all-objected case the reading may report every
  test as inert and still pass. Without the none-objected case it may report only the
  first inert test it finds and still pass. The failing case alone is satisfied by a
  reading that always reports something.

  THE FIFTH CLAUSE IS THE ANTI-COLLAPSE CLAUSE. A ratio, a percentage, or a "3 of 4
  caught it" summary re-creates the aggregate the AC removes, in a form that reads as
  progress. Two separate counts cannot be summarised into one without discarding a
  reported figure.

  BOUNDARY WITH TQ-500c-3. This AC asks whether a test ever objected at all.
  TQ-500c-3 asks which specific alteration a test slept through. A test that objected
  under one alteration and not another passes this AC and is caught by that one;
  neither absorbs the other.
