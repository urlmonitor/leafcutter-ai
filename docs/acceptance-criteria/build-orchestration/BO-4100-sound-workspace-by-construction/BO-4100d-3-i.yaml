notes: >-
  The one legitimate reason the created name may differ from the requested one, carved out
  so BO-4100d-3 does not have to treat every alteration as a failure. The risk it closes is
  the reverse of the original defect: an implementation that sanitises quietly and reports
  the requested name sends the caller looking for a branch that does not exist, which is
  the same lie by a different route.
