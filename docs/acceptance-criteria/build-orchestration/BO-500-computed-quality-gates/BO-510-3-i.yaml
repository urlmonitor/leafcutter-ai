title: "New agent template added without produces field is caught by validation"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given a developer adds a new agent template file at templates/agents/new-agent.md
    with valid YAML frontmatter containing name, description, model, and tools
    but WITHOUT a "produces" field,
  And a corresponding entry is added to agent_registry.json without a "produces" field,
  When the validation test (BO-510-3) runs as part of the pre-commit hook
    or CI pipeline,
  Then the test FAILS
  And the error message identifies both the missing locations:
    "Agent 'new-agent' in agent_registry.json is missing the 'produces' field"
    "Template 'templates/agents/new-agent.md' is missing the 'produces' frontmatter field"
  And the commit is blocked until the produces field is added to both locations

  Given the developer then adds produces: production_code to both the registry
    entry and the template frontmatter,
  When the validation test runs again,
  Then it PASSES and the commit proceeds
depends_on: [BO-510-3]
doc_links:
  - path: config/agent_registry.json
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-007-contract-driven-acs.md
    relationship: describes
    status: exists
assigned_agent: test-writer
estimated_complexity: S
it_requirements:
  - "Edge-case test must be part of the same test suite as BO-510-3"
  - "Must use test fixtures, not modify the actual registry during testing"
test_spec:
  - name: test_both_registry_and_template_missing_both_errors_emitted
    target_dir: unit_tests/
    framework: pytest
    type: unit
    description: "A fixture agent absent from both surfaces yields two distinct errors — one naming the registry entry and one naming the template file — not a single merged message."
  - name: test_single_agent_missing_produces_in_registry
    target_dir: unit_tests/
    framework: pytest
    type: unit
    description: "The registry-side error text matches the AC-specified wording, including the agent id and the phrase \"missing the 'produces' field\"."
  - name: test_template_without_produces_triggers_error
    target_dir: unit_tests/
    framework: pytest
    type: unit
    description: "The template-side error text matches the AC-specified wording, including the template filename and the phrase \"missing the 'produces' frontmatter field\"."
  - name: test_validation_passes_after_produces_added_to_both
    target_dir: unit_tests/
    framework: pytest
    type: unit
    description: "Round trip — after produces: production_code is present in both the fixture registry entry and the fixture template frontmatter, validation returns no errors for that agent."
  - name: test_validate_agent_registry_reports_missing_produces_on_fixture_package_root
    target_dir: unit_tests/
    framework: pytest
    type: integration
    description: "Running validate_agent_registry() against a synthetic package root (tmp_path with config/agent_registry.json plus templates/agents/new-agent.md, both lacking produces) returns produces errors — proving the check runs on the gate that actually blocks the build, not only via the helper called directly."
test_rationale: |
  The four unit descriptors exercise validate_produces_field with in-memory
  fixtures, per the it_requirement that the live registry must not be mutated
  during testing. On their own they would prove only that a helper can produce
  an error string; they cannot distinguish "the check exists" from "the check
  runs". The AC's final clause — "the commit is blocked" — is about
  enforcement, so the integration descriptor drives the composed entry point
  validate_agent_registry() (the function build.py's install_shims step calls,
  and the step whose failure fails CI before pytest runs) against a synthetic
  package root. Together they cover both the message contract and the
  enforcement wiring; a passing helper with an unwired gate fails the
  integration descriptor.
