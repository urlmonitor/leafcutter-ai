doc_links:
  - path: docs/known-issues/commit-guardian.md
    relationship: describes
    status: exists
    relevance: >-
      Two findings here are load-bearing for this L1 and both are counter-examples
      rather than examples. First, the folder-density gate's grandfather is
      "accidentally total" — it derives the before-state from a source that already
      includes the pending change, so before always equals after and the refusing
      branch is unreachable. A grandfather that tolerates everything forever is
      indistinguishable from no standard, and it reports a reassuring block of text
      while doing it. Second, the fixture-bloat gate ships an exception list that is
      currently empty, and the census's own judgement on filling it is "prefer the
      ratchet; a path list of 266 entries rots the moment a file is renamed".
  - path: docs/acceptance-criteria/ac-store/ACS-1100-honest-coverage-answers/ACS-1100.yaml
    relationship: related
    status: exists
    relevance: >-
      INHERITED, NOT DUPLICATED. The tolerated count this L1 publishes is an answer
      about a body of records and is bound by ACS-1100's standing rule: state the
      total it was measured against and what was excluded. A tolerated count that
      shrinks because the denominator moved is the failure ACS-1100 exists to
      prevent, and it would read here as progress.
