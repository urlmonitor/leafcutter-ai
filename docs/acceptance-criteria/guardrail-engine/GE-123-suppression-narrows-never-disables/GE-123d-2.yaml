estimated_complexity: M
it_requirements:
  - "The location gate must be anchored at the repository root and evaluated against the repository-relative path. The existing prose-prefix test in the pre-commit check accepts a prefix that appears at any depth, so a nested directory whose name happens to equal a prose-location name inherits the exemption today. Reusing that matching form for the new gate would import the same silent inheritance the AC forbids; the new gate must not."
  - "The five locations and the four admitted kinds must each be held as named, closed data at a single site, separator-normalised once rather than enumerated twice for POSIX and Windows spellings. Extending either list must be a one-line deliberate edit."
  - "The kind gate must be decided from the final extension of the staged path only, compared case-insensitively; a compound suffix resolves to its last component, and a file with no extension is never admitted. Unadmitted means reported — the closed list fails closed in both directions."
  - "Location, kind and value shape must be evaluated as a conjunction per finding. No file-level short-circuit and no caching keyed on anything coarser than the individual finding: GE-123d-3 and GE-123d-4 both depend on the per-finding granularity and are unsatisfiable without it."
  - "The exemption decision must carry the NAME of the shape that granted it back to the caller. A boolean-only decision does not satisfy the delivers_to contract, because GE-123d-5 has to report which shape was responsible."
  - "The project-identifier shape must reuse the one recogniser the high-entropy path already applies to ticket-identifier and epic-name tokens, referenced from a single definition. A second, independently written recogniser is the mechanism by which two rules come to disagree about the same token, which the second scenario exists to prevent."
  - "The path form must be normalised before the location gate runs. The hook receives repository-relative paths from git diff --cached, whereas the scanner CLI may be handed absolute or dot-slash-prefixed paths; the same file must receive the same verdict from either entry point."
  - "The rule reports at most one finding per line, so when a line contains more than one credential-keyword match the exemption may be granted only if every match on that line is a recognised non-credential shape. Granting on the first match alone lets a real credential ride in beside a placeholder."
  - "The value-shape decision must be computed from the full matched value, not from the 120-character-truncated finding excerpt the post-filter reads today (same constraint as GE-123d-1, and it must be satisfied by the same shared mechanism rather than solved twice)."
  - "Adding the changelog area is a deliberate widening beyond the existing high-entropy location list. It must be introduced as a named entry in the location data with the reason recorded alongside it, not as an unremarked extra string."
  - "Per-finding cost must stay proportionate to a pre-commit hot path: no extra file reads, and no matcher whose worst case is superlinear in line length."
  - "ADR-001 parity: edit the canonical copies under templates/ and verify through the build.py round-trip; never hand-edit the deployed copies under scripts/ or .leafcutter/."
delivers_to:
  agent: python-coder
  contract: "A per-finding exemption decision for the generic-credential rule, expressed as the conjunction of a closed location list, a closed file-kind list, and a closed value-shape list — never a file-level exemption. GE-123d-3 depends on the per-finding granularity; GE-123d-4 fixes the location boundary; GE-123d-5 announces each decision this makes."
expects_from:
  ac_id: GE-123d-1
  contract: "The named value-shape vocabulary, of which this AC consumes the prose-scoped shapes (whitespace, bracketed placeholder, masking characters, project identifier) while GE-123d-1 owns the one file-reference shape that applies everywhere."
