notes: |
  FOURTH TESTING-QUALITY AXIS — about the COST of getting a verdict, not its
  truthfulness. Deliberately distinct from its four siblings; do not fold it
  into any of them:

    - TQ-100 (trustworthy test gate) governs WHICH failures are allowed to
      block main. Says nothing about how long the run takes.
    - TQ-300 (tooling coverage recovery) governs whether the package's own
      tooling is tested AT ALL. A coverage question, not a latency one.
    - TQ-400 (durable done proof) governs whether a done record is still
      provable LATER. Re-checking over time, not speed of one run.
    - TQ-500 (checks that can fail) governs whether a passing test COULD have
      failed. Mutation-style proof strength, not runtime.
    - TQ-600 (this goal) governs whether the verdict arrives soon enough to be
      part of the loop. A suite can be perfectly trustworthy under all four
      siblings and still be useless because nobody waits 90 minutes for it.

  Evidence gathered at authoring time (2026-09-21, origin/main 624d39ac),
  measured on this workspace rather than estimated:
    - A full run is 5387.62s (1:29:47): 5292 passed, 2 failed, 5 skipped,
      19 xfailed, 96 collection errors, 5318 tests collected.
    - The top 60 tests account for 3404s — 63% of total wall clock in 1.1%
      of the tests. The cost is extremely concentrated, so a small number of
      targeted changes recover most of the time.
    - One `python scripts/build.py --target-dir <tmp>` measures 59.8s. That
      is the unit of cost.
    - There are 77 `--target-dir` real-build invocation sites across 52 test
      files. 77 x 59.8s is approximately the entire observed runtime.
    - The suite contains ZERO `scope="session"` fixtures and only 15
      module-scoped ones. Everything else is function-scoped, so a test that
      merely needs to READ a deployed layout rebuilds one from scratch.
      The 206.74s and 73.03s entries in the duration table are fixture
      `setup`, not `call` — pure repetition.
    - `unit_tests/test_bp_900g_8_ii.py` alone is ~10.5 min across four tests
      (each runs a three-state build).
    - Collection is 5.33s and the `pytest_ac_enforcement` plugin only fires
      on failures — neither is a contributor. Ruled out by measurement, not
      assumption.
    - pytest-xdist is not installed and not in requirements-dev.txt; the
      workload is process-spawn-bound and parallelises well.

  Measurement caveat recorded honestly: the run shared a WSL host with other
  agent activity, so the absolute 5387s may be inflated. The concentration
  finding (63% in 60 tests) and the measured 59.8s build are independent of
  host load and are the figures the children should be specified against.

  Namespace rationale: filed under testing-quality as a sibling of TQ-100 /
  TQ-300 / TQ-400 / TQ-500 because the subject is the usability of the test
  suite as a safety net. It carries build_pipeline as a secondary component
  because the dominant cost driver is build.py, which the fix must touch.
