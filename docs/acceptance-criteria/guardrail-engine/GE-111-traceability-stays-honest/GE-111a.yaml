title: "Get stopped when a refactor breaks a requirement's link to its code"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  A commit that breaks an AC-to-code link is blocked until the link is honest again.

  When a commit moves, renames, or deletes source that an acceptance criterion
  claims to satisfy, the commit is stopped with a clear, actionable message naming
  the affected criterion and the link that no longer holds — so a broken link can
  never silently reach the repository.
