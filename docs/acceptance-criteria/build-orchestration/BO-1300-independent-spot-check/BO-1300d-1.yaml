created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300d.yaml"
criteria: |
  Given a feature has been built through /build-feature and all of its tickets are
    implemented and merged
  When the build reaches its closing steps
  Then the same three-reviewer spot-check pass used by the on-demand command runs
    automatically against the just-built feature, without the user having to ask for it
  And the spot-check pass runs AFTER the feature's tickets are implemented and merged
  And the spot-check pass runs BEFORE the feature is declared done
  And the automatic run dispatches the same three distinct-angle reviewers exercising the
    feature (it reuses the shared spot-check pass rather than a separate copy of the logic)
