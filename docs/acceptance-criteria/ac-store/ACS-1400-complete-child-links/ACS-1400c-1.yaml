notes: |
  THE DELIVERABLE OF THIS L1 IS THE ADJUDICATION, NOT THE WRITE — and this is the
  record that says so. Every other AC under ACS-1400c describes a way of not
  doing damage; this one describes the thing that is actually produced.

  THE LAST Then IS THE MOST IMPORTANT LINE IN THIS RECORD. "Done" is NOT zero
  gaps. A store where the check reports labelled deliberate exclusions is a
  healthy store. Any criterion binding success to a count of zero would force the
  six wrong repairs in order to achieve it, and the six are precisely the records
  the store paid a hook bypass to create. Written this way, a pass that repairs a
  handful and states a reason for leaving the rest is a complete success.

  ABSTENTION IS REPORTED, NEVER SILENT. A record left alone must appear in the
  report naming the record and the reason. A silently skipped record is invisible,
  and invisibility one level down is the same defect this entire tree exists to
  remove.

  RE-MEASURED 2026-09-08, AND THE ARITHMETIC IS WORSE THAN "MOSTLY SAFE". Running
  the real scan and classifying each parent's coverage list by whether its entries
  resolve to real records: 12 of the 47 sit under a parent with an empty coverage
  list, 25 under a parent whose entries resolve to nothing at all, and 10 under a
  parent that already names other real children. Cross-cutting that, three of
  those 10 sit under parents that are themselves retired and two more are retired
  children of an active parent, so the unambiguously-safe repair population is
  smaller still. An implementation that promises to clear 47 is promising the
  damage.

  NO FIGURE APPEARS IN THE CRITERION, DELIBERATELY. Inherited from the L0: a
  criterion pinned to a number is falsified by the next commit that changes it,
  and every population above is described by a signal on the record rather than
  by a checked-in list of ids.

  NOTHING IN THIS TREE WRITES THE FINISHED-STATE FIELD — see ACS-1400c-3-i, where
  the refusal is made falsifiable.
