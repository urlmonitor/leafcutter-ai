id: TQ-500g-3-ii
components:
  - testing_quality
  - build_orchestration
title: "An existing test that ran before the work and is now skipped, expected to fail, or gone stops the work"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given five tests that existed and passed before the work began, and after
    the work —
      A: test_refresh_skips_when_not_due is marked to be skipped,
      B: test_retry_caps_at_five is marked as expected to fail,
      C: test_export_header no longer exists,
      D: test_refresh_runs_when_due still runs and passes, with one assertion
         added,
      E: test_legacy_cron_refresh no longer exists, because the requirement
         removes the legacy cron refresh it tested, and the sweep list names
         it with that reason,
  When the work's tests are checked before commit,
  Then the work stops, naming A, B and C as existing tests weakened by the
      work, each with what happened to it: skipped, expected to fail, removed,
    And D is not reported,
    And E is not counted as weakened, and appears in the hand-off as removed
      with the reason the sweep list gives,
    And the decision is taken from running the tests before and after the work,
      never from reading the writer's list alone.
depends_on:
  - TQ-500g-3
  - TQ-500g-1-v
  - TQ-500g-1-vi
