criteria: |
  A stable, opaque identity that never changes for the life of the requirement.

  Each requirement is assigned a unique identifier when it is created — handed out
  in sequence and meaning nothing more than "this requirement" — so its name stays
  the same no matter how the tree around it is later reshaped.
