criteria: |
  Given the read side of the index (the reader and its mandatory staleness guard) is
    present, but the writer that builds and refreshes the index is disabled, so no
    index file is ever produced
  When an index-backed read is requested
  Then the read finds no index, falls back to the live full parse per KM-KGS-100b-9,
    and returns correct results
  And enabling only the reader can never surface stale or wrong data, because with no
    index present every read is a live parse
