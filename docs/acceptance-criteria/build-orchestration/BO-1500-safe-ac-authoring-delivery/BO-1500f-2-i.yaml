notes: |
  BO-1500f-2 states that no two live runs resolve to one workspace. This leaf covers the
  case that defeats a naive implementation of that rule: both runs looking first, both
  finding nothing, and both then creating -- or adopting -- the same workspace.

  Re-homed 2026-08-14 from BO-1500a-9-i to BO-1500f-2-i by the Pattern C intermediate
