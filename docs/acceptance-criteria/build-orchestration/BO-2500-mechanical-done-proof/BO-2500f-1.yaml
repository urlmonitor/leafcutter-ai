it_requirements:
  - 'FIELD NAME AND SHAPE (confirmed by the IT PO). Top-level key verified_by: an object with
    method: check | inspection. Check form: check (the repo-root-relative path of the check''s
    SOURCE file, e.g. templates/scripts/..., never the deployed .leafcutter/ copy; ADR-001)
    and wired_as (''pre-commit:<hook-id>'' or ''build-phase:<scripts/build.py phase name>'').
    Inspection form: gate_run (the workflow run id whose interactive gate recorded the person''s
    approval, e.g. ''pf-20261025-0912''; BO-2500f-3-i), statement (non-empty string), and
    inspected (a non-empty list of {path, blob}, blob a 40-hex git blob sha). There are no
    free-text reviewer keys; the review date comes from the tracked approval file docs/acceptance-criteria/_inspections/<gate_run>.json
    at mark time, and a date key, if present, must match it (BO-2500f-3-i). gate_run on a
    check, or check or wired_as on an inspection, is a cross-method part.'
  - 'Declare verified_by in config/ac_store_schema.json (top-level additionalProperties is
    false, so the store refuses the key until it is declared). Declare the shape permissively,
    with no if/then and no required keys at the JSON-schema level: validity is decided at
    mark time (user decision 2026-10-25), and a write-time rule would refuse about 170 unfinished
    test-free records.'
  - 'One validator returns a typed verdict {valid: bool, method, problems: [{part, message}]},
    consumed by BO-2500f-1-i, -2, -3 and -4. It never raises on malformed input (not a mapping,
    wrong types, unknown method); each problem names the part.'
  - Called only from mark-time paths (the shared done rule of BO-2500f-4). check-ac-schema
    and requirement_rule_check never call it, so writing or changing a record is never refused
    on these grounds (user decision 2026-10-25, BO-2500f-1).
  - A misplaced record (verified_by with test_required true or absent) is reported and never
    changes that record's verdict.
  - Every new module under scripts/ac_store/ is added to build_ac_store's deploy_map in scripts/build_phases_ac_store.py,
    and its import is proven in the DEPLOYED .leafcutter/ layout, not only the source tree
    (the BO-2500a-1-ii ModuleNotFoundError precedent).
  - Stdlib only; under the 400-line check-file-size limit.
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: its verification record must state exactly one method, check or inspection, and
      any other method value is refused, naming the value
    needs_test: true
    reason: The method set is closed, and an unknown method accepted silently would let any
      value waive the test.
  - clause: a check record must name the check that verifies the requirement and how that
      check runs in everyday work, either as a named commit-time hook or as a named build
      phase, and is refused when either is missing
    needs_test: true
    reason: A missing check or wiring part is a refusal the shared rule depends on, and each
      missing part needs its own case.
  - clause: an inspection record must reference the workflow run whose interactive gate recorded
      the person's approval of the review, a statement of what the review confirmed, and every
      inspected file each paired with the content fingerprint of the exact version inspected,
      and is refused when any of these is missing or the file list is empty
    needs_test: true
    reason: Each inspection part (gate run reference, statement, file list) is required, and
      an empty file list is the edge a truthiness check is most likely to accept.
  - clause: a verification record that carries a part belonging to the other method (a gate
      run reference on a check, a hook on an inspection) is refused, naming that part
    needs_test: true
    reason: A part from the other method, such as a gate run on a check, is a shape error
      a per-method validator ignores; only a mixed record shows it is refused.
  - clause: a record with no verification record at all is refused, naming the missing record
    needs_test: true
    reason: A record with no verification record must be refused, not treated as having nothing
      to check.
  - clause: each refusal names the record id and the missing or wrong part
    needs_test: true
    reason: Every layer and guide reports this text, and a message without the record id cannot
      be acted on.
  - clause: a verification record on a record whose test_required is true or absent never
      waives the test that record owes, and is reported as misplaced
    needs_test: true
    reason: A verification record must never relax a record that owes a test; test_required
      true plus a valid record shows the verdict is unchanged.
  - clause: the stated reason required by BO-2500a-8-i is still required; the verification
      record is added to it, not substituted for it
    needs_test: true
    reason: Dropping the stated reason once a verification record exists would silently weaken
      wave 1; a valid record with no reason shows it is still refused.
  - clause: 'none of these refusals is made when a record is checked without being marked
      done: the check of an unfinished record with a missing, incomplete or invalid verification
      record passes, so the roughly 170 unfinished test-free records remain editable before
      they have a verification record'
    needs_test: true
    reason: 'Silence outside marking is behaviour: committing an unfinished record with an
      invalid verification record must pass check-ac-schema.'
delivers_to:
