criteria: |
  Given the category record behaviours DK-500c-1 to DK-500c-3,
  When a reader opens the criterion category reference,
  Then it lists every field of the record with its type and meaning, and separates authored fields from derived views (the usage count, the member view, the reverse replaces list),
  And it states the identity rule (repository id, kind criterion_category, category id), the id scheme and that a label edit, merge or split never changes an id,
  And it states the lifecycle and approval rules, the membership rules and the publish checks,
  And it states where staged and published records live, marking each item the user has not yet confirmed as pending.
