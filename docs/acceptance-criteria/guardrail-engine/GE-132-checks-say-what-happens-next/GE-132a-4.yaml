change_target: code
risk_surface: contract_boundary
notes: |
  DECIDED BY BRAINCANDY, 2026-10-12 (option 1): the registration-parity and validity legs
  judge the committed package table, the file being changed in this repository, never a
  gitignored local copy.

  OBSERVED 2026-10-12. The local table is gitignored and the build writes it only when it is
  absent, so an existing install never receives a newer seed. In a self-hosted checkout built
  before GE-132a-2, the stale local table's mechanical-autofix rules had null agents, and
  check-hook-parity refused a commit on nine checks that the committed table declared
  correctly. Deleting the local table and rebuilding cleared it.

  HOW THIS COEXISTS WITH GE-132a-1's OLD-INSTALL FALLBACK. Two different questions, two
  different tables.
    - "Is the package's own declaration table correct?" is asked at commit time, of the file
      being committed. Only the committed table can answer it. A local copy is not part of
      the commit and cannot make it pass or fail.
    - "What should happen next for this project?" is asked at run time: check-complexity's
      refusal text (GE-132a-3) and the BO-3800 run. These keep the shared loader's view,
      local table first, seed per missing declaration. That is the fallback GE-132a-1 exists
      for, and it is unchanged.

  OUT OF SCOPE, FLAGGED. A consumer repository tracks no package table, so this record does
  not change what the commit-time legs read there. Whether a consumer's commit-time
  judgement should read the deployed seed is a separate decision.

  NAMED MUTATIONS.
  (1) THE LOCAL JUDGE: the commit-time legs keep reading the merged view. MUST GO RED: arm
      one. MUST STAY GREEN: arm three.
  (2) THE MASK: the committed table is judged only where the local table declares nothing.
      MUST GO RED: arm two.
  (3) THE OVERREACH: fix it by pointing the shared loader at the committed table. MUST GO
      RED: arm three.
