it_requirements:
  - "The two findings must be separable by a caller that reads the report structurally rather than by eye. They have different remedies - a check with no entry is a decision the author must make, an entry with no check is cleanup - and an undifferentiated mismatch report makes the reader reconstruct which is which."
  - "This finding must warn and must not block, because a removal in progress legitimately produces it mid-change. Blocking here would make the parity check obstruct the very operation that creates the state."
  - "The comparison must be run in both directions over the same pair of populations - manifest and roster - rather than by a second independent traversal. Two traversals are two enumerations and they drift, which is the shape this L1 exists to close."
  - "The parity check must be run out of process over an isolated fixture tree, never against the repository's own manifest or roster."
  - "This direction is unobserved. It is specified as a consequence of making the roster a checked enumeration, not as a defect anybody has reproduced, and nothing in the implementation or its documentation may present it as an observation."
  - "Error handling must follow the four rules in CLAUDE.md."
test_spec:
  - name: test_roster_entry_naming_an_absent_check_is_named_by_the_parity_check
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_hook_parity.py"
    description: "A fixture roster carrying an entry for a check the manifest does not contain causes the parity check to name that entry and state that its check is absent from the manifest."
  - name: test_a_sound_roster_entry_is_not_named_in_the_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "In the same fixture tree, a roster entry naming a check the manifest does contain is absent from the report - the discriminating control against a parity check that names every entry."
  - name: test_the_two_directions_are_reported_as_distinguishable_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "A fixture tree carrying both a check with no roster entry and a roster entry with no check yields two findings a caller can tell apart structurally, not one undifferentiated mismatch report."
  - name: test_a_stale_roster_entry_warns_and_does_not_block
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "The outcome value with a stale entry present equals the outcome value over a clean fixture set, so a removal in progress is not obstructed by the check that reports it."
test_rationale: |
  Both halves of this record are negative or comparative and neither is covered by the
  obvious positive test. A parity check that names every roster entry passes the first
  descriptor and fails the second; a parity check that names none passes the second and
  fails the first. The third descriptor is the one that carries the record's actual
  content — the two directions have different remedies, and an implementation that emits
  one undifferentiated "these lists do not match" message satisfies both of the first
  two while leaving the reader to reconstruct which is which by hand, which is the work
  the finding exists to save. Running out of process against an isolated fixture tree
  matters more here than elsewhere because the alternative is mutating the repository's
  real roster.
