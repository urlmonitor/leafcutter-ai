notes: >-
  Evidence, observed 2026-09-14: the canonical worktree-setup script labels every branch it
  creates as a feature, regardless of the kind of work asked for -- fixes, chores and
  hotfixes are all silently relabelled. An agent that reports having created a fix is
  therefore simply wrong, and the operator acts on a name that does not exist. Two arms,
  both required and separately failable: the workspace is made for the KIND of work
  requested, and the account given of it AGREES with what was made. The second arm matters
  on its own -- a caller that reads the name out of the tool's own reported output is
  already the rule for one workflow (BP-600a-2) but is no help when the tool's own output
  is the thing that is wrong. Distinct from BO-3600, which is about two written records of
  the system disagreeing with each other (delivery state vs known defects), not about a tool
  misreporting what it just did; and from BO-300c, which governs the form of the finalize
  instruction printed at the end of a drive, not the branch that was created at the start.
