readiness: approved
priority: medium
title: "Ticking a filter value narrows the results, shows a removable chip and recounts every option, zero values staying listed"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/ux-prototyping/UXP-617-atlas-flow-finder/UXP-617.yaml
criteria: |
  Given /flows?q=selected+option lists 5 flows and 27 steps,
  When the person ticks 'Person' under Actor,
  Then the summary reads '2 flows, 5 steps match' and only steps a person runs are listed,
  And an 'Actor: Person' chip with a button named 'Remove filter Actor: Person' and a
    'Clear all' link appear above the results,
  And the Actor filter shows Code 5, AI agent 1, Person 2 and Jev 0, the Jev option staying
    listed but disabled,
  And ticking 'Code' as well lists the steps run by a person or by code, because values
    combine with OR within one filter,
  And a value ticked in a second filter narrows the list further, because filters combine with
    AND,
  And 'Clear all' removes every filter value and keeps the search 'selected option',
  And the filter panel offers Product, Actor, Kind, Realization, Level, Uses field, Produces
    field, I/O, Entity and Screen, the Uses field and Produces field options being picked by
    typing a field name.
depends_on:
  - UXP-617-1
  - UXP-617-1-i
