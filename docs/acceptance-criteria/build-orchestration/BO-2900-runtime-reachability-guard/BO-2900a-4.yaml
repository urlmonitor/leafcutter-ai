roadmap_phase: phase_1
criteria: |
  Given the entry-point condition on done eligibility is in place,
  When an author whose criterion has just been refused consults the project's
    task-oriented documentation,
  Then a how-to guide shows how to convert a proof that imports the code under proof
    directly into one that drives the same behaviour through the unit's way in,
    And it states the two distinct refusals an author can receive — the proof did not
      go in the real way, and nothing reaches the code at all — and which action
      clears each,
    And it states that adding another passing test clears neither,
    And it names the recorded exemption as the route for a unit that legitimately has
      no way in, and points at the exemption's own documentation rather than
      restating it,
    And it warns that a proof written to name the way in without invoking it does not
      satisfy the condition, because the judgement comes from the run.
