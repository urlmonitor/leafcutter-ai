id: TQ-200d-1-ii
components:
  - testing_quality
  - documentation_system
title: "Every produced-tests assertion kind is described on one reference page that a test keeps in step with the scorers and the agent templates"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the produced-tests eval scores the test-writer, sql-test-writer,
      test-designer and test-runner rows by assertion kinds, and today those
      kinds are listed only by name in the eval README,
  When the produced-tests assertion-kinds reference (a hub page and its family
      pages) is written,
  Then the assertion-kinds reference (a hub page and its family pages) has
      exactly one entry per registered assertion kind, counted across the hub
      and its family pages together with no kind on two pages, and each
      entry states: which agents' sets use it, what it reads (produced test
      files, the completion report, the recorded commands, the to-run-later
      file, or a wrong-version run verdict), what makes it pass and what makes
      it fail, one passing and one failing example, and the agent-template
      sentence it checks, quoted word for word with the template it comes from,
    And a test fails when a kind is registered with no entry in the
      assertion-kinds reference (a hub page and its family pages), or the
      assertion-kinds reference (a hub page and its family pages) has an entry
      for a kind that is no longer registered,
    And a test fails when a quoted template sentence no longer appears, word
      for word, in the template it is attributed to,
    And the eval README's produced-tests section links to the assertion-kinds
      reference (a hub page and its family pages) instead of repeating the list
      of kind names, and the reference index lists the hub with one line.
depends_on:
  - TQ-200d-1
