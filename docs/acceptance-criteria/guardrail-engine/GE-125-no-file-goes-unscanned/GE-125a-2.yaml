notes: |
  THIS IS THE MANDATORY CONTROL, NOT OPTIONAL HARDENING. The cheapest wrong
  implementation of this L1 narrows the entitlement to nothing: it makes every
  measured row of GE-125a-1 pass, closes the reported symptom, and is
  indistinguishable from deleting the reduced scrutiny outright. The L1's own
  notes name the consequence — the false positives GE-123d exists to remove come
  straight back, and the pressure that makes people write suppressions comes back
  with them. Without this record the change cannot be told apart from a deletion,
  so GE-125a-1 and this one must be read, and closed, as a pair.

  ALL FOUR ARMS ARE GREEN ON ARRIVAL, AND THAT IS THE POINT. Say it plainly so a
  later red-baseline check does not misread this record as untested or as
  evidence that the change landed. At these four paths the current behaviour is
  already the wanted behaviour; nothing here is red today and nothing here should
  ever go red. A control's job is to fail if the change goes too far, so this
  record earns its place by what it forbids, not by what it demonstrates. It is
  therefore not admissible as proof that GE-125a-1 landed, and GE-125a-1 is not
  admissible as proof that the entitlement survived.

  WHY EVERY CHOSEN-LOCATION FIXTURE IS A WRITTEN FILE OF AN ADMITTED KIND,
  deliberately. GE-125b governs whether a file at a chosen location keeps the
  entitlement once its kind is taken into account, and the answer it is heading
  for is that only admitted prose kinds do. If this record asserted that an
  executable file under templates/skills/ stays exempt, it would freeze the
  behaviour its sibling exists to change and the two would collide. Every fixture
  here is prose of an admitted kind, so every arm stays true after GE-125b lands
  as well as before. Do not add an executable fixture to this record to
  "strengthen" it.

  THE ACCEPTANCE-CRITERIA FIXTURE MOVED FROM .yaml TO .md ON 2026-08-25, FOR
  EXACTLY THE REASON ABOVE. This record originally used a store record,
  docs/acceptance-criteria/guardrail-engine/GE-999.yaml, and asserted it silent.
  Then the product owner decided that the acceptance-criteria store SHALL be
  scanned for opaque credentials and the admitted-kind list narrowed to .md and
  .txt — so that fixture would have asserted a silence its sibling GE-125b-1-i
  now asserts is a finding, which is the collision this record's own fixture rule
  exists to prevent. It is now
  docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md: same chosen
  LOCATION, admitted kind, real shape of file. Note what did NOT change — the
  location list still has exactly four members and docs/acceptance-criteria/ is
  still one of them. Only the kind gate narrowed, and this record is a control on
  the LOCATION invariant, not on the kind list.

  THE FOURTH ARM IS THE SECOND HALF OF THE CONTROL. KI-SEC-001 states the scope
  precisely — the entitlement gates the opaque-token rule only, and the keyword
  and fixed-prefix rules still fire at these paths. A change that anchored the
  match at the top of the project and, in passing, widened the entitlement to
  every rule would pass the first three arms while opening a hole far larger than
  the one it closed.

  FOR THE IT PO. The token must be assembled at runtime from fragments rather
  than written as a source literal, for the reason recorded on GE-125a-1, and the
  three additional credential shapes in the fourth arm carry the same constraint
  and more sharply. Per this repository's standing rule for gate and hook
  criteria, every arm must EXECUTE the check: a grep of the check's source for
  the four chosen names would pass whether the entitlement still applied or not,
  which is the one thing this record exists to distinguish.
