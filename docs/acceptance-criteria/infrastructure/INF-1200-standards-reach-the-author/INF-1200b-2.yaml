id: INF-1200b-2
title: "Strip every standard an author could have written into a specialist's instructions and every specialist is still correct"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the standards the project declares, and the specialists the ownership
    record assigns kinds of file to,
  When every reference to a standard, a kind of file's standard, or a figure of
    a standard is removed from the instructions their authors write, the
    declaration is left untouched, and the project is put back together,
  Then every specialist still begins work with the standards for the kinds of
    file the ownership record assigns it stated in its material, unchanged from
    what it was before the removal,
  And given the declared value of one of those standards is then changed, with
    no authored instructions touched,
  When the project is put back together again,
  Then every specialist that owns the affected kind of file begins work with the
    changed standard stated in its material,
  And given a specialist is newly added to the ownership record as an owner of a
    kind of file that carries a standard, with no authored instruction of its own
    mentioning any standard,
  When it begins work,
  Then that kind of file's standards are stated in its material, so being
    informed is a consequence of being an owner rather than of somebody having
    remembered.
depends_on:
  - INF-1200b
