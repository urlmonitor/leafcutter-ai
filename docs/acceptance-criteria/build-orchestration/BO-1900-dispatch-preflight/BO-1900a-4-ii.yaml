id: BO-1900a-4-ii
components:
  - build_orchestration
title: "A plan reply the drive cannot use holds the ticket back, and is never read as a ticket with no work left"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a drive about to work a ticket, which first asks for that ticket's plan of
    phases,
    And in the first case the reply is one the drive cannot use -- in one shape no
      reply is returned at all, in another the reply is not a usable record, and in
      another it is a usable record that states no ordered list of phases either way,
    And in the second case the reply is usable and does state its ordered list of
      phases, and every phase in that list is already signed off or marked not needed,
  When the drive decides what to do with that ticket,
  Then in the first case every one of those shapes produces the same outcome: the
    ticket is held back, no phase agent is spawned for it, its recorded lifecycle state
    is left exactly as the drive found it, and the drive reports it as held back naming
    the plan reply as the reason,
    And in no shape of the first case is the ticket reported as having no work left,
      nor carried forward into a completion decision,
    And in the second case the ticket is not held back: it is carried forward to its
      completion decision and settled there on the evidence its phases carry,
  So an unusable answer about what a ticket needs is an unanswered question that stops
    the drive, and never an answer that the ticket needs nothing.
