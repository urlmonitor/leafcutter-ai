notes: |
  Must ship together with ACD-2400c. Recording intent without anything that turns it
  into a test design would leave the test writer with less guidance than today.
  Existing requirements that already carry a planner-written test design need a
  stated treatment (kept as-is, or treated as intent) -- the BA should decide and
  write it down.
