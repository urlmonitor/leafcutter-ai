title: "A requirement's UID survives a re-home unchanged"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement with stable UID 42 whose parent is the requirement with
    UID 10,
  When the requirement is re-homed so that its parent becomes the requirement
    with UID 25,
  Then the requirement still reports stable UID 42 after the move,
  And every other requirement that referenced UID 42 (via a dependency,
    coverage, or contract link) still resolves to the same requirement,
  And no rename or reference rewrite was required to keep those links resolving.
