notes: |
  Decomposed from ACS-800a. The never-changes / never-reused guarantee. Combines
  with the reservation rule already in ac-schema.md ("If an AC is deprecated, its
  ID remains reserved") — here the reserved unit is the opaque UID rather than the
  position-encoded id string.
