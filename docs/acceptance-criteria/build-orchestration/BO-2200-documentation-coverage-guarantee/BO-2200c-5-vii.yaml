id: BO-2200c-5-vii
title: "The writer dispatched by a build can author the brief's docs itself, because the build cannot give it anyone to delegate to"
component: build-orchestration
components:
  - build_orchestration
  - documentation_system
status: active
level: L3
req_status: draft
work_status: done
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a build-feature drive over a doc-required ticket whose "## Agent Contracts" ->
    "### documentation-expert" block lists at least one required doc,
    And build-feature dispatches every phase as a flat depth-1 agent, so the
    documentation-expert phase agent has no Agent tool and cannot spawn a specialist,
  When build-feature dispatches the documentation-expert phase for that ticket,
  Then the prompt sent to that dispatch carries a leaf-mode instruction stating that this
    dispatch cannot spawn sub-agents, and that for each required doc in the Agent Contracts
    documentation-expert block the agent must classify intent as its template prescribes,
    pick the specialist (how-to-author, reference-author, explanation-author, adr-author,
    architecture-diagram-author or architecture-author), read that specialist's agent template
    (.claude/agents/<specialist>.md in the worktree, falling back to
    templates/agents/<specialist>.md) and its canonical how-to, and author the doc itself
    following that specialist's rules,
    And the instruction states that, for this dispatch only, it overrides the template's
    "never write or edit a doc file yourself" rule,
    And the instruction forbids returning status handoff to a specialist that is not a key of
    the ticket's agents map, directing the agent to author that doc instead.
  And given the same drive,
  When build-feature dispatches any phase other than documentation-expert (for example
    pr-reviewer),
  Then that phase's prompt does not carry the leaf-mode instruction.
  And the bug symptom ("Every build-feature drive halts tickets at the documentation-expert phase. On run wf_5c31f1a2-e27 (EPIC-EveryPieceOfSeparateWorkGetsItsWorkspace) 4 of 5 halted tickets stopped there (05, 06, 44 with status blocker; 08 with a handoff to adr-author that is not in the ticket's agents map). Each sign-off says the same thing: 'This dispatch exposed no Agent tool, so none of the Diataxis specialists (how-to-author, reference-author, ...) could be dispatched, and this agent must not author doc files itself.' So no doc is written and the ticket cannot advance.") must not occur
