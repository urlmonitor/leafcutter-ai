id: TQ-600a-13-ix
components:
  - testing_quality
title: "A hold check that could not read the flag fails and says so, rather than passing"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the check passes when it finds no open issue labelled `nightly-red`,
  And that "found no open flag" and "could not look" both end with no flag in hand, so a
    check that does not tell them apart passes every pull request whenever the read
    fails — the failure class this repository's guidance names three times, of a check
    that examined nothing looking like a check that found nothing,
  And that pull requests from forks are evaluated with a credential of reduced rights,
  When the read of the flag is refused for lack of authorisation or permission, returns
    not-found, is rate-limited, returns a server error, times out, fails to connect, or
    returns a body that is not a list of issues,
  Then the check fails, and its output states that the nightly flag could not be read and
    names the cause, in wording distinct from the output for an open flag,
  And the check never passes on any of those outcomes,
  And when a pull request from a fork is evaluated with a credential that can read the
    repository's issues, its verdict is the same verdict a pull request from the
    repository itself receives for the same flag state,
  And when the verdict has been computed but creating or editing the pull request
    comment of TQ-600a-13-vii is refused — the expected case for a read-only credential —
    the verdict is unchanged: a held pull request still fails, a passing one still passes,
    and the output notes that the comment could not be written,
  And a successful read returning an empty list is a pass, so the check is not satisfied
    by failing on everything,
  And each outcome is demonstrated by executing the check against a double that returns
    it, never by inspecting the check's error handling.
depends_on:
