notes: |
  WHY THIS IS ITS OWN RECORD RATHER THAN AN ARM OF GE-123b-1. Its parent asserts
  what the scan REPORTS; this asserts what the author is TOLD and what the run
  does not do. They fail independently: an implementation can decline the entry
  and report all four findings while saying nothing at all, and one can announce
  correctly while escalating to a hard error. The second failure is the more
  expensive of the two, because it fires on every commit in the repository.

  THE ANTI-PRECEDENT THAT MAKES THE TEST MANDATORY, carried through from GE-123c
  and the component context note. This component already contains a guard
  documented as dispatching a specialist that does no such thing — the path is a
  placeholder and it always reports success. A documented-but-dead correction
  path is worse than none, because authors believe they are covered. This
  criterion claims the author is told something, so it needs a test proving the
  message actually reaches them on the real path a commit takes, not a test that
  the message string exists.

  MEASURED TODAY (2026-08-18): the collapse described in the parent produces NO
  output on the error stream and none on the findings stream — the file is
  silently unprotected. All three arms are red.

  ASSERT THE WARNING AS SEPARATE SUBSTRINGS — the allowlist path, the 1-based
  line number, the verbatim offending text, and the affected file name — rather
  than as one formatted string, so the contract is the information and the
  wording stays free to change. That is the convention -v's tests already use;
  follow it rather than starting a second one.

  IT-PO NOTE ON WHERE THE WORK ACTUALLY IS (2026-08-18): the loader discards
  every piece of provenance this warning needs. `_load_allowlist` returns an
  unordered `set` of (rule, path, line) 3-tuples — no allowlist file path, no
  1-based line number, no verbatim text — so the announcement cannot be produced
  at the decline point until the loader carries them. That return-shape change
  is the reason this record was re-estimated from S to M, and it is a signature
  extension with existing call sites in the module and in the existing
  suppression test module.
