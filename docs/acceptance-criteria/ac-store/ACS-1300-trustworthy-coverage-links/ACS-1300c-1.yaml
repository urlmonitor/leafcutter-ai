it_requirements:
  - "THE FINISHED-STATE FIELD IS NEVER WRITTEN, ON ANY PATH REACHABLE FROM THIS TREE. Refused, not deferred. This is not a phasing decision, it is not open to an implementer who notices how easy it would be, and no it_requirement anywhere in this tree licenses it 'when the evidence is strong' — the strength of the evidence is exactly what makes the write tempting and exactly why it is forbidden. Promotion stays with `scripts/ac_store/mark_ac_done.py` behind its own gate. TQ-400f was authored and closed unbuilt on 2026-09-01 partly for approaching this line."
  - "THE ELIGIBILITY VERDICT IS `done_proof.verify_done_eligible`'s, UNMODIFIED — THERE IS NO SECOND ORACLE. Do not adjust, post-filter, or re-derive eligibility inside the repair. A repair that formed its own verdict would be reading evidence it had just written, under a rule it wrote itself, and would drift toward whatever it had done. Note that ACS-1300a-1 also names `done_proof` as the source of the tag scan; that is the same module used as one reader in two roles, not two oracles — do not fork a private copy for either use. CLARIFIED 2026-09-01 AGAINST THE BEFORE/AFTER CLAUSE: the pre-run and post-run verdicts the criterion requires are TWO CALLS to that one oracle, not a cached verdict reused as an answer. The pre-run verdict is retained solely to be compared with the post-run one and reported alongside it; it is never presented as the record's current state, and no verdict is ever stale-read in place of a fresh call."
  - "ELIGIBILITY IS A REPORT LINE AND NOTHING ELSE, AND IT IS COMPUTED TWICE. It must be structurally impossible for an eligibility verdict to reach a write path: no branch anywhere consumes one, and the only thing done with the list is printing it. CORRECTED 2026-09-01 — THE EARLIER FORM OF THIS REQUIREMENT SAID THE LIST IS 'PRODUCED AFTER ALL WRITING IS COMPLETE', WHICH THE AMENDED CRITERION NOW MAKES INSUFFICIENT: the verdict must be computed once BEFORE any write and once after, because the report has to state that the two are equal, and a run that only measures after writing cannot make that statement at all. Neither computation may gate, order, skip or otherwise influence any repair — the pre-run pass is an observation taken on the way in, not a precondition. Reporting 'this record is eligible and is not marked finished' remains one line of code away from marking it, which is why the report and the refusal live in one criterion: the implementer must not be able to ship the useful half without the restraint."
  - "`scripts/ac_store/cross_reference_audit.py::_apply_backfill` MUST NOT BE CALLED, WRAPPED, OR COPIED. Verified 2026-09-01: line 457 sets `ac_data[\"work_status\"] = \"done\"`, then re-serialises the record. It is a NAMED anti-duplication candidate in this tree's L0 and L1, so an implementer following the reuse advice carefully arrives at the forbidden write as a side effect of good advice followed well. Read-side helpers only: `_detect_worktree_root`, `_load_ac_yamls`, `_write_report`. `scripts/ac_store/backfill_components.py` is the safe write-side model."
  - "THE REFUSAL IS VERIFIED AT THE LINE, NOT AT THE VALUE. Compare the record's finished-state LINE character for character before and after, not the parsed value: a re-serialisation that preserves the value while re-quoting the line has still opened and rewritten the record, which ACS-1300c-2 forbids for a separate reason."
  - "THE PAIRING IS PART OF THE GUARANTEE, NOT PART OF ITS TEST. 'No finished state changed' is satisfied by a tool that does nothing, by a crashed run, and by a test that never invoked the tool. The refusal is only meaningful about a run that was demonstrably live and writing, so the implementation must not permit a globally-disabled write mode in which the refusal trivially holds."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md rules 1-4) and must fail toward not writing: an undetermined eligibility verdict is reported as an abstention (ACS-1300c-3), never resolved by a default."
delivers_to:
  agent: python-coder
  contract: "The post-repair eligibility list — records the done-proof oracle reports as eligible and which are not marked finished — offered as input to mark_ac_done and to nothing else. It is a report, never an instruction the repair executes. CORRECTED 2026-09-01: this list is NOT 'records whose verdict changed as a result of the restored links'. Restoring a link changes no verdict, because verify_done_eligible resolves from the direct tag first; the list is a standing inventory the repair happens to be well placed to emit, not an effect it produced."
