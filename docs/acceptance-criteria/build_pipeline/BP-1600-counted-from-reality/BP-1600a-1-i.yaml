notes: >-
  WHY THIS IS NOT PARANOIA, AND WHY IT IS SHARPER ON THIS SURFACE THAN ON THE OTHER ONE. The
  known-issues register already holds several guards that exited zero having examined
  nothing, and the store's own validator spent eight days reporting clean from a bare
  directory that matched no files. A census of the hook surface has two independent
  populations to resolve, either of which can come back empty, so it has two routes into that
  state on the day it lands. It also has a third route the sibling surface does not have: the
  hook directory and the settings surface are BOTH reached through symlinks into the
  installed tree, and resolving a path through those symlinks is the exact mechanism that
  made this surface's own worked example — the M9a guard — unable to match anything. A path
  constant aimed at the wrong side of that symlink produces a successful listing of nothing,
  which under a fail-open implementation is the greenest run the census can emit.


  TWO NUMBERS HERE, THREE IN TOTAL. The sibling contract on the commit-gate surface fixes its
  summary at four numbers. This surface has no registered-but-disabled state — a wiring that
  exists in the settings surface runs — so the base summary carries two: scripts examined and
  wirings read. BP-1600a-1-iii adds the third, the count of deliberately-unwired scripts, to
  the same line. That is a deliberate difference from the sibling and not an omission.


  THE EMPTY-WIRING-SECTION CASE IS THE ONE MOST LIKELY TO BE MISSED. A settings document that
  parses cleanly and simply has no wiring section is neither unreadable nor unparseable, and
  it is the natural shape of a consumer project that installed the package but has not yet
  received the settings file. Read as zero wirings it reports every installed hook as unwired,
  which is an avalanche whose natural remedy is switching the census off. Read as nothing to
  compare it reports clean while nothing whatsoever is running. Both readings are wrong and
  they fail in opposite directions, which is why the criterion requires the situation to be
  named rather than inferred from a count.
