notes: |
  The visibility half of GE-119d — the same rule as GE-119a-1, applied to the set-up path
  rather than to a check. Reporting comes before refusing (GE-119d-2) because a set-up that
  refuses without saying which step failed just moves the opacity.

  The exactly-once clause is drawn from a defect this project has already shipped: skip-branch
  step records were added while the unconditional record after the branch was left in place,
  so every skipped step double-recorded, and the structural test's pattern was blind to it.
  A per-step outcome report that miscounts is a report a reader stops trusting, at which point
  it protects nothing.

  IT-PO (2026-08-14): the ADR-001 triple for setup_ticket_worktree.py is verified to exist in
  all three locations; callers run the deployed copy. The remedy for the exactly-once clause
  is to CONDITIONALIZE the pre-existing unconditional record, not to add a second one.
