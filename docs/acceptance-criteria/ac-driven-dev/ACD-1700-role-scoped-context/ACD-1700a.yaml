criteria: |
  No cross-role noise -- a builder sees builder context, not authoring context.

  The context delivered to an agent at the moment it starts is scoped to its role.
  A coder does not receive requirement-authoring memory, the supervisor or
  finalize pre-drive checklist, or authoring-pipeline instructions that belong to
  other roles.
