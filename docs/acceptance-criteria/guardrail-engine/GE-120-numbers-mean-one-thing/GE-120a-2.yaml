notes: |
  THE FOURTH NAMESPACE, AND THE SECOND FAILURE SHAPE. GE-120a-1 covers "two unrelated artifacts
  claim one number". This covers "one artifact exists as two copies". The L1 deliberately holds
  both under one promise — "this number identifies one thing" — because a reader who follows a
  work-item identifier and lands on two files that disagree has suffered the same loss of trust
  as one who lands on two unrelated records. The mechanics differ, so they are separate L2s.

  WHY THE DECLARED STATE IS PART OF THE FINDING, not just the folder list: this repository's own
  convention (ticket-prioritizer, finalize-feature-archive-check) is that the declared state is
  authoritative and folder position is not. A finding that lists only folders leaves the reader
  to work out which copy is real; a finding that lists the declared states answers it. This also
  supplies exactly the input GE-120e-2's repair needs to pick a survivor.

  MEASURED 2026-08-17 (BA, independently): 333 work-item files, 328 distinct filenames, 5
  identifiers held twice — four as intake + completed, one as intake + active. Matches the count
  recorded at the PO stage.

  IT PO ADDENDUM (2026-08-17) — the BA's count is correct FOR ITS IDENTIFIER RULE, and the rule
  was never stated. Over `TICKET-*.md` basenames the answer is exactly five. Over bare basenames
  of every `*.md` under tickets/ the answer is dozens, almost all spurious (each epic contributes
  Master_Plan.md, 01_*.md, 02_*.md). Over epic-qualified paths a sixth real case appears:
  EPIC-MoveOnMainOnly is held by both tickets/99_done/ and tickets/99_rejected/ — one identifier
  in two TERMINAL folders that disagree. The identifier rule is therefore a required, explicit
  input to this AC, and the sixth case is reported to the user rather than folded into GE-120e's
  binding repair scope by an implementer.
