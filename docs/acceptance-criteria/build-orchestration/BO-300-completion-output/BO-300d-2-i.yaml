notes: |
  Double-counting is the quiet way a count stops being trustworthy: a report saying
  twenty while listing twenty-three across its causes leaves the operator with no
  number they can act on, and the arithmetic is back in their hands — the exact
  thing BO-300d-1 removes.

  The precedence rule in the second scenario is stated once, here, rather than in
  BO-300d-2, so the cause taxonomy stays a taxonomy and does not become an ordering
  puzzle inside its own record.
