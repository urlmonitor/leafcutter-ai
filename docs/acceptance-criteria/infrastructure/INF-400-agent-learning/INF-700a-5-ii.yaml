it_requirements:
  - "THE EMITTED-VERSUS-READ DIFFERENCE REQUIRES A SECOND LOOK AT THE SINK AFTER THE ROUTING STEP, AND THAT LOOK MUST NOT ROUTE. The figure is the count present at the END of the unit of work minus the count the routing step read. Obtaining it therefore means re-reading the sink late in the completion sequence, and the obvious shortcut — running the routing step a second time to see what is left — both routes the tail (defeating the deferral this AC describes) and adds a second set of writes after the publication has been made (defeating INF-700a-5). The late read must count, not drain."
  - "THE FINDABLE-BY-ASKING CLAUSE NEEDS A SURFACE THAT IS READ-ONLY BY CONSTRUCTION, NOT BY CONVENTION. The harvester's existing --dry-run flag is the nearest candidate and is nearly right — it skips capture_fn and skips the state write — but it also counts every dry-run record as outstanding, so it answers 'what would be routed' rather than 'what is waiting'. Whatever surface is chosen must not create the sink, must not write the state file, and must not watermark anything, and its no-side-effect property must be asserted by a test that checks the filesystem afterwards rather than by reading the code. This is the surface a person standing in a parked project uses, so it has to be safe to run when nothing else is running."
  - "THE WAITING COUNT IS INF-700c's COUNT, NOT A NEW ONE. The criterion requires a waiting record to contribute to the knowledge-waiting-to-be-written figure and requires that figure to return to zero once the record is written. Do not introduce a second counter for the tail: two counters that must agree will disagree, and the failure will present as the permanently non-empty backlog INF-700c forbids while both counters are individually correct."
  - "THE ZERO-ON-A-QUIET-PATH CLAUSE CONSTRAINS THE ORDERING, NOT JUST THE ARITHMETIC. The difference reads as a real signal only if it is genuinely zero when nothing emits after the routing step. Any implementation that itself emits during the completion sequence — a knowledge record about the routing run, a telemetry-shaped record written to the knowledge sink by mistake — makes the difference permanently non-zero and turns the figure into the background noise the criterion names. The routing step and everything after it must not write to the knowledge sink."
  - "Must handle errors gracefully per the project error handling policy. A failure to compute the difference must degrade to reporting that it is unknown, never to reporting zero — a fabricated zero is indistinguishable from a healthy path and is the exact silence this record closes."
delivers_to:
  agent: documentation-expert
  contract: "The emitted-versus-read figure and what it means now the sink outlives an isolated working directory — a record the routing step did not reach is waiting for the next completed unit of work, not gone — which INF-700a-4's reference must state, alongside the fact that an install has one sink shared by every working directory of it"
expects_from:
  - ac_id: INF-400c-4
    contract: "The build-time absolute declaration that makes one sink serve the whole install, which is what turns a late emission into a delay rather than a loss"
  - ac_id: INF-700a-5
    contract: "The durability outcome, of which this is the emitting half — the tail this AC counts is the residual that outcome leaves once the routing step is ordered ahead of the publishing phases"
origin_agent: business-analyst
created: 2026-09-07
amended_by:
  - reason: "BA rewrite, 2026-09-07, on BrainCandy's approved decision that the sink resolves against the repository. THE PREMISE THIS AC WAS BUILT ON HAS BEEN REMOVED, so the record is rewritten rather than patched. It previously required a late-emitted record to be reported as GONE, and forbade any surface calling it deferred, pending, outstanding or waiting, on the ground that the sink was created inside the working directory and reclaimed with it. That ground no longer holds: one sink now serves every working directory of a repository and outlives all of them, so the record is exactly what the old criteria forbade calling it. The old wording is now the wrong answer, and worse than merely stale — an implementation built to it would report a present record as lost and would stop looking for it. WHAT THE AC KEEPS: the emitted-versus-read difference, the requirement to name it rather than imply it, the three not-this assertions, and the zero-on-a-quiet-path clause. All four were about counting honestly and none depended on the record dying. WHAT CHANGED: the severity claim inverts from a loss to a delay; the report must now describe the record as waiting for the next completed unit of work AND be held to that by a later run actually producing the learning; a clause is added stating that such a record legitimately contributes to the waiting count, and that a count which rises and returns to zero is INF-700c's rule working rather than the manufactured permanent backlog it forbids; and a clause is added requiring an indefinitely deferred tail — a repository where nothing further completes — to stay findable rather than silent. WHY IT IS STILL WORTH HAVING AT ALL, now the outcome is benign: the difference is the only figure that distinguishes a routing step that read everything from one that read what happened to be there first, and the tail is unbounded at the end of a project. A delay nobody counts becomes a loss the first time nothing else completes."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA wording correction, 2026-09-07, same day. The entry above describes the sink as resolving 'against the repository' and serving 'every working directory of a repository'. That anchor was replaced later the same day by a build-time absolute path written into the deployed configuration, for reasons recorded on INF-400c-4 — chiefly that 'the repository' is ambiguous in a nested consumer install. The unit of sharing is therefore the INSTALL, not the repository, and the criteria, delivers_to, expects_from, one test descriptor and the notes now say so. NOTHING SUBSTANTIVE CHANGES FOR THIS RECORD: the property it depends on is that one sink outlives every isolated working directory of the project, which both anchors deliver and the new one delivers more directly. The inversion from loss to delay, and every reason given for it, stand exactly as written."
    by: business-analyst
    at: 2026-09-07
