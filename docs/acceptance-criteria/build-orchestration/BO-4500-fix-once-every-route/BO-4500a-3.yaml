notes: |
  CONTRADICTION FLAGGED, NOT RESOLVED HERE: BO-200b-3 (readiness reviewed, todo) says "retries at
  most 3 times". BO-210c-2 (approved) and the C6 spec say exactly once. This record follows exactly
  once; BO-200b-3 needs an amendment or supersession by its owner.

  MIGRATION RULE: the retry budget is taken from the hardened copy -- precommit-autofix's single
  retry as BO-210c-2 fixed it -- and its regression tests (BO-210c-2-i) run against this step.

  "Fixing" vs "judging" is the check tier the hooks manifest already declares (transform vs
  judgment, GE-102c / GE-120g). Workspaces where the checks cannot run at all are BO-1700's
  (fail closed; graceful no-op where a project has none) and are not re-specified here.
