# Schema-diff CI gate for leafcutter-ai.
# Triggers on PRs to main, compares skills_config.schema.json against the
# previous v* tag, and fails when backwards-incompatible changes are found
# without a corresponding breaking=true changelog entry.
#
# See EPIC-LeafcutterVersioning/05.

name: Schema Diff Gate

on:
  pull_request:
    branches: [main]

jobs:
  schema-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run schema-diff check
        run: |
          PREV_TAG=$(git describe --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous v* tag found — skipping schema diff check."
            exit 0
          fi
          python scripts/release/check_schema_diff.py --previous-tag "$PREV_TAG"
