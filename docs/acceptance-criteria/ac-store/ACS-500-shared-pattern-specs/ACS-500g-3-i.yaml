title: "A second copy of a pattern-worthiness rule is rejected before it can drift"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the authoring-patterns skill is the single place the pattern-worthiness
    rules are stated,
  When a change is submitted that writes a recurrence threshold, a
    slot-expressible-variance test, a genuine-vs-incidental test, or a slot naming
    rule directly into the business-analyst instructions, the pattern-steward
    instructions, or any other agent instruction file,
  Then the change is rejected before it lands,
  And the rejection message names the duplicated rule, the file that restated it,
    and the skill as the one place it belongs.

  Given a change that only edits the rules inside the authoring-patterns skill,
  When it is submitted,
  Then it is accepted.

  Given an agent instruction file that merely points at the skill (a reference or a
    load instruction, with no rule value of its own),
  When it is submitted,
  Then it is accepted — referencing the skill is not treated as duplication.
