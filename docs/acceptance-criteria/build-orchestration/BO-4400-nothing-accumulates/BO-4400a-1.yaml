assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  - agent: python-coder
    contract: >-
      Route-end clearing step, ONE shared step reused by every exit path of every route (success,
      nothing-to-deliver, halt, failure). Each route's final result carries a `workspace_clearing`
      object: {answer: <the one maker's remove answer, verbatim -- one JSON object per the BO-4300c-2
      result contract; ok carries removed_path (absolute), UNSENT_WORK carries unsent.commits [sha]
      and unsent.files [repo-relative path]>, delivered: bool (false on the nothing-to-deliver path),
      requested_after_step: <label of the last step before the clear, e.g. the pull-request step>}.
      Field names provisional until built; once built they are the contract BO-4400a-1-i, -1-ii,
      -2, -2-i and BO-4400f-3 read.
  - agent: documentation-expert
    contract: "The six-route table (route, end state, moment of clearing incl. nothing-to-deliver) the how-to BO-4400a-4 reproduces."
  - agent: architecture-diagram-author
    contract: "Ordered steps push -> pull request -> merge -> clearing request -> verdict -> return, and the removed / kept branches, for BO-4400a-5."
expects_from:
  ac_id: BO-4400g-2
  contract: >-
    The per-work command clear-landed --kind K --slug S (or --branch B) for the route's own work. It applies the
    landed rule with no idle threshold and answers without prompting. It reports cleared, carrying the door's own
    removed answer, or kept with reason not_on_main (pull request still open) or holds_unsent_work (commits and
    files named). Work with no commit of its own and nothing unsent is cleared at once.
package_surface: false
declared_files:
  - path: templates/workflows-js/_shared/workspace-answer.js
    state: existing
  - path: templates/workflows-js/build-ticket.js
    state: existing
  - path: templates/workflows-js/build-epic.js
    state: existing
  - path: templates/workflows-js/build-feature.js
    state: existing
  - path: templates/workflows-js/quick-fix.js
    state: existing
  - path: templates/workflows-js/plan-feature.js
    state: existing
  - path: templates/workflows-js/fast-lane-ship.js
    state: existing
it_requirements:
  - >-
    ROUTE SURFACES: single-ticket build (templates/workflows-js/build-ticket.js and the single-ticket
    path of build-feature.js), epic build (build-epic.js and the epic path of build-feature.js),
    quick fix (quick-fix.js), requirements authoring (plan-feature.js), fast lane (fast-lane-ship.js),
    backlog build (templates/workflows/build-backlog.md). Each route issues the clearing request at
    its END STATE -- after the pull-request step reports the request open and before the route
    returns -- never from a per-ticket or per-phase pull-request event (BO-4400a-1-ii).
  - >-
    COMPANION WORK (not this agent's surface, split recommended but NOT applied): the backlog build
    has no .js workflow; its route end lives in templates/workflows/build-backlog.md, command prose
    owned by llm-expert. BO-4400a is at its five-child cap, so the split is reported to the
    orchestrator instead of being made. This AC's proof still drives the backlog route by executing
    the command its prose publishes.
  - >-
    ONE DOOR: the clear goes through the one maker, templates/scripts/worktree.py (on disk since BO-4300a-1),
    by the per-work clear-landed command of BO-4400g-2, which clears through the maker's own remove verb. No
    route deletes a folder, runs `git worktree
    remove`, `rm -rf`, `shutil.rmtree` or any forced removal by its own means, and no route relies on
    finalize-feature to clear.
  - >-
    E2 CONSTRAINT (ADR-030): workflow bodies have no filesystem or process access. The clearing is
    exactly one agent() dispatch, carrying a result schema, to an agent whose registry entry has
    permits_shell: true, instructing it to run one exact absolute clearing command unchanged and
    return stdout verbatim: the name-based command of BO-4400g-4 for the route's own work, never
    --path, sent to shell-runner (ADR-070; user decision D1, 2026-11-16). Never status-checker,
    never free-form clean-up steps. Workflow edits are made in
    templates/workflows-js/ and reach .claude/workflows/ only through the build.
  - >-
    NO DISCARD AUTHORISATION ON ANY ROUTE PATH: a route never passes the maker's up-front discard
    authorisation (BO-4300e-3). Per the 2026-10-09 Q8 decision the holds-nothing verdict is the only
    safety check; a refusal is relayed as work kept, never retried with force.
  - >-
    VERDICT (user decision D2, 2026-11-16): the route's decision is the landed rule of BO-4400g-2
    applied to its one workspace, so a pushed but unmerged line is kept as not_on_main and never
    cleared by the route. The implementer must not re-derive the verdict inside a route. BO-4100c-1's
    pushed-line wording is no longer a prerequisite of this record. The rule's idle thresholds (7 days, and
    14 days for pushed but unmerged work, BO-4400g-2-v) guard only the unattended pass: a route that ends
    with no commit of its own and nothing unsent clears its workspace at once (user decision Q2, 2026-11-16;
    BO-4400a-1-i).
  - >-
    The route waits for the door's answer with a bounded timeout (configurable, default 120 s); a
    timeout is reported in the final result as clearing-not-confirmed naming the workspace path,
    never as removed.
  - >-
    Must handle errors per the project error handling policy (CLAUDE.md Rules 1-4): a failed or
    unparseable door answer is surfaced in the final result, never swallowed and never reported as
    success.
  - >-
    PROOF: every route runs under unit_tests/_workflow_engine_harness.py on the DEPLOYED workflow
    copy with label-scripted agent replies; the shell-agent stand-in executes the verbatim maker
    command for real against real temporary git repositories with a real bare hub. Pull-request
    creation is a recording stand-in (scripted pull-request agent or a fake `gh` on PATH) that
    records the head branch and the hub's commit list at the moment of creation; no network.
    Assertions are on the recorded dispatch order, the route's final result and the disk afterwards
    -- never on workflow source text (CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by
    Grep').
  - >-
    HARNESS PREREQUISITE (test-designer finding, 2026-11-16): the harness has no stand-in that executes the
    real maker today. The proof uses the exec bridge that BO-4400g-4 adds to
    unit_tests/_workflow_engine_harness.py, with BO-4300g-2-i's shared clearing-command parser, so this record
    and its children (-1-i, -1-ii) are built after that bridge or in the same build (depends_on BO-4400g-4).
  - >-
    ISOLATION: all projects, hubs, workspaces and HOME / XDG_CACHE_HOME / TMPDIR live under the
    test's temp directory and git runs with isolated global and system config; the developer's own
    repository, branches, registered worktrees and caches are unchanged afterwards (BO-4300f-4-i,
    KI-TQ-012). Tests do not spawn the package's scripts/build.py; deployed copies come from the
    shared reference layout (CLAUDE.md 'Tests must not spawn their own build.py').
test_required: true
test_intent:
  - clause: for every route no folder remains at the location its workspace occupied and its workspace is absent from the live set
    needs_test: true
    reason: A route that never reaches its clearing step leaves the folder, which only the disk and the listing show.
  - clause: 'the clearing was performed by the one shared clearing door: the route''s final result contains the door''s own answer for that workspace, reporting it removed'
    needs_test: true
    reason: A route that deletes by its own means leaves no door answer, which is how a second deletion route is caught.
  - clause: 'the clearing happened after the pull request was merged and before the route returned: the main line holds every change the route made'
    needs_test: true
    reason: A clear placed before the merge would treat a pushed line as sent, and the recorded order against the hub shows it.
  - clause: no person was asked to confirm the clearing
    needs_test: true
    reason: An unattended route stalls on any question, and the recorded dispatches show whether one was asked.
  - clause: for every route its workspace still exists, identical to its state when its pull request was opened
    needs_test: true
    reason: Clearing on a pushed but unmerged line is the timing the user decided against, and a snapshot catches it.
  - clause: 'the route''s final result reports the workspace as kept because its work is not yet on the main line, leaving it for the landed-work pass to clear after the merge'
    needs_test: true
    reason: The kept reason must come from the real one-work answer, or the person cannot tell kept from failed.
test_spec:
  - name: test_every_route_leaves_no_workspace_folder_after_its_pull_request
    proves_clause: 'for every route no folder remains at the location its workspace occupied and its workspace is absent from the live set'
    code_file: templates/workflows-js/_shared/workspace-answer.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      For each of the six routes driven to a pull request merged before the route returns, no folder
      remains at the workspace location and the maker's list verb no longer reports it.
    must_catch:
      - "a route that never calls the door (folder remains)"
  - name: test_route_result_carries_the_doors_removed_answer
    proves_clause: 'the clearing was performed by the one shared clearing door: the route''s final result contains the door''s own answer for that workspace, reporting it removed'
    code_file: templates/workflows-js/_shared/workspace-answer.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Each route's final result contains the maker's remove answer for that workspace with status ok and removed_path."
    must_catch:
      - "a route that removes the folder by its own means (result lacks the door's answer)"
  - name: test_clearing_is_ordered_after_pull_request_and_before_return
    proves_clause: 'the clearing happened after the pull request was merged and before the route returned: the main line holds every change the route made'
    code_file: templates/workflows-js/_shared/workspace-answer.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Recorded dispatch order is push, pull-request stand-in, merge of that pull request into the
      hub's main line, clearing request, return; the hub's main line holds every change the route made.
    must_catch:
      - "clearing placed before the push (door refuses, folder remains, or the PR is missing commits)"
      - "clearing placed before the merge (the landed rule keeps the workspace, folder remains)"
  - name: test_clearing_never_asks_for_confirmation
    proves_clause: no person was asked to confirm the clearing
    code_file: templates/workflows-js/_shared/workspace-answer.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "With stdin closed and no gate replies scripted, every route completes its clear; no gate or question dispatch is recorded."
  - name: test_pushed_unmerged_line_is_kept_for_the_landed_work_pass
    proves_clause: 'for every route its workspace still exists, identical to its state when its pull request was opened'
    code_file: templates/workflows-js/_shared/workspace-answer.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      A route that returns while its pull request is open (commits on origin/<branch>, not on origin/main)
      leaves its workspace identical and its final result reports it kept as not yet on the main line.
    must_catch:
      - "a route that clears on a pushed but unmerged line (the door's pushed-counts-as-sent verdict used instead of the landed rule)"
  - name: test_route_clearing_is_the_per_work_clear_landed_command_sent_to_shell_runner
    proves_clause: 'the clearing was performed by the one shared clearing door: the route''s final result contains the door''s own answer for that workspace, reporting it removed'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). From HarnessResult.agent_calls of each
      deployed route, the one clearing dispatch has agent_type shell-runner, a prompt that is one plain command with
      the absolute deployed maker path, the verb clear-landed, --kind and --slug (or --branch) equal to the flags of
      the route's own ensure dispatch, and no --path. The helper that builds it is the shared one in
      _shared/workspace-answer.js, whose makerCommand today supports no branch flag and no clear-landed verb
      (workspaceRemoveCommand builds remove --path with --force), so this is red until the build.
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_single_ticket_and_epic_routes_reach_their_clearing_step
    proves_clause: 'for every route no folder remains at the location its workspace occupied and its workspace is absent from the live set'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      The deployed build-ticket.js (single ticket) is driven to a merged pull request under
      run_workflow_under_e2 and the clearing dispatch is recorded, and the same for build-epic.js (three tickets),
      each with the live shell-runner stand-in that runs the dispatched maker command for real. The record's
      PROOF needs that stand-in, which the harness lacks today: run_workflow_under_e2 serialises static
      label_responses into a node shim with no process access, so an additive exec bridge is a prerequisite.
    code_file: templates/workflows-js/build-ticket.js
  - name: test_epic_route_reaches_its_clearing_step_once
    proves_clause: 'for every route no folder remains at the location its workspace occupied and its workspace is absent from the live set'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      The deployed build-epic.js (and the epic path of build-feature.js) is run to the epic's end: one clearing
      dispatch is recorded, after the last ticket and after the merge.
    code_file: templates/workflows-js/build-epic.js
  - name: test_quick_fix_requirements_authoring_and_fast_lane_routes_reach_their_clearing_step
    proves_clause: 'for every route no folder remains at the location its workspace occupied and its workspace is absent from the live set'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      quick-fix.js, plan-feature.js and fast-lane-ship.js, each deployed and run to a merged pull request, record a
      clearing dispatch (none of them carries one today) and leave no folder; one test per route in the file.
    code_file: templates/workflows-js/quick-fix.js
  - name: test_open_pull_request_route_result_reports_kept_not_on_main
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Each deployed route returning with its pull request still open carries the maker's real one-work answer, kept
      with reason not_on_main, relayed verbatim in its final result (not removed, not a failure), leaving the
      workspace for the landed-work pass.
    proves_clause: 'the route''s final result reports the workspace as kept because its work is not yet on the main line, leaving it for the landed-work pass to clear after the merge'
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_backlog_route_publishes_the_one_clearing_command_and_it_runs
    proves_clause: 'for every route no folder remains at the location its workspace occupied and its workspace is absent from the live set'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      templates/workflows/build-backlog.md has no .js driver, so the proof (as the record says) extracts the one
      clearing command its prose publishes, fills in the fixture's project root and work name, and runs it as a
      subprocess against a real merged workspace on a real bare hub: the folder is gone and the answer carries the
      door's removed answer. The text check is limited to the absence of any other removal instruction.
    code_file: templates/workflows/build-backlog.md
