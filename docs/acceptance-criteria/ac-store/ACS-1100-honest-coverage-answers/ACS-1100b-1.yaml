criteria: |
  Given an answer reporting 148 records covered against a total of 180,
  When a reader inspects how that figure was arrived at,
  Then the answer names the root it enumerated, the rule by which a record was
    counted as in scope, and each exclusion as a count paired with a stated ground —
    for example 24 records excluded on the ground that they are deprecated and 8 on
    the ground that they are not requirement records,
  And the covered count plus every declared exclusion count sums to the total
    (148 + 24 + 8 = 180),
  And an exclusion recorded with no stated ground is reported as an unexplained
    shortfall rather than as a legitimate exclusion,
  And a ground that is not on the published list of legitimate grounds is treated as
    no ground at all, so "excluded because the query did not reach it" cannot be
    recorded as a legitimate exclusion,
  And an answer a caller deliberately narrowed reports its narrowing as a declared
    exclusion under the ground that the records are outside the requested scope, names
    the scope, and reports BOTH figures — a run over 3 staged records in a store of
    2,784 reads "3 of 3 in scope, scope = staged paths; store = 2,784, 2,781 excluded
    as outside the requested scope" — so the scoped figure and the store figure are
    both visible and a reader can never mistake one for the other,
  And an answer that reports only its scope total, with no store total alongside it,
    does not satisfy this criterion, because a scope total alone is the very "40 of 40"
    shape ACS-1100a-2 forbids,
  And the method travels with the answer to its caller rather than being written only
    to an operator-facing log, so a consumer of the answer can read the exclusions it
    inherited.
