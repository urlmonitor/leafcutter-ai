notes: |
  BOTH INSTANCES ARE NAMED SO THE CRITERION CANNOT BE HALF-SATISFIED. The
  measured defect hit two independent per-agent preparations simultaneously, by
  the same silence, and neither was noticed by anything. A guarantee written
  against the abilities section alone is indistinguishable from AR-300a and
  would leave the second instance exactly as it is -- which is the live proof
  that a same-shaped second instance hides behind a fix aimed at one.

  EVIDENCE IS THE COMPILED PROMPT. Stated again here rather than inherited,
  because the natural implementation of this criterion is a check at the point
  of preparation, and a check at the point of preparation passes today.

  PREMISE STATUS, 2026-10-09 (business-analyst, BrainCandy decision 9). The
  "two undelivered preparations" premise was measured on 2026-09-30 and is
  being retired in the AR-300 pull request, one preparation per slice: the
  abilities section is delivered by slice 2, and the spawn-allowlist section is
  now also delivered in this pull request (AR-300c-5, AR-300a-5, AR-300d-5).
  The criteria above stay true of the tree they were written against and are
  not rewritten. What the gate must do once the spawn preparation is delivered
  -- report it by the same check when it goes missing, stay silent when it
  arrives -- is AR-300b-1-iii. The "both dead preparations are reported
  independently" test descriptor needs a synthetic stripped-section fixture once
  neither preparation is dead on the real tree; that is AR-300b-2's synthetic
  third-instance posture applied to the first two.

  IT PO CHECK OF THE PREMISE NOTE, 2026-10-09. The paragraph above is consistent
  with AR-300b-1-iii and with user decisions 5, 9, 10 and 11; it is kept as
  written. Three clarifications, none changing the criteria: (1) The
  it_requirements line naming `{{my_spawn_allowlist}}` records the 2026-09-30
  measurement. Under decision 9 the spawn section is no longer placed through
  that placeholder; it is appended from the agent's frontmatter `spawn_allowlist`
  declaration (AR-300a-5) and reaches this gate as a REGISTERED preparation named
  'spawn_allowlist', through compute_preparation / register_preparation in
  scripts/agent_preparation_delivery.py. "Covered by the same pass" still holds,
  through registration rather than a placeholder. (2) The "synthetic fixture" for
  the both-preparations descriptor means a COPY of a real compiled tree with one
  section stripped. That keeps the descriptor's real_artifact angle and never
  mutates the shared reference layout. (3) AR-300b-1-i's clean path on the real
  population also needs no unresolvable declared sub-agent. Decision 10 removes
  architect-review-deep. conflict-resolver-deep is a second measured instance
  that still needs a user decision (see AR-300c-5-iii).
