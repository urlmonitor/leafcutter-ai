  n_location_rule: "2 -- the pre-coder gate in build-ticket.js and its twin in build-feature.js, which must stay identical"
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_test_requirements_guard.py"
  notes: |
    The gate must decide whether tests exist at the moment the coder phase is reached,
    so evidence produced by a test-writer phase earlier in the same drive is visible to
    it; a verdict computed once before any phase ran can never observe that evidence.
    Test-writer evidence counts only when it names the test files actually written for
    the ticket.
    Test coverage: drive a code ticket with no Test Requirements through a run in which
    test-writer reports written test files, and assert the coder phase IS dispatched --
    behaviorally, by recording which phase agents the workflow actually dispatched, not
    by grepping the workflow source.
