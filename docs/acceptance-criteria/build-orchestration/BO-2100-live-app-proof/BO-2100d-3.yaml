criteria: |
  Given a git worktree where the package is deployed under `.leafcutter/` (not
    `.claude/`, which the ADR and agent text referenced)
  When startup and finalize teardown resolve and invoke the live-surface scripts
    (live_surface_startup.py and port_registry.py)
  Then they locate the scripts at their actual deployed location in the worktree and
    run successfully
    And they do NOT fail with a not-found error caused by a hardcoded `.claude` path
    And live testing works from a fresh worktree without manual path fixups.
