criteria: |
  Move a requirement anywhere in the tree by changing one field — no renames, no broken links.

  Today a requirement's name encodes where it sits in the tree, so reshaping the tree
  means renaming requirements and chasing every cross-reference across the whole store
  by hand. This goal gives every requirement a permanent name of its own and records
  its place in the tree as ordinary information you can read and change. The result:
  you split, rebalance, and re-home requirements as your thinking evolves, and nothing
  else has to change — every dependency, coverage, and contract link keeps pointing
  at the right requirement.
