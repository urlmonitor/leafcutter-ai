criteria: |
  Given the technology manifest contains entries for "python", "typescript", and "go"
  And best-practice knowledge files exist for all three languages
  When the agent generator processes the manifest
  Then it produces three separate agent template files: "python-coder", "typescript-coder", "go-coder"
  And each template contains ONLY the best practices for its own technology (no cross-contamination)
  And all three agents can be dispatched independently by name
  And the generation of one agent does not depend on or block the generation of another
