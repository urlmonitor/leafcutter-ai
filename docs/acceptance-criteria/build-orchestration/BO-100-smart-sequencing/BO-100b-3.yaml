criteria: |
  Given an epic has 2 tickets in the ready set and the batch cap is 3,
  When /build-feature computes the next batch,
  Then the batch contains exactly 2 tickets (all available),
  And no error or warning is raised about under-utilization of the cap,
  And both tickets are dispatched in the same parallel fanout.
