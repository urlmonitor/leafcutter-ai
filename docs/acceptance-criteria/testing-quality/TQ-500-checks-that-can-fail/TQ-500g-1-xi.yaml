notes: |
  WHY. docs/analysis/2026-10-23-the-wrong-version-gate-tests-a-different-guess-each-run.md:
  every run dispatches test-breaker afresh, the writer removes the previous
  manifest before writing, and on BO-2900a-2-i 6 of 13 preparable names got
  behaviourally different code across three rounds. A test proven to catch
  one round's guess was judged against another guess in the next, so the gate
  could not converge, and each round cost 0.34-0.60M tokens of gate steps.

  PIN THE REPLACEMENTS, NEVER THE COPIES (analysis invariant 1). The runner
  writes a whole altered copy over the file. A stored copy from an earlier run
  would also revert every code change made since. So the pin holds the
  replacements, and every run rebuilds the altered copy from the current file.
  The "log.info" clause in the criteria is what proves this.

  PIN KEY. Per work key and per owed name, the name compared after the gate's
  existing trim and case-fold (the alias rule of TQ-500g-1-i). Not shared
  across work keys, even for the same requirement: two pieces of work may have
  different code. BA assumption; IT-PO to confirm.

  NEW WORKFLOW, NOT ONLY RESUME. A resumed workflow can already replay a
  journalled agent result; the failure was across workflow runs (runs 3 and 4
  of drive 344eaa23 were new workflows). The When clause pins the new-workflow
  case.

  "NOT DISPATCHED AT ALL" is route-visible behaviour. The routes (TQ-500g-1-v,
  -vi, -vii) dispatch test-breaker whenever the list step reports anything
  owed; after this AC they dispatch it only when something needs preparing.
  Their next IT-PO pass must add that to their contracts; the shared list step
  is the natural place to report "to prepare" separately from "owed".

  OPEN FOR IT-PO / USER. Where the pin lives. TQ-500g-1-i keeps per-work gate
  files under the worktree's own git directory, so a pin there is lost when the
  workspace is removed and a new workspace for the same ticket starts with no
  pin. The BA's default: keep it with the other per-work gate files (loss on
  workspace removal is acceptable; the next run prepares afresh and pins
  again). If pins must outlive the workspace, that is a decision for the user.

  CONFLICT TO RESOLVE IN THE IT-PO PASS. TQ-500g-1-ix it_requirements
  ("Stale and unreadable", decision 2f) removes the earlier manifest and the
  copies before reading the reply. The pin must not be held in anything that
  step removes; earlier manifests move to history instead (TQ-500g-1-xv). The
  -ix criteria clause (no earlier manifest remains to be read in place of the
  current one) still holds.

  IT-PO ENRICHMENT (2026-10-23)
  PIN KEY CONFIRMED: per work key and per _wvr_scope.norm_name(name).
  CONFLICT WITH -ix RESOLVED: pins live in <git-dir>/leafcutter/pins/, a sibling
  of work/, so neither _clean nor its replacement (the move into history,
  TQ-500g-1-xv) reaches them. -ix's it_requirements are amended to say so.
  WHO DECIDES "TO PREPARE": the shared list step, when given --work-key, prints
  to_prepare beside owed and records its plan in work/<key>/plan.json; the write
  step re-derives or re-reads (fingerprint) that plan and never takes it from
  the route. The routes only read to_prepare.
  WHO PINS: a new pin step of the writer, called by finish after the runner, so
  a preparation is pinned only after the run shows it loaded, changed bytes and
  reached a line (TQ-500g-1-xiii, -xiv). Promotion ignores caught vs survived.
  ROUTE SIZE: the twins' wrong-version block moves into
  templates/workflows-js/_shared/wrong-version-runs.js (marker pair
  WRONG-VERSION-RUNS) and the to_prepare change is made there; fast-lane-ship.js
  pays for its in-file change by deleting at least twice what it adds. No
  check-file-size skip.
  /build-epic: the supervisor's list and test-breaker instruction lives in
  templates/skills/building-epics/SKILL.md (llm-expert, TQ-500g-1-vii). It is
  NOT in this AC's declared files, because one AC has one agent; a follow-up
  llm-expert requirement must change that instruction to --work-key and
  to_prepare (see TQ-500g-1-vii notes). Until it lands, /build-epic keeps
  dispatching every owed name, which is safe (pins unused, no loss) but slow.

  WHERE PINS LIVE (was open; DECIDED 2026-10-24, option (a), see below).
  (a) Under the worktree's git directory, <git-dir>/leafcutter/pins/ (this AC's
      default, with every other per-work gate file, TQ-500g-1-i): private to the
      workspace, never committed, gone when the workspace is removed, so a new
      workspace for the same ticket prepares afresh and pins again.
  (b) A durable location that outlives the workspace (for example under the
      install's declared operational_log_root, ADR-069, or committed beside the
      requirement): pins survive workspace removal, but must then be keyed by
      something stable across workspaces, and a committed pin becomes reviewable
      state.
  The choice changes one function (_wvp_store.pin_path) and nothing else; the
  build may start with (a).

  USER DECISIONS (BrainCandy, 2026-10-24, "approved")
  a. WHERE PINS LIVE: option (a). Pins live under the workspace's git
     directory, <git-dir>/leafcutter/pins/<work-key>.json. They are private to
     the workspace, never committed, and lost when the workspace is removed;
     the next run then prepares and pins again. This is NOT a durable location.
     It is a decision, not a law: it may be revisited, and changing it touches
     only the pin-path function (_wvp_store.pin_path). Now a criteria clause.
  b. PIN-WRITE FAILURE FAILS THE GATE. When the pin step cannot write the pins,
     finish reports gate_passed false and stopped_at "pin". It is never only a
     warning. Now a criteria clause.
