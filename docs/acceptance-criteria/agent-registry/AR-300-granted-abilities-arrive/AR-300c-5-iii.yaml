notes: |
  REPORT OR REFUSE -- DECIDED: REFUSE. By analogy with AR-300c-3-i, which refuses
  on an unresolvable declared skill id (user decision 5, BrainCandy 2026-10-09:
  "an UNRESOLVABLE declared skill id still refuses"). The two are the same act --
  a grant naming something that does not exist -- and treating them differently
  would make a missing sub-agent a lesser defect than a missing skill, when the
  runtime consequence is worse: the agent is told it may delegate, attempts the
  dispatch, and fails mid-task.

  CONSEQUENCE FLAGGED FOR THE USER -- THE REAL BUILD WILL REFUSE. On today's tree
  architect-review is permitted architect-review-deep (registry; carried forward
  by the union in AR-300c-5-i) and no definition exists for it. Once this
  criterion is implemented, the build refuses on architect-review until the
  user decides. This is deliberate -- it is a live defect the build has never
  reported -- but it means the pull request cannot go green without a decision.

  OPEN ITEM FOR THE USER -- NOT RESOLVED BY THE BA. Options:
    (a) Create the missing architect-review-deep agent definition, so the
        permission and architect-review's "spawn architect-review-deep" step
        become real.
    (b) Remove architect-review-deep from architect-review's permission AND from
        architect-review's body (the delegation step and its behavioural-pattern
        entry), and drop or retire its registry entry -- so the agent is no longer
        instructed to call a specialist that does not exist.
  Removing only the permission while leaving the body instruction would turn a
  caught contradiction into an uncaught one (AR-200b's "grant the capability, do
  not delete the instruction" posture, inverted: here there is nothing to grant).

  WHY A REGISTRY ROW DOES NOT COUNT. architect-review-deep has a registry entry.
  A resolution against the registry would pass it and the defect stays silent --
  exactly the "recorded, prepared, goes nowhere" shape AR-300 exists to end.
  Resolution is against definitions the build can actually deploy.

  OPEN ITEM DECIDED (BrainCandy, 2026-10-09, decision 10): option (b). The
  removal is written as an explicit remediation step in this record's
  it_requirements (IT PO). A follow-up for a real Opus escalation is filed
  separately (KI-AR-004).

  SECOND INSTANCE FOUND (IT PO probe, 2026-10-09). conflict-resolver permits
  conflict-resolver-deep, which has the same shape: a registry entry with
  template_path null, no template, and a body instruction to spawn it via the
  Agent tool. ADR-035 already counted both. After decision 10 the build still
  refuses on this one, so it needs the same user decision before the real build
  can go green. Not decided here.

  THE EMPTY-MACRO CLAUSE. A ticket-phase macro resolving to zero agents would
  otherwise deliver a section with no names (or no section), and ticket-supervisor
  would silently lose every phase agent. Reported, not delivered empty.
