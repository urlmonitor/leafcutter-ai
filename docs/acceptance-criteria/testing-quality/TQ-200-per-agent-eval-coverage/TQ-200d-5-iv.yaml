id: TQ-200d-5-iv
components:
  - testing_quality
title: "A temp folder that cannot be deleted after a row never ends a produced-tests run; every row is scored and the results file is written"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a live produced-tests run of a set with 2 rows,
    And deleting the first row's temporary folder raises PermissionError
      [WinError 32] ("the file is in use by another process") on every
      attempt,
  When the run proceeds,
  Then the second row is run and scored,
    And the results file is written with a scored entry for both rows,
    And the aggregate score is printed,
    And a warning names the folder left behind,
    And the first row's result is the one its agent run and checks produced,
      not a failure caused by the folder.

  Given deleting the folder fails on the first attempt and succeeds on a
      later retry,
  When the row finishes,
  Then the folder is gone and no warning is logged.

  Given a row whose agent run fails ("agent CLI exited 1: API Error:
      Connection closed mid-response") and whose agent sandbox then cannot be
      deleted,
  When the row is recorded,
  Then the row's recorded error names the agent failure, not the locked
      folder.

  Given a row that fails for a reason other than folder cleanup,
  Then the row is recorded as failed with that reason (cleanup tolerance
      never turns a failed row into a pass).

  Given an agent that cannot be launched at all,
  Then the run still stops as a harness failure, as TQ-200d-5-iii requires.

  Given the --score-gold replay of the test-writer, sql-test-writer and
      test-runner sets with folder deletion failing,
  When the replay runs,
  Then it completes with the same scores as without the failure.

  Given the change is done,
  Then the live-eval how-to or the produced-tests section of the evals
      README states that a temp folder left behind is warned about and does
      not stop the run,
    And the known issue "eval temp cleanup error crashes the run" is moved to
      resolved naming this AC and its proving tests, with the Open/Resolved
      count of the testing-quality known-issue register recounted,
    And one changelog entry names this AC and the resolved known issue,
    And no glossary term is added except through the glossary-triage flow.
