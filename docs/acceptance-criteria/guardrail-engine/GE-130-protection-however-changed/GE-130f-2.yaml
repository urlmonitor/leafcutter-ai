notes: |
  FINDINGS THIS RECORD CLOSES (GE-120f evidence, re-derived 2026-09-01; GE-130f notes): three of
  the four gated folders resolve through links out from under the prefix match and never match;
  the fourth (a migrations folder) does not exist in this repository. The last clause does not
  require every gated folder to exist -- the package installs into projects that may have one --
  only that one matching nothing is named rather than counted.

  Linked-working-copy layout and whole-file writes are separate records (GE-130f-2-ii,
  GE-130f-2-i) because a repair can fix this record and leave either inert.

