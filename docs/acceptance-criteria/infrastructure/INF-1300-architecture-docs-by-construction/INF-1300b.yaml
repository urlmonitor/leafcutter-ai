criteria: |
  One shape and one explanatory key across the whole collection.

  Each new document arrives in the same shape as every other, carrying the same
  explanatory key and a starting outline suited to the kind of picture being
  drawn, so a reader who has understood one architecture document can read any of
  them and an author never has to decide what the shape should be.
