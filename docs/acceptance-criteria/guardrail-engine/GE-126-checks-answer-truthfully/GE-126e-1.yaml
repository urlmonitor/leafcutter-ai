it_requirements:
  - "Every classification must come from executing the check. No classification may be derived from source text, from an abstract syntax tree, from an import, or from any static property. A census built by searching for an early return reports on dead code and is wrong in both directions."
  - "Each check must be executed in its own process against a disposable copy of a working tree. A census that runs seventy checks against the real repository will have several of them mutate it, and a mutated repository invalidates every classification taken after the first."
  - "Each execution must be bounded by a timeout. A check that hangs is a third-category unexecutable result for GE-126e-2 to report, never a pass and never a silent omission from the population."
  - "A check that crashes, cannot be launched, or exceeds its timeout is an unexecutable result, not an absence. Silently dropping it shrinks the denominator and makes the instance count look better without anything having improved."
  - "The census must execute the DEPLOYED copy of each check. The source-tree copy is a population nobody runs, and for at least one member the source copy's behaviour differs from the deployed copy's by construction (KI-CG-019)."
  - "The four outcome pairings must be distinguishable in the recorded result - refused in both, passed in both, could-not-inspect in both, and the asymmetric pair. Only the asymmetric pair is an instance; folding pass-in-both into the instance count would inflate the first measured number the L0 forbids stating at all until it is measured honestly."
  - "The two fixture checks must reproduce the recorded SHAPES rather than name the two recorded checks. Naming the real checks makes this criterion expire the moment GE-126a to GE-126c land, and leaves the census untested afterwards."
  - "The census must have a stated runtime budget and must report its own wall-clock time. Roughly seventy checks run twice is on the order of a hundred and forty process launches, and an unbounded census is one nobody runs twice."
  - "Error handling must follow the four rules in CLAUDE.md. An except block around a check launch that neither logs nor re-raises would turn a failed launch into a silent omission, which is this census committing the defect it measures."
