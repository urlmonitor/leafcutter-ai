id: BO-4300e-2-xiii
title: "A record-less leftover whose every remaining file matches its merged line of work is cleared"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" whose shared project's main line holds the merge of
    the line of work "ac/omega", whose last commit "c1" is part of that main
    line, and whose main checkout already holds that merge from its last
    fetch, while the line "ac/omega" itself has since been deleted from the
    shared project,
  And shop's landing place holds the folder "ac/omega" with no workspace
    record, whose repository is gone except one empty leftover file inside the
    repository folder that names no shared project at all, and which still
    holds the files "CLAUDE.md" and "src/app.py", each with exactly the content
    a fresh checkout of "c1" in shop would write, while every other file of
    "c1" is gone from it,
  And, in a second run, the same folder "ac/omega" that also holds the file
    "dist/app.whl", which "c1" does not contain and which shop's ignore rules
    exclude,
  And, in a third run, the same folder "ac/omega" as in the first run, in which
    "src/app.py" differs from its content in "c1" by one line,
  And, in a fourth run, the same folder "ac/omega" as in the first run that also
    holds the file "notes.txt", which "c1" does not contain and which shop's
    ignore rules do not exclude,
  And, in a fifth run, a folder "ac/sigma" set up the same way, whose two
    files have exactly the content of the last commit of the line of work
    "ac/sigma", a line that was never merged into shop's main line,
  And, in a sixth run, a project "blog" beside shop whose landing place holds
    the folder "ac/omega" set up as in the first run,
  When clearing is requested from shop in each run for that folder, with no
    authorisation to lose work and with shop's shared project unreachable,
  Then in the first run the request is answered cleared without a token, the
    answer names the line of work "ac/omega" and the commit "c1" whose content
    the remaining files matched, and nothing of "ac/omega" remains at its
    location,
  And in the second run the request is refused, stating that the workspace was
    half-cleared and that its remaining files match the line of work "ac/omega"
    as merged at commit "c1" except the files the ignore rules exclude; the
    refusal lists only "dist/app.whl" and returns a one-time token bound to that
    folder and exactly that file, and "ac/omega" is identical before and after,
  And in the second run, clearing again with that token is answered cleared, the
    answer lists "dist/app.whl" as discarded, and nothing of "ac/omega" remains
    at its location,
  And in the third, fourth and fifth runs the request is answered "not found"
    with the folder's files listed and no token, exactly as a record-less
    folder holding files is answered today, and the folder is identical before
    and after,
  And in the third run, a repeated request carrying the token from the second
    run is answered "not found" the same way and "ac/omega" is identical before
    and after,
  And in the sixth run the request is refused, stating that shop has no
    workspace at that location, and blog's "ac/omega" is identical before and
    after,
  And in no run does any request reach shop's shared project.
depends_on: [BO-4300e-2, BO-4300e-2-iii, BO-4300e-2-v, BO-4300e-2-vi, BO-4300e-2-xii, BO-4300e-3-i]
