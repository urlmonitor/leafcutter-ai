notes: |
  The parity L1. Distinct from GE-120a: 120a is about what a check does when it
  cannot run; this one is about removing the reason it could not run.

  DIRECTLY OBSERVED, REPRODUCIBLE: check_ac_parent_covered_by.py exited 0 with
  "skipping check (fail-open)" from a working copy lacking the deployed-layout
  link, and blocked with 6 violations on the identical staged files once the
  link was present. That is the acceptance shape for this L1: the two runs must
  agree.

  The BA should treat the shared root-walking resolution pattern
  (_find_project_root / parents[] walking, present in all 18 checks under
  templates/scripts/commit_guardian/) as ONE defect with 18 instances, not 18
  defects. GE-112, GE-118a-1 and GE-118b are three prior point patches in this
  same area — a fourth point patch is the failure mode to avoid here.

  The how-to trigger is a REPLACEMENT, not an addition: the project currently
  carries a manual workaround for this in the pre-drive checklist (link the
  deployed layout into a fresh working copy by hand, or all package checks are
  silently skipped). When this L1 lands, that instruction must be deleted rather
  than left to rot beside the fix.
