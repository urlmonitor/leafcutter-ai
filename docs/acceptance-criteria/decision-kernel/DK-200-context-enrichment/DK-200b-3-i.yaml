id: DK-200b-3-i
title: "Redaction expansion cannot exceed caller field or total text allowances"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given redacting a caller host name, capability, conversation or observation makes its text longer,
  When enrichment retains the redacted caller context,
  Then every retained field remains within its field allowance,
  And all retained caller text remains within the shared allowance,
  And any shortening is reported.
depends_on: [DK-200b-3]
covered_by:
  - "tests/kernel/enrichment/test_context_enrichment.py::TestContextEnrichmentBoundaries::test_redaction_expansion_stays_within_each_caller_field_limit"
  - "tests/kernel/enrichment/test_context_enrichment.py::TestContextEnrichmentBoundaries::test_supplied_context_budget_preserves_goal_and_marks_truncation"
implemented_by:
  - "kernel/context_enrichment.py"
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Per-field and shared caller-text allowances must hold after redaction, including when replacement text expands."
  - "Host, capability, conversation and observation fields must all obey their retained-field bounds and report any shortening."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_redaction_expansion_stays_within_each_caller_field_limit
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: unit
    angle: boundary
    description: "Expanding redaction across caller fields preserves field and shared text limits, removes the secret and reports truncation."
  - name: test_supplied_context_budget_preserves_goal_and_marks_truncation
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: unit
    angle: boundary
    description: "Shared caller-text truncation preserves the original goal and input conversation."
test_rationale: "Pre-redaction limits are insufficient because replacement markers may expand the content; all caller fields and the shared allowance must be checked on returned values."
