id: TQ-500f-1-i
components:
  - testing_quality
  - ac_store
title: "All three lists of test kinds move together, or the lockstep check names the one that did not"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given three places that list the permitted test kinds —
      R, the requirement-side list,
      G, the generated-work-side list,
      T, the test writer's taught set —
    and four prepared variants of them:
      V1: "discrimination" present in R, G and T,
      V2: present in R and T, absent from G,
      V3: present in R and G, absent from T,
      V4: present in G and T, absent from R,
  When the lockstep check runs against each variant,
  Then V1 passes,
    And V2, V3 and V4 each fail, and each failure names the list that lacks
      "discrimination" and the lists that carry it,
    And V2 in particular fails — today's check compares only R with T, so a
      kind dropped from G alone goes unnoticed; after this work it does not,
    And the check compares the full sets of kinds, so a kind present in G but
      in neither R nor T (for example a stray "discriminating") also fails,
      naming G.
depends_on:
  - TQ-500f-1
doc_links:
  - path: config/ac_store_schema.json
    relationship: describes
    status: exists
  - path: config/test_requirements.schema.json
    relationship: describes
    status: exists
  - path: templates/agents/test-writer.md
    relationship: describes
    status: exists
  - path: docs/testing/test-angles.md
    relationship: relates-to
    status: exists
    relevance: "Names the existing lockstep check (BP-1100g-1) that today holds only the requirement-side list and the taught set in step."
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: TQ-500f-1
  contract: "The eighth permitted kind present in R, G and T."
it_requirements:
  - The lockstep check must read all three lists from their single sources (the two schema angle
    enums and the TAUGHT-TEST-ANGLES anchor). The test holds no hard-coded copy of the kind
    list.
  - The comparison must be full set equality across R, G and T. A failure names each kind that
    differs, the lists that lack it and the lists that carry it, by file path.
  - The comparator must run against prepared variant lists (V1-V4 and the stray-kind case) without
    editing the real config or template files. The live check over the real files must use the
    same comparator, so the variant tests prove the check that actually runs.
  - Replace today's R-vs-T comparison in unit_tests/prompt_assembly/test_bp_1100g_1.py rather
    than adding a second check beside it, so two lockstep checks cannot disagree.
  - Deterministic, no build.py spawn, completes in under 2 s.
test_spec:
  - name: test_live_lockstep_check_passes_over_real_three_sources
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: reachability
    surface_invoked: the lockstep test collected by pytest, reading the real config/ac_store_schema.json,
      config/test_requirements.schema.json and templates/agents/test-writer.md
    description: The lockstep check over the real files passes with discrimination present in
      R, G and T (V1 on the live sources).
  - name: test_lockstep_comparator_passes_when_all_three_lists_agree
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: 'V1: the comparator reports no difference when R, G and T all carry the same
      eight kinds.'
  - name: test_lockstep_comparator_fails_naming_list_that_lacks_discrimination
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: failure
    description: V2, V3 and V4 each fail, and each failure names the list lacking discrimination
      and the lists carrying it. V2 (missing from G only) fails, which today's R-vs-T check
      cannot do.
  - name: test_lockstep_comparator_fails_on_stray_kind_in_generated_side_only
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: boundary
    description: A kind present only in G (e.g. 'discriminating') fails, naming G, which shows
      the check compares full sets rather than subsets.
test_rationale: The deliverable is the check itself. Only variant inputs prove it can fail,
  and V1 alone would be green on arrival and prove nothing. The live-file test is the production
  use.
origin_agent: business-analyst
