    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements: |
  The commit-phase gate must RE-RUN the probe (no caching of the pre-drive verdict)
  so a between-gates mutation is caught at the last safe moment — this is why the
  guard verifies twice (create/pre-drive AND commit). Template-prose surface
  (templates/agents/commit.md, same as BO-1700d-3); reuses the shared probe helper
  (BO-1700a-1). Proceed only on exit 0 + empty failing_checks (BO-1700b-1).
