criteria: |
  Reuse context across steps instead of re-deriving it from scratch every time.

  Each step of a build reuses the stable groundwork and carries forward what
  earlier steps already worked out, rather than starting cold and re-deriving the
  same context repeatedly — so the same feature costs less and finishes sooner.
