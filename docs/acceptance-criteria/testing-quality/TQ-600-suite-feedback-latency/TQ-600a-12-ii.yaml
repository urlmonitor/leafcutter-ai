id: TQ-600a-12-ii
components:
  - testing_quality
  - build_pipeline
title: "Seeding is asked for per test, and the tests whose subject is the deploy count can never be given it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the three files whose subject is how many real deploys a run performs —
    unit_tests/suite_performance/test_tq_600a_1.py,
    unit_tests/suite_performance/test_tq_600a_1_i.py and
    unit_tests/suite_performance/test_tq_600a_1_multiworker.py, 10 tests, 465 s
    measured — each of which asserts on a count of deploy signals: that a selection
    of consumers deploys once, that a worker with no scheduled consumer produces
    nothing, that several workers still execute exactly one deploy,
  And the three files whose subject is routing, reporting, and layout-integrity
    comparison — unit_tests/suite_performance/test_tq_600a_5.py,
    unit_tests/suite_performance/test_tq_600a_5_reporting.py and
    unit_tests/suite_performance/test_tq_600a_3_integration.py, 17 tests, 1,069 s
    measured — none of which asserts anything about how its layout came to exist,
  And the distinction that governs eligibility, which is not readers versus mutators
    but whether the number of real deploys is the subject of the assertion,
  When a test makes no request for a seed,
  Then it receives a layout produced exactly as it is produced today, observing the
    same number of deploys it observes today,
  And a test receives a seeded layout only where that test itself requests one, by a
    declaration on the test rather than by its file name, its directory, a
    configuration default, or an environment variable set for the whole run,
  And the three deploy-count files are named by path in the implementation as
    ineligible, so a seed request originating from any test in any of them is
    refused,
  And the refusal names the requesting test and states the reason, rather than
    quietly granting the seed or quietly ignoring the request,
  And a test added to one of those three files later inherits the ineligibility
    without anyone having to remember, because the ineligibility attaches to the file
    and not to a list of test names.
