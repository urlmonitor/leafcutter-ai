id: BO-640-1-i
title: "Challenge produces a structured rationale regardless of outcome"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the complexity challenge has been triggered and the IT PO has responded,
  When the challenge outcome is "decomposed" (complexity reduced),
  Then the challenge record contains:
    - challenge_outcome: decomposed
    - original_complexity: H
    - resulting_complexity: M
    - rationale: "<the IT PO's decomposition explanation>"
    - sub_tickets_created: [<list of new ticket IDs, if any>]
  And this record is persisted as metadata on the ticket

  Given the complexity challenge has been triggered and the IT PO has responded,
  When the challenge outcome is "accepted" (complexity confirmed irreducible),
  Then the challenge record contains:
    - challenge_outcome: accepted
    - original_complexity: H
    - resulting_complexity: H
    - rationale: "<the IT PO's irreducibility justification>"
    - sub_tickets_created: []
  And this record is persisted as metadata on the ticket

  Given a ticket has been through the challenge gate,
  When any agent or human queries the ticket's complexity history,
  Then the challenge record is retrievable and shows whether the complexity
    was challenged and what the outcome was
depends_on: [BO-640-1]
