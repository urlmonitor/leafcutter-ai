change_target: code
risk_surface: internal
notes: |
  Guards against a global-toggle implementation: two separately-configured runs
  (one "strict", one "lenient") could each pass TQ-400e-3 and TQ-400e-4
  independently while the system never actually discriminates between two records
  sitting side by side in the same store.

  The swap clause is a mutation check — it makes the outcome provably a function
  of the record's own content rather than of its position, filename, or ordering
  in the scan. A grep-shaped or allowlist-shaped implementation fails it.

  IT-PO ENRICHMENT NOTE (2026-08-17). The swap must be a genuine on-disk mutation
  re-read by a FRESH process. Swapping two in-memory dicts and re-invoking the
  function in the same interpreter leaves any module-level cache, memoised scan,
  or already-populated namespace in place — the same masking that let a
  forward-reference NameError survive importlib.reload() in GenReviewFixes H-2.
  Added the per-record error-isolation requirement too: 'per record' has to mean
  that one record's unreadable declaration cannot change another's outcome.
