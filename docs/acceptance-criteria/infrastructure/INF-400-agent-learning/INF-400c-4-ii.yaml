criteria: |
  WITHDRAWN -- do not build. Superseded by INF-700c-2. Reason recorded below
  and in amended_by; the original text is retained verbatim underneath it so
  the decision can be audited against what was actually specified.

  Why withdrawn (BA re-decision, 2026-08-26, on the evidence the PO recorded
  in INF-700c). This criterion carries the 28 retained knowledge_captured
  events across into the knowledge-emission sink so that they can be drained.
  Both halves of that purpose have gone.

  First, the drain is off the table. The 28 events carry six keys each --
  event, timestamp, agent, component, destination, entry_kind -- and no
  learning text, because the emitter contract in signoff section 7 step 4
  specifies exactly those six fields. INF-700c-1 forbids writing a record with
  no learning text to any knowledge surface, so there is nothing for a carried
  copy to become. Nine of the ten destinations these events name already hold
  the learnings the agents wrote inline.

  Second, its declared prerequisite no longer exists. Its depends_on names
  INF-400c-5-ii, which the PO withdrew on 2026-08-26, and its own
  it_requirements state that the ordering is load-bearing: "the entry_kind
  mapping (INF-400c-5-ii) must be in place before the recovered events are
  drained, or the drain discards them."

  What remains after removing both is a copy operation that moves 28
  permanently unroutable records into the file the backlog is counted from --
  which manufactures exactly the permanently non-empty backlog INF-700c
  forbids, in a new location. The successor, INF-700c-2, requires the opposite
  outcome: the retained body reaches a resting state that contributes zero to
  the waiting count, on every run, without writing anything. INF-700c-2-i
  preserves the audit and replay property this AC was also serving -- the
  records survive with their original field values and the reason for their
  disposition is recorded.

  Not affected by this withdrawal: INF-400c-4 (one declared sink) and
  INF-400c-4-i (no template names the telemetry sink) remain valid, and
  INF-400c-4-iii (the harvester drains only its own stream) remains valid and
  is what keeps the two streams apart once the sink is repointed.

  ---------------------------------------------------------------------------
  ORIGINAL CRITERIA (retained for audit, no longer to be implemented):

  Given 28 knowledge_captured events have accumulated in
    debugging/logs/agent_telemetry.jsonl because the emitters and the
    harvester never agreed on a sink,
  And each carries a timestamp, agent, component, destination and entry_kind
    that no harvester run has ever seen,
  When the sink repoint from INF-400c-4 is applied,
  Then every knowledge_captured event present in the telemetry sink is
    carried across into the knowledge-emission sink, preserving each event's
    original timestamp, agent, component, destination and entry_kind values,
  And the recovery reports the number of events carried across and the number
    already present, and those two numbers sum to the number of
    knowledge_captured events found in the telemetry sink,
  And re-running the recovery carries across zero further events,
  And the recovery is performed before the harvester is first pointed at the
    knowledge-emission sink, so that no historical event is drained under the
    pre-reconciliation entry_kind rules,
  And the telemetry sink's non-knowledge records are left byte-for-byte
    unchanged.
