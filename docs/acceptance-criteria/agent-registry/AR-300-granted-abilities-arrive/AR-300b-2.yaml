  agent: approve_acs
  date: '2026-10-01'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  THIS IS WHERE AR-300b STOPS BEING AR-300a WITH EXTRA STEPS. AR-300b-1 can be
  satisfied by a guarantee that names the two preparations known to be broken.
  That guarantee is correct on the day it ships and silent on the third, which
  is the exact failure shape measured: the second broken preparation had been
  dead for as long as it existed and nothing noticed, because nothing was
  looking at the class.

  THE SYNTHETIC THIRD INSTANCE IS THE ONLY HONEST EVIDENCE. Once the two known
  instances are repaired, a criterion written against them can never fail again
  on the current tree -- it degrades into proving that a loop runs. The
  after-the-fact addition is what keeps it falsifiable.
