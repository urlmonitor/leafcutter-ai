test_required: true
test_rationale: |
  A check that silently vanishes from the report is the sharpest form of the failure this L1
  exists for: the reader sees only checks that passed and concludes everything was checked. The
  test must assert the absent check is PRESENT in the report with a reason, which no
  omit-on-skip implementation can satisfy.
test_spec:
  - name: test_unexecuted_check_is_listed_with_a_reason
    target_dir: unit_tests/product_truth/
    description: "A check whose precondition is absent appears in the report with a stated reason rather than being omitted."
    type: integration
    angle: failure
    framework: unittest
  - name: test_unexecuted_check_adds_nothing_to_examined_figures
    target_dir: unit_tests/product_truth/
    description: "The examined totals are the same whether or not the unexecutable check is present."
    type: unit
    angle: boundary
    framework: unittest
notes: |
  Named mutation: drop the not-executed entry from the report. UXP-700b-2's counts still add up
  and its tests stay green; only this record turns red. That asymmetry is why it is a record of
  its own.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
