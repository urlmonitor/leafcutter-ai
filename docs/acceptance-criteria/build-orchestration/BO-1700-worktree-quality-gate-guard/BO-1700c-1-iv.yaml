created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700c.yaml"
criteria: |
  Given two commits run concurrently in the same worktree and both trigger the
    self-healing hook,
  When the hook re-materializes the config,
  Then it writes to a temporary path and renames into place, so that a concurrent
    racer that loses the race observes either the prior state or a complete valid
    config, never an empty or partially-written config file.
  And given the hook is run a second time when the config already resolves,
    Then it makes no change and the resulting config content is byte-identical to
      the first run (idempotent).
