id: ACD-1500d-2
readiness: approved
priority: medium
title: "A configurable per-run cap limits how many artifacts the router auto-creates"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the configurable per-run artifact cap is set to 3,
  And the work queue contains 7 entries that would each otherwise produce an artifact,
  When the router runs,
  Then it creates at most 3 artifacts in that run,
  And the cap value is read from configuration rather than hard-coded,
  And once 3 artifacts have been created, the router stops creating more in that run,
  And the count of artifacts created in the run is reported at the end.
depends_on: [ACD-1500d]
