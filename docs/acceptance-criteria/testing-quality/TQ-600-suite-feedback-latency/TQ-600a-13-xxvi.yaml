notes: |
  WHY ONE DOCUMENTATION RECORD CARRIES BOTH CONTRACTS. TQ-600a-13 and TQ-600a-13-xxi each
  hand documentation-expert prose in the same two guides, in the same passages (which tests
  each run executes). Two records editing the same sentences in sequence would race each
  other; one record states the end state both need. Until this record, TQ-600a-13's
  documentation-expert contract had no consuming record in the folder.

  ORDERING. The suffixed-test clause can only be written once TQ-600a-13 has settled its
  outcome; the live-database clauses once TQ-600a-13-xxi is built. depends_on carries both.
