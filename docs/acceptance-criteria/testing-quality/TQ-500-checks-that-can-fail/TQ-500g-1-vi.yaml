id: TQ-500g-1-vi
components:
  - testing_quality
  - build_orchestration
title: "/build-feature and the single-ticket route make the same wrong-version runs before commit, and a resumed ticket makes them again"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given three tickets, each driven once through /build-feature and once as a
    single ticket —
      K1: its guarding test names must_catch ["drop the retry_due condition"]
          and fails under it,
      K2: its guarding test names the same wrong version and still passes
          under it,
      K3: it has no source requirement,
    and a fourth ticket K4, like K1, whose drive is resumed after its coder
    and review have already signed off,
  When each ticket's code is green and it reaches the step before commit,
  Then the route makes the wrong-version runs through the one shared runner,
      with the same inputs the fast lane passes, after asking the writer
      what is owed and, when anything needs preparing, having test-breaker
      prepare those names from that list unchanged,
    And K1 goes on to commit,
    And K2 does not reach commit: the drive stops that ticket with the
      runner's report naming the test and the surviving wrong version,
    And K3 records "wrong-version runs not applicable: no source requirement"
      and goes on, never recorded as verified,
    And K4's resumed drive first puts back any code a cut-short earlier run
      left altered, before anything reads it, and makes the runs again
      before commit rather than relying on any earlier sign-off,
    And /build-feature and the single-ticket route reach the same verdict for
      each ticket, and it matches the fast lane's for the same tests and
      outcomes.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-i
  - TQ-500g-1-v
  - TQ-500g-1-iv
  - TQ-500g-1-ix
  - TQ-500g-1-x
