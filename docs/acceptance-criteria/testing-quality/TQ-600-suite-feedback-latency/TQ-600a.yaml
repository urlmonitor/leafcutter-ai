      THE readiness DEMOTION AND THE test_spec MARKERS WERE A SECOND PASS, AND THE
      REASON IS WORTH RECORDING. The first pass retired these four on status and
      req_status alone and left readiness: approved, on the reasoning that approval is
      a fact about the past. It is — but approved means cleared FOR BUILDING, and the
      past is preserved by writing it down, not by leaving a field that invites work.
      The four would otherwise have passed check-ac-schema's approved-code-AC rule
      only because they carry test_spec blocks that are now FALSE: written against
      `_scan_all_ac_assignments`, the walk this change deletes. Passing a gate by
      holding a dishonest artifact is worse than failing it, because nothing asks
      again. THE FIRST ATTEMPT AT NEUTRALISING THEM WAS ALSO WRONG, AND THE PATTERN
      IS THE POINT: it kept the descriptors in test_spec behind per-entry "RETIRED —
      DO NOT AUTHOR" markers and added test_required: false alongside, which
      check-ac-schema refused — the two fields are ONE declaration, so that says "no
      tests needed" and "here are the tests" at once. The underlying mistake was the
      same one already made on work_status and on readiness: a PRESENT-TENSE field
      being used to carry history. Three fields, three gates, one error. The content
      is preserved — every descriptor is named and summarised in each record's notes
      under "THE RETIRED TEST CONTRACT", with the three whose substance outlives the
      retirement written out in full — and the fields now say what is true: no test
      contract. The generalised four-field shape, and the warning about arguing to
      leave a field wrong in order to preserve something true, is on INF-600b-2. Their subject was removed by an unrelated change: agent cards become
