notes: |
  THE THREE FALSE TEXTS (from the KI). (1) the edit-time hook's not-installed
  message, (2) the manifest comment plus its unread ruff_rules key, (3) the fix
  commit 4b9894b40's message. (3) is git history and cannot be corrected. It is
  recorded here only so nobody counts it as an open item. The repository's CLAUDE.md
  Error Handling Policy sentence is a fourth claim, and it is handled in the
  documentation child BP-1300e-2-i.

  WHY "MAKE TRUE" DOES NOT SUFFICE AND THE TEXTS MUST CHANGE ANYWAY. Even after
  BP-1300e-1 lands, the claims stay partly false: repo-wide the rule set is E, F
  and E722, and BLE001 and TRY apply to kernel/ only, while the texts attribute
  E722, BLE001 and TRY to everything. So the hook makes "a commit-time lint check
  exists" true, and the texts still have to be corrected to say what it checks.

  The third scenario ("drift is caught") is what makes this durable rather than a
  one-time edit. Whether it is a dedicated check or an extension of GE-120h-1's
  reconciliation is the IT PO's call. Extending is preferred over a second
  reconciler.
