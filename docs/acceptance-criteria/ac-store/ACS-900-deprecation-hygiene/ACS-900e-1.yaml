    relationship: specifies
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The reusable traceability logic in cross_reference_audit.py is the AC-YAML-loading + implemented_by reading in _load_ac_yamls (load each AC dict, read its implemented_by list). The hook MUST reuse this rather than writing a second independent AC-store traversal. Because _load_ac_yamls currently lives inline alongside CLI/backfill code, the preferred approach is to EXTRACT it (and any shared AC-load helper) into an importable shared module both the audit script and the new hook depend on — a true shared helper, not a copy-paste."
  - "The hook MUST NOT perform backfill: it neither writes implemented_by links nor sets work_status nor mutates any AC YAML. Backfill remains solely cross_reference_audit.py's --apply path. The hook is read-only over the AC store (detection only)."
  - "The #anchor parsing and the source-file presence verdict (ACS-900a-2) are NEW behavior NOT present in the audit script (whose implemented_by reads are ticket-oriented and never check source-file existence) — adding them is in-scope; duplicating the AC-load traversal is not."
  - "Extracting the shared helper MUST NOT change cross_reference_audit.py's existing behavior or CLI contract (no regression to backfill); verify the audit script still runs after the refactor."
  - "Shared-helper extraction touches scripts/ac_store/ source AND its packaged template; both copies MUST stay in parity via build.py (ADR-001). New hook script lives in templates/commit-guardian/ + scripts/commit_guardian/."
  - "Must follow the project error-handling policy: file/YAML reads wrapped at the I/O boundary with WARNING-level logging and fail-open, matching the existing _load_ac_yamls (catches yaml.YAMLError / OSError, logs, continues)."
delivers_to:
  agent: python-coder
  contract: "A shared, importable AC-load helper (extracted from cross_reference_audit.py._load_ac_yamls) returning parsed AC dicts with their implemented_by lists, consumed by both the audit script and the deprecation-hygiene hook's resolution step (ACS-900a-2)"
