notes: |
  Observed 2026-09-25 in this repository. The workflow engine has no shell primitive, so
  every command-running step is an agent() dispatch with a hard-coded agentType. Several
  steps were sent to agents whose charter forbids that work; they declined and the run
  halted. The orchestrator then drove the whole pipeline by hand, step by step.

  WHY LANE-WIDE AND NOT ONE STEP AT A TIME. KI-BO-020 moved the release step. BO-2400f-7-iii
  moved the claim step and said in its own it_requirements that "widening to [resolve and
  producibility] is a separate change". This is that change, stated once for every step so
  the next step added to the lane inherits it instead of waiting for its own incident.

  OVERLAP. BO-2400f-7-iii (claim performer) and BO-2400f-10-i second scenario (release
  performer) each already say this for one step. This record does not restate them; it adds
  resolve, producibility, context bundle, changelog, commit, push and pull request, and the
  requirement that no step's request reassigns the agent's role.

  DECIDED BY THE USER 2026-09-27. (1) An agent whose registry entry says nothing about
  permits_shell is NOT permitted, as the registry schema says (KI-BO-20260901-1620). (2) Every
  command step goes to a new dedicated command-step-runner agent declaring permits_shell
  true; its template and registry entry are BO-2400a-1-i (llm-expert's surface). This record
  is the routing half (python-coder). Test-writer, coder and pr-reviewer stay on their
  specialist agents. Do not meet this by adding permits_shell to an existing agent's entry
  (BO-2400f-7-iii forbids manufacturing permission).

  THE ID, USER DECISION 2026-09-27 (round 3): "command-step-runner", replacing
  "fast-lane-step-runner". It is generic so the ~40 similar status-checker shell dispatches in
  five other workflows (KI-BO-20260927) can reuse it later; this record still moves only the
  fast lane.
