notes: |
  WHY A TOKEN CHECK AND NOT A SENTENCE CHECK. The BO-3100/3200 standing rule forbids verifying
  documentation by grepping for an instruction sentence. This check is the inverse: it asserts
  the absence of one retired, exact identifier across a declared population, with a
  varying-population clause. No literal-carrying implementation can satisfy it.

  WHY THE "AS IT STOOD AT AUTHORING" CLAUSE. It pins the check's reach to the surfaces the GE-129e
  notes found (docs, templates, workflow prompts, the guard's own message). A check that scans
  only Markdown would miss the workflow prompt and the guard message and still pass on today's
  corrected docs. The list is a floor: any further occurrence found is reported too.

  WHAT IS NOT CHECKED HERE. The stale promise without the token ("the hook blocks any direct git
  commit") is checked by agreement with the guard's behaviour (GE-129e-3), not by wording.

  EXEMPTIONS. Historical records -- known issues, changelogs, ADRs, the AC store -- keep their
  mentions; they record what was. How an exemption cannot swallow a shipped surface: GE-129e-1-i.

  declares_side_effect: false -- the Then clauses assert findings, pass and fail.

  ASSIGNMENT (BA proposal): python-coder builds the check. The corrections to each surface are
  edits the IT PO may split by surface (llm-expert for agent and skill prompts,
  documentation-expert for docs, architecture-diagram-author for diagrams); this record is met
  only when the check passes on the corrected tree.
