criteria: |
  The fast lane drops heavy agent orchestration, not git discipline.

  A lean build still runs on an isolated branch created from the latest origin/main
  and records incremental, logical commits (a red-baseline commit, then the green
  implementation, then each further logical change) rather than one squashed drop or
  no commits at all. What the fast lane removes is the orchestration overhead — the
  supervisor, planner-as-agent, per-phase cold-starts, the three-command/three-worktree
  split, and the opinion-only gate agents — never the branch isolation or the
  commit trail that make the work reviewable and revertible.
