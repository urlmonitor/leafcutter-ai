    agent: it-po
    date: '2026-10-12'
    changed: "NOTE ONLY -- criteria unchanged. it_requirements: the open edge-label question replaced by the decided rule (label stays 'skills_used', sourced from skills_invoked skill ids via a declared field->label and item-key mapping in config/paths.json agents surface); test_spec asserts the label and validate_knowledge_map. WHY: user decision 12 (BrainCandy, 2026-10-12)."
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  The diagram and the graph are the two views that silently EMPTY if the field
  is removed before they move -- the exact failure AR-400e's notes warn about.
  The third clause guards the 27 "both" specialists against a regression.
