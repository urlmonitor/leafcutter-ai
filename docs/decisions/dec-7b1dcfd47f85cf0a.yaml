  goal: 'Decide what belongs in the human-facing fields of product-truth flows (a step''s human line, the flow summary, acceptance_scenarios)
    and where implementation detail, build status, design notes and field purposes should live instead, and how to enforce
    it. Flows such as decision-forming have grown to about 254000 characters, with code paths, function names, result shapes
    and not-built notes in step human fields; the schema reference calls human a one-line description of what the user does
    or sees, while the authoring how-to and the flow-author template (since commit 6ae01413d) ask for a narrative with actual
    boundaries and contracts, and the generator writes a contract section into human. Options: a strict field guide with a
    never-list, generated contract text moved out of human, a length bound and a code-token lint enforced as gates, and field
    purposes moved into Pydantic model descriptions; keep the narrative human field and add only a length bound; or another
    option grounded in the repository.'
  component_ids: []
