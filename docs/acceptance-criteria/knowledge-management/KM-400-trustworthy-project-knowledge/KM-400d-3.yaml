criteria: |
  Given a truncated result pinned to A with selected operation, arguments and disclosure level
  When its continuation is resumed unchanged while A is retained
  Then the next deterministic page stays in the same scope and generation
  And tampering with scope, operation or arguments is rejected
  And an expired or deleted-generation continuation returns expiration instead of silently restarting at the latest revision
