assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "THE SUBJECT SET IS git's STAGED CHANGE LIST — `git diff --cached --name-only --diff-filter=ACMR` including renames via -M so the file's current path is the one examined. Never a repository walk, never a glob over the working tree. This mirrors the established staged-files-only scoping in check_ac_circular_deps, check_ac_schema Phase 2, GE-111c-1 and ACS-400e-2; an unexamined convention here is one refactor away from a whole-tree scan that fails on the entire existing frontend."
  - "NOT EXAMINED IS A THIRD STATE, NOT A PASS AND NOT A FINDING. An unstaged file must appear in NO output collection — not in findings, not in pass records, not in any count the run produces. If the check emits a structured report, an unstaged file must be absent from it entirely; being present with a 'skipped' or 'clean' marker reintroduces exactly the reading this scenario forbids."
  - "THE PASS RECORD IS A RECORD, NOT A BANNER. One per examined in-scope file, naming the criteria declared and the number of pinned elements (mock record gf-commit-realization-badge). Its language is constrained by GE-124e-5 and its counting by GE-124g-3: it may say declared, never verified, covered or proven. Malformed pins (GE-124b-1-ii) do not count towards the pinned-element number."
  - "AN EMPTY IN-SCOPE SET IS A PROCEED, NOT A FAILURE. A staged set containing no in-scope screen components exits 0 with no findings — the false-positive guard GE-117d-2 also carries. An empty verdict set must not read as 'nothing was checked, therefore fail'."
  - "ONE DIFF-SCOPING PRINCIPLE, TWO SUBJECT TYPES. This AC and GE-124e-4 are the same rule; here the subject is a file path and the diff selects it directly, there the subject is a criterion id and needs two routes. Implement them as two applications of one stated principle, and do not let either grow a cutoff, an exempt list or a backfill counter — scenario 3 IS the backfill mechanism."
  - "Must handle errors gracefully per the project error handling policy; the partially-unreadable staged set is GE-124c-3-i's contract."
delivers_to:
  agent: python-coder
  contract: "The staged-set-scoped examined set plus the two quiet outcomes: an unstaged file appears in NO collection the run produces, and an examined, fully-resolved file yields one pass record naming its declared criteria and its pinned-element count. The examined set comes from git's staged change list, never from a tree walk."
expects_from:
  ac_id: GE-124c-1
  contract: "The block/proceed decision whose two silent branches this AC specifies, and the finding/pass record shapes that an unstaged file must be absent from entirely"
test_spec:
  - name: test_ge_124c_3_unstaged_undeclared_file_appears_in_no_collection_and_does_not_block
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "In a temp git repo, commit an undeclared component, then stage an unrelated file and run the hook via subprocess: exit 0, and the undeclared file's path appears in NO output — not in findings, not in pass records, not in any count. Assert absence from every collection, not merely that the run passed."
  - name: test_ge_124c_3_fully_declared_staged_file_yields_one_pass_record_with_its_counts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The realization-badge worked case: one pass record naming UXP-607 and UXP-607-1 and a pinned-element count of 2. Also assert a malformed pin in the same file does not increment that count."
  - name: test_ge_124c_3_the_same_file_is_examined_once_it_is_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "Run the hook twice in one temp repo — first with the legacy undeclared file unstaged (silent), then with the same file edited and staged (blocked). This pair is the backfill mechanism the whole tree relies on instead of a cutoff, and it is only observable across two real runs against a real index."
  - name: test_ge_124c_3_empty_in_scope_staged_set_proceeds_with_no_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A staged set of only .py and .md files exits 0 with an empty finding list. Guards against an empty verdict set being read as 'nothing was checked, therefore fail'."
test_rationale: |
  Everything this AC promises is about what the check does NOT do, and negative behaviour is
  only observable at the entry point over a real git index — an in-process call cannot
  distinguish 'the file was not in the staged list' from 'the file was examined and passed
  silently'. So all four tests run the real hook against a temp repo. The two-run test is the
  one that carries the most weight: it demonstrates the backfill mechanism that lets this tree
  ship with no dated cutoff and no exempt population, and a single-run test cannot show it. The
  absence assertions are written against every output collection rather than against the exit
  code, because a 'skipped' entry in a structured report is precisely the not-examined-read-as-
  passed conflation the criteria forbid.
