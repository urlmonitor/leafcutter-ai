notes: |
  NAMED AS A BEHAVIOUR TO SATISFY, NOT A RISK TO NOTE. The parent L1's boundary
  lists three collision sources and requires them addressed rather than assumed
  away. This is the first of the three. The other two are TQ-600b-3 (git against
  the real checkout) and TQ-600b-4 (shared result sinks).

  WHY AN EXAMINATION AND NOT JUST "RUN IT AND SEE". A fixed-path collision is
  timing-dependent: two workers must reach the same path in the same instant. A
  parallel run can pass a hundred times and fail on the hundred-and-first, so
  TQ-600b-1's equivalence run cannot be relied on to surface this class. A standing
  examination catches the offender by construction rather than by luck, and keeps
  catching it as tests are added.

  THE LAST TWO CLAUSES ARE BOTH ANTI-FALSE-GREEN AND THEY DIFFER. The inspected
  count catches an examination whose file discovery is broken and which therefore
  reports clean over an empty population. The deliberately introduced offender
  catches an examination that walks every file and recognises nothing. This repo
  has shipped both shapes.

  DELIBERATELY NOT SPECIFIED: whether the examination is a static inspection of
  test sources or a runtime observation of the paths tests actually open. Either
  can satisfy these criteria; the choice is the it-po's.
