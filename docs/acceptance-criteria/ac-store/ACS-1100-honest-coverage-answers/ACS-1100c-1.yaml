criteria: |
  Given an answer measured against a total of 31 records that covered 0 of them and
    declares no exclusion,
  When the answer is about to be returned to its caller,
  Then the result is withheld and a halt is reported that names the shortfall as 31
    records unaccounted for, alongside the total of 31, the covered count of 0, and
    the declared exclusion total of 0,
  And the withheld result is not returned in any reduced, partial, or best-effort
    form, so no caller can act on it,
  And the same halt is raised for a partial shortfall: 148 covered plus 24 declared
    exclusions against a total of 180 halts naming 8 records unaccounted for,
  And an answer a caller deliberately narrowed does NOT halt, because its
    out-of-scope records are a declared exclusion under a legitimate ground: a run over
    3 staged records in a store of 2,784 reconciles as 3 covered plus 2,781 excluded
    as outside the requested scope, is returned, and reports both the scope total and
    the store total,
  And a narrowed answer that reports only its scope total, without naming the scope
    and without the store total alongside it, halts rather than passing, so scope
    cannot be used to hide a denominator,
  And a halt that asserts a shortfall exists without naming how many records are
    unaccounted for does not satisfy this criterion,
  And emitting a warning while still returning the result does not satisfy this
    criterion.
