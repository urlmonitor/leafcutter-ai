assigned_agent: llm-expert
estimated_complexity: S
declares_side_effect: false
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/agents/product-owner.md
  n_location_rule: "all -- every agent template whose body names a mutating tool for a mandatory step; THREE violate it today (product-owner, business-analyst, it-po), and the check must be derived rather than enumerated so the fourth is caught on arrival"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python -m pytest unit_tests/commit_guardian/ -q"
    - "python scripts/build.py --target-dir . --dry-run"
  constraints:
    - "GRANT THE CAPABILITY, DO NOT DELETE THE INSTRUCTION. The tempting fix is to remove the 'use an Edit call' line from the three templates, which makes the rule pass while leaving the agents doing whole-file rewrites on untracked, unrecoverable AC YAML. That trades a caught contradiction for an uncaught hazard. This is AR-200a-1 constraint 1 in its second form."
    - "REQUIRES_VERIFICATION IS ALREADY SATISFIED HERE. All three templates already declare requires_verification: true because they already hold Write, so adding Edit does not trip registry_validator.py rule A. Verified by a dry-run build: zero errors. Do not assume this for a fourth instance that holds no mutating tool yet."
    - "DERIVE BOTH SIDES, DO NOT HARDCODE THE THREE NAMES. A test naming product-owner, business-analyst and it-po passes forever and would not have caught any of them before they shipped."
    - "MATCH THE INSTRUCTION, NOT THE BARE WORD. `Edit` as a tool name and 'edit' as ordinary English are different things. A detector matching the bare word flags most of the registry and is worse than no detector, because a noisy rule gets disabled. Match instruction phrasings against the backticked tool name, case-sensitively, and carry a control case proving benign prose does not fire."
    - "SCOPE TO MUTATING TOOLS. A body naming a read-only tool it does not hold is also a bug, but a harmless one: the agent cannot proceed, loudly. The gap worth a gate is the one where the agent CAN proceed by a riskier route, and does."
    - "GUARD THE SCAN ITSELF. A rule that resolves to zero templates passes forever. This repo shipped exactly that in validate_ac_schema.py, where a bare directory argument matched nothing, printed a success line and exited 0 for eight days (KI-ACS-001). Assert the scan reached the registry."
