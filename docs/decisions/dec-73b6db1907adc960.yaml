rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.workspace_skill_rendered_root] Render the Codex
    skill from the same in-package source into the workspace root where sessions run, with the repository root fixed at install
    time and a prefix rule for the kernel command (required mean 0.77, 2/4 passed); 2. [opt.user_skill_network] a user-level
    skill in ~/.agents/skills/leafcutter with network access enabled in ~/.codex/config.toml (required mean 0.36, 0/4 passed);
    3. [opt.repo_skill_rules] a repo-level skill in .agents/skills/leafcutter with a .codex/rules prefix rule that allows
    only the kernel command (required mean 0.27, 0/4 passed). human:user chose option [opt.workspace_skill_rendered_root]
    Render the Codex skill from the same in-package source into the workspace root where sessions run, with the repository
    root fixed at install time and a prefix rule for the kernel command (kernel rank 1 of 3).'
