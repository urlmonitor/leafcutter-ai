notes: |
  2026-09-30: authored alongside the change it describes. BO-2400a-1-i built the
  command-step-runner agent and is done; nothing covered the lane actually USING it,
  and its own adopter_notes recorded adoption as "routed separately". This record is
  that adoption, for the claim step only.

  The remaining roughly forty shell dispatches across six workflows are enumerated in
  KI-BO-20260927-status-checker-runs-workflow-shell-commands, whose Suggested fix
  names this agent as the durable answer and worktree-agent as "a stopgap, not the
  answer". Those are deliberately NOT in scope here; this record covers one dispatch,
  so that the first adoption is proven before it is repeated.

  Not in scope, and still live: fast-lane-ship.js keeps `RELEASE_EXECUTOR_AGENT_TYPE
  = "python-coder"` and two read-only `status-checker` dispatches at the resolve and
  producibility steps. The release path is the inverse operation on the same state and
  is the more obvious next adopter.
