    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "No-op resume result when no pending pause exists."
    properties:
      resumed: {type: boolean, description: "must be false"}
      answer_applied: {type: boolean, description: "must be false"}
      state_unchanged: {type: boolean}
      report: {type: string, description: "e.g. 'nothing to resume' — not an error"}
    required: [resumed, answer_applied, report]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Submitting an answer/resume for a run with no pending question (running, completed, or cancelled) must be a safe no-op: no step resumed, no answer applied, existing state unchanged, and the submission reported as 'nothing to resume' rather than erroring."
    - "Guards the resume side against being invoked when nothing is waiting — must be a safe no-op, not a crash or a spurious re-run."
  delivers_shape:
    description: "No-op assertion surface; no downstream producer."
delivers_to: null
expects_from:
  ac_id: BO-2300e-1
  contract: "The durable resume path; this edge asserts it is a safe no-op (report 'nothing to resume', state unchanged) when the run has no pending pause."
