priority: high
roadmap_phase: phase_1
criteria: |
  Given the guarding test entries of requirement TQ-9101 name the wrong
    versions "drop the retry_due condition" and "the gate always allows", and
    also "retry on a timeout", while the code as written in refresh_config.py
    contains "if refresh_due and retry_due" and has no timeout handling,
  When the wrong versions are prepared for the runs,
  Then "drop the retry_due condition" becomes one alteration of the code as
      written, changing "if refresh_due and retry_due" to "if refresh_due" and
      nothing else,
    And "the gate always allows" becomes one alteration after which the
      refresh runs whatever refresh_due and retry_due hold, and nothing else
      changes,
    And each alteration is shown next to the name it was prepared for, so a
      reader can check the one against the other,
    And "retry on a timeout", which names behaviour the code does not have, is
      reported by name as "could not be prepared" with a one-line reason, and
      the work stays unfinished until it is resolved; it is never dropped
      without a word,
    And the preparer neither runs the tests nor says whether a test would
      catch a wrong version; that is decided by the runs,
    And "the fix undone" is not prepared by the preparer at all; it is the
      code as it stood before the work began.
