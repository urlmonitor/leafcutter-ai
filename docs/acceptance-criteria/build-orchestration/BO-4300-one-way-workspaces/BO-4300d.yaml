criteria: |
  Ask again any time -- it finishes what was left and never makes a twin.

  If making a workspace was interrupted part-way, the next request for it brings that
  workspace to fully ready instead of reporting the broken one as fine or starting a
  second copy beside it. A healthy workspace is simply handed back, and a place already
  holding different work is left untouched and reported rather than taken over.
