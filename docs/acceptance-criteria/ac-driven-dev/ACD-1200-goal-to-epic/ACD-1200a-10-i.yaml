it_requirements:
  - "When the default-filtered leaf set is empty, goal-mode must route into the same zero-leaf failure path already specified by ACD-1200a-3-i (no epic folder, no ticket files, non-zero exit), rather than assembling an empty epic."
  - "The error message must make the cause distinguishable from the structurally-leaf-less case: it must indicate that buildable leaves were excluded because they are all done or superseded, so the user understands the goal is complete/retired rather than undecomposed."
  - "Detection must occur before any file system writes (no epic folder mkdir, no ticket write, no AC YAML mutation). Wrap any I/O per the project error handling policy and exit non-zero."
