roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, a subagent named python-coder, and each of
    these commands, every one of which records a commit when run:
    (a) `git commit -m "x"`,
    (b) `git -C ../worktree commit -F msg.txt`,
    (c) `git -c user.name=bot commit -m "x"`,
    (d) `git --no-pager commit --amend --no-edit`,
    (e) `git add -A && git commit -m "x"`,
    (f) `cd ../worktree; git commit -m "x"`,
    (g) `/usr/bin/git commit -m "x"`,
    (h) `git  commit -m "x"` with two spaces, and the same command broken across two lines by a
        trailing backslash between git and commit,
    (i) `GIT_DIR=../worktree/.git git commit -m "x"`,
  When each is issued,
  Then each is recognised as a commit and refused for that caller, and no commit is added to the
    history,
    And each refusal quotes the command it recognised as a commit.

  Given the same commands (a) to (i) issued by the top-level session in the default interactive mode,
  When each is issued,
  Then each is put to the person at the permission prompt (GE-129d-1) and none runs before the
    person answers.
