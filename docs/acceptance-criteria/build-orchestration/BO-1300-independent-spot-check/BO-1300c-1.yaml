estimated_complexity: M
it_requirements:
  - "The reviewer agent template must constrain its tool surface to read + exercise the feature (read files, run the feature's own entry points/commands, feed inputs); it must not be granted or use a test-runner invocation as its review method."
  - "The reviewer prompt must explicitly forbid running the unit test suite and forbid creating or editing any test files, and require findings to be framed as observed gaps from using the feature rather than test pass/fail output."
  - "A reviewer that cannot exercise the feature for its angle must report that limitation explicitly (per BO-1300c-1-i) rather than substituting test output."
