it_requirements:
  - "SHIPPING ORDER (binding): the refusal text that names `feedback-id: (not-a-signoff)` must not merge before BO-2000g-2 has defined that value in templates/skills/signoff/SKILL.md. Otherwise the refusal points at a value a reader cannot find. If both land in one change, the skill's definition and the refusal text must agree byte for byte on the value."
  - "The refusal names the remedy by the same script path and section the signoff skill uses (scripts/feedback/submit_feedback.py, §2a) and restates no second procedure. The text the committer receives from the DEPLOYED hook must contain that literal path. Verify it from the deployed layout, not the source tree."
  - "The remedy text is fixed. It is identical on every route and for any number of offending headings, and only the list of quoted headings varies. Every offending heading is quoted in full under its ticket path. None is truncated, and none is de-duplicated across files."
  - "The refusal text contains no bypass token, no instruction to add words to the commit message, and no name of a skip setting. That includes the commit framework's per-hook SKIP setting and the shared commit step's skip handling. This forbids advertising only. The settings' behaviour is unchanged."
  - "The refusal does not offer hand-typing a feedback-id line as a remedy for a sign-off. Whether the failure fallback value is ACCEPTED stays with the value-shape check (INF-500d-3 and later) and is not changed here."
  - "PERMITTED, NOT REQUIRED: the refusal may mention that a heading which records no phase-agent sign-off can be written outside the sign-off heading form."
  - "TEST EVIDENCE (binding): assert the refusal text as the committer receives it, from a real git commit on the inline route and from the shared commit step's answer on the agent route. Calling the message-building code directly is not evidence (GE-123c anti-precedent). Hand-writing COMMIT_EDITMSG and environment simulation are not evidence either (FP-7). Expected test home: unit_tests/commit_guardian/, reusing GE-123e-1's harness."
  - "CANONICAL SOURCE: templates/scripts/commit_guardian/check_feedback_id.py (ADR-001). The deployed copies are build outputs."
  - "AUTOMATED FIX-UP INSTRUCTION (fourth scenario; BA amendment approved by the person 2026-11-16). The check-feedback-id entry of templates/scripts/precommit-autofix.json (about :155-165) is what the shared commit step's fix-up is given for this check's refusal. Today its `description` and `instruction` both read 'Agent comment is missing feedback-id: line. Add the feedback-id per signoff SKILL.md §2a.', which invites a typed id. After the change, both fields name scripts/feedback/submit_feedback.py and signoff §2a as the only source of an id, say that the id a run of that script prints for that sign-off goes on the feedback-id line directly beneath the heading, name the literal line `feedback-id: (not-a-signoff)` (BO-2000g-2) for an entry that signs nothing off, and give no other way to add a feedback-id line: no bare 'add the line', no fallback value to type and no invented id. The wording agrees with the refusal's remedy text wherever the two name the same script, section or value. The entry's other keys (hook_id, category, model, subagent_type, disposition, agent, skills) are unchanged by this record. Edit the template only; the deployed copy (.claude/precommit-autofix.json in a built layout) is a build output (ADR-001). The file must stay valid JSON and every other entry must stay byte-identical."
  - "FIX-UP EVIDENCE. The instruction clause is proven from the instruction text as the routing actually hands it to the fix-up for a check-feedback-id refusal, read from the deployed layout, not only from a search of the template. The two behaviour clauses of the fourth scenario describe what an LLM fix-up agent writes; that is not deterministic behaviour a unit test can run, so they carry needs_test false and are reviewed against the instruction. No test may fake a fix-up run by writing the repaired ticket itself and asserting on it."
test_intent:
  - clause: the refusal names the ticket file "tickets/00_inbox/TICKET-demo.md" and quotes each of the two headings in full
    needs_test: true
    reason: The quoted headings are computed from the staged diff, and dropping or truncating the second heading is a realistic fault.
  - clause: it names the feedback submission script "scripts/feedback/submit_feedback.py" and the sign-off skill's section §2a as the way to obtain a real feedback id
    needs_test: true
    reason: The remedy text is what this record delivers, and it must be shown reaching the committer through a real commit, not through a direct call to the message builder.
  - clause: it says that the id that script prints goes on a feedback-id line beneath the heading
    needs_test: true
    reason: The placement instruction is part of the emitted refusal and can be lost when the remedy text is rewritten.
  - clause: 'it says that an entry which signs nothing off carries the line "feedback-id: (not-a-signoff)", and names no other value or convention for such entries'
    needs_test: true
    reason: The value must match BO-2000g-2's definition verbatim, and a second convention in the emitted text is a defect a test can catch.
  - clause: it does not offer typing a feedback-id line by hand, without running that script, as a remedy for a sign-off
    needs_test: true
    reason: Agents demonstrably took the hand-typed shortcut that the old text offered, so its absence from the emitted refusal needs proof.
  - clause: it contains neither the token "[NO-FEEDBACK-CHECK]", nor any instruction to add a word to the commit message, nor the name of any setting that switches the check off, Because a refusal that keeps offering a dead escape hatch sends every reader down a dead end, and one that says only "add a line" invites the hand-typed id that the record then cannot tell apart from a real one
    needs_test: true
    reason: A leftover bypass advertisement is a string in the emitted output, and a search of the real refusal catches it.
  - clause: the refusal quotes only that one heading and carries the same remedy text as the inline-message refusal
    needs_test: true
    reason: The agent route carries the check's output inside the shared commit step's answer, so the text must be compared as that caller receives it.
  - clause: 'the feedback-id line it puts beneath the python-coder heading carries the id printed by a run of "scripts/feedback/submit_feedback.py" that the fix-up made for that sign-off, or "feedback-id: (not-a-signoff)" when the entry signs nothing off'
    needs_test: false
    reason: What the fix-up writes is produced by an LLM agent at commit time, which no unit test can run deterministically, so the clause is held by the instruction it receives (proven under the third clause of this scenario) and checked at review.
  - clause: it never puts beneath a heading a feedback-id value that no run of that script printed
    needs_test: false
    reason: An agent's choice not to type a value cannot be exercised by a deterministic test, so the guard is the routed instruction, which is tested, and the later value-shape check on the hook.
  - clause: 'the instruction the fix-up is given names that script and the sign-off skill''s section §2a as the only source of an id, names "feedback-id: (not-a-signoff)" for entries that sign nothing off, and does not tell it to add a feedback-id line by any other means, Because a refusal that stops inviting the hand-typed id is undone if the automated repair it routes to still types one'
    needs_test: true
    reason: The routed instruction is data the fix-up receives for this check's refusal, and today's text invites a typed id, so a test of the instruction as routed catches a stale or partly updated entry.
