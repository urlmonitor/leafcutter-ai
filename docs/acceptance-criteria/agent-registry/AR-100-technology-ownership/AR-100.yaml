roadmap_phase: phase_1
criteria: |
  Work goes to an expert in that technology — never to a stand-in.

  When you ask for a change, it is picked up by a specialist whose expertise
  actually matches the technology involved, in your own project as well as in
  leafcutter's own machinery. There are no unclaimed technologies where the
  system quietly falls back on whoever happens to be nearby, and no ownership
  that survives only because everyone has been copying the last person's guess.
  Because the match is real rather than borrowed, the safeguards that check
  whether the right specialist was chosen stay trustworthy: a warning means
  something is genuinely wrong, not that the warning can be ignored.
notes: |
  Authored 2026-08-18 from BrainCandy's request. Deliberately excluded from
  scope, at BrainCandy's direction: making technology ownership configurable
  per installed project, and splitting specialists along frontend/backend
  lines. Both are larger redesigns of how ownership is decided; the goal here
  is to close the gap without presupposing or blocking that direction. No
  criterion below may assume ownership is read from per-project configuration.
