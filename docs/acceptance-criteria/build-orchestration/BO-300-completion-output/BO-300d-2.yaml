notes: |
  THE ESTABLISHABLE SET IS FIXED AND IS NOT A DESIGN CHOICE AT L2. Plan membership
  plus the completed record gives "planned and not finished"; a recorded outcome for
  the piece gives "stopped part-way"; anything else gives "cause not determined".
  Splitting "never selected" from "arrived after the run started" would need a
  plan-time listing of the body of work, and there is no such value — asking for it
  at L2 would reproduce the defect this record exists to fix.

  NOT A RELAXATION. "Cause not determined" is an obligation to be explicit, not a
  licence to omit the piece: the piece is still named, still counted (BO-300d-1) and
  still carries an action (BO-300d-3). A report that drops undetermined pieces
  rather than labelling them fails this record.

  The phrase "discovered after planning" survives as stale terminology in
  BO-300a-5-i and BO-300a-5-iii. It is deliberately not used here and must not be
  reintroduced.
