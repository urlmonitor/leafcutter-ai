criteria: |
  Given the usage and outcome behaviours DK-300f-1 to DK-300f-4,
  When a reader opens the usage and outcomes reference,
  Then it states how the usage count is generated and checked for freshness, and that it is never written by hand,
  And it states the key and context of an outcome row, the sum rule, the full-rebuild rule and that rows exist only for published categories,
  And it states what happens without a learning store or with self-learning switched off,
  And it states that neither usage nor outcomes change which categories are offered, and that usage alone is never evidence of a category's correctness (ADR-056).
