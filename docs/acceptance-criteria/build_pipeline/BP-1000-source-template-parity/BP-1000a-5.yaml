assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Relocate the CANONICAL feedback deployable-script source into the tracked templates mirror templates/scripts/feedback/, mirroring the templates/scripts/commit_guardian/ pattern that _manifest_commit_guardian_scripts() already scans. The feedback manifest builder (_manifest_feedback_scripts in scripts/build.py) and the feedback deploy phase (build_feedback / feedback_src in scripts/build_phases.py) must READ from templates/scripts/feedback/, not from the gitignored working-tree scripts/feedback/."
  - "After relocation the build's feedback source resolution must contain no dependency on the gitignored scripts/feedback/ working copy: a fresh clone with that directory absent must still resolve a non-empty feedback script set. The resolution must be a function of tracked files only (git-tracked templates/scripts/feedback/), so the result never depends on leftover working-tree files."
  - "Preserve the ADR-001 self-hosting boundary: the DEPLOYED feedback output directory (scripts/feedback/ in a target / the self-build) remains a build output and stays gitignored. This AC changes only the build's READ source-of-truth to a tracked home; it must NOT commit build outputs into source control and must NOT change where the build WRITES feedback scripts."
  - "Maintain build.py round-trip parity per ADR-001/ADR-013: the relocated source under templates/scripts/feedback/ is the package source that the build deploys and shims; never split the canonical source across both the gitignored scripts/feedback/ and the tracked mirror. The single canonical home after this change is templates/scripts/feedback/."
  - "The relocation must not change the deployable feedback script SET or its shimming behavior (that no-regression guarantee is asserted by BP-1000a-6): the same feedback scripts the pre-relocation build resolved must be resolved from the tracked mirror."
  - "Wrap any filesystem enumeration of the source directory per the project error-handling policy (CLAUDE.md Rules 1-3): a missing/empty tracked source must surface as a clear, loud failure (the feedback set must be non-empty), not a silent empty deploy."
delivers_to:
  agent: python-coder
  contract: "The resolved feedback deployable-script set, sourced from tracked templates/scripts/feedback/ (repo-root-relative POSIX paths), is the input both to the downstream deploy+shim step asserted by BP-1000a-6 and to the fresh-clone/tracked-only build assertions in BP-1000a-5-i and BP-1200a-1-iii."
