amended_by:
  - "split: BP-100k -> BP-100k + BP-100n [Pattern C, 8 L2 children -> 5 + 3], 2026-08-26. BP-100k had accumulated 8 L2 children against a default cap of 5 and was carrying child_limit_override: 9 as an explicit temporary waiver. Three of its children — the former BP-100k-6, BP-100k-7 and BP-100k-8 — turned out to share a rule distinct from the drift-comparison theme the rest of BP-100k covers: an absence must be reported as an absence and never inferred to mean there is nothing to check. They were renamed BP-100n-1..-3 and moved here, and BP-100k's override was removed rather than raised. The rename is required because check_ac_limits.py attributes a child to its parent by deriving the parent from the child's ID string, not from covered_by (GE-106), so a moved child that kept its old prefix would still be counted under BP-100k."
  - "split: BP-100n -> BP-100n + BP-1600a [Pattern C, 6 L2 children -> 5 + 1], 2026-09-07. BP-100n reached six L2 children when the session-hook wiring census (BP-100n-6) was authored, against a default cap of five, and no child_limit_override was added — deliberately, since that record's subject is guards that were silenced. The user chose SPLIT, following this family's own precedent: BP-100k sat at eight on a live override and was split into BP-100k + BP-100n, DISCHARGING the override rather than renewing it. BP-100n-6 and its three technical-constraint children were renamed BP-1600a-1 and BP-1600a-1-i/-ii/-iii and moved to the new L1 BP-1600a under the new L0 BP-1600. The rename is forced, not cosmetic: check_ac_limits.py derives a child's parent from its ID string, not from covered_by (GE-106), so a moved child that kept its old prefix would still count against BP-100n and the commit would still be blocked. THE SEAM, AND WHAT IT COST. The six children clustered three-and-three: an ABSENCE-REPORTING group (-1, -2, -5 — an absence is reported as an absence, never as nothing to check, which is this record's own title) and a POPULATION group (-3, -4, -6 — the set a check walks is taken from reality, never from a list that can omit things). The honest seam lifts the whole population group out. Only -6 was lifted. -3 is work_status done with covers-tags in scripts/build_phases.py and a test file named after it, so renaming it would break an evidence chain from inside a structural move; -4 is cited from roughly sixty places across the GE-127 folder, GE-126b-5, the GE-120f family, BO-210a-2, two reference docs, a PROJECT_CONTEXT, a ticket and a unit test, plus five more references added by the OPEN, UNMERGED PR #726 on a branch that cannot be edited from here. So BP-100n still hosts two population records under an absence-reporting title. That is a known, recorded inaccuracy with a stated remedy, not an oversight — see BP-1600a's notes for the migration path and its precondition (PR #726 merged first). BP-100n is now at exactly five children: at its cap, not over it, and with no waiver."
  - "split follow-up: BP-100n-4 -> BP-1600a-2 [the deferred second half of the 2026-09-07 split], 2026-09-07. The entry above recorded that the honest seam lifted the whole POPULATION group out of BP-100n and that only BP-100n-6 could actually be lifted, leaving -3 and -4 hosted under an absence-reporting title as a known, recorded inaccuracy with a stated remedy. That remedy is now executed for -4. BP-100n-4 and its two technical-constraint children were renamed BP-1600a-2 / -2-i / -2-ii and moved to docs/acceptance-criteria/build_pipeline/BP-1600-counted-from-reality/. THE PRECONDITION WAS MET, WHICH IS WHY THIS RAN NOW AND NOT THEN: the blocker was PR #726, open and unmerged at the time of the split, which added five references to BP-100n-4 from GE-120c-6, GE-120f, KM-ADM-001, TQ-100b-5 and TQ-100c-2-i on a branch that could not be edited from the split's worktree. #726 has merged, so all five were visible and were rewritten with everything else. THE CITATION SWEEP WAS FOUR TIMES LARGER THAN THE SPLIT ESTIMATED: the split's notes said 'roughly sixty places'; the measured figure at the time of the move was 232 occurrences across 50 files (160 bare BP-100n-4, 17 -4-i, 49 -4-ii, plus 30 folder-qualified doc_link paths and 6 occurrences outside the AC store). 224 of the 232 were rewritten; the 8 left standing are argued below. Nothing else changed on the moved records — criteria, readiness (approved), req_status, work_status and priority are untouched, and no child_limit_override was added anywhere. BP-100n drops to FOUR children, below its cap. BP-100n-3 stays, and its ground is unchanged and still good: it is work_status done with covers-tags in shipped source and a test file named after it, so renaming it would break an evidence chain from inside a structural move. BP-100n therefore still hosts ONE population record under an absence-reporting title rather than two."
