id: BP-1100e-1-iii
readiness: approved
priority: high
title: "A docs-only or config-only ticket with legitimately narrow scope is not false-flagged"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket whose declared files_touched are documentation-only
    (e.g. ["docs/how-to/recovery.md"]) or config-only (e.g. ["config/paths.json"])
  And its actual changes touch only those same declared documentation/config files
    and no source file with a .py/.sql/.ts/.tsx/.js extension
  When the pre-done reconciliation runs
  Then it does NOT flag the ticket — a legitimately narrow docs-only or config-only
    change whose actual diff matches its declared scope is a clean pass, not a mismatch
  And the reconciliation only ever flags on an actually-changed SOURCE file that is
    undeclared, so a ticket that changed no undeclared source file is never flagged
depends_on:
  - BP-1100e-1
doc_links:
