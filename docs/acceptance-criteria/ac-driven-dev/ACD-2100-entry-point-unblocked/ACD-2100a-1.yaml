notes: |
  SITE 1 OF 5 (the one KI-ACD-004 names). Verified by the PO on 2026-08-25:
  templates/workflows-js/plan-feature.js line 1800 shells
  `{{config.output_root}}/scripts/setup_ticket_worktree.py`, and
  `{{config.output_root}}` expands to the BARE NAME `.leafcutter`, so the path is
  resolved against whatever the caller's working directory happens to be. In the
  ADR-001 dev layout that selects the deployed build-output copy in the untracked
  workspace parent.

  WHY THE TWO-DIFFERENT-COPIES GIVEN. A test that places only one copy on disk
  cannot fail: whichever path is resolved, the same file runs. The two copies must
  be distinguishable in observable output (an argument echo, an exit banner, a
  marker on stderr) or the Then clause is unfalsifiable. This is the same fixture
  bias that hid the defect -- see ACD-2100a-2's note on the tmp_path fixture.

  THIS IS THE PATH HALF ONLY. Even the right copy still has to find the repository
  it operates on; that is ACD-2100a-2, and both layers are needed to reproduce the
  observed failure. Do not let one close the other.

  SIBLING SITES: ACD-2100a-3 (registry) and ACD-2100a-4 (pause store) are the same
  defect at three further sites. ACD-2100a-5 is the anti-regression that covers the
  class from an arbitrary working directory.

  BUILD-SURFACE CONSTRAINT (ACD-2100d): a repair applied to the deployed copy under
  .leafcutter/ evaporates on the next build. The change lands in templates/.

  2026-08-25 (it-po): assigned python-coder -- the registry gives python-coder
  `owns_file_extensions: ['.py', '.js']`, so the JavaScript workflow template and the
  Python setup script are one owner and this AC needs no split. The S2.8
  intent-vs-surface check passes: every extension in the declared surface is one the
  assigned implementer and its pytest harness can act on. `workflow-architect` was
  considered and rejected -- it is `is_ticket_phase: false` and cannot be dispatched
  as an implementing phase. The doc_links entry with `relationship: implements` is
  what puts templates/workflows-js/plan-feature.js into the generated ticket's
  files_touched; the `describes` entries are informational and deliberately stay out
  of it.
