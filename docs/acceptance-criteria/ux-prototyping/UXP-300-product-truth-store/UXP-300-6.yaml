change_target: config
risk_surface: internal
test_spec:
- name: test_flow_with_a_diagram_passes_the_validator
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: real_artifact
  description: A generated fixture store whose flow carries a diagram block passes validate_product_truth.py.
- name: test_unexpected_top_level_key_still_fails_the_validator
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: discrimination
  description: The same store with an undeclared top-level key fails, and the failure names the key.
- name: test_diagram_members_are_strict
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: unit
  angle: boundary
  description: A diagram node missing source_ref, a node carrying an undeclared member, and a zero-width
    canvas are each refused by flow.schema.json.
test_required: true
declares_side_effect: false
notes: Upstreamed from DIAGraph, whose flows a2a-langgraph-engine, a2a-langgraph-engine-v2 and
  a2a-global-resolution-learning carry this block and whose site reads it. The block is copied
  unchanged from DIAGraph's schema so those flows validate without edits.
