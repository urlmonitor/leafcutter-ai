criteria: |
  Given the commit-guardian manifest,
  When it is read,
  Then the self-healing hook is the entry at index 0 (registered first, before any
    other hook).
  And given a commit is attempted in a worktree where `.pre-commit-config.yaml`
    does not resolve to a readable file,
    When the self-healing hook runs,
    Then it re-materializes the config by creating a `.leafcutter` symlink to the
      main tree's `.leafcutter` (located via the shared git dir), or by copying
      the config when a symlink cannot be created,
    And after it runs the worktree's `.pre-commit-config.yaml` resolves and the
      remaining hooks run against the restored config.
depends_on: [BO-1700c]
