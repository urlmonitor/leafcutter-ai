notes: |
  USER DECISION Q5 (2026-09-17): fix first. This record turns the ordering into a check rather than
  a sequencing note, so a later edit to the settings cannot widen an unrepaired guard. The
  task-lock guard is excluded by the same decision (it already blocks). The pairing clause is
  mandatory: a check that names nothing passes every absence clause.

  delivers_to GE-130a-1 / GE-130a-2: those widenings may only be switched on once this check
  accepts them.

  declares_side_effect: false.
  IT-PO ENRICHMENT (2026-09-25).

  WHERE THE RECORD LIVES AND WHAT READS IT. session_hooks_manifest, a new top-level section of
  templates/scripts/commit_guardian/commit_guardian.json, created by GE-130f-1 and keyed by hook
  script filename; each entry carries entry_point, negative_control and currently in
  config/verification_flow.schema.json's own shapes, plus the settings.json matcher it is
  reconciled against. Two readers: GE-120f-1's liveness runner writes currently from observation,
  and this check reads it.

  SWITCHED ON IS DERIVED FROM THE FILE THE HOST READS. A guard has command coverage when its
  script appears under a PreToolUse matcher that includes Bash in templates/settings.json. A
  boolean beside it in commit_guardian.json would be the gate that does not gate - the same shape
  as a JSON schema that is a no-op fallback while a manual branch is authoritative.

  THE LOAD-BEARING ENFORCEMENT POINT IS THE COMMIT GATE. A hooks_manifest.hooks entry, so a
  commit widening templates/settings.json is refused. The unit tests under unit_tests/ are the
  second point and are not load-bearing. Naming consequence, inherited from GE-120f-1's note:
  hook_parity.hook_script_patterns is ["check_*.py", "run_hook.py", "regenerate_*.py"], so calling
  this check check_*.py puts it into BP-1600a-2's census and it MUST then carry the manifest entry
  it is already taking. Decide the name deliberately and record it in the ticket.

  THE EXEMPTION IS DATA. The user decision places the task-lock guard outside this rule. It is
  excluded by an exempt_from_edit_path_gate field with a reason on its own manifest entry, never
  by a name in the checker - so a future exemption is a data edit and a renamed guard cannot
  inherit someone else's exemption. The rename-both-ways descriptor is what makes that testable.

  PACKAGE SURFACE. One new hooks_manifest.hooks id, which _package_surface_registry watches by
  id. Declared, with the structured spec.

  LOCATION DECIDED 2026-09-25. The user confirmed that session-hook verification state lives in
  a new top-level session_hooks_manifest section of
  templates/scripts/commit_guardian/commit_guardian.json - decided 2026-09-25.
