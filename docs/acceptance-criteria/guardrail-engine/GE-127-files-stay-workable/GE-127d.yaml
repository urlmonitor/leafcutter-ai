id: GE-127d
title: "The limit you are shown is the limit that is applied"
component: guardrail-engine
components:
  - commit_guardian
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  What the standard says it does is what it does.

  The rule you read — which files it covers, when it applies, and how big is too
  big — is the rule you get, and the size you are quoted for a file is one you
  can arrive at yourself. Nobody plans a change around a published rule and then
  discovers a different one was enforced, and nobody is told a file is a size
  that does not match what they can see in it.
