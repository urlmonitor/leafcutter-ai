assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "The surface is the ticket-supervisor template prose at templates/agents/ticket-supervisor.md, section 'Docs-only / config-only test-writer skip rule'. Today that rule treats an ABSENT '## Test Requirements' block as a blanket skip-for-everyone — that is the silent-skip defect this AC fixes."
  - "Rewrite the skip rule so the absent-section branch is conditional on files_touched: when the section is absent AND files_touched contains a qualifying implementation .py, the supervisor must HALT with a structured error rather than marking test-writer signed_off — the error must name the implementation file and the ticket."
  - "When the section is absent AND files_touched is docs/config/tickets-only, the supervisor still skips test-writer and records the legitimate docs/config-only skip reason; this path must not halt."
  - "The supervisor template cannot import the generator's Python helper. Mirror the implementation-.py classification rule by SPEC PARITY against the single normative definition in docs/reference/ac-schema.md (the same rule TKT-500f-6-iii-a publishes) so the supervisor's notion of 'implementation .py in scope' cannot drift from the generator's."
  - "Per ADR-006, the test-writer decision stays in the ticket-supervisor's existing depth-1 dispatch; the new halt path must surface the structured error through the normal blocker-escalation channel and must NOT chain a sub-supervisor inline."
delivers_to: null
