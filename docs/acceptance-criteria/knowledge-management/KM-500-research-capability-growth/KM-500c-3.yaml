criteria: 'Given a build fails validation, an activation fails, a continuation repeats without new evidence, or
  the shared attempt/time/cost budget is exhausted

  When the waiting research handles that outcome

  Then it records a bounded failed, partial or blocked result with the original unresolved question and specific
  reason

  And it neither retries the same unchanged candidate indefinitely nor resets the original research budget

  And repeated process restart or child delivery cannot turn a failed build into verified registration

  And a later authorized attempt with new information may reuse the recorded gap and original context without losing
  prior failures.

  '
