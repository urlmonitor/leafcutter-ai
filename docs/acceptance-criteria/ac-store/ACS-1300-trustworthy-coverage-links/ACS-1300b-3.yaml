it_requirements:
  - "THE CHECK CONSUMES ACS-1300b-1's PUBLISHED CLASSIFICATION AND DOES NOT RE-DERIVE IT. If the check computes its own view of which paths are bypassing, the guard and the enumeration report on two different pictures and the disagreement is invisible because both are plausible. One producer, one classification, many readers."
  - "THE RESULT MUST BE CONSUMED IN CONTROL FLOW, AND THAT MUST BE PROVABLE BY DELETION. A computed verdict nobody reads is the phantom-done shape one level up and this repository has shipped it: `fast-lane-build.js` passed its structural tests while never executing the gates it computed, and `fast_lane.py`'s `select_batch` call was a silent no-op. Deleting the single line that consumes the verdict must turn a reported case green — that mutation is the requirement, not a test-design suggestion."
  - "IF IMPLEMENTED AS A COMMIT-GUARDIAN HOOK: register it in `templates/scripts/commit_guardian/commit_guardian.json` AND add its module and every module it imports to the build deploy manifest (`deploy_map` in `scripts/build_phases.py`) in the same change. The hook runs from the DEPLOYED layout, so an undeployed import raises ModuleNotFoundError at hook runtime — and once the gate is a required check that crash blocks every merge. `done_proof.py` hit exactly this. Unit tests import from the source tree and mask the gap; verify by running the deployed hook after `build.py`."
  - "IF IMPLEMENTED AS A COMMIT-GUARDIAN HOOK: BE AWARE SEVERAL AC HOOKS IN THIS FAMILY IGNORE `argv` AND READ THE GIT INDEX OR `HOOK_TEST_FILES`. A check whose exit code is verified by passing a path on the command line may never have seen that path; its silence is not a pass. Whatever input channel is chosen must be the one the verification exercises."
  - "A GENUINELY CLEAN REPOSITORY MUST PRODUCE NO REPORT. A guard that fires on everything carries no signal and the reasonable response is to switch it off — the same reasoning `done_proof` already applies to an empty permitted-angle set. The clean-run clause and the reported-path clause belong to one check, not to two modes."
  - "A CHECK THAT COULD NOT RUN MUST NOT REPORT SUCCESS (GE-120, and this check is the textbook case). An enumeration that failed to read the repository yields an empty bypassing set, which is byte-identical in effect to a fully-wired repository. Distinguish could-not-check from checked-and-clean in the outcome, not only in a log line."
  - "THE BLOCK-ON-REAL-VIOLATION POSTURE AND THE FAIL-OPEN-ON-INTERNAL-ERROR CONVENTION ARE ORTHOGONAL AND MUST NOT BE COLLAPSED. A hook crash may exit 0 with a stderr warning; a genuine unwired path must not be downgraded to a warning because the crash path exists. This distinction is recorded in the ac-store PROJECT_CONTEXT and has been collapsed before."
  - "THE CHECK WRITES NOTHING TO THE AC STORE AND NEVER ASSIGNS `work_status`. The tree-wide refusal applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md rules 1-4)."
