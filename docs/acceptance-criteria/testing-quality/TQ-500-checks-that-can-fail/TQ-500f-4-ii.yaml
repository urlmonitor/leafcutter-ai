readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a writer drafts either of two checks —
      C1: "every row in the window has buy_volume >= 0", over a window the
          pipeline fills, where rows the pipeline never processed carry NULL
          and the comparison skips NULLs,
      C2: "every symbol has a value in the live context", where the value is
          present but may be wrong,
  When it answers Q2 (what result would show this assertion can fail, and does
    the fixture produce it) for each check,
  Then for C1 it identifies that an empty or all-NULL window passes, so the
      check passes most reliably when the pipeline is dead, and it adds an
      exact count of processed rows and a non-NULL count before handing on,
    And for C2 it identifies that presence is not correctness, and it adds an
      assertion on at least one known expected value seeded in the fixture,
    And in both cases the report records the vacuous version as a wrong
      version the strengthened test now catches.
