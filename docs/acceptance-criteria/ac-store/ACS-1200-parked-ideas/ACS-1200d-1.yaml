notes: |
  The exit door. A state with no defined way out is a landfill. This AC defines
  the way out as ONE act with both halves in it — marker off, child list on —
  so the before and after are visible in a single change rather than drifting
  across two commits nobody connects.

  The KM-200 notes already carry the prose version of this rule ("do not repair
  the missing link without a decision to un-park this tree"). This AC makes it a
  supported step instead of a warning comment that only works if someone reads
  it; the half-transitions it implies are forbidden by ACS-1200d-2.
