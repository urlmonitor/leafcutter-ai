notes: |
  Anchor case (KI-BO-020, high, open): every failure path in the fast lane
  released its claimed work by dispatching a specialist whose prompt opened "You
  are the release-phase agent" while the dispatch named a read-only reporting
  specialist. It refused — correctly, since reassigning its role is out of scope
  — and because the release is best-effort its reply was discarded. The run
  reported its halt; the claims stayed stuck.

  TWO INDEPENDENT DEFECTS, and the BA should cover both. Doing the action
  directly is the fix. But "the result is discarded" is a separate hazard that
  survives the fix: a required action whose outcome is never inspected cannot be
  known to have happened. Best-effort cleanup is acceptable only where failing to
  clean up is genuinely harmless, and that must be an explicit, recorded choice
  rather than an omission.

  Why the damage was contained, per the known issue — and why that is luck rather
  than design: a fast-lane run claims work in its own throwaway copy of the
  store, so the shared copy was untouched. Any path where a claim reaches a
  shared store strands it for real, and a later guard will then correctly refuse
  to proceed. Cover the shared-store case; do not let the observed harmlessness
  set the severity.

  IT-PO ENRICHMENT NOTE (2026-08-26). All four children are workflow-JS and
  fast-lane Python work, assigned to python-coder (which owns both .py and .js per
  the registry) except the diagram, which goes to architecture-diagram-author
  directly rather than through documentation-expert. The lane's claim and release
  helpers are the concrete subject; KI-BO-022 is recorded as adjacent-but-not-
  claimed by BO-3200b-1-i and that boundary is preserved in the enrichment — these
  ACs specify required BEHAVIOUR of partial claim and partial release, and adopt
  neither that entry's mechanism nor its remediation.
