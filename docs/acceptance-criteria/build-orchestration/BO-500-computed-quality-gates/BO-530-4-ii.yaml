estimated_complexity: S
it_requirements:
  - "Render-tooling-unavailable is a THIRD outcome (inconclusive), distinct from pass and from a genuine render failure; it must never be collapsed into a silent pass."
  - "Worktrees historically lack some hook/tooling wiring, so the tooling-unavailable path is a real, expected branch the gate must handle explicitly with a named reason."
  - "An inconclusive frontend render blocks an 'ok' sign-off on that surface and is escalated to the supervisor (consistent with the inconclusive-not-pass pattern used by BO-1400a-1-i)."
