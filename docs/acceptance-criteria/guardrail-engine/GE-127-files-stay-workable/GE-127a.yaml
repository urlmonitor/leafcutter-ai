priority: medium
roadmap_phase: phase_1
criteria: |
  Told the moment a file crosses the line, not months later.

  The change that takes a file past a workable size is the change you hear
  about it on, while the work is still fresh and undoing it is one decision.
  A file never crosses that line silently and turns up oversized later, when
  splitting it means unpicking everything that has been layered on since.
