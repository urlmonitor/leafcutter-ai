title: "Each requirement tracks its own delivery progress"
component: ticket-creation
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Sign-offs, agent assignments, and work status live on the requirement itself.

  Every AC carries its own delivery state: which agents are assigned, which
  have signed off, and what the current work status is. There is no separate
  wrapper document that must be kept in sync. Progress is visible at the
  granularity of individual requirements, not at a coarser ticket level.
