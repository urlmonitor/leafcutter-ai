notes: |
  THE CANONICAL-SHAPE DECISION, MADE HERE AND NOT LEFT TO THE IMPLEMENTER.
  Both shapes are accepted. The bare path string is named as the form to use in
  a NEW document (GE-118e); the labelled single-key mapping is accepted as an
  equal-status alternate, not as a deprecated one.

  The three options were: accept both; declare the bare string canonical and
  reject the mapping; declare the mapping canonical and reject the bare string.
  Accepting both wins on one fact that outranks taste — the package has never
  declared a shape, so NEITHER corpus is in violation of anything. Rejecting
  either punishes authors for a rule that did not exist at the time they wrote,
  which is the harm the register names rather than a fix for it. Concretely:
  rejecting the mapping fails at least 33 of 50 documents in the reporting
  adopter with no migration tool in the package; rejecting the bare string fails
  essentially every document in this repository. A single-key mapping resolves
  to exactly one path with no information lost and nothing to adjudicate — the
  label is extra information, not a conflict.

  REJECTED MIDDLE PATH, stated so it is not re-proposed: accept both but emit a
  deprecation warning on the labelled form. A warning on 33 of 50 documents is
  noise, and noise on a gate whose current workaround is already
  `SKIP=check-doc-frontmatter` trains exactly the reflex this record exists to
  end.

  ALL THREE FIELDS ARE IN SCOPE, DELIBERATELY. related_docs, related_code and
  architecture_diagrams share one `path_fields` list and one loop in
  validate_paths(); the crash is identical for all three. Fixing only
  related_docs would leave a guard that accepts a labelled entry in one field
  and crashes on the same entry in the next — a rule no author can hold in their
  head. The declaration in GE-118e covers all three for the same reason.

  NOT IN SCOPE, and must not be closed as a duplicate of this:
  check_adr_cross_reference._doc_mentions_adr also consumes related_docs, but by
  raw case-insensitive substring match over the whole file, so it never indexes
  into an element and is unaffected. Leave it alone; changing it to parse
  elements would create a third shape rule for GE-118f to reconcile.

  THE NEGATIVE ARM IS MANDATORY. The second half of the criterion — a labelled
  entry naming an absent path still produces exactly one error, naming the PATH
  and not the raw element — is what distinguishes the fix from unwrapping the
  element and never checking it. An implementation that accepts every labelled
  entry unconditionally satisfies the first half.
