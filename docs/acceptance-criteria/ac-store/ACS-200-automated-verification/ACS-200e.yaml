notes: "Authored by /quick-fix. Root cause: scripts/ac_store/validate_ac_schema.py never loads config/ac_store_schema.json — it imports only sys, pathlib, yaml and _ac_components and performs hand-rolled field checks — despite its module docstring claiming it 'validates the full schema against config/ac_store_schema.json'. The commit-time hook templates/scripts/commit_guardian/check_ac_schema.py does load that schema (SCHEMA_PATH) and run validate_with_jsonschema, so authors get a false green from the standalone validator and only discover violations at commit time.


  REOPENED 2026-08-25 (was work_status: done). The parity criterion is still false. The
  standalone validator contains zero occurrences of `declares_side_effect`; the commit hook
  templates/scripts/commit_guardian/check_ac_schema.py contains three. A file can therefore
  still pass the standalone validator and be rejected by the hook, which is the exact symptom
  the criteria say must not occur. The record is `scope: standing` with `covered_by: []`, so
  nothing was watching it after the initial fix — the schema-file resolution was made common,
  but the hook grew Python-side rules beyond the shared schema and the parity test does not
  see them. Any re-fix must assert parity over the hook's full rule set, not over the schema
  file both sides load."
