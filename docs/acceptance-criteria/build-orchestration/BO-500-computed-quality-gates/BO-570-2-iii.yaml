it_requirements:
  - "Both new gates (the dev-render gate BO-570-2 and the ruff gate BO-570-4) must record machine- and human-readable evidence in the sign-off when they pass, so the gate is auditable and a passing claim can be distinguished from an unrun check."
  - "Evidence must encode the outcome state (passed / skipped / inconclusive) and the surface or file set checked, so audit can separate 'ran clean' from 'nothing to check' from 'could not check'."
  - "The evidence is derived from the runner verdict objects (BO-570-1 render-smoke verdict, BO-570-3 repo-ruff verdict) — the gate records the verdict's outcome, surface/files, and reason rather than re-deriving them in prose."
