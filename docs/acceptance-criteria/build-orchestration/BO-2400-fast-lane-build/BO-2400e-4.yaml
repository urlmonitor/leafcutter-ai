title: "Recording progress on a requirement changes the progress and nothing else"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a requirement's record written in a deliberate order — its identity first, its
    wording next, its links and its long accumulated notes at the end,
  When a lean build records that work on it has begun, and later that it is finished,
  Then the only difference between the record before and after each update is the value
    that says how far the work has got,
  And every other part of the record keeps its original text and its original position
    within the record,
  And a build that carries eleven requirements, each recorded three times as the build
    progresses, changes exactly those thirty-three values and nothing else in the store.
