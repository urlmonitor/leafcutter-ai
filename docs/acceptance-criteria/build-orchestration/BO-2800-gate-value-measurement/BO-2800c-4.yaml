criteria: |
  Given the override record and the per-gate override report,
  When the how-to guide for them is published,
  Then it walks an operator through proceeding past a blocking finding so that the override
    is recorded, showing the reason and the defect identifier being supplied,
  And it lists every field of an override record — the overruled gate, the defect
    identifier, the instance identifier, the piece of work, the time, the authoriser, the
    stated reason, how the override arose, and the unattributed flag — stating for each
    whether the operator supplies it or the system fills it in,
  And it states that the defect identifier names a problem KIND while the instance
    identifier names one firing of it, so a reader understands why the same rule firing
    twice on one piece of work produces two records,
  And it explains that overrides are also recorded without an operator doing anything —
    naming the automated cross-agent phase skip and the absent-manifest assumed pass — so
    a reader does not conclude that the count only reflects overrides someone declared.

  Given the override report,
  When the how-to guide is published,
  Then it walks a reader through producing the report for a chosen window and reading a
    single gate's override rate, its per-problem-kind breakdown, its breakdown by how each
    override arose, and its unattributed exclusions,
  And it defines each reported figure precisely, stating the numerator and the denominator
    of the override rate, the meaning of the per-problem-kind breakdown, and the meaning of
    the subsequent-defect indicator,
  And it states which override records are excluded from per-problem-kind rates and why,
    and that assumed passes are excluded from every override-rate numerator,
  And it states that recording an override adds no approval step and that a failure to
    record never blocks the work,
  And it states that these figures are inputs to a decision that is not yet specified
    anywhere, and takes no position on any threshold or any action, so a reader cannot
    mistake the guide for a retirement policy or go looking for one that does not exist.
