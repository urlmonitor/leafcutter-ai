criteria: |
  Given the guard has identified one or more broken script references
  (scripts referenced in templates but not present in the deployable set),
  When the guard completes its scan,
  Then build.py exits with a non-zero exit code
  And the build does NOT produce a successful output directory
  And no partial deployment is written to the target
