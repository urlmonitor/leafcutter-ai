assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Scope the web-app job with a pull_request `paths:` filter on `leafcutter-web/**` in .github/workflows/ci.yml so the job is triggered only by PRs that change web-app files. This is the single triggering rule shared by all three web-app checks (build/type-check, style, route-render)."
  - "KNOWN GOTCHA (reconcile with BP-1400a-4): a GitHub required status check that is path-filtered will sit as 'expected/pending' forever on a PR where the job never runs, permanently blocking non-web-app PRs. Choose ONE consistent mechanism and apply it identically across all three web-app checks: EITHER (a) required-checks-on-changed-paths / a job that always runs but no-ops (reporting success) when no leafcutter-web/ file changed, OR (b) rely on GitHub's 'skipped required check counts as neutral/passing' behavior — and verify the chosen mechanism actually lets a clean non-web-app PR merge."
  - "The path filter MUST treat 'touches ANY leafcutter-web/ file' as in-scope (not 'touches ONLY leafcutter-web/ files') — see the mixed-change boundary in BP-1400a-2-i."
  - "Path-scoping must be authored so the SAME filter definition is reused (or kept identical) across the a-1 build/type-check, b-1 style, and c-1 route-render jobs — divergent filters would let one check fire while another silently skips on the same web-app change."
test_spec:
  - name: test_web_check_path_filtered_to_leafcutter_web
    target_dir: unit_tests/build_pipeline/
    framework: pytest
    type: unit
    description: "Parse .github/workflows/ci.yml and assert the web-app job(s) are path-filtered on leafcutter-web/** so they trigger on web-app changes; assert the mechanism does not leave a non-web-app-only PR blocked by a never-run required check."
