notes: |
  Edge case ensuring the remedy is correct per retirement kind: a deprecated AC
  has no successor, so the re-point remedy must not be offered; a superseded_by
  AC must name the actual successor from the superseded_by field.

  IT-PO enrichment (2026-06-22): surfaced the schema fact that superseded_by may
  be a string OR a list of successor ids (AC split into multiple successors) — the
  message must handle both. Pinned single-source-of-truth remedy selection shared
  with ACS-900c-1 to prevent drift.
