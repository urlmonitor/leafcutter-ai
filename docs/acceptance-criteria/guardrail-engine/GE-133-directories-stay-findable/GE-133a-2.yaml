assigned_agent: python-coder
estimated_complexity: S
package_surface: false
it_requirements:
  - "Consume GE-133a-1's per-run declaration result and membership answer; do not re-read
    configuration or re-derive membership here."
  - "TWO POPULATIONS, NEVER MERGED. Every folder the commit touches is either judged or set
    aside, never both. The outcome states the judged count and the set-aside count as two
    separate figures, both computed from the folders of this run (no literal). Each
    set-aside folder is named with the ground of the declared location that contains it. A
    set-aside folder appears in neither the within-limit list nor the already-over
    (pre-existing density) list, and never contributes to the refusal decision."
  - "ZERO JUDGED IS NOT CLEAN. When the judged count is 0 the outcome must not contain the
    all-within-limits pass line (or any wording equivalent to it); it states that 0 folders
    were judged and names the set-aside folders. The exit status stays 0 in that case: the
    commit completes."
  - "The judged/set-aside lines are written to the same stream as the check's existing
    verdict lines and appear on both completed and refused runs, so a test and a person read
    them in one place. Wording and placement are the implementer's."
  - "DOCS (folded in, no separate record). docs/pre-commit-hooks.md gains a
    check-folder-density entry stating: the per-folder limit and how files are counted; that
    folders at or below a location declared in folder_density.set_aside_locations are set
    aside and reported with their ground and counted apart; the shipped entry
    (docs/acceptance-criteria/) and its ground; and that an absent or malformed declaration
    judges everything and says so while an empty one simply sets nothing aside. The file
    must still pass check-doc-length: it stands at 292 of 300 lines (2026-10-12), so the
    entry fits in the remaining headroom or tightens existing text; it must not cross 300."
  - "templates/scripts/commit_guardian/ is the SOURCE; scripts/commit_guardian/ and
    .leafcutter/ copies are build outputs."
  - "TESTS. Same harness as GE-133a-1: a real git commit in a scratch repository running the
    deployed check copied from the shared_reference_layout fixture
    (@pytest.mark.shared_layout_reader); no build.py spawn; vary configuration only in the
    scratch copy."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md, rules
    1-4)."
  - "POST-WRITE COMMANDS (from the worktree root): ruff check
    templates/scripts/commit_guardian/; python -m pytest
    unit_tests/commit_guardian/test_folder_density_set_aside.py -q; pre-commit run
    check-doc-length --files docs/pre-commit-hooks.md"
test_spec:
  - name: test_set_aside_folders_reported_with_ground_and_counted_apart
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 1. RED today. One file staged in each of 2 store folders (19 and 30 after) and in
      scripts/tools/, unit_tests/tools/, docs/guides/ (each at most 15). Assert exit 0, the
      output states 3 judged and 2 set aside, names both store folders with the declared
      ground, and neither store folder appears in the within-limit or already-over lists.
    must_catch:
      - "drop set-aside folders from the outcome entirely"
      - "count set-aside folders among the judged and mark them within limits"
      - "print the already-over store folder in the pre-existing density list"
      - "name the set-aside folders but not the ground"
  - name: test_set_aside_count_moves_with_its_population
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 2. RED today. Same commit plus one file in a third store folder. Assert judged 3,
      set aside 3, and the third store folder is named as set aside.
    must_catch:
      - "print the counts observed at implementation time as literals"
      - "drop set-aside folders from the outcome entirely"
  - name: test_store_only_commit_reports_zero_judged_and_no_clean_line
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 3. RED today. Every staged file lies in a store folder. Assert exit 0, the output
      states 0 judged, names each store folder as set aside, and does not contain the
      all-within-limits pass line.
    must_catch:
      - "count set-aside folders among the judged and mark them within limits"
      - "print the all-within-limits pass line when nothing was judged"
      - "drop set-aside folders from the outcome entirely"
test_rationale: >-
  The subject is what the outcome says, so every entry reads the real output of a real
  commit through the deployed check copied from shared_reference_layout
  (@pytest.mark.shared_layout_reader, no build.py spawn). Arm 2 exists because a literal
  count satisfies arm 1; arm 3 exists because a success-shaped line from a run that judged
  nothing is the defect CLAUDE.md names. All three are RED today: the check reports one
  merged figure and prints a passed line on a store-only commit. The docs obligation is
  verified by check-doc-length and review, not by a grep test.
