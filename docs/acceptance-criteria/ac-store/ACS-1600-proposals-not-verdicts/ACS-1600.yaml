  RE-VERIFY at merge time rather than trusting this paragraph; id allocation in
  this store is known-broken.

  Five L1s against a hard cap of seven — two slots of headroom, deliberately
  preserved. No child_limit_override is authored here and none may be added.
  Decompose each of a–e into L2 behaviours; do NOT re-cut the L1 split.

  Authored at the PO stage. L0 and L1 only. No L2, no test_spec, no
