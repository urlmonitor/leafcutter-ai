assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: false
package_surface: false
it_requirements:
  - "No libyaml fallback path is introduced, so there is no 'falls back when libyaml is missing' branch to test: the loader is the pure-Python one on every install."
  - "The loader class is asserted by recording the Loader keyword yaml.load receives from parse_frontmatter."
test_spec:
  - name: test_parse_frontmatter_uses_the_pure_python_safe_loader
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "template_compiler.parse_frontmatter with yaml.load wrapped to record its Loader argument"
    description: "Every load parse_frontmatter makes receives yaml.SafeLoader, and none receives yaml.CSafeLoader."
    must_catch:
      - "A switch to getattr(yaml, 'CSafeLoader', yaml.SafeLoader) or to yaml.CSafeLoader."
  - name: test_tab_adjacent_to_colon_or_comma_still_gives_empty_frontmatter
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: boundary
    surface_invoked: "template_compiler.parse_frontmatter over frontmatter with a tab after a colon and a tab after a comma in a flow sequence, parsed twice each"
    description: "Both inputs give an empty frontmatter dict on the first and on the second parse, with the body split off."
    must_catch:
      - "A libyaml-backed loader, which parses both inputs into a populated dict."
test_rationale: |
  Both entries are red against any change that moves this function onto the libyaml
  loader, which is the first speed-up one would reach for. The boundary entry uses the
  two inputs measured to differ between the loaders on this host (PyYAML 6.0.1 with
  libyaml), so it fails for behaviour, not for the loader's name alone.
