  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127d-2.yaml
    relationship: related
    status: exists
    relevance: >-
      Requires the published rule to be taken from the rule in force and to reproduce the
      quoted length; this record states only WHAT the rule must now say. Do not restate GE-127d-2.
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
- 'SUPERSEDED BY GE-127d-3 (IT PO, 2026-10-23). This record adds no obligation of its own. The stated
  rule is GE-127d-5''s generated statement: describe_measurement_rule probes the one measure per
  checked extension and says that comments of every style, standalone Python strings and blank lines are
  not counted, which covers a decision-history block in any form. There is NO ''decision history'' probe
  category, no history sentence, and no start/end vocabulary; adding one would publish a special case
  the measure does not have.'
- 'Published surfaces and their comparison (README.md and commit_guardian.json''s file_size._comment
  carrying the generated passage, compared whole by check_file_size_rule_parity) are owned by GE-127d-5;
  this record does not restate them.'
- 'The one still-true promise -- an author applying the stated rule by hand reproduces the quoted
  length for a file carrying a decision-history block -- is proved by deriving the length with an
  independent counter at run time and comparing it with the length the refusal quotes, never by a pinned
  figure.'
