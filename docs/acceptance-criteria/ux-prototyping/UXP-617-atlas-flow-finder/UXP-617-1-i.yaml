title: "Searching 'selected option' lists the 5 flows and 27 steps whose names, text, fields, criteria, screens or entities match every word"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/ux-prototyping/UXP-617-atlas-flow-finder/UXP-617.yaml
criteria: |
  Given the store as measured on 2026-10-12, in which several decision flows have steps that
    use or produce the field decision_record.selected_option_id,
  When the person types 'selected option' into the search box on /flows,
  Then the summary reads '5 flows, 27 steps match',
  And the listed flows are, in this order, Publishing the decision record (7 matching steps),
    Retrieving a decision as precedent (6), Forming a decision in a kernel run (5), Staging the
    decision record (5) and How a decision is formed, saved, stored and reused (4),
  And typing 'Selected Option' lists the same 5 flows and 27 steps, because case is ignored,
  And a step matches only when every typed word starts a word of one single target of that
    step: its label, its text together with its condition, one of its AC ids, one input or
    output field name, its screen id together with its screen title, or one entity it reads or
    writes,
  And words are split at every character that is not a letter or a digit, so 'selected option'
    matches the field decision_record.selected_option_id,
  And a step whose label contains 'selected' while only its text contains 'option' does not
    match,
  And typing 'UXP-210d' lists 2 flows with 8 matching steps, found by their AC ids,
  And each new summary is announced to screen readers as a polite status update.
