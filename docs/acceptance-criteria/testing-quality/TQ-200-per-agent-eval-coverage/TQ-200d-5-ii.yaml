id: TQ-200d-5-ii
components:
  - testing_quality
title: "A live eval starts the installed claude on Windows when the install provides only a claude.cmd launcher on the path"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a Windows 11 machine where the standard npm install put claude,
      claude.cmd and claude.ps1 on the path, and no folder holding claude.exe
      is on the path,
  When a live eval run starts the agent for a row,
  Then the agent session starts, found the same way the Windows command
      shell finds claude (by the path and the executable extensions it lists),
      and the row is scored,
    And when the CLI location is set explicitly through the eval's CLI-location
      setting, that program is started instead of the one found on the path,
      on every platform,
    And on Linux, with no explicit setting, the program started is the one
      named claude on the path, as before this change,
    And the same lookup is used by all three ways the harness starts an agent.
depends_on:
  - TQ-200d-5
