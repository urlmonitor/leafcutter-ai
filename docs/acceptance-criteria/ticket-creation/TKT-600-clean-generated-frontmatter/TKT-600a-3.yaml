notes: |
  ORIGIN (2026-09-27, user-directed, BA stage, answer to open question Q1 of the
  declared-files run). Without this AC the checks (ACD-2500a-3, ACD-2500d-5-i) read the
  declared list while the generated ticket reads the ADR-010 doc_links derivation -- two
  answers to one question.

  PLACEMENT. TKT-600a ("generate_ticket_from_ac emits accurate files_touched") owns the
  generated surface and had 2 L2s. ACD-1600c is at its 5-L2 cap, and this is not a
  constraint on ACD-1600c-4's own behaviour but a consumer of it, so it is not an L3 there.

  RELATION TO TKT-600a-1 / TKT-600a-2 / TKT-500f-8-i. Their prose-harvest and doc_links rules
  (including "a real source path named in a prose bullet is kept") now apply only to records
  in the 'no declared files' state. For a record that declares its files, nothing is
  harvested -- the declared list is the whole surface. This deliberately narrows where those
  rules apply; it does not change them.

  ADR-010 names doc_links -> files_touched as the derivation. This AC makes that the legacy
  path; an ADR amendment may be warranted (flagged to the user).
