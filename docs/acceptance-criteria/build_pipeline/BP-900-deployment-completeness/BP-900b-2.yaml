id: BP-900b-2
components:
  - build_pipeline
title: "Guard cross-checks extracted references against the deployable script manifest"
component: build_pipeline
level: L2
status: active
req_status: approved
readiness: approved
priority: critical
work_status: done
criteria: |
  Given the guard has extracted the set of referenced script paths from compiled templates,
  When it compares each reference against the set of scripts that build.py will deploy
  (i.e. scripts listed in build_phases that are copied to {target}/.leafcutter/scripts/
  and shimmed to {target}/scripts/),
  Then every reference that matches a deployed script path is marked as resolved
  And every reference that does NOT match a deployed script path is marked as broken
  And the guard produces a list of zero or more broken references
depends_on: [BP-900b, BP-900b-1]
doc_links:
  - path: scripts/build_phases.py
    relationship: describes
    status: exists
  - path: docs/architecture/components/template-compiler.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/build.py
  n_location_rule: "1 — _get_source_deployable_scripts, the manifest derivation"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Must derive the deployable script manifest from the actual build phase functions — not a hardcoded list"
    - "Must account for both .leafcutter/scripts/ paths and shimmed scripts/ paths when resolving references"
    - "Must not produce false positives for scripts that are legitimately deployed via existing build phases"
    - "Must be idempotent — repeated runs with the same compiled output produce the same result"
  notes: |
    "Derive, do not hardcode" is ONLY PARTLY MET (ac-audit 2026-08-17).
    _manifest_workflow_tool_scripts and _manifest_knowledge_scripts in
    scripts/build.py still carry hardcoded filename tuples duplicated from
    build_phases.py, and test_guard_source_paths_match_deployable_set only
    checks cardinality between two manifest functions — not against the deploy
    phases themselves. A hand-maintained list drifting from what the build
    actually deploys is precisely the defect class behind the BP-900g-4/-5/-6
    hotfixes, so this residue is worth closing.

    Behavioural backstop today:
    unit_tests/test_bp_900g_4.py::test_deployed_templates_reference_only_deployed_scripts,
    which runs a real build.py --target-dir into a tmp dir.
delivers_to:
  agent: python-coder
  contract: "list[dict] — list of broken references, each {'missing_path': str, 'referencing_template': str}; empty list means all references resolved"
expects_from:
  ac_id: BP-900b-1
  contract: "set[tuple[str, str]] — set of (template_path, referenced_script_path) tuples extracted from compiled .md files"
