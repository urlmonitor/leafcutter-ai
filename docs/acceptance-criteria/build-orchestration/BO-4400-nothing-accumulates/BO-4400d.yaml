notes: |
  Gap G4. Backstop for anything BO-4400a misses (crashed sessions, pre-existing pile-up).
  Trigger: session start or a schedule (BA/IT PO choose; both acceptable to the user).
  Must offer a dry run and report count and bytes freed. Clears only holds-nothing
  workspaces (BO-4100c) and expired scratch (BO-4400f's expiry rule); never touches work
  in flight (BO-1800d). Prerequisite: BO-4300c-1-iii (a build restores tracked files it
  changes) -- without it, finished workspaces falsely read as holding work and the sweep
  reclaims nothing. Prior art to reconcile, not duplicate: ~/bin/wsl-reclaim hourly timer
  (user memory) is a machine-local tool outside the package.
  component-diagram: a new sweep script.
