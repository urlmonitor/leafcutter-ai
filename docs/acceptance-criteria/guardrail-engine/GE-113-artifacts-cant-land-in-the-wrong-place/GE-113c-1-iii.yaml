it_requirements:
  - "The DEFECT is the project ROOT, not the scripts_dir name. On origin/main check_secrets.py does `project_root = find_project_root()` (the _resolve_root.py __file__-relative walk-up, which resolves through the .leafcutter symlink to the workspace parent), then builds `_SKILL_SCRIPTS = project_root / SECURITY_SCANNER_SCRIPTS_DIR` and `sys.path.insert(0, str(_SKILL_SCRIPTS))` before `from scan_secrets import scan_files`. The scripts_dir sub-path (SECURITY_SCANNER_SCRIPTS_DIR, sourced from the config module) is already parameterized and correct — it is simply joined to the WRONG root, so scan_secrets is not on sys.path. Fix the ROOT resolution (route the find_project_root() call through the shared `git rev-parse --show-toplevel` helper mandated by GE-113c-1 / GE-113c-1-iv); do NOT change the scripts_dir value. This is the ModuleNotFoundError(scan_secrets) class recorded in CLAUDE.md / user-memory (project_worktree_checksecrets_scriptsdir) that breaks check-secrets in fresh worktrees."
  - "scan_secrets must import successfully with no ModuleNotFoundError in a fresh worktree in BOTH the deployed (.leafcutter) layout and the source/main checkout layout; the secret scan must then run to completion."
  - "Deployed/template parity (ADR-001): the fix is in check_secrets.py's root resolution (the find_project_root() call), which lives in templates/scripts/commit_guardian/check_secrets.py and is round-tripped to the scripts/ copy via build.py — never edit only one side. The scripts_dir CONFIG value (SECURITY_SCANNER_SCRIPTS_DIR / commit_guardian.json) is NOT the defect and must be left unchanged."
  - "Must handle git-unavailable gracefully per the project error handling policy: wrap the git subprocess call (no bare except, Ruff E722/BLE001/TRY), warn, and fall back to a safe deterministic resolution (ACS-300g-6 precedent) via the shared _resolve_root helper mandated by GE-113c-1 / GE-113c-1-iv."
  - "Behavioral verification must exercise a REAL fresh worktree created from origin/main (mirror the actual failure conditions in CLAUDE.md's worktree pre-commit section), not a synthetic sys.path fixture that pre-imports scan_secrets — asserting the import resolves and the scan runs end-to-end. Follow the real-`git worktree add` regression-test precedent set by GE-115 / #235 for check_doc_frontmatter."
  - "No regression to the actual secret-scanning verdicts: this AC's scope is scripts_dir/import/root RESOLUTION only; the set of findings scan_secrets produces on given inputs must be unchanged."
  - "Scope boundary: the .security-allowlist resolution defect (check-secrets reads the allowlist from the .leafcutter symlink target / workspace root rather than the worktree checkout root, so worktree-local suppressions are silently ignored — CLAUDE.md) is a SEPARATE, SIBLING concern covered by GE-113c-1-v. Keep this AC scoped to scripts_dir/import resolution and do not conflate it with the allowlist read-location fix; the two share the GE-113c-1 / GE-113c-1-iv shared-root mandate but are independently testable."
