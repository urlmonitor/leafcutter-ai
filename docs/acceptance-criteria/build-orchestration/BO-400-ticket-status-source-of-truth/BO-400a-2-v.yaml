it_requirements:
  - "BOTH TWINS IN ONE CHANGE. templates/workflows-js/build-feature.js and templates/workflows-js/build-ticket.js carry the same completionVerdictFromRecord and concludeTicket; change both identically. They are the canonical sources (ADR-001); deployed copies are build outputs."
  - "DECIDE IN completionVerdictFromRecord, NOT AT A CALL SITE. A required phase is outstanding when (a) the record's frontmatter marks it failed, or (b) it appears in ctx.skippedAgents, regardless of its Comments entries. Check these before reading the latest entry. Use the read-back field that already exists (record.failed_phases); do not add a second parse of the ticket."
  - "A FRONTMATTER VALUE OF needed IS NOT A SIGNAL (decided 2026-10-14 by BrainCandy). The BO-400e-1 demanded-set contract and its tests count a needed phase with a passing entry as satisfied, and scripts/set_ticket_status.py already refuses to write done while any phase reads needed, so that case cannot produce a phantom done. The drive's report in that case (a completion write attempted and refused, outstanding_phases empty) is misleading and is a follow-up, not part of this record."
  - "THE REASON NAMES THE SIGNAL. The outstanding reason states which signal made the phase outstanding: the frontmatter value, or this drive's cross_agent skip. It must not tell the operator to add a sign-off the record already carries."
  - "DO NOT WIDEN THE REQUIRED SET. demandedPhasesFromRecord already unions needed, signed_off and failed phases. A phase marked not_needed stays not required, and a phase skipped by this drive that the record does not demand is not added."
  - "KEEP THE EXISTING ORDER OF GUARDS. The unreadable check and the empty-required-set refusal (BO-400a-2-iii, BO-400a-2-iv) answer first, unchanged. The handoff-resolution path (BO-400e-1-i) applies only to a phase that is not failed or skipped."
  - "VERIFY BY EXECUTION. Drive the real workflow scripts through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs (or the existing driver harness the BO-400a-2-iii and -iv tests use) and assert on the ticket record left on disk and the payload returned. A source-grep test does not count."
  - "OUT OF SCOPE (follow-ups): stopping agent templates from writing level-2 headings inside ## Comments (architect-review.md's ## Escalation), and an ordering key for the latest entry that the writer cannot misplace."
