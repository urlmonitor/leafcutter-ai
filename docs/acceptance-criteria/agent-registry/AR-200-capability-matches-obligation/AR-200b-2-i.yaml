notes: |
  ABSENT IS NOT PERMISSIVE. The failure this first clause prevents is the quiet
  one: a comparison that reads a missing tools declaration as "no constraint
  recorded" and skips the agent. That agent is the least equipped in the tree and
  the one the comparison would silently exempt. It is also the shape a newly
  added definition takes before its author fills the header in -- so the exempted
  case is the newest agent, every time.

  THE TWO NEGATIVE CLAUSES ARE WHAT KEEP THE RULE USABLE. AR-200b-1 records the
  cost of the opposite error one leaf over: a detector that fired across the
  registry is worse than no detector, because a noisy rule gets switched off.
  Roughly half the tree holds no grant, so a comparison that reports them is
  reporting most of what it examines.
