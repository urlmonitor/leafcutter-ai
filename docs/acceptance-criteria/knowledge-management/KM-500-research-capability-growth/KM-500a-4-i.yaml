notes: 'Audit 2026-11-16 (km-500-audit.md, sections 1 and 3, build-order step 1): the supported evaluate command calls
  retrieval with an explicit operation only, so it never runs host needs interpretation or Jev selection, which is
  where the live A02 blocker sits (get_entities chosen at 0.71 against the 0.80 gate). The user named
  KernelService.start_run/resume_run as the path to drive and allowed either extending knowledge evaluate or adding a
  sibling command; the choice is the IT PO''s. The regression clause on the existing explicit-operation pack was not
  asked for; it stops the new path from being built by replacing the old one. Out of scope: the issue-02 selector fix,
  promoting the manual RQE runners into CI, eval sets S2-S8. Draft; no provider call was made while authoring.'
