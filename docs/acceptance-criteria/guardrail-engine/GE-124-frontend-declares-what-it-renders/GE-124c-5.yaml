created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given a reader needs to understand how the commit-tier check reaches each of
    its four verdicts
  When they open the sequence diagram for the frontend declaration check
  Then the diagram shows the ordered exchange between the staged set, the
    in-scope decision, the declaration and pin readers, the shared id resolver,
    and the commit
  And it shows the branch that produces each of the four verdicts — missing,
    unresolved, not reported, and pass — from the step that decides it
  And it shows where the escapes in GE-124d downgrade a verdict, so a reader can
    see that a downgrade replaces a verdict rather than adding to it
  And it shows the point at which the one-finding-per-file-and-code rule is
    applied
