notes: |
  Written as a differential pair on purpose. "Status is not a decision input" describes the code as
  it stands -- nothing consumes it beyond rendering it as prose, and no validation constrains its
  value -- so asserted directly it is an AC about the absence of a behaviour that already does not
  exist, and any test of it passes on day one and keeps passing on dead code. Stated as "these two
  records must produce identical output", it becomes an executable invariant that pins the field
  down while BO-2200c-5-i and -ii rework the neighbouring selection logic, which is the moment
  someone would reasonably reach for it.

  Why it must be pinned: status is a hand-authored snapshot of the filesystem that nothing
  refreshes, and it is already wrong in the store -- ticket 22 of the
  EPIC-StartingNewWorkTheProperWayAlways drive carries `describes` / `exists` for a page that has
  to change inside its own diff. Nothing detects that; the schema validator performs no doc_links
  validation of any kind, no enum for status or relationship and no shape check.

  Retaining the rendering keeps this compatible with BO-2200c-4 (approved, done), which requires
  relationship, status and relevance to survive into the Agent Contracts block rather than being
  reduced to bare paths. There is a real tension in showing a writer a field known to be
  unreliable, and BO-2200c-5-iv resolves it rather than this AC: once the writer checks the target
  on disk before acting, a stale status misinforms nobody, because nobody acts on it.

  Adjacent gap, deliberately not covered here: `relationship` is about to carry the whole
  documentation-ownership decision (BO-2200c-5-i) and is equally unvalidated -- a typo silently
  removes a document from the build. Validating the doc_links vocabulary belongs to the ac-store
  component, which owns the schema validator; see the handoff.
