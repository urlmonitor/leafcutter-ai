id: BO-4400d-1
title: "The sweep reclaims exactly the finished leftovers and expired scratch, and nothing else"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a test project holding nine workspaces:
    - "idle-1", whose commits all reached the main line, and "idle-2", carrying no commit
      of its own with no file in it changed for 8 days, each holding nothing unsent, with
      no run active in them,
    - "leftover-1", an unregistered remnant found by discovery, whose commits all reached
      the main line, holding nothing unsent,
    - "unsent-1", whose branch carries one commit not on the shared project,
    - "dirty-1", whose commits all reached the main line, holding one uncommitted change
      to a version-controlled file,
    - "noverdict-1", whose version control data cannot be read,
    - "active-1", whose commits all reached the main line, holding nothing unsent, with a
      run currently active in it,
    - "pushed-1", whose commits are on its own line on the shared project but not on the
      main line, holding nothing unsent, with a file in it last changed an hour ago,
    - "fresh-1", carrying no commit of its own, made an hour ago,
  And the designated scratch location holds five items: three past their expiry under
    the scratch age and ownership rule, and two within it,
  And one outside item (a Python environment) whose workspace was cleared earlier but
    which could not be removed at the time,
  When the sweep runs,
  Then "idle-1", "idle-2" and "leftover-1" are removed through the one shared clearing
    door, the three expired scratch items are removed, and the orphaned outside item
    is removed,
  And "unsent-1", "dirty-1", "noverdict-1", "active-1", "pushed-1" and "fresh-1" and the
    two unexpired scratch items exist afterwards and are byte-identical to their state
    before the sweep,
  And each kept workspace is reported with the reason the landed-work pass gives for it,
    "pushed-1" as not yet on the main line and "fresh-1" as carrying no work of its own
    yet,
  And no person is asked to confirm anything during the sweep.
depends_on: [BO-4400d, BO-4300c-1-iii, BO-4100c-1, BO-4100c-3, BO-4100e-1, BO-1800d, BO-4400b-1, BO-4400f-1, BO-4400g-2]
