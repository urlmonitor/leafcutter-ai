- reason: duplication-audit-item-5
  by: it-po
  at: 2026-09-25
  note: >-
    Technical enrichment for the widened criteria: stage shims installed for every stage the
    workspace's own hook declaration names; one canary per stage (known-bad file, known-bad message,
