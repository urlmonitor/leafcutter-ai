assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THE SET THIS AC MEASURES AGAINST MUST BE RECOMPUTED FROM THE PACKAGE'S OWN SOURCES ON THE RUN BEING CHECKED, NOT HARDCODED AND NOT SNAPSHOTTED. `_build_source_manifests` in `scripts/build.py` already derives the shipped set by scanning the template directories, and that derivation -- or an equivalent recomputation -- is what `every capability the package currently ships` has to mean. A test or an implementation that compares against a fixed list of names passes on the day it is written and silently stops covering everything added afterwards, which is the same time-dependence that produced the parent defect."
  - "REACHABILITY, NOT PRESENCE, AND THE TWO ARE MEASURED DIFFERENTLY. Presence is a filesystem assertion; reachability is that the consuming tool resolves the item by its own name at the location it discovers from. Any repair that relocates the package's items somewhere still on disk but outside the discovery path satisfies presence and delivers a project with no capabilities. This clause is what makes `stop installing the shim` -- the cheapest repair for BP-1500g-1 -- a failure rather than a pass."
  - "THE OBSERVATION MUST BE OF ONE RUN. The third Then clause is the whole reason this record is separate from BP-1500g-1, and it constrains the TEST as much as the implementation: both halves must be asserted against the same invocation over the same tree. Two runs with different inputs each demonstrating one half do not demonstrate coexistence, and coexistence is the property at issue."
  - "THE CLEAN-PROJECT ARM IS NOT OPTIONAL AND IS NOT A DUPLICATE OF THE FIRST THREE CLAUSES. An implementation that installs the package's items only when it finds nothing of the adopter's in the way satisfies clauses one to three on every fixture that HAS adopter content in it. Only a project that has never held adopter content distinguishes `the package delivers, and also tolerates the adopter` from `the package delivers only when unobstructed`."
  - "THE ALLOWLIST FALLBACK OFFERED IN KI-BP-009 IS NOT SUFFICIENT FOR THIS AC AND SHOULD NOT BE ADOPTED SILENTLY IF IT IS ADOPTED FOR BP-1500g-1. That entry itself calls it strictly weaker: it protects the items someone remembered to declare. Applied here it also means the package's delivery guarantee becomes conditional on a declaration file staying accurate, which is a second maintained list. BP-1500g-3-i rules this out on the design side; this it_requirement records that it fails this AC's fourth clause too, for a different reason."
  - "DELIVERY COMPLETENESS AND ADOPTER SURVIVAL MUST NOT BE TRADED AGAINST EACH OTHER AT RUN TIME. If the implementation reaches a state where it can deliver one but not the other, that is BP-1500g-1-ii's condition -- stop and say so -- not a case for silently preferring either. An implementation that quietly drops one shipped item to make room is the failure this AC and BP-1500g-2-i jointly exist to catch."
  - "Observability: the run must make the count or the identity of the shipped items it installed available in its output, so `the package's capabilities silently never arrived` is detectable from a transcript rather than only by asking the project afterwards."
  - "Must not make delivery completeness depend on the order in which adopter content is encountered; the result must be the same whichever way the tree is walked."
test_spec:
  - name: test_bp_1500g_2_every_currently_shipped_capability_is_present_after_the_same_run_the_adopter_content_survived
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: "python scripts/build.py --target-dir <scratch_adopter>   (one no-flag run; both halves asserted against it)"
    description: "Clauses one and three together, which is the only way clause three can be honoured. ONE no-flag build subprocess over a tree holding adopter content; from that single run assert both that the adopter's capability survived and that every shipped item is present. The shipped set is RECOMPUTED in the test body from the package's template sources -- never a hardcoded list, or the entry stops covering everything added after it was written."
  - name: test_bp_1500g_2_every_shipped_capability_is_discovered_by_name_and_runs_after_that_run
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "python scripts/build.py --target-dir <scratch_adopter>"
    description: "The second clause, and the entry that fails the cheapest repair. For each item in the recomputed shipped set, the consuming tool resolves it by name through the project's discovery path. Presence on disk is explicitly not sufficient: a repair that stops installing the discovery link satisfies the presence entry above and fails here, which is exactly the trade this AC exists to forbid."
  - name: test_bp_1500g_2_a_project_that_never_held_adopter_content_receives_the_same_complete_set
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: boundary
    description: "The fourth clause. A pristine scratch adopter with no adopter-owned content anywhere receives the identical recomputed set, reachable by name. Catches an implementation that delivers only when unobstructed, which passes every other entry in this contract because every other entry's fixture has adopter content in it."
  - name: test_bp_1500g_2_the_delivered_set_equals_the_recomputed_shipped_set_exactly_with_no_omissions
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: seam
    description: "Set equality rather than membership, asserted at the seam: delivered == recomputed_shipped, with both directions reported on failure. A membership-only assertion cannot see a single dropped item in a set of dozens, and one silently dropped item is the exact shape of `the package's capabilities silently stopped arriving`."
  - name: test_bp_1500g_2_removing_the_discovery_link_is_detected_as_a_failure_of_this_ac
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: unit
    angle: failure
    description: "THE CHEAP-PASS DIFFERENTIAL. Construct the state the cheapest BP-1500g-1 repair produces -- adopter content intact, package items written into the tree, discovery link absent -- and require this AC's reachability assertion to be RED against it. Encodes the rejected repair as executable code so it stays refuted when the reasoning in these notes is forgotten."
  - name: test_bp_1500g_2_a_capability_added_to_the_package_after_this_test_was_written_is_also_delivered
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: failure
    description: "The count-agnostic control. Inject an additional item into the package's template sources inside the test body, under a name minted at run time, then build: the recomputed set includes it and it is delivered and reachable. Fails any implementation or fixture that enumerates the shipped set by hand."
test_rationale: |
  THE SINGLE-RUN CONSTRAINT IS A TEST CONSTRAINT BEFORE IT IS AN IMPLEMENTATION
  CONSTRAINT. This AC's third clause is unusual in that it governs how the
  evidence is gathered, not what the build does: two runs each demonstrating one
  half is the natural way to write these tests and is precisely the thing the
  clause forbids. The first entry is therefore specified as one invocation with
  both assertions hung off it, and a reviewer should check that shape before
  checking anything else.

  THE CHEAP-PASS DIFFERENTIAL IS THIS CONTRACT'S CENTRE OF GRAVITY. The record
  exists to make one particular outcome a failure -- stop installing the link,
  the adopter's work survives, nobody warns anybody, the package quietly never
  arrives. That outcome is not hypothetical; it is the least-effort way to close
  BP-1500g-1 and it will occur to whoever implements it. A prose warning in the
  notes is refutable only by someone who reads the notes; an executable entry
  that constructs the state and requires red is refutable by the suite.

  RECOMPUTATION IS SPECIFIED IN THREE SEPARATE ENTRIES ON PURPOSE. `every
  capability the package currently ships` is a moving target by construction --
  the package adds and retires items between versions, which is the same
  time-dependence that produced the parent defect. A contract that pins the set
  at authoring time degrades into a contract about a subset, silently, and the
  count-agnostic entry is what keeps that from happening without anyone noticing.

  SET EQUALITY RATHER THAN MEMBERSHIP. One silently dropped item out of dozens
  is the realistic shape of this failure, and a membership assertion over a
  large set is close to blind to it.

  RUNTIME. Six entries, four real build subprocesses over small scratch trees.
  Inside the done-proof pytest budget as fixed by PR #706 (30s collection floor,
  300s per linked test file, overridable via
  LEAFCUTTER_DONE_PROOF_PYTEST_TIMEOUT_SECONDS). Not shaped by the retired 60s
  ceiling.
delivers_to:
  agent: python-coder
  contract: "The coexistence guarantee as a checkable pair over a single run: (recomputed_shipped_set, delivered_and_reachable_set, adopter_content_intact) with delivered_and_reachable_set == recomputed_shipped_set AND adopter_content_intact true, both observed of the same invocation. Consumed by BP-1500g-2-i, which specifies what must happen when the two sets contend for the same name, and by BP-1500g-4 and BP-1500g-5, whose documentation cannot state a safe placement until this pair is demonstrably satisfiable."
expects_from:
  ac_id: BP-1500g-1
  contract: "The recomputed ownership verdict owns(installed_path) -> {package_produced | adopter_owned | unattributable} and the layout it implies. This AC constrains that layout from the opposite side: whatever placement BP-1500g-1 chooses, every item in the recomputed shipped set must remain resolvable by name through the consuming tool's discovery path in the same project after the same run. A layout satisfying BP-1500g-1 that does not satisfy this constraint is not an acceptable resolution of BP-1500g-1."
