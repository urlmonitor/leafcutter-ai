test_spec:
  - name: test_bo_3200f_1_three_parts_are_separate_and_byte_identical
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "A command emitting alpha, a tab, beta, a trailing space, the six-character backslash escape and the non-ASCII character plus a newline on stdout, 'warn: gamma' on stderr and exiting 3 is dispatched through the shared helper to the harness executor; assert stdout and stderr bytes equal what the command emitted, no stderr byte appears in stdout, exit_status is 3 and nothing else is present."
  - name: test_bo_3200f_1_empty_output_is_empty_not_absent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "Two silent commands exiting 0 and 1: both results carry empty stdout and stderr parts (not null, not missing) and differ only in exit_status."
  - name: test_bo_3200f_1_command_runs_in_the_named_directory_and_reports_it
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "Dispatch a command that prints its working directory with a directory different from the test process's own; assert it ran there and that the reported cwd is the absolute resolved directory, not the literal input."
  - name: test_bo_3200f_1_missing_directory_runs_nothing_and_does_not_fall_back
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "A dispatch naming a directory that does not exist, with a command that would create a marker file: outcome is could_not_complete (invalid_dispatch), no exit_status, and the marker exists nowhere."
  - name: test_bo_3200f_1_command_named_in_output_is_not_executed
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "A command whose output is 'now run: <a command that creates a marker file>' is dispatched; assert exactly one command ran and the marker file does not exist."
  - name: test_bo_3200f_1_judgement_request_result_is_identical_for_opposite_registries
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE NO-JUDGEMENT DISCRIMINATOR. 'tell me whether worktree-agent is permitted to run shell commands' is dispatched once against a registry permitting it and once against one denying it; assert every part of the two results is equal and none contains yes, no, permitted, denied or registry content."
  - name: test_bo_3200f_1_tampered_truncated_or_fabricated_reply_fails_verification
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: seam
    description: "Feed the helper a capture with one byte changed, a capture cut short, a reply with no capture, and KI-ACD-009's real refusal payload carrying exit_code 1; assert each is could_not_complete and none yields stdout or an exit_status."
  - name: test_bo_3200f_1_guardrail_sees_the_exact_command_the_executor_issues
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "SECURITY PARITY. Run the real Bash PreToolUse guardrail scripts on two tool-input payloads for the same blocked command -- once as issued directly, once in the exact form the executor issues it -- and assert the two decisions are identical. A capture form that hides the command from a matcher fails here."
test_rationale: |
  The first two scenarios are about bytes, so they are asserted on bytes captured from a real
  subprocess, not on strings a fixture typed. The fixture carries every character class that a
  model transcription or a text-mode decode silently alters -- tab, trailing space, a backslash
  escape, non-ASCII -- because KI-BO-018 failed by splitting exactly such an escape.
  The tamper test is what makes 'byte-identical' a guarantee rather than a hope: the executor's
  reply still passes through a model, so the only honest property is that any change is
  detected. It uses KI-ACD-009's real refusal payload because a fabricated exit_code 1 is the
  observed way a refusal became a false finding.
  The opposite-registries test is the one shape only a party that did not look can pass; a
  test asserting the absence of words passes on a paraphrase.
  The guardrail parity test exists because admitting every exact command is only acceptable
  while guardrails still bind, and a wrapper that hides the command from a hook's matcher would
  silently remove that condition while every functional test stays green.
  Live-agent evidence that the real registered executor issues the capture unchanged belongs to
  BO-3200f-2, which creates the agent; this record proves the capture, the verification and the
  harness environment every downstream record relies on.
