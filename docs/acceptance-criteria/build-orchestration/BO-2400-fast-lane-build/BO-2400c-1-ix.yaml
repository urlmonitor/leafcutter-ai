  - ac_id: BO-2400c-1-viii
    contract: "The classification outcome plus both compared values (producer-stated and lane-derived) and both quantities (stated bytes, received bytes), available at the halt site rather than recomputed there. Without -viii there is no delivery state to report and this record is unimplementable: it describes the wording of a halt that cannot yet occur."
  - ac_id: BO-2400c-1-iii
    contract: "The existing three failure causes, their evaluation order (reference-rejection before the marker check), and their single message-construction site. The fourth cause is inserted into that order ahead of the marker check and into that site alongside the other three."
test_required: true
test_spec:
  - name: test_escaped_content_halt_leads_with_delivery_and_carries_both_values
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive the 2026-08-31 escaped-content case under the harness and assert HarnessResult.result's leading statement says the bundle was produced and then altered in transit, and carries the producer-stated value and the lane-derived value. Asserting only that the run halted passes on today's behaviour, which halts for a stated reason that is wrong."
  - name: test_delivery_is_reported_when_the_landmark_was_also_destroyed
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "The ordering test, and the load-bearing one. Deliver an alteration that genuinely destroys the breakpoint marker, and assert the terminal payload reports the delivery failure and does NOT report the landmark as missing. An implementation that checks the landmark first reports the symptom and passes every test written about the symptom; only a run in which both conditions are true at once separates them."
  - name: test_delivery_failure_message_names_no_composition_cause
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Assert the ABSENCE from the delivery-failure payload of the three wrong namings — never obtained, a location standing in for content, incompletely composed. A message that leads correctly and then also mentions one of these satisfies a presence-only assertion while still sending a reader to the assembly."
  - name: test_the_four_halt_messages_are_pairwise_distinguishable
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive all four unusable states — nothing obtained, a reference, incomplete content, altered in transit — in ONE test and compare the four terminal messages pairwise: none is a restatement of another, none a superset of another, and a check written for one is not satisfied by another. Asserting each in isolation is what lets a single undifferentiated wording pass all four."
  - name: test_delivery_failure_halt_dispatches_no_context_carrying_agent
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: ".claude/workflows/fast-lane-ship.js (top-level body under run_workflow_under_e2)"
    description: "On the delivery-failure path HarnessResult.agent_calls records no test-writer-connected or coder-connected dispatch — proving the new message is on a branch a run actually reaches and terminates from, rather than a string that exists in a branch nothing enters."
test_rationale: |
  This record is about wording, and wording is only evidence when it is the wording a real
  run produced. Drive the lane with the producing step's reply controlled and assert on the
  run's terminal output — never on a string found in the lane's source, which proves only
  that a message was authored, not that this run reaches it.

  Three shapes.

  Drive the escaped-content case and assert the terminal output states that the bundle was
  produced and altered in transit, and carries both compared values. Asserting only that
  the run halted passes on today's behaviour, which halts for a stated reason that is
  wrong; the assertion has to be on what it says.

  Drive an alteration that destroys the structural landmark, and assert the output reports
  the delivery failure and does NOT report the landmark as missing. This is the ordering
  test: an implementation that checks the landmark first reports the symptom and passes
  every test written about the symptom.

  Drive every unusable state in ONE test and compare the messages pairwise. Asserting each
  in isolation is what allows a single undifferentiated wording to satisfy all of them —
  the same trap BO-2400c-1-iii records for its three states, now with a fourth member.
declares_side_effect: false
change_target: pipeline
risk_surface: internal
notes: |
  SCOPE AGAINST BO-2400c-1-iii. That record owns three causes — nothing came back, a
  reference came back, incomplete content came back — and owns the rule that each halt names
  its own cause and only its own. This record adds a fourth cause to that set and requires
  it to join distinctly. It does not restate the three, and it does not relocate ownership
  of them: if the two records ever disagree, -iii governs its three and this one governs the
  fourth and the ordering between the fourth and the incomplete-content case.

  THE ORDERING CLAUSE IS THE LOAD-BEARING PART, and it mirrors an existing decision rather
  than inventing one. -iii already requires reference-rejection to be evaluated before the
  landmark check, for exactly this reason: evaluated after, a locator that happens to
  contain the landmark is misfiled as incomplete content and two states collapse into one.
  The same collapse happens here in the other direction — corrupted content whose landmark
  did not survive is misfiled as incomplete content — and it is worse, because incomplete
  content implicates assembly, which is working.

  WHY THIS IS WORTH A CRITERION AT ALL. On 2026-08-31 the landmark check was the only thing
  that noticed anything was wrong, and it noticed by luck of shape: the landmark happened to
  contain a character the corruption happened to alter. Its report named the landmark. An
  operator reading that report goes to look at how the bundle is composed, which is
  correct, complete, and not the problem. Every hour spent there is a cost this criterion
  removes, and it is a cost that recurs on every occurrence.

  DELIBERATELY NOT IN SCOPE: the general rule that a halt must not state a reason its own
  evidence denies. That belongs to the BO-2400f-4-vi family, as -iii already records. This
  record specifies one instance of truthful diagnosis, not the rule.
