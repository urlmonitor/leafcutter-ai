work_status: todo
criteria: |
  A new commit guardian hook extends the pre-commit pipeline with duplicate
  code detection powered by jscpd:

  The duplicate code hook scans staged files for copy-paste blocks and reports
  clones exceeding configurable thresholds. The hook ships disabled by default,
  fails open when the jscpd binary is missing, supports configurable thresholds
  (warn-only vs blocking), and integrates with the onboarding wizard for opt-in
  enablement. Diff coverage gating (via diff-cover) is covered by GE-101.
