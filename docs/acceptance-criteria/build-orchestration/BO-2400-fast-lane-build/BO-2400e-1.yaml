criteria: |
  Given a lean fast-lane build is started for a batch of ACs,
  When the build begins,
  Then it operates on a dedicated branch created from the latest origin/main
    (fetched, not a stale local main),
  And it does not commit directly to a protected branch (main/master),
  And the delivery reaches main only via a pull request.
