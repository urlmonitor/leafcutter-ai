  - path: docs/architecture/components/template-compiler.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must scan ALL compiled .md files in agents/ and skills/ directories — no partial scanning"
  - "Must handle both single-quote and double-quote variants in sys.path.insert patterns"
  - "Must complete validation in under 5 seconds for typical template sets (fewer than 100 files)"
  - "Must not produce false positives for non-script-path strings that happen to match the regex pattern"
  - "Must follow the existing post-build validation pattern used by build_propagation_audit.py and build_referential_integrity.py"
delivers_to:
