criteria: |
  Given a requirement that is a member of a ticket's group,
  When the ticket is inspected,
  Then the ticket refers to the requirement by its identity,
  And the ticket does not restate the requirement's criteria, its deliverable
    checklist, or its sign-offs,
  And the requirement record remains the single authoritative copy of that content.
