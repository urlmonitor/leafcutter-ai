test_rationale: |
  Native representation and the trusted query execution seam require public-entry and
  real-database checks, not only generated statement inspection. Current coverage checks
  native snapshot identity, source fidelity, counts, ownership and read-only refusal,
  then verifies publication/rollback and vector behavior on actual local Neo4j.
  Catalog tests require current-compiler proof, immutable native versions, explicit pin
  rejection and fresh admission; old compiler receipts cannot authorize current queries.
  The sanitized cutover report separately records the two actual local catalogs and
  fresh Aura verification/public retrieval. Historical reports below retain their
  original measured scope; they are not claims that removed migration tests still run.
notes: |
  Authorization: in this Codex chat on 2026-10-02, Hendrik asked why the graph exposes KR
  categories instead of AC/ADR concepts and how to filter on component finalize, then
  explicitly instructed: "Yes, please change the approach to what you say". This approves
  the domain presentation and filtering behavior described here. Medium priority is
  inherited from KM-400a, not represented as a newly supplied user priority.
  Triage: a scoped representation constraint under KM-400a-3's canonical relationship
  behavior; no new capability, UI product, roadmap goal or source ontology. L3 keeps
  the existing L1's five L2 behavior groups intact without a child-limit override.
  KM-400a-1 through KM-400a-5 do not require native Aura labels, caption properties or a
  direct declared-membership property, so this child captures that bounded gap.
  Product-truth applicability: none; the change configures the existing external Aura
  exploration surface and its backend projection. No new project mockup or flow is needed.
  ADR-064 applicability: the consumer is the human Aura user whose concrete screenshot,
  expectation and finalize query appear in this chat. Existing agent-facing retrieval
  outputs, field meanings, scope and failure contracts remain unchanged and are regression
  obligations. New proxy-persona interviews would not add authority to that human request.
