criteria: |
  Given the consolidated spot-check result contains a distinct finding describing a problem
    with the feature
  When the spot-check pass records that finding
  Then it writes the finding as its own ticket into tickets/00_inbox/
  And the ticket carries valid ticket frontmatter following the project's ticket-authoring
    conventions, so the normal fix flow can pick it up
  And the ticket body describes the finding: what was probed, the reviewer angle that found it,
    and the observed problem
  And the finding is recorded as a tracked ticket rather than left only inside a review report
