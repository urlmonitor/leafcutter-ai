criteria: |
  Given an open pull request from a working branch into main
  And the working branch conflicts with main so the pull request cannot merge cleanly
  When the automation attempts the merge
  Then it surfaces a blocker to the operator stating that the pull request conflicts with main and cannot merge cleanly
  And it does not force the working branch onto main in a way that discards main's commits
  And the pull request remains unmerged
