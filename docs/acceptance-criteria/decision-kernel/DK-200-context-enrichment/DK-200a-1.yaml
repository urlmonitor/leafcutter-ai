id: DK-200a-1
title: "Initial context reaches intent before the first clarification decision"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a new request contains a repository term in the current permitted entity index,
  When the kernel determines what kind of answer the request needs,
  Then one versioned entity-recognition outcome is checkpointed before intent assessment,
  And intent receives the unchanged request and bounded repository meanings with caller claims separate,
  And no clarification decision precedes recognition,
  And initial meanings contain no repository-body evidence.
depends_on: [DK-200a]
covered_by:
  - "DK-200a-1-i"
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_repository_context_reaches_intent_before_any_human_question"
implemented_by:
  - "kernel/scheduler/nodes_enrichment.py"
  - "kernel/scheduler/graph.py"
  - "kernel/scheduler/state.py"
  - "kernel/intent/classify.py"
  - "kernel/intent/step.py"
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Entity recognition must complete before the first intent assessment or clarification decision and emit exactly one context.recognized outcome for a fresh run."
  - "Run tracing must report context status, counts and limitations without including raw repository excerpts."
  - "The context supplied to intent must preserve the original task and distinguish supplied claims, compact meanings and registered capabilities; task evidence is retrieved after intent."
delivers_to: null
expects_from:
  ac_id: DK-300d-1
  contract: "EntityContext version 1.0 checkpoint under state.entity_context; kind=entity_context; original_goal remains verbatim; caller_context and registered_capabilities are separate; entities contain compact typed meanings, canonical references and provenance, never body evidence; unresolved references, coverage, budgets and limitations describe the pass; status=recognized|no_matches|partial|unavailable|disabled. Human and host resume reuse the saved snapshot without recognition or index rebuilding. Historical EnrichedContext checkpoints retain their old channel and semantics."
test_required: true
test_spec:
  - name: test_repository_context_reaches_intent_before_any_human_question
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: reachability
    description: "Through RunService, an indexed glossary identity changes the controlled intent provider's answer; exactly one context.recognized event precedes intent.assessed, no clarification opens, and the original goal and caller observations survive in the versioned checkpoint."
test_rationale: "A real service run proves enrichment is consumed in control flow; importing the classifier or checking graph strings cannot prove that."
doc_links:
