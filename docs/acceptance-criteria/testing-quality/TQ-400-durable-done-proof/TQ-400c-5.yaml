test_spec:
  - name: test_tq400c5_guide_states_schedule_location_trigger_and_the_absent_report_cases
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Read the published docs/how-to/done-proof-cadence.md and assert it names
      where the recurring run is configured, how to trigger a run out of cycle,
      how to list occurrences and open the preceding report, and — for the
      no-report cycle — how to tell a failed run from one that has not fired, with
      what to look at in each case. Assert every direction-of-travel figure it
      explains names a population, a direction and a comparison occurrence.
  - name: test_tq400c5_every_documented_command_runs_as_written
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      PRODUCTION ENTRY POINT. Extract every fenced command from the guide and
      execute each via subprocess (out-of-cycle trigger in its dry-run or
      validate form where a real dispatch is not appropriate); each must be
      accepted as written. must_block rides here — a command naming a workflow,
      job or flag that does not exist must fail this test rather than be caught in
      review.
  - name: test_tq400c5_documented_cadence_and_trigger_match_the_delivered_workflow
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      REAL PRODUCER INTO REAL CONSUMER. Parse the workflow file TQ-400c-1 delivers
      and assert the schedule expression, the job name and the out-of-cycle
      trigger name quoted in the guide are byte-equal to those configured, in both
      directions. This is the clause that catches a guide describing a cadence
      nobody configured — the whole risk when no recurring schedule exists in the
      repository today.
  - name: test_tq400c5_a_completed_run_publishes_figures_where_the_guide_sends_the_reader
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      ROUND TRIP — FULLY AUTHORABLE AS OF 2026-08-18 (this entry was previously
      half-blocked pending the surface decision). Complete a real run over a temp
      store, then read the artifact at each location the guide names: the dated
      report from TQ-400c-1, and the pull-request check entry TQ-400c-2 publishes.
      Assert that run's figures and its occurrence date are present in both, from
      the emitted bytes rather than a renderer return value. Assert additionally
      that the check-entry name the guide quotes is byte-equal to the one
      TQ-400c-2 delivers, so the guide cannot send a reader to a differently-named
      entry, and that the guide's claim about the entry being non-blocking matches
      the delivered configuration. Never assert against a guessed or placeholder
      path.
test_rationale: >-
  change_target is docs, and a cadence how-to is the easiest of all to satisfy with
  a page that restates a configuration — which is why three of the four entries
  reach past the prose into the repository. The two clauses that cannot be faked
  are round-trips and are treated as such: the reader triggers a run and sees its
  report (real_artifact), and the cadence the guide quotes is the cadence actually
  configured (seam, both directions). The seam entry matters more here than
  anywhere else in this tree because no recurring schedule exists in the repository
  today, so there is no incumbent behaviour to catch a wrong description — a
  generic and entirely plausible account of scheduling would read correctly and be
  false. NOT MECHANICALLY TESTABLE: "they can say where the run is configured" and
  "they can state what the direction-of-travel figures mean" are comprehension
  claims; their proxy is the criterion entry asserting the three components of each
  explanation are PRESENT (population, direction, comparison occurrence) rather
  than that a delta is merely reported, plus the seam entry asserting what is
  present is true. NO LONGER BLOCKED (2026-08-18): the fourth criterion — figures
  found where the guide sends the reader — was deliberately left without a weaker
  substitute while the surface was unnamed, because a placeholder-tolerant test
  would have let this AC pass while the clause it exists for went unmet. The
  surface is now settled (the non-blocking pull-request check entry), so that
  entry is authored in full and asserts the quoted entry name byte-equal to the
  delivered one — the placeholder-tolerance risk is closed rather than deferred.
