    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Assert the refusal surfaced by the run identifies the specific phase that is unaccounted for, not merely that a close was refused -- an unnamed refusal is what made the original split outcome unreadable."
  - name: test_refused_ticket_still_names_the_phase_as_needed_afterwards
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Re-read the refused ticket's record and assert it is byte-identical to the state it was found in: the outstanding phase still named as needed, and NOT reclassified to not-needed, excluded, or already-satisfied as a side effect of the refusal. This is the behavioural form of 'correct the record, never soften the reader'."
  - name: test_control_ticket_in_the_same_run_is_written_finished
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Carry a second ticket in the SAME run whose record names the same phases as needed and carries a sign-off for every one, and assert its finished state IS written. Without this contrast a driver that has simply stopped writing passes every refusal assertion above -- the failure mode BO-400a-2-iii already hit once."
  - name: test_both_drivers_refuse_the_same_record_identically
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Drive the same unaccounted-for ticket through the epic driver and through the single-ticket driver and assert both refuse, name the same phase, and leave the same unchanged record -- the twin seam BO-400a-2-ii's standing constraint holds closed."
  - name: test_refusal_is_reachable_from_a_real_workflow_run
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "REQUIRED -- invoke the production entry point: load and execute the real workflow script via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert the guarded refusal is actually reached during a close. Do NOT satisfy this by invoking the status script directly or by importing a helper: the defect is precisely that the driver never reaches the guarded path, and the guarded path passes its own unit tests today."
