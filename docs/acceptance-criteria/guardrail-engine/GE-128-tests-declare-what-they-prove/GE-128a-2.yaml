id: GE-128a-2
title: "Adding one more undeclared test to a file that already has some is refused; editing that file any other way is allowed"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario 1 - the count grows by one: refused
  Given a tracked test file that, before the change, holds 12 test functions of
    which 7 declare no requirement,
  And the test-declaration check is in error mode,
  And a change is staged that adds one new test function to that file, test_new,
    which declares no requirement, and changes nothing else in the file,
  When the author performs an ordinary commit,
  Then the commit does not complete,
  And the outcome names the file, states that it held 7 undeclared tests before
    the change and holds 8 after it,
  And the outcome names test_new as the test that has no declaration.

  Scenario 2 - the same file, edited without adding an undeclared test: allowed
  Given the same file as it stood before the change in Scenario 1 (12 test
    functions, 7 undeclared),
  And the test-declaration check is in error mode,
  And a change is staged that edits the body of one of the 7 undeclared tests and
    adds a helper function that is not a test, leaving 7 undeclared tests,
  When the author performs an ordinary commit,
  Then the commit completes,
  And the file is not refused for the 7 undeclared tests it still holds.

  Scenario 3 - both arms in one run
  Given the changes from Scenario 1 and Scenario 2 are evaluated by the same
    check build in the same run, each against the file as it stood before it,
  When both verdicts are read,
  Then the Scenario 1 change is refused and the Scenario 2 change is allowed,
  So that a check that refuses everything, and a check that allows everything,
    each fail this criterion.
