title: "A mixed-surface work item flags only the portion its stated intent cannot handle"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given a work item whose stated intent assigns a Python implementer checked by a Python
    test framework,
  And its declared surface contains both Python source files and JavaScript source files,
  When the pre-implementation intent-versus-surface consistency check evaluates the work item,
  Then it flags the JavaScript portion of the surface as unhandled by the stated intent,
  And it does not flag the Python portion, which the stated intent does handle.
