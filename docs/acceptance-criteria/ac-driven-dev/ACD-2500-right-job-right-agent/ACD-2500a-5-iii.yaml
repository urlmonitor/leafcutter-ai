  And it states that a run repairs anything only when it is given a before-state, names the
    two ways to give one, and states what a run without one reports
    ("not evaluated: no before-state", nothing repaired),
  And every example command in it that can repair records passes a before-state,
  And its family count and family list agree with the families the check reports.
