notes: |
  THIS REPO HAS SHIPPED THE SAME DEFECT THREE TIMES AND ITS CLAUDE.md SAYS SO. The
  feedback-categories path check reported a missing file on every worktree
  including correct ones; the schema validator's bare-directory glob reported
  clean while checking nothing for eight days; a post-merge audit reported clean
  because the reference it compared against was stale. The shared shape is that a
  run which examined nothing was indistinguishable from a run that found nothing.
  A recurring, unattended, whole-store job is the single most dangerous place in
  this codebase for that shape, because nobody is watching it to notice.

  WHY THIS IS SEPARATE FROM ACS-1400b-2. That AC governs the honesty of a report
  that found things — classification and denominator. This one governs the honesty
  of a report that found nothing, which is the state the job will be in on almost
  every run once ACS-1400c has cleared the population, and therefore the state
  nobody will ever inspect.

  DELIBERATELY DISTINCT FROM ACS-1400a-3, WHICH MAKES THE SAME DEMAND OF THE
  COMMIT-TIME CHECK. Two instruments, two runs, two places the defect can hide.
  Neither covers the other.
