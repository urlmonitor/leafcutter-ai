notes: |
  Produced for the `reference-doc` entry in GE-124b's `documentation_triggers`.
  The PO's reason: the attribute is a contract with several consumers at once,
  and its name, multi-value form, resolution rule, production-stripping
  behaviour and — explicitly — what it does NOT prove need one authoritative
  place to live.

  The "does not prove" section is required content, not a courtesy. GE-124g-5
  writes the standing rule about what each kind of evidence is worth; this doc
  is the place a consumer-author lands first, so it must carry the same line or
  the standing rule will be discovered too late.

  IT-PO ENRICHMENT NOTE (2026-08-25). This doc is the natural home for two
  facts that would otherwise be lost between ACs: the deliberate difference
  between the @ac line grammar and the data-ac value grammar (the `~=` selector
  operator is the reason), and the React-only scope of the production strip
  built by GE-124b-3.
