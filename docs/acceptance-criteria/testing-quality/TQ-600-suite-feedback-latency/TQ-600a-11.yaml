test_spec:
  - name: test_tq600a_11_store_sweep_is_at_least_five_times_faster_than_the_pure_python_parser
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Over the REAL on-disk store, in one process, time a full sweep with the
      pure-Python parser and a full sweep through the shared accessor. The accessor
      sweep takes at most one fifth of the pure-Python sweep. Assert the ratio, never
      an absolute number of seconds. UNCHANGED BY THE 2026-10-08 AMENDMENT, with one
      clarification: this descriptor measures the PARSER, not any entry point, so a
      green result here is NOT evidence that any gate, hook or check got faster. The
      descriptor below is the one that measures an entry point.
  - name: test_tq600a_11_the_agent_card_store_walk_beats_a_fifth_of_its_same_sitting_pure_python_baseline
    target_dir: unit_tests/ac_store/
