notes: |
  BUG-19, observed in run wf_cc2b46d9-f6f.

  THE OBSERVED STATE. The batch plan was computed once at drive start and enumerated
  ten pieces of work. Three more were committed to the epic branch twenty-six minutes
  after planning. They were never built -- which is defensible -- AND never appeared
  in the final output's halted or skipped lists, which is not: the drive would have
  reported the epic complete having never seen them. The additions were invisible in
  both directions at once.

  WHY THE CONTRACT IS DETECT-AND-REPORT RATHER THAN BUILD. Extending the running plan
  to absorb new work gives the drive no termination condition: work added during a
  drive can itself add more, and a fifteen-hour run would become an open-ended one.
  Reporting is also the honest contract, because the operator who added the work
  during the drive is the one who knows whether it belongs in this drive at all.
  The cost of reporting is a second read of a set the drive already knows how to
  enumerate.

  WHY IT SITS UNDER BO-300a. The harm is entirely in the completion output: the drive
  told the operator it knew what had been built, and it did not. That is the promise
  BO-300 makes.
