  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Advertised means running — never a protection that was never switched on.

  Every check the package presents as protecting you — written up in its
  documentation, listed with how serious it is, given its own settings — is
  actually switched on and runs on your work. When one of them is not, that is
  announced plainly rather than left for you to stumble over, so nothing can
  look like protection you are not in fact getting.
