notes: |
  Observed 2026-11-16, run wf_f26bd73c-98c: the claim was stopped part-way, the run said "never
  attempted" and released nothing. A later run claimed normally, so most likely nothing had
  been changed, but the run could not know that and did not check.

  HOW THE RUN KNOWS WHICH MEMBERS ARE ITS OWN WITHOUT AN OWNER RECORD. The resolve step already
  reports each member's work_status before the claim. A member that read todo then and reads
  in_progress after an unknown-state claim is taken as this run's claim. A member that read
  in_progress before is never touched. Owner-aware claims (a token per claim) are out of scope
  and come later; until then one gap is known and accepted: a second run in the same workspace
  that claims between this run's resolve and its reconciliation would be mistaken for this
  run's claim. The 2026-11-16 analysis rates that unlikely.

  ASSUMPTION, NOT ASKED: the run halts after reconciling, even when the reconciliation finds
  that every todo member was claimed. Proceeding on a claim whose command was stopped is not
  safe to judge from status alone. If the operator wants the run to continue instead when the
  claim is found complete, that is a change to this record.

  Ran-and-failed is included because a command that stopped with an error after it began
  changing records may have claimed some members; checking costs one read.
