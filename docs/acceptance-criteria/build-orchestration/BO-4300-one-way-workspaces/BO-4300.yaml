criteria: |
  One way to get a workspace -- the same result, from anywhere, every time.

  Whenever automation, or you, needs a separate place to work, there is exactly one
  way to get it, and it behaves the same whichever workflow, skill or agent asks,
  from whichever folder, on whichever machine. You either receive a workspace that is
  completely ready -- its own line of work, started from the latest shared work, with
  its protections switched on -- or you are told plainly why not, and nothing carries
  on without one: work never quietly lands on the shared main line instead. Asking
  again is always safe, finding and clearing workspaces goes through the same door,
  and the scattered older ways of doing this are gone, so nothing is left to drift
  out of step.
