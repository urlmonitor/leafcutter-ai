    angle: seam
    description: "Under the workflow-engine harness a scripted commit reply built from a real hook_failed answer with handoff is consumed by a depth-0 route, which engages the named specialist and re-offers the identical commit."
  - name: test_regression_tests_for_trailer_and_pkill_kis_pass_against_migrated_agent
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "The KI-BO-20260914 and KI-BO-20260925 regression tests run against the deployed template and the real step and pass."
test_rationale: >-
  The template is an LLM surface, so its text is the strongest unit-level evidence (BO-2400a-1-i
  precedent); the seam test adds the behavioural half by proving a depth-0 route actually consumes
  the envelope this template is told to return.
