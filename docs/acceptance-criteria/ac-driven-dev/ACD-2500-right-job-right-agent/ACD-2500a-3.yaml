id: ACD-2500a-3
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: high
title: "Specialist-versus-surface compatibility is judged from the one surface-to-specialist map"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given record P is assigned to python-coder and declares the files scripts/x.py and
    web/app/page.tsx,
    and record Q is assigned to llm-expert and declares only templates/agents/foo.md,
    and record S declares no files,
  When the requirement rule check runs,
  Then P gets exactly one finding with disposition "needs a decision" that names
    web/app/page.tsx, the specialist the store's surface-to-specialist map gives for it,
    and python-coder,
  And scripts/x.py is not named in P's finding,
  And Q produces no finding,
  And S is listed in the report as "not evaluated: no declared files" for this family and
    is not counted as passed,
  And the verdicts come from the single surface-to-specialist map the assignment-quality
    check reads; there is no second file-type compatibility table anywhere.
depends_on:
  - ACD-2500a
  - ACD-2500a-1
  - ACD-1700b-1
doc_links:
- path: docs/acceptance-criteria/ac-driven-dev/ACD-1700-role-scoped-context/ACD-1700b-1.yaml
  relationship: related
  status: exists
- path: templates/agents/it-po.md
  relationship: describes
  status: exists
- path: docs/architecture/adrs/ADR-010-ac-store-as-authoritative-backlog.md
  relationship: describes
  status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'Reads config/surface_craft_map.yaml (the path-aware, first-match-wins map pinned by ACD-1700b-1) as
  the only surface-to-specialist source; no file-type table inside the check. Build prerequisite: ACD-1700b-1
  has delivered the map (the file does not exist in the repo today).'
- 'Declared files are read through the one derivation the ticket generator uses to build files_touched
  (ADR-010 doc_links -> files_touched); no second derivation may be added. See caveat: that derivation
  is imprecise today (KI-ACS-002) and no AC-level to-be-created marker exists.'
- 'A declared file matching no map entry is reported ''not evaluated: unresolved surface'', never passed
  and never a mismatch.'
- Only the unmatched part of a mixed surface is named (BP-1100f-3-i partial-flag behaviour).
- 'A record with no declared files is listed ''not evaluated: no declared files'' and excluded from the
  passed count.'
delivers_to:
  agent: llm-expert
  contract: Specialist-versus-surface family replaces the it-po.md S2.8 table; ACD-2500e-2 deletes S2.8
    and points here.
expects_from:
- ac_id: ACD-2500a-1
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
- ac_id: ACD-1700b-1
  contract: 'config/surface_craft_map.yaml: ordered list of {glob, craft}; first match wins; templates/workflows-js/**/*.{js,mjs}
    -> python-coder.'
test_spec:
- name: test_mismatched_file_named_with_resolved_specialist_and_agent
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: P gets one 'needs a decision' finding naming web/app/page.tsx, the map's specialist and
    python-coder.
- name: test_matched_file_not_named_in_finding
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: scripts/x.py is not named in P's finding.
- name: test_llm_expert_template_only_no_finding
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Q (llm-expert, templates/agents/foo.md only) produces no finding.
- name: test_no_declared_files_listed_not_evaluated
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: 'S is listed ''not evaluated: no declared files'' and not counted as passed.'
  angle: boundary
- name: test_verdict_source_is_surface_craft_map
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Verdicts come from config/surface_craft_map.yaml; a fixture map with a changed entry changes
    the verdict.
  angle: seam
