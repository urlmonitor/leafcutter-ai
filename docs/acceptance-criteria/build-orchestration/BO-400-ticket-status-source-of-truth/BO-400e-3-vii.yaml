id: BO-400e-3-vii
title: "Until the closable set is derived mechanically, finalization closes nothing without the person's own confirmation -- and a declined or unanswered one stops the run before the merge"
component: build-orchestration
components:
  - build_orchestration
  - finalize
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given finalization of "EPIC-Alpha" has shown the list of records it is about to close --
      "alpha-02.md" and "BO-9100a-2"
  When the person running finalization confirms
  Then exactly those records are closed, and the run continues towards the merge

  Given the same list
  When the person declines
  Then no ticket and no acceptance criterion changes status
    And no closure commit is made
    And the run stops before the merge to main
    And its report says the closure was declined, names the listed records as left open, and
      states that running finalization again will show the list again

  Given the same list
  When no answer arrives within the time the run allows for an answer
  Then the outcome is the same as a decline, and the report says the closure went unanswered
    rather than that it was declined

  Given the same list
  When the only "yes" comes from an agent taking part in the run, not from the person
  Then it is treated as no answer, and nothing is closed
  Because writing "done" across the store is destructive in the same sense as the merge that
    finalization already will not make without the person's say-so, and while the set of
    records cannot yet be trusted to scope itself, the person is the only check standing
    between a wrong set and a false "done" that nothing downstream ever corrects.
