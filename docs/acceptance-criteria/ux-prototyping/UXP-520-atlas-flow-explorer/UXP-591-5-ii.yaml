notes: |
  Derived from flow leafcutter/explore-flows-in-atlas v5, step 'backForward' (FlowNavigation
  sessions drill-and-return, drawer-in-history, select-from-open-drawer,
  recover-from-unknown, clear-step-notice, filter-replace). Authored as an L3 under the
  history L2 because UXP-591 is at its five-L2 cap; it is a flow step, not a branch.
  Owner-confirmed rule (AC gate, 2026-10-09, decision (1)): Back and Forward restore each
  history entry's own Source, Kind and Realization filters. The clause was drafted from the
  leafcutter/atlas-flows dataset's assumption and is no longer an assumption. Without it, Back
  to an entry whose flow the current filters exclude would leave that flow unlisted in the
  selector. The flow (v5) and the dataset (v3) still record the rule as unruled until they are
  next revised.
