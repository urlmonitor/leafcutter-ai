notes: |
  A BARE POSITION IS NOT CHECKABLE AND THE FOURTH SCENARIO SAYS SO RATHER THAN
  PRETENDING OTHERWISE. A line number on its own is satisfied by whatever happens to
  be on that line, so a check that only confirms the position exists would report
  KI-BO-022 as sound while it points at unrelated code. What makes the class
  decidable is an entry that records what it expects to find there as well as where.

  That is a requirement on the entry format as much as on the check, and it is
  stated as behaviour rather than as an instruction to authors: an entry without an
  identifying anchor is reported as unverifiable, which is a visible cost that
  produces better entries, rather than a rule people are asked to remember.

  The third scenario is the noise control: the register mentions files constantly,
  and a check that flagged them all would be switched off within a week.
