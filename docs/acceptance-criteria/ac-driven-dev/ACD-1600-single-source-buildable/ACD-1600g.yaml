criteria: |
  Every requirement draws its own boundary, not just its target.

  A requirement states not only what it is meant to change but what it must
  deliberately leave untouched, so a builder knows where the work stops. Anything
  changed outside that boundary is surfaced for a decision rather than slipping
  through unnoticed, and the boundary holds whether the requirement is built on
  its own or alongside others in a larger feature.
