notes: |
  Found by an empirical read of scripts/ci/_use_install_step.py on this branch. The order
  of operations is the defect: the registry is narrowed to the self-healing hook plus any
  hook invoking the uniqueness check, and only then is the commit attempted and the
  executed-guard record captured. The record is honest about what ran; it is silent about
  what could never have run. BP-900h-6's own criteria are satisfied by that state — the
  record is captured rather than derived, and it is non-empty — which is why this needs
  its own criterion rather than an amendment.

  WHY NOT SIMPLY FORBID THE NARROWING. Two judgment-tier hooks are documented as
  misfiring against a scratch project that tracks only its own first commit, and those are
  filed defects with their own records. Turning them on here would make the job red for a
  reason that is not the job's subject and it would be switched off again. The property
  worth enforcing is that the verdict cannot outrun the observation: withhold what must be
  withheld, name it, and never let the result read as a clean adopter experience across a
  population that was never faced.

  WRONG FIXES TO EXPECT.
  1. Add the withheld names to the output and leave the pass line alone. The reviewer
     still sees a pass and the diagnostic is below the fold.
  2. Report the deployed count by re-reading the registry after narrowing. Internally
     consistent, always equal to the executed count, and green.
  3. Qualify every run. Removes the distinction rather than making it, and within two
     merges the qualifier is noise nobody reads.

  SCOPE BOUNDARY. This AC does not say which guards may be withheld, and it does not
  assert any guard's own behaviour — those belong to the guards' records. It also says
  nothing about what the step is allowed to mutate; that is BP-900h-6-i.
