criteria: |
  Given a merge commit touched one ticket file:
    - tickets/TICKET-MANUAL.md with frontmatter status: done but no source_ac field,
  When the post-merge hook fires after the merge into main,
  Then the mark_ac_done script is NOT invoked for that ticket,
  And no AC YAML files under docs/acceptance-criteria/ are modified,
  And the hook exits with code 0.
