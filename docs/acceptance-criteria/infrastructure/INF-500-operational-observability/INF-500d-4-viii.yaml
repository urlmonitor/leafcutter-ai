criteria: |
  Given a maintainer reads the feedback collector's component diagram to understand
    where a drive's logs end up,
  When the diagram is consulted after this change,
  Then it shows the build recording one enduring log location, the per-drive
    workspace inheriting that location from the project it belongs to, and every
    writer and reader of the operational log directory reaching that one location,
  And it shows configuration and commit-time guards still resolving to the workspace,
    so the three resolution rules are visibly separate.
