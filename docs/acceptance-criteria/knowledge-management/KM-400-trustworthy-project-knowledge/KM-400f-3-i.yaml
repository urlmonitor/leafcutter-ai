criteria: |
  Given the backend's published limits are 200,000 nodes and 400,000 relationships
  And this backend is recorded as having refused all changes twice while under those published limits, at 169,568 nodes with 251,326 relationships and at 189,950 nodes with 304,498 relationships
  And measured current usage is 150,000 nodes and 280,000 relationships
  And the prepared snapshot contains 9,850 nodes and 26,100 relationships
  When publication is requested
  Then the headroom result names the figures the measured usage was compared against and states that those figures are the backend's published limits
  And the headroom result states that the usage at which this backend actually begins refusing changes is not determined
  And it gives the two recorded refusals below the published limits as the reason it is not determined, naming the usage measured at each
  And a measured usage under the published limits is reported as being under the published limits, and is not reported as a determination that this publication will be accepted

  Given the same published limits and the same measured usage
  And no refusal by this backend is recorded
  When publication is requested
  Then the headroom result states that no refusal by this backend is recorded
  And it still states that the usage at which this backend would begin refusing changes is not determined
  And the absence of a recorded refusal is not reported as evidence that the published limits are the usage at which changes stop being accepted

  Given the backend refuses the request that reports its published limits, and no refusal by this backend is recorded
  When publication is requested
  Then the headroom result names the measured usage and reports both the published limits and the refusal threshold as unknown
  And no part of the result is reported as a satisfied headroom check
