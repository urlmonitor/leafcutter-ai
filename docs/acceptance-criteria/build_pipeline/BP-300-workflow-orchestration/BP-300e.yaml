title: "Delivery commands finish even when an agent adds extra wording to its reply"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  Extra wording in an agent's reply never crashes your run.

  Your /plan-feature, /build-feature, and /finalize-feature runs (and the epic
  and ticket workflows behind them) complete and produce the output you asked
  for — the requirements, tickets, and merges — even when a helper agent wraps
  a perfectly good answer in an explanatory note or heading. A reply that is
  genuinely unusable still stops the run with a clear message, so cosmetic
  wording never costs you a lost run and real problems are never hidden.
