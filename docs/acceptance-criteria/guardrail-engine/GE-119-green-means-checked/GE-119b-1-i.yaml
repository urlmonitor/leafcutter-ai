notes: |
  This is the seam between the two L1s, made explicit. GE-119b removes the REASON a check
  could not run; GE-119a governs what happens when it still cannot. There is a case that
  GE-119b cannot fix by resolution alone — a workspace with nothing to resolve TO — and this
  AC pins that the case falls through to GE-119a rather than through a crack between them.

  Without this AC, an implementer could satisfy GE-119b-1 by making resolution succeed in the
  linked and buildable cases and leave the bare case exiting 0 exactly as before, with both
  parent ACs' letter met.
