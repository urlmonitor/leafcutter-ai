notes: |
  The core L1. Surface: check_ac_parent_covered_by.py (the commit-time
  parent-back-link check).

  RECOGNITION, NOT SUPPRESSION — the distinction the BA must hold: the
  exemption has to key off a positive, deliberate signal that says "this is
  parked", not off the absence of something. "Parent has no children listed"
  is also exactly what a half-finished, genuinely broken tree looks like; an
  exemption that keys off absence alone would silence real breakage. What the
  parked signal IS (a field, a readiness value, a level-plus-state combination)
  is an L2 decision — the PO's constraint is only that it must be something an
  author sets on purpose and a reader can see.

  The reference-doc trigger is mandatory rather than nice-to-have: ac-schema.md
  currently documents the back-link protocol as unconditional ("missing links
  block the commit"), so shipping the exemption without amending that reference
  leaves the written rule contradicting the enforced one.

  BA DECOMPOSITION (2026-08-14). The L2 decision the PO left open is settled in
  ACS-1200a-1: the signal is a field pair on the record — parked: true plus a
  non-empty parked_reason — set by the author, stored on the AC record itself
  (no side registry or ignore-list), and explicitly NOT inherited by children
  (ACS-1200a-2-i). The matching negative, that an unmarked childless tree is
  still blocked and still reported, lives under ACS-1200c-3 so it cannot be
  dropped by relaxing this L1. ACS-1200a-4 re-proves the exemption against the
  real on-disk KM-200 records rather than a fixture.

  ORDERING WITH GE-119b is carried on ACS-1200a-2 (delivers_to contract and
  doc_links): that AC must land before, or in the same release as, GE-119b.
