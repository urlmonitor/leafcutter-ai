risk_surface: contract_boundary
notes: |
  UNTIL THIS LANDS, EVERY OTHER PART OF THIS TREE IS ADVICE COMPETING WITH A RULE. The
  sharpest part of the recorded defect is not that a check is absent — it is that its
  absence is documented as correct. Everyone involved in the recorded case followed
  the written rule and behaved properly, and none of them had reason to ask the next
  question.

  THE FOURTH CLAUSE CLOSES THE OBVIOUS CHEAP EXIT. Once the guidance stops calling an
  immediate pass a problem, the path of least resistance is to record the immediate
  pass as though it were the evidence — "green on arrival, as expected" — which is the
  same clean bill of health under a new name. Passing on arrival is the premise of the
  question, not an answer to it.

  BOUNDARY. This AC governs what the record must and must not say for the
  green-on-arrival case. Which shape of answer a writer chooses is TQ-500a-1; how to
  choose and take a substitute is TQ-500d-2; whether ordinary work acquires any new
  obligation is TQ-500d-3.
