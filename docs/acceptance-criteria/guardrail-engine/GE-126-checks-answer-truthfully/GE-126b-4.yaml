id: GE-126b-4
title: "The three answers a check can give are written down with the evidence that produced them"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader or an agent deciding what a result from this check means,
  When they consult the reference material for the check family,
  Then it names the three answers a run can produce — the work was refused the work was
    examined and found clean and the check could not examine anything — and states which
    of them share an exit status so nobody infers a verdict from an exit code again,
  And it states that every run says what root it resolved and how many records it examined
    before reporting any result and that this statement is unconditional,
  And it records the observed pair that motivated the rule with its date: the same check
    the same file and the same exit code from two working directories where only one run
    inspected anything,
  And any statement in the reference material that a zero exit from this check constitutes
    a clean result is removed rather than qualified,
  And the reference does not assert that any check other than the one repaired here
    already behaves this way.

  Coverage note: covered by a test that takes each of the three documented answers and
  asserts the deployed check actually produces that answer under the condition the
  reference describes. A test that asserts the reference contains the three words does not
  cover this criterion.
depends_on:
