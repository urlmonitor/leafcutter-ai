it_requirements:
  config_schema_fragment:
    fast_lane_red_baseline_proof_route:
      type: object
      description: "The red-baseline verdict carries a per-AC proof_route: red_first when the AC has >=1 red newly-added covering test, mutation when every newly-added covering test of the AC is green and none is inconclusive. A batch of only mutation-route ACs is not a halt; the verdict lists backfill ACs with their tests."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Classification is per AC, computed from the newly-added partition of BO-2400a-3-ii and the outcome classes of BO-2400a-3-vi. No AC-store field is read to decide it."
    - "Before this is built, BO-2400a-3-i needs a spec amendment: all_new_tests_green_at_baseline stops being a halt reason on its own and becomes a mutation-route classification. Flagged to the store owner. This record does not edit BO-2400a-3-i."
    - "it-po to decide the field and verdict names; criteria fix only the behaviour."
delivers_to:
  agent: python-coder
  contract: "The list of backfill ACs with their green newly-added test ids, consumed by the mutation proof (BO-2400a-3-x)."
expects_from:
  ac_id: BO-2400a-3-vi
  contract: "The red / green / inconclusive class of each newly-added covering test."
