id: BO-3100b-4
title: "A sequence diagram shows the exit-time judgement and the retry it forces"
component: build-orchestration
components:
  - documentation_system
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader trying to understand why a step ran twice,
  When they open the sequence diagram for the exit-time judgement,
  Then it shows, in order: the step being dispatched, the project's working state being
    captured before it runs, the specialist returning a reply, the state being compared
    again, the judgement being made from that comparison rather than from the reply, the
    attempt to finish being prevented, and the step running again.

  Given the diagram,
  When it is compared against a real build in which a step produced nothing and was re-run,
  Then every interaction the diagram shows occurred in that build, in the order shown, and
    the diagram shows no interaction that did not occur.
depends_on:
  - BO-3100b
  - BO-3100b-1
  - BO-3100b-2
doc_links:
  - path: docs/architecture/diagrams/
    relationship: describes
