notes: 'Audit 2026-11-16 sections 3.2 and 3.4: no existing eval set guards against regression, because the RQE runner
  needs a localhost Neo4j and the interpretation and live sets run from report-local scripts. The in-process backend
  plus real Git projection is the pattern the existing answer-contract acceptance tests already use. Only the
  deterministic categories get a threshold verdict here: scoring scripted judgments against the 90% selection threshold
  would measure the script, not the selector. Promoting the manual RQE runners into CI is out of scope (build-order
  step 3). Draft. BA 2026-11-17: KM-500a-4-ii added to depends_on so it matches the existing expects_from contract
  (scripted labels per case and per run); no cycle. IT PO 2026-11-17: expects_from KM-500a-4-x added, because the
  required suite reads the frozen S1 files through the committed lock. The BA should add the matching depends_on
  KM-500a-4-x. No cycle: KM-500a-4-x depends only on KM-500a-4, KM-500a-4-iv and KM-500a-4-v.'
