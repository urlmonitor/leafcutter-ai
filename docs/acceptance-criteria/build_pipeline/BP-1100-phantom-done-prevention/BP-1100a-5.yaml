notes: |
  WHY THIS EXISTS. BP-1100a-3 changes the first of the two sources the surface is derived
  from and BP-1100a-4 retires the second. The section of docs/how-to/ac-traceability-store.md
  titled "How do I make sure /build-ac names the right files_touched?" documents both as
  current behaviour, in detail and by name. When those two land, the page tells authors how
  a mechanism works that no longer works that way.

  WHY A SEPARATE AC AND NOT A WIDENING OF EITHER. Both ACs' criteria are about the
  generated ticket, not about documentation, and both deliberately exclude the page from
  their surface; the it-po's reasoning there is right and this AC does not overturn it.
  Nothing else would have scheduled the work either: documentation-expert is added to a
  generated ticket by config/guardrail_gates.yaml's documentation_gates, keyed on the
  leaf's change_target against the trigger list (ui, schema, pipeline, docs). BP-1100a-3
  and BP-1100a-4 both carry change_target: code, so neither ticket would ever have carried
  a documentation phase. This AC carries change_target: docs and therefore does.

  WHY THE STALENESS IS NOT COSMETIC. This page is the authoring-side remedy for the very
  defect class BP-1100a exists to close, and BP-1100a-4 makes it MORE load-bearing, not
  less: once prose stops contributing, re-tagging a doc_link to an edit-surface
  relationship or supplying reference_file_path is the ONLY way a file reaches the surface.
  An author who follows today's text — which describes the prose fallback as a live
  behaviour — will produce a requirement whose ticket declares no surface, and the page
  will not explain why. Documentation that describes a retired mechanism is the same
  phantom-done shape one layer up: it looks like coverage and cannot be acted on.

  THREE THINGS ON THE PAGE CHANGE, AND THEY FAIL INDEPENDENTLY.
    1. The two-source description and the prose-fallback paragraph.
    2. The worked BO-2400g-2 example, whose stated output ("[PASS] files_touched has 4
       path(s)", none of them the file the AC exists to change) is a before-picture once
       the derivation is fixed.
    3. The --verify caveat. BP-1100a-3 requires that no report call an undetermined
       surface satisfactory, so the "a green exit code does not do it for you" advice is
       partly overtaken — but only partly: the check still cannot confirm that a
       DETERMINED surface is the right one. The criteria ask for the true remainder to be
       kept, not for the whole warning to be deleted, because deleting it would restore
       exactly the over-trust that KI-ACS-002 and false-green mechanism M8 describe.

  SCOPE FENCE. This AC owns one section of one page. It does not own docs/known-issues/
  ac-store.md (KI-ACS-002 is closed by whoever fixes the readiness report, not by a writer)
  and it does not own docs/reference/false-green-mechanisms.md, whose M8 entry is a durable
  pattern illustrated by this defect rather than a record of it. Contradicting either is
  the failure mode; editing them here is out of bounds.

  ORDERING. depends_on names both behaviour ACs because the page cannot be written
  truthfully until both have shipped — writing it after only BP-1100a-3 would document a
  prose fallback that is about to be retired. This is the documentation-after-
  implementation timing the store uses elsewhere (see BO-2400a-6).

  FIELDS LEFT FOR THE IT PO. estimated_complexity and it_requirements are not set here.
  assigned_agent is set to documentation-expert because the how-to genre maps to that agent
  mechanically, not as a judgement — override it if the enrichment pass disagrees. No
  test_spec is authored: test_required is false with a stated rationale.

  PARENT CAP. BP-1100a now has five L2 children (BP-1100a-1, -2, -3, -4, -5) and declares no
  child_limit_override. _MAX_L2_PER_L1 is 5 and is applied as child_count > limit, so five
  passes and this AC is the last one that fits. A sixth L2 under BP-1100a will be blocked;
  the next author must split the tree (see the ac-tree-split skill) or find another L1
  rather than reach for the override. BP-1100 itself is also full at seven L1s, so a new
  sibling L1 is not available either.
