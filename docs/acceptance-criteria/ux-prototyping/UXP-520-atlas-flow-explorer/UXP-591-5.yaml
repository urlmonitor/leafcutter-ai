notes: |
  Derived from flow leafcutter/explore-flows-in-atlas v5, step 'navPush' (FlowNavigation
  sessions drill-and-return, shared-mock-journey, recover-from-unknown). The breadcrumb trail
  is not part of the address, so each history entry has to keep its own trail for Back and
  Forward (UXP-591-5-ii). Children: 'pushFromOpenDrawer' (-i), the 'backForward' step (-ii,
  placed under this L2 because UXP-591 is at its five-L2 cap), and the filter step's two
  branches 'filterRepicksFlow' (-iii) and 'filterKeepsFlow' (-iv), owner ruling 3: a filter
  change never adds an entry.
