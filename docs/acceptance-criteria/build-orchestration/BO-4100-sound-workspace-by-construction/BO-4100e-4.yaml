notes: >-
  The cheapest way to make the listing complete is to register whatever is discovered, and
  that reading of BO-4100e-1 is actively harmful: a half-created workspace has no guarantee
  it was rooted at the shared tip and no guarantee it carries its own supporting material,
  so adopting it hands someone a workspace BO-4100a and BO-4100b both promise they will
  never be given. Promotion would also defeat BO-4100e-3, since a registered workspace is
  no longer described as a remnant. Surfacing is for accounting and clearing, not for use.
