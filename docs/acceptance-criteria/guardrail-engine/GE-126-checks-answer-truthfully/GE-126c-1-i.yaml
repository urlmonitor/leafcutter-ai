assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The set of locations the build writes this check to must be derived from the build's own deploy map at test time, not enumerated in the test. A hardcoded list silently omits the location added next, which is the exact drift GE-126d is closing on a different enumeration."
  - "The coverage must run the real build into a temporary target and then exercise the produced copies. A test that reads the source and reasons about what the build would do cannot detect a deploy map that does not do it."
  - "The distinction between refusing and enforcing must be drawn from something the two copies do not share - their location - rather than from text present in both. Text present in both is copied verbatim by the build, which is what makes this hazard total and immediate."
  - "A real commit must be exercised, not only a direct invocation: the third clause is about the pre-commit chain and this repository has shipped hook changes that passed direct invocation and broke the chain."
  - "Every module the deployed copy imports must be present at every location the build writes it to. This check's whole defect is a helper the build places beside one copy and not the other, so a location the build writes without the helper reintroduces the original bug at a new address."
  - "Error handling must follow the four rules in CLAUDE.md."
test_spec:
  - name: test_every_location_the_build_writes_is_derived_from_the_deploy_map
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "scripts/build.py --target-dir <temp>"
    description: "The build is run into a temporary target and the set of written copies of this check is read back from the build's own deploy map; the test enumerates nothing itself, so a newly added location is covered automatically."
  - name: test_each_built_copy_blocks_the_violating_record_rather_than_refusing
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Every copy the build wrote is run by subprocess against a child record whose parent omits it and each blocks, naming the record and the missing back-link. A copy that returns the refusal outcome fails here."
  - name: test_each_built_copy_passes_a_record_with_a_valid_parent_back_link
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Every built copy returns the ordinary success value for a child record its parent genuinely lists, serialised by the store's real writer - the control against a copy that blocks unconditionally."
  - name: test_a_real_commit_of_a_valid_record_completes_through_the_hook_chain
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    surface_invoked: "git commit in a scratch repository with the built pre-commit chain installed"
    description: "A commit staging a record with a valid parent back-link completes in a scratch repository running the just-built chain - the failure this record fences is total and immediate and only a real commit reproduces it."
test_rationale: |
  This record fences a hazard that a criterion test on its parent cannot see at all:
  the parent's fix is a guard in a file the build copies verbatim, so satisfying the
  parent can break every commit in the repository. Detecting that requires running the
  real build and exercising what it produced, which is why every descriptor here is
  build-then-execute rather than import-and-call. The first descriptor deliberately
  derives the location set from the deploy map instead of listing locations, because a
  hardcoded list is a second enumeration that drifts — the same defect GE-126d exists to
  close, reintroduced in a test. The e2e commit is separate because a direct invocation
  of a hook does not reproduce how the pre-commit chain invokes it, and this repository
  has shipped that gap before.
