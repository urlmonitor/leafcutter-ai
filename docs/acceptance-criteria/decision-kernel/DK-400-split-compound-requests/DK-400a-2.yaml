id: DK-400a-2
title: "A bundled request that routing would accept as one decision is offered as a split first"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose root goal is the decision-records goal of mock record
    dcp-decision-records-bundled ("Decide how Leafcutter should file decision records as JSON or
    YAML files under docs/ so later kernel runs can find and reuse them as precedent: which fields
    a record needs, which classification filters it carries ..., the folder layout and file
    naming, and how human approval and later corrections are recorded."),
  And that goal bundles five separate decisions: fields, classification filters, folder layout,
    file naming, and approval and corrections,
  And routing gives the goal to the decision capability as one decision,
  When routing runs on the run's root,
  Then a split is offered for the goal with trigger bundled_accepted, found at routing and
    work-item depth 0, keeping the goal exactly as submitted,
  And no options and no criteria are formed for the goal as a whole before the person answers
    the split gate,
  And the routing result (the decision capability) is kept with the split, so that a rejected
    split can go ahead as that one decision.
