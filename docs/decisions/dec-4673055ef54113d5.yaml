rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.hybrid] Native read-only GitHub source for facts
    that feed decisions, with host handoff only for anything beyond reading (required mean 0.82, 2/3 passed); 2. [opt.native_source]
    a native read-only retrieval source inside the kernel that pulls from the GitHub API into evidence (required mean 0.61,
    1/3 passed); 3. [opt.host_tool] a host tool, where the kernel hands GitHub lookups to the host LLM (Claude Code or Codex)
    which runs gh (required mean 0.39, 0/3 passed). human:user chose option [opt.hybrid] Native read-only GitHub source for
    facts that feed decisions, with host handoff only for anything beyond reading (kernel rank 1 of 3).'
  origin: template
