criteria: |
  Pointing the lane at a requirement builds that requirement, not everything next to it.

  When an operator aims the fast lane at a single requirement, the work it picks up is
  that requirement, what sits under it, and the genuine prerequisites it is waiting on —
  and nothing else. Belonging to the same parent is not a reason to be dragged into the
  run, so aiming at a small piece of work does not silently turn into a run over its
  parent's whole branch. The operator gets the scope they asked for, and can tell from
  the run what that scope is before it starts.
