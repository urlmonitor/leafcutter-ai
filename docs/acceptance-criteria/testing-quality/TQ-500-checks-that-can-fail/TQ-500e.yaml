id: TQ-500e
components:
  - testing_quality
  - ac_store
title: "The evidence stays with the work, so a later reader need not take it on faith"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Anyone citing a pass later can see what that test was shown to catch.

  What was demonstrated — and what was deliberately broken to demonstrate it —
  is recorded alongside the work in plain language, so a reader months later can
  tell real evidence from a formality. The harm this closes is a green result
  being quoted as proof a rule holds, with no way for anyone to check whether
  that test could ever have said otherwise.
