readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" that keeps the tools' package in a sub-folder of its own
    (a git submodule, or an ordinary tracked folder), so that shop's own
    "scripts" folder holds no install build of the tools,
  When a workspace for the work "alpha" is requested,
  Then the package's submodule is fetched into the new workspace when it is a
    submodule,
  And the workspace is built by the package's own install build at its real
    location inside the workspace,
  And the request is answered ready,
  And a build entry point that shop itself keeps in its own "scripts" folder is
    not mistaken for the package's,
  And the package's own development layout, where the project IS the package, is
    still built by its own top-level install build exactly as before.
