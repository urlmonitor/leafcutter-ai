id: BO-3500c-2
components:
  - build_orchestration
  - testing_quality
title: "The proof is chosen by the kind of artifact, and the weakest kind's proof is never borrowed by a stronger one"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given members whose artifacts are of different kinds — a written page, a diagram, a
    screen, a prompt and a configuration setting,
  When each member's proof is established,
  Then the proof applied to a member is the one defined for that member's kind of
    artifact,
  And a member of one kind is never finished on the strength of the proof defined for a
    different kind.

  Given the proof defined for a written page, which is the least demanding of the
    defined proofs,
  When it is applied to a member whose artifact is a screen, a prompt or a
    configuration setting,
  Then it is rejected as insufficient for that member and the member is not finished,
  And the rejection names the kind and the proof that kind requires — so an
    implementer reads which stronger check is owed rather than that something failed.

  Given a member and the kinds of artifact this project's requirements already declare
    they change,
  When the kind of that member's artifact is determined,
  Then it is determined from that existing declared vocabulary, extended by the single
    value this project lacks and needs — a diagram,
  And no second, parallel vocabulary of artifact kinds is introduced for the purpose of
    choosing a proof,
  And a test is not one of the kinds — the obligation to test a code deliverable travels
    with that deliverable and is never a deliverable of its own.

  Given a member whose artifact is of a kind whose proof runs or renders something, and
    a requirement that states its own proof is the reading kind,
  When the class of proof for that member is determined,
  Then the class is derived from where the deliverable sits and which of this project's
    registries claims it, and the requirement's own statement of its class is not
    honoured,
  And the run reports the declared class as a defective declaration rather than adopting
    it — so a stronger proof cannot be escaped by typing a weaker one.

  Given every kind of artifact this project's requirements can ask for,
  When the defined proofs are enumerated,
  Then each kind has a proof defined for it, or is refused up front for having none,
  And no kind's proof is "the artifact exists", except where existence together with
    the further checks defined for that kind is the whole of what that kind can be
    held to.
