roadmap_phase: phase_1
criteria: |
  Given the canonical phase ordering array `phaseOrder` in
    templates/workflows-js/build-ticket.js, which currently lists
    `user-surface-smoker` (priority 11.5) immediately before `commit` (priority 12)
  When a ticket's `agents:` map includes `live-surface-tester: needed`
  Then `live-surface-tester` is a member of `phaseOrder`
    And it is positioned after `user-surface-smoker` and before `commit`
    (priority 11.8), so the phase sort dispatches it once the smoker has run and
    before the commit phase begins.
