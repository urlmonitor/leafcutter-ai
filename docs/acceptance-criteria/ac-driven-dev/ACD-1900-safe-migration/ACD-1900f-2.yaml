title: "The build warns or safely refuses on schema_version skew"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_3_migration
criteria: |
  Given a store whose schema_version is outside the range the installed package
    supports,
  When build.py runs,
  Then it emits a schema_version-skew warning naming the store version and the
    package's supported range for a tolerable skew,
  And it safely refuses (non-zero exit with a clear message) for an incompatible skew
    rather than proceeding.
depends_on:
  - ACD-1900f
doc_links:
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: ACD-1900a-2
  contract: "The schema_version field on each record and the package's supported schema_version range so build.py can compare and detect skew."
it_requirements:
  - "Canonical source: scripts/build.py / scripts/build_phases.py plus the package's declared supported schema_version range. For a tolerable skew, build.py MUST emit a warning naming the store version and the package's supported range; for an incompatible skew it MUST safely refuse (non-zero exit with a clear message) rather than proceeding."
  - "The tolerable-vs-incompatible boundary must be data-driven from the declared supported range, not a hard-coded version literal scattered across call sites."
  - "Test must EXECUTE build.py against a tolerable-skew store (expect warning + success) and an incompatible-skew store (expect non-zero exit + clear message) -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/subprocess I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_tolerable_skew_emits_warning_names_versions
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "A tolerable schema_version skew causes build.py to emit a warning naming the store version and the supported range, and the build proceeds."
  - name: test_incompatible_skew_refuses_nonzero_exit
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "An incompatible schema_version skew causes build.py to refuse with a non-zero exit and a clear message rather than proceeding."
