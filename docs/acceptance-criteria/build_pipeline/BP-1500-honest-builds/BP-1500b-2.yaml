id: BP-1500b-2
title: "Orphans are derived from the package's current sources, never from a maintained list of known-stale names"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a contributor deletes one template from the package, for a capability
    that whoever built the sweep has never heard of, and changes nothing else in
    that commit,
  And a project's installed tree still carries the artifact that template used
    to produce,
  When that project's install is rebuilt,
  Then the artifact is identified as an orphan and removed, with no edit to any
    list, catalogue or allowlist of known-stale names anywhere in the package --
    the deletion of the template is the only change required to make the sweep
    catch it,
  And the set the installed tree is compared against is recomputed from the
    package's current sources during that same rebuild, so it is exactly one
    smaller than it was on the previous rebuild,
  And a record left over from an earlier build that still maps a now-deleted
    source to an installed path is read as evidence that the installed path is
    an orphan, and never as a reason to keep it,
  And an installed tree in which every artifact the package declares is present
    and correct is still reported as carrying residue when it additionally holds
    one artifact the package declares nothing about -- so a tree that passes
    every completeness check may still fail this sweep, and passing one gives no
    information about the other.
depends_on:
  - BP-1500b
  - BP-1500b-1
