title: "A gate that reports success but leaves no entry in the work item's record is adjudicated failed, not passed"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a work item that requests two gates,
    And the drive runs both, and both report success,
    And afterwards the first gate's entry is present in the work item's own record
      while the second gate's entry is absent,
  When the drive reads the record back to decide what happened,
  Then the second gate is adjudicated as failed,
    And the failure states that the gate reported success while leaving no entry,
      and names the gate,
    And the work item is not treated as having that gate complete,
    And the first gate, whose entry is present, is unaffected,
    And the adjudication is made from the record that was read back, never from the
      gate's own report of itself,
  So a gate's word for its own success is never sufficient, and a gate that left no
    trace fails rather than passing quietly.
