assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Acceptance is a before/after equality of the DEPLOYED + shimmed feedback script set in a clean target: the set of feedback files installed (and the shims created for them) after the relocation must equal the set the pre-relocation build produced for the same target. No feedback script may be missing, renamed, or left unshimmed."
  - "Validate against a CONSUMER install, not only the self-build: run build.py --target-dir into a clean external project (no prior leafcutter deployment) and assert the deployed+shimmed feedback set there. A change that fixes the self-build but regresses a consumer install is a regression (the SHARED-CONTRACT validation requirement that BP-1200a-1 also carries)."
  - "Preserve the ADR-001/ADR-013 deployment boundary: the deployed feedback output remains a build output at the consumer's feedback scripts location; the shimming behavior (install_shims) for feedback must be unchanged by the source relocation — only the build's READ source moved to templates/scripts/feedback/."
  - "The deploy+shim step must consume the resolved feedback set produced by BP-1000a-5 (sourced from the tracked mirror); it must not re-derive the set from the gitignored scripts/feedback/ working copy."
delivers_to: null
expects_from:
  ac_id: BP-1000a-5
  contract: "The build reads feedback deployable-script source from tracked templates/scripts/feedback/ (resolved feedback set, repo-root-relative POSIX paths); this AC asserts the downstream deploy+shim of that source to a clean external target is behaviorally unchanged for consumers (before/after deployed-set equality)."
