    ac_id: TQ-100a-2-i
    contract: >-
      Fixtures that supply their identity through the inherited process
      environment and write nothing to the host's shared configuration — the
      state under which the session-scoped guard reports nothing. Until this
      lands, that guard is red on this repository's own suite, which is the point.
  - agent: python-coder
    ac_id: TQ-100a-2-ii
    contract: >-
      The identity-supply mechanism whose acceptable shapes TQ-100a-2-ii bounds:
      environment-supplied is accepted, worktree-scoped configuration writing is
      refused.
expects_from: null
test_spec:
  - name: test_tq100a_2_host_identity_is_unchanged_after_a_linked_worktree_fixture_runs
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: >-
      git init a throwaway host repo, set its identity, then drive the fixture's
      own sandbox-build-and-commit path against it as a subprocess
    description: >-
      Build a real host repository with a recorded identity, let the fixture add
      a linked worktree of it and commit inside, then read the host's shared
      configuration back. Both identity keys must hold their original values.
      Must use a real linked worktree of a real repository — a bare temporary
      directory does not share configuration and so cannot exhibit the defect,
      which is exactly how a synthetic fixture would pass on the broken code.
  - name: test_tq100a_2_sandbox_commits_carry_the_fixture_identity_as_author_and_committer
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Read back both the author and the committer of a commit the sandbox made.
      Asserting the author alone is the two-variable failure described in the
      implementation notes — it stays green while the committer silently falls
      back to configuration.
  - name: test_tq100a_2_commits_succeed_with_no_configured_identity_anywhere
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      The fresh-checkout shape. Run with the host repository carrying no identity
      keys and with the environment pointed at an empty home directory so no
      global configuration is reachable. The sandbox's commits must still succeed
      and carry the intended author and committer.
  - name: test_tq100a_2_worktree_scoped_configuration_being_enabled_changes_nothing
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      Enable worktree-scoped configuration on the host and repeat the first
      assertion; the host identity is still unchanged. NAMED MUTATION (this
      descriptor asserts an absence of change) - restore one `git config
      user.email` call inside the sandbox; under that injection the host identity
      changes and THIS TEST MUST GO RED even with the extension enabled, which is
      the measured fact that rules the extension out as a mitigation. Revert and
      it returns to green.
test_rationale: |
  Four descriptors because the defect has four independent ways to look fixed and
  not be. The first is the only one that can observe the harm at all, and only
  because it uses a real linked worktree of a real repository — the harm is
  invisible to any sandbox that does not share configuration, which is why eleven
  days of green runs said nothing. The second separates author from committer,
  the split that passes on a developer machine and aborts in CI. The third
  removes every ambient identity, reproducing the fresh-checkout condition the
  second descriptor's failure mode hides behind. The fourth is the measured
  refutation of the plausible wrong conclusion — that the already-enabled
  worktree-config extension makes this safe — and carries a named injection
  because it asserts that nothing changed.
