criteria: |
  Every record is reconciled, not just the ones in today's change.

  The comparison covers the whole of both records, so a disagreement that has been
  sitting there for months is found without anyone having to touch it. The
  conflicts already present when this starts are worked through rather than
  written off, and the count of outstanding ones is visible and goes down.
