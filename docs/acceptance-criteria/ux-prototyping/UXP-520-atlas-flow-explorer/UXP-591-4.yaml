id: UXP-591-4
title: "Opening a step's or branch's drawer puts its step address in the address bar without adding a Back entry"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given the tab has one history entry showing leafcutter/deliver-a-feature with no drawer open,
    either at /flows/leafcutter/deliver-a-feature or at the bare /flows,
  When the person clicks the 'Plan' step,
  Then the 'Plan' drawer opens,
  And the address bar becomes /flows/leafcutter/deliver-a-feature?step=plan in both cases, the
    bare /flows being replaced by the default flow's canonical address,
  And the tab still has one history entry, because the current entry was replaced rather than a
    new one added,
  And opening the address now in the address bar in a new tab shows the same flow with the same
    'Plan' drawer open.
