id: BO-3100d-2
title: "A decision replaced on a false premise stays readable, marked superseded, and linked both ways"
component: build-orchestration
components:
  - documentation_system
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a recorded decision that was argued from a premise since shown to be false,
    And a newer decision that replaces it,
  When either record is read,
  Then the older record is still present and readable, is marked as superseded, and names
    the record that replaced it,
    And the newer record names the record it replaced and states which premise was found to
    be false.

  Given both records,
  When the pointer on each is followed,
  Then it resolves to a record that exists.

  Given the older record,
  When it is read by someone who does not know the history,
  Then both what was believed and what replaced it are visible from that record alone,
    without needing to know that a newer one exists.
depends_on:
  - BO-3100d
  - BO-3100d-1
