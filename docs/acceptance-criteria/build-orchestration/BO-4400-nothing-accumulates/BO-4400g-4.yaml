notes: |
  User request item (3). The five flows are the user's list. BO-4400a-1 covers the
  single-ticket build, epic build, quick fix, requirements authoring, fast lane and backlog
  build with the same merged timing (amended 2026-11-16); this record adds ship and finalize,
  and makes the request carry the work's name.

  TIMING, RESOLVED (user decision D2, 2026-11-16): a flow clears its workspace after its pull
  request has merged, using the landed rule of BO-4400g-2 for its one workspace, so unmerged or
  unsent work is kept with a reason and never removed. A flow that ends before its pull
  request is merged clears nothing and leaves the workspace to the landed-work pass. Scenario 1
  covers merged -> cleared; scenario 2 covers PR open at flow end -> kept; scenario 3 covers
  the landed-work pass clearing it afterwards. BO-4400a-1's PR-open clause is amended to match.

  NOTHING TO DELIVER (user decision Q2, 2026-11-16): a flow that ends with no commit of its
  own and nothing unsent clears its own workspace at once; the seven-day idle threshold of
  BO-4400g-2, like the fourteen-day one for pushed but unmerged work (BO-4400g-2-v, user
  decision 2026-11-16), applies only to the unattended pass. BO-4400a-1-i states and proves this for the
  fast lane, the epic build and requirements authoring, so no scenario is added here; the
  TIMING it_requirement carries the one-line rule.

  WHO CLEARS, RESOLVED (user decision D1, 2026-11-16): every flow's own end-of-run clearing
  request is the exact name-based clearing command, sent through shell-runner (ADR-070), not
  through worktree-agent; that command is itself the caller's authorization for exactly that
  one workspace. Finalize is outside this decision: its step-7 removal stays exactly as
  BO-4300g-3 defines it (worktree-agent with removal_authorization), keeping BO-4300g-2's
  "exactly one dispatch goes to a removal-capable agent -- the step-7 workspace removal".
  Confirmed by the user (Q1, 2026-11-16); scenario 1's last clause now says so.

  SHIP (user decision D4, 2026-11-16): ship's prose change is its own llm-expert record,
  BO-4400g-4-ii.

  OUT OF SCOPE: whether a workflow agent is authorized to perform finalize's removal, and how
  finalize step 7 names that authorization, is owned by the BO-4300g family (BO-4300g-3 for
  step 7). This record only requires that the request names the work and goes through the
  door.
