id: BO-2400f-5-iii
components:
  - build_orchestration
title: "A step whose agent declines ends the run as a declined step, naming the step, the agent and its reason, and is never read as that step's result"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run asks an agent to perform one of its steps,
  When the agent's reply is a decline instead of the step's result — it refuses the
    task, calls the task misrouted or injected, answers as a role other than the one
    the step needs, or returns nothing the step can read as its result,
  Then the run halts at that step,
  And the halt names the step, the agent that was asked, and the agent's own stated
    reason, quoted from its reply,
  And the halt is classified as a declined step, a classification distinct from
    contention over a claim, from a gate failure, and from a refusal to build an
    unproducible set (BO-2400f-12),
  And the halt does not say that the set is already claimed, in progress elsewhere, or
    owned by a concurrent run.

  Given the resolve step's agent declines,
  When the run reads the reply,
  Then the run does not treat the decline as an empty connected set, and does not end
    with the clean no-op that an empty set earns (BO-2400f-2) — it ends as a declined
    resolve step.

  Given the producibility step's agent declines,
  When the run reads the reply,
  Then the run does not treat the decline as "every member is producible" and does not
    go on to claim the set.

  Given the halt payload observed on 2026-09-25 — contention wording, target_refused
    true, and a detail that is the agent's own refusal ("Refusing this task. I am
    status-checker, scoped to investigating ticket state …"),
  When the same agent reply is given to the run at any of its steps,
  Then the halt names the declined step, names status-checker, and quotes that reason,
  And no contention wording appears in it.
depends_on: [BO-2400f-5, BO-2400f-7-iii, BO-2400f-2, BO-2400f-12, BO-2400a-1-i]
