title: "Build output respects your project's folder layout"
component: build-pipeline
level: L1
status: active
criteria: |
  The build system puts files where your project says they belong — not where it assumes.

  When a project configures custom paths for tickets, docs, or other
  directories, the build system honours those paths instead of creating
  default folders at the workspace root. Self-hosting and consumer projects
  alike get clean output without leftover scaffold directories.
