it_requirements:
  - "Target: templates/scripts/commit_guardian/check_ac_parent_covered_by.py. VERIFIED 2026-08-14: it does NOT use the shared templates/scripts/commit_guardian/_resolve_root.py (which 27 other files in the family already import). It rolls a private _get_derive_parent_id() with its own graceful fail-open fallback at ~line 377. The fix is to consume GE-120b-2's shared facility and DELETE that private fallback — not to add a fourth resolution path beside it. A shared facility installed alongside a surviving private fallback changes nothing, because the private path still wins on failure."
  - "RECIPROCAL ORDERING CONTRACT with the ac-store tree. ACS-1200a — specifically ACS-1200a-2, which makes the check parked-aware — MUST land before, or in the same release as, this AC. This AC makes the check run reliably from every working copy; ACS-1200a changes WHICH RULE it enforces. Landing this one first makes the uncorrected rule fire more consistently and blocks every parked idea stub: a net regression in usable behaviour even though the fix itself is correct. ACS-1200a-2's delivers_to carries the matching half of this contract (its wording: must land before, or in the same release as, GE-120b). ACS-1200a is recorded in this AC's depends_on so the build sequencer can read it — it is a SCHEDULING dependency; the structural parent remains GE-120b."
  - "PREREQUISITE RECONCILIATION — ACD-1403 IS A LIVE LANDMINE. ACD-1403 (status: active, readiness: reviewed, level: null, work_status: null) asserts that check_ac_parent_covered_by.py 'was removed as part of ACD-1100' and requires that unit_tests/commit_guardian/test_check_ac_parent_covered_by.py be DELETED. All three premises are false as verified on 2026-08-14: the hook exists at templates/scripts/commit_guardian/check_ac_parent_covered_by.py, the test exists at unit_tests/commit_guardian/test_check_ac_parent_covered_by.py, and the hook is wired at .pre-commit-config.yaml:294 (it blocked a commit during this planning session). If ACD-1403 is built as written it deletes coverage this AC depends on. Reconcile or supersede ACD-1403 BEFORE scheduling this AC. Do not attempt to fix ACD-1403 from this tree — it belongs to the ac-driven-dev component."
  - "The verdict must be determined by staged content alone: no branch, path, environment variable, or value derived from the identity of the working copy may reach the result. The two runs must be byte-comparable on their violation list."
  - "Main-checkout behaviour unchanged: the same 6 violations, same names, same ordering (the GE-118a-1 backward-compatibility precedent)."
  - "ADR-001 deployed/template parity: edit templates/scripts/commit_guardian/ (canonical), then run 'python scripts/build.py --target-dir .' so scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ match; check_hook_parity enforces all four locations. The hook is invoked from the deployed layout — .pre-commit-config.yaml:294 runs '.leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/check_ac_parent_covered_by.py' — so a template-only fix is a literal no-op for this AC."
  - "Any shared module this check gains a dependency on must be present in deploy_map in scripts/build_phases.py, or the deployed hook raises ModuleNotFoundError and blocks every commit."
