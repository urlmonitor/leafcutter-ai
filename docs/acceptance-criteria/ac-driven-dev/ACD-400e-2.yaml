notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400e.

  THE THREE QUOTES WERE VERIFIED INDEPENDENTLY BEFORE THIS AC WAS WRITTEN, not inherited
  from the PO's summary. All three are verbatim. So is the code they contradict: the
  queue's answers were obtained by executing it over purpose-built temp stores, not by
  reading it. A mis-transcribed quote inherited into an L2 would be worse than the gap it
  was meant to close, so the check was run rather than assumed.

  THE FOURTH CLAUSE IS THE ANTI-VACUITY GUARANTEE ACD-400e'S NOTES DEMAND. Without it,
  this AC is satisfied by a check that finds no disagreement among three records that were
  never wrong — which is exactly what a dead check reports. Requiring that the same check,
  run against the records as they stand TODAY, reports a disagreement for each of the
  three makes the correction provable: something that genuinely contradicted the queue was
  genuinely corrected. It is the pattern of a red baseline, expressed inside the
  requirement rather than left to a test plan.

  THE FIFTH CLAUSE FORBIDS THE CHEAPEST WRONG FIX. Two things disagree; only one of them
  is wrong. An implementer who reads "make the record and the queue agree" can satisfy it
  by changing the queue — deleting the approval test, or dropping the urgency key — and
  every other sentence here would still hold. That would silently redirect every
  subsequent build, which is the precise hazard ACD-400c was raised to close. Requiring
  the offer to be unchanged for any store makes the record the thing that moves.

  THE SIXTH CLAUSE FENCES OFF THE LIFECYCLE FIELDS, per ACD-400e's notes. ACD-400a is
  work_status: in_progress after a documented correction from a false done, and nothing in
  this tree may touch it. Stated in the criteria rather than only in a note because a fence
  that only exists in prose is not one a test can hold.

  WHY THE REPAIR IS ONE AC AND NOT THREE. The same two errors run through all three
  records, and ACD-400a-1 carries both of them in one file. Splitting the repair per record
  would put two independent edits into ACD-400a-1 with no owner for their interaction;
  splitting it per error would put two edits into that same file from different ACs, with
  a guaranteed conflict for whichever lands second. That is the shotgun-surgery shape
  ACD-400e was created to avoid, and it would be reintroduced one level down.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
