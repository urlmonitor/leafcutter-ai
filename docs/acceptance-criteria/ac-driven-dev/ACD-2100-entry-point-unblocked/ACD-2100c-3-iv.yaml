notes: |
  Authored by /quick-fix. Root cause: Stage 0 triage is re-dispatched unconditionally on every invocation, including a resume, and its route decision is recomputed against the CURRENT store, which on a resume includes the run's own output. Nothing carries the original run's route across the pause: pauseAtGate() persists only the gate's context snapshot, which holds no route. So a resume can route away from the gate it is resuming. Fix: when the run is a resume of a paused gate (args.resume_answer present and the durable pause record names a gate other than covered-route-gate), the run must reach that paused gate on the route the paused run was on, not on a freshly recomputed one: record the effective route in the pause context when pausing, and on such a resume take the route from the paused record instead of re-classifying (in particular never open covered-route-gate for it). A fresh run, and a resume of covered-route-gate itself, keep today's triage behaviour. Note plan-feature.js is over its file-size limit: the check-file-size ratchet requires removing about twice the lines a change adds..

  PLACEMENT: ACD-2100c is at its L2 cap of 5, and this is a technical constraint on the
  already-specified ACD-2100c-3 behaviour (a paused run picks up at the decision it was
  waiting on with the person's answer applied) -- re-triage must not divert the resume
  into a different decision. Hence an L3 Roman-suffix child next to ACD-2100c-3-iii (the
  same class of diversion via the orphan scan), not a new L2 and not a
  child_limit_override.

  PARENT STATE: ACD-2100c-3 carries work_status: done. That claim did not hold on the
  live run named in the criteria; this todo child is the open constraint against it.
