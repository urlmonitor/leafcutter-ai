criteria: |
  Approval questions reach a person or wait for one -- nothing else answers them.

  When the route asks whether to go ahead, change something or stop, that
  question goes to you. If you cannot be reached the run waits and can be picked
  up later exactly where it left off. Nothing that was not your answer is ever
  allowed to throw away work you have not seen.
