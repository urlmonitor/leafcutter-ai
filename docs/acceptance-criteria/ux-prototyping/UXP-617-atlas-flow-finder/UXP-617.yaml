title: "A person can find any flow or step by what it does, who runs it, or what it uses, and share the search"
component: ux-prototyping
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Find the right flow or step in seconds, then share exactly what you found.

  As a person looking at the Atlas, I want the Flows page to open on a finder
  rather than on one drawn flow, so that I can search every flow by its name,
  its step text, the fields it uses or produces, the criteria it carries, and
  the entities and screens it touches, then narrow the list with counted
  filters (product; who runs it — code, an AI agent, a person, or Jev; kind;
  real or mock; level; field used or produced; entity; screen; and steps whose
  inputs or outputs are not defined yet). Results are grouped by flow and open
  straight at the matching step, and the search travels in the page address,
  so a link reproduces it for anyone I send it to.

  While I work, the page stays predictable and easy to use: changing a filter
  never swaps out the flow I am looking at, every step card shows who runs it,
  a step opens and closes from the keyboard, the close button says what it
  closes, every flow page has its own tab title, and a criterion chip opens
  that criterion in the Atlas.
