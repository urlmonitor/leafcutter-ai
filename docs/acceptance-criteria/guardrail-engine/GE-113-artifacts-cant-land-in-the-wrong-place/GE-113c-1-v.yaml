it_requirements:
  - "The .security-allowlist must be resolved from the actual checkout root (the worktree root) via the SAME shared _resolve_root helper mandated by GE-113c-1 / GE-113c-1-iv (`git rev-parse --show-toplevel` with a safe fallback) — NOT from the resolved .leafcutter symlink target (the workspace parent). This is the exact symptom documented in CLAUDE.md ('.security-allowlist resolves via the symlink target, not the worktree root'; worktree-local suppressions silently ignored; observed EPIC-AcPatternEnforcementIsMechanically 2026-06-18)."
  - "Behavioral verification against a REAL worktree: create a suppression in the worktree's OWN .security-allowlist for a staged finding that is CURRENTLY ignored (because the hook reads only the workspace-root copy), and assert the finding becomes honored (not reported) after the fix. Do not rely on a synthetic fixture — this repo has a documented history of synthetic fixtures hiding worktree/path bugs (CLAUDE.md real-artifact spot-check rule)."
  - "Glob-pattern suppression support must be preserved: an ENTROPY_HIGH:<path>:* glob entry suppresses all findings for that path, and any place that must be kept consistent when adding a suppression follows the ENTROPY_HIGH:<path>:* dual-update rule documented in CLAUDE.md — the fix must not change which entry forms are recognized, only WHERE the allowlist is read from."
  - "No regression to suppression behavior in the main/source checkout: which findings get suppressed for a given .security-allowlist content must be unchanged when the guard runs from the main repository checkout; both layouts read the allowlist from the correct checkout root through the one shared mechanism."
  - "Must handle git-unavailable gracefully per the project error handling policy: the git subprocess call is wrapped (no bare except, Ruff E722/BLE001/TRY), warns, and falls back to a safe deterministic resolution via the shared _resolve_root helper — the fallback lives once in the helper, not duplicated here."
  - "Deployed/template parity (ADR-001): the canonical fix lives under templates/scripts/commit_guardian/check_secrets.py (and templates/skills/security-scanner/scripts/scan_secrets.py if the allowlist read lives there) and is round-tripped to the scripts/ copy via build.py — never edit only one side."
delivers_to: null
