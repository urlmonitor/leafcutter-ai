title: "How-to update: the green gate cannot be fooled by masked failures, and a test backfill is proven by a mutation check"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the fast-lane how-to after BO-2400a-4-ii, BO-2400a-4-iii and BO-2400a-3-ix to
    BO-2400a-3-xiv are built,
  When a reader looks up why a green gate failed on tests that pass in an ordinary
    local run,
  Then the guide explains that the green gate runs the batch's tests with the
    enforcement plugin's downgrading switched off, that only passed counts as passing,
    and how to reproduce the gate's run locally with the same setting.

  Given the same how-to,
  When a reader wants to add tests for a criterion whose code already exists,
  Then the guide explains that the lane recognises such a test backfill from its
    green-at-baseline tests and proves them with a mutation check, not with red-first,
  And it lists every mutation halt reason (tests_survive_mutation,
    no_existing_implementation_to_mutate, mutation_inconclusive,
    mutation_restore_unconfirmed), each with what it means and what the reader does
    next,
  And it states that a batch of only proven backfills skips the coder, while a mixed
    batch mutation-proves its backfill criteria individually,
  And the Step 3 failure guidance no longer tells the reader to confirm by hand that a
    criterion is already implemented when its new tests are green at baseline.
