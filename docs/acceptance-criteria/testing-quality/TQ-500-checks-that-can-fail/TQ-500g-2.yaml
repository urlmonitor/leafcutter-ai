title: "The database test writer runs what it writes, including against the code before the fix, and says so only when it did"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a project whose configured test database is reachable, and a bug fix
    to the stored procedure fn_refresh_due that makes it return false when
    retry_due is not set,
  When the database test writer writes the regression test for that fix and
    hands on,
  Then it has run the test against fn_refresh_due as it was before the fix,
      and its report shows the test failing there, quoting the run's output,
    And it has run the test against the fixed fn_refresh_due, and its report
      shows the test passing there, quoting the run's output,
    And each of its answers to the three questions is marked observed only
      when a quoted run backs it, and reasoned otherwise,
    And the wrong versions it names to run later are handed on in the form
      the wrong-version runs take up, not left only in its prose,
    And when the project has no test database configured, it reports both runs
      as not run for want of configuration, names the setting
      testing_context.db_connection_test, marks every answer reasoned, and
      never reports the test as having caught anything.
