criteria: |
  Given a ticket that produces code (it has a coding phase agent in its agents map),
    and its Test Requirements section is empty or absent,
  When the ticket is authored,
  Then authoring is blocked with a reason that names the ticket and states the Test
    Requirements section must be populated for a code ticket,
  And the ticket is not admitted for dispatch in that state.
