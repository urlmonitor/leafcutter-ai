notes: |
  2026-08-13 amendment record. This file was `readiness: approved`; it was amended
  rather than superseded because its behavioural intent (the key stays out of the
  agents map unless both toggles are on) is unchanged. The user made this call to
  resolve a live contradiction between this AC and BP-014.

  The requested-versus-unrequested distinction added here is the load-bearing detail
  for whoever implements BO-2100d-5: "skipped" means "you asked and it did not
  happen", not "it did not happen".
