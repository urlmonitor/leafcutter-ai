id: ACD-400c-3
components:
  - ac_driven_dev
title: "The approval requirement holds whatever question is asked of the queue, including an inventory of everything"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store holds four active pieces of work whose recorded approval is draft:
    one leaf-level and still to do, one leaf-level and already finished, one
    composite and still to do, and one leaf-level, still to do and waiting on an
    unfinished prerequisite,
  And the store also holds one leaf-level, already-finished piece whose recorded
    approval is approved,
  When the queue is asked the broadest question it accepts — every level of work, in
    every state of completion, not only the leaf-level work still to do,
  Then the approved piece is the only one returned,
  And each of the four draft pieces is withheld, appearing in neither list the queue
    produces,
  And the same holds for every narrower question the queue accepts: widening the
    question never widens the approval requirement, so no question exists that will
    show a reader work the queue has withheld for want of approval.
depends_on: [ACD-400c, ACD-400c-1]
