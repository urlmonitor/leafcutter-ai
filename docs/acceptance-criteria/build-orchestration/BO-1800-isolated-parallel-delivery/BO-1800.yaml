criteria: |
  Build many features at the same time, safely -- like a real team, without an artificial limit.

  Your agents can work on many features at once and the repository never gets
  corrupted, because each parallel effort runs in its own separate copy instead
  of sharing one. Your main branch can only ever change through the proper
  reviewed-and-checked process -- nothing can slip in outside that gate, no
  matter how an agent misbehaves. And you are never held back by an arbitrary
  cap on how much can run at once: the only ceiling is your machine. The old,
  fragile habit of writing straight into one shared main is gone for good.
