id: DK-300d-1
title: "New runs checkpoint versioned interpretation context before intent"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a new run with or without an explicit output contract and a current permitted entity index,
  When intake prepares the first intent assessment,
  Then exactly one recognition pass completes and its versioned interpretation context is checkpointed before classification,
  And the classifier receives the unchanged goal, compact permitted meanings, unresolved references and separately typed caller claims,
  And registered capability IDs remain a separate configuration channel,
  And recognized, no_matches, partial, unavailable and disabled describe the actual pass outcome,
  And an explicit output contract still determines routing,
  And no repository-body evidence is placed in the initial meaning channel.
depends_on: [DK-300d]
