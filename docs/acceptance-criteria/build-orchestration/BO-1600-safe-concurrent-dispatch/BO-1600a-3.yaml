created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600a.yaml"
criteria: |
  Given many ticket-supervisors commit into one shared worktree with their commit
    phases overlapping repeatedly under the git write serialization
  When every commit in the run has completed
  Then the repository's object store contains no zero-byte (truncated) loose object
  And every loose object written during the run has a content hash that matches its
    object name (no half-written object)
  And the index is readable and consistent (a fresh status/read of the worktree
    succeeds without an index-corruption error)
  And running a git object-integrity check over the repository reports no corruption
depends_on:
  - BO-1600a
  - BO-1600a-1
