id: BO-2500c-1-i
components:
  - build_orchestration
  - testing_quality
title: "A hand-typed fixture that could reproduce the bug's own blind spot is flagged"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test fixture is a hand-typed literal for data a tool serializes, and its
    shape differs from the real serialized form in a way that could mask the defect
    (for example an indented block list where the real serializer emits dashes at
    column zero),
  When the fixture policy check inspects the test,
  Then the hand-typed fixture is rejected or flagged
  And the check names the real-producer form the fixture should have used instead.
depends_on: [BO-2500c-1]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-007-test-fixture-convention.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    fixture_quality_lint:
      type: object
      description: "A commit_guardian check that inspects test files and flags/rejects a hand-typed literal fixture standing in for serialized data when its shape could mask a defect (e.g. indented block list vs column-0 dashes), naming the real-producer form it should have used."
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Detection must be driven by a shape-difference heuristic between the hand-typed literal and the real serialized form (not a hard-coded per-test allow/deny list), so new cases are caught automatically."
    - "On a flag, the message must name the real-producer form the fixture should have used (e.g. yaml.safe_dump output), per the error handling policy."
    - "The check must minimize false positives on fixtures that are already real-producer output or on non-serialized data; when uncertain it must flag for review rather than silently pass."
    - "The lint must be idempotent for a given test tree."
delivers_to: null
expects_from:
  ac_id: BO-2500c-1
  contract: "The real-producer fixture convention this lint enforces (reject hand-typed literals that could mask a serialized-form defect)."
test_spec:
  - name: test_indented_blocklist_fixture_is_flagged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A hand-typed indented block-list fixture standing in for a column-0-dash serialized form is flagged/rejected."
  - name: test_flag_names_real_producer_form
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "The flag message names the real-producer form (e.g. yaml.safe_dump) the fixture should have used."
  - name: test_real_producer_fixture_is_not_flagged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A fixture already generated by the real serializer is not flagged."
