notes: |
  Measured on the 2026-09-28 BO-3500 lane run, the first run to complete the full arc.
  Every AC in that batch declares 5-10 test_spec descriptors; every generated test file
  contained exactly ONE test, the criterion happy path. Direct counts at the time:
  BO-3500a-1 declared 5 and got 1, BO-3500b-1 declared 6 and got 1, BO-3500c-1 declared
  10 and got 1.

  THE CAUSE IS THE REQUEST, NOT THE PERFORMER. templates/workflows-js/fast-lane-ship.js
  asked, verbatim, for "a minimal failing test that asserts the AC behavior" per AC, and
  never mentioned test_spec or angles at all. The performer did exactly what it was
  asked. test-writer's own template has carried the full taught angle vocabulary since
  BP-1100g-1; the lane simply never invoked it.

  WHY IT PRODUCED THE SECOND FINDING TOO. The same run's review also refused four new
  modules whose only callers were their own unit tests. That is the missing reachability
  angle stated in code: docs/testing/test-angles.md's thesis is that the coder's contract
  is literally "make the red baseline green", so the cheapest green is exactly the shape
  of the test written. One criterion-angle test per AC therefore BUYS a phantom
  implementation -- it is not merely thin coverage. The same document records the same
  defect shape in PR #422, where the BO-2400f-7..10 lifecycle functions shipped
  unit-tested but unreachable.

  WHAT THIS RECORD DELIBERATELY DOES NOT DO. It does not touch the red-baseline gate's
  one-red rule. BO-2400a-3-v loosened that rule on purpose, because requiring every new
  test to be red made the lane unusable on any partially-implemented criterion, and
  re-tightening it here would reintroduce that. Redness of what was written and
  completeness of what was written are different properties with different remedies.

  HONEST LIMIT. This is a prompt-compliance fix: it changes what is asked for, and a
  performer can still under-deliver. The enforcing version -- a gate that refuses when a
  declared descriptor has no corresponding test -- is deterministic where this is
  advisory, and is the natural successor. It is not folded in here because it would
  refuse on the large existing population of partially-covered criteria described above,
  and that blast radius deserves its own record rather than riding in on this one.
