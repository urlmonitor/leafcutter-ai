  ac_id: BP-1500b-3
  contract: "The per-run scope record {examined_root, walked_locations, installed_artifacts_inspected, current_sources_compared}. This AC specifies the record's shape and reporting channel on the single input where installed_artifacts_inspected is zero -- the case BP-1500b-3's 'both counts greater than zero' clause cannot cover, and the case today's build occupies."
