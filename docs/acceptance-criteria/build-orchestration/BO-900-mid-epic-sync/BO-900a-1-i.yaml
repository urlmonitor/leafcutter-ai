title: "Unreachable remote is treated as zero divergence (safe default)"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given an epic drive is running in a worktree
    and the remote origin is unreachable (network timeout or DNS failure),
  When the build-epic workflow attempts to compute the divergence count
    between the worktree HEAD and origin/main,
  Then the divergence computation fails gracefully,
  And the workflow treats the divergence as zero (no checkpoint triggered),
  And the workflow logs a warning:
    "Could not reach origin/main to check divergence -- skipping sync checkpoint",
  And the next batch is dispatched without interruption.
