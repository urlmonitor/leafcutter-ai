criteria: |
  Given the main tree HAS a pre-commit config, but the worktree's chain cannot
    fire (config unresolved, shared hook missing, or canary produces no token),
  When the guard runs,
  Then it does NOT take the no-op path; it fails closed, exits non-zero, and its
    error names the worktree whose chain cannot fire.
  And this is the production silent-skip bug the guard exists to catch.
