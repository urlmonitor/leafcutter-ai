criteria: |
  Given a contributor's merge was blocked by a source-to-shipped parity failure
  When the contributor opens the how-to guide for this feature
  Then the guide explains how to read the failure output to identify which
    script drifted and how its shipped copy differs from its tested source
  And it gives the step-by-step procedure for bringing the shipped template copy
    back into byte-for-byte agreement with its canonical source
  And it states how to re-run the parity check to confirm the merge is unblocked
