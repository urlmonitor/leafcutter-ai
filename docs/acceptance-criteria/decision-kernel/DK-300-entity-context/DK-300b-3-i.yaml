estimated_complexity: M
it_requirements:
  - "Deadline checks use a controllable monotonic clock and stop before beginning each new work unit; tests must not depend on wall-clock sleeps."
  - "scan_complete describes examination of admitted text and is independent from omitted-card counts; deadline exhaustion never rewrites original_goal."
test_required: true
test_spec:
  - name: "test_expired_deadline_stops_new_lookups_and_marks_incomplete_scan"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "failure"
    description: "tests/kernel/entity_context/test_recognition.py::test_expired_deadline_stops_new_lookups_and_marks_incomplete_scan: Inject clock advancement during scan and during lookup, assert no later lookup starts, partial/deadline limitation, correct scan_complete and verbatim full goal."
    must_catch: ["Continuing lookups after the configured deadline.","Reporting no_matches after scanning only a goal prefix."]
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
