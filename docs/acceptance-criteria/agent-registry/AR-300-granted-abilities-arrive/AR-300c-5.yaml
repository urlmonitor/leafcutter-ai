it_requirements:
  - "DECLARATION KEY (decided by IT PO, 2026-10-09): the frontmatter key is `spawn_allowlist`, a YAML list of agent ids, placed in the same frontmatter block as `tools:` (the abilities counterpart is `skills:`). Rationale: it is already documented in docs/reference/agent-template-frontmatter.md, already present in four templates (frontend-coder, onboard, ac-triage, onboard-config-section), and identical to the registry field it now drives, so the derived copy and the declaration share one field name. Test-writer, coder and documentation use this one spelling; no alias is accepted."
  - "THE MACRO IS STORED VERBATIM: the 'every ticket-phase agent' entry is the literal list item `__ticket_phase_agents__` in the frontmatter list, never pre-expanded. It is resolved on every compile against the agents whose registry `is_ticket_phase` is true (that flag stays authored in config/agent_registry.json; this criterion does not move it). Resolution dedupes, so an explicit entry also covered by the macro is named once."
  - "ONE HEADER-READING PATH: the `spawn_allowlist` declaration must be read by the same frontmatter parse that reads `skills:` and `tools:` for AR-300c-1, not by a second parser. The negative clause depends on it: the compiled sub-agent section is computed from the frontmatter declaration ONLY. A delivery that falls back to, merges with, or cross-checks against the registry `spawn_allowlist` field passes the positive clauses and fails 'editing only the registry changes nothing'."
  - "The existing builder build_per_agent_spawn_table (scripts/injection_builders.py) reads the REGISTRY spawn_allowlist, so calling it as-is violates the negative clause. Either feed it the declared list through a net-neutral-or-shorter change, or replace it in a new module and delete the dead builder and its re-export -- grepping every importer (tests included) in the same change. scripts/injection_builders.py is over the 400-content-line limit (measured by templates/scripts/commit_guardian/_file_size_ratchet.py count_content_lines) and may not grow."
  - "File-size ratchet: new logic lands in NEW modules (a sibling of scripts/agent_skills_declaration.py is the natural home). scripts/template_compiler.py (315 content lines) may take only the wiring; scripts/build_main_helpers.py has 11 lines of headroom and must not be the home of new logic."
  - "Both halves -- `tools:` and `spawn_allowlist:` -- must be returned from one parse of one block, so AR-200b-3's comparison consumes this parse rather than re-reading the file. `tools:` is a bare comma-separated string that may carry a trailing YAML comment (business-analyst); the parse must be exercised against on-disk templates, not hand-typed fixtures."
  - "Evidence is the COMPILED prompt in every platform root under the declared output root (<output_root>/agents/ and <output_root>/gemini/agents/), never the registry or the template. Derive populations; 25 holders / 24 ticket-phase agents are 2026-10-09 measurements, not constants."
test_spec:
  - name: test_compiled_sub_agents_equal_the_frontmatter_declaration
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: deployed
    description: "For an agent with a `spawn_allowlist` declaration, the sub-agents named in its compiled prompt (both platform roots) are exactly the declared ones after macro resolution -- none added, none omitted."
  - name: test_editing_only_the_declaration_changes_the_compiled_prompt
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Changing only the frontmatter `spawn_allowlist` changes the compiled section on the next compile, with no other file edited."
  - name: test_editing_only_the_registry_spawn_allowlist_changes_nothing_compiled
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Changing only the registry `spawn_allowlist` field, header untouched, leaves the compiled prompt byte-identical."
    must_catch:
      - "delivery reads the registry spawn_allowlist field (the current build_per_agent_spawn_table behaviour)"
      - "delivery merges the registry field with the declaration"
  - name: test_ticket_phase_macro_stays_one_entry_and_resolves_per_build
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: boundary
    description: "The declaration keeps `__ticket_phase_agents__` as one list item; the compiled section names the agents whose is_ticket_phase is true on that build, each once."
  - name: test_tools_and_spawn_allowlist_parse_from_the_same_block_on_real_templates
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "On the real templates, one parse returns both the tools set and the spawn_allowlist for every agent, including a tools line carrying a trailing YAML comment."
test_rationale: >-
  'One place' is only distinguishable from 'also read' by the negative clause, so the
  registry-only-edit descriptor is the discriminating test and carries must_catch: the
  shipped builder reads the registry today and would pass every positive clause. The
  macro descriptor exists because pre-expanding the macro is the cheap migration and
  silently breaks AR-300d-5-i. Real-template parsing is included because the tools
  line on disk is not the clean shape fixtures tend to use.
delivers_to:
  agent: python-coder
  contract: >-
    A per-agent declaration read from one frontmatter parse --
    {agent: str, tools: list[str], spawn_allowlist_declared: list[str] (verbatim,
    may contain "__ticket_phase_agents__") | None when the key is absent,
    spawn_allowlist_resolved: list[str] (macro expanded against registry
    is_ticket_phase, deduped, order-stable)} -- consumed by AR-300a-5 (delivery),
    AR-300c-5-ii (derived-copy comparison), AR-300c-5-iii (resolution) and
    AR-200b-3 (Agent-tool check).
expects_from:
  ac_id: AR-300c-1
  contract: "The frontmatter header-reading path AR-300c-1 established for `skills:` beside `tools:`; this criterion extends it to `spawn_allowlist:` rather than adding a second parser."
