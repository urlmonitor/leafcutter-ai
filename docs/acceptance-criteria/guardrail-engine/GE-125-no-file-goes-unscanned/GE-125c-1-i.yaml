notes: |
  WHY THIS IS ITS OWN RECORD. The parent's scenario contains exactly one set-aside
  value and exactly one credential, and both of the cheap wrong implementations
  survive it. An implementation that decides once and applies the answer to the
  rest of the file satisfies the parent whenever the explained value comes first.
  An implementation that reports the whole file as soon as any value is unexplained
  also satisfies the parent, because the parent's file contains only one of each.
  Multiplicity and order are what separate them, and neither is in the parent's
  text.

  BOTH FAILURE DIRECTIONS ARE THE SAME DEFECT SEEN FROM OPPOSITE SIDES. Today one
  explained value carries the whole file out of scope. The mirror — one unexplained
  value carrying the whole file into scope — is not an improvement; it is the same
  loss of granularity, and it reintroduces the false positives the exemption exists
  to prevent. The exact count of two is what distinguishes them: six findings and
  zero findings are both reachable from plausible implementations.

  ASSERT THE PER-LINE DISTRIBUTION, NOT THE TOTAL. The second scenario compares the
  verdict on each of the six values between the forward and reversed files. Two runs
  can agree on a total of two while disagreeing about which lines produced them,
  and an order-sensitive implementation is exactly the shape that does so.

  FIXTURE PLACEMENT — STATED, NOT INHERITED. Every fixture must be a real file
  created inside a tempfile-backed throwaway project root, with the ticket area
  constructed INSIDE that root and the check run against that root. No fixture may
  be created under this repository's own `tickets/`, `docs/retrospectives/`,
  `docs/acceptance-criteria/` or `templates/skills/` trees — a fixture under one of
  those measures the exemption rather than the scanner and passes for the wrong
  reason. The test module belongs under `unit_tests/commit_guardian/`.

  EACH LINE MUST PRODUCE AT MOST ONE FINDING, so that two is an exact expectation
  rather than a floor: verify the chosen values do not cross-trigger a second rule,
  and keep the identifiers recognisable as identifiers rather than merely long.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Every arm runs the real
  pre-commit secrets check over real staged files and asserts the process exit
  status and the reported findings. Credential-shaped fixture strings are assembled
  at runtime from concatenated fragments rather than written as source literals.
