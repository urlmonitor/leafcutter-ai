    more.


    WHY criteria ARE NOT EDITED. This record''s own notes already say it: "THE FIGURES
    IN THE CRITERIA ARE ILLUSTRATIVE OF A SHAPE RATHER THAN FIXED FACTS", and "a test
    that pins 65 or 2,809 as a constant will go red the next time an agent or an
