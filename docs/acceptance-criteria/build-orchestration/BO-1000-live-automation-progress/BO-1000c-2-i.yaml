it_requirements:
  - "Surface: the /finalize-feature launch contract (templates/commands/finalize-feature.md + main-loop poll/relay instruction) — llm-expert, same relay surface as BO-1000c-2."
  - "The relay must surface the halting step's line into the conversation from the journal BEFORE (or independently of) the terminal halt result, so the last conversation line reflects the step that was underway at the halt — the user learns where it stopped from the live stream, not only the returned halt payload."
  - "Relies on BO-1000a-1-i (the halting step's start-of-step line is emitted before the failure) and BO-1000c-1a (that line reaches the journal); the relay must flush any remaining unrelayed journal lines when it detects the run has halted, so the halting-step line is not dropped."
  - "Keep the /finalize-feature command doc and its deployed copy in parity via build.py (ADR-001)."
