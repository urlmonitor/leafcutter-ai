criteria: |
  Given a staged Markdown file (for example a SKILL.md or an ADR) that contains the
  literal text "git commit" and the word "status-checker" in a prose example, and no
  staged .js file under scripts/workflows/ or templates/workflows-js/ contains a
  prohibited pairing,
  When the pre-commit guard runs on the staged files,
  Then the commit is not blocked,
  And the guard does not report the Markdown file,
  And the guard's scan scope is limited to .js files under the two workflow
  directories.
