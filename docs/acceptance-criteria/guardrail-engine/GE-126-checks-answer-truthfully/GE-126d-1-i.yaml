notes: |
  THE OBSERVED DEFECT HAS A MIRROR AND THE MIRROR IS SILENT IN THE SAME WAY. KI-CG-020
  records a check present in the manifest and absent from the roster. The opposite — a
  roster entry that outlives its check — produces a roster that reads as protecting
  something it no longer protects, which is the same enumeration-drift shape this L1 exists
  to close and is equally invisible today.

  IT IS AN L3 BECAUSE IT IS THE OTHER DIRECTION of GE-126d-1's comparison rather than a
  separate obligation, and because it is unobserved: it is written as a consequence of
  making the roster a checked enumeration, not as a defect anybody has reproduced. Carry
  that distinction — do not record it as an observation.

  THE DISTINGUISHABILITY CLAUSE MATTERS because the two findings have different remedies.
  A check with no entry is a decision the author must make; an entry with no check is
  cleanup.

