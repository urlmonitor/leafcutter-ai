criteria: |
  Given a requirement whose deliverable checklist lists a code item, a tests item,
    and a documentation item,
  When the craft responsible for the code item completes and signs off that
    deliverable,
  Then a sign-off record for the code deliverable is stored on the requirement
    itself,
  And the record identifies who signed it and when,
  And the sign-off is not recorded in the body of the grouping ticket,
  And each of the other two deliverables retains its own independent, still-unsigned
    slot.
