notes: |
  Evidence (2026-11-16 analysis): the claim-refusal workflow test builds its contention reply
  with a fixture helper whose exit status defaults to 0, while the command's lifecycle test
  pins a non-zero exit for the same refusal. So the contention halt was proved reachable by a
  reply that cannot occur, and the halt the real command reaches was never tested.

  This record makes the two halves meet: the test runs the real command and gives its exact
  reply to the lane. The existing exit-0 contention fixture is replaced, not kept beside the
  real one. Its assertions (contention names its members; never-attempted is not contention)
  are kept and re-pointed at the real reply; they are not weakened.

  The relayed-on-standard-error variant is BO-2400f-7-x's own test and uses the reply copied
  from the 2026-11-16 journal.

  Assigned to test-writer because the deliverable is the tests themselves. The IT PO may
  re-assign if the store prefers these as test_spec entries on BO-2400f-7-ix.
