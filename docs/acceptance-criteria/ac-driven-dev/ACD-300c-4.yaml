criteria: |
  Given the final gate of a /plan-feature run presents a batch of 4 records, ACD-9990a-1,
    ACD-9990a-2, ACD-9990a-3 and ACD-9990a-4, all at readiness "reviewed",
    and the approval-hold report for that batch returns ACD-9990a-3 as held with the reason
    "file finding undecided" and the other three as not held,
    and the user chooses "approve" with priority "high",
  When the workflow applies the approval,
  Then ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4 read readiness "approved" and priority "high",
  And ACD-9990a-3 still reads readiness "reviewed", and its priority is the value it had before,
  And each of the three approved records has gained exactly one new amended_by entry, at the
    end of its list, recording the approval and the date, and every amended_by entry it held
    before is byte-identical to before,
  And every other field of all 4 records is byte-identical to before,
  And the approval is made by the store's one approval step -- the same step a person runs by
    hand to approve records -- given exactly the ids ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4,
    as a deterministic workflow step, so no agent edits any record's readiness or priority
    during approval,
  And the run's closing summary states "3 approved, 1 held" and names ACD-9990a-3 with the
    reason "file finding undecided".
