id: BO-300c-1
title: "Finalize command uses epic or branch name, not a raw path, in all three locations"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given a completion message is rendered in any of the three locations
    (build-epic.js, build-feature.md, or build-single-ticket),
  When the /finalize-feature command is included in the output,
  Then the command argument is the epic name (e.g. EPIC-Foo) or branch name (e.g. feature/my-ticket),
  And the command argument is never a raw file path (e.g. tickets/00_inbox/epics/EPIC-Foo),
  And the user can copy-paste the command directly without path-to-name conversion.
