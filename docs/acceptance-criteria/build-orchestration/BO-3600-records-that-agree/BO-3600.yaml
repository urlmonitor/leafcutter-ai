criteria: |
  When one record says finished and another says broken, you hear about it.

  This project keeps more than one written account of the same system: what has
  been delivered, and what is known to be wrong with it. Each account is written
  by hand, at a different moment, by someone reading a different part of the
  system. Today neither can correct the other, so the two drift apart and both go
  on being believed — work reads as finished while a fault filed against that very
  work sits open beside it, and faults stay open long after the thing they
  describe was fixed.

  After this goal, a disagreement between two accounts of the same thing is
  surfaced by the system rather than discovered by whoever happens to read both.
  The remedy is not that people record things more carefully; it is that a
  contradiction between two records cannot persist unnoticed, so nobody has to
  hold both accounts in their head to spot that one of them is wrong.
