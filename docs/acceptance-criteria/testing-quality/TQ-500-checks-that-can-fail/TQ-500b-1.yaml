notes: |
  THE COLLAPSE THIS REMOVES. Today two of the three states present identically. A
  piece of work that owed a substitute answer and did not take one records the same
  thing as one that genuinely owed nothing, and that is how a test with no failure
  mode collects a clean bill of health from every stage it passes through. The third
  and fourth clauses are the whole point of the AC; a reader that reports two states
  has not implemented it.

  THE FIFTH CLAUSE IS THE ANTI-GREP CLAUSE. States must come from emitted records. A
  test asserting that the writing side was told to answer, or that a call to record
  the answer exists somewhere, passes on an implementation that never records
  anything — which is the same inertness this whole tree is about.

  THE SIXTH CLAUSE IS THE COMPOSITION CONSTRAINT. BP-1100g-5-i already builds a
  reader over this record for the cross-layer seam answer. A second reader over the
  same manifest would drift from the first, and a record missing both answers would
  then need two runs to surface both. One reading, two keys.

  DEPENDENCY DECLARED DELIBERATELY. depends_on names BP-1100g-5-i because this AC
  is not merely similar to it — it is an extension of the same artifact. If
  BP-1100g-5-i is unbuilt when this is scheduled, build the shared reader as part of
  it rather than forking.
