title: "jscpd hook forces staged-only mode when working tree is under /mnt/c/ (WSL2)"
component: guardrail-engine
level: L3
status: active
req_status: active
work_status: done
created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
  And the jscpd binary is installed (version 3.x)
  And the working tree root path starts with "/mnt/c/"
    (indicating a WSL2 mount of a Windows filesystem)
  When the duplicate code hook runs at pre-commit time
  Then the hook restricts scanning to staged files only
    (it does not attempt a full working-tree scan)
  And it does not emit a user-visible error about the WSL2 path
  And duplicate detection proceeds normally on the staged file set
