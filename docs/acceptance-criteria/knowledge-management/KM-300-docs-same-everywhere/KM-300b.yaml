criteria: |
  Same documentation, same map — byte for byte, on every operating system.

  When the written material has not changed, refreshing the map on any
  contributor's machine produces exactly the same result, so change history is
  never cluttered by the map flipping between versions and commits never pick
  up a change nobody made.
