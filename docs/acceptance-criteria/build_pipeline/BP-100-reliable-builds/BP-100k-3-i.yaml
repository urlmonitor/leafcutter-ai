covered_by: []
implemented_by: []
change_target: pipeline
risk_surface: internal
notes: "Paired negative case for the Gap A fix. Without it, the cheapest way to satisfy BP-100k-3 is to make every uncomparable artifact fail, which would block every commit on the current tree; and the cheapest way to satisfy BP-100k-1/2 is to record fingerprints that no gate actually consults. Running both gates end to end over a freshly built tree is the only check that catches either shortcut."
