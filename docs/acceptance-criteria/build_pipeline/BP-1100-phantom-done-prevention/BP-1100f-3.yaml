criteria: |
  Given a work item whose stated intent assigns a Python implementer whose work is checked
    by a Python test framework,
  And the work item's declared surface consists of JavaScript source files,
  When the pre-implementation intent-versus-surface consistency check evaluates the work item,
  Then it detects the contradiction and surfaces it — naming the mismatch between the Python
    implementer/checker and the JavaScript surface — before any implementer is dispatched,
  And a work item whose implementer and checking technology match its declared surface passes
    the check unflagged.
