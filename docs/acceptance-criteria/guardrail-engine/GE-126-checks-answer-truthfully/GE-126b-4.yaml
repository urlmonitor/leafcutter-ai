notes: |
  SATISFIES THE reference-doc LEG of GE-126b's documentation_triggers. It is the only
  documentation trigger this L1 carries.

  THE NO-WIDENING CLAUSE IS LOAD-BEARING. The L0 forbids any criterion in this tree from
  stating or implying how many checks share the defect until GE-126e has measured it. A
  reference that describes the three-answer vocabulary as the family's behaviour would
  breach that, and would be read as a guarantee nobody has verified.

  THE REMOVAL CLAUSE MATTERS MORE THAN THE ADDITION. The reference material currently
  documents an unlimited fail-open convention and readers act on it. Leaving the old
  sentence standing beside the new vocabulary reproduces the drift ACS-100i-9 exists to
  prevent.

  RECORDING THE EVIDENCE WITH ITS DATE IS DELIBERATE. This component has repeatedly had
  measurements repeated at a higher confidence than they were recorded at. A dated
  observation is a fact a later reader can re-run; an undated assertion is an opinion.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

