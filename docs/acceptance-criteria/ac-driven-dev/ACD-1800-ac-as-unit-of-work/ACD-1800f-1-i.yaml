title: "A requirement asking for a live-surface exercise is routed to that craft through the same declaration, with no second slot"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement whose observable promise can only be confirmed by
    exercising a live running surface rather than by a smoke check,
  And the requirement declares that promise in the same place a smoke-checkable
    promise is declared, naming the live-surface kind of observation,
  When the work for that requirement is assembled,
  Then the craft that exercises live surfaces is requested,
  And the craft that performs smoke checks is not requested for that promise,
  And a requirement declaring both kinds requests both crafts,
  And no separate declaration exists anywhere for the live-surface case -- the
    same slot that satisfies the smoke case is the one that satisfied this one.
depends_on: [ACD-1800f-1]
