it_requirements:
  - "THE COUNTS ARE THE PROOF OF EXECUTION, so they must be emitted on the PASSING path, at the commit-time stage, where nobody is looking. A count emitted only on the failing path proves nothing about a green commit, and a green commit is the state the repository has been in for four unregistered guards."
  - "One count per namespace, never a single total. A total hides the case this criterion is about: three namespaces read and one skipped sums to a plausible-looking number, and the blind spot is invisible."
  - "The count must be the number of artifacts the pass ATTEMPTED to read in that namespace, tracked during the walk — the same counter GE-122d-3 requires for the degraded path, not a second one. Two independently-maintained counts will disagree, and the disagreement will be settled by whichever is quieter."
  - "THE NAMESPACE SET IS DERIVED, NEVER LISTED (IT-PO 2026-08-25). The set of namespaces the count line spans must come from the same declaration the pass resolves its roots from — ADR-034's responsibility set as it is expressed in configuration — so that a namespace added tomorrow gets a count line without an edit here. A per-namespace count emitted from a literal sequence written into the reporting code is the same always-green shape this AC exists to defeat, one layer up: the fifth namespace would silently have no line and nobody would miss it."
  - "Keep the output legible on a passing commit without making it noise. The commit-time stage prints on every commit in the repository; a per-namespace count line is the budget, and a per-artifact listing is not."
  - "OUTPUT STREAM AND VISIBILITY ARE PART OF THE DELIVERABLE. The count line must land where a reader of an ordinary successful commit actually sees it, under the hook framework's normal passing-hook presentation — not on a stream the framework swallows on success, and not behind a verbosity flag nobody sets. A count that is emitted but not shown satisfies the letter of this AC and none of its purpose; the deregistered-run comparison is what proves it is visible, because the comparison is made on captured commit output."
  - "FILE SCOPE: this AC edits the check and its scanner module (both under templates/scripts/commit_guardian/, with their scripts/commit_guardian/ counterparts regenerated by build.py per ADR-001, never hand-edited) plus the new test module. It does not touch the registry — registration is GE-122d-6's surface, and this AC consumes it."
  - "Error handling per CLAUDE.md Rules 1-4. This criterion covers the clean path only; the could-not-establish and terminated-abnormally outputs are GE-122d-3's and GE-122d-3-i's and are not re-specified here."
test_spec:
  - name: test_ge122d6i_clean_commit_reports_one_inspected_count_per_namespace
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "In a built working copy with the check registered, an ordinary commit of a change claiming no contested number completes, and the captured commit output carries one inspected count per namespace the pass is responsible for, each equal to the artifacts actually present in that namespace."
  - name: test_ge122d6i_added_artifact_moves_only_its_own_namespace_count
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "One further artifact is added to exactly one namespace and the same clean commit is repeated: that namespace's count is one higher and every other namespace's count is unchanged. This is the constant-defeating run — a hard-coded or cached count passes the first test and fails this one."
  - name: test_ge122d6i_deregistered_run_produces_no_inspected_counts_at_all
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "The check is deregistered and the copy rebuilt; the same clean commit completes and NO inspected counts are produced. Delete the wiring line and this test goes red — it is the only descriptor here that can distinguish a hook that ran from a hook that was never reached."
  - name: test_ge122d6i_passing_run_and_deregistered_run_outputs_are_distinguishable
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The captured outputs of the registered clean commit and the deregistered clean commit are compared in one assertion and shown to differ in a way a reader can act on, with the difference carried by the counts themselves rather than inferred from the absence of an error. Both commits succeed, so exit status alone cannot separate them."
  - name: test_ge122d6i_count_line_is_visible_on_the_stream_a_successful_commit_shows
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: deployed
    description: "The count line appears in the output a user sees from a plain successful `git commit` in the deployed layout — captured from the commit invocation itself, not from a direct call to the check with verbose flags set."
test_rationale: "The whole point of this L3 is that a green commit currently proves nothing, so the test contract cannot be allowed to reduce to assertions over the check's return value — a script that prints counts and is wired to nothing satisfies every such assertion and is the exact state four guards in this component occupy. Three real commits against a real built working copy are therefore the minimum: registered-and-clean, registered-with-one-more-artifact, and deregistered. The middle run is what stops a constant from passing (a literal count satisfies the first run perfectly), and the deregistered run is what makes the claim about the COMMIT rather than the script. The visibility descriptor is separate because an emitted-but-swallowed count would pass a comparison made on the check's own captured stdout while failing the criterion's actual promise, which is that a reader of an ordinary commit can tell the two situations apart."
