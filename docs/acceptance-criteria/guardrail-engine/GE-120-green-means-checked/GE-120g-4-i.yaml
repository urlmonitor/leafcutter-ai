notes: |
  VERIFIED 2026-10-12, NOT HYPOTHETICAL. A copy of the deployed manifest whose
  negative-control record was backdated to `observed: 2026-10-11` was rewritten to
  `observed: 2026-10-12` by a single run, with the verdict unchanged — `passing`
  before and after.

  WHY IT WAS LATENT AND WHY IT IS URGENT NOW. Until branch fast-lane/bp-1300e-1 no
  registered hook carried an examinable negative control, so the sweep had nothing
  to stamp. `check-lint-gate` is the first. The liveness sweep runs on every commit,
  so from the day after that branch merges, the first commit each day in every built
  layout — this repository and every adopter — rewrites the deployed manifest and
  the next commit fails `check-output-drift`. This record should land with, or
  before, that branch.

  WHY THE SECOND, THIRD AND FIFTH SCENARIOS EXIST. The cheapest change that satisfies
  the first scenario is to stop writing at all. GE-120g-4's own test_rationale
  names that hole ("a test that forces a real update would"); the change scenarios
  are that test. The wording scenario exists because the next-cheapest fix — compare
  everything except the date — still rewrites the file on every linter upgrade,
  since the stored evidence carries the linter's version banner.

  CONSEQUENCE OF THE `observed` REDEFINITION. A stored record's evidence text may be
  older than the tool now in use. That is intended: it is the evidence on which the
  current verdict was first established. Anyone who needs the latest transcript gets
  it from the printed result lines, which this record does not touch.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity,
  it_requirements, test_spec, test_rationale. Those are the IT PO's.
