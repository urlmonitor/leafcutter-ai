notes: |
  PLACE 3 OF FOUR. The PO's words: a number that silently mixes the two is the
  same defect wearing a friendlier face.

  THE COLOURING CLAUSE IS AS LOAD-BEARING AS THE COUNTING CLAUSE and is why the
  second scenario exists separately. A report can keep two honest columns and
  still colour a declared-only criterion the same green as a covered one, at
  which point every reader takes the same wrong conclusion the summed figure
  would have given them — and the numbers are defensible in the review that
  follows, which makes it worse.

  Three consumers are named because a rule enforced in one report and not the
  others is a rule that fails at whichever surface a given person happens to
  read. The Atlas is the one most likely to be missed: it renders the store
  directly and does not go through the build output.

  The third scenario puts the caveat next to the number rather than in a
  document nobody opens.

  IT-PO ENRICHMENT NOTE (2026-08-25) — THE ONE CROSS-STACK AC IN THIS TREE. Two
  of the three named consumers are Python and the third (the Atlas) is
  TypeScript with its own vitest suite. The AC is assigned python-coder on the
  assumption that the Atlas consumes a structured artifact the Python side
  emits, which is also the design that makes "one counting function" true. If
  that assumption is rejected, this AC must be split into a python-coder half
  and a frontend-coder half with a matching delivers_to/expects_from pair —
  flagged rather than resolved unilaterally, because the split changes what the
  Atlas is allowed to compute.
