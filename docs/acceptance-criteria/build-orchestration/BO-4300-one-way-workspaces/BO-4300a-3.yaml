- Commands shown are exactly the deployed maker's CLI as built (BO-4300a-1 / BO-4300c-2); no hand-written
  alternative recipe, no symlink or copy steps.
- 'Location: docs/how-to/get-a-workspace.md. It is the single page every retired recipe points to (BO-4300f-2-ia/-ib),
  and it links to docs/how-to/clear-a-workspace.md (BO-4300e-5) and to the answer reference (BO-4300a-5)
  rather than repeating them.'
- 'Q4 and Q5 are DECIDED (user, 2026-09-28): the page may say that every workspace is named <kind>/<slug>
  (legacy spellings such as EPIC-<Name> are accepted and reach the same workspace) and lives in the project''s
  sibling folder <project-dir-name>-worktrees/, but a reader is told to take the location only from the
  workspace_path in the ready answer, never to build it from that pattern (an explicit --landing-root
  override moves it).'
