title: "Walk away and come back to finished work"
component: ac-driven-dev
level: L0
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Priorities steer the build queue -- agents work continuously without babysitting.

  When you set priorities on goals and features (L0/L1), the system continuously
  picks the most important refined work and builds it. Multiple features build
  in parallel up to a configurable limit. When an agent hits a blocker, it saves
  its work, submits a structured request, and moves on to the next item. You
  collect pending requests from one place, answer them, and the agent resumes
  with full context. The gap between "requirements are done" and "code is
  shipped" becomes your priority list plus time.
