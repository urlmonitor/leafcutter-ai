id: TQ-600a-13-xix
components:
  - testing_quality
title: "A timing-ratio test in the default run stops making the required pytest check flaky, by moving to the timing lane once that lane runs"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that `Test suite (pytest)` became a required check on 2026-10-08, so every test the
    default run collects can now block every merge,
  And that the default run collects wall-clock ratio assertions — at least TQ-600a-11's
    store-sweep test whose name says it is at least five times faster than the
    pure-Python parser, and its agent-card store-walk test whose name says it beats a
    fifth — which on shared runners with 3.8x to 10.74x measured host variance will fail
    on noise,
  And TQ-600a-13-i's rule that a test is excluded from the default run only when an
    invoked cadence collects it, and its carve-out that a timing-marked test's failure
    turns its own run red without blocking merges,
  When a timing lane — a run that collects only tests carrying the timing marker — is
    invoked after every merge to main and on a stated heartbeat, whether this record
    supplies that lane in its first minimal form or TQ-600a-13-xii has already extended
    it,
  Then each default-run test that asserts a wall-clock ratio carries the timing marker,
    is absent from the default collection, and is collected by the timing lane,
  And a moved test that fails in the timing lane turns that lane's run red, and a lane
    that collects no test at all also concludes red rather than green,
  And every such test is named in the change that moves it, which a human reviews,
  And before the timing lane is invoked, no timing-ratio test is removed from the default
    run,
  And the move is demonstrated by real collections — default and timing lane — before and
    after, showing each moved test in exactly one of them, never by searching the
    configuration for the marker.
depends_on:
  - TQ-600a-13
