criteria: |
  Given the current version is 0.4.2 (read from the latest git tag "v0.4.2"),

  Scenario A -- minor bump:
  When the version computation determines bump magnitude "minor"
    (because the highest AC level in this release is L1),
  Then the next version is computed as 0.5.0
  And the patch segment resets to 0.

  Scenario B -- patch bump:
  When the version computation determines bump magnitude "patch"
    (because the highest AC level in this release is L2 or L3, with no L1),
  Then the next version is computed as 0.4.3
  And the minor segment remains unchanged.
