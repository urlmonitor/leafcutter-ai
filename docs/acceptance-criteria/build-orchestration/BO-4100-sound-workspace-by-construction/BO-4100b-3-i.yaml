id: BO-4100b-3-i
title: "A workspace's own supporting material carries the same checks as the shared one"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a workspace's own supporting material and the shared install tree's
    supporting material were both derived from the same commit,
  When the set of checks each of them defines is enumerated,
  Then the two sets contain the same checks,
  And each check appears with the same configuration in both sets.
depends_on: [BO-4100b-3]
