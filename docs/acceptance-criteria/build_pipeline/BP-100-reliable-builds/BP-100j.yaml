criteria: |
  Build outputs are placed, mapped, cleaned, and fingerprinted automatically.

  When the build system compiles workflow scripts, each file is symlinked to
  its discovery path, tracked by source-to-destination mappings, cleaned of
  stale predecessors, and fingerprinted for future drift detection — all
  without manual intervention.
