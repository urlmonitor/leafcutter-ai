assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "ONE SOURCE FOR THE ARGUMENTS: run_ci_local.py reads the ratchet call from <repo-root>/.github/workflows/ci.yml (job typecheck, the step whose run calls scripts/ci/mypy_ratchet.py), joins its backslash-newline continuations, splits it with shlex, and runs it with sys.executable in place of 'python' and '${{ github.base_ref }}' replaced by the local base branch (default main, so --base origin/main). It holds no pathspec list of its own."
  - "BLOCKING AND ALWAYS ON: the typecheck gate is in the default gate list, blocking; --include-informational still adds only pytest. A --only <gate> selector runs a subset (lint, component-vocab, typecheck, tests)."
  - "VERDICTS: ratchet exit 0 = PASS; exit 0 with 'NOTHING INSPECTED' in its output = NOTHING INSPECTED (not a failure, as in CI, never printed as PASS); exit 1 = FAIL (new error or new type-ignore); exit 2 or any other non-zero = FAIL, could not check. A ci.yml that is missing, unparsable or has no ratchet call is FAIL, could not check, naming the file."
  - "The gate's output is still streamed as it runs; it is also kept so the verdict can be read from it."
  - "No network side effect: the local run does not fetch. Its header states that CI fetches the base branch first, so a stale origin/main gives an older merge base."
  - "ci.yml: the typecheck header and job comments that still say 'NOT YET a required check' are corrected; the job's steps are not changed."
  - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4): reading ci.yml catches OSError and yaml.YAMLError, logs at WARNING and becomes could-not-check; the subprocess call catches OSError; pure parsing carries no try/except."
test_intent:
  - clause: "it runs scripts/ci/mypy_ratchet.py with exactly the arguments ci.yml gives it, with origin/main as the base"
    needs_test: true
    reason: "The defect being fixed is a local mirror that ran a different command; only comparing the built command with ci.yml shows they agree."
  - clause: "the step is blocking and runs without any opt-in flag"
    needs_test: true
    reason: "The old step existed but sat behind --include-informational and could not change the exit code."
  - clause: "it type-checks that set, with no edit of its own"
    needs_test: true
    reason: "A second copy of the pathspec list would drift; a temp ci.yml with a different scope proves the local step follows it."
  - clause: "the local run exits non-zero and marks the typecheck step FAIL, naming the file, the head line and the error code"
    needs_test: true
    reason: "The point of the change: the local run must go red where CI goes red."
  - clause: "the local run exits non-zero and marks the typecheck step FAIL, naming the file whose type-ignore count rose"
    needs_test: true
    reason: "The second way the required check fails."
  - clause: "the local run exits 0 and marks the typecheck step PASS"
    needs_test: true
    reason: "Guards against a step that always fails."
  - clause: "the local run exits non-zero and marks the typecheck step FAIL, saying it could not check"
    needs_test: true
    reason: "A could-not-check that reads as a pass is the fail-open this repo guards against."
  - clause: "when ci.yml holds no ratchet call, the local run fails the same way, naming ci.yml"
    needs_test: true
    reason: "A reader that falls back to a built-in list when ci.yml changes shape would reintroduce the drift silently."
  - clause: "the typecheck step is marked NOTHING INSPECTED, never PASS"
    needs_test: true
    reason: "A check that examined nothing must not look like a check that found nothing."
  - clause: "the local run exits 0, as CI's check does, its final line saying a step inspected nothing"
    needs_test: true
    reason: "CI's check is green on a pull request with no Python change, so the mirror must not be red there either."
test_spec:
