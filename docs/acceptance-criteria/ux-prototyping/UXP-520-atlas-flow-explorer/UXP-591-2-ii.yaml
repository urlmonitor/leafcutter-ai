    relationship: describes
    status: exists
    relevance: Atlas routes table and how the app reads the repo; gains the /flows/<product>/<flow> addresses.
assigned_agent: frontend-coder
estimated_complexity: S
change_target:
  - code
  - ui
risk_surface: contract_boundary
it_requirements:
  - 'Opening a real drawer from the ''Step not found'' state goes through the same replace-entry path
    as any drawer open (UXP-591-4): one history replace to flowHref(flowId, newStepId), never a push and
    never a second write.'
  - Because the notice derives from the address, that replace is what clears it; there is no separate
    clear call that could leave the notice and the address out of step.
  - The replace rewrites the entry's stored view state together with its URL, so Back after a later push
    restores ?step=docenforce, never ?step=lint.
delivers_to: null
expects_from:
  ac_id: UXP-591-4
  contract: 'One replace-entry path for drawer open, switch and close that rewrites the current history
    entry with window.history.replaceState: URL flowHref(flowId, stepId | null) and view state {crumbs:
    string[] (Flow ids, entry flow first), filters: {source: ''real'' | ''mock'', kind: ''user'' | ''data''
    | ''architecture'', realization: ''all'' | ''built'' | ''spec'' | ''mock''}} kept in history.state
    under one namespaced key, merged into, never overwriting, the App Router''s own keys (__NA, __PRIVATE_NEXTJS_INTERNALS_TREE);
    not sessionStorage (owner decision 2026-10-09); history.length never changes.'
test_spec:
  - name: clicking Doc-enforcer from the 'Step not found' state clears the notice, opens its drawer and
      replaces the address with ?step=docenforce at unchanged history length
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: criterion
    must_catch:
      - the drawer opens but the address keeps ?step=lint
      - the change is written with pushState, adding a Back entry
  - name: after picking another flow and pressing Back the entry returns at ?step=docenforce with its
      drawer open and never ?step=lint or the notice
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: seam
test_rationale: The second test crosses the replace (UXP-591-4), push (UXP-591-5) and pop (UXP-591-5-ii)
  paths, which is where owner ruling 2 can break even when each path passes alone.
test_required: true
declares_side_effect: false
origin_agent: business-analyst
