id: ACS-1300a-1-i
components:
  - ac_store
title: "A tag token is normalised before matching, so a multi-id tag names every record on the line"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a test file whose coverage tag names two records on one line, separated by a
    comma, and both records exist in the store,
  And a second test file whose coverage tag names a single record and is followed by no
    punctuation,
  When the repair tool is invoked out of process against that store and that tree,
  Then both records named on the multi-id line are matched to that test and both are
    reported as missing links,
  And the record named on the single-id line is matched as well, so the handling of the
    multi-id line did not come at the cost of the ordinary one,
  And no tag is reported as naming an id that no record carries, in particular no
    finding naming the first id with its separator still attached,
  And a record whose id appears in no coverage tag is still reported as unmatched in the
    same run, so the normalisation widens the match rather than matching everything,
  And normalising a token does not make two different records match one tag: a tag
    naming one record is not attributed to another whose id differs from it only by
    letter case or by a hierarchy suffix.
depends_on:
  - ACS-1300a-1
