assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Every pytest invocation used to run or verify these tests must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "The order must be obtained by executing the scanner over a temporary store through its real command surface and reading the offered sequence. No assertion about the source text of scan_ac_store.py, and no direct call to the private sort helper, satisfies this AC — a test bound to the helper stays green when the helper stops being consulted."
  - "The recorded sizes in the fixture must run counter to the recorded urgencies, as the criteria specify. An equal-size fixture makes urgency-then-size and size-then-urgency produce the same list, which is precisely how the existing fast-lane test at unit_tests/build_orchestration/test_bo2400a_fast_lane.py:335-357 passes while proving nothing about which key leads."
  - "The full offered sequence must be asserted, not a pairwise before/after relation between two records. A pairwise assertion leaves the interior of the list free and permits an ordering that is correct at the ends and wrong in the middle."
  - "This AC pins the ranking that ships. No change to the ranking, no additional sort key, and no configurability may be introduced — those are product decisions reserved to BrainCandy by the scope fence in ACD-400d's notes."
  - "Note for whoever implements this: scripts/build_orchestration/fast_lane.py imports the scanner's sort helper directly, so any edit to the ordering changes both selectors at once. That coupling is a reason to touch neither, not a reason to test through the fast lane."
test_spec:
  - name: test_urgency_leads_the_order_and_size_does_not_disturb_it
