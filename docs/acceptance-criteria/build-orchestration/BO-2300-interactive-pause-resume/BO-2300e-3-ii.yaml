id: BO-2300e-3-ii
components:
  - build_orchestration
title: "An unparseable reply or a failed dispatch is not parsed as an empty pause-record result"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a peek-pause-record or read-pause-record dispatch returns no reply,
    raises a transport or execution error, or returns a reply that is not
    valid JSON or lacks the expected exists/record shape,
  When the workflow evaluates that outcome to decide whether a pause record
    exists,
  Then the outcome is classified as "could not determine", not as an empty
    result,
  And the run does not silently proceed past the gate as though no pause
    record exists.
depends_on: [BO-2300e-3]
assigned_agent: llm-expert
