assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "BP-300d-3 says to reuse the existing runtime/version gate; this constrains that gate's input parsing only. Observed: build_workflow_scripts() took result.stdout.strip().split()[-1], i.e. 'Code)' for '2.1.294 (Claude Code)', which InvalidVersion turned into 'unknown', so the minimum-version gate never fired with the CLI present."
  - "scripts/build_phases_workflows.py is over the 400-content-line ratchet; the fix must not grow it."
  - "Existing tests (unit_tests/test_build_workflow_phase.py) only set CLAUDE_CODE_VERSION and never feed the real `claude --version` stdout format; the new test must mock subprocess output in the real format."
