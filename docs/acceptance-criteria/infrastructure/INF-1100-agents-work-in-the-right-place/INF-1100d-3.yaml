  - 'No agent may connect to, or write a test pointing at, an address it chose itself: not localhost
    on a default port, not the formerly shipped address, not a value guessed from the environment.'
  - W2 (no database tests) proceeds with no mention of the missing setting.
  - test-writer's DB test pattern (Step 2b) must call INF-1100d-3-ii's shipped resolver in setUp
    instead of a literal address. The test runner relays INF-1100d-3-i's checker report instead
    of composing its own.
  - Edit source templates only (templates/agents/test-writer.md, templates/agents/test-runner.md).
