notes: |
  PLACEMENT IS DELIBERATE — this is the ACS-1200c-3 move. The narrowing that this AC
  constrains lives in GE-120e-1 and GE-120e-4. If this guarantee were filed as a child of
  either, a future relaxation of the narrowing would take it along; filed under the proof
  branch, a relaxation has to be argued against a verification that is still running. It is
  the only thing standing between "a check stopped blaming the wrong author" and "a check
  stopped blaming anyone".

  THE DISCRIMINATOR IS AUTHORSHIP, NOT THE OPERATION. Read the third and fourth clauses
  together: identical bytes, blocked in one arm and not the other, and the only difference is
  whether the author put them there. That is the whole L1 in one test.

  A CONSEQUENCE THE IT-PO SHOULD WEIGH RATHER THAN DISCOVER. Under GE-120e-1's definition, a
  conflict resolved by taking an incoming side verbatim matches that state and is therefore
  not the author's. So an author who resolves by accepting an incoming test deletion and
  separately edits production code is no longer blocked by the contract-shrinking rule. That
  is the observed false positive being removed on purpose, but it is a real narrowing of
  that check's reach on merges and it is worth stating out loud before it is implemented,
  not after. If it is judged too wide, the fix belongs in GE-120e-1's definition of what
  counts as authored — not in an exemption clause here, which would put the constraint back
  inside the thing it constrains.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
