notes: |
  On 2026-10-12..14 the agent-tool version probe failed because the tool was not on the
  subprocess search path; the setup still succeeded, and the agent cited this warning as
  evidence of failure. Labelling is the defence that holds even after BO-2400f-3-iii and
  -iv are fixed, because a human reading the log draws the same wrong conclusion.
