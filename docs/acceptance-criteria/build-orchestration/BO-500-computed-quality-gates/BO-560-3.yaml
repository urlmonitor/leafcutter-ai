title: "Manually-authored agents map is overwritten by the computed chain"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has a pre-existing manually-authored agents map in its frontmatter:
    agents:
      python-coder: needed
      documentation-expert: needed
      commit: needed
  And the ticket has change_type: flow_change
    and assigned work agent python-coder (produces: production_code),
  When ticket-supervisor begins processing this ticket,
  Then it computes the full agent chain from change_type and produces trait
  And it REPLACES the entire agents map with the computed chain
  And the computed chain includes agents NOT in the original manual map
    (e.g. architect-review, test-writer, test-runner, pr-reviewer, pull-request)
  And the computed chain may EXCLUDE agents that were in the manual map
    if they are not required by the guardrails rules
  And the replacement is written to the ticket file before any agent is dispatched

  Given the manually-authored agents map contained an agent with status: signed_off
    (from a prior partial run),
  When the computed chain replaces the map,
  Then it preserves the signed_off status for agents that appear in both
    the old and new map
  And it sets status: needed for agents that are new in the computed chain
  And it removes agents that were in the old map but are not in the computed chain
