it_requirements:
- 'Expose discovery through the existing agent guidance/registered entry surfaces. Describe three distinct
  routes: trusted source scanner, standalone typed knowledge CLI and kernel research run/resume; do not advertise
  scanner as a growth orchestrator.'
- Use installed agent-facing discovery and actual public CLI examples with validated configuration and payload
  schemas. Known operations retain deterministic validation; unknown research enters existing human/host continuation.
- Reuse existing component and agent identities and disabled-backend semantics. Do not add speculative HTTP/MCP
  services, parallel registries or automatic network startup.
- If implementation adds a package-distributed command/skill registry entry, declare that package surface and
  its structured implementation spec before changing it; current criterion does not mandate such a new entry.
test_required: true
test_rationale: Planned public-interface and separately labeled real-artifact proof covers the full observable
  obligation. Existing mechanism tests are reusable but do not establish real-agent, provider or deployment
  readiness. No planned test is represented as existing coverage.
