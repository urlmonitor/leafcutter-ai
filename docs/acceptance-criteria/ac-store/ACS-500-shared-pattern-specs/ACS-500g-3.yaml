notes: |
  The load-bearing constraint of this L1. If the producer's definition of "what is
  a pattern" and the consumer's (business-analyst pattern-first check, ACS-500c-1)
  are two separate texts, they drift: the producer promotes behaviors the consumer
  will not match, and the consumer keeps writing standalone ACs beside patterns
  that already exist. Integrating with the EXISTING consumer check is the
  requirement here — this AC does not re-specify what that check does.
