criteria: |
  Given a store whose schema_version is outside the range the installed package
    supports,
  When build.py runs,
  Then it emits a schema_version-skew warning naming the store version and the
    package's supported range for a tolerable skew,
  And it safely refuses (non-zero exit with a clear message) for an incompatible skew
    rather than proceeding.
