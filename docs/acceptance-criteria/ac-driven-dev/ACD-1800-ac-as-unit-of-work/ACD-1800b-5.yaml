status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a thin ticket grouping an AC whose per-deliverable sign-offs are all recorded
    on the AC (AC-side) and whose ticket body has no "## Comments" phase-status entries,
  When the supervisor's done-eligibility step (building-epics) evaluates whether the
    ticket may be marked done,
  Then the ticket is judged done-eligible from the AC-side per-deliverable sign-offs;
  And given a legacy fat ticket whose sign-offs live in the ticket-body "## Comments"
    status,
  When the same done-eligibility step runs,
  Then the ticket is judged done-eligible from the ticket-body status
    (honoured during the dual-record window);
  And given a ticket one of whose AC-side deliverables is still unsigned,
  When done-eligibility is evaluated,
  Then the ticket is NOT judged done-eligible.
