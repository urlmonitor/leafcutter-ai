change_target: pipeline
risk_surface: contract_boundary
notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with an
  object whose string values embed '{', '}', and '#', asserting the returned object's
  string field equals the original text exactly — proving the scanner does not count
  braces that appear inside JSON string literals and does not treat '#' as a
  comment/section delimiter.
