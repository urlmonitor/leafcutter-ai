title: "Architect produces ADRs when a design decision is required"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the architect agent is processing a ticket that introduces a new
    architectural pattern or changes an existing one,
  When the architect determines that a design decision needs to be recorded,
  Then it produces an Architecture Decision Record (ADR) file in
    docs/architecture/decisions/ with the standard ADR structure:
    - Title: a concise statement of the decision
    - Status: proposed, accepted, deprecated, or superseded
    - Context: the problem or situation that led to the decision
    - Decision: what was decided and why
    - Consequences: positive and negative effects of the decision
  And the ADR file is named following the sequential numbering convention
    in the decisions directory
  And the ADR references the ticket ID that triggered its creation

  Given the architect discovers an existing ADR that covers the same decision area,
  When the new ticket contradicts or extends that decision,
  Then the architect produces a NEW ADR that supersedes the old one
  And updates the old ADR's status to "superseded" with a reference to the new ADR
