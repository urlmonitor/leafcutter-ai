id: BP-1300f-1-vii
components:
  - build_pipeline
title: "CI runs the type check as 'mypy ratchet (new errors only)' on every pull request, and its red fails the job instead of being hidden"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Scenario: The job fails when the ratchet fails
    Given the CI workflow's type-check job,
    Then it is named "mypy ratchet (new errors only)",
    And it carries no continue-on-error, so a non-zero exit of the ratchet makes the job red,
    And its pull-request step runs scripts/ci/mypy_ratchet.py against the pull request's
      base branch, after fetching that branch without a depth limit,
    And the checkout has the full history, so the merge base can be computed.

  Scenario: The scope is unchanged
    Given the pathspecs the old job type-checked,
    Then the ratchet is given the same pathspecs, in both the "dir/*.py" and the
      "dir/**/*.py" form for scripts, tests, unit_tests, knowledge, integrations and
      kernel.

  Scenario: The job is not made required by this change
    Then this change adds the job to no required-status-check list; the user promotes
      it once the job runs clean on main.
