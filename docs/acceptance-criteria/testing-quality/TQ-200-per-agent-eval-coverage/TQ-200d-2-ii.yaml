title: "An empty-window test that counts the fetched rows and their non-NULL values in its own code passes the count check"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the sql-test-writer "empty window, database shape" row, whose fixture
      seeds 3 buy_volume rows for one symbol into the window,
    And a produced test that runs "SELECT buy_volume FROM buy_volume_window
      WHERE symbol = %s ORDER BY buy_volume", fetches all returned rows, asserts
      the number of returned rows equals the number of seeded rows, and asserts
      the number of returned values that are not None equals the number of
      seeded rows,
  When the row's count check reads the produced test,
  Then the check passes,
    And a test that counts in SQL ("select count(*), count(buy_volume) from
      buy_volume_window") still passes,
    And a test that fetches the rows and asserts only that every value is
      >= 0 fails, because an empty or all-NULL window passes it,
    And a test that fetches the rows and asserts only that at least one row
      came back fails,
    And a test that asserts the exact row count but no count of non-None
      values fails,
    And a test that asserts a count of non-None values but no exact row count
      fails,
    And the recorded gold output for the row still passes,
    And the agent template's remedy, "assert an exact count of processed rows
      plus a non-NULL count", is unchanged.
