id: BO-2400f-4-vii
components:
  - build_orchestration
title: "The lane pushes and opens its pull request with the operator's stored login, not an environment token that cannot push"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run for UXP-513 has committed its green change on branch
    fast-lane/uxp-513,
  And the run's environment carries an access token that the repository refuses with
    "Permission denied" when it is used to push,
  And the operator's stored login on the machine can push to the repository and open
    pull requests in it,
  When the run pushes the branch and opens its pull request,
  Then both the push and the pull-request creation are made with the operator's stored
    login, and the environment token is not used for either,
  And the branch is present on the remote at the run's commit,
  And a pull request from fast-lane/uxp-513 against main exists,
  And the operator pushes nothing and opens nothing by hand.

  Given the same run with no access token in its environment,
  When the run pushes the branch and opens its pull request,
  Then the push and the pull request succeed with the operator's stored login, as
    before.

  Given a project that has installed the lane and names no particular account,
  When the run pushes and opens its pull request,
  Then it does not switch to any account name written into the lane itself, and uses
    whichever stored login the operator's machine has active.
