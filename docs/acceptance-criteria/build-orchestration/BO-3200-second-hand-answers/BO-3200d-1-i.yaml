notes: |
  THE PARENT L1 IS EXPLICIT: "THE GATE IS NOT THE BUG. Its fail-closed posture is correct and
  must be preserved — do not let this criterion be decomposed into loosening it." This AC is
  that instruction made falsifiable, because the cheapest way to make BO-3200d-1 pass is to
  stop the gate refusing, and no test in that AC would notice.

  What failed in KI-BO-019 was the contract, not the check: "return 149 KB of text as a string
  field" is not something a specialist reliably honours, and the specialist was not evasive
  about it — it said plainly what it had done and where the content was. It simply answered a
  different question than the schema asked.

  THE TWO HALTS MUST READ DIFFERENTLY. "The result lacked what was required" and "the result
  could not be obtained" send a reader to different places — one to the producer's work, the
  other to the handover — and conflating them is the misdirection cost KI-BO-018 records. This
  is the same distinction BO-3200e makes in general; here it is pinned to the one gate whose
  correctness must survive the fix.

  IT-PO ENRICHMENT NOTE (2026-08-26). Complexity S because the code change is small or nil —
  the gate should already behave this way — and the deliverable is really the pair of tests that
  hold the line while BO-3200d-1 is implemented. That makes it unusually important that the two
  ACs are built together rather than sequenced apart: shipped alone, BO-3200d-1 has no guard.
