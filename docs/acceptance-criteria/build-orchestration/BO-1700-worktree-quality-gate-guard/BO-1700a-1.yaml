it_requirements: |
  New script scripts/commit_guardian/verify_precommit_active.py with a
  templates/scripts/commit_guardian/ mirror; the deployed copy and its packaged
  template source are edited TOGETHER and verified byte-for-byte via the build.py
  round-trip (ADR-001 self-hosting boundary) — never edit one side only.
  This script is the SINGLE shared probe helper (the single producer): every gate
  in the BO-1700d family and every invariant in the BO-1700b family consumes THIS
  result and must not reimplement the four checks, so the surfaces cannot drift.
  Fail CLOSED on any internal error (per BO-1700b-1): an uncaught exception, a
  non-zero subprocess, or a timeout must NEVER emit a passing result. The ONLY
  passing outcome is exit 0 AND an empty failing_checks list.
