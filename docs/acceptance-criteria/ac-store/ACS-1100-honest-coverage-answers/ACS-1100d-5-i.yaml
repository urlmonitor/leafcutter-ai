notes: |
  THE FAILURE THIS PREVENTS is the fix eating the store. Most records in the store
  do not state a population in machine-readable terms; their criteria are prose
  Gherkin. An implementation of ACS-1100d-5 that infers a population wherever it can
  and refuses whenever it cannot would make a large share of the store unclosable
  overnight and would be switched off within a week — the same fate the AC-store CI
  job records for a whole-store per-pull-request gate. Referral keeps the honest
  answer available without converting an unstated claim into a fabricated one.

  ABSTAIN, DO NOT DEFAULT IN EITHER DIRECTION. Defaulting to "single record" closes
  everything and reintroduces the defect. Defaulting to "whole store" refuses
  everything and gets the rule disabled. The third answer is that the tool does not
  know, says so, and the count of records it does not know about is visible.

  THE REFERRAL COUNT IS THE LOAD-BEARING HALF. A referral that is merely logged is a
  silent pass wearing a different word. Reporting it beside the closed and refused
  counts is what makes an unreadable population a measurable backlog rather than a
  permanent hiding place.
