id: BO-4300g-2
title: "Workflow steps that only read or run one command go to an agent that cannot remove anything"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
declares_side_effect: true
criteria: |
  Given the requirements-authoring workflow (/plan-feature) is run end to end on a
    behavioral request, with one pause and resume at a confirmation gate,
  When its dispatches are recorded,
  Then the pause-store read, the gate-answer step, the pause-persist step and every
    stage-end script step are each dispatched to an agent whose registered abilities
    include neither removing a workspace nor deleting a branch,
  And the run contains no dispatch at all to a removal-capable agent.

  Given the finalize workflow is run end to end on a merged branch,
  When its dispatches are recorded,
  Then exactly one dispatch goes to a removal-capable agent -- the step-7 workspace
    removal,
  And every other step that reads state or runs one command goes to an agent that
    cannot remove a workspace or delete a branch.
depends_on: [BO-4300g, BO-4300e, BO-4300c-3]
