id: INF-500d-1
components:
  - infrastructure
  - feedback_collector
title: "Who may file a report is derived from the live agent roster, never from a hand-kept copy of it"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the agents ac-validator, ac-fulfillment-gate, change-scope-reviewer and
    live-surface-tester are entries in the live agent roster,
  And none of the four is named in the permitted-writer list of the general-purpose
    category they must write (knowledge-gap),
  When each of the four submits a report to that category as an agent,
  Then each report is accepted and stored,
  And the writers permitted for a GENERAL-PURPOSE category are determined at
    submission time by exactly one question — "is this submitter an entry in the live
    agent roster?" — and not by consulting a separately maintained duplicate of the
    roster, and not by any narrower roster attribute such as the entry's declared
    phase, declared category, or tier.

  Given the exact set of submitter identities that are permitted writers of each
    category immediately before this behaviour ships,
  When the derived writer set is in force,
  Then every one of those identities is still a permitted writer of every category it
    could write before,
  And in particular the two supervisor identities that today write tooling-issue,
    convention-ambiguity and blocker are still accepted for those three categories,
    even though the roster does not mark them as ticket-phase agents and one of them
    is marked deprecated,
  So that replacing the hand-kept list with a derived one adds writers and revokes
    none.

  Given a newly registered agent that is added to the live agent roster after this
    behaviour ships,
  And no edit is made to the permitted-writer configuration,
  When that agent submits a report to a general-purpose category,
  Then the report is accepted,
  So that adding an agent never requires a second, easily-forgotten edit elsewhere.

  Given the single non-agent submitter identity that the commit-time guards use, which
    is deliberately not an entry in the agent roster,
  When a guard files its report to the category reserved for guards,
  Then the report is accepted,
  So that deriving the general-purpose writer sets from the roster does not strand the
    one legitimate writer that is not an agent.

  Given a submitter identity that is not an entry in the live agent roster (for example
    "totally-made-up-agent"),
  When it submits a report as an agent to a general-purpose category,
  Then the report is rejected with an error that names the rejected submitter and the
    category it attempted to write, and that does NOT enumerate the identities the
    category permits,
  And the derived writer set therefore never degenerates into "any caller is
    permitted".
