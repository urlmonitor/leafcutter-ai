estimated_complexity: S
it_requirements:
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - A words answer at the ranked question never resolves the decision and is never parsed into a choice,
    a condition or a criterion (interpretation is TICKET-20261002-KernelInterpretFreeText).
  - Done is decided by a test through the decision graph, not by reading the code.
  - 'No kernel code change is in scope of TICKET-20261002-DecisionLifecycleACs: a behaviour gap that
    needs kernel code is closed through its own ticket. Adding covers tags or a missing test does
    not change kernel code.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_a_words_answer_at_the_ranked_question_is_reassessed_and_ranked_again
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'TO WRITE (in tests/kernel/capabilities/test_design_ending.py): a free_text answer
      to the ranked question leads to a new decision.assess call with the words among Jev''s constraints
      and a new ranked question (phase awaiting_design_choice)'
    covers:
      - DK-100b-2-ii
  - name: test_a_words_answer_never_resolves_the_decision
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: failure
    description: 'TO WRITE (in tests/kernel/capabilities/test_design_ending.py): ''pick the first
      one, but only if ...'' leaves the decision unresolved and stages nothing'
    covers:
      - DK-100b-2-ii
test_rationale: The behaviour is a property of the whole decision graph (revision change, re-assessment,
  new follow-up key), so the test drives the graph like TestHumanChoiceResolves does; a unit test
  of approvals.py alone would only show the text is stored.
