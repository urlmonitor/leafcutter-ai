id: BO-3200f-2-iii
title: "A guardrail bypass variable carried by a command the executor runs does not bypass the guardrail, for any command, and a guardrail that cannot tell who is calling does not silently honour it"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: low
criteria: |
  Given each guardrail that honours a bypass variable -- COMMIT_AGENT_MODE, CLAUDE_NO_DOC_UPDATE
    and INLINE_WORK_GUARD_MODE -- and, for each, a command that guardrail blocks when the command
    is issued without the variable,
    And that command dispatched to the chartered executor with the variable set in the command
    text, at the value that bypasses the guardrail for any other caller,
  When the executor carries the dispatch out,
  Then the guardrail blocks the command exactly as it blocks it without the variable,
    And the command is not carried out,
    And the block names the guardrail and the bypass variable it refused.

  Given the same command without the variable in its text, dispatched to the executor while the
    same bypass variable is set in the environment the executor runs in,
  When the executor carries the dispatch out,
  Then the guardrail blocks the command, the command is not carried out, and the block names the
    guardrail and the variable.

  Given a command that appears in no workflow shipped with the package -- composed while a run is
    in progress -- carrying one of the three bypass variables, dispatched to the executor,
    And the authoring-time routing check of BO-3200f-3 never having examined that command,
  When the executor carries the dispatch out,
  Then the guardrail blocks the command and it is not carried out, so the refusal does not depend
    on BO-3200f-3 having seen the command.

  Given the same blocked command carrying the same bypass variable at the same value, issued by a
    caller that is not the executor and for which that guardrail honours the variable today,
  When the command is issued,
  Then the bypass takes effect for that caller exactly as it does today, so the refusal applies
    to the executor as caller and does not remove the escape hatch for anyone else.

  Given a guardrail that gains a bypass variable after this rule is in force,
    And a command that guardrail blocks, carrying that new variable, dispatched to the executor,
  When the executor carries the dispatch out,
  Then the guardrail blocks the command and it is not carried out, with no change made to the
    refusal that names the new variable.

  Given a guardrail that receives a command carrying one of its bypass variables and cannot
    establish from what it receives whether the caller is the executor,
  When the guardrail decides,
  Then it does not let the command through under the bypass without saying so: either it blocks
    the command as it would for the executor, or, if it lets the command through under the
    bypass, it states on its error output, in the same decision, the guardrail, the bypass
    variable and that the caller could not be identified,
    And in no case is the command carried out under the bypass with no such statement.
