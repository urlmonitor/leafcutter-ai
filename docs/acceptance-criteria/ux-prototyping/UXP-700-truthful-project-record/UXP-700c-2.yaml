    relationship: context
    status: exists
    relevance: "UXP-590 keeps the record self-consistent. This AC is the record's agreement with the code, which can be false while UXP-590 holds."
  - path: docs/product-truth/README.md
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: L
