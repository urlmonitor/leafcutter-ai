id: BP-1600a-1-ii
components:
  - build_pipeline
  - precommit_hooks
title: "A script counts as run only when a shipped wiring executes it — the two sides name the same script in two different layouts and are resolved to one identity, a name that merely appears in the settings document is not a wiring, and a wiring that executes nothing is reported too"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the settings surface names each hook script inside the command the harness
    executes for a tool-call event, rather than in a field of its own,
  And it names that script by the position it occupies once the project is
    installed, while the same script is held, in the project's own tree, at a
    different position,
  When the census builds the population of scripts that are run,
  Then it takes from each wiring the hook script that wiring's command executes,
    including when that command wraps the script in other tokens before and after
    it,
  And it resolves the script a wiring names and the script held in the project's
    tree to one identity, so a comparison made between the two positions as written
    does not report every script as run by nothing,
  And a script whose name appears somewhere in the settings surface other than
    inside a command that executes it is not counted as run,
  And a wiring that exists only in a copy of the settings surface the project does
    not ship — a local override present in one working copy — is not counted, because
    a wiring an installed project never receives is not a wiring,
  And given a wiring whose command executes a script that is not present in that
    place at all,
  When the census runs,
  Then that wiring is reported by name as executing nothing, and the run fails.
