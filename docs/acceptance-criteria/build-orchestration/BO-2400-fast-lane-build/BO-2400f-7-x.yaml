notes: |
  The first scenario is the reply copied from the 2026-11-16 journal (run wf_1d040da5-d48,
  last line). Its exit status is 1, not BO-2400f-7-viii's reserved status, on purpose: the
  lane must read a held refusal from the command as deployed that day as well as from the
  fixed command.

  The runner moving standard output into standard error is a fault in the relay
  (BO-2400a-1-i says both streams are returned exactly as produced). It is not fixed here.
  This record only stops that fault from turning a held claim into a wrong halt.
