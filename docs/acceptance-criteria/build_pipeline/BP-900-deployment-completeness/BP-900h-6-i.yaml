test_spec:
  - name: test_bp900h6i_step_refuses_an_unentitled_target_and_leaves_it_byte_identical
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Build a target that models a developer's real working tree — an existing git repository with a pre-existing commit, a skills_config.json with the developer's own content, and a pre-commit registry. Take a full census of paths and file bytes. Invoke the consumer-install entry point as a subprocess with the use-the-install flag against it. Assert the exit status is non-zero, the message names the target path and the failed entitlement condition, and the post-run census is identical to the pre-run one: same path set, same bytes, no new commit in the repository, and the registry still lists every hook it listed before. The census is the load-bearing assertion — an implementation that refuses only AFTER git init and the registry rewrite satisfies any assertion that merely checks the exit status."
  - name: test_bp900h6i_shared_artifact_behind_a_symlinked_registry_is_never_written_through
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: failure
    description: "In an ENTITLED target, make .pre-commit-config.yaml a symbolic link to a file outside the target root that a second install also reads. Record the link target's bytes. Run the step through the same subprocess entry point. Assert the outside file is byte-identical afterwards, whichever branch the step took, and that whatever the step then commits inside the target did not come at the cost of the shared file. Kills the current shape directly: today the rewrite opens the config path and writes, so it edits the shared artifact and every other install that reads it."
  - name: test_bp900h6i_an_entitled_disposable_target_still_completes
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: deployed
    description: "The did-not-turn-the-step-off control. Against a directory that started empty and holds only a freshly built install, the same subprocess invocation runs to completion and yields BP-900h-6's result. Without this entry the cheapest passing fix is to refuse everything, which is green on both entries above and is indistinguishable from deleting the step."
  - name: test_bp900h6i_the_refusal_is_reached_by_the_command_the_workflow_actually_runs
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Read the consumer-simulation step's command out of the real on-disk .github/workflows/ci.yml, and run that exact command — arguments and all — against an unentitled target, as a subprocess. Assert it fails and the target is unmutated. Goes red today for a reason worth keeping visible: the workflow's command carries no use-the-install flag, so the entire step, guard included, is unreachable from CI. A test that imports the guard helper and calls it directly is green in that state and proves nothing."
test_rationale: |
  The defect is that a destructive routine has no idea what it is pointed at, so every
  entry here is written to survive the plausible cheap fixes rather than to restate the
  criterion.

  Refusing after the fact is the likeliest first implementation: a check placed anywhere
  below the git-init call passes an exit-status assertion while the target is already
  damaged. Only the before-and-after census kills it, which is why the census, not the
  exit status, is the primary assertion of entry 1.

  Refusing everything is the second cheap fix, green on entries 1, 2 and 4, and killed
  only by entry 3.

  Entry 2 exists separately from entry 1 because the symlink case is not an entitlement
  failure — the target is entitled, and the damage escapes it anyway through a path that
  resolves elsewhere. An entitlement test alone leaves it open.

  Entry 4 is not redundant with the others. The step's own AC already has an entry-point
  descriptor, but that one asserts the step and the test share a script; this one asserts
  the guarded behaviour is reached by the command in the file the runner parses, which is
  the property that is false on this branch right now. None of these entries may be
  written as a unit test over a resolution or classification helper: a helper called with
  the arguments the test author already believes are right answers the same way in a
  guarded and an unguarded step.

  Angles: criterion, failure, deployed, reachability — at the cap of four, with the
  must-refuse case riding entry 1.
