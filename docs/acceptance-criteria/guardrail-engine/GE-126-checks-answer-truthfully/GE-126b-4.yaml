assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "Each of the three documented answers must be written so a test can read it out of the shipped document and drive the condition it describes against the deployed check. A single paragraph naming all three cannot be walked and the coverage note demands that it is."
  - "The reference must name check_ac_governance and must not assert that any other member of the family already speaks this vocabulary. Doing so would breach the L0 standing rule and would ship an unmeasured guarantee - GE-126e is what would measure it."
  - "The dated observation must be recorded as an observation with its date and the commands that produced it, not paraphrased into a rule. An undated assertion is an opinion; a dated one is a fact a later reader can re-run."
  - "The removal clause is a deletion obligation: assert that no statement remains anywhere in the reference material describing a zero exit from this check as a clean result. Leaving the old sentence beside the new vocabulary reproduces the drift ACS-100i-9 exists to prevent."
  - "The reference must state that the component's deliberate fail-open-on-internal-error convention (GE-116a-1-iii) is unrepealed, so a reader does not conclude that two of the three answers becoming visible has made them blocking."
  - "The three answer names in the reference and the machine-readable outcome values in the check must be the same strings, not two similar vocabularies. Two paraphrases of one rule become two rules."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the page."
test_spec:
  - name: test_each_documented_answer_is_driven_against_the_deployed_check
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "The test reads the three answers and their conditions out of the shipped reference and, for each, runs the deployed check under that condition and asserts the documented answer is the one produced."
  - name: test_the_refused_answer_is_driven_with_a_record_that_genuinely_violates
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The 'work was refused' answer's condition is exercised with a real violating record so the documented answer is proven by a refusal, not by a run that had nothing to object to."
  - name: test_documented_answer_names_match_the_checks_outcome_value_strings
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: seam
    description: "The answer names the reference publishes and the outcome value strings the deployed check emits are the same strings - the producer and the consumer of the vocabulary are compared to each other, not each to a literal."
  - name: test_zero_exit_means_clean_advice_is_absent_and_no_wider_claim_is_made
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "No statement remains in the reference material that a zero exit from this check is a clean result, and the reference makes no claim about any check other than the one repaired here."
test_rationale: |
  A reference that names three answers passes any string assertion whether or not the
  code produces them, and this component has shipped documentation describing behaviour
  that never existed — the belief that created was worse than no documentation at all.
  Driving each documented answer against the deployed check is the only form that binds
  the page to the system. The third descriptor is the one most likely to be skipped and
  is the one ACS-100i-9's finding predicts will matter: if the reference's answer names
  and the check's outcome values are two similar vocabularies rather than the same
  strings, a caller matching on the published name gets nothing, and both sides stay
  green. The fourth descriptor covers two deletions, both invisible to an addition test.
delivers_to: null
expects_from:
  - ac_id: GE-126b-2
    contract: "The three-answer outcome vocabulary, the machine-readable value of each, and which two share a zero exit status. The reference publishes exactly these and must use the same strings."
  - ac_id: GE-126b-3
    contract: "The resolved root reported by every run and the unresolvable-root report. The reference's claim that every run states the root it resolved is only true once this has landed."
