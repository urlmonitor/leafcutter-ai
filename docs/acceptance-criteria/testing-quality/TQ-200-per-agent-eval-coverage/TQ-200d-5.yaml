notes: |
  ORIGIN. The TQ-200d live before-score of 2026-10-25 (KIs filed on main via
  PR #1370). test-writer scored 0/8 on Windows because its ~67,700-character
  template went on argv (WinError 206). The other three local-only agents
  launched only because their templates are 10,000-18,500 characters.

  PLACEMENT. TQ-200d holds 4 L2s; the cap is 5, so this is the last free L2
  slot. The harness launch is the one cross-agent behaviour in this pass, so it
  takes the L2. The scorer and agent fixes sit as L3s under the L2 that owns
  each row (TQ-200d-2 for sql-test-writer, TQ-200d-4 for test-runner), and the
  assertion-kind reference page under TQ-200d-1, which introduced the
  produced-tests mode and its kind registry.

  NOT RE-PLANNED. The test-designer side (TQ-500f-2-ii) is already an approved
  AC built separately.
