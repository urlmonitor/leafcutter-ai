it_requirements:
  - "Surface is the build pipeline (template_compiler.py / build.py): when a work-location placeholder has no configured value AND no documented default applies, compilation must FAIL LOUDLY with an error that names the unresolved placeholder."
  - "On that failure, the pipeline must NOT emit a compiled instruction containing the raw {{...}} token or an empty path — fail-closed, never ship a broken prompt (contrast INF-1100a-1-i where a documented default DOES apply and the default is used instead of failing)."
  - "Error must be raised at the I/O boundary per the project error handling policy; the message must identify the placeholder so the misconfiguration is actionable."
