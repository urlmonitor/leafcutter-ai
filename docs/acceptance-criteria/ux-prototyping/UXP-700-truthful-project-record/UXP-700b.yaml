notes: |
  ANTI-VACUITY. Kept as its own L1 rather than folded into UXP-700c, on purpose.
  A vacuous check is the MECHANISM that conceals both UXP-700a (no record) and
  UXP-700c (drifted record). Merging it into the drift L1 would make the thing
  that hides the failures a sub-clause of one of the failures it hides.

  DIRECTLY OBSERVED AND REPRODUCED (2026-09-07, this repo). A completely empty
  product-truth store, with its derived index regenerated, produced:
      OK: 0 flows, 0 mock-data, 0 mockups, eval + index + derived data valid
      (0 warnings)      exit 0
  That output is character-for-character the shape of a real pass. Nothing in it
  distinguishes "your project's record is sound" from "your project has no
  record". This is the acceptance shape for the L1: those two runs must not look
  alike.

  ALSO OBSERVED, and relevant to the BA: the store checker is not wired into any
  automatic gate. A repo-wide search for callers of the product-truth checker
  found it referenced only by ACs, agent cards, ADRs and how-to docs — there is
  no entry for it in .pre-commit-config.yaml and no CI step. So today the check
  is both vacuous when empty AND not automatically run. Fixing only the message
  leaves nobody reading it. Whether the un-run problem belongs here or in
  UXP-700c is a BA call; it is recorded on both.

  STANDING-RULE CAUTION — inherited from GE-120, do not let it be flattened.
  This project has a deliberate fail-open convention: a guard that hits an
  internal error exits 0 with a warning so a script bug never blocks unrelated
  work. This L1 does NOT repeal that. The distinction is narrower: failing open
  on one bad input while the check still ran is fine; reporting SUCCESS when the
  check never examined anything is not. The unit of the rule is visibility, not
  blocking.
