id: TQ-400f-3
components:
  - testing_quality
  - ac_store
title: "A parent that really is finished underneath keeps its badge, untouched, in a run that demotes others"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing a finished parent every one of whose descendants at
    every depth is finished — including its Roman-suffixed technical-constraint
    children — alongside a second finished parent with one unfinished grandchild,
  When the whole-store honesty sweep runs to completion over that store and
    applies its outcome,
  Then the consistent parent's file is byte-for-byte identical before and after
    the run: it is not demoted, and no knocked-back reason or date is written to it,
  And the consistent parent appears in the run's report with a verdict of its own,
    so a reader can tell "looked at and left alone" apart from "never looked at",
  And the second parent is demoted in that same run, proving the run's write path
    was live and discriminating while the consistent parent was left alone,
  And a parent whose descendants are all finished except one that is itself
    excused from needing proof is likewise left untouched, so an excused
    descendant does not read as unfinished work.
depends_on:
  - TQ-400f
  - TQ-400f-1
  - TQ-400f-2
  - TQ-400e-1
doc_links:
  - path: docs/acceptance-criteria/testing-quality/TQ-400-durable-done-proof/TQ-400e-1.yaml
    relationship: related
    status: exists
    relevance: >-
      THE PROPERTY THIS AC INHERITS, ON A NEW AXIS. It establishes byte-identity
      for a record whose own proof holds; this AC establishes the same for a parent
      whose children hold. Read its requirement that byte stability means not
      opening the file for writing at all — a load-and-dump round trip preserves
      every value and rewrites every file.
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The real_artifact angle and the anti-no-op control. "Nothing changed" is
      satisfied perfectly by a sweep that does nothing, which is why the same run
      must be shown to have demoted something else.
  - path: templates/scripts/commit_guardian/check_done_proof.py
    relationship: implements
    status: exists
    relevance: >-
      The store walk and the outcome application path. The consistent parent must
      be reported from here, not skipped — a skipped record is indistinguishable
      from an unevaluated one, which is the invisibility the parent goal exists to
      remove.
  - path: scripts/ac_store/done_proof.py
    relationship: implements
    status: exists
    relevance: >-
      Where a descendant excused from needing its own proof is recognised today.
      The final clause requires the parent verdict to consult that same
      classification rather than reading an excused descendant as unfinished work.
assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: true
it_requirements:
  - >-
    BYTE STABILITY MEANS DO NOT OPEN THE FILE FOR WRITING, not write-the-same
    (TQ-400e-1, inherited unchanged). A YAML load-and-dump round trip reformats
    quoting, key order and line wrapping while preserving every value; at 3,146
    records that churns the whole store on every run. The consistent parent must never
    enter the write set.
  - >-
    THE CONSISTENT PARENT MUST BE REPORTED WITH ITS OWN VERDICT, NOT SKIPPED. "Looked
    at and left alone" and "never looked at" produce identical files and are
    distinguishable only in the report and the inventory. A skipped record is
    invisible, and invisibility is the condition under which the twenty bad parents
    accumulated.
  - >-
    THE EXCUSED-DESCENDANT CLAUSE MUST CONSULT THE ORACLE'S EXISTING EXEMPT
    CLASSIFICATION in scripts/ac_store/done_proof.py. A descendant the oracle already
    classifies as exempt from needing its own proof must not be counted as unfinished
    work by the parent verdict. Do not introduce a second notion of "excused" — two
    readers of the same classification drift (the EPIC-ComputedQualityGates layer-3
    disjoint-vocabulary defect).
  - >-
    THE ANTI-NO-OP PROPERTY IS A PROPERTY OF THE BEHAVIOUR, NOT ONLY OF ITS TEST. An
    implementation whose outcome application can be globally disabled, or that no-ops
    whenever any record in the store is consistent, does not satisfy this AC. This is
    TQ-400e-1's standing requirement applied to the descendant axis.
  - >-
    NEVER-CRY-WOLF IS INHERITED AND MAY NOT BE WEAKENED ON THIS AXIS. A false demotion
    of a genuinely complete parent costs more than the twenty bad records the sweep
    was built to find: it teaches every reader to discount the verdict, after which
    the whole cadence is decorative. Where the descendant verdict is uncertain the
    record is left untouched and reported, never demoted.
  - >-
    Must handle errors gracefully per the project error handling policy, and must fail
    toward NOT WRITING: if a parent's descendant verdict cannot be determined the
    record is left untouched and reported (TQ-400f-4 owns the abstention outcome).
delivers_to:
  - agent: python-coder
    ac_id: TQ-400f-2
    contract: >-
      The false-positive guarantee on the descendant axis that authorises the
      demotion: (a) the descendant verdict is the traversal's, unmodified; (b) the
      write path touches only parents whose verdict is has-unfinished-descendants, one
      record at a time, leaving every other file byte-identical; (c) every evaluated
      parent — consistent, unfinished-beneath, abstained — appears in the report.
      TQ-400f-2 may write only to records this guarantee permits writing to.
expects_from:
  - ac_id: TQ-400f-1
    contract: >-
      The descendant traversal and an explicit not-has-unfinished-descendants outcome
      for a parent all of whose descendants at every depth are finished — an explicit
      verdict value, not the absence of an entry.
  - ac_id: TQ-400f-2
    contract: >-
      A live demotion write path acting on a DIFFERENT record within the same
      invocation. Without it this AC's byte-identity clause is satisfied by a crashed
      run, a disabled write path and a run never invoked, and the control is worthless.
  - ac_id: TQ-400e-1
    contract: >-
      The byte-stability write discipline (do not open an untouched record for
      writing) and the oracle's exempt classification, both applied unchanged to this
      new axis rather than re-derived for it.
