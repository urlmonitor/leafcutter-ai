it_requirements:
  - "Changes to ticket-supervisor template must not break existing dispatch behavior for tickets without the produces trait"
  - "Must degrade gracefully if an agent's registry entry lacks the produces field (see BO-560-1-i)"
  - "Guardrail branching logic must be driven by the produces field value, not by agent ID string matching"
delivers_to:
  agent: llm-expert
  contract: "Updated ticket-supervisor template that reads the 'produces' field (string, one of: production_code | documentation | configuration | prompt | review_verdict | orchestration | test_artifact | analysis) from the work agent's entry in config/agent_registry.json at dispatch time, and branches on its value to determine which guardrail agents (test-writer, test-runner, architect-review, documentation-expert) are injected into the computed chain. Downstream ACs BO-530-1 and BO-530-2 consume this branching logic to place TDD agents."
expects_from:
