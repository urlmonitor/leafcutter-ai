notes: |
  WHY THIS RECORD EXISTS. INF-500d-3's IT PO enrichment (2026-11-16) flagged the
  cross-surface gap: the CALLER records the marker, the caller is an instruction
  surface, and INF-500d-3-iv updates only two of them. Until this record lands, the
  first scenario of INF-500d-3 holds only at the script and vocabulary level. Agents
  following these six instructions would still write the bare form.

  Locations verified 2026-11-16 in this checkout (line numbers drift; re-locate by text):
  _signoff_block.md:21-25; python-coder.md:632-634; documentation-verifier.md:697-705;
  user-surface-smoker.md:306-312; ticket-supervisor.md:554-558, :567-569, :579-581,
  :589-592, the non-blocking rule at :595-598, and the payload field at :667
  ("<fb_YYYY-MM-DD_XXXXXXXX or (submit-failed)>"); epic-supervisor.md:373.

  The shared sign-off block and python-coder name no error-stream redirect at all
  today. They cannot follow the precedence without first saving the run's error
  stream to its own per-run file (INF-500d-3-ii). The specific case of epic-supervisor,
  which actively discards the stream, is its own record: INF-500d-3-vi.

  Wrong versions this record catches:
  (1) Replacing `(submit-failed)` with one fixed reasoned value, for example always
  facility-unavailable. That is an invented reason, and the first scenario's
  writer-not-allowed line turns it red.
  (2) Reading the reason off the exit status. Several reasons share exit status 1.
  (3) Recording the failure marker when the recovery file holds an id. That
  re-files a written record and breaks INF-500d-5's exactly-once guarantee.
  (4) Updating the Comments-line instructions but leaving ticket-supervisor's payload
  field documented as bare `(submit-failed)`.

  BOUNDARY. INF-500d-3 owns the vocabulary, the marker form and the precedence. This
  record references them and redefines nothing. BO-2000a-3 (approved, done) keeps its
  undifferentiated wording, and this record does not amend it. The check-feedback-id
  hook's value-shape check is a separate change. Priority medium is inherited from
  INF-500d-3. Siblings -i..-iv carry high; the user sets final priority at the gate.

  IT PO ENRICHMENT (2026-11-16). The criteria are unchanged. Points for the reviewer:

  - CRITERIA VERSUS TEMPLATES. (a) Scenario 1's example line carries the category
    subagent-quality, but the shared block, python-coder, documentation-verifier and
    user-surface-smoker submit under complete, blocker or tooling-issue. Scenario 3
    fixes complete, but ticket-supervisor and epic-supervisor submit only under
    subagent-quality. Both examples still hold because the marker copies whatever the
    line carries. Tests should run each surface under its own category, plus at least
    one run whose line carries a category different from the command's. (b) "leaves
    the single line" means one 'submit-failed:' line, not an error file of one line:
    INF-500d-3 keeps the ERROR lines beside it. [RESOLVED 2026-11-16: the BA reworded
    scenario 1 to "exactly one `submit-failed:` line ... alongside any human-readable
    ERROR lines".] (c) documentation-verifier,
    user-surface-smoker and ticket-supervisor have no recovery (sidecar) search today,
    and the shared block and python-coder have neither a redirect nor a search, so
    scenario 2 means adding a search to five surfaces, not changing one. (d) The build
    appends the shared block to live-surface-tester as well, so that one file holds
    text owned by INF-500d-3-iv (its capture block) and by this record (the appended
    block). (e) depends_on lists INF-500d-3 and INF-500d-3-ii but not INF-500d-3-vi,
    although this record's epic-supervisor case cannot hold without it. It is recorded
    in expects_from; depends_on was left to the BA. [RESOLVED 2026-11-16: the BA added
    INF-500d-3-vi to depends_on.]
  - NOT COVERED BY THE CRITERIA. ticket-supervisor's CFCS emit contract (about :597)
    describes a secondary '--category tooling-issue' submission but prescribes no
    command for it. The criteria name four event submissions, so that fifth path has
    no marker rule. Decide whether it is in scope or removed. [RESOLVED 2026-11-16: the
    BA added a fifth scenario that removes it and requires every described submission
    to carry its command. It has an it_requirement and two test_intent entries.]
  - INF-500d-4-i STDERR LINE COUNT (read-only check, IT PO). The conflict flagged on
    INF-500d-3 is real. In unit_tests/feedback/test_inf_500d_4_i.py, _assert_refusal
    asserts len(h.stderr_lines(proc)) == 1, where h.stderr_lines is every non-blank
    stderr line. It is called for the absent declaration and for every bad-declaration
    variant (malformed JSON, zero-byte file, directory, not an object, missing keys,
    non-absolute value, stale root). INF-500d-3's exit-path map files those paths
    (_prepare_sink returning None) under destination-unwritable and adds a second
    stderr line, so those tests turn red. This is a contract conflict between
    INF-500d-3 and INF-500d-4-i, not a matter for this record. It must be escalated and
    settled in INF-500d-3's delivery. Neither test may be weakened in silence. The
    sink-line tests (:221, :256) filter by prefix and are not affected. [RESOLVED
    2026-11-16, person's gate decision: INF-500d-3's change updates INF-500d-4-i's test
    helper to count refusal lines excluding the one 'submit-failed:' line. The same
    assertion also sits in test_inf_500d_4_i_feedback_sink_rule.py; both are in
    INF-500d-3's declared_files.]
