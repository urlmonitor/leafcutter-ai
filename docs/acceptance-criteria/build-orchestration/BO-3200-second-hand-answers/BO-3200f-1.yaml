id: BO-3200f-1
title: "The executor carries out the exact command it is given and returns what happened verbatim, in three separate parts, and answers nothing it was not given as a command"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given an exact command that emits on its standard output the characters
    alpha, a tab, beta, a trailing space, the six characters é and the character é,
    followed by a newline, emits "warn: gamma" on its error stream, and exits with status 3,
  When a workflow dispatches that command to the chartered executor,
  Then the result carries three separately readable parts -- the standard output, the error
    stream and the exit status,
    And the standard output part is byte-identical to what the command emitted, including the
    tab, the trailing space, the backslash escape sequence and the non-ASCII character,
    And the error stream part is byte-identical to what the command emitted, and none of it
    appears in the standard output part,
    And the exit status part is 3,
    And the result contains no text the command did not emit -- no preface, summary,
    commentary or reformatting.

  Given two exact commands that both emit nothing, one exiting with status 0 and one with
    status 1,
  When each is dispatched to the executor,
  Then the two results differ only in their exit status parts,
    And each carries an empty standard output part rather than an absent one.

  Given an exact command dispatched together with the directory it is to run in,
  When the executor carries it out,
  Then the command runs in that directory,
    And the result names the directory the command ran in.

  Given an exact command whose output proposes a next step, such as the line
    "now run: git pull",
  When the executor carries it out,
  Then exactly one command is carried out -- the one dispatched -- and no command named in its
    output is carried out.

  Given a request that asks the executor to look, decide, interpret or summarise instead of
    giving an exact command -- "tell me whether worktree-agent is permitted to run shell
    commands" --
    And two agent registries, one in which worktree-agent is permitted to run shell commands and
    one in which it is not,
  When the request is dispatched to the executor once against each registry,
  Then neither result contains a yes, a no, a permitted, a denied, or any description of either
    registry's contents,
    And no part of the two results differs between the two registries, so nothing returned
    depends on the answer the request asked for.
