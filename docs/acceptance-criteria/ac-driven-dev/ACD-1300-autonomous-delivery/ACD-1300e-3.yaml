it_requirements:
  - >-
    Executor (amended 2026-11-04 by it-po, run pf-entry-pause-20261104, following ADR-070 sec. 2.3
    and the person's decision for that run): shell-runner is the executor for every pause-record
    operation: the write (pause-persist), its read-back (pause-persist-verify), the look-up
    (peek-pause-record), the resume read (read-pause-record), the clear (clear-pause-record), its
    read-back (clear-pause-record-verify) and every other read of the pause store, such as the
    leftover-record scan (orphan-scan-pause-record). This replaces the 2026-10-16 choice of
    command-step-runner, which ADR-070 sec. 2.2 keeps for the fast lane's own command steps.
    worktree-agent (create and remove only), status-checker (permits_shell false) and
    command-step-runner perform none of them.
  - >-
    shell-runner meets the first outcome clause without a charter change: its declared role is to
    run one given command unchanged and relay its output, and it is the executor ADR-070 names for
    every workflow shell step outside the fast lane, which covers each pause-record step by class.
    Its registry entry already has permits_shell true and lists plan-feature.js in spawned_by. No
    agent template or registry entry is edited (ADR-070 sec. 3): templates/agents/shell-runner.md,
    templates/agents/command-step-runner.md and config/agent_registry.json stay as they are.
  - >-
    One executor id for every pause-record site, named once in the workflow body: the
    per-function _shellPermittedAgentId = 'worktree-agent' locals and the hard-coded agentType in
    readPauseRecordWithRetry() are removed, not duplicated.
  - >-
    Request shape (ADR-070 sec. 1.2-1.3): one plain command with absolute paths, sent with only the
    instruction to run it unchanged and relay its output verbatim. The command's form and the
    store and script locations are specified in ACD-1300e-3-ii, and the record's carriage in
    ACD-1300e-3-iii.
  - >-
    Replies: every reply passes the shared shellStepReply() check
    (templates/workflows-js/_shared/workspace-answer.js) before any field is used. A result is
    {command, exit_status, stdout, stderr}, and the pause-store JSON is parsed from its stdout. A
    decline is {declined: true, agent, reason} with no exit_status key and is reported as a
    decline naming the agent and its reason, distinct from a store-write failure (non-zero
    exit_status, stderr carried). Neither is ever reported as success.
  - >-
    pause_persist_failed is returned if and only if the read-back finds no record (ACD-2100a-4); its
    message names the cause (ACD-1300e-3-iv).
  - >-
    The E2 workflow body has no filesystem or process access (ADR-030, ADR-024): every disk read or
    write it needs for a pause record is one command dispatched to shell-runner, and the caller
    parses the relayed stdout itself.
  - >-
    The existing pin unit_tests/workflows/test_bo_2300a_1_ii.py, which asserts worktree-agent for
    these dispatches, is amended in the same change to assert shell-runner; BO-2300a-1-ii is
    superseded by this record for that part, and its status-checker exclusion is kept.
  - >-
    Out of scope: the stage-end script steps (rule check, test design, approval holds, hand-back
    findings), which keep scriptStepAgentId
    (tickets/00_inbox/TICKET-20261021-PlanFeatureScriptStepsToShellRunner.md); the pause-store
    dispatches in finalize-feature.js; the worktree-setup-script lookup and the other shell
    dispatches listed in KI-BO-20260927; the run-ownership read of ACD-1300e-1.
  - >-
    File-size ratchet: templates/workflows-js/plan-feature.js measures 2375 lines under
    scripts/commit_guardian/_file_size_ratchet.count_content_lines ('.js') at 927934e33, against a
    1000-line limit. check-file-size accepts the change only if the new measured length is at most
    2375 minus the measured lines the change puts in; a changed line counts as put in and comments
    are not measured, so every measured line added must be paid for by about two removed. New
    logic goes to Python under scripts/ (each file under the 400-line .py limit) or is paid for by
    consolidating the duplicated pause-store dispatch code (pauseAtGate, readPauseRecordWithRetry,
    resolveGate's clear, peekPausedGateId).
  - >-
    templates/workflows-js/plan-feature.js is the source; .claude/workflows/plan-feature.js is
    rebuilt by python scripts/build.py in the same change and is never hand-edited.
  - >-
    Errors handled per the CLAUDE.md error-handling policy: no silent fallback; every degraded path
    logs a [plan-feature][WARNING] line naming the run id, the gate id and the failing step.
test_intent:
  - clause: >-
      each is performed either by a fixed command step that involves no agent or by an agent whose declared role explicitly includes reading and writing pause records
    needs_test: true
    reason: The executor is a value in each of six dispatches, and one site left on the old agent changes nothing else a reader would see.
  - clause: >-
      none of them is given to an agent whose declared role is limited to other work (creating and removing worktrees, or investigating ticket state)
    needs_test: true
    reason: A hard-coded worktree-agent at one site is the recorded defect, and only the run's dispatch record shows it.
  - clause: >-
      the pause ends with the run reported as waiting and the record present on disk, never ended as "pause persist failed" because the step that should have written the record declined it as outside its role
    needs_test: true
    reason: The outcome depends on the executor, the command and the read-back together, so only a run that pauses shows it.
  - clause: the resume reads that record and applies the person's answer as ACD-2100c-3 requires
    needs_test: true
    reason: The resume read now parses the record from the relayed stdout, which a wrong parse breaks while the pause still succeeds.
  - clause: >-
      the bug symptom ("on runs gpt-flow-step-links and fast-lane-test-gates, 2026-10-15/16, the pause record write was handed to the worktree agent, whose role is only worktree create/remove; it refused, every pause ended pause_persist_failed and the run could not be resumed at all") must not occur
    needs_test: true
    reason: This is the recorded failure, and it returns if any pause-record step goes back to worktree-agent.
test_spec:
  - name: test_every_pause_record_op_dispatched_to_chartered_executor
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Across a pause and a resume, every dispatch labelled pause-persist, pause-persist-verify, peek-pause-record, read-pause-record, clear-pause-record, clear-pause-record-verify has agentType command-step-runner."
    proves_clause: "Then each is performed either by a fixed command step that involves no agent or by an agent whose declared role explicitly includes reading and writing pause records,"
    must_catch:
      - "one site (e.g. the clear in resolveGate) still hard-codes worktree-agent"
      - "the read-back retry path uses a different executor than the first attempt"
  - name: test_no_pause_record_op_given_to_worktree_or_status_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "No pause-record dispatch has agentType worktree-agent or status-checker."
    proves_clause: "And none of them is given to an agent whose declared role is limited to other work (creating and removing worktrees, or investigating ticket state),"
  - name: test_executor_registry_charter_names_pause_record_work
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "In config/agent_registry.json and .leafcutter/config/agent_registry.json, command-step-runner has permits_shell true, spawned_by contains plan-feature.js, and its description names pause-record reads and writes."
  - name: test_headless_pause_ends_waiting_with_record_on_disk
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "With a stub command-step-runner that runs the real pause_store.py against a temp store, a headless gate returns paused_awaiting_input and paused_runs/<R>.json exists."
    proves_clause: "And the pause ends with the run reported as waiting and the record present on disk, never ended as \"pause persist failed\" because the step that should have written the record declined it as outside its role,"
  - name: test_resume_reads_record_and_applies_answer
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "A follow-up invocation with a person answer for the named gate reads the record through the executor's stdout and applies the answer (ACD-2100c-3)."
    proves_clause: "And the resume reads that record and applies the person's answer as ACD-2100c-3 requires,"
  - name: test_worktree_agent_refusal_symptom_does_not_recur
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: discrimination
    description: "With worktree-agent stubbed to decline every pause-store request (the gpt-flow-step-links / fast-lane-test-gates condition), the pause still ends paused_awaiting_input and is resumable."
    proves_clause: "And the bug symptom (\"on runs gpt-flow-step-links and fast-lane-test-gates, 2026-10-15/16, the pause record write was handed to the worktree agent, whose role is only worktree create/remove; it refused, every pause ended pause_persist_failed and the run could not be resumed at all\") must not occur."
    must_catch:
      - "pause write still dispatched to worktree-agent"
  - name: test_decline_reply_reported_as_decline_not_success
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "A command-step-runner decline (no exit_status key) on the write yields pause_persist_failed whose message names the decline, not a store fault."
  - name: test_deployed_workflow_pause_uses_command_step_runner
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    description: "The deployed .claude/workflows/plan-feature.js run headless through the E2 harness dispatches its pause write to command-step-runner and returns paused_awaiting_input."
    surface_invoked: ".claude/workflows/plan-feature.js (deployed build output), driven through unit_tests/_workflow_engine_harness.py run_workflow_under_e2"
test_rationale: "The real-world failure was an LLM agent refusing by charter, which a stub harness cannot reproduce; the deterministic proof is (a) every pause-record dispatch names one executor whose registry charter covers the work (real_artifact on the registry) and (b) the body reaches a resumable pause through the deployed workflow. The amended BO-2300a-1-ii pin must not stay green on the old executor."
