    relevance: "sibling gate — the missing-artifact verdict must be shared, otherwise an absence caught by one gate and ignored by the other reproduces the ambiguity BP-100k-3 removed"
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    drift_gate_missing_output_verdict:
      type: object
      description: "Fifth per-artifact verdict — recorded-but-absent — added alongside compared-and-matched, compared-and-drifted, declared-exempt and could-not-compare, counted in the run summary and affecting the exit status, so deleting a deployed artifact is reported rather than skipped."
  reference_file_path: "templates/scripts/commit_guardian/check_output_drift.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The missing-output condition must be a distinct verdict, not folded into the could-not-compare bucket: an artifact that was deliberately deleted and one the gate merely lacks a record for demand different remedies and must be distinguishable in the output."
    - "Both drift gates must emit the same missing-artifact verdict; a verdict honoured by one gate and ignored by its sibling reintroduces the ambiguity BP-100k-3 removed."
    - "A deliberate removal is expressed by removing the artifact from the build's records in the same change — not by teaching the gate to tolerate absences. Absence with the record still present is always a reported condition."
    - "Verify behaviorally — execute the gate as a process against a real tree from which one recorded deployed output has been deleted, and assert on the named verdict, the summary count and the exit status; do not grep the gate source or import the scanning helper."
    - "Must follow the repo error-handling policy: specific-exception try/except around file and JSON I/O, log at WARNING or higher or re-raise; no bare or blind excepts."
    - "A build.py re-run is required after editing anything under templates/; the gate runs from its deployed copy, so a template-only edit leaves the running hook unchanged."
    - "This AC and BP-100k-5 both edit check_output_drift.py and must land as one reviewable diff; they must not run concurrently."
test_spec:
  - name: test_deleted_recorded_output_is_named_and_fails_the_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Executing the gate as a process over a tree from which one recorded deployed output has been deleted names that output, states that the build recorded it, and terminates with a non-zero exit status."
  - name: test_missing_output_is_counted_in_the_run_summary
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The executed run's summary reports a non-zero count for recorded-but-absent outputs as its own figure, distinct from the compared, drifted, exempt and could-not-compare counts."
  - name: test_missing_output_is_not_counted_among_verified_outputs
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The verified count from the executed run with one output deleted is exactly one lower than the verified count from the same run with the output present — an absence is never credited as a verification."
  - name: test_run_with_a_missing_output_is_not_described_as_clean
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The executed gate does not describe a run containing a recorded-but-absent output as clean, and its exit status differs from that of a run in which every recorded output is present."
  - name: test_restoring_the_output_unchanged_returns_the_run_to_passing
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "After the deleted output is restored byte-for-byte, the executed gate reports it as matching its recorded source and exits zero — the new verdict raises no lasting false alarm."
  - name: test_both_gates_emit_the_same_missing_artifact_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Both drift gates, each executed as a process against the same deleted recorded artifact, report it as recorded-but-absent — neither tolerates an absence the other reports."
test_rationale: "The incumbent gate already prints a line for this case and then continues: the file is counted as neither verified, nor uncomparable, nor a gap, and the exit status is untouched. Deleting a deployed artifact outright — the most complete drift possible — therefore passes silently. Any test that reads the gate source, or that imports the scanning helper and inspects its return value, stays green on exactly that behaviour, and per the standing rule in CLAUDE.md ('Gate / Workflow ACs — Verify Behaviorally, Not by Grep') such a test is forbidden here and will be rejected. Each descriptor therefore deletes a real recorded output, executes the gate as a process, and asserts on the emitted verdict, the summary counts and the exit status — including a paired restore run so the new verdict is shown not to over-fire."
delivers_to:
  agent: python-coder
  contract: "A recorded-but-absent per-artifact verdict shared by both drift gates, counted in the run summary and reflected in the exit status."
expects_from:
  ac_id: BP-100k-3
  contract: "The per-artifact verdict vocabulary and run-summary counting model this AC extends with a fifth, deletion-specific verdict."
