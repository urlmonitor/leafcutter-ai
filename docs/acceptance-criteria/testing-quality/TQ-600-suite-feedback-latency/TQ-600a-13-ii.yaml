  of one run report different runner names (the fresh-machine claim, UNVERIFIED);
  (3) the heartbeat fires on schedule on a day with no merges.

  COST, STATED SO IT CAN BE WEIGHED. About ten merges a day at roughly 25 minutes each
  plus two heartbeats is about five runner-hours a day on free public-repository runners,
  one job at a time because of the coalescing, against a GitHub Free 20-concurrent-job
  cap that ci.yml's eight shards also draw on. The coalescing is what bounds it.
