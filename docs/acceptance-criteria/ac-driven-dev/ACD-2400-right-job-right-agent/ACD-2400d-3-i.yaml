risk_surface: contract_boundary
notes: |
  AUTHORED BY IT-PO. ACD-2400d-3 (llm-expert) and ACD-2400d-1-i each end with a deterministic clause
  ("not offered for approval while a finding has no recorded decision"), and ACD-2400d-3 clause 2
  needs a workflow hand-back. Both are python-coder surfaces (approval step, plan-feature.js, schema).
  A letter split of ACD-2400d-3 (d-3a/d-3b) would take ACD-2400d over the 5-L2 cap, so the
  deterministic half is this L3 instead. Its clauses restate those parents' approval-hold and
  hand-back behaviour at the approval step; no new behaviour is added. BA to review at the final gate.
