notes: |
  WHY THIS IS A SEPARATE BEHAVIOUR AND NOT A REFINEMENT OF INF-1300c-1. The L1's benefit is
  that an index stays complete without anyone remembering to maintain it — the
  documentation_rationale on INF-1300c says so in terms. An index that only ever grows is
  not maintained, it is accumulated: it duplicates every document that is ever re-listed,
  and after a handful of state changes a reader cannot tell which of three entries for the
  same document is current. That failure cannot happen on a first listing, so c-1's criteria
  cannot see it.

  FALSIFIABILITY. Start from a scratch index holding several entries. List a document, then
  list it again with a changed title. Read the index: the record is falsified by a second
  entry for that place, by the change not appearing, or by any other entry differing by so
  much as a character. Then list twice with nothing changed and compare the index against
  itself between the two runs — falsified if the file differs at all, including in
  whitespace or ordering, because an index that churns on a no-op change makes every
  unrelated commit look like an index edit and trains reviewers to stop reading it. The
  byte-for-byte comparison of the untouched entries is the arm with teeth: an implementation
  that reads the index, re-derives it and writes it back satisfies every other clause here
  while quietly reformatting entries nobody asked it to touch, and only an exact comparison
  can see that.

  THE LAST CLAUSE IS DELIBERATELY WEAK AND THAT IS THE POINT. An entry pointing at a document
  that has moved must not be silently wrong, but this record does not require the index to
  chase documents around the collection — nothing in this tree produces a move, and a
  requirement to detect one would either be unimplementable from a production step or would
  pull drift detection inside the L0's fence, which its scope statement forbids. What is
  required is only that such an entry is visible as broken rather than reading as sound.

