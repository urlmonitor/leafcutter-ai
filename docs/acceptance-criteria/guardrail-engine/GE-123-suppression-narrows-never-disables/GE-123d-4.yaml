notes: |
  THE PRODUCT-OWNER'S FRAMING CONSTRAINT IS THE WHOLE POINT OF THIS AC: state
  the boundary as a positive rule about where the exemption applies, not as a
  list of what it excludes, so a new location does not silently inherit it. The
  first three scenarios therefore each fail for the SAME reason — absence from
  the list — rather than for three different reasons about the nature of source,
  documentation and configuration. An implementation that special-cases three
  excluded directories satisfies the letter of these scenarios and fails their
  intent; the fourth scenario, mixing all four files in one staged set, is the
  one that makes the per-file decision visible.

  THE HOW-TO AREA IS DELIBERATELY OUTSIDE THE LIST, and this is a decision, not
  an omission. A how-to is non-executing text and has the same claim to the
  exemption as a retrospective. It is excluded because none of the three
  observed blocks occurred there, and because the conservative reading of the
  product-owner's instruction is that a location earns its place on the list by
  a demonstrated cost, not by resembling a location already on it. Adding the
  how-to area later is a one-line, deliberate change with this reasoning to
  argue against.

  THE RESIDUAL COST, NAMED. The third of the three observed blocks was a code
  comment in a source file, and this AC confirms it is still blocked. That is
  intentional: the exemption must not reach source. The relief for that case
  comes from GE-123d-1 instead — the file-reference value shape, which applies
  in every file and covers the specific self-referential sentence that caused
  it. A prose sentence in source whose value is NOT a file reference remains
  blocked, and the remedy there stays what it is today: reword the sentence, or
  add an explicit suppression entry for that line.

  VERIFICATION STANDARD (inherited from the L0): the fourth scenario must be
  exercised through the pre-commit secrets check with four real files staged
  together, because it is the only one that can distinguish a per-file decision
  from a per-run one.

  IT-PO NOTE, 2026-08-18, on making the framing constraint checkable. The notes
  above correctly identify that a three-directory deny list satisfies the letter
  of the first three scenarios. Prose alone cannot stop that, so the constraint
  is now expressed two ways a reviewer can act on: as a cost invariant in
  it_requirements — adding a sixth prose location must cost exactly one list
  edit and no exclusion edit — and as a fifth test_spec entry that reports a
  file in a directory named nothing like any prose location and nothing like any
  of the three excluded areas. A deny-list implementation passes the first three
  entries and fails the fifth.
