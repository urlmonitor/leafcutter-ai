title: "The tree that forced the bypass commits cleanly with no bypass"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200a.yaml
criteria: |
  Given the seven KM-200 records exactly as they exist on disk in the store —
    KM-200.yaml plus KM-200a.yaml through KM-200f.yaml, not a hand-authored
    fixture — with the parked marker and a reason added to KM-200.yaml only,
  And those seven paths staged for commit,
  When the parent-back-link check is executed as a process in a fresh process
    against exactly those staged paths, with no SKIP variable set and no hook
    bypass of any kind,
  Then the process exits 0,
  And the same execution over the same seven on-disk files with the parked
    marker removed from KM-200.yaml exits non-zero and reports six violations,
    naming KM-200a through KM-200f,
  And the difference between the two runs is the marker alone, so the passing
    run is attributable to recognition of the parked state and not to the check
    having stopped running.
depends_on:
  - ACS-1200a
  - ACS-1200a-1
  - ACS-1200a-2
