id: BO-3000b
title: "A phase reply missing `status` is rejected for the missing status alone, never with a handoff_target demand that points the retrying agent at the wrong field"
component: build-orchestration
components:
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target:
  - code
  - pipeline
risk_surface: contract_boundary
criteria: |
  Given templates/workflows-js/build-feature.js declares PHASE_RESULT_SCHEMA with a
    top-level `required: ["status"]` and a conditional that requires
    `handoff_target` when `status` is `"handoff"` (BO-3000a)
  And a phase agent returns a reply that carries no `status` field at all — for
    example because it wrapped its whole reply inside a single `input` string field
  When that reply is validated against PHASE_RESULT_SCHEMA
  Then the reply is rejected
  And the only requirement it fails is the missing `status`
  And the validation errors contain no demand for `handoff_target` and no failure of
    the conditional's `then` branch, so the retrying agent is pointed at the field
    that is actually missing
  And the bug symptom ("When a phase agent's reply is missing `status` (for example
    because it wrapped its whole reply inside a single `input` string field), schema
    validation reports 'must have required property handoff_target' and 'must match
    "then" schema' alongside the missing status. The retrying agent follows that
    message: in run wf_e1f3e873-096 on 2026-09-25, documentation-expert added
    handoff_target on retries 3 and 5 instead of removing the wrapper, exhausted the
    5-retry cap, and halted the epic drive with its work already done.") must not
    occur.

  Given the same schema
  When a reply with `status: "handoff"` and no `handoff_target` is validated
  Then it is still rejected for the missing `handoff_target`, exactly as BO-3000a
    requires
  And a reply with `status: "handoff"` and a `handoff_target` is still accepted.

  Given every reply that PHASE_RESULT_SCHEMA accepts today — any valid non-handoff
    status with or without `handoff_target`, and a handoff reply naming its target
  When the conditional is narrowed so it applies only when `status` is present and
    equals `"handoff"`
  Then each of those replies is still accepted.

  Given the declared twin templates/workflows-js/build-ticket.js carries the
    identical PHASE_RESULT_SCHEMA conditional
  When this record is verified
  Then every case above holds for build-ticket.js's schema as well, so the two
    drivers cannot diverge on how a status-less reply is reported.
