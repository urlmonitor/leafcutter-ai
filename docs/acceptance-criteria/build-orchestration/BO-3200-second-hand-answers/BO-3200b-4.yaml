it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert — the same rule applied to every documentation child in these two trees."
  - "THE OUTCOME BEING READ MUST BE ITS OWN INTERACTION. In the arrangement this replaces, the release was dispatched and the diagram would have looked complete; the missing element was a return arrow nobody consumed, which is invisible unless it is drawn. A diagram that stops at 'release performed' reproduces exactly the belief that let KI-BO-020 survive."
  - "THE STORE MUST BE DRAWN AS ONE THAT OUTLIVES THE RUN, distinct from the run's own scratch state. The observed harmlessness came entirely from the claim landing in a throwaway copy; a diagram that does not distinguish the two teaches the reader the accident rather than the rule."
  - "NO PARTY THAT EXERCISES JUDGEMENT MAY PERFORM OR DECIDE THE RELEASE, as a declared property of the drawing, so it cannot be redrawn later into the shape this tree removed. The machine-readable declaration gives every participant a role -- guaranteeing layer, chartered executor, specialist, outliving store, halt report. Where the release is carried out through the executor, the interaction is declared as initiated by the guaranteeing layer with the executor carrying out the exact release command on its behalf, and it MUST be drawn: hiding the executor dispatch fails. No specialist is declared as the performer of the release, and no interaction is a dispatch asking a specialist to decide or interpret the release -- whether to release, what to release or how."
  - "BOTH the triggering failure AND the release outcome must appear as reaching the halt report, as two distinct contributions — that pairing is BO-3200b-2's whole content and is the thing a reader comes to this diagram for."
  - "The coherence claim must be enforced by an executable test comparing the diagram's declared interaction sequence, in order and in both directions, against the trace of a REAL run driven to a failure after the claim."
  - "The diagram page must declare its participants and ordered interactions in a machine-readable form so the coherence test reads data, not a picture."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
  - "WHO IS THE EXECUTOR IS READ, NEVER RETYPED. The drawing's executor participant and the coherence test's classification of each dispatch in the real run take the executor's identity from its registry entry (BO-3200f-2) and the addressee recorded for the dispatch, never from a name typed into the diagram test or a match on prompt wording."
  - "THE NO-DECIDE-OR-INTERPRET CLAUSE IS CHECKED ON BOTH SIDES. On the drawing, from the declared interactions; on the real run, from its dispatch record -- every dispatch made while releasing, with its addressee and whether it carried an exact command. A release dispatch addressed to any party other than the executor, or one carrying no exact command, fails the clause even when the claim ends up released."
delivers_to: null
expects_from:
  - ac_id: BO-3200b-1
    contract: "The ordered failure-path trace of a real run, obtainable programmatically: claim recorded in the outliving store, later step fails, release carried out by the guaranteeing layer -- through exact-command dispatches to the chartered executor via BO-3200f-1's helper, or with no dispatch -- the per-item release outcome produced and read, halt reported; with every dispatch made while releasing recorded as {addressed_to: str, exact_command: bool, outcome: str}."
  - ac_id: BO-3200f-1
    contract: "The harness stand-in that answers executor dispatches through the real capture and fails every other dispatch immediately, used to drive the coherence run; and the dispatch helper's recorded addressee, which together with the executor's registry entry (BO-3200f-2) lets the trace tell an executor dispatch from a specialist dispatch."
  - ac_id: BO-3200b-2
    contract: "The halt payload carrying both the triggering failure and the required-action outcome, so the diagram's final interactions can be checked against what the report actually contains."
test_spec:
  - name: test_bo_3200b_4_diagram_declares_the_full_ordered_failure_path
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Parse the declared sequence and assert it contains, in order: claim recorded in the outliving store, later step fails, release performed by the guaranteeing layer, release outcome read as its own interaction, and both facts reaching the halt report; and that where the release goes through the executor, the declaration carries that dispatch as initiated by the guaranteeing layer with the executor carrying out the exact release command -- a declaration that omits the executor dispatch fails."
  - name: test_bo_3200b_4_no_specialist_performs_the_release_in_the_drawing
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Classify each declared participant from the real registry (the executor entry from BO-3200f-2 is not a specialist) and assert no declared interaction has a specialist as the performer of the release. A planted copy that draws the executor dispatch as a specialist performing the release, and one that draws a specialist performing it, both fail. Keeps the drawing from being redrawn into the arrangement this tree removed."
  - name: test_bo_3200b_4_diagram_matches_a_real_failure_run
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "THE COHERENCE CHECK. Drive the real lane under BO-3200f-1's harness stand-in to a failure after the claim, so the release takes its executor-dispatching path; capture the ordered trace and assert two-way ordered equality with the diagram's declared interactions -- including that the outcome-read interaction and the executor release dispatch actually occurred."
  - name: test_bo_3200b_4_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
  - name: test_bo_3200b_4_no_dispatch_asks_a_specialist_to_decide_or_interpret_the_release
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: failure
    description: "Assert over the diagram's declared interactions and over the real failure run's dispatch record that no release dispatch is addressed to a party other than the executor or carries anything but an exact command. Negative controls: a run whose release first asks a specialist whether to release and then falls back to the executor fails even though the claim ends up released; a declared interaction asking a specialist what to release fails. A run whose only release dispatch is the exact release command to the executor passes."
test_rationale: |
  The element that matters here is a return arrow that used to exist and was never consumed —
  a thing no reviewer notices, because a diagram missing it looks complete. So the coherence test
  compares the declared sequence against a real failure run and specifically requires the
  outcome-read interaction to have occurred, rather than trusting that the drawing is accurate
  because it is plausible.
  The executor dispatch is the second thing a diagram can hide: drawn as the layer "releasing"
  with no dispatch, it looks tidier and misstates the only buildable design. So the ordered-path
  test requires the dispatch to be declared, the coherence run takes the executor-dispatching
  path, and classifying the executor as not a specialist is read from the registry rather than
  assumed.
  The no-decide-or-interpret test is separate because its failure shape passes every other test:
  a release that asks a specialist first and falls back to the executor releases the claim, draws
  cleanly and matches a run -- only the dispatch record shows the judgement request.
  Deliberately NOT covered: layout and legibility, which are human judgement.
