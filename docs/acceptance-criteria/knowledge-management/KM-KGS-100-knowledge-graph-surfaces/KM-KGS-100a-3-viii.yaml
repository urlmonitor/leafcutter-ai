title: "Relationship reading is proven against real store records, not a hand-built dictionary"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100a-3.yaml"
criteria: |
  Given the acceptance-criteria store on disk contains records declaring their
    implemented_by and covered_by fields in every form the store actually uses —
    column-zero and indented block lists, quoted and unquoted items, test-function
    suffixes and symbol anchors
  When the automated checks for acceptance-criterion relationship reading run
  Then those checks obtain the field values by reading real acceptance-criterion
    files from the store through the same file-reading entry point the knowledge
    map itself uses
  And no check in the group substitutes a pre-built field dictionary for that
    reading step
  And the set of real records exercised covers each of the declared forms listed
    above, with at least one record per form
  And for every record exercised, the values obtained match the values an
    independent reference reader obtains from the same bytes
  And the check group reports a failure whenever those two disagree on any record
