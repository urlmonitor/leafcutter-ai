notes: |
  THE SURFACE IS SETTLED — `data-ac`, space-separated for multiple criteria.
  Not relitigated here; the rejected alternative (a CSS class) is stated as a
  negative in GE-124b-1-i so that the reason survives as a test rather than as
  prose someone can overlook.

  OPTIONAL IS A BEHAVIOUR, NOT AN ABSENCE OF ONE — the third scenario is the
  testable form of "nothing requires an element-level pin". Without it, an
  implementation that reports "component declared but nothing pinned" would
  satisfy every other AC in this L1 while making the optional pin compulsory.

  Line number and verbatim opening tag are recorded because the reviewer-facing
  finding has to point at a place in a file; a pin known only as "somewhere in
  this component" cannot be argued with.

  IT-PO ENRICHMENT NOTE (2026-08-25). Two grammars coexist in this tree and the
  difference is deliberate: the @ac comment line tolerates commas (GE-124a-1),
  the data-ac attribute value does not, because the CSS attribute-membership
  operator `~=` that GE-124f-3's selector relies on splits on whitespace only.
  A comma inside a data-ac value would produce a selector that matches nothing.
