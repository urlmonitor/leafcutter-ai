title: "The whole requirements store is re-checked when changes land on the protected branch"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the continuous-integration configuration for the repository,
  When a change lands on the protected main branch,
  Then the acceptance-criteria check runs over every record in the requirements
    store — not only over the records the landing change touched — applying the
    same structural and schema rules it applies before merge,
  And it reports a failing result when any record in the store breaks a rule,
  And it reports a passing result only when the whole store satisfies every
    rule,
  And a problem that no single pull request introduced is caught here — for
    example two pull requests that are each individually valid but that
    together push one parent over its child limit, or that together close a
    dependency cycle, or where one retires a record the other has just started
    depending on.
