it_requirements: |
  Commit on the authoring branch via the commit agent after each approved stage.
  Stage boundaries are the existing PO -> BA -> IT-PO gates in /create-ac and the
  equivalent gates in /plan-feature. Commits land on the isolated branch, never main.
