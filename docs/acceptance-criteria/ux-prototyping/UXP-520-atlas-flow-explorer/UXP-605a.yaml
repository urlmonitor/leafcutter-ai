title: "The 'Show ACs in graph' preference persists across reload and navigation"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: in_progress
criteria: |
  Given the person has set the "Show ACs in graph" toggle on (or off),
  When they reload the /flows view or navigate away and back,
  Then the toggle returns to its last-set state from the persisted view preference,
  And the preference is applied without any sign-in, role, or identity check.
