id: ACS-1300b-1
components:
  - ac_store
  - build_orchestration
title: "The delivery paths that can finish work without recording the link are enumerated from the repository"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the repository as committed, in which some delivery paths reach the step that
    records the link between a requirement and the test that proves it, and others carry
    work to completion without ever reaching that step,
  When the enumeration is produced,
  Then it names every delivery path that can carry work to completion, and classifies
    each one as reaching the link-recording step, bypassing it, or exempt with a stated
    reason,
  And the classification of each path is derived by reading the repository, so adding a
    new delivery path to the repository makes that path appear in the enumeration on the
    next run with no edit to the enumeration itself,
  And removing the hand-off to the link-recording step from a path currently classified
    as reaching it changes that path's classification on the next run, so the
    classification tracks the repository rather than restating a list someone typed,
  And the enumeration states how many delivery paths it examined and what it excluded,
    so a run that found few bypassing paths is distinguishable from a run that looked at
    few paths,
  And the enumeration names no fixed expected number of paths, so it is neither
    satisfied nor falsified by the count happening to match.
depends_on:
  - ACS-1300b
