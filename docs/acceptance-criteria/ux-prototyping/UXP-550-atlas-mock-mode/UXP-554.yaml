id: UXP-554
readiness: draft
priority: medium
title: "A drift guard validates fixtures against real schemas and parses each through its native-format loader in CI"
component: ux-prototyping
components:
  - ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the bundled fixture repo under leafcutter-web/fixtures/,
  When CI runs the drift guard,
  Then every fixture artifact is validated against the SAME schemas that govern the real
  data (the AC store schema, the product-truth schemas, and the components.json /
  roadmap.json / agent_registry.json shapes),
  And every fixture artifact is parsed through the SAME Atlas loader for its native format
  (YAML for the AC store, markdown for tickets, JSON for roadmap / components /
  agent_registry / product-truth) that parses the real data, so the mock output is
  shape-identical to the real output,
  And CI fails the build when any fixture is schema-invalid or fails to parse through its
  native-format loader,
  So mock data can never silently drift from the real shape.
depends_on:
  - UXP-593
