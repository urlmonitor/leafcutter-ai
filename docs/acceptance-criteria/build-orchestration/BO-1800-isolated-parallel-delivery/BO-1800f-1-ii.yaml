notes: |
  Why the copy must be restored rather than left mid-replay. A copy abandoned
  part-way through a replay holds neither the state it started in nor the state it
  was heading for, and the repair is performed under time pressure by whoever finds
  it. CLAUDE.md records that the intuitive repair command in exactly that situation
  takes content from the pre-replay side and silently discards the shared branch's
  side of the affected paths -- the same 42-line loss this tree exists to prevent,
  arrived at from the other direction. Leaving no mid-replay state to repair removes
  the occasion for that mistake.

  Why the run must not resolve the overlap itself. An automatic resolution is the
  documented origin of the bad-replay case that BO-1800f-2 is scoped to catch. This
  record keeps the two apart: a replay either completes without a decision or it
  stops and asks for one.

  Falsifiability. The fixture arranges a genuine overlapping edit between the copy
  and the shared branch's advanced state. The assertions are observable on the copy
  afterwards -- its commit set equals the pre-replay set, no tracked file contains
  conflict markers, and nothing reached the shared branch -- so an implementation
  that leaves a half-applied replay fails on the first two even if it correctly
  refuses to deliver.
