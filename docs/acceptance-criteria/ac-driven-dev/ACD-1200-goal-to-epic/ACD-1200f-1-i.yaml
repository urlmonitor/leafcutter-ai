criteria: |
  Given the AC store contains:
    - ACD-050 (level: L0, covered_by: [ACD-050a, ACD-050b])
    - ACD-050a (level: L1, covered_by: [ACD-050a-1, ACD-050a-2])
      - ACD-050a-1 (level: L2)
      - ACD-050a-2 (level: L2)
    - ACD-050b (level: L1, covered_by: [ACD-050b-1])
      - ACD-050b-1 (level: L2)
  When /build-ac is invoked with --ac ACD-050a (the L1, not the L0),
  Then the system collects only ACD-050a-1 and ACD-050a-2
  And it does NOT include ACD-050b-1 (which is under a sibling L1)
  And the generated epic contains exactly 2 tickets.
