it_requirements:
  - "ENRICHMENT DECISION, AMENDED — adr_refs.py must NOT import
    scripts/commit_guardian/_resolve_root.py, and must NOT carry its own implementation
    of the resolution order either. The first half of this is unchanged and the reason is
    unchanged: scripts/commit_guardian/ is an UNTRACKED build output (git ls-files returns
    nothing for it, verified 2026-10-09), a fresh clone does not have it until build.py has
    run, and importing it would make a tracked repository script depend on a build artifact
    and fail outright on a clean checkout. The second half CORRECTS this record's first
    enrichment pass, which concluded from that premise that a second implementation under
    scripts/ was therefore necessary. It is not, and a second implementation is now
    forbidden — see the next requirement."
  - "WHAT IT IMPORTS INSTEAD — THE TRACKED SOURCE, THROUGH THE PROJECT'S EXISTING LOADER.
    scripts/adr_refs.py must obtain the shared resolver by calling
    load_commit_guardian_module('<resolver-module-stem>') from
    scripts/commit_guardian_module_loader.py — a bare sibling import, the same shape
    adr_refs.py already uses for adr_index_frontmatter. That loader tries the git-TRACKED
    templates/scripts/commit_guardian/<name>.py FIRST and the untracked deployed copy only
    as a fallback, and raises ImportError naming both paths when neither resolves. So the
    tracked source — not the build output — is what a fresh clone executes, which is
    exactly the property the premise above required, and the module executed is the SAME
    file the deployed hook executes. The single-source-of-truth requirement and the
    evidence that this loader is reachable from both sides are stated once in the parent
    L1; implement that, and add no second copy of the order here."
  - "The loader is the sanctioned mechanism rather than an improvisation: it is tracked,
    it already has two tracked callers solving this exact problem
    (scripts/registry_validator.py, scripts/spawn_bidirectionality_validator.py), it has a
    regression test at unit_tests/test_inf_600k_1_regressions.py, and its own docstring
    records that it exists because a sys.path insert of the gitignored build output raised
    ModuleNotFoundError on a fresh clone and was silently swallowed by a broad
    except ImportError. Do not reach for a sys.path insert here; that is the defect the
    loader was written to end."
  - "WHATEVER adr_refs.py GAINS MUST NOT MAKE IT LONGER. It measures 576 lines against
    the 400-line .py limit (measured 2026-10-09 with check_file_size's own measurement
    rule) — already 176 over, grandfathered only by the GE-127b-1 growth ratchet, so ANY
    commit that leaves it longer than it found it is refused at commit time.
    adr_index_frontmatter.py's own module docstring records this constraint as the reason
    it exists. Routing through the shared resolver helps rather than hurts here: the import
    plus the call replace the body of the existing _repo_root(), so the net change can be a
    REDUCTION. Verify that with the gate's own measurement before committing — do not
    assume it, and do not solve a shortfall by adding a second local implementation, which
    this record now forbids."
  - "The existing _repo_root() at line 162 is the defect site and must stop falling back
    to the directory it was asked from. Its current except branch prints a warning and
    returns `start`, which is precisely the silent substitution GE-118g-3 forbids — the
    warning goes to stderr and the walk proceeds against the wrong tree."
  - "--root must keep working and must outrank every other anchor when supplied, because
    both of this subtree's sibling records' harnesses depend on being able to point the
    tool at a throwaway checkout."
  - "No deploy-map entry is required for this record: scripts/adr_refs.py is not deployed
    to consumers by any build phase (verified 2026-10-09 — no build script references it),
    and the shared resolver it imports lives under templates/scripts/commit_guardian/,
    which build_commit_guardian() in scripts/build_phases_lifecycle.py deploys WHOLESALE by
    rglobbing the directory. Confirm both still hold before implementing."
  - "NO DURATION CLAUSE. Do not add a timeout, a progress indicator, or any speed work.
    The parent records why: with the repository named the audit completes in 5.0s, and
    the defect is which tree is walked. A faster wide walk satisfies nothing here."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_claimed_set_excludes_sibling_checkouts_when_run_from_their_parent
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: scripts/adr_refs.py
    description: >-
      Arm 1. A directory that is not a work tree holding the repository under test plus
      several sibling checkouts, each with ADR files claiming numbers of its own. Invoke
      the audit by ABSOLUTE path — the form the shell convention mandates, and the form
      that leaves the scan root at its default — with cwd set to that parent and no
      --root. Assert the claimed set equals the repository's own, and separately assert
      that no path outside the repository appears anywhere in the output. Two assertions,
      because a correct set can still be reported alongside leaked paths. No build.py
      spawn, no layout fixture, so no marker.
    must_catch:
      - "restore the working-directory default for the scan root"
      - "verify only from the repository root, where a working-directory default is indistinguishable from the fix"
  - name: test_named_root_and_default_root_report_the_same_sets
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 2 as an equality between two runs — once with --root naming the repository,
      once from the sibling-holding parent with no --root — asserting both the claimed
      and the unclaimed sets match. This is what makes the published bare command usable,
      and it is stated as a pairing because this arm passes against the defect whenever
      it is run from the repository root. No marker.
    must_catch:
      - "restore the working-directory default for the scan root"
  - name: test_claimed_set_grows_by_a_record_added_inside_the_repository
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 3. Add an ADR claiming a previously unclaimed number INSIDE the repository,
      re-run from the sibling-holding parent, and assert the claimed set is larger by
      exactly that number and the unclaimed set no longer offers it. The only arm a
      hardcoded claimed set fails. No marker.
    must_catch:
      - "return the claimed set observed at implementation time instead of reading the repository"
  - name: test_claimed_set_unchanged_by_a_record_added_to_a_sibling_checkout
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 4, the anti-working-directory clause and the load-bearing one. Add an ADR
      claiming a previously unclaimed number to a SIBLING checkout and to no file inside
      the repository; re-run from the parent. Assert the claimed set is byte-identical to
      the previous run's and the unclaimed set still offers that number. A single-tree
      harness cannot express this arm, so the sibling population is not optional
      scaffolding. No marker.
    must_catch:
      - "restore the working-directory default for the scan root"
      - "union the named root's contents with the working directory's"
  - name: test_audit_from_a_fresh_clone_with_no_build_outputs_present
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: scripts/adr_refs.py
    description: >-
      The import-boundary arm, which exists because of this record's first two
      it_requirements. Run the audit in a checkout containing only git-TRACKED files — no
      scripts/commit_guardian/, no .leafcutter/, no build output of any kind — and assert
      it resolves its repository and reports a claimed set rather than raising ImportError
      or ModuleNotFoundError. This is the entry that proves the shared resolver is reached
      through the loader's TRACKED-source-first path rather than across the build boundary.
      It is the fresh-clone condition that commit_guardian_module_loader.py's own docstring
      records as the failure it was written to end, so the fixture must contain genuinely
      only tracked files — a tree that happens to retain a stale scripts/commit_guardian/
      reproduces a different condition and passes on the defect. No build.py spawn — the
      point is the ABSENCE of build output — so no marker, and a shared reference layout
      would actively defeat this entry.
    must_catch:
      - "import the resolver from scripts/commit_guardian/, which is an untracked build output absent from a fresh clone"
      - "reach the resolver by a sys.path insert instead of the tracked loader"
      - "reimplement the resolution order locally in scripts/ instead of importing the one shared module"
test_rationale: >-
  Every entry runs the audit as a real subprocess against real trees on disk and asserts
  on what it printed. The record's notes already rule out the grep form; the specific
  weak shape to avoid here is a unit test that calls scan(root) directly with an explicit
  root, which exercises the function this record is NOT about and leaves the default
  — the actual defect — untested. The populations are the design: arms 3 and 4 hold one
  population fixed and move the other in opposite directions, which is the only shape no
  hardcoded list and no working-directory default satisfies. Arm 4 in particular requires
  sibling checkouts to EXIST in the fixture; a single-tree harness reports green against
  the defect. The fifth entry is not one of the record's arms — it is enrichment's own,
  and it is the only test here that can catch the import-boundary mistake this record's
  first two it_requirements forbid: scripts/commit_guardian/_resolve_root.py is present in
  a developer's working tree and absent from a clone, so an import of it passes every
  other test on this record and fails on every fresh checkout and in CI's first job. Its
  must_catch list also names the two mistakes the AMENDED requirements add — reaching the
  resolver by a sys.path insert, and reimplementing the order locally — because a local
  reimplementation passes this entry's happy path as readily as a correct import does.
  What this record can NOT prove on its own, and does not attempt to: that the audit and
  the collision pre-flight AGREE. Every entry here asserts the audit's own outcome, so
  the two tools could each pass all of their own arms while disagreeing with each other.
  That property is cross-cutting, it is held by GE-118g's own test_spec, and its first
  entry lists this record in its covers field. Markers: none of the five entries here
  requests shared_reference_layout and none spawns build.py, so all five sit outside the
  marker-routing mechanism. The fifth is explicitly a NO-build test — provisioning it with
  a built layout would destroy exactly the condition it exists to prove. Deliberately
  absent: any assertion about how long a run takes.
