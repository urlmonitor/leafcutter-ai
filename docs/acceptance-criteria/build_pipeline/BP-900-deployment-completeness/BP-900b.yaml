title: "Build catches broken script references before they reach consumer projects"
component: build_pipeline
level: L1
status: active
req_status: approved
readiness: approved
priority: critical
work_status: not_started
criteria: |
  Given build.py has finished compiling all agent templates and skill files,
  When a post-compile validation phase scans the compiled output for script path
  references (patterns like "python3 scripts/...", "python scripts/...",
  "sys.path.insert(..., 'scripts/...')"),
  Then every referenced script path is verified to exist in either:
  (a) the set of scripts that build.py will deploy to the consumer project, or
  (b) a known external-dependency allowlist,
  And if any referenced script is NOT deployable, the build exits non-zero
  with the list of broken references.
