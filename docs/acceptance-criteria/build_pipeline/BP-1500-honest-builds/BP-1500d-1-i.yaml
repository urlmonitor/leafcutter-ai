notes: |
  WHY THIS IS ONE RECORD AND NOT TWO. This AC was first written for the package's
  stated position alone, with the empty account of the package's own files flagged
  as adjacent. Re-reading the reader settled it the other way, and the argument is
  mechanical rather than aesthetic.

  The check's count of what it verified comes from the record's account of the
  producing package's files, each one resolved directly against disk. The directory
  walk that a reader might assume drives that count does not -- it drives only the
  detection of on-disk files the record failed to mention. So an empty account of
  the package's files forces a verified count of nothing on its own, and correcting
  the stated position raises that count by nothing at all. Landing the position half
  alone leaves the gate exactly as blocked as it is today.

  The reverse coupling is sharper still, and it is the reason a second record would
  have been actively harmful. The reader forms the names it looks for by combining
  the stated position with the receiving project's own root, and it then expresses
  that combination back as a name relative to that root. A position that honestly
  points outside the receiving project cannot be expressed that way. So an honest
  position delivered WITHOUT a correspondingly rebased account of the package's
  files does not merely fail to help -- it walks the reader into a derivation that
  has no answer. Two records, each green on its own half, would have permitted
  exactly that intermediate state. One clause that requires the two halves to AGREE
  does not.

  That agreement clause is the load-bearing sentence of this AC. Everything else
  here is satisfiable in halves; that one is not.

  THE BEHAVIOUR IS NOT "THE FIELDS ARE NON-EMPTY". Any string satisfies the first
  and any list satisfies the second. The behaviour is that the record's description
  of the producing end is TRUE where the record sits, or is an explicit unavailable
  that no reader can mistake for an answer. The paired run is load-bearing for
  exactly this reason and must not be dropped: a same-directory build legitimately
  produces the same-place answer and legitimately names the package's files from
  there, so an implementation that always produces those answers is green on a
  single-layout test. Only running both layouts in one session distinguishes
  "records the producing end" from "records the producing end because it gave up".

  WHY THE DONE NEIGHBOURS ARE NOT COVERAGE. BP-100k-5 and BP-100k-3 are both
  work_status done and readiness approved, and both are genuinely about this
  machinery, which makes them the most plausible false reassurance in the store.
  They are not coverage for two independent reasons. Their subject is the DEPLOYED
  population and the vocabulary a check uses to report what it could not compare --
  the far end of the deployment and the check's own honesty, neither of which is the
  record's account of what the deployment came FROM. And both were demonstrated in
  the layout where the producing package and the receiving project are the same
  directory, which is the one layout in which the producing end is described
  correctly by accident. That is precisely the trap BP-1500d's mandatory proof shape
  names: a child verified only in the package's own workspace is verified in the one
  layout where the defect does not appear.

  BP-1500c was the strongest candidate here and was rejected on the record rather
  than by reflex, since the earlier rejection of it concerned a different field. The
  fingerprint set of the package's own files IS the source side of a staleness
  comparison, so the pull is real. But BP-1500c is an undecomposed L1 with no L2
  children, and BP-1500d's own notes make BP-1500d its prerequisite in exactly this
  respect: there is nothing to compare an installed copy against until the record in
  the project being checked says what it was built from. This AC produces the input
  that judgement consumes. It must not be satisfied by making the judgement.

  TWO CORRECTIONS OF FACT, both re-measured on 2026-09-07 in this worktree, both of
  which change how a future reader should size the harm.

  FIRST -- THE DOWNSTREAM CONSEQUENCE QUOTED IN THE WRITER'S OWN COMMENT IS NO
  LONGER LIVE. That comment describes a reader that scanned a path which does not
  exist, found nothing, and reported a clean run -- "an empty comparison set,
  indistinguishable from a clean run". Both drift readers have since gained a floor
  that refuses to report clean when they resolved nothing to compare; it is present
  and reachable in both today. So an undescribed producing end no longer produces a
  silent all-clear. It produces a hard block, on every commit in a genuine
  out-of-package install, carrying a diagnosis the reader cannot act on -- because
  the thing misdirecting the check is the record itself. A real defect, and a worse
  day-to-day experience than a false green in some respects, but a different failure
  shape, and this record says so rather than repeating the stale claim. Anyone
  re-deriving urgency from that comment should re-measure the readers first.

  SECOND -- THE SHAPE OF THE GAP, with method and denominator, since figures belong
  here and not in criteria. Measured by reading the writer's two per-file loops over
  the package's agent templates and its guardrail-script templates, both of which
  skip-and-continue with a per-file warning on the same inexpressible-path condition
  that produces the false position statement. The denominator is every template file
  the package ships; the recorded count in a sibling layout is zero of them. The
  deployed side of the same run was measured at 471 recorded entries after the
  uncommitted sibling fix. So the record is lopsided in a way that is worth stating
  plainly: it accounts fully for what was deployed and not at all for what it was
  deployed from, and it is the second of those, not the first, that decides whether
  any check can verify anything.

  ORDER OF LANDING, since it was the question that prompted this assessment. All
  three -- the deployed entries, the stated position, and the account of the
  package's files -- must be present and mutually consistent before a genuine
  out-of-package install works at all. The deployed entries are the parent's, and
  the uncommitted work already addresses them. Both remaining halves are this
  record's, which is the point of merging them: there is now no way to ship half of
  what is left and have an AC report success.

  FOR THE IT-PO. test_spec, it_requirements and estimated_complexity are
  deliberately absent -- they are yours. Four things to carry into them. The paired
  two-layout run is the contract, not a nicety, and a single-layout entry is green
  on the defect. There must be an entry that asserts the two halves AGREE, distinct
  from the entries that assert each is honest, or the intermediate state described
  above passes. The assertion must be on what an automated caller receives, not on
  printed form, for the same reason -3 and -4 both record. And the call-site audit
  covers both drift readers and must state, for each, what it does when either half
  says unavailable -- that is a behaviour neither reader has today.

  package_surface is not set: this AC registers nothing in any registry the build
  reads. child_limit_override is not set and is not needed -- the parent has this
  one child.
