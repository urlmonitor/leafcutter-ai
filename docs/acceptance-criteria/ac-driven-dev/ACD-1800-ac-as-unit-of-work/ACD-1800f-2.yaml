notes: |
  THE PROOF CONTENT -- the successor to the ticket body's `## Smoke Fixture`
  block.

  VERIFIED SHAPE OF WHAT IT REPLACES (ACD-1800f notes, re-verified 2026-08-17):
  templates/agents/user-surface-smoker.md reads the block from the TICKET BODY
  (extraction ~lines 92-93) as one or more YAML stanzas separated by `---`, each
  with four keys (~lines 95-107): `surface`, `fixture_input`, `assertion`,
  `placeholder_signature`. The four Then clauses above map onto those four keys
  deliberately -- surface / fixture_input / assertion in the first clause, and
  `placeholder_signature` in the second.

  THE SECOND THEN CLAUSE IS THE ONE PEOPLE DROP, AND IT IS THE ANTI-PLACEBO
  CLAUSE. `placeholder_signature` is what distinguishes "the surface ran and
  produced the promised observation" from "the surface ran and produced its
  unimplemented-stub output". Without it a smoke check degenerates into an
  exit-code check, which passes on a stub. It is authored content, not derivable,
  so it must move with the rest of the stanza; a migration that carries three of
  the four keys silently weakens every proof in the store.

  THE PRODUCER SIDE IS EMPTY TODAY. scripts/ac_store/generate_ticket_from_ac.py
  contains ZERO occurrences of "Smoke Fixture" and ZERO of "actuation_contract".
  Nothing in the AC path emits the block the gate reads. So this is not a
  "move the content" change -- there is no producer to repoint, and the content
  has only ever existed when a human typed it into one particular ticket body.

  WHY IT MUST BE ON THE REQUIREMENT (ACD-1800f's load-bearing argument): under
  ACD-1800c the ticket groups N requirements, so a ticket-level stanza is an
  assertion nobody owns and nobody revalidates when membership changes. Authoring
  the proof at the same grain as the promise also makes the check
  grain-invariant -- ACD-1800f-4 asserts that consequence.

  MULTIPLICITY (third Then) matters because the smoker's algorithm is literally
  "for each stanza in the block" (~line 111) and its aggregation is "if ALL
  stanzas PASS: emit (status: ok)" (~line 171). A single-proof-per-requirement
  design would silently drop stanzas from any migrated multi-stanza ticket.

  SCHEMA CONSTRAINT: this content is a new AC field and
  additionalProperties:false is enforced today, so ACD-1800f-1's slot (or the
  same additive landing) is a hard prerequisite -- hence the depends_on edge.
  Optional, absence = legacy mode (ADR-026 rules 1 and 4).

  TESTABILITY. Author a real requirement with two proofs, run the observation
  craft against a real surface, and assert both proofs were executed and their
  observations checked. Do NOT assert only that the field parses -- a parsed
  stanza that nothing runs is the state the `## Smoke Fixture` block is in today.

  2026-08-17 (IT PO enrichment).

  PLACEHOLDER_SIGNATURE PROMOTED FROM OPTIONAL TO REQUIRED. The craft treats it
  as optional today ("if present", user-surface-smoker.md Step 4.2 ~line 153).
  Carrying that optionality onto the requirement would reproduce the weakening
  the BA warns about by default rather than by accident, so the field is
  required at authoring time. Note the consequence for migration: any hand-typed
  stanza that omitted it cannot be copied verbatim and must be completed by its
  author -- that is intended, and the uninferable ones belong in a review report,
  never a guessed regex.

  MIXED SURFACE -- PARTIAL FLAG (S2.8, BP-1100f-3-i). The declared surface of
  this AC is not uniformly Python:
    - MATCHED (python-coder / pytest): config/ac_store_schema.json,
      scripts/ac_store/*.py, scripts/commit_guardian/*.py.
    - UNMATCHED: templates/agents/user-surface-smoker.md -- a prose agent
      template. A Python implementer checked by pytest cannot meaningfully author
      or verify it, and no pytest assertion proves an LLM craft now reads the
      resolver instead of the ticket body.
  Only the unmatched portion is flagged; the matched portion passes unflagged. No
  split was made -- ACD-1800f is at its 5-L2 cap and ACD-1800 is at 6 of 7 L1, so
  a split is the user's call. The recommendation recorded for the user is a
  companion llm-expert AC that repoints user-surface-smoker.md and
  live-surface-tester.md at the resolver. Until it exists, the risk is precise
  and should not be papered over: the store can hold correct proofs that the
  craft never reads, which is the same shape as today's defect with the arrow
  reversed.

  RESOLVER SIGNATURE IS DELIBERATELY TICKET-FREE. resolve_observation_proofs
  takes AC ids and an ac_root, and no ticket path. That is not a style choice --
  a signature that accepts a ticket path will acquire a ticket-body fallback, and
  the fourth Then clause then becomes untestable. The no-ticket-on-disk test
  descriptor exists to hold the signature honest.
