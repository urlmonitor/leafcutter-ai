work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing a parent that simply omits a child it has, a
    deliberately parked tree carrying the author-set parked signal, a parent whose
    coverage list resolves to no record at all, and a retired parent,
  When the one-off adjudicated pass is run over that store,
  Then every one of those records appears in the pass's report,
  And each carries exactly one stated disposition — repaired, or left as it is —
    together with the reason that disposition was reached,
  And no record that the store-wide check reports as a gap is absent from the
    report,
  And the pass completes successfully while records remain that the store-wide
    check still reports as gaps, provided each of those carries a stated reason.
