id: UXP-700e-1-i
title: "A new bound arrives as a warning behind a declared shape version, and blocks nothing that predates it"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a proposed longest-description bound of 120 characters, which every one of the 14
    journeys in the record today exceeds,
  When that bound is introduced,
  Then each journey states which version of the record's shape it was authored against,
  And a journey authored against a version older than the one in which the bound took effect is
    reported as a warning and does not stop the work that triggered the check,
  And only a journey declaring the version in which the bound took effect is held to it,
  And a journey declaring no version at all is treated as predating the bound and is reported
    as needing a version, not as violating the bound.
depends_on:
  - UXP-700e-1
