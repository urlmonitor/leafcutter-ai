notes: |
  DECISION FOR THE GATE (BA default, question Q3 in the sign-off): a check's change to a file
  outside the list is LEFT OUT and REPORTED, rather than included and reported. Rationale: including
  it is exactly KI-BO-029's mechanism 2, and the commit message (written before the checks ran)
  cannot describe it -- the "commit messages must match the diff" rule in the repo CLAUDE.md.
  The alternative is defensible if a check's output must land with the change to keep a later
  check green; if the user chooses it, the second clause of the first Then flips and the reporting
  clause stays.

  The answer field name for these files is the IT PO's call; the spec's fixed field set (status,
  sha, paths, hook_name, failing_files) gains one list here, flagged as an extension.
