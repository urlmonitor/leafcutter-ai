notes: |
  KI-BO-20260925-build-single-ticket-treats-ticket-path-final-as-worktree-path: the retiring
  set-up script reports the resolved INPUT ticket path (usually the main copy's) under a name
  callers read as "the ticket inside the workspace", and the single-ticket build maps it that
  way, so ticket edits during a drive are likely aimed at the main copy -- the "work lands on
  main" class this tree exists to close. This record is the maker half only: the ready answer
  states the ticket's in-workspace location and that file exists. Callers taking the location
  only from the answer is the same rule BO-4300c-4 states for the workspace location.

  DECIDED (user, 2026-09-27; proposed by IT PO 2026-09-25). Case raised by the BA: the
  ticket exists in the main copy but not on origin/main (never pushed, or edited and not pushed).
  Handling, consistent with decision 3 (every workspace branches from origin/main after a
  fetch): the maker REFUSES with its own code, TICKET_NOT_ON_BASE, whose message names the ticket's
  project-relative path and tells the caller to land the ticket on origin/main (push it) and ask
  again; the answer carries ticket_path (the path as requested) and reason ('absent' when no file
  exists at that path on the base, 'differs' when one exists but its bytes differ from the main
  copy's). The maker never copies uncommitted or unpushed ticket content into a workspace, because
  that would make the workspace's starting content something other than origin/main. The check runs
  after the workspace's fetch and before its install build; the clone this request made holds no
  work by construction, so the maker clears it before answering and the refusal leaves nothing
  behind (no INCOMPLETE remnant). A resumed line reads the ticket from the resumed line, not
  origin/main. Applied: TICKET_NOT_ON_BASE is in BO-4300c-2's code list,
  test_ticket_absent_from_the_base_never_yields_an_ok_answer asserts the code, and
  test_ticket_that_differs_from_the_base_is_refused_not_on_base covers 'differs'.
  Alternatives not taken: treat 'differs' as ok with a warning field (weaker: the drive then
  edits a ticket that is not the one the user sees), or copy the main-copy ticket in (breaks
  decision 3).
