notes: |
  The failure angle, and the single most likely way this whole L1 quietly dies. A
  cadence whose failures are invisible degrades into no cadence at all while
  continuing to look healthy — the report simply stops updating and the last good
  figures sit there looking current.

  This repo has the exact precedent twice over, both recorded in
  docs/testing/test-angles.md: the CI pytest job running with
  continue-on-error: true so the gate fires and merges proceed anyway, and the six
  drives that committed with zero pre-commit hooks because pre-commit exits 0
  under PRE_COMMIT_ALLOW_NO_CONFIG=1 — an ungated drive indistinguishable from a
  gated one. Meszaros' "Lost Test" smell.

  Test-angle constraint: induce a real incomplete run through the scheduled entry
  point and observe the published surface. Asserting that an error handler exists
  proves nothing about what a reader sees.

  IT-PO ENRICHMENT NOTE (2026-08-17). Two additions the criteria imply but do not
  state, now in it_requirements. First, the non-zero exit: the criteria describe
  what a reader sees, but a surface showing failure while the job exits zero still
  lets the scheduler itself report a healthy cadence — which is the
  continue-on-error precedent exactly. Second, the interaction with TQ-400c-3: a
  did_not_complete occurrence must be SKIPPED by the trend computation, not
  differenced as a population of zero, or one failed run renders as the entire
  finished population lapsing.
