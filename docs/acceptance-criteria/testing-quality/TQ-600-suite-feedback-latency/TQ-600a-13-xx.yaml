  - ac_id: TQ-600a-13-vi
    contract: >-
      The exact check name `Post-merge suite status` and its output wording (the held state
      naming the run by link and conclusion, and the notice when one describes it), which
      this workflow recognises by name and quotes verbatim.
  - ac_id: TQ-600a-13-xviii
    contract: >-
      The canonical rule paragraph in templates/skills/building-epics/SKILL.md §3.6, which
      the `pull-request` agent this workflow dispatches already follows; this record makes
      the workflow's own deterministic decision agree with it.
test_required: true
test_spec:
  - name: test_tq600a_13_xx_hold_only_ends_held_externally_without_merging
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/workflows-js/finalize-feature.js executed end to end by run_workflow_under_e2() with label_responses driving it to Step 4 (step-4-pr-state OPEN) and the checks-read label answered with recorded state A (TQ-600a-13-xviii-scenarios/scenario-A-hold-only.json, with a notice reference such as #9001 added to the hold's description)"
    must_catch:
      - "Step 4 dispatches the merge (step-4-merge-pr) or the merge gate while the hold is failing"
      - "the run returns status ok, or records 'merged to main', for a held pull request"
      - "the run halts with reason test_regression or the branch-failure reason"
      - "the report paraphrases or drops the hold's description, link or notice reference"
      - "Step 5, Step 6 or the Step 7 worktree removal is dispatched after the hold is seen"
    description: >-
      The run halts at Step 4 with the held-externally reason, its message contains the
      hold's description verbatim and its link, and no merge, sync or removal dispatch
      appears in the recorded agent calls.
  - name: test_tq600a_13_xx_hold_beside_a_real_failure_blames_only_the_real_failure
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "the same harness run with the checks-read label answered with recorded state B (scenario-B-hold-plus-pytest-failure.json)"
    must_catch:
      - "the hold is counted among the branch's own failing checks"
      - "the pytest failure is reported as external because a hold is also present"
      - "state B ends with the held-externally reason, hiding the branch's own failure"
      - "the merge proceeds"
    description: >-
      The run ends as a branch failure whose own-failure list is exactly
      [`Test suite (pytest)`], the hold appears only in the separate external-hold field,
      and no merge dispatch is recorded.
  - name: test_tq600a_13_xx_all_green_is_unchanged_apart_from_the_one_read
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the same harness run with every check SUCCESS (state C) and the merge gate and merge dispatch answered as the existing finalize harness tests answer them"
    must_catch:
      - "the checks read blocks or alters the all-green path"
      - "the checks read is dispatched more than once"
    description: >-
      The ordered list of dispatched labels equals the pre-change list with the single
      checks-read label inserted before the merge gate, and the run's status, step_summary
      and Step 4 outcome text are identical to a run without that read.
  - name: test_tq600a_13_xx_held_paths_take_no_forbidden_action
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "the recorded agent calls (labels and prompt text) of the state A and state B harness runs, as actually dispatched by the executed script"
    must_catch:
      - "a dispatch re-runs the check (gh run rerun) or waits on it (gh pr checks --watch, a polling loop)"
      - "a dispatch pushes or commits, including an empty commit"
      - "a dispatch edits the pull request description to add a fix declaration"
      - "a dispatch names a post-merge workflow, scripts/ci/, the tunables file, the ruleset or a post-merge-red issue"
    description: >-
      After the checks read, no recorded dispatch other than the baseline cleanup exists,
      and the checks-read label occurs exactly once per run.
  - name: test_tq600a_13_xx_only_the_exact_check_name_is_the_hold
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: "the same harness run with state A's hold entry renamed to `post-merge suite status`, `Post-merge suite status (copy)` and `Post-merge suite` in turn, plus a run whose checks-read reply is malformed"
    must_catch:
      - "the name match is case-insensitive, trimmed or a prefix/substring match"
      - "an unreadable checks reply is classified as a hold"
    description: >-
      Each look-alike is treated as an ordinary failing check, never reported as an
      external hold; a malformed reply leaves Step 4 on its pre-change path.
test_rationale: |
  Behavioural by construction: every descriptor executes finalize-feature.js through the
  Node-backed E2 harness and asserts on what the script actually did — the return payload
  and the ordered agent dispatches it issued — given a recorded `gh pr checks` reply. None
  reads the script's source. A grep for the string `Post-merge suite status` in the
  script would pass on a constant that is defined and never consulted, which is the
  fast-lane phantom-done this repository's CLAUDE.md names; the all-green descriptor
  exists because the cheapest wrong version is a read that silently changes the path that
  works today. The forbidden-action descriptor inspects the prompts of dispatches the
  executed run produced, not the file's text. The look-alike descriptor guards the exact
  name, which is a ruleset string settled in TQ-600a-13-vi. About 4 s in the default run,
  inside the family's 15 s budget.
