id: GE-118g-2
title: "The unclaimed-number audit examines the repository it belongs to, and nothing outside it, without being told where that is"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a checkout of this repository whose decision records claim a known set of
    numbers,
  And that checkout sits inside a larger directory that is not itself a git work
    tree and that holds 77 sibling checkouts of the same repository, each of
    which claims numbers of its own,
  When the author runs the unclaimed-number audit by absolute path — the form
    this project's shell convention requires — with that larger directory as the
    working directory and no argument naming a scan root,
  Then the set of claimed numbers it reports is exactly the set claimed by the
    repository the program belongs to,
  And no path outside that repository appears anywhere in what it reports.

  And given the same run, and a second run in which the repository is named
    explicitly as the scan root,
  Then the two runs report the same claimed set and the same unclaimed set — so
    naming the repository changes nothing, which is what makes the published bare
    command usable.

  And given a decision record claiming a previously unclaimed number is added
    inside the repository,
  When the audit is run again from that same larger directory,
  Then the claimed set it reports is larger by exactly that number, and the
    unclaimed set no longer offers it.

  And given instead that a decision record claiming a previously unclaimed
    number is added to one of the sibling checkouts and to no file inside the
    repository,
  When the audit is run again from that same larger directory,
  Then the claimed set it reports is unchanged and the unclaimed set still
    offers that number — so what the audit reports moves with the repository's
    own contents and with nothing else.
