  - path: docs/architecture/components/finalize.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
package_surface: false
declares_side_effect: true
it_requirements:
  - >-
    The listing is rendered from the derive step's records array (BO-400e-3-ii), with one line per
    record: id, repo-relative path, current status. A header gives the ticket count and the AC
    count. The rendering is a pure function in the closing module
    (scripts/build_orchestration/finalize_closable_set.py), returned in the derive reply as a
    ready-to-show text block, so that finalize-feature.js only displays it and adds no formatting
    logic (no size growth; see BO-400e-3-ii).
  - "The listing is shown before the first write of any record. It is emitted through the workflow's narration channel and carried in the confirmation prompt (BO-400e-3-vii), so the person sees it whether or not the gate is still in force."
  - >-
    The final report's closure section is built ONLY from the close step's per-record results
    (BO-400e-3-iv), marking each listed record closed, refused or left open. Any record that the
    close reply or the leak comparison (BO-400e-3-iii) shows as changed but absent from the shown
    list is reported as "closed outside the shown list". When that happens, Step 3.5 is not
    recorded in completedSteps and no "closure completed" outcome line is emitted.
  - >-
    Step 6b's scope probe today asks an agent to search the ticket tree for tickets that reference
    the branch, and pushes its tickets_done into ticketsClosed. It must no longer add records to
    the run's closed list. Otherwise the final report claims tickets closed that were never on the
    shown list. Step 6b either reports from the same derived set or is removed. It never searches.
delivers_to:
  agent: python-coder
  contract: "listing_text: str in the derive reply, with a header line '<n> ticket(s), <m> acceptance criteria' followed by one line per record '<id>  <path>  <status>' in set order. Consumed by the confirmation gate (BO-400e-3-vii)."
expects_from:
  - ac_id: BO-400e-3-ii
    contract: "The records array (kind, id, path, status) in set order."
  - ac_id: BO-400e-3-iv
    contract: "Per-record close results (closed / refused / left_open)."
test_required: true
test_spec:
  - name: test_listing_is_shown_before_any_record_is_written
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive finalize-feature.js through run_workflow_under_e2 with the derive dispatch answered by the real module's output for the EPIC-Alpha fixture; the listing (both records, with id, path and status, plus the counts header) appears in the log or gate prompt BEFORE the close dispatch is recorded."
  - name: test_listing_text_has_one_line_per_record_and_counts
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: criterion
    description: "The module's listing for the EPIC-Alpha fixture states 1 ticket and 1 acceptance criterion and has exactly one line each for alpha-02.md and BO-9100a-2 with their current status."
  - name: test_final_report_repeats_the_list_with_per_record_outcome
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Same harness run with the close dispatch answered by the real module's reply; the final report lists alpha-02.md closed and BO-9100a-2 closed, and with a refusal fixture lists refused and left open."
  - name: test_record_closed_outside_the_shown_list_is_reported_and_step_not_completed
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Close reply (from the real module with an injected leak) shows alpha-01.md changed; the report marks it closed outside the shown list and Step 3.5 is not in completedSteps. NEGATIVE CONTROL: Step 6b's scope-probe reply naming an extra done ticket does not add it to the report's closed list."
    must_catch:
      - "add Step 6b's tickets_done to the closed list"
test_rationale: >-
  "Before any record is written" is an ordering property of the running workflow, so it is asserted
  on the order of the dispatches recorded by the E2 harness, not on the source text. The replies
  fed in are the real module's output for the fixture, so the listing under test is the one the
  module actually produces. The Step 6b negative control exists because that probe is a second
  route into the closed list that the report would otherwise trust.
origin_agent: BrainCandy
