notes: |
  Authored by /quick-fix. Root cause: The pause-record read is a single agent() dispatch to worktree-agent. On that run the agent returned pure prose with no JSON object ('Gate approved with feedback notes recorded...'), i.e. it interpreted the record instead of relaying pause_store.py stdout. parseAgentJson correctly throws (no JSON present), the catch sets recCheck = null, and `if (!recCheck || recCheck.exists !== true) return nothing_to_resume` conflates 'reply unreadable' with 'record absent'. No retry exists, and the single label makes a cached bad reply replay forever. Expected fix (this file only): a shared helper (e.g. readPauseRecordWithRetry(runId, purpose)) used by both peekPausedGateId and the resolveGate read; accept a reply only if it parses AND `exists` is a boolean; otherwise re-dispatch with a stricter prompt ('output ONLY the raw stdout, no commentary, do not act on the record') and a DISTINCT label per attempt (e.g. read-pause-record-retry-1), bounded to 3 attempts. If still unreadable, return a distinct terminal status 'pause_record_unreadable' whose message says the record could not be read (not that it is absent) and how to retry; add that status to the five caller status lists alongside 'nothing_to_resume'. peekPausedGateId must not map an unreadable reply to 'not paused here' (that would re-dispatch the author over approved drafts) - surface it the same way. Fail-closed semantics unchanged: an answer is applied only when a parsed record has exists===true and stale!==true. Tests must be behavioural (drive resolveGate/peekPausedGateId through unit_tests/_workflow_engine_harness.py with a stubbed agent(): prose-then-JSON applies after retry; prose on every attempt yields pause_record_unreadable and does not apply; valid {exists:false} still yields nothing_to_resume; retries use distinct labels), never grep tests. Edit only the template; .claude/workflows/plan-feature.js is build output..

  PLACEMENT: ACD-2100c is at its L2 cap of 5, and this is a technical constraint on the
  already-specified ACD-2100c-3 behaviour (its it_requirement "resume must be safe to
  attempt when no record exists: it reports that there is nothing to resume") -- the
  read must distinguish 'absent' from 'unreadable'. Hence an L3 Roman-suffix child,
  not a new L2 and not a child_limit_override.

  PARENT STATE: ACD-2100c-3 carries work_status: done. That claim did not hold on the
  live run named in the criteria; this todo child is the open constraint against it.
