id: GE-124b-2
readiness: approved
priority: high
title: "A pin says a thing is on screen and can never stand in for the component declaration"
component: guardrail-engine
components:
  - frontend_coding
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124b.yaml"
criteria: |
  Given a staged screen component file with no component-level declaration
  And the file pins KM-ADM-004 on a rendered element
  When the commit-tier check evaluates the file
  Then the file is reported as missing its component-level declaration
  And the pinned criterion KM-ADM-004 does not satisfy, reduce or downgrade that
    report

  Given a criterion that describes behaviour with no element of its own — a
    validation rule, a sort order, or an input debounce
  And the component that implements it names it in its component-level
    declaration and pins it on no element
  When the commit-tier check evaluates the file
  Then the file passes
  And the absence of an element pin for that criterion produces no finding
depends_on:
  - GE-124b
  - GE-124a-1
