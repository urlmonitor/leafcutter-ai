criteria: |
  Given a worktree is being created,
  When bootstrap reaches its final step,
  Then it first ensures the config is established, then runs the probe against the
    new worktree, and if the probe returns a non-zero verdict the worktree
    creation halts with an error naming the failing check (rather than reporting
    success).
  And when the probe returns a passing verdict, worktree creation completes
    normally.
  And this replaces the previous file-existence-only check that reported success
    whenever a config file merely appeared present.
