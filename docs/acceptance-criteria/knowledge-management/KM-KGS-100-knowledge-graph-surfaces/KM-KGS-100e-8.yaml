criteria: |
  Given the product-owner authoring-agent template, the business-analyst
    authoring-agent template, and the IT-product-owner authoring-agent template
  When each template's AC-authoring instructions are read
  Then each template instructs the agent to emit a non-empty component-membership
    list on every acceptance criterion it produces or enriches
  And each template names the same authoritative component-membership field that the
    per-criterion validation rule enforces, so template prose and the enforced check
    stay in parity
  And a template that omits the instruction to emit a component-membership list is
    reported as non-conforming
