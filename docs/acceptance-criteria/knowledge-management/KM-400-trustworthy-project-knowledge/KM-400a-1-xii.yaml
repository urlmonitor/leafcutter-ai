id: KM-400a-1-xii
title: MockData properties retain samples as data owned by their dataset
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given a canonical MockData dataset contains entity descriptions and sample records named Ac and Plant, including nested values and an explicit null
  When the dataset's native fields are exposed in the repository graph
  Then one dataset retains its authored id, component, status, readiness and complete entities mapping
  And any authored superseded_by, version, shape_version, reusable, example_product, realization, tags, invariants, used_by and provenance remain queryable
  And each entity's field descriptions and sample records retain their original keys, types, order and associations, including nested maps, lists, nulls and empty collections
  And sample Ac, Plant, Component or Test names and sample requirement references remain dataset content rather than actual project artifacts or evidence that a test ran
  And field descriptions and invariants do not execute or coerce the sample values
  And registration metadata and presentation fallbacks stay separate from authored dataset fields, so a differing registration cannot overwrite them
  And a canonical dataset missing from registration remains visible, adjacent authoring prompt fixtures produce no datasets, and malformed sources, duplicate identities or references outside the selected repository fail explicitly
  And absent optional fields stay absent instead of acquiring default versions, realization or ownership
depends_on: [KM-400a-1]
