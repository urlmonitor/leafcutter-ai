notes: |
  UNDER-SPECIFIED, NOT INVENTED: A NIGHT THAT NEVER STARTS. Every ending above is a run
  that started. A scheduled run that is never triggered — a schedule removed, the
  workflow disabled, or the hosting service suspending scheduled runs, which it does for
  some repositories after a period without activity — produces no verdict at all, so the
  flag is never raised and the hold passes. The approved design does not say how long
  without a completed nightly should count as red. A staleness bound (for example, the
  per-PR check failing when the last completed nightly is older than some number of
  hours) would close it; the number and whether to do it are the owner's call.
