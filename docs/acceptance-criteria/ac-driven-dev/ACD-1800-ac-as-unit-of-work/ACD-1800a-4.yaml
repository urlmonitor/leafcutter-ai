readiness: draft
priority: medium
title: "A requirement can list a reviewed product-truth artifact as a deliverable, proven by a journey step naming it"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement whose promised outcome includes a reviewed user journey as
    well as code and tests,
  When the requirement is inspected,
  Then its deliverable checklist carries a product-truth item alongside the code
    and tests items, naming a kind of artifact the checklist did not previously
    offer,
  And that item is an obligation the author wrote down, held separately from the
    requirement's tool-maintained record of which journey steps already name it,
  And the item counts as delivered once a journey step names this requirement as
    one of the requirements it realises,
  And it counts as delivered on the strength of that naming alone, never on how
    far along the journey step reports this requirement to be, so that the
    requirement's own progress is never an input to deciding whether the
    requirement is complete,
  And a requirement that promises no product-truth artifact carries no such item
    and is unaffected.
depends_on: [ACD-1800a, ACD-1800a-1]
