id: GE-126c-1
title: "The build-source copy refuses the same record the deployed copy blocks"
component: guardrail-engine
components:
  - commit_guardian
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fully built workspace in which the deployed layout is present and working,
  And one acceptance-criterion record that genuinely violates the parent-back-link rule —
    a child record whose parent does not list it among the children it covers,
  When the build-source copy of the parent-back-link check is run against that record,
  Then it refuses to answer: the outcome it reports is neither the ordinary success value
    nor a verdict on the record and its report states that this copy cannot enforce
    anything and names the copy that can,
  And when the deployed copy is run against the same record it blocks naming the record
    and naming the missing back-link,
  And when the deployed copy is run against a record whose parent does list it the deployed
    copy reports an ordinary pass,
  And the three runs are told apart by their outcome values so a caller cannot read the
    build-source copy's refusal as either a verdict or a pass,
  And the behaviour recorded on 2026-08-25 — the build-source copy printing a warning
    about an import and then reporting the ordinary success value — no longer occurs.

  Coverage note: covered only by three out-of-process runs — build-source copy against the
  violating record deployed copy against the violating record deployed copy against the
  clean record — asserting a distinct outcome for each. The second and third arms are not
  optional: without them this criterion is satisfied by a build-source copy that refuses
  unconditionally while the deployed copy is left broken, which is not a fix.
