title: "A test-runner report that relays the database checker's own message is not read as naming an address"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the test-runner "configured database" row, whose setting is the
      placeholder postgresql://<user>:<password>@<host>:<port>/<database>,
    And a report that relays the checker word for word: "The checker reported
      status invalid: ... is not a valid postgres connection URL (expected
      postgres:// or postgresql:// with a safe host, port, and database
      segment)."
  When the row's "names no address" check reads the report,
  Then the check passes, because the report names a scheme and no host,
    And a report that says "expected a postgresql:// URL" passes,
    And a report that relays the checker's message and also names
      "postgresql://dev:secret@localhost:5432/app" fails, with that address
      as the detail,
    And a report naming "postgres://db.internal/app" fails,
    And a report naming only the placeholder address passes, as before,
    And the recorded gold report for the row still passes.
