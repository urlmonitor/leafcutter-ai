notes: |
  DECIDED DESIGN POINT: signature = gate + "/" + rule_id. Free-text detail NEVER enters
  the key, and neither does anything about the artifact the finding was raised against.
  Motivating evidence from the user: 43 pull-request-review blocks, 3
  documentation-verifier blocks, 6 test-runner blocks, and the same "AC line missing pipe
  delimiters" defect firing four times in one epic — all uncounted.

  WHY surface_kind WAS DROPPED, and the reasoning is worth keeping. The original signature
  had three inputs, the third being the "kind of surface" a finding was raised against.
  That term was defined nowhere in the AC store — it appeared only in this AC and in
  BO-2800b-5, with no enumeration and no rule for assigning it. Two consequences followed.
  First, this AC's own Given ("against the same kind of surface") was satisfiable by any
  two equal literals, so the granularity question was never actually confronted by the
  specification. Second, and decisively, the mined historical records carry no such field
  at all, so the ~113 mined nested-false findings could not have been signatured under the
  three-input rule — the very population BO-2800a exists to make countable.

  rule_id is already gate-scoped, so a well-chosen rule identifier carries whatever
  discrimination a surface distinction would have supplied. An undefined third input adds
  fragmentation risk (the same problem splitting across surface labels) for no demonstrated
  discrimination benefit. If a real collision appears — one rule identifier that genuinely
  means two different problems depending on the artifact — the answer is to split the rule
  identifier, not to reintroduce an undefined axis. Reconsider only on evidence of such a
  collision.

  The identity produced here is the defect_id that BO-2800c's override records reference.
  Note that it is a CLASS identity, not an instance identity — BO-2800c-1 carries the
  instance discriminator, because two firings of one rule on one ticket are two overrides.
