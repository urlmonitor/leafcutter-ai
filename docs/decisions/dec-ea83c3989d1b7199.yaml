rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.B_rewire_existing] rewire the two existing kernel
    tickets with source_ac, test-writer, pr-reviewer and Test Requirements and build each through build-feature, plus the
    same docs ticket (required mean 0.44, 0/6 passed); 2. [opt.C_build_ac_leaf] build-ac in leaf mode on the two code ACs
    with pr-reviewer added, retiring the existing tickets, plus the same docs ticket (required mean 0.41, 0/6 passed); 3.
    [opt.D_goal_epic] build-ac in goal mode on DK-600, one epic of about fourteen tickets through build-feature (required
    mean 0.40, 0/6 passed); 4. [opt.A_fast_code_docs_ticket] the fast lane once per code AC after resetting both to todo,
    plus one hand-authored docs ticket with architecture-diagram-author, documentation-expert and documentation-verifier built
    through build-feature (required mean 0.33, 0/6 passed). human:user chose option [opt.A_fast_code_docs_ticket] the fast
    lane once per code AC after resetting both to todo, plus one hand-authored docs ticket with architecture-diagram-author,
    documentation-expert and documentation-verifier built through build-feature (kernel rank 4 of 4).'
