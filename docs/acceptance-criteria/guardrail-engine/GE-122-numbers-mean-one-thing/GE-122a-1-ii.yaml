id: GE-122a-1-ii
title: "Excusing a merged-in decision record must not excuse the author's own record claiming the same number"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the decision namespace already holds a record claiming the number 034 on the shared
    upstream ref,
  And the current change set is a merge that brings that upstream record in, so it is staged
    although this author did not write it,
  And the same change set ALSO stages a second, newly authored decision record that
    independently claims 034,
  When the decision-number gate runs,
  Then it terminates with a failing result,
  And its report names the contested number 034,
  So the author learns of the double-claim at commit time rather than after it has landed on
    the shared ref.

  And Given the same merge staging ONLY the upstream record, with nothing authored here
    claiming its number,
  When the gate runs,
  Then it terminates with a passing result — a record authored upstream and merged in is not
    a collision against the very ref it came from.

  And Given a change set that stages two brand-new records which both claim the number 077,
    a number no record on any ref has ever claimed,
  When the gate runs,
  Then it terminates with a failing result naming 077.

  The property this criterion pins: the merged-in exemption is a property of a FILE, not of a
  NUMBER. A gate that decides "this number was merged in" and then drops every staged claimant
  of that number discards the author's own file along with the upstream one, and hands its
  collision detector an empty set. The three scenarios above are jointly load-bearing: the
  first alone can be satisfied by deleting the exemption, and the second alone by keeping the
  defect.

  Coverage note: covered only by a test that EXECUTES the gate against a real repository with a
  real merge in progress and real staged files, and asserts on its exit status and emitted
  report. A test that asserts on a helper's return value in isolation does not cover it — the
  defect lives in how the helper's per-number answer is applied to a per-file set, which is
  invisible from inside the helper.
