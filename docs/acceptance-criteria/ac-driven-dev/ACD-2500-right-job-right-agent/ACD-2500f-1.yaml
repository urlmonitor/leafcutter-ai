it_requirements:
- Canonical sources are the frontmatter of templates/agents/product-owner.md, business-analyst.md and
  test-designer.md. config/agent_registry.json entries are updated to match; generated agent cards are
  regenerated by the build, never hand-edited (ADR-001).
- As in ACD-2500e-1, the registry entry carries produces and description but no mutates. 'Same produces
  value' is checked between template, registry entry and generated card; mutates is checked between template
  and card.
- Each new mutates description names the record fields that agent writes, in the same terms as the it-po
  entry.
- After the change, the profile consistency check (ACD-2500e-1-i, extended by ACD-2500f-1-i) lists none
  of the four requirement writers.
