created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
    strict: true
    min_lines: 5
    threshold_percent: 5
  And the jscpd binary is installed (version 3.x)
  And the working tree contains a duplicate code pair between:
    - file_a.py (NOT staged) lines 10-25
    - file_b.py (NOT staged) lines 30-45
  And the developer has staged only file_c.py which contains no duplicates
  When the duplicate code hook runs at pre-commit time
  Then the hook does NOT report the file_a.py / file_b.py duplicate pair
  And the hook exits with code 0
  And no warnings are emitted about unstaged-file duplicates
