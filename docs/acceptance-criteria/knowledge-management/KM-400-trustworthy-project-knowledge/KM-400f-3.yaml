notes: |
  Authored 2026-10-09. This is the criterion that would have prevented the measured
  incident. 32 unreclaimed generations reached 189,950 nodes and 304,498 relationships,
  crossed the hosted free-tier ceiling, and the instance latched read-only. Every write
  then failed, including the cleanup that would have recovered the space — reclaiming
  space needs the writes a full instance blocks — so the instance had to be destroyed and
  recreated. Nothing measured headroom before writing, so nothing could refuse.

  The figures in the first scenario are the measured incident figures, kept deliberately:
  189,950 of a 200,000-node ceiling is 94.98 percent, so the snapshot does not fit and the
  refusal is the correct outcome.

  Refusing BEFORE any write is the whole point. A refusal issued after a partial write has
  already consumed the headroom it was checking and can itself be the write that fills the
  instance. The unknown-ceiling clause exists because a backend that cannot report its
  ceiling must not be silently treated as having room; reporting unknown keeps the operator
  able to act, while reporting a fit is the failure dressed as a pass.
it_requirements: null
test_required: true
test_spec:
  - name: test_insufficient_headroom_refuses_before_any_write
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: With the measured incident figures, request publication through the real
      entry point against a backend double that records every call; assert no write call
      was made, the refusal names usage, ceiling, snapshot size and shortfall for both
      nodes and relationships, and the active pointer is unchanged.
    covers: [KM-400f-3]
    must_catch:
      - "check headroom after the snapshot has begun writing"
      - "refuse with a generic message that names none of the four figures"
      - "compare only node counts and ignore the relationship ceiling"
    requires_db: false
  - name: test_warning_threshold_proceeds_and_names_the_same_figures
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: Drive usage just above the warning threshold and just below it; assert
      the first proceeds with a warning naming usage, ceiling, snapshot size and remaining
      headroom, and the second proceeds silently.
    covers: [KM-400f-3]
    must_catch:
      - "treat the warning threshold as a refusal threshold"
      - "warn on every publication regardless of usage"
    requires_db: false
  - name: test_undeterminable_ceiling_is_unknown_never_a_fit
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: With a backend that does not report a ceiling, assert the headroom result
      is unknown, names the measured usage, and is not counted as a satisfied check.
    covers: [KM-400f-3]
    must_catch:
      - "treat an unreported ceiling as unlimited capacity"
      - "default the ceiling to a built-in figure and report a fit"
    requires_db: false
  - name: test_read_only_backend_is_a_capacity_condition_not_an_empty_result
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: Simulate the latched read-only condition and assert the refusal names it
      and the measured usage, and is distinguishable from a successful run that found
      nothing.
    covers: [KM-400f-3]
    must_catch:
      - "surface the read-only rejection as an empty or successful result"
    requires_db: false
  - name: test_live_headroom_is_measured_from_a_loaded_backend
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Against a real database loaded with enough published generations to cross
      a deliberately lowered declared ceiling, assert the measured figures match the
      backend's own counts and that publication is refused without mutating the graph.
    covers: [KM-400f-3]
    requires_db: true
test_rationale: >-
  A headroom gate is untestable against a fixture that never approaches the ceiling, so
  the criterion test uses the measured incident figures and the live test lowers the
  declared ceiling and loads the backend until it actually binds — explicitly unlike the
  existing 2-node live snapshot in this family, under which no limit is ever reached and a
  gate that never fires would pass. "Refused before any write" is asserted by recording
  calls on a backend double, because a test that only checks the return value cannot
  distinguish a pre-write refusal from a post-write one, and that distinction is the whole
  criterion. must_catch names the wrong versions because this is a gate AC and a gate that
  is defined but never consulted is the documented failure mode in this repository.
