estimated_complexity: S
it_requirements:
  - "The reviewer prompt must include an explicit anti-fallback rule: running the unit test suite is never an acceptable substitute for exercising the feature, even when it is the path of least resistance."
  - "A could-not-exercise outcome must be a first-class reportable result (with a reason), distinct from a clean no-findings result and from any test-derived output."
