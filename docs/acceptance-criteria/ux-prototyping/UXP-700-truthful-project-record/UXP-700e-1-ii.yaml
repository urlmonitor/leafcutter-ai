id: UXP-700e-1-ii
title: "Enforcement tightens only when nothing is left on the older shape"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a bound in its warning period,
  When every artifact in the record declares the shape version in which that bound took effect,
  Then the bound may be tightened so that exceeding it stops the work that triggered the check,
  And while any artifact still declares an older shape version, tightening is refused and the
    refusal names the artifacts still on the older version,
  And the decision to tighten is taken from what the record contains, so a date passing does not
    tighten a bound and a hand-edited flag cannot tighten it either.
depends_on:
  - UXP-700e-1
created_by: "docs/acceptance-criteria/ux-prototyping/UXP-700-truthful-project-record/UXP-700e-1.yaml"
