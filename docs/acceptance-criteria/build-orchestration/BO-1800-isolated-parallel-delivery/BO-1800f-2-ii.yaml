criteria: |
  Given a delivery in which file A is absent because one of the copy's own commits
    took it away,
    and file B is absent only because the copy started from a state older than the
    one that introduced B, no commit of the copy's having touched B,
  When the workflow reports what the delivery would take away from the shared branch,
  Then A is reported as taken away by the copy's own commits,
  And B is reported as absent because the copy's starting state predates it,
  And the two are reported as separate findings rather than as one count of absent
    lines that does not distinguish them.
