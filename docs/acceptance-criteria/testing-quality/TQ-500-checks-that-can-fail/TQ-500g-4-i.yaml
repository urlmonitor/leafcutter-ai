title: "A run that reports failure overall but shows no failing test is inconclusive, never a clean pass"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given three test runs over the tests covering one requirement —
      R1: the run as a whole reports failure, yet every test outcome that can
          be read from its output is a pass (for example because the failure
          was reported in a form the reading does not recognise),
      R2: the run as a whole reports success and every readable outcome is a
          pass,
      R3: the run as a whole reports failure and test_refresh_gate is read
          as failed,
  When the proof-of-done check and the red-baseline check read each run,
  Then R1 is reported as inconclusive, with the reason that the run reported
      failure but no failing test could be identified,
    And from R1 no requirement is judged eligible for done, and no test is
      counted as green at baseline or as red at baseline,
    And R2 is read as today: its tests passed,
    And R3 is read from its per-test outcomes as today — test_refresh_gate
      failed — and is not reported as inconclusive.
