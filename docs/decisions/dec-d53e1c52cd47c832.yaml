rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.kernel_entry_point] Make the kernel the default
    entry for design, planning and lookup questions in Claude Code sessions (required mean 0.80, 2/3 passed); 2. [opt.consult_precedent]
    have agents consult the kernel for precedent before asking the user a design question, applying standing policies such
    as POL-GIT-001 directly (required mean 0.48, 0/3 passed); 3. [opt.session_records] file human decisions made in Claude
    Code sessions as decision records (required mean 0.42, 0/3 passed); 4. [opt.trace_analyzers] run trace analyzers over
    the recent kernel traces (required mean 0.28, 0/3 passed). human:user chose option [opt.kernel_entry_point] Make the kernel
    the default entry for design, planning and lookup questions in Claude Code sessions (kernel rank 1 of 4).'
  origin: template
assumptions:
