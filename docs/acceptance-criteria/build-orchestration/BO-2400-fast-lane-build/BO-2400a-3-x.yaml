id: BO-2400a-3-x
components:
  - build_orchestration
  - testing_quality
title: "A backfilled test is accepted only after it is seen to fail against a deliberately broken implementation"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given UXP-510 is classified as a test backfill, with newly-added tests T1, T2, T3
    and T4 all green at baseline,
  When the mutation proof runs for UXP-510,
  Then the code those tests exercise is broken in place, one deliberate change at a
    time, where that code existed before this run and this run has not changed it,
  And T1 to T4 are re-run against each broken version,
  And a test counts as proven when it is classified red, under the rule of
    BO-2400a-3-vi, against at least one broken version,
  And UXP-510 passes the mutation proof only when every one of T1, T2, T3 and T4 is
    proven.

  Given a broken version that stops the code from being imported or collected, so that
    T1 is reported errored rather than failed,
  When the mutation proof classifies T1 against that version,
  Then T1 is not proven by it, because an errored test is inconclusive and any test
    errors against code that cannot load.

  Given UXP-510 has passed the mutation proof,
  When the verdict is reported,
  Then it records, for each of T1 to T4, the broken version that made it red: what was
    changed, in which file and where, so a reviewer can repeat the break by hand,
  And once the code is restored, T1 to T4 are re-run and reported passed before the
    run continues.
depends_on: [BO-2400a-3, BO-2400a-3-ix, BO-2400a-3-vi]
