assigned_agent: business-analyst
estimated_complexity: M
it_requirements:
  - "The deliverable is an AC-STORE RECORD, not code: a new pattern AC YAML in docs/acceptance-criteria/ac-store/ authored by business-analyst (the agent that owns Gherkin criteria bodies). It is not a package artifact, so neither workflow-architect nor llm-expert applies here."
  - "Slot format is fixed by config/ac_store_schema.json: pattern_slots is a uniqueItems array of '{word}' placeholder STRINGS with braces. Declare at least three — {agent_under_test}, {round_task_sets}, {round_seeded_items} — and place each verbatim as a placeholder in the criteria body (the ACS-500g-2-i both-places rule)."
  - "Multi-value slots: the per-round task sets and per-round seeded items each carry three values (one per round). pattern_bindings values may be arrays (schema: 'Values may be strings, arrays, or objects'), so bind them as three-element arrays rather than inventing three separate slots per round — one slot per independently varying value is ACS-500g-2 rule 4."
  - "The three-round structure, the seeded-gap mechanic and the scoring rule are written LITERALLY in the parameterised body (they do not vary). Only the three slot values vary. A per-agent restatement of the structure violates the criteria's last clause and is what the pattern exists to prevent."
  - "The record must be recognised as a pattern by the DEPLOYED predicate _has_parameterized_slots in templates/scripts/commit_guardian/check_ac_pattern_refs.py. Satisfy both limbs (non-empty pattern_slots AND placeholders in criteria) so the business-analyst §1 Step 7 inventory scan and the commit hook both see it."
  - "Do NOT set implements_pattern on this record — it is the pattern, not a consumer. Its first consumer is ACS-500g-7."
  - "INTEGRATION CONFLICT TO RECONCILE (raised as a caveat, not silently absorbed): the repo already has an agent-evaluation harness at scripts/evals/ (run_agent_eval.py, eval_selector.py, agent_eval_config.json) that scores by a FRACTIONAL threshold — pt-classifier is configured at 0.7. The all-or-nothing rule in ACS-500g-6-i contradicts that regime. The pattern must state which regime governs and, if the harness is to enforce it, a seeded_gap scoring mode with threshold 1.0 and per-round verdicts is required — that is a python-coder change this docs AC does not cover. Flag it rather than assuming the harness already behaves this way."
  - "This pattern is the project's agent-quality gate, so it must be instantiable for the pattern-steward built in ACS-500g-1 — check the slot set against that concrete case before finalising."
delivers_to:
  - agent: business-analyst
    contract: "The agent-evaluation protocol as the store's FIRST pattern AC: pattern_slots ['{agent_under_test}', '{round_task_sets}', '{round_seeded_items}'] (at minimum), each present as a {word} placeholder in a criteria body that states the three-round seeded-gap structure literally. Consumed by ACS-500g-7 via implements_pattern."
  - agent: llm-expert
    contract: "A non-empty pattern inventory — the first record that makes the business-analyst §3a pattern-first check return a match instead of empty, ending the cold start."
expects_from:
  ac_id: ACS-500g-2
  contract: "The slot naming/scope rules and the parameterised-criteria authoring rule from templates/skills/authoring-patterns/SKILL.md, including the both-places slot declaration rule from ACS-500g-2-i."
origin_agent: BrainCandy
created: 2026-08-13
amended_by: []
superseded_by: null
covered_by: [ACS-500g-6-i, ACS-500g-6-ii, ACS-500g-6-iii]
