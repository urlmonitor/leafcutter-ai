amended_by:
- reason: 'USER-APPROVED REDESIGN AFTER TWO EXPERT REVIEWS (2026-10-08), decisions
    A, B, I and J. (A) REVERSAL OF AN EARLIER DECISION, RECORDED EXPLICITLY: the issue
    is no longer the gate. SUPERSEDED premise: "the flag is a single open repository
    issue carrying the label `nightly-red`, and that this open issue is the one source
    of truth the per-PR hold reads". Now the hold reads the run history (TQ-600a-13-vi)
    and this issue is the human-facing notice. Reason, reached independently by both
    experts: the issue is derived, written by a job that can fail, closable by anyone,
    and closed automatically by any merged `Fixes #N`; with the issue as the gate,
    a failed write or a close released every hold. Added clause: a failed notice write
    changes no verdict. (B) Renamed `nightly-red` to `post-merge-red`; "night" to
    "run". (I) The current state now lives in the issue DESCRIPTION, rewritten each
    run; SUPERSEDED: "TQ-600a-13-xi''s allowed writes do not include editing an issue''s
    description, so the latest night''s state is the LATEST COMMENT" — the GitHub
    expert verified no separate permission exists. (J) Labels pre-created and asserted
    on create; SUPERSEDED: "observed on the first real red night". Duplicates: SUPERSEDED
    the PENDING USER DECISION "two or more open flags" — lowest number canonical,
    others closed as duplicate. Notice now written by a separate workflow triggered
    on the suite''s completion. Readiness returned to draft for IT PO re-enrichment.
    Full prior text: commit e79d35ef4.'
