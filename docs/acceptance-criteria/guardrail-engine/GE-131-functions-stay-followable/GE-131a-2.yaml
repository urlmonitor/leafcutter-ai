id: GE-131a-2
title: "The check is registered on the ordinary commit path, lets existing offenders through, and is shown refusing a grown and a new function through a real commit with a refusal that says what to do"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the check is registered in the package's default hook list, and a scratch
    git repository whose committed baseline holds the real tracked
    scripts/build_helpers.py, whose _compute_output_mappings scores above the limit
    (65 on 2026-10-09),
  When an ordinary `git commit` stages that file with one appended comment line and
    nothing invoked by hand,
  Then the complexity check runs as part of that commit and the commit completes.

  Given the same registered check and a scratch repository whose committed
    scripts/planner.py holds plan_batches scoring 30,
  When an ordinary `git commit` stages plan_batches raised to 31,
  Then the commit is refused and does not land, and the refusal names
    scripts/planner.py, plan_batches, its score 31, the ceiling applied 30 (not 15),
    the reason "grew", and the installed complexity-reduction skill,
  And it tells the author that a pure move or rename of an unchanged function is
    committed with SKIP=check-complexity.

  Given the same registered check,
  When an ordinary `git commit` stages a new function parse_rules scoring 16,
  Then the commit is refused and does not land, and the refusal names the file,
    parse_rules, its score 16, the ceiling 15, the reason "new", and the
    complexity-reduction skill.

  Given this change has landed,
  When the package's record of advertised-but-unrun checks and its declared non-gate
    list are read by their existing checks,
  Then the unrun record is smaller by exactly this one check, and nothing in the
    package's registration data still describes it as withheld.
depends_on:
  - GE-131a
  - GE-131a-1
