notes: |
  ANSWERS THE PO's OPEN QUESTION on GE-124a — deliberately, in one place, so
  the file glob does not decide it silently. The rule is TWO-PART: an in-scope
  extension AND rendered markup in the file. Extension alone over-reaches
  exactly as the PO warned (helpers, hooks, type-only modules and barrels all
  share the extensions); markup-bearing is the narrowest rule that still
  catches every file that can put something on a screen.

  The recorded reason is not decoration. GE-124d's opt-outs are the pressure
  valve for this rule being wrong at the edges, and the PO's instruction is
  that clustered opt-outs are evidence the rule needs narrowing. That evidence
  is only collectable if the in-scope decision says why.

  Named exclusions that survive the markup test (stories, tests, generated
  files, barrels) are GE-124a-3-i and GE-124a-3-ii.

  IT-PO ENRICHMENT NOTE (2026-08-25). Markup detection has no exact
  implementation available to a Python pre-commit hook — there is no JS AST in
  that process. The criteria do not say which way an imperfect scan should err,
  and that choice determines whether the guardrail's errors are visible or
  silent. Pinned to fail-towards-in-scope, with GE-124d-2 as the accountable
  exit.
