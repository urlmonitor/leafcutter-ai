id: ACD-1300e-3-i
components:
  - ac_driven_dev
  - build_orchestration
readiness: approved
priority: high
title: "Every pause of the same kind persists, not just some of them"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
declares_side_effect: true
roadmap_phase: phase_1
criteria: |
  Given five separate planning runs, each with no person attached, each reaching the same
    decision point with drafted criteria on disk, and the project's pause store writable,
  When each run records that it is waiting,
  Then all five end reported as waiting with a record present on disk for each run id,
  And none of the five ends as "pause persist failed",
  And the same holds when the five runs are started from a worktree of the project
    rather than from the project root,
  And when the pause store is not writable, the run reports the pause as failed, the
    report names the store write as the cause (not a refusal by the step performing it),
    and the drafted criteria are still present on disk unchanged.
depends_on: [ACD-1300e-3]
doc_links:
  - path: templates/workflows-js/plan-feature.js
    relationship: modifies
    status: exists
  - path: docs/architecture/components/interactive-pause-resume-substrate.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-024-interactive-pause-resume.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: ACD-1300e-3
  contract: >-
    Every pause-record operation is one plain command (ACD-1300e-3-ii) dispatched to shell-runner
    (ACD-1300e-3, ADR-070) with only the command and the run-unchanged instruction. The reply is a
    result {command, exit_status, stdout, stderr} for a command that ran, or a decline
    {declined: true, agent: 'shell-runner', reason} with no exit_status key for one that did not
    (templates/agents/shell-runner.md), classified by shellStepReply(). pause_persist_failed is
    returned if and only if the read-back finds no record, with a message naming the cause
    (ACD-1300e-3-iv).
declared_files:
  - path: templates/workflows-js/plan-feature.js
    state: existing
it_requirements:
  - "The executor id is a fixed value (shell-runner), never chosen per call, per run, or by fallback rotation, so the outcome cannot vary between runs reaching the same gate."
  - >-
    Runs started from a linked worktree and from the project root write to and read from the same
    store: its path is computed in the workflow body from the accepted maker answer's
    workspace_path (<workspace_path>/<output_root>/paused_runs, ACD-1300e-3-ii), never from the
    session's working directory. This keeps ACD-2100a-4's guarantee without the removed git
    rev-parse --git-common-dir subshell (amended 2026-11-04 by it-po).
  - "When the store is not writable, pause_store.py's non-zero exit and stderr are carried into the pause_persist_failed message, which names the store write as the cause and not a refusal by the executor."
  - "A pause failure never deletes, rewrites, stages or commits drafted criteria."
test_intent:
  - clause: all five end reported as waiting with a record present on disk for each run id
    needs_test: true
    reason: The routing was reported as varying between runs, so the outcome must be shown for every one of several runs.
  - clause: none of the five ends as "pause persist failed"
    needs_test: true
    reason: A fixed executor id is what makes the outcome the same each time, and a fallback or rotation breaks that silently.
  - clause: >-
      the same holds when the five runs are started from a worktree of the project rather than from the project root
    needs_test: true
    reason: The store path must not depend on where the run was started, which only a run from a second directory shows.
  - clause: >-
      when the pause store is not writable, the run reports the pause as failed, the report names the store write as the cause (not a refusal by the step performing it), and the drafted criteria are still present on disk unchanged
    needs_test: true
    reason: A store failure and an executor refusal must be told apart from the reply, and a wrong branch names the wrong cause.
test_spec:
  - name: "test_five_headless_runs_all_reported_waiting_with_records"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "real_artifact"
    description: "Five run ids reaching the same gate each return paused_awaiting_input; the pause-persist command captured for each run is run for real and paused_runs/<run_id>.json exists for each of the five."
    proves_clause: "all five end reported as waiting with a record present on disk for each run id"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_none_of_five_runs_ends_pause_persist_failed"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "discrimination"
    description: "No result of the five runs is pause_persist_failed and the agentType is the identical shell-runner for every pause-record dispatch of every run."
    proves_clause: "none of the five ends as \"pause persist failed\""
    code_file: "templates/workflows-js/plan-feature.js"
    must_catch:
      - "revert the fix"
      - "executor chosen from a list or by fallback so that different runs hit different agents"
  - name: "test_five_runs_from_worktree_persist_to_shared_store"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "boundary"
    description: "With the process started in a linked git worktree of a temporary project, the five runs' commands name a store derived from args.workspace's workspace_path, not the working directory, and the records land in that store and are readable from the project root."
    proves_clause: "the same holds when the five runs are started from a worktree of the project rather than from the project root"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_unwritable_store_reports_store_write_cause_and_keeps_drafts"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "failure"
    description: "With the store location blocked by a regular file, the real pause_store.py exits non-zero and the scripted result carries its exit_status and stderr; the result is pause_persist_failed, its message names the store write (not a refusal by the executor), and the drafted AC files are byte-identical."
    proves_clause: "when the pause store is not writable, the run reports the pause as failed, the report names the store write as the cause (not a refusal by the step performing it), and the drafted criteria are still present on disk unchanged"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_five_runs_reachable_from_workflow_entry"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "reachability"
    description: "Each of the five runs is started through the E2 harness on plan-feature.js (the real entry) and its terminal payload is asserted."
    proves_clause: "all five end reported as waiting with a record present on disk for each run id"
    code_file: "templates/workflows-js/plan-feature.js"
    surface_invoked: "templates/workflows-js/plan-feature.js driven through unit_tests/_workflow_engine_harness.py run_workflow_under_e2"
test_rationale: "Consistency across runs is guaranteed structurally (one fixed executor id) rather than statistically, so the discrimination entry pins the fixed id across five runs; the five-run, worktree and unwritable-store cases run the captured pause-store commands against the real pause_store.py in temporary directories and read the records back."
