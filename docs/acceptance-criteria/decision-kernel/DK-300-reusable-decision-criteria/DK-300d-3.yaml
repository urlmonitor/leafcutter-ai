notes: |
  OPEN, NOT SETTLED BY THE FLOWS (PO open item): how a NEW decision's reuse becomes a member pair. Option 1: publishing the decision also stages and publishes the category update in the same person-run publish. Option 2: the next mining round proposes the pair for a person (DK-300a-1-ii's last clause). This AC pins only the invariants both options must keep; the IT PO or the user picks the path. DK-300f's usage and outcome counts depend on it.
  Membership lives only in the category record; published decision records stay unchanged (dec-93c1c730463c1f3c).
