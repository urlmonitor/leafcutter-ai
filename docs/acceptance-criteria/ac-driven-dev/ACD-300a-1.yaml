id: ACD-300a-1
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Triage routes 'new feature / strategic' requests to the product owner first"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the user's request describes a new capability, a product goal, or a
    strategic change that does not map to any existing L1 AC in the store,
  When the Haiku triage agent evaluates the request against the AC store,
  Then it classifies the route as "strategic",
  And the classification signal includes: no matching L1 parent found,
    request describes user-observable outcome or new system capability,
    request does not reference specific existing components or ACs,
  And the routing decision dispatches to: product owner -> business analyst ->
    technical planner -> test designer (full pipeline).
depends_on: [ACD-300a]
doc_links:
  - path: templates/skills/plan-feature/SKILL.md
    relationship: describes
    status: exists
  - path: docs/architecture/diagrams/c2-002-ac-authoring-pipeline.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
declared_files:
  - path: templates/agents/ac-triage.md
    state: existing
it_requirements:
  - "Edit the canonical triage template only (templates/agents/ac-triage.md); deployed and installed copies are regenerated by the build and never hand-edited (ADR-001)."
  - "The triage agent stays Haiku-pinned (model: haiku) and read-only (tools Read and Bash, empty spawn_allowlist, mutates nothing); the latency budget of the parent ACD-300a (under 3 seconds for a store of up to 200 ACs) still holds."
  - "The strategic rule in the template must name all three signals of the criteria (no matching L1 parent, a user-observable outcome or new system capability, no reference to a specific existing component or AC), and the returned rationale must name the signal that decided the route."
  - "The routing reply keeps its current keys and value types (route, existing_acs, parent_l1_id, rationale, anomalies), so the Stage 0 reader in templates/workflows-js/plan-feature.js needs no change."
  - "The strategic dispatch order (product-owner, business-analyst, it-po, then test-designer) is already produced by templates/workflows-js/plan-feature.js; this record must not change that file."
delivers_to: null
expects_from: null
test_required: true
test_intent:
  - clause: it classifies the route as "strategic"
    needs_test: true
    reason: The strategic route is the default branch of the triage decision order, and a reordered or missing branch would send a new capability down a shorter pipeline.
  - clause: 'the classification signal includes: no matching L1 parent found, request describes user-observable outcome or new system capability, request does not reference specific existing components or ACs'
    needs_test: true
    reason: The template today names only the missing L1 parent, so a check that the rule carries all three signals is what shows the change was made.
  - clause: 'the routing decision dispatches to: product owner -> business analyst -> technical planner -> test designer (full pipeline)'
    needs_test: true
    reason: The stage order is built by the workflow from the route, and a dropped or reordered stage would skip the product owner or the test designer.
test_spec:
  - name: test_acd_300a_1_triage_template_defaults_unmatched_request_to_strategic
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_1.py: reads the real templates/agents/ac-triage.md; its frontmatter pins model haiku with tools Read and Bash only and an empty spawn_allowlist, and its decision steps check covered, then the L1 match, then the technical constraint, and only then default an unmatched request to route strategic.'
    proves_clause: it classifies the route as "strategic"
    code_file: templates/agents/ac-triage.md
  - name: test_acd_300a_1_strategic_rule_names_all_three_signals
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_1.py: the strategic rule of templates/agents/ac-triage.md names all three signals (no matching L1 parent; a user-observable outcome or new system capability; no reference to a specific existing component or AC), and the rationale field rule tells the agent to name the signal that decided the route. Red today: the rule names only the missing L1 parent.'
    proves_clause: 'the classification signal includes: no matching L1 parent found, request describes user-observable outcome or new system capability, request does not reference specific existing components or ACs'
    code_file: templates/agents/ac-triage.md
  - name: test_acd_300a_1_strategic_route_dispatches_product_owner_first
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: 'In unit_tests/workflows/test_acd_300a_1.py: drives the real templates/workflows-js/plan-feature.js through run_workflow_under_e2 (unit_tests/_workflow_engine_harness.py) on a fresh run, stage-0-triage replying route strategic and pt-classify replying outcome none; the first stage-*-author dispatch is stage-po-author, its instructions carry route "strategic", no other stage-*-author is dispatched, and the run returns paused_awaiting_input at gate-po (every gate pauses, because resolveGate never runs the live gate).'
    proves_clause: 'the routing decision dispatches to: product owner -> business analyst -> technical planner -> test designer (full pipeline)'
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_1_strategic_route_runs_ba_itpo_then_test_designer
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_1.py: same harness, triage strategic, crash-resume with scan-committed-stages listing a plan-feature(PO) and a plan-feature(BA) commit; the label table follows unit_tests/ac_driven_dev/file_findings/_handback_support.py (design-prepass, rule-check-itpo, rule-check-test-design, approval-holds and commit replies). Exactly two resume-log dispatches precede stage-itpo-author, stage-test-design-author follows it, no stage-po-author or stage-ba-author is dispatched, and the run pauses at final-gate. With the test above this shows the order product owner, business analyst, technical planner, test designer.'
    proves_clause: 'the routing decision dispatches to: product owner -> business analyst -> technical planner -> test designer (full pipeline)'
    code_file: templates/workflows-js/plan-feature.js
