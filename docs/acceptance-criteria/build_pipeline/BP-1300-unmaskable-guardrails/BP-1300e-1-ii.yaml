change_target: code
risk_surface: contract_boundary
notes: |
  THE TENSION AND THE DECISION. CI lints the whole tree. A commit-time check over
  the whole tree on every commit is slow, and it would make the commit pay for
  files it never touched. Checking only changed LINES would let a touched file
  with older violations commit and then fail CI, which is a silent whole-tree
  slip. Decision: the unit is the whole staged FILE. A file the commit touches is
  judged exactly as CI will judge it, and files it does not touch are left to CI.

  WHY THIS EQUALS CI'S VERDICT, AND THE ASSUMPTION IT RESTS ON. CI's lint check is
  required and blocking, so main carries no violation inside the declared scope.
  Every violation in an in-scope file therefore entered through some change that
  touched that file. Under the selected rules (E, F, E722 repo-wide; E722, BLE001,
  TRY on kernel) every finding is a property of one file's content, so a change to
  file A cannot create a finding in an untouched file B. Per-file scope then gives
  CI's verdict for every file this commit changes.
  RECORDED ASSUMPTION / RISK: if a rule is ever selected whose finding depends on
  another file (a cross-module rule), an untouched file can start failing CI
  because of a staged change elsewhere. Per-file scope is then insufficient, and
  this record must be revisited: fall back to a whole-scope run when such a rule
  is selected. Raised in notes rather than criteria because no such rule is
  selected today.

  The "predates this change" wording in the refusal is required, not cosmetic.
  Without it the author of a one-line edit reads the refusal as a false accusation.
