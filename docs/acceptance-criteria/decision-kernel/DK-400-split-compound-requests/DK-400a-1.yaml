notes: |
  Flow node split-detect, the turned-away case. The real case is the run of 2026-10-02
  (run-40d2159630bb48bd), which ended blocked with an unsupported gap and was then split by hand
  outside the kernel.
  Left to the IT PO on purpose (DK-400a CARRY TO L2): how the kernel tells one question from
  several. Candidates are a cheap check before any proposal, in ADR-053 order (deterministic
  code, then Jev), or the proposal itself with the fewer-than-two rule (DK-400c-3).
  The ambiguous trigger is DK-400a-1-i; honest gap counts are DK-400a-1-ii.
  IT PO (2026-10-05): settled how one question is told from several (BA open point 1): deterministic
  gates first, then one literal Jev noul riding the item's existing intent or routing batch (no
  extra provider call), threshold split.bundle_threshold 0.8, then the host's proposal with the
  fewer-than-two backstop (DK-400c-3); a person approves. No keyword heuristics. Off switch
  split.enabled restores today's behaviour.
