it_requirements:
  - "Every pytest invocation used to run or verify these tests must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "The order must be obtained by executing the scanner over a temporary store through its real command surface; neither a source-text assertion nor a direct call to the private sort helper satisfies this AC."
  - "The storage-order clause must be tested by holding the identical records under filenames whose alphabetical order is the reverse of the record identifiers, and comparing the two whole answers. A test that merely runs the same store twice passes on an implementation with no tie-break at all, because the enumeration order happens to be stable today — which makes the obvious determinism assertion vacuous."
  - "The two runs compared for repeatability must be genuinely separate invocations of the command surface, not one invocation whose result is compared with itself. A cached or reused result proves nothing about repeatability."
  - "This AC pins the tie-break chain that ships. It authorises no change to the keys, their order, or the sentinel behaviour beneath them."
