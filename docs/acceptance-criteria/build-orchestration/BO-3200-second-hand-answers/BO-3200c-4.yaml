notes: |
  Satisfies the how-to entry in BO-3200c's documentation_triggers.

  THE SECOND SCENARIO MAKES THIS EXECUTABLE, which is the only way a how-to is worth writing in
  this tree: its steps are run against a real paused run and must produce the stated result.
  That converts the document from a description into a covered path, and it is the same
  discipline BO-3100d applies to the topology record.

  THE THIRD SCENARIO PUTS THE DISTINCTION IN FRONT OF THE PERSON WHO CARES ABOUT IT. A user
  who has just lost a run to a cancel they never gave needs to know which of the two states
  they are in; BO-3200c-3 makes the system distinguish them, and this makes the distinction
  legible to the only party affected by it.

  IT-PO ENRICHMENT NOTE (2026-08-26). "Steps executable verbatim" is stated as a requirement
  because the second criterion is otherwise unimplementable: a step phrased as an objective
  rather than a command cannot be run exactly as written, so the covering test would degrade
  into a human reading the page — which is the review-based coverage this tree rejects
  everywhere else.
