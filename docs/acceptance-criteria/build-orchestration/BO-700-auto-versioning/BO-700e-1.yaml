title: "The done-link closure invokes changelog emission as a mandatory step"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has been driven to completion
    and the done-link closure step (mark_ac_done.py) is invoked,
  When mark_ac_done.py updates the AC YAML work_status to done,
  Then it also invokes the changelog emission step for the same ticket
  And the changelog emission is invoked AFTER the AC status update succeeds
    but BEFORE the ticket is moved to the done/ folder
  And if the changelog emission step fails,
  Then the done-link closure reports the failure
  And the AC work_status remains done (the AC update is not rolled back)
  And the ticket is NOT moved to the done/ folder until the changelog entry exists.
