title: "The build parses each distinct frontmatter text once, however many times it asks for it"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-8.yaml"
criteria: |
  Given a build that asks template_compiler.parse_frontmatter for the same template
    text many times (a fresh-consumer build made 1,606 calls over 176 distinct texts),
  When the same frontmatter text is parsed repeatedly in one process,
  Then the YAML loader is invoked once for that text, not once per call,
  And two texts that differ in any character are each parsed by the loader,
  And the stored parses live only in the memory of the running process, and nothing
    carries over to a later build,
  And the number of stored parses is bounded, so a long-lived process that parses many
    different texts does not grow without limit,
  Because a profile of a fresh-consumer build put about 34 of its 77 profiled seconds
    in the pure-Python YAML stack called from parse_frontmatter, and measured 14.9
    CPU seconds of the unprofiled build in that function, of which 13.9 were re-parses
    of text already parsed.
