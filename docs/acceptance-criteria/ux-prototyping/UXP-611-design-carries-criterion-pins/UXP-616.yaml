title: "Mockups drawn before this convention stay valid, and coverage grows as they are edited"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the five rendered mockups that exist today, none of which carries a
    single pin
  And a change that touches none of them
  When the pin convention is evaluated
  Then none of those mockups appears in any collection the run produces —
    not as exempt, not as deferred, not as pre-convention, not as skipped,
    not as passed, and not as failed
  And none of their ids appears anywhere in the run's report

  Given a change that edits one existing rendered mockup
  When the pin convention is evaluated
  Then that mockup, and only that mockup, is held to the convention
  And the other untouched mockups remain unevaluated, so coverage grows
    screen by screen as mockups are edited

  Given a change that adds a new rendered mockup
  When the pin convention is evaluated
  Then the new mockup is held to the convention on the change that introduces it

  Given the convention is introduced
  When the mechanism that enforces it is defined
  Then it uses no dated cutoff, no exemption list, no permanent opt-out
    population, and no backfill counter
  And no artifact anywhere records how many mockups are still unannotated
