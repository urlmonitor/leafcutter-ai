notes: |
  Rule families this check owns are enumerated in ACD-2400a-2 (five families) and
  ACD-2400a-3 (the sixth, specialist-versus-surface). This AC is the contract every
  family reports through: file + record id + rule family + disposition, fail-closed.

  "Extend, do not duplicate" (ACD-2400a L1 notes): the store already has a blocking
  commit-time record check (required fields incl. non-empty components), a parent
  back-link check and an orphan scanner. The last clause is the observable form of
  that instruction: one violated rule, one finding. IT-PO decides whether the new
  check is an extension of the existing record check or a caller of it; either way
  the finding count must not double.

  Contrast deliberately with the circular-dependency check, which is documented as
  FAIL-OPEN (exception -> exit 0). This check is fail-closed: see ACD-2400a-1-i
  (zero records) and ACD-2400a-1-ii (unreadable record / rule error).

  Named alteration for the implementer: make the check return passed whenever the
  finding list is empty regardless of records checked -> ACD-2400a-1-i must go red;
  parent clauses here stay green. That asymmetry is why -i is its own record.
