notes: |
  Boundary edge for the path-scoping rule: a mixed pull request must not let a
  web-app change slip through unchecked just because it is bundled with backend
  or docs changes. The web-app trigger is "touches any leafcutter-web/ file",
  not "touches only leafcutter-web/ files".
