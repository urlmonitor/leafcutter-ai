title: "Authoring requirements never disturbs your work and always lands safely on main"
component: build-orchestration
level: L0
status: active
req_status: draft
work_status: todo
criteria: |
  Writing requirements is safe from start to finish -- it stays out of your way and lands the right way.

  When you author acceptance criteria, the work happens in its own private space
  that never touches whatever you are currently working on and never collides
  with anyone else working at the same time. Your progress is safe even if
  something interrupts you partway through. When you approve the result, it
  reaches the shared, protected main line the same trustworthy way every other
  change does -- through a reviewed pull request that passes the project's
  quality checks -- with that request handed straight back to you. You never
  have to clean up stray files or stitch together a delivery by hand afterward.
