criteria: |
  A requirement names its own deliverables -- code, tests, docs, diagrams, config.

  Each requirement carries an explicit checklist of everything it must deliver --
  not just the code, but the tests, documentation, diagrams, and configuration
  that go with it. Anyone can see at a glance the full scope of what a requirement
  entails, and the work to build it is derived directly from that checklist.
