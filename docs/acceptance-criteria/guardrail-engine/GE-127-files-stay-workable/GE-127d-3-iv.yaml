notes: |
  GE-127f-2 is work_status done and its criteria already hold that unmeasured content adds
  nothing. Under the old rule `//` lines were measured, which is why restoring them cost
  lines. No amendment to GE-127f-2 is needed; this record exists so the restyle case has
  its own executing test.
