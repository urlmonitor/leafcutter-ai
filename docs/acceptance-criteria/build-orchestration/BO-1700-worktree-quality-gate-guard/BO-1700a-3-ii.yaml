criteria: |
  Given the worktree's `.pre-commit-config.yaml` resolves and parses (Check B passes),
  But the shared git pre-commit hook at the effective hooks path is absent, or is
    present but does not contain the pre-commit sentinel,
  When the probe runs,
  Then Check C fails, the probe exits non-zero, `git_hook` is false in the JSON
    result, and stderr names the missing or sentinel-less shared hook path.
