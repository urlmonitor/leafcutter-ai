notes: |
  THE CENSUS IS SUBJECT TO ITS OWN FINDING AND THIS RECORD IS WHERE THAT IS ENFORCED. The L1
  names it as the most likely way this ships broken: a run reporting no checks with the defect
  after failing to execute any of them. Requiring the examined count beside the found count is
  ACS-100i-10's answer to the same problem and it is reused deliberately rather than
  reinvented.

  THE UNEXECUTABLE STATE IS A THIRD CATEGORY AND NOT A ROUNDING ERROR. A check the census
  could not run is indistinguishable from a check with no defect if it is silently omitted,
  which is the exact substitution this tree exists to stop. It is reported separately so the
  reader can see the boundary of the measurement.

  THE COMMIT AND THE DATE ARE PART OF THE REPORT because the number will move. The L1 calls
  the first measured number a deliverable and requires it to be recorded with its date and the
  commit it was measured at; making that part of every report rather than a one-off note is
  what stops a stale figure being quoted as current. Until such a report exists no record in
  this tree may state or imply how widespread the defect is.

  THE UPPER-BOUND CLAUSE IS THE ARITHMETIC HONESTY CHECK. A total larger than what was
  executed means the census inferred something it did not observe, which is the source-reading
  shortcut GE-126e-1 forbids arriving through the reporting layer instead.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. GE-126e-5 publishes the first
  measured figures and its coverage requires re-running the census at the recorded commit
  and comparing the output to what the reference states. That is only possible against a
  machine-readable report, which is why the contract names the form as well as the fields
  and why a matching it_requirement exists. A human-formatted-only report turns that
  comparison into a parsing exercise, and a parsing exercise in a documentation test is a
  test that gets skipped.

  THE ONE FIELD I ADDED THE BA DID NOT NAME is the arithmetic invariant being asserted by
  the census itself, not only by its tests. A self-check costs nothing here and is the
  difference between a report that is internally consistent and one that is merely
  externally audited once.

  THE COMMIT MUST BE READ, NOT PASSED. If a caller supplies it, a figure from an old run
  can be relabelled with today's commit and the field stops meaning anything - which
  defeats the entire reason the L1 called the first measured number a dated deliverable.

