    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_free_text_is_recorded_but_never_becomes_criteria):
      free text gives a ''free-text answer recorded'' limitation and no criterion'
    covers:
      - DK-600b-1-ii
  - name: test_free_text_is_recorded_not_turned_into_criteria
