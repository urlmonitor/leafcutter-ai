readiness: approved
priority: high
title: "The technical planner's profile says it changes and produces requirement records"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: in_progress
criteria: |
  Given the technical planner's published profile, and the agent card and registry entry
    generated from it,
  When they are read,
  Then the profile declares that the planner changes requirement records in the
    requirement store and names that surface, instead of declaring it changes nothing,
  And it declares that the planner produces requirement records, instead of analysis,
  And its description no longer claims the planner writes the test design or chooses
    reference files,
  And the agent card and the registry entry show the same values as the profile.
depends_on:
  - ACD-2500e
doc_links:
- path: templates/agents/it-po.md
  relationship: describes
  status: exists
- path: docs/architecture/components/agent-registry.md
  relationship: describes
  status: exists
assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
- Canonical source is templates/agents/it-po.md frontmatter; the registry entry (config/agent_registry.json)
  is updated to match, and the generated card is regenerated by the build, never hand-edited.
- The produces value is `requirement_records`. It is not in the closed produces vocabulary today; ticket 41
  adds it (user decision 2026-10-15, Option A) to every place that enumerates the vocabulary (the registry
  validator's allowed set, the registry schema enums, and the test and doc enumerations that list it), and
  the existing produces validation must accept it and still reject an unknown value.
- mutates names the requirement store surface (docs/acceptance-criteria/).
- The registry entry carries no `mutates` (and no `tools`). "The registry entry shows the same values as
  the profile" means the registry's produces and description equal the template's; `mutates` (and outputs)
  are compared between the template frontmatter and the generated agent card.
- If shipped before ACD-2500e-2, the description clause (clause 3) lands with ACD-2500e-2.
delivers_to: null
expects_from: null
test_spec:
- name: test_it_po_mutates_requirement_store
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: The it-po profile's mutates entry names the requirement store, not 'none'.
- name: test_it_po_produces_requirement_records
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: The it-po produces value is 'requirement_records', not 'analysis'.
- name: test_it_po_registry_matches_profile
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  description: config/agent_registry.json's it-po entry shows the same produces value and description as
    the template frontmatter; mutates is compared between the template frontmatter and the generated card,
    because the registry entry has no mutates.
  angle: seam
