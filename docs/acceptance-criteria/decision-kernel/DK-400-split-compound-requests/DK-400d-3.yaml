id: DK-400d-3
title: "Rejecting the split runs no part and keeps the person's answer"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a split waiting at the split gate, whatever the reason it was offered,
  When the person human:user rejects it at 2026-10-05T09:14:26Z with a note,
  Then no part runs and no work item is created for any part,
  And every part is recorded as rejected and not run,
  And the split records the answer rejected, given by human:user at that time, with the note word
    for word,
  And how the work goes on is set by why the split was offered: a request no capability could meet
    (trigger jev_none) ends blocked; a request routing found ambiguous falls back to the
    clarification question the kernel asks today; and a request routing would have accepted, or a
    work item found mid-run, is kept whole.
depends_on:
  - DK-400d
  - DK-400d-1
