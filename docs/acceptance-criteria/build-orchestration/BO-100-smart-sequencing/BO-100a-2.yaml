id: BO-100a-2
title: "Linear dependency chain produces one-at-a-time sequential dispatch"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic contains tickets A, B, C where B.depends_on=[A] and C.depends_on=[B],
  When the dependency resolver constructs the graph,
  Then the graph contains three nodes with edges A->B and B->C,
  And the ready-set computation on the initial state returns ready=[A], blocked=[B, C],
  And after A transitions to done, the ready set becomes ready=[B], blocked=[C],
  And after B transitions to done, the ready set becomes ready=[C], blocked=[],
  And at no point are B or C dispatched before their predecessor is done.
