notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400d.

  THE INVERTED-SIZE FIXTURE IS THE POINT, NOT DECORATION. If the four pieces were the
  same size, an implementation that ordered by size and then by urgency would produce the
  same list as one that orders by urgency and then by size, and the test would pass on
  both — including on the two-key order ACD-400a-1 asserts. Making size run counter to
  urgency is what forces the two implementations apart, and it is what makes this AC fail
  today against the store's own written record while passing against the code. That
  divergence is the finding ACD-400d exists to close.

  SPECIFY, DO NOT REDESIGN. Per the scope fence in ACD-400d's notes, this AC states the
  ranking that ships (critical before high before medium before low). Whether that is the
  right ranking, whether a fifth tier is wanted, and whether the ranking should be
  configurable are all product decisions for BrainCandy and none is proposed here.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
  Note for that pass: the deliverable is a pinning test, not an edit to the sort.
