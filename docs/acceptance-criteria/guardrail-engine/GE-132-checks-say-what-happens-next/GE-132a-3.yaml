expects_from:
  - ac_id: GE-132a-2
    contract: "A declaration whose instructions are non-empty and whose specialist and skill exist."
  - ac_id: GE-132a-1
    contract: "The shared declaration loader: local table first, with a per-hook fallback to the package seed."
assigned_agent: python-coder
estimated_complexity: M
package_surface: false
it_requirements:
  - >-
    FORM. Each refused function is rendered as "<function> has complexity <score>, only
    <ceiling> allowed", with the file and the reason (new, grew or crossed) kept. Exact
    punctuation is the coder's. The GE-131a-1, GE-131a-2 and GE-131a-3 tests assert the
    score, the ceiling, the reason, "complexity-reduction" and the SKIP=check-complexity
    pure-move line, and must stay green without being edited.
  - >-
    ONE SOURCE FOR THE NEXT STEP. The instruction, specialist and skills are read from
    check-complexity's declaration at refusal time, through the same file the router reads:
    the tracked template in the package repo, and skills_config precommit_autofix_config_path
    when deployed. Delete the hard-coded tip that duplicates it ("Use the
    complexity-reduction skill..."). The pure-move SKIP line belongs to GE-131a-3 and stays.
  - >-
    WRITE-IF-ABSENT HAZARD, decided by BrainCandy on 2026-10-09. .claude/precommit-autofix.json
    is a write-if-absent, gitignored scaffold, so an existing install keeps a table with no
    declaration fields after a rebuild. check-complexity reads its declaration only through
    GE-132a-1's shared loader, which falls back to the package seed for any hook the local
    table does not declare. An old install therefore still prints the seed's next step. It
    must never print an empty or stale next step, and never fall back to text kept inside
    the check.
  - >-
    AUTOFIX_AGENT. Today the line names python-coder, through get_agent_for_extension(".py")
    with a python-coder fallback literal. Under this design it names restructuring-specialist,
    derived from the declaration and never from owns_file_extensions. Remove the fallback
    literal. Retiring the line is GE-132a's named follow-up. If it is retired here, the
    BO-210c-1 parse in precommit-autofix Step 4a.1 changes in the same ticket.
  - >-
    BO-210c POPULATION, in the same change. A structural-category hook in blocking_hook_ids
    is re-dispatched to the originating coder (precommit-autofix Step 4a, BO-210c-1).
    check-complexity must leave that population, or both python-coder and the specialist
    are engaged. The hook can be excluded from the originator path by its declared
    disposition or category, never by a hard-coded id. BO-3800b-3 arm one's third And is
    the test that catches this.
  - >-
    The text must not vary by committer. Nothing may branch on COMMIT_AGENT_MODE,
    CLAUDECODE, a TTY or any other signal that identifies the caller.
  - >-
    Tests run real `git commit` in a scratch repo through the generated stanza from
    shared_reference_layout (@pytest.mark.shared_layout_reader). Add no new build.py spawn.
test_required: true
test_spec:
  - name: test_ge132a3_refusal_states_complexity_ceiling_and_declared_next_step
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Arm 1. plan_batches goes from 30 to 31. The refused commit's output says plan_batches has complexity 31 and only 30 is allowed. Its next step names the restructuring specialist and complexity-reduction applied to plan_batches. RED TODAY: the output says 'scores 31, ceiling 30', the tip is hard-coded, and no specialist is named."
    must_catch:
      - "THE BARE VERDICT: refuse with 'too complex' and no numbers"
  - name: test_ge132a3_three_committers_get_identical_refusal_text
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Arm 2. The same staged change is committed three times: with no env marker (terminal), with COMMIT_AGENT_MODE=1 (commit agent) and with CLAUDECODE=1 (interactive session). The three refusal blocks are byte-identical and each carries the score, the ceiling and the declared next step. RED TODAY on content, because there is no next step yet."
  - name: test_ge132a3_changed_declaration_instruction_changes_the_refusal
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Arm 3. Only the fixture declaration's instruction changes, to 'split plan_batches until it scores at or under 30'. The recurring refusal shows the new instruction and not the old one. RED TODAY."
    must_catch:
      - "THE COPY: print a hard-coded copy of the declared instruction"
test_rationale: >-
  One real commit per arm through the generated stanza. Arm 3 is the only test that tells
  a declaration-driven next step from a hard-coded copy, so it edits the fixture's data and
  never the check. All three are red today.
