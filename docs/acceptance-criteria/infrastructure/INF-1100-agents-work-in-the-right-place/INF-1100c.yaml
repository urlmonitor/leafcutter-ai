criteria: |
  When agent instructions are generated, their work-location paths come out fully resolved — and proven.

  Because each agent's instructions are compiled from templates, the
  work-location paths inside the compiled instructions are filled in from your
  configuration with no leftover placeholders, and this resolution is verified by
  tests so a regression can't quietly reintroduce a wrong or empty path.
