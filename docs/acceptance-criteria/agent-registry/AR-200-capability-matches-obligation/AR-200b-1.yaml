test_spec:
  - name: test_ar200b1_every_mandated_tool_is_in_the_allowlist
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Derive, for every template in templates/agents/, the set of mutating tools its body instructs it to use and the set its frontmatter grants, and assert the first is a subset of the second. Must fail against the pre-fix tree naming all three violators."
  - name: test_ar200b1_detector_fires_on_a_synthetic_violator
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Feed the detector a synthetic template that mandates Edit and grants only Read and Bash, and assert it is flagged. Load-bearing: once the three real instances are fixed the criterion test can never fail again on the current tree, so without this the rule decays into proving only that the loop runs."
  - name: test_ar200b1_detector_does_not_fire_on_generic_english
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Feed the detector a template whose prose says 'do not edit the file' and grants no Edit, and assert nothing is flagged. Without this control the cheapest way to pass the criterion test is a detector that matches the bare word and flags the whole registry."
  - name: test_ar200b1_rule_scans_the_whole_registry
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Assert the scan reaches the full agent registry and that most templates declare a tools: allowlist, so a glob that silently resolves to nothing cannot present as a pass."
test_rationale: |
  The criterion test alone is insufficient and would be a phantom gate: after the
  three instances are fixed it passes on any tree, including one where the
  detector was quietly broken. The synthetic-violator test is what keeps the
  detector honest, and the generic-English control is what stops the cheapest
  passing implementation -- a bare substring match -- from being adopted. The
  scan-reach test closes the third way this class of rule goes vacuous, which
  this repository has already shipped once.
