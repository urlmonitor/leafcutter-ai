id: DK-500c-2-ii
title: Publish refuses a wording or a member pair that another live category already holds
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a staged category whose other wordings include "Does every published record still go through git review in a pull request?", already an other wording of the published cat-52b16c7b5a23106f,
  When a person runs the publish,
  Then the publish is refused, naming both category ids and the shared wording,
  And a staged category listing the member (dec-acdfd972fcaca478, crit.git_review_kept), already a member of cat-52b16c7b5a23106f, is refused the same way, naming both categories and the pair,
  And nothing enters the published library.
depends_on:
- DK-500c-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500c-2
  contract: Publish checks over staged category records against the published library.
change_target: code
risk_surface: internal
it_requirements:
- Uniqueness is checked against every staged record in the publish and every published non-retired category, with the shared wording rule for labels and exact equality for member pairs.
- Each refusal names both category ids and the shared wording or pair.
- Retired categories are left out of the label check (their labels resolve through replaced_by); a retired category has no members, so it never conflicts on pairs.
test_required: true
test_spec:
- name: test_shared_wording_refused_naming_both
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A staged category reusing an other wording of cat-52b16c7b5a23106f is refused, naming both ids and the wording.
- name: test_shared_member_pair_refused_naming_both
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A staged category listing (dec-acdfd972fcaca478, crit.git_review_kept) is refused, naming both categories and the pair.
- name: test_nothing_enters_library_on_refusal
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: After either refusal docs/criteria/ is unchanged.
test_rationale: Exercise the review run and the publish command through their public CLI and RunService boundaries on a temporary repository copy and run root; assert staged files, published files, exit codes and byte-level before/after snapshots of docs/decisions/. Model-level unit tests alone would not prove that nothing is written outside the staged area or that publish is all-or-nothing.
