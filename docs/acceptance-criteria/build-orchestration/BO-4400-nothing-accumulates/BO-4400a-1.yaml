id: BO-4400a-1
title: "Every route that opens a pull request clears its workspace at its end once that pull request has merged"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
declares_side_effect: false
criteria: |
  Given each of these routes is run against a real test project with a real shared
    project, each in a workspace obtained from the one workspace maker, and each
    driven to the point where its commits are pushed to its own line of work on the
    shared project, its pull request is open, and that pull request has been merged
    into the main line before the route returns:
    - the build of a single ticket,
    - the build of an epic of three tickets,
    - the quick fix,
    - requirements authoring,
    - the fast lane with a build set of one requirement,
    - the backlog build with two tickets,
  When each route returns its final result,
  Then for every route no folder remains at the location its workspace occupied and
    its workspace is absent from the live set,
  And the clearing was performed by the one shared clearing door: the route's final
    result contains the door's own answer for that workspace, reporting it removed,
  And the clearing happened after the pull request was merged and before the route
    returned: the main line holds every change the route made,
  And no person was asked to confirm the clearing.

  Given the same six routes are each driven to the point where their commits are pushed
    to their own line of work on the shared project and their pull request is open but
    not yet merged into the main line when the route returns,
  When each route returns its final result,
  Then for every route its workspace still exists, identical to its state when its pull
    request was opened,
  And the route's final result reports the workspace as kept because its work is not yet
    on the main line, leaving it for the landed-work pass to clear after the merge.
depends_on: [BO-4400a, BO-4300e-2, BO-4300f-1, BO-4400g-2, BO-4400g-4]
