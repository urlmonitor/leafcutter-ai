criteria: |
  Given a requirement moves between being available, taken, handed back, and
    taken over after abandonment,
  When the architecture documentation for the requirement's claim lifecycle is
    consulted,
  Then a state diagram shows each state a requirement can be in with respect to
    being taken, and every transition between them,
  And each transition names what causes it -- an effort taking the requirement,
    an effort handing it back, an effort finishing it, a later effort judging the
    claim abandoned,
  And the diagram shows the reclaim transition out of the taken state that no
    action by the original owner causes,
  And the diagram shows the losing side of two efforts reaching for the same
    requirement returning to looking for other work, rather than entering any
    state on this requirement,
  And a reader can trace the path from available, through an abandoned claim, to
    available again, without consulting any other document.
