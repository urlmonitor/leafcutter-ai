id: TQ-400b-7
components:
  - testing_quality
  - ac_store
title: "The field reference answers type, nullability, writer and never-rewritten for both demotion fields"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the two record fields the demotion path introduces — the reason a record
    lost its finished badge and the date it happened — whose documentation
    obligation is already carried by TQ-400b-2, which requires both to be
    documented in the store's field reference in the same change as the schema
    change,
  When a reader consults that field reference for either field, having neither the
    schema nor the demotion code in front of them,
  Then, for each field, they can state its type, whether it may be empty, what
    value means the record was never demoted, which process writes it, and at what
    moment,
  And they can state that the date records the FIRST demotion and is never
    rewritten by a later run — a rule that cannot be inferred from the field's
    type and is the one a re-implementer most often breaks,
  And they can state that a record carrying neither field is valid, so the records
    that predate the demotion path are not read as malformed,
  And a reader about to set either field by hand can say in advance which values
    the store's validator will reject and which it will accept,
  And what the reference says the validator accepts is what it actually accepts at
    publication: a record shaped as the reference describes passes validation, and
    a record the reference calls invalid is rejected,
  And these rules are stated in exactly one place — the field reference — with any
    other mention of the two fields pointing to it rather than restating it, so no
    second, competing account of the demotion fields can drift from this one.
depends_on:
  - TQ-400b
  - TQ-400b-2
  - TQ-400b-4
