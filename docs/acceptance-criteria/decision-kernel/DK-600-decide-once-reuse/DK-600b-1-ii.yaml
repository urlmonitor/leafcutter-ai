    angle: criterion
    description: 'EXISTS (tests/kernel/interaction/test_criteria_approval.py::TestStructuredApproval::test_free_text_is_recorded_not_turned_into_criteria):
      through the service the criteria stay the proposed ones'
    covers:
      - DK-600b-1-ii
  - name: test_the_free_text_answer_is_kept_as_given
