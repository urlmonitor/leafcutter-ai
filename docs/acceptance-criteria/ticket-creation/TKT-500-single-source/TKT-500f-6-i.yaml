criteria: |
  Given a leaf AC whose files_touched list contains a mix of paths:
    one implementation file "scripts/ac_store/generate_ticket_from_ac.py",
    one documentation file "docs/reference/ac-schema.md",
    and one configuration file "config/agent_registry.json",
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains a section headed "## Test Requirements",
  And that section contains at least one test stub entry for the
    "scripts/ac_store/generate_ticket_from_ac.py" implementation file,
  And the documentation and configuration files do not suppress the section.
