notes: |
  WHY THIS IS THE LIMIT CASE OF GE-120, NOT A NEW GOAL.
    The L0 promise is that green must never mean "it could not run". These
    checks do not reach even that far — they never run at all, in this
    repository or in any project that installed the package, and nothing
    anywhere reports their absence. Every other L1 under GE-120 concerns a
    check that executed and then misreported; this is the degenerate end of
    the same axis, where the misreport is the silence of a check that was
    never invited. It belongs under this L0 by subject.

  THE FOUR-SIGNAL PROBLEM IS THE POINT — do not decompose this as "register
  the missing checks".
    Registering the current orphans is a one-time cleanup and the ratchet test
    already forces it downward. The durable benefit is that the four places a
    reader consults (documentation with a seriousness rating, a settings block
    in config.py, an entry in commit_guardian.json, autofix routing) cannot
    silently disagree with the one list that actually causes execution. A
    decomposition that only drains the backlog leaves the next orphan free to
    appear with the same four reassurances.

  CAPACITY — RESOLVED 2026-09-14 BY AN AUDITED WAIVER.
    GE-120 held seven L1s (a..g), all status: active, against the ACS-100c-1
    hard cap of seven. This record is the eighth. BrainCandy granted
    `child_limit_override: 8` on GE-120 at a confirmation gate; the reasoning
    and the explicit "eight is the ceiling, not room to grow" limit are recorded
    in GE-120's own notes. The authoring agent flagged the cap and declined to
    self-grant the waiver, which is the correct precedent (see GE-120a).
    Alternatives were checked, not skipped:
      - GE-126 ("checks answer truthfully") has two free L1 slots (a..e), and
        was the only nearby record with real capacity. Rejected by SUBJECT on
        the same reasoning GE-120f and GE-120g both recorded: GE-126 owns the
        INTERROGATION surface — what a check tells you when you hand it your
        own file or run a copy yourself. This defect fires during an ordinary
        commit with nobody interrogating anything, which is GE-120's surface.
        Free capacity under the wrong parent is not capacity.
      - A sibling L0 for the registration axis was rejected as splitting a theme
        this L0 already owns.
      - Every GE-120a..f is at its five-L2 cap (GE-120a already at six on a
        live override), so a Roman-suffixed L3 under an existing L2 would need
        a parent whose composite is honest; GE-120a-1 is done and must not be
        reopened.

  NOT PRESCRIBING THE MECHANISM. Whether the four signals are reconciled by a
    generated index, a startup assertion, an expanded inventory test, or a
    check-of-checks is BA/IT-PO territory. This record states only that the
    disagreement must not be able to persist unseen.

  Authored at the PO stage; L1 only. BA decomposes to L2/L3.
