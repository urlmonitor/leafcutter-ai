package_surface: false
it_requirements:
- 'DISCARD TOKEN (Q8, DECIDED user 2026-09-28): remove on a workspace holding unsent work is refused UNSENT_WORK
  (exit 2) listing unsent.commits and unsent.files and carrying discard_token (BO-4300c-2): a one-time
  token bound to exactly what would be lost -- that workspace (its canonical path and its maker record,
  so a workspace re-made at the same path never accepts an older token), its unsent commit shas, and its
  uncommitted and untracked files including their content. Only `remove --path <same> --discard-token <that
  token>` discards it; the maker recomputes the binding at request time and accepts the token only on an
  exact match.'
- 'A token presented for another workspace, or after the unsent set changed (a commit added or pushed,
  a file added, removed or edited), authorises nothing: the request is refused UNSENT_WORK with the current
  lists and a fresh token, its message states that the presented token does not match, and nothing is changed.
  A workspace with nothing unsent is removed without a token; a token is never required to remove clean
  work.'
- 'The token is never read from an environment variable, a config setting, stdin or any file, and the
  maker stores nothing between invocations: the binding is recomputed from the workspace''s current state
  on every request, and the token string is written only to the refusal''s stdout answer. Never asked
  interactively.'
- An authorised remove answers ok with discarded.commits and discarded.files; it never deletes or pushes
  the hub branch unless --delete-remote-branch is also given.
- The maker never reads stdin and never prompts; every decision it needs arrives as an argument of the
  request, so an unattended caller can never stall on it.
- Answers conform to the result contract delivered by BO-4300c-2 (one JSON object on stdout, status/code/exit
  mapping, workspace_path absent on every non-ok answer).
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_authorised_remove_deletes_without_any_question
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: With the discard_token from the preceding UNSENT_WORK refusal given as --discard-token and
    stdin closed, the folder is gone and the answer is ok.
- name: test_refusal_returns_a_discard_token_with_the_unsent_lists
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: remove without a token on the workspace is refused UNSENT_WORK (exit 2) listing the unpushed
    sha and the uncommitted path, carries a non-empty discard_token, and leaves the workspace byte-identical.
- name: test_token_is_not_taken_from_the_environment_or_config
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: With the valid token placed in environment variables and in the project's config, remove
    without --discard-token is refused UNSENT_WORK and the workspace is byte-identical.
- name: test_token_is_not_persisted_anywhere
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: After the refusal, the token string appears in no file under the test's temp directory
    (project, hub, landing root, workspace, isolated HOME) and not on stderr.
- name: test_answer_lists_discarded_commit_and_file
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: discarded.commits contains the unpushed sha and discarded.files the uncommitted path.
- name: test_hub_line_and_main_unchanged_by_authorised_remove
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: The hub's branch ref and main ref are identical before and after.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
