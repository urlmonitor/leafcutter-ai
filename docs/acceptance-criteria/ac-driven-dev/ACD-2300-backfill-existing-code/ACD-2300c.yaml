criteria: |
  Requirements nobody proves are named out loud and get proof written for them.

  Requirements that no test actually proves are listed rather than left looking
  the same as the proven ones, and each is either connected to proof that already
  exists or queued for proof to be written. Being unproven becomes a stated fact
  about the record instead of a silence that reads like agreement.
