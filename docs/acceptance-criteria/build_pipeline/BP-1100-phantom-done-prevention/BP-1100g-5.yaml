test_rationale: |
  Genuinely test-free at this AC's boundary. change_target is prompt: every Then clause
  describes what an LLM agent writes into its own sign-off record, and no unit test can
  produce that record. The falsifiable half of this behaviour is deliberately located in
  the child, BP-1100g-5-i, which builds the reader that detects absent / reasonless /
  duplicated answers over the records a run actually emitted — this AC is composite and
  its proof comes from that child. The available proxies are both dishonest: grepping
  templates/agents/test-writer.md for the mandate asserts prose presence, not compliance,
  and validating a hand-typed manifest asserts the fixture rather than the writer.
  Reviewing surfaces: pr-reviewer and the llm-expert Prompt-Quality Checklist.
