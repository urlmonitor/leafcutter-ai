change_target: prompt
risk_surface: internal
test_required: false
test_rationale: >-
  The deliverable is command prose in templates/workflows/build-feature.md, read by
  an agent; no unit test can execute it, and a test that checks the prose for the
  probe step would be the grep-only form the repo CLAUDE.md forbids for gates. The
  executable behaviour the prose invokes (location resolved through the query, no
  relative fallback, nothing created on refusal, typed block with sink_path and
  remediation) lives in the shared probe helper and is proven behaviorally by
  BO-100d-1a, BO-100d-1a-i and BO-100d-1a-ii. The prose path is to be checked at
  drive time by a behavioral spot-check: run /build-feature against an install
  whose declared stream is unwritable and confirm no ticket-supervisor is
  dispatched.
