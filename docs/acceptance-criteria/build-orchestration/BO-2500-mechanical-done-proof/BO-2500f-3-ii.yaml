id: BO-2500f-3-ii
components:
  - build_orchestration
  - ac_store
title: "A dedicated inspection workflow shows the person what they are approving and, on approve, keeps the approval and completes the inspection record"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given record DK-210b-3, declared with test_required false, whose verification
    record is an inspection draft holding a statement ("The guide names all four
    refusal messages and their fixes.") and two inspected paths,
    docs/how-to/prove-ac-done.md and docs/reference/test-free-declarations.md,
    with no content fingerprints and no run reference yet,
  When a person runs the inspection workflow for DK-210b-3,
  Then the workflow computes the current content fingerprint of each inspected
    path and shows the person the record id, the statement, and each path with
    its fingerprint, before asking for an answer,
  And it asks the person to approve or reject the inspection, as an interactive
    question only a person at the gate can answer,
  And on approve, it creates the approval file for this run in the tracked
    approval folder, holding the run id, the gate id, the answer "approve", the
    time the answer was given, the AC id DK-210b-3, and each inspected path with
    the fingerprint that was shown,
  And on approve, it fills the record's inspection with the run reference and the
    shown fingerprint for each inspected path, leaving the statement and every
    other field of the record unchanged,
  And the approval file and the changed record are left for the person to commit
    together, and the workflow reports both paths,
  And on reject, it creates no approval file and leaves the record unchanged,
    and reports that the inspection was rejected,
  And when the answer is missing, cannot be read, or is anything other than
    approve or reject, it creates no approval file, leaves the record unchanged,
    and reports that no answer was recorded,
  And when the record has no inspection draft, its draft has no statement, it
    lists no inspected path, or a listed path does not exist, the workflow stops
    before asking, names what is missing, and creates nothing,
  And a record whose change_target rules inspection out (BO-2500f-1-i) is
    stopped in the same way, naming the change_target,
  And the workflow runs on its own, without the feature-planning workflow, and
    starting it requires only the record id.
depends_on: [BO-2500f-3, BO-2500f-3-i]
