notes: |
  THE DECISION THIS CARRIES. BrainCandy, 2026-10-09: the AC store is set aside from the
  crowded-directory check (limit 15 non-markdown files per folder), and it is not exempted
  silently. Modelled on GE-127g, which sets generated documents aside from the file-length
  limit.

  A per-location size bound was considered and dropped by BrainCandy's decision on
  2026-10-12: the AC store's tree limits already cap growth.

  WHY THE FALSE REFUSAL APPEARED NOW, READ FROM THE CHECK'S OWN RECORDED HISTORY, NOT
  MEASURED. The known issue KI-CG-20260909-gate-folder-density recorded that the check's
  "already over" comparison read a snapshot that already contained the commit's own
  additions, so a crossing was never refused. The check's own documentation now states it
  compares against the parent revision instead. That made the crossing refusal reachable,
  and the first store family to cross 15 after it was refused: BO-3800 grew from 15 to 19
  records on 2026-10-09 and the commit needed the check skipped. The fix was right; the
  store was never meant to be judged by it.

  MEASURED IN THIS WORKTREE ON 2026-10-09, AT HEAD, COUNTING AS THE CHECK COUNTS (files
  tracked at the revision, markdown and package-marker files not counted, hidden and
  name-skipped directories not counted). CARRY THE FIGURES INTO ENRICHMENT, NOT INTO
  TESTS:
    - 170 folders under the store hold a countable file; 114 of them hold more than 15.
      The decision text cites 115 of 179; the difference is method (this count is of
      folders holding at least one countable file at HEAD) and is not reconciled further.
    - 56 store folders stand at or below 15 today. Each is a future instance of the
      BO-3800 refusal under the current check.
    - No store folder is nested more than one feature-folder level below a component
      folder.
    - Directories OUTSIDE the store whose path contains the same name: a source directory
      templates/acceptance-criteria/ (the template the installer ships) and a test-data
      directory leafcutter-web/fixtures/docs/acceptance-criteria/. These are the concrete
      reason a name-matched rule is wrong here (GE-133a-1's second arm).

  DESIGN NOTE FOR ENRICHMENT (NOT A CRITERION). GE-127g's it_requirements recommend a
  declaration shape for the document gate: a list of entries, each a repo-relative path
  and a stated ground. Using the same shape and key name for this check means the two
  set-asides are expressed one way in one configuration file, which is the drift
  GE-127g's notes rule out. They should NOT share one list: a location set aside from one
  standard is not thereby set aside from the other.

  WHAT IS NOT DECIDED HERE. Whether a declared location may itself contain a source or
  test directory and still set it aside. The decision text says source and test
  directories stay judged "whatever they are named" and that the set-aside population is
  exactly the declared locations; this L1 reads that as forbidding name-matching, not as
  a rule that classifies directories as source. GE-133a-1 is written to that reading. If
  the user meant the stronger rule, it needs its own record.
