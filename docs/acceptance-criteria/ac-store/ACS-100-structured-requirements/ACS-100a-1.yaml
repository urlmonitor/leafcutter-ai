id: ACS-100a-1
title: "Required fields reject missing values at commit time"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a YAML file under docs/acceptance-criteria/ is staged for commit,
  When check_ac_schema.py runs and any of the six required fields
    (id, title, component, status, created_by, criteria) is absent or empty,
  Then the hook exits with code 1,
  And the error message names the missing field and the file path,
  And the commit is blocked.
