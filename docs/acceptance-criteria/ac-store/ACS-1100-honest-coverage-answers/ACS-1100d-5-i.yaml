criteria: |
  Given a requirement whose wording gives no readable population — it neither names
    a single record nor states the set it claims a property of,
  When it is put forward as finished,
  Then the comparison ACS-1100d-5 describes is not attempted, the requirement is
    neither refused against an assumed population nor closed on the evidence at
    hand, and the record is referred for its claim to be stated,
  And the referral names the requirement and states that its population could not
    be read, so a reader can tell it apart from a shortfall refusal under
    ACS-1100d-5, which names a number,
  And a referral is not a pass: no finished status is written while the referral
    stands,
  And a requirement whose population IS readable but whose evidence declares no
    covered count is refused under ACS-1100d-1's dropped-coverage halt rather than
    referred, because a missing figure on the evidence side is a different failure
    from an unreadable claim on the requirement side,
  And the count of referred requirements is reported alongside the counts of closed
    and refused ones, so a population that cannot be read never disappears from the
    arithmetic — this is the could-not-classify bucket of ACS-1100c-1-i applied to
    the closing decision,
  And guessing the population from the requirement's component, its parent, or its
    file location does not satisfy this criterion, because a guessed denominator is
    the number nobody computed that ACS-1100 exists to remove.
