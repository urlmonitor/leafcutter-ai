notes: |
  Field name is IT-PO's call; `test_intent` (list of {clause, needs_test, reason}) is the
  BA's suggestion. It must not reuse `test_spec`, whose presence already means "a test
  contract exists" to the readiness gate (ACD-1600c-1) and to the ticket generator.

  Compatibility with touched ACs:
  - TKT-300a-4 (planner never modifies criteria) - preserved, restated in clause 5.
  - BO-550-1-i (test_constraints is the ONLY channel for the IT PO to influence test
    strategy): test intent states WHICH outcomes need proof, not HOW to test. It is not a
    second strategy channel and must not carry isolation level. test_constraints stays
    where it is (see open question on whether isolation choice moves to the test-design
    step).
  - TKT-500b-3 (tests_after set by IT-PO reverses order): unaffected; sequencing stays a
    planner call.
  Named alteration: planner writes a test_spec alongside intent -> clause 4 must go red.
