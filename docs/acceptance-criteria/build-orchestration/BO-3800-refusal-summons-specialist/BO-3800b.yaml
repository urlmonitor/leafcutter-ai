criteria: |
  Restructuring goes to a specialist, not to the author racing a standard.

  Whoever is adding the new work is not the one asked to reorganise the file
  around it. Someone whose craft is restructuring does that part, so the file is
  genuinely reorganised and the new work gets a home of its own — rather than
  existing content being shifted next door to make a number fall.
