id: BO-4300e-3
title: "Loss of unsent work happens only when authorised up front"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a workspace holding one unpushed commit and one uncommitted change,
  When clearing it is requested with authorisation to discard its unsent work
    given in the request itself,
  Then the workspace is gone completely, without any question being asked,
  And the answer lists what was discarded: the unpushed commit by identifier and
    the uncommitted file by path,
  And the line of work on the shared project and the shared main line are
    identical before and after.
