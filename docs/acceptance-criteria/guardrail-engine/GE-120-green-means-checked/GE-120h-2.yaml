notes: |
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE OF GE-120h-1. They are two different
  behaviours with two different failure modes. GE-120h-1 can be wrong by looking at the
  wrong population; this one can be wrong by letting the population grow. Splitting them
  also makes the dishonest implementation visible: the cheapest way to satisfy
  GE-120h-1 across a repository holding a backlog is to widen the record until the
  reconciliation is silent, and that is precisely what the second and fourth arms here
  forbid.

  THE STALE-RECORD ARM IS THE ONE MOST LIKELY TO BE DROPPED, AND IT IS THE ONE THAT MAKES
  THE RATCHET EXACT. A record that is merely a floor decays: entries resolved years ago
  sit in it, the number stops describing anything, and the next reader cannot tell debt
  from residue. Requiring the change that resolves an entry to remove it is what keeps
  the quantity a measurement. The existing inventory test already enforces exactly this
  and its comment gives the reason in one line — "the ratchet only holds while it is
  exact". That is also the mechanical link to GE-120h-3: registering those five cannot
  be done without reducing the record by five, so the immediate cleanup is observable in
  the durable mechanism rather than being a parallel, untracked act.

  NO NUMBER IN THIS RECORD OR IN ANY TEST OF IT. The disk record moved 18 -> 16 -> 14 in
  a single day and the advertised population has never been measured. Every arm above is
  written over relative movement — one greater, smaller than it was, named by name —
  because those survive the population moving and a literal does not.

  THE FIRST ARM IS NOT PADDING. It states that standing debt does not refuse unrelated
  work, and it is the clause that distinguishes this from "register everything now". It
  is also the clause an implementation is most likely to violate accidentally, by making
  the reconciliation refuse on its whole population instead of on the delta.

  DECIDED EXPLICITLY UNDER THE COMPONENT'S STANDING RULE: the second and third arms
  REFUSE rather than announce. Ground: both are a delta introduced by the author's own
  change, both are repaired in the same change at trivial cost, and an announcement on
  the passing path is discarded unread in this repository (a recorded defect of its own).
  The first arm announces nothing and refuses nothing.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, declares_side_effect and package_surface. Those are the IT
  PO's fields.

  ---- IT PO ENRICHMENT, 2026-09-14 ----

  HOW THE REUSE CANDIDATES WERE VERIFIED, AND WHY THE REQUIREMENT IS HEDGED. The record
  says GE-127b's shared ratchet helper is the reuse candidate. Rather than repeating
  that, the guardian directory was grepped for ratchet modules on 2026-09-14 and two
  were found and opened: _file_size_ratchet.py and _doc_length_ratchet.py. Its public
  surface is a previous-measurement resolver — count_content_lines,
  measure_current_length, get_previous_length, resolve_previous_lengths,
  resolve_head_covered_paths, resolve_parent_revisions, plus
  PreviousLengthSourceError and CurrentLengthUnmeasurableError. That is genuinely
  reusable for "what was this before", and it is genuinely NOT a grounded per-entry
  register. Saying "reuse GE-127b's helper" without that split would produce either a
  forced fit or a quiet third ratchet, so the requirement names both halves.

  THE INCUMBENT RECORD WAS READ, NOT ASSUMED. test_hook_registration_inventory.py was
  opened in full: UNREGISTERED_BASELINE is a frozenset of 14 script FILENAMES with a
  per-entry comment giving what each is waiting on; _hook_scripts_on_disk scans both
  GUARDIAN_DIR and GUARDIAN_DIR/hooks filtered by hook_parity.hook_script_patterns and
  excluded_scripts; _registered_script_names takes the union of each entry's `script`
  field and every .py filename in its `entry` string. Both directions of the set
  difference are asserted, which is the staleness half. The keying is by filename, and
  this record's population is keyed by advertised name — that mismatch is real and is
  called out in it_requirements rather than glossed as "extend the list".

  package_surface LEFT UNSET FOR THE SAME REASON AS GE-120h-1, AND THE ANSWER MAY
  DIFFER. Whether this adds a NEW hooks_manifest entry or adds a rule to an existing
  one is genuinely open here, and only the first is a package surface. Declaring one
  before that is settled is the fiction
  KI-CG-20260831-fictional-config-schema-fragment records; leaving it unset after it is
  settled is the omission ACS-100i-8 exists to catch. Decide it when the surface is
  chosen, then amend. Raised as a caveat.
