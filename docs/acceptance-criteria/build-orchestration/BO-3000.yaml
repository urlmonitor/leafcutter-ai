criteria: |
  Given templates/workflows-js/build-feature.js declares `handoff` as a valid
    `status` value in PHASE_RESULT_SCHEMA (line 147)
  And the failure-adjudication block of driveTicketPhases() (lines 618-711)
    guards its blocker handling with
    `if (resultStatus === "blocker" || resultStatus === "failed")` at line 643
  When a phase agent returns `{ status: "handoff", ... }` naming an upstream
    agent that must do work before this phase can proceed
  Then the driver MUST NOT fall through the guard and record the phase as
    completed, and MUST NOT advance to the next phase in phaseOrder
  And the driver MUST re-dispatch the agent named in the handoff so the named
    upstream phase actually runs again
  And the ticket's sign-off state for the named upstream phase MUST reflect that
    it was re-run, not left at `needed`

  Given a phase agent returns `{ status: "handoff", ... }` whose handoff target
    cannot be parsed into a known phase agent name
  When driveTicketPhases() adjudicates that result
  Then the driver MUST return a `blocked` result that names the failing phase
  And it MUST NOT report the phase as successful and MUST NOT advance the loop

  Given the sibling driver templates/workflows-js/build-ticket.js carries the
    identical PHASE_RESULT_SCHEMA `handoff` enum entry (line 80) with no handler
  When a phase agent returns `status: handoff` under that driver
  Then build-ticket.js MUST apply the same handoff routing behaviour as
    build-feature.js, so the two drivers cannot diverge

  Given the existing `cross_agent` classification branch (line 677) that skips a
    phase after a classified blocker
  When the handoff handler is added
  Then the `cross_agent` branch MUST remain present and behaviourally unchanged

  Given the JS workflow test harness at unit_tests/_workflow_engine_harness.py
  When BO-3000 is verified
  Then the covering test MUST execute the driver through the harness with a
    stubbed phase agent returning `status: handoff` and assert on the observed
    dispatch sequence and returned result
  And a grep-only / structural assertion over the JS source MUST NOT be accepted
    as coverage for this AC
  And the bug symptom ("a `handoff` result is silently recorded as a SUCCESSFUL
    phase and the driver advances to the next phase while the named agent is
    never re-dispatched") must not occur
covered_by:
