notes: |
  WHO RUNS THE STEP (L1 constraint 2) -- BA RECORDS THE USER'S DEFAULT, to be confirmed at the gate
  (question Q1): the commit agent still receives every commit dispatch; its brief shrinks to "author
  the message if none was given, run the step, relay its JSON, apply autofix judgement on
  hook_failed". Message authoring and autofix judgement stay agent work; staging, recording,
  retry budget and branch refusal move into the step.

  The verbatim relay is the C2 lesson: an agent that summarises the answer re-creates the
  unreadable-reply fallback. Template-text tests are the strongest proof available for an LLM
  surface (BO-2400a-1-i's test_rationale makes the same argument).
