it_requirements:
- '--delete-remote-branch deletes the hub branch before any local deletion; a failed push is GIT_FAILED
  (status error, exit 1, step naming it) and nothing local is deleted. Fixture: a bare hub whose update
  hook rejects deletions.'
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_rejected_remote_branch_deletion_leaves_workspace_and_hub_line_unchanged
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With a bare hub whose update hook rejects deletions, remove --delete-remote-branch on a clean
    workspace answers status error, code GIT_FAILED, exit 1, with step naming the deletion on the hub; the
    workspace folder is byte-identical and the hub branch ref is unchanged.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace and the hub afterwards. Only a real
  hub that refuses the push shows whether local deletion waits for the remote one.
