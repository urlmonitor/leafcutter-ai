  - the key handler writes history twice
- name: Enter on 'Close step details' closes the drawer and returns the address with no query
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: component
  angle: criterion
- name: every step and branch card of flow-render-pipeline is reachable with Tab
