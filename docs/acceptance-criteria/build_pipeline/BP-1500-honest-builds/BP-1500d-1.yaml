notes: |
  WHAT THIS CHILD OWNS. Points (a) and (b) of the guarantee stated in BP-1500d's
  notes: the record belongs to the project the build wrote into, and it travels
  with that project. (b) is a consequence of (a) rather than a separate mechanism
  -- once the record is inside the project, copying the project copies it -- so
  the two are kept in one child instead of being split into two that would pass
  or fail together.

  THE EMPTY-RECORD NEGATIVE CONTROL IS NOT PADDING. A record that is filed in the
  right place and accounts for nothing is portable, readable, and useless, and it
  satisfies every other clause here. Without that second breakage the inspection
  can be closed by writing an empty record into the receiving project, which is a
  worse outcome than today because it also silences the two checks while looking
  correct.

  OVERLAP WITH BP-1500a -- flagged, deliberately not owned. Because the record is
  filed with the producing package today, a build aimed at someone else's project
  overwrites the producing package's own record with facts about that other build.
  That consequence is a build leaving an edit in a tree it was not aimed at, which
  is BP-1500a's promise ("a build leaves the repository it is run from exactly as
  it found it"). It is cited here and owned there. No clause above asserts anything
  about the producing package's own tree.

  ORDERING. BP-1500d-2, -3 and -4 all presuppose the record produced by this child.
  depends_on carries only the parent link, as the authoring request specified; the
  it-po should wire the intra-family ordering as delivers_to / expects_from, with
  this AC as the producer of the receiving project's record.

  FOR THE IT-PO. The observable effect here is a file written into a tree outside
  the process, so declares_side_effect is a live candidate on this record. The
  fixture constraint is load-bearing: the scratch project must be created outside
  the producing package's parent folder, because inside it the defect does not
  appear -- that layout is the one place the current behaviour looks correct, which
  is how this survived to now.
