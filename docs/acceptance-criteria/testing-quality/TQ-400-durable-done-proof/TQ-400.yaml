title: "Trust that work marked done is still done today, not just the day it shipped"
component: testing-quality
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  "Done" keeps meaning done — proof is re-checked over time, never assumed.

  Today a piece of work that reaches "done" keeps that badge forever: nothing
  ever looks at it again, and there is no way to take it back. So a requirement
  can pass its check on the day it ships, quietly lose the behaviour or the test
  that proved it months later, and still read as finished — and the backlog you
  plan from silently overstates what you have. After this goal, finished work is
  re-proven on a rhythm you can see, anything whose proof has lapsed loses its
  "done" badge with the reason recorded, and the work already sitting in that
  state is worked through rather than written off. A done flag that cannot be
  falsified is a decoration, not a status; this goal makes it a status again.
