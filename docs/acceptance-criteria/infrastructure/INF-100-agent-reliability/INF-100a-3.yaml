work_status: todo
created_by: "tickets/00_inbox/TICKET-20260604-PullRequestAgentProjectContext.md"
criteria: |
  Given the file .agents/agents/pull-request/PROJECT_CONTEXT.md exists,
  When the agent reads the PR writing standards section of that file,
  Then the file specifies that PR titles must use imperative mood and present tense,
  And the file specifies that PR titles must be 70 characters or fewer,
  And the file specifies that PR titles must not end with a period,
  And the file specifies that the PR description must contain a "## Summary" section with up to 3 bullet points,
  And the file specifies that the PR description must contain a "## Test plan" section with a checkbox list,
  And the file specifies that the PR description must end with a "Generated with [Claude Code](https://claude.com/claude-code)" footer.
