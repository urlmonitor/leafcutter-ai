notes: |
  OUTCOME 2 OF 4.

  THE SECOND THEN CLAUSE IS THE ONE WORTH ENFORCING and it is why this is a
  separate record from ACD-2100b-1 rather than a clause on it. The cheap
  implementation of "report honestly" is one catch-all message covering both the
  unreadable and the uninterpretable case, which still leaves the operator unable
  to tell a wrong location from a corrupt file -- two completely different remedies.
  Asserting that the two reports differ is what a test can actually check, and it
  is what stops the four outcomes collapsing back into one.

  A TRUNCATED FILE IS THE REALISTIC FIXTURE, not random bytes. Truncation is what a
  partial write or an interrupted copy produces, and it is what the workspace-root
  registry would look like if a build were interrupted mid-deploy.

  BOUNDARY WITH ACD-2100b-3-i. A file that interprets cleanly but does not hold the
  expected agent entries is NOT this outcome -- interpretation succeeded. That case
  is the one that currently degrades into a false "agent absent" verdict, and it is
  pinned separately.

  FAILING CLOSED STILL HOLDS: the run stops. See ACD-2100b-4.

  2026-08-25 (it-po): the "no unhandled failure" requirement is carried here as well as
  in ACD-2100b-3-i because the truncation case reaches the interpreter and the
  empty-collection case reaches the lookup -- two different raise sites, one shared
  rule. Sized S rather than M: the outcome is one branch on an existing failure path,
  and the expensive part of this L1 (four distinguishable outcomes proved by four runs)
  is charged to ACD-2100b-4.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
