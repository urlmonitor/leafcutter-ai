id: TQ-600a-13-viii
components:
  - testing_quality
title: "A pull request that declares it fixes the open nightly-red issue is not held by it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given exactly one open issue labelled `nightly-red`, numbered N,
  And the deadlock this record exists to prevent: without an exception, the pull request
    that repairs the nightly is itself held by the nightly, nothing can merge, the
    nightly cannot go green, and the repository stops,
  When the check `Nightly suite status` evaluates a pull request,
  Then it passes when the pull request's description contains "Fixes #N" or "Closes #N"
    — the keyword in any letter case, followed by the number of that open issue — and its
    output says it is passing because the pull request declares a fix for #N,
  And it passes when the pull request carries the label `nightly-fix`, and its output
    says so,
  And it still fails when the description names a different issue ("Fixes #M" where M is
    not N), mentions #N without a closing keyword ("see #N", "related to #N"), or names a
    number that merely begins with N's digits,
  And when the declaration or the label is added after the pull request's last push, the
    verdict becomes a pass without a further push — an escape hatch that waits for a push
    makes the repairer push an empty commit to be let through,
  And removing the declaration or the label while the flag is still open returns the
    verdict to a fail on the next evaluation,
  And each case is demonstrated by evaluating the check against a pull request whose
    description and labels are supplied, with one open flag served by the double, and
    observing pass or fail.
depends_on:
