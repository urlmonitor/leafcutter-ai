notes: |
  THIS IS THE DECISION THE L1 ASKED FOR ON WHERE THE CENSUS RUNS AND HOW LOUDLY, taken with
  the precedent it named in view. The census reports on demand and does not gate a commit. A
  verdict that arrives as a blocker on unrelated work gets skipped, and this component has a
  recorded instance of exactly that outcome — a working detector whose findings were bypassed
  because of how they were delivered.

  IT REPORTS AND DOES NOT REPAIR, ASSERTED BY COMPARING FILES RATHER THAN BY BELIEVING THE
  REPORT. A census that quietly patched what it found would make the next run's number
  meaningless and would silently take on work nobody scoped.

  A LONG LIST IS A SUCCESSFUL OUTCOME — the L1 says so explicitly and this record makes it
  mechanical, because the natural instinct when a quality measurement returns a large number
  is to treat the run as failed. The list is the input to prioritising the rest of this
  family, not a regression.

  THE ADJACENT RECORDED DEFECTS ARE OUT OF SCOPE AND STAY OUT. The census will very likely
  surface several already-recorded members of this family and possibly a great many unrecorded
  ones. Reporting them is the deliverable; repairing them is other work.

  IT IS AN L3 BECAUSE IT CONSTRAINS THE DELIVERY of GE-126e-2's report rather than adding a
  measurement. It is nonetheless the clause that decides whether the census is used at all.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL: it constrains how GE-126e-2's report is delivered - non-gating, non-mutating,
  itemised. A delivery constraint has no downstream consumer; the report itself is
  GE-126e-2's deliverable and is already contracted from there to GE-126e-5. DO NOT REFILL.

  NO ALLOWLIST OF KNOWN-ALREADY FINDINGS. The sixth it_requirement is mine rather than the
  BA's and it anticipates the first thing that will be proposed once the census returns a
  long list: suppress the ones we already know about. That allowlist would be a second
  enumeration of the population - the exact shape GE-126d is closing - and it would hide a
  regression on the day one of those findings was supposedly repaired.

  THE NO-MUTATION ASSERTION HAS A TRAP WORTH NAMING. Several checks under census write when
  they run, so a naive before-and-after hash of everything will fail for reasons that are
  not the census's fault. The assertion belongs on the INPUTS the census read - registration
  data and check sources - with the executions themselves confined to disposable copies per
  GE-126e-1's second it_requirement. Stated in the fourth it_requirement so the coder does
  not discover it as a flaky test.

  A NOTE ON WHAT THE CENSUS WILL LIKELY SURFACE. GE-126e-1's notes record one specific
  candidate observed during authoring (check_ac_limits.py). It is named there and not here,
  and neither record widens scope to repair it - this record is the one that makes 'report
  it and move on' the mechanically enforced behaviour.

