title: "Best-practice files are versioned independently from agent templates"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the package contains a best-practice knowledge file for "python" at version 2
  And a project previously generated a "python-coder" specialist from version 1
  When the package is updated to a new release containing version 2 of the python best practices
  And the build runs again on the same project
  Then the generated "python-coder" specialist incorporates the version 2 best practices
  And the version of the best-practice content is recorded in the generated template metadata
  And the previous version 1 content is fully replaced (not appended)
depends_on:
  - BP-800c
  - BP-800b-1
doc_links:
  - path: docs/architecture/components/adaptive-specialists-generation.md
    relationship: describes
