id: BO-300d-3
title: "Every unbuilt piece carries the action that finishes it, and the action for an undetermined cause is safe under either explanation"
component: build-orchestration
components:
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a closing report naming unbuilt pieces under the causes planned and not
    finished, stopped part-way, and cause not determined,
  When the report is read,
  Then every named piece carries an action stated in terms of what the operator
    does next,
    And no named piece is left without one,
    And the action stated for a piece that stopped part-way differs from the action
      stated for a piece that was planned and not finished, because the two
      situations have different remedies.

  Given a piece reported with its cause not determined,
  When its action is read,
  Then the action is one that finishes the piece whichever of the possible causes
    holds,
    And the action does not instruct the operator to investigate a cause the run has
      not established,
    And the action does not depend on the operator first deciding which cause it was,
  So the reader is not sent looking for a change that may never have happened.

  Given a closing report with unbuilt pieces,
  When the report is compared against a report from a run with no unbuilt pieces,
  Then the actions appear only in the first,
  So an action is a consequence of unbuilt work and never boilerplate the reader
    learns to skip.
