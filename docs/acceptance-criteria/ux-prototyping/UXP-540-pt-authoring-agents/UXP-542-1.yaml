criteria: 'Given an agent or person follows the Product Truth authoring prompt, how-to guide and schema
  reference,

  When they prepare a flow for review,

  Then the instructions agree that every step and branch declares exact JSON field paths, types, immediate-container
  requiredness and known defaults with labeled examples,

  And a worked example distinguishes a contract name from a JSON wrapper and full values from projections,

  And the instructions distinguish runtime, source-reviewed and illustrative-design authority, genuine
  non-JSON actions and proposed missing bindings,

  And they require existing source evidence for observed examples and review of real boundary mappings,

  And they instruct the author to regenerate derived compatibility text and indexes and run validation
  instead of editing derived copies,

  And they state that a schema-valid record neither approves ACs nor proves runtime integration or semantic
  answer quality.'
