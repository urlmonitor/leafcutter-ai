criteria: |
  Given the dispatch chain is ticket-supervisor at depth 0, the commit agent at depth 1,
    and the auto-fix fixer at depth 2,
  When the auto-fix path re-dispatches the originating coder for a judgment-tier failure,
  Then the re-dispatched coder runs at depth 2,
  And its dispatch instruction explicitly forbids spawning any sub-agent (including research-agent),
  And the re-dispatched coder relies on the capsule's consumers_checked instead of a fresh
    blast-radius lookup,
  And no agent is created at depth 3, so the depth-1 nesting cap is never exceeded.
