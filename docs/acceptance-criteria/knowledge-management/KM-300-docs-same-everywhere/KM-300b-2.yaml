  - path: templates/scripts/commit_guardian/transform_doc_index.py
    relationship: implements
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Every site that writes the map must write LF line endings and UTF-8 without a BOM regardless of the host's default newline translation and default encoding: write_index in scripts/generate_doc_index.py AND the transform-doc-index hook's own write in templates/scripts/commit_guardian/transform_doc_index.py (tracked source; scripts/commit_guardian/ is a gitignored build output)"
  - "The transform hook's 'write only when changed' comparison must compare the same normalised form it writes, so a CR LF file on disk is detected as different and rewritten"
  - "If a test proves a site already complies, record that in the DECISION HISTORY instead of changing behaviour"
  - "check-file-size ratchet: scripts/generate_doc_index.py is 480 lines against the 400-line .py limit (already over). The change must leave it no longer than at HEAD (net-zero or shrink). If new logic does not fit, extract it to a new module and add that module to every deploy list that already names generate_doc_index.py (scripts/build_deploy_manifest_helpers.py, scripts/build_phases_knowledge.py, scripts/build_phases_workflows.py) so the deployed transform-doc-index hook can still import it"
  - "templates/scripts/commit_guardian/transform_doc_index.py is 319 lines (limit 400); keep it under the limit"
  - "Record the change in the generator's DECISION HISTORY with the AC id, per the doc-enforcer convention"
delivers_to:
  agent: python-coder
  contract: "LF-only, UTF-8 (no BOM) map output on every host; consumed by KM-300b-3's cross-OS byte-identity check"
