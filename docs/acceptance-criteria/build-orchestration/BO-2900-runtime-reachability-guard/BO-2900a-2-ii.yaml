notes: |
  THE PARENT ALREADY REQUIRES A LOUD UNAVAILABLE STATE; THIS AC IS WHERE THAT
  STATE MEETS A PROCESS TREE. BO-2900a-2's self-validation constraint covers one
  case — the observation recorded nothing at all — and reasons about a single
  process. A tree of programs adds three more ways to be blind, and the dangerous
  one is not "nothing was recorded" but "something was recorded and it is
  incomplete": a launched program that displaces the observation leaves a record
  that is well-formed, silent about the code under proof, and indistinguishable
  from an honest not-reached unless displacement is detected on purpose.

  UNWATCHED IS NOT A REFUSAL, AND THAT IS THE WHOLE POINT. A refusal an author
  cannot clear is forbidden by BO-2900e-1's "one action that clears it", and it
  is what 49 criteria hold today: told their proof could not be re-run, with
  nothing to do about it. The correct handling is no verdict — the rule declines
  to decide and says so.

  UNWATCHED IS ALSO NOT A PASS. The opposite error is what makes a purely launched
  proof sail through today: nothing is observed, nothing is judged, and the
  criterion is marked done with no reachability evidence at all. The announcement
  clause is the difference between declining to decide and quietly deciding yes.

  THE COVERAGE CEILING IS REAL AND ACCEPTED. Some programs genuinely cannot be
  watched. This AC does not ask for them to be; it asks that they be counted and
  named rather than being converted into either verdict.

  BOUNDARY. What the observation must span is BO-2900a-2-i. What question it is
  asked is BO-2900a-2-iii. How long the rule stays in report-only is
  BO-2900a-1-ii and BO-2900a-1-iii. This AC covers only the third answer and its
  two prohibitions.

  VERIFICATION MUST PRODUCE THE BLIND SPOT FOR REAL. A test that hands the rule a
  pre-set "unwatched" flag proves the branch and not the detection, and the
  detection is the hard half — especially displacement, which produces a
  plausible-looking record. Each case belongs in one exercise alongside a
  genuinely unreached proof, because the only thing that separates them is that
  the mechanism noticed it was blind.
