notes: |
  Observed 2026-11-02 on two merged, clean workspaces (Windows, WinError 145 "directory not
  empty" part-way through deletion): one lost its workspace record and nearly all of its
  repository first, so a retry answered NOT_FOUND; the other lost part of its repository
  (pack objects) while the record stayed, so a retry fetched and failed FETCH_FAILED. Both
  stop points are among the four arms above. This record is PREVENTION: whatever point
  deletion stops at, the leftover is one the next plain request finishes.

  "Without any discard token" is load-bearing: the workspace held nothing unsent when the
  first request checked it, so finishing must not turn into an unsent-work refusal (deleted
  tracked files would otherwise look like uncommitted changes) and must not need a network
  call that can fail. An unattended caller (finalize) must never have to authorise a loss to
  finish a clean workspace.

  How is for the IT PO. The user offered: move the folder aside to a recognisable
  to-be-deleted name before deleting anything; delete the record and repository last; or
  recognise a broken repository as half-cleared. Note for the IT PO: BO-4300e-2-v says
  half-cleared is decided "from the folder's contents, never from a name list" -- a
  to-be-deleted name chosen by the maker itself is a different thing from a name list, but
  if move-aside is chosen, the moved folder must still sit inside this project's landing
  place (BO-4300e-2-iii) and must still be found by a request addressed by the original
  location or line-of-work name (the second addressing arm above).

  Standing rules kept unchanged: unsent-work check before any deletion (BO-4300e-2,
  BO-4100c-1); a record-less folder holding files is never deleted (user decision
  2026-10-29, BO-4300e-2-v); nothing outside this project's landing place is deleted
  (BO-4300e-2-iii); cleared only when nothing is left (BO-4300e-2, -ii, -viii).
