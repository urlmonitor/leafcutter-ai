criteria: |
  Dogfooded end-to-end on ourselves; an explicit go/no-go gates the final cutover.

  The new model is proven on our own project first -- a full feature built end-to-end the new
  way and spot-checked against a real on-disk requirement in a fresh run, with the project's own
  required checks staying green across many consecutive merges -- before any other project is
  asked to switch. Removing the old path for good happens only when an explicit set of go/no-go
  criteria is fully met.
