it_requirements:
  - "The route the message names must be an absolute or workspace-resolvable path the reader can run as given, not a description of where the deployed copy generally lives. A reader who has to work out the path has been sent on the discovery this record removes."
  - "The message must not name the internal helper or the import strategies that failed. Those are internal symptoms and they are what makes the current wording read as a fixable setup problem."
  - "The message must not state or imply that the workspace is unbuilt. That diagnosis belongs to GE-120b-1-i and is wrong here - the workspace in this record's Given is fully built - and it would send the reader to repair something that is not broken."
  - "The message and the route it names must be produced from one source rather than assembled in two places, so a later change to the deployed layout cannot leave the message naming a path that no longer exists (ACS-100i-9's shape)."
  - "Coverage must execute the named route, not merely assert the string. A message that names a route nobody can follow passes every string assertion and is decoration."
  - "Every assertion must be made in a fully built workspace with the deployed layout present, because the built state is what makes this record and GE-120b-1-i mutually exclusive."
test_spec:
  - name: test_refusal_names_the_copy_run_and_the_copy_that_enforces
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_ac_parent_covered_by.py"
    description: "In a fully built workspace, the build-source copy run against a violating record produces a refusal whose text contains both the path that was run and a runnable path for the enforcing copy."
  - name: test_following_the_named_route_produces_a_verdict_on_the_same_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The route string is extracted from the refusal and executed as given against the same record; it blocks, naming the record. This is what binds the message to reality - a route that cannot be followed fails here while passing every string assertion."
  - name: test_refusal_names_no_internal_helper_and_no_unbuilt_workspace
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "The refusal text contains neither the helper module name nor the three import-strategy phrases recorded on 2026-08-25, and makes no unbuilt-workspace claim - the deletion side of the criterion, and the fence against GE-120b-1-i's diagnosis."
  - name: test_the_2026_08_25_warning_then_success_shape_is_not_producible
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "No invocation of the build-source copy in a built workspace produces a warning followed by the ordinary success value - the exact recorded behaviour, asserted absent."
test_rationale: |
  The whole content of this record is a message, and a message is the easiest thing in
  a codebase to assert falsely: a string test passes whether or not the route it names
  exists. The second descriptor is therefore the criterion — extract the route from the
  refusal and run it — and it is what turns a wording requirement into a behavioural one.
  The third descriptor is a negative assertion because the current message's problem is
  what it contains, not what it omits, and an addition test leaves the misleading
  internal-symptom text in place beside the new sentence. Running everything in a fully
  built workspace is not incidental: it is what makes this record and GE-120b-1-i
  mutually exclusive rather than merely different, so a reviewer can tell them apart
  mechanically.
