it_requirements: |
  Add documentation-verifier to ALL canonical phase-order sources consistently: the
  single-ticket build phaseOrder array, the feature/epic build phaseOrder array, and the
  building-epics SKILL ordering table. A phase agent that is missing from one source
  sorts to the end there; parity across sources is the behavior under test. This spans
  workflow .js files and a skill markdown table.
