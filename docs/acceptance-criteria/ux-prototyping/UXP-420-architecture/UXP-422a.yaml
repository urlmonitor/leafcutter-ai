title: "An agent searches the product-truth store and extends existing artifacts rather than duplicating them"
component: ux-prototyping
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given an agent about to produce a product-truth artifact for a feature,
  When it needs a flow or mock-data set that overlaps an existing one,
  Then it first searches the store's index for a matching artifact,
  And it extends the existing artifact (e.g. reuses the canonical mock-data for an entity) instead of creating a duplicate,
  And it only creates a new artifact when no suitable one exists.
