notes: |
  THE PUT-BACK CLAUSE OF TQ-500g's CRITERIA, UNDER FAILURE. TQ-500g-1-i covers
  the put-back on the happy path. The failure that matters is a run that dies
  with the wrong version on disk: the next step would commit the wrong version
  as the fix. Quick-fix Step 4.2 already handles a failed restore by halting and
  naming the backup; this AC extends that to the three ways a run is cut short.

  X3 NEEDS THE COPY TO OUTLIVE THE PROCESS. The copy must be kept somewhere a
  resumed drive can find (quick-fix keeps it outside the repository), and a
  resume must check before it trusts the working tree. Where it is kept is
  IT-PO's call.

  "NO OTHER FILE CHANGES" is observable: compare the worktree status before and
  after the cycle. It also forbids git stash (shared across every worktree and
  session — see the environment rules and BP-600c-3-ii).

  TESTABILITY: behavioural. A test double for the test run that times out or
  raises, driven through the runner's production entry point, then a byte
  comparison of the file; for X3, run the resume path against a worktree left
  with the altered file.

  IT-PO ENRICHMENT (2026-09-28)
  COPY LOCATION DECIDED: under the worktree's git directory. See
  it_requirements. The quick-fix skill keeps its copies in /tmp, which is
  lost on reboot and shared across sessions. The git directory is per
  worktree, and a resume can find it.
