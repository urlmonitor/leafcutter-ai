notes: |
  PROMISE 3 OF GE-123e (actionable refusal, no advertised bypass).

  NAMING THE SCRIPT IS A DELIBERATE, OBSERVABLE STRING, not an implementation
  detail leaking into the criterion. The refusal text is the product here, and the
  dispatcher fixed its content: it names scripts/feedback/submit_feedback.py and
  signoff §2a.

  WHY "NOT BY HAND". The supervisor-system KI records the current refusal's
  shortest path to a pass: type a feedback-id line, often the fallback marker,
  without running the script. The permission classifier has since refused those
  typed ids as forged records and halted drives. A refusal that names the script
  but still leads with "add a line" keeps that shortest path open. Whether the
  fallback marker is ACCEPTED is the value-shape check's decision (INF-500d-3 and
  later), out of scope here. This criterion governs only what the refusal tells
  the reader to do.

  ENTRIES THAT SIGN NOTHING OFF. GE-123e was amended on 2026-11-16, during this
  decomposition, to say that the refusal should name BO-2000g's one documented
  value, feedback-id: (not-a-signoff), and invent no second convention. That is
  asserted above. The value belongs to BO-2000g-2. Whether this check ACCEPTS it is
  not decided here: any non-blank value passes until the value-shape check lands.
  The refusal must not be shipped before that value is documented in the sign-off
  skill, or it points at something a reader cannot find.

  PERMITTED, NOT REQUIRED: the refusal may also mention that a heading which records
  no phase-agent sign-off can be written outside the sign-off heading form (the KI's
  honest workaround, which GE-123e keeps valid). It is not asserted, because the L1
  says "may".

  "NO SETTING THAT SWITCHES THE CHECK OFF" covers the refusal TEXT only. It forbids
  advertising the commit framework's per-check skip setting. That setting's
  behaviour is out of scope and is not changed.

  TEST-EVIDENCE RULE (for the IT PO; non-negotiable). Every scenario is verified
  through REAL git commit calls in a scratch repository with the hook installed.
  Use both an inline -m message and a message file passed the way the shared commit
  step passes it, and drive the shared commit step itself for the agent route.
  Assert the refusal text as the committer actually receives it on each route.
  Calling the check's message-building code directly is not evidence that the text
  reaches the committer, which is GE-123c's anti-precedent. Hand-writing the
  last-commit-message file or setting the environment the check reads in place of a
  commit is NOT evidence (FP-7).

  IT PO RESOLUTION (2026-11-16). The dependency on BO-2000g-2 is now recorded in
  expects_from, and the shipping order is a binding it_requirement: the refusal does
  not merge before the signoff skill defines feedback-id: (not-a-signoff). depends_on
  is the BA's field and is left unchanged. Adding BO-2000g-2 there is recommended.

  BA AMENDMENT AT THE FINAL GATE (2026-11-16, person approved). BO-2000g-2 is now in
  depends_on as well. A fourth scenario was added for the automated fix-up path:
  the commit fix-up routing config (templates/scripts/precommit-autofix.json, the
  check-feedback-id entry) sends this check's refusals to an agent told to "Add the
  feedback-id per signoff SKILL.md §2a". That wording invites a hand-typed id, which
  is the shortcut the refusal itself no longer offers. The person approved fixing
  it under this record. FOR THE IT PO: that file is not yet in declared_files, and
  the new clauses have no test_intent entries yet. The fix-up's behaviour is
  agent-driven, so the IT PO decides how far a test can go beyond asserting the
  instruction text the fix-up receives.

  IT PO RECONCILIATION (2026-11-16). Resolved: templates/scripts/precommit-autofix.json
  is now in declared_files, with an it_requirement for the check-feedback-id entry,
  and the three new clauses have test_intent entries. Decision on test depth: the
  instruction clause is tested from the routed instruction; the two clauses about what
  the fix-up writes are needs_test false, because an LLM fix-up cannot be run
  deterministically in a test. CAVEAT for the person: the fix-up is dispatched as a
  mechanical general-purpose agent (model haiku). Following the new instruction, it
  runs submit_feedback.py for a sign-off that another agent wrote, under that agent's
  phase. That is a proxy submission, and the permission classifier has refused forged
  records before (KI-SS-20261009). Whether the fix-up should instead hand the refusal
  back to the signing agent is a routing decision this record does not make.
