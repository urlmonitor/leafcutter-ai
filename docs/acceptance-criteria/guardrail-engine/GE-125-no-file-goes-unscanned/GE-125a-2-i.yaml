expects_from:
  ac_id: GE-125a-2
  contract: "The four chosen locations that keep their reduced scrutiny — this record settles which top of the project they are measured from, and what happens when there is none."
it_requirements:
  - "THE WORKSPACE-ROOT CARRY-OVER IS AN INFERENCE, NOT A MEASUREMENT, AND MUST NOT BE PROMOTED TO FACT. What IS measured, and recorded in docs/architecture/components/security-scanner.md and in CLAUDE.md, is that the hook resolves .security-allowlist from the workspace root rather than the worktree, because it computes its project root from the resolved .leafcutter symlink target. That measurement covers the ALLOWLIST path only. It is NOT measured for the prose-exemption path, and it CANNOT be measured against current behaviour: per KI-SEC-001 the exemption is the substring test ('/' + prefix) in path_str, which resolves no root whatsoever, so there is no root-resolution behaviour on that path to observe today. The inference is therefore a DESIGN CONSTRAINT ON THE FIX rather than an observation of a defect: the root-resolution helper that the allowlist path uses is in reach of the anchoring change, and reusing it would import the measured wrong-root behaviour into a code path that never had it. Treat this as the hazard to design against, and record the measurement only once the anchoring change exists to measure."
  - "DO NOT REUSE THE ALLOWLIST'S ROOT-RESOLUTION HELPER FOR THE PROSE EXEMPTION. Whatever computes the project root for the segment comparison must resolve the working copy the commit is being made from — not the resolved .leafcutter symlink target, and not the enclosing workspace. If a shared helper is used, its wrong-root behaviour must be fixed first or a separate resolver introduced; silently inheriting it converts the cheapest fix in this goal into a repository-wide false-positive event in which every acceptance-criterion file and every ticket under a secondary working copy starts reporting a credential."
  - "THE FIRST MEASUREMENT OBLIGATION IS ON THE IMPLEMENTER, NOT ON THIS RECORD. Immediately after the anchoring change lands, run the first scenario against a real secondary working copy and record the observed root in the ticket. That is the point at which the inference above becomes measurable, and the result must be written down whichever way it falls."
  - "THE SECONDARY WORKING COPY MUST BE A REAL ONE, made the way this project makes them (git worktree add, with the deployed layout established as a real install does it), not a directory tree that merely looks like one. This is the BA's constraint and it is the crux of the record: the trap being guarded is about HOW the top is resolved, and a hand-built lookalike may resolve by a different route than the real thing — passing while the real case fails. In particular the .leafcutter path must be present in whatever form a real install produces, since that is the mechanism that yields the wrong root."
  - "THE ROOT MUST NOT BE DERIVED FROM THE PROCESS WORKING DIRECTORY. The third arm is the guard: running the check from <root>/src must produce identical verdicts to running it from <root>. A resolver that walks up from os.getcwd() satisfies the first two arms and fails this one, and it means the same commit is checked differently depending on which folder the author happened to be standing in."
  - "THE ROOT MUST NOT BE DERIVED FROM THE CHECK'S OWN __file__ EITHER — that is exactly the mechanism producing the measured allowlist defect, and under the deployed symlinked layout it resolves to the workspace parent. Derive it from the repository the staged set belongs to."
  - "UNDETERMINED ROOT MUST FAIL CLOSED — report, never exempt. This is a security default and it must be explicit in the code rather than an accident of a None comparison. Per the CLAUDE.md error-handling policy: catch the specific exception the resolution failure raises, log it at WARNING or higher so the condition is not silent, and then report. Never a bare except, never a silently swallowed error, and no try/except wrapped around the pure segment-comparison function itself."
  - "SCOPE FENCE WITH GE-125d, held deliberately. This record settles only the VERDICT when the root cannot be determined. Whether the check ANNOUNCES that it could not determine the root, and where, belongs to GE-125d. Log at WARNING for operability as the error-handling policy requires, but do not build an announcement surface here and do not let GE-125d be closed against this record."
  - "SCOPE FENCE WITH GE-120b, held deliberately. GE-120b is about a check that SKIPS its work in one working copy and does it in another. Here the check runs to completion and reaches a different verdict because it measured from a different place. Same symptom family, different cause; do not close either as a duplicate of the other."
  - "CANONICAL SOURCE, ADR-001, AND THE BUILD IS LOAD-BEARING HERE. Edit templates/scripts/commit_guardian/check_secrets.py and run `python scripts/build.py --target-dir .` before testing. This record is the one where testing an unbuilt source tree is most misleading: the wrong-root behaviour arises FROM the deployed symlinked layout, so a test against the source tree cannot reproduce it at all."
  - "THE FIXTURE TRAP, COMPOUNDED. Every fixture lives inside <ws>, a throwaway tempfile-backed workspace containing no part of this repository. A fixture inside this repository would take its verdict from this repository's list — and in a record specifically about WHICH root is used, that would mean measuring a third root entirely. Credential fixtures are assembled at runtime from fragments per unit_tests/commit_guardian/test_scan_secrets_suppression.py; no source literal and no allowlist entry."
  - "EXECUTE THE CHECK as part of a commit made from <root>, not by calling the root resolver directly. The entire subject is which root the real invocation path arrives at, and a direct call to the resolver lets the test choose the answer."
test_spec:
  - name: test_chosen_locations_in_a_secondary_working_copy_stay_exempt
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "In a real secondary working copy at <ws>/worktrees/copy created the way this project creates them, docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md and tickets/00_inbox/note.md holding a runtime-assembled 5.17-entropy token are both unreported. Fails if the root resolves to the enclosing workspace, under which both sit below a worktrees segment and neither is a chosen location. Tagged real_artifact because a hand-built lookalike worktree may resolve by a different route and pass while the real case fails. FIXTURE KIND IS DELIBERATE (amended 2026-08-25): this arm is about WHICH ROOT is measured from, so the fixture kind is incidental to it — but after the product decision that the acceptance-criteria store is scanned, a store .yaml is no longer an admitted kind and would be reported for that reason, contradicting GE-125b-1-i. A .md at the same location keeps the arm testing root resolution and nothing else."
  - name: test_reused_name_inside_a_secondary_working_copy_is_still_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "src/vendor/tickets/handler.py inside the same secondary working copy, staged in the same run as the two chosen-location files, is reported while those two stay unreported. Separates 'the anchor is the working copy' from 'everything in a secondary working copy is entitled'."
  - name: test_verdicts_do_not_move_with_the_process_working_directory
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "The same three files and the same staged set, checked once from <root> and once with the current directory set to <root>/src, produce identical verdicts. Fails any resolver that walks up from os.getcwd() — which would satisfy the two descriptors above."
  - name: test_undetermined_root_reports_rather_than_exempts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "In a root where the top of the project cannot be determined at all, tickets/00_inbox/note.md holding the token IS reported, and the resolution failure is logged at WARNING or higher rather than passing silently. The fail-closed default asserted at the entry point, not by inspecting a return value."
test_rationale: |
  THE CENTRAL CLAIM OF THIS RECORD RESTS ON AN INFERENCE AND THE CONTRACT IS SHAPED
  TO KEEP IT LABELLED AS ONE. The workspace-root-rather-than-worktree resolution is
  MEASURED for the .security-allowlist path and recorded as such in the component
  architecture doc and CLAUDE.md. It is NOT measured for the prose-exemption path,
  and it cannot be: per KI-SEC-001 that path is a substring test over the whole path
  string and resolves no root at all, so there is no root-resolution behaviour there
  to observe today. The hazard is therefore forward-looking — the wrong-root helper
  is in reach of the anchoring change — and the descriptors here are written as
  guards on the fix rather than as reproductions of a current defect. Do not restate
  the carry-over as a measured fact anywhere downstream.
  RED-VS-GREEN HONESTY, and it is unusual on this record. The first descriptor
  PASSES BY ACCIDENT today: the current substring test finds the chosen names in the
  path whatever the root is, so a green result on today's code proves nothing. It
  begins doing real work the moment GE-125a-1's anchoring lands, which is precisely
  when the wrong anchor becomes reachable. Read it as a guard that activates after
  the parent's change, never as a demonstration of it, and do not admit it to a
  red-baseline check for GE-125a-1. The fourth descriptor is the only one that is
  cleanly red-or-absent today, since no fail-closed behaviour exists to exercise.
  THE THIRD DESCRIPTOR IS THE DISCRIMINATOR and is why the set is four rather than
  three. A resolver that walks up from the process working directory satisfies both
  of the first two descriptors — it finds the right root when the check is invoked
  from the top of the copy — and only differs when the author commits from a
  subdirectory. That is the common case in practice and produces a verdict that
  moves with where someone was standing.
  THE REAL-WORKTREE REQUIREMENT IS THE BA'S AND IT IS LOAD-BEARING. The mechanism
  under test is how the root is resolved through a deployed, symlinked layout. A
  directory tree assembled by the test to look like a worktree may resolve by an
  entirely different route, so it would pass while the real case fails — the same
  measures-the-wrong-thing failure as the fixture trap, one level up. The first
  descriptor is tagged real_artifact for that reason, and the suite must be run
  against a built deployment, because an unbuilt source tree cannot reproduce the
  symlink route at all.
