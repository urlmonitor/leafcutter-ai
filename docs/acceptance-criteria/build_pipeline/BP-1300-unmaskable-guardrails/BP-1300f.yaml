documentation_rationale: >-
  The check documents itself where a contributor meets it: the failing job prints
  each new error with its line and the remedy, the summary line states what was
  inspected, and the job's comment in .github/workflows/ci.yml states the rule.
  No how-to or reference page is planned for this slice; one is warranted once the
  job becomes a required check and the procedure for clearing a red run matters.
