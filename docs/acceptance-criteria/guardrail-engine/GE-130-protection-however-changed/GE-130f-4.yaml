test_rationale: >-
  Prose only - no executable behaviour is created or changed by this record. The one clause that
  could be checked mechanically (no other passage states a different refusal form) is met by
  construction instead: the refusal contract is stated ONCE in the reference and every other
  passage links to it rather than restating it, so a second contradicting passage cannot exist
  without deleting the link. A grep for forbidden phrases would pass on a reworded contradiction
  and would need editing every time the wording changed. The behaviour the reference describes is
  proven by GE-130f-1, GE-130f-2, GE-130f-2-i and GE-130f-2-ii; duplicating those assertions here
  would create a second place where the guards' behaviour is defined.
it_requirements:
- >-
  STATE THE REFUSAL CONTRACT EXACTLY ONCE AND LINK TO IT EVERYWHERE ELSE. This is how the "no
  other passage states a different way" clause is met by construction rather than by a reviewer
  reading carefully. Today four passages state it and they disagree; the repair is one statement
  plus links, not four corrected statements. Any section needing the contract - the stdout
  contract, the exit-code semantics, the escape-hatch table, the catalogue - references that one
  place.
- >-
  THE SOURCE IS CLAUDE CODE'S OWN HOOKS REFERENCE, CITED WITH THE DATE IT WAS FETCHED, and the
  stated form must be the one the repaired guards actually use. If the two ever disagree, the
  reference is wrong and the code is right; say which was checked and when.
- >-
  READ THE WHOLE REFERENCE, NOT THE EDITED PARAGRAPH. The known issue lists five locations across
  four sections plus two catalogue rows and two timeout rows. The failure mode for this record is
  fixing the passage that was quoted and leaving the other three, which is exactly how the
  document reached its current state.
- >-
  THE CATALOGUE ENTRIES STATE BEHAVIOUR, NOT REGISTRATION. documentation_guard's row says its
  watched folders come from the installing project; readme_read_guard's says whole-file writes are
  checked and that gated folders match in main and linked working copies alike. Both rows today
  describe intent the code does not deliver, which is how a reader concluded these guards work.
- >-
  POINT AT THE LIVENESS RECORD RATHER THAN VOUCHING FOR THE GUARD. Each catalogue entry names
  where its record is read from (commit_guardian.json session_hooks_manifest) instead of asserting
  in the reference's own words that the guard works. Prose cannot be falsified; a record can.
- >-
  KEEP THE FAIL-OPEN ADVICE, RESTATED CORRECTLY: an unexpected exception is not a refusal, and a
  deliberate refusal is not an error. Dropping it would trade one wrong rule for another.
- >-
  DO NOT LAND THIS BEFORE THE GUARDS ARE REPAIRED. Every statement here is about what the repaired
  guards do; landing first would replace a contradiction with a different false statement.
  Sequence against GE-129e-2, which edits the STDIN contract of the same file from GE-129a-1's
  findings.
