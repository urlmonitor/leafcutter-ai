id: DK-300b-2
title: "Mention matching follows boundaries, declared phrases and case rules"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a request contains overlapping declared glossary phrases, mixed-case glossary and type names, repeated mentions, quoted examples and ordinary prose,
  When recognition scans the admitted text,
  Then glossary and type matching case-folds and selects the longest declared phrase within each family using Unicode identifier boundaries,
  And code-symbol and artifact-ID matching preserves their owners' case rules,
  And "AC" does not match inside "CACHE" and "TaskInput" does not match inside "TaskInputExtra",
  And generic document genres require an explicit type cue or declared alias,
  And repeated mentions share one canonical card while the checkpoint retains their original matched surfaces and source offsets,
  And quoted mentions supply data without instruction authority.
depends_on: [DK-300b]
