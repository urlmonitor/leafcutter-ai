assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "The sign-off-gate behavior lives in the frontend-coder template + signoff skill prose; it invokes the render-smoke runner (BO-570-1) and gates on its verdict — it must NOT re-implement the render logic in prose."
  - "On a render-error verdict the sign-off MUST be failed/blocked, never advisory — a render failure cannot be downgraded to a warning that still allows an 'ok' sign-off."
  - "frontend-coder must invoke the render-smoke check as part of its sign-off and must not reach an 'ok' verdict on a frontend surface whose render verdict is anything other than render-success."
delivers_to: null
expects_from:
  ac_id: BO-570-1
  contract: |
    The render-smoke runner verdict object
    { check: "dev-render-smoke", outcome: render-success | render-error |
      tooling-unavailable, surface, reason }. render-error => sign-off failed;
    tooling-unavailable => inconclusive (see BO-570-2-ii); render-success =>
    may proceed to "ok" on this criterion.
