id: BP-1100e-1
readiness: approved
priority: high
title: "Before a ticket is marked done, source files changed but not declared are flagged"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket has passed its gates and is about to be marked status: done,
    and its frontmatter declares files_touched: ["scripts/build_phases.py"] with
    no out_of_scope entries,
  And the actual set of source files changed by the ticket's work is
    ["scripts/build_phases.py", "scripts/workflows/finalize-feature.js"]
  When the pre-done reconciliation runs (comparing the actually-changed source files
    against the declared files_touched UNION out_of_scope)
  Then it flags the ticket, naming "scripts/workflows/finalize-feature.js" as a
    source file that was changed but not declared in files_touched or out_of_scope
  And the flag is raised at the pre-done point (before the ticket reaches
    status: done), not only after the fact
  And a source file is one with an executable/source extension (.py, .sql, .ts,
    .tsx, .js); a real diff containing such a file absent from the declared scope
    is what triggers the flag
