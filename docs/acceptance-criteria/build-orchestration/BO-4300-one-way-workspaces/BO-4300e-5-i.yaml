it_requirements:
- The reference names each new refusal's code and fields exactly as the maker emits them after BO-4300e-2-iv
  to BO-4300e-2-vii. A field the maker does not emit is never documented.
- Each new refusal is documented once, in the reference. The how-to links to it and does not restate it.
- Must keep the how-to frontmatter conventions of docs/how-to/ and update last_updated.
- Every answer code or field the guide names must exist in docs/reference/workspace-maker-answer.md as
  implemented by BO-4300e-2-iv to BO-4300e-2-vii; the guide links to that reference rather than restating
  it.
- Must contain no command that deletes a workspace folder or its repository outside the workspace maker
  (no rm, rmdir, Remove-Item, rmtree or git worktree remove steps).
- Must state that the discard token is read from the refusal each time and never stored, consistent with
  the existing token section.
- Must be written after the behaviour records it describes are implemented, so every example answer matches
  the real maker.
