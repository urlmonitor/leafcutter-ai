notes: |
  THIS FAMILY PRESUPPOSES THE EXCLUSION BRANCH OF TQ-600a-13. TQ-600a-13 deliberately
  leaves open whether to implement the exclusion or correct the documents, and
  TQ-600a-13-i is conditional on the exclusion branch. A nightly run of the excluded
  population only has a subject if something is excluded. These records therefore make
  that choice in practice — or, if the documents branch is still chosen, they describe
  the invoked cadence TQ-600a-9's verification tests need before they may land (see
  TQ-600a-9's expects_from). Whoever approves these should record which.

  PASSED-ON-RETRY IS AN ADDITION TO THE APPROVED DESIGN, NOT A CHANGE TO IT. The night is
  still green. The addition is only that the retried pass is named, for the reason in
  the criteria. If the owner wants a passed-on-retry to also surface on the flag, that is
  a design change and is not made here.
