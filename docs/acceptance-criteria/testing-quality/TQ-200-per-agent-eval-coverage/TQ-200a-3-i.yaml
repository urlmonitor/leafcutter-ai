    status: exists
  - path: docs/product-truth/classifier/eval.jsonl
    relationship: relates-to
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  The gold artifacts (e.g. fern-and-fig/customer-buys-a-plant flow, fern-and-fig/catalog
  mock data, the approved mockups, and the classifier eval seed) are the oracle.
  Golden cases derive their expected outcome from these; the README already states
  agents "must reproduce artifacts of at least this shape and quality." A regression
  is a golden case whose score drops below its recorded baseline.
