title: "The commit-delegation hook recognises a git commit by the command that runs, not by the words in the command text"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the enforce_commit_delegation PreToolUse hook receives a Bash command
    and COMMIT_AGENT_MODE is not set to "1" (neither in the environment nor as
    an inline COMMIT_AGENT_MODE=1 prefix token),
  When any simple command in it (split on &&, ||, ;, |, & and newlines, and
    including the body of a $(...) or backtick substitution) runs the git
    program with commit as its subcommand, after optional leading VAR=value
    assignments and after git global options such as -C <dir>, -c <key=value>,
    --git-dir, --work-tree or --namespace,
  Then the hook emits a block decision,
  And "git -C <path> commit -m ..." and "cd x && git commit -m ..." are blocked
    exactly like a plain "git commit",
  And a command that only mentions the words "git commit" inside a quoted
    argument (for example gh pr create --body "... run git commit ...",
    echo "git commit") or that runs git with a different subcommand
    (git status, git log --grep commit) is allowed,
  And a command whose quoting cannot be parsed fails closed: it is blocked
    when a git token is followed by a commit token,
  And the bug symptom ("git -C <path> commit is never blocked, while a command
    that merely mentions git commit is blocked") must not occur.
