notes: "Paired negative case for ACS-200f. Authored deliberately because the reported symptom is a false REFUSAL, and the naive fix for a false refusal is to stop refusing — which would silently convert the strongest anti-phantom-done gate in the store into a rubber stamp and contradict BO-2500a-2-i. Id note: the store's id pattern does not admit a roman-numeral segment directly after a letter segment (ACS-200f-i is rejected), so this L3 takes the numeric child slot ACS-200f-1 under the letter-slot L2 ACS-200f — the same slot shape its sibling ACS-200e occupies."
