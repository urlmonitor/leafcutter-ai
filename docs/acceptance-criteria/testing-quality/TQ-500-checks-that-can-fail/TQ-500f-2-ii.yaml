change_target: prompt
risk_surface: contract_boundary
notes: |
  PROMPT-ONLY. This is an instruction to the enricher; no deterministic unit
  test can show that an LLM names good wrong versions. The observable output is
  the enriched requirement records themselves (an eval over R1/R2/R3 can check
  them), but a unit test asserting the instruction is present in the enricher's
  template is the text-search proof CLAUDE.md forbids. IT-PO: say so in
  test_rationale (test_required: false, or an eval-shaped test_spec) rather than
  writing a grep test.

  R3 is the control: an enricher that stamps must_catch on everything would
  pass R1 and R2 and add noise to every new-feature requirement.

  The last Then clause keeps TQ-500's non-goal intact: the judgement is
  DECLARED by the enricher, never inferred from requirement text by a
  classifier.
