test_spec:
  - name: test_pattern_matching_no_file_raises_an_authoring_error
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "First half of the Given: a reference_pattern matching zero files surfaces an authoring error rather than resolving to nothing silently."
  - name: test_pattern_matching_more_than_one_file_raises_an_authoring_error
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "Second half of the Given, and separately discriminating: an implementation that guards only the empty case passes the zero-match test and still picks an arbitrary path when a pattern is ambiguous."
  - name: test_authoring_error_names_both_the_ac_id_and_the_pattern
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "The error message names the AC id AND the unresolvable pattern — two separate assertions. A bare 'could not resolve reference pattern' satisfies neither half of the diagnostic purpose, since the author cannot tell which record or which pattern to fix."
  - name: test_no_implementation_notes_path_line_is_emitted_on_failure
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: boundary
    description: "The 'And it does not silently emit' clause: on the failure path no raw pattern and no broken path reaches the ticket body. This is the boundary that stops the error being raised and then swallowed by a caller that emits the unresolved value anyway."
