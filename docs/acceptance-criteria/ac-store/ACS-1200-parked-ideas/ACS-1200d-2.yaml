title: "Half an un-park is refused, and the message says which half is missing"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200d.yaml
criteria: |
  Given KM-200.yaml carries parked: true with a non-empty parked_reason and an
    empty covered_by, and its six children KM-200a through KM-200f exist,
  When a staged change removes parked and parked_reason while leaving covered_by
    empty, and the parent-back-link check is executed as a process against that
    staged set,
  Then it exits non-zero, reports the six children as missing back-links, and
    its message states that the record is no longer marked parked and its child
    list has not been restored,
  And when instead a staged change adds the six child ids to covered_by while
    leaving parked: true in place, the checks exit non-zero, name KM-200, and
    state that a record marked parked must not list children,
  And each message names the specific half of the transition that is missing,
    so the developer is not left to infer it from a generic back-link error,
  And both verdicts come from executing the checks as processes and asserting
    their exit codes and messages.
