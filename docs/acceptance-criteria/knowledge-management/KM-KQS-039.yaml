criteria: |
  Given the knowledge-query SKILL.md contains an "Agent Protocol" section
    covering invocation syntax, error handling, zero-result handling,
    citation format, deduplication warnings, empty-graph normalization,
    and mandatory-invocation rule,
  When an agent template author (implementing ACD-300e-2, ACD-300e-3,
    ACD-300e-4, or ACD-300e-5) needs to add knowledge-query consumption
    behavior to a template,
  Then the Agent Protocol section is self-contained: an agent template
    can reference it with a single instruction line such as
    "Load the knowledge-query skill and follow its Agent Protocol section"
    without needing to repeat any of the seven protocol rules inline,
  And the Agent Protocol section clearly delineates what it prescribes
    (shared handling logic) from what the agent template must still specify
    (which surfaces to query, when in the workflow to query, what to do
    with the results),
  And the Agent Protocol section is located after the existing "Invocation"
    and "Error Behaviour" sections in SKILL.md so that it builds on
    previously-defined concepts without duplicating them,
  And the Agent Protocol section uses second-person imperative voice
    ("You MUST...", "You MUST NOT...") consistent with agent template
    instruction style, not third-person descriptive voice.
