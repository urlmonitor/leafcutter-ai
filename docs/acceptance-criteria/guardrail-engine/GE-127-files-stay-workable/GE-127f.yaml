notes: |
  WHY THIS IS A NEW SIBLING L1 AND NOT AN AMENDMENT TO GE-127b. GE-127b was
  examined as the host and rejected on four grounds, each independently
  sufficient. It is the closest record in the store and the argument is recorded
  in full so it is not re-litigated:

    - THE TWO PROMISES ARE PRICED IN OPPOSITE DIRECTIONS. GE-127b's entire
      selling point is that it costs the author NOTHING: that is what makes the
      standard switchable on the day it lands over a population of 212 files,
      and its own notes call the allow-arm "not a concession, it is the
      mechanism". This record deliberately puts a PRICE on growth in order to
      force convergence. Folding a price into the record whose value proposition
      is "free" makes that record's own tagline false and gives an implementer a
      pair it can satisfy by building whichever half is cheaper — the exact
      failure the L0 fences GE-127a and GE-127b apart to prevent.

    - GE-127b IS DELIVERED. work_status is done, _file_size_ratchet.py exists,
      and GE-127b-1's suite is green. Rewriting a delivered criterion converts
      completed work into partial work and destroys the evidence that the
      ratchet landed. The ratchet is the FLOOR this record raises; keeping it
      whole is also how the work must be sequenced.

    - THE FOURTH REQUIREMENT DOES NOT FIT INSIDE A SIZE COMPARISON AT ALL. "The
      author is not the one who shrinks the file" is not a property of a
      before-versus-after measurement; it is a property of who does the work when
      the measurement refuses. It also carries a hard dependency on INF-800f, in
      another component, which GE-127b has no business acquiring.

    - GE-127b's OWN FENCE POINTS THE OTHER WAY. Its notes reserve the right to
      record an explicit EXCEPTION — a weakening — and say one must never be
      defaulted into existence. They say nothing about silently strengthening the
      rule inside the same record, and its claim is precisely bounded: the
      oversized population is "monotonically NON-INCREASING". Non-increasing is
      not decreasing. A decrease requirement is a new claim, not a clarification
      of an old one.

  THE COUNTER-ARGUMENT, AND HOW IT IS ANSWERED. This record does not merely add
  to GE-127b, it NARROWS it: a change that replaces five lines with five
  different lines was allowed by GE-127b and is refused here. That is handled the
  way the store handles a later record narrowing an earlier one — an amended_by
  entry on GE-127b pointing forward, with its criteria left untouched — and not
  by a rewrite. GE-127a already narrows GE-127b the same way by refusing
  crossings GE-127b would permit.

  THE USER'S FOUR DECISIONS, TAKEN 2026-09-14, NOT RE-OPENABLE AT DECOMPOSITION.
  These were argued to a conclusion in conversation and are recorded so the BA and
  IT PO implement them rather than rediscover them:

    (1) THE MULTIPLIER IS TWO TIMES WHAT THE CHANGE ADDS, NOT A PERCENTAGE OF THE
        FILE. A percentage-of-file rule was proposed first and REJECTED, because
        it prices the change by the accumulated sins of the file rather than by
        what the author is doing. The user also rejected 1.2x as too slow by
        their own reasoning ("I would increase that to a higher number, probably
        double").
    (2) ZERO ADDITION COSTS NOTHING. This is the property that makes the rule
        survivable and it is load-bearing, not a courtesy.
    (3) THE REQUIREMENT IS CAPPED AT THE LIMIT. Nobody removes two hundred lines
        when twenty would bring the file under. The clean expression is an END
        STATE, not a removal quota: the change must leave the file at or below
        whichever is the LESS demanding of the size limit and (previous length
        minus lines added). Once a file reaches the limit it leaves this regime
        entirely and is governed by GE-127a's threshold alone.
    (4) THE AUTHOR DOES NOT DO THE SHRINKING. A dedicated restructuring
        specialist does. The user's stated reason is the whole point: an agent
        racing a gate moves lines to a sibling file to satisfy a quota; a
        specialist optimises for structure instead.

  WHY TWO TIMES AND NOT 1.2 — MEASURED IN THIS WORKTREE, 2026-09-14, UNDER THE
  GUARD'S OWN COUNTING RULE, TRACKED FILES ONLY. 212 of 988 tracked .py files
  stand above the 400-line limit, carrying 62,524 excess lines. Distribution:
  78 at 400-500, 77 at 500-700, 29 at 700-1000, 19 at 1000-1500, 9 above 1500.
  Median oversized file 551 counted lines. 73% of the backlog therefore sits
  within about 300 lines of compliance, which is why a 2x rule converges in one
  or two growth-shaped changes for most of it while a 1.2x rule needs roughly ten
  and in practice never arrives. Carry the corollary honestly rather than
  implying otherwise: the 9 files above 1500 will NOT be fixed incidentally at
  any multiplier, and nothing in this record claims they will.

  THE RISK THE USER IDENTIFIED, WHICH MUST SURVIVE INTO THE L2s. At 2x the
  cheapest way to satisfy the rule stops being "delete dead code" and becomes
  "move a hundred lines into a sibling file". That passes and improves nothing.
  The subtlety cuts both ways and the decomposition MUST distinguish the two,
  because a gate sees them identically:
    - moving NEW work out of an oversized file into a home of its own is the
      DESIRED behaviour and must not be penalised;
    - moving EXISTING content out purely to make a number fall is the FAILURE.
  Requirement (4) is the user's answer to this and is why it is in the criteria
  rather than in an implementation note. An L2 set that delivers the arithmetic
  and drops the separation of duties has shipped the failure mode, not the
  feature.

  A SECOND GAMING ROUTE THAT IS NOT CLOSED — MEASURED, NOT ASSUMED. It is
  tempting to say the counting rule already defeats content-stripping. It does
  not, and the BA must not assume it does. count_content_lines strips
  triple-quoted regions and block comments only; a probe of a 7-line sample
  containing a docstring, a hash comment and two blank lines counted 5, so BLANK
  LINES AND HASH COMMENTS STILL COUNT and deleting them still satisfies this
  record. That is a live incentive to make files worse, it grows with the
  multiplier, and it is the cheapest available response to a 2x demand. Whether
  the counting rule should change is GE-127d's call and must NOT be settled here
  by writing a second rule into this comparison — but this record is the reason
  the question becomes urgent, and the interaction must be named rather than
  inherited silently.

  THE BOUNDARY BETWEEN THE RULE AND THE HANDOFF — STATE IT OR IT WILL BE BUILT IN
  THE WRONG PLACE. A commit-time gate can only REFUSE; it cannot summon anyone.
  So the RULE — the end-state comparison and its refusal — belongs in the
  guardrail tree and is this record's subject. The HANDOFF — author hits the
  rule, work passes to the restructuring specialist, the specialist restructures,
  the commit is retried — lives in the supervisor / build-orchestration layer and
  is NOT decomposed here. That is why this record's components list names
  build_orchestration alongside commit_guardian: the promise spans both layers
  even though its L2s must not. An L2 beneath this record that specifies dispatch
  mechanics inside the hook is at the wrong address and must be rewritten rather
  than approved.

  AN UNRESOLVED EDGE THE BA MUST SETTLE EXPLICITLY, FLAGGED RATHER THAN DECIDED.
  Decisions (1) and (2) do not by themselves fix the behaviour at very small
  additions, and the arithmetic is unforgiving there. "Added" has to mean GROSS
  lines added by the change, not net growth, or the rule is self-referential and
  has no solution. Under gross counting, a one-line correction that REPLACES a
  line adds 1, so the required end state is one line below where the file
  started, and the change is not free. The user's stated intent — an emergency
  one-line fix in a 2,677-line file stays free — and the literal rule therefore
  diverge at the smallest changes. Settle this deliberately: either a threshold
  below which the rule does not engage, or an explicit acceptance that a tiny
  addition costs a tiny removal. Do not default it, and note that dispatching a
  restructuring specialist to remove two lines for a typo fix is a real cost, not
  a rounding error.

  BOUNDARIES WITH THE SIBLINGS, ALL FOUR DELIBERATE AND NONE TO BE ABSORBED.
  GE-127a owns the CROSSING event, under the line to over it; this record's
  population is files already over. GE-127d owns the COUNTING rule; this record
  consumes it and must never restate it. GE-127e owns what a refusal SAYS; a
  refusal under this record will need a message, and that message's quality is
  GE-127e's subject, not this one's. GE-127c owns WHICH kinds of file are in
  scope; widening that list widens this record's population automatically and
  neither record may pin the other's answer.

  Authored at the PO stage; L1 only. No L2, no it_requirements, no test_spec and
  no declares_side_effect were written here, by design. delivers_to and
  expects_from are null because nothing is enriched yet, not because this record
  is terminal — it plainly is not.
