notes: |
  Satisfies BO-3600b's documentation_triggers: [state-diagram].

  As with BO-3100f-5, the load-bearing content is the transitions the diagram does
  NOT show: no unevidenced route into retired, and no route that touches a
  requirement record. Those are BO-3600b-1's and BO-3600b-3's guarantees made
  legible, and a diagram omitting them would license exactly the implementations
  those records forbid.

  The second scenario reconciles the diagram against real entries in both
  directions, so it documents the register as kept rather than as imagined.

  assigned_agent deliberately unset — the diagram surface belongs to the IT Product
  Owner's assignment pass.
