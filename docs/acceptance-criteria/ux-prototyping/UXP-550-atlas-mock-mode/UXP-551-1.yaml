estimated_complexity: S
it_requirements: |
  The product-truth / entity mock-data RECORDS in leafcutter-web/fixtures/ (record data
  such as Plant/Customer/Order) are plain JSON, shaped identically to the real artifacts,
  so a single source of entity mock-data serves both the mock-mode Atlas (read through the
  loaders per UXP-550/UXP-554) and the test suite (read directly by test-writer). No test
  authors its own copy of this record data; tests reference the same JSON files. Scope is
  the JSON entity mock-data only — the YAML AC store and markdown ticket inputs of the
  canned repo mirror their native formats (UXP-551) and are not covered by this reuse
  claim. This is the ADR-021 feed-forward principle applied to fixtures: the mock records
  the reviewer sees are the same records the tests assert against.
