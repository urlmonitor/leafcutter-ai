  - reason: stop-only-on-positive-attribution-user-decision-2026-09-17
    by: product-owner
    at: 2026-09-17
    note: >-
      Narrowed the "stops the run" promise to match the user's attribution policy.
      Old criteria text (verbatim): "Where a command's effect on protected files
      cannot be told in advance, the protection finds out afterwards what actually
      changed, names any protected file that changed, and stops the run, so a quiet
      result is never mistaken for a checked one."
      USER DECISION (2026-09-17), after-the-fact check attribution policy: stop
      only on a change positively attributed to this caller; when the check
      examined the files but cannot tell whose change it was, it names the file,
      says it could not tell and why, records the finding, and lets the run
      continue; when it could not examine the files at all, it still stops.
      inline_work_guard is unaffected (under the build lock it still stops any
      writing command except the build's own agents). Children: GE-130c-2-i
      reworded, GE-130c-2-ii added for the persisted record (BA).
