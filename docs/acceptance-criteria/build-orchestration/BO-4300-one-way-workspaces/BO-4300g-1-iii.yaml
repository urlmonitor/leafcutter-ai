    reason: Its remove section and the close-worktree Phase 4 it loads already relay the maker's UNSENT_WORK refusal and only use the token on the person's instruction, so the charter is where the discard-token separation from caller authorization must be written.
    decision:
      choice: assignment stands
      reason: The discard-token separation is charter wording in the same remove section, so it stays with llm-expert and needs no other surface.
      by: it-po
file_findings_opened_files:
