    were never load-bearing; they describe the shape the fixture must construct. Every
    test_spec entry already builds its own throwaway repository — arm 1 wants "several
    documents under the limit and at least one far above it", arm 2 adds a 420-line
    66th document, arm 3 compares against "the set the fixture constructed, never
    against a pinned count". So the record stays buildable with no change, and editing
    approved criteria to chase numbers the record itself disclaims would be a worse
    outcome than a note.


    THE ONE THING THAT GENUINELY CHANGES, AND IT IS WORTH KNOWING. The third arm — the
    negative control, which empties the declaration and requires the three over-limit
    documents to be named — can no longer be exercised against the REAL cards
    directory, because there are no over-limit documents in it. Against a fixture it is
    unaffected. But the record loses its live worked example: until now, anyone could
    see the mechanism working by looking at the actual tree. That is a real loss of
    legibility and it is recorded rather than smoothed over.


    THE CARDS ENTRY STAYS IN THE DECLARED SET. The argument is on GE-127g under "DOES
    THE CARDS ENTRY COME OUT?" and the ground most relevant to THIS record is the
    second one: docs/agents/cards/ is the only DIRECTORY-shaped entry of the three, so
    it is the only location under which this record''s second arm — "THE SECOND ARM IS
    THE WHOLE RECORD", a newly generated document joining with no edit to the
    declaration — has any population at all. Removing it would leave this record
    quantifying over two individual filenames, which is the basename list it exists to
    replace.'
