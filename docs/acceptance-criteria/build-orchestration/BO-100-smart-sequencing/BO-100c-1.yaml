title: "Disjoint files_touched sets allow parallel dispatch in same batch"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given ticket A has files_touched: ["src/module_a.py", "tests/test_a.py"]
    and ticket B has files_touched: ["src/module_b.py", "tests/test_b.py"],
  When /build-feature computes the file-touch intersection at step 3a,
  Then the intersection of A.files_touched and B.files_touched is empty,
  And both A and B are included in the same dispatch batch,
  And both ticket-supervisors are spawned in the same parallel fanout.
