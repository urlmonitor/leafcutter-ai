criteria: |
  Given the filtering skill has identified 12 candidate commits matching
    the pattern "docs/architecture/**",
  When the skill formats its output for the specialist agent,
  Then each candidate commit entry includes:
    - the commit subject line (first line of the commit message)
    - the list of files changed in that commit (relative paths)
    - the commit hash (abbreviated, for reference)
  And the specialist can read both the message pattern AND the file structure
    for each candidate without a second git query,
  And the output format is structured (not raw git log text) so the specialist
    can parse it programmatically.
