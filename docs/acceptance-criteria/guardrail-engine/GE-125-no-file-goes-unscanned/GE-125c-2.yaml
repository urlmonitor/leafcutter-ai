notes: |
  WHAT THIS ADDS OVER GE-125c-1. That criterion proves the file stopped being the
  unit of the decision. This one settles what the decision is made ON: a value is
  set aside only when a recognised explanation accounts for THAT value, and
  everything else is reported. Either can be satisfied while the other is broken —
  a per-result rule that sets aside every value in a prose location satisfies the
  counting shape of GE-125c-1's second scenario and fails the first scenario here.

  THE MECHANISM ALREADY EXISTS IN PART, per the parent L1: the check already
  recognises project identifiers of the ticket and epic forms as explanations
  rather than credentials. This criterion is the instruction to make that same
  per-value judgement carry the whole load, not to invent a second one beside it.

  CLOSED LIST, REPORT BY DEFAULT — the shape is inherited, not chosen fresh.
  GE-123d-2 chose closed-list-with-report-by-default for the adjacent rule and
  GE-125b's notes ask the same of the file-kind decision. Follow it here unless
  there is a reason not to, and record the reason if there is. The third scenario
  is what makes the closure observable: an unrecognised form must be reported
  rather than waved through.

  WHAT THIS DOES NOT DECIDE. The second scenario requires that a reason exists per
  set-aside value; it deliberately says nothing about whether, how loudly or at
  what granularity that reason is shown to the person committing. That is GE-125d's
  subject and it must not be pre-empted here. If a sibling's decomposition needs a
  per-value reason to announce, this is the record that guarantees one exists.

  FIXTURE PLACEMENT — STATED, NOT INHERITED. Every fixture must be a real file
  created inside a tempfile-backed throwaway project root, with the prose location
  constructed INSIDE that root (for example `<tmp_root>/docs/retrospectives/<name>.md`
  and `<tmp_root>/tickets/00_inbox/<name>.md`) and the check run against that root.
  No fixture may be created under this repository's own `tickets/`,
  `docs/retrospectives/`, `docs/acceptance-criteria/` or `templates/skills/` trees:
  a fixture under one of those measures the exemption rather than the scanner and
  passes for the wrong reason. The first scenario is the one this trap would
  silently invert — placed in the real retrospectives tree it could report for a
  reason unrelated to the change, or stay silent for one. The test module belongs
  under `unit_tests/commit_guardian/`, which matches none of the four names.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Per CLAUDE.md, every arm runs
  the real pre-commit secrets check over real staged files and asserts the process
  exit status and the reported findings. Asserting what an exemption decision
  returns when called directly does not discharge any arm, and greping the source
  for the recognised-explanation list discharges nothing — a list that exists and is
  never consulted passes that test.

  CREDENTIAL-SHAPED FIXTURE STRINGS must be assembled at runtime from concatenated
  fragments rather than written as source literals, so this repository continues to
  need no suppression for the module that holds them.

  RED BASELINE, HONESTLY LABELLED so a later TDD-order check does not misread it.
  The first and third scenarios are RED today — KI-SEC-001 measures a value of this
  shape in these locations as exempt and unreported. The second scenario is GREEN on
  its no-finding half today, because the whole file is exempt for the wrong reason;
  its load-bearing half is the requirement that the two values be two decisions
  each with its own explanation, which is red. Do not cite the no-finding half alone
  as evidence the fix landed.
