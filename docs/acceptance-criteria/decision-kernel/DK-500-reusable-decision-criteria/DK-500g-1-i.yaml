id: DK-500g-1-i
title: A category record that fails validation stops the import and leaves the active graph as it was
component: decision-kernel
components:
- decision_kernel
- knowledge_management
level: L3
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a commit in which the published cat-1dc11c5a2ffa7310 lists the member (dec-d53e1c52cd47c832, crit.no_such_criterion), a criterion that decision does not carry,
  When the knowledge sync builds a new generation,
  Then the build fails, naming cat-1dc11c5a2ffa7310 and the pair,
  And the generation that was active before stays active,
  And no file in the repository changes,
  And once the member is corrected in a later commit, the next build publishes a generation that includes cat-1dc11c5a2ffa7310.
depends_on:
- DK-500g-1
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500g-1
  contract: Generation build with category validation.
change_target: code
risk_surface: internal
it_requirements:
- A validation failure is reported naming the category id and the offending pair. The build publishes nothing, the active generation pointer is unchanged, and no repository file is written (the importer only reads Git).
test_required: true
test_spec:
- name: test_bad_member_fails_build_naming_category_and_pair
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A commit where cat-1dc11c5a2ffa7310 lists (dec-d53e1c52cd47c832, crit.no_such_criterion) fails the build, naming the category and the pair.
- name: test_active_generation_stays_active
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The previously active generation stays active.
- name: test_no_repository_file_changes
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: No file in the repository changes.
- name: test_corrected_member_next_build_publishes
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: boundary
  description: With the member corrected in a later commit, the next build publishes a generation including cat-1dc11c5a2ffa7310.
test_rationale: Build real generations through the knowledge sync and registered-operation entry points from a fixture commit (offline fixture backend), and assert node identities, links and answers against the category records of that commit; a live Neo4j test proves server compatibility. Unit tests of the reader alone would not prove that the Decision kind is unchanged in a full generation.
