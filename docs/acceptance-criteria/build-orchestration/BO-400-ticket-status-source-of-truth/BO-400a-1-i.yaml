id: BO-400a-1-i
title: "Ticket already in_progress from a previous failed run"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file with frontmatter `status: in_progress`
    and an `agents:` map containing entries with value `needed`
    (indicating a prior supervisor run started but did not complete),
  When ticket-supervisor begins driving this ticket
    and invokes set_ticket_status.py with --status in_progress,
  Then the script detects the existing `status: in_progress`
  And it treats in_progress -> in_progress as an idempotent no-op
  And it exits with code 0
  And it prints: "status: in_progress -> in_progress (no change)"
  And ticket-supervisor proceeds to spawn the first needed phase agent
    without error or warning.
