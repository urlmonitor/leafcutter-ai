id: DK-400a-3-i
title: "A question that lists alternatives or constraints is one question, not a bundle"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose root goal is "Should this new capability be an atomic node or an
    encapsulated subgraph, given that it must be resumable and traced?",
  And routing gives it to the decision capability,
  When routing runs on the run's root,
  Then no split is started, because the alternatives joined by "or" are the options of one
    question and the conditions joined by "and" are constraints on it,
  And the run goes on as one decision from the precedent step with no split gate shown.
