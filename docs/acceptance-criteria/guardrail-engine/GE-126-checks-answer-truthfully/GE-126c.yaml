criteria: |
  A build source is not a working check and never answers like one.

  Where a copy of a check is structurally incapable of doing its job — not by
  accident of setup but by what that copy is — running it tells you that and
  refuses. It never warns and passes. What it tells you names the copy you ran
  and the one that works.
