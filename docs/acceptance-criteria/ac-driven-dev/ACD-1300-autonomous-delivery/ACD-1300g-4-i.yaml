id: ACD-1300g-4-i
title: Changed heads and uncertain publication cannot appear delivered
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given review approved one head but the head changes before publication, or pushing or draft-PR creation fails or has an uncertain outcome
  When the worker attempts the delivery handoff
  Then it preserves the validated and reviewed revisions and all known remote branch or PR identifiers
  And it reports a stale-evidence or publication blocker rather than delivered status
  And explicit recovery reconciles existing remote state before retrying so a partial success cannot create a duplicate PR
  And a changed head requires fresh validation and review within the existing limits
