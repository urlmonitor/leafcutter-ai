criteria: |
  Bundled questions are recognised; a single question is never split.

  A request that bundles several separate questions, and would otherwise be
  turned away, is recognised and offered to you as a split. A single question
  is never split: if it can be handled it goes ahead as one, and if it cannot be
  handled yet it is still logged as an ability the kernel lacks, exactly as
  today, so a missing ability is never passed off as a split.
