criteria: |
  Given the webapp-testing skill remains a separate optional skill
    (it is NOT merged into the unified agent template)
  When the unified frontend agent is dispatched for a ticket
  Then the agent checks for webapp-testing via the same file-existence
    detection method as before:
    checking .claude/skills/webapp-testing/SKILL.md
  And if the file exists, the agent invokes the webapp-testing protocol
    (screenshot capture, console-log check)
  And if the file does not exist, the agent notes the absence in the
    completion report and proceeds without browser verification
  And the Antigravity environment variable override is preserved
