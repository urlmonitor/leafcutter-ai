id: UXP-100c-2-i
title: "Prototype with pending component research cannot be approved — only deferred"
component: ux-prototyping
level: L3
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a prototype contains two positions marked as "pending: timeline-view research"
    and "pending: progress-indicator research",
  When the user attempts to select "Approve",
  Then the system prevents approval and displays a message: "This prototype has
    2 components pending research (timeline-view, progress-indicator). Approve
    after research completes, or request changes to remove the dependency."
  And the user can still select "Request changes" or "Reject"
  And the prototype cannot proceed to the implementation phase while any
    component positions remain in "pending" status
