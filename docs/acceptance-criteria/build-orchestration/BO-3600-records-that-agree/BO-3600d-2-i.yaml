notes: |
  NOT-YET-DECIDED IS NECESSARY AND IS ALSO THE OBVIOUS ESCAPE HATCH. Forcing an
  answer produces bad answers, so the state has to exist; but a state with no cost
  becomes the default, every conflict is deferred, and the tree delivers a very
  well-organised way of ignoring things.

  The fourth scenario distinguishes a decision to wait from nobody having looked.
  Both leave the conflict outstanding; only one of them is a decision, and a reader
  triaging a hundred conflicts needs to know which is which.
