  contract: The step drawer section that lists the step's acceptance criteria.
it_requirements:
- The drawer lists one chip per id in the node's implements[], in stored order, each with that AC's title,
  and href '/atlas?ac=<id>' built by one helper.
- app/atlas/page.tsx reads searchParams.ac on the server and hands the initial selection to the Atlas
  explorer, so the criterion is selected with its detail open in the first render; the fix is on the Atlas
  page, not a click handler on the chip.
- 'components/atlas/atlas-explorer.tsx is 470 lines: an edit must leave it shorter than before (file-size
  ratchet); detail-drawer.tsx (364) must stay under 400.'
- An unknown ?ac= id must not throw; what the Atlas shows for it is an open owner decision.
- The chip is an ordinary link to another Atlas page; the Flows-history rule (no router navigation) applies
  to the Flows view's own entries only.
test_spec:
- name: the resolve drawer shows UXP-411 then UXP-411a with titles and /atlas?ac= hrefs
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: component
  angle: criterion
- name: /atlas?ac=UXP-411 renders UXP-411 selected with its detail open
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: integration
  angle: reachability
  surface_invoked: 'default export of leafcutter-web/app/atlas/page.tsx with searchParams {ac: ''UXP-411''}'
  must_catch:
  - the Atlas page ignores ?ac= and shows the component overview
- name: /atlas?ac=UXP-411a opened directly selects UXP-411a with its detail open
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: integration
  angle: criterion
  surface_invoked: 'default export of leafcutter-web/app/atlas/page.tsx with searchParams {ac: ''UXP-411a''}'
- name: an unknown ?ac= id renders the Atlas without throwing
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: integration
  angle: failure
  surface_invoked: 'default export of leafcutter-web/app/atlas/page.tsx with searchParams {ac: ''UXP-0000''}'
test_rationale: 'The route-level test is the proof the Atlas page honours ?ac=; a chip href test alone
  would pass with today''s ignored parameter. Tests are vitest under leafcutter-web/__tests__/, run host-side
  with `npx vitest run` (180 s timeout). Known gap: the build pipeline''s red-baseline and done-proof
  checks cannot read vitest tests yet, so build by direct phase dispatch with host-run vitest, as the
  UXP-591 epic was. No Playwright: the harness is deferred by the owner.'
test_required: true
