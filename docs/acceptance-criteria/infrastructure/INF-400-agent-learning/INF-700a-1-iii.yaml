title: "/quick-fix's own commit carries the files its routing step wrote, staged by name"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-1.yaml"
criteria: |
  Given /quick-fix has run its Knowledge Routing step inside its worktree,
    before its fix commit, and that step wrote learning text into one or more
    destination files inside that worktree,
  When the fix commit's agent is told which files to stage,
  Then each file the routing step wrote is named in that stage list, by path,
    after the acceptance criterion, its parent, the test and the fix,
  And nothing is staged by a sweep (no "git add -A" or "git add ."): only the
    named files, so unrelated build-output drift in the worktree stays out,
  And a path the routing step reports that is outside the worktree (absolute,
    or climbing out with ".."), that is the harvester's own bookkeeping under
    debugging/logs/, or that is already one of the four named files, is not
    added a second time,
  And a routing step that could not complete still has whatever it did write
    staged, because a written destination left uncommitted is lost when the
    worktree is removed,
  And when the routing step wrote nothing, did not run, or returned a reply
    whose case is not recognised, the stage list and the whole commit
    instruction are exactly what they were before this criterion existed.
depends_on: [INF-700a-1]
