criteria: |
  Given a request capped at two results and a session with a fixed cumulative content and deadline budget
  When additional candidates, neighbors or disclosure rounds would exceed a limit
  Then returned evidence stays within the enforced limits and is marked truncated or partial
  And omitted counts are given only when known
  And continuation consumes the same cumulative session budget
  And cancellation or deadline exhaustion stops further work and reports whether useful evidence was produced
