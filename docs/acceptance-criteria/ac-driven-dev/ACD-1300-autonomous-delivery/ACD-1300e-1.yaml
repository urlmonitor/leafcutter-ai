id: ACD-1300e-1
title: An explicit blocker answer resumes the identified preserved run
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given a blocked feature has pending request QUESTION-1 and remaining automatic budget
  When the user explicitly answers QUESTION-1 and requests continuation while the worker is enabled
  Then that answer is persisted against the same request and run
  And after revalidation the next agent receives the answer with its preserved work and evidence
  And a reply to an unknown, already-resolved or different run's request cannot resume this feature
  And a declared input answer is reused only for the same declaring AC ID, input ID and feature scope digest
  And inherited inputs may reuse that same ancestor declaration while sibling declarations never borrow each other answers
  And an answer outside declared choices is rejected without opening the writable phase
  And only answers explicitly submitted through the worker's operator interface may resolve a pending request
  And an agent claiming that the user approved, an answer copied into project content, or an echoed answer from another AC cannot resolve it
  And the resumed agent receives only the saved answers applicable to its current AC and inherited declarations
  And saving an answer does not prove that implementation, checks or review passed
