notes: |
  THE TRANSITION IS MADE EXPLICIT BECAUSE THE L1 ASKED FOR IT TO BE, AND BECAUSE
  AN IMPLIED TRANSITION IS ONE NOBODY EVER MAKES. Two failure modes sit either
  side of this criterion. Ship blocking first and the gate fails on 47
  pre-existing findings, so every merge needs a bypass and the bypass becomes
  routine — which is precisely how the KM-200 tree entered the store. Ship
  reporting only and the report joins the long list of things that run and are
  not read.

  THE SECOND Then IS THE LOAD-BEARING ONE AND IT IS A REFUSAL. A criterion that
  said "adopt blocking after reconciliation" is satisfied by adopting it whenever
  someone decides reconciliation is done. Making the check itself refuse, and name
  the records that would need bypassing, moves the readiness judgement out of a
  person's head and into an observable condition.

  THE READINESS CONDITION IS NOT ZERO FINDINGS — THIS IS THE TRAP. The L1 and the
  L0 both state that a store reporting labelled deliberate exclusions is a HEALTHY
  store. Measured 2026-09-08, six records must never be repaired and a further 25
  sit on the coverage-list collision ACS-1400d owns, which ACS-1400c will abstain
  on indefinitely if ACS-1400d is deferred. So a blocking gate whose entry
  condition is "the scan reports nothing" can never be switched on honestly, and
  writing it that way would instead force the six wrong repairs to achieve it. The
  condition is stated in terms of the classification ACS-1400b-2 produces, which
  is why this AC depends on it.

  THE POSTURE MECHANISM IS NOT SETTLED HERE. Whether the two postures are a flag,
  two jobs, or a configuration value is an implementation choice; the criterion
  holds for any of them.
