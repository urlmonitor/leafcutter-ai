assigned_agent: python-coder
estimated_complexity: L
package_surface: true
it_requirements:
  config_schema_fragment:
    hooks_manifest:
      type: object
      description: >-
        Each entry in hooks_manifest.hooks that names a real gate gains a `negative_control`
        object whose shape is COPIED FROM config/verification_flow.schema.json $defs/negative_control
        and is never re-invented: either {input, command (optional), expected_result, currently}
        or the {not_applicable: true, reason} alternative. `currently` is that schema's $defs/currently:
        {state in [passing, failing, blocked, unverified], observed (YYYY-MM-DD), evidence[] of
        {command, output}}. The entry also carries `entry_point`, defined there as "the real
        production way in that this check invokes (CLI, hook, workflow dispatch, deployed
        script). NOT an internal helper import". These are fields INSIDE existing entries, so
        they add no watched hooks_manifest id; the package-surface declaration on this record
        covers the liveness runner's own registration and any new TOP-LEVEL config section it
        needs, both of which ARE watched by _package_surface_registry.WATCHED_REGISTRIES (that
        registry watches commit_guardian.json on hooks_manifest.hooks by id AND on the document
        top level by mapping key).
  reference_file_path: "templates/scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - >-
      THE VALUE IS PRODUCED BY EXECUTION AND MAY COME FROM NOWHERE ELSE. No part of a check's
      record may be derived from its declaration. A well-formed declaration that has not been
      put through the check yields `unverified` — the schema's own honest placeholder for an
      attempt never made — however complete it is. The discriminator is the alter-and-revert
      pair: the declaration is held byte-identical while the check's behaviour changes, so no
      implementation that reads the declaration can pass.
    - >-
      THE ALTERATION MUST LAND IN THE COPY THE RUN LOADS, OR THE CLAUSE IS THEATRE. templates/
      scripts/commit_guardian/ is canonical; scripts/commit_guardian/ and .leafcutter/scripts/
      commit_guardian/ are build outputs. An alteration applied to a copy the run does not load
      fails GREEN — instance one of this same family, and GE-126c-5's subject. The test must
      state which copy it altered and which copy the run loaded, and assert they are the same.
    - >-
      HOST AND DEPLOYMENT. Put the runner and its helpers INSIDE templates/scripts/commit_guardian/,
      which build_commit_guardian copies verbatim, so no scripts/build_phases.py deploy-map
      entry is needed. Anything imported from OUTSIDE that directory MUST be added to that
      deploy map in the same change or the deployed runner raises ModuleNotFoundError at
      runtime while source-tree unit tests stay green. Note the naming consequence: hook_parity.hook_script_patterns
      is ["check_*.py", "run_hook.py", "regenerate_*.py"], so naming the runner check_*.py puts
      it into BP-1600a-2's census and it MUST then carry a hooks_manifest entry or a grounded
      declared-non-gate record. Decide the name deliberately and record the decision.
    - >-
      THE RUNNER MUST BE REACHED BY SOMETHING THAT ACTUALLY BLOCKS, AND THE TICKET MUST NAME IT.
      A runner whose refusal changes no gate's verdict is inert — that is KI-CG-021's shape
      exactly, a main() hardened over six review rounds that no runner called. Acceptable
      reaching surfaces, in order of preference: a hooks_manifest entry emitted onto an entry
      line; a job in .github/workflows/ci.yml; or a test module under unit_tests/ that ci.yml's
      existing `test` job already collects (`python -m pytest tests/ unit_tests/ -q`). Whichever
      is chosen must be named in the ticket AND demonstrated by the reachability descriptor
      below, which asserts the run's non-zero outcome propagating into that gate's own outcome.
      Registration in a config section that no entry line executes is not reaching — that is
      the trap KI-TQ-007 records, where configuration presence reads as evidence of registration.
    - >-
      OUT OF PROCESS, DEPLOYED LAYOUT, SOURCE TREE OFF THE IMPORT PATH. Extend GE-120c-1's
      harness (unit_tests/portability/) rather than growing a second one: it already builds a
      real second working copy, scrubs PYTHONPATH, runs the interpreter isolated, and keeps cwd
      off the source tree. Build the copy ONCE per sweep, never once per check, and mark the
      sweep slow rather than letting it quietly narrow its subject list to stay fast.
    - >-
      SEVERAL COMMIT-GUARDIAN HOOKS IGNORE argv AND READ THE GIT INDEX OR HOOK_TEST_FILES. For
      any check invoked through run_hook.py, the run must establish that the check actually SAW
      the known-bad input before reading its verdict. A clean exit from a check that was handed
      nothing is the never-attempted state wearing a pass, and recording it as `passing` is this
      whole tree's defect committed by its own tooling.
    - >-
      REUSE THE SCHEMA'S FOUR STATE VALUES VERBATIM — passing / failing / blocked / unverified.
      Do not mint synonyms, do not collapse `blocked` into `failing` (GE-120f-2-i forbids it),
      and do not omit the block for an unrun control: the schema already states that an unrun
      control records `unverified` "rather than omitting the block, so 'we never fed it bad
      input' is visible in the artifact instead of silent".
    - >-
      NO POPULATION FIGURE IN THE IMPLEMENTATION OR IN ANY TEST EXPECTATION. Every assertion is
      count-and-membership over the run's own emitted output. The parent records the count as
      disputed and forbids one below it.
    - >-
      AC_ENFORCE_STRICT=1 on every pytest invocation. Without it pytest_ac_enforcement
      xfail-masks these tests, all of which cover a not-done AC on the day they are written.
    - >-
      Error-handling policy applies to the runner's own subprocess, filesystem and JSON I/O:
      specific exceptions, logged at WARNING or higher or re-raised, never swallowed. A
      swallowed invocation error must never become an absent record or a silent `passing` —
      it is `blocked`, which GE-120f-2-i converts into a named, non-zero outcome.
test_spec:
  - name: test_ge120f1_record_moves_under_alter_and_revert_while_the_declaration_stays_byte_identical
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE DECISIVE ANTI-DECLARATION DESCRIPTOR — WRITE THIS ONE FIRST. Over a real built
      working copy, execute the runner as a process three times. Run 1: a fixture check whose
      declared input genuinely produces its declared rejection records the rejection observed.
      Run 2: alter the DEPLOYED copy the run loads so that input no longer produces that
      rejection, leaving the declaration byte-identical, and the record must read not-observed.
      Run 3: revert, change nothing else, and the record must read observed again. Assert the
      declaration bytes are identical across all three runs, and assert the altered file is the
      same path the run reported loading. No implementation that reads the declaration can pass
      this, because the declaration never changes.
  - name: test_ge120f1_never_attempted_and_observed_are_produced_in_one_run_over_the_same_surface
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE PAIRING — KEEP BOTH HALVES IN ONE INVOCATION. One run over a fixture registration
      surface holding (a) a check with a complete, well-formed declaration that the run is
      prevented from invoking, and (b) a check whose declared input genuinely produces its
      declared rejection. Assert in that same run that (a) records the attempt as never made
      and (b) records the rejection as observed. Split apart, (a) is satisfied by a runner that
      records never-attempted for everything. NAMED MUTATION (mandatory, run it): write the
      record from the declaration — treat a well-formed declaration naming an input and a
      rejection as the rejection having been observed. Under that injection (a) flips to
      observed; this descriptor must go RED naming that check, and return to green on revert.
  - name: test_ge120f1_a_check_added_to_the_registration_surface_gets_a_record_of_its_own
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Add one further declared check to a FIXTURE registration surface, change nothing else,
      and re-run: the new check has its own record, written from its own observation, and no
      existing record changes. Establishes the declaration population is read from the surface
      at run time rather than from a list inside the runner. Use a fixture surface, never a
      real check name, so the assertion does not expire the day that check is declared.
  - name: test_ge120f1_deployed_runner_and_every_module_it_imports_load_in_a_cold_process
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After `python scripts/build.py --target-dir <copy>`, the DEPLOYED runner and every module
      it imports load and execute in a cold process with the source tree off the import path
      (PYTHONPATH scrubbed, interpreter isolated, cwd not the source tree). A helper placed
      outside templates/scripts/commit_guardian/ without a scripts/build_phases.py deploy-map
      entry surfaces here as ModuleNotFoundError instead of passing. Invoke pytest with
      AC_ENFORCE_STRICT=1.
  - name: test_ge120f1_the_runs_refusal_changes_the_verdict_of_the_gate_that_invokes_it
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      the gate named in this AC's it_requirements — a hooks_manifest entry line invoked via
      python .leafcutter/scripts/commit_guardian/run_hook.py, or the ci.yml job that runs it
    description: >-
      PRODUCTION ENTRY POINT. Invoke the runner exactly the way the chosen gate invokes it and
      assert the GATE's own outcome moves: non-zero over a fixture population containing a
      check whose rejection was not observed, zero over one where every examined check
      demonstrated. A runner whose refusal does not change any gate's verdict is inert, which
      is KI-CG-021's shape and the reason this descriptor exists rather than a note.
  - name: test_ge120f1_every_check_on_the_real_registration_surface_receives_exactly_one_record
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Over the repository's REAL registration surface and the deployed copy: every check the
      surface names and that an entry line invokes has exactly one record, no check has two,
      every record's state is one of the schema's four values, and the run states per check
      which entry point the input travelled through. Assert by count-and-membership over the
      run's own emitted output — never against a hard-coded list of today's checks, which would
      pass while the next one escaped. Expect most records to read never-attempted on day one;
      that is the true state and must not be pre-suppressed.
test_rationale: |
  Every clause of this AC is green on arrival for one trivial reason — nothing is put through
  anything today and no record is written — so each absence-asserting clause carries an
  executable injection rather than a note asking a reviewer to check that the test is
  meaningful.

  The alter-and-revert descriptor is written first because it is the only one no
  declaration-reading implementation can pass: the declaration is held byte-identical while
  the behaviour changes, so the recorded value must MOVE. Its third assertion — that the file
  altered is the file the run reported loading — is not decoration; an alteration applied to a
  copy the run does not load fails GREEN, and that failure is indistinguishable from a pass.

  The pairing descriptor exists because "a check that was never fed anything records
  never-attempted" is satisfied by a runner that records never-attempted for everything. Asserting
  it in the same invocation as a check that genuinely demonstrated is what makes it non-vacuous,
  following ACS-1300a-3's pairing shape.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", no descriptor here may
  be satisfied by reading the runner's source or the declaration as text; a text assertion stays
  green on precisely the dead code being replaced. Every descriptor executes the runner as a
  process against the deployed layout, and the deployed descriptor runs the built copy so a
  missing deploy-map entry cannot hide behind a source-tree import. Every pytest invocation
  carries AC_ENFORCE_STRICT=1; without it these tests are xfail-masked and a green run means
  nothing.
delivers_to:
  - agent: python-coder
    ac_id: GE-120f-2
    contract: >-
      The per-check record written from observation — which of the four values, the entry
      point used, the declared input, and the declared rejection — from which GE-120f-2
      builds the named failing classes and the run's outcome.
expects_from:
  - ac_id: GE-126b-5
    contract: >-
      The per-check declaration of one known-bad input and its observable rejection, held
      where the check is registered, and the four-value vocabulary the record is written in.
      This record produces the value; GE-126b-5 defines what the values are and requires
      them to be carried and distinguishable.
  - ac_id: GE-126c-5
    contract: >-
      The statement of which copy the running process actually loaded. The alter-and-revert
      clause here is only evidence if the alteration reached the copy the run loads.
