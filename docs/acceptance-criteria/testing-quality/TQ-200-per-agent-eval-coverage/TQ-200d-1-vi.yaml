it_requirements:
  - >-
    Spec-key decision (IT PO): report_mentions (scripts/evals/produced_tests_scoring.py :152-156) gains one optional
    spec key 'also_accepts', a list of strings. The check passes when the report holds 'contains' or any 'also_accepts'
    term as a substring, ignoring case; the detail names the term found, or lists every term when none is found.
    A row without 'also_accepts' is scored exactly as today (same result, same detail text). No new kind is registered.
  - >-
    Row edits in scripts/evals/sets/test-writer.jsonl only: empty-window keeps contains 'non-NULL' and gains also_accepts
    ['non-None', 'non-`None`'] (case-insensitive substring, so 'non-null' is covered by 'non-NULL'); presence-is-not-correctness
    changes to contains 'known value' with also_accepts ['expected value', 'seeded value'] ('known expected value'
    is covered by 'expected value'). Every other report_mentions spec in test-writer.jsonl and test-runner.jsonl
    keeps its single 'contains' and no 'also_accepts' (the earlier lesson: a row needing new kind options must leave
    every other row's check exactly as before). A bare 'None' or 'NULL' ("returns None when the feed is empty")
    or a bare 'value' never passes.
  - >-
    Unit tests never call a live model; they score recorded outputs and probe fixtures only. Kept live outputs are
    copied by the test-writer from the kept-outputs folder of the 2026-11-02 runs (<session scratchpad>/kept_runs/run1|run2/<set>/<row>/,
    local to the run machine, as the known issue names it) into unit_tests/evals/fixtures/tq200d-rerun/<set>/<row>/run1|run2/
    as flat '<name>.py.recorded' files plus report.md (and transcript.jsonl where the row reads commands), the gold-output
    form place_outputs reads, so a bare pytest never collects them. Absolute local paths in a copied file (for example
    a sys.path line naming a user temp folder) are replaced with a neutral placeholder and nothing else is changed.
    No committed file names the scratchpad path. If another TQ-200d re-run AC has already created a needed fixture
    file, it is reused, not copied again. Probe fixtures for this AC: report.md of test-writer/empty-window/run1
    and run2 and of test-writer/presence-is-not-correctness/run1 and run2 (shared with TQ-200d-1-iv).
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched and does not grow;
    no new module is added at the top of scripts/evals/. unit_tests/evals/ is at its density cap, so this AC's tests
    go in their own subfolder (named in test_spec) with an __init__.py, like unit_tests/evals/tq200d1ii/. Tests
    go in unit_tests/evals/tq200d1vi/.
  - >-
    DOCUMENTATION (part of done) - the report_mentions entry on docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
    must state the 'also_accepts' spec key (Reads: 'Spec keys: contains, also_accepts'; Passes when: 'contains'
    or any 'also_accepts' term, ignoring case), that only the empty-window and presence-is-not-correctness rows
    use it, and update the examples: passing 'exact non-None count' on empty-window, failing 'returns None when
    the feed is empty'. Template sentence stays 'none'. Budget <= 8 added lines on the shared page.
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md produced-tests section gains one bullet: a report_mentions
    row may list equivalent wordings in 'also_accepts' (empty-window, presence-is-not-correctness); every other
    row checks its one term; link #report_mentions.
  - >-
    DOC-DRIFT TEST: the passing and failing example sentences on the entry score as stated against the empty-window
    row's spec read from test-writer.jsonl; the TQ-200d-1-ii drift tests stay green.
  - >-
    KNOWN ISSUE (shared with TQ-200d-4-vi): in docs/known-issues/testing-quality/open-low-ki-tq-20261102-test-writer-rows-check-unrequested-report-wording.md
    strike Mechanism parts 1 and 2 (empty-window, presence-is-not-correctness) with '~~...~~' and a note 'fixed
    by TQ-200d-1-vi (also_accepts), proving tests unit_tests/evals/tq200d1vi/', and add 'parts 1-2 fixed by TQ-200d-1-vi'
    to the Status line. Landing order: TQ-200d-4-vi depends on this AC, so normally TQ-200d-4-vi lands last and
    moves the file to resolved/ (resolved-low-ki-tq-20261102-test-writer-rows-check-unrequested-report-wording.md)
    naming both ACs. Only if this AC lands after TQ-200d-4-vi (its part 3 already struck) does this AC do the move:
    git mv to resolved/, Status 'RESOLVED <date> by TQ-200d-1-vi and TQ-200d-4-vi', register row to Resolved, Open/Resolved
    recounted from the directory.
  - >-
    CHANGELOG: one entry for TQ-200d-1-vi written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, in the same change as the code, naming the also_accepts spec key and the
    two widened rows (empty-window, presence-is-not-correctness).
  - >-
    GLOSSARY: any new term in the docs this AC writes reaches docs/glossary.md only through the check-glossary-coverage
    hook and the glossary-triage flow; no entry is added by hand (CLAUDE.md).
  - >-
    The six 2026-11-02 known issues landed on main with PR #1389 after this branch was cut; the build branch merges
