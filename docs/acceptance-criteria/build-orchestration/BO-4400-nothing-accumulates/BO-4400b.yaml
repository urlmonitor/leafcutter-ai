criteria: |
  Gone means gone -- including everything a workspace left outside its own folder.

  When a workspace is cleared, everything it brought into being elsewhere on the
  machine goes with it -- its line of work, its registration, its installed tools
  and its stored look-ups -- so space actually comes back instead of hiding elsewhere.
