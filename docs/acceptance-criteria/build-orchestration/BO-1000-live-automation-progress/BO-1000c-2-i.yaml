title: "On a mid-flight halt the last conversation line reflects the halting step, live"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the background finalize run halts partway through the sequence,
  When the user reads the main conversation,
  Then the most recent progress line surfaced into the conversation reflects the
    step that was underway when the run halted,
  And the user learns where the run stopped from the live conversation stream,
    not only from the terminal halt result returned at the end.
