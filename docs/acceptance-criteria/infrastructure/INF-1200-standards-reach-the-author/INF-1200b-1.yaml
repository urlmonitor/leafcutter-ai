notes: |
  THIS IS THE KEYSTONE RECORD OF THE KEYSTONE L1, AND IT IS THE ONE THE USER ACTUALLY
  ASKED FOR. Their words were "it must be easy to control these things from a single
  source of truth". They meant it operationally: one edit, one place. The example they
  gave — a limit for a kind of file the project does not currently cover at all — is
  exactly the previously-uncovered case this record is written around, and it is not
  covered by any of the other five L1s.

  THE TWO ARMS ARE INDEPENDENT AND BOTH ARE MANDATORY. The outcome arm ("the specialist
  is told") is satisfied by any number of implementations, including every hand-built
  one. The change-set arm ("and nothing else was touched") is the one carrying the
  criterion. A test that asserts only the first has not tested this record at all; a
  test that asserts only the second is satisfied by a one-line config edit that
  achieves nothing. They must be asserted against the SAME change.

  THE REPETITION ARM IS NOT PADDING. A single covering exercise can be made to work by
  a special case. The property the user wants is that the SECOND one costs the same as
  the first, and the tenth the same as the second. Stating it as a repeated exercise
  over two different kinds of file with two different owners is the cheapest form in
  which "does not grow" is observable.

  HOW THE CHANGE SET IS MEASURED, STATED SO IT IS NOT MEASURED THE EASY WAY. It is the
  set of tracked files whose content differs between the state before the statement was
  made and the state after the outcome holds — the whole project, including generated
  and compiled material, minus whatever the project's own build legitimately
  regenerates from the declaration. That subtraction is the crux and it must be stated
  explicitly at enrichment: compiled briefs changing is the point of the feature;
  authored instructions changing is the defect. If the two cannot be told apart in a
  given design, that is itself a finding about the design and should be raised rather
  than papered over by widening the exclusion list until the arm passes.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: alongside the single declaration, also add a reference to the new standard
  in the owning specialist's own authored instructions — a named placeholder for that
  kind of file's standard, filled in from the declaration at build time. This is
  today's shipped design generalised, and it is the design a competent implementer
  arrives at first. Under that injection:
    - the outcome arm must STAY GREEN, because the specialist is correctly and
      faithfully informed;
    - the change-set arm must go RED, because a specialist's own instructions were
      edited to cover a kind of file;
    - the repetition arm must go RED for the same reason on the second kind of file.
  All three outcomes must be observed together and all three must revert. An injection
  run that reddens the outcome arm as well means the arms are not independent and the
  record has not been proved — the whole point is that this mutation produces a world
  in which the specialist is RIGHT and the promise is still broken.

  MEASURED, 2026-09-09, IN THIS WORKTREE, AND IT IS THE WHOLE ARGUMENT. Carrying a
  declared standard outward is a purpose-written step per value; naming it is a hand
  edit per specialist. Two such steps exist for two unrelated values. Nothing walks the
  standards declaration and nothing walks the ownership record, although both are
  machine-readable and both are on disk.

  DELIBERATELY NOT NAMED IN THE CRITERIA: any kind of file, any specialist, any figure,
  and any path. The user's example is a config edit once this record lands, not a
  criterion.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The
  mutation above, including which arm must stay green, is written to be turned directly
  into test descriptors.
