notes: |
  This is the criterion that makes BO-2400c-1 true rather than merely implemented. The
  parent promises that the prompt a fast-lane agent receives is laid out stable-first
  with a cache breakpoint. Today no fast-lane invocation has ever assembled a prompt that
  way: the layer is pure, tested and documented, its only production reference is a call
  from an orphaned runner that cannot reach it, and the live lane does not mention it.

  The load-bearing word is CONSUMPTION. An acceptance criterion satisfied by "the
  workflow refers to the layer" is worth nothing here — that is literally the state we
  are in, and it is the state that read as done. The only observable that distinguishes
  a wired lane from an unwired one is the text a dispatched agent actually received,
  which is why every covering test runs the lane and reads the recorded prompts.

  The silent-fallback clause exists because that is how this would regress invisibly. If
  the assembly fails and the lane simply builds its prompts the old way, the run still
  succeeds, the tests still pass, and the layer is gone again with no signal. A lane that
  cannot assemble its context must say so.

  AMENDMENT CONTEXT, 2026-08-25. The three-scenario shape is not tidiness. Before the
  amendment there were two states — obtained and not obtained — and the run that failed
  was in a third: obtained, well-formed, and unusable, because what crossed the boundary
  was a description of the bundle rather than the bundle. Collapsing that third state
  into "not obtained" is what produced a halt message contradicting its own attached
  evidence, and it is what would have sent an operator looking for an assembly bug that
  did not exist. The assembling agent was not evasive; it said plainly what it had done
  and where the content was. It answered a different question than the schema asked, and
  the schema was asking for something no agent reliably delivers at that size. The size
  is fixed in BO-2400c-1-vi; this record makes the boundary honest about what it will
  accept and clear about what it saw.

  ENRICHMENT NOTE, it-po, 2026-08-25 — ORDERING BETWEEN THE TWO BRANCHES. Reference
  rejection must be evaluated BEFORE the breakpoint-marker check, not after. Evaluated
  after, a locator that happens to contain the marker substring is classified as
  incomplete content, and the two states the amendment exists to separate collapse back
  into one. This is stated as a constraint rather than left to the implementer because
  the natural reading order of the existing gate (fast-lane-ship.js:490-498) puts the
  marker check last and invites appending the new test after it.

  ENRICHMENT NOTE — WHAT THIS RECORD DOES NOT COVER, so it is not discovered late. The
  bundle is currently 148,891 bytes of which 129,178 are a second copy of content the
  receiving agent already holds. This record refuses a pointer; it does not make the
  payload small. If BO-2400c-1-vi is not built, a correct implementation of this record
  produces a lane that halts every time on a real target — correctly, loudly, and
  uselessly. Build the two together, or expect that outcome and do not respond to it by
  weakening the refusal.
