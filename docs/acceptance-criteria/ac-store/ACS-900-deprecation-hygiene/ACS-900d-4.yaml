it_requirements:
  - "Exactly ONE definition of the 'is this record retired' predicate may exist. A record is retired when, and only when: its status is 'superseded_by' or 'superseded'; AND its superseded_by value (accept both the scalar-string and the list form, per ac-schema.md) is non-empty; AND every successor id names a record present in the WHOLE AC store (not only the staged set); AND no successor id equals the record's own id. status 'deprecated' is NEVER retired by this predicate, whether or not superseded_by is set (user decision 1). req_status is not an input."
  - "The predicate must live under scripts/ac_store/ so both the done-proof family and the commit_guardian hooks can import it (commit_guardian reaches ac_store via _ac_store_locator.ensure_ac_store_on_syspath). It must be pure: no file or git I/O inside it. The caller supplies the record mapping and the set of store ids."
  - "The existing is_superseded_ac() in scripts/ac_store/_done_proof_composite.py (KI-ACS-016: 'superseded_by non-empty OR req_status == superseded') must be replaced by, or delegate to, the shared predicate. No second definition may remain. Its call sites that must move to the shared predicate are _done_proof_composite._unproven_composite_children (pre-commit composite rollup) and done_proof._resolve_all_child_ids (CI composite rollup)."
  - "Forward-build call sites that must consult the predicate BEFORE applying their rule, so a retired record is skipped, with its own work_status never re-evaluated. In templates/scripts/commit_guardian/check_done_proof.py: check_staged_done_proofs (pre-commit covers-tag presence), check_changed_done_acs and check_all_done_acs (CI Proof-of-done). In scripts/ac_store/done_proof.py: verify_done_eligible and _verify_composite_eligible (also reached by mark_ac_done.py). The test-contract rule is owned by ACS-900d-4-i and the composite-children rollup by ACS-900d-4-iv. Both must use this same predicate."
  - "The CI path builds its view from _done_proof_phase_helpers._build_ac_status_map. Every field the predicate reads (status, superseded_by, id) must be present in each status-map entry, so the CI and pre-commit paths cannot reach different verdicts about the same record."
  - "Successor existence needs the set of all store ids. It must be computed at most once per hook or CI invocation and reused for every record. Do not walk the store again for each record or each successor. A hook run on a 10-record staged set must not get noticeably slower than it is on main."
  - "The gates must never write to the retired record. work_status, readiness, change_target, test_spec and test_required stay byte-identical to what was staged. The exemption is a read-side decision only."
  - "Discrimination is mandatory. A status-active twin with superseded_by null must still be refused by check-done-proof with the existing reason string. A status-deprecated record with no successor must also still be refused (user decision 1). An implementation that skips done-proof for every record, or for every non-active record, must fail this AC's tests."
  - "Contract change to KI-ACS-016: the new predicate is stricter. It needs a superseded status and existing successors, and it ignores req_status. Before merge, run a store-wide census of every composite whose verdict changes between the old is_superseded_ac and the new predicate, and list every flipped id in the PR. The fixtures in unit_tests/commit_guardian/test_ki_acs_016_superseded_child.py that rely on req_status 'superseded' or on the nonexistent successor BO-9999 must be rewritten to the new retired shape. Do not delete or soften them."
  - "Any new module imported by a commit_guardian hook must be added to the build_ac_store deploy list in scripts/build_phases.py in the same change. Verify by running the DEPLOYED hook after build.py, not only the unit tests (CLAUDE.md: New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest)."
  - "Template and deployed copies of every touched commit_guardian hook must stay in parity (ADR-001). Error handling follows the project error-handling policy. An unreadable successor record makes the predicate return not-retired, so the gate fails closed and never fails open."
delivers_to:
  agent: python-coder
  contract: "One shared, pure 'is this record retired' predicate under scripts/ac_store/. Input: a parsed AC record mapping or a _build_ac_status_map entry with keys id (str), status (str), superseded_by (str | list[str] | null), plus a set[str] of every AC id in the store. Output: bool. True only when status is in {superseded_by, superseded}, superseded_by is non-empty, every successor id is in the store-id set, and no successor equals the record's own id. Consumed by check_done_proof.py, done_proof.py, _done_proof_composite.py (composite rollup) and _ac_schema_validators.validate_test_contract (via check_ac_schema.py)."
expects_from: null
