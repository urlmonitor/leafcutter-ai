created: 2026-06-24
amended_by:
  - action: technical-amendment
    agent: it-po
    date: '2026-09-28'
    reason: "Corrected the first it_requirement, which claimed the behaviour was already shipped via _EXTERNAL_CALLERS. On origin/main 2c000a9e that is a closed literal set {user, finalize-feature.js} in both registry_validator.py and check_agent_spawn_consistency.py, so fast-lane-ship.js and every other workflow are rejected (command-step-runner had to ship with spawned_by [user]). Marked the work as new, defined the recognised-external-caller rule (literal 'user' or a real workflow file in templates/workflows-js/), named the authoritative workflow set, required one shared definition across both checks, and added the missing test contract. Complexity S -> M. Criteria, title, depends_on and req_status unchanged."
