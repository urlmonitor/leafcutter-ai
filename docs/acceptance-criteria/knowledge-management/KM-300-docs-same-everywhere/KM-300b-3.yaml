notes: |
  Cross-OS extension of KM-DBF-014, which proves byte identity on ONE machine
  (done). This AC is the round-trip across hosts and checkouts. The fresh-clone
  condition is deliberate: KM-DBF-014's notes say per-doc dates must never come
  from the wall clock — a date taken from file modification time would pass
  KM-DBF-014 on one machine yet differ on every fresh clone.

  KM-DBF-014 adoption: the KM-300 L0 note suggests re-parenting KM-DBF-014
  under KM-300b. Not done by this BA run: KM-DBF-014 lives outside this feature
  folder (out of this run's write scope), and its compound KM-DBF prefix
  derives to parent "KM-DBF", so it would need an explicit `parent: KM-300b`
  field plus depends_on/covered_by. KM-DBF-014 is referenced here via
  depends_on instead.
