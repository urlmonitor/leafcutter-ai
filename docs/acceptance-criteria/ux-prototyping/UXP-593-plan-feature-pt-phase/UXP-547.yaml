id: UXP-547
components:
  - ux-prototyping
title: "An approved flow is handed to the business-analyst to derive ACs, forcing BA in when the route skipped it"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given the product-truth phase produced and committed a flow,
  When the AC pipeline reaches the decomposition stage,
  Then the flow (and its regenerated index.json) is committed before the
  business-analyst stage so the BA can self-discover it via index.json,
  And the BA is given a flow-derivation instruction,
  And when the triage route is technical (which normally skips the BA) but a flow was
  produced, the BA stage is forced in with an L1 anchor so the derived L2s are not
  orphaned,
  And when no flow was produced the BA runs normally per the triage route.
depends_on:
  - UXP-593
