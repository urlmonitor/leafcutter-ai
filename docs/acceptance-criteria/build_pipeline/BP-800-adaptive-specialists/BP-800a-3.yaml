title: "Database technology detection from connection strings and driver dependencies"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project with:
    - pyproject.toml listing "neo4j" in dependencies
    - package.json listing "mongodb" in dependencies
    - pyproject.toml listing "psycopg2" in dependencies
  When the technology detector scans the project at build time
  Then it reports detected databases: ["neo4j", "mongodb", "postgresql"]
  And each database is categorized by paradigm: neo4j -> "graph", mongodb -> "document", postgresql -> "relational"
  And the detection source is recorded for each (dependency manifest path and package name)
