criteria: |
  Given the reference page for the context-bundle assembler is the page a reader consults
    before calling it or changing it,
  And that page currently states a parameter count, a required-parameter count, a
    signature, a parameter table, an ordering contract, a return-value expression and
    three worked examples,
  When the page is read against the function as it actually exists,
  Then every one of those statements matches the function — the parameter count, which
    parameters are required, the order the layers are assembled in, and what the return
    value is composed of,
  And no worked example on the page passes an argument the function would reject, so a
    reader who copies an example gets a call that runs.

  Given the two layers the assembler no longer carries were removed rather than made
    optional, because an optional layer leaves a live path by which the largest duplicate
    in the payload is reintroduced by a caller who does not know better,
  When the page explains the layer set,
  Then it records that those two layers were removed and why the receiving agent does not
    need them — the conventions text is already injected into every agent dispatched into
    the workspace, and the acceptance-criteria records sit in the run's own workspace where
    that agent can open them,
  And it states that each context-carrying dispatch instead instructs its agent to read
    those records from the store, so a reader who notices the layers are gone can tell
    the content was RELOCATED rather than dropped,
  And a reader who is deciding whether to add a layer can find the rule that decides it:
    the bundle carries only what the receiving agent does not otherwise have.

  Given the page also documents a cache TTL as a knob configured in the API or harness
    layer, and attributes that knob to an acceptance criterion,
  And no such knob exists — verified 2026-08-18 and again 2026-08-26, the string
    cache_control appears nowhere in scripts, templates or config; the breakpoint marker
    is a literal HTML comment inside a prompt string, a textual convention; and leafcutter
    never issues the model API call, so there is no request on which a TTL could be set,
  And the criterion it cites was re-specified away from configuration to measurement,
  When the page describes anything about caching,
  Then it does not describe a knob that cannot be set, and does not attribute a claim to
    an acceptance criterion that no longer makes it,
  And where the page describes the stable prefix, it distinguishes the property the
    function actually guarantees — that the prefix is byte-identical across calls with
    unchanged stable inputs — from the provider-side cache hit that property was HOPED to
    enable and which nothing in this system observes,
  And a reader cannot come away believing leafcutter configures, primes, or measures a
    provider cache.

  Given a reference page whose statements about a function can drift the moment that
    function changes,
  When this page is corrected,
  Then the correction names the specific record that changed the layer set, so the next
    reader can find the reasoning rather than only the outcome,
  And the page's own last_updated metadata reflects the date of the correction rather
    than the date the now-wrong text was written.
