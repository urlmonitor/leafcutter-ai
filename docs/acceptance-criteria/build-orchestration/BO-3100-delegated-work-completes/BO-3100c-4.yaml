it_requirements:
  - "THE BUILD MUST BE INDEPENDENT OF THE SETTING IN BOTH DIRECTIONS: correct when it is forced on, correct when it is absent. Independence is the requirement — not 'always set it to foreground', which is a rule someone has to remember and is the prompt-level form this tree rejects."
  - "NO CODE PATH MAY PASS THE OPTION UNCONDITIONALLY. If the option is selected at all it must be selected defensively, so its absence is not an error. Passing an unknown option to a harness that has removed it is the failure that takes out every drive at once, and it is worse than the silent behaviour change it was meant to avoid."
  - "The removed-option environment must be simulated by actually withholding the option from the dispatch surface the workflow calls — not by a flag the workflow reads. A flag tests the branch the author wrote; withholding tests what the harness will actually do."
  - "The outcome comparison across the three environments must be made on the workflow's TERMINAL RETURN PAYLOAD, the value a caller branches on — not only on log text. Same outcome means the same machine-readable result, step for step."
  - "This AC must not be satisfied by pinning a harness version or by asserting a version threshold. KI-SS-001 records the version threshold as second-hand and unverified; the direction of travel is what is being defended against."
  - "Coverage must run under unit_tests/_workflow_engine_harness.py so the three environments can be produced by varying the mocked dispatch surface rather than by requiring a real harness of each vintage."
delivers_to: null
expects_from:
  - ac_id: BO-3100c-1
    contract: "The coordinating layer's dispatch path and its per-dispatch record, including result_held_before_continuing — the field this AC asserts stays true in all three environments."
test_spec:
  - name: test_bo_3100c_4_background_forced_on_still_holds_every_result
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "Drive the real workflow with background dispatch forced on; assert every dispatch record has result_held_before_continuing true and the terminal payload matches the foreground run step for step."
  - name: test_bo_3100c_4_option_removed_entirely_produces_the_same_outcome
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "THE EXPIRY TEST. Withhold the foreground/background option from the mocked dispatch surface altogether; assert the workflow completes with the same terminal payload and that no step is reported complete without its result having been held."
  - name: test_bo_3100c_4_selecting_a_removed_option_does_not_fail_the_build
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "With the option absent, exercise any path that attempts to select a dispatch mode and assert the build does not fail because of its absence. Guards the other half of the trap: code that passes the option explicitly takes out every drive the day it disappears."
  - name: test_bo_3100c_4_three_environments_agree_on_the_terminal_payload
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "Run the same build in all three environments (off, forced on, option absent) and assert the terminal return payloads are equal. Asserting on the payload rather than on logs is what makes 'the same outcome' mean the value a caller branches on."
test_rationale: |
  This AC defends against a change that has not happened yet, so it cannot be covered by running
  against the current harness. The only workable shape is to vary the mocked dispatch surface —
  which is exactly what unit_tests/_workflow_engine_harness.py is for — and assert the workflow
  behaves identically across all three states.
  Simulating the removal with a flag the workflow reads would be worthless: it would exercise
  the branch the author wrote rather than the situation the harness will create. Withholding the
  option from the surface is what reproduces the real event.
  Comparing terminal payloads rather than logs matters because this repository has repeatedly hit
  reports that read correctly while the machine-readable outcome said something else.
