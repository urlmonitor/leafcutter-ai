test_rationale: |
  CORRECTED FROM AN EARLIER JUDGEMENT ON THIS RECORD, and the correction is worth stating
  because the first answer was wrong in an instructive way.

  This record was first authored test_required: false, on the argument that the only
  mechanically checkable claim — that the worked examples run — was already covered by the
  real-subprocess tests in unit_tests/workflows/test_bo2400c1vi_bundle_layer_set.py. That
  conflated two different subjects. Those tests constrain the CODE. Nothing in them looks
  at the PAGE, so every one of them stays green while the page describes a signature the
  code does not have — which is precisely the situation that produced this record.

  Executing the page's own examples is not grep-shaped evidence and does not share the
  weakness that made a test look pointless. A test asserting the string "conventions" is
  absent from the page passes the moment somebody deletes a word, and is equally satisfied
  by a page with no examples at all. Executing them cannot be satisfied either way: an
  example that passes a removed parameter raises TypeError, and an example that drifts from
  the signature in any other direction raises too. The subject under test is the document,
  the assertion is on real behaviour, and the failure mode is the real one — a reader
  copying an example and getting an exception.

  Verified as a genuine red baseline rather than assumed: with the corrected page stashed
  and the pre-fix page restored, the suite reports 4 failed / 1 passed, each failure the
  TypeError on conventions=. The one test that stays green in that state is the
  example-count guard, which is correct — the old page did carry three examples; they were
  simply wrong.

  What remains outside any assertion is unchanged and still true: whether the removal reads
  as a relocation rather than a loss, whether the membership rule is discoverable, and
  whether the caching text separates a guaranteed property from an unobserved benefit are
  judgements settled by review, not by a test. The tests here cover the part a machine can
  settle honestly, and the review covers the rest — rather than the earlier all-or-nothing
  conclusion that because some of it could not be tested, none of it should be.
