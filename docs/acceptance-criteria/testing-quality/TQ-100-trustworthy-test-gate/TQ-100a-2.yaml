assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE MECHANISM IS FOUR ENVIRONMENT VARIABLES, SET WHERE THE SUBPROCESS
    ENVIRONMENT IS ALREADY CENTRALISED. Both offending files already merge a
    single overrides dict into every git subprocess call
    (unit_tests/portability/test_ge_120e_1.py:167-169 and
    unit_tests/portability/test_ge_120e_1_i.py:199-201). Add GIT_AUTHOR_NAME,
    GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME and GIT_COMMITTER_EMAIL there, and
    delete the five `git config user.*` pairs — test_ge_120e_1.py:234, :300,
    :344, :543 and test_ge_120e_1_i.py:270. Each of those five is preceded by a
    `git worktree add --detach ... cwd=_REPO_ROOT`, which is what makes the write
    land on the host. Verified in a scratch repo: with all four variables set and
    no configured identity anywhere, `git commit` succeeds, produces the intended
    author AND committer, and writes nothing to any configuration file.
  - >-
    ALL FOUR VARIABLES ARE REQUIRED — TWO IS THE FAILURE THAT PASSES LOCALLY.
    Setting only GIT_AUTHOR_NAME/GIT_AUTHOR_EMAIL leaves the committer to fall
    back to configuration. On a developer machine a global identity exists, so
    the commit succeeds and the test is green; on a fresh CI checkout there is no
    identity at all and git aborts. That is a difference that only shows up in
    the required job, which is the most expensive place to find it.
  - >-
    THE WORKTREE-CONFIG EXTENSION IS NOT A MITIGATION AND MUST NOT BE TREATED AS
    ONE. `extensions.worktreeConfig` is ALREADY true in this clone. Measured with
    it enabled: a plain `git config user.email` issued inside a linked worktree
    still overwrote the host's shared configuration. The extension only makes the
    explicitly `--worktree`-qualified form legal; it does not redirect unqualified
    writes. Any reasoning of the form "the extension is on, so we are covered" is
    false. See TQ-100a-2-ii for why the qualified form is refused outright.
  - >-
    REJECTED — PER-INVOCATION `git -c user.name=... -c user.email=... commit`.
    Safe by construction and cannot outlive the process, but it must be repeated
    at 9+ call sites, and an omission fails SILENTLY: the invocation falls back to
    the ambient identity and still succeeds, so nothing in the run objects. The
    environment-variable form is set once per file and covers every call that
    inherits it.
  - >-
    REJECTED — TEARDOWN-RESTORE. Unsetting or restoring the keys in teardown is
    defeated by a crashed run, an interrupted run, and `pytest -x`; a teardown
    that must run correctly is precisely the thing that already failed here. It is
    additionally wrong for this workspace, where 80+ worktrees and parallel agents
    share the one configuration file: even a teardown that does run leaves a
    window in which every concurrent commit is misattributed.
  - >-
    THE CONSEQUENCE IS LOCAL, NOT CI. CI checks out a throwaway clone, so the
    pollution dies with the runner. The damage is to the developer's own machine
    and propagates across the whole worktree family through the shared
    configuration — 81 commits are already misattributed. Do not write the change
    up as a CI risk; it is not one.
  - >-
    BOTH TARGET FILES ARE SINGLE-COPY. Verified: neither has a counterpart under
    templates/, and build.py deploys no conftest.py. The templates-versus-build-
    output trap — fixing the deployed copy while the source copy keeps
    regenerating it — does not apply here, so the edit is final where it is made.
delivers_to:
