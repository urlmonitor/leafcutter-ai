notes: |
  ORIGIN. The user, 2026-10-09: "and same for the tmp files. we need clear ACs that provide
  scripts that clean-up when something finishes - latest when opening the PR (finalize
  feature is used too rarely)". Deliverable is ACs that require concrete cleanup scripts,
  not guidance -- same "enforcement by construction" framing as BO-4100 / BO-4300.

  WHY A NEW L0 AND NOT BO-4300g. BO-4300 has six L1s, so one more child would fit the cap,
  but the request is six distinct benefits (when each route cleans up, what "gone" means
  across the machine, environments that die with the workspace, a recurring sweep, a
  disk-pressure guard, temporary files). Folding them into one L1 would give BO-4300g far
  more than its own child cap. BO-4300 promises ONE DOOR for making, finding and clearing;
  BO-4400 promises that the door is actually USED, on time, by every route, and that the
  clear is complete. Rule for future requests: "how a workspace is cleared safely" ->
  BO-4300e; "that it IS cleared, when, and that nothing is left" -> BO-4400.

  CAPABILITIES USED, NOT RE-DERIVED: BO-4300e (the central clear: no prompt, refusal while
  unsent work, up-front authorisation), BO-4100c (holds-work / holds-nothing verdict incl.
  BO-4100c-1-i squash-merge detection), BO-4100e (complete listing incl. unregistered
  leftovers), BO-4300c-1-iii (a build restores tracked files it changes, so a finished
  workspace does not falsely read as holding work), BO-4300e-4 (comparison workspaces),
  BO-1800d (housekeeping never disturbs work in flight), TQ-600b-2 (each test gets its own
  scratch location -- BO-4400f adds the home/expiry rule, not uniqueness), ACD-2100c-5
  (halted runs keep their work). All of these are todo/unbuilt as of 2026-10-09; the BA
  must sequence BO-4400 children behind them via depends_on rather than restating them.

  KEY FRAMING DECISION. The cleanup point is the moment the work is up for review (pull
  request opened = work pushed = nothing unsent), NOT finalize-feature, which runs too
  rarely. Finalize may still clear, but no route may rely on it.

  DECIDED 2026-10-09 by BrainCandy (resolves BO-4300 Q8): clearing a workspace whose
  verdict is "holds nothing unsent" (BO-4100c) needs NO caller-supplied confirmation
  token -- the verdict is the safety check. Up-front permission (BO-4300e-3) is required
  only to discard unsent work. BO-4400a's automatic end-of-run clear relies on this.
