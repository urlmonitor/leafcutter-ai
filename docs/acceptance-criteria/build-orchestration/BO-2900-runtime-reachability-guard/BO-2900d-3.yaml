risk_surface: internal
notes: |
  Two ways an exemption silently grows beyond what anyone approved. Both are about
  scope, so they share one AC; neither is an edge case of the other.

  - BREADTH. The pressure to widen an exemption is constant and reasonable-sounding:
    the second helper is just like the first, so cover the folder. A folder-shaped
    exemption is an unbounded promise about code that does not exist yet — every future
    file dropped there is exempt by default, and nobody records a reason for it. The
    sibling scenario makes narrowness testable, and it is the exact fixture a
    convention-based implementation of BO-2900d-1 also fails.

  - TIME. A stale exemption is worse than a broad one because it is invisible: it sits
    in the list, inflates the count that BO-2900d-2 reports, and gives a reviewer the
    impression the set is under control. The name-reuse clause is the sharp end of it —
    an exemption written for a helper that was deleted two years ago silently exempts a
    brand-new unit that happens to reuse the name, and no human decision was ever made
    about that unit. Reporting stale entries turns exemption cleanup into ordinary
    maintenance rather than an archaeology project.

  DELIBERATELY NOT SPECIFIED: whether a stale exemption refuses the change or only
  reports. Both readings are defensible — refusing keeps the list clean, reporting
  avoids blocking an unrelated author for someone else's dead entry — and the choice
  belongs with the IT PO alongside the enforcement surface. What this AC does fix is
  that it must be SAID and must not be counted as in force, so it cannot rot unseen
  either way.

  Verification must EXECUTE the guard over both fixture pairs (exempted unit beside a
  non-exempted sibling; an exemption naming a unit that has been removed).

  2026-08-13 — IT PO DECISION 2 OF 2: DOES A STALE EXEMPTION REFUSE OR ONLY REPORT?

  DECISION: REPORT ONLY. A stale entry never causes a non-zero exit on its own.

  Rationale:
    1. A stale entry is already FAIL-SAFE, not fail-open. Because it matches no item it
       grants nothing, and because BO-2900d-2 excludes it from total_in_force it cannot
       inflate the reviewable count. The security property the criteria care about is
       carried entirely by the not-counted rule; refusing adds no protection.
    2. It would block the WRONG PERSON. A stale entry is created by the author who
       deleted the unit and encountered by whoever commits next. Blocking an unrelated
       change for somebody else's dead record is the documented mechanism by which
       guards get switched off — the same adoption risk BO-2900b-1-i exists to prevent,
       and the dominant risk in this tree.
    3. It is a DIFFERENT CONDITION from BO-2900c-4's fail-closed case, and the contrast
       is deliberate: there the guard cannot establish its own preconditions, so silence
       would be a false pass. Here the guard's verdict is fully established and correct;
       only a bookkeeping record is dead. Fail-closed applies to unknowable state, not
       to untidy state.
    4. Visibility is preserved without refusal: the stale section appears on EVERY run
       via BO-2900d-2's always-on inventory, so cleanup is ordinary maintenance rather
       than an archaeology project — which is exactly what this AC's own notes ask for.

  RATCHET LEFT OPEN: once the stale backlog is at zero, a follow-up AC may promote
  stale-report to stale-refuse, or refuse only when the change under check TOUCHES the
  registry file. Both are cheap on top of this implementation; neither is in scope here.
