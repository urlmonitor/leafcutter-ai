criteria: |
  As a person defining a feature, the draft I review (a flow, its mock data, and its mockups)
  is produced by a set of product-truth authoring agents — a classifier, a mock-data agent,
  a mockup agent, and a flow agent — and only the agents the classifier says the request needs
  are run, so a single-screen tweak does not spin up a whole journey and a backend job does not
  draft a screen. None of these agents exist yet; this family tracks the work to build them.
