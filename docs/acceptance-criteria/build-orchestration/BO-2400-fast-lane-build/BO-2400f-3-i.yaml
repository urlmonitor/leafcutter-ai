notes: |
  Observed twice on 2026-09-14, both runs aiming the lane at INF-1300. The run
  reported its worktree as /mnt/c/Users/henzeh/Documents/Scripts/leafcutter/
  leafcutter-ai -- a second, stale clone of this same repository on the Windows
  mount -- and died at the resolve phase looking for fast_lane.py there. The
  worktree phase had in fact created the correct worktree, on the correct branch,
  in the right place; only the reported location was wrong.

  WHY THE EXISTING GUARD DID NOT CATCH IT. The guard added on 2026-09-07 for
  BO-2400f-3 runs `git worktree list --porcelain` through a sub-agent and then
  checks that the reported path appears in the raw output supplied alongside it.
  That proves the agent quoted from some git invocation. It does not prove the
  invocation ran in the repository the run is operating in, and an answer is only
  evidence about the repository it came from.

  The stale clone holds no fast-lane branches, so the probe running there found no
  record and returned the contract's empty result. The workflow then took its
  documented fallback -- git said nothing, so trust the claim -- and the claim was
  the wrong path. The wrong-repository case is therefore the one case this guard
  structurally cannot catch: the probe fails to contradict the claim because it was
  looking somewhere the claim could not be contradicted, and the fallback exists to
  forgive exactly that silence.

  WHY NARROWING RATHER THAN REMOVING. The fallback's stated reason is that an
  unanswered probe is not evidence of fabrication and halting on every hiccuping
  dispatch is the worse failure. That reasoning holds. What does not hold is
  treating "the answer does not mention the branch I created a moment ago" as the
  same thing as "no answer". The run knows it created that branch; an answer
  omitting it is information, not silence.

  Falsifiability. Five descriptors over one harness, of which two are opposed: an
  answer empty of this run's branch must halt, and no answer at all must still fall
  back. A fix that cannot tell those apart fails one of them whichever way it
  errs, so neither "halt on anything imperfect" nor "change nothing" can pass.

  Related and deliberately not folded in: the enabling condition is that a second
  clone of this repository exists on the Windows mount and agents can reach it.
  Removing it is an environment decision for the operator, not a code change, and
  the guard should hold with or without it.
