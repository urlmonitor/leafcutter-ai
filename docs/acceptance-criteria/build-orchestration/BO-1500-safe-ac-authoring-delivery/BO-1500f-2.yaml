id: BO-1500f-2
components:
  - build_orchestration
readiness: draft
priority: high
title: "Every authoring run gets a workspace no other run can resolve to while it is running"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given two authoring runs are started for the same component, on the same day, from the
    same request wording,
  When each run obtains its isolated authoring workspace,
  Then each run obtains a workspace that no other run resolves to for as long as that run
    is still going,
  And the two runs never share one workspace or one line of work,
  And neither run's acceptance-criteria files ever appear inside the other run's workspace,
  And a third run started while both are still going obtains a workspace distinct from both,
  And each run states, in the output the user sees, which workspace it obtained, so a person
    with several runs open can tell them apart,
  And the run that resumes after being interrupted resolves back to the same workspace it
    obtained the first time, rather than to a new one.
depends_on:
  - BO-1500f
  - BO-1500a-1
