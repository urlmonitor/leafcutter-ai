it_requirements:
  - "Edit the three authoring-agent templates (templates/agents/product-owner.md, templates/agents/business-analyst.md, templates/agents/it-po.md) so each instructs the agent to emit a non-empty, registry-valid `components` LIST on every AC it authors or enriches. This is the emission counterpart to the KM-KGS-100e-4 audit (which only reports violations) and the KM-KGS-100e-1 gate (which only blocks at commit)."
  - "SPEC PARITY (a markdown template cannot import the Python predicate): state the required-field rule once normatively in docs/reference/ac-schema.md, and have the template prose reference/mirror it rather than restating divergent wording. The field the templates name MUST be the LIST `components` that the graph's component_membership edge reads (config/paths.json acs surface edge_fields) — not the scalar `component`."
  - "ADR-001 template/deployed parity: templates/agents/*.md are the package source; verify the build.py round-trip so the deployed agent definitions carry the same instruction. Never edit only the deployed side."
  - "Conformance check: the 'reported as non-conforming' clause can be satisfied by a lightweight template-prose lint (grep-style assertion in a test) confirming each of the three templates contains the components-emission instruction; keep it advisory unless wired into an existing template-audit hook."
