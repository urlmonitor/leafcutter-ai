notes: |
  Honours the parent's USER-CONFIRMED product decision: `failed -> signed_off`
  STAYS LEGAL. Every ticket in this AC's first scenario travels that transition;
  the point is that the epic can now count it, not that it should be prevented.

  WHY THIS AC IS NOT OPTIONAL PADDING: BO-400d-2 writes the record; nothing yet
  READS it. The observed symptom the parent L1 was raised from is a read-side
  one — running the epic fact extraction over a real epic reports `failed: 0`
  for all nine agents and a blocker-comment count of 0, because the epic's
  failure history was erased by its own success. Landing only the write side
  leaves that same 0 on the screen, now backed by data that contradicts it.
  This AC is where the L1's stated benefit — "rework is something you can see
  and measure" — actually becomes observable, and it is the one AC in this set
  whose test would fail if the new field were written but never consumed.

  THE DISCRIMINATING CLAUSE is the last one. Today a reported 0 has two possible
  meanings — "nothing failed" and "something failed and was overwritten" — and
  a reader cannot tell them apart. The second scenario (an epic with no failures
  at all) exists so the test pins down that 0 now carries exactly one meaning.

  THE `## Comments` READING IS ALLOWED, and the earlier draft was wrong to ban
  it (corrected 2026-08-13). That draft required the figures to be read from the
  new fields "not inferred by counting repeated `## Comments` entries", which
  forbade the ONLY implementation shippable before BO-400d-2 lands. Two facts
  make the ban unjustified:
    - `scripts/retrospective/extract_epic_facts.py` ALREADY compiles
      `_COMMENT_HEADING_RE` over each comment heading and already counts
      blockers in `_count_comment_statuses`. It discards the agent name only
      because the heading's agent segment is matched by a non-capturing `[^(]+`
      — a one-line change, not a new mechanism.
    - The `## Comments` log is APPEND-ONLY. The overwrite defect this L1 exists
      to fix is a property of the terminal-state register, not of that log, so
      the reason to distrust the frontmatter figure does not transfer to the
      comment count.
  The criteria now name `prior_failures:` as the source once it exists and the
  comment log as the source for tickets predating it. What the criteria still
  refuse is a figure derived from the terminal state alone, which is the actual
  defect.

  KNOWN LIMIT of the comment-derived reading, for the implementer: a `blocker`
  comment is written by §4 Failed Path, so it corresponds 1:1 with a `failed`
  write — but a `handoff` comment does not, and must not be counted as a
  failure. Count `(status: blocker)` headings only.

  BOUNDARY: this is the rework/attempt count for BO-400d's own record. It is not
  BO-2800's gate-value measurement — that tree counts what each CHECK catches,
  keyed by the rule_id vocabulary it defines. Different question, different owner.
