assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    assigned_agent_repair:
      type: object
      description: "The repair's own per-record contract, applied to the 24 records the membership rule refuses: {file_path: str, current_value: str (the unregistered name, verbatim), corrected_value: str (an id present in config/agent_registry.json), basis: str (the surface this record changes, which is why this producer was chosen)}. A record for which no producer can be inferred is emitted to a review report with corrected_value null and is NOT written. Records the rule accepts are never members of this set — including the 16 whose value is a registered name written with surrounding quotes."
  reference_file_path: "docs/acceptance-criteria"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria"
    - "python scripts/build.py --target-dir ."
  constraints:
    - "ORDER WITHIN THE CHANGE IS LOAD-BEARING AND MUST BE MECHANICAL, NOT A COMMENT. The 24 corrections are written and committed FIRST; the rule (ACS-100i-9) and its deploy_map entry land SECOND, in the same change. At the moment the rule becomes live, `python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria` must exit 0 with a non-zero examined count. If the rule lands first, that sweep is red from its first run on 24 records the runner did not author — and a permanently-red hygiene tool gets skipped, then removed, then documented as known noise. That is the recorded history of KI-ACS-001 and the reason the ACS-200h whole-store gate is still unimplemented."
    - "THE CORRECTION SET IS THE RULE'S OWN VERDICT, NOT A HAND-COPIED LIST. Run the new shared helper over the store, take the set of records it refuses, and correct exactly those. A hand-maintained list drifts between authoring and implementation and cannot be re-derived at review time. Because the rule accepts a quoted-but-registered name, that verdict yields 24 records, not 40."
    - "THE 16 QUOTED RECORDS ARE OUT OF SCOPE AND MUST COME OUT BYTE-IDENTICAL. `assigned_agent: \"python-coder\"` is ordinary YAML double-quoting; yaml.safe_load returns exactly `python-coder`, which is a registered agent, so the rule accepts those records and there is nothing to correct. Do not unquote them as a drive-by tidy: it would change no parsed value, would inflate the change's blast radius by 16 files, and would present a cosmetic edit as a correction. The reader inconsistency they expose is fixed in ACS-100i-9-i, at the fallback parser, not by rewriting records."
    - "THE BLAST-RADIUS ASSERTION HAS TWO HALVES, AND THEY ARE DIFFERENT SHAPES. Capture parsed producer values AND raw `assigned_agent:` source lines before and after. Assert: the set of records whose PARSED value changed is exactly the 24 refused records; the raw source lines of the 16 quoted records are UNCHANGED; and no other field on any record is altered. A single parsed-value comparison cannot see the second half, which is the half that catches an over-eager repair."
    - "NEVER CORRECT BY DELETING THE FIELD OR SETTING IT NULL. That moves a known-bad value into the roughly 748-record no-producer population ACS-100i-10 exists to measure, laundering a defect into an unremarkable silence and corrupting that criterion's baseline in the same change that establishes it."
    - "CHOOSE PER RECORD, NOT PER GROUP. Each corrected value is a registered agent id matching the surface THAT record changes. The 23 finalize-feature-workflow records describe work on templates/workflows-js/finalize-feature.js, and workflow-architect is a registered agent covering that surface — but confirm against each record's own criteria rather than applying one value to all 23, since some may describe a Python or documentation surface instead. create-ticket is a retired slash command (ADR-012), not an agent, so that record likewise takes the agent for the surface it actually changes."
    - "DO NOT MAKE THE SWEEP GREEN BY WIDENING THE VOCABULARY. Adding finalize-feature-workflow (or create-ticket) to config/agent_registry.json would turn the sweep green without correcting a single record, and would put a workflow script into the vocabulary the fast lane's roster will later be drawn from. The criterion's 'no record is exempted' clause covers this in spirit; it is written out because it is the cheapest wrong answer available under time pressure."
    - "UNINFERABLE VALUES GO TO A REVIEW REPORT, NEVER TO A GUESS. A record whose surface cannot be determined from its own criteria is listed for human decision and left uncorrected; it is not defaulted to python-coder, which would silently make it a code ticket by omission."
    - "IDEMPOTENT AND SURGICAL. The repair must be re-runnable: a second run makes no edit and every file is byte-identical (verify by running twice and diffing). Insert or replace ONLY the assigned_agent line in each record — never rewrite a file through a YAML round-trip, which reflows every other field, destroys the blast-radius evidence, silently re-quotes or unquotes scalars (which would touch the 16 records this criterion must leave alone), and can mangle the block scalars in notes and test_rationale."
    - "PROVE THE RULE STILL BITES AFTER THE REPAIR. A store-wide green with no negative control cannot tell a repaired store from a disabled rule. In the same test run, inject one record with an unregistered producer into a COPY of the corrected store and assert the pass refuses exactly that one record, by file path."
    - "RE-MEASURE THE 24 AT THE IMPLEMENTING COMMIT. Verified at enrichment time: 24 records carry a value the registry does not list (23 finalize-feature-workflow + 1 create-ticket) among 3,385 records. Separately, 16 records write a registered name with surrounding quotes (10 python-coder, 5 test-failure-triage, 1 documentation-expert) — those are the not-to-be-touched set, and 14 of the 23 finalize-feature-workflow records are ALSO quoted, so quoting and membership are independent properties. Both counts drift as other work lands; a test hard-coding either without re-measuring fails for the wrong reason and then gets deleted."
