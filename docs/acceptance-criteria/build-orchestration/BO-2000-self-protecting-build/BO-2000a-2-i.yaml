assigned_agent: llm-expert
estimated_complexity: simple
it_requirements:
  - "Add a prompt rule to templates/agents/ac-fulfillment-gate.md and templates/agents/ac-validator.md: a claim that includes the recorded command but is missing the captured output is rejected as incomplete evidence, with a message stating the recorded output is missing and that both the command and its captured zero-new-violations output are required."
  - "The claim must not be recorded as a passing self-hosting non-regression result on this rejection path."
  - "Reuse the evidence-bundle shape defined by BO-2000a-1 (this is the 'command present, output absent' partial-bundle case)."
  - "Edit the templates/ source and keep the deployed .claude/agents/*.md copies in parity per ADR-001 (build.py round-trip)."
