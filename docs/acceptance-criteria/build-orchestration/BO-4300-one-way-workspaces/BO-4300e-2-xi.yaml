id: BO-4300e-2-xi
title: "A workspace whose repository can no longer be read is recognised as half-cleared, not fetched"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" whose landing place holds "feature/zeta", whose
    workspace record names shop and says it is ready, whose repository folder
    still exists but has lost the stored objects of its history so that its
    commits can no longer be read, and which still holds the files
    "src/app.py" and "README.md",
  When clearing "feature/zeta" is requested with no authorisation to lose work,
  Then the request is not refused because the shared project could not be
    fetched or because the repository is damaged,
  And the request is refused, stating that the workspace was half-cleared, that
    its repository can no longer be read so its commits cannot be checked, and
    that its remaining files cannot be checked against the shared project,
  And the refusal lists "README.md" and "src/app.py" by path and returns a
    one-time token bound to that folder and exactly those two files,
  And "feature/zeta" is identical before and after the refusal,
  And when clearing is requested again with that token, it is answered cleared,
    the answer lists both files as discarded, and nothing of "feature/zeta"
    remains at its location,
  And when, in a second run of the same setup, a workspace "feature/eta" whose
    repository is intact and holds one commit not on the shared project is
    cleared with no authorisation, it is refused for that unsent commit by
    identifier and is not treated as half-cleared.
depends_on: [BO-4300e-2, BO-4300e-2-vi, BO-4300e-3, BO-4300e-3-i]
