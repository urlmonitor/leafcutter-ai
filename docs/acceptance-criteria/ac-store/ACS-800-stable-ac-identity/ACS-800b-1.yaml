id: ACS-800b-1
readiness: approved
priority: high
title: "A requirement names its parent by the parent's stable UID"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement whose structural parent is the requirement with stable
    UID 10,
  When the requirement records where it sits in the tree,
  Then it stores a parent-pointer metadata field holding the value 10,
  And the parent relationship is read directly from that field rather than
    decoded from the requirement's name,
  And changing the parent-pointer field to a different existing UID is the only
    edit needed to express a different parent.
