assigned_agent: python-coder
estimated_complexity: null
delivers_to:
  - agent: python-coder
    contract: >-
      COMMIT-ANSWER block (single source, filled by BO-4500b-1). Input: the commit agent reply
      envelope (BO-4500a-5-v) plus the attempt history of this commit (prior answers, whether a
      specialist was already engaged). Output: exactly one decision -- continue | stop | retry |
      engage (with the named specialist) | report -- plus, for stop and report, the reply's status,
      reason_code, reason, hook_name, failing_files, and the path list and message file to re-offer
      for retry and engage. The decision itself dispatches nothing, so it can be proven with no route
      and no engine; the route-side dispatch around it is what BO-4500a-5-i..iv and the /commit route
      record adopt.
expects_from:
  - ac_id: BO-4500a-5-v
    contract: "Commit agent reply envelope {status: ok | handoff | blocker, commit_answer, earlier_answers, handoff keys}."
  - ac_id: BO-4500a-4
    contract: "One-answer contract and reason_code enumeration with its family partition."
