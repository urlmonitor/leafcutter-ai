notes: |
  Filed from KI-KM-010 (severity high, 2026-08-26), fix direction item 2:
  "Reconcile section 7 step 4 against the v3 templates so `ticket` versus
  `agent`+`component` is settled one way. This is INF-400b-2's to own."

  Scope boundaries. INF-400b-2 owns the parity requirement itself and its
  enumerated field list; this AC makes that requirement true in the shipped
  artefacts and installs the check that keeps it true. INF-700b-1 owns the
  addition of `text` and must land after this AC. INF-400b-2-i owns the
  consequence for the harvester's idempotency digest. INF-400c-4 owns which
  file the records land in, so no sink path is decided here. Nothing in this
  AC changes what an agent captures or when — only how the record is
  described and by whom authoritatively.

  Reproduced independently on 2026-08-26 at branch
  fix/inf400-h1-h4-knowledge-loop: four surfaces, two shapes, 28 records all
  of one shape, zero detection.
