criteria: |
  The coder knows how to behave without being reminded per-ticket.

  The python-coder template itself carries the durable craft rules that a defective
  invocation had to be hand-told: pre-commit hooks fail open on unexpected errors,
  source lives under templates/ while scripts/ and .claude/ are generated build
  outputs, new hooks/agents/skills are registered through their dedicated skills
  rather than hand-rolled, files are read before they are edited, work is
  spot-checked against the real artifact and never covered by phantom tests, and
  shell commands stay single and simple. These rules are portable template content,
  so they hold on every run regardless of what the dispatch prompt says.
