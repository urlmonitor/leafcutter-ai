roadmap_phase: phase_1
criteria: |
  Given an approved requirement whose every changed path is documentation or
    configuration and no changed path is an implementation source file,
  And that same requirement nonetheless authors a proof demand of one statement,
  When a work item is generated from that requirement,
  Then the generated work item carries a proof section containing that
    statement,
  And the shape of the changed paths does not suppress it,
  And where a rule reading the shape of the changed paths would omit the section
    while an authored demand would emit it, the authored demand decides.
depends_on: [TKT-500g-1]
