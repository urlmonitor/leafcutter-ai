criteria: |
  An installed copy that has fallen behind is reported, never silently obeyed.

  What you installed can drift behind what the package now says, and until you
  are told, every verdict you get is judged by the old rules -- a fixed rule
  still fails, and a new rule does not run at all, which looks exactly like
  passing. You find out that your installed copy is out of date at the moment it
  matters, instead of trusting a result that was never current.
