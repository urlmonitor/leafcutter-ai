created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100i.yaml"
criteria: |
  Given the hooks_manifest in commit_guardian.json contains an entry for
    the parity check hook with:
    - id: "check-hook-parity"
    - files pattern matching staged changes under scripts/commit_guardian/
      or templates/scripts/commit_guardian/ or templates/commit-guardian/
    - stages: ["pre-commit"]
  And a developer stages a new file "scripts/commit_guardian/check_new_hook.py"
    without also staging "templates/scripts/commit_guardian/check_new_hook.py"
  When the pre-commit hook framework executes the parity check
  Then the parity check detects the staged file has no template counterpart
  And the commit is blocked before the commit object is created
  And the developer sees an actionable error message explaining which file
    to add and where
