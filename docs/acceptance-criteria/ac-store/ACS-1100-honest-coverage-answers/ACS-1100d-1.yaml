criteria: |
  Given a verifier whose only input is an earlier answer that covered 40 records
    against a total of 180,
  When the verifier produces its own result,
  Then that result carries the coverage it inherited — 40 of 180 — alongside its own
    verdict, and names the upstream answer the figure came from,
  And a verifier that consumes two answers, one covering 40 of 180 and one covering
    180 of 180, carries both figures through rather than reporting only the larger,
  And the figure survives the store's two real consumption hops unchanged: the store
    scan's answer is consumed as JSON by the prioritiser across a subprocess boundary,
    and the prioritiser's merged output is consumed by the AC build selector, so the
    selector acts on a figure that still reads 40 of 180,
  And crossing a serialisation boundary does not drop the figure: an answer handed over
    as JSON carries its total, its covered count and its method in that payload, so a
    consumer that only ever sees the serialised form can still read what it inherited,
  And a consuming hop is NOT only a machine payload: a rendered trust or enforcement
    rating, a status badge, a legend or key entry that explains what a rating means, a
    dashboard tile, and a summary line in a generated document are each a hop that
    consumes a coverage-bearing answer, and each displays the inherited coverage figure
    and the scope it was earned over in the same rendered view as the rating itself,
  And a rendered rating whose coverage figure is reachable only by opening the data
    behind it does not satisfy this criterion, because at a human-read hop the laundering
    happens in the reader: the one instance this repo has actually repaired was a person
    reading an "enforced" rating on the artifact map's test-covers edge and inverting it
    to conclude every finished record was test-proven, when that rating had been earned
    over changed records only,
  And a legend, key, or tooltip that explains what a rating means states the scope the
    rating was earned over, so the explanation cannot restore the unqualified reading the
    rating itself no longer carries,
  And a human-read surface that cannot display the figure withholds the rating instead of
    displaying it bare — the same withhold-rather-than-pass posture this criterion applies
    to a machine verdict with no inherited figure, and a rating rendered as an
    unqualified word with the scope moved to a footnote, a hover, or a linked page does
    not satisfy it,
  And the bug symptom this criterion forbids at a human-read hop is a reader seeing a
    bare "enforced", "green", or "passing" rating, concluding it is store-wide, and acting
    on an all-clear that was earned over a fraction of the store,
  And a verifier result that states a verdict with no inherited coverage figure is
    itself withheld and reported as a dropped-coverage halt that names the upstream
    answer whose figure was lost — the same withhold-rather-than-pass posture as
    ACS-1100c-1, raised by this criterion on a MISSING figure, which is not a trigger
    ACS-1100c-1 recognises (its only trigger is an arithmetic shortfall).
