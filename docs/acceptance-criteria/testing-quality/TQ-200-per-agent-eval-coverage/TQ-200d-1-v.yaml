test_spec:
  - name: test_one_catching_tagged_test_passes_the_row
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      A file with the four tagged tests of the criteria, all green on the fixed version and only test_refresh_blocked_when_retry_not_due
      failing under the wrong version, passes wrong_version_run; the detail names that test and 'drop the retry_due
      condition', and the three others are not counted as blocking survivors.
    must_catch:
      - revert the fix
      - detail names a surviving test instead of the catching one
    in_scope_files:
      - scripts/evals/produced_tests_runs.py
  - name: test_all_tagged_tests_surviving_still_fails
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      A file whose tagged tests all pass under the wrong version fails with 'not caught by the runner (survivor)'.
    must_catch:
      - row passes with no catching test
    in_scope_files:
      - scripts/evals/produced_tests_runs.py
  - name: test_tagged_test_failing_on_the_fixed_version_fails_the_row
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: failure
    description: >-
      A file in which one tagged test fails on the fixed version fails the check although another tagged test catches
      the wrong version.
    must_catch:
      - a baseline failure ignored when another test catches
      - an unfinished run accepted
    in_scope_files:
      - scripts/evals/produced_tests_runs.py
  - name: test_untagged_or_missing_tags_fail
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      A file with no '# covers:' tagged test fails with "no '# covers: <AC-ID>' tagged test in the output"; a file
      whose only catching test is untagged fails.
    must_catch:
      - an untagged catching test counted
    in_scope_files:
      - scripts/evals/produced_tests_runs.py
  - name: test_build_gate_still_blocks_on_a_must_catch_survivor
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      For an AC record (not an eval row) naming a wrong version under must_catch on two tests, a run where one survives
      gives gate_passed false with reason 'survivor' from the shared runner, as before.
    must_catch:
      - shared verdict loosened so a must_catch survivor no longer blocks
    in_scope_files:
      - scripts/build_orchestration/_wvr_verdict.py
      - scripts/build_orchestration/wrong_version_runner.py
  - name: test_kept_refresh_gate_reruns_pass_and_catcher_removed_fails
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The run1 and run2 probe fixtures under unit_tests/evals/fixtures/tq200d-rerun/test-writer/refresh-gate/ pass
      wrong_version_run; a copy of each with the catching test removed fails.
    must_catch:
      - a kept output without its catching test passes (false green)
    in_scope_files:
      - scripts/evals/produced_tests_runs.py
  - name: test_test_writer_gold_refresh_gate_still_passes
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-writer --score-gold --row refresh-gate --results-file
      <tmp>
    description: The real CLI replays the refresh-gate gold output and the row passes with both halves.
  - name: test_wrong_version_run_entry_states_the_one_catching_test_rule
    target_dir: unit_tests/evals/tq200d1v/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The entry states the rule and which tagged tests block, its passing example has more than one tagged test
      and names a probe fixture that exists, wrong-version-runs.md still holds the survivor rule, and the README
      bullet links #wrong_version_run.
    must_catch:
      - entry still says a single test must catch with every tagged test blocking
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
      - scripts/evals/README.md
test_rationale: >-
  The fix loosens how the eval reads a verdict that also gates real builds, so the tests pin both sides: the eval
  passes with one catching test and still fails on all-survivors, on a fixed-version failure and on an untagged
  catcher, while the shared runner's must_catch survivor still blocks build work. The kept re-run files and their
  catcher-removed copies prove the change on the outputs that were falsely red.
