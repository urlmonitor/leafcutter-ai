id: GE-132a-3
title: "A complexity refusal says \"complexity X, only Y allowed\" and what to do next, which is to bring in the restructuring specialist with the complexity-reduction skill, and every reader gets that same text from the declaration"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given check-complexity's remedy declaration names the restructuring specialist and
    the complexity-reduction skill,
  And a person at a terminal runs git commit on a change that raises plan_batches in
    scripts/planner.py from 30 to 31, where 30 is the ceiling applied to it,
  When check-complexity refuses the commit,
  Then the refusal states that plan_batches has complexity 31 and only 30 is allowed,
    not merely that it is too complex,
  And it states that the next step is to bring in the restructuring specialist to
    apply the complexity-reduction skill to plan_batches.

  Given the same change refused the same way when it is committed by the commit agent,
    and again when an interactive session runs git commit itself,
  When each refusal is read,
  Then all three refusals state the same score, the same ceiling and the same next
    step, so one text serves the agent that acts on it and every agent or person who
    only reads it.

  Given the declaration's instruction alone is changed to "bring in the restructuring
    specialist to split plan_batches until it scores at or under 30",
  When the same refusal recurs,
  Then the refusal shows the changed next step and not the earlier one, so the next step
    comes from the declaration and not from text kept inside the check.
depends_on:
  - GE-132a
  - GE-132a-2
  - INF-800f-1
