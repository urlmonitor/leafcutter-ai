    relevance: "Calls the reach determination with literal result counts, budgets and merge dates and asserts both returned values, so each of the four branches is executed rather than inspected."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The reach determination is scripts/agent-health/weekly_health.py::pr_coverage_floor(returned, limit, merged_dates, earliest_week) and must return a two-element tuple (covered_from: date | None, reason: str). It must stay pure — no network call, no subprocess — so all four branches are executable from literal integers and dates. The caller, collect_pull_requests, is the only place the gh subprocess lives."
  - "Truncation must be judged on TWO conditions together, never on the cap alone: the page came back AT its budget (returned >= limit) AND its oldest merge is newer than the oldest reporting week. Declaring truncation on the cap alone would mark every week unknown on a busy repository, which is the over-correction the last two scenarios exist to block."
  - "An empty result page must be treated as complete coverage, not as truncation, so a repository with no merged pull requests gets the honest zero INF-500e-2 guarantees it. A zero-length page combined with a reached budget must still return (None, empty string)."
  - "The reason string must name both the numeric cap and the ISO date the page reaches back to, because it is the only artefact an operator has to distinguish a genuinely quiet oldest week from a query that stopped short. When coverage is complete the reason must be the empty string, not a placeholder such as ok or none."
  - "The budget the caller issues must scale with the number of reporting weeks rather than being a fixed literal, and must be passed to pr_coverage_floor as the same value used in the gh query. A hard-coded budget on either side re-opens the defect: an eight-week run and a two-week run reported different counts for the SAME week (59 against 51 for the week of 2026-08-17) purely because of the limit."
  - "The report must never treat a truncated week as zero. Weeks starting before covered_from must be rendered through the unknown path owned by INF-500e-2 (empty TSV cell plus prs_available False), not as a low number."
test_spec:
  - name: TestPrCoverageFloor::test_capped_page_stopping_short_reports_a_floor
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "returned 120 against a 120 budget whose oldest merge is 2026-08-17, with the oldest week 2026-07-06, returns the floor 2026-08-17 and a reason naming both the cap and the date."
  - name: TestPrCoverageFloor::test_uncapped_page_covers_every_week
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "returned 120 against a 480 budget returns floor None and an empty reason, and the returned tuple has exactly two elements."
  - name: TestPrCoverageFloor::test_capped_page_reaching_far_enough_still_covers
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "returned 480 against a 480 budget whose oldest merge 2026-07-01 predates the oldest week 2026-07-06 returns floor None and an empty reason, so hitting the cap alone is not truncation."
  - name: TestPrCoverageFloor::test_empty_page_is_not_treated_as_truncated
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A page returning no merges at all against a 480 budget returns floor None and an empty reason, so a quiet repository keeps its honest zero."
test_rationale: |
  This failure is silent by construction: the query does not error, it stops
  short, and the oldest weeks then carry a low count indistinguishable from a
  genuine lull. No amount of reading the rendered report would find it, so the
  contract has to execute the verdict function itself across all four branches.
  Direct-import unit tests with literal counts, budgets and dates are the right
  shape precisely because they remove the network: a test that issued a real
  gh query could not reproduce a capped page deterministically, and a mocked
  gh call would prove only that the mock was configured. Both returned values
  are asserted in every branch, since a correct floor paired with a silent
  reason would leave the operator with nothing to read.
delivers_to:
  agent: python-coder
  contract: "pr_coverage_floor(returned: int, limit: int, merged_dates: list[date], earliest_week: date) -> tuple[date | None, str]. Consumed by collect_pull_requests and surfaced on its result as covered_from and reason, which INF-500e-2's renderers use to decide which weeks render as unknown. covered_from None with an empty reason means complete coverage; a date with a non-empty reason means every week starting before it is unknown."
