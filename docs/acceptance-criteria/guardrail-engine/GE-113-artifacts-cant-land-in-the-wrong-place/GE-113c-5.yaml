    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Canonical source templates/scripts/commit_guardian/check_adr_cross_reference.py.
- The check gets the project root only through the shared resolver of GE-113c-1-iv; no Path(__file__).parents[N]
  root remains in it.
- The proof runs the built, installed copy the way .pre-commit-config.yaml invokes it, in a temporary
  repository with staged fixture documents, independent of the developer's working tree.
- The 'read none of its targets' outcome reuses GE-120a-4's mechanism; no second implementation.
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- Every path the check reads (staged files, docs/components.json, the decision-record folder) resolves
  from that one project root. The check's strict setting is not changed.
- Before merge, run the working check once over every existing decision record. Each finding is fixed
  or filed as a known issue naming the document.
declared_files:
- path: templates/scripts/commit_guardian/check_adr_cross_reference.py
  state: existing
delivers_to: null
expects_from:
  ac_id: GE-113c-1-iv
  contract: The single shared project-root resolver (templates/scripts/commit_guardian/_resolve_root.py,
    git rev-parse --show-toplevel with a safe fallback) returns the project root as a path, the same root
    from the package source copy and from the installed copy.
test_intent:
- clause: both runs report the same finding, naming ADR-901-example.md and the missing cross-reference,
    with the severity the check's strict setting gives it
  needs_test: true
  reason: Equal findings from both copies is the behaviour that is inert today.
- clause: when the cross-reference is added, both runs report no finding
  needs_test: true
  reason: An added cross-reference must clear the finding in both copies.
- clause: the check reads staged documents, the component registry and the decision-record folder from
    the project root obtained through the one shared root resolver of GE-113c-1-iv
  needs_test: true
  reason: Reading the registry and the folder from the wrong root is the defect, and only an installed-layout
    run shows it.
- clause: a run that was offered staged documents and could read none of them does not report a pass (the
    outcome GE-120a-4 defines)
  needs_test: true
  reason: An empty read must not pass, or the check can go inert again silently.
- clause: every existing decision record or document the now-working check flags is either fixed in the
    same change or recorded as a known issue naming it, and the check is not narrowed, exempted or switched
    to warn-only to let that change through
  needs_test: false
  reason: A one-time sweep of existing documents during the change, verified by that commit, not by a
    lasting test.
origin_agent: business-analyst
