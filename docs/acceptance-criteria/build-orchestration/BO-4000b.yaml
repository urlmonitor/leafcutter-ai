it_requirements:
  - "Standing is measured against origin/main as freshly fetched in the same worktree step. Both commits behind and commits ahead are computed and reported: BO-900a-1's ahead-only measure is not sufficient, and comparing against the local main is a defect."
  - "If origin/main cannot be fetched, or either count cannot be computed, the standing is 'unverifiable'. It is never treated as 0 behind (BO-1800f)."
  - "Resolution of the point the BA left open: each target keeps one branch name. When the existing local branch is behind and carries no commits origin/main lacks, its ref is advanced to the fetched origin/main tip (lossless, because it has no unique commits) and the worktree is opened on it. No second branch is cut for the same target, so BO-4000c's 'target's branch' stays deterministic and the next run does not find the stale ref again."
  - "No step rewrites, rebases, resets or deletes a branch that carries commits origin/main lacks. After the refusal, that branch's ref points at the same commit it did before the run."
  - "A branch ref is never force-moved while it is checked out in any worktree."
  - "The behind count, ahead count and fetch outcome come from a deterministic helper that queries the repository and returns a structured result, so the real-repository test measures them without an LLM."
  - "The staleness report and the refusal carry the branch name, the behind count and the ahead count as structured fields as well as prose. Each refusal kind (unique commits versus unverifiable standing) has its own stable, machine-readable reason discriminator."
  - "When the run reuses the worktree resolved for the target (BO-4000, first scenario), no fetch-driven comparison, ref move or refusal is performed on that worktree's branch."
  - "The real-repository test uses a local bare repository as origin and needs no network access."
delivers_to: null
expects_from:
