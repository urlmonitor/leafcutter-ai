notes: |
  Pins the VALIDITY dimension the PO stressed on GE-117b: the reference must resolve
  to a REAL AC id, not merely be well-formatted text. Kept as its own L2 (not folded
  into GE-117b-1) because resolution against the AC store is a materially different
  check from the missing-vs-present parse, and it is the exact failure the brief
  named (a reference that is syntactically fine but dangling). Distinct verdict from
  missing so GE-117e can suggest the likely-intended id on invalid.
