implemented_by: []
notes: |
  Confirms the two mechanisms are orthogonal: status-exclusion shrinks the
  numerator (count), child_limit_override raises the denominator (limit). The
  child_limit_override remains a valid escape hatch but is retired for a given
  parent as soon as superseding redundant children brings the active count back
  under the default cap — the stopgap-retirement direction recorded in the
  ACS-800 PROJECT_CONTEXT note.
