notes: |
  PARENTED UNDER GE-127e-3 RATHER THAN DIRECTLY UNDER GE-127e, FOR THE SAME TWO
  REASONS GE-127a-1-i RECORDS. Semantically this is the negative edge of the honesty
  obligation: when no help can be produced, saying so plainly is the only honest
  output, and a generic sentence in its place is the anti-precedent reproduced inside
  the fix. Mechanically, the store's id format admits no roman-suffixed child of an
  L1, so an L3 must hang from an L2.

  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE. GE-127e-3 constrains what the
  refusal may CLAIM. This constrains what happens to the VERDICT when the thing being
  claimed cannot be produced, and the two are independently satisfiable: an
  implementation can be scrupulously honest about having no guidance while a caught
  exception in the description step quietly lets the commit through. That would undo
  GE-127a and GE-127b for exactly the files hardest to describe, and no test in either
  of those records would notice, because their fixtures describe cleanly.

  THE THIRD ARM EXISTS SO THE FIX DOES NOT OVERSHOOT. Once a could-not-be-described
  state exists, the cheap implementation reports it wherever it occurs. That would
  make every commit touching an undescribable file noisy even when the file is
  comfortably within its permitted length, and would break GE-127a-1's silence arm
  from a direction that record cannot see. The statement is an attachment to a
  refusal, not a finding.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO
  can lift them verbatim into test descriptors. The undescribable state must be
  produced by making the content genuinely unresolvable at run time, never by
  asserting an error branch exists in the source — a source assertion stays green on
  precisely the swallow-and-continue implementation this record forbids.

  (1) "the commit does not complete, exactly as it would have had the description
      been produced" — MUTATION: make the description step, on failing to resolve a
      file's content into parts, yield an empty description and allow the run to
      continue to a clean result for that file. Under that injection the commit
      completes for a file that is over its permitted length; this clause must go RED,
      failing BY THE COMMIT OUTCOME as well as by the text, and must return to green
      on revert. This is the exact shape already recorded in this guard for the
      measurement step, and it is the reason this record exists rather than being
      trusted to the implementer.

  (2) "the outcome offers no parts, no division, and no substitute wording that reads
      as advice about that file" — MUTATION: when the description cannot be produced,
      fall back to a fixed sentence of general refactoring advice. Under that
      injection this clause must go RED, and must return to green on revert. Without
      it the clause is an absence and is green against any implementation that emits
      nothing. This injection is the anti-precedent in miniature: a placeholder
      standing in for a result, indistinguishable to the reader from the real thing.

  (3) "a file is never refused because guidance about it could be produced, only
      because of its length" — MUTATION: refuse any file for which named parts could
      be produced, regardless of its measured length. Under that injection the
      second arm must go RED, failing by the commit outcome, and must return to green
      on revert. Without it the arm is satisfied by a guard that refuses nothing at
      any commit, which is today's implementation exactly.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity,
  it_requirements, test_spec, test_rationale and declares_side_effect. The verdict
  vocabulary for the could-not-be-described state is deliberately unpinned — the
  recommendation is to reuse whatever GE-127a-1-i's enrichment settled for the
  could-not-be-measured state rather than mint a second one, but that is a technical
  judgement and must be recorded when it is taken.
