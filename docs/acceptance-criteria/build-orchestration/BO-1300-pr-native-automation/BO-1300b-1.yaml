created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300b.yaml"
criteria: |
  Given an open pull request from a working branch into main on a repository that defines required status checks for main
  When the automation prepares to merge the pull request
  Then it reads the set of status checks marked required for the pull request from the repository's branch protection
  And it treats that set as the gate it must satisfy, rather than a hard-coded list
  And when the required-check set includes the lint gate named "Lint (ruff)", that check is one of the checks it waits on
depends_on: [BO-1300b]
