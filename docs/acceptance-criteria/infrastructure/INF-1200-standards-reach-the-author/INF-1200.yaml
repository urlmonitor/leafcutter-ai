notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.
  L0 and L1 only — no Gherkin, no technical requirements and no test contracts
  were written here, by design.

  WHAT THE USER ASKED FOR, AND WHAT THEY DID NOT. The request was: "Injecting
  guardrails into agents based on file types. It must be easy to control these
  things from a single source of truth, where I say 400 lines for tsx files, and
  all agents working on tsx know about this." Read carefully, this is NOT a
  request for a new standard, a new check, or a stricter one. Every constraint
  named already exists and is already configured. The request is that the
  constraints the project ALREADY holds work to should reach the party about to
  produce the work — declared in one place, per kind of file, automatically true
  of every specialist that owns that kind of file, and automatically true of
  standards added later. Any decomposition that ends up authoring a new
  guardrail has answered a question nobody asked.

  WHY A NEW L0 AND NOT AN AMENDMENT. Four existing records were examined as
  hosts. Each was rejected on scope, and each is fenced in doc_links rather than
  quietly left adjacent.

    - INF-1100 ("Agents always do their work where your project keeps it") is
      the closest structural match in the store and is the reason this goal is
      credible at all: it already established the pattern of a project
      declaration being the one source of truth a specialist obeys, with the
      resulting figures in compiled instructions proven rather than assumed. Its
      promise, in its own words, is about work LOCATION. Widening an approved
      L0's stated promise from "where your work goes" to "and also every
      standard it must meet" changes what an approved record promises after the
      fact, and buries the more valuable half of the new capability inside a
      goal whose title does not mention it. Precedent followed, promise not
      widened.
    - INF-100 ("Agents work without manual intervention") reads close on its
      criteria line — context loaded, no handholding — but its three children
      are unrelated point defects (which account opens a pull request, how one
      script resolves a checkout root, how another finds its configuration).
      Hanging a cross-cutting capability under a grab-bag of point fixes
      inverts containment, which is the standing objection this store already
      recorded when GE-120 was kept off GE-118.
    - GE-127 is the enforcement half of the same subject and is fenced hard.
      See its doc_link above; the boundary is stated there and repeated in
      every child of this tree that touches it.
    - AR-100 owns the ownership join this goal consumes. It answers "who owns
      .tsx"; this goal asks "and does that owner know the .tsx rules". Using an
      answer is not the same as owning the question.

  THE ALTITUDE TEST THIS GOAL HAD TO PASS. An earlier framing was scoped to
  file-size limits reaching coding specialists. It was lifted, because the
  outcome survives swapping the standard: a project that capped tangledness or
  folder crowding instead, and told nobody, has exactly the same defect. The
  title therefore names no standard, no kind of file and no specialist. A
  criterion in this tree that reads as being about one number, one file type or
  one specialist is at the wrong altitude.

  THE MEASURED SHAPE OF THE GAP — IT IS A GRID WITH ONE CELL FILLED. Verified in
  this worktree on 2026-09-09. Treat the labels as given; do not upgrade them.

    - READ FROM SOURCE, NOT DISPUTED — THE WORKING CELL. One standard (a line
      limit) for one kind of file (Python) is read at build time out of the
      guardrail configuration and threaded into one specialist's instructions,
      which refer to it in five places including a stop-and-ask trigger. For
      that one pairing, the figure the specialist is told IS the figure that
      will be enforced, from a single declaration. This is the shape to
      generalise. It is correct and must be preserved, not replaced.
    - READ FROM SOURCE — THE FILE-TYPE AXIS. The build-time step reads exactly
      one kind of file. The same configuration section names two, with distinct
      limits. Nothing tells anyone about the second.
    - MEASURED BY GREP OVER ALL SPECIALIST TEMPLATES — THE SPECIALIST AXIS.
      Exactly one specialist template mentions the size standard at all. Two
      other specialists own kinds of file the project's own ownership record
      assigns them, and are told nothing.
    - READ FROM SOURCE — THE GENERALITY GAP. The build-time step is a
      hand-written one-off sitting beside another hand-written one-off for an
      unrelated value. Nothing walks the ownership record or the standards
      declaration. Every additional value therefore costs both a new one-off
      and a hand edit of the right specialist templates. This is the fact that
      makes INF-1200b the keystone: an implementation where declaring a new
      limit still requires editing specialist instructions has NOT delivered
      the user's "single source of truth", even if every specialist ends up
      correct on the day it ships.
    - READ FROM SOURCE — THE FUTURE-STANDARDS CASE IS ALREADY HERE, TWICE OVER.
      Three further standards are fully configured with thresholds of their own
      (code tangledness, a separate one for database code, and folder
      crowding). None is registered to run, and no specialist anywhere is told
      any of their figures. They are the concrete instance of "guardrails we
      add later" and of INF-1200e's silent-gap case simultaneously. NOTE THE
      FENCE: making them RUN is BP-1600a-2's work and is out of scope here.
      They matter to this tree only as an audience that has never been
      addressed.
    - READ FROM SOURCE — THE USER'S OWN EXAMPLE IS NOT COVERED AT ALL. The kind
      of file named in the request appears in neither the covered-kinds list
      nor the per-kind limits. Being ABLE to say it is the point; the specific
      figure is a decision for the user at approval, not a criterion here.
      Following GE-127c's precedent, no criterion in this tree names a file
      extension.

  L1 CUT — BY GUARANTEE, NOT BY DEFECT, AND NOT BY AXIS OF THE GRID ALONE.
    - INF-1200a — TIMING. You are told before you write, not refused after.
      This is the criterion that keeps the whole tree out of GE-127; if it is
      dropped, everything left here collapses into enforcement.
    - INF-1200b — SINGLE DECLARATION. THE KEYSTONE. One edit, one place, and
      every affected specialist is correct thereafter with nothing else
      touched. This is the criterion the user actually asked for and the one
      most likely to be quietly satisfied by an implementation that produces
      correct specialists via six hand edits.
    - INF-1200c — REACH ACROSS SPECIALISTS. Everyone who owns a kind of file is
      told that kind of file's standards.
    - INF-1200d — REACH ACROSS STANDARDS AND ACROSS TIME. A standard added
      later arrives at its audience without anyone rewiring the delivery.
    - INF-1200e — DETECTABILITY OF THE GAP. An uninformed specialist is a
      countable, reportable condition rather than silence.
    - INF-1200f — FIDELITY. What a specialist was told is what its work will be
      judged against, and stays so as the standard changes.

  WHY c AND d ARE NOT ONE L1, since the merge is tempting. They are the two
  axes of the grid and they have different populations and different mechanics:
  c is answered by walking the ownership record, d by walking the standards
  declaration. Merged, an implementer satisfies whichever axis is cheaper —
  which is precisely how the store arrived at one filled cell.

  WHY b AND f ARE NOT ONE L1. A design in which each specialist's instructions
  still name the value they want, with the figures filled in automatically,
  satisfies f (no drift) and fails b (adding a kind of file still means editing
  a specialist). That is today's design, generalised. The negative case proves
  independence.

  SILENCE IS THE FAILURE MODE — WHY INF-1200e EXISTS AT ALL. Today a specialist
  that was told nothing is indistinguishable from one for which no standard
  exists. Both are silent. Every other criterion in this tree can be reported as
  satisfied by a system that covers one specialist and calls it done, unless the
  uninformed ones can be named. This component's standing convention that a
  check which could not run must say so, rather than reporting success, applies
  here unchanged and in its natural form: a delivery that reached nobody must
  not look like a project with no standards.

  IDENTIFIER. INF-1200 was established free on 2026-09-09 rather than by listing
  directories, because folder listings under-report taken ids in this store and
  this component in particular files INF-700 inside the INF-400 folder and
  INF-900 inside the INF-600 folder. Checks run: a recursive grep for the
  literal INF-1200 across the whole worktree excluding version-control internals
  returned no hits, and the highest L0 hundred otherwise in use is INF-1100. Per
  standing rule, RE-VERIFY at merge time rather than trusting this paragraph —
  id allocation in this store is known-broken (KI-ACD-008).

  PRIORITY AND READINESS ARE AUTHORING DEFAULTS, NOT JUDGEMENTS. Every record in
  this tree is draft/medium. The user sets both at the approval gate.
