      clean and exit 1 finding. This record adds a third cause (cannot be tokenized) to the
      two that record names (unreadable encoding, cannot open). Do not mint a new verdict.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127b-1-i.yaml
    relationship: related
    status: exists
    relevance: >-
      The previous-length arm reuses that record's unresolvable-previous outcome rather
      than inventing one.
assigned_agent: python-coder
estimated_complexity: S
package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    Exercise the failure by feeding genuinely untokenizable content, never by asserting
    that an error branch exists in the source (BP-1600a-2-ii's standing constraint, as
    GE-127a-1-i applies it).
  - >-
    The accepted-syntax arm guards the opposite failure: a strict lexer turning valid
    code into a refused commit. Python f-string tokenization depends on the interpreter
    running the hook (nested same-quote f-strings are valid only from 3.12); the IT PO
    pins whether an f-string the running interpreter cannot tokenize is INDETERMINATE or
    measured with a fallback that still never counts a comment.
test_spec:
  - name: test_ge_127d_3_ii_untokenizable_content_is_indeterminate_exit_2_with_no_length
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      Through the hook in a temporary git repository, each of the four untokenizable
      files the criteria name produces an INDETERMINATE line naming the file, exit 2, no
      stated length and no within-limit listing; the corrected file is then measured.
    must_catch:
      - "tokenizer error caught and the raw line count used instead"
      - "tokenizer error caught and the length reported as 0"
  - name: test_ge_127d_3_ii_an_untokenizable_previous_version_is_reported_unresolvable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      With HEAD holding an unclosed block comment and the staged version valid, the hook
      reports the previous length unresolvable in GE-127b-1-i's vocabulary and refuses.
  - name: test_ge_127d_3_ii_valid_modern_syntax_is_always_measured
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Files carrying the accepted constructs the criteria list are measured with a
      stated length and no INDETERMINATE line.
    must_catch:
      - "template literal nesting inside ${} rejected as unterminated"
test_rationale: |
  Both failure descriptors break the read for real by staging untokenizable content and
  observe the hook's output and exit status. The boundary descriptor exists because a
  tokenizer that refuses valid code converts this record's safety property into a commit
  blocker on correct files.
delivers_to: null
expects_from:
  ac_id: GE-127d-3
  contract: "A tokenizer that signals failure distinctly instead of returning a count."
origin_agent: business-analyst
