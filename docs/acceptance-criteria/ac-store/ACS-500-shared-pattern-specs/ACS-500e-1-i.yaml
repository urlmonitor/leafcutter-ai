title: "Circular composition dependency is detected and rejected"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given composite pattern PTN-020 has depends_on: [PTN-010],
  And someone attempts to add depends_on: [PTN-020] to atomic pattern PTN-010,
  When the schema validator runs at commit time,
  Then the commit is blocked with an error stating:
    "Circular dependency detected: PTN-010 -> PTN-020 -> PTN-010"
  And the error names all ACs in the cycle,
  And the circular depends_on addition is not persisted.
