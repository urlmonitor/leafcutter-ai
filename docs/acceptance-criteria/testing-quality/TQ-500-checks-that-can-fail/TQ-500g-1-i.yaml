id: TQ-500g-1-i
components:
  - testing_quality
  - build_orchestration
title: "The shared runner holds each guarding test to the wrong versions its own entry names, and a sibling's catch never covers for it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a bug-fix requirement TQ-9101 whose fix changed refresh_config() from
    "if refresh_due" to "if refresh_due and retry_due", with three tests
    tagged as covering it, all of which pass on the code as written —
      T1: its entry names must_catch ["revert the fix",
          "drop the retry_due condition"],
      T2: its entry names must_catch ["drop the retry_due condition"],
      T3: its entry names no must_catch and does not declare the
          discrimination angle,
    and, under "drop the retry_due condition", T1 fails and T2 still passes,
    and a fourth test T4, covering TQ-9101, whose entry declares the
    discrimination angle and names no must_catch,
  When the shared runner makes the wrong-version runs for TQ-9101,
  Then it applies "drop the retry_due condition" and "the fix undone" (the
      changed code as it stood before the work began), one at a time, and runs
      T1, T2 and T4 against each,
    And T3 is run against no wrong version and is reported as not in scope for
      the runs, never as passed,
    And "drop the retry_due condition" is reported as surviving T2, naming T2
      and that wrong version, and the runner's verdict is a stop, although T1
      caught it — each test answers for every wrong version its own entry
      names,
    And T4 is held to "the fix undone" only,
    And "the fix undone" stops the work when no test in scope fails under it,
      or when a test whose own entry names it passes under it,
    And a wrong version counts as caught by a test only when that test failed
      under it and passed on the code as written,
    And each run is read the way TQ-500g-4 requires, so a test that failed in
      only one of its sub-cases has failed,
    And after each run the altered files are byte-for-byte identical to the
      code as written, and no other file has changed,
    And a statement from any agent that T2 catches "drop the retry_due
      condition" does not change this verdict: T2's survival is decided by
      running T2.
