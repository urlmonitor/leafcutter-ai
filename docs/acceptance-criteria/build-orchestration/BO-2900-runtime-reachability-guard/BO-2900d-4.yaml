it_requirements:
  - "Create docs/how-to/reachability-exemptions.md. Open with the DECISION (wire it in, or exempt it) and put the recording procedure after it; a guide that opens with 'how to record an exemption' teaches people to exempt, and the exemption is the fallback, not the workflow."
  - "State the concrete recording procedure against the real registry chosen by the IT PO: add an entry to config/reachability_exemptions.yaml with `item` (the exact repo-relative path or surface:capability id), `kind`, `reason`, `recorded` and `recorded_by`. Show a real entry, not a placeholder."
  - "State that the reason must be non-empty and that a blank reason does not exempt (BO-2900d-1-i), and be explicit that the reason is judged by review, not by the tool — so the reason must be written for the reviewer who will read the inventory, not for the check."
  - "State the exact-item scope rule from BO-2900d-3: a sibling in the same folder needs its own entry and its own reason; there is no folder or glob form."
  - "Show how to see the exemptions in force — the guard prints the full inventory and the total on every run, including clean ones — so an author can check the set without reading the registry file."
  - "CONTAINMENT FENCE (the last criteria clause): state that an exemption is NOT the route past a stale automation call (fix the call — see the capability-automation-connection guide) or past an uncalled capability (wire it, or exempt it deliberately under the BO-2900b-1-i terms). Link both, do not restate."
  - "Register the page in docs/INDEX.md, cross-link it from docs/how-to/done-proof-enforcement.md, and satisfy check-doc-frontmatter, check-doc-length and check-doc-index."
