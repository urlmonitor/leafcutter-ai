criteria: 'Given a versioned representative set of real project research cases has independently reviewed expected
  outcomes and source references

  When the current retrieval behavior and a proposed query or ranking improvement are evaluated on the same declared
  cases and source scope

  Then the report distinguishes exact lookup, relationships, ambiguous research, no-match, correction and unsupported-data
  cases according to the available corpus

  And it records case counts, source and query versions, applicable model settings, expected and actual results,
  provenance validity, retrieval quality, content size and latency

  And custom registered queries are evaluated through the same validated catalog entry point used by research

  And partial, unavailable, denied or not-run cases remain visible with explicit denominators rather than being
  counted as correct empty answers

  And mandatory quality and latency gates are chosen from a measured baseline before deciding whether the proposed
  change may be promoted

  And the comparison preserves reviewed assessment cases rather than treating candidate-authored passing examples
  as independent quality evidence

  And an improvement is described as a governed query, ranking or knowledge change only to the extent actually evaluated

  And query reuse does not claim model-weight training, autonomous rewriting of canonical knowledge or proven semantic
  usefulness from synthetic vectors alone

  And insufficient real corpus, model access or authorization leaves the relevant measurement not-run or limited
  rather than inventing a score.

  And the first source-anchored batch identifies its twelve planned positive/control cases across six of the eight
  role-query families, without calling that sample a representative benchmark of all twenty-five questions

  And required-field meaning, exact clauses, scope inclusion, complete versus truncated counts, declared versus
  executed proof, missing query versus missing source support, and execution versus question fulfillment are assessed
  against their independent expected outcomes

  And missing or withheld work status cannot be replaced by lifecycle status, a shortened criterion cannot be accepted
  as complete, and a truncated dependent list cannot become an exact total

  And test references without execution evidence cannot pass an executed-proof check, unsupported mappings cannot
  pass a query-build eligibility check, and absent trace evidence cannot pass a remote-observation check

  And expected source-oracle values are kept separate from the actual tool response and cannot fill missing response
  fields during assessment

  And planned, runnable, executed, passed, failed and not-run cases remain distinguishable; a specification alone
  has no passing result

  And expected query-family coverage and uncovered role questions remain visible when readiness or implementation-trace
  cases are deferred beyond the initial batch

  And a changed answer meaning, required field, query behavior or source mapping invalidates any affected prior
  comparison until its expectations are reviewed again.

  '
