id: ACD-2400a-2-iii
components:
  - ac_driven_dev
  - ac_store
readiness: approved
priority: high
title: "One-sided producer/consumer contracts are reported with both ends named, never completed"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given ACD-9990a-1 (assigned to python-coder) declares a delivery to llm-expert, and no
    record assigned to llm-expert declares it expects anything from ACD-9990a-1,
    and ACD-9990a-4 declares it expects a contract from ACD-9990a-2, and ACD-9990a-2
    declares no delivery,
    and ACD-9990a-5 declares it expects a contract from ACD-9990a-7, an id that exists
    nowhere in the store,
  When the requirement rule check runs,
  Then exactly three findings are reported, each with disposition "needs a decision",
  And the first names ACD-9990a-1 and states no llm-expert record expects from it,
  And the second names ACD-9990a-4 and ACD-9990a-2 and states the delivery side is absent,
  And the third names ACD-9990a-5 and the unknown id ACD-9990a-7,
  And no contract text is added to or removed from any record,
  And a pair whose two sides both exist and point at each other produces no finding even
    when their contract descriptions differ in wording.
depends_on:
  - ACD-2400a-2
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/acceptance-criteria/ticket-creation/TKT-300-review-gates/TKT-300a-3.yaml
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Handles every schema-allowed shape of delivers_to/expects_from (null, string, object, list).
- An agent-addressed delivery is satisfied by any record assigned that agent whose expects_from names
  the producer id.
- '''Unknown id'' means absent from the whole store, not only the feature folder; the store-wide id lookup
  must still meet the ACD-2400a-1 time budget.'
- No contract text is ever added, removed or compared.
delivers_to: null
expects_from:
  ac_id: ACD-2400a-2
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
test_spec:
- name: test_delivery_without_consumer_reported
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: ACD-9990a-1 delivering to llm-expert with no llm-expert consumer yields a 'needs a decision'
    finding stating so.
- name: test_expects_without_delivery_names_both_ends
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: ACD-9990a-4 expecting from ACD-9990a-2 (no delivery) yields a finding naming both ids.
- name: test_expects_from_unknown_id_reported
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: ACD-9990a-5 expecting from ACD-9990a-7 (absent from the store) yields a finding naming
    the unknown id.
  angle: failure
- name: test_exactly_three_findings_and_no_text_changed
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Exactly three findings are reported and no contract text in any record changes.
- name: test_mutual_pair_with_different_wording_passes
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: A mutually pointing pair whose descriptions differ in wording yields no finding.
  angle: boundary
