title: "A learning written while work was in flight is still readable after the place that work ran in is gone"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a.yaml"
criteria: |
  Given the destinations a routing step writes to are memory files and
    documentation pages that version control tracks, and four of the five ways
    this package completes a unit of work run inside an isolated working
    directory that is removed once the work has been merged,
  And a routing step that runs at a driver's completion step inside such a
    directory changes those files there and nowhere else,
  When the working directory that unit of work ran in has been removed and a
    person opens the destination in the tree the work merged into,
  Then the learning text is written into the destination file, at the path the
    record named,
  And it arrived through a commit the completion path already makes for its
    own output — the routing step introduces no commit the path would not
    otherwise have made, and the number of commits a unit of work produces is
    the same whether or not there was anything to route,
  And a routing step whose writes exist only inside a working directory that
    is later removed has not written those records: they are reported as still
    unwritten and a later run writes them, rather than counted as written and
    then discarded,
  And the bookkeeping that stops a record being routed twice does not outlive
    the publication it rode: where the branch carrying a routing write never
    reaches the merged tree — the pull request is abandoned, the branch is
    discarded, the merge never happens — the record is eligible again, and a
    later completed unit of work puts the learning in the merged tree and puts
    it there once. A record marked as routed on the strength of a write no
    merged tree ever received is worse than an unrouted one, because nothing
    will look for it again,
  And a completion path on which the learning text is present at the moment
    the driver reports the work finished and absent from the merged tree
    afterwards fails this criterion, whatever the driver reported at the time.
