notes: |
  THE FOURTH CAUSE IS AVOIDABLE, NOT MERELY REPORTABLE -- this is the record that
  removes it rather than labelling it. The observed run recorded
  `[resolve-workspace-setup-permission] failed: API Error: Connection lost
  mid-response`. Startup is gated on a live agent round-trip taken in order to read
  a static local file, so a network hiccup closes the mandated entry point, and in
  the output it is indistinguishable from a real mis-assignment. Removing the
  round-trip removes a whole class of false halt.

  THE FIRST GIVEN IS THE TEST. Make dispatch impossible and require the run to get
  past the check anyway. That is observable in a fresh process and cannot be
  satisfied by a source scan; a test that greps for the absence of a dispatch call
  passes on a call that is present but unreachable, and fails on a correct
  implementation that keeps the helper for another purpose.

  THE THIRD THEN CLAUSE stops the fix being "skip the check when dispatch is
  unavailable", which would be a fail-open regression wearing this AC's clothes.
  The verdict must be the same either way because it comes from the file, not from
  the transport.

  ORDER OF LANDING. Once this lands, ACD-2100b-1 through -3 have three outcomes to
  distinguish rather than four -- the dispatch-failure cause no longer exists. That
  is the intended outcome and not a reason to defer them: the remaining three are
  still conflated today, and ACD-2100b-3-i shows the space is not closed by
  enumeration alone.

  2026-08-25 (it-po): delivers_to and expects_from are both null deliberately. This
  record interacts with ACD-2100a-3 (which makes the read succeed from a worktree) and
  with b-1..b-3 (which report its failures), but neither relationship is a prerequisite
  in either direction and neither is carried in depends_on. Writing an expects_from
  edge with no depends_on mirror would create a contract the build sequencer cannot see
  (KI-ACD-015, open) and that nothing enforces. The interactions are stated in
  it_requirements instead, where the coder will actually read them.

  2026-09-07 (it-po): SURFACE CHANGE -- THE CHECK MOVES TO THE SKILL PRE-FLIGHT.
  The criteria are untouched and the observable behaviour is identical; only the place
  the check lives has changed. This is the blocker that halted the build on
  12_TICKET-20260826-ACD-2100b-5, and it is a hard engine constraint rather than a
  preference. The E2 workflow engine (ADR-030) contextifies the workflow body with
  exactly the injected globals agent, parallel, pipeline, phase, log, args, workflow and
  budget -- no `require`, no `module`, no `exports`, no `process`, no `__dirname`, and no
  filesystem primitive of any kind. The canonical statement is the ENGINE FIDELITY
  section of the unit_tests/_workflow_engine_harness.py docstring, which was read and
  confirmed before this amendment was written. So a workflow body physically CANNOT read
  config/agent_registry.json: the agent round-trip this record exists to delete is there
  precisely because the sandbox has no filesystem, and "the check reads the registry
  itself" is unimplementable inside templates/workflows-js/plan-feature.js. The skill
  runs in the main agent loop with real Bash and Read tools, so a pre-flight script
  invoked from the skill can do the local read. The precedent is already in this same
  file: SKILL.md sec-PRR invokes scripts/ac_store/scan_ac_orphans.py by path from the
  skill for exactly the same reason.

  2026-09-07 (it-po): THE DIRECT-INVOCATION FAIL-OPEN, AND HOW IT IS CLOSED.
  Moving the check into the skill introduces a hole the previous design did not have.
  If the check exists ONLY in the skill pre-flight, then any caller who invokes the
  workflow directly -- Workflow({scriptPath: ".leafcutter/workflows/plan-feature.js"}),
  a real path that is used in practice, including as the documented way to defeat the
  workflow name-cache -- skips the check entirely and gets a run with no charter gate at
  all. That is strictly worse than the false halt this record removes.

  RESOLVED, not merely recorded: the halt is preserved by making the workflow fail
  closed on an ABSENT verdict. The pre-flight computes the verdict locally and passes it
  into the workflow through `args`, which is the only injected global that carries
  caller-supplied data and is therefore the only channel available under ADR-030. The
  workflow body reads that arg and nothing else -- no dispatch, no filesystem -- and
  halts before any authoring agent when the verdict is absent, malformed, or not the
  permitted verdict. A direct invocation supplies no verdict, so it halts. The
  requirement is written into it_requirements and covered by
  test_direct_workflow_invocation_with_no_preflight_verdict_halts.

  TWO RESIDUALS a reader should know about, neither of them blocking:
  (1) The guard is fail-CLOSED, not tamper-proof. A caller who fabricates a permitted
  verdict in args bypasses the registry read. This is the same trust boundary the
  pre-existing design had -- it trusted a status-checker agent's returned stdout -- so
  the move neither improves nor worsens it. It is not in scope here.
  (2) The absent-verdict halt is a NEW outcome of the startup path, and it is not one
  of the outcomes enumerated by ACD-2100b-1, -2 or -3. It satisfies ACD-2100b-4 (it
  stops the run before authoring work begins) but it widens the space those three
  records partition. Their reports must not be reused for it: an absent pre-flight is
  neither an unreadable registry, nor an uninterpretable one, nor a denied agent, and
  reporting it as any of those would re-commit the exact collapse KI-ACD-009 records.
  Whoever implements this should expect ACD-2100b-3-i's "the space is not closed by
  enumeration alone" point to apply here too.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
