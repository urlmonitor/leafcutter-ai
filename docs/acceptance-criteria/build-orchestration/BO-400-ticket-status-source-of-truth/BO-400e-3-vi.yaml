notes: |
  Requested by BrainCandy 2026-10-15 (KI-BO-20260930).

  PERMANENT, NOT INTERIM -- decided, with reasons. The KI frames "print and confirm" as a
  stopgap until scoping is mechanical. The two halves deserve different answers, so they are
  split: this record is the LISTING, BO-400e-3-vii is the CONFIRMATION.
    - The listing costs nothing at run time, needs no human present, and is the only place
      the person who owns the feature sees what was marked finished on their behalf. It stays
      useful after BO-400e-3-ii is mechanical: a correct derivation can still be pointed at
      the wrong branch, and an empty list vs a list of forty is information a person acts on.
      It is also what lets BO-400e-3-iii's second scenario and BO-400e-3-v's abort be
      reported in terms a person recognises.
    - The confirmation adds a human stop to every finalize; that is justified only while the
      derivation cannot be trusted (see BO-400e-3-vii).
