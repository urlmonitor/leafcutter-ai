test_spec:
- name: test_half_cleared_folder_with_files_is_refused_as_unverifiable
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: reachability
  description: "Runs the real maker CLI as a subprocess. ticket/epsilon is made by ensure, then its .git is deleted and src/app.py and notes.txt are added beside the record. remove with no token is refused (exit 2) stating the workspace was half-cleared and its remaining files cannot be checked against the shared project."
  proves_clause: "the request is refused, stating that the workspace was half-cleared and that its remaining files cannot be checked against the shared project"
  code_file: templates/scripts/worktree_remove.py
- name: test_refusal_lists_the_two_files_and_returns_a_token
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "The refusal lists exactly src/app.py and notes.txt (workspace-relative forward-slash, deterministic order) and carries a discard_token; the token is not found in stderr or in any file of the folder."
  proves_clause: "the refusal lists \"src/app.py\" and \"notes.txt\" by path and returns a one-time token bound to that folder and exactly those two files"
  code_file: templates/scripts/worktree_remove.py
- name: test_refused_half_cleared_folder_is_identical
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Snapshot with_git=True before and after the refusal and require equality."
  proves_clause: "\"ticket/epsilon\" is identical before and after"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that finishes a half-cleared folder holding files without a valid token"
  - "a maker that touches the folder while computing the token"
- name: test_valid_token_clears_and_lists_both_files_as_discarded
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "Repeat remove with the returned --discard-token: ok, the discarded files list both paths, nothing remains at the location."
  proves_clause: "when clearing is requested again with that token, it is answered cleared, the answer lists both files as discarded, and nothing of \"ticket/epsilon\" remains at its location"
  code_file: templates/scripts/worktree_remove.py
- name: test_token_goes_stale_when_a_file_changes
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Second run of the same setup: take the token, change notes.txt, remove with the earlier token; refused, and the folder snapshot is identical before and after that request. Variants: a file added and a file removed also invalidate it."
  proves_clause: "when, in a second run of the same setup, \"notes.txt\" is changed after the refusal, clearing with the earlier token is refused and \"ticket/epsilon\" is identical before and after that request"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a token bound to the folder path only, not to the file content digest"
  - "a token bound to the file names only, so a changed notes.txt still matches"
  - "a second token scheme unrelated to the BO-4300e-3 discard token"
