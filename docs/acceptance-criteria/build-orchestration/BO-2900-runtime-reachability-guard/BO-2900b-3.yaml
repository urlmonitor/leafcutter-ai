change_target: pipeline
risk_surface: contract_boundary
notes: |
  This AC defines "what counts as a caller" ONCE, for both directions of the
  bijection. BO-2900b-1 consumes it forwards (which registered capabilities have a
  caller) and BO-2900c consumes it backwards (which invocations name a capability that
  exists). It is placed under BO-2900b rather than duplicated in both trees; BO-2900c
  references it and must not restate it.

  WHY THIS IS A SEPARATE AC AND NOT A CLAUSE. Both directions of the bijection are only
  as good as this collection, and it is the component most likely to be implemented as
  a substring search — which fails in both directions at once and in opposite ways:
    - Forwards, a capability whose name merely appears in a log line looks called, so
      a genuinely stranded capability passes. That is the original defect, restored.
    - Backwards, a capability name inside a comment looks like an invocation of a
      capability that may not exist, so the reverse check raises a false alarm on a
      change that is correct. False alarms are how guards get switched off.
  Defining it once means one fixture set proves both directions.

  THE RENAME CLAUSE IS THE DECISIVE ASSERTION. "The collected set is unchanged when the
  comment, the message and the variable are renamed" is a property no substring-based
  implementation can satisfy, and it is cheap to test. Prefer it to any assertion about
  how the collection is implemented — the criteria constrain the outcome, and the IT PO
  chooses the mechanism.

  THE THREE DECOYS ARE CHOSEN, NOT ARBITRARY. A comment defeats a raw substring scan; a
  printed operator message defeats a scan that strips comments (the string is live code
  and genuinely executed); a local variable name defeats a scan that only looks at
  string literals. An implementation that handles two of the three is the likely
  half-finished state.

  Note for the implementer: an automation script invokes the command surface as a
  program, so the invocation crosses a language boundary. Do not assume the caller and
  the capability can be connected by a language-level reference; the connection is the
  argument the automation passes.

  2026-08-13 (IT PO enrichment). MECHANISM CHOSEN: locate the script's executed-command
  expressions and read the first positional token after the resolved surface path. This
  is the only reading that satisfies the rename clause structurally — the three decoys
  are then out of scope because they are not executed commands, rather than being
  filtered out one shape at a time. The variable-bound surface path (`${gateScript}`) is
  called out explicitly because it is the shape the real fast-lane-ship.js uses and the
  one a naive literal-only implementation drops silently.
