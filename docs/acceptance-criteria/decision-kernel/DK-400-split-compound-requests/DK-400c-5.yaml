roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a reader who wants to follow one split from its start to the gate,
  When they open the sequence diagram for proposing a split,
  Then it shows, in order: routing spotting a bundled request, the kernel asking the host for a
    proposal, the host's answer, the kernel setting aside proposals whose quotes are not in the
    request, the person's answer at the split gate, and the kernel releasing the approved parts,
  And it shows the run waiting on the host and then on the person, with no part run before the
    person's answer,
  And it shows the three endings of the gate as distinct: approved, rejected and ended blocked,
    and rejected and kept whole.
