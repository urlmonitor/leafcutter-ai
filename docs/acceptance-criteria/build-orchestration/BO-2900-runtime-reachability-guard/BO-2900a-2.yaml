it_requirements:
  config_schema_fragment:
    reach_record:
      type: object
      description: >-
        AMENDED 2026-09-30 (IT PO) — the single-process shape below replaced a
        narrower one that carried one target, one entry point, two booleans and
        one process, and could not express what BO-2900a-2-i/-ii/-iii require.
        This AC's criteria are unchanged; only the record underneath them grew.
        One record per (proof test, declared unit):
        { test_nodeid: str,
          unit: '<repo-relative source path>',
          entry_points: ['<repo-relative source path>:<callable>'],
          entered_entry_point: bool,
          reached_code: ['<repo-relative source path>:<qualname>'],
          reached_through: 'reached'|'not_reached'|'undecidable',
          undecidable_cause: 'subject_not_named'|null,
          observation: 'watched'|'unwatched',
          unwatchable_cause: 'non_python_child'|'isolated_interpreter'|'observer_displaced'|'recorded_nothing'|'propagation_failed'|'unknown'|null,
          observation_ok: bool,
          processes: [{ pid: int, ppid: int, program_file: str|null, spawned_under_entry_point: bool }] }.
        Four things changed and each is load-bearing.
        (1) target became reached_code, a SET derived from the run against the
        declared unit rather than a '<module>:<callable>' string looked up in a
        store field — no store field names a callable (surface_invoked: 271
        records, 368 occurrences, zero of that shape, 166 free prose), and asking
        the store for one is how target_spec="" arose (BO-2900a-2-iii).
        (2) reached_through became tri-state, so an unnamed question and an
        unwatched run stop being expressible as a plausible negative; the refusal
        path must test for the literal 'not_reached', never for falsiness.
        (3) observation_ok: bool became observation + unwatchable_cause; the
        boolean is RETAINED as a derived alias (observation == 'watched') only so
        existing call sites do not silently change meaning, and no new consumer
        may derive a verdict from it (BO-2900a-2-ii).
        (4) the record gained a processes list, because one test's run spans a
        tree of programs; ancestry is joined across the boundary by pid/ppid plus
        the entry-point frame live at spawn time, never by "both happened
        somewhere in the run" (BO-2900a-2-i).
        Identity everywhere in this record is a RESOLVED FILE PATH, never a module
        stem and never frame.f_globals['__name__'] — a script run as
        `python hook.py` reports '__main__', and .leafcutter/ and scripts/ hold
        same-stem copies of the same file.
  reference_file_path: "scripts/ac_store/done_proof.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "Create scripts/ac_store/run_observer.py exposing observe_test_run(test_nodeids, *, targets, entry_points) -> list[ReachRecord], and call it from done_proof.py's existing pytest-invocation path (_run_pytest_and_parse, scripts/ac_store/done_proof.py:206) so the proof is observed on the run that already happens — do not add a second pytest run per AC."
    - "THE MECHANISM MUST BE EXECUTION-DERIVED: a call-level recorder installed for the duration of the proof run (sys.monitoring on 3.12+, sys.setprofile fallback). No code path in the observer may read, parse, tokenize, import-for-inspection, or regex the test file's source. Decoy-immunity is then a property of the mechanism, not a filter that has to enumerate comment/docstring/dead-helper forms."
    - "Records must be attributable to a SPECIFIC test, not to the run as a whole (pytest dynamic contexts, or one observed subprocess per test file). A run-level record makes every test in a file inherit the reachability of its most thorough sibling."
    - "SELF-VALIDATION, FAIL LOUD. The recorder must confirm it observed at least one frame; an observation that recorded nothing returns observation_ok: false and is reported as 'observation unavailable', never as 'did not reach'. An observer that silently records nothing makes every test look like test Q and blocks the whole store; one that records everything makes every test look like test P and restores the original defect. Both are silent failures unless this flag exists."
    - "Overhead budget: the recorder must be installed only around the proof run and must not more than double the wall-clock time of a single-file proof run; done_proof already invokes pytest per AC in the required CI gate."
    - "scripts/ac_store/run_observer.py MUST be added to build_ac_store's deploy_map (scripts/build_phases.py:794) in the same change, or the deployed check_done_proof hook and the required CI done-proof job crash with ModuleNotFoundError."
    - "AMENDMENT 2026-09-30 (IT PO) — THE SHIPPED CODE VIOLATED THE HOSTING CONSTRAINT ABOVE AND MUST BE UNWOUND. 11b92057 added a second, bespoke non-pytest runner (_REACHABILITY_RUNNER_SCRIPT, scripts/ac_store/done_proof.py:433-557, driven by _observe_reachability) instead of calling the observation from _run_pytest_and_parse. That runner calls _test_func() with ZERO arguments (done_proof.py:522), so every proof whose test function takes pytest fixture arguments — 47% of an in-scope sample — cannot execute at all, and its verdict is therefore manufactured rather than observed. Retire it; do not widen it to the process tree. The hosting constraint is unchanged, not relaxed."
    - "AMENDMENT 2026-09-30 (IT PO) — FRAME IDENTITY IS A RESOLVED FILE PATH. The runner's spec f\"{frame.f_globals.get('__name__')}:{frame.f_code.co_name}\" (done_proof.py:479) cannot match a program launched as `python hook.py`, which reports __name__ == '__main__'. Match Path(frame.f_code.co_filename).resolve(); stem matching is also forbidden because .leafcutter/ and scripts/ hold same-stem copies of the same file."
    - "AMENDMENT 2026-09-30 (IT PO) — THE OBSERVATION SPANS THE PROCESS TREE AND CARRIES A THIRD STATE. observe_test_run's signature grows accordingly: the *targets* argument is replaced by the declared unit whose code set is derived from the run (no '<module>:<callable>' may be required from any caller or any store field), and the return records carry the amended shape above. Details and their tests: BO-2900a-2-i (span), BO-2900a-2-ii (unwatched), BO-2900a-2-iii (question well-formedness)."
