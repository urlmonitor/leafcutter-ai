created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124d.yaml"
criteria: |
  Given the staged set contains `components/ui/kit.tsx`, an in-scope screen
    component with no component-level declaration
  And its file header records the opt-out reason "Presentational primitives only
    (Card / Badge / Row). They render no criterion of their own — the consuming
    component declares."
  When the commit-tier declaration check runs
  Then the commit proceeds
  And the file's verdict is "pass-with-reason"
  And the check's report lists the file together with the reason text, rather
    than omitting the file

  Given the same file and the same reason
  When a reviewer reads the change that introduced the opt-out
  Then the reason text appears in the diff of that file
