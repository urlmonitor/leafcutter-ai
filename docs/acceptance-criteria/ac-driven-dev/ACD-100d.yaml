criteria: |
  Given the AC-driven development system has multiple scripts and agents,
  When the architecture documentation is reviewed,
  Then a C4 component diagram exists showing the key components and their relationships:
    - AC YAML store (data)
    - scan_ac_store.py (reads store, produces ready list)
    - ac_prioritizer.py (ranks ready list)
    - generate_ticket_from_ac.py (writes ticket, back-references AC)
    - mark_ac_done.py (closes loop after merge)
    - build-ac agent (orchestrates the above)
    - validate_ac_schema.py (guards on commit)
  And data flows between components are labelled,
  And the diagram distinguishes between build-time and commit-time components.
