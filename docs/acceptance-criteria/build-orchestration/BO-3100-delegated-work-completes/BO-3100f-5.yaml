notes: |
  Satisfies BO-3100f's documentation_triggers: [state-diagram].

  A state diagram is the right artifact here precisely because the defect is a
  vocabulary defect: the value of the picture is the absent transitions. The third
  scenario makes the absence of the drop-the-step escape a documented property
  rather than an omission a later reader fills in.

  The second scenario is what stops this being a picture of an intention — states
  and transitions are reconciled against what real runs record, in both directions.

  assigned_agent deliberately unset — the diagram surface belongs to the IT Product
  Owner's assignment pass.
