assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THE DECISION SET IS CLOSED AND MUST BE VALIDATED. Exactly three decisions plus an explicit not-yet-decided state. A free-text decision field, or an open enum, makes TQ-400d-2's arithmetic and TQ-400d-3's refusal both unenforceable. A value outside the set must be refused, never coerced and never silently accepted."
  - "NOT-YET-DECIDED MUST BE A REPRESENTED STATE, NOT AN ABSENT FIELD. An undecided record and a record nobody has looked at must be distinguishable — that distinction is what TQ-400d-3 then enforces, and it is unenforceable if 'undecided' is encoded as absence."
  - "SET-EQUALITY WITH THE SWEEP'S UNPROVEN POPULATION IS THE CONTRACT, IN BOTH DIRECTIONS. No record of the sweep's unproven population may be missing, and no record may be present that the sweep did not classify unproven. Test both directions: a list that silently shrinks and a list padded with everything are different defects and each passes the other's test."
  - "EXEMPT AND PROVEN RECORDS MUST BE EXCLUDED BY CONSUMING TQ-400e-3'S OUTCOME, NOT BY A LOCAL RULE. Re-deriving 'is this exempt?' here creates a second exemption reader that will drift from the one TQ-400e-4 guards. The 37 records that carry a test-free declaration today must leave the pile because the sweep classified them exempt, not because this list filtered them."
  - "SCALE IS 259 RECORDS AT AUTHORING TIME (measured 2026-08-17: 259 of 641 done L2/L3 records have no test carrying their coverage tag), minus whatever the exemption path legitimately removes. The list must be usable at that size — ordered deterministically so two readers see the same list, and carrying enough per-record context (the oracle's reason, the record's component) to triage without opening each file. NOTE (BA, 2026-08-18): this figure is one of THREE recorded counts of the same pile and is not reconciled with TQ-400's own 240 of 641 on the same date. The inclusion-rule clause added to criteria requires the built list to state which count it continues; the IT PO should not treat 259 as settled."
  - "Must handle errors gracefully per the project error handling policy: a record whose decision state cannot be read must be reported and must remain in the awaiting-decision population — never dropped, and never defaulted to a decision."
delivers_to:
  - agent: python-coder
    contract: "The triage list for a completed run: one entry per unproven record, each carrying {ac_id, outcome_reason, decision: prove|redo|retire|not_yet_decided}, plus the stated count of entries in the not_yet_decided state, plus the list-level inclusion-rule record {enumerated_root, levels_included, unproven_rule, identifier_normalisation, measured_at, continues_count}. Consumed by TQ-400d-2 (progress arithmetic), TQ-400d-3 (the clear-refusal gate operates on these entries) and TQ-400d-4 (which constrains how the list is derived)."
expects_from:
  - ac_id: TQ-400e-3
    contract: >-
      The honoured-exemption outcome. Records legitimately declared test-free must
      already be separable, or the triage pile fills with work nobody should triage
      and the exercise is abandoned. Consumed as the sweep's per-record 'exempt'
      classification — never re-derived here.
  - ac_id: TQ-400a-4
    contract: >-
      The durable per-run inventory of every evaluated record and its verdict. The
      unproven population is read from it; TQ-400d-4 makes that derivation
      obligation falsifiable.
test_spec:
  - name: test_tq_400d_1_every_entry_carries_a_decision_or_an_explicit_undecided_state
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Over a real run, assert every triage entry carries one of the three fixed decisions or the explicit not-yet-decided state, that the awaiting count equals the number in that state, and that 'undecided' is a present value rather than an absent field. Assert a value outside the closed set is refused."
  - name: test_tq_400d_1_list_membership_equals_the_sweep_unproven_population_both_ways
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "REAL PRODUCER INTO REAL CONSUMER. Take the sweep's actual unproven set and the actual triage list and assert set-equality in BOTH directions. Include in the same store a proven record and an exempt record (test_required: false with a reason) and assert neither appears — the exempt exclusion must come from the sweep's classification, verified by flipping that record's declaration and observing it enter the list."
  - name: test_tq_400d_1_empty_unproven_population_yields_a_stated_empty_list
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "A store in which every finished record is proven or exempt produces a triage list that explicitly states zero awaiting a decision, rather than omitting the list or the count. An omitted list is indistinguishable from a list that failed to compute."
  - name: test_tq_400d_1_triage_list_is_produced_by_the_real_sweep_entry_point
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT. Fire the sweep entry point as a subprocess and read the triage list artifact it actually wrote to disk. A correct list-builder function that no production path calls is the reachability gap this repo has hit repeatedly (BO-2400f-7..10)."
test_rationale: |
  The two completeness clauses are the load-bearing ones and they fail in opposite
  directions: a list that silently shrinks and a list padded with everything each pass the
  other's test, so set-equality must be asserted in both directions in one test. The exempt
  exclusion is a seam, not a filter — the whole point of sequencing this AC behind TQ-400e-3
  is that the exemption verdict is made once, by the sweep, and consumed here; the flip-the-
  declaration mutation is what proves consumption rather than a local reimplementation. The
  empty case gets its own entry because at a starting population of 259 nobody will exercise
  it naturally, and it is the state the feature is supposed to eventually reach.

  BA NOTE (2026-08-18): the inclusion-rule clauses added to criteria are NOT covered by the
  four entries above and need two more from the IT PO — (1) a criterion-angle test that the
  emitted list carries its inclusion-rule record with every field populated, and that a list
  emitted without it is refused rather than published; (2) a data-shape test that a finished
  record whose identifier is written with surrounding quotes is matched to its coverage tag
  and therefore does NOT enter the pile. The second must use a real quoted identifier from
  the store, not a hand-typed fixture — this is the exact bug that mis-counted four records
  in the shipped ratchet, and a synthetic bare-token fixture reproduces the blind spot.
