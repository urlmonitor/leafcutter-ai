assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Root cause is a self-defeating interaction, not a missing check: scripts/ac_store/mark_ac_done.py --ac <ID> --test-root unit_tests runs pytest to enforce its coverage gate but does not set AC_ENFORCE_STRICT=1, so the repo's pytest_ac_enforcement plugin xfail-masks the very tests the gate is about to read — the AC is still work_status: todo at that moment, which is precisely when marking done matters"
  - "The verification run the gate performs must not be subject to the plugin's not-yet-done masking; the gate is the authority deciding done-ness, so it cannot consume a result the plugin has already downgraded on the basis of the not-yet-updated status"
  - "Do NOT fix this by making the tool ignore xfail outcomes generally — that would contradict BO-2500a-2-i (an xfailed or skipped linked test does not count as passing). The distinction to preserve is between an outcome the enforcement plugin produced by masking a passing test and an outcome produced by a test that genuinely did not pass"
  - "Requiring the operator to prefix an environment variable is not an acceptable fix; the normal documented invocation must succeed. Verified 2026-08-13: the identical invocation with AC_ENFORCE_STRICT=1 prefixed succeeded immediately ('marked GE-118b work_status=done') while the unprefixed one exited 3 with 'REFUSED: <ID> is not eligible for done — linked test xfail: <nodeid>'"
  - "Both marking paths must agree: the pre-commit done-proof check and the CI done-proof gate must reach the same verdict as the tool for the same tree, or an AC marked done locally will be rejected at merge"
  - "Verify behaviorally — run the real tool against a real not-yet-done AC in the real store whose covering test genuinely passes, in a fresh process with no environment overrides, and assert exit zero and the store write; do not grep the tool's source, and do not use a fixture AC that is already done"
  - "Must follow the repo error-handling policy: specific-exception try/except around subprocess, file and YAML I/O, log at WARNING or higher or re-raise; no bare or silent excepts"
