title: "A reference page for test-free declarations explains the waiver and the two meanings of the reason field, and the guides point to it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a new reference page for test-free declarations, and the three pages a
    person reads to prove a requirement done: the how-to for proving a requirement
    done, the how-to for done-proof enforcement, and the architecture page on
    phantom-done prevention,
  When a reader looks up why a finished requirement with no covering test was, or
    was not, accepted as done,
  Then the reference page states that a test-free declaration with a stated reason
    lifts the covering-test rule and that one without a reason is refused,
  And it states the two meanings of test_rationale as two separate statements:
    with test_required false it is the reason no test can prove the record;
    alongside test_spec it justifies the shape of that test contract,
  And it links to the exemption rulebook (TQ-400e-6) for when a declaration is
    honoured, when it is refused and which records may carry one, and does not
    carry its own list of those conditions,
  And each of the three guides links to the reference page instead of explaining
    the waiver itself,
  And the field reference for the store's record fields has a single one-line
    entry for test_rationale that links to the reference page, and the field
    reference is no longer than it was before the change,
  And the reference page and the store schema's description of test_rationale
    state the same two meanings,
  And a reader who writes a declaration from the reference page alone produces one
    the commit-time record check and the done gate both accept.
depends_on: [BO-2500a-8, BO-2500a-8-i]
