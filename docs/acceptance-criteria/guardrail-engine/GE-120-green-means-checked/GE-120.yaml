readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Green means it was checked — never "it could not run".

  The automatic checks that protect your work must be able to tell you the
  difference between "I looked and found nothing wrong" and "I could not look at
  all". Today a check that cannot reach what it needs can still report success,
  so a clean result is indistinguishable from a check that did nothing — the
  exact "looks finished, was never verified" failure this project exists to
  prevent, happening inside the protection itself. After this goal, every check
  either does its job or says plainly that it could not, it reaches the same
  verdict wherever you are working, and that sameness is proven by exercising
  the checks the way people actually use them.
