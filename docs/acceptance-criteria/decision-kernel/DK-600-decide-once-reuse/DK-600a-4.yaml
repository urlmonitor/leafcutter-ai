  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-forming    step    research-options
    leafcutter/decision-forming    step    assess

  DERIVATION. Two forming steps folded into one L2 under the five-L2 cap: the
  targeted research round exists to feed the assessment (scenario research-options:
  "evidence ... retrieved before assessment"), and the budget-reserve branch
  (DK-600a-4-i) is a decision about both together. Ranking order taken from
  docs/how-to/run-the-decision-kernel.md (ranked question). 4 options and 5
  criteria (3 required, 2 supporting) match dec-d53e1c52cd47c832.

  STANDING RULE carried from DK-600a: the ranking produced here is input to
  DK-600b and is never itself a decision.

  IT-PO BUILD STATUS (2026-10-02, unverified): built and tested, with two wording
  caveats for the BA. (1) Sufficiency is judged per criterion (5), satisfaction per
  option and criterion (20). (2) A first assessment precedes the targeted round; the
  ranking uses the assessment after it. Untested: the supporting-mean tie-break.
