title: "The writer reads the target before writing it, and reports which of three things it did"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given documentation-expert is dispatched against a contract line naming an owned target, and
    that target already exists and already states what the line's content constraint requires,
  When it runs,
  Then it reads the target before deciding to write anything, makes no edit to it -- the file's
    bytes are identical before and after the run -- and reports the outcome as
    "target already satisfied".

  And given the same contract line but a target that exists and is missing only the cross-links
    the contract requires,
  Then only those cross-links are added; the rest of the file is unchanged, and the outcome is
    reported as "target updated", naming what was added.

  And given the same contract line but a target that does not exist, or that exists without the
    information the content constraint requires,
  Then the document is authored or extended so it states that information, and the outcome is
    reported as "target authored".

  And the three outcomes are distinguishable from the sign-off alone -- "already satisfied",
    "updated", and "authored" are three states, not two. The existing binary record of whether a
    document was written cannot express the first one, and collapsing it into either neighbour
    loses the distinction the verifier needs.

  And "I decline to write this because another record owns it" is not among the outcomes and is
    not a valid sign-off: a contract line only reaches this agent for a target the record owns, so
    an owned, unsatisfied target that goes unwritten is a failure, reported through the failed
    sign-off path rather than raised as an open question and left green.
