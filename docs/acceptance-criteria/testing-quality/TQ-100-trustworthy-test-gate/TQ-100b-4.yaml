assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The narrowing must be applied at the single canonical definition of the coverage-tag pattern in scripts/ac_store/test_enforcement.py, so every consumer inherits it. Do not add a second filtering layer at one call site in done_proof.py — a per-call-site filter creates a third vocabulary and is exactly the drift TQ-100b-5 exists to catch."
  - "The resolved-tag set is a protected invariant. Measured baseline at HEAD 339b0981c: 2,328 tag records over 680 distinct ids, of which 600 resolve. A change that reduces the resolved count or alters its content is a regression, not a narrowing; the resolved side must be asserted directly, never inferred from the unresolved count falling."
  - "The id-shape rule must be expressed once and shared rather than duplicated per reader. scripts/commit_guardian/check_test_ac_tags.py already applies a stricter, incompatible shape rule (exactly three digits after the prefix, so AC-1 does not match there but must remain listed here). Choose one rule, put it where both readers can use it, and land it on both — TQ-100b-5 is the parity axis for this."
  - "Evidence must come from running the reader over the committed unit_tests/ tree. A check that inspects the pattern's source string, or that merely asserts a shape-validating helper exists, does not satisfy any criterion in this AC."
  - "scripts/ac_store/ ships through build.py's build_ac_store deploy_map. If the narrowing introduces a new module or a new import, add it to that deploy map in the same change — a deployed hook importing an undeployed module raises ModuleNotFoundError, and the done-proof gate is a required check, so that blocks every merge."
  - "Scanning cost must not regress: today's reader makes one regex search per line in a single pass per file, and the scan runs inside the commit-time done-proof path. Any shape or position test must stay inside that single pass over each file."
  - "The scan result must be deterministic and independent of filesystem walk order: the same tree yields the same record set and the same unresolved list on every run, and under pytest-randomly."
  - "Re-tagging the 16 surviving genuine dangling ids is explicitly OUT of scope. This change must not edit any test file's tags; if a run of the narrowed reader would require a tag edit to pass, that is a signal the shape rule is wrong, not that the tag is."
test_spec:
  - name: test_unresolved_covers_captures_over_committed_tree_are_all_id_shaped
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Run the project's own scanner over the committed unit_tests/ tree — not a hand-typed fixture — and assert every unresolved capture is AC-id-shaped. The input that produces today's 64 artifacts is the repo's own tag-mechanism test files; the test must walk the real tree containing at least ac_store/test_done_proof_js.py, ac_store/test_done_proof_composite.py, ac_store/test_bo2500a_done_proof.py, ac_store/test_pytest_ac_enforcement.py, commit_guardian/test_bo2500b_done_proof_hook.py, commit_guardian/test_check_test_ac_tags.py, commit_guardian/test_done_proof_excludes_fixtures.py and build_orchestration/test_bo2400a_fast_lane.py, and assert the named artifacts are absent: the bare \" and ' characters, {ac_id}, {self.child_a_id}, {nonexistent_id}, <AC-ID>, <id>, <deprecated-id>, the, tag, tags, config, a, fail-open, Finding."
  - name: test_resolved_tag_set_is_unchanged_by_the_narrowing
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Over the same committed tree, assert the resolved ids and their record count match the pre-change baseline (2,328 records / 680 distinct / 600 resolving) exactly, and that the surviving unresolved list is a proper subset of today's 80 with at most 16 members. Falsifies the failure mode where the narrowing also silently drops resolved tags."
  - name: test_done_proof_verdict_lists_only_id_shaped_dangling_tags_via_its_entry_point
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "Invoke the done-proof scan through its production entry point as a subprocess over the real tree and assert the dangling list in the emitted verdict contains only id-shaped values. Proves the narrowing is reached by the path the gate actually runs, not only by a directly-imported helper; deleting the single line that wires the shape test into the scan must turn this red."
  - name: test_deployed_done_proof_copy_applies_the_narrowing
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: deployed
    description: "Run build.py into a temp target, then exercise the DEPLOYED scanner over a real tree and assert the same narrowed result. Catches a narrowing that lands in the source tree but not in what build.py deploys, and a new import missing from the build_ac_store deploy map — the failure that would block every merge once the done-proof gate is required."
delivers_to:
  agent: python-coder
  contract: "A dangling-tag set containing only id-shaped captures read from real tag positions. This is the input TQ-100b-1-ii treats as enforced-and-flagged, and the input TQ-100c-2's pre-pytest linkage-integrity check reports. BUILD ORDER: this AC must be delivered BEFORE TQ-100b-1-ii is built; TQ-100b-1-ii built on today's reader would fire on all 80 of today's unresolved captures, 64 of which are not tags."
