  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL: it is the last record in the GE-126b branch and its output is reference prose.
  Nothing in this tree reads the reference; GE-126e-5 writes to the same reference file
  but is a separate measurement published later and does not consume this page. DO NOT
  REFILL.

  AGENT — documentation-expert, two documentation surfaces. Verify both pages are on
  disk before accepting the sign-off.

  THE SAME-STRINGS REQUIREMENT IS THE ONE TECHNICAL ADDITION HERE that the BA could not
  see. The check emits machine-readable outcome values; the reference publishes answer
  names. If those are two vocabularies, a caller matching on the published name gets
  nothing and both sides pass their own tests. The third test descriptor compares the two
  populations directly, which is the ACS-100i-9 shape applied to a doc-versus-code pair
  rather than to two code entry points.

