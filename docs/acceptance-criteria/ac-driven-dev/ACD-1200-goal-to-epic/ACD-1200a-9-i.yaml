assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Basename collision within the epic folder must resolve deterministically: overwrite the existing epic-folder path in place rather than minting a renamed sibling or a second copy elsewhere — the same input must always converge to the same single file."
  - "The collision path must emit a report/log line at an appropriate severity stating the existing file was replaced, so an overwrite is observable and not silent."
  - "After the run, exactly one ticket file with that basename must exist for the leaf AC (at the epic-folder path), and the AC's implemented_by must name that single path — consistent with ACD-1200a-9. Wrap the overwrite I/O per the project error handling policy."
delivers_to: null
expects_from:
  ac_id: ACD-1200a-9
  contract: "The single-location epic-folder write contract from ACD-1200a-9; this edge case specifies how a pre-existing basename at that epic-folder path is resolved (deterministic in-place overwrite, no second location)"
