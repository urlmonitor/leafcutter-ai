test_rationale: "Test file: unit_tests/commit_guardian/test_acs_900d_4_iv_retired_child_composite.py. There are two composite paths, pre-commit and CI, and they have diverged before (KI-ACS-016), so every scenario asserts both. The zero-live-children pair (refused without its own tag, passes with it) pins user decision 2 against both wrong versions: vacuous proof, and the current unconditional refusal."
