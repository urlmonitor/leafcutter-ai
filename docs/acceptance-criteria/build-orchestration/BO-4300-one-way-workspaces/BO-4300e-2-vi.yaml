id: BO-4300e-2-vi
title: "A half-cleared workspace that still holds files is finished only when their loss is authorised"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" whose landing place holds the folder "ticket/epsilon",
    left by a clearing that stopped part-way, whose repository is gone and which
    still holds its workspace record naming shop and the files "src/app.py" and
    "notes.txt",
  When clearing "ticket/epsilon" is requested with no authorisation to lose work,
  Then the request is refused, stating that the workspace was half-cleared and
    that its remaining files cannot be checked against the shared project,
  And the refusal lists "src/app.py" and "notes.txt" by path and returns a
    one-time token bound to that folder and exactly those two files,
  And "ticket/epsilon" is identical before and after,
  And when clearing is requested again with that token, it is answered cleared,
    the answer lists both files as discarded, and nothing of "ticket/epsilon"
    remains at its location,
  And when, in a second run of the same setup, "notes.txt" is changed after the
    refusal, clearing with the earlier token is refused and "ticket/epsilon" is
    identical before and after that request.
depends_on: [BO-4300e-2, BO-4300e-2-v, BO-4300e-3, BO-4300e-3-i]
