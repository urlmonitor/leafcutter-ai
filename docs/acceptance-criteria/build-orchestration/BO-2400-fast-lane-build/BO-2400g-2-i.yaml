notes: |
  THE PHANTOM-REVIEW EDGE. BO-2400g-2 requires the reading to be substantive. This L3
  covers what happens when it cannot be: the case where the step runs, examines
  nothing, and — if nobody specifies otherwise — reports the cheerful emptiness that
  every other consumer will read as "reviewed, clean". That is the phantom-done
  pattern applied to a gate rather than to work, and it is the single most likely way
  this whole L1 ships as decoration.

  WHY IT IS AN L3 AND NOT A CLAUSE ON THE PARENT. The parent's fourth clause already
  requires an examination that could not run to be named. This L3 is the harder,
  distinct case where NO examination could run at all — there is no partial result to
  qualify, only an empty one, and the natural implementation emits exactly the same
  object it emits for a clean run. The parent's tests all pass on that implementation.

  THREE STATES, NOT TWO. passed / found-something / did-not-happen. The lane already
  distinguishes pass from fail (it has a release-on-failure path for every phase — see
  release-on-coder-fail at templates/workflows-js/fast-lane-ship.js:424). The third
  state is the one being added. Do not collapse "did not happen" into "failed" either:
  a failed reading is a reading that produced a verdict the run must act on, while an
  unperformed reading produced no information at all, and BO-2400g-4's severity ladder
  needs to tell them apart.

  DELIBERATELY NOT SPECIFIED HERE. Whether an unperformed reading stops the run is
  BO-2400g-4's decision, not this AC's — this AC only requires that the run tells the
  truth about what happened. Also out of scope: the empty-connected-set case, which is
  already owned by BO-2400f-2 ("Readiness-agnostic selection; empty connected set is a
  clean no-op"). The case here is a run that DID resolve work and DID build, and then
  found the inputs to its reading unavailable.
