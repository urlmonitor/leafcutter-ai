it_requirements:
  config_schema_fragment:
    type: object
    description: "Context snapshot captured at pause time and stored with the pending-question record."
    properties:
      work_done_so_far: {type: object, description: "e.g. the ACs/artifacts produced so far"}
      proposal: {type: object, description: "the proposed change/diff summary"}
      decision_summary: {type: string, description: "one-line summary of the decision being asked"}
    required: [work_done_so_far, proposal, decision_summary]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "all"
  required_skills:
    - llm-expert
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: implemented in the E2 workflow ENGINE (JavaScript). The context snapshot is assembled in the JS gate at pause time from values already in the workflow body's scope and handed to the persist agent() dispatch, which writes it into the record's context field. This is JS in the workflow files plus the agent-mediated write, not a standalone Python module."
    - "FEASIBILITY (E2 body has no filesystem access): the context snapshot is captured in-body at pause and persisted via the persist agent() dispatch to .leafcutter/paused_runs/<run_id>.json (the dispatched agent may use a small Python helper for the JSON write); the workflow body performs no direct fs write."
    - "The context payload must be captured as a snapshot at the moment of pause (not re-derived at answer time), so it remains correct when the answerer returns much later (see durability BO-2300e-1)."
    - "The context must include what the run has done, what it proposes, and the decision being asked, and must be persisted with the pending-question record."
    - "Context capture must not include secrets/credentials; snapshot only the decision-relevant artifacts."
    - "E2 top-level-body form (ADR-017); deployed/template parity via build.py (ADR-001)."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js); assert the persist agent() call args carry a context payload { work_done_so_far, proposal, decision_summary } captured at pause time. Do NOT test a standalone Python module."
  delivers_shape:
    description: "The context snapshot this AC establishes populates the record's context field from BO-2300a-1."
delivers_to:
  agent: llm-expert
  contract: "Context snapshot object { work_done_so_far, proposal, decision_summary } captured in-body at pause time and written via the persist agent() dispatch into the pending-question record's context field (.leafcutter/paused_runs/<run_id>.json); presented to the answerer alongside the question. Consumed by apply/resume (BO-2300d-1) and durability (BO-2300e-1)."
expects_from:
  ac_id: BO-2300a-1
  contract: "The pending-question record into whose context field this pause-time snapshot is written (via the persist agent() dispatch)."
test_spec:
  - name: test_context_captured_at_pause_time
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via run_workflow_under_e2, the context in the persist agent() call args is a snapshot taken at pause time, not re-derived when the answer is submitted."
  - name: test_context_includes_work_proposal_decision
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, the context payload includes what the run has done, what it proposes, and the decision being asked."
  - name: test_context_persisted_with_question
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, the context snapshot is persisted alongside the pending-question record (present in the persist agent() dispatch payload)."
  - name: test_context_presented_to_answerer
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, the context payload is presented to the answerer alongside the question."
