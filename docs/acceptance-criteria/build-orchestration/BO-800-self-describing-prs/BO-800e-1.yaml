criteria: |
  Given a ticket's source_ac is BO-200a (level: L1)
    and the depends_on chain resolves to BO-200 (level: L0)
    and BO-200.yaml has:
      title: "Every delivery is all-or-nothing"
      id: BO-200
    and the AC file is located at:
      docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200.yaml,
  When the pull-request agent assembles the PR body,
  Then the PR body contains a line:
    "**Goal:** [BO-200: Every delivery is all-or-nothing](docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200.yaml)"
  And the line appears above the Summary section
  And the path in the link is relative to the repository root
  And a reviewer can navigate to the L0 AC in one click from the PR.
