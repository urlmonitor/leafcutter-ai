estimated_complexity: L
it_requirements:
  - "entity_context config owns defaults: max_caller_chars12000,max_lookups64,max_entities16,max_ambiguity_candidates3,max_meaning_chars300,max_serialized_chars8000,max_unknowns8,max_unknown_chars128,max_seconds2.0; config model/default JSON/exported schema must agree."
  - "The 8000-character bound applies canonical compact meaning serialization including metadata/counters/limitations, not the separate full goal, caller claims or full checkpoint match lists."
  - "Ambiguity alternatives count as identities in the global cap. Explicit unresolved records share the same serialization allowance."
  - "Counts must expose every bound-induced reduction; simple single-family cases have exact deterministic counts, while ambiguous expansion need not satisfy an invented detected=resolved+unknown equation."
