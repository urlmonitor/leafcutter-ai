title: "A product-truth stage commit refuses to run against the main branch"
component: ux-prototyping
level: L3
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given a product-truth stage is ready to commit,
  When the authoring worktree's current branch is main (or the branch cannot be
  confirmed to be non-main),
  Then the commit is refused fail-closed with an error,
  And the commit agent is never dispatched,
  And no product-truth files are written to main.
depends_on:
  - UXP-545
