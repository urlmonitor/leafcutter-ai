  - name: test_both_drivers_decide_a_resolved_handoff_identically
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Run the same record through the epic driver and the single-ticket driver and assert identical decisions across all the cases above -- the twin seam BO-400a-2-ii exists to hold closed."
