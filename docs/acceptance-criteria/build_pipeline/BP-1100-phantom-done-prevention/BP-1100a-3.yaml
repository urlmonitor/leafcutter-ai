criteria: |
  Given a requirement that names, in its own record, the runnable file where the
  behaviour it describes will change, and names it ahead of everything else the
  requirement references,
  And the same requirement also references, elsewhere in that record, files it will
  NOT change — pages that only explain the behaviour, and neighbouring requirements
  it must not contradict,
  When a ticket is generated from that requirement,
  Then the surface the generated ticket names as this work's own contains the runnable
  file where the behaviour will change,
  And it contains every other file the requirement says will change,
  And when the requirement offers no way to tell which of the files it references will
  change, the generated ticket states that its surface could not be determined, in a
  place the person driving the ticket reads before dispatching a coder — rather than
  quietly emitting a surface assembled from whatever paths the requirement happened to
  mention.
