id: BO-3100d-1
title: "Every behavioural claim in the delivery record is paired with a check that exercises it, and a contradicted claim fails"
component: build-orchestration
components:
  - documentation_system
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the recorded account of how this system hands work to specialists,
    And the claim it currently makes that a dispatch issued from inside a dispatched agent
    does not execute and raises no error,
  When that claim is exercised — a dispatch is issued from inside a dispatched agent and the
    outcome observed,
  Then the observed outcome is that the dispatch executes,
    And the claim is reported as contradicted by observation.

  Given the record after it has been corrected to state that a dispatched agent cannot wait
    for a result, because emitting text without acting ends that agent and the text becomes
    its result,
  When that claim is exercised — a dispatched agent emits text without acting, and what the
    dispatcher receives is observed,
  Then the observed outcome matches the claim, and the claim is reported as confirmed.

  Given the corrected record,
  When a claim it makes about dispatch behaviour has no check that exercises it,
  Then that claim is reported as unchecked, so an unverifiable assertion is distinguishable
    from a verified one.
