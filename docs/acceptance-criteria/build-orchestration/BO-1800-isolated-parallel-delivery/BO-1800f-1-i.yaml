notes: |
  Why unverifiable must mean stop here, and why the opposite answer is right
  elsewhere. This is a deliberate divergence from BO-900a-1-i, which specifies that
  an unreachable remote counts as zero divergence and the drive continues. Both are
  correct in their own context, and the difference is what the check is for:

    - BO-900a-1-i guards an advisory mid-epic warning. Its worst failure is a
      warning that does not appear; the work is unaffected and the user can still
      act. Failing open there buys uninterrupted progress at negligible cost.
    - This record guards the last point before work leaves the copy. Here
      "unreachable" and "nothing to worry about" are not the same answer, and
      treating them as the same is precisely the shape of defect BO-1800f exists to
      remove: a check that examined nothing must not be reported as a check that
      found nothing. Failing open at a delivery gate converts the gate into a
      formality on exactly the occasions when the shared branch's state is unknown.

  Neither record should be changed to match the other without deciding that question
  on purpose; BO-1800f's notes carry the same flag so that whoever unifies them does
  so deliberately.

  Falsifiability. The fixture makes the shared branch unreachable at delivery time
  while a locally-recorded earlier state is present and usable. An implementation
  that silently falls back to that local state proceeds and fails this record; the
  assertions are that nothing left the copy and that the copy's commits are
  unchanged, both observable on the fixture afterwards.
