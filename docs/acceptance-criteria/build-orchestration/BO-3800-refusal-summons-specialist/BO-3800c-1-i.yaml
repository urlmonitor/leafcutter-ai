notes: |
  WHY THIS EDGE EARNS A RECORD WHEN MOST DO NOT. Because its wrong answer is the HELPFUL one
  and will be written by default. Faced with a disposition naming the specialist and a
  demand that did not arrive, the obvious implementation engages the specialist anyway —
  with the demand omitted, or with a placeholder, or with a number recovered by re-running
  the standard. All three produce a run in which the right party is engaged, the change is
  held, delivery is retried, and BO-3800b-1 and BO-3800a-1 are both fully green, while the
  specialist answers a question nobody asked. GE-127f-2-i exists for exactly this shape one
  layer down; BO-3000a's refusal behaviour is the same discipline one field over. Without
  this record the parent's last arm is defeated by the case it never sees.

  THE SECOND ARM IS NOT DECORATION. "Read and said nothing usable" versus "could not be read
  at all" is the distinction BO-3000a insists on for a phase reply and BO-400a-2-iii for the
  ticket record. Collapsed into one message, the reader cannot tell a refusing standard that
  is emitting a malformed outcome from one that is not being reached at all — which is the
  difference between a bug in the guardrail and a bug in the wiring, and the two are fixed
  in different components.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT.

  THE HELPFUL DEFAULT. MUTATION: when a refusal states the specialist disposition but
  carries no usable demand, engage the specialist anyway, with the demand omitted from the
  brief.
  MUST GO RED: the no-specialist-engaged arm and the run-stops arm.
  MUST STAY GREEN: every arm of BO-3800c-1 — a well-formed refusal still carries the file
  and the demand intact and still moves when they move — and every arm of BO-3800b-1,
  BO-3800a-1 and BO-3800e-1. That green half is the evidence that this record is a floor
  under its parent rather than a restatement of it.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs
  after this pass.
