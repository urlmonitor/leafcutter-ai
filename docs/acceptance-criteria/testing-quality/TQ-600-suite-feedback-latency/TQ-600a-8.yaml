  - path: .github/workflows/ci.yml
    relationship: modifies
    status: exists
    relevance: >-
      Where the examination becomes "one of the checks a change to this repository
      must pass". A new job here, wired as a required status check, is the gate the
      final criterion demands. This repository already gates on CI jobs of exactly
