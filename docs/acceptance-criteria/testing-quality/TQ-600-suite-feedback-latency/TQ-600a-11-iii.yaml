notes: |
  ==========================================================================
  THE RETIRED TEST CONTRACT (moved here from test_spec, 2026-10-09).
  NONE OF THIS IS WORK WAITING TO BE DONE. DO NOT AUTHOR ANY OF THESE TESTS.
  ==========================================================================
  test_spec is now null and test_required is false. The three descriptors below stood
  in test_spec until this retirement; they are recorded here because that field is a
  present-tense instruction to test-writer and these describe a contract against a
  comparison that is itself retired.

  (1) test_tq600a_11_iii_a_genuinely_divergent_input_makes_the_comparison_fail
      — integration / failure. With the divergent input in the compared set, the
      comparison exited non-zero, named the input, named the differing path, and
      printed both values. Asserting on the MESSAGE and not only the exit status was
      deliberate: "exits non-zero" alone is satisfied by a crash.

  (2) test_tq600a_11_iii_the_same_comparison_without_that_input_is_clean
      — integration / criterion. The paired control: same comparison, same store,
      input removed, clean result and exit zero. The PAIR is the point — a single
      red run is also what a broken harness looks like, so only running it both ways
      shows the red is attributable to the input.

  (3) test_tq600a_11_iii_the_chosen_input_is_observed_to_diverge_under_the_installed_library
      — unit / boundary. THE REUSABLE ONE, AND THE REASON THIS RECORD EXISTED AT ALL.
      Parse the chosen input directly with both parsers and assert the two objects
      are UNEQUAL. This is the guard on the guard: if a library upgrade makes the two
      agree on that input, this descriptor goes red and names the problem, instead of
      the can-fail demonstration quietly becoming a can-not-fail test that is green
      forever. THE CONSTRUCTION IS GENERAL AND NOT ABOUT YAML: any test whose job is
      to prove that some check CAN fail is built on an input assumed to trigger the
      failure, and that assumption decays silently. Assert the assumption directly,
      in the same suite, or the demonstration rots into a tautology without anyone
      being told.

  THE ORIGINAL test_rationale, PRESERVED BECAUSE ITS OPENING IS THE WHOLE IDEA. "An
  equivalence check over 4,635 records that reports no disagreement is the most
  reassuring possible output and the least informative one, because it is what both
  a working check and a check over an empty set produce. This repository has three
  documented instances of exactly that confusion, all recorded in its own CLAUDE.md."
  And on the third descriptor specifically: a can-fail demonstration built on an
  input the installed library resolves identically under both parsers "is green
  forever and proves nothing — and it would be green on the day it was written, so
  nobody would look again."

  Scope boundary worth stating because it is tempting to widen: this record does NOT
  require the two parsers to be made to agree on the divergent input. It requires the
  comparison to NOTICE. Whether a given divergence matters to this store is a
  question TQ-600a-11-ii answers over the real population; this record only
  establishes that the instrument has a needle.
