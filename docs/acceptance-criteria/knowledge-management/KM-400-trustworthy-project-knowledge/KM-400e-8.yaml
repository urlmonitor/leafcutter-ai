id: KM-400e-8
title: "An unset required backend setting fails loudly instead of being guessed"
component: knowledge-management
components: [knowledge_management]
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-400e
criteria: |
  Given the knowledge backend requires a database name and a username
  And the target is a hosted instance whose database and username are both named after its instance identifier
  And neither setting is declared in the environment, in the job configuration or in the backend configuration
  When the synchronization job starts
  Then it fails before attempting a connection
  And the failure names each unset required setting individually
  And no value is substituted for an unset required setting

  Given only the database name is unset
  When the synchronization job starts
  Then the failure names the database name as the unset setting and does not name the username
  And it does not proceed using a conventional or instance-independent database name

  Given a database name is declared but does not exist on the target instance
  When the synchronization job connects
  Then the backend's rejection is reported together with the database name that was requested and the configuration source it was read from
  And the failure is not reported as an absence of knowledge or as an empty result

  Given every required backend setting is declared
  When the synchronization job starts
  Then it connects using exactly the declared values, with no substitution for any of them
  And no credential value appears in any reported output

  Given the operational instructions describe configuring this backend
  When an operator follows them for a hosted instance
  Then the instructions state that the database name and username are instance-specific and must be declared
  And they do not present a conventional name as a working default
depends_on: [KM-400e, KM-400e-5]
