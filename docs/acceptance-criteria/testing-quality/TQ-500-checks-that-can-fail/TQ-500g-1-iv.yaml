delivers_to:
- agent: python-coder
  ac_id: TQ-500g-1-ix
  contract: 'Reply of agent test-breaker, read by the writer step. Exactly one JSON value, no prose around
    it. Success shape: {work_key: str (as dispatched), entries: [{name: str (the must_catch string verbatim,
    as dispatched), status: ''prepared''|''could_not_prepare'', reason: str|null (one line; required when
    could_not_prepare, null when prepared), replacements: [{path: str (repo-relative POSIX), old: str (exact
    text copied from the file as read; must occur exactly once in that file when applied), new: str}] (at
    least one when prepared, [] when could_not_prepare)}], anomalies: [str]}. Failure shape: {status:
    ''failed'', blocker_summary: str (one line), anomalies: [str]}. Replacements on one file apply in order,
    each against the result of the one before. Each name is applied to the code as written on its own,
    never on top of another name. The aliases ''revert the fix'' and ''the fix undone'' get no entry (noted
    in anomalies as ''alias skipped: <name>''). The reply carries no diff, no altered copy and no outcome
    claim. Anything of that kind, and the anomalies, never reach the manifest.'
- agent: python-coder
  ac_id: TQ-500g-1-v
  contract: 'Route sequence, every time, immediately before the commit dispatch. (1) Dispatch agent test-breaker
    (Internal; tools: Read only; it writes nothing and cannot run git) with work_key: str; repo_root: str
    (absolute working-tree root); requirement_ids: [str] (the AC ids); wrong_versions: [{name: str (the
    must_catch string verbatim), files: [str (repo-relative POSIX source paths in scope)]}]. There is no
    manifest_path and no copies_dir input. It replies with one JSON value, the shape in the TQ-500g-1-ix
    entry above. (2) Dispatch the writer CLI (TQ-500g-1-ix) with that reply. The writer writes the altered
    copies and <git-dir>/leafcutter/work/<work-key>/alterations.json and prints the manifest path. (3)
    Dispatch the shared runner CLI (TQ-500g-1-i) with --alterations <that path>. A failed or empty reply,
    or a writer that stops, leaves no manifest, so the runner reports every owed name as unfinished. Whether
    the route halts at once or still calls the runner is this AC''s wiring choice; either way the work
    never reads as owing nothing. The reply only routes and is never read as an outcome.'
- agent: python-coder
  ac_id: TQ-500g-1-vi
  contract: Same sequence (test-breaker, then the writer, then the runner), inputs and replies as for TQ-500g-1-v
    (dispatched from build-feature.js and build-ticket.js).
- agent: llm-expert
  ac_id: TQ-500g-1-vii
  contract: Same sequence (test-breaker, then the writer, then the runner), inputs and replies as for TQ-500g-1-v
    (dispatched by ticket-supervisor per the building-epics skill).
