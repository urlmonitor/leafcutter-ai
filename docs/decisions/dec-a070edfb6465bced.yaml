decision_type: design
question: 'Decide how the Leafcutter decision kernel should group reusable decision criteria into categories (AC DK-300b):
  criteria that ask the same thing in different words must end up in one category with one preferred wording, related categories
  may sit under a broader one, and every grouping stays a suggestion a person can accept, change or undo. The storage format
  is already decided (dec-93c1c730463c1f3c: category records with SKOS-style labels that hold (decision id, criterion id)
  membership), and candidates come from published decision records and Langfuse run history. Options: a) deterministic wording
  or label matching (content-word overlap, as precedent lookup uses today); b) embedding-similarity clustering of criterion
  questions; c) Jev judging ''same question?'' for candidate pairs against existing categories; d) an LLM proposes the groupings
  for human approval; e) a staged mix ordered by ADR-053 (deterministic first, then Jev, then an LLM, then the human); or
  another option grounded in the repository.'
