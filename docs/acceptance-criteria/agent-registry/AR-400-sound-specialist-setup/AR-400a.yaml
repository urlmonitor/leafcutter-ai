id: AR-400a
title: "A specialist is never told to use an ability that does not exist"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Every ability named in a specialist's instructions is a real one.

  If a specialist's instructions, or a shared guide it reads, tell it to load
  an ability that does not exist, the build stops and names the specialist,
  the ability and where it was named. The references that point nowhere today
  are corrected or removed, so the first build after this change is clean.
