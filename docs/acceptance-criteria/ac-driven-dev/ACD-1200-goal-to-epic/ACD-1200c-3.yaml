it_requirements:
  - "The store-wide scanner (scan_ac_store.py main / the ready-AC ranking it drives) must NOT treat a depends_on cycle anywhere in the store as a fatal whole-scan abort. Today it detects a cycle and returns a non-zero exit (the 'ERROR: dependency cycle detected' path), which blocks /build-ac ranking for ALL trees. Replace this with graceful degradation: emit a warning naming the cyclic AC ids and continue ranking the acyclic remainder."
  - "When the only problem is a cycle that lies outside the requested ranking scope, the store-wide scan must exit 0. Reserve non-zero store-wide exits for genuinely fatal conditions (e.g. YAML load failure), not for an isolated cycle the scan can route around."
  - "Cycle isolation must be subtree-local: ACs participating in a cycle (and only those) are excluded from the ready set; ACs in unrelated acyclic subtrees must still be classified ready/blocked and ranked normally."
  - "MUST NOT weaken the scoped guard: goal_to_epic.py's topological_sort must continue to raise CyclicDependencyError for a cycle within a scoped epic's own leaf set, before any ticket files or AC mutations are written (preserving ACD-1200c-1-i). The store-wide softening applies only to the store-wide ranking path, never to the scoped pre-write topological sort."
  - "Keep the two code paths clearly separated so the relaxation cannot leak into the scoped guard. Wrap any added I/O per the project error handling policy."
delivers_to:
  agent: python-coder
  contract: "Store-wide scan that warns-and-continues on an out-of-scope cycle (exit 0, acyclic remainder ranked); scoped goal-mode topological sort unchanged (still raises CyclicDependencyError and exits non-zero on an intra-scope cycle)"
