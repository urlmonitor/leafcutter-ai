id: ACD-300c-5
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "Every final-gate message names the test-design stage that now owns the final gate"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the final gate of a /plan-feature run now follows the test-design stage, not the
    technical planner's stage,
  When the user is shown the final gate, cancels at the final gate, or the final commit fails,
  Then the final gate's heading names the test-design stage as the stage it follows,
  And the cancel message names the final gate as the test-design gate, as in
    "final gate (test design)", and does not contain "IT-PO" or "IT PO v3",
  And the commit-failure message names the stage "test-design", not "it-po",
  And the messages for the product owner, business analyst and technical planner gates are
    unchanged, character for character,
  And the workflow body's measured length after the change is no greater than before it.
depends_on:
  - ACD-300c
  - ACD-2500c-2
doc_links:
  - path: docs/architecture/adrs/ADR-072-code-aware-test-designer-may-read-source.md
    relationship: related
    status: exists
    relevance: >-
      Consequences: "The final gate id stays final-gate but now belongs to test-design. The
      final commit subject becomes plan-feature(TEST-DESIGN, final)."
  - path: docs/reference/plan-feature-workflow-rationale.md
    relationship: related
    status: exists
    relevance: Where moved rationale comments go if lines must be freed to keep the body from growing.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Only the final-gate heading, the final-gate cancel message and the final commit-failure stage name change;
  the other gates' messages stay byte-identical.
- Any test that asserts the old text changes in the same commit.
- 'templates/workflows-js/plan-feature.js is over its size limit and its measured length must not grow
  (GE-127b-1 growth ratchet): lines added are paid for by lines removed or by rationale comments moved
  to docs/reference/plan-feature-workflow-rationale*.md. Build after GE-127h-1 so decision-history lines
  are free.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
declared_files:
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from: null
test_intent:
- clause: the final gate's heading names the test-design stage as the stage it follows
  needs_test: true
  reason: The heading text is what the user sees at the gate, and the stale name is the defect.
- clause: the cancel message names the final gate as the test-design gate, as in "final gate (test design)",
    and does not contain "IT-PO" or "IT PO v3"
  needs_test: true
  reason: The cancel message is produced by a shared builder whose argument is the stale text.
- clause: the commit-failure message names the stage "test-design", not "it-po"
  needs_test: true
  reason: The commit-failure message names the stage that failed and must name the right one.
- clause: the messages for the product owner, business analyst and technical planner gates are unchanged,
    character for character
  needs_test: true
  reason: The shared builders could change the other gates' messages too, so they must be pinned.
- clause: the workflow body's measured length after the change is no greater than before it
  needs_test: false
  reason: The commit-time file-size growth ratchet enforces this and refuses a body that grew.
