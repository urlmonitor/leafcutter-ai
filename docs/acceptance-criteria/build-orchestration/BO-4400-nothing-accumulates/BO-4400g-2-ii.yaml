notes: |
  Merging with "delete branch" is the normal end of a pull request here, so after a squash
  merge the workspace's commits are reachable from nothing on the shared project. A pass
  that only checks reachability would keep every squash-merged workspace forever (the
  5.6 GB pile-up); a pass that treats "line gone" as "landed" would destroy "gone-1". Both
  wrong versions are caught by this pair.
