id: BO-4300e-2-vii
title: "A workspace whose current commit is off its line of work is still found by its location and cleared safely"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" with three ready workspaces, each switched off its line
    of work onto a bare commit (detached), with no uncommitted changes:
    "ticket/alpha", sitting on a commit the shared main line already holds, and
      whose own line of work holds no unpushed commit,
    "ticket/beta", sitting on commit "c1" that exists only in that workspace,
    and "ticket/gamma", sitting on a commit the shared main line holds, while
      its own line of work holds commit "c2" that was never pushed,
  When clearing is requested for each workspace by its location,
  Then no request is answered "not found",
  And "ticket/alpha" is answered cleared and nothing of it remains at its
    location,
  And "ticket/beta" is refused, the refusal names commit "c1" by identifier as
    unsent and states that the workspace is not on its line of work, and
    "ticket/beta" is identical before and after,
  And "ticket/gamma" is refused, the refusal names commit "c2" by identifier as
    unsent, and "ticket/gamma" is identical before and after,
  And clearing "ticket/beta" again with the one-time token its refusal returned
    is answered cleared, listing "c1" as discarded.
depends_on: [BO-4300e-2, BO-4300e-3]
