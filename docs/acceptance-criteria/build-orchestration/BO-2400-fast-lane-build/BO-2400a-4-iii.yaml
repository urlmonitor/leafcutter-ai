  post_write_commands: []
  constraints:
    - "This is the defence-in-depth half of the masked-failure fix. It must hold even if strict mode (BO-2400a-4-ii) fails to take effect, because a configuration override or a wrapper might drop the environment. The covering test runs the gate with strict mode absent and asserts the xfailed test still fails the gate."
    - "An exit-code-only green decision is the defect class here, because pytest exits 0 when the only non-passing outcomes are xfail. The per-test outcome rule must decide the verdict."
    - "A test the author explicitly marked expected-to-fail is also not passing at the green gate. An expected failure is not proof that a batch AC is met."
