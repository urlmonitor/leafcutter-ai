criteria: |
  Given the AC store scanner exits with status 0 but writes invalid JSON
    to stdout (e.g., truncated output or plain text error),
  When the AC prioritizer attempts to parse the scanner output,
  Then it exits with a non-zero status code,
  And the error output identifies the parse failure
    ("Failed to parse AC scanner output" or equivalent),
  And no partial or corrupt JSON is written to stdout.
