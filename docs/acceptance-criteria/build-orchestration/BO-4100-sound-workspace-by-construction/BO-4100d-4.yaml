notes: >-
  Found 2026-09-22 when the fast lane refused four consecutive runs. Its worktree phase
  invokes the deployed copy under .leafcutter/scripts/, which aborts with a bare git exit
  status 128 because its own directory is the untracked workspace parent. The in-repo copy,
  identical code, succeeded immediately -- the only difference is location. Recorded as
  KI-BP-20260922-0620. Sibling in shape to
  KI-BO-20260921-worktree-base-resolver-defaults-to-cwd, which is the same family (context
  taken from ambient state rather than from the subject named by the caller) in a different
  file, and to KI-BP-011 (the build records its provenance where the deployed code cannot
  read it). Distinct from BO-4100d-1/-2/-3, which govern the KIND of work a workspace is
  labelled with; this record governs WHICH REPOSITORY it is created in.
