notes: |
  THIS IS THE ONLY GLOBAL NARROWING IN GE-123d, and it is deliberately the
  tightest of the four candidate directions the product-owner listed. It is
  safe outside prose because the value shape it recognises is one no credential
  can have: a string ending in a source or document file extension. Every other
  shape in this feature (whitespace, placeholder brackets, masking characters,
  project identifiers) is plausible enough as a weak password that it is
  confined to the prose locations by GE-123d-2 and GE-123d-4.

  MEASURED RED BASELINE, reproduced through the real entry point on the day of
  authoring. Running the scanner over a Markdown file whose lines were the five
  shapes in question reported five generic-credential findings, including:
    line 1 — a sentence adding a suppression for a quoted repository path,
    line 4 — an actual credential-shaped assignment.
  Only lines 1 and 4 are relevant here: after this AC, line 1 reports nothing
  and line 4 still reports. The current behaviour of the rule is
  `keyword, separator, quote, eight-or-more non-quote characters, quote`, so
  any quoted path of eight characters or more satisfies it.

  WHY THIS SPECIFIC CASE IS WORTH ITS OWN AC: it is self-referential. The rule
  name GENERIC_SECRET itself ends in one of the keywords the rule matches, so
  every sentence that documents the rule and quotes a target path trips it. That
  is the mechanism behind the third of the three observed blocks — a code
  comment written to explain the previous two. Because that comment lives in
  source, no location-based exemption can ever reach it; only a value-shape
  narrowing can, which is why this AC exists separately from GE-123d-2.

  VERIFICATION STANDARD FOR THIS TREE (inherited from the L0): exercise this
  through the pre-commit secrets check against a real staged file, not by
  calling the matching logic directly. A sibling audit in this same family found
  two criteria verified only against the matcher in isolation that described
  situations the real entry point can never produce.

  RE-MEASURED BY THE IT PO, 2026-08-18, through the real entry point rather
  than the matcher: the canonical pre-commit check, run as a subprocess with a
  throwaway git repository as its working directory, over one staged Markdown
  file in the ticket tree carrying three credential-shaped lines — a suppression
  instruction naming a quoted Markdown path, a words-shaped value, and an opaque
  sixteen-character value — reported three generic-credential findings and exit
  status 1. Lines one and two must fall silent after GE-123d-1 and GE-123d-2;
  line three must still report, which is GE-123d-3. This also confirms the test
  harness the test_spec mandates is workable: the check resolves its project root
  from git rev-parse in the working directory, and its own directory-relative
  scanner lookup finds the canonical templates/ scanner without any deployed
  copy being present.
target_epic: EPIC-SuppressionNarrowsNeverDisables
