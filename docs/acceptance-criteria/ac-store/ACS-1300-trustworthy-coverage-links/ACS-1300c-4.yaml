    relevance: "Guarantee 1, whose wording this section must carry. The refusal is documented here in the reference, not restated in the ACS-1300a how-to, so it has exactly one authoritative home and the how-to points at it."
  - path: docs/acceptance-criteria/testing-quality/TQ-400-durable-done-proof/TQ-400e-1.yaml
    relationship: relates-to
    status: exists
    relevance: "Owns the byte-stability rule and states it in the exact form the second clause requires. Quote its distinction rather than paraphrasing it — the paraphrase that loses 'do not write' in favour of 'write the same' is the whole failure this clause guards."
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "THE WRITTEN RULE AND THE ENFORCED RULE MUST BE THE SAME RULE. Write this section against ACS-1300c-1 AS IMPLEMENTED, after it lands, not against its criteria. A reference stating a rule the code does not enforce is the contradiction ACS-1200a had to correct on this very page, and the reference is the copy people believe."
  - "STATE THE BYTE-STABILITY RULE IN THE DO-NOT-WRITE FORM, QUOTING TQ-400e-1's DISTINCTION RATHER THAN PARAPHRASING IT. The paraphrase that loses 'do not open for writing' in favour of 'write the same values back' is the whole failure this clause guards: an author who reads the weaker form builds the bulk rewrite that ACS-1300c-2 says cannot be retrofitted."
  - "SAY EXPLICITLY THAT THE FINISHED-STATE RULE IS A STANDING REFUSAL, NOT A FEATURE NOT YET BUILT, and name `scripts/ac_store/mark_ac_done.py` as the owner of that promotion. A rule that reads as unfinished work is an invitation to finish it — TQ-400f, authored and closed unbuilt on 2026-09-01, is the evidence that this specific rule does get re-derived."
  - "THE SECTION MUST BE SUFFICIENT TO COMPLY, NOT MERELY TO BE INFORMED. It must state what it takes to satisfy each of the three rules, not only that they exist. 'The section mentions the refusal' is satisfied by a sentence; the criterion is a tool built from this section alone passing all three checks."
  - "REACHABLE FROM THE COVERAGE FIELD'S OWN REFERENCE ENTRY, NOT ONLY FROM A HEADING ABOUT THIS REPAIR. The author it exists to stop is writing the next unrelated tool and has never heard of this repair. Add the cross-reference at the field definition itself in `docs/reference/ac-schema.md`."
  - "ONE HOME, NOT THREE. This section is the authoritative statement; ACS-1300a-4's how-to and this tree's AC notes point at it and must not restate it. Three copies of a standing rule drift, and the copy the reader happens to find is the one that governs."
  - "THE DELIVERABLE IS THE DOCUMENT. No behavioural AC in this tree may be closed by pointing at it, and in particular the refusal is enforced by ACS-1300c-1 and ACS-1300c-1-i, never by the existence of this section."
  - "Front-matter and placement per this repository's doc conventions; the page is already tracked and indexed, so this is an amendment to an existing reference rather than a new page."
