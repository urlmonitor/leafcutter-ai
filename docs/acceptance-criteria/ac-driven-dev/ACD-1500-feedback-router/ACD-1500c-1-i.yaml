it_requirements:
  - "feedback-router.js must order the loop-close so resolve_feedback.py is called ONLY after a usable artifact id is confirmed produced; if artifact creation yields no id, or resolve_feedback.py exits non-zero, the entry must be left unresolved"
  - "Must record the failure with enough detail to retry (entry id, route, failure reason) per the project error handling policy — log and do not silently swallow"
  - "Must guarantee no partial state where resolved_at is set while pointing at an artifact that was not created (resolve is the last step, gated on success)"
