id: TQ-100b-4-i
components:
  - testing_quality
  - ac_store
title: "A real tag whose id is malformed is reported as malformed, never dropped"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given a test function in the repository's unit-test tree that carries a genuine
    coverage tag in tag position — the comment line immediately above the test
    definition, the first line of the test body, or the test's docstring — whose
    captured value is not shaped like an acceptance-criterion id, for example
    "# covers: TODO" or "# covers: TQ-100b_4" with an underscore where a hyphen
    belongs,
  When the coverage-tag reader scans that tree,
  Then the reader reports that tag as a malformed coverage tag, naming the test
    function, the file, and the captured value
  And it does not omit the tag from its output on the grounds that the value
    failed the id-shape test — a real tag with a typo'd id still surfaces, so the
    false-positive narrowing in TQ-100b-4 does not become a false negative
  And the malformed-tag report is a class distinct from the dangling-reference
    report, so a reader of the output can tell "this tag names an AC that no
    longer exists" apart from "this tag's value is not an id at all"
  And the same reader run over the same tree with that one tag line removed does
    not report it, so the report is driven by the tag being present rather than
    by a fixed list of known values.
depends_on:
  - TQ-100b-4
