id: BO-1300c-1-i
readiness: approved
priority: high
title: "A required check that never completes is surfaced as a timeout blocker, not waited on forever"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300c.yaml"
criteria: |
  Given an open pull request whose required check "Lint (ruff)" stays pending and never reaches success or failure
  When the automation has waited up to its configured maximum wait time for that check
  Then it stops waiting
  And it surfaces a blocker to the operator stating that the required check did not complete within the wait window, naming "Lint (ruff)"
  And it does not merge the pull request
  And it does not silently abandon the pull request without surfacing the blocker
depends_on: [BO-1300c-1, BO-1300b-2]
