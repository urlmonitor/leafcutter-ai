change_target: code
risk_surface: contract_boundary
notes: |
  A bounded region is what makes the declaration cheap to find by eye and by
  grep; a reader that scans the whole file for "@ac" would also pick up the
  element pins and every code comment mentioning an id, collapsing the two
  surfaces GE-124a-1-ii keeps apart.

  The message requirement is the mitigation: being blocked for putting the
  right text in the wrong place is the most annoying possible false stop, so
  the check must say where the text belongs rather than reporting a bare
  "missing declaration". This mirrors the GE-117 house shape where the verdict
  carries the remediation.

  IT-PO ENRICHMENT NOTE (2026-08-25). This AC needs a whole-file rescan that
  GE-124a-1-ii forbids feeding into declares[]. The two are compatible only if
  the rescan's output is confined to message text — stated in it_requirements
  and asserted in the first test.
