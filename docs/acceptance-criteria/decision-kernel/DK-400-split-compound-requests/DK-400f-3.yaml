assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400d-3
  contract: The recorded rejection, its gate_by and the trigger and found_at that pick the ending (DK-400d-3 delivers_to
    shape).
it_requirements:
  - 'A rejected split''s report carries exactly one plain line and no per-part section: ''The proposed split was
    rejected by <gate_by>; nothing was decided.'' for state rejected; ''The proposed split was rejected by <gate_by>;
    the goal is kept whole and runs as one decision.'' above that decision''s own report for a bundled_accepted
    kept-whole split; and for a mid-run split a line naming the work item kept whole.'
  - 'For state rejected_clarify the split record''s report_lines hold exactly two lines as soon as the clarification
    question opens: ''The proposed split was rejected by <gate_by>; the request falls back to today''s clarification
    question, and nothing is decided yet.'' and ''Question asked: <the clarification question text as opened>''
    (mock-data v6 record dcp-format-and-repeats-clarify). The envelope exposes them while the run is waiting_human,
    and report.md keeps them above whatever the clarified request goes on to produce.'
  - 'While the run is waiting_human the envelope is the report surface: the two lines live on the split record and
    in the envelope, no interim report.md is written (as for today''s waiting runs), and report.md at finalize keeps
    them above whatever follows.'
  - The rephrasing hint after a jev_none rejection (state rejected) uses the host's optional one_question_rewording
    from the proposal when present, shown as a suggestion and never run; otherwise today's template rephrasing hint.
  - The line names gate_by exactly as recorded.
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_rejected_jev_none_report_line_and_hint
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: The trace-analyzers (jev_none) rejection writes the nothing-was-decided line followed by a rephrasing
      hint with an example rewording, and no per-part section.
  - name: test_rejected_bundled_report_line_above_one_decision
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: The decision-records rejection writes the kept-whole line above the report of the one decision.
  - name: test_rejected_mid_run_line_names_kept_whole_item
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: A rejected mid-run split writes one line naming the work item kept whole.
  - name: test_rejected_ambiguous_report_line_and_clarification_question
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rejecting the ambiguous format-and-repeats split yields the falls-back line followed by 'Question
      asked:' with the exact text of the opened clarification question, no per-part section, and the run waiting_human.
test_rationale: Each ending writes a different report; the tests read the written report.md of each.
