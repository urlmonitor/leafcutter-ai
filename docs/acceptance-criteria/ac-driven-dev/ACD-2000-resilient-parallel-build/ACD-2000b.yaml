criteria: |
  A requirement being worked on is visibly taken -- and never stuck that way.

  While one effort is building a requirement, anything else that comes looking
  can see it is already taken and picks up different work instead, so two
  efforts never land on the same thing at the same time. If an effort is
  interrupted, the requirement is handed back and becomes available again rather
  than sitting indefinitely as somebody else's unfinished business.
