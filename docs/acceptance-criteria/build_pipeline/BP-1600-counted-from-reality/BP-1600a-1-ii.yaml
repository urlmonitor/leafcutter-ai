it_requirements:
  - >-
    STATE THE EXTRACTION RULE AND TEST IT AGAINST THE COMMANDS THE SURFACE ACTUALLY CARRIES.
    Every wiring in the shipped surface today invokes an interpreter on a path assembled by a
    shell fragment that walks up to the installed hook directory first, so the command holds
    several tokens and more than one path-shaped one. A rule that takes the last token, or
    the first path-shaped token, or everything after the interpreter, gives a different answer
    on that shape. Whatever rule is chosen must be written down in the implementation and
    exercised against a wiring carrying arguments after the script, since that is the exact
    variation that broke the equivalent rule on the sibling surface.
  - >-
    THE TWO-LAYOUT RESOLUTION IS THE HIGHEST-RISK PART AND ITS FAILURE MODE IS AN AVALANCHE,
    NOT A SILENCE. The wirings name scripts where they live once installed; the census's disk
    side lists them where they are authored. Resolve both to one identity — normalising the
    wiring's path to the authored position, or the authored position to the installed one, but
    ONE rule applied to both sides. Get it wrong and every script is reported as run by
    nothing on the first run, which is a false-positive avalanche whose natural remedy is
    switching the census off. State the resolution rule in the run's output so a reader can
    tell an avalanche from a finding.
  - >-
    A NAME IS NOT A WIRING. The settings document carries at least one other list of
    command-shaped strings that executes nothing at census time. A substring or regular
    expression search over the document's raw text returns the correct answer on the
    repository as it stands and the wrong answer the first time a script's name appears in
    one of those positions — which is why the parent record's named mutation is exactly that
    search. Build the wired set by walking the wiring structure and reading each wiring's
    command, never by searching the document.
  - >-
    WHICH COPIES COUNT MUST BE DECIDED EXPLICITLY, NOT INHERITED FROM WHATEVER THE HARNESS
    MERGES. The harness may compose its effective configuration from more than one document,
    including per-user and per-working-copy files that are not part of what the project ships.
    The census's question is about what an installed project receives, so the shipped surface
    is the one it reads. Do NOT read the merged effective configuration: a script wired only
    in one developer's local override would then be reported as wired while every consumer
    receives a script that nothing runs — the precise false negative this census exists to
    close, arriving through the configuration system.
  - >-
    THE WIRING-EXECUTES-NOTHING CLAUSE IS A SET DIFFERENCE IN THE OPPOSITE DIRECTION AND MUST
    BE REPORTED IN ITS OWN CLASS. It is not a script reported as run by nothing; it is a
    wiring reported as executing nothing, and the two must be distinguishable in the output
    and in the exit path. Keeping them separate is what lets a reader tell "we built something
    and never wired it" from "we wired something and never built it", which have different
    fixes and different owners.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around reading
    and parsing the settings surface and around any path resolution that touches the
    filesystem; log at WARNING or higher or re-raise; no bare or blind excepts. A resolution
    error must never silently drop a wiring from the wired population — a dropped wiring
    turns a wired script into a reported one, which is a false accusation, and a swallowed
    parse error turns the whole surface into zero wirings, which BP-1600a-1-i converts into a
    named failure.
test_spec:
  - name: test_bp_100n_6_ii_a_wiring_carrying_arguments_after_its_script_still_resolves_to_that_script
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      A fixture wiring whose command invokes a hook script and then passes further arguments
      after it resolves to that script, and the script is NOT reported as run by nothing.
      This is the exact variation that broke the equivalent extraction on the sibling surface,
      where a last-whitespace-token rule resolved three live entries to a flag.
  - name: test_bp_100n_6_ii_the_two_layouts_resolve_to_one_identity
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Over the real shipped settings surface and the real authored hook directory — where the
      wirings name the installed position and the files sit at the authored one — the census
      reports FEWER scripts as run by nothing than the total it examined. Goes red on an
      implementation that compares the two positions as written, which reports every script
      as unwired; that avalanche is the failure this descriptor exists to catch, and it is
      indistinguishable from a working census by any test that only checks that findings
      exist.
  - name: test_bp_100n_6_ii_a_name_appearing_outside_an_executed_command_is_not_a_wiring
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A fixture surface in which a script's name appears in a position that executes nothing —
      a permission entry, or any value the harness does not run — while no wiring executes it:
      the script is reported as run by nothing. Goes red on any implementation that searches
      the document's text rather than walking its wirings.
  - name: test_bp_100n_6_ii_a_wiring_present_only_in_an_unshipped_local_copy_does_not_count
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: deployed
    description: >-
      A fixture tree in which a script is wired ONLY in a local override that the project does
      not ship reports that script as run by nothing. Establishes that the census answers for
      what an installed project receives, not for what one working copy happens to have
      configured.
  - name: test_bp_100n_6_ii_a_wiring_whose_script_is_absent_is_reported_in_its_own_class_and_fails
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      A fixture wiring executing a script that is not present in the hook directory is
      reported by name as executing nothing, in a class distinct from the scripts reported as
      run by nothing, and the run exits non-zero. Asserts the two directions are separately
      readable in the output, not merged into one finding list.
  - name: test_bp_100n_6_ii_the_resolution_rule_is_stated_in_the_run_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The census's output states which resolution rule it applied to reconcile the two
      layouts, so a reader confronted with a large finding set can tell a real census from a
      census that resolved nothing. Asserted over the executed process's own output.
test_rationale: |
  This criterion exists because the wired side of this surface cannot be read the way the
  sibling surface's is. There, a manifest names scripts on entry lines in one layout. Here the
  script is buried inside a shell command, named in the layout it will occupy after
  installation, in a document that also carries command-shaped strings which execute nothing —
  three independent ways to build the wrong population, each of which produces a plausible
  result on the repository as it stands.

  The two-layout descriptor is written as an inequality rather than an exact expectation
  deliberately. The failure it guards is an avalanche — every script reported as unwired — and
  an avalanche satisfies any test that merely asserts findings exist or that a particular
  script is named. Requiring that fewer scripts be reported than were examined is the weakest
  assertion that still cannot pass on a census that resolved nothing.

  The unshipped-local-copy descriptor is the one most likely to be dismissed as pedantic and
  is the one with the sharpest consequence: a developer who wires a hook locally and never
  ships the wiring has a census that reports clean for them and a consumer base receiving a
  script nothing runs. That is the same class of evidence failure as a registration the commit
  path never reads, which an approved sibling record already refuses.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", every descriptor
  executes the census as a process and asserts over its emitted output; none may be satisfied
  by reading the settings surface or the census source as text.
