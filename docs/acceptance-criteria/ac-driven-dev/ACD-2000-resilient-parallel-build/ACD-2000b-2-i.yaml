notes: |
  THE PARTIAL-CLAIM LEAF -- ACD-2000b hazard 3, verified: "The loop is per-AC
  sequential and returns `success=False` with a PARTIALLY populated `claimed`
  list on failure -- the caller is obliged to release. State whether a build set
  is all-or-nothing or explicitly partial, and make the contract testable; an
  unstated contract here leaks half-claimed sets on every failed run."

  THIS AC MAKES THE DECISION: ALL-OR-NOTHING, from the caller's point of view.
  The reasoning is that the alternative — an explicitly partial claim — pushes
  the cleanup obligation onto every caller, and the repo already has the evidence
  that caller-obligation cleanup does not survive contact with reality:
  `release_claim()` runs only on a graceful non-success exit, so a hard kill
  leaks the whole set (ACD-2000b-3 covers that case). Adding a second
  caller-obligation on top of the one that already fails is how half-claimed sets
  become the normal state of the store.

  THE FOURTH THEN CLAUSE IS THE STRONG ONE and is what distinguishes this AC
  from "remember to call release in the failure branch". "Without needing the
  interrupted effort to tidy up after itself" rules out any implementation whose
  correctness depends on the failing process still being alive -- which is the
  entire class of bug this L1 exists to close. It can be satisfied by a
  reclaim rule (ACD-2000b-3) covering partial sets, or by a claim mechanism
  where the set is taken in one indivisible step; it cannot be satisfied by a
  try/finally.

  THE THIRD THEN CLAUSE (naming the unavailable member) matters operationally:
  "could not claim the build set" sends an operator to inspect four requirements.
  It is also the input a scheduler needs to decide whether to wait or to re-plan
  around the contended member.

  RELATIONSHIP TO ACD-2000b-2. The parent covers contention over ONE requirement;
  this covers the compound operation, where the failure mode is not a lost race
  but a torn transaction. Both are needed: an atomic single claim composed
  sequentially still tears.

  TESTABILITY. Have a second real process hold the third requirement, then run a
  real set-claim of four and inspect all four records afterwards. For the fourth
  clause, kill the claiming process mid-set (SIGKILL, so no cleanup handler can
  run) and assert the set is takeable by a fresh process. A test that lets the
  claimer's failure path run normally cannot observe the leak.

  2026-08-17 (IT PO enrichment). TWO HAZARDS THE CRITERIA DO NOT NAME, added as
  it_requirements:

  1. DETERMINISTIC TAKE ORDER. Two efforts taking overlapping sets in opposite
     orders each hold part of the other's set and neither can proceed. Sorting
     the member ids before taking removes the cycle. This becomes reachable the
     moment ACD-1800c bundles share members, and it is invisible to any test
     that claims one set at a time -- hence the fifth test.
  2. SET IDENTITY ON EACH MEMBER. The fourth clause is satisfiable only by an
     indivisible set take or by a reclaim rule that can recognise the residue.
     The second route needs each member to carry which set operation took it;
     without that, reclaim frees the members independently and a second effort
     can start on a fragment.

  THE CLI CONTRACT IS COLLATERAL. `main()`'s claim branch refuses only on
  `target_refused` (every member already taken). All-or-nothing changes that to
  "any contended member yields none taken", which makes the documented exit-code
  semantics in `main()`'s docstring and the `claim` subparser help wrong on the
  same commit. Recorded so the change is not shipped with its own documentation
  contradicting it.
