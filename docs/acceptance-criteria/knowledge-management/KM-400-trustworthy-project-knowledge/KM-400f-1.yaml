change_target: [code, config]
risk_surface: contract_boundary
notes: |
  Authored 2026-10-09 after a measured incident: the projection published an immutable
  generation of roughly 9,850 nodes and 26,100 relationships on every merge to the
  canonical branch and never reclaimed the old ones. 32 generations reached 189,950 nodes
  and 304,498 relationships, hit the hosted free-tier ceiling, and the instance latched
  read-only, after which every write failed including cleanup itself. The instance had to
  be destroyed and recreated.

  The gap this AC closes is a specification gap, not only a code gap. The store pushes
  exclusively toward preservation (KM-400a-3-i "retained generations are preserved",
  KM-400b-3 pinning "while it is retained", KM-400b "evidence already in use stays
  stable") and no criterion anywhere required reclamation, so unbounded accumulation was
  the specified behaviour. A retention_seconds default of 3600 exists in the projection
  adapter and appears nowhere in the store; this AC makes the bound declared and
  inspectable instead.

  Settled design decision, not to be reopened: immutable generations are KEPT. This AC
  adds a bound and does not replace generations with in-place upserting. KM-400b-3's
  pinning guarantee is strictly superior to the bound — an unexpired continuation
  protects its generation regardless of count or age.
it_requirements: null
test_required: true
test_spec:
  - name: test_retention_policy_reports_declared_bound_and_exact_reclaimable_set
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Build a 32-generation fixture with one active, one recently retired and
      one pin-protected generation, evaluate the policy through its public entry point and
      assert the exact reclaimable set, the per-generation reason, and that the reported
      bound names both the count limit and the minimum age.
    covers: [KM-400f-1]
    must_catch:
      - "evaluate the bound on age only and ignore the generation count"
      - "treat the pin-protected generation as reclaimable because it is outside both bounds"
      - "include the active generation in the reclaimable set"
    requires_db: false
  - name: test_undeclared_retention_bound_refuses_instead_of_defaulting
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: With no retention bound in configuration, assert the evaluation refuses
      naming the unset setting and reports no reclaimable generation, rather than resolving
      the adapter's built-in retention value.
    covers: [KM-400f-1]
    must_catch:
      - "fall back to the built-in retention_seconds value when the bound is unset"
      - "report an empty reclaimable set as a successful evaluation"
    requires_db: false
  - name: test_policy_evaluation_changes_no_generation
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Against a real database holding several published generations, evaluate
      the policy twice and assert identical canonical fingerprints, unchanged active
      pointer and unchanged continuations — evaluation reports, it never reclaims.
    covers: [KM-400f-1]
    requires_db: true
test_rationale: >-
  The bound only binds when the fixture is large enough for it to bind, so the criterion
  test builds a 32-generation fixture rather than the 2-node snapshot used elsewhere in
  this family, under which no limit is ever reached and a no-op policy would pass. Each
  protection (active, count, age, pin) is asserted with its own reason so a policy that
  returns the right set for the wrong reason is still caught, and must_catch names the
  wrong versions explicitly because this AC exists to prevent a regression to
  zero-reclaimable. The refusal test must execute the configuration path, not inspect the
  source for a constant.
