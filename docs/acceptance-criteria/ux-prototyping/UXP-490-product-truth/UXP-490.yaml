priority: medium
title: "A product owner can review flows, mock data, and mockups and see which steps are built"
component: ux-prototyping
level: L0
status: active
req_status: approved
work_status: in_progress
criteria: |
  As a product owner, I want flows, mock data, and mockups to be first-class,
  PO-reviewed artifacts that hang off acceptance criteria and render live, so that
  I can look at how a feature behaves, approve it, and see at a glance which steps
  are built, in progress, or not started — without reading code or a hand-maintained
  status document.

  Product-truth artifacts plug into the existing AC-driven pipeline: each flow step
  links to the acceptance criteria that implement it, and the /flows view colours
  every step by those ACs' live work_status.
