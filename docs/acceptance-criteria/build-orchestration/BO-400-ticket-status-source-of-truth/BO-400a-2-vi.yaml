id: BO-400a-2-vi
components:
  - build_orchestration
title: "No agent template tells its agent to write a level-2 heading into its output, so a later sign-off entry is never placed above an earlier one"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  A phase agent's output becomes its comment in the ticket's `## Comments`
  section. The completion decision reads each phase's sign-off entries, the
  `### ` headings, in file order. When an agent template tells its agent to
  append a level-2 heading such as `## Escalation` to its output, that heading
  lands inside `## Comments`, where it looks like the start of a new section.
  On 2026-09-30 a later ac-fulfillment-gate entry was written directly above
  architect-review's `## Escalation` heading, which put it above an older entry
  for the same gate, and the drive read the older ok as the gate's latest word
  (KI-BO-20261009, mechanism 1).

  Scenario: The escalation section is not a level-2 heading
    Given the architect-review, conflict-resolver and pr-reviewer agent templates,
      each of which tells its agent to append an escalation section to its output
      naming the branch taken and the one-line reason,
    When each template's instruction and its examples are read,
    Then the section they tell the agent to write is introduced by a bold
      `**Escalation**` label, not by a `## ` heading,
    And every other line the section carries (Branch, Reason) is unchanged,
    Because a label carries the same information without looking like a section
      boundary to anything that reads the ticket.

  Scenario: No agent template asks for a level-2 heading in its output
    Given every agent template under templates/agents/,
    When the templates are scanned for an instruction to append, add or write a
      `## ` heading to the agent's output or comment,
    Then none is found,
    Because the same misplacement would follow from any such heading, not only
      from the escalation section.

  Scenario: Templates that document their own structure are not affected
    Given an agent template whose own layout uses `## ` headings for its sections,
    When it is scanned,
    Then those headings are not counted, since they structure the template and are
      never written into a ticket.
