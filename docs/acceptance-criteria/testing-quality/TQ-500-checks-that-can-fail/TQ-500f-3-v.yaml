id: TQ-500f-3-v
components:
  - testing_quality
  - build_orchestration
title: "The red-baseline reader judges new tests with the project's own Python, and says so loudly when that Python cannot import the project"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an adopter project whose dependencies live in a project virtual
    environment (for example a uv-managed .venv in each worktree), so the
    bare `python` on PATH has pytest but cannot import the project's own
    package, and whose tests/conftest.py imports that package,
    And a newly added test, tagged as covering the requirement, that fails
    with an assertion when run under the project's environment,
  When a build route runs the red-baseline gate (heavy_lane_gate on
    /build-feature and /build-ticket, verify_red_baseline on the fast lane)
    with the bare `python` on PATH,
  Then the gate runs the tests with the project's interpreter, chosen in this
      order: the command configured as testing_context.python_command in the
      project's skills_config.json; else the worktree's .venv interpreter;
      else `uv run` when the project is uv-managed; and only when none of
      these applies, the interpreter running the gate,
    And the new test is judged red and the gate passes, with the verdict's
      interpreter naming the project interpreter that judged it,
    And when the chosen interpreter cannot import the project's own package,
      so every new test errors at collection with that ImportError, the gate
      fails with its own reason, project_package_not_importable, and a
      refusal that names the interpreter and the missing package,
    And that case is never reported as no_red_outcome_among_new_tests.
