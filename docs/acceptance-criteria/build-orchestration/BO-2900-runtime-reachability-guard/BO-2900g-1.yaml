notes: |
  GAP A of BO-2900g. The rule is stated as a property of the WORK, not of the
  route, on purpose.

  THE OBSERVED STATE (2026-08-14 investigation, recorded in
  docs/testing/test-angles.md). The reachability floor is attached on the
  criteria-derived planning route only. 1,509 of the 1,886 coder-assigned ACs
  (80%) take that route and get the floor; the 394 store-wide records that author
  their own plan bypass it entirely and receive a privileged exemption nobody
  ever decided to grant. The exemption is not a policy — it is an artifact of
  where the append happens.

  WHY THE THIRD-ROUTE CLAUSE IS IN THE CRITERIA AND NOT IN THE NOTES. A fix that
  adds the same append to the second route satisfies the first two Then clauses
  and re-creates the gap the moment a third route exists. The third-route clause
  is the discriminating one: it is satisfiable only by attaching the request
  where a plan is finalised for a piece of work, and it is testable by
  introducing a new plan-producing route in a test and asserting the request is
  present without that route having been modified.

  ORDER PRESERVATION IS NOT DECORATION. Work Y's authored proofs must survive
  unaltered and in order. An implementation that satisfies the floor by
  rewriting or re-deriving an authored plan has silently discarded a human's
  test contract to satisfy a mechanical rule, which is a worse defect than the
  one being fixed.

  BOUNDARY. Planning-time only. This AC does not say the proof is any good, does
  not read a test, and produces no gate, block or done-state consequence. The
  consequence layer is BO-2900a (the verdict), BO-2900e (the refusal wording),
  BO-2900f (the never-ran record).

  IT-PO ENRICHMENT NOTE (2026-08-17). Attachment point today:
  _build_test_requirements_section returns the spec-derived descriptors and only
  falls through to _derive_tests_from_criteria (which appends the floor) when the
  spec path yielded nothing. That early return IS the exemption. declares_side_effect
  is true because the observable is a ticket file written to disk by the CLI.
  it_requirements uses the package-surface OBJECT form because
  config/ac_store_schema.json's root if/then makes it mandatory for
  assigned_agent: python-coder + component: build-orchestration; the policy-level
  constraints ride the schema-permitted additional `constraints` key.
