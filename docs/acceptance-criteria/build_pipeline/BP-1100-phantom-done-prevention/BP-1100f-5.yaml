notes: |
  Guard #6 of BP-1100f. Surface for IT-PO to pin: the drive/verification-phase routing
  that already owns the observable-side-effect smoke check. The check EXISTS today; the
  gap this AC closes is that it is opt-in and can be silently skipped. This AC makes
  routing to it automatic and mandatory for any work item that declares a durable
  side-effect. Portable per ADR-001 — a consumer project that runs build.py must get the
  automatic routing, not only the leafcutter repo.
