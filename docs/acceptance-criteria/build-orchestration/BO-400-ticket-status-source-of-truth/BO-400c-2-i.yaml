title: "Mixed state: some tickets in done/ folder, some with status: done at root"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic folder in a transitional state:
    - done/01_ticket.md with status: done (legacy, already moved)
    - 02_ticket.md with status: done (new convention, not moved)
    - 03_ticket.md with status: in_progress (active work),
  When finalize-feature-archive-check runs on this epic folder,
  Then it scans both the epic root AND the done/ subfolder for .md files
    (excluding Master_Plan.md)
  And it reads frontmatter `status:` from all 3 tickets
  And it reports:
    ok_count: 2 (done/01_ticket.md and 02_ticket.md both have status: done)
    missing_count: 1
    missing_tickets: [{path: "03_ticket.md", current_status: "in_progress"}]
    all_clear: false
  And it blocks the archive operation
    until 03_ticket.md reaches status: done.
