roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given an available requirement,
  When an effort takes it up to build it,
  Then anything else that looks at that requirement can see it is taken,
  And can see which effort took it and at what moment,
  And when that effort takes the requirement up through the single-requirement
    fast path, and when a larger drive takes it up as part of a feature, both are
    visible to each other in the same way and through the same record,
  And when the effort finishes and hands the requirement back, it is visibly
    available again, with the owner and moment cleared.
