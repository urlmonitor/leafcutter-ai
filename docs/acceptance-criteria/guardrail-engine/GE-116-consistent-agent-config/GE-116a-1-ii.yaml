  contract: "The fail-closed block decision of the verification-consistency guard, which this edge refines for multiple offenders in one commit."
it_requirements:
  - "The block decision is all-or-nothing for the commit: any single offending staged definition causes a non-zero exit; the commit must not partially succeed for the consistent definitions in the same commit."
test_spec:
