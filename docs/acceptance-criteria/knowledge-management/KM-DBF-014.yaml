title: "Regenerating the doc index without doc changes leaves the file byte-identical"
component: knowledge-management
status: active
criteria: |
  Given docs/INDEX.md has been generated and no documentation file has changed
    since,
  When the doc-index generator is run again,
  Then docs/INDEX.md is byte-identical to the previous run and git reports no
    modification,
  And the symptom ("every regeneration rewrites the header timestamp, so the
    file always shows a diff even when no doc changed") must not occur,
  And when a documentation file HAS changed, the regenerated index still
    reflects that change.
