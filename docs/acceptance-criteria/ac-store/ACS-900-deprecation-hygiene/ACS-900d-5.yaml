  ac_id: ACS-900d-4
  contract: "The implemented retired-record predicate (status superseded_by|superseded, non-empty existing successors, no self-reference; deprecated excluded), the forward gates it exempts (check-done-proof own-record and composite rollup, check-ac-schema test contract), and the structural rules that still apply (successor existence, self-supersession, schema shape, parent covered_by links)"
test_required: false
test_rationale: "Documentation-only AC (change_target docs). It produces no executable behaviour. The behaviour the guide describes is proven by the test_spec entries on ACS-900d-4 and its L3s. The doc surfaces are checked by the existing check-doc-frontmatter, check-doc-links and check-doc-length hooks."
