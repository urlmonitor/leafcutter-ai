id: BP-1300e-1-ii
components:
  - precommit_hooks
  - commit_guardian
title: "Each staged file is judged whole, as it will be committed, so a touched file with older violations is refused just as CI would refuse it"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario: Only files the commit changes are inspected
    Given an in-scope file under scripts/ that is NOT staged and carries a rule
      E741 violation,
    And a staged change to a different, clean in-scope file,
    When the commit is attempted,
    Then the commit completes,
    And the check reports that it inspected exactly the one staged file.

  Scenario: A touched file is judged whole, including violations it already had
    Given an in-scope file under unit_tests/ that already carries a rule F841
      violation at line 40 before this change,
    And a staged change that edits only line 90 of that file and adds no
      violation,
    When the commit is attempted,
    Then the commit is refused,
    And the refusal names line 40 and rule F841,
    And the refusal states that the finding predates this change but is in a file
      this commit modifies, and that CI's required check rejects the file
      whichever change introduced it.

  Scenario: The staged content is judged, not the working copy
    Given an in-scope file whose staged version carries rule E741,
    And whose unstaged working-copy edits remove that violation,
    When the commit is attempted,
    Then the commit is refused, because the content being committed carries the
      violation,
    And given the reverse — a staged version that is clean while the unstaged
      edits add a violation —
    When the commit is attempted,
    Then the commit completes.

  Scenario: A deleted file is not inspected
    Given a staged change that only deletes an in-scope Python file,
    When the commit is attempted,
    Then the deletion is not treated as a file to lint and does not cause a
      refusal or an error.
