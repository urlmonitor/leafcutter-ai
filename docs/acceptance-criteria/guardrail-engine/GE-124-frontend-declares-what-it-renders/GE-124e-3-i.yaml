notes: |
  THE COMPOSITION QUESTION the PO asked for: where the two gates would report on
  the same criterion, say how they compose rather than leaving a reviewer with
  two unrelated failures. The answer is that they compose by ADDITION and never
  by substitution — both must hold.

  The second and third scenarios are the two half-finished states the PO
  describes as equally unfinished: declared but untested, and tested but
  undeclared. They are written as separate scenarios because they fail in
  opposite gates, and an implementation that wires the two gates together will
  pass one of them and quietly fix the other.

  This L3 is the enforcement side of GE-124g-2, which owns the guarantee. It
  lives here as well because GE-124e is where the mistake would actually be
  made — a gate author looking for a way to avoid two failures on one criterion
  is one refactor away from making one gate satisfy the other.

  IT-PO NOTE (2026-08-25). The concrete temptation is specific and worth naming:
  check_done_proof.py already walks every done AC and already has a --mode
  ci-changed surface. Adding a declaration check to it would be a small diff and
  would produce one tidy failure per criterion. That is the defect. Two gates.
