id: GE-118g-1
title: "The collision pre-flight reads the repository's own pending changes, whatever directory it was started in"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a checkout of this repository whose decision records already claim the
    number 68,
  And a new decision record claiming that same number 68 is staged in that
    checkout,
  And a directory that is NOT inside any git work tree, which nonetheless holds a
    deployed copy of the collision pre-flight, so the published bare-relative
    command finds a program to run there,
  When the author runs the collision pre-flight as the project's numbering
    procedure prescribes it, with that non-repository directory as the working
    directory and no argument naming the repository,
  Then the pre-flight does not complete successfully, and what it reports is the
    collision — it names the number 68 and the record that already claims it,
  And it does not report that it was unable to read the pending changes.

  And given the same staged collision, when the author runs the pre-flight with
    the repository's own root as the working directory,
  Then it reports the same verdict about the same number — so the directory the
    program was started in is not an input to the verdict.

  And given instead that the staged decision record claims a number no existing
    record claims,
  When the author runs the pre-flight from that same non-repository directory,
  Then it completes successfully and reports no collision — so the verdict
    tracks the pending changes rather than refusing from wherever it is run.

  And given the staged collision again, and a run from the non-repository
    directory in which the pre-flight is prevented from establishing which
    repository it belongs to,
  Then it does not report "no collision": it reports that it could not read the
    pending changes and does not complete successfully — the absence of an
    answer is never presented as a clean answer.

  And given one further decision record claiming a second already-claimed
    number is added to the staged set,
  When the author runs the pre-flight from the non-repository directory,
  Then the set of colliding numbers it names grows to include that second
    number — so the numbers it reports are read from the staged set each run,
    and not from any fixed list.
