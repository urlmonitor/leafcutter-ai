id: DK-300d-3-i
title: "Resume preserves the initial snapshot while later evidence shows changes"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a run has checkpointed interpretation context and then waits for human or host input,
  And canonical source content changes before the run resumes,
  When the continuation proceeds,
  Then it reuses the checkpointed interpretation context without another initial recognition pass or silent refresh,
  And later retrieved evidence records its own snapshot and provenance so changed source state remains distinguishable,
  And an older checkpoint with historical gathered or no_evidence context retains its historical meaning instead of being relabelled as a successful entity-recognition result.
