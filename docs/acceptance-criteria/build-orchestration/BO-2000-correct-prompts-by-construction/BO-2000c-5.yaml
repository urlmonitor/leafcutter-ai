it_requirements:
  - "Edit the existing dispatch string lines in place in templates/workflows-js/build-feature.js (the 'Return a JSON result with at minimum { \"status\": ... }' sentences near the phase dispatch and the re-dispatch prompt) so the file does not grow -- it is already over the .js size limit."
  - "Apply the same change to the declared twin templates/workflows-js/build-ticket.js, which carries the same dispatch sentence."
  - "The replacement wording names status values ok | blocker | failed | handoff, the `message` field, and `handoff_target` (the field the driver routes handoffs on), and forbids passing the reply as a JSON string or in an `input` field."
test_spec:
  - name: test_phase_dispatch_prompt_directs_agent_to_fill_reply_tool_fields
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: criterion
    description: "Every phase dispatch and re-dispatch prompt assembled by build-feature.js and build-ticket.js names status (with ok, blocker, failed and handoff), message and handoff_target as reply-tool fields and forbids a JSON string or `input` wrapper."
  - name: test_phase_dispatch_prompt_no_longer_says_return_a_json_result
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: failure
    description: "Neither workflow template contains the phrase 'Return a JSON result' in any phase dispatch prompt, so an agent is never told to serialise its reply as JSON text."
  - name: test_prompt_status_values_match_phase_result_schema_enum
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: seam
    description: "The status values named in the dispatch prompt equal the status enum of PHASE_RESULT_SCHEMA in each template, so the prompt and the enforced schema cannot drift apart."
test_rationale: "The defect lives entirely in prompt text that is assembled as template-literal strings, and the enforced contract lives in PHASE_RESULT_SCHEMA in the same file. Static assertions over the template source pin the wording (the criterion), forbid the regressing phrase (the failure mode observed in the incident), and bind the prompt's status list to the schema enum (the seam that let `handoff` go missing). A live agent run cannot deterministically reproduce the model's misreading, so the contract is placed on the instruction the model receives."
