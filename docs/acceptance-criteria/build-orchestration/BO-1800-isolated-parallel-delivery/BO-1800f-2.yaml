notes: |
  Why this is a sibling of BO-1800f-1 and not nested under it. Currency and
  non-destructiveness fail independently: a delivery can be perfectly up to date and
  still take content away, because fitting the copy's work onto a newer state is
  where content gets dropped. The known issue this tree comes from says the same
  thing from the other side -- it keeps the manual audit as a backstop precisely
  because the audit is what would catch a bad replay. Nested under BO-1800f-1, this
  record would be vacuous in every test where currency is correctly implemented,
  which is the shape of check that looks green because it examined nothing.

  The ordering in depends_on is deliberate and is not nesting. It records that the
  examination happens on the post-currency delivery -- the "still" in BO-1800f's own
  wording -- while leaving both records as direct children of BO-1800f.

  Deliberate removals are not in scope for refusal. The value is that undeclared
  removals are refused, never that removals are refused; BO-1800f-2-i carries the
  declared case and is the discriminating half of this pair.

  Falsifiability. The fixture must introduce the removal AFTER the delivery has been
  brought up to date, so that an implementation which treats "we brought it up to
  date" as proof of safety proceeds and fails. The paired add-only delivery is required: a
  behaviour that refuses every delivery passes the first half and fails the second,
  and a behaviour that refuses nothing does the reverse, so neither can satisfy this
  record and no source-text inspection can satisfy either half.

  -- IT PO, 2026-09-14 (technical enrichment; nothing above this line was altered) --

  THE DECLARATION MECHANISM: a `Removes: <repo-relative path>` git trailer on any commit
  in the set being delivered, unioned across that set. The BA confirmed no declaration
  mechanism exists today and that surgical_removal_guard is a different sense of
  "removal"; that finding is upheld. Three candidates were weighed.

    1. Ticket/AC `files_touched`. REJECTED on three counts. It declares intent to TOUCH,
       and reading touch as authorization-to-remove collapses the rule to "any removal
       inside a file the work legitimately edits is allowed" -- which is the third row of
       BO-1800f-2-i's four-way table, the one its mixed fixture exists to fail. It is
       also unavailable on the paths that actually failed: two of the four recorded
       occurrences were on branches with no ticket drive, and the AC store cannot carry
       the field at all, since config/ac_store_schema.json is additionalProperties:false
       and has no files_touched property. Making it work would mean a NEW `files_removed`
       field on the ticket schema plus its validator and hook, and would still leave the
       bare `git worktree add` path undeclarable.
    2. A dedicated declaration file. REJECTED as the highest-cost option with no
       capability the trailer lacks. It is a new artifact surface: a deploy-manifest
       entry, a schema, a validator, a hook, and a teaching burden on every authoring
       agent. It lives in the tree, so it must be created and then cleaned up, and it is
       invisible at the place a reviewer actually looks -- the diff.
    3. A commit-message convention. CHOSEN. There is direct precedent on both sides of
       it: check_structural_change.py already treats a commit-message token
       ([NO-ARCH-UPDATE]) as an authoritative declaration a gate honours, and
       Co-Authored-By trailers are already mandated here, so agents already emit
       trailers. It is available on EVERY branch regardless of ticket, AC or epic, which
       is what covers all three worktree-creating paths named in the known issue. It is
       path-scoped, which is the only shape that separates the four behaviours in
       BO-1800f-2-i. It travels with its commit through BO-1800f-1's replay, so currency
       and declaration do not fight. And it lands in the PR next to the removal it
       authorizes, which is the review trail the known issue says is missing.

  WHAT IT COSTS, stated so it is chosen with eyes open:
    - Retro-declaration is awkward. A removal discovered at delivery time cannot be
       declared without amending a commit or adding an empty one. This is why the rule
       unions trailers across the delivery set rather than requiring the trailer to sit
       on the commit that performed the removal -- an empty trailing commit must be
       accepted. Amending an already-pushed commit is worse, and this gate does not make
       that case better.
    - Free text is fragile. A mistyped or absolute path silently declares nothing. The
       only defences are that the refusal names the exact undeclared path, and that a
       declared path matching no removal is reported as a declaration error rather than
       ignored. Both are it_requirements above.
    - The union rule is slightly loose: `Removes: X` on the first commit authorizes X's
       removal introduced by the seventh. Per-commit attribution would be tighter and
       would produce false refusals once a replay moves hunks between commits. Loose and
       correct was preferred over tight and wrong.
    - No globs means deleting a forty-file directory needs the directory form or forty
       lines. Accepted deliberately: a glob re-opens the blanket-allow hole.

  This is a NEW CONVENTION and is the input BO-1800f's two held L2 documentation slots
  were waiting on. The reference-doc trigger should document the trailer's syntax,
  scope and error cases; the sequence-diagram trigger should show the delivery boundary
  as read-tip -> replay -> adjudicate -> refuse-or-push.
