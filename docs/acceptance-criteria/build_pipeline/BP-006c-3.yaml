  - "The build/deploy step must be idempotent: a repeated build produces a deployed plan-feature.js byte-identical to the canonical source every time."
  - "Do not edit the canonical templates/workflows-js/plan-feature.js merely to satisfy a byte count — parity is achieved by deploying the canonical content faithfully, not by shrinking the source to match a stale artifact."
