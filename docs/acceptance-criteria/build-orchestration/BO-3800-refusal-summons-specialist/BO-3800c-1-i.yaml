id: BO-3800c-1-i
title: "A refusal that hands the work to a specialist but carries no usable demand stops the run and reproduces what it was given, rather than supplying a demand of its own"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven and delivery is refused with an outcome stating
    the disposition that hands the work to a restructuring specialist, but
    carrying no usable demand — the file unnamed, or the quantity absent, empty,
    blank, or not a quantity,
  When the run adjudicates that refusal,
  Then no restructuring specialist is engaged,
  And the run stops, reporting that the refusal was read and carried no usable
    demand, and reproducing the value it was given rather than substituting one,
  And delivery is not attempted again,
  And given instead a refusal the run could not obtain or read at all,
  When the run adjudicates it,
  Then the run stops and reports that distinguishably — a refusal that was read
    and said nothing usable is never reported as one that could not be read, nor
    the reverse,
  And in neither case is a demand supplied, defaulted to any value, inferred from
    the file, or obtained by re-running the standard.
depends_on:
  - BO-3800c-1
