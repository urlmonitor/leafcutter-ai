notes: |
  THE PER-STAGE DECISION THE L1 DEMANDED IS MADE HERE, EXPLICITLY, AND IT IS NOT UNIFORM:
    - commit time — BLOCKS. A whole-collection check that could not see the whole collection has
      established nothing, so allowing the commit would be certifying an unexamined state.
    - shared build — FAILS, for the same reason and because it is the backstop.
    - authoring time — ANNOUNCES and does not revert the write. Reverting an author's work over
      an unreadable file elsewhere in the collection punishes the wrong person, and the two later
      stages still hold the line.

  WHY A WHOLE-COLLECTION CHECK NEEDS THIS MORE THAN A PER-FILE ONE, which is the L1's point: a
  per-file check that cannot read its one input has plainly not checked that input, and it is
  obvious. A whole-collection check that reads 2,974 of 2,975 records looks like it worked. "I
  could not read everything, therefore everything is fine" is the exact reasoning this criterion
  forbids, and it is invisible without the read count.

  THE INHERITED FAIL-OPEN CONVENTION IS NOT REPEALED AND NOT CONTRADICTED. That convention holds
  that a guard's own internal error should not hard-block an unrelated commit; it says nothing
  about a guard that ran and could not see its subject. The boundary between the two is drawn
  explicitly in GE-120d-3-i, which is why that L3 exists.
