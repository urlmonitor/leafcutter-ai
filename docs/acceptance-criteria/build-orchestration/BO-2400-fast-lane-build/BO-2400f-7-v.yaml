it_requirements:
  - >-
    The runner's wait is bounded by the budget the request states, never by the shell's
    per-call default. A request with no stated budget is waited on for 600 seconds. The rule
    lives in the runner's own instructions, so it ships to consumer installs; raising the
    shell default globally or editing harness settings does not satisfy this record.
  - >-
    A single shell call is capped at 600 seconds by the tool itself. A stated budget above
    that (the claim's 900 seconds, BO-2400f-7-vi) must still be honoured, by waiting on the
    backgrounded command across further calls until it ends or the budget is spent. The
    budget is counted from the moment the command started, not reset per call.
  - >-
    The runner never re-runs, retries or kills a command it started in order to finish its
    turn. A store-changing command run twice can apply twice; a command stopped part-way
    leaves its effect unknown. Ending the turn while the command still runs is forbidden for
    the same reason.
  - >-
    The unfinished reply is a third reply shape, distinct from both BO-2400a-1-i shapes:
    it carries unfinished true, the command verbatim, the workspace, the step and the seconds
    waited as an integer, and it carries neither an exit_status key nor a declined key. The
    existing result and decline shapes stay exactly as BO-2400a-1-i defines them.
  - >-
    The result reply for a command that ran past 120 seconds is the same shape as for a
    quick one: exit_status as an integer and both streams relayed verbatim, each in its own
    field. A slow command must not change which stream its output is reported on.
  - >-
    No test is required for this record: every clause is model behaviour (how long the runner
    waits and when it ends its turn), which a unit test cannot observe, and a test that greps
    the template for the rule's wording would pass on a runner that ignores it. The
    observable halves are proved elsewhere: the budget on every request by BO-2400f-7-vi, and
    the lane's reading of an unfinished reply by BO-2400f-7-vii.
test_required: false
test_rationale: >-
  This record changes only the command-step-runner's instructions: how long it waits for a
  command and that it never ends its turn while one runs. That is model behaviour, which a
  unit test cannot observe. The observable halves are proved elsewhere. BO-2400f-7-vi
  proves every request states its budget. BO-2400f-7-vii proves the lane reads an
  unfinished reply as state unknown.
