notes: |
  CITED, NOT RESOLVED HERE: who counts as the executor and who counts as unidentified is GE-129a's
  (agent_id together with agent_type). The per-override unidentified-caller policy (BLOCK for these
  three) is BO-3200f-2-iii's declaration. This record only requires that the shell path applies
  the same answer the editing path does.

  BO-3200f-2-iii's caveat ("two of the three named guardrails may never see an executor command")
  is discharged by GE-130a; the executor holds shell only, so for it "every path" is the shell path.

  declares_side_effect: false.
