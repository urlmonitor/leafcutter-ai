      as a check that never ran, held open indefinitely instead of for one commit.
  - path: docs/pre-commit-hooks.md
    relationship: related
    status: exists
delivers_to: null
expects_from:
  - ac_id: GE-127g-1
    contract: >-
      The declared set of set-aside locations, each entry with its stated ground, and the
      single membership test over it. This record adds a ceiling field to each entry and
      consumes that membership test unchanged; it defines no second test and widens no
      location.
  - ac_id: GE-127g-2
    contract: >-
      The run's reporting of the judged and set-aside populations, and the requirement
      that each set-aside document appears in exactly one of them. This record adds a
      further statement about a document already counted among the set aside; it adds no
      population and moves no document between them.
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "ENRICHMENT DECISION — THE KEY NAME: report_above_lines, a sibling of path and ground
    inside each set_aside_locations entry in the doc_length section of
    templates/scripts/commit_guardian/commit_guardian.json. The name is chosen to carry
    the behaviour: it states the unit (lines) and the consequence (REPORTED above, not
    refused above). Do NOT name it max_lines or limit — doc_length's existing max_lines is
    the authored limit whose consequence IS a refusal, so reusing either word invites
    exactly this record's first named mutation at the level of naming, and a later reader
    skimming the declaration would read a refusal threshold."
  - "ENRICHMENT DECISION — THE THREE CEILING VALUES, PER DOCUMENT, WITH THE EVIDENCE THAT
    SETS EACH. Each applies to one document inside the location, not to the location's
    total, per the criteria's wording 'a document inside that location standing above its
    location's declared ceiling'.
    (a) docs/agents/cards/ — report_above_lines: 10000. Present maximum is
    python-coder.card.md at 2,809 lines, and the measurement that sets the shape is the
    rate, not the maximum: one ORDINARY regeneration moved that same document from 2,525
    to 2,809, a +284-line jump (+11.2%) carrying only unrelated records' assignment lines.
    10,000 is 3.56x the present maximum and roughly 25 further regenerations at that
    observed ordinary rate, so ordinary drift cannot reach it on any realistic horizon. It
    also sits BELOW the runaway this record's own notes name ('a generated card can go from
    2,809 lines to 28,000'), so the runaway is caught. Sanity check from the other side: a
    single card at 10,000 lines would be about 87% of the entire present directory (11,526
    lines across 64 documents), which is self-evidently a generator fault rather than
    content.
    (b) docs/roadmap.md — report_above_lines: 1500. It stands at 286 against the 300
    authored limit; 1,500 is 5.2x that. Its length tracks the number of phases, outcomes
    and tickets in docs/roadmap.json rather than anything a committing author writes, so
    reaching 1,500 means the roadmap mirror has grown more than fivefold — a roadmap.json
    problem, not drift.
    (c) docs/INDEX.md — report_above_lines: 2000. It stands at 289 lines, of which 233 are
    entry lines across 9 sections, so it grows at roughly ONE line per newly indexed
    document and is driven entirely by unrelated work. 2,000 is 6.9x present and leaves
    room for roughly 1,700 further indexed documents against about 233 today. NOTE THE
    DELIBERATE ASYMMETRY: INDEX.md gets a HIGHER ceiling than roadmap.md despite being
    almost the same size today, because its growth coupling is open-ended and roadmap.md's
    is not. The ceiling is sized by growth rate, not by present length, and this pair is
    the measured demonstration that per-location is right rather than global."
  - "All three values are to be re-derived, not copied, if the populations have moved
    materially by implementation time. The reasoning above is the deliverable; the numbers
    are its output. What must be preserved is the PROPERTY: crossed only when something is
    wrong with the source the location's ground identifies, never by ordinary
    regeneration."
  - "THE OVER-CEILING REPORT MUST NOT BE DERIVED FROM classify_dimension's VERDICT. Against
    the declared ceiling, a document already above it that SHRANK classifies 'pass' — the
    growth branch returns 'grew' only when current > previous. Verified against the real
    function on 2026-10-09: classify_dimension(12500, 13000, 12000) returns 'pass'. So the
    third arm's required statement cannot be triggered by a verdict word. The condition is a
    direct comparison of the measured size against the entry's declared ceiling, evaluated
    independently of the pass/grew/over classification."
  - "THE OVER-CEILING STATEMENT IS A STATEMENT ABOUT A DOCUMENT ALREADY COUNTED AMONG THE
    SET ASIDE. It must not create a third population, must not move the document into the
    judged count, and must not remove it from the set-aside count — GE-127g-2 requires every
    set-aside document to appear in exactly one of two counted populations. An implementation
    that promotes over-ceiling documents into the judged population breaks GE-127g-2's first
    arm and this record's first arm together, and converts this record's report into a
    refusal through GE-127g-1's own judged path."
  - "A MISSING CEILING AND A MISSING GROUND MUST BE SEPARATELY DIAGNOSABLE. The two
    validations are one step in all likelihood — an entry is well-formed only with both —
    but the refusal must say WHICH is absent and name the entry. A single message that
    cannot distinguish them leaves the author of the declaration unable to act, which is
    the diagnostic failure GE-127g-2-i's third arm exists to prevent one level up."
  - "An entry with no declared ceiling must be REJECTED, never defaulted. Neither
    'unbounded' nor 'fall back to the authored limit' is acceptable: the first leaves the
    whole record satisfiable while changing nothing, the second re-breaks GE-127g-1. The
    rejection is the one refusal this record admits, and it fires on the commit that edits
    the DECLARATION, where the person at the keyboard can act in the next keystroke."
  - "WHERE THE REPORTING LANDS, AND THE LINE BUDGET THAT FORCES IT.
    templates/scripts/commit_guardian/check_doc_length.py measures 359 lines against the
    400-line .py limit (measured 2026-10-09 with check_file_size's own measurement rule) —
    41 lines of headroom, and GE-127g-2's reporting requirement already consumes it. The
    over-ceiling statement plausibly belongs in the SAME helper module GE-127g-2 is already
    required to create rather than in a second one; adding both to check_doc_length.py takes
    it across its own limit and the commit is refused by a sibling of the gate being edited."
  - "DEPLOY-MANIFEST CONCLUSION: no deploy-map entry is required, PROVIDED the helper lives
    under templates/scripts/commit_guardian/. build_commit_guardian() in
    scripts/build_phases_lifecycle.py rglobs that whole directory, so a module there deploys
    with no manifest line. A module placed anywhere else — scripts/, scripts/ac_store/,
    templates/scripts/ root — needs an explicit entry in its phase's deploy map in the SAME
    change, or the deployed hook raises ModuleNotFoundError at hook runtime while the
    source-tree unit tests stay green. This repository has shipped exactly that failure once
    (done_proof.py). The config change needs no manifest work either: commit_guardian.json
    is already deployed to both scripts/commit_guardian/ and config/commit_guardian/ by the
    same phase."
  - "templates/scripts/commit_guardian/ is the SOURCE. scripts/commit_guardian/ and
    .leafcutter/scripts/commit_guardian/ are untracked build outputs in this checkout; an
    edit to a deployed copy alone is reverted by the next build."
  - "No clause here may be satisfied by raising max_lines, softening the blocking severity,
    or widening which documents are set aside. The parent L1's it_requirements forbid
    raising a limit for any document outside the declared locations."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_regeneration_below_the_ceiling_completes_and_stays_set_aside
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: templates/scripts/commit_guardian/check_doc_length.py
    description: >-
      Arm 1, and the negative control against the cheapest possible 'bound'. A real
      throwaway repo with a declared location carrying a ground and a report_above_lines
      ceiling; a generated document committed above the authored limit and below the
      ceiling, restaged longer but still below the ceiling. Assert the commit completes;
      that the document is reported as SET ASIDE; and — separately — that it is NOT reported
      as judged against the authored limit and NOT reported among those within their
      permitted length. The separate assertions matter: this arm is what proves the record
      has not reintroduced the defect the parent L1 removes. No build.py spawn and no layout
      fixture, so no marker.
    must_catch:
      - "obtain the bound by judging documents in declared locations against the authored limit after all"
      - "satisfy this record by moving over-ceiling documents out of the set-aside count and into the judged count"
  - name: test_crossing_the_ceiling_reports_size_ceiling_and_source_and_still_completes
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      Arm 2. Same location; the regeneration leaves the document ABOVE its declared ceiling.
      Assert the commit COMPLETES — asserted first and on its own, because it is the clause
      a reader's default assumption inverts — and that the outcome states the measured size,
      states the ceiling it was measured against, and NAMES the source the location's ground
      identifies. All three figures compared against values the fixture computed, never
      against literals. No marker.
    must_catch:
      - "refuse the commit when a document in a declared location stands above its location's declared ceiling"
      - "take the over-ceiling report from the refusal path, so the commit cannot complete"
      - "report that the document is enormous without naming the source responsible for it"
  - name: test_shrinking_while_still_above_the_ceiling_is_still_reported
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 3, THE LOAD-BEARING ENTRY AND THE ONE A TRANSPOSED READING DROPS. The document is
      above its ceiling at the parent revision and the regeneration leaves it SHORTER but
      still above. Against the ceiling this is classify_dimension's GROWTH branch returning
      'pass' (verified: classify_dimension(12500, 13000, 12000) == 'pass'), so an
      implementation that triggers the report from the verdict word says nothing at all
      here. Assert the commit completes AND that the outcome still states the document
      stands above its location's ceiling. No marker.
    must_catch:
      - "trigger the over-ceiling report from classify_dimension's verdict, so it is stated only when that verdict is 'over' or 'grew'"
      - "report standing above the bound only on the commit that crossed it"
      - "refuse the commit when a document stands above its location's declared ceiling"
  - name: test_raising_the_declared_ceiling_makes_the_report_disappear
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 4 first half. The same staged content as the previous entry, with that location's
      report_above_lines raised above the size the document measures. Assert the outcome does
      NOT state the document stands above its ceiling and names NO document as standing above
      any ceiling. The only entry a ceiling hardcoded in the gate's own code fails. FIXTURE
      CONSTRAINT: raise the ceiling above BOTH the parent and the staged size — the notes
      state this arm exercises the crossing branch, and a ceiling raised to sit between the
      two values still classifies 'pass' but via the growth branch, so a half-raise would
      pass while exercising a different branch than the record claims. No marker.
    must_catch:
      - "compare against a single ceiling written into the gate's own code instead of the one each entry declares"
      - "read the ceiling from the declaration but cache it across runs"
  - name: test_stated_size_and_headroom_follow_the_tree_when_the_ceiling_is_held
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 4 second half, the mirror of the entry above: hold report_above_lines where it was
      and regenerate the document larger again. Assert the stated size equals the size newly
      measured from the staged content, and that the stated headroom against the declared
      ceiling is smaller than the previous run's by EXACTLY the number of lines the document
      grew — both computed by the fixture from the tree, neither pinned. Together with the
      previous entry this holds one thing fixed and moves the other in both directions, the
      only shape no pair of literals satisfies. No marker.
    must_catch:
      - "state the measured size and the headroom as the numbers observed at implementation time"
      - "derive the headroom from a cached or previous size rather than from the staged content"
  - name: test_declaring_a_location_without_a_ceiling_is_refused_and_names_the_entry
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      Arm 5, the clause with teeth and the one refusal this record admits. Stage a commit
      that adds a set-aside entry carrying a stated ground and NO report_above_lines. Assert
      the commit does NOT complete; that the report names that entry; and that it states a
      location may be set aside only together with the size beyond which its documents are
      reported. Then assert the DISTINGUISHABILITY requirement by also staging an entry with
      a ceiling and a blank ground and confirming the two refusals say different things —
      one validation step, two diagnosable causes. No marker.
    must_catch:
      - "honour an entry with no declared ceiling by treating its ceiling as unbounded"
      - "honour an entry with no declared ceiling by treating its ceiling as the authored limit"
      - "emit one message that cannot distinguish a missing ground from a missing ceiling"
  - name: test_deployed_gate_reads_the_declared_ceilings_and_reports_above_them
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: deployed
    surface_invoked: scripts/commit_guardian/check_doc_length.py
    description: >-
      The deploy-manifest arm, and the one that matters here because the over-ceiling
      reporting is required to live in a helper module outside check_doc_length.py. Runs the
      gate from the real DEPLOYED layout over a staged document above its declared ceiling
      and asserts it produces the over-ceiling statement and a completing commit rather than
      a ModuleNotFoundError — proving both that the helper deployed and that the deployed
      copy of the declaration, carrying the ceilings, is the one in effect. Requests the
      session-scoped shared_reference_layout fixture and declares
      @pytest.mark.shared_layout_reader; it only reads the layout, so it must not spawn its
      own build.py (one build costs 59.8s).
    must_catch:
      - "add the over-ceiling helper module outside templates/scripts/commit_guardian/ without a deploy-map entry, so the deployed hook crashes while source-tree tests stay green"
      - "edit the deployed scripts/commit_guardian/ copy instead of the templates/ source"
test_rationale: >-
  Six entries, one per criteria block, plus one deployed-layout entry. Every one stages real
  documents in a real git repository, invokes the gate as a subprocess and reads the verdict
  and the figures out of the run's own output. A test asserting that a report_above_lines key
  appears in commit_guardian.json satisfies nothing — it passes on a gate that never reads
  the ceiling and on a gate that never runs — and CLAUDE.md's behavioural rule outranks any
  test_spec that blessed that form.
  THE BRANCH LABELLING IN THE RECORD'S NOTES WAS VERIFIED AGAINST THE REAL FUNCTION RATHER
  THAN TRUSTED, because a sibling record (GE-127g-1-i) had its mutation arms transposed in
  exactly this way. Executing classify_dimension on each arm's values confirms every claim
  the notes make: arm 1 against the ceiling is the crossing branch returning 'pass' and the
  same document against the authored limit is the growth branch returning 'grew'; arm 2 is
  crossing/'over'; arm 3 is growth/'pass'; arm 4's first half is crossing/'pass' and its
  second half growth/'grew'. The notes are correct as written and need no correction. One
  detail they do not state, and which the fourth entry now carries as a fixture constraint:
  a ceiling raised to sit BETWEEN the parent and the staged size also yields 'pass', but via
  the growth branch rather than the crossing branch the notes name — so the fixture must
  raise it above both values or the arm passes while exercising a different branch than the
  record claims.
  THE THIRD ENTRY IS THE LOAD-BEARING ONE and the reason the arm exists at all: against the
  declared ceiling, a document that is already above it and SHRANK classifies 'pass', so any
  implementation that triggers the report from the verdict word is silent precisely when the
  document is most over its bound. It is the narrowest mutation in the record and no other
  entry reaches it.
  THE SECOND ENTRY ASSERTS THE COMPLETING COMMIT FIRST AND ON ITS OWN. A reader's — and a
  coder's — default assumption about any threshold is that crossing it refuses, so this is
  the clause most likely to be delivered backwards rather than omitted, and getting it wrong
  reinstates the unactionable refusal the whole parent L1 exists to remove. Mutation (1)
  leaves this record's first arm, arm 4's first half, arm 5 and every arm of five sibling
  records green, which is the measure of how easily it could ship.
  NO FIGURE IS PINNED ANYWHERE. Every expected value — sizes, ceilings, headroom, populations
  — is computed by the fixture from the tree at run time. The record's notes are explicit that
  pinning 64, 2,809, 286 or 289 goes red the next time an agent is added or a document is
  written, which is the opposite of what the record says. The fifth entry states its
  expectation as a RELATIONSHIP (headroom falls by exactly the growth) rather than as a pair
  of numbers, which is what keeps it true as the population moves.
  Markers: only the seventh entry requests shared_reference_layout and therefore carries
  @pytest.mark.shared_layout_reader. The other six neither request the fixture nor build
  anything, so they sit outside the marker-routing mechanism entirely and pay no build cost.
  The deployed entry is not optional here even though three sibling records already have one:
  this record's reporting is required to live in a helper module outside
  check_doc_length.py, which has 41 lines of headroom, and an undeployed helper is invisible
  to all six source-tree entries.
