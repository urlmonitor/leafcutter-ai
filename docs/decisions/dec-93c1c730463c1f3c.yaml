options:
  - id: opt.per_criterion_files
    title: one YAML file per criterion in a new docs/criteria/ folder
    description: 'Each reusable criterion gets its own reviewable YAML record in docs/criteria/ (same style as the decision
      records): id, question, priority, kind and flat filters (category, decision_type, components). Decision records reference
      criterion ids. A generated index lists the records.'
    assumptions: []
    evidence_ids: []
    proposed_by: null
    approved_by: null
  - id: opt.category_catalog
    title: one catalog YAML of criterion categories, each listing its member criteria
    description: A single catalog file holds every category; each category nests its member criteria. Regrouping is an edit
      inside one file. Decision records reference criteria by id.
    assumptions: []
    evidence_ids: []
    proposed_by: null
    approved_by: null
  - id: opt.index_from_records
    title: keep criteria inside decision records and generate a criteria index from them
    description: 'No new hand-written file type: criteria stay nested in docs/decisions/dec-*.yaml; a generator writes a criteria
      index with the decisions, decision_type and components each criterion appeared in, derived counts and a category field.'
    assumptions: []
    evidence_ids: []
    proposed_by: null
    approved_by: null
  - id: opt.category_files_with_refs
    title: One YAML record per criterion category, decisions reference categories, counts generated
    description: 'One YAML record per category (a cluster of similar criteria): canonical question, decision_type/components
      filters, block list of member wordings. Each criterion nested in a decision record gains an additive category reference.
      Usage and outcome counts are generated into an index, never hand-edited.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code
    approved_by: human:user
  - id: opt.criterion_kind_in_decision_store
    title: A new 'criterion' record kind inside the existing decision store
    description: 'Reusable criteria become records of a second kind (kind: criterion) inside docs/decisions/, validated by
      the same `python -m kernel decisions validate` and listed by the same generated index; no new folder or config/paths.json
      surface.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code
    approved_by: human:user
  - id: opt.category_records_membership_refs
    title: Category records (SKOS-style labels) that hold membership as (decision id, criterion id) references
    description: 'One reviewed YAML record per category with a stable id and declared kind (ADR-061 key): canonical question
      as preferred label, other wordings as alternative labels, an optional broader category, and a replaced-by link when
      categories merge or split. Membership lives only in the category record as (decision id, criterion id) pairs, so published
      decision records stay unchanged. Category records are staged in the run root and enter Git only through a human-run
      publish. Usage counts are generated from published records; outcome statistics are Neo4j aggregates keyed by category
      id (ADR-065), never in Git.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:basis_review_prototype
    approved_by: human:user
criteria:
  - id: crit.approval_unit_and_path
    question: 'Does the option name the unit a human approves (a category, a criterion, or a criterion''s membership in a
      category) and give it a path like decision records have: staged in the run root, entered into Git only by a human-run
      publish command, and never created directly from Langfuse or from a mined candidate (ADR-060, ADR-058)?'
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-18a5b9e23f10db73
      - ev-fdebbb68d094b1e0
      - ev-d55eebec654804e3
      - ev-e15d88acbc485ae9
      - ev-6979351886456aee
  - id: crit.filters_from_declared_vocabularies
    question: Are category, decision_type and components top-level plain-YAML fields whose values come from declared vocabularies
      that validation enforces, with the category list itself a reviewed vocabulary (ADR-061 section 4)?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-fdebbb68d094b1e0
      - ev-c7f5671559baafaf
      - ev-55f84bcf06ebea43
      - ev-d55eebec654804e3
      - ev-6979351886456aee
  - id: crit.projectable_as_native_kind
    question: Can the ADR-062 projector read the store as one reviewed native kind with canonical ids, without changing how
      the existing Decision kind is read (its filename rule and pinned schema)?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-c7f5671559baafaf
      - ev-0fdd05eee9d94dfa
      - ev-55f84bcf06ebea43
      - ev-6979351886456aee
      - ev-e15d88acbc485ae9
  - id: crit.regroup_without_rewrites
    question: Is category membership kept in one place outside the published decision records, so that merging, splitting
      or moving a criterion edits only category data, and retired ids stay resolvable through a recorded replaced-by link?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-c3d6f4f3813b9bb9
      - ev-6979351886456aee
      - ev-e15d88acbc485ae9
      - ev-55f84bcf06ebea43
      - ev-3bd757a9bb29d915
  - id: crit.outcomes_left_to_colony_store
    question: Does the format keep outcome and success statistics out of Git and expose only stable criterion or category
      ids that ADR-065's derived Neo4j aggregates can key on?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-fdebbb68d094b1e0
      - ev-6979351886456aee
      - ev-e15d88acbc485ae9
      - ev-55f84bcf06ebea43
      - ev-0fdd05eee9d94dfa
  - id: crit.stable_identity
    question: Does every stored criterion or category get a repository-unique, stable id with a declared kind under ADR-061's
      (repository_id, kind, id) key, with validation that rejects duplicate ids and dangling references, given that decision-local
      criterion ids already collide today?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-55f84bcf06ebea43
      - ev-0fdd05eee9d94dfa
      - ev-3bd757a9bb29d915
      - ev-e15d88acbc485ae9
      - ev-b7fc7cba343d593c
  - id: crit.usage_generated_not_written
    question: Are usage counts (how many published decisions used a criterion or category) produced only by a generator from
      published records and checked for freshness like docs/decisions/index.json?
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-56259058d60581e8
      - ev-fdebbb68d094b1e0
      - ev-d55eebec654804e3
      - ev-18a5b9e23f10db73
      - ev-55f84bcf06ebea43
  - id: crit.existing_consumers_unchanged
    question: Do the existing readers of docs/decisions (validate and index in kernel/memory, the file precedent backend,
      the knowledge-map docs surface and the ADR-062 Decision projector) keep working without a change?
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-56259058d60581e8
      - ev-18a5b9e23f10db73
      - ev-0fdd05eee9d94dfa
      - ev-d55eebec654804e3
      - ev-55f84bcf06ebea43
  - id: crit.cheap_candidate_lookup
    question: Can a later run find candidate criteria or categories by filter and by criterion wording, not only by a decision's
      question and title, without opening every file?
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-0fdd05eee9d94dfa
      - ev-56259058d60581e8
      - ev-d55eebec654804e3
      - ev-18a5b9e23f10db73
      - ev-c3d6f4f3813b9bb9
  - id: crit.no_new_package_surface
    question: 'Can the format ship without a new config/paths.json surface or pre-commit hook, which would need an acceptance
      criterion with package_surface: true?'
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-56259058d60581e8
      - ev-0fdd05eee9d94dfa
      - ev-eb8ec95cb3030bb5
      - ev-d55eebec654804e3
      - ev-3bd757a9bb29d915
