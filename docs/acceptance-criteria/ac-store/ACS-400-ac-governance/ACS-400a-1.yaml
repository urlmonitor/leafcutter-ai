criteria: |
  Given an AC YAML file is staged for commit with a populated criteria field,
  When the committing agent's identity is one of:
    product-owner-v3, business-analyst-v3, it-po-v3, or a human user,
  Then the commit proceeds without governance violation,
  And the file is accepted into the repository with the criteria field intact.
