notes: |
  DECISION ON USER BRIEF ITEM 7: PLACED UNDER TQ-500f-2, NOT TQ-500g-1. TQ-500f-2
  owns how a requirement names its wrong versions (schema, validation,
  TQ-500f-2-i's refusals, and who fills the list, TQ-500f-2-ii). A test-defect
  name is an authoring defect in that list, so the guard belongs where the list
  is written, before any drive. TQ-500g-1 runs the names; it can only discover
  the defect as a blocking could_not_prepare, which is what the user wants to
  avoid. The preparer backstop (last And) is the one TQ-500g-1-side piece and
  is kept here so the rule lives in one AC.

  WHY NOT A MECHANICAL REFUSAL IN THE VALIDATOR. A store sweep on 2026-10-23
  found many legitimate must_catch names that start with "assertion",
  "fixture" or "a test", for code that itself reasons about tests:
  TQ-500g-3-iii ("assertions matched by position, so an inserted assertion
  shifts the strict one"), TQ-600a-13-xii ("a test falls in no collection"),
  TQ-200d-1 ("fixture check accepts cvd-only seeding"). A word or
  leading-phrase rule would refuse those, so the line between a test defect and
  a code wrong version is a judgement: "can a change to the code under test be
  this name?". That judgement belongs to the agent that reads the code (the
  test designer), proven by an eval, not by a commit-time regex. C5 is the
  control that rules out a keyword implementation. Commit hooks cannot dispatch
  agents, so an LLM check at commit time is not available either.

  SINGLE AGENT. Both prompt surfaces (test-designer.md and test-breaker.md) are
  llm-expert's; split if IT-PO wants the backstop shipped separately.

  EXISTING STORE. The two names in BO-2900a-1-ii named in the analysis should be
  corrected by hand now (analysis section 6); this AC does not rewrite existing
  records.

  TESTABILITY. Prompt-only: an eval (TQ-200d family) over the C1-C5 candidate
  set, scored on which names end up in must_catch and which code-side
  counterparts replace C1 and C2. IT-PO to set test_required and the eval home.

  IT-PO ENRICHMENT (2026-10-23)
  llm-expert, one change over both templates (no split: both are prompt
  surfaces of the same specialist). test_required false; the eval over C1-C5
  is a recommended follow-up record (eval home scripts/evals/sets/). expects_from
  set to null: the dependency on TQ-500f-2-ii is an ordering on the same
  template (kept in depends_on), not a data contract, and TQ-500f-2-ii
  (approved) declares no delivers_to.
