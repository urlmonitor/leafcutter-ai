notes: |
  Authoring evidence (2026-09-21, origin/main 624d39ac):
    - The 1:29:47 runtime was discovered only because somebody sat through a
      run and asked. There is no existing measurement surface.
    - Cost is extremely concentrated: the top 60 of 5318 tests are 3404s, or
      63% of total wall clock. Naming offenders is therefore high-value and
      cheap — a short list explains most of the time.
    - A working profiler already exists in prototype form (junit-xml based,
      aggregating per-directory / per-file / per-test with mean-per-test). It
      currently lives in /tmp and was REAPED mid-investigation by the hourly
      wsl-reclaim timer, which is itself an argument for a durable location.

  IMPORTANT BOUNDARY for the BA decomposing this L1: this repo's own history
  says a guard that cannot fail is worse than no guard, because it reports
  clean forever. Three documented precedents — the feedback_categories.yaml
  path that reported "missing" on every worktree, the AC validator that
  exited 0 having checked zero files for eight days, and the merge audit that
  compared against a stale ref — are all the same defect: a check that
  examined nothing looked like a check that found nothing.

  So a child AC asserting "the budget check exists" or "the budget check
  passes" is NOT sufficient and will be rejected in review. At least one child
  must prove the check CAN fail: feed it a deliberately over-budget run and
  assert it exits non-zero AND names the offending test. See TQ-500 (checks
  that can fail) for the sibling goal this mirrors — TQ-500 is about test
  strength generally; this is the same discipline applied to this guard.

  The budget VALUE is deliberately left to the it-po/BA: it depends on what
  TQ-600a and TQ-600b actually recover, and must be set from a measured
  post-fix baseline rather than picked now. Do not hardcode a number into a
  child AC before that baseline exists; specify how the number is derived and
  where it is recorded.
