id: TQ-600a-13-xv
components:
  - testing_quality
title: "When the post-merge verdict changes, every open pull request's hold is re-evaluated without anyone pushing, in both directions"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the hold is evaluated on pull request events (TQ-600a-13-vi), so a pull
    request evaluated before the verdict changed keeps its earlier result until something
    evaluates it again,
  And the two ways that goes wrong: a pull request that passed before a red run stays
    mergeable while main is red (a stale pass), and a pull request held during a red run
    stays held after main goes green until its author pushes — an agent fleet pushing
    empty commits to clear a hold that no longer applies (a stale hold),
  When a correctness run on main settles and its verdict differs from the verdict of the
    previous settled run — green to not green, or not green to green —
  Then the most recent hold evaluation of every open pull request targeting main is run
    again, so each receives a verdict from the new run history without a push,
  And this happens after the run has settled, so the re-evaluation reads the new run and
    not the one before it,
  And a settled run whose verdict equals the previous one, and a superseded cancellation,
    re-evaluate nothing,
  And a pull request whose hold evaluation is still in progress is skipped, because it
    will read the new history itself,
  And a pull request whose last hold evaluation cannot be run again — for example because
    it is older than the hosting service allows to re-run, or the re-run is refused — is
    named, with the reason, in the re-evaluation's output and on the canonical
    `post-merge-red` notice when one is open, never skipped silently,
  And the re-evaluation is performed by a job of its own whose only write is re-running
    runs of the hold workflow,
  And this is demonstrated by applying a red-after-green and a green-after-red run history
    against a double serving open pull requests with completed, in-progress and
    too-old hold runs, and observing exactly which re-runs are requested and which pull
    requests are named,
  And whether the hosting service lets the workflow's own credential request those
    re-runs is observed once on the real repository and recorded before TQ-600a-13-x
    makes the hold required.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-v
  - TQ-600a-13-vi
