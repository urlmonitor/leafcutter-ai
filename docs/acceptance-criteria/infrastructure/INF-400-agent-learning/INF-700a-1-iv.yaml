test_spec:
  - name: test_three_ticket_commits_on_one_branch_merge_exactly_one_copy
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Real CLI, real scratch git: three stage/commit-by-name/observe cycles on one branch, then merge; the merged destination holds the learning once."
  - name: test_a_record_already_on_head_is_skipped_unclaimed_and_counted
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The second ticket's stage names no manifest path, reports already_on_branch 1 in both the stage reply and the observe report, and claims nothing in the state file."
  - name: test_a_write_left_by_a_refused_commit_is_restaged_without_a_second_append
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "A refused commit leaves the write in the worktree; the next stage names it in the manifest without appending again, and the next commit carries one copy."
  - name: test_the_epic_result_carries_each_tickets_routing_and_the_drive_totals
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "Drive build-epic.js under the engine harness with ticket-supervisor replies carrying different knowledge_routing figures; assert the epic result lists each ticket's figures and sums them, and that differing figures produce differing results with equal status."
  - name: test_the_skill_orders_stage_commit_by_name_and_observe_inside_the_commit_lock
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Parse the commit-phase procedure ticket-supervisor follows into its ordered steps, and assert lock-acquire, then stage, then the commit spawn whose stage list consumes the manifest, then one observe whose reply is returned, then lock-release."
test_rationale: |
  The duplicate defect is only visible across several commits on one branch,
  so the dedupe tests drive the real CLI through real git for more than one
  ticket. Skill prose cannot be executed in the unit layer, so its test asserts
  that the step's output is consumed in the procedure's control flow. The
  epic-level consumption is exercised by running build-epic.js itself.
notes: |
  Found 2026-10-09 while wiring ADR-040 section 3. PR #1071 removed
  build-epic.js's workflow-level routing step because no commit followed it.
  Moving the step to the per-ticket commit exposed the N-copies defect, because
  the stage had assumed one stage per branch. The real /build-feature epic route
  is build-feature.js, which runs its own per-phase driver and dispatches commit
  itself without ticket-supervisor. It is NOT covered by this AC and stays
  excluded, with a corrected reason.
change_target:
  - pipeline
  - code
risk_surface: contract_boundary
