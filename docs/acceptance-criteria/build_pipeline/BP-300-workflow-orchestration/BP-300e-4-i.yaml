id: BP-300e-4-i
components:
  - build_pipeline
title: "An empty or whitespace-only reply stops the run with the clear named error, never a silent skip"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
work_status: todo
criteria: |
  Given a helper agent returns an empty string or a reply consisting only of
    whitespace,
  And the point in the run that reads that reply is not named in the workflow's
    declared degradation register,
  When the workflow reads the agent's reply,
  Then the run stops with the same clear, typed error that names the stage and the
    agent,
  And the empty reply is never treated as an acceptable or skippable result — the
    failure is surfaced, not hidden.

  Given the same empty or whitespace-only reply,
  And the point that reads it IS named in the workflow's declared degradation
    register,
  When the workflow reads the agent's reply,
  Then the run behaves exactly as it does for a prose-only reply at that same point
    — it carries on with the substitute value that register entry declares, and its
    account of what happened records that the stage carried on without a readable
    reply,
  And "nothing came back" is never given a gentler treatment than "something
    unreadable came back", so an empty reply can never slip through a reading point
    that a prose-only reply would have stopped.
depends_on:
  - BP-300e-4
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Empty-string and whitespace-only replies must raise the SAME typed stage/agent error as the prose-only case (BP-300e-4); never returned as None/empty and never swallowed or treated as skippable."
  - "The tolerant reader stays a pure, synchronous, dependency-free function; confine try/except to the JSON.parse boundary only."
  - "Behavior must be verified by a runtime behavioral test through the vm.Script replay harness with '' and a whitespace-only string, not a source string-scan."
  - "The declared degradation register is consulted by the CALLER, not by the reader: the reader's behaviour is identical for empty, whitespace-only and prose-only input, so there is no separate empty-reply code path that could diverge from the prose-only one."
delivers_to: null
expects_from:
  ac_id: BP-300e-4
  contract: >-
    Inline tolerant reader parseAgentJson whose typed stage/agent-named error path also
    covers empty and whitespace-only inputs, and the caller-side declared degradation
    register that decides whether that error halts the run or is degraded to the
    entry's declared substitute.
