id: GE-122c-1
title: "While you are still writing, a specialist is actually brought in to renumber"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an authoring session in which an agent writes a new record declaring an identifier that
    another record already in the collection claims,
  When the write completes and the authoring-time guard runs on it,
  Then the guard's output is returned into the running session, so the working agent receives it
    rather than it going only to a terminal nobody is reading,
  And that output states the contested identifier, the path of every artifact claiming it, and a
    free identifier the author can move to,
  And a business-analyst is DISPATCHED to perform the renumbering — observable as a
    business-analyst invocation that actually occurs after that write and before the session
    proceeds to unrelated work,
  And when the same guard runs on a write that introduces no contested identifier, NO
    business-analyst is dispatched and the session proceeds unimpeded.

  Coverage note — this criterion is satisfied ONLY by a test that observes the dispatch actually
  happening. It is NOT satisfied by a test asserting that the guard's output contains the words
  "business-analyst", nor by one asserting that a dispatch function is defined, nor by one
  asserting the guard is registered at the right hook point. Every one of those passes on a
  guard that never dispatches anything. That is not a hypothetical: an existing guard in this
  repository is documented as automatically dispatching a triage specialist, returns success
  unconditionally, and routes its remediation through a placeholder that stamps every input with
  the reason "standalone-mode placeholder". A documented-but-dead dispatch is the specific
  outcome this criterion exists to prevent, so the evidence bar is the dispatch itself.
depends_on:
