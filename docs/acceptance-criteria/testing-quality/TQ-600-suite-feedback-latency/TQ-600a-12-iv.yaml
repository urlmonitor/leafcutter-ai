notes: |
  THE DEFECT CLASS IS "THE ROUTE LOOKS LIKE THE THING IT REPLACES AND IS NOT." The
  private-copy route's own description says it mirrors the status quo every
  non-migrated test already pays. It does not: the status quo is a build into an
  empty directory at 14.81 s, and the route is a whole-tree copy plus a self-targeting
  build at 48.94 s. Nobody has noticed because the route has, so far, only ever been
  taken by tests that had no cheaper alternative.

  The moment TQ-600a-8 starts moving the existing population, that stops being true.
  Twenty files of the cheaper shape routed onto the mutator marker is about 680 s
  added by a change whose entire purpose is to remove time — and it would be
  invisible, because the migration would report a successful move and the suite would
  simply be slower.

  This record is deliberately not coupled to the seed option. It is worth building on
  its own and on the earliest possible date, because its value is entirely in being
  in place BEFORE the first file moves.
