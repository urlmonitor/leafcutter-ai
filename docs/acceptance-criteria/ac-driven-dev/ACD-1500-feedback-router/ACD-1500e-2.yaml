id: ACD-1500e-2
readiness: approved
priority: medium
title: "Emitted process-feedback names the specific deficiency so it is actionable"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the router is emitting process-feedback because entry F1 was too thin to route,
  And the specific deficiency was that F1 (a bug-fix) had no target_file and an empty note,
  When the router composes the process-feedback note,
  Then the note names the exact missing or thin fields ("bug-fix entry F1 lacked
    target_file and had an empty note"),
  And the note references the originating feedback entry id (F1) so a reader can
    inspect the offending entry,
  And the note states which routing decision was blocked as a result,
  And the note is specific enough that a future run or human can act on it without
    re-deriving what went wrong.
