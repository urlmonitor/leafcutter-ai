title: "Ticket frontmatter supports a structured test_constraints field"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket markdown file under tickets/,
  When its YAML frontmatter is parsed,
  Then it may contain a "test_constraints" field with a structured value
  And the test_constraints field supports the following sub-fields:
    - isolation: enum [unit, integration, end_to_end]
      (what level of isolation the tests require)
    - environment: enum [local, staging, production_mirror]
      (what environment the tests need to run against)
    - coverage: integer 0-100
      (minimum coverage percentage required for the changed code)
  And all sub-fields are optional (default: isolation: unit, environment: local,
    coverage: null meaning no coverage threshold enforced)
  And the ticket_frontmatter_guard hook validates the structure when present

  Given a ticket does NOT have a test_constraints field,
  When ticket-supervisor computes the chain and TDD agents are injected,
  Then test-writer uses its default strategy (unit tests, local environment,
    no coverage threshold)
