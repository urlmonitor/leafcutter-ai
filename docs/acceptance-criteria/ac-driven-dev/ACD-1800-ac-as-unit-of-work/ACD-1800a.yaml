amended_by:
  - "2026-08-17 sequencing pass: added depends_on ACD-1900a (SCHEMA SLOT). The deliverable checklist is a NEW AC field, and config/ac_store_schema.json declares \"additionalProperties\": false at top level (line 15) -- enforced today by scripts/ac_store/validate_ac_schema.py via jsonschema.Draft7Validator (~line 152; confirmed empirically 2026-08-17: a probe AC carrying an unknown field is rejected with 'Additional properties are not allowed' and exit 1). No checklist can therefore be authored before ACD-1900a's additive-first, optional-field landing. This edge is a hard prerequisite, not a preference."
  - "2026-08-17 sequencing pass: added depends_on ACD-1700b (SURFACE-TO-CRAFT MAP). Each checklist entry carries a `craft` attribute (ACD-1800a-1) that must resolve to a real agent id in config/agent_registry.json; ACD-1700b is the L1 that establishes the surface-to-craft mapping which makes that resolvable. Without it the checklist can name a craft that no agent implements, and the recurring mis-assignment failure documented in memory/feedback_itpo_agent_assignment_by_surface (python-coder stamped uniformly onto JS/prose/doc deliverables) reappears one layer up, now baked into the requirement itself. This closes the loop ACD-1700b's own amended_by entry of 2026-08-14 asked for: it recorded this as an UNDECLARED CROSS-TREE CONSUMER and asked that the edge be added 'when ACD-1800a is next amended'."
