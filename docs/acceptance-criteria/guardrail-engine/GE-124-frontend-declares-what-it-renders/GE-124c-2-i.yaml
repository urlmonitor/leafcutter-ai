criteria: |
  Given the same criterion id string is presented to the frontend declaration
    check, to the code-declaration check that GE-117 governs, and to the
    traceability check that GE-111 governs
  When each check decides whether the id resolves
  Then all three return the same answer for that id
  And all three obtained it from the one shared resolver, with no private
    resolution path in any of them

  Given the acceptance-criteria store gains a new criterion
  When the same id is presented to all three checks without any further change
  Then all three now resolve it
