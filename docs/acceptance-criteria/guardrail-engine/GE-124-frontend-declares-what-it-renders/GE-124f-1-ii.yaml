notes: |
  The PO's words: nothing here makes the pin compulsory — a page with no design
  modelled in the product-truth store is simply not part of the chain, and that
  is a normal state, not a finding.

  Recorded as a distinct state rather than as silence because the two look
  identical in a report that only counts findings, and they mean opposite
  things: outside-the-chain is fine, resolves-to-nothing is a defect. GE-124g-3
  needs them apart for the same reason — a chain-completeness figure that counts
  pages with no design as failures would be a number that mixes two things.
