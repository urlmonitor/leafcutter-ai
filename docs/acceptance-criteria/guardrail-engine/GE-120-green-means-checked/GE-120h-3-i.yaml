    relevance: >-
      THE JUDGEMENT THIS RECORD IS WRITTEN AGAINST, IN ITS OWN VOCABULARY. Its documented
      rules are explicit: a whole-tree entry that also carries a files condition is
      UNREACHABLE; a whole-tree entry carrying no files condition is reachable; and a
      condition anchored on a location no checkout holds is UNREACHABLE rather than the
