notes: |
  This reviewed mapping extension refines the native-field scope of KM-400a-3-i
  and KM-400a-1; it does not introduce a competing Decision authoring store.
  The reader receipt reports 61 passing cases. The active immutable source and
  delivered Aura graph contained zero Decisions. One pending checkout record
  was compared read-only and was neither copied nor published. Generated Decision
  index freshness remains an upstream validation requirement, not a reader claim.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Trusted portable Decision validation cannot be weakened by a schema supplied inside the source snapshot; approval,
  classification and reciprocal-reference rules remain mandatory.
- Only the selected immutable canonical Decision source may contribute history; no pending-merge record, runtime
  event or empty-store placeholder is promoted into approved memory.
