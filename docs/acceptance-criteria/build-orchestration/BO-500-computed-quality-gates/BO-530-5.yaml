it_requirements:
  - "The ruff check must run against the ticket's new/changed Python files using the repository's own ruff configuration, so it matches what CI enforces (no divergent local ruleset)."
  - "On ruff failure the sign-off MUST be failed/blocked, never advisory — lint violations cannot be downgraded to a warning that still allows an 'ok' sign-off."
  - "This gate must not rely on the worktree pre-commit hooks firing (worktrees historically lack the .pre-commit-config wiring); the ruff check runs as part of the python sign-off itself, independent of whether pre-commit ran."
  - "The deterministic ruff-runner (invoke ruff over the changed-file set, classify clean vs violations) is a python-coder surface; this AC owns the sign-off-gate behavior in the python-coder template + signoff skill."
delivers_to:
  agent: python-coder
  contract: "A ruff-runner helper that runs the repo ruff config over the ticket's changed Python files and returns a clean-vs-violations verdict the sign-off gate consumes"
