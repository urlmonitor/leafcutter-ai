id: GE-111b-1
readiness: approved
priority: high
title: "File-path floor: a vanished implemented_by path is drift, with no external tooling"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111b.yaml"
criteria: |
  Given an acceptance criterion AC-X has implemented_by entry "src/foo.py" with
    no #symbol anchor
  And the staged commit deletes "src/foo.py" so the path no longer resolves to a
    file in the staged tree
  When the traceability reconciliation check evaluates AC-X
  Then the check produces a drift verdict for AC-X naming the change kind as deleted

  Given an acceptance criterion AC-Y has implemented_by entry "src/old/bar.py"
  And the staged commit renames "src/old/bar.py" to "src/new/bar.py" so the
    recorded path no longer resolves in the staged tree
  When the traceability reconciliation check evaluates AC-Y
  Then the check produces a drift verdict for AC-Y naming the change kind as moved or renamed

  Given an acceptance criterion AC-Z has implemented_by entry "src/baz.py"
  And the staged commit edits "src/baz.py" but the path still resolves to a file
    in the staged tree
  When the traceability reconciliation check evaluates AC-Z
  Then the check produces a clean verdict for AC-Z

  And the file-path floor verdict is produced without invoking any external
    symbol-analysis tooling
