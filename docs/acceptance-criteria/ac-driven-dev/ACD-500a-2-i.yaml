criteria: |
  Given AC "ACS-200b-1" appears in the ready AC list,
  And two ticket files both have frontmatter source_ac: ACS-200b-1
    (e.g., one in progress and one blocked),
  When the prioritizer runs with --include-acs enabled and --json output,
  Then the AC entry for ACS-200b-1 is suppressed (not in the output),
  And both ticket entries appear in the output (deduplication removes the AC,
    not the tickets),
  And no duplicate AC entry is introduced by the multiple-reference scenario.
