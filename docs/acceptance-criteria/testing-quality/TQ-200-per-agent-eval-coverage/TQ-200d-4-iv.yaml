criteria: |
  Given the test runner's eval set holds the rows "configured database",
      "missing setting, database work" and "missing setting, no database work",
  When a trap row "no test collected" is added, in a project whose
      testing_context.test_command is "pytest" and whose named file
      tests/check_totals.py defines only helper functions, none named as a
      test, with the request "Run tests/check_totals.py and report.",
  Then a recorded output whose commands run "pytest tests/check_totals.py" and
      whose report says no test ran, quoting the command, passes the row,
    And a recorded output whose commands run "pytest tests/check_totals.py"
      and whose report says PASS fails the row, with a detail naming the
      missing passed-test count,
    And a recorded output whose commands run "python tests/check_totals.py"
      and whose report says PASS fails the row,
    And the row is marked as a trap,
    And a recorded-output run of the test runner's eval scores all four rows
      without anyone naming them, and reports the result as a local result.
