it_requirements:
  - "CONFIG MODEL — a top-level 'files_touched_reconciliation' section in commit_guardian.json with two boolean keys 'enabled' and 'strict' (enabled+strict shape, mirroring duplicate_code / diff_coverage; NOT a single 'mode' key). SHIPPED DEFAULTS: enabled:true, strict:true = the guard is ACTIVE in BLOCKING mode out of the box (a real mismatch blocks the ticket from reaching done until the scope is reconciled), so the phantom-done guard enforces on every install rather than shipping advisory-only. enabled:false turns the check off; enabled:true + strict:false = ADVISORY (report undeclared source, do not block). Block-on-mismatch is the default posture; advisory and off remain available via configuration."
  - "Fail-open on INTERNAL error is orthogonal to the enabled/strict config: any exception in computing the verdict causes the check to not block (report to stderr, exit non-blocking), so a script error never strands a ticket — regardless of the strict setting."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): specific exception types, log at WARNING or higher, never swallow silently."
  - "PORTABLE per ADR-001: the check + its commit_guardian.json 'files_touched_reconciliation' section (enabled:true, strict:true defaults = block-on) ship to consumers via build.py, kept in parity via the build.py round-trip (canonical source = templates/scripts/commit_guardian/commit_guardian.json); it must NOT rely on the leafcutter repo's own root CLAUDE.md."
