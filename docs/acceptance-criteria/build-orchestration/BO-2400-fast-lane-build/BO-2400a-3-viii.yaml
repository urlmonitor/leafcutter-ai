    fast_lane_red_baseline_idempotence:
      type: object
      description: "Two consecutive gate runs over an unchanged worktree return identical partitions, per-test classifications, verdict, halt reason and ordering, and the gate writes nothing to the worktree."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Both reported sets need a total, stable ordering derived from the test identity (file path then function name), so a run-twice-and-diff comparison is byte-identical."
    - "The gate must not mutate repository state as a side-effect of resolving the merge-base — no fetch, no ref update, no index write — since that would make run 2 see a different baseline than run 1."
    - "Verify by running the gate twice in the same process-independent invocation and diffing the full result structure, not only the boolean verdict."
