id: AR-300d-5
title: "A sub-agent permission granted or revoked in an agent's declaration takes effect on the next build, with no second edit and no marker"
component: agent-registry
components:
  - agent_registry
  - template_compiler
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an existing agent that already receives its permitted sub-agents,
    And, as one change, a sub-agent added to that agent's declaration and to
      nothing else,
    And, as a later change, a sub-agent removed from that agent's declaration
      and from nothing else,
  When the build compiles agent prompts after each change,
  Then after the addition that agent's compiled prompt names the added
    sub-agent alongside the ones it already named,
    And after the removal that agent's compiled prompt no longer names the
      removed sub-agent anywhere, including when the build writes over a
      compiled prompt left by an earlier build,
    And no other agent's compiled prompt changes as a result of either change,
      including other agents permitted the same sub-agent,
    And a newly added agent definition that declares permitted sub-agents, and
      carries nothing else added for the purpose, receives them on its first
      build with no central record entry, no list of agents to include and no
      marker placed in its body,
  So permitting a sub-agent is a single decision that takes effect on its own,
    in both directions, for agents that exist now and agents added later.
