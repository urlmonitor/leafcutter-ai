title: "Gate after the product owner shows L0/L1 ACs and offers approve, edit, or cancel"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the product owner has written L0/L1 ACs to the AC store with readiness: draft,
  When the workflow presents gate 1 to the user,
  Then it displays: the AC ids, titles, and full criteria text of all L0/L1 ACs produced,
  And it offers three actions:
    - "approve" — proceed to the business analyst's decomposition,
    - "edit" — provide feedback text; the product owner is re-invoked once with the
      feedback, rewrites the ACs, and gate 1 is shown again,
    - "cancel" — abort the pipeline; ACs remain in store with readiness: draft,
  And if the user chooses "edit" a second time at gate 1, the run aborts with an error
    stating that the product owner did not produce satisfactory ACs after 2 attempts,
    nothing from the product owner's stage is committed, and its ACs remain in the
    store with readiness: draft,
  And if the user approves, the workflow commits the product owner's ACs to the
    authoring branch as that stage's own commit, naming the approved AC ids and the
    run id; that commit is the record of the approval, and the business analyst
    starts only after it succeeds,
  And if that commit fails, the run stops with an error and the business analyst
    does not start.
