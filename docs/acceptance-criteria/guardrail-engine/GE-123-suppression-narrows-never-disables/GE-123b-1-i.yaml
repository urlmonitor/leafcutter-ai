it_requirements:
  - "PROVENANCE PLUMBING IS THE REAL WORK HERE, and it is why this is not a one-line print. `_load_allowlist` returns `set[tuple[str, str, str]]` today: the allowlist file path, the 1-based line number and the verbatim line text are all discarded at parse time, and the container is unordered. The warning this criterion requires cannot be produced at the decline point without the loader carrying that provenance through. Changing the loader's return shape is a signature change: audit and update EVERY call site in the same change — `scan_files` in the same module, and `unit_tests/commit_guardian/test_scan_secrets_suppression.py`, which calls both `_load_allowlist` and `_is_suppressed` directly with 3-tuples — per the CLAUDE.md call-site-audit convention."
  - "REUSE GE-113c-3-v's WARNING CONTRACT EXACTLY, do not start a second one: error stream, allowlist file path, 1-based line number, verbatim offending line text, warn-never-raise, per-line and never per-file. Exactly one piece of information is new here — the name of the file the entry would have left with nothing able to report on it. Two warning conventions in the same module would be a defect in their own right."
  - "STREAM DISCIPLINE: the warning goes to the error stream only. The other stream carries the findings report that `check_secrets` and the module's CLI entry point print, and the warning must never enter the list `scan_files` returns — a warning that arrives as a finding would corrupt the count every sibling criterion asserts."
  - "EXACTLY ONCE: at most one warning per (declined entry, affected file) pair per run. Not one per finding, not one per line of the scanned file, not one per rule the entry silenced. The obvious wrong shape is a warning emitted inside the per-finding suppression loop."
  - "NON-FATAL, and prove BOTH directions. The run completes and raises nothing, and its exit status is a function of the reported findings alone. Test it in both directions: findings-present exit when the declined entry restores findings, and clean exit when the same declined line is in force but the scanned set has nothing to report. Asserting only the first direction cannot distinguish 'exit follows the findings' from 'a declined line sets a failure exit'."
  - "Declining one line must not withdraw the author's other suppressions: every other well-formed entry in the same allowlist file is still loaded and still applied. Assert this by observing a second file actually being suppressed in the same run, not by inspecting the loaded entry set."
  - "ASSERT THE INFORMATION, NOT THE WORDING: capture the error stream around the `scan_files` call (`contextlib.redirect_stderr`, matching the convention the existing suppression test module already uses for `_load_allowlist`) and assert the allowlist file path, the 1-based line number, the verbatim offending text and the affected file name as SEPARATE substrings — never as one formatted string. Message wording must stay free to change."
  - "THE ANTI-PRECEDENT THAT MAKES THE END-TO-END TEST MANDATORY: this component already contains a guard documented as dispatching a specialist that does no such thing — the path is a placeholder and it always reports success. A documented-but-dead correction path is worse than none, because authors believe they are covered. A test that only asserts the message string exists in the source, or that calls the emitting helper directly, does not discharge this criterion. The warning must be observed arriving on the error stream through `scan_files`, with real files on disk and a real `.security-allowlist` in the same temporary root."
  - "Fixture reachability: ordinary `.py` filenames only. `scan_file` short-circuits an environment-named path to a single name-based finding and returns before any content rule runs, so the four-recognised-lines fixture is unreachable at such a path."
  - "ADR-001 parity: edit the canonical `templates/skills/security-scanner/scripts/scan_secrets.py` only and let `build.py` propagate. Never hand-edit the copies under `.claude/`, `.gemini/`, `.leafcutter/`, `EPIC-*/` or `worktrees/**`."
  - "RED-FIRST LABELLING: all three arms are red today. The measured collapse produces NO output on the error stream and none on the findings stream — the file is silently unprotected. No descriptor below is a regression guard, so any green result before the implementation lands is a TDD-order violation here, unlike in the parent."
delivers_to: null
expects_from:
  ac_id: GE-123b-1
  contract: "The per-file decision helper in templates/skills/security-scanner/scripts/scan_secrets.py that scan_files calls once per scanned file, returning the rule ids still able to report on that file and the entries declined for it. Each declined entry must carry its source allowlist file path, its 1-based line number and its verbatim line text — that provenance is the raw material of the warning specified here, and the loader discards all three of them today. This criterion specifies what is said at that point, on which stream, how many times, and what it must not do to the run."
test_spec:
  - name: test_declined_entry_warning_names_allowlist_file_line_number_and_text
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Arm 1, RED today (no output on any stream). With the collapsing entry written as the fourth line of a real allowlist, the error stream captured around scan_files contains the allowlist file path, the 1-based line number 4, and the offending line verbatim, asserted as three separate substrings"
  - name: test_declined_entry_warning_names_the_file_it_would_have_emptied
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Arm 1's new information, the one piece GE-113c-3-v's message has no place for: the same captured warning also names the scanned file the entry would have left with nothing able to report on it"
  - name: test_declined_entry_warning_goes_to_the_error_stream_only
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "Arm 1's stream clause: capturing both streams around the same scan_files call shows the warning on the error stream and nothing of it on the stream the pre-commit check consumes, and no element of the returned findings list carries the warning text"
  - name: test_declined_entry_is_announced_exactly_once
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Arm 1's cardinality clause: with four findings on four separate lines of the scanned file, the captured error stream mentions the declined line exactly once — not once per finding, not once per silenced rule"
  - name: test_other_entries_in_the_same_allowlist_are_still_applied
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Arm 2: with well-formed entries naming other rules and other paths on the allowlist's remaining lines, a second fixture file in the same run is still suppressed as those entries direct — observed through the reported findings, not by inspecting the loaded entry set"
  - name: test_declined_entry_does_not_raise_and_exit_status_follows_findings_only
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Arm 3, both directions through the module's CLI entry point with the temporary root as the working directory: the run raises nothing, exits findings-present when the declined entry restores findings, and exits clean when the same declined line is in force over a fixture that has nothing to report. Working directory restored in cleanup"
test_rationale: "The parent asserts what the scan REPORTS; this asserts what the author is TOLD and what the run does not do, and the two fail independently — an implementation can decline the entry and report all four findings while saying nothing at all. The end-to-end shape is mandatory rather than stylistic: this component already contains a guard documented as dispatching a specialist that in fact always reports success, so a test asserting only that a message string exists would reproduce exactly the failure mode that anti-precedent represents. Every descriptor therefore captures the real error stream around a real scan_files call. The warning content is asserted as separate substrings so the contract is the information and the wording stays free, following the convention the existing suppression test module already uses. Two descriptors exist that a thinner reading would omit: the exactly-once descriptor, because the obvious wrong implementation emits from inside the per-finding suppression loop and would pass a mere presence assertion four times over; and the both-directions exit-status descriptor, because asserting only the findings-present direction cannot distinguish an exit driven by the findings from an exit driven by the declined line, which is the failure that would turn one author's typo into a repository-wide commit outage."
