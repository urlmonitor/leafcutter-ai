criteria: |
  Given the full set of deployed commands, each of which may hand off to one or
    more Workflow(...) or Skill(...) targets,
  When build.py runs its command-reference reachability check,
  Then for every deployed command, each of its handoff targets resolves to a real
    deployed artifact — either by name in the deployed workflow/skill registry, or
    by a path that exists after deployment,
  And if ANY target is unresolvable the build exits with a non-zero status,
  And the failure names each offending command together with its unresolvable
    target.
