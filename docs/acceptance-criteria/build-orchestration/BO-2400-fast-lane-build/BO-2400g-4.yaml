notes: |
  GAP 2 OF BO-2400g, PART THREE OF THREE. BO-2400g-2 makes the reading real and
  BO-2400g-3 makes it cover design as well as code; without this AC both are advice.
  A review that reports and proceeds is not a gate, and the user's motivation for the
  whole L1 — the reviewer "often finds stuff during code and design review that we did
  not find before" — is only served if what it finds can actually stop a bad change
  from being committed.

  THE SEVERITY SPLIT IS DECIDED HERE, NOT LEFT OPEN. Two bands, deliberately coarse:
    - STOPS THE RUN: the change is incorrect, unsafe, loses data, or does something
      none of the run's requirements asked for. The last of those is the scope case —
      it is the one band member that is not about code quality at all, and it is
      included because on this lane the resolved requirement set is the only statement
      of intent that exists.
    - RIDES ALONG: smells, naming, suggested improvements — everything that is a
      judgement about how the code could be better rather than a claim that it is
      wrong.
  A third, finer scale must not be invented: templates/agents/pr-reviewer.md already
  returns blockers versus comments, and templates/skills/review-for-code-smells/SKILL.md
  already defines a severity rubric the two smell readers classify against. Map onto
  those once, in one place.

  REUSE THE HALT PATH, DO NOT BUILD A SECOND ONE. Verified 2026-08-17: the lane has a
  release-on-failure pattern for every phase (release-on-coder-fail,
  templates/workflows-js/fast-lane-ship.js:424), and BO-2400f-10 already owns "on
  failure or abort, release the claim: in_progress -> todo so work is never stuck".
  A review stop is just another failure on that path. The third Then clause is written
  as a consumer of that behaviour on purpose — if it is implemented as a bespoke
  unwind, the two paths will drift and one of them will stop releasing claims.
  BO-2400a-4-i is the closest existing precedent for the operator-facing shape of a
  refusal ("Green gate refuses commit staging when the coder cannot make all tests
  pass"); match it rather than inventing a new one.

  DEPENDENCY. depends_on BO-2400g-2 rather than BO-2400g-3: the consequence ladder
  needs findings to exist, which g-2 establishes, and it applies unchanged to the
  design findings g-3 adds. Sequencing this behind g-3 would mean the lane can produce
  serious findings for a whole release cycle without being able to act on them.

  THE THIRD STATE IS NOT IN THIS AC'S LADDER BY ACCIDENT. BO-2400g-2-i defines a
  reading that did not happen as distinct from a clean one. Whether an unperformed
  reading should stop the run is a real question and is deliberately NOT answered here
  — this AC's ladder is about findings, and an unperformed reading produces none. Raise
  it with the user when this tree is approved: the conservative answer (treat an
  unperformed reading as a stop) is a policy decision with a cost, not a defect fix.

  OUT OF SCOPE. Whether the pull request itself should carry the findings that did NOT
  stop the run is BO-2400g-4-i.

  IT-PO ENRICHMENT NOTE (2026-08-17). declares_side_effect is TRUE for this AC and not
  for its g-2/g-3 siblings: the third Then clause's observable is the on-disk store
  (every requirement released from in_progress back to todo), which the AC's own seam
  test asserts against "the real on-disk store". Standing caveat from BO-2400g's notes:
  the fast lane does not dispatch user-surface-smoker at all today, so the flag records
  the durable side-effect correctly but produces NO routing on this lane; it routes only
  if a ticket is generated for this AC via generate_ticket_from_ac.py. Assigned
  llm-expert because the surface is the workflow's control flow in
  templates/workflows-js/fast-lane-ship.js plus the severity mapping; the release
  mechanism itself is BO-2400f-10's Python and is consumed, not modified — which is why
  this AC is not python-coder despite touching store state. The open question the notes
  flag (should an unperformed reading stop the run?) is carried into it_requirements as
  an explicit do-not-decide-silently instruction and is raised in the sign-off report.
