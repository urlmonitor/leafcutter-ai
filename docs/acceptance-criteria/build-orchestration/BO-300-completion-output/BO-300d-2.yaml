id: BO-300d-2
title: "A cause is stated only where the run can establish it, and is stated as undetermined where it cannot"
component: build-orchestration
components:
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run whose closing report names four unbuilt pieces,
    And piece P was in the set the plan was built from and the run holds no record
      of having completed it and no recorded outcome for it,
    And piece Q was in the set the plan was built from and the run holds a recorded
      outcome for it saying the work stopped short of finishing,
    And piece R was not in the set the plan was built from,
    And piece S was not in the set the plan was built from either,
  When the run produces its closing report,
  Then P is reported as planned and not finished,
    And Q is reported as stopped part-way, naming what the recorded outcome says
      stopped it,
    And both R and S are reported with their cause not determined, stated in those
      terms,
    And no piece is reported as having been added to the body of work after the run
      started, because the run holds nothing that could establish that,
    And no piece is reported as having been passed over deliberately, for the same
      reason.

  Given the same run,
  When the closing report is read,
  Then for every cause it states, the thing the run relied on to establish that
    cause is one the run holds — membership of the set the plan was built from, its
    own record of what it completed, or a recorded outcome for that piece,
    And no stated cause rests on a comparison the run did not make.

  Given a run in which the set the plan was built from cannot be read back at all,
  When the run produces its closing report,
  Then every unbuilt piece is reported with its cause not determined,
    And the report states that the set the plan was built from could not be read,
  So a missing input produces an acknowledged gap and never a confident cause.
