created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600c.yaml"
criteria: |
  Given a parallel drive is running into one shared worktree
  And an integrity check finds the shared repository in a damaged state (for example
    a zero-byte loose object, an object whose content hash does not match its name,
    or an unreadable index)
  When the corruption is detected
  Then the drive halts immediately and no further ticket commit is started
  And the halt occurs before any subsequent git write that would touch the damaged
    object store or index
