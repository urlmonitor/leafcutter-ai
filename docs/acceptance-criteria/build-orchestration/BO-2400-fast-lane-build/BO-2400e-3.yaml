test_spec:
  - name: test_record_survives_a_write_that_fails_partway
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A real on-disk requirement record in a temp store; the progress update is made to fail midway; the file is then read from disk and asserted byte-identical to its pre-update content."
  - name: test_record_is_never_zero_length_after_a_failed_update
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "After the induced failure the record's size on disk is asserted greater than zero and the file still parses. Stated separately from the byte-identity assertion because an empty file is the specific observed outcome of the current behaviour."
  - name: test_concurrent_reader_never_sees_a_partial_record
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A reader opening the record repeatedly while an update runs always parses a complete record — either the old or the new one — and never an incomplete document."
  - name: test_interruption_during_a_real_run_leaves_every_record_readable
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT: drive the lane's real progress-recording surface over a temp store of several requirements, interrupt it, then read every record back and assert all parse and none is empty. A durable write helper that the lane does not actually use passes every other test here."
test_rationale: "The obvious test — update a record and assert the new value is there — passes today and says nothing, because the current behaviour works perfectly whenever nothing goes wrong. The defect only exists on the failure path, so every test here induces a real failure against a real file on disk. A test using a filesystem double is worthless for this AC: the whole question is what the filesystem is left holding, and a double is free to model an atomic replacement that the real code does not perform. The zero-length assertion is called out separately from byte-identity because an empty file is the actual observed failure mode and an implementation that leaves a short-but-parseable stub would slip past a looser check. The entry-point test exists because the natural implementation adds a safe-write helper, and the natural omission is leaving one of the three call sites (build start, release, build finish) still writing the old way."
