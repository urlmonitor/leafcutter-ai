assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Apostrophe and quote characters must be removed in-place (zero-width deletion) BEFORE the title is split into words, so a quote embedded mid-word (user's -> users) does not create a word boundary; the existing word-split set [\\s\\-_]+ must NOT be extended to include quote characters."
  - "The character set to strip must cover at minimum: ASCII single quote/apostrophe (U+0027), ASCII double quote (U+0022), backtick (U+0060), and the typographic apostrophe (U+2019). Both straight and curly forms must be handled identically."
  - "The rule must be deterministic and consistent with ACD-1200a-3's existing PascalCase / no-special-characters requirement: the stripped, PascalCased name must contain only ASCII alphanumeric characters with no spaces or punctuation."
  - "Must not produce an empty or whitespace-only segment, a trailing/leading separator, or a folder name with a literal quote character for any title containing the covered quote characters."
  - "Must be idempotent: deriving the name twice from the same title yields the identical folder name; re-running over an already-named epic does not change it."
  - "Any I/O performed while reading the goal title or creating the folder must follow the project error handling policy (wrap external I/O, no bare except, log-or-reraise)."
