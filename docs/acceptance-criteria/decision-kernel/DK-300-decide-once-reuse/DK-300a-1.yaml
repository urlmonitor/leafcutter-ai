id: DK-300a-1
title: "Your question starts a decision run after one intent check"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a question asked in Claude Code, for example "Decide how Leafcutter should file decision
    records as JSON or YAML files under docs/ so later kernel runs can find and reuse them as
    precedent",
  When Claude Code hands it to the kernel through the /leafcutter skill or python -m kernel run,
  Then the kernel starts a new run whose goal is that question,
  And the kernel asks Jev one question to class the goal as exactly one of five intents:
    decision, evidence, ideas, change or out of domain,
  And when Jev's answer clears the configured intent thresholds, no second Jev question is asked
    about the intent,
  And a goal classed as decision starts the decision graph,
  And a goal classed as evidence, ideas, change or out of domain does not start the decision graph.
