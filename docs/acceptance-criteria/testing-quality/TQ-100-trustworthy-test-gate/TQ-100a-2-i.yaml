id: TQ-100a-2-i
components:
  - testing_quality
title: "The host repository's commit identity is byte-identical across a session, and a fixture that changed it fails the run by name"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a snapshot of the host repository's shared-configuration commit identity
      is taken before the first test of a session runs, recording for each
      identity key either its exact value or the fact that the key is ABSENT,
      where absent is a distinct recorded state from present-with-an-empty-value,
  When the session ends — whether every test passed, a test failed, or the run
      stopped at the first failure,
  Then the same keys are read again and compared with the snapshot byte for byte,
    And a session in which every key holds the value it held before, and no key
      appeared or disappeared, reports nothing and does not affect the run's
      outcome,
    And a session in which any key's value differs fails the run and reports, in
      one message: the test whose sandbox made the change, the key that changed,
      the value held before, and the value held after,
    And a key recorded as absent before and found present after is reported as a
      change and the message names the value that appeared,
    And a key recorded as present before and found absent after is likewise
      reported as a change,
    And a session in which the keys were absent before and are absent after
      reports nothing, and this outcome is distinguishable in the run's own
      record from a session in which the comparison established that two present
      values matched — because only the second of those two has exercised the
      comparison,
    And run today, before any fixture is changed, this reading FAILS on this
      repository's own suite: the linked-worktree fixtures replace the
      developer's recorded identity with their own, the condition under which 81
      commits of local history are already misattributed.
depends_on:
  - TQ-100a-2
