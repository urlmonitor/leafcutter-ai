id: UXP-514-3
title: "D3: a derived index lookup that differs from a fresh rebuild is named"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store index whose derived lookups by component, by entity, by journey and by
    acceptance criterion have been edited away from what the artifacts on disk imply,
  When the record is checked,
  Then the check reports each derived lookup that differs, naming the lookup and the entries
    that differ rather than only that the lookup differs,
  And a lookup that matches a fresh computation is not reported,
  And the check states how many entries it compared.
