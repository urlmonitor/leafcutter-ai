id: ACS-300h-2-i
title: "Stale agent ID detection after registry removal"
component: ac-store
level: L3
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a component entry has agent_affinity: ["deprecated-agent"],
  When "deprecated-agent" is removed from config/agent_registry.json
    and the component integrity validator is run,
  Then the validation fails with an error:
    "Component '<component_id>' references agent 'deprecated-agent'
    which is not in agent_registry.json".
  And the error lists the component ID, the stale agent ID,
    and the file path of the offending entry.
