estimated_complexity: M
change_target:
- code
- ui
risk_surface: contract_boundary
it_requirements:
- Render JSON values as inert text; source links identify repository evidence and must not execute authored
  content.
- Display authority notes, missing-interface limitations and full/projection provenance from the same
  metadata delivered by the loader. Display acceptance does not replace canonical schema validation.
- Preserve the exact example value, including scalar and array roots; omit any invented contract-name
  wrapper.
expects_from:
  ac_id: UXP-300-2
  contract: 'The same flow JSON carries io_contracts.examples: [{contract: string, mode: full|projection,
    origin: observed|illustrative|reconstructed, label: string, value: JSON value, source?: {path: repository-relative
    string, pointer: JSON-pointer string}}]. Observed requires source. Definition authority/note and node
    missing_bindings [{name: string, direction: consumes|produces|both, reason: string, source: repository-relative
    string}] or a genuine not_applicable string remain distinguishable from checked runtime fields.'
delivers_to: null
test_spec:
- name: shows one contract heading, readable field table, and each raw example once
  target_dir: leafcutter-web/components/flows/__tests__/
  description: Examples remain separate raw JSON values without an invented payload wrapper.
  framework: vitest
  type: component
  angle: criterion
- name: preserves root arrays, escaped field keys, authority and observed provenance
  target_dir: leafcutter-web/components/flows/__tests__/
  description: Source-reviewed authority, notes, full/observed labels and receipt source are visible.
  framework: vitest
  type: component
  angle: boundary
- name: labels reconstructed projections with the remaining contract obligations
  target_dir: leafcutter-web/components/flows/__tests__/
  description: A reconstructed projection discloses its provenance and the omitted required/defaulted
    obligations.
  framework: vitest
  type: component
  angle: criterion
- name: shows missing bindings and true non-JSON reasons without generated duplicates
  target_dir: leafcutter-web/components/flows/__tests__/
  description: Proposed missing directions, reasons and sources and genuine non-JSON explanations remain
    visible.
  framework: vitest
  type: component
  angle: failure
- name: renders actual %s contracts after selecting a graph node
  target_dir: leafcutter-web/components/flows/__tests__/
  description: Actual stored step and branch examples survive loader, explorer selection and drawer rendering.
  framework: vitest
  type: component
  angle: reachability
test_rationale: The tests exercise both display branches and the real stored-flow seam. Projection disclosure
  and authority labels prevent readable JSON from being mistaken for a complete or observed runtime exchange.
