title: "A pull request introducing a malformed acceptance criterion is blocked from merging"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a pull request whose changes add an acceptance-criterion record that is
    deliberately invalid — for example a record with a required field removed,
    a record whose identifier does not fit the store's identifier format, or a
    record whose parent does not list it back,
  When the acceptance-criteria check runs on that pull request,
  Then the check reports a failing result,
  And the failure names the offending record and states which rule it breaks,
  And the pull request is reported as not mergeable while that check is failing,
  And the deliberately invalid record is a throwaway used to exercise the
    failing path — it is not left behind in the store as a standing violation.
