notes: |
  THIS IS THE RECORD THAT ACTUALLY CLOSES KI-ACD-005, AND THE KNOWN ISSUE'S OWN FIX
  DIRECTION WOULD NOT. Re-verified against the code on 2026-08-25 -- do not
  re-investigate:

    - The KI says any reply the parser cannot map resolves to cancel, and therefore
      that the parser should be hardened. That is not the live behaviour.
      resolveGate (1571-1582) ALREADY pauses on a null or unparseable answer.
    - The observed refusal was WELL-FORMED JSON carrying `action: "cancel"` plus a
      paragraph explaining that approving product-truth artifacts is not
      status-checker's job. It satisfied the gate's parse check at 2075
      (`parsed && typeof parsed.action === "string"`) and then the "valid explicit
      decision" test at 1577-1579, and was accepted as the user's choice.

  So the hole is not answer shape. A well-formed refusal is indistinguishable from a
  real user answer BY SHAPE ALONE, and any child framed as "reject refusal-shaped
  replies" is re-implementing the defect with a longer regex: the agent gets better
  at sounding like a user and the bug returns. The discriminator is provenance --
  who produced the answer.

  THE LAST THEN CLAUSE IS THE WHOLE PROOF and it is why it is written as a pair. Two
  answers identical in content, differing only in origin, must produce opposite
  outcomes. A test built that way cannot be passed by a parser change, and it fails
  on any implementation that inspects the text instead of the source. Everything
  else in this record is satisfiable by accident; that clause is not.

  THE THIRD CLAUSE MATTERS FOR THE NEXT DEBUGGER. Recording "could not understand
  the answer" for an answer that was perfectly well formed is how this defect stayed
  invisible for a run: the journal showed a clean decision. The recorded reason has
  to name the real one.

  RESIDUAL DESTRUCTIVE DEFAULT, covered by ACD-2100c-5: line 2086 is
  `const ptGate = _ptGateResult || { action: "cancel" }`. resolveGate should not
  return a bare null today, but the fallback still says the answer to "no answer" is
  to discard.

  2026-08-25 (it-po): the it_requirement about the pair being a controlled comparison
  is the trap to watch. An implementation that accepts only answers carrying a token
  the refused answer cannot carry passes the pair test trivially and is in fact a
  reasonable design -- but the test must then be built so the two answers are identical
  in the content the gate reads, with the token supplied by the channel rather than by
  the answer's author. If the token is part of what the author writes, the comparison
  is back to inspecting content and the record is not proved.
