notes: "Verified defect, 2026-08-13. Found only after GE-118b made the drift hooks actually run. The output_mappings section of <package>/.build_manifest.json (written by write_build_manifest() in scripts/build_helpers.py) does not cover every deployed output currently on disk, so check_output_drift.py emits 'INFO — .claude/agents/<name>.md not in output_mappings (intentional one-off or newly added output; run build.py to register it)' for many real build outputs, which are therefore never drift-checked. Sibling of BP-100k-1 (template_hashes coverage); the two manifest sections fail independently and were split so each can be tested on its own."
