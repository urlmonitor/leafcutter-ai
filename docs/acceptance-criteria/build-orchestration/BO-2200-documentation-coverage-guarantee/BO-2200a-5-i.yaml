assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  The level check and the enum check must both run and report independently — an AC can
  fail one, the other, or both. Do not short-circuit the enum check when the level check
  passes, and do not let a valid enum value suppress the level check.
