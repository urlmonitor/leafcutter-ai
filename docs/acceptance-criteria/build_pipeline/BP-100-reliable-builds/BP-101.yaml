title: "Build process handles edge cases gracefully — hooks, validation, and degradation work reliably"
component: build-pipeline
level: L0
status: active
criteria: |
  The build pipeline is robust under real-world conditions. Hooks never block
  their own source code changes, timestamps are always machine-parseable,
  git-dependent workflows degrade gracefully outside a repository, malformed
  skill files fail with clear diagnostics, valid files deploy cleanly, and
  build documentation stays current as the pipeline grows.
