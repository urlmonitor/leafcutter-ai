estimated_complexity: S
it_requirements:
  - >-
    AGENT CONFIRMED: documentation-expert. Both surfaces are contributor guides (Markdown);
    no code, prompt or diagram changes.
  - >-
    WRITE FROM WHAT WAS BUILT, AFTER IT MERGED. The live-database sentences are written
    against TQ-600a-13-xxi, -xxii, -xxiii and -xxv as implemented (job names, stage wording,
    the verdict's live-lane naming), read from the merged workflow and the hold's own
    message table, never from these records' indicative names. If the built wording differs
    from a record, the guide follows the build and the difference is reported.
  - >-
    THE THREE PLACES, IN ONE PASSAGE. docs/testing/README.md's "Post-merge lanes" section
    (today a two-row table: Correctness, Timing) gains the live-database lane and the
    three-place account: skipped in the per-PR shards; changed criteria only in the
    Proof-of-done check; the whole folder after every merge to main and on the 12-hour
    heartbeat. The `Post-merge suite status` hold-message table gains the live-database
    did-not-complete wording(s) exactly as built. The heartbeat period is stated as the
    built cron and the `heartbeat_max_hours` tunable give it, not retyped from memory.
  - >-
    THE SUFFIX SENTENCES STATE THE SETTLED OUTCOME. TQ-600a-13 was resolved on its exclusion
    branch (PR #1050, recorded in TQ-600a-13-ii): `_MANUAL`-suffixed tests are auto-marked
    `manual` and deselected by pytest.ini's addopts, with `-m manual` as the named opt-in.
    Re-confirm that against the default collection before writing. Known passages to
    reconcile at enrichment: scripts/suite_performance/README.md's "Known, accepted gap"
    bullet (says the excluded tests run nowhere in CI — false since the post-merge run
    landed); docs/testing/README.md's `-k "_MANUAL"` opt-in mention and its line that
    `_MANUAL` tests are excluded from both suites. Correct each to the true position rather
    than deleting it.
  - >-
    NO CONTRADICTION ACROSS THE TWO GUIDES. Where both guides describe the same run, they
    must agree on triggers, lanes and what holds a pull request; neither may say the
    live-database tests run only on the pull request or never after merge.
  - >-
    DOCUMENTATION GATES APPLY. The edits pass the repository's documentation commit checks
    (doc front-matter, doc-length growth ratchet); route through documentation-expert's
    usual pre-flight, and do not grow either guide beyond what the three-place account and
    the corrected sentences need.
