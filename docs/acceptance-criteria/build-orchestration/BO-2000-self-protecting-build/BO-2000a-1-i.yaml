  - path: templates/agents/ac-validator.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: simple
it_requirements:
  - "Add a prompt rule to templates/agents/ac-fulfillment-gate.md and templates/agents/ac-validator.md: when the captured output in the evidence bundle reports one or more new standards violations, the claim is rejected and the rejection message names the specific new violations found in the recorded output."
  - "The claim must not be recorded as a passing self-hosting non-regression result on the rejection path."
  - "Reuse the same evidence-bundle shape defined by BO-2000a-1 so accept and reject paths stay consistent."
  - "Edit the templates/ source and keep the deployed .claude/agents/*.md copies in parity per ADR-001 (build.py round-trip)."
