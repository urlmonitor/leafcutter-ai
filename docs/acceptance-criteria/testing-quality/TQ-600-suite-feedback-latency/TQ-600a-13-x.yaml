  work: hold.py by TQ-600a-13-vi, notice.py by -iii, tunables.json by -ii (whose
  it_requirement already says the tunables file is "created by whichever family record lands
  first that reads a tunable (normally -ii, for the window), EXTENDED BY THE REST" -- this
  record is one of the extenders). So each path yields a "marked to be created but already
  exists" report for as long as this record is unfinished. That is expected and correct.

  WHAT THE MARKER MEANS, WHICH IS THE WHOLE BASIS OF THE DECISION. `to_be_created` states a
  BUILD PRECONDITION -- "the work must not assume this path is present at the moment it is
  built" -- and is neither a claim of ownership nor a dated historical note. Settled in
  ACD-1600c-4-v: ownership dies on the two-value enum (a record whose work EDITS a file a
  sibling CREATES has no honest value available) and on severity (a false ownership claim would
  have to refuse, and this condition is advisory by design); the historical reading dies on the
  refusal branch (nothing blocks a merge over a stale dated note, so `existing` + absent
  refusing proves the field is live).

  SO THIS RECORD'S THREE DECLARATIONS ARE NOT STALE -- THEY ARE CORRECT AND DELIBERATELY SAFE.
  This record depends_on TQ-600a-13-vi only; it does NOT depend on -iii or -ii, which are the
  records that create notice.py and tunables.json. Its build order relative to those two is
  therefore not guaranteed by anything in the store, and `to_be_created` is exactly the
  declaration that says so. The asymmetry below exists so that this safe choice is never
  punished: a precondition that turns out to be already satisfied is only reported, while an
  unsatisfiable one refuses. WHAT THE REPORT CANNOT CURRENTLY SAY is that these three were
  satisfied EARLY BY SIBLING WORK rather than declared wrongly -- that relabelling is
  ACD-1600c-4-v's clause (b), and it is the actual fix for the noise, not a re-marking here.

  THE ASYMMETRY THAT MAKES THE FLIP ACTIVELY UNSAFE, AND IT IS THE REASON A READER SHOULD NOT
  TIDY THIS. The declared-files check treats the two markers very differently for an
  unfinished record:

      `to_be_created` + path present  ->  ADVISORY REPORT (non-blocking, ACD-1600c-4-i)
      `existing`      + path absent   ->  BLOCKING REFUSAL (ACD-1600c-4-i)

  This record does not own the lifecycle of any of the three files. Marking them `existing`
  arms a merge blocker that fires if -vi's, -iii's or -ii's work is revised and any path is
  renamed or removed before this record is built -- and it fires on every commit that stages
  this record, for a fact this record's author cannot fix. This record is still
  `work_status: todo` with a hard 2026-11-02 deadline above, so it would be arming that
  blocker at precisely the wrong moment. Three non-blocking lines are the cheap side of that
  trade by a wide margin.

  AND THE FLIP WOULD DELETE THE ONLY EVIDENCE OF A LARGER, OPEN CONDITION. Measured 2026-10-12
  across these same three paths: 15 `to_be_created` declarations in total (hold.py 7, notice.py
  6, tunables.json 2); 3 on the creating record; 12 on `done` records, which
  ACD-1600c-4-i exempts from the report entirely; and 3 on this record -- THE ONLY THREE
  ANYTHING REPORTS FOR THESE THREE PATHS, because this is the only one of the twelve declaring
  records still unfinished. Of the 12 exempted, the exemption's stated reason ("the finished
  work is what created it") is true of 3 and false of 9. Quieting this record's three takes the
  visible count for these paths to zero while that specification defect is still open in draft
  (ACD-1600c-4-v), so the only smoke detector for a 15-instance condition would be switched off
  to stop it beeping.

  STORE-WIDE, FOR SCOPE: `validate_ac_schema.py` over all 5,036 records on 2026-10-12 emits six
  such report lines across four records -- this record's three, plus one each on TQ-600a-11,
  -11-ii and -11-iii. Those three are a DIFFERENT case and are not evidence that this one is
  routine: that family is `status: deprecated`, and the retirement convention's
  `work_status: done -> todo` demotion un-exempted its declared files, so those reports are
  permanent and unclearable (the only work that would clear them is work deliberately
  retired). Written up in ACD-1600c-4-v, which proposes a separate report section for them.
  This record's three are the ordinary mid-build case and WILL clear themselves the moment
  this record is built.

  THE GENERAL SHAPE, for a reader who arrives here from somewhere else:
  `declared_files[].state` states a condition on THIS record's build, but it is evaluated
  against the tree as it now stands, and the tree is moved by OTHER RECORDS' WORK. So declared
  and observed diverge WITHOUT ANYONE MAKING A MISTAKE; the check cannot name which of the two
  causes it is looking at, and its wording picks the wrong one; and once `work_status: done`
  the condition is EXEMPTED rather than flagged, so no gate ever surfaces it. It is the fourth
  entry on INF-600b-2's canonical list of true-looking-and-wrong shapes and the most common
  member precisely because it needs no error to occur. Go there for the family;
  ACD-1600c-4-v is the record that fixes both the relabelling and the countability.
