id: TQ-500g-1-ii
components:
  - testing_quality
  - build_orchestration
title: "A wrong version counts as caught only when the test reached the code, so a version that will not load or changes nothing never passes as caught"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the wrong-version runs for requirement TQ-9101, whose test T1 names
    three wrong versions of refresh_config.py, prepared as —
      V1 "drop the retry_due condition": a one-line change after which the
         file still loads,
      V2 "the gate always allows": through a slip in preparing it, the file
         no longer loads (it has a syntax error),
      V3 "retry only once": the prepared file is byte-for-byte identical to
         the code as written,
  When the shared runner handles V1, V2 and V3,
  Then under V1, T1's failure counts as catching V1, because T1 reached
      refresh_config() and saw a wrong result,
    And under V2, T1's failure does not count as catching V2: the runner
      reports V2 as "wrong version did not load — not a valid run", and V2 is
      neither caught nor survived,
    And V3 is never run: the runner reports it as "wrong version not applied —
      it changes nothing", and V3 is neither caught nor survived,
    And a wrong version reported as not a valid run or not applied leaves the
      work unfinished, as a wrong version that was owed and never run does
      (TQ-500b), until it is prepared again and has a valid run,
    And whether a failure reached the code is judged by the same rule the
      red-baseline check uses to tell a failure because something could not
      be found from a failure of an assertion, not by a second rule.
