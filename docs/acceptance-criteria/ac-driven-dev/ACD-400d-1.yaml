  - name: test_an_order_produced_by_size_first_would_fail_this_fixture
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "The same fixture asserted against the size-first sequence the store's own ACD-400a-1 describes produces a different list, demonstrating that the fixture discriminates between the two candidate orders rather than being satisfied by both."
  - name: test_the_ordering_is_read_from_the_scanner_command_surface
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "The sequence under test is the one the scanner's real entry point emits, proving the sort exercised is the one the build loop reaches rather than a helper invoked in isolation."
test_rationale: "A direct unit test on the sort helper would be both weaker and misleading: weaker because it survives the helper falling out of the call path, and misleading because the repo already holds a green test asserting priority ordering against a different entry point with equal-size fixtures, which is what let this contradiction survive unnoticed."
