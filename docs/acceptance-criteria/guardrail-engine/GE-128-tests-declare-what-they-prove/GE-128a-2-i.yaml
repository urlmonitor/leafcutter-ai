superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_generated_block_of_thirty_undeclared_tests_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 1. A temp git repo commits a test file with 3 undeclared tests; a generated block of 30 near-identical undeclared tests is staged. The real hook CLI in error mode exits non-zero and reports the file with before 3 and after 33, in the same line format the one-test increase test asserts."
    must_catch:
      - "skip the check when the diff exceeds a size threshold"
  - name: test_merge_result_that_raises_the_count_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 2. A temp repo whose hooks are installed from the shipped hook registration (the same stages the built install registers, not a hand-written hook) with the check in error mode: main holds the file with 3 undeclared tests, a side branch adds 2 more, and `git merge --no-ff side` is run so the merge commit goes through the real commit path. Asserts the merge commit does not complete (HEAD unchanged, MERGE_HEAD still present) and the output names the file with before 3 and after 5."
    must_catch:
      - "skip the check when MERGE_HEAD exists"
      - "hook registered so it receives no filenames on a clean merge"
  - name: test_no_exemption_means_size_and_merge_do_not_alter_the_verdict
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Scenario 3. With no exemption configured, the 30-test bulk change, the merge change and a single-test increase on otherwise identical repos all receive the same refuse verdict from the real hook; a hook that exempts any one of them fails."
  - name: test_merge_baseline_is_the_branch_being_merged_into
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "A merge whose side branch already had 5 undeclared tests in the file, merged into a main that had 3, is judged against main's 3 (refused, 3 -> 5), not against the side branch's 5."
    must_catch:
      - "use the merged-in branch's version as the baseline"
test_rationale: >-
  The promise this record protects is that the undeclared population never grows
  under a routine condition, and the routine conditions are real git events, so
  each test builds a real temp repository and runs the real hook; the merge test
  drives a real merge through the real commit path because the likeliest defect is
  that the hook is never invoked on a clean merge, which a direct CLI call would
  hide. The discrimination test runs all three shapes side by side so an exemption
  for any one of them fails a single assertion, and the baseline test pins which
  parent a merge is compared against.
notes: |
  Scenario 2 assumes the check runs on merge commits. If it does not today, that
  is an IT PO finding to record against this AC (the gap is the defect GE-128a's
  notes warn about), not a reason to weaken the scenario.
