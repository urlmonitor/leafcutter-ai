readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Executable files never inherit an allowance meant for written material.

  A credential pasted into a script is reported wherever that script lives —
  including in areas set aside for writing, and including the security tooling's
  own code. Being in a place where prose is expected is not enough; the file has
  to actually be prose.
