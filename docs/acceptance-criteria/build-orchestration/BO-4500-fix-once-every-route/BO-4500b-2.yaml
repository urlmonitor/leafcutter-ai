    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "On an untouched install whose ALPHA source holds a config placeholder, the check passes by comparing against the source as rendered by the install's own resolution."
    proves_clause: "it passes"
