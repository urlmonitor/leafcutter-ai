it_requirements:
- Persist budget reservation before dispatch and cumulative elapsed implementation time at recoverable
  checkpoints; repairs and initial implementation share the same AC identity.
- Use elapsed-time accounting robust to wall-clock adjustments; reconcile interrupted in-flight time conservatively
  rather than resetting it.
- Budget exhaustion terminates or bounds the active implementation action so a timeout cannot leave an
  unaccounted writer running.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
  workspace_claim:object, settings_revision:string, next_step:string, ac_evidence:object[], ac_budgets:object[],
  review_count:integer, in_flight_action:object|null, publication:object|null}.'
test_spec:
- name: test_background_worker_two_attempts_fifty_minutes_leave_one_and_ten
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Recorded two attempts/fifty minutes permits one call with ten-minute remaining bound; recorded
    third failure or sixty total minutes blocks the next call.
  covers:
  - ACD-1300c-1
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_initial_validation_and_review_repairs_share_budget
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Combine initial work and repairs from both validation and review; assert a single cumulative
    per-AC counter rather than per-phase allowances.
  covers:
  - ACD-1300c-1
- name: test_background_worker_timeout_cannot_leave_background_writer
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: Simulate a nonresponsive implementation process at the remaining deadline; assert its write-capable
    execution is bounded and no replacement bypasses unresolved termination.
  covers:
  - ACD-1300c-1
