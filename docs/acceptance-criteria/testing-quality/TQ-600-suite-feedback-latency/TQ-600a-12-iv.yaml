title: "No test is made slower by being moved onto the private-copy route"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the two shapes a test can pay for a package copy: the shape roughly 20
    existing test files already use, a build into an empty temporary directory,
    measured at 14.81 s; and the shape the private-copy route uses, a copy of the
    whole source tree followed by a self-targeting build against that copy, measured
    at 48.94 s,
  And the private-copy route's own stated account of its cost, which describes
    itself as mirroring the status quo every non-migrated test already pays — a
    description that is wrong by a factor of 3.3 and is currently the only thing an
    author has to go on,
  And the consequence, which is that routing the roughly 20 existing files of the
    cheaper shape onto the private-copy route would add about 680 s to the suite as
    part of a change undertaken to make it faster,
  When the private-copy route produces a root,
  Then the run reports how long that production took and which of the two shapes it
    used,
  And the route's own stated account of its cost agrees with the measured figures,
    naming both shapes and the difference between them, so the next author reads a
    description that matches the behaviour,
  And moving an existing test onto the route is gated by a comparison against that
    test's own prior cost: a move that makes a test slower is reported as a failure
    naming the test and both figures, rather than accepted as part of a speed change,
  And the gate is shown to fire on a test deliberately moved from the cheaper shape
    onto the more expensive one, so it is distinguishable from a gate that never
    examines anything.
