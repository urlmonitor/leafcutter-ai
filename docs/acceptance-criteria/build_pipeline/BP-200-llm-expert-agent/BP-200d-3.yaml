id: BP-200d-3
title: "Prompt-audit skill returns a structured report with violations sorted by line number"
component: build_pipeline
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the file templates/skills/prompt-audit/SKILL.md exists,
  When the audit report format section is read,
  Then it defines a report schema containing:
    - template_name: string (from frontmatter name field)
    - file_path: string (absolute path of audited file)
    - frontmatter_valid: boolean
    - tool_allowlist_valid: boolean
    - no_compound_bash: boolean
    - signoff_protocol_valid: boolean or null (null when not applicable)
    - spawn_allowlist_valid: boolean or null
    - stop_and_ask_valid: boolean or null
    - violations: array of objects with fields:
        check_name, severity, line_number, description, suggested_fix
    - passed_checks: array of check names that produced no errors
    - summary: object with total_violations, total_errors, total_warnings
  And violations are sorted by line_number ascending
  And passed_checks includes only checks that ran and produced zero violations
depends_on: [BP-200d]
