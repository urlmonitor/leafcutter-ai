readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A green test suite you can actually trust — broken changes never reach main.

  Today a pull request can merge even when it breaks tests, because there is no
  check that fails the request on a broken suite. Worse, the suite only passes
  for people who already have the project set up a certain way — a brand-new copy
  of the project cannot even get the tests to start. After this goal, opening a
  pull request gives the author fast, dependable confirmation that their change
  kept everything working, and a broken change simply cannot be merged.
