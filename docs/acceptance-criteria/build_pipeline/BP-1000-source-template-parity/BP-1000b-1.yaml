created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000b.yaml"
criteria: |
  Given the finalize-feature workflow is being run to land an epic branch
  And the workflow has already merged origin/main into the worktree (the
    merge-origin/main step has completed) but has NOT yet merged the PR to main
  When the workflow reaches the point at which it would proceed toward landing
    the branch
  Then a parity-check gate runs as its own step before the PR-merge step is
    reached
  And that gate occupies the same enforcement position as the existing
    test-regression gate: after the merge-origin/main step and before the
    PR-merge step
  And the parity gate is the last safety gate the branch passes through before
    the PR can be merged
