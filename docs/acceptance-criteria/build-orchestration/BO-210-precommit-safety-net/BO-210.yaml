    relevance: >-
      NARROWS THIS RECORD — READ BEFORE TREATING ITS SAME-AGENT CLAUSE AS UNIVERSAL.
      BO-3800 ("When a standard turns work away, the right craft is brought in to finish
      it") covers one class of refusal in which the author is deliberately NOT the fixer:
      a refusal whose own stated disposition hands the work to a restructuring specialist,
      because an author racing a standard moves lines to a neighbouring file to make a
      number fall while a specialist optimises for structure. After BO-3800 lands, this
      record's "the agent that fixes the violation is the SAME agent type that authored the
      work" holds for every refusal EXCEPT one that names a craft the author is not being
      asked to supply; where the boundary falls is stated by the refusing standard itself
      (GE-127f-3) and is judged by neither record. This record's own promise and its three
      children stand: nothing here is withdrawn or re-opened, and BO-3800e exists to
      guarantee that this record's entire remaining population behaves exactly as it does
      today. Reconcile BO-210a's routing configuration and BO-210c's re-dispatch behaviour
      with the carve-out in the change that implements BO-3800, rather than meeting it as a
      surprise.
