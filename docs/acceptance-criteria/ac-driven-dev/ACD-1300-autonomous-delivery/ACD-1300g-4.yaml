it_requirements:
- Publish only when current head equals both passing validation and approved review, after scope revalidation
  and enabled-state admission.
- Use stable run/publication identity and remote branch/PR reconciliation around push/create side effects;
  success requires confirmed remote draft PR, not a local intent record.
- Limit publication authority to the owned feature branch and draft PR; never invoke merge, target push
  or automatic completion marking.
- Include canonical feature/AC links and check/review evidence while excluding secrets; preserve remote
  identity for idempotent recovery.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300g-3 (data handoff, not an additional build-order prerequisite): ReviewResult
  {run_id:string, review_id:string, review_number:1|2, executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, reviewed_sha:string, disposition:approved|changes_required|failed, findings:[{finding_id:string,
  ac_ids:string[], severity:string, description:string}], execution_id:string, evidence_refs:string[]}.'
- 'Runtime interface from ACD-1300g-2 (data handoff, not an additional build-order prerequisite): ReviewPackage
  {run_id:string, feature_id:string, head_sha:string, target_sha:string, full_diff:string|evidence_ref,
  ac_ids:string[], obligation_ids:string[], source_revisions:object, ac_evidence:object[], feature_checks:object[],
  validated_sha:string}.'
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
  workspace_claim:object, settings_revision:string, next_step:string, ac_evidence:object[], ac_budgets:object[],
  review_count:integer, in_flight_action:object|null, publication:object|null}.'
- 'Runtime interface from ACD-1300e-3 (data handoff, not an additional build-order prerequisite): Revalidation
  {run_id:string, admissible:boolean, source_revisions:object, target_sha:string, evidence_revision:string,
  changed_fields:string[], blocker:string|null}.'
