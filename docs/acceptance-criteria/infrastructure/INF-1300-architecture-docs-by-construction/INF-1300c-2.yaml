it_requirements:
  - "The index path is docs/architecture/README.md, relative to the project root the run resolves - not to the package install directory - so a consumer project gets its own index rather than writing into the package's."
  - "A created index must carry docs/** frontmatter that the project's own checks accept: the base required fields plus flight_level, a type and status from the declared enums, and components values drawn from docs/components.json."
  - "The created index must state the collection's conventions by linking to docs/architecture/diagrams/README.md and docs/reference/architecture-docs-layout.md, not by restating them. A copied convention sentence is a second statement of the same rule and is the one that goes stale."
  - "Creation is a fallback, not a step: when an index is already present the run must open and amend it, and must not rewrite, reorder, reformat or re-create it. Detecting presence by path existence alone is sufficient here; an empty file at that path counts as present."
  - "The producing script's source must live under templates/scripts/ so the create-if-absent behaviour reaches consumer installs; a copy only under scripts/ is build output."
  - "Creating the index makes the skill's existing auto-populated link to docs/architecture/README.md resolve; the produced document must not be changed to point somewhere else to work around the file's current absence."
  - "File creation and write failures must follow the project error handling policy in CLAUDE.md, and a failure to create the index must not leave a partially written index behind."
test_spec:
  - name: test_index_is_created_at_the_named_path_when_absent
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "In a git-initialised temporary project with no docs/architecture/README.md, run the real CLI with the listing requested. Assert the file now exists at exactly that path and carries the new document's entry."
  - name: test_created_index_passes_the_real_frontmatter_hook
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: deployed
    description: "git add the created index and run the real scripts/commit_guardian/check_doc_frontmatter.py over it. Assert exit 0 and a non-zero inspected-file count, with a deliberately malformed control index rejected in the same harness."
  - name: test_created_index_refers_to_conventions_rather_than_restating_them
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "Assert the created index links to the existing convention statements and that no sentence stating the filename or collision convention is duplicated between the created index and docs/architecture/diagrams/README.md."
  - name: test_existing_index_is_amended_not_replaced
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Start from a temporary project whose index already holds several entries in a deliberate order plus prose the producer did not write. Produce a document with the listing requested; assert the file is byte-identical outside the single inserted entry, its order unchanged and its prose intact."
  - name: test_forward_reference_from_the_diagram_readme_now_resolves
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "After creation, resolve the docs/architecture/README.md link that docs/architecture/diagrams/README.md closes with, from that file's own directory, and assert it opens a real file."
  - name: test_index_creation_is_reachable_from_the_documented_invocation
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/scaffold/new_arch_doc.py --update-readme"
    description: "Run the exact command line the skill's section 8 prints, in a project with no index, and assert the index came into existence. Proves the create-if-absent path is reachable from the instruction rather than only from a test-only entry point."
test_rationale: >-
  Two temporary projects are required and the second is the one that matters. An observation
  that starts only from nothing cannot tell 'creates an index' from 'overwrites the index' -
  both produce a file containing the new entry - so the amend-not-replace descriptor must
  begin from an index holding entries and prose the run had no business touching, and must
  compare bytes rather than parsed entries. The created index is also a docs/** artifact
  subject to the same frontmatter rules as any other, so its acceptability has to be
  established by running the project's real hook over the staged file, in a git repository,
  with a control that the hook rejects - the hook reports success when it inspects nothing.
