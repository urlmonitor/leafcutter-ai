title: "Each authoring agent writes ACs to the correct component subdirectory with valid schema"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the product owner, business analyst, or technical planner (it-po) is invoked
    by the /plan-feature workflow,
  When the agent produces AC YAML output,
  Then each AC file is written to docs/acceptance-criteria/<component>/
    where <component> matches the AC's component field,
  And the file is named <id>.yaml (e.g. ACD-400a-1.yaml),
  And the file passes validate_ac_schema.py validation (all required fields
    present, enums valid, depends_on references existing ids),
  And if the component subdirectory does not exist, it is created,
  And no file is written to tickets/, scripts/, or any other directory,
  And the workflow reports the list of files written at each gate it presents.

  Given the test designer is invoked by the /plan-feature workflow for a batch
    (e.g. ACD-400a-1 and ACD-400a-2),
  When it records the test design and the file findings for that batch,
  Then it writes them only into AC YAML files under docs/acceptance-criteria/<component>/
    (here ACD-400a-1.yaml and ACD-400a-2.yaml),
  And each edited file still passes validate_ac_schema.py validation,
  And no file is created or modified in tickets/, scripts/, a test directory,
    or any other directory outside the AC store.
