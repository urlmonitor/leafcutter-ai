id: GE-113c-3-iii
components:
  - commit_guardian
title: "Bare-filename allowlist entries suppress all findings with that basename regardless of directory"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: critical
criteria: |
  Given the security allowlist contains the entry "ENTROPY_HIGH:.env:*"
    where the path component ".env" is a bare filename (no path separator),
  And the secrets scanner detects ENTROPY_HIGH findings in the files:
    - ".env" (root level)
    - "src/.env"
    - "deploy/prod/.env"
  When the scanner evaluates whether the allowlist entry suppresses each finding,
  Then ALL three findings are suppressed,
  Because the allowlist path is a bare filename and a single-segment path is
    always a suffix of any finding path that shares that basename.

  Given the security allowlist contains the entry "ENTROPY_HIGH:config/.env:*"
    where the path component "config/.env" is path-qualified (contains a separator),
  And the secrets scanner detects ENTROPY_HIGH findings in the files:
    - "config/.env"
    - "src/config/.env"
    - "deploy/.env"
  When the scanner evaluates whether the allowlist entry suppresses each finding,
  Then the findings at "config/.env" and "src/config/.env" ARE suppressed,
  And the finding at "deploy/.env" is NOT suppressed,
  Because "config/.env" is a segment-by-segment suffix of "config/.env" (exact)
    and "src/config/.env" (suffix match), but NOT of "deploy/.env".
