assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  agent: python-coder
  contract: "A per-guardrail three-way outcome in the consumer install — passed, failed, or unable-to-run with the unresolvable location named — and a job conclusion that is failing when any entry is unable-to-run."
expects_from:
  ac_id: BP-900h-4
  contract: "The consumer-layout install whose declaring-file resolution is anchored to the deployed output root alone."
test_spec:
  - name: test_bp_900h_5_each_registered_guardrail_passes_its_good_input_and_fails_its_bad_input_inside_the_consumer_install
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Inside the BP-900h-4 consumer-layout install, invoke every registered guardrail as a SUBPROCESS against one input it should pass and one it should fail, and assert per guardrail that the pair comes back (passed, failed) and that neither run lands in the unable-to-run category. NON-VACUITY: assert the set of guardrails exercised is non-empty and equals the set the deployed registry declares - a harness that exercises zero guardrails satisfies every per-guardrail assertion in this contract. Include the document-frontmatter guardrail explicitly, since it is the 2026-08-18 regression instance and the one confirmed to stop rather than judge in a consumer install."
  - name: test_bp_900h_5_a_guardrail_whose_declaring_file_is_removed_is_classified_unable_to_run_not_failed
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE THREE-WAY VERDICT, and the entry this AC exists for. Pick one registered guardrail and drive it three times through the same harness against the SAME input that it PASSES when healthy: (a) declaring file present - assert the recorded outcome is passed; (b) declaring file deleted from the deployed root - assert the recorded outcome is the third category, unable-to-run, asserted by its own value and explicitly NOT equal to failed, and assert the report names both the guardrail and the location it could not resolve; (c) declaring file present, input changed to one it rejects - assert failed. Then assert the three outcome values are pairwise distinct. The exit code is non-zero in both (b) and (c), so an assertion on exit code alone is green on a harness that collapses unable-to-run into failed - which is a faithful copy of the 2026-08-18 misdiagnosis."
  - name: test_bp_900h_5_job_conclusion_is_failing_when_any_registered_guardrail_is_unable_to_run
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier. Run the harness through the same command the CI job invokes, as a subprocess, over the consumer install, in four states: healthy install - exit 0; one guardrail sabotaged into unable-to-run - non-zero; one guardrail removed from the deployed tree outright - non-zero, establishing the same force clause; healthy install again - exit 0. Then assert the consumption half from the parsed .github/workflows/ci.yml: the step running this harness is not continue-on-error, so its non-zero conclusion actually fails the job."
  - name: test_bp_900h_5_the_exercised_set_is_derived_from_the_registry_so_a_newly_registered_guardrail_is_exercised_without_editing_a_list
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "The derived-not-hardcoded control, and the only entry a hand-maintained list of guardrails cannot pass. In the consumer install, add a synthetic guardrail entry to the DEPLOYED registry - a trivial script that exits 0 on its good input and non-zero on its bad one - without touching any test code or harness source, re-run the harness, and assert the synthetic guardrail appears in the per-guardrail report with its (passed, failed) pair. Then remove the registry entry, re-run, and assert it disappears from the report. Every other entry in this contract is green on a harness that iterates a literal list of today's guardrails; this one is not."
test_rationale: |
  The three-way verdict is the whole point of this AC and it is the part most likely
  to be dropped as an implementation detail, so entry 2 is written to be impossible to
  satisfy by an exit-code-keyed classifier. Both the failed case and the unable-to-run
  case exit non-zero in the live code, which is precisely why exit code alone cannot
  distinguish them; the test therefore asserts the recorded category by value and
  asserts pairwise distinctness across all three states of the same guardrail against
  the same input. A harness that records "the guardrail failed" when a guardrail could
  not find its vocabulary reproduces the 2026-08-18 misdiagnosis exactly, and would
  pass any test that only asserted a non-zero result.

  Entry 4 is separately non-negotiable. The derivation clause is the clause a working
  implementation and a hardcoded list are indistinguishable on, for every input that
  exists today. Adding a guardrail to the deployed registry at test time and asserting
  it turns up in the report - with the paired removal, so the appearance is not an
  artifact of the fixture - is the only construction that goes red on a list. This is
  the same data-driven-not-by-name discipline the store applies elsewhere.

  Every entry runs inside the BP-900h-4 consumer-layout install rather than the
  package's own workspace, and none of them may import a guardrail and call it. No test
  had ever invoked a deployed guardrail from an install that was not the package's own
  workspace, which is why the difference between "runs and judges" and "cannot start"
  had never been observed. Invoking through the deployed copy, as a subprocess, from
  the consumer install is the only arrangement in which the distinction is observable
  at all.

  KNOWN TENSION, recorded rather than resolved by invention. The criterion requires
  both that every registered guardrail be driven with an input pair AND that the
  exercised set be derived from the registry. A guardrail registered tomorrow has no
  declared input pair, and the harness cannot invent one. The implementer must decide
  how the report accounts for a registered guardrail with no input pair; whatever the
  decision, it must be visible in the report rather than a silent omission, because a
  silent skip satisfies the derivation clause vacuously. Flagged to the IT PO's
  sign-off as the one under-specified point in this AC.

  Angles: criterion, failure, reachability, deployed — at the cap of four. real_artifact
  and seam are not charged; boundary is not charged because the criterion names no
  range or count. The must_block modifier rides entry 3, where the production entry
  point lives.
