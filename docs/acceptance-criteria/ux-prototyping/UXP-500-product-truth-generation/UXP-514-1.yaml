test_rationale: |
  UXP-514 has been work_status done since 2026-07-14 with covered_by empty and no test drives
  any of its four checks. This record is one quarter of that gap. The fixture has to be a store
  built to disagree, because the live store agrees by construction (the generator writes the
  value the validator recomputes), so a test over the real store asserts nothing. The stated
  error text is named in the description so the assertion is on the message an adopter reads,
  not on the exit status alone.
test_spec:
  - name: test_impl_status_disagreeing_with_recomputed_status_is_reported
    target_dir: unit_tests/product_truth/
    description: "A fixture store whose step states done while a named criterion is todo produces a finding naming the flow, the node, the stored status and the recomputed status."
    type: integration
    angle: failure
    framework: unittest
  - name: test_agreeing_impl_status_is_not_reported
    target_dir: unit_tests/product_truth/
    description: "A fixture store whose stated statuses match the recomputation produces no D1 finding."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_recomputed_step_count_rises_with_the_number_of_steps
    target_dir: unit_tests/product_truth/
    description: "Adding one step to the fixture raises the D1 recomputed count by exactly one."
    type: integration
    angle: seam
    framework: unittest
notes: |
  D1 of the four checks UXP-514 names. Split out so each check has its own fixture and its own
  named finding: a single record with four "And" clauses is satisfiable by implementing one and
  reporting all four failures through one message, which is what makes an adopter unable to act
  on the report.

  UXP-514 is NOT superseded by this split. It stays as the umbrella and keeps its done
  accounting for the implementation that landed; these children carry the verification that was
  never written.
