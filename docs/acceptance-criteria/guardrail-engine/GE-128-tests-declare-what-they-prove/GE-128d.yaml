id: GE-128d
title: "A test pointing at a retired requirement is a question to answer, not a warning to silence"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A retired requirement named by a live test stays visible until someone decides.

  When a test names a requirement the project has retired, that notice is live
  code announcing that the thing it exercises has outlived its reason to exist,
  and the notice persists. It is answered by deciding what becomes of the code
  under test — given a current requirement to serve, or removed along with the
  requirement it served. Removing the name so the notice stops is never the
  answer, because it destroys the only signal that the question was ever asked.
