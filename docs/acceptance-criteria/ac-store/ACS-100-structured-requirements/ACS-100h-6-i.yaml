criteria: |
  Scenario: The skill warns that renaming a moved L2 is a store-wide ID-change cascade
    Given the ac-tree-split skill's Pattern C (Intermediate Split) procedure,
    When the rename-and-redistribute step is read,
    Then the procedure explicitly warns that renaming a moved L2 is an
      ID-change cascade whose blast radius extends beyond the moved subtree,
    And it requires a store-wide search for every occurrence of each old child
      ID across all AC files before the rename, so the full set of references
      to update is known,
    And it requires a second store-wide search for each old child ID after the
      rename to confirm that zero stale references to the old ID remain
      anywhere in the store.
