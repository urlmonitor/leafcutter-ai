notes: |
  Outcomes here are not binary, and treating them as such makes the gate vacuous in the
  exact conditions under which it runs. Because the acceptance criteria in a fast-lane
  batch are by definition not yet done, the enforcement plugin converts their failures
  into xfail — so in the live TKT-600a-1 run the genuinely red tests reported as xfailed,
  not failed. A gate that recognises only "failed" as red sees zero red tests in every
  real run.

  skipped and errored are inconclusive rather than red: a test skipped by a marker or
  broken at collection/fixture time proves nothing about whether the implementation is
  constrained, and counting it red would let a typo satisfy the gate. BO-2400a-3-i
  carries the halt reason for the case where the newly-added tests are only green and
  inconclusive.
