  - ac_store
readiness: reviewed
priority: high
title: "/plan-feature runs the rule check after the planner's hand-back pass, and a disallowed edit stops the run before the final gate"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a /plan-feature run whose test-design stage has completed for the batch ACD-9990a-1,
    ACD-9990a-2 and ACD-9990a-3,
    and the technical planner's hand-back pass then changes ACD-9990a-2's assigned_agent from
    python-coder to sql-coder, changes the decision on ACD-9990a-2's one file finding from
    none to the choice "reassign" by it-po, and also changes ACD-9990a-1's criteria text from
    "Then one row is written" to "Then two rows are written",
  When the hand-back pass ends,
  Then /plan-feature runs the requirement rule check for the hand-back stage on the batch,
    with the batch as committed before the hand-back pass as its before-state,
  And that check reports exactly one "protected fields" finding, naming ACD-9990a-1, the
    field criteria and the hand-back stage, and no finding for the assigned_agent or the
    finding decision,
  And the run does not reach the final gate: the hand-back stage is reported not complete,
    and the user is shown the finding,
  And given instead the hand-back pass makes only the assigned_agent and decision changes,
  When the hand-back pass ends,
  Then the same check runs for the hand-back stage and passes,
  And the run goes on to the final gate.
depends_on:
