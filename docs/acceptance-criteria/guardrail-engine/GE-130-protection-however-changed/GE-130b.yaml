notes: |
  CROSS-TREE -- CALLER IDENTITY IS GE-129's, CITED NOT RESOLVED HERE.
    BO-3200f-2-iii blocks a bypass when the caller cannot be identified, for exactly
    these three guards. Today that never triggers on the shell path because they
    never see it. Once widened, a top-level session whose request names no agent
    could lose CLAUDE_NO_DOC_UPDATE and CLAUDE_NO_README_CHECK if "no agent named"
    is read as an unidentified caller rather than as the top-level session. The
    parallel GE-129 (commit caller identity, authored 2026-09-17) retires
    COMMIT_AGENT_MODE and establishes caller identity from agent_id/agent_type; the
    point that "no agent named = the top-level session, not an unidentified caller"
    applies under that design and is to be settled there. This L1 inherits GE-129's
    answer on both paths and does not define its own.
