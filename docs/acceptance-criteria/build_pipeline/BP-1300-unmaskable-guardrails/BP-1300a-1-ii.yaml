title: "A stale deployed artifact that would resolve the pointer is not consulted"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a skill_id that does not exist in the canonical source but a matching stale artifact
    is present in the deployed .claude/skills tree,
  When the build's skill-pointer check runs,
  Then the check ignores the deployed .claude/skills artifact and still reports the skill_id
    as unresolved,
  And the build fails,
  And removing or adding the deployed artifact does not change the verdict.
