notes: |
  FOUND BY RUNNING IT, NOT BY READING IT. Measured on 2026-08-26 against
  BP-1100g-3 as merged (2f740cc4): from the working copy the loader returns all
  seven taught kinds and a test declaring `criterion` is correctly ignored; from
  the installed copy the loader returns the EMPTY set and that same test is
  reported as declaring an unrecognised kind. The reporting pass is therefore
  inverted in the layout where the commit-time and merge-time checks actually
  run — a 100% false-positive rate, not an edge case.

  WHY NOTHING CAUGHT IT. BP-1100g-3's third Then clause is true in the working
  copy and false in the installed one, and its `reachability` descriptor covered
  the neighbouring function rather than this one. The parent is currently
  `work_status: done` on the strength of that partial proof.

  WHY IT IS NOT YET CAUSING DAMAGE, AND WHY THAT IS NOT A REASON TO WAIT.
  Nothing in production consumes the reporting pass today, so there are no live
  false reports. The moment anything does — and BP-1100g-4 has just made the
  neighbouring axis load-bearing at commit time — every correctly-tagged test in
  the repository becomes a reported violation from the installed copy. A guard
  that fires on everything is indistinguishable from a guard that is wrong, and
  the reliable response to one is to switch it off.

  THE ID. `BP-1100g-3-ii` appears once in BP-1100g-3's own notes as a proposed
  child for an unrelated purpose (splitting the authoring-convention clause out
  to llm-expert). That proposal was rejected and never minted, so the id was
  free; it now means this. The note in the parent is left as written because it
  is a record of a decision, not a reservation.

  RELATED, SAME ROOT CAUSE, DIFFERENT SURFACE: KI-ACS-014 (a store field naming
  a path that resolves differently, or not at all, between the two layouts) and
  KI-TQ-004 (a stale installed copy shadowing the canonical module through
  `sys.modules`, which is how this defect first surfaced as an order-dependent
  test failure rather than as a functional bug).
