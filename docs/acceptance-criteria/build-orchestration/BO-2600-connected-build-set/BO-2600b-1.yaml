test_rationale: |
  The assertion MUST be made on the RESOLVED SET, produced by executing the lane under
  unit_tests/_workflow_engine_harness.py (run_workflow_under_e2) against a fixture AC
  store, capturing the resolver dispatch the run recorded, running that dispatch's own
  select_connected command as a subprocess, and comparing the JSON id list it prints
  against the expected set. A test that reads templates/workflows-js/fast-lane-ship.js
  and asserts the substring "--exclude-structural-parent" appears near "select_connected"
  is NOT acceptable evidence and must not be substituted. CLAUDE.md's "Gate / Workflow ACs
  — Verify Behaviorally, Not by Grep" was written about this exact lane after
  fast-lane-build.js passed its grep-only structural tests while never executing its gates
  at all. A grep passes on dead code, on a commented-out flag, and on a flag appended to
  the wrong subcommand; running the command the lane composed passes on none of those.
