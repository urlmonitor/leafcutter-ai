change_target:
  - pipeline
  - docs
risk_surface: internal
notes: |
  The product owner's phrasing is "a rhythm you actually see". A report that exists
  but must be asked for is the state we are already in: the per-record verdict has
  been computable all along, and the 259-record backlog stayed invisible anyway
  because nothing put it in front of anybody.

  Test-angle constraint: the last clause is what makes this more than a static
  check. Complete a second run with deliberately different figures and observe the
  surfaced numbers follow. Asserting that a template contains a placeholder for
  the figures passes on a surface wired to nothing.

  The three-way split (proven / not proven / exempt) is deliberate: collapsing
  exempt into proven would let the 37 records currently carrying a test-free
  declaration inflate the good news.

  IT-PO CAVEAT (2026-08-17) — THE SURFACE IS UNNAMED, AND IT IS THE WHOLE AC.
  "the place they already use for routine status" is not resolvable from the
  criteria, from the architecture docs, or from any sibling AC. It is not a
  detail: choosing wrong produces a technically-passing implementation that
  reproduces the exact invisibility the L0 exists to remove, and no test can
  detect the error because the test will assert against whichever surface was
  chosen. The strongest existing candidate is the CI check list (the only status
  surface in this repo that is read on every PR without being asked for); a
  distant second is a committed report file that appears in review diffs. This
  must be settled with the user before implementation. Flagged to the caller as a
  caveat rather than resolved here — naming the surface would be writing criteria.
