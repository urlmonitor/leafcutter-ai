id: ACD-300a-2
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Triage routes 'behavioral addition' requests directly to the business analyst"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the user's request describes a behavioral addition or refinement to an
    existing feature that already has an L1 AC in the store,
  When the Haiku triage agent evaluates the request against the AC store,
  Then it classifies the route as "behavioral",
  And the classification signal includes: matching L1 parent found in the AC store,
    request adds scenarios or edge cases to existing behavior rather than new
    capability,
  And the routing decision dispatches to: business analyst -> technical planner ->
    test designer (skipping the product owner since the L1 already exists),
  And the routing decision includes the parent L1 AC id for the business analyst to
    decompose under.
depends_on: [ACD-300a]
doc_links:
  - path: templates/skills/plan-feature/SKILL.md
    relationship: describes
    status: exists
  - path: docs/architecture/diagrams/c2-002-ac-authoring-pipeline.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
declared_files:
  - path: templates/agents/ac-triage.md
    state: existing
it_requirements:
  - "Edit the canonical triage template only (templates/agents/ac-triage.md); deployed and installed copies are regenerated by the build and never hand-edited (ADR-001)."
  - "The triage agent stays Haiku-pinned and read-only, and the latency budget of the parent ACD-300a (under 3 seconds for a store of up to 200 ACs) still holds."
  - "The behavioral rule in the template must name both signals of the criteria (a matching L1 parent in the store, and a request that adds scenarios or edge cases to existing behaviour rather than a new capability), and the returned rationale must name the signal that decided the route."
  - "Whenever route is behavioral, parent_l1_id must be the id of the matched L1 record, never null; this id is what templates/workflows-js/plan-feature.js passes to the business-analyst stage as parent_l1_id."
  - "The routing reply keeps its current keys and value types (route, existing_acs, parent_l1_id, rationale, anomalies), and the behavioral dispatch order (business-analyst, it-po, then test-designer) produced by templates/workflows-js/plan-feature.js is not changed by this record."
delivers_to: null
expects_from: null
test_required: true
test_intent:
  - clause: it classifies the route as "behavioral"
    needs_test: true
    reason: The behavioral branch sits between the covered check and the technical check in the triage decision order, and a reordered branch would misroute an L1-backed request.
  - clause: 'the classification signal includes: matching L1 parent found in the AC store, request adds scenarios or edge cases to existing behavior rather than new capability'
    needs_test: true
    reason: The template today speaks of scenarios and behaviours but not of edge cases, so a check that the rule carries both signals shows the wording was completed.
  - clause: 'the routing decision dispatches to: business analyst -> technical planner -> test designer (skipping the product owner since the L1 already exists)'
    needs_test: true
    reason: The stage order is built by the workflow from the route, and a wrong branch would run the product owner or drop the test designer.
  - clause: the routing decision includes the parent L1 AC id for the business analyst to decompose under
    needs_test: true
    reason: The parent id travels from the triage reply into the business-analyst prompt, and dropping it there would leave the new L2s without a parent.
test_spec:
  - name: test_acd_300a_2_triage_template_routes_l1_match_to_behavioral
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_2.py: reads the real templates/agents/ac-triage.md; its decision steps check the L1 match after the covered check and before the technical and default checks, classify a matching L1 as route behavioral, and require parent_l1_id to be the matched L1 id on that route, never null.'
    proves_clause: it classifies the route as "behavioral"
    code_file: templates/agents/ac-triage.md
  - name: test_acd_300a_2_behavioral_rule_names_both_signals
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_2.py: the behavioral rule of templates/agents/ac-triage.md names a matching L1 parent in the AC store and a request that adds scenarios or edge cases to existing behaviour rather than a new capability. Red today: the rule mentions neither edge cases nor the not-a-new-capability signal.'
    proves_clause: 'the classification signal includes: matching L1 parent found in the AC store, request adds scenarios or edge cases to existing behavior rather than new capability'
    code_file: templates/agents/ac-triage.md
  - name: test_acd_300a_2_behavioral_route_starts_with_business_analyst
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: 'In unit_tests/workflows/test_acd_300a_2.py: drives the real templates/workflows-js/plan-feature.js through run_workflow_under_e2 (unit_tests/_workflow_engine_harness.py) on a fresh run, stage-0-triage replying route behavioral with parent_l1_id ACD-9100 and pt-classify replying outcome none; the first stage-*-author dispatch is stage-ba-author, no stage-po-author is dispatched, and the run returns paused_awaiting_input at gate-ba.'
    proves_clause: 'the routing decision dispatches to: business analyst -> technical planner -> test designer (skipping the product owner since the L1 already exists)'
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_2_behavioral_route_runs_itpo_then_test_designer
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_2.py: same harness, triage behavioral, crash-resume with scan-committed-stages listing a plan-feature(BA) commit; the label table follows unit_tests/ac_driven_dev/file_findings/_handback_support.py. Exactly one resume-log dispatch precedes stage-itpo-author, stage-test-design-author follows it, no stage-po-author is dispatched anywhere, and the run pauses at final-gate.'
    proves_clause: 'the routing decision dispatches to: business analyst -> technical planner -> test designer (skipping the product owner since the L1 already exists)'
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_2_parent_l1_id_reaches_business_analyst
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_2.py: the same fresh run as the reachability test; the stage-ba-author instructions carry the line parent_l1_id: "ACD-9100" exactly as the triage reply gave it, never null.'
    proves_clause: the routing decision includes the parent L1 AC id for the business analyst to decompose under
    code_file: templates/workflows-js/plan-feature.js
