notes: |
  DECISION ON USER BRIEF ITEM 6: IN SCOPE. The analysis recommends (iii) as an
  optional addition to the pin for names whose reading is contested, and the
  cost is bounded: one optional test_spec item field (the in_scope_files
  precedent from TQ-500g-1-ix shows the path) and one branch in the writer. It
  gives the AC author an exact, reviewable wrong version with no LLM in the
  loop, which is the only remedy that fixes a contested name on the first run.

  ORDER OF PRECEDENCE: declared > pinned > prepared.

  A FAILED DECLARATION IS NEVER REPAIRED BY A GUESS. When the author declared
  the replacement, silently swapping in the preparer's reading would defeat
  the declaration. So a stale or failing declaration is unfinished with a
  reason naming the AC, and the author fixes the AC. This is the analysis's
  invariant for (iii): "the declared old must still match the current code
  exactly once, or the name becomes unfinished, never silently skipped".

  A DECLARATION IS NOT PINNED. It is read from the AC on every run; the pin for
  the same name is left untouched and comes back if the declaration is
  removed.

  SCHEMA (for IT-PO). The field shape is IT-PO's (for example a map from a
  must_catch name to a list of {path, old, new}). It must be added to the
  test_spec item in config/ac_store_schema.json and enforced by
  validate_ac_schema.py (the check-ac-schema gate), and documented in
  docs/reference/ac-schema.md. Whether it is copied onto generated tickets is
  IT-PO's call; if it is, config/test_requirements.schema.json gains it in the
  same change (TQ-500f-2 copy-through coupling). The last And clause (a
  declaration for an unlisted name is refused) belongs to that validator.

  NOT A WAY AROUND THE TEST FILE RULE. A declaration may never alter a test
  file; the same refusals apply as to a prepared replacement.

  IT-PO ENRICHMENT (2026-10-23)
  SHAPE: declared_replacements, a map from a must_catch name of the same entry
  (exact spelling) to a non-empty list of {path, old, new}. Not copied onto
  tickets, so config/test_requirements.schema.json is unchanged. The
  entry-naming validator in _ac_schema_test_spec_validators.py is the
  load-bearing check; the JSON schema only admits the key. Documentation of the
  field in docs/reference/ac-schema.md is a documentation follow-up
  (documentation-expert), not part of this AC's declared files.
