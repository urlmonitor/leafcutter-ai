notes: |
  FAIL-OPEN IS CORRECT AND MUST BE PRESERVED. A report write must never block or
  change a verdict; the sign-off protocol's "do not abort sign-off" rule stands
  unchanged. This AC narrows the posture from fail-open-and-silent to
  fail-open-and-legible: same non-blocking behaviour, but the marker carries a
  reason. Any implementation that satisfies this AC by making a failed write fatal
  is a regression and must be rejected in review.

  THE FIFTH REASON IS THE DOMINANT ONE AND WAS MISSING FROM THE FIRST DRAFT. An
  earlier draft closed the set at three reasons: not-an-allowed-writer, facility
  missing, destination unwritable. The submission script's own DECISION HISTORY
  entry of 2026-05-30 records that the observed failure markers were caused by
  something else entirely — an EMPTY STDOUT CAPTURE ON A WRITE THAT SUCCEEDED. That
  is precisely why the sidecar identifier file exists as a fallback. A three-reason
  set has nowhere to put the most common real case, and — worse — feeding it into
  INF-500d-5 would classify an already-written record as failed, hold it, flush it,
  and produce a duplicate, contradicting that AC's exactly-once guarantee. Hence
  both the fifth reason and the second scenario, which forbids it entering the hold
  queue.

  THE SECOND REASON IS ALSO NEW, AND IS NOT COSMETIC. Measured on 2026-08-13, the
  submission path exits with a failure status from at least four distinct
  input-validation paths (unrecognised category, malformed tags, malformed reference
  list) and from a missing YAML library, none of which fit "not permitted",
  "facility unavailable", or "destination unwritable". Any of them would have to be
  mis-filed under one of the other reasons, which is how a closed set stops being
  informative. The reason names above are stated behaviourally on purpose; the exact
  identifiers are for technical enrichment to fix.

  MEASUREMENT (moved out of the criteria on 2026-08-13 — a criterion containing a
  live count is untestable by construction, because the count changes every drive).
  As measured in this workspace on 2026-08-13: approximately 780 accumulated failure
  markers across the ticket store, none carrying a reason and therefore mutually
  indistinguishable. Treat the figure as an order-of-magnitude motivation, not as an
  assertion; re-measure before quoting it anywhere that matters.

  BOUNDARY — DO NOT AMEND, FLAGGED FOR SOMEONE ELSE. BO-2000a-3 (approved, done)
  specifies an undifferentiated marker BY DESIGN and BO-2400d-1-i (done) covers the
  telemetry sink, not this one. Neither is re-opened here. If the reviewer decides
  BO-2000a-3's marker wording should be tightened to reference the reason code,
  that is a separate amendment for its owner to make; this AC is written so that no
  such amendment is required for it to be implementable.

  Detection of an accumulating failure RATE is deliberately not in this AC — see
  INF-500d-5, which places that gate at the workspace-removal boundary rather than
  adding a per-ticket blocker.
