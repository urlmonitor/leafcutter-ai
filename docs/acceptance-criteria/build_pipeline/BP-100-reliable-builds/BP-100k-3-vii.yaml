id: BP-100k-3-vii
components:
  - build_pipeline
title: "check-output-drift never reports a git-ignored path or a nested worktree as a coverage gap, while deployed-output dirs stay fully censused"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a git workspace whose build manifest records an output directly under
    .claude/ (for example .claude/settings.json), so .claude/ is a scanned dir,
  And .gitignore ignores .claude/.cache/ and .claude/worktrees/,
  And unrecorded files exist under .claude/.cache/ and inside a nested worktree
    at .claude/worktrees/<name>/ (a directory holding a .git entry),
  When check-output-drift runs over that workspace,
  Then no GAP line names any path under .claude/.cache/ or .claude/worktrees/,
    and with no other finding the run exits 0,
  And a subdirectory holding a .git entry is skipped even when git is
    unavailable or the workspace is not a git repository,
  And an unrecorded, non-ignored file under .claude/ is still reported as a GAP
    and blocks the commit,
  And an ignored directory that contains a recorded manifest key is still
    walked, so an unrecorded stray beside the recorded key is still a GAP,
  And drift on a recorded key under an ignored directory is still detected,
  And a tracked directory symlink under a scanned dir does not crash the gate,
  And when git cannot list ignored paths the gate logs a WARNING and falls
    back to the unfiltered census rather than failing,
  And the bug symptom (tens of thousands of GAP lines for uncommittable
    gitignored / nested-worktree files blocking every commit) must not occur.
depends_on:
  - BP-100k-3
