it_requirements:
  - "Sub-step C invokes scripts/set_ticket_status.py with --status done, in the same shape sub-step D already uses for mark_ac_done.py. No step in the finalization prompt may instruct a direct frontmatter write of the finished state."
  - "--force is never passed. It disables the parity check, so using it here would reinstate the ungated write behind a flag rather than removing it."
  - "A non-zero exit is reported against the ticket by name and the ticket is left unclosed. It is not retried with an override and not written by another route; the existing archive check then surfaces the unclosed ticket downstream, which is the correct end state."
  - "The change is confined to the prompt text of sub-step C. finalize-feature.js is already over its line-count limit, so the edit must be length-neutral or shrinking."
