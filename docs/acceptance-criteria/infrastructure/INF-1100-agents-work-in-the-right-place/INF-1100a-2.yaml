criteria: |
  Given the configured test location is "tests/",
  And the project keeps sibling tests under a per-area subfolder
    (for example tests/etl/ holds the tests for the etl area),
  When an agent resolves where a test for the etl area must go,
  Then the resolved location is "tests/etl/" — the configured test root
    joined with the source area's subpath,
  And the area subpath is taken from the source layout rather than a fixed string.
