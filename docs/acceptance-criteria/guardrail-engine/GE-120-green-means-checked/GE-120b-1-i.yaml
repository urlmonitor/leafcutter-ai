id: GE-120b-1-i
title: "A working copy with no deployed layout at all still does not pass silently"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a working copy that exposes neither the deployed layout nor any built layout it
    could be resolved from, because the package has never been built in that workspace,
  When the AC-parent-covered-by check is executed there against staged files that violate the
    parent covered_by rule in 6 places,
  Then the check either reaches the same blocked verdict as the main checkout, or reports the
    could-not-check outcome defined by GE-120a-1,
  And in neither case does it report an ordinary clean pass,
  And its output names the missing prerequisite in terms the reader can act on — that the
    workspace has not been built — rather than naming an internal module that failed to
    import,
  And which of the two outcomes occurs is a stated, reviewable consequence of the check's
    recorded cannot-run disposition (GE-120a-2), not an accident of where resolution
    happened to fail.

  Coverage note: exercise this against a working copy in which the deployed layout genuinely
  does not exist. Simulating it by deleting one file from an otherwise built layout tests a
  different condition.
depends_on:
  - GE-120b-1
  - GE-120a-2
