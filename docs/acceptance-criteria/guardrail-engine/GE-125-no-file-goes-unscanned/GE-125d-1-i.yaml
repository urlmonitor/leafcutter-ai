it_requirements:
  - "MEASURED IN THE CANONICAL COPIES ON 2026-08-24, not assumed, because this record fixes a stream and the existing one must be described correctly. In templates/scripts/commit_guardian/check_secrets.py the findings report — the SECRETS DETECTED header, the per-finding lines, and the trailing allowlist hint — is written by bare print() with NO file= argument, so it goes to STDOUT. The only existing write to STDERR in that file is the WARNING emitted when `git diff --cached` cannot be listed. In templates/skills/security-scanner/scripts/scan_secrets.py, allowlist-parse warnings go to stderr and the module docstring states 'never stdout', while its standalone CLI prints findings to stdout. The convention therefore already exists and is consistent — findings on stdout, warnings on stderr — and this record joins the stderr side rather than inventing a second convention."
  - "Stream discipline is a hard boundary, not a preference. Not one character of the notice may reach the output stream — not the header, not a per-file line, not the count — and not one character of the findings report may move to the error stream. A single line of notice text on the output stream corrupts a report that the check's own summary and any log scraper already parse."
  - "The existing output-stream report must be unchanged for a run that produces the same reported findings, whether or not anything was withheld: same format, same ordering, same trailing allowlist hint. This record adds a stream; it does not renegotiate the existing one. A diff of the output stream between the pre-change and post-change build over identical input must be empty."
  - "On a run with no findings and nothing withheld, the output stream must remain exactly what it is today for this check — which is nothing, because main() returns 0 before producing any output. The clean-run output contract is inherited unchanged and must not be re-achieved by printing an empty block."
  - "Every test covering this record must capture the two streams SEPARATELY. A merged capture passes whether the notice went to the right stream or corrupted the report, which makes this the arm most easily lost in review. Capturing stdout and stderr into one buffer is a defect in the test, not a convenience."
  - "ADR-001 parity: edit templates/scripts/commit_guardian/check_secrets.py, then run `python scripts/build.py --target-dir .` and verify the deployed copy behaves identically. check_hook_parity enforces all four locations; a deployed-copy-only fix is reverted by the next build."
delivers_to: null
expects_from:
  ac_id: GE-125d-1
  contract: "The notice itself. This record fixes which stream carries it and asserts that the pre-existing findings report on the other stream is unchanged."
test_required: true
test_spec:
  - name: test_notice_on_error_stream_and_findings_report_on_output_stream
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The parent's three-file staged set run as a subprocess with stdout and stderr captured into SEPARATE buffers: stderr carries the notice and nothing belonging to the findings report, stdout carries the src/app.py finding in the existing format and no part of the notice"
  - name: test_output_stream_carries_no_notice_header_line_or_count
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Each individually identifiable element of the notice — the header, any per-file line, the total — is asserted absent from the stdout buffer, so a partial leak of one element cannot pass"
  - name: test_existing_findings_report_format_is_byte_identical_with_and_without_withholding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "Two runs producing the same reported findings, one with withheld findings and one without, emit an identical stdout buffer — proving the added stream did not renegotiate the existing report that the hook summary and log readers parse"
  - name: test_clean_run_leaves_both_streams_as_they_are_today
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A staged set with no findings and nothing withheld produces empty stdout and empty stderr for this check — no header, no zero count, no empty block"
  - name: test_stream_split_holds_in_the_deployed_copy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "After `python scripts/build.py --target-dir .`, the deployed scripts/commit_guardian/check_secrets.py places the notice and the findings report on the same two streams as the canonical templates/ copy"
test_rationale: "The whole content of this record is which stream carries what, so the only assertion shape that can prove it is a subprocess run with stdout and stderr captured into two separate buffers. A test that merges the streams — or that asserts on a formatter's return value rather than on process output — passes whether the notice landed correctly or corrupted the findings report, which is exactly the failure this record exists to make unreachable. The byte-identical entry is a seam test rather than a criterion test because the consumer of the output stream is not this check: the hook's own summary and any log scraper parse that report, so the evidence needed is that the producer's real output is unchanged for the real consumer. The clean-run entry pins the inherited contract at its boundary, where main() returns 0 before producing any output today. The deployed entry exists because the file ships through build.py into three further copies that check_hook_parity holds identical."
