criteria: |
  Given the trace-analyzers goal "Decide which recent kernel traces the trace analyzers read and
    how often they run, so their findings reach the next decision run.", turned away by routing
    (trigger jev_none) and offered as parts p1 and p2,
  When human:user rejects the split with the note "One question, not two: how often they run
    follows from which traces they read. I will ask it again as one question.",
  Then the run ends blocked,
  And the run records the same capability gap for the goal that it records today when routing
    turns a request away,
  And nothing is decided and no decision record is staged,
  And the split's state is rejected.
