id: ACS-1300c-1
components:
  - ac_store
title: "The repair awards nothing — the finished-state field is never written"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store containing two records whose coverage lists are empty, whose naming tests
    are present and pass when run, and whose finished state reads as unfinished,
  And, in the same store, a record whose finished state already reads as finished,
  When the repair tool is invoked out of process with the apply request,
  Then both of the first two records hold their naming test's path afterwards,
  And the line carrying each of those two records' finished state is
    character-for-character identical to that line before the run,
  And no file anywhere under the store has its finished-state value changed by the run,
    including the record that already read as finished,
  And the run's report shows both records were repaired, so the unchanged finished state
    is a refusal exercised by a demonstrably live run and not the residue of a run that
    did nothing,
  And the report names those two records as eligible to be marked finished and not so
    marked, with that eligibility taken from the verdict the existing done-proof oracle
    reaches for each record rather than from a judgement the repair formed itself,
  And the report states that this eligibility is not a consequence of the repair: the
    eligibility verdict computed for each of those records BEFORE the run is the same
    verdict computed for it after, and the report says so rather than presenting the
    record as newly unblocked,
  And that eligibility appears only as a report line: re-reading each record from disk
    after the run shows the same finished state it had before.
depends_on:
  - ACS-1300c
