criteria: |
  Given the fast-lane phase order after the opinion-only agents are removed,
  When its phases are enumerated,
  Then the deterministic proof-of-done gates (red-baseline verification, green plus
    coverage verification, and the covers-tag linkage check) are present as the
    completion arbiters
  So the fast lane still has an enforced proof-of-done in place of the removed review.
