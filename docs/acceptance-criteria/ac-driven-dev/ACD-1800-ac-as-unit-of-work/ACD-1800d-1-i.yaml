work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a requirement whose code deliverable is implemented in a source file that is
    later copied into a generated or deployed location,
  When the per-deliverable back-reference for that deliverable is recorded on the
    requirement,
  Then the reference resolves to the hand-edited canonical file,
  And it does not resolve to the generated or deployed copy,
  And a builder following the reference lands on the exact file to edit.
