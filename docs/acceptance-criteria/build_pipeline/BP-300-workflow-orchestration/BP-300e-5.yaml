change_target: pipeline
risk_surface: contract_boundary
notes: >-
  Test contract intent: coverable by a structural/audit test that asserts every
  agent-reply parse point across the delivery workflow scripts routes through the single
  tolerant reader rather than an inline strict-parse expression (i.e. no reply-reading
  site parses agent output without the tolerant path). At authoring time the known
  surface is 34 such sites (26 in plan-feature.js) across plan-feature.js,
  build-feature.js, finalize-feature.js, build-epic.js and build-ticket.js; the test
  should assert coverage of the parse sites rather than hard-code that count. Also
  coverable by per-script integration tests that replay a prose-wrapped reply through
  build-feature and finalize-feature and assert each run continues.
