description: 'Which build path should the open DK-600 decision-lifecycle ACs take? Open: two kernel ...'
decision_type: design
question: 'Which build path should the open DK-600 decision-lifecycle ACs take? Open: two kernel code ACs, DK-600a-3 (a finding
  that cites any evidence id the kernel did not hand over is not accepted) and DK-600e-3-i (the run''s publish instruction
  carries --correct, plus an end-to-end test), and nine documentation ACs (six assigned to architecture-diagram-author, three
  to documentation-expert). The user set: review before main means a blocking pr-reviewer before commit; DK-600a-3 follows
  its AC, not its ticket; the nine doc ACs get test_required false with a test_rationale; defect cost is low and the user
  is present; about three PRs are preferred. The fast lane refuses documentation ACs. Options: (A) the fast lane once per
  code AC after resetting both to todo, plus one hand-authored docs ticket with architecture-diagram-author, documentation-expert
  and documentation-verifier built through build-feature; (B) rewire the two existing kernel tickets with source_ac, test-writer,
  pr-reviewer and Test Requirements and build each through build-feature, plus the same docs ticket; (C) build-ac in leaf
  mode on the two code ACs with pr-reviewer added, retiring the existing tickets, plus the same docs ticket; (D) build-ac
  in goal mode on DK-600, one epic of about fourteen tickets through build-feature.'
