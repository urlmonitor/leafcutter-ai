notes: |
  Observed defect 1 (2026-10-25): clearing was refused because a shell's current folder was
  inside the workspace, but the workspace's repository had already been deleted, leaving an
  empty folder. BO-4300e-2-ii (done) already promises "identical before and after"; its proof
  did not cover a program that only has its current folder inside the workspace (no file
  open), nor require the check to come before the first deletion. For this case the record
  narrows e-2-ii's "stop it or refuse" choice to refuse-with-nothing-deleted, as the user
  asked; it picks one of e-2-ii's two permitted outcomes and does not contradict it.
