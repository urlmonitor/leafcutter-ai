change_target: code
risk_surface: contract_boundary
it_requirements:
  - Expose domain labels without KREntity or other KR-prefixed labels on the resulting projection; preserve existing Decision and Lesson kinds where applicable without inventing records.
  - Map existing edge types to validated meaningful native relationship types, preserving edge_type, endpoint direction, anchors, source revision and payload; do not duplicate edges to simulate labels.
  - Expose caption properties and a deduplicated components list from authored component declarations and explicit component_membership edges in the same repository and generation; unresolved declared components remain filterable and receive a diagnostic. Do not infer ownership through transitive links.
  - Use Repository and Snapshot for bookkeeping; provide an Aura domain perspective or equivalent normal exploration configuration that excludes those labels, uses readable captions and limits the scene to current content. Database publication alone is not proof that a saved Aura perspective was configured.
  - Maintain current markers consistently with the repository active pointer in the same atomic publication or rollback operation; preserve pinned reads of retired generations and fail closed on interrupted migration.
  - Preserve stored registered-query text, validation receipts and digests; any compatibility mapping belongs to the trusted execution boundary and must retain parameterization, read-only enforcement, repository scope and generation scope.
  - The migration must be idempotent, validate the owned graph before mutation, and preserve canonical keys, raw payloads, source revisions, entity and relationship counts, active pointers, historical generations and retrieval results; reject malformed or foreign records and cross-generation edges rather than partially rewriting them.
  - Preserve optional/disabled startup and existing exact, graph, semantic, hybrid and kernel evidence contracts; do not require credentials for offline validation or publish new content during a representation-only migration.
test_required: true
