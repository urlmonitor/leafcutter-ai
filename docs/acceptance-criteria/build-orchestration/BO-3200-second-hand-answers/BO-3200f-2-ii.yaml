it_requirements:
  - "IT-PO DECISION -- ASSIGNMENT CONFIRMED python-coder. The deliverable is test infrastructure and a dispatch transport: a switch, a live-dispatch entry point the three live descriptors call, dispatch-failure classification and an evidence writer. No charter text is in scope; the three scenarios this harness runs are owned by BO-3200f-2 and BO-3200f-2-i."
  - "IT-PO DECISION -- REUSE THE TRANSPORT, NOT THE RUNNER. scripts/evals/run_agent_eval.py already dispatches a real agent through the headless agent CLI (KI-TQ-20260908-0900). The harness dispatches through that same transport, extracted into ONE shared module under scripts/evals/ that both the runner and the harness import -- never by importing the runner's command line and never by copying it. The extraction must leave the runner's report shape, scoring, thresholds, results location and exit behaviour unchanged, proven by the existing unit_tests/evals/ suite. NOT reused: scoring against a threshold, the aggregate score, the results directory, the eval selector and trigger closure, the eval-staleness pre-commit guard and the required CI gate. If the transport cannot be extracted without changing the runner's observable behaviour, the implementer stops and reports a blocker; a second, private transport is not an acceptable fallback."
  - "PASS/FAIL PER SCENARIO, NO SCORE. Each live scenario passes or fails on the reply its own dispatch returned, judged by a deterministic assertion -- for the executor's scenarios, that the reply verifies as BO-3200f-1's capture of the dispatched command. No threshold, no aggregate, and no averaging across scenarios or repeats can turn a failed scenario into a pass. One passing run is one observed sample of model behaviour; the evidence record says so by recording the model and time, and nothing here claims a reliability rate."
  - "DISPATCH THE AGENT AS REGISTERED. The live dispatch resolves the agent from the repository's shipped agent definition and its registry entry, read at dispatch time from their repository paths, with the project's hooks and permission settings in force. Passing charter text from a copy as a system prompt, loading a fixture charter, caching the charter across scenarios, or answering with a scripted reply are all the stand-in the second scenario forbids. The third scenario's changed charter must therefore be what the dispatch uses, with no code change in the harness."
  - "A DISPATCH THAT CANNOT BE MADE IS NEVER AN ANSWER. Four causes, each reported under its own name: missing_credentials, agent_not_registered, dispatch_failed_in_transit, permission_request_unanswered. Each makes its scenario FAILED and the run FAILED; none may be reported as skipped, not run, passed, or as an empty reply that a scenario assertion then scores. The eval runner's current handling (a launch or parse failure becomes an empty prediction; false-green M6) must not be inherited through the shared transport. Classification comes from the transport's own signals -- process exit, structured output, recorded permission denials, registry lookup -- never from scanning the model's prose for words."
  - "THE SWITCH IS ONE ENVIRONMENT VARIABLE: LEAFCUTTER_LIVE_DISPATCH. Exactly '1' is on; unset or '0' is off; any other value fails the run naming the variable and the value, so a typo never reads as off. Switched off, each live scenario is reported not run through the test framework's skip outcome with a reason that names LEAFCUTTER_LIVE_DISPATCH, and no dispatch is attempted. Switched on, the skip outcome is unavailable to live scenarios. This variable is not a guardrail bypass variable and no guardrail may honour it."
  - "NO PRE-APPROVAL (user decision (b), 2026-09-16). The harness passes no permission-skipping flag, no allowed-tools list and no settings overlay that pre-approves the dispatched agent's commands. A permission request met by an unattended run is the permission_request_unanswered failure, reported at once rather than waited on. Consequence, recorded rather than worked around: a switched-on run in an environment whose own settings do not already allow the scenario's commands fails by name."
  - "NO CI JOB SHIPS WITH THIS RECORD. The default local suite and every CI job run with the switch unset; the first scenario is proven against that default. A CI job that sets the switch needs a model-service credential and a permission arrangement compatible with 'nothing is pre-approved'; both are user decisions and are not made here."
  - "EVIDENCE RECORD -- LOCATION. Every switched-on run writes one new JSON file to docs/testing/live-dispatch-evidence/, a tracked directory, named by run start time (UTC) and short commit SHA; a record is never overwritten and never written to scripts/evals/results/, which is gitignored and so missing in every fresh worktree (KI-TQ-20260908-0900). The record is written for failed runs too -- including runs where no dispatch could be made -- and a switched-on run whose record cannot be written is itself reported as failed. The directory must pass the repository's doc gates; if a gate rejects non-Markdown files there, that is reported as a blocker, not solved by moving the record somewhere untracked."
  - "EVIDENCE RECORD -- SHAPE. {run_id: str, started_at: ISO-8601 UTC, commit_sha: str, switch: 'LEAFCUTTER_LIVE_DISPATCH=1', overall: 'passed' | 'failed', scenarios: [{scenario: str (test id), ac_id: str, verdict: 'passed' | 'failed' | 'not_run', failure_cause: null | 'missing_credentials' | 'agent_not_registered' | 'dispatch_failed_in_transit' | 'permission_request_unanswered' | 'assertion_failed', agent: str, model: str | null (as reported by the service, not as requested), ran_at: ISO-8601 UTC, charter_path: str, charter_sha256: str, charter_content: str, registry_entry_sha256: str, registry_entry: object, reply: str}]}. overall is 'failed' whenever any scenario is not 'passed'. A done-proof reads verdict per scenario; a record whose charter or registry-entry digest differs from the files now shipped is visibly out of date, and whether that removes its standing is TQ-400's, not decided here."
  - "NOT THE RETIRED PROOF KIND. No schema enum value, test_spec angle or type, ticket Test Requirements kind or evidence-record field value named live_dispatch is introduced (BO-2900g-3). Live descriptors keep type e2e and angle deployed and name this harness in surface_invoked. 'Live dispatch' stays plain words."
  - "BOUNDARY WITH TQ-200b AND TQ-200c. This harness holds proofs whose pass condition is a deterministic assertion over one real dispatch's reply (asserted, in TQ-200c-1's proof_mode words). A proof whose pass condition is a score over a set of rows against a threshold (judged) belongs in the eval harness, and this harness must not grow scoring, thresholds or eval rows. See notes for what TQ-200c would need to change."
  - "AGENT-AGNOSTIC MECHANISM. The switch, transport use, failure classification and evidence shape name no agent; which agent a scenario dispatches and which acceptance criterion it proves are declared by the scenario. The executor is the first user, not a special case."
  - "Must satisfy the repository error-handling policy: dispatch, registry read and evidence write are external I/O; each failure is logged at WARNING or higher and surfaces as a named failure, never swallowed. Any new module under scripts/ that the deployed eval runner imports is added to the build deploy manifest in the same change (CLAUDE.md, new hook and gate dependencies)."
