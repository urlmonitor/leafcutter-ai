estimated_complexity: M
it_requirements:
  - "The gate must run before any ticket-supervisor / parallel() dispatch in build-epic.js, never after — place it in the pre-dispatch sequence (the same position as the existing Step 0 worktree guard), so a failing probe blocks the whole batch loop."
  - "On a failing probe the workflow must return a typed blocked result mirroring the worktree-guard shape, carrying the sink path and the remediation text (e.g. { status: 'blocked', sink_unreachable: true, sink_path, remediation }); the caller surfaces it and no batch is dispatched."
  - "Factor the probe as ONE shared reusable helper (append-one-line, mkdir-and-retry remediation, genuine-write-failure classification) so build-epic.js and the build-feature.md prose gate exercise identical semantics — do not inline the probe logic in only one surface."
  - "Dual-surface parity (the KI-3 lesson): the deterministic build-epic.js gate and the build-feature.md prose gate must BOTH hard-block; a gate that blocks in one path but not the other silently reintroduces the original warn-only bug."
  - "The probe must be idempotent: a probe run appends exactly one probe line and must not corrupt or duplicate prior sink content."
  - "Handle the probe's external I/O (filesystem append, mkdir) gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap the I/O in typed except, log at WARNING, and surface a clear operator message rather than swallowing the failure."
  - "Deployed/template parity (ADR-001 self-hosting): build-epic.js is a package source; if a probe helper is added as a script, edit the package source and verify the deployed copy via the build.py round-trip — never edit only one side."
  - "The probe target must come ONLY from the stdout of the install's telemetry location query (sink_resolution.py --print-location telemetry). A non-zero exit, an exit 0 with empty stdout (the shape of a deployed copy older than INF-500d-4-iii), or a printed path whose enduring root is absent are all an unusable declaration: block with remediation 'rebuild' and never substitute debugging/logs/agent_telemetry.jsonl or any other derived or default path."
  - "Every refusal path (unusable declaration, stale enduring root, genuine write failure) must create no file and no directory anywhere — not in the worktree, not under the declared root, not above it. The stale-root case in particular must never be 'repaired' by creating the missing enduring root."
  - "The block result is the workflow's terminal payload and the operator message is the only output on the block path; no ticket file's frontmatter may be rewritten (no transition to in_progress) before the gate passes."
delivers_to:
  agent: python-coder
  contract: "A shared pre-drive sink probe helper plus the build-epic.js pre-dispatch gate that consumes it. The helper exposes: (0) resolution of the stream location through the install's telemetry location query (sink_resolution.py --print-location telemetry, INF-500d-4-iii), treating a non-zero exit, empty output, or a stale enduring root as an unusable declaration that blocks with remediation 'rebuild' and never falls back to a relative path; (1) first-probe append of one line to the absolute path that query printed; (2) mkdir-and-reprobe remediation when the only failure cause is the absent log directory under a live enduring root; (3) genuine-write-failure classification (not-writable / is-a-directory / read-only FS) distinct from directory-absence; returning a typed pass/fail result. On fail the gate blocks all parallel() dispatch and returns { status: 'blocked', sink_unreachable: true, sink_path: <absolute path printed by the location query, or null when none was declared>, remediation: <string> }."
expects_from:
  ac_id: INF-500d-4-iii
  contract: "The side-effect-free telemetry location query that prints the declared absolute operational_telemetry_stream (or nothing plus an error, exit 1, when no usable declaration exists)."
