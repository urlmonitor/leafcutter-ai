criteria: |
  Given the commit-guardian README's row for check-complexity says it blocks any
    Python file where a function exceeds the limit,
  When a reader looks the check up after GE-131a-2 lands,
  Then the row says a new or crossing function is refused above the limit, and a
    function already over it is refused only when its score rises above its
    previous committed score.

  Given the complexity-reduction skill says check-complexity is not registered in
    the default manifest and runs only "where it is registered",
  When a reader follows the skill,
  Then it says check-complexity is registered and refuses commits, as it says of
    check-sql-complexity.

  Given the skill's re-measure step says to confirm the score is at or under the
    limit,
  When a reader reaches that step,
  Then it states what the check accepts: at or under the limit for a new or crossing
    function, and at or under its previous committed score for one already over.
