id: INF-1200f-2
title: "The one pairing that already has this property keeps it, at every point in the brief that holds it today"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the pairing of a kind of file and a specialist for which the figure in
    that specialist's material already resolves to the figure applied to its work,
    from a single declaration,
  When the carrying of standards is generalised to further kinds of file and
    further specialists,
  Then that specialist's material still states the applied figure at every point
    in it at which a figure for that kind of file is stated today, and at no fewer
    points,
  And the point at which that specialist is instructed to stop and ask before
    producing work that would exceed the figure still states the applied figure,
    rather than a fixed figure, a rounded figure, or none,
  And given the declared figure for that kind of file is then changed,
  When that specialist begins work,
  Then every one of those points states the changed figure,
  And given a further kind of file with its own standard is added to that same
    specialist's ownership,
  When it begins work,
  Then the points already stating the original kind of file's figure are
    unchanged, so covering more does not cost the pairing that was already
    covered.
