id: ACS-500f
title: "AC pattern enforcement is mechanically guaranteed, not prompt-only"
component: ac-store
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  The pattern-reuse guarantees that AC-authoring agents are told to rely on
  are enforced by machinery at commit time and by a schema that matches the
  real store — not by agent prompts alone.

  The business-analyst and it-po agent templates instruct agents that the AC
  store mechanically blocks incomplete pattern_bindings, blocks dropping
  implements_pattern during enrichment, and validates every AC against the
  store schema. For those promises to hold, three things must be true of the
  deployed store: (1) the hook that performs binding-completeness and
  field-preservation validation is actually registered and active at commit
  time; (2) the agent's own pattern-detection scan recognizes the same set of
  pattern ACs the hook recognizes, so no hook-enforced pattern is silently
  skipped during the pattern-first inventory; and (3) the published AC store
  schema accepts every valid record that already lives in the store, so the
  documented schema could be enforced without rejecting legitimate ACs.
depends_on: [ACS-500]
