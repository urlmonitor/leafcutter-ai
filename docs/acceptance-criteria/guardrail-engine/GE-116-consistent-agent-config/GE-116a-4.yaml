  contract: "The verification-consistency guard whose allow path (exit 0) this AC exercises when requires_verification is absent (defaulted to not-required)."
it_requirements:
  - "Absent requires_verification must default to not-required (false); a read-only agent that never declares the setting must not be blocked — hook exits 0. This prevents the guard from over-blocking the common case."
