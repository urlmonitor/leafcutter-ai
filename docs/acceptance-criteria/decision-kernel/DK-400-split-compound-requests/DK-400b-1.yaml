id: DK-400b-1
title: "A research request with several needs is offered as a split into research parts"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose root is the research request of mock record
    dcp-reuse-threshold-research: "Find where the kernel reads memory.reuse_threshold, which tests
    cover the reuse offer, and whether an ADR fixes the 0.8 value.",
  And routing's result for it is an ambiguous gap,
  When routing runs on the run's root,
  Then a split is offered with subject kind research_request, found at routing, work-item depth 0
    and trigger ambiguous, keeping the request exactly as submitted,
  And every part offered at the split gate names research as the capability that will run it,
  And the split is answered at the same split gate, with the same four answers, as a split of a
    goal.
depends_on:
  - DK-400b
  - DK-400a-1
