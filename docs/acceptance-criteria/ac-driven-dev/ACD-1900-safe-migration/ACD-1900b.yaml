notes: |
  THE LOAD-BEARING INVARIANT of ADR-026 ("Read-side before write-side"). Every phase agent and
  every gate must resolve its spec from the store with a ticket-body fallback BEFORE the ticket
  is thinned (ACD-1600a) or sign-offs move (ACD-1800). Absence of a new field = legacy mode:
  derive, never fail. Directly guards the phantom-green failure modes the deliberation found
  (ac-fulfillment-gate returning ok when ac_traceability is absent; ac-validator having nothing
  to check; done_proof losing its evidence anchors).
  RELATIONSHIP: transitional-safety twin of ACD-1600b (agents pull spec from store -- the
  store-only END STATE). This L1 is the store-OR-ticket-body compatibility bridge that must ship
  FIRST. Note ADR-026: the migration PLAN, not the AC numbering, is the ordering authority --
  1900b/1600b ship before 1600a even though 1600a is numbered earlier.
  Per CLAUDE.md, gate/workflow ACs decompose to BEHAVIORAL tests (execute the dual-read path),
  never grep-only -- flag for BA/IT-PO.
  Review gap (2026-08-12): added ACD-1900b-5 (fulfillment-gate resolves coverage by dual-read)
  so a thin ticket carrying source_ac is verified rather than silently skipped (GAP 1a).
