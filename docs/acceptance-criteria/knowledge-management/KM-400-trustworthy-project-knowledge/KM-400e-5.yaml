notes: |
  User-authorized Knowledge Retrieval guide stages 0-4. Approval records delegated
  behavioral authoring, not implementation completion. Stage 0 source alignment
  gates mappings and shared contracts. IT PO adds technical constraints and test_spec.

it_requirements:
- Database selection preserves explicit config, otherwise resolves LEAFCUTTER_NEO4J_DATABASE and NEO4J_DATABASE before the neo4j fallback; NEO4J_INSTANCE never selects a database.
- Resolve knowledge credentials from process, named LEAFCUTTER_ENV_FILE, then nearest ancestor .env without mutating environment; conventional NEO4J aliases preserve legacy and custom-name precedence, and writer credentials remain separate.
- Canonical sync uses trusted standalone CLI with merge SHA, isolated previews and replay; telemetry uses
  injected existing owner, sanitized metadata and independent merge-job correlation.
- Follow ADR-062; preserve canonical sources and current kernel contracts. Report unexecuted real-server
  or real-model validation as not run, never passing.
test_required: true
test_spec:
- name: test_km400_e_5_behavior
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Replay repeated/out-of-order/missed merge events through CLI, inspect readiness/lag, exercise
    setup/rebuild/rollback runbook on a supported server and inspect correlated retrieval observations
    for secret absence.
  covers:
  - KM-400e-5
  requires_db: false
- name: test_km400_e_5_public_reachability
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Exercise this AC through its intended standalone CLI/service or existing kernel capability
    caller with real-format inputs; prove the result is observable outside the internal helper and optional
    prerequisites are honestly reported.
  covers:
  - KM-400e-5
test_rationale: Behavioral proof uses the public caller and source-format fixture so internal helper tests
  cannot mask missing wiring. Live server gates remain distinct from deterministic fake-provider tests.
