test_required: true
test_spec:
  - name: test_start_of_step_line_emitted_for_every_nonerror_step
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Running finalize to completion with no step erroring emits one start-of-step line per numbered step (count equals the declared step count), not only for steps that enter an error branch."
  - name: test_start_of_step_line_precedes_step_work
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "For each step, its start-of-step line is emitted before that step's own work is dispatched, not after the step returns."
  - name: test_start_of_step_line_names_step_position_and_intent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Each start-of-step line names the step, states its position as 'Step X of N', and states what the step is about to do."
