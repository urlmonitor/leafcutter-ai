  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Re-derivation must infer-then-validate before write, insert ONLY the missing item (never rewrite the whole checklist/file), and be byte-stable on an already-complete AC (run-twice-and-diff yields no change) -- the standard backfill idempotency contract."
  - "Existing per-deliverable sign-offs MUST be preserved exactly across a partial re-derivation (resume, not clobber)."
  - "Carry-forward of ACD-400b-3 generator idempotency at AC/deliverable grain: reuse the generator's existing idempotency guard in scripts/ac_store/generate_ticket_from_ac.py rather than a parallel one."
  - "Canonical source: scripts/ac_store/generate_ticket_from_ac.py."
delivers_to: null
expects_from:
  ac_id: ACD-1800a-1
  contract: "deliverables[] checklist items whose partial-vs-complete set this re-derivation reconciles idempotently, preserving existing items and their sign-offs."
test_spec:
  - name: test_partial_rederivation_fills_only_missing_item
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Given two of three items exist, re-derivation creates only the missing third."
  - name: test_existing_items_and_signoffs_unchanged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The two pre-existing items and their recorded sign-offs are left unchanged."
  - name: test_no_duplicate_items_created
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Re-derivation produces no duplicate of the two existing items."
  - name: test_rederivation_on_complete_ac_is_byte_stable
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Re-deriving an already-complete AC twice yields a byte-stable file (no change)."
