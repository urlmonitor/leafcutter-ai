origin_agent: BrainCandy
created: 2026-08-14
amended_by:
  - agent: BrainCandy
    date: "2026-08-14"
    reason: |
      Implementation notes and two acknowledged residual limits, recorded so this AC
      is not read as closing more than it does.

      (a) Workflow .js was deployed BYTE-VERBATIM — build_workflow_scripts ->
      _emit_workflow_variant is an identity transform and inject_config was never
      applied — so a {{config.output_root}} token in a .js file would not have
      substituted. Hardcoding `.leafcutter/` was rejected because output_root is
      documented as "Configurable per consumer project". The fix therefore enables
      inject_config for workflow .js. Verified non-destructive: the only `{{` in
      workflows-js are JSDoc annotations ({{ request: string }}, {{skip:boolean...}})
      and _PLACEHOLDER_RE requires [a-zA-Z0-9_.]+ immediately after `{{`, so none match.

      (b) RESIDUAL LIMIT — the static extractor deliberately does NOT extract JS
      template-literal paths of the form `${var}/scripts/...`. Extracting them would
      falsely flag `${baselineTmpPath}/scripts/build.py`, where the variable holds a
      full source clone, reopening the over-wide-prefix false-positive class the
      BP-900g-4 prefix bound exists to prevent. Consequence: injection_builders.py is
      referenced ONLY via a ${worktreePath}/ prefix, so the guard cannot see it. It is
      deployed here, but a future regression of that reference would NOT be caught
      statically. Closing this properly needs real static analysis of the JS, not a
      wider regex. The deployed-tree behavioral test in unit_tests/test_bp_900g_6_paths.py
      resolves the rendered literal text and is the compensating control.

      (c) OUT OF SCOPE, found while surveying: fast-lane-build.js invokes
      injection_builders.py as a CLI (`... assemble_context_bundle`) but that module has
      NO argparse and no __main__ block — verified zero occurrences in the deployed copy.
      The path now resolves, but the invocation is a no-op. That is a functional defect
      needing an entry point, not a path fix, and belongs in its own AC.

      (d) Also out of scope and deliberately untouched: the
      `.agents/agents/<name>/scripts/run.py` family (15 references across 11
      templates/workflows/*.md, vestigial and not a deploy-namespace path), the
      `leafcutter/` vs `leafcutter-ai/` vendoring ambiguity in close-worktree.md and
      changelog.md, and the ${...}/scripts/build.py references in finalize-feature.js
      (scripts/build.py is already in EXTERNAL_DEPENDENCY_ALLOWLIST).
