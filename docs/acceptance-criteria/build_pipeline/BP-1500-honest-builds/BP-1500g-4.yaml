assigned_agent: how-to-author
estimated_complexity: S
it_requirements:
  - "THIS AC IS NOT IMPLEMENTABLE UNTIL BP-1500g-1 AND BP-1500g-2 HAVE LANDED, AND THAT IS A HARD GATE RATHER THAN A PREFERENCE. The first Then clause asks the page to state where the adopter's additions CAN live such that both their addition and the package's capabilities work. Today the honest answer is that there is no such placement in either direction. If the author reaches this AC and the answer is still `nowhere safe`, the correct outcome is to stop and say so -- publishing the least-bad option as guidance would tell adopters to put work somewhere a later build reclaims, which is worse than the current silence."
  - "THE PAGE MUST NOT INVENT THE PLACEMENT. It states whatever BP-1500g-1's implementation decided and records where that decision lives -- if the choice was architectural it should have an ADR, and the page cites it rather than paraphrasing. The AC set constrains the outcome and the discoverability of the answer; it does not contain the answer, and this page must not become the first place someone writes one down."
  - "THE SECOND Then CLAUSE REQUIRES ONE STATEMENT PER WAY OF RUNNING THE BUILD, AND THE WAYS MUST BE ENUMERATED FROM THE BUILD'S OWN INTERFACE RATHER THAN FROM MEMORY. As of origin/main 1cce5b48a the invocations with distinct consequences for adopter content are: the plain no-flag run, the opt-in removal mode, the no-shims variant, and the dry-run/report path. Read the argument parser and confirm the list at authoring time -- a table missing a mode is a page that reassures an adopter about a command they are not running."
  - "THE THIRD Then CLAUSE IS WHAT MAKES THIS MORE THAN A PAGE AND MUST BE A CONCRETE, RUNNABLE CHECK -- a command or short sequence the adopter can execute in their own project, using only what an installed project already has. Not `verify your skill still works`, but something that produces an unambiguous answer. It has to confirm both halves the behavioural ACs distinguish: the content is present and byte-identical, AND it is still discovered by name. An adopter who can run this does not have to trust the guarantee, and it is the only check available in a project whose test suite they do not run."
  - "THE FOURTH Then CLAUSE IS A TESTABLE PROPERTY OF THE PAGE, NOT A SENTIMENT: an adopter following it must not need to read the build's source, ask a maintainer, or recover from a backup. Any step that resolves to `see scripts/build.py` fails it. Where the underlying mechanism is genuinely needed, state the consequence and link the reference rather than sending the reader to code."
  - "THE BOUNDARY WITH BP-1500g-5 IS CITE, NOT REPEAT. That record is the REFERENCE statement of the ownership boundary -- what the build claims, by category. This one is the adopter's TASK -- what to do, in what order, and how to check it worked. Link them. Do not write the boundary twice, and do not let this page grow a category table; if the reader needs the classification, that is the reference page's job."
  - "Placement: check `docs/how-to/` for an existing home before creating a page -- `docs/how-to/creating-a-skill.md` and `docs/how-to/output-layout/adopt-consolidated-output-root.md` are the nearest neighbours and one of them may be the right host. A new page must be registered wherever the project's doc index requires, so it is discoverable rather than merely present."
  - "Must satisfy the project's documentation frontmatter and doc-compliance gates; a page that cannot pass `check-doc-frontmatter` is not deliverable."
test_required: false
test_rationale: |
  test_required IS false BECAUSE THIS AC PRODUCES A PROSE ARTIFACT AND NO
  EXECUTABLE BEHAVIOUR. It is recorded explicitly, rather than left absent, so
  that test-writer skips it for the stated reason instead of the omission
  looking like an oversight the way an empty contract does.

  WHAT VERIFIES IT INSTEAD, AND THE READING TO REFUSE. The page's own third
  Then clause requires a runnable check for the ADOPTER; that check is content
  OF this deliverable, not coverage OF it. Do not satisfy this AC by adding a
  test to the project's suite that runs the documented check -- that would test
  BP-1500g-1's behaviour a second time under this AC's name, and this AC would
  still be unverified. What must be reviewed here is that the page exists, that
  the check it documents actually works when a human runs it in an installed
  project, and that the four Then clauses are each answerable from the page
  alone.

  THE ORDERING GATE IS THE REAL RISK TO THIS AC, NOT ITS COVERAGE. It depends
  on BP-1500g-1 and BP-1500g-2 and cannot be written truthfully before them.
  An author who reaches it early will produce a page describing an intention,
  which reads exactly like a page describing a guarantee.
delivers_to: null
expects_from:
  ac_id: BP-1500g-1
  contract: "The placement decision as implemented -- the location or convention under which adopter-authored additions both survive an ordinary build and remain discoverable -- together with the record of where that decision is documented (an ADR id, if the choice was architectural). Also, from BP-1500g-2, the demonstrated fact that the package's own capabilities still arrive in the same project after the same run; without it the first Then clause cannot be written truthfully, because a placement that survives by suppressing the package's delivery is not a placement this page may recommend. If either is unavailable when this AC is picked up, it is BLOCKED, not implementable with a caveat."
