risk_surface: safety
notes: |
  Observed 2026-10-12..14 on UXP-510. The setup succeeded; the worktree agent's command
  hit its 2-minute window, was moved to the background, and the agent read partial output
  and returned a refusal. Four parallel sibling runs opened fine, so the failure depends on
  timing, not on the criterion. The halt in the second scenario is deliberately not a
  refusal: a refusal is a statement by the setup, and here the setup said nothing the run
  read. Whether the waiting is done by a longer command window or by the run itself
  reading the setup's result is the IT PO's call; the criterion only requires that the
  result acted on is the setup's own finished one.
