notes: |
  A PARTIAL RUN IS ALWAYS UNDER BUDGET, WHICH MAKES IT THE PERFECT FALSE GREEN. If
  the guard cannot tell a short run from a fast one, then the worse the suite's
  health becomes — the more tests fail to collect, the earlier the run aborts — the
  more confidently the guard reports that the suite is comfortably within budget.
  The guard would be most reassuring exactly when things are worst.

  THIS IS NOT A HYPOTHETICAL EDGE CASE IN THIS REPOSITORY. The measured run already
  had 96 collection errors. The partial case is the current normal, so a guard
  built for the complete case and patched later for the partial one would be wrong
  from its first day.

  THE THIRD CLAUSE STOPS THE OBVIOUS CHEAP INFERENCE. Deciding completeness by
  comparing the entry count against an expected total needs an expected total,
  which changes with every test added and is itself the thing being measured. An
  explicit mark, set by the run that knows how it ended, is the only reliable
  form — and it is the same discipline as the examined-count clauses elsewhere in
  this tree: state the fact, do not let a later reader infer it.
