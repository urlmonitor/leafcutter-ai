it_requirements:
  - "THE RECORD IS PRESENT ON EVERY RUN, carrying an explicit total of 0 and an empty file list when nothing was withheld. Absence must never be a reading. This is DELIBERATELY THE OPPOSITE of the human-facing rule in GE-125d-3, which requires that nothing at all is printed on a clean run: a person is shown nothing, a caller is always given an explicit zero. The two are a resolved tension, not a contradiction, and must not be harmonised in either direction — do not suppress the zero record for symmetry with the silence, and do not print a zero line for symmetry with the record."
  - "The record must be readable without parsing English and without consulting the exit status. A caller matching message text is reading prose that is free to be reworded; a caller reading the exit code cannot tell a reduced run from a clean one, because both succeed by construction — the reduction's whole effect is that it produces no findings."
  - "The record must be COMPLETE where the printed notice is abbreviated: every affected file and the full exact total, with nothing truncated, even on the run where GE-125d-3 caps the notice at ten per-file lines plus a remainder. The bound is a display choice for a person and must never become a loss of information for a consumer."
  - "The record must NOT be delivered by printing structured text onto either stream. That would collide with GE-125d-1-i's stream discipline and with GE-125d-3's requirement that nothing at all is written on a clean run. It must be reachable from the check's own result in-process. If a serialised form is added later — a file, an exit artefact, a summary emitted under an explicit flag — it is additional, never a replacement, and it must not fire on the default pre-commit invocation."
  - "Define the record's shape in exactly ONE place and let both the notice (GE-125d-1) and the record read it, so a field can never be present in one and absent from the other. If a shared outcome vocabulary already exists in this component when this is built, express the record in it rather than minting a parallel one; that is an implementation judgement, but minting a second vocabulary when one exists is not."
  - "The record must reuse the same closed reduction-name vocabulary the notice uses (GE-125d-1-ii), term for term. A caller comparing two runs and a person comparing two notices must be comparing the same identifiers."
  - "The record must never carry the matched value, the matched line, or the finding excerpt. Being machine-readable is not a licence to include more: a structured field holding a candidate credential is worse than a printed one, because it is the form most likely to be serialised into a build artefact or a log aggregator and retained."
  - "Exit status is untouched. Attaching the record must not change the check's verdict on any input, and the always-present zero record in particular must not turn a clean run into a non-zero one."
  - "MEASURED ON 2026-08-24: main() in templates/scripts/commit_guardian/check_secrets.py returns a bare int and returns 0 early at the `if not findings` guard, before any output. There is no result object to attach a record to today, so this AC requires introducing one — and the pre-commit entry point must keep returning the same integer exit code it returns now, since the hook framework reads only that."
  - "CLAUDE.md error-handling policy applies. Building the record is pure accounting over the already-scanned findings and must NOT be wrapped in try/except (Rule 4); any I/O added to expose it is wrapped in a typed except that logs at WARNING or higher and never silently swallows."
  - "ADR-001 parity: edit templates/scripts/commit_guardian/check_secrets.py, then run `python scripts/build.py --target-dir .` and verify the deployed copy. check_hook_parity enforces all four locations, and any new module the hook imports must be in the build deploy manifest or the deployed hook raises ModuleNotFoundError at commit time."
