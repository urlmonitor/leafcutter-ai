criteria: |
  Given a requirement with a code deliverable and a tests deliverable that have both
    been produced,
  When the requirement is inspected after the work is done,
  Then the requirement records, for the code deliverable, the concrete artifact that
    delivered it,
  And it records, for the tests deliverable, the concrete artifact that delivered it,
  And each recorded reference points at the canonical source per ACD-1600d,
  And following the recorded reference connects the requirement to its delivering
    artifact, and the artifact back to the requirement it satisfied.
