    relevance: >-
      THE COST DISCIPLINE, INHERITED FROM THE OTHER SIDE OF THE SEAM AND APPLIED ONE LAYER
      UP. GE-127f-1's enrichment requires the new threshold to be computed only for files
      already judged over their permitted length, to read no file and run no subprocess that
      was not already run, and to leave a commit that refuses nothing no measurably slower
      than it is today. The same expectation applies to the handoff: a run in which nothing
      is refused must ask for nobody and must not get slower. Do not restate the arithmetic
      or the comparison — only the cost promise is inherited.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127f.yaml
    relationship: related
    status: exists
    relevance: >-
      WHY THIS IS LOAD-BEARING RATHER THAN A COURTESY. GE-127f's second user decision — "zero
      addition costs nothing" — is what keeps an urgent one-line correction in a very large
      file as cheap as it is today, and its notes call it the property that makes the rule
      survivable. A capability that costs something on every run, refused or not, takes that
      property back at the layer above.
