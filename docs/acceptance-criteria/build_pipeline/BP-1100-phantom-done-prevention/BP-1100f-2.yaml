notes: |
  Guard #3 of BP-1100f. Surface for IT-PO to pin: the test-evidence /
  coverage-sufficiency gate (pr-reviewer's evidence lens or the ac-fulfillment gate).
  Key distinction the check must make: "topology" evidence = dispatch labels/counts a
  test mock controls; "effect" evidence = the artifact actually on disk. Root cause of
  the RCA: BO-2300 tests keyed off dispatch topology, never the on-disk effect, so the
  feature was signed off twice while absent. Portable per ADR-001.
