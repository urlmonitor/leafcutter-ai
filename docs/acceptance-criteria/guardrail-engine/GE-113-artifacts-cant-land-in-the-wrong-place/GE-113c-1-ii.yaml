title: "check-doc-frontmatter resolves the project root correctly and validates staged docs from both a worktree and the main checkout"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the check_doc_frontmatter guard is invoked by git to validate a staged
    ticket .md or docs/*.md file, in BOTH the deployed epic/feature worktree
    layout (where it runs via the .leafcutter symlink whose target resolves to
    the workspace parent) AND the source/main checkout layout,
  When the guard resolves its project root in order to open() and validate the
    staged file's frontmatter,
  Then the resolved project root is the actual checkout root (the worktree root,
    or the repository root in the main checkout) as reported by
    `git rev-parse --show-toplevel`, not the workspace parent reached by
    following the .leafcutter symlink,
  And the guard opens and validates the staged file successfully rather than
    dying at open() on a path built from the wrong root,
  And the frontmatter gate actually runs and reports genuine frontmatter
    violations rather than being bypassed with SKIP=check-doc-frontmatter,
  And the verification exercises the REAL worktree failure path — the guard is
    run from an actual git worktree checkout against a real staged ticket/doc
    file exactly as the ticket tooling / PyYAML writes it, not a synthetic
    in-repo fixture.
