notes: |
  EVIDENCE DISCIPLINE, which is the actual subject of this AC. The 26 figure is labelled
  REPORTED BY A PARALLEL SESSION AND UNVERIFIED everywhere it appears in this tree, and this
  AC is the only thing that can change that label. Until it runs, cite 26 only with the label
  attached; after it runs, cite the measured number instead. Do not let the figure be promoted
  to fact by repetition — that is the same failure as a green check that never ran, applied to
  a number instead of a verdict.

  The zero clause is not defensive filler. If the measured divergence is zero, the honest
  reading is that the reduced validation happens to cover the rules the current store
  exercises — which weakens the urgency argument for GE-119a-3 while leaving its correctness
  untouched, because the divergence is a property of the store on the day it was measured, not
  a property of the check. Say so if it happens; do not re-run until a more alarming number
  appears.

  The repeatability clause is what makes this a harness capability rather than an
  investigation. A number written into a document is stale the next day; a measurement that
  can be re-run answers the question again after the store grows.

  IT-PO (2026-08-14): both modes must run FROM ONE working copy so this measurement is not
  confounded with GE-119b-3's cross-copy comparison. Marked-slow, on-demand; never a
  per-commit gate.
