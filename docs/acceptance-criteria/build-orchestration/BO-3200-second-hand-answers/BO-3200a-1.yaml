notes: |
  2026-09-16 (business-analyst) -- PREMISE NARROWED, READ THIS FIRST. The first scenario's
  premise changed from "dispatching a specialist is impossible" to "no party can be asked to
  judge anything" (only a chartered executor of exact commands is dispatchable). Authorised by
  the user via BO-3200f's chartered-executor decision; the old wording, the reason and the list
  of now-stale technical fields are in amended_by. Where the paragraphs below speak of
  "removing the ability to dispatch", they describe the SUPERSEDED premise; read them as
  "removing the ability to obtain judgement".

  THE FIRST SCENARIO IS THE DISCRIMINATING TEST and it is the reason this AC is testable at
  all. "Reads the fact directly" is a claim about how, which no assertion on the returned value
  can distinguish — a relayed read returns the right value most of the time. Removing the
  ability to dispatch a specialist and requiring the build to still succeed can only be passed
  by a build that no longer relays. It is the same technique as BO-3100c-4's removed dispatch
  option, applied to the other half of the goal.

  THE SIZE IN THE SECOND SCENARIO COMES FROM THE ANCHOR CASE, not from a guess. KI-BO-018: the
  registry file is 129,787 bytes, the relay truncated at exactly 75,000 characters, splitting
  an escape sequence, and parsing raised. A fixture at or above 130 KB reproduces the real
  failing size rather than a synthetic one, per CLAUDE.md "Real-artifact behavioral
  spot-check" — a smaller fixture passes on an implementation that still relays.

  THE THIRD SCENARIO ENCODES THE OBSERVED CONSEQUENCE, which is what makes this a blocker
  rather than an inconvenience: the truncation was caught fail-closed and became the
  substantive claim that an agent lacked a permission it actually had, halting the canonical
  entry path for all new work with no fallback. Asserting the permit outcome, not just the
  parsed value, ties this AC to the damage.

  SCOPE, from the parent L1: this covers facts the build DEPENDS ON — values it branches on. A
  specialist summarising a file as part of forming a judgement is exactly what specialists are
  for and is out of scope.

  BOUNDARY: the other half of KI-BO-018 belongs to BO-3200e — a check that could not perform
  its inspection must not emit a substantive verdict. A direct read can also fail, and must
  then report uncertainty. Fixing only one leaves the other class open.

  IT-PO ENRICHMENT NOTE (2026-08-26). The zero-dispatch test is the one addition worth naming.
  Withholding the dispatch surface proves the value can be obtained without a specialist; it
  does not prove a specialist is not consulted when one IS available. A resolver with a
  dispatch fallback on slow or failing reads would pass the first scenario in the test
  environment and relay in production, which is the worst of both.
