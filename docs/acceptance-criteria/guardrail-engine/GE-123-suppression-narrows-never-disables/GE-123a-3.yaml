notes: |
  THIS IS THE POSITIVE ARM OF GE-123a-1, AND IT IS LOAD-BEARING. GE-123a-1 asks
  that the contents of a sensitively-named file be read; GE-123a-2 asks that
  suppressing the name finding leave the content findings standing. Neither
  criterion is violated by an implementation that simply removes the
  sensitive-filename rule altogether — with no name finding at all, the contents
  are trivially read and there is nothing left for a name-scoped suppression to
  silence. GE-123a's own notes close that door in words ("The name-based result
  itself is still wanted. This L1 does not remove it; it removes its
  exclusivity") and GE-123a-1's notes name this record as the criterion that
  closes it in a test. Without this record the L1 is satisfiable by deletion.

  THE THREE ARMS FAIL INDEPENDENTLY. The first arm is the only place the name
  finding is observable on its own, so it is the one that fails outright if the
  rule is deleted. The second arm catches the subtler form — the rule kept but
  its result discarded once content findings exist, or folded into one of them.
  The third catches deletion by narrowing: a rule left in place but matching only
  the one example filename the other criteria happen to use.

  THE THIRD ARM'S FILENAME SET IS A BASELINE, NOT A LIST INVENTED HERE. Capture
  the set of names the rule recognises BEFORE the fix and assert against that
  captured set, so the arm fails on any narrowing rather than on disagreement
  with a list written into a criterion. Widening the set is not a failure of this
  criterion; narrowing it is.

  RELATIONSHIP TO GE-123a-2. GE-123a-2's second arm asserts that a suppression
  naming the filename rule still suppresses the filename finding. That is about
  the suppression continuing to work. This criterion is about the finding
  existing at all when nothing is suppressed. An implementation can pass
  GE-123a-2's second arm vacuously — nothing suppressed, nothing to report —
  which is precisely why the unsuppressed case is asserted here and not there.

  RELATIONSHIP TO GE-123d (the noise question). Reporting the name finding on a
  file whose contents are innocuous is a deliberate cost accepted here, not an
  oversight. Whether that cost should be reduced is GE-123d's subject; the answer
  must not be to stop reporting it, and it is out of scope for this criterion.

  ENV FILENAMES ARE THE SUBJECT HERE, as in GE-123a-1 and for the same reason
  recorded there. The tree-wide constraint on using them as casual illustrative
  examples elsewhere is unaffected.

  VERIFY THROUGH THE REAL MULTI-FILE ENTRY POINT with real files on disk. Per the
  verification standard carried through this whole tree, coverage of the per-file
  scan in isolation does not discharge any arm of this criterion.
