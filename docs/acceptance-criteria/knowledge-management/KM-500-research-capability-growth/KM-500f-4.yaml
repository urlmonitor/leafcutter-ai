req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500f
criteria: 'Given an agent asks where the work-status field is lost between canonical source and the returned answer

  When research checks whether approved implementation evidence exists for that question and revision

  Then an explanation based on inspected source identifies the attributable stages and supporting locations that
  establish the claimed field transformation

  And declared implementation references are labeled as references rather than proof of a complete function or data-flow
  graph

  And a source-based explanation remains distinguishable from a diagnosis of one particular runtime request

  And a runtime-cause claim requires the matching request or diagnostic evidence in addition to source interpretation

  And if implementation source or its approved inspection route is unavailable, the answer identifies that missing
  evidence and leaves the unobserved transformation unresolved

  And the absence of an indexed code relationship is not treated as proof that the code or dependency does not exist.

  '
