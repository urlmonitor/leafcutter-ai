title: "Whether a retired parent lists its retired children is decided by a person and written down before anything is repaired"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a retired parent that omits a child it has, and an active parent that
    omits two children which are themselves retired and whose replacements the
    parent already lists,
  When the one-off adjudicated pass is run before the convention for retired
    records has been written into the store's reference,
  Then neither record is repaired,
  And each is reported as an abstention stating that the convention for retired
    records is unsettled,
  And once the convention has been written into the reference, a further run
    dispositions both records according to what the reference says, and reports
    the disposition it applied together with the convention it applied it under.
