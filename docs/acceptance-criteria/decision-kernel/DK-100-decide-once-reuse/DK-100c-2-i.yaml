assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - The builder is the single gate that refuses an unapproved decision, and the record model is a
    second, independent gate (approver pattern human or human:<id>).
  - A refusal names the failed condition and is logged; it never raises out of staging.
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_a_host_or_model_approver_is_refused
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_builder.py::TestRefusesWhatAHumanDidNotApprove::test_a_host_or_model_approver_is_refused):
      jev, host and other machine approvers refused'
    covers:
      - DK-100c-2-i
  - name: test_a_missing_approval_time_is_refused
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_builder.py::TestRefusesWhatAHumanDidNotApprove::test_a_missing_approval_time_is_refused):
      no approved_at is refused'
    covers:
      - DK-100c-2-i
  - name: test_the_record_is_valid_by_the_schema_and_carries_the_approval
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_builder.py::TestBuildsFromAHumanApprovedDecision::test_the_record_is_valid_by_the_schema_and_carries_the_approval):
      human:<id> with approved_at is built'
    covers:
      - DK-100c-2-i
  - name: test_a_bare_actor_id_becomes_a_human_actor
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_builder.py::TestHelpers::test_a_bare_actor_id_becomes_a_human_actor):
      the bare actor ''human'' is accepted as an approver'
    covers:
      - DK-100c-2-i
  - name: test_a_non_human_approver_is_refused
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_record_model.py::TestRecordConsistency::test_a_non_human_approver_is_refused):
      the record model refuses a non-human approver'
    covers:
      - DK-100c-2-i
  - name: test_the_refusal_names_the_failed_condition
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'TO WRITE (in tests/kernel/memory/test_builder.py): the NotApproved reason distinguishes
      ''no human approver'' from ''no approved_at time'''
    covers:
      - DK-100c-2-i
