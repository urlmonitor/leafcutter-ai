notes: |
  THE SECOND OF THE TWO SITUATIONS the Product Owner left to decomposition. Its sibling
  BO-3500a-2 is the data-defect case; BO-3500a-1-i forbids substitution in both.

  RELATIONSHIP TO BO-2400f-12, which is done and working, and is NOT being redone.
  That criterion already refuses a resolved set containing a member the roster cannot
  produce, before any work, naming each member. What is added here is one distinction
  it does not make — between a craft that is absent and a name that means nothing —
  and one property it states as a constraint rather than as a criterion: that the
  verdict is computed against the run's own crafts, so the refusal stops firing when a
  craft is added, with no amendment. BO-2400f-12's it_requirements say precisely this
  ("Do NOT presuppose a documentation phase... doc-only members become producible and
  the refusal stops firing with no change to this criterion"). This criterion promotes
  that constraint to something a test asserts, because it is the hinge the whole L0
  turns on and an implementation that hard-codes a refused-craft list would satisfy
  BO-2400f-12's text while making this tree unbuildable in the ordinary sense.

  THE SECOND SCENARIO IS THE LOAD-BEARING ONE. It is the only assertion in this tree
  that fails against a hard-coded list of crafts the run refuses, and hard-coding is
  the obvious implementation. Test it by running the same store twice against runs
  whose available crafts differ, and asserting the outcome changes with nothing else
  changing.

  THE THIRD SCENARIO — the run can say what it can produce — is small and cheap and
  prevents the commonest operator complaint about the current lane, which is that you
  discover the roster by being refused by it. It is distinct from BO-3500d: that is a
  standing view over the whole backlog, this is one run describing itself.
