notes: |
  THE CLOSING AC OF THE TREE. GE-120a says a check that cannot run says so; GE-120b says it can
  run from anywhere; GE-120c proves that by execution; GE-120d says a fresh copy arrives that
  way. This AC is the single assertion that all four held at once, on an artifact nobody
  touched by hand.

  It is also the AC that retires the manual pre-drive workaround for real. GE-120b-5 deletes
  the instruction from the documentation; this one demonstrates the instruction is no longer
  needed. Land this before that, or the documentation change is a claim rather than a record.

  The no-manual-repair clause is stated as an invalidation rather than a caution on purpose. In
  practice the sequence that defeats this AC is: run set-up, notice something missing, fix it
  by reflex, run the sweep, see green. Every step of that is reasonable and the result is
  meaningless. Making the repaired run report INVALID rather than PASS is the only form of the
  rule that survives contact with a person in a hurry.

  IT-PO (2026-08-14): the invalidation must be MECHANICAL — fingerprint the copy the moment
  set-up returns, re-check before the sweep. A rule that depends on the operator not touching
  the copy is the same trust this tree exists to remove. The b-5 ordering constraint is now
  also recorded on GE-120b-5 itself.
