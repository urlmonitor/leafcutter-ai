it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "Fail closed: the run stops."
  - "A cause the check did not establish must not be asserted. When the outcome fits none of the four named cases the report must say the verdict could not be determined and say what was seen -- this is the general rule, and this record is one instance of it."
  - "The report must state what was found where the agent entries were expected, so the operator can tell a wrong file from a structurally changed one."
  - "The outcome must be a recorded report, not an unhandled failure. An unhandled failure also stops the run, so a fail-closed assertion alone cannot distinguish the two -- the report is the only observable difference."
  - "Must satisfy the repository error-handling policy: the guard must catch by type and log at WARNING or higher; it must not be a bare except and must not silently substitute an empty collection, which is precisely how this outcome becomes a false absence verdict."
