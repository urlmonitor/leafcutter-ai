criteria: |
  Authoring happens in its own isolated space -- your live work and a colleague's
  parallel session are never touched.

  When you start writing acceptance criteria, the workflow sets up a private,
  separate workspace for the authoring so the files it produces never mix with
  whatever you currently have open or with another session running at the same time.
