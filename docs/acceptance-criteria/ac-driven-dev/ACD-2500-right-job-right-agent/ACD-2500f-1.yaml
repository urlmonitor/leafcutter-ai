test_intent:
- clause: each of the three profiles declares it produces "requirement_records"
  needs_test: true
  reason: Consumers of the profiles rely on this declared value, and a revert would go unnoticed without
    a check.
- clause: the product-owner and business-analyst profiles each declare one change surface, the requirement
    store (docs/acceptance-criteria/), with a description of the fields that agent writes, instead of
    "none"
  needs_test: true
  reason: The declared change surface is read by the profile consistency check and must name the requirement
    store.
- clause: the test-designer profile keeps its existing change-surface entry unchanged
  needs_test: false
  reason: The test-designer entry is left untouched, and the general profile parity checks already pin
    it.
- clause: each agent card and registry entry shows the same produces value as its profile
  needs_test: true
  reason: The registry and the generated card are derived copies, and drift from the profile is the defect
    class being fixed.
- clause: the it-po profile, already corrected by ACD-2500e-1, is unchanged character for character
  needs_test: false
  reason: No edit is planned to the it-po profile, and its existing tests from ACD-2500e-1 pin it.
- clause: the list of agents declaring "requirement_records" is exactly it-po, product-owner, business-analyst
    and test-designer
  needs_test: true
  reason: The exact set of requirement writers is the outcome of the parent requirement and is cheap to
    assert over the registry.
