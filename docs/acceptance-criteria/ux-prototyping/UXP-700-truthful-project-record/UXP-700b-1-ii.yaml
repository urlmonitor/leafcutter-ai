test_rationale: |
  An implementation that only distinguishes "wholly empty" from "not wholly empty" passes
  UXP-700b-1 in full and still hides the state this project is actually in today - a store with
  fourteen journeys and zero real screens. The mixed store is the case that matters and it
  needs its own fixture.
test_spec:
  - name: test_mixed_store_names_only_the_empty_artifact_types
    target_dir: unit_tests/product_truth/
    description: "With three journeys and no example data or screens, the report names example data and screens and does not name journeys."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_mixed_store_outcome_is_not_the_clean_pass_outcome
    target_dir: unit_tests/product_truth/
    description: "A partially empty store does not report the outcome reserved for a sound checked store."
    type: integration
    angle: criterion
    framework: unittest
notes: |
  This is the case leafcutter's own store is in for screens: 10 of 10 registered mockups belong
  to the example product, so the project's own screen population is zero. See UXP-700d-4, which
  owns the reporting of a type whose entire population is example content; this record owns the
  simpler case of a type whose population is zero.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
