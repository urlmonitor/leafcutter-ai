criteria: |
  Given the store contains ACD-300c-3 and TQ-200a-1, each lacking concrete file targets,
  When the implementation-readiness gate evaluates them,
  Then each is flagged NOT implementation-ready with the reason "missing file targets",
  And neither is dispatched to a coder,
  And each is held back for enrichment.
