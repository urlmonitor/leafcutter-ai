criteria: |
  Given a new example journey added under the example product root after the separation rule
    was built,
  When the project's own record is enumerated,
  Then the new journey is absent from it, and no list of artifact names was edited to make that
    so,
  And the new journey is returned when the example product is asked for by name,
  And the stated count of artifacts set aside as example content is one greater than before the
    journey was added.
