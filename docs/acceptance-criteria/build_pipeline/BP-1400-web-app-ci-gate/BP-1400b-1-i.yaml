notes: |
  Real-regression anchor: the react/no-unescaped-entities class of error is named
  here (per the authoring brief) because it is the concrete incident this gate
  exists to prevent — an unescaped entity that shipped green because no web-app
  style check ran. The deliberately-violating change is transient/scoped to the
  verification so it does not become a standing red; this AC verifies the gate
  blocks, it does not ship a broken web app.
