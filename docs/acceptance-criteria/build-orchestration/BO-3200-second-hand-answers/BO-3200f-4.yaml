  - "EVERY STATEMENT DESCRIBES DELIVERED BEHAVIOUR AND NAMES THE RECORD THAT DELIVERS IT -- result shape and literal execution from BO-3200f-1, the five could-not-check reasons from BO-3200f-1-i, the stated permission and containment from BO-3200f-2. Nothing is written ahead of the behaviour landing."
  - "STATE THE CONTAINMENT, NOT ONLY THE CAPABILITY. 'Its charter admits every exact command' must be accompanied, in the same section, by what still binds it: guardrails and permission prompts apply unchanged, a guardrail block is reported as a guardrail refusal and not as the executor declining, guardrail bypass variables are rejected, and nothing is pre-approved. A page that states the capability alone teaches the executor as a way around guardrails."
  - "STATE THE FIVE REASONS, NOT THREE. The criteria name failed, incomplete and declined as distinct from a non-zero exit; the page also names the guardrail-blocked reason BO-3200f-1-i delivers, quoting each reason's report verbatim."
