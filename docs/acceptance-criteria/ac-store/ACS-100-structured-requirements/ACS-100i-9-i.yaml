title: "A producer name wrapped in literal quote characters is refused as the distinct value it is, not quietly unwrapped"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given 16 records in the store whose declared producer carries literal
    double-quote characters inside the value itself — 10 reading
    `"python-coder"`, 5 reading `"test-failure-triage"` and 1 reading
    `"documentation-expert"` — none of which string-match their unquoted twins,
  When any one of them is checked at either entry point,
  Then it is refused, and the refusal shows the value exactly as it stands and
    names the unquoted form as the value to use instead.

  And given that same record,
  When the check finishes,
  Then the record still carries the value it had — the check reports the
    problem and leaves the correction to an author, so what a reader sees in
    the file is always what a dispatcher would act on.

  And given a record whose declared producer reads `python-coder` with no quote
    characters in the value,
  When it is checked,
  Then it is accepted, and it and one of the 16 are not treated as two
    different producers by anything that groups records by producer.
