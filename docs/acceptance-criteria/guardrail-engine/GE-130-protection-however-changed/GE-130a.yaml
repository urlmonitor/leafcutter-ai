id: GE-130a
title: "A protected file is protected whether it is edited directly or changed by a command"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Same protection, whichever way the file is changed.

  A change that a protection would stop when made with the editing tools is
  stopped the same way when a command makes it, and anything a protection accepts
  as done first (such as having read the folder's guide) counts however it was
  done.
