notes: |
  DOCUMENTATION AC, produced because ACD-1600g declares
  `documentation_triggers: [reference-doc]`. Craft is deliberately LEFT UNSET on
  this pass -- assigned_agent, it_requirements, estimated_complexity and the
  delivery contracts are the IT PO's to fill. The intended craft is the
  documentation surface, not a coder; ACD-1800a-3 is the sibling precedent for
  the shape of this AC.

  WHY THE COMPOSITION RULE MUST BE IN THE DOC, NOT JUST THE CODE. The naive
  union is the single most likely defect in this L1 (ACD-1600g notes; component
  PROJECT_CONTEXT.md repeats it). A rule that lives only in an implementation
  gets re-derived -- wrongly -- by the next author who reads the field name
  `out_of_scope` and assumes exclusions accumulate. The worked counter-example is
  therefore load-bearing content, not illustration: it is the artefact that stops
  the defect recurring after the original implementation is forgotten.

  THE THREE FACTS THE DOC MUST CARRY, each traceable to a sibling L2:
    1. the optional/legacy-mode semantics and the empty-vs-absent distinction
       (ACD-1600g-1, third Then; ACD-1600g-4, fourth Then);
    2. the difference-not-union composition rule with its counter-example
       (ACD-1600g-2);
    3. the review's behaviour when there is no boundary to read (ACD-1600g-4).

  ACCEPTANCE IS COMPREHENSION, NOT PRESENCE. The last Then clause is written as
  a capability of a reader rather than as a list of headings on purpose. A
  documentation AC verified by "the file contains a section named X" is the
  documentation-shaped version of a grep test -- it passes on a heading with
  nothing useful under it.

  SURFACE NOTE: docs/reference/ac-schema.md is the canonical description of the
  AC record and is already the doc_link on ACD-1600g itself, so it is the natural
  home; whether the composition rule also warrants a paragraph in the
  change-scope-reviewer's own reference material is an IT PO decision.

  2026-08-17 (IT PO enrichment). Four decisions.

  - AGENT IS documentation-expert, matching ACD-1800a-3, the sibling precedent
    this AC's own notes name, and the S7b reference-doc mapping. `reference-author`
    exists in config/agent_registry.json and would also be defensible; consistency
    within the ac-driven-dev tree decided it.

  - ONE HOME, NOT TWO. The BA left open whether the composition rule also warrants
    a paragraph in the change-scope-reviewer's reference material. Decision: no.
    The rule is a property of the AC RECORD, and the reviewer is one consumer of
    it; a second copy would be a second normative source with no mechanism keeping
    the two in step, and the recorded failure mode across this repository is
    exactly that -- a rule mirrored into a place nobody updates. The reviewer
    template stays a doc_link, not an edit surface.

  - A FOURTH FACT WAS ADDED to the three the BA enumerated: the mixed-grain
    per-path cancellation rule from ACD-1600g-2-i. Without it the last Then clause
    is unsatisfiable in practice -- exclusions are authored at directory and
    component grain (that is what the existing reviewer matches on), so a reader
    who does not know that cancellation is per-path cannot predict the outcome for
    any realistic three-member bundle.

  - THE ac-schema.md DOC_LINK IS PROMOTED FROM `describes` TO `modifies`. This is
    mechanical, not cosmetic: `_build_files_touched()` in
    scripts/ac_store/generate_ticket_from_ac.py (~line 497) admits doc_links whose
    relationship is in `_EDIT_SURFACE_RELATIONSHIPS` and excludes `describes` and
    `related`. Left as `describes`, the generated ticket would declare an empty
    change surface for a documentation AC whose whole content is an edit to that
    file -- and an empty files_touched is the phantom-done shape recorded in this
    repository's own history.
