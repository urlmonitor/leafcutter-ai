it_requirements: |
  The shared-git-dir resolution is ONE shared helper (single producer) that the
  probe (BO-1700a-1) and the self-healing hook (BO-1700c-1) both consume; it is
  UPSTREAM of the probe (the probe expects_from this). Both the probe and the heal
  MUST use this one resolver so the worktree/main-tree location logic cannot drift.
  ADR-001 gitignored-symlink convention: config lives as a .leafcutter symlink; the
  main checkout is the authoritative source. New script with a
  templates/scripts/commit_guardian/ mirror, verified in parity via the build.py
  round-trip (ADR-001).
delivers_to:
  agent: python-coder
  contract: "Shared-git-dir -> main-checkout resolution (via git rev-parse --git-common-dir, handling both the linked-worktree case and the plain-clone case where common-dir == .git) consumed by the probe (BO-1700a-1) and the self-healing hook (BO-1700c-1)."
