it_requirements:
  - "The census is an on-demand report and must not be registered as a gating check. It must not appear in the blocking hook set, and no commit may be conditioned on its findings - a verdict that arrives as a blocker on unrelated work gets bypassed, and this component has the recorded instance (KI-CG-017)."
  - "The run's own success must be independent of how many instances it found. A large finding is information; treating it as a failed run is the natural instinct and is what makes the measurement unusable as a baseline."
  - "The no-mutation guarantee must be asserted by comparing file contents before and after, not by the census reporting that it changed nothing. A census that quietly patched what it found would make the next run's number meaningless."
  - "The no-mutation guarantee has a subtlety the checks themselves create: several checks under census WRITE when they run. Executing them against a disposable copy is what makes the guarantee achievable, and the assertion must be made against the real registration data and check sources - the inputs the census read - rather than against the disposable copies."
  - "Instances must be individually identifiable in a form that can be worked through later - each with the two working directories and two outcomes GE-126e-1 records - not summarised into a total. A total cannot be prioritised and a list that cannot be prioritised is a list nobody starts."
  - "Recorded members of adjacent defect families that the census re-surfaces are reported like any other instance. They are neither repaired nor suppressed, and no allowlist of known-already findings may be introduced - an allowlist is a second enumeration and would hide a regression the day one of them was supposedly fixed."
  - "Error handling must follow the four rules in CLAUDE.md."
