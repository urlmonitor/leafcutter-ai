test_spec:
  - name: test_tq600a_13_xi_every_path_writes_only_issues_comments_and_statuses
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "every nightly, flag and hold path, through the real REST client against the shared recording fake server, with git operations performed in a scratch repository whose origin is a local bare repository"
    description: >-
      Run every path. The union of write requests RECORDED AT THE SERVER is a subset of
      the allowed list. The scratch repository's branches, tags, index and working tree,
      and the bare origin's refs, compare equal before and after.
  - name: test_tq600a_13_xi_the_client_refuses_a_write_outside_the_list
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/_github_rest.py in-process against the recording fake server"
    must_catch:
      - "the allowlist is checked after the request is sent, so the forbidden write reaches the service"
      - "the allowlist matches by method only, so any POST is allowed"
      - "a comment on an issue that does not carry `nightly-red` is allowed because comments as a class are allowed"
    description: >-
      Ask the client to create a pull request, update a git ref, put repository contents,
      merge a pull request, and comment on an unlabelled issue. Each is refused, and the
      fake server records no request for any of them.
  - name: test_tq600a_13_xi_an_added_fix_step_is_caught
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "the shared workflow-step executor running the flag job of a MUTATED copy of .github/workflows/nightly-suite.yml in the scratch repository, against the fake server"
    must_catch:
      - "a red-night step regenerates the durations file or a baseline and pushes it, so a timing-ratio failure is 'fixed' by moving the baseline"
      - "a red-night step opens a pull request with a proposed fix — not a merge, but an automated fix in review's clothing"
      - "a step edits a tracked file in the runner's checkout and a later step commits it"
    description: >-
      Insert each named step into a copy of the workflow's flag job and execute it on a
      red-night verdict. For each, the bound check from the first descriptor goes red — a
      changed bare-origin ref, a non-allowed write at the server, or a changed working
      tree or branch. The unmutated workflow passes the same check.
test_rationale: |
  The rule is a negative, so the only behavioural form of it is a bounded write set
  observed over every path plus a mutation proving the bound catches an addition. The
  durations-file case is named first because regenerating a baseline is the change most
  likely to be added with good intentions.

  Writes are observed at the server, not at the client, so a step that bypasses the
  client is still seen; git effects are observed on a real repository with a real bare
  origin, so a push is a ref change rather than a mocked call. The mutation runs only
  the nightly's flag job, which is where a "fix it overnight" step would be added and
  which starts no test session. The scratch repository is synthetic for the measured
  cost reason in it_requirements. Total under a second.
