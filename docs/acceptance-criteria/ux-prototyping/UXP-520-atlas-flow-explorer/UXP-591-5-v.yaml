id: UXP-591-5-v
title: "A filter change while 'Flow not found' shows keeps the notice and the address and draws no flow"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a new tab opened /flows/leafcutter/flow-render-pipline?step=resolve, so the tab has one
    history entry and shows the 'Flow not found' notice with no flow drawn, an empty breadcrumb
    and the filters Real, User, All,
  When the person sets the Kind filter to 'Architecture',
  Then the 'Flow not found' notice stays and no flow is drawn, because a filter change never
    picks or swaps a flow,
  And the address bar stays /flows/leafcutter/flow-render-pipline?step=resolve and the tab still
    has one history entry,
  And the flow selector lists only "Product-truth in the leafcutter architecture", the only flow
    under Real, Architecture, All,
  And when the person then picks that flow in the selector, one history entry is added at
    /flows/leafcutter/product-truth-architecture with that flow drawn and a breadcrumb of only
    that flow,
  And Back from there returns /flows/leafcutter/flow-render-pipline?step=resolve with the
    'Flow not found' notice and the Kind filter at 'Architecture'.
depends_on:
  - UXP-591-5
  - UXP-591-5-iii
  - UXP-591-1-ii
  - UXP-521
