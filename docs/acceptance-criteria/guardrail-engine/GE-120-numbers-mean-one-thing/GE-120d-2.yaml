notes: |
  THE L1 IS EXPLICIT THAT THIS STAGE IS THE ONE THAT MAKES THE GUARANTEE REAL: the commit-time
  stage is skippable on purpose by anyone who chooses to bypass the commit checks, so the shared
  build is the only unskippable one. That framing is what makes the required-check clause part
  of the criterion rather than a deployment detail — an optional gate leaves the guarantee
  exactly as strong as the commit-time stage, which is to say voluntary.

  THE OBSERVED PRECEDENT FOR THE FAILURE MODE THIS CLOSES is in this repository already: an
  existing decision-number collision check is written, tested and deployed, but is not registered
  in the commit-time configuration, so it has never run. A guard that exists and is not wired is
  the same as no guard, and is worse because it appears in inventories as coverage.

  A SECOND, SUBTLER TRAP THE IMPLEMENTER MUST AVOID, visible in the existing shared-build
  configuration: the acceptance-criterion guards read their file set from the staged index, and
  in a build checkout the proposed change's files are committed rather than staged — so invoking
  them naively validates nothing and passes. The existing job solves this by moving the branch
  pointer back to the base so the change's files appear staged. Any gate reusing a staged-index
  reader inherits this trap, and a false pass here defeats the entire backstop.

  ON THE INHERITED FAIL-OPEN CONVENTION: this criterion concerns a gate that RAN and found a
  contested number. The cannot-run case is GE-120d-3 and is not weakened by anything here.

  IT PO NOTE (2026-08-17) — the required-check half is the only acceptance clause in this tree
  that cannot be evidenced from inside the repository, and it is also the clause most likely to
  be quietly dropped. The branch's required-check set is a GitHub ruleset; BP-1200c-1 decided
  settings-as-code for it and no such script exists, so in practice it is a manual gh api
  operation. It is recorded as evidence on the ticket, and the ci.yml job name is bound to that
  evidence by a test so a rename cannot silently unbind it.
