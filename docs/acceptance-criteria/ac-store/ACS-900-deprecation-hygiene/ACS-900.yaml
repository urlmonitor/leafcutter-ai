title: "When you retire a requirement, the code it claimed can't quietly stay behind"
component: ac-store
level: L0
status: active
req_status: draft
work_status: todo
criteria: |
  Retire a requirement and trust the work it tracked is truly gone — no orphaned code lingering.

  Today, when a requirement is marked deprecated or superseded, nothing checks
  whether the code that requirement claimed to implement was ever removed. The
  source files quietly stay behind, still in the product, no longer tied to any
  live requirement — and nobody notices until much later. This goal closes that
  gap. The moment a requirement is retired, the system verifies that the source
  it listed as its implementation has been removed or correctly reconciled. If
  live code is still hiding behind a retired requirement, you find out right then,
  with a clear message telling you exactly what to remove. The result is
  traceability you can trust in both directions: a retired requirement guarantees
  retired code, so dead code can never silently outlive the requirement it served.
