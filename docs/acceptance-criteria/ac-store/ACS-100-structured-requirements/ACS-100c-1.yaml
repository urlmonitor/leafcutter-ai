criteria: |
  Given an L0 AC has more than 7 L1 children in its feature folder,
  Or an L1 AC has more than 5 L2 children in its feature folder,
  When the AC validator checks the feature folder,
  Then validation fails with a message identifying the overcrowded parent AC,
  And the message states the current child count and the applicable limit,
  And the message recommends splitting the parent into smaller components.
