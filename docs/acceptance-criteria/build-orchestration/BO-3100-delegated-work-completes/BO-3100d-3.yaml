it_requirements:
  - "AGENT CHOICE IS DELIBERATE: reference-author, the leaf author, not documentation-expert. Writing the page that forbids depending on a spawned result by depending on a spawned result would be its own demonstration of the defect."
  - "THE NEGATIVE CLAUSE MUST BE PRESENT AND EXPLICIT. Saying what is true is not enough: the depth story is already believed, is written into two decision records, and will be re-derived by anyone who reads them. The page must actively contradict it, not merely omit it."
  - "EVERY STATEMENT THE PAGE MAKES ABOUT WHAT A DISPATCHED AGENT CAN AND CANNOT DO IS A BEHAVIOURAL CLAIM under BO-3100d-1 and must carry a claim identifier bound to an executable check. This page must NOT invent a second pairing mechanism."
  - "THE SWEEP IS THE ARBITER FOR THE GUIDANCE. The page must give the author the same discriminating rule BO-3100c-2 applies, so guidance and enforcement cannot diverge, and the third scenario must be covered by actually constructing the arrangement the guidance leads to and running the sweep over it."
  - "THE PAGE MUST NOT BE THE ENFORCEMENT. It is guidance that agrees with an enforced rule. If the only thing standing between an author and the wrong arrangement is this page, the tree has produced another building-epics §2.1-R1 — a correct rule in force that does not fire."
  - "The page must state the constraint without reference to a harness version, a fork mode, or a depth limit, because its value is precisely that it survives changes to all three."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
