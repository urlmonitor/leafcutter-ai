it_requirements:
  - "All four emit sites must change together — a partial repoint splits the corpus across two files"
  - "THIS IS NO LONGER A REPOINT, AND CALLING IT ONE IS THE MISTAKE TO AVOID — IT PO reading of the hardened criterion. The 2026-09-07 revision moved this AC from 'name a different file' to 'carry no destination at all'. A surface that swaps debugging/logs/agent_telemetry.jsonl for any other written-down path satisfies the old wording, fails the new one, and is right only on the machine the edit was authored on. What each surface must instead tell the agent is WHERE TO OBTAIN the sink from the install's own build-generated declaration — a read or an invocation, resolved at emit time. The corresponding change on INF-400c-4's side is already recorded there: the parity check's emitting side can no longer be a path literal, because after this AC there is no literal to extract."
  - "THE FOUR SURFACES ARE PROSE AN LLM FOLLOWS, SO THE INSTRUCTION MUST BE FOLLOWABLE WITHOUT JUDGEMENT. An agent reading 'obtain the sink from the deployed configuration' will improvise a path if the surface does not name the exact artefact and the exact key to read. Improvisation across four surfaces is how a corpus splits without any of them being obviously wrong. Whatever indirection is chosen must be stated identically in all four and must be executable by an agent that has read nothing else."
  - "Changing the signoff knowledge-capture section touches BO-2000a-5 in build-orchestration; that AC must be checked for contradiction before the edit lands"
  - "Must not reintroduce the retired route-learning or capture-learning skill names (ADR-034 decision 3)"
  - "THE SIGNOFF SECTION NAMES THE TELEMETRY SINK TWICE, and only one of the two is an instruction. Line 910 is the append instruction and must be repointed. Lines 959-965 are a scope note that records the producer/reader disagreement as unsettled and hands it to INF-400c-4 — that paragraph must be rewritten to state the settlement, not deleted and not left as-is. A blanket rule of the form 'the string knowledge_captured must never appear near the telemetry sink path' would forbid the honest historical note as well as the stale instruction; the criteria distinguish the two deliberately."
  - "COORDINATE, DO NOT SERIALISE BLINDLY. INF-700b-1 adds the `text` field and INF-400c-5 replaces the hand-written JSON with a validating emission helper — all three ACs edit the same four surfaces. Whichever lands last must re-read the other two's result rather than reapplying a remembered diff."
  - "THE LANDING ORDER, AND WHY THESE TWO DO NOT LAND TOGETHER — IT PO decision, answering the collision with INF-700b-1 which is in implementation now. Order: (1) INF-700b-1 lands first, unblocked, because it is already in flight and it is the change that makes a record useful at all; nothing here should stall it. (2) INF-400c-4 lands in parallel with it — disjoint file set, scripts/ and config/ only. (3) THIS AC lands after both, and must not begin until INF-700b-1's edit is on the branch. (4) INF-400c-5 lands last, because its helper call DELETES the very lines the two prior ACs edit; landing it earlier throws their work away. Do NOT land this AC together with INF-700b-1 as one change: they collide on the same JSON example block in the same four files, a combined revert would take the text field down with the sink repoint, and this AC has its own independent verification (INF-400c-4's parity check over the four surfaces) that a bundled change would not exercise separately."
  - "THE COLLISION IS LINE-LEVEL AND RESOLVABLE, but only if re-read rather than remembered. INF-700b-1 adds a field to the emitted object; this AC changes the append target beside it. Both live in the same fenced example in each of the four surfaces. Re-read each surface at edit time and apply to the text as it then stands. A remembered diff reapplied over an already-edited surface silently drops the other AC's field, and nothing in the four surfaces is under test that would notice."
