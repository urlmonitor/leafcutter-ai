criteria: |
  Given an agent (e.g. business-analyst, ticket-wiring, debug) creates a new AC YAML file,
  When the file is written to the AC store,
  Then the origin_agent field contains the agent's string identifier
    (e.g. "business-analyst", "ticket-wiring", "debug", "human"),
  And the field is a non-empty string (minLength: 1),
  And the value is set exactly once at creation time and never modified afterward.
