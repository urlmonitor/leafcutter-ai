criteria: |
  Given end-of-route clearing (BO-4400a-1, BO-4400a-1-i, BO-4400a-2) is in place,
  When the sequence diagram for end-of-route clearing is read,
  Then it shows, in order, the route pushing its commits, the pull request being
    opened, the route asking the one clearing door to clear its workspace, the door
    obtaining the holds-work / holds-nothing verdict, and the route returning its result,
  And it shows the two outcomes as separate branches: removed, and refused with the
    unsent work named and the workspace kept,
  And it shows the nothing-to-deliver path reaching the same clearing request without
    a push or a pull request,
  And it shows that an epic's workspace is cleared once, after its last ticket.
