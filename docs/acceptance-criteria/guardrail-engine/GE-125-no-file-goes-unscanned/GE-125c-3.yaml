notes: |
  THIS IS THE HAZARD THE PARENT L1 REQUIRES BE NAMED AT L2 RATHER THAN LEFT FOR A
  CODER TO DISCOVER, and it is the reason a per-result rule that is correct in
  principle can still be wrong on real files. The existing per-result path is handed
  a SHORTENED copy of the line — the same shortened copy the check keeps to show the
  author where the value was found — and it judges that. KI-SEC-001 records the
  measurement and the parent L1 carries it forward: the shortened copy stops at the
  120th character, so an explanation sitting past that point is invisible to the
  judgement and the verdict turns on how long the line happens to be.

  THE INVARIANT THIS CRITERION IS ASKING FOR, stated so it can be checked without
  reading the implementation: the judgement is made on the matched value itself
  (and, where surrounding text is needed, on the whole line), never on the copy
  kept for display. Any implementation for which moving the same content further
  along a line changes the verdict fails this criterion whatever it returns for the
  short-line case. That is what the paired first scenario asserts — two files, one
  difference, one verdict.

  THE THREE SCENARIOS FAIL THREE DIFFERENT WRONG IMPLEMENTATIONS, deliberately.
  Scenario one fails an implementation that keeps judging the shortened copy and
  therefore reports a late explanation as a credential. Scenario two fails one that
  reacts to an unreadable tail by staying silent. Scenario three fails one that lets
  an early explanation vouch for the remainder of its line. All three are cheap
  mistakes and none of them is visible from the short-line case alone.

  RELATIONSHIP TO GE-125c-1. That criterion establishes that the unit of the
  decision is one result; this one establishes that the decision is made on the
  whole of that result. Neither implies the other: a per-result rule can be exact
  about scope and still be reading a truncated string.

  FIXTURE PLACEMENT — STATED, NOT INHERITED. Every fixture must be a real file
  created inside a tempfile-backed throwaway project root, with the ticket area
  constructed INSIDE that root (for example `<tmp_root>/tickets/00_inbox/<name>.md`)
  and the check run against that root. No fixture may be created under this
  repository's own `tickets/`, `docs/retrospectives/`, `docs/acceptance-criteria/`
  or `templates/skills/` trees — a fixture under one of those measures the exemption
  rather than the scanner and passes for the wrong reason. The long lines here make
  that trap easier to fall into, not harder: a 200-character line in a real ticket
  file would be exempt for its location and prove nothing about column positions.
  The test module belongs under `unit_tests/commit_guardian/`.

  LINE LENGTHS ARE PART OF THE FIXTURE CONTRACT and must be constructed rather than
  typed: build the padding programmatically and assert the resulting column
  positions in the test before asserting the verdicts, so a fixture that quietly
  drifts back inside the first 120 characters fails loudly instead of passing for
  the wrong reason. The prose padding must not itself be high-entropy.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Per CLAUDE.md, every arm runs
  the real pre-commit secrets check over real staged files and asserts the process
  exit status and the reported findings. A test that asserts which string is passed
  into the per-result judgement is a test of the wiring, not of the verdict, and a
  test that greps for the absence of a shortening step passes on dead code.

  CREDENTIAL-SHAPED FIXTURE STRINGS must be assembled at runtime from concatenated
  fragments rather than written as source literals.
