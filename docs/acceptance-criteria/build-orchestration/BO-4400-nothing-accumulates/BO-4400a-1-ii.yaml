id: BO-4400a-1-ii
title: "An epic's shared workspace is cleared once, after its last ticket is delivered and its pull request has merged, never mid-drive"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given the build of an epic of three tickets that share one workspace, where the first
    ticket's delivery step opens the epic's pull request and the second and third
    tickets' delivery steps push further commits to that same pull request,
  When the first and second tickets have been delivered and the third is still being
    built,
  Then the epic's workspace still exists and the third ticket's build continues in it,
  And when the third ticket's commits have been pushed, the epic's pull request has been
    merged into the main line and the epic run returns, no folder remains at the location
    the epic's workspace occupied,
  And the one shared clearing door was asked to clear that workspace exactly once
    during the whole run.

  Given the same epic run, except that after the third ticket's commits have been pushed
    the epic's pull request is still open and not merged into the main line,
  When the epic run returns its final result,
  Then the epic's workspace still exists, identical to its state after the third ticket's
    commits were pushed,
  And the final result reports the workspace as kept because its work is not yet on the
    main line.
depends_on: [BO-4400a-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-2700-defer-epic-pr/BO-2700.yaml
    relationship: related
    status: exists
    relevance: The epic pull request may be opened late; the clearing point is the end of the epic, not the first push.
  - path: docs/how-to/drive-epic-manually.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: BO-4400a-1
  contract: "The route-end clearing call."
package_surface: false
declared_files:
  - path: templates/workflows-js/build-epic.js
    state: existing
  - path: templates/workflows-js/build-feature.js
    state: existing
it_requirements:
  - >-
    HARNESS PREREQUISITE: the proof runs the real maker through the exec bridge that BO-4400g-4 adds to
    unit_tests/_workflow_engine_harness.py, so it is built after that bridge (through BO-4400a-1's depends_on
    BO-4400g-4).
  - >-
    The epic's clearing step sits at the epic run's end -- after the last ticket's delivery step
    and before build-epic.js / build-feature.js returns -- never inside the per-ticket
    pull-request or commit phase. Opening the epic PR late (BO-2700) or early does not move it.
  - >-
    Over the whole epic run the clearing request is issued exactly once; parallel ticket batches
    inside the epic never issue it.
  - >-
    Clearing uses the route-end step BO-4400a-1 delivers: the one name-based per-work clear-landed command of
    BO-4400g-2 for the epic's own work, sent to shell-runner (ADR-030, ADR-070; user decisions D1 and D2), with
    no discard authorisation. With the epic's pull request still open, that command keeps the workspace as
    not_on_main, and the run relays that answer.
  - >-
    PROOF as BO-4400a-1 (deployed workflow under unit_tests/_workflow_engine_harness.py, maker run
    for real, assertions on the recorded dispatch list and disk; isolation and no-build.py rules).
    The mid-drive observation is taken by the scripted reply of the third ticket's coder step,
    which records whether the workspace folder exists at that moment.
test_required: true
test_intent:
  - clause: 'the epic''s workspace still exists and the third ticket''s build continues in it'
    needs_test: true
    reason: A clear hooked onto the per-ticket pull-request phase removes the workspace mid-drive, which only an observation at the third ticket shows.
  - clause: 'when the third ticket''s commits have been pushed, the epic''s pull request has been merged into the main line and the epic run returns, no folder remains at the location the epic''s workspace occupied'
    needs_test: true
    reason: The epic's one clearing must still happen at the run's end once merged, which the disk afterwards shows.
  - clause: the one shared clearing door was asked to clear that workspace exactly once during the whole run
    needs_test: true
    reason: Parallel ticket batches issuing their own clears would ask more than once, which the recorded dispatches count.
  - clause: 'the epic''s workspace still exists, identical to its state after the third ticket''s commits were pushed'
    needs_test: true
    reason: An epic's pull request is open for the whole drive, so a clear that treats a pushed line as sent would remove the workspace.
  - clause: the final result reports the workspace as kept because its work is not yet on the main line
    needs_test: true
    reason: The kept reason must come from the real one-work answer, not a fixed message.
test_spec:
  - name: test_epic_workspace_exists_while_third_ticket_builds
    proves_clause: 'the epic''s workspace still exists and the third ticket''s build continues in it'
    code_file: templates/workflows-js/build-epic.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "When the third ticket's build step runs, after tickets one and two delivered, the epic workspace folder still exists."
    must_catch:
      - "clear hooked onto the per-ticket pull-request phase"
  - name: test_epic_workspace_absent_after_epic_returns
    proves_clause: 'when the third ticket''s commits have been pushed, the epic''s pull request has been merged into the main line and the epic run returns, no folder remains at the location the epic''s workspace occupied'
    code_file: templates/workflows-js/build-epic.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "After the third ticket's commits are pushed, the epic's pull request is merged on the hub and the run returns, no folder remains at the epic workspace location."
  - name: test_epic_run_asks_the_door_exactly_once
    proves_clause: the one shared clearing door was asked to clear that workspace exactly once during the whole run
    code_file: templates/workflows-js/build-epic.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The recorded dispatch list contains exactly one clearing request for the epic workspace."
  - name: test_epic_open_pull_request_result_reports_kept_not_on_main
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      With the epic's pull request left open, the run's final result carries the maker's real one-work answer, kept
      with reason not_on_main, relayed verbatim and not reported as removed or as a failure.
    proves_clause: the final result reports the workspace as kept because its work is not yet on the main line
    code_file: templates/workflows-js/build-epic.js
  - name: test_epic_workspace_kept_while_epic_pull_request_is_open
    proves_clause: 'the epic''s workspace still exists, identical to its state after the third ticket''s commits were pushed'
    code_file: templates/workflows-js/build-epic.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Same three-ticket deployed epic run, but the epic's pull request is left open on the hub (third ticket's
      commits pushed, nothing merged) when the run returns. The epic workspace is byte-identical to a snapshot
      taken right after the third ticket's push (with_git), the one clearing request was still made, and the
      final result reports the workspace kept with reason not_on_main.
    must_catch:
      - "clear on the pushed but unmerged epic line (the door's pushed-counts-as-sent verdict used instead of the landed rule)"
      - "kept workspace reported as removed or as a failure instead of not yet on the main line"
  - name: test_epic_route_is_reachable_through_the_deployed_build_epic_workflow
    proves_clause: 'when the third ticket''s commits have been pushed, the epic''s pull request has been merged into the main line and the epic run returns, no folder remains at the location the epic''s workspace occupied'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). The three-ticket epic is run through the
      deployed build-epic.js (via build-feature.js's epic path) under run_workflow_under_e2, with the per-ticket
      delivery steps pushing to the one epic pull request; the clearing dispatch is recorded exactly once, after the
      third ticket's push and the merge. The mid-drive observation of the folder needs the live shell stand-in
      or a scripted coder reply that checks the path on disk, and the harness replays only static
      label_responses today, so the observation uses the stand-in's host-side exec bridge (a prerequisite).
    code_file: templates/workflows-js/build-epic.js
  - name: test_epic_clearing_command_is_the_per_work_command_for_the_epics_own_work
    proves_clause: the one shared clearing door was asked to clear that workspace exactly once during the whole run
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      The one recorded clearing dispatch is a shell-runner clear-landed --kind epic --slug <the slug the epic
      workspace was ensured with>, with no --path, never one per ticket; parallel ticket batches issue none.
    code_file: templates/workflows-js/build-feature.js
test_design_authorship:
  step: test-designer
