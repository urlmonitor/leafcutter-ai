id: ACD-2100d-5-iii
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "A resume started the way the skill describes is not stopped by the startup check"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given run R was started exactly as the installed /plan-feature command says and paused at its
    product-owner decision point, with its pause record on disk in the workspace the maker gave
    it,
  When the person's answer "approve" for that decision point is supplied by doing exactly what
    the installed skill's resume section and the resume how-to say, and nothing else,
  Then the resumed run passes every check made before triage with no startup verdict or other
    argument added by hand,
  And it reaches the product-owner decision point, applies the answer, and continues,
  And it works in the same workspace run R was paused in, and no second workspace is made for
    it,
  And the bug symptom (KI-ACD-20261022: a start without a hand-run startup verdict "returned
    status error" with "No workspace-setup permission pre-flight verdict was supplied in args"
    and dispatched no agent) must not occur on the resume.
