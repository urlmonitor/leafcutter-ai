notes: |
  THE EDGE THIS CATCHES IS THE MOST LIKELY WAY c-1 GETS SHIPPED HALF-DONE. The
  cheapest implementation of c-1 is to add a value to config/ac_store_schema.json's
  vocabulary and stop. That change passes schema validation, passes any test that
  authors a judged proof and re-reads the YAML, and produces a store full of judged
  requests that templates/agents/test-writer.md — which has never heard the word —
  answers with a pytest file. The result is worse than the status quo, because the
  store then contains a written, apparently-honoured demand for a kind of proof
  nobody is producing. This L3 makes that specific outcome a detectable failure.

  WHY "DOWNGRADE" IS THE WORD. The failure mode is not a crash. It is a consumer
  doing something reasonable-looking with a word it does not know — picking the
  nearest kind it does know. Silent nearest-match is the mechanism behind the parent
  L1's whole defect (`produces: "prompt"` treated as the nearest thing the consumer
  understands, which is "not production_code, therefore nothing required"), so the
  prohibition is stated explicitly rather than left to be inferred from "reported as
  an error".

  THE SYMMETRIC CLAUSE IS NOT PADDING. Parity can break in either direction, and the
  reverse break is the quieter one: a consumer that has learned a kind the producer
  can never emit will simply never see it and will report nothing at all. Testing
  only the forward direction leaves that half unproven.

  THE LAST CLAUSE PROTECTS c-1's BACKWARD-COMPATIBILITY CLAUSE. An implementation
  that treats "no kind stated" as "unrecognised kind" would fail roughly 2,900
  existing store records. Absent is not unknown.

  BOUNDARY vs c-5. This is authoring-time and hand-over-time parity between two
  vocabularies. c-5 is about a routing decision that cannot be honoured by the
  pipeline as a whole. An implementation can satisfy this L3 (both sides know the
  same words) and still fail c-5 (a well-formed judged request that nothing ever
  runs), and the reverse.
