title: "Registry default_status prevents automatic dispatch on existing tickets"
component: build_pipeline
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given config/agent_registry.json is loaded,
  When the llm-expert entry's selection_criteria is inspected,
  Then default_status is "not_needed"
  And this means existing tickets without an explicit "llm-expert: needed" entry
    in their agents: map will not trigger dispatch of the llm-expert agent
  And new tickets must explicitly opt in by setting "llm-expert: needed" in the
    agents: map for the agent to be dispatched by ticket-supervisor
