it_requirements:
  - "Must output the block decision as JSON to stdout per the PreToolUse hook contract"
  - "Must format the reason string to be parseable by agents receiving the feedback (structured, not prose-only)"
  - "Must include all four required elements in the reason: agent identity, file path, violated rule, authorized agents"
  - "Must write diagnostic information to stderr for debugging, while the structured block JSON goes to stdout"
  - "Error message must be actionable -- the agent should understand what to do differently"
