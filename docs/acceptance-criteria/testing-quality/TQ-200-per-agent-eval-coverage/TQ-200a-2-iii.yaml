criteria: |
  Given an agent whose output is markup — the mockup-author producing a screen,
  When its eval rows are scored,
  Then the produced markup is checked by deterministic assertions:
    it is schema-valid,
    it renders,
    and it binds the named mock records rather than placeholder text,
  And the rendered markup is then scored by a visual judge,
  And a row passes only when the deterministic assertions all hold and the visual
    judge score meets the rubric threshold.
