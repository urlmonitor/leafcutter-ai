priority: medium
roadmap_phase: phase_acbuild_3_migration
criteria: |
  Given a store at a path passed via --ac-store-dir whose ACs are missing the new
    fields,
  When the backfill is run against that store,
  Then the missing fields are added to each record with their default values;
  And when the backfill is run a second time on the now-migrated store, no file
    changes -- the store is byte-identical (idempotent no-op).
