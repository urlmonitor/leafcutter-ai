    from a subprocess or a container) rather than a policy reason; omit the specialist
    participant entirely from the two non-interactive flows rather than showing it
    unused; add the back-link in the same change because check-mermaid-parent-link
    enforces bidirectionality; agree with GE-120d-4. Set test_required false with
    a rationale naming the commit-time gates that already cover the mechanical clauses.
    Added documentation_system component and two doc_links. criteria, title, agent,
    complexity and expects_from unchanged.'
  by: it-po
- action: approved
  agent: approve_acs
  date: '2026-08-17'
superseded_by: null
