  contract: "A per-phase verdict in which a phase that reported success while leaving no sign-off is already adjudicated as failed, so the completion trigger here counts only sign-offs that actually landed"
test_spec:
  - name: test_ticket_with_all_needed_phases_signed_off_is_recorded_done
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive a ticket with four needed phases through the real workflow via the harness, with every phase leaving a sign-off, and assert the run wrote the done lifecycle state into the ticket record."
  - name: test_completion_write_reaches_the_ticket_record_not_only_the_run_report
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Assert the done state is observable by re-reading the ticket record the run produced, not merely present in the value the workflow returned -- the exact gap between the observed run's completed-batches payload and the untouched store."
  - name: test_completion_is_driven_by_recorded_signoffs_not_by_the_run_tally
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Drive a ticket the workflow counts among its completed work but whose record is missing one needed phase's sign-off, and assert no done state is written -- proving the write consumes the record and not the tally."
  - name: test_successful_delivery_phase_alone_does_not_record_done
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Drive a ticket whose commit phase succeeds while a needed review or test phase left no sign-off, and assert the lifecycle state is unchanged."
test_rationale: |
  The defect is an absent write, and an absent write is invisible to every test that
  inspects the value the workflow returned -- that value already said the batches
  completed. Only a test that reads back the ticket record the run produced can tell
  the fixed driver from the broken one, which is why every descriptor asserts on the
  record rather than on the return payload. The third descriptor exists because the
  most attractive wrong fix is to write done from the same in-memory completion tally
  that produced the misleading report; that implementation passes descriptors one and
  two and reproduces the defect the first time a phase fails to record.
