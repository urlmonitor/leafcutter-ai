criteria: |
  Given the server-side main-gating from ADR-018 is implemented,
  When an operator needs to configure or audit the hub protection,
  Then a reference document enumerates the exact required settings: PR required for
    `main`, the three required status checks (ruff, full tests, schema-diff), merge
    queue enabled, force-push and branch deletion blocked, and bypass disabled,
  And it documents the least-privilege machine identity's permission scope (no
    bypass, no direct-push),
  And it states explicitly that the local pre-push/pre-commit main-guard is
    advisory defense-in-depth only and NOT the guarantee.
