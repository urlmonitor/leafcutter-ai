criteria: |
  Given the compatibility window is open (at least one in-flight fat ticket remains),
  When the build runs,
  Then both the old and new AC shapes remain readable and the legacy-derive path is
    NOT removed;
  And when the window has elapsed AND zero in-flight fat tickets remain, removal of the
    legacy path is permitted.
