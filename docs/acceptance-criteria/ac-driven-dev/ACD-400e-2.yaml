test_rationale: "Without the red-baseline test this AC is satisfied by a check that finds no disagreement among three records that were never wrong — which is exactly what a dead check reports. Without the queue-unchanged test it is satisfied by deleting the approval gate. The two together are what make the correction provable and safe, and neither can be inferred from the other."
