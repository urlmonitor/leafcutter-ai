notes: |
  REPORT, NOT REFUSE (user decision 1). Not a warning either: this is a true
  statement about the install the adopter may want to act on, said once
  (AR-400 and BP-1500h both reject per-reader repetition).

  DECISION FLAGGED -- WHAT THE COMPILED PROMPT SAYS. "The specialist simply does
  without" could mean the ability is silently omitted from the prompt, or the
  prompt says it is not installed. This record chooses the latter, because the
  specialist's instructions still say "apply the postgres skill" and an agent
  told to use something absent from its own list, with no explanation, will
  guess. If the user prefers silent omission, the third clause changes -- see
  BA report.
