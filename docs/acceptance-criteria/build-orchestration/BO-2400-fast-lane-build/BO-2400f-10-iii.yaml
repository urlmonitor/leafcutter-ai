id: BO-2400f-10-iii
components:
  - build_orchestration
title: "A declined step leaves nothing claimed: before the claim the store is untouched, after it the claim is released, and a retry is not blocked"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run whose agent declines a step before the claim — the worktree
    location probe, resolve, or producibility,
  When the run ends,
  Then every acceptance criterion in the store carries the work_status it carried before
    the run, none reads in_progress because of this run, and no release step is asked
    for.

  Given a fast-lane run that has claimed its connected set,
  And the agent asked to perform a later step declines it — context bundle, test-writer,
    coder, review, changelog, commit, push or pull request — including a step whose
    decline returns no readable result at all,
  When the run ends,
  Then the decline is handled as a halt after the claim, and every acceptance criterion
    the run claimed and did not carry through to done reads todo in the store the run
    claimed in (BO-2400f-10-i),
  And the release is asked of the command-step-runner (BO-2400f-5-i, BO-2400a-1-i),
    whose registry entry declares permits_shell true,
  And this holds for a step added to the lane after this record was written, as well as
    for the steps listed above.

  Given a run of five claimed acceptance criteria whose context-bundle step was declined,
  When the operator starts a new run for the same acceptance criterion from an unchanged
    store,
  Then the new run is not refused or narrowed on the ground that those five are already
    claimed (BO-2400f-8), because none of them is still in_progress from the first run.
depends_on: [BO-2400f-10, BO-2400f-10-i, BO-2400f-5-iii, BO-2400f-5-i]
