criteria: |
  Write-access rules deploy automatically when leafcutter installs.

  When a project runs build.py to install leafcutter, the AC governance rules
  are included in the generated CLAUDE.md (or equivalent agent instruction
  surface) so that every agent in the target project inherits the same
  write-access boundaries. No manual configuration is required — governance
  is part of the package, not an afterthought.
