criteria: |
  Given knowledge is disabled and Neo4j, embedding and telemetry SDKs and credentials are absent
  When Leafcutter starts and the standalone retrieval interface is invoked
  Then normal startup succeeds and retrieval returns disabled
  And no network connection is attempted
  When Neo4j is explicitly enabled with incomplete configuration
  Then a clear configuration error names the missing setting without revealing secrets
