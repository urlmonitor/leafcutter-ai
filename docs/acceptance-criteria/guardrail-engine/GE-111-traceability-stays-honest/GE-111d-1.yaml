notes: |
  Reconciliation route 1 (UPDATE the link). ACS-400b-2 already permits
  implementation agents to write implemented_by, so the update route does not
  collide with field-write governance. GE-111b-3 can supply the suggested new
  location when jcodemunch found the symbol moved rather than vanished, making
  this a guided one-step edit.

  IT-PO enrichment (2026-06-22): confirmed the update route adds no new write
  mechanism — correctness is "re-run the same pipeline on the re-staged AC".
  Contrast with the CONFIRM route (GE-111d-2), which DOES need a new durable
  record because the code legitimately does not move.
