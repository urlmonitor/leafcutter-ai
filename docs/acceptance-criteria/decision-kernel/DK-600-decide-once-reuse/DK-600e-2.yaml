estimated_complexity: S
it_requirements:
  - 'Precedent is evidence, never authority (ADR-060): no score, however high, resolves a decision,
    changes routing or changes a threshold.'
  - Thresholds, caps and limits are read from the kernel configuration by key (config/kernel_config.default.json);
    no number quoted in the criteria is hard-coded, and a test that pins a default also shows the
    behaviour follows an overridden value.
  - One literal applies-or-not question per candidate; it rides the assessment batch when one is coming
    and costs one call otherwise; a budget that cannot pay for it skips the precedent with a limitation
    instead of blocking.
  - Precedent evidence cites the record path and its approver and date in its source; it carries no
    actor, so it is never mistaken for a human answer.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
