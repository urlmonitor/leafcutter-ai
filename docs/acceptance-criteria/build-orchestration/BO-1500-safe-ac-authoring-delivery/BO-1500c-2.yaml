created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500c.yaml
criteria: |
  Given the authoring pull request has been opened against main,
  When the project's required status checks run on that pull request,
  Then the same gates that run on any other PR to main run on this one
    (the lint gate and the AC schema-diff/validation gate),
  And the pull request cannot be merged until those required checks pass,
  And no path exists by which the approved AC files reach main while bypassing
    those checks.
depends_on:
- BO-1500c
- BO-1500c-1
doc_links:
- path: templates/skills/build-single-ticket/SKILL.md
  relationship: models
  status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Delivery must rely on main's existing branch-protection required checks (ruff lint + AC schema/diff
  validation); do not add any bypass path.
- The authoring PR is an ordinary protected-main PR -- no privileged merge, no direct push to main.
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
test_spec:
- name: test_lint_and_ac_schema_gates_trigger_on_a_pull_request_from_an_authoring_branch
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  description: Parsing .github/workflows/ci.yml and schema_diff.yml, the lint job and the AC schema/diff
    job both run on the pull_request event with no head-branch filter that would exclude an ac-authoring/*
    branch.
- name: test_delivery_never_pushes_to_main
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: With a recording git shim on PATH, a full approved delivery run issues no push whose refspec
    targets main and no push that is not to the authoring branch.
- name: test_delivery_uses_no_privileged_merge_or_check_bypass
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: With a recording gh shim on PATH, the delivery step invokes no `gh pr merge`, no `--admin`,
    and no force-push, so the only route to main is the reviewed PR merge that the required checks gate.
delivers_to: null
expects_from:
  ac_id: BO-1500c-1
  contract: An opened PR to main whose required checks this AC requires to pass
