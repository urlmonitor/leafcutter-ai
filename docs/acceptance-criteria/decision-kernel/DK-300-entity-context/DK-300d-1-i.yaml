id: DK-300d-1-i
title: "Unknown references do not create automatic clarification pauses"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given the request is "Implement a new FooWidget" and FooWidget has no indexed definition,
  Or a request contains ordinary prose with no known repository entity,
  When the initial pass completes and intent is assessed,
  Then the new-name request may retain change intent without an enrichment-owned human question,
  And the completed entity-free scan reports no_matches with zero repository-body retrieval,
  And only unresolved intent or a necessary user choice may require clarification after intent,
  And disabled recognition reports disabled without claiming repository examination.
depends_on: [DK-300d-1]
