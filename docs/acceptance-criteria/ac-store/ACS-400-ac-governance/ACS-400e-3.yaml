it_requirements:
  - "Must follow the fail-open convention per docs/reference/claude-code-hooks.md"
  - "Must only reference AC YAML files in the error message -- never mention non-AC files that are part of the same commit"
  - "Must provide guidance in the error message about how to resolve the block (e.g. unstage the AC file)"
  - "Must not inspect or validate non-AC files in any way -- the hook's scope is strictly docs/acceptance-criteria/**/*.yaml"
