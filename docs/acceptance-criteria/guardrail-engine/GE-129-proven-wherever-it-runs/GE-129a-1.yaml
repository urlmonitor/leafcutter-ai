id: GE-129a-1
title: "What is examined is a place a guard is invoked from, not a script — the same guard wired at two tool-call events is two things to prove, and a guard the settings surface does not name is not this run's business"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the surface that wires guards to the editor's own tool calls holds, for each
    kind of tool call, one or more groups selected by which tools they apply to, and
    each group holds entries that each name a guard to run,
  And no entry on that surface carries an identifier of its own,
  When the liveness run takes its subjects from that surface as it stands at the time
    of the run,
  Then each subject it reports is one entry, and it is reported together with the kind
    of tool call that reaches it, the tools that group applies to, and the guard that
    entry resolves to,
  And two entries naming the same guard under two different kinds of tool call are two
    subjects and are reported separately, each with its own state, because what one of
    them was seen to do says nothing about the other,
  And given one further entry naming a guard already wired elsewhere on that surface is
    added under a different kind of tool call, and nothing else changes,
  When the run repeats,
  Then that new entry is among the run's subjects in addition to the entry that was
    already there, and every subject reported before the addition is still reported and
    still carries the state its own examination produced,
  And given one existing entry is then moved into a group applying to different tools,
  When the run repeats again,
  Then it is reported under the tools its group now applies to and under no other, and
    the run does not report a subject at the position that entry has left,
  And a guard that sits in the hook directory but that no entry on that surface names is
    not among the run's subjects and is named in nothing the run reports, while in that
    same run the entries the surface does name are each reported with a state, so that
    silence is the silence of a boundary rather than the silence of a run that examined
    nothing.
depends_on:
