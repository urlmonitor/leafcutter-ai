criteria: |
  Given the store holds requirements whose test design was written by the technical planner
    before this change (1,357 records on 2026-09-25, 941 of them approved),
  When the change to test intent ships,
  Then every such record keeps its existing test design unchanged,
  And none is reclassified as test intent, reset to "reviewed" or flagged "test design pending",
  And each is still classified implementation-ready when it was before the change,
  And each is distinguishable from a design produced by the code-aware step, because it
    carries no code-aware authorship mark (ACD-2400c-3),
  And a user can send any single one of them through the code-aware step on request,
    after which it carries the new design and the authorship mark.
