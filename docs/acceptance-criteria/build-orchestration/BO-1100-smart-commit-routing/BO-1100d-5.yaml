id: BO-1100d-5
title: "Observation store write failure does not crash the commit workflow"
component: build-orchestration
level: L2
status: active
readiness: reviewed
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the shape-tracking observation store is on a read-only filesystem
    (or disk is full, or the store directory does not exist),
  And a commit is in progress with staged files that do not match any routing pattern,
  When the learner attempts to record the unmatched shape to the observation store,
  Then the write fails,
  And the learner logs a warning describing the write failure and the affected path,
  And the learner does NOT propagate the filesystem error to the calling commit workflow,
  And the commit workflow continues to produce a commit message for this commit,
  And no observation data is lost silently (the warning makes the failure visible).

  Given the observation store is writable,
  And the learner has successfully recorded the shape,
  And the learner then attempts to evaluate whether a rule proposal is warranted,
  And the rule-proposal evaluation itself triggers a filesystem error
    (e.g. reading occurrence counts from a corrupted store),
  When the error occurs during proposal evaluation,
  Then the learner logs a warning describing the read failure,
  And the learner does NOT propagate the error to the commit workflow,
  And the commit proceeds without a rule proposal for this invocation.
depends_on: [BO-1100d, BO-1100d-1]
