it_requirements:
  - "THE OVERLAP WITH BP-1500b-5 IS A DECIDED QUESTION, NOT AN OPEN ONE, AND THE RULE IS CITE RATHER THAN REPEAT. Both records stand; they were kept separate because they answer different questions about the same tree and become true at different times -- BP-1500b-5 describes a sweep that does not exist and is gated behind building it, while the boundary this AC describes is a property of the build as it stands today and is what an adopter needs in order to place their own work at all. WHICHEVER LANDS SECOND CITES THE FIRST. Before writing a line, check whether BP-1500b-5's page exists: if it does, this content extends it by reference and does not restate the sweep's rules; if it does not, write this one so BP-1500b-5 can later attach to it. One page implementing both is a legitimate outcome, but each AC's clauses must remain separately answerable in it -- two pages saying the same thing is not."
  - "THE THIRD Then CLAUSE AND BP-1500b-5's FOURTH ARE THE SAME INSTRUCTION POINTED AT EACH OTHER, AND THE SEPARATION MUST BE WRITTEN ONCE IN ONE PLACE. Naming the two questions apart -- what the BUILD claims and rewrites at all, versus what a SWEEP may remove because the package no longer produces it -- is a single passage owned by whichever page lands first. The second page links to it. A reader who takes a statement about one as an answer about the other is the failure both clauses exist to prevent, and writing the disambiguation twice, in slightly different words, is how that failure gets created rather than prevented."
  - "BY CATEGORY, NOT BY FILENAME, IS THE CONSTRAINT THAT MAKES THIS DURABLE. A filename list is a snapshot that is wrong after the next release -- and the growth of the claimed set between versions is the third unsafe direction BP-1500g-3 exists for. Categories must be stated so a reader can classify an item the page never mentions."
  - "THE LAST Then CLAUSE IS THE FALSIFIABLE ONE AND IS THE ACCEPTANCE TEST FOR THE WHOLE PAGE. Given any one thing in the installed tree, a reader who has never seen the implementation can say from the documentation alone whether an ordinary build would leave it alone. This is checkable by handing a reviewer items they have not seen -- including ones nobody thought about when the page was written -- and a page that lists categories without letting a reader classify a novel item fails it. Write the categories as decision rules, not as inventories."
  - "THE CATEGORIES MUST PARTITION THE TREE AS THE IMPLEMENTATION ACTUALLY PARTITIONS IT, WHICH IS WHY THIS DEPENDS ON THREE BEHAVIOURAL ACs AND NOT ONE. The distinctions the build genuinely draws after BP-1500g-1, BP-1500g-2 and BP-1500g-3 land -- content the build produces and rewrites, content it produces and removes when retired, content it never touches, and content it cannot attribute either way -- are the categories. Do not invent a taxonomy that reads well and does not match the predicate; a reader classifying by the page must reach the same answer the build reaches."
  - "ONE STATEMENT PER CATEGORY PER WAY OF RUNNING THE BUILD, WITH THE INVOCATIONS ENUMERATED FROM THE BUILD'S OWN INTERFACE AT AUTHORING TIME RATHER THAN FROM MEMORY. As of origin/main 1cce5b48a the invocations with distinct consequences for adopter content are the plain no-flag run, the opt-in removal mode, the no-shims variant and the dry-run/report path. A grid missing a mode reassures a reader about a command they are not running -- and the plain no-flag run is the destructive one today, which is the opposite of what a reader will assume, so the grid must make that visible rather than leaving it to be inferred."
  - "IF IMPLEMENTING BP-1500g-1 REQUIRED A NEW OWNERSHIP CONVENTION, CITE ITS RECORD RATHER THAN PARAPHRASING IT. An ADR paraphrased into a reference page becomes a second source that drifts. `docs/architecture/adrs/ADR-001-self-hosting-boundary.md` is the convention that produces the mixed tree and is cited, not restated; anything new should be treated the same way."
  - "Placement: assess `docs/build-pipeline.md`, the component's existing detail reference, as the host before creating a page. Check its neighbours for overlap. A new page must be registered wherever the project's doc index requires it, and must satisfy the documentation frontmatter and doc-compliance gates."
test_required: false
test_rationale: |
  test_required IS false BECAUSE THIS AC PRODUCES A PROSE ARTIFACT AND NO
  EXECUTABLE BEHAVIOUR. Recorded explicitly rather than left absent so that
  test-writer skips for the stated reason instead of the omission reading as
  an oversight.

  WHAT VERIFIES IT INSTEAD IS AN UNSEEN-ITEM REVIEW, AND IT IS CHEAP ENOUGH TO
  BE MANDATORY. The last Then clause is deliberately falsifiable: hand a
  reviewer who has not read the implementation a handful of items from a real
  installed tree -- chosen to include at least one nobody had in mind when the
  page was written -- and ask them to predict, from the page alone, whether an
  ordinary build would leave each alone. Compare their answers to what the
  build actually does. A page that lists categories without letting a reader
  classify a novel item fails, and this is the only check that distinguishes
  a real taxonomy from a well-written inventory.

  A SECOND REVIEW STEP THIS AC OWES ITS NEIGHBOUR. Confirm that the passage
  separating this question from the residue question exists exactly ONCE
  across this page and BP-1500b-5's, and that the other page cites it. The
  duplication risk here is real and was flagged by the BA rather than avoided
  by dropping the record; leaving it unchecked at review is how the flag
  becomes the defect.

  DO NOT SATISFY THIS AC BY ADDING A SUITE TEST. Any executable check that
  could be written here would be a test of BP-1500g-1's or BP-1500g-3's
  behaviour under this AC's name, and this AC would remain unverified.
delivers_to: null
expects_from:
  ac_id: BP-1500g-3
  contract: "The categories the implementation actually partitions the installed tree into, as they stand once BP-1500g-1, BP-1500g-2 and BP-1500g-3 have landed -- content the build produces and rewrites, content it produces and removes when retired, content it never touches, and content it cannot attribute either way -- together with the reconciliation predicate that assigns any given path to one of them. The page's last Then clause requires a reader to reach the same verdict from the documentation that the build reaches from the predicate, so the predicate's partition is the input, not a taxonomy invented at writing time. Also required, from the store rather than from code: whether BP-1500b-5's reference page has landed, since that determines which of the two records owns the passage separating this question from the residue question."
