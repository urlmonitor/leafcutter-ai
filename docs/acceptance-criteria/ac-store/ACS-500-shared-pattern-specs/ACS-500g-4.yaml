title: "Recurrence noticed while authoring is promoted in that same authoring run"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an author is writing a new AC for "every write records who changed the row
    and when",
  And the pattern-first check for that behavior returns no match because no pattern
    for it exists,
  And two ACs already in the store specify that same behavior standalone,
  And the shared rules set the recurrence threshold at 3 occurrences,
  When the AC being written becomes the third occurrence,
  Then a pattern for the behavior is produced during that same authoring run,
    before the new AC is written,
  And the new AC is written referencing that pattern with a binding for every slot
    it declares, instead of a standalone body restating the behavior,
  And the two earlier ACs are reported as convertible, naming their ids, and are
    left unchanged until that conversion is approved,
  And the authoring run does not end with the behavior specified standalone in
    three places.
depends_on: [ACS-500g, ACS-500g-2, ACS-500g-3]
