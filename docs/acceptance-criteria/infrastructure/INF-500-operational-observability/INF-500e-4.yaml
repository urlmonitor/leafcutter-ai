notes: |
  The code / spec / prose split is what makes the velocity tier readable rather
  than merely large. Without it a week of 20,000 added lines is a single number;
  with it, the same week resolves into capability, specification and
  documentation, and a falling production-code figure against a rising pull
  request count reads as the work moving from building to bookkeeping.

  Two of the scenarios above are the ones that decide whether the split is
  trustworthy at the margins. A file named by convention rather than by suffix
  would otherwise vanish into the unclassified bucket, and a dotfile would
  otherwise have its whole name read as an extension. Both misattributions are
  small in volume and permanent in effect, because nobody audits the "other" row.

  The production-versus-test separation is stated here rather than with the
  velocity metrics because it is the same attribution pass: the distinction only
  means anything if a deeply nested test directory is recognised as readily as a
  top-level one.
