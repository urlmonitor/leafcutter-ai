id: BO-300d-1
title: "The closing report states the number of pieces it did not build, and that number matches the pieces it names"
component: build-orchestration
components:
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run over a body of work of thirty-seven pieces of which it built
    seventeen,
  When the run produces its closing report,
  Then the report states, as a number the run itself arrives at, that twenty pieces
    were not built,
    And it names each of those twenty,
    And the count it states equals the number of pieces it names,
    And the operator does not have to compare the run's plan against the body of
      work to obtain that number.

  Given a run over a body of work of thirty-seven pieces of which it built none,
  When the run produces its closing report,
  Then the report states that thirty-seven pieces were not built and names them,
  So a run that built nothing is reported as a shortfall of everything, not as a
    run with nothing to say.

  Given a run in which one piece was removed from the body of work and one added
    after the plan was fixed, so that the number of pieces is the same at the end as
    at the start,
  When the run produces its closing report,
  Then the pieces it reports as unbuilt are determined by identity and not by count,
    And the removed piece is not named as unbuilt,
  So an unchanged total can never be read as nothing having changed.
depends_on:
  - BO-300d
