id: INF-500d-4-ii
components:
  - infrastructure
  - feedback_collector
readiness: approved
priority: medium
title: "Every successful feedback submission names the absolute file it was appended to, so a split sink is visible at the call site"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given an agent or hook submits a report through submit_feedback.py, with or
    without a --jsonl override, and whether that override is absolute or
    relative to the caller's working directory,
  When the record is appended successfully,
  Then the script writes exactly one line to stderr of the form
    "[submit_feedback] sink: <path>", where <path> is the resolved absolute
    path of the file the record was appended to,
  And that file contains the appended record carrying the printed feedback id,
  And stdout is unchanged: exactly one line, the feedback id
    (fb_YYYY-MM-DD_xxxxxxxx), with nothing else on it,
  And the sidecar id-recovery line ("sidecar:<path>/feedback_id_<epoch>.txt")
    is still written to stderr unchanged, still the only stderr match for the
    recovery pattern 'sidecar:[^ ]*feedback_id_[0-9]*.txt', and still names a
    file holding the printed id,
  And the bug symptom ("records land in 18 different feedback.jsonl files and
    nothing at the call site says which one a submission went to, so the
    fragmentation stayed invisible for four months") must not occur.
depends_on:
