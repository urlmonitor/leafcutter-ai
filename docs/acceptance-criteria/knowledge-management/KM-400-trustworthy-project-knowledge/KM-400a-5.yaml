criteria: |
  Given alpha and beta contain matching IDs and two retained generations exist for alpha
  When a request uses a foreign seed, foreign continuation, or relationship leading outside alpha's pinned generation
  Then no evidence from beta or the other alpha generation is returned
  And the invalid scope is reported explicitly
  And the same isolation applies to graph, semantic and hybrid operations
