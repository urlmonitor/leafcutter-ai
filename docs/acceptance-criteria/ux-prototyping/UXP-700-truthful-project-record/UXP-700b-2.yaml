id: UXP-700b-2
title: "Every check states how many records it read, and the figure moves with the record"
component: ux-prototyping
components:
  - ux_prototyping
  - precommit_hooks
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project record holding a known number of artifacts of each type,
  When the record's checker runs,
  Then its report states, for each check it performed, how many records that check read,
  And adding one further artifact of a type a check reads raises that check's stated figure by
    exactly one on the next run,
  And removing one lowers that check's stated figure by exactly one on the next run,
  And no stated figure is carried over from an earlier run.
depends_on:
  - UXP-700b
  - UXP-700b-1
