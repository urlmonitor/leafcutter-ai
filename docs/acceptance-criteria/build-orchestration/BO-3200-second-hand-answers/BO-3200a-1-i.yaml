risk_surface: contract_boundary
it_requirements:
  - "USE THE REPOSITORY'S EXISTING ROOT-RESOLUTION HELPER (scripts/path_resolver.py) RATHER THAN A NEW UPWARD WALK. A second resolution strategy is a second place for the layouts to disagree, and the disagreement is invisible in the layout the author happens to develop in."
  - "RESOLUTION MUST NOT SEARCH UNTIL SOMETHING PLAUSIBLE IS FOUND. A value read from the wrong copy is the same defect as a truncated one, and it fails on a consumer install while succeeding for the author — the deployed-layout trap CLAUDE.md records. The resolver must identify the ONE authoritative source or report not-found."
  - "NOT-FOUND MUST NAME THE LOCATIONS LOOKED IN and must not report a value. It is BO-3200e's `undetermined`, not a substantive claim about the fact. 'Could not locate the source' and 'the source says no' send a reader to entirely different places."
  - "THE TEST ENVIRONMENT MUST NOT CONTAIN A DEPLOYED COPY IN THE PARENT. That copy is exactly what made the original relay appear to work; a test run from a parent that happens to hold one reproduces the incidental success and proves nothing."
  - "Must behave identically for the three layouts this package ships into: the source repository, a git worktree of it, and a consumer install where the package sits in a subdirectory. All three must be exercised."
delivers_to: null
expects_from:
  - ac_id: BO-3200a-1
    contract: "The direct source-read resolver {value, outcome, source_path, looked_in}. This AC constrains how source_path is resolved (via the existing root-resolution helper, never an upward walk from cwd) and requires `looked_in` to be populated and reported on the not-found outcome."
test_spec:
  - name: test_bo_3200a_1_i_same_value_from_three_starting_locations
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: criterion
    description: "Resolve the fact with cwd set to (a) the repository, (b) a non-repository parent directory, (c) an unrelated directory, and assert all three return the identical correct value."
  - name: test_bo_3200a_1_i_parent_holds_no_deployed_copy_during_the_test
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Assert the parent directory used by the previous test contains no deployed copy of the source. Without this the whole suite reproduces the incidental success that made the original defect invisible."
  - name: test_bo_3200a_1_i_unlocatable_source_reports_where_it_looked
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: failure
    description: "From a location where the source genuinely cannot be located, assert the outcome is not-found (BO-3200e's undetermined), that `looked_in` names the searched locations, and that no value is returned."
  - name: test_bo_3200a_1_i_resolves_identically_in_a_worktree_and_a_consumer_layout
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: deployed
    description: "Exercise a git-worktree layout and a consumer-install layout (package in a subdirectory) and assert both resolve to the same authoritative source. The deployed layout is where this defect actually bites."
test_rationale: |
  The original defect was an INCIDENTAL success: the read worked only because that particular
  parent happened to hold a populated deployed copy. Any test run in the developer's layout
  reproduces that accident and reports green on a resolver that would fail on a consumer
  install. So the second test asserts the accident is absent, and the fourth exercises the
  layouts where it bites — a worktree and a consumer install.
  The not-found test is the honesty half: making the read location-independent by searching
  until something plausible turns up would pass the first test and silently read the wrong copy,
  which is the same class of defect as a truncated read.
