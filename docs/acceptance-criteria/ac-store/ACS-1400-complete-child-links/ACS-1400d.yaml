notes: |
  RULED 2026-09-08 BY BrainCandy: THE FIELD SPLIT GETS ITS OWN L0. This L1 is
  therefore a placeholder awaiting supersession, not work to be decomposed in place.
  A product owner authors the replacement L0 as a follow-up; when it lands, this
  record's superseded_by must name it and its children stay empty permanently. Do
  NOT decompose this L1 — children authored here would have to be moved or discarded
  within the week.

  The ruling matches the reasoning that produced the deferral. This is the most
  expensive item in the tree (every reader of the coverage field is affected) and
  ACS-1300a-3 had already placed it out of scope twice. A capability that two trees
  have now declined to own does not become smaller by being attached to a third; it
  needs a home of its own, which is exactly what it never had.

  DECOMPOSITION DELIBERATELY DEFERRED (BA, 2026-09-08), the state that preceded the
  ruling, kept because it explains why this record exists at all: this L1 had no
  children on purpose, pending the scope decision above. Its emptiness was a held
  decision, not an oversight. ACS-1400a, b and c were decomposed in the same pass;
  ACS-1400c-2 carries the consequence, requiring the reconciliation pass to abstain
  out loud on the population this L1 owns and to name this record as what must be
  settled first — that consequence SURVIVES the ruling unchanged, and now points at
  the forthcoming L0 rather than at a pending decision.

  THE DURABLE FIX FOR THE LARGEST POPULATION, AND THE ONE ITEM IN THIS TREE THE
  USER SHOULD CONSCIOUSLY DECIDE ABOUT. Flagged at the approval gate rather than
  buried: this is the most expensive L1 here by a wide margin, because every reader
  of the field is affected and the store is large.

  WHY IT IS IN THIS TREE AT ALL. Twenty-six of the forty-seven current gaps exist
  because one field carries two meanings with no discriminator: a tool wrote a test
  link into a record's covered_by and the child links were never there. Without
  this L1, ACS-1400a/b/c will keep detecting and re-repairing that same slice, and
  ACS-1400c must permanently abstain on it — so a quarter of the problem stays
  open by design. It is also DELIBERATELY HOMELESS: ACS-1300a-3 declares it the
  real fix and out of scope in the same breath, twice. A root cause that two trees
  have now declined to own does not stop being the root cause.

  IF IT IS DEFERRED, DEFER IT LOUDLY. Splitting it into its own L0 is a perfectly
  reasonable call and this tree survives it — a, b and c remain coherent and
  valuable, with c abstaining on population 2 indefinitely. What must not happen is
  quiet omission, which is how it became homeless in the first place. If the user
  defers it, record the deferral and the reason on ACS-1400's notes.

  THE MIGRATION IS THE WHOLE JOB; ADDING A FIELD IS THE TRIVIAL PART. The BA should
  spend the L2 budget on: enumerating every reader (start from ac-schema.md's table
  of five, then verify against the repo — the table is a claim, not a guarantee);
  the back-compatibility posture for records that never migrate; and the transition
  order. Beware the deploy-manifest trap documented in CLAUDE.md — a hook importing
  a module that is not in the build deploy list crashes at hook runtime while unit
  tests pass, and once these gates are required that blocks every merge.

  BIND THE PROOF TO EXISTING READERS' REAL VERDICTS, NOT TO FIELD PRESENCE. The
  falsifiable claim is that done_proof reaches the SAME composite-versus-leaf
  verdict for every record before and after the migration, and that the back-link
  check reaches the same verdict too. Compute both against the real functions on
  the real post-migration store; a re-implementation of their rules inside a test
  will pass while production uses a different rule. This is exactly how
  ACS-1300a-3 binds its own equivalent claim.

  BYTE STABILITY STILL APPLIES, AND IS HARDEST HERE. A migration touching every
  record is the maximum-churn operation in this store; a record needing no change
  must not be opened. Inherit TQ-400e-1's rule and test shape.

  DOCUMENTATION: `[reference-doc]` because ac-schema.md is the normative definition
  of the field and every authoring agent reads it — the split is meaningless if the
  schema still describes one dual-purpose field. `[component-diagram]` because the
  set of readers of this field, and which of the two links each one consumes, is
  precisely the thing nobody currently has written down, and is what made the
  collision invisible for as long as it was.
