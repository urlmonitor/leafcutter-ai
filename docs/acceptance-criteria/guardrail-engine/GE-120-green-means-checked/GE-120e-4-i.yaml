assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "SIGNAL ORDER IS THE DEFECT. The states the commit is built on must be consulted FIRST; the operation record refines the answer. The named anti-pattern is 'if there is no operation record, treat this as an ordinary commit and use the whole staged tree' — it reads as a sane default and it fails only on this case, because every other fixture in this L1 has the record present."
  - "THE PARENTS OF THE COMMIT BEING REVISED ARE STILL DISCOVERABLE after the operation record has expired. Derive them from the commit under revision, not from the expired marker. When the commit being amended has two parents, the derivation must use both."
  - "VERDICT EQUALITY IS AN ASSERTION ABOUT TWO REAL RUNS, not an inference: the revised merge plus the edit must produce the same result status and the same objected-to content as the original merge followed by the same edit as an ordinary commit. Both arms in one case."
  - "This case must hold in the deployed layout after build.py (ADR-001), and it must hold inside a git worktree — resolve git state through plumbing rather than filesystem assumptions."
test_spec:
  - name: test_ge120e4i_revised_merge_change_set_holds_only_the_authors_edit
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "After a real merge is revised with one additional authored edit, the check inspects that edit and not the merged-in work."
  - name: test_ge120e4i_absent_operation_record_does_not_widen_to_the_whole_staged_tree
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "With no operation record present, the merged-in content is still absent from what the check objects to — the expired-marker trap."
  - name: test_ge120e4i_verdict_matches_the_ordinary_followup_commit_arm
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Both arms in one case: revised merge plus edit, and original merge plus the same edit as a follow-up commit, produce the same status and the same objected-to content."
test_rationale: "This is the one fixture in the L1 where the operation record has expired and the parent states have not, so it is the only test that can fail on an implementation that reads the marker first and treats its absence as 'ordinary commit'. Every merge fixture elsewhere in this tree has the marker present and stays green against that bug. The revision must therefore be performed as a real repository operation rather than simulated, because what is under test is precisely what git still reports once the marker file is gone. The third case keeps both arms together so verdict equality is observed rather than inferred from two separately-passing tests."
