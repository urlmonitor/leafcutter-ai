criteria: |
  Given three acceptance-criterion files: one with no component-membership key at
    all, one whose components field is an empty list [], and one whose components
    field is a list containing only an empty string ""
  When each file is validated at commit time
  Then all three files are rejected and their commits are blocked
  And each rejection message states that at least one non-empty component name is
    required
  And no one of the three is treated as valid where the others are rejected
