created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-5.yaml"
criteria: |
  Given a guardrail whose job is to compare a deployed artifact against a canonical
    copy that lives in the package repository's own source layout,
  And a consumer install in which the package is vendored, so that canonical layout
    does not exist beneath the install root,
  When that guardrail is invoked inside the consumer-layout install of BP-900h-4,
  Then it establishes whether the comparison is applicable BEFORE attempting it, and
    reaches a verdict either way,
  And when the canonical copy is absent while the deployed artifact is present, it
    reports that the comparison could not be performed and names the location it
    looked for — it does not report a difference it never measured, and it does not
    fail the consumer for the sole reason that a package-development path is absent,
  And when both copies are present, it performs the comparison and reports the same
    result it would report in the package's own workspace, so the fix does not turn
    the guardrail off for everyone,
  And its absent-canonical handling is symmetric with its absent-deployed handling:
    whichever side is missing, the outcome is the same shape of report naming the
    same kind of location.

  Because the hook-parity guardrail resolves its canonical location to a path that
  exists only inside the package repository, and it guards the absence of the
  deployed directory while not guarding the absence of the canonical one. The
  asymmetry is the defect: in any vendoring consumer the canonical side is always
  absent, so the guardrail fails by construction — not on a real difference, and not
  on anything the consumer did.
