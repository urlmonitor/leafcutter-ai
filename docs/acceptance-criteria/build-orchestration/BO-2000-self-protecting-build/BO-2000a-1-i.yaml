id: BO-2000a-1-i
title: "Recorded evidence that reports new violations is rejected, not accepted"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a self-hosting non-regression claim accompanied by a recorded evidence
    bundle that contains both the command that was run and its captured output,
    and the captured output reports one or more new standards violations,
  When the fulfillment gate / validator evaluates the claim,
  Then the claim is rejected,
  And the rejection message names the new violations found in the recorded output,
  And the claim is not marked as a passing self-hosting non-regression result.
depends_on:
  - BO-2000a-1
