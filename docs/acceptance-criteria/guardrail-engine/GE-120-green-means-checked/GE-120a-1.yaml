notes: |
  SCOPE — visibility only. This is the general form of the policy L1. It says a
  cannot-run condition must be VISIBLE and machine-distinguishable; it deliberately does
  NOT say the commit must fail. Blocking is decided per check in GE-120a-2. Do not merge
  the two — collapsing them re-creates the blanket "never fail open" rule that GE-120
  explicitly refuses (see GE-120 notes and the guardrail-engine PROJECT_CONTEXT
  "FAIL-OPEN CONTRADICTION" section).

  BOUNDARY against the approved fail-open convention: the contrast case is GE-120a-1-i.
  A check that ran and merely skipped one unparseable input is an ORDINARY PASS and stays
  that way — GE-116a-1-iii (readiness: approved) is not repealed.

  EVIDENCE — DIRECTLY OBSERVED AND REPRODUCIBLE (do not upgrade or downgrade this label):
  check_ac_parent_covered_by.py, run from a working copy lacking the .leafcutter deployed
  layout link, printed the fail-open line and exited 0; with the link present the SAME
  check on the SAME staged files blocked with 6 violations. That pair is the fixture this
  criterion should be tested against.

  IT-PO (2026-08-14) — technical enrichment note, criteria untouched.
  Verified against the tree: check_ac_parent_covered_by.py is one of 19 files under
  templates/scripts/commit_guardian/ that still carry a private _find_project_root /
  parents[] walk, while 27 files in the same directory already import the shared
  _resolve_root.py. The shared outcome vocabulary this AC introduces belongs beside that
  existing shared helper, not in a new parallel location.
