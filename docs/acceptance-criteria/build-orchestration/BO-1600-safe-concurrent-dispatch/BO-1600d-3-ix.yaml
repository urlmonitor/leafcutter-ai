priority: high
title: "A failing read-only status probe is non-fatal — recovery keeps planning when HEAD is corrupt"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600d.yaml"
criteria: |
  Given the current branch HEAD points at a corrupt commit, so the read-only status
    probe fails
  When the recovery entry point runs
  Then the failed probe is reported as an expected corruption signal rather than a fatal
    abort, and recovery continues to compute the plan, making no repository change during
    planning
  And the computed plan still contains the repair actions for the detected corruption
depends_on:
  - BO-1600d-3
