notes: |
  Gap G1, empty-set no-op path named explicitly by the user for the fast lane. An early
  return is the classic place a cleanup call is skipped: the success path is wired, the
  no-op path returns before reaching it. Named wrong version: clearing only on the
  pull-request path -- this record goes red while BO-4400a-1 stays green.
  Requirements authoring stopped by the person: ACD-2100c-5 already says a person choosing
  to stop discards drafted work, so the workspace holds nothing and is cleared.
