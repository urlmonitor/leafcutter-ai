roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" whose landing place holds three folders left by
    clearings that stopped part-way, each with its repository already gone:
    "ticket/alpha", now completely empty,
    "ticket/gamma", holding only its workspace record naming shop,
    and "ticket/delta", holding its workspace record naming shop and an empty
    sub-folder "build",
  And a project "blog" beside it whose landing place holds an empty folder
    "ticket/alpha" left the same way,
  When clearing is requested from shop for each of shop's three folders, and for
    blog's "ticket/alpha",
  Then each of shop's three requests is answered cleared, and no folder or file
    of it remains at its location,
  And none of shop's three requests is answered "not found",
  And the request for blog's "ticket/alpha" is refused, stating that shop has no
    workspace at that location, and that folder is identical before and after,
  And no fetch or push reached the shared project of either project.
depends_on: [BO-4300e-2, BO-4300e-2-iii]
