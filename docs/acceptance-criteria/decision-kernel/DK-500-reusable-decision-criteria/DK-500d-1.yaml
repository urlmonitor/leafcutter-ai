notes: |
  Flow node: decision-forming reuse-criteria (step 7, before judge-gap and propose). DISTINCT FROM PRECEDENT: the precedent step offers an earlier ANSWER; this offers earlier QUESTIONS; both can apply in one run. Reused categories are evidence, never authority (ADR-060).
  OPEN: (1) whether a component-limited category fits a repository-wide decision (all seven published decisions but one are repository_wide with components []); (2) whether there is a cap or a relevance order on how many fitting categories are offered when the library grows (with five categories all fit); (3) decision_type has a pattern in the decision record schema but no declared vocabulary, while the decision's crit.filters_from_declared_vocabularies asks for one.
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/decision-forming: reuse-criteria.
  Authored by the business-analyst stage of /plan-feature (route strategic) under decision dec-93c1c730463c1f3c; readiness draft, no product approval implied.
  IT PO (2026-10-05), Q8 settled as IT PO defaults to confirm: (1) a component-limited category does not fit a repository-wide decision (precision first); (2) a cap (default 8) with a deterministic order by wording overlap and category id, never by usage or outcomes; (3) decision_type has no declared vocabulary yet, so category decision_types are validated by the same pattern as the decision record's decision_type until one is declared.
