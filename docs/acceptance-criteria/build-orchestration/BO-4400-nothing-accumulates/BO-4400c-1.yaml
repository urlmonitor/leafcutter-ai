implemented_by: []
notes: |
  Gap G3. Prevention side of BO-4400b: an environment inside the workspace dies with the
  folder. A package manager's shared DOWNLOAD cache (reused across projects by design) is not
  a per-environment folder and is out of scope; only per-environment folders are checked.
