estimated_complexity: M
it_requirements:
  - >-
    AGENT CONFIRMED: python-coder. The surfaces are a scripts/ci/ module and the workflow
    that calls it; no agent in config/agent_registry.json owns GitHub Actions YAML, and every
    record of this family that edits a post-merge workflow assigns python-coder
    (TQ-600a-13-ii). All decision logic — selection, retry list, per-lane verdict, combined
    verdict — stays in scripts/ci/; workflow steps only prepare the environment and invoke
    the module.
  - >-
    THE DATABASES MATCH PROOF-OF-DONE EXACTLY, AND MUST NOT DRIFT FROM IT. The Proof-of-done
    job in .github/workflows/ci.yml (job id `done-proof`) starts three `neo4j:5.26-community`
    service instances — knowledge-retrieval on host port 17687, knowledge-domain on 18087,
    knowledge-native on 18088, each mapped to 7687, with its own NEO4J_AUTH test credential
    and the same heap / page-cache settings — and sets no address variables, so the tests
    reach them at their default addresses. The lane's first execution and its retry each
    start the same three instances: same image tag, same host ports, same credentials, same
    memory settings. Whether that is achieved by one shared definition or by two identical
    copies is the implementer's choice, but a change to one that is not made to the other
    is a defect; record the choice in notes. Do not edit the `done-proof` job as a side
    effect (TQ-600a-13-xxiv).
  - >-
    THE CREDENTIALS STAY NON-SECRET LITERALS. The three NEO4J_AUTH values are disposable
    test credentials already written in ci.yml. The lane must not introduce a `secrets.`
    reference or a write-scoped token; every job of post-merge-suite.yml keeps the
    `contents: read` (plus `actions: read` on the verdict job) permissions TQ-600a-13-ii
    set.
  - >-
    THE POPULATION IS THE FOLDER, COLLECTED FRESH, AND THE DEFAULT DESELECTION IS
    OVERRIDDEN. The lane collects `tests/knowledge_live/` (the folder path is the only
    pinned input — never a hard-coded list of modules or node ids, never a stored list).
    pytest.ini's addopts carries `-m "not manual and not timing_ratio"`, so the lane must
    pass a command-line marker expression that selects every test in the folder (the
    suite-performance guide documents `-m "manual or not manual"` as the collect-everything
    form; a timing_ratio-marked test in the folder must be included too). The same marker
    override must be carried by the retry: TQ-600a-13-ii measured that re-running node ids
    without the opt-in marker reports "deselected" and executes nothing.
  - >-
    A LIVE-LANE TEST MISSING FROM THE RETRY REPORT IS FAILED ON BOTH EXECUTIONS. As for the
    correctness lane, the retry outcome is read per node id from the retry's own per-test
    report; an id absent from it is never passed-on-retry.
  - >-
    THE LIVE LANE IS ITS OWN JOBS, SEPARATE FROM THE CORRECTNESS LANE'S. The live first
    execution and the live retry run as jobs of their own (job names indicative: `live run`,
    `live retry`), each on a fresh runner with its own database start-up, its own checkout
    and build, and the same strict run conditions as TQ-600a-13-ii (`AC_ENFORCE_STRICT=1`,
    dev dependencies, `python scripts/build.py --target-dir .`). The live retry receives
    only the list of live first-run failures as a named artifact. Separation is required so
    that a database that fails to start cannot take the correctness lane's report down with
    it, and so that the verdict job can attribute a failure to the right lane
    (TQ-600a-13-xxii). The existing verdict job gains the live jobs as dependencies and
    keeps running always.
  - >-
    ONE COMBINED VERDICT, ONE RUN CONCLUSION, NO SECOND HOLD CHECK. The run's verdict is
    green only when both lanes are green; did_not_complete when either lane did not complete
    (TQ-600a-13-v ordering: did-not-complete outranks red); otherwise red. The existing
    `Verdict: red` / `Verdict: did not complete` steps and the run conclusion continue to
    carry the combined verdict, so `Post-merge suite status` (TQ-600a-13-vi) needs no change
    to hold on a red live lane.
  - >-
    THE VERDICT ARTIFACT KEEPS EVERY EXISTING FIELD'S MEANING. Existing consumers (notice
    -iii, fix proof -xvi, pass-on-retry window -xiii, demotion counter -x) read top-level
    `verdict`, `stage`, `failing`, `passed_on_retry`. Top-level `verdict` / `stage` become
    the combined verdict; top-level `failing`, `first_run_failures`, `passed_on_retry` and
    `collected_ids` stay CORRECTNESS-LANE ONLY, so the fix proof of -xvi, unchanged, never
    executes a live-database test without a database (until TQ-600a-13-xxv lands, a fix for
    a live-only red run selects nothing, which -xvi already judges as not proven — the
    conservative direction). The live lane's results go in a new object (see delivers_to);
    bump `schema_version` and update every reader in the same change.
  - >-
    PASS-ON-RETRY TRACKING COVERS THE LIVE LANE. The live lane's `passed_on_retry` ids feed
    the same five-run window and escalation of TQ-600a-13-xiii as the correctness lane's,
    computed in the same verdict job; a node id that appears in both lanes is tracked per
    lane, never double-counted.
  - >-
    THE CORRECTNESS AND TIMING SELECTIONS ARE UNTOUCHED. The correctness lane's command
    (`-m "manual and not timing_ratio" tests/ unit_tests/`) and post-merge-timing.yml are not
    edited. The TQ-600a-13-xii partition check, if it enumerates lanes, must treat the live
    lane as a re-execution of default-run tests and not as a fourth partition member.
  - >-
    BOUNDED TIME. Each live job carries an explicit `timeout-minutes` no greater than three
    times its measured cost (TQ-600a-13-ii rule). Measure the live run job's wall clock
    (database start-up plus the folder) from the first live run and record it in notes
    with the timeout chosen.
  - >-
    THE DEFAULT-RUN TESTS OF THIS RECORD STAY INSIDE THE FAMILY BUDGET. The family's
    default-run test budget is under 15 s total (TQ-600a-13-ii); this record's default-run
    share must not exceed about 1.5 s and must start no build and call no GitHub. Any
    execution against a real database cannot happen in the per-PR shards, which start no
    database; where it does execute must be stated by the test design, and it must never
    skip silently into a pass.
delivers_to:
  - agent: python-coder
    ac_id: TQ-600a-13-xxii
    contract: >-
      The live-database lane's first execution, retry and verdict, onto which TQ-600a-13-xxii
      adds the database-never-healthy ending.
  - agent: python-coder
    ac_id: TQ-600a-13-xxiii
    contract: >-
      The live-database lane's per-test results, from which TQ-600a-13-xxiii refuses to read
      a skip as a pass.
  - agent: python-coder
    ac_id: TQ-600a-13-xxiv
    contract: >-
      A post-merge live-database lane whose three neo4j:5.26-community instances use the
      same host ports (17687, 18087, 18088), credentials and memory settings as the
      `done-proof` job of .github/workflows/ci.yml, delivered without any edit to what that
      job selects, which services it starts, or how it judges.
  - agent: python-coder
    ac_id: TQ-600a-13-xxv
    contract: >-
      The `post-merge-verdict` artifact (schema_version incremented from 2) carrying, beside
      the unchanged correctness-lane fields, an object `live_database`: `verdict` ("green" |
      "red" | "did_not_complete"); `stage` (null unless did_not_complete; values added by
      TQ-600a-13-xxii and -xxiii); `collected` (int >= 0); `collected_ids`,
      `first_run_failures`, `failing`, `passed_on_retry` (sorted lists of full node ids);
      `skipped` (list of {`id`: str, `reason`: str}, other-reason skips per -xxiii);
      `unreachable_skips` (sorted list of node ids that skipped for no reachable
      database); `run_runner`, `retry_runner` (str | null). Top-level `verdict` and `stage`
      are the combined verdict. Also the lane's database start-up (the three instances) for
      the proof run to reuse, defined so the proof cannot drift from it.
  - agent: documentation-expert
    ac_id: TQ-600a-13-xxvi
    contract: >-
      In the same change that lands this lane, docs/testing/README.md and
      scripts/suite_performance/README.md state that the live-database tests run after every
      merge to main and on the heartbeat against disposable databases, that a red
      live-database lane holds pull requests through `Post-merge suite status`, and that the
      Proof-of-done check still runs the changed criteria's live tests on the pull request.
expects_from:
  - ac_id: TQ-600a-13-ii
    contract: >-
      The post-merge run, its coalescing, the separate retry job fed only a failure list,
      and the verdict whose conclusion is the run history the hold reads.
  - ac_id: TQ-600a-13-v
    contract: >-
      The rule that only a complete, non-empty, error-free execution can be green.
test_intent:
  - clause: 'the same post-merge run, under the same triggers and the same coalescing as TQ-600a-13-ii, also executes a live-database lane: it starts the same disposable graph-database instances, of the same database version and on the same addresses, that the Proof-of-done check starts, and executes every test in the live-database test folder against them — the whole folder, not only the tests of recently changed criteria, including any test in that folder the default run would otherwise deselect'
    needs_test: true
    reason: A selection that keeps pytest.ini's default deselection or narrows to changed criteria would silently drop live tests, so the executed population must be observed.
  - clause: 'when some live-database tests fail on the first execution, exactly those tests are executed again — each once, and no test that passed — on a fresh machine that starts its own fresh disposable database instances and receives nothing from the first execution except the list of tests to re-execute'
    needs_test: true
    reason: A retry that drops the opt-in marker executes nothing, and TQ-600a-13-ii measured exactly that failure, so the re-executed set must be observed.
  - clause: 'a live-database test that fails on both executions makes the post-merge run red, and the run''s result names that test by its full node id and as belonging to the live-database lane'
    needs_test: true
    reason: The red verdict and the lane attribution are computed by the verdict job, and a wrong merge of lanes would hide or misattribute the failure.
  - clause: 'a live-database test that fails and then passes does not by itself make the run red, and is named as passed-on-retry exactly as a correctness-lane test is, for TQ-600a-13-xiii to track'
    needs_test: true
    reason: Classifying fail-then-pass is verdict logic that could wrongly turn the run red or drop the id from the pass-on-retry window.
  - clause: 'the post-merge run is green only when both the correctness lane and the live-database lane are green, so a red live-database lane holds pull requests through the same `Post-merge suite status` verdict the correctness lane feeds, with no second hold check'
    needs_test: true
    reason: The combined verdict is the one input the hold reads, so a combination that ignores the live lane would release every held pull request.
  - clause: 'the live-database lane''s population is collected afresh on every run from the folder itself, never from a stored list, so a live-database test added to the folder after this change is executed by the next post-merge run with no other edit'
    needs_test: true
    reason: A hard-coded or cached list would pass today and silently miss the next test added, which only a run with a newly added test reveals.
  - clause: 'adding this lane changes neither the correctness lane''s own selection nor the timing lane''s, and the partition of TQ-600a-13-xii — every test collected by exactly one of the default run, the correctness lane and the timing lane — still holds with the live-database lane not counted as a fourth member of it, because the live-database lane re-executes default-run tests with a database present rather than taking them out of the default run'
    needs_test: true
    reason: A partition check that enumerates every post-merge lane would turn red on the overlap, and a changed correctness selection would shift tests between lanes unnoticed.
  - clause: 'each of these outcomes is demonstrated by executing the lane''s selection, retry and verdict behaviour against a synthetic population of live-database tests made to pass, fail, or fail-then-pass against a real disposable database, with the first execution and the retry run as two separate jobs that share only the handed-over list, never by reading the workflow definition for a service, a trigger or a selection'
    needs_test: false
    reason: This clause prescribes how the other clauses are demonstrated rather than stating an outcome of its own.
test_spec:
  - name: test_tq_600a_13_xxi_the_live_lane_executes_the_whole_folder_including_deselected_tests
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "the live lane's first-execution subcommand of scripts/ci/post_merge_suite.py run as a child process over a synthetic live folder (passing tests, a manual-marked test, a timing_ratio-marked test, a nested subfolder) under a pytest.ini whose addopts carries the default `-m \"not manual and not timing_ratio\"`; no database is needed because the synthetic tests do not connect"
    description: The live lane's report lists every test of the synthetic folder, the default-deselected manual and timing_ratio ones included, and none from outside the folder.
    proves_clause: 'the same post-merge run, under the same triggers and the same coalescing as TQ-600a-13-ii, also executes a live-database lane: it starts the same disposable graph-database instances, of the same database version and on the same addresses, that the Proof-of-done check starts, and executes every test in the live-database test folder against them — the whole folder, not only the tests of recently changed criteria, including any test in that folder the default run would otherwise deselect'
    code_file: scripts/ci/post_merge_suite.py
    must_catch:
      - "the lane keeps pytest.ini's default deselection and silently drops the manual and timing_ratio tests of the folder"
      - "the lane narrows its selection to the tests of recently changed criteria"
      - "the lane executes a hard-coded list of modules instead of the folder"
  - name: test_tq_600a_13_xxi_the_live_lane_runs_against_the_same_real_databases_as_proof_of_done_MANUAL
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    requires_db: true
    surface_invoked: "a test of the live-database folder itself, so the live lane's own first execution runs it against the three real disposable instances: it connects to 17687, 18087 and 18088 with the done-proof credentials, asserts each reports a 5.26 community server, then runs the lane's run and retry subcommands over a tiny synthetic live population (pass, fail, fail-then-pass) against that real database"
    description: Against the real disposable databases the lane's three instances answer on the Proof-of-done addresses and version, and the synthetic population ends as pass, fail and passed-on-retry; an unreachable database fails the test and never skips it.
    proves_clause: 'the same post-merge run, under the same triggers and the same coalescing as TQ-600a-13-ii, also executes a live-database lane: it starts the same disposable graph-database instances, of the same database version and on the same addresses, that the Proof-of-done check starts, and executes every test in the live-database test folder against them — the whole folder, not only the tests of recently changed criteria, including any test in that folder the default run would otherwise deselect'
    code_file: scripts/ci/post_merge_suite.py
    convention_test_file: tests/knowledge_live/test_km_400f_1.py
    to_be_created: false
    must_catch:
      - "an instance on a drifted port or image tag from the Proof-of-done check's"
  - name: test_tq_600a_13_xxi_the_live_retry_reexecutes_exactly_the_failures_under_the_same_marker_override
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the live lane's run job then retry job of .github/workflows/post-merge-suite.yml executed verbatim by the shared workflow-step executor over real child pytest sessions on a synthetic live folder, the retry receiving only the failure list artifact"
    description: Only the first-run failures are executed again, once, including a default-deselected one, no passing test re-runs, and the retry job sees nothing but the handed-over list.
    proves_clause: 'when some live-database tests fail on the first execution, exactly those tests are executed again — each once, and no test that passed — on a fresh machine that starts its own fresh disposable database instances and receives nothing from the first execution except the list of tests to re-execute'
    code_file: scripts/ci/post_merge_suite.py
    must_catch:
      - "the retry drops the marker override, so a deselected failing test reports deselected and executes nothing"
      - "the retry re-executes the whole folder instead of only the failures"
      - "the retry reads the first execution's report or workspace instead of only the list"
  - name: test_tq_600a_13_xxi_a_live_test_failing_twice_is_red_and_named_as_live_lane
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "the verdict builder of scripts/ci/post_merge_suite.py fed recorded live-lane first-run and retry reports in which one test fails on both executions, beside a green correctness lane"
    description: The run is red, the live_database object names the test by full node id in failing, and the correctness-lane failing list does not contain it.
    proves_clause: 'a live-database test that fails on both executions makes the post-merge run red, and the run''s result names that test by its full node id and as belonging to the live-database lane'
    code_file: scripts/ci/post_merge_suite.py
    must_catch:
      - "the live lane's failures are ignored and the run reads green"
      - "the live failure is merged into the top-level failing list with no lane attribution"
      - "the failing id is shortened and no longer a full node id"
  - name: test_tq_600a_13_xxi_a_live_test_that_fails_then_passes_is_passed_on_retry_not_red
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "the verdict builder of scripts/ci/post_merge_suite.py fed recorded live-lane reports with one fail-then-pass test, and the same node id also passing-on-retry in the correctness lane"
    description: The run stays green on that account, the id is listed as passed-on-retry in the live_database object, and an id common to both lanes is counted once per lane in the pass-on-retry window.
    proves_clause: 'a live-database test that fails and then passes does not by itself make the run red, and is named as passed-on-retry exactly as a correctness-lane test is, for TQ-600a-13-xiii to track'
    code_file: scripts/ci/post_merge_suite.py
    must_catch:
      - "a fail-then-pass live test turns the run red"
      - "the live passed-on-retry id is dropped from the pass-on-retry window"
      - "an id present in both lanes is double-counted in one window"
  - name: test_tq_600a_13_xxi_the_run_is_green_only_when_both_lanes_are_green
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the verdict job of .github/workflows/post-merge-suite.yml executed by the shared workflow-step executor with seeded correctness and live reports for every green/red combination, then its `Verdict: red` step"
    description: "Green only for green plus green, red when either lane is red, and a red live lane with a green correctness lane fails the job at the step named `Verdict: red` so the same `Post-merge suite status` verdict carries it."
    proves_clause: 'the post-merge run is green only when both the correctness lane and the live-database lane are green, so a red live-database lane holds pull requests through the same `Post-merge suite status` verdict the correctness lane feeds, with no second hold check'
    code_file: scripts/ci/post_merge_suite.py
    must_catch:
      - "the combination ignores the live lane so a red live lane reads green"
      - "the live lane is read as red but the named Verdict step is skipped and the run concludes success"
  - name: test_tq_600a_13_xxi_the_live_population_is_collected_afresh_from_the_folder
    target_dir: unit_tests/suite_performance/
