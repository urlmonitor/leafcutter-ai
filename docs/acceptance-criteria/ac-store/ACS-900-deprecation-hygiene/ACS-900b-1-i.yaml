it_requirements:
  - "Fail-open on INTERNAL error is orthogonal to the always-block-on-real-violation decision (ACS-900b-1): the entry point MUST be wrapped so that ANY unexpected exception results in exit 0, NOT exit 1. A script bug must never hard-block an unrelated commit."
  - "Mirror the check_ac_governance.py tail exactly: `if __name__ == '__main__': try: sys.exit(main()) except Exception as exc: print('[<hook-prefix>] unexpected error (fail-open): ...', file=sys.stderr); sys.exit(0)` with a `# noqa: BLE001` on the broad catch (this is the one sanctioned blind-except in the codebase, justified by the fail-open contract)."
  - "Localized internal failures (one unparseable staged YAML, one unreadable implemented_by path, a failing `git show HEAD:`) MUST be caught at their I/O boundary, logged at WARNING to stderr with the hook prefix, and treated as inconclusive (not a block) — consistent with check_ac_governance.py's _load_yaml_safe / _load_head_content returning None on failure."
  - "On any fail-open path the hook MUST NOT emit a block decision to stdout (stdout carries only real block decisions; diagnostics go to stderr) — so a downstream parser never mistakes an internal error for a violation."
  - "Deployed and packaged-template copies of the hook MUST stay in parity (ADR-001), including the fail-open tail."
