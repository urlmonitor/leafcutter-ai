criteria: |
  A new part is recorded by its parent at the moment it lands, or it does not land.

  When someone adds a part to an existing requirement, the requirement's own record
  of its parts is updated in the same breath — and when it is not, the person is
  told, every time, rather than only in the cases the check happened to be shown.
