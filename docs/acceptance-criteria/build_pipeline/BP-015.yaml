notes: >-
  Authored by /quick-fix. Root cause: _bootstrap() called os.symlink(env_src,
  env_dst) without first clearing env_dst. A checked-out `.env` symlink made
  os.symlink raise FileExistsError, and the copy fallback then raised
  SameFileError because env_dst resolved to env_src — so every fresh worktree
  failed to bootstrap. Observed 2026-08-13 while bootstrapping a scratch
  worktree during the AC-store scanner work.
