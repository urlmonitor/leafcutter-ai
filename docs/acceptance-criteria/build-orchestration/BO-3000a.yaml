notes: |
  FIELD EVIDENCE — observed 2026-09-01, EPIC-TheNumberingGuaranteeHoldsAtEveryStage,
  ticket 01 (GE-122d-1). python-coder completed a verified 77-line fix to
  scripts/build_phases.py, diagnosed that 4 of 6 red-baseline tests failed on a
  test-fixture path bug (the fixture assumed a bare `<target>/hooks/`,
  contradicting ADR-004's shim design), correctly classified that as test_drift,
  correctly declined to fix tests itself (its template forbids it), wrote the
  `### test-writer` section, and returned `status: handoff`. The driver replied:

    Phase 'python-coder' returned 'status: handoff' but named no recognizable
    handoff_target ('undefined').

  The ticket was dropped. It was the only one of four in that batch that produced
  working production code. The fix survives only because it was left staged.

  WHAT THAT EVIDENCE ACTUALLY SHOWS. The gap was a contract with two halves and
  only one of them written down: the agent template told the coder to write the
  `### test-writer` task section and to return `(status: handoff)`, and never told
  it to name its target to the driver. The remedy is to close the contract at the
  emitter — the templates now require `handoff_target` alongside the handoff — not
  to teach the driver to guess. The receiving agent and the driver ask different
  questions (WHAT do I owe on this ticket / WHO do I run next) and each needs its
  own answer; a design that answers only the first and derives the second is what
  produced this record's first draft.

  WHY INFERRING THE TARGET FROM THE TICKET BODY WAS REJECTED. The first version of
  this AC required the driver, on a targetless handoff, to read the `### <agent>`
  headings under the ticket's `## Implementation Tasks` section and re-dispatch the
  agent it found there. Code review and follow-up verification killed that design on
  three grounds, all of which stand:

  (1) WRONG CHANNEL, AMBIGUOUS BY CONSTRUCTION. The per-agent task breakdown is a
      general convention, governed by `requires_ticket_section: true` in
      config/agent_registry.json and carried by 13 agents — python-coder, test-writer
      and documentation-expert among them, routinely together on one ticket — and read
      by the sign-off parity guard. It answers what each agent owes on the ticket, not
      who a handoff is addressed to. On any ticket that uses the convention properly,
      more than one agent is named, so the inference is ambiguous by construction and
      degrades to the refusal it was supposed to avoid — on exactly the tickets that
      follow the conventions best.

  (2) IT CONVERTS A DELIBERATE STOP INTO A SPURIOUS RUN. python-coder's
      contract-shrinkage guard and test-writer's test-repair rule both emit
      `(status: handoff)` to mean "blocked, do not proceed without explicit user
      authorization", naming no agent at all. If such a ticket also carries a
      `### test-writer` section from an earlier delegation — the normal case, not a
      corner one — inference resolves it and re-dispatches test-writer, turning an
      intentional halt into an agent run the author was specifically refusing to
      authorise. That failure is silent and looks like progress. (The status-enum
      misuse at those two sites is a separate pre-existing defect and is not fixed
      here; this record simply must not depend on it behaving otherwise.)

  (3) THE SKEW IT GUARDED AGAINST IS UNREACHABLE. The fallback was justified as
      covering agents whose templates had not yet been updated to send the field.
      scripts/build_phases.py deploys templates/agents/*.md and
      templates/workflows-js/*.js in the same build.py run from the same package, so
      a consumer cannot hold the new driver alongside an old template. The fallback
      therefore protects against nothing, at the cost of the two failure modes above.

  WHY THIS IS A CHILD OF BO-3000 AND NOT A REVISION OF IT. BO-3000 requires that an
  unresolvable handoff target fail closed, and that requirement is correct, is not
  relaxed here, and is strengthened: guessing a re-dispatch target is worse than
  refusing. What this record adds is that the refusal must be actionable — it must
  reproduce the value it was given rather than substituting one, and it must separate
  "no usable result from the phase" from "a result that named nothing", so the reader
  can tell a dead agent from a non-conformant one. That is the same unreadable-versus-
  empty distinction BO-400a-2-iii insists on for the ticket record, applied to the
  phase reply. BO-3000's five existing tests pass today and must continue to pass.

  THE COVERING TESTS ONCE ENCODED THE REJECTED DESIGN — RESOLVED, AND KEPT HERE AS
  HISTORY. At the moment the criteria above were rewritten (first amendment, this
  record's `amended_by`), the five BO-3000a cases in
  unit_tests/workflows/test_bo_3000a_3700_dispatch_defects.py still asserted the
  inference behaviour by name (resolves-from-implementation-tasks,
  agent-contracts-not-read, two-candidates-refuses, field-takes-precedence-over-the-
  record). For that window a green run of that file was evidence AGAINST this record
  rather than for it, and this record's `work_status` was deliberately left unflipped
  on exactly that ground: the criteria had moved and their coverage had not, so any
  claim of done would have been a claim ahead of its proof.

  That window is closed. Commit 5d997855a rewrote the file: the tests asserting the
  rejected inference were DELETED rather than adapted, as this note required, and the
  file now implements the seven-entry test_spec above name for name, driven through
  unit_tests/prompt_assembly/_driver_harness.py. An AC-fulfilment gate verified the
  spec-to-test mapping 1:1 and flipped `work_status` to done on that evidence. A green
  run of that file is now evidence FOR this record.

  The sequence is preserved rather than deleted because it is the shape of the risk,
  not an anecdote about one file: criteria were rewritten first and their coverage
  second, and between the two commits the store held a record whose own tests
  contradicted it. The correct behaviour in that window was the one taken — leave
  `work_status` alone and say plainly in the record why — and a reader who finds this
  record mid-rewrite again should recognise the state rather than reconcile it early.

  NOTE ON BO-3000's OWN STATE. BO-3000 reads `work_status: todo` with an empty
  `implemented_by` while unit_tests/workflows/test_bo_3000_handoff_routing.py
  exists and is GREEN (5 passed, 2026-09-01). That is a store-reconciliation gap
  of the same kind recorded for GE-122e-2 on the same day. It is NOT corrected
  here — reconciling an unrelated record's status from inside a fix commit is how
  the store's history stops being auditable. Recorded as an observation only.

  SCOPE (revised 2026-10-06 by it-po, user decision F1, ticket T2). Both twin drivers
  change, in the same commit: templates/workflows-js/build-feature.js and
  templates/workflows-js/build-ticket.js. The continuation rule, the stop conditions
  and the handoff budget must behave identically in both, and the covering tests are
  parametrised over TWIN_DRIVERS so the twins cannot drift. Cases that need an epic
  drive stay build-feature.js only, because build-ticket.js has no epic loop. The
  original note limited the first pass to build-feature.js and left build-ticket.js
  as follow-up, because the frozen-list defect shipped alongside it (BO-3700) is
  build-feature-specific. That reason no longer limits this record. BO-3700 itself
  stays build-feature-specific.
