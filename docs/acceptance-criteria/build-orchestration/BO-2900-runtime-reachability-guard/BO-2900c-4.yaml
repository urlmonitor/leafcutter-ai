id: BO-2900c-4
components:
  - build_orchestration
  - build_pipeline
title: "Every automation script is checked because the set is derived, and an unreadable surface fails closed"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given three automation scripts exist that drive builds, and each is checked for
    invocations naming capabilities that do not exist,
    And a fourth automation script is added that invokes an unregistered capability,
    And nothing else changes — no list of scripts is edited anywhere,
  When the connection from automation invocations to registered capabilities is checked,
  Then the fourth script is reported,
    And the set of scripts checked is the set of automation scripts that exist at the
      time of the check.

  Given the command surface cannot be built or interrogated when the check runs,
  When the check runs,
  Then it reports that the set of registered capabilities could not be established,
    And the change is refused,
    And no invocation is reported as naming a capability that does not exist,
      because an empty inventory is not evidence that a capability is absent.
