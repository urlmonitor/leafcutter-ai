criteria: |
  Given scripts/commit_guardian/check_no_print.py exists,
  When commit_guardian.json is read,
  Then hooks_manifest contains an entry with id "check-no-print",
  And the entry has files pattern "\.py$" and pass_filenames true,
  And a top-level "no_print" config section exists with:
    - exempt_patterns: list of allowed print-like calls (e.g. click.echo, sys.stdout.write),
    - exempt_paths: list of path prefixes exempt from the check (e.g. scripts/commit_guardian/ for hook output).
