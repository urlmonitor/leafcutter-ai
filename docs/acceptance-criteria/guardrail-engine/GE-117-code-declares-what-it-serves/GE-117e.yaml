criteria: |
  A guided way to add the missing declaration, or a deliberate opt-out, so the block is never a dead end.

  When your commit is stopped for a missing requirement or component reference,
  you get a fast path to add the correct declaration — and, for the rare case
  where it genuinely does not apply, a deliberate, visible opt-out — so the
  guardrail protects you without ever trapping you.
