roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement that carries no declared boundary at all,
  And a build of that requirement whose pending changes include a file the
    requirement never named,
  When the change under review is compared against the requirement's boundary,
  Then the review reports that it had no boundary to compare against, as part of
    the outcome a person reads,
  And the outcome states which requirement had none,
  And the review does not report a clean scope on the strength of an absent
    boundary,
  And a requirement that declares an explicitly empty boundary produces a
    different outcome from one that declares none, so the two are never
    conflated.
depends_on: [ACD-1600g, ACD-1600g-1, ACD-1600g-3]
