notes: |
  IT-PO SPLIT, 2026-10-15. BO-400e-3-ii says the ticket a single-ticket branch was built for must
  be identified, and closes nothing when it cannot be. The BA found no reliable source:
  finalize takes only a branch, the feature/<slug> name is lossy and overridable, and setup prints
  ticket_path_final but persists it nowhere. The IT-PO chose a record written at setup (a git config
  key on the branch, reasons in BO-400e-3-ii's it_requirements). Writing that record is behaviour
  no existing AC specified, so it is stated here. BO-400e-3-ii's criteria are unchanged.

  The collision scenario changes one existing behaviour of setup-ticket. Today a second ticket
  whose name maps to an existing branch silently reuses that branch's worktree. After this change
  setup stops instead. This is deliberate: reuse would drive the second ticket on a branch recorded
  for the first.
  Decided by BrainCandy 2026-10-15: setup-ticket refuses (does not reuse) when a different ticket maps to an existing branch.

  Branches without a record (quick-fix, fast-lane, AC-authoring and pre-existing single-ticket
  worktrees) close nothing at finalize when they changed tickets or ACs, and report "nothing to
  close" when they did not (BO-400e-3-ii's evaluation order). A person can record the ticket by
  hand with `git config branch.<branch>.leafcutterTicket <path>` and re-run finalize.
