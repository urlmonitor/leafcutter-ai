    type: behavioral
    description: "Via run_workflow_under_e2, a well-formed answer of the wrong type (e.g. 'high' to an approve/edit/cancel gate) supplied on resume is rejected and not applied."
  - name: test_run_stays_paused_after_wrong_shape
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, after a wrong-shape answer the run stays paused_awaiting_input on the same pending question."
  - name: test_same_question_represented_with_valid_shape
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, the same question is re-presented together with a statement of its valid answer shape."
