notes: |
  Satisfies the component-diagram entry in BO-3100b's documentation_triggers.

  Showing the reply explicitly as an input that is NOT used for the work-happened decision is
  deliberate. Omitting it from the diagram would leave a reader assuming it is read, which is
  the belief this whole tree exists to correct; drawing it as a deliberately unused input
  records the decision rather than hiding it.

  The second scenario ties the diagram to the judgement's real inputs, so an input added later
  — the no-op declaration medium being the likely one — cannot silently diverge from it.

  IT-PO ENRICHMENT NOTE (2026-08-26). The used/not-used distinction has to be DECLARED DATA,
  not a line style. That is the one addition this enrichment makes to the BA's criteria-level
  intent, and it is what turns the negative claim into something a test can assert.
