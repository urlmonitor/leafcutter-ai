criteria: |
  Given a copy was made from the shared branch when the shared branch was at state S1,
    and by the time the copy's work is finished the shared branch is at state S2,
    and S2 contains a file that S1 did not contain and that this copy has never edited,
  When the workflow prepares the finished work to leave the copy,
  Then the state it treats as the shared branch is S2 -- the state the shared branch
    is actually in at that moment -- and not S1 or any other state recorded earlier
    in the run, even when such an earlier state is available without consulting the
    shared branch,
  And the copy's own commits are replayed on top of S2 before any part of the
    delivery leaves the copy,
  And the prepared delivery contains the file that S2 introduced,
  And every change the copy made is present in the prepared delivery unchanged.
