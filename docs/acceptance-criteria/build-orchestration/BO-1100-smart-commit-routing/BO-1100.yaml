title: "Commit messages match the kind of change automatically -- no manual formatting decisions"
component: build-orchestration
level: L0
status: active
req_status: draft
work_status: todo
criteria: |
  Every commit gets the right message pattern for its content automatically.

  When work is committed, the system examines what files are staged and picks
  the appropriate message convention for that type of change. Ticket moves get
  ticket-move messages, new features get feature messages, status updates get
  housekeeping messages. Nobody decides the format manually. Over time, the
  system recognizes new recurring commit shapes and proposes additional routing
  rules, reducing LLM calls and improving readability for everyone who reads
  the history.
