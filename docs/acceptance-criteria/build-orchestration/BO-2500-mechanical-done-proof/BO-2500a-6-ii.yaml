    type: behavioral
    angle: failure
    description: "An entry resolving to no AC record is still skipped, preserving BO-2500a-6's own M-2 behaviour."
test_rationale: |
  The three cases are the classification's whole truth table: a leaf that looks composite,
  a composite that really is one, and an entry that is neither. The middle case is
  load-bearing — a fix that simply stopped recursing would satisfy the first and the third
  while silently dropping real nesting, and nothing else in the suite would notice.

  They call _resolve_all_child_ids directly with a synthetic status map rather than driving
  the whole oracle, because the defect is in that function's classification and a
  whole-oracle test would only reproduce it at several removes.
