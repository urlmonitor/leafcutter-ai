assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Add a Playwright-based route-smoke harness UNDER leafcutter-web/ (e.g. leafcutter-web/tests/route-smoke.spec.ts + a playwright config). @playwright/test is a NEW devDependency to add to leafcutter-web/package.json (also add a lockfile entry and, in CI, `npx playwright install --with-deps chromium` for the browser binary). No test framework is currently installed in leafcutter-web/, so this is net-new tooling."
  - "The harness MUST enumerate the app's routes and iterate them (include /about explicitly — see BP-1400c-1-i). Prefer deriving routes from the Next.js app-router filesystem (leafcutter-web/app/**) so new routes are covered automatically rather than a hard-coded list that silently drifts; where a route needs params, provide a representative concrete path."
  - "For each route the harness MUST assert HTTP status == 200 AND capture browser console errors (page.on('console'...') / pageerror) and fail the route if any console error or uncaught render error is emitted while loading. The check passes only when EVERY route is 200 with no console/render error."
  - "The harness runs against a real running instance of the built app: `npm ci` -> `next build` -> `next start` (or Playwright webServer) so it exercises the production build, then run the Playwright spec against that server."
  - "Add a NEW blocking route-render job to .github/workflows/ci.yml that invokes the harness. The job MUST be blocking (no continue-on-error), reuse the BP-1400a-2 leafcutter-web/** paths filter, use actions/setup-node with npm cache, and pin a stable `name:` — the cross-AC contract added to the required-status-checks list by BP-1400a-4."
  - "Harness<->CI-job contract: the harness MUST signal overall pass/fail via process exit code (Playwright exits non-zero on any failing spec); the CI job consumes that exit code as the check result. A non-200 or console/render error on ANY route yields a non-zero exit; the CI job must not mask it (fail loudly)."
  - "PREREQUISITE: every current route must already render clean (200, no console error) on the built app before the check is made blocking, or every web-app PR is blocked. Establish a clean baseline first."
test_spec:
  - name: test_route_smoke_job_present_and_blocking
    target_dir: unit_tests/build_pipeline/
    framework: pytest
    type: unit
    description: "Parse .github/workflows/ci.yml and assert a web-app route-render job exists, invokes the Playwright route-smoke harness, is path-filtered on leafcutter-web/**, and does NOT set continue-on-error (blocking)."
  - name: test_route_smoke_harness_iterates_all_routes
    target_dir: leafcutter-web/tests/
    framework: playwright
    type: e2e
    description: "The route-smoke harness enumerates the app's routes (from leafcutter-web/app/**, including /about) and asserts each loads with HTTP 200 and no console/render error; a route returning non-200 or emitting a console error fails the run (non-zero exit)."
