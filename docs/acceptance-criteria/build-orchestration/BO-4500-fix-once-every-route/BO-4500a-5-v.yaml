criteria: |
  Given the commit agent is dispatched with a list of files and a caller-written message file,
  When it carries out the dispatch,
  Then it calls the shared commit step once with that list and that file, unchanged,
  And its reply contains the step's answer exactly as the step printed it, with no key added,
    removed or reworded.

  Given the commit agent is dispatched with a list of files and no message,
  When it carries out the dispatch,
  Then it writes a message to a file following the project's commit-message rules before
    calling the step, and passes that file.

  Given the step answers hook_failed for a judging check,
  When the commit agent continues,
  Then it applies the autofix judgement the precommit-autofix routing and BO-210 / BO-3800
    assign for that check before any second call of the step,
  And it never edits the check's configuration, and never retries by any route other than a
    fresh call of the step.

  Given the commit agent's instructions after this change,
  When they are read,
  Then they contain no command that stages files, records a commit, ends other processes or
    uses the shared stash, and no literal model name,
  And they state that a caller-supplied message, trailer included, is passed to the step as
    given.

  Given the commit agent's recipe before this change and the shared step after it,
  When the migration is reviewed,
  Then its stage-by-name rule and its confirmation gate for a person are kept,
  And the regression tests for KI-BO-20260914-commit-agent-rewrites-co-author-trailer and
    KI-BO-20260925-commit-agent-pkill-kills-parallel-test-runs run against the migrated agent and
    the shared step and pass.
