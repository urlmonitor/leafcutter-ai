id: BO-400b
title: "A dedicated script manages all ticket status transitions"
component: build-orchestration
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given ticket lifecycle state changes happen at predictable points
    (drive start, drive completion, force-reset after failure),
  When any agent or supervisor needs to change a ticket's status,
  Then it invokes a single script that performs the update atomically,
  And the script validates the transition before applying it,
  And the script handles frontmatter parsing and serialization
    without corrupting other fields,
  So that status changes are consistent, auditable, and testable
    independent of LLM behavior.
