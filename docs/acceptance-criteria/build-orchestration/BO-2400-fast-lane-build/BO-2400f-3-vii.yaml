id: BO-2400f-3-vii
components:
  - build_orchestration
title: "The fast lane works inside the workspace it made: every step runs that workspace's own scripts, and a wrong-version step's reply is read even when log lines come before it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane build whose workspace was made and is ready, and whose step
    agents run from a working directory that is not that workspace (for example
    the parent project that holds its own, different install),
  When the scratch-item step and the knowledge-routing stage step are dispatched,
  Then each command names its script by the workspace's absolute path (the
    workspace path plus the install's output root), quoted, never by a path
    relative to the agent's working directory,
  And so each runs the workspace's own installed script, not the parent's.

  Given the same build reaches the Wrong-Version Runs phase,
  When a wrong-version step (recover, list or finish) replies with stdout that
    carries the script's log line(s) ahead of its one JSON object -- for example
    "base ref HEAD: 0 names declared, 0 derived" followed by
    {"owed": [], "error": null},
  Then the step's result is that JSON object, taken from the last line of stdout
    that parses as a JSON object,
  And the build continues exactly as it would have for a clean reply.

  Given a wrong-version step whose stdout holds no line that parses as a JSON object,
  When the step's reply is read,
  Then the run halts before commit with no pull request opened,
  And the halt message quotes the reply that was received, never the bare word null.

  And the bug symptom ("A /fast-lane-build FIN-100c-15 run (wf_d4381e19-613, 2026-10-24) halted at the Wrong-Version Runs 'fastlane-wv-list' step with 'Wrong-version list step did not pass: null' although wrong_version_writer.py list printed a valid {"owed": [], "error": null}; and the scratch and knowledge-routing steps ran the PARENT install's scripts (C:/Users/Hendrik/Code/leafcutter/.leafcutter/...) instead of the workspace's, because the agents' cwd is the parent, not the workspace") must not occur.
