notes: |
  ONE VOCABULARY IS WHAT MAKES THE COMPARISON MEAN ANYTHING. Two sides that
  each hold a set of strings can always be diffed; the result is only
  informative if both sets are drawn from the same namespace and validated the
  same way. Sharing the resolver — not re-implementing id validation on the
  design side — is the mechanism. A private design-side resolver would drift
  and the drift would present as phantom differences nobody can explain.

  DIRECTION MATTERS AND SYMMETRY DESTROYS IT. In-design-not-on-page means an
  incomplete build. On-page-not-in-design means either an undocumented addition
  or a stale design. Those have different remedies and different owners; a
  symmetric set difference collapses two conversations into one number. This
  restates GE-124f-2's requirement from the design side so the design side
  cannot be built in a way that makes the distinction impossible — for example
  by emitting an unordered deduplicated bag with no provenance.

  SILENTLY DROPPED IS THE FAILURE MODE THAT LOOKS LIKE SUCCESS. An id the
  comparison cannot place — unresolvable, malformed, one-sided — must appear in
  the result. An implementation that filters such ids out reports a clean
  comparison for a screen it could not actually compare, which is the exact
  shape of phantom-done.

  AND STILL NOT COVERAGE — THE FOURTH SCENARIO IS THE LIMIT THAT CARRIES OVER
  FROM GE-124g. A pin is on-screen-presence evidence. An annotated mockup may
  never read as proof of anything beyond "this screen shows this". It is
  written as a scenario rather than left in prose precisely so it survives as
  something a test can hold, because the pressure to count pins as coverage
  will be constant the moment the numbers exist.
