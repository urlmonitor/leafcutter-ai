notes: |
  The L0's SHARED RESOLVER constraint, made testable. Three private copies
  drift, and the user-visible symptom of drift is that the same id is accepted
  by one check and rejected by another — which destroys the reason to trust any
  of them.

  Written as an observable agreement between the three checks rather than as
  "they import the same module", so the test cannot be discharged by a grep for
  an import line. A structural test would pass on a copy that imports the shared
  resolver and then overrides its answer; the agreement test would not.

  The second scenario catches the other drift shape: a resolver with its own
  cache or its own snapshot of the store, which agrees today and disagrees after
  the next authoring run.

  IT-PO ENRICHMENT NOTE (2026-08-25) — THIS IS THE LARGEST HIDDEN ITEM IN THE
  TREE. The mock-data invariant records the resolver path as settled, and the L0
  presents sharing it as a constraint rather than as work. In the working tree
  it is work: ac_coverage_resolver.py has no id-resolution function, GE-117 and
  GE-111 each resolve for themselves, and _ac_store_index is the index that
  actually exists. Complexity raised from S to M on that basis. If GE-111's and
  GE-117's own trees are built before this one, they will each have shipped a
  private path that this AC then has to unpick — worth sequencing deliberately.
