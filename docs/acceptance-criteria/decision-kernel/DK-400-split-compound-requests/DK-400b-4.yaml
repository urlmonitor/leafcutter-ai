criteria: |
  Given a reader of the kernel's reference entry on splits,
  When they look up which requests can be split,
  Then it lists the three kinds that can be split, a goal, a research request with several needs
    and a decision question, each with one example,
  And it states that a split is found either when the run's root is routed or at a work item below
    the root, and that both reach the same split gate,
  And it states that a research request's parts run as research and return findings, not decision
    records.
