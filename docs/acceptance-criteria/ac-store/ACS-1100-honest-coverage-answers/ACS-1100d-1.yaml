criteria: |
  Given a verifier whose only input is an earlier answer that covered 40 records
    against a total of 180,
  When the verifier produces its own result,
  Then that result carries the coverage it inherited — 40 of 180 — alongside its own
    verdict, and names the upstream answer the figure came from,
  And a verifier that consumes two answers, one covering 40 of 180 and one covering
    180 of 180, carries both figures through rather than reporting only the larger,
  And the figure survives the store's two real consumption hops unchanged: the store
    scan's answer is consumed as JSON by the prioritiser across a subprocess boundary,
    and the prioritiser's merged output is consumed by the AC build selector, so the
    selector acts on a figure that still reads 40 of 180,
  And crossing a serialisation boundary does not drop the figure: an answer handed over
    as JSON carries its total, its covered count and its method in that payload, so a
    consumer that only ever sees the serialised form can still read what it inherited,
  And a verifier result that states a verdict with no inherited coverage figure is
    itself withheld and reported as a dropped-coverage halt that names the upstream
    answer whose figure was lost — the same withhold-rather-than-pass posture as
    ACS-1100c-1, raised by this criterion on a MISSING figure, which is not a trigger
    ACS-1100c-1 recognises (its only trigger is an arithmetic shortfall).
