  - path: docs/acceptance-criteria/agent-registry/AR-300-granted-abilities-arrive/AR-300.yaml
    relationship: related
    status: exists
    relevance: >-
      FENCED, AND THE MIRROR IMAGE. AR-300 promises that an ability you GRANT
      reaches the specialist. This goal promises that an ability the
      specialist is TOLD TO USE is one it was granted and that exists, and that
      the build's account of a specialist's setup is coherent and noise-free.
      AR-300 is work_status done; it cannot host new todo children without
      becoming a done composite with unfinished work (the ACD-400a defect
