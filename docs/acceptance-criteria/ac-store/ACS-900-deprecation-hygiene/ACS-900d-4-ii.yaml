id: ACS-900d-4-ii
components:
  - ac_store
  - commit_guardian
readiness: approved
priority: high
title: "Retirement does not exempt a record from the structural rules"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
criteria: |
  Given the AC store contains no record with id ZZ-999,
    And a commit stages a record X-1 with status "superseded_by",
    superseded_by: [ZZ-999], and work_status "done",
  When the AC-store commit gates run on that commit,
  Then the commit is refused with a message naming X-1 and the missing
    successor id ZZ-999,
  And X-1 is not treated as retired, so the done-proof gate also reports X-1's
    missing covering test;
  Given instead a commit stages a record X-1 with status "superseded_by" and
    superseded_by: [] (empty list) or superseded_by null,
  When the AC-store commit gates run on that commit,
  Then the commit is refused with a message naming X-1 and stating that a
    superseded record must name at least one successor;
  Given instead X-1 is correctly retired (superseded_by: [AR-400c-1], an
    existing record) but its parent's covered_by list does not name X-1,
  When the AC-store commit gates run on that commit,
  Then the commit is refused for the missing parent-to-child link exactly as
    it would be for an active record,
  And a retired record whose fields do not match the AC schema shape (for
    example work_status "finished") is refused exactly as an active one is.
depends_on: [ACS-900d-4]
