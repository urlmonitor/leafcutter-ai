id: BO-4000g
title: "A repository reference that names a file is answered from the folder holding it, so a single-ticket build finds its repository as surely as an epic build does"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target:
  - code
  - pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a repository with a linked worktree that is on its own branch
  And a ticket `.md` file tracked inside that linked worktree
  And the repository-facts mechanism (`worktree_repo_facts.py`) is run from a working
    directory that is not inside any git checkout — as a phase agent runs it in the dev
    self-hosting layout
  When the ticket FILE is handed to the mechanism as its repository reference — as
    `base`'s starting reference, as `facts`' `--reference` while asking about the linked
    worktree, and as `branch-standing`'s `--repo` while asking about the worktree's branch
  Then each answer is the same answer the mechanism gives when the reference is the folder
    that holds that ticket file
  And `base` names the repository's real main checkout and worktree base, not null
  And `facts` reports `same_repository: true` for the linked worktree
  And `branch-standing` reports the existing branch as existing
  And the bug symptom ("/build-feature on a single ticket always aborts with worktree-base-unavailable: build-feature.js anchors its repo-facts calls on the ticket FILE path (repoAnchor = absolute target), and `worktree_repo_facts.py base <ticket .md file>` returns {main_checkout: null, worktree_base: null}; `facts --reference <file>` yields same_repository null (so an existing ticket worktree is never reused) and `branch-standing --repo <file>` silently reports the branch absent (skipping BO-4000b's stale-branch refusals). Verified live 2026-10-02: base with the ticket's folder works, with the file it returns all nulls.") must not occur.

  Given the same repository and the same working directory
  When `facts` is asked about the ticket file ITSELF as its candidate path
  Then it still reports that path as existing and as not the top-level directory of a
    checkout, with `same_repository` and `branch` null
  And it never answers about the folder holding the file in the file's place.

  Given a reference that is a directory, or a path that does not exist at all
  When any of the three subcommands is asked with it
  Then the answer is exactly the answer it gave before this record
  And a path that does not exist is never replaced by its nearest existing parent, so a
    location that is not there yet is not answered for as if it were whichever
    repository contains its parent
  And a file that lies outside every repository still yields the null answers, so no
    location that is genuinely not a checkout is reported as one.

  Given /build-feature is started for a single ticket whose resolved target is the
    absolute path of the ticket's `.md` file
  And a linked worktree for that ticket already exists, belongs to this repository, sits
    at the location the workflow names, and is on the ticket's own branch
  When the worktree step runs from a working directory that is not inside any git checkout
  Then that worktree is recognised as this repository's own and reused
  And the run proceeds to dispatch phase agents
  And it does not stop with `worktree-base-unavailable`
  And the absent, foreign, occupied and stale-branch refusals of BO-4000b and BO-4000c
    still fire on their own terms, evaluated against answers that are now correct.
