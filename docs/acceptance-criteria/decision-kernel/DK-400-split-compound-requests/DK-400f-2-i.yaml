    reached its budget stop'' for a research part), blocked ''its decision ended blocked'', capability_gap ''its
    decision hit a capability gap'', cancelled ''it was cancelled''. A not-run dependant names the stop reason in
    words: budget stop, blocked, capability gap, cancelled.'
  - A part that ran never gets a 'not run' line, and the report states the run's outcome as partial.
