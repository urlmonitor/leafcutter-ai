test_rationale: "Every clause here is about what a check DOES on a real repository, and the observed defect is invisible to a direct-import unit test of the shared source: a green test of the helper says nothing about whether the two checks actually call it, and calling it is the entire last criterion. The tests therefore execute the deployed check as a separate process against a real git repository standing in the merge state, and assert on exit status and output text only — the standard CLAUDE.md sets in 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep'. They live in unit_tests/portability/ alongside GE-120c-1's out-of-process harness rather than in unit_tests/commit_guardian/, whose tests import the check modules from the source tree and so cannot observe the deployed behaviour."
