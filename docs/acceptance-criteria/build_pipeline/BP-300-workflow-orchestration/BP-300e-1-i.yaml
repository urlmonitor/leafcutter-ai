notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with an
  input containing a deeply nested object plus trailing prose, asserting the returned
  value is the full top-level object (depth preserved) — proving the balanced-brace
  scanner counts nesting depth rather than stopping at the first '}'.
