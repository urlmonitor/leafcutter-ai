assigned_agent: frontend-coder
estimated_complexity: M
change_target:
- code
- ui
risk_surface: internal
it_requirements:
- 'One popstate listener restores the view: the entry''s URL is the authority for what is shown (a path
  of exactly /flows is the finder, UXP-617-2-i; otherwise the flow and the ?step= drawer), and the entry''s
  {crumbs, filters} under ''leafcutter:flows-view'' restore crumbs and filters. An entry with no stored
  state falls back as UXP-591-5''s contract states.'
- The 'Outside the current filters' notice is derived on restore from the entry flow (crumbs[0]) and the
  restored filters (UXP-591-5-iii), never stored separately, so it cannot disagree with them.
- 'Restoring an entry writes no history: no replace or push in reaction to a pop.'
- Back onto an unknown flow id restores the not-found state (notice, empty breadcrumb, no flow) with no
  fallback flow.
- The listener is registered once and removed on unmount; a pop to an entry outside the Flows view is
  left to the App Router.
- 'Real-browser proof (history length under the App Router, Back and Forward without a reload) is deferred
  with the Playwright harness (owner decision: not in scope); until then the jsdom vitest tests on window.history
  are the proof.'
delivers_to: null
expects_from:
- ac_id: UXP-591-5
  contract: Pushed entries carrying {crumbs, filters} under 'leafcutter:flows-view', plus the no-stored-state
    fallback rule.
- ac_id: UXP-591-4
  contract: Drawer and filter replaces that keep each entry's URL (?step=) and stored state current.
- ac_id: UXP-591-5-iii
  contract: 'scopeNotice(entryFlow, filters) -> {title: ''Outside the current filters'', detail: string}
    | null.'
- ac_id: UXP-591-1-ii
  contract: 'The not-found mode {requestedId, noticeVariant, crumbs: [], filters real/user/all} restorable
    for an entry whose id is unknown.'
test_spec:
- name: from a bookmarked /flows/leafcutter/deliver-a-feature and two drills, Back twice and Forward once
    show how-acs-are-built, deliver-a-feature, then how-acs-are-built with their breadcrumbs
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: criterion
  must_catch:
  - the second Back shows the finder or a default flow instead of deliver-a-feature
- name: each entry returns with its ?step= drawer and its filters, and a filter-rewritten entry returns
    with its 'Outside the current filters' notice
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: seam
  must_catch:
  - Back keeps the current filters
  - the notice is not restored with the filters
- name: Back onto /flows/leafcutter/flow-render-pipline shows 'Flow not found' again with no flow drawn
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: failure
  must_catch:
  - Back onto the unknown id draws a flow
- name: 'a pop writes no history: history.length and the stored entry state are unchanged after Back and
    Forward'
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: boundary
  must_catch:
  - restoring filters on popstate calls replaceState
  - the restore pushes the entry again
- name: drill-and-return, drawer-in-history and filter-replace sessions replay record by record
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: unit
  angle: real_artifact
  description: 'Back and forward records of docs/product-truth/mock-data/leafcutter/atlas-flows.mock.json:
    address_bar, rendered_flow, crumbs, drawer, filters, scope_notice.'
test_rationale: 'Restore bugs show as extra history writes or a stale filter set, so both are asserted
  on window.history in jsdom. Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx
  vitest run` (180 s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks cannot
  read vitest tests yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was.
  No Playwright: the harness is deferred by the owner.'
test_required: true
declares_side_effect: false
