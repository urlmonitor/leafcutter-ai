id: TQ-500g-1-x
components:
  - testing_quality
  - build_orchestration
title: "A wrong version whose test entries declare no in-scope file may alter only the non-test files the work itself changed"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a piece of work on requirement TQ-9101 whose base ref is the state
    before the work began, and which, committed or not, has changed
    refresh_config.py (the refresh gate now reads
    "if refresh_due and retry_due"), added retry_policy.py, changed
    tests/test_refresh_config.py and deleted legacy_refresh.py, and has not
    touched settings.py, an ordinary source file of the repository,
    and the test entries guarding TQ-9101 owe four named wrong versions —
      "drop the retry_due condition", whose entry declares in-scope files
        settings.py and refresh_config.py,
      "retry only once", named on two entries, one declaring in-scope file
        settings.py and the other declaring none,
      "ignore retry_due" and "refresh from the settings file", whose
        entries declare no in-scope file at all,
  When the writer is asked to list what is owed for TQ-9101 with that base
    ref,
  Then "drop the retry_due condition" is listed with exactly settings.py and
      refresh_config.py, the files its entry declares, although the work did
      not touch settings.py and did add retry_policy.py,
    And "retry only once" is listed with exactly settings.py; a file declared
      on any entry naming it means its scope is declared, and nothing is
      derived for it,
    And "ignore retry_due" and "refresh from the settings file" are each
      listed with exactly refresh_config.py and retry_policy.py, the non-test
      files the work changed or added; settings.py, which the work did not
      touch, is not listed for either, tests/test_refresh_config.py, which
      the work changed, is not listed for either, and legacy_refresh.py,
      which the work deleted, is not listed for either,
    And the list shows, next to each name, whether its files were declared
      by the test entries or derived from the work's changes: "declared" for
      "drop the retry_due condition" and "retry only once", "derived" for
      "ignore retry_due" and "refresh from the settings file",
    And when the preparer then replies with a replacement in
      refresh_config.py for "ignore retry_due" and a replacement in
      settings.py for "refresh from the settings file", the write step
      records "ignore retry_due" as prepared and records "refresh from the
      settings file" as "could not be prepared" with the reason
      "settings.py is not in scope for \"refresh from the settings file\"",
      and makes no altered copy for that name,
    And a replacement for a name with derived scope that is aimed at a test
      file, at a path outside the repository or at a path inside the
      version-control folder is refused exactly as it is for a name with
      declared scope,
    And for the same requirement ids, test root and base ref, the list, the
      write step and the runner give every name the same in-scope files: the
      write step accepts for a name exactly the files the list shows for it,
      and none of the three takes a name's files from the route, from the
      preparer's reply or from an earlier list,
    And listing changes no file in the working tree.

  Given the same test entries guarding TQ-9101, and a piece of work whose
    only change relative to its base ref is to tests/test_refresh_config.py,
  When the writer lists what is owed for TQ-9101 and the work's wrong-version
    runs are made,
  Then "ignore retry_due" and "refresh from the settings file" are each
      listed with no file at all, marked "derived",
    And "drop the retry_due condition" is still listed with exactly
      settings.py and refresh_config.py, marked "declared",
    And a replacement in refresh_config.py for "ignore retry_due" is
      recorded as "could not be prepared" because refresh_config.py is not in
      scope for "ignore retry_due", so the work does not go on to commit; an
      empty derived scope never widens to the whole repository and never
      lets the work through as having nothing owed,
    And when the files the work changed cannot be worked out at all,
      because the base ref does not exist, the list stops with an error
      naming the base ref and lists no name, rather than giving the unscoped
      names an empty scope or the whole repository.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-ix
