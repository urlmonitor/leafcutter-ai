title: "When in doubt, a human still decides"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Uncertain calls and blockers are parked for human review -- never auto-acted on.

  The platform only acts on its own when it is confident. Anything below a
  confidence floor, and anything flagged as a blocker, is set aside for a person
  to handle through the normal feedback review. This is the safe escape hatch:
  when the system is unsure, it defers to you instead of guessing, so automation
  never makes a low-confidence change on its own.
