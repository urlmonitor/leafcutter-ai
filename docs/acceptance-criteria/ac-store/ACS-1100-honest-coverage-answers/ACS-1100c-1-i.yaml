notes: |
  The one genuine edge case in this L1, and the one most likely to be mis-implemented:
  the store's standard convention is fail-open-on-INTERNAL-ERROR (crash, unreadable
  file, parse failure => exit 0 with a stderr warning), and it is orthogonal to the
  always-block-on-a-REAL-violation posture of ACS-1100c-1. Collapsing the two would
  turn every real gap into a warning and reinstate the defect.

  The third category matters: silently folding an unreadable record into either the
  in-scope count or the declared exclusions would make the arithmetic reconcile and
  produce a clean answer over a measurement that partly failed.

  ==========================================================================
  THE BUCKET IS NOW CAPPED AND ITS BOUNDARY IS NOW EXPLICIT (2026-08-13, expert review).
  ==========================================================================
  As first written the third category had no cap and no interaction with ACS-1100d-2,
  so an answer could route an unbounded number of records into it and still reach a
  downstream all-clear. Two clauses close that: the count must be named, and any
  non-zero count forbids an unqualified all-clear downstream.

  THE SCHEMA-INVALID EXCLUSION IS LOAD-BEARING. A large standing backlog of records
  fails schema validation today. Routing schema-invalid records into the
  could-not-classify bucket would permanently label EVERY answer about the store a
  broken measurement and make an unqualified all-clear structurally unreachable for as
  long as the backlog exists — the cap would go from a signal to constant noise, and
  would be switched off. Unreadable and unparseable only. A record that parses is
  classified, whatever its validation result.

  MEASUREMENT NOTE — the review that prompted this clause cited 641 failing files. That
  figure could NOT be reproduced. Running validate_ac_schema.py over every YAML file
  under docs/acceptance-criteria on 2026-08-13 reported 277 failing files out of 2,784
  (overwhelmingly `it_requirements` given as a list of strings where the strict schema
  wants an object). The criteria carry the measured figure, not the cited one. The
  reviewer's ARGUMENT is unaffected and correct — 277 is still ~10% of the store, more
  than enough to poison every answer permanently — but the number was wrong and should
  not be propagated.

  The whole-source clause exists because the worst real instance is not a single bad
  record but a measurement that fails entirely and returns an empty mapping, which today
  is indistinguishable from a legitimate "nothing found".
