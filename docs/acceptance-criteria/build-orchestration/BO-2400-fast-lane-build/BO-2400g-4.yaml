    description: "After a review stop, every requirement in the resolved set reads as not-started again in the real on-disk store — the existing release path was reused, not bypassed."
  - name: test_stop_message_names_the_finding_the_requirement_and_the_file
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The operator-visible result of a stopped run contains the finding text, the requirement id and the file path. A bare 'review failed' fails this."
  - name: test_review_stop_is_reached_on_the_real_command_surface
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT: drive /fast-lane-build's real workflow end to end with a planted serious finding and assert from git state and the store that neither the commit nor the pull request step ran. A stop implemented in a helper that the workflow never consults passes every other test here."
test_rationale: "A review that reports and proceeds is not a gate, and a gate that blocks on everything is a lane nobody will use — the two failure modes sit on either side of this AC, so the stop case and the advisory case must be asserted as a pair in the same harness; each alone is passed by one of the two broken implementations. The stop is asserted through observable git and store state rather than through a returned status value, because the specific defect this repo has already shipped is a gate whose result was computed and then not consumed in control flow (CLAUDE.md, fast-lane precedent 2026-07-22) — a returned 'blocked' that the workflow ignores would satisfy a status-level assertion while the commit lands anyway. The store assertion is separate from the git assertion because stopping without releasing the claim leaves the requirements permanently unbuildable, which is a worse outcome than the finding that caused the stop."
