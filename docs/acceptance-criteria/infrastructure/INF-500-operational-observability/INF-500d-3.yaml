  - name: test_every_emitted_reason_is_a_vocabulary_member_and_every_script_detected_reason_is_emitted
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Aggregates the reason parts of every failure run in this file. Every emitted reason is a member of the vocabulary read from the copied layout; every id whose detected_by is script is emitted by at least one run; written-uncited is never emitted by the script (it is decided by the caller); no failure run ended in a Traceback; and facility-unavailable, which both the script (PyYAML, categories file) and the caller can decide, is emitted by the script paths."
    proves_clause: "the marker names the reason, drawn from a closed set that distinguishes at minimum these five cases:"
    code_file: templates/scripts/feedback/submit_feedback.py
    must_catch:
