assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - Proposed options and criteria are excluded from research requests and from every Jev batch until
    a human approval is recorded; only usable (supplied or approved) items are quoted to Jev.
  - A host can never approve what it generated; generated items must arrive as proposals.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_proposed_criteria_go_to_human_approval_before_jev
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_proposed_criteria_go_to_human_approval_before_jev):
      proposals go to the human approval question with no Jev call'
    covers:
      - DK-600b-1
  - name: test_jev_decides_against_approved_criteria_only
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_jev_decides_against_approved_criteria_only):
      after approve-all exactly the approved criteria reach the assessment'
    covers:
      - DK-600b-1
  - name: test_generated_options_are_proposals_until_approved
    target_dir: tests/kernel/capabilities/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/capabilities/test_decision_criteria_proposals.py::TestOptionsAndCriteriaProposals::test_generated_options_are_proposals_until_approved):
      generated options are subjects of the approval question, nothing assessed'
    covers:
      - DK-600b-1
  - name: test_a_host_cannot_approve_the_proposals_it_generated
    target_dir: tests/kernel/interaction/
    framework: unittest
    type: integration
    angle: failure
    description: 'EXISTS (tests/kernel/interaction/test_criteria_approval.py::TestStructuredApproval::test_a_host_cannot_approve_the_proposals_it_generated):
      a host answer to the approval question is rejected'
    covers:
