notes: |
  Mock-mode hardening follow-up (independent code review finding H-3). The runtime override must
  be default-deny in production: the allow/deny defaults to the safe state so an untrusted visitor
  cannot flip a live deployment to fixtures via ?mock=1. Complements the production LOCK work in
  UXP-553-1 (see UXP-608-2 for the lock>allow precedence). Criteria sharpened to Gherkin by BA;
  L3 edge cases cover opt-in-honored, lock-precedence, and the dev/preview boundary. IT-PO to enrich.
