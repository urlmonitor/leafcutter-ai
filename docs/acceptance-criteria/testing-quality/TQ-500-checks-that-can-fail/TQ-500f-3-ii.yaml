id: TQ-500f-3-ii
components:
  - testing_quality
  - build_orchestration
title: "The /build-feature path runs the same red-baseline reader the fast lane uses, and does not take the test writer's word for it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given two tickets driven through /build-feature, each with a newly added
    test covering the same requirement, whose test requirements entry
    carries must_catch: ["revert the fix"],
      K1: the test writer's sign-off reports its red baseline as red, and the
          test's only failure is
          "ImportError: cannot import name 'refresh_config_v2'",
      K2: the test writer's sign-off reports red, and the test fails with
          "AssertionError: expected 1 refresh call, got 3",
    and a third ticket K3 that has no source requirement (no source_ac),
  When the ticket reaches the step between the test writer and the coder,
  Then the /build-feature path runs the same red-baseline reader the fast
      lane runs, over the same inputs (the requirement ids and the test
      root), before the coder is dispatched,
    And K1 does not reach the coder: the drive stops that ticket with the
      reader's report naming the test and the absence-only red, even though
      the test writer's own sign-off said red,
    And K2 reaches the coder as it does today,
    And for K1 and K2, which have a source requirement, the full shared reader
      applies, including every halt reason it already has in the fast lane
      (for example no newly added test tagged as covering the requirement),
    And K3 records "red-baseline reader not applicable: no source requirement"
      and continues to the coder; it is never recorded as verified,
    And whenever the reader runs, for the same tests and run outcomes, the
      /build-feature verdict and the fast-lane verdict are identical,
    And both lanes start the reader with the same command form.

  Given a fourth ticket K4, with a source requirement, whose newly added
    covering tests already pass before the coder runs, because an earlier ticket
    delivered the behaviour they test,
  When K4 reaches the step between the test writer and the coder,
  Then the reader's verdict is the one the fast lane gives for the same tests,
    And the drive stops K4 before the coder with the halt reason
      "green_at_baseline",
    And the halt lists every newly added covering test that was green,
    And the halt says to set the coder phase to not needed, with a comment
      naming the commit that delivered the behaviour,
    And the drive never sets the coder phase to not needed itself, and never
      lets K4 reach the coder on the ground that its tests are already green.

  Given K2's reader verdict is a pass,
  When the gate between the test writer and the coder completes,
  Then the reader writes one record of its own verdict into K2's ticket
    frontmatter, holding: that it passed, when it was recorded, the commit the
    ticket's worktree was at, the source requirement ids it ran for, and each
    test it found red (file and test name),
    And the test writer never writes that record,
    And if the record cannot be written, the pass still stands and the drive's
      recorded outcome states that no record was written and why.

  Given K2's drive stopped after its coder had started (for example a handoff,
    a blocker, a retry cap or a crash), so its coder phase is still needed and
    the coder's uncommitted code now makes its newly added tests pass,
  When K2 is resumed and reaches the step before the coder again,
  Then the drive reuses the reader's recorded pass, without running the tests
    again, only when all of these hold:
      the record exists,
      it was made for the same source requirement ids K2 carries now,
      every test it recorded as red is still among K2's newly added tests tagged
        as covering that requirement (tests added since may be present too),
    And a reused pass is reported as reused, naming when it was recorded and the
      commit it was recorded at,
    And in every other case (no record, different source requirement ids, or a
      recorded red test that was renamed or removed) the reader runs exactly as
      it did on the first drive, and its verdict decides,
    And the test writer's red-baseline claim in its sign-off never stands in for
      the reader's record: with no record, the reader runs.
