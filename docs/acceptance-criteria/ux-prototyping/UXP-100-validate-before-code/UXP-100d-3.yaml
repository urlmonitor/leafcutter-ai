id: UXP-100d-3
title: "Handoff artifact includes component version references for drift detection"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the approved prototype uses "data-table" from the component library
    catalog at version "v2" (with sortable columns and pagination),
  When the handoff artifact is produced,
  Then each component reference in the artifact includes the catalog version
    that was used at approval time (e.g. "data-table@v2")
  And if the component library catalog is updated after approval (e.g.
    "data-table" moves to "v3" with breaking layout changes), the handoff
    artifact retains the "v2" reference
  And the frontend-coder agent can detect the version mismatch and flag it
    for user review before proceeding
