id: BO-400b-2
title: "Script validates status transitions against an allow-list"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the valid status transitions are:
    - todo -> in_progress (normal drive start)
    - in_progress -> done (all agents complete)
    - in_progress -> todo (drive abandoned, ticket returned to backlog)
    - todo -> done (requires --force flag: manual override)
    - done -> todo (requires --force flag: reopen a completed ticket)
    - in_progress -> in_progress (idempotent no-op, exits 0)
    - todo -> todo (idempotent no-op, exits 0)
    - done -> done (idempotent no-op, exits 0),
  When the script is invoked with a transition NOT in this allow-list
    (e.g., --ticket T.md --status todo when current status is done)
    and the --force flag is NOT provided,
  Then the script exits with code 1
  And it prints an error message:
    "Invalid transition: done -> todo (use --force to override)"
  And the ticket file is NOT modified.
depends_on: [BO-400b, BO-400b-1]
