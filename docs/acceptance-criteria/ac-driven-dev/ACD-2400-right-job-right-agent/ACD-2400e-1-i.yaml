notes: |
  Makes ACD-2400e-1 durable: without it the next profile drifts the same way. Scope is
  registry-wide, so IT-PO should measure how many agents are listed today and ship it
  advisory first (ADR-026 warn-before-required). If the user wants the scope limited to
  the planner, this L3 can be dropped - see open questions.
