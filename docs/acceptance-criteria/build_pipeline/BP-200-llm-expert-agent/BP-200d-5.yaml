title: "Prompt-audit skill supports both single-file and batch audit invocation"
component: build_pipeline
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the file templates/skills/prompt-audit/SKILL.md exists,
  When the "Running an Audit" section is read,
  Then it documents a single-file audit workflow:
    1. Read the target file
    2. Apply each check (1 through 6) in order
    3. Collect violations and assemble the report
  And it documents a batch audit workflow:
    1. List all template files in the target directory
    2. Run the single-file audit for each path
    3. Sort the batch by total_errors descending, then total_warnings descending
  And it documents that individual checks can be invoked in isolation
    returning a partial report with only the relevant fields populated
