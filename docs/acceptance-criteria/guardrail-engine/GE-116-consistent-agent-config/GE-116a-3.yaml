title: "Read-only agent that does not require verification is allowed to commit"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a staged agent definition whose declared abilities include neither the
    ability to edit files nor the ability to create files (read-and-inspect
    only, such as Read and Bash),
  And that agent's settings declare that it does not require verification of its
    changes (requires_verification is false),
  When the commit is attempted,
  Then the consistency guard raises no objection for that agent definition,
  And the commit proceeds as far as this guard is concerned.
