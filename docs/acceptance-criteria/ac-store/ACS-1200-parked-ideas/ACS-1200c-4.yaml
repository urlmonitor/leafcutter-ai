notes: |
  Without this, the marker becomes a universal mute button: any tree blocked for
  a genuinely missing back-link can be unblocked by pasting two fields onto its
  parent, and the safeguard is gone in a way that looks like compliance. The
  marker means "not broken down yet", so a record with L2 descendants, or one
  already approved for build, is asserting two contradictory things at once and
  the contradiction is refused rather than resolved silently.

  The accepted case is stated explicitly so the rule cannot be implemented as a
  blanket refusal that also blocks legitimate parking.

  ACS-1200a-2-i covers the neighbouring containment question (the marker is not
  inherited); this one covers where the marker may validly be placed at all.
