id: ACS-1300a-4
components:
  - ac_store
title: "Someone who did not build the repair can preview it, run it, and read what it did"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a reader who has not run the repair before and has only the how-to guide,
  And a working copy of the real store and the real test tree,
  When the reader follows the guide from its first step,
  Then they produce the preview report without having to read the tool's source,
  And from that report alone they can say which records would gain a coverage entry,
    which would lose one, which were examined and found already correct, and which the
    run abstained on and why,
  And the store is byte-for-byte unchanged after the preview step, as the guide states
    it will be,
  And following the guide's next step they run the repair and can confirm, from the
    resulting report and from the files on disk, exactly which records changed,
  And the guide states that the repair never changes a record's finished state and names
    where that decision is made instead,
  And the guide states what an abstention means and what the reader is expected to do
    about one, so an abstention is actionable rather than merely visible.
