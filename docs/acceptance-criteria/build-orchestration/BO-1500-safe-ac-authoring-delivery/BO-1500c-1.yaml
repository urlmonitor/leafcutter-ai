criteria: |
  Given the authoring pipeline has completed all stages on the authoring branch
    and the user gives final approval,
  When the workflow performs delivery,
  Then it pushes the authoring branch to origin,
  And it opens a pull request whose base is main and whose head is the
    authoring branch,
  And the user is not asked to create the branch or open the pull request by hand,
  And the delivery reuses the existing worktree-and-pull-request machinery rather
    than a bespoke branch/PR routine built only for authoring.
