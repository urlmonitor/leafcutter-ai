    ac_id: TQ-500g-1-xiii
    contract: >-
      _wvr_trace.run_traced(nodes, files) -> per test identity {repo-relative path: set[int]} plus the set
      of untraceable files; _wvr_effect.changed_lines(as_written: bytes, altered: bytes) -> set[int] and
      reached(...) -> "reached" | "not reached" | "not traceable".
expects_from:
  - ac_id: TQ-500g-1-i
    contract: >-
      The runner's baseline run on the code as written (one pytest run over the in-scope tests, the kind
      plugin in the child) and the per-test result rows {test, wrong_version, result, blocking, detail}
      with the unfinished set of _wvr_verdict.
