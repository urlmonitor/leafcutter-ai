roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC store that still contains at least one record with schema_version < 2,
  When the store-wide schema validation runs,
  Then additionalProperties is NOT tightened -- records carrying either the legacy
    or the new shape validate,
  And zero records in the store are rejected by that run.
