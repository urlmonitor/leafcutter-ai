notes: |
  THIS RECORD DISCHARGES THE reference-doc TRIGGER FOR THE WHOLE GOAL, NOT JUST
  FOR GE-125d. All four L1s under GE-125 carry the trigger and each genuinely
  needs it, because the written description of when this check looks less is
  wrong after any one of them lands. The goal's own instruction is that they be
  satisfied by a SINGLE consolidated rewrite rather than four documents, and
  that this be said at L2 — which is what this record is.

  CONCURRENCY WARNING FOR WHOEVER READS THIS NEXT. GE-125a, GE-125b and GE-125c
  were decomposed at the same time as GE-125d by separate authors who could not
  see each other's output. If any of them also authored a documentation AC for
  the same reference material, that is the four-documents outcome the goal
  forbids, and the correct repair is to keep ONE record and supersede the others
  rather than to write one section per AC. This record is deliberately written
  so that it can be the survivor: its first arm asserts a property of the whole
  reference material ("exactly one section", "no other document"), not a
  property of GE-125d's slice of it.

  THE SECOND ARM IS WHY THIS IS NOT AN ORDINARY DOCUMENTATION AC. Comparing the
  section against the check's own answer makes the documentation mechanically
  checkable rather than reviewed by eye, and it is only possible because
  GE-125d-4 requires the check to be able to state its reductions at all. The
  pair is the point: the answer keeps the section honest, and the section makes
  the answer findable by someone who does not yet know the check can be asked.

  DO NOT WRITE THE THIRD ARM'S CAVEAT AS A ROADMAP NOTE. The section describes
  behaviour in force. If a narrowing is specified and unbuilt, the section says
  nothing about it; a "coming soon" line in reference material about a security
  boundary is read as a description of the boundary by everyone in a hurry.

  IT-PO NOTE, 2026-08-24 — THE ADJUDICATION RECORDED IN THE L0 IS SETTLED, AND
  THE PREMISE CORRECTION IS CONFIRMED. All four documentation records are kept;
  none is superseded. They are four content requirements for one passage, not
  four claims on one artifact. The premise correction holds:
  templates/skills/security-scanner/SKILL.md was read on 2026-08-24 and contains
  no description of the reduced scrutiny at all, so the reference is wrong by
  OMISSION and the first record built must create the passage. That is carried
  above as a sequencing it_requirement and deliberately NOT as depends_on edges
  between the four, because the coupling is temporary and an edge would be
  permanent.
