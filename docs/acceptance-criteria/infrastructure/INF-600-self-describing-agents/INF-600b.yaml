amended_by:
- reason: third-l2-child-adopted-card-made-static
  by: business-analyst
  at: '2026-10-09'
  note: >-
    ADDITIVE ONLY — covered_by gains INF-600b-3 and nothing else in this record
    changed. criteria, readiness (reviewed), priority and depends_on are untouched.
    INF-600b-3 requires the card to be assembled from the agent's own declared facts
    and from nothing else, so that adding an acceptance criterion to the store moves
    no card. NOTE THE DIRECTION: this record's own criteria already enumerate the
    card's inputs as "each agent's template frontmatter, registry entry, knowledge
    plane mapping, and spawn graph" — a list that never included the
    acceptance-criteria store. INF-600b-2 widened that list; INF-600b-3 restores it.
    The two are siblings deliberately, and INF-600b-2 carries a reciprocal amendment
    stating the boundary. CAP: this L1 now holds 3 of its 5 permitted L2 children, so
