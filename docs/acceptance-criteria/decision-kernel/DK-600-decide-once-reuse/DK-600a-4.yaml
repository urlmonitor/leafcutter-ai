estimated_complexity: S
it_requirements:
  - Each Jev question is one literal, atomic judgement about a named part of the quoted state; evidence
    text never becomes part of an instruction (ADR-053 section 5).
  - One assessment is one Jev batch; criterion-kind questions and precedent questions ride the same
    batch at no extra call.
  - The targeted round's caps (research.max_targeted_needs, research.max_claim_needs, retrieval.max_explicit_locators,
    decision.max_research_rounds) come from configuration.
  - The ranking is deterministic code over Jev's scores and is never itself a decision.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
