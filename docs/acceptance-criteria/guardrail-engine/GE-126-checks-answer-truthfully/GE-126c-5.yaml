id: GE-126c-5
title: "A proof that a guard can fail states which copy of the guard the running process loaded, and an alteration the loaded copy never saw is refused instead of read as evidence"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
  - testing_quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a guard exists in two copies — the one an author edits, and the one a
    verifying run loads — and the loaded one is reached through a link rather than
    through a second edited file, so that reading either copy shows the same bytes,
  And a proof that the guard can fail is performed by altering the guard so that it
    can no longer refuse its known-bad input, running the proof, and restoring the
    guard afterwards,
  When the proof runs,
  Then the run states the location of every copy of that guard the process actually
    loaded, taken from the loaded module itself rather than from the location the
    author intended to alter,
  And the proof counts as evidence only when the alteration was made to a copy named
    in that statement,
  And an alteration made to a copy the statement does not name is reported as an
    alteration that never reached the code under test, naming both the copy altered
    and the copies loaded, and the run fails,
  And given the same alteration is instead applied to a copy the statement does name,
    when the proof runs again, then the guard's verdict on the known-bad input differs
    from the verdict it gave before the alteration.
