notes: |
  Derived from flow leafcutter/explore-flows-in-atlas v5, step 'drawerUrl' (FlowNavigation
  nav-drawer-replace-2 and nav-drawer-on-bare-flows-1 to -3). Owner ruling 1 (2026-10-09):
  a drawer opened on the bare /flows entry replaces /flows with the default flow's canonical
  address plus ?step=. Owner decision at the mockup gate (2026-10-09): drawer actions replace
