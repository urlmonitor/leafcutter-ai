assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Build a mapping of source-template -> resolved deployed target path across the artifact phases (build_commands and, for the claude platform, build_workflows per platform_dirs['claude']='commands'). Any target path reached by two or more distinct source templates is a collision."
  - "The three live collisions (build-feature.md, create-ticket.md, finalize-feature.md, each present in both templates/commands/ and templates/workflows/) are the regression fixtures; a test must pin that the current tree triggers all three."
  - "Failure must be behavioral: non-zero exit plus a message naming every colliding source and the shared target. Do not implement as a string-scan of deployed files."
  - "Distinct from BP-300d (which asserts WHICH body wins) — this AC only asserts that a same-target collision is detected and fatal, independent of which source would have won."
delivers_to:
  agent: python-coder
  contract: "A collision verdict listing each colliding deployed target path with the set of source templates mapping to it: { target_path: str, sources: [str, ...] }; ok=true iff the list is empty. Non-empty list fails the build."
