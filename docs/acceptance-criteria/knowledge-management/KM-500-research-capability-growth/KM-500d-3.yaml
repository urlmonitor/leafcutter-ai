it_requirements:
- Preserve immutable source provenance, bounded registered read-only queries and existing authorization, budgets
  and retries. No arbitrary Cypher, new network endpoint, source-write permission, independent telemetry store or
  automatic activation is added.
- Extend existing python -m knowledge evaluate and validated QueryCatalog.request for richer assertions. The twelve-case
  JSON is a planned specification, not currently runner-compatible; reviewed adaptation must precede runnable/executed
  claims.
- Pin independent reviewed expectations separately from candidate admission examples, with comparable source SHA/generation,
  case set, operation version/digest and model settings; validate custom operations through the research catalog.
- 'Keep specification readiness, execution state and verdict distinct: planned, runnable, executed, passed, failed
  and not_run cannot collapse into success. Publish partial/unavailable/denied/exhausted/not_run counts with denominators.'
- 'Assess all RQE-01-P/N through RQE-06-P/N: work-status semantics, exact clauses, complete versus truncated populations,
  declared versus executed proof, missing query versus unsupported mapping, and execution versus fulfillment/remote
  observation.'
- Oracle identities/hashes/expected values remain assessment-only; independently capture actual responses and never
  fill omitted fields from expectations. Changed source, field meaning, mapping or query contract invalidates affected
  comparison until reviewed.
- The initial twelve cases cover six families, not a representative benchmark of all twenty-five questions. Publish
  uncovered origins and deferred readiness/implementation-flow scope.
- Choose recorded quality/latency promotion gates from a measured reviewed real baseline; retain held-out judgments,
  comparable settings, provenance/content metrics and separate synthetic-vector, scripted-actor and real-provider
  evidence.
- Missing corpus/model/service/authorization yields limited/not_run, never invented scores. Reuse implies neither
  model-weight training, autonomous canonical changes nor a background optimizer.
test_required: true
test_rationale: Planned criterion and public-interface proof covers real producer/consumer and serialized boundaries
  with named wrong outcomes. Offline/scripted checks cannot establish real-provider, remote-ingestion or deployment
  readiness; unavailable live prerequisites remain not_run.
expects_from:
- ac_id: KM-500e-1
  contract: 'Answer requirements: original_question, required_fields with meanings, repository_id, requested_source_sha,
    population/root_id, levels, root_excluded versus terminal_leaf_only inclusion rule, completeness_required, unresolved_scope
    and clarification state, preserved across run/resume.'
- ac_id: KM-500e-2
  contract: 'Attributed field evidence: canonical_id, repository_id, source_sha, source_locator, disclosed_values
    keyed by canonical field, field_availability (present, source_absent, projection_absent, disclosure_omitted,
    truncated, unknown), exact_clause completeness and limitations; lifecycle status, req_status, work_status and
    readiness remain separate.'
- ac_id: KM-500e-3
  contract: 'Count evidence: resolved scope, source_sha/generation, unique canonical IDs, known_count, complete
    flag and cause, exact_total only when complete, work_status breakdown with unknown bucket, continuation state
    and limitations; no unproven global or execution count.'
- ac_id: KM-500e-4
  contract: 'Capability assessment: answer_requirements, operation identity/version, generation-supported kinds/relations/fields,
    availability evidence, classified gap, query_build_eligible with reason, unresolved facts and existing authorization
    prerequisites; no side effect in classification.'
- ac_id: KM-500f-1
  contract: 'Declared-impact evidence: source_sha(s), root canonical ID, relation kind/direction/depth, attributable
    edges and unique dependent IDs, complete flag/limitations, known subset and exact total only when complete;
    declared links and inferred effects are distinct.'
- ac_id: KM-500f-2
  contract: 'Verification evidence: canonical AC/test reference identity, reference/anchor/execution identity distinction,
    source_sha versus tested_sha, run/artifact locator if present, environment, actor authenticity, execution status
    and research fulfillment, proof kind and missing/unverified evidence.'
- ac_id: KM-500g-1
  contract: 'Observation envelope: request/attempt IDs, original question and required fields, execution separately
    from fulfillment and gaps, repository/source SHA/generation/query identity, evidence IDs, finalization state,
    delivery state, trace ID and verified trace reference only when established.'
delivers_to:
  agent: python-coder
  contract: 'Versioned evaluation report: independently reviewed source expectations separated from actual output,
    case/operation/model/source identities, specification/execution/verdict states, denominators and gaps, measured
    baseline/gates, control discrimination and uncovered family/origin coverage.'
test_spec:
- name: test_public_evaluation_validates_catalog_and_actual_responses
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Invoke evaluation after reviewed adaptation with builtin and registered custom requests; assert catalog
    validation, digest/source comparability, independent actual output and explicit execution/verdict denominators.
  must_catch:
  - Bypassing custom catalog validation or counting denied/not_run as correct empty answers.
  covers:
  - KM-500d-3
  requires_db: false
  surface_invoked: python -m knowledge evaluate
- name: test_initial_twelve_cases_reject_named_plausible_wrong_answers
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Execute adapted RQE-01-P/N, RQE-02-P/N, RQE-03-P/N, RQE-04-P/N, RQE-05-P/N and RQE-06-P/N through
    the real assessment consumer; controls reject status substitution, criterion truncation, omitted dependent,
    declaration-only proof, unsupported mapping and invented trace/diagnosis.
  must_catch:
  - Passing any of the six controls or backfilling actual fields from the source oracle.
  covers:
  - KM-500d-3
  requires_db: false
- name: test_evaluation_report_preserves_states_scope_and_review_invalidation
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Serialize a real report and reopen through its consumer in a fresh process; assert planned/runnable/executed/verdict
    distinctions, six-family sample limits, uncovered origins and invalidation after source or meaning changes.
  must_catch:
  - Treating a specification as twelve passing tests or silently reusing stale expectations.
  covers:
  - KM-500d-3
  requires_db: false
- name: test_representative_real_corpus_baseline_comparison
  target_dir: tests/knowledge_live/
  framework: pytest
  type: integration
  angle: real_artifact
  description: With separately established corpus/service and provider authorization, compare reviewed real-source
    baseline/proposal through public evaluation with fixed settings, held-out judgments, recorded metrics and measured
    predeclared thresholds; report missing prerequisites limited/not_run and synthetic mechanics separately.
  must_catch:
  - Promoting from candidate-authored synthetic cases or invented quality/latency scores.
  covers:
  - KM-500d-3
  requires_db: true
  surface_invoked: python -m knowledge evaluate
