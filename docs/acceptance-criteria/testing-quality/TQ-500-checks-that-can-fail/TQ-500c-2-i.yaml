status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the recorded incident reconstructed as a hand-off record — four sibling tests
      and three successive alterations to the guarded behaviour, with the outcomes as
      they actually occurred: the first test objected under the first alteration; the
      second objected under the second but not the first; the third, which carries
      the piece of work's headline claim, objected under neither the first nor the
      second; and the fourth objected only under the third alteration, the other
      three never having been exposed to it,
  When that record is read,
  Then the third test is reported by name as having objected under no alteration it
    was exposed to,
    And the first, second and fourth tests are each reported as having objected under
      at least one alteration, and none of the three is reported as never objecting,
    And the piece of work is not reported as satisfied, notwithstanding that three of
      its four tests objected to something,
    And every test-and-alteration pair present in the record appears in the report,
      including the pairs where a test that objected elsewhere did not object here,
      and the pairs where a test was not exposed,
    And the same reading, over the identical record with the third test's outcome
      under the second alteration changed to an objection, reports no test as never
      objecting and reports the piece of work satisfied.
depends_on:
  - TQ-500c-2
