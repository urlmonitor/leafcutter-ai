it_requirements:
  - "Target: templates/scripts/commit_guardian/check_ac_schema.py; the prerequisite is a DATA FILE, config/ac_store_schema.json, not an importable module. VERIFIED 2026-08-14: this check carries a private root walk and does not import the shared _resolve_root.py, which is why the lookup fails from a separate working copy."
  - "Consume GE-119b-2's facility EXTENDED for data and configuration prerequisites. Do not special-case the one schema path: the criteria explicitly require a second, different prerequisite kind — a configuration document read at runtime. templates/scripts/commit_guardian/commit_guardian.json, read by nearly every check through config.py, is the natural second case and exercises the same resolution path from a different consumer."
  - "The success condition is that BOTH runs LOAD the authoritative schema and report the IDENTICAL violating-file set — not merely that both exit the same way. Compare the sets, file by file. Two runs that both exit 0 for different reasons satisfy an exit-code assertion and fail this AC."
  - "A resolved-to-non-empty-string assertion does NOT satisfy this: the observed defect produced a WRONG path, not an empty one. That distinction is the criterion's own coverage note."
  - "The manual field-validation fallback must not be substituted in either run. Assert on the GE-112 schema_validated flag (see check_ac_schema.py DECISION HISTORY ~lines 29-37 and the fallback at ~line 623) so 'authoritative validation actually ran' is observable rather than inferred."
  - "COMPLEMENTARY WITH GE-119a-3, NOT REDUNDANT: this AC makes the schema REACHABLE; GE-119a-3 makes the check ANNOUNCE when it is not. An implementation that makes the path resolve and removes the announce path fails GE-119a-3. Neither closes the other, because no resolution fix covers every future environment."
  - "ADR-001 deployed/template parity: edit templates/scripts/commit_guardian/ then run 'python scripts/build.py --target-dir .' so scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ match (check_hook_parity enforces all four locations). The data file resolution must work from the DEPLOYED layout, which is the layout .pre-commit-config.yaml invokes — resolving correctly only from the source tree is the defect, not the fix."
