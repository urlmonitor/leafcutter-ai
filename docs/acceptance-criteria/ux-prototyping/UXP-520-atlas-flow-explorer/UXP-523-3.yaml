it_requirements:
- Suppress only the canonical generated compatibility labels when the structured display guard accepts the
  node. Never remove authored text by matching contract words or apparent JSON fragments.
- Show an actor-kind badge only for the four stored values; any other value shows no badge rather than a
  coerced one.
- Preserve the authored data and generated compatibility copies on disk; this AC changes the read surface,
  not source ownership.
expects_from:
