notes: |
  Wave 1. Placed under KM-ADM-005, the ratchet's owner (user scope change 2,
  PO gate 2026-10-25), not under BO-2500a-1 as the brief first proposed.

  ACS-1100b-1 is todo and unbuilt; it is a doc_link, not a depends_on, so this
  record is not blocked on it. If the published list of grounds does not exist yet,
  the ratchet declares its two grounds in place and ACS-1100b-1 adopts them.

  Lowering the high-water mark here is a re-scoping, not TQ-400d's drawdown: the
  waived records leave the population, they are not retired from the pile. Per
  KM-ADM-005's reconciliation note, nothing ever raises it.

  The wave-2 split of this ratchet (typed record only; second count at 0) is
  KM-ADM-005-2.
