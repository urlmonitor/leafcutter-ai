it_requirements: |
  Resolve the main tree via git-common-dir (the shared resolver in BO-1700e-2); a
  worktree missing its .leafcutter symlink must NEVER be mistaken for a
  genuinely-no-gates project. Ambiguity in the determination is FAIL-CLOSED per
  BO-1700b-1, never assume-no-gates. Implemented in the shared probe helper
  (BO-1700a-1) over the git-common-dir resolution (BO-1700e-2); ADR-001
  deployed/template parity applies.
