notes: |
  THE ANTI-THIRD-MECHANISM ASSERTION. ACD-1800f-1's fourth Then clause states the
  slot must be wide enough for both kinds; this L3 is the test that proves it,
  by driving the OTHER kind end to end. Without it, "wide enough" is a design
  intention that nothing checks, and the next author faced with
  `live_surface_test` adds a third field -- which is precisely how the repo
  arrived at three orphaned triggers in the first place.

  VERIFIED CONTEXT (do not re-investigate):
    - templates/agents/live-surface-tester.md EXISTS and is registered in
      config/agent_registry.json (~line 2663) with
      `conditional_field: live_surface_test` and `requires_ticket_section: true`.
    - `live_surface_test` has ZERO occurrences in BOTH
      config/ac_store_schema.json AND scripts/ac_store/generate_ticket_from_ac.py.
      A registered, working agent is therefore unreachable from the AC path
      entirely -- nothing can request it.
    - The same is true of `user_facing_surface` (registry ~2597-2603), the second
      routing condition for user-surface-smoker.

  WHY THE FIFTH THEN CLAUSE MATTERS. Requesting the live craft is easy to satisfy
  by requesting BOTH crafts unconditionally. That would make user-surface-smoker
  fire on requirements with no smoke fixture at all -- and because its aggregation
  is "if ALL stanzas PASS, emit ok" over an empty stanza set, it would pass
  vacuously and quietly (see ACD-1800f-3). So over-routing is not a harmless
  excess here; it manufactures the exact false green this L1 exists to remove.

  `requires_ticket_section: true` IS A LOOSE END the IT PO must resolve. The
  registry entry asserts the live-surface craft needs a section in the TICKET
  BODY. Once the declaration and its content live on the requirement, that flag
  either points at the requirement instead or becomes meaningless -- and if it is
  left as-is while the ticket is thinned by ACD-1800c, the craft is dispatched
  against a section that no longer exists. Flagged here rather than silently
  assumed; ACD-1800f-2 owns the content side.

  TESTABILITY. Assemble the work for a real on-disk requirement of each kind and
  assert WHICH crafts were requested. Asserting that the registry contains a
  `live_surface_test` conditional_field is a grep test -- and it passes today,
  against a field that no producer can ever set.

  2026-08-17 (IT PO enrichment).

  LOOSE END RESOLVED, AS DIRECTED. `requires_ticket_section: true` is repointed
  at the requirement, not deleted: the craft genuinely needs authored content,
  and after ACD-1800f-2 that content is `observation_proofs` on the AC. The flag
  therefore becomes "this craft requires authored proof content on the declaring
  requirement", and its unsatisfied case is ACD-1800f-3's `unproven` verdict
  rather than a missing-section error. Deleting the flag instead would make the
  live craft dispatchable with no content at all -- the same vacuous shape one
  level over.

  NEW VERIFIED FINDING, NOT IN THE BRIEFING -- and it is the one most likely to
  turn this AC green while the craft never runs. `live-surface-tester` has ZERO
  occurrences in scripts/ac_store/generate_ticket_from_ac.py, so it is missing
  from BOTH `_CANONICAL_PHASE_ORDER` (~165) and `_FLOW_CHANGE_PHASE_ORDER`
  (~188), where user-surface-smoker is explicitly present at priority 11.5 with
  a comment. The registry assigns live-surface-tester priority 11.8 (~2694).
  Route the craft without adding it to both lists and it is emitted but sorted
  outside the phase sequence -- dispatched after commit, or dropped. This is the
  same defect shape as the build-feature llm-expert ordering bug. The fourth
  test descriptor asserts ordering in a rendered map for exactly this reason;
  asserting membership of the frozenset would not catch it.

  SECOND GATE PRESERVED DELIBERATELY. config/agent_registry.json ~2675 requires
  `live_surface_testing.enabled: true` in skills_config.json as well as the
  routing condition, and scripts/config_loader.py::_validate_live_surface_testing
  validates that block. The declaration REQUESTS the craft; the config gate still
  decides emission. This is intentional and is not an escape hatch for the smoke
  case, which has no equivalent config gate.
