id: BO-2400c-1-iv
components:
  - build_orchestration
  - injection_builder
title: "Across one run's successive dispatches the cacheable prefix is byte-identical"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given one fast-lane run that dispatches more than one build-context-carrying agent,
  When the prompts those agents received are compared with one another,
  Then the portion of each prompt up to and including the cache breakpoint is
    byte-identical across every one of those dispatches — the same bytes, in the same
    order, with the same whitespace,
  And the portions after the breakpoint are not identical: they carry what has changed
    as the run progressed — this batch's acceptance criteria, the tests already written,
    the work in progress — so the volatile content is present but sits behind the anchor
    rather than being dropped to make the prefixes match.

  Given a run in which the prefix differs between two dispatches by even one byte,
  When the run's dispatches are compared,
  Then that difference is a failure of this criterion regardless of its cause — a stable
    source re-read and re-rendered mid-run, an elapsed time or counter, a per-dispatch
    identifier, or volatile content leaking forward across the breakpoint,
  And the difference is reported rather than tolerated, because a prefix that changes
    between dispatches means the cache never anchors and the whole layer buys nothing
    while continuing to look wired.
depends_on: [BO-2400c-1, BO-2400c-1-iii]
