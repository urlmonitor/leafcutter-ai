criteria: |
  Given an AC store containing 6 active AC files:
    - AC-1, AC-2, AC-3 with persona_for: "field-service-engineer"
    - AC-4, AC-5 with persona_for: "product-manager"
    - AC-6 with no persona_for field
  When a user queries the AC store with persona filter "field-service-engineer"
  Then the result contains exactly 3 ACs: AC-1, AC-2, AC-3
  And each result entry includes the AC ID, title, component, and level
  And the result does not include AC-4, AC-5, or AC-6
