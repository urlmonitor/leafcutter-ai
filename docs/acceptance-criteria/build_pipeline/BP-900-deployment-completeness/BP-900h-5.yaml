assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  reference_file_path: ".github/workflows/ci.yml"
  n_location_rule: "1 — one guardrail-exercise step in the consumer-simulation job, iterating the set derived from the DEPLOYED registry. One step per known guardrail does not satisfy it: the count must come from the registry the install actually carries, so a guardrail registered tomorrow is exercised with no edit to the workflow."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir /tmp/lc-consumer-probe"
    - "env -u PYTHONPATH python /tmp/lc-consumer-probe/.leafcutter/scripts/commit_guardian/check_doc_frontmatter.py docs/known-issues/commit-guardian.md"
    - "env -u PYTHONPATH python /tmp/lc-consumer-probe/.leafcutter/scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-5.yaml"
    - "python -m pytest unit_tests/portability/ -q"
  config_schema_fragment:
    type: object
    description: "The per-guardrail outcome record the harness emits inside the consumer install. It is a record with an explicit outcome value rather than a pass/fail pair because both the failed and the unable-to-run states exit non-zero in the live code - that identity is the whole defect, and any shape that leaves classification to the exit code reproduces the 2026-08-18 misdiagnosis by construction. h-5-ii reuses this vocabulary for a wider set; keep it stable."
    required:
      - guardrail
      - outcome
      - unresolved_location
      - input_pair
      - derivation
    properties:
      guardrail:
        type: string
        description: "The deployed path of the guardrail as invoked, so a red report names something an adopter can run themselves."
      outcome:
        type: string
        description: "One of: passed, failed, unable_to_run. Three values, not two. Collapsing unable_to_run into failed is a faithful copy of the 2026-08-18 misdiagnosis, in which a guardrail that could not find its vocabulary reported a blocking failure against every commit and the report pointed at the commits rather than at the missing file."
      unresolved_location:
        type: string
        description: "For an unable_to_run outcome: the file or location the guardrail could not resolve, as the guardrail itself searched for it. Null otherwise. This is the field that turns a red run into a remediation list instead of a symptom."
      input_pair:
        type: object
        description: "The passing input and the failing input the guardrail was driven with, or an explicit record that no pair was declared. The BA flagged the registered-guardrail-with-no-input-pair case as the one under-specified point in this AC; whatever the implementer decides, it is recorded here so a skip is a visible decision rather than an absence."
      derivation:
        type: string
        description: "How this entry reached the exercised set - which deployed registry it was read from. Present so a hand-written list is visible as such in the report rather than passing as a derived set."
  constraints:
    - "THE 2026-08-25 REPRODUCTION IS THE ACCEPTANCE INSTANCE, AND IT MUST BE RED BEFORE THE FIX. In a genuine adopter install (package at leafcutter-ai/, built with `python scripts/build.py --target-dir <consumer root>`, a main checkout rather than a worktree), `python .leafcutter/scripts/commit_guardian/check_doc_frontmatter.py <doc>.md` raises FileNotFoundError naming .leafcutter/scripts/commit_guardian/config/doc_types.json. The harness must classify that guardrail unable_to_run and name that location - never as a failure of the probe document, which is how the defect was first reported. A second live instance from the same install: the deployed validate_ac_schema.py raises ModuleNotFoundError for _ac_components, so the classification must recognise a missing MODULE as unable-to-run too, not only a missing config."
    - "INVOKE THE DEPLOYED COPY, IN A COLD SUBPROCESS, WITH THE PACKAGE SOURCE TREE OFF sys.path. Every existing unit test for these guardrails imports from scripts/, where every sibling and every config resolves by construction - which is exactly why five prior instances of this class stayed green and why no test had ever observed the difference between running and being unable to start. Importing a guardrail and calling it does not satisfy this AC. Assert the child process's effective search path contains no path under the package checkout, and launch it from a working directory that is not the package tree."
    - "DERIVE THE SET FROM THE DEPLOYED REGISTRY, AND SAY WHICH FILE THAT IS. The doc_links record the registry's deployed location as status: planned - confirm it against a real install before implementing rather than assuming it, because a derivation that reads the package-source copy is reading a file the consumer does not have and is green on an install whose deployed registry is empty or absent. Assert the exercised set is non-empty and equals what the DEPLOYED registry declares."
    - "IDENTIFY THE ENFORCEMENT POINT THAT ACTUALLY GATES, AND NAME EVERY ONE THE CHANGE TOUCHES. The harness's internal report is not the gate; the CI step's exit code is. Name in the sign-off every place the verdict surfaces and state which one is load-bearing. A step carrying continue-on-error, or a verdict that is only logged, is a no-op with a report attached - the same shape as the build-side deploy_map skip branch, which logs at WARNING and continues and has let this defect class through four times."
    - "ADDING THE MISSING DECLARING FILE IS NECESSARY AND NOT SUFFICIENT. Deploying doc_types.json, or hand-placing it, makes this instance disappear and leaves the mechanism as it was - which is what happened four times on the build side, each time with a warning comment attached, and a sixth instance surfaced on 2026-08-25 when check_ac_parent_covered_by.py was found unable to import derive_parent_id in a deployed layout and exiting 0 silently. The harness must independently classify unable_to_run on a tree where a declaring file is withheld, whichever file that is."
    - "A SILENTLY-DEGRADING GUARDRAIL IS A DECLARED BLIND SPOT OF THIS HARNESS, NOT A COVERED CASE. The three-way classification can only see a guardrail that STOPS. The sibling diagram-types lookup returns None and falls back to a built-in constant, so it answers, is recorded as passed, and is running on a narrower rule than it should - invisible here by construction. Name every such reader found during implementation in the sign-off as an uncovered blind spot. Do not close the gap by making the harness guess, and do not close it by making more readers silent: GE-118c removed exactly that fallback from the doc-types side deliberately, and reinstating it anywhere would turn this harness green while returning the behaviour to what it was before that removal."
    - "ACCOUNT FOR THE REGISTERED GUARDRAIL WITH NO DECLARED INPUT PAIR - THE BA'S FLAGGED OPEN POINT. The criterion requires both that every registered guardrail be driven with an input pair and that the set be derived from the registry, and a guardrail registered tomorrow has no declared pair. The harness may not invent one. Whatever the decision, it must be visible in the report and counted against the derived set, so that exercised plus explicitly-unexercised equals the size of the registered set - a silent skip satisfies the derivation clause vacuously and is the most likely way this ships broken. State the chosen accounting in the sign-off."
    - "WHATEVER THE HARNESS SURFACES ON FIRST RUN MUST BE ENUMERATED, NOT SKIPPED. Turning this on will reveal every registered guardrail that cannot currently start in a consumer install, not only the document-frontmatter one, and may turn the consumer-simulation job red on its first run. That is the intended effect. List the full set in the sign-off and resolve each entry or defer it explicitly with a date; a skip list reintroduces the hand-maintained list inside the mechanism built to remove it."
    - "PACKAGE-DIRECTORY NAME INDEPENDENCE IS BP-900h-4-i's, NOT THIS AC's. That AC owns the layout matrix and the prohibition on spelling a package-directory name in any candidate path - the same lookup fails differently under different adopter names, resolving in a main checkout and failing in a worktree with the package at `leafcutter/`, and failing everywhere with it at `leafcutter-ai/`. Do not re-specify it and do not foreclose it: the harness must take the consumer root and the deployed output root as inputs from the BP-900h-4 fixture rather than constructing them from a directory name of its own."
delivers_to:
  agent: python-coder
  contract: "A per-guardrail three-way outcome in the consumer install — passed, failed, or unable-to-run with the unresolvable location named — and a job conclusion that is failing when any entry is unable-to-run."
expects_from:
  ac_id: BP-900h-4
  contract: "The consumer-layout install whose declaring-file resolution is anchored to the deployed output root alone."
test_spec:
  - name: test_bp_900h_5_each_registered_guardrail_passes_its_good_input_and_fails_its_bad_input_inside_the_consumer_install
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Inside the BP-900h-4 consumer-layout install, invoke every registered guardrail as a SUBPROCESS against one input it should pass and one it should fail, and assert per guardrail that the pair comes back (passed, failed) and that neither run lands in the unable-to-run category. NON-VACUITY: assert the set of guardrails exercised is non-empty and equals the set the deployed registry declares - a harness that exercises zero guardrails satisfies every per-guardrail assertion in this contract. Include the document-frontmatter guardrail explicitly, since it is the 2026-08-18 regression instance and the one confirmed to stop rather than judge in a consumer install."
  - name: test_bp_900h_5_a_guardrail_whose_declaring_file_is_removed_is_classified_unable_to_run_not_failed
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE THREE-WAY VERDICT, and the entry this AC exists for. Pick one registered guardrail and drive it three times through the same harness against the SAME input that it PASSES when healthy: (a) declaring file present - assert the recorded outcome is passed; (b) declaring file deleted from the deployed root - assert the recorded outcome is the third category, unable-to-run, asserted by its own value and explicitly NOT equal to failed, and assert the report names both the guardrail and the location it could not resolve; (c) declaring file present, input changed to one it rejects - assert failed. Then assert the three outcome values are pairwise distinct. The exit code is non-zero in both (b) and (c), so an assertion on exit code alone is green on a harness that collapses unable-to-run into failed - which is a faithful copy of the 2026-08-18 misdiagnosis."
  - name: test_bp_900h_5_job_conclusion_is_failing_when_any_registered_guardrail_is_unable_to_run
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier. Run the harness through the same command the CI job invokes, as a subprocess, over the consumer install, in four states: healthy install - exit 0; one guardrail sabotaged into unable-to-run - non-zero; one guardrail removed from the deployed tree outright - non-zero, establishing the same force clause; healthy install again - exit 0. Then assert the consumption half from the parsed .github/workflows/ci.yml: the step running this harness is not continue-on-error, so its non-zero conclusion actually fails the job."
  - name: test_bp_900h_5_the_exercised_set_is_derived_from_the_registry_so_a_newly_registered_guardrail_is_exercised_without_editing_a_list
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "The derived-not-hardcoded control, and the only entry a hand-maintained list of guardrails cannot pass. In the consumer install, add a synthetic guardrail entry to the DEPLOYED registry - a trivial script that exits 0 on its good input and non-zero on its bad one - without touching any test code or harness source, re-run the harness, and assert the synthetic guardrail appears in the per-guardrail report with its (passed, failed) pair. Then remove the registry entry, re-run, and assert it disappears from the report. Every other entry in this contract is green on a harness that iterates a literal list of today's guardrails; this one is not."
test_rationale: |
  The three-way verdict is the whole point of this AC and it is the part most likely
  to be dropped as an implementation detail, so entry 2 is written to be impossible to
  satisfy by an exit-code-keyed classifier. Both the failed case and the unable-to-run
  case exit non-zero in the live code, which is precisely why exit code alone cannot
  distinguish them; the test therefore asserts the recorded category by value and
  asserts pairwise distinctness across all three states of the same guardrail against
  the same input. A harness that records "the guardrail failed" when a guardrail could
  not find its vocabulary reproduces the 2026-08-18 misdiagnosis exactly, and would
  pass any test that only asserted a non-zero result.

  Entry 4 is separately non-negotiable. The derivation clause is the clause a working
  implementation and a hardcoded list are indistinguishable on, for every input that
  exists today. Adding a guardrail to the deployed registry at test time and asserting
  it turns up in the report - with the paired removal, so the appearance is not an
  artifact of the fixture - is the only construction that goes red on a list. This is
  the same data-driven-not-by-name discipline the store applies elsewhere.

  Every entry runs inside the BP-900h-4 consumer-layout install rather than the
  package's own workspace, and none of them may import a guardrail and call it. No test
  had ever invoked a deployed guardrail from an install that was not the package's own
  workspace, which is why the difference between "runs and judges" and "cannot start"
  had never been observed. Invoking through the deployed copy, as a subprocess, from
  the consumer install is the only arrangement in which the distinction is observable
  at all.

  KNOWN TENSION, recorded rather than resolved by invention. The criterion requires
  both that every registered guardrail be driven with an input pair AND that the
  exercised set be derived from the registry. A guardrail registered tomorrow has no
  declared input pair, and the harness cannot invent one. The implementer must decide
  how the report accounts for a registered guardrail with no input pair; whatever the
  decision, it must be visible in the report rather than a silent omission, because a
  silent skip satisfies the derivation clause vacuously. Flagged to the IT PO's
  sign-off as the one under-specified point in this AC.

  Angles: criterion, failure, reachability, deployed — at the cap of four. real_artifact
  and seam are not charged; boundary is not charged because the criterion names no
  range or count. The must_block modifier rides entry 3, where the production entry
  point lives.
