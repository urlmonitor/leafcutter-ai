expects_from:
  ac_id: BO-2600a-5
  contract: "goal_to_epic exposes an id-list entrypoint (e.g. `--ids`) that assembles a dependency-ordered epic from EXACTLY the provided connected-set ids, so build-ac can pass the select_connected result as epic content rather than re-walking a subtree."
it_requirements:
  - "Edit Step 2b of templates/agents/build-ac.md so that when the resolved connected build set (from select_connected --exclude-structural-parent) has more than one member, the coordinator routes to epic generation instead of the single-ticket generator."
  - "The coordinator MUST pass the EXACT resolved id list to goal_to_epic's id-list entrypoint (BO-2600a-5, e.g. `goal_to_epic.py --ids <resolved list>`). It MUST NOT call `goal_to_epic.py --ac <id>` for this path — that re-walks the target's subtree and would drop cross-tree prerequisites the resolver already included. The select_connected result is the epic CONTENT, not merely a size gate."
  - "Epic tickets must be dependency-ordered and cross-wired so each generated ticket's depends_on references co-located ticket files, satisfying ticket_frontmatter_guard (which requires depends_on to reference existing tickets in the same epic folder)."
  - "Do NOT emit flat cross-referencing tickets in tickets/00_inbox — the epic folder is the output shape."
  - "Verify behaviorally: a multi-member set (including one with a cross-tree prerequisite outside the target's subtree) must actually produce an epic folder that CONTAINS that prerequisite as a ticket, whose tickets pass ticket_frontmatter_guard, and whose depends_on edges match the resolved dependency order — not a grep-only assertion (CLAUDE.md 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep'). A test whose only fixture is GE-113c-3 is INSUFFICIENT because there the connected set equals the subtree and would pass even against the buggy --ac re-walk; include a fixture with a genuine out-of-subtree prerequisite."
  - "Real validating case: GE-113c-3 resolves to {GE-113c-3, GE-113c-3-i, GE-113c-3-ii, GE-113c-3-iii, GE-113c-3-iv} (structural parent GE-113c excluded), so /build-ac must emit an epic of those five, not a single ticket."
test_spec:
  - name: test_multi_member_set_generates_epic_folder
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "A connected build set of size >1 produces an epic folder with one ticket per member, not a single ticket"
  - name: test_epic_tickets_dependency_ordered_and_wired
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "Generated epic tickets are ordered prerequisites-first and their depends_on reference co-located tickets so ticket_frontmatter_guard passes"
  - name: test_ge_113c_3_resolves_to_five_member_epic
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "GE-113c-3 (structural parent excluded) yields the target plus its four L3 children as an epic"
  - name: test_cross_tree_prerequisite_included_in_epic
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "A leaf with a genuine out-of-subtree prerequisite produces an epic that CONTAINS that prerequisite as a ticket (guards against the goal_to_epic --ac subtree re-walk that would drop it)"
