roadmap_phase: phase_kernel_1_founding
criteria: |
  Decide once on evidence, keep the record, and reuse it next time.

  Design questions in a project tend to be argued out again and again, because
  the reasoning behind the last answer was never kept where anyone could find it.
  With this goal, a design question is researched in your own project, every
  option is weighed against criteria you approved, and you make the final call
  with the evidence in front of you. The decision you approve is kept as a full
  record that goes through the same review as any other change to your project,
  and when the same question comes up again it is found and offered back to you
  instead of being decided from scratch. You stay the one who decides throughout:
  no ranking, no record and no earlier decision ever settles a question on your
  behalf.
