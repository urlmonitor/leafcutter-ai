notes: |
  WHY THIS EDGE MATTERS. The KI's stated harm: "a missing id is visible; a plausible
  id belonging to another agent's phase is not". Once INF-500d-3-i makes recovery
  files unique, an LLM whose fallback comes back empty has an obvious and WRONG
  improvisation available: take the newest recovery file in the temporary
  directory. Under parallel dispatch, that produces exactly the cross-agent id the
  fix exists to prevent. The instructions must explicitly forbid that route.

  Which marker: in the first scenario the agent cannot tell from its own side
  whether the write happened. The reason comes from INF-500d-3's closed set, based on
  the submission's exit status and error stream. Do not invent a new reason. In the
  second scenario the error stream shows a recovery file was announced, so the write
  succeeded and the reason is "written but not captured". Per INF-500d-3's second
  scenario, that case must never be re-filed.

  live-surface-tester currently runs 'head -1' over the search result, which takes
  the first match whoever wrote it. Once its error-stream file is per-run
  (INF-500d-3-ii) it can only ever hold one match. Even so, the instruction must not
  rely on "first match wins".

  BOUNDARY. INF-500d-3 owns the marker reason vocabulary. This record only requires
  that the instructions record the marker rather than a foreign id.
