  When /build-feature dispatches ticket-supervisors,
  Then tickets execute in a valid topological order respecting dependency chains,
  And tickets with disjoint file-touch sets run in parallel within a batch,
  And batches never exceed a configurable concurrency cap,
  And cycle detection halts the epic before any dispatch occurs.
