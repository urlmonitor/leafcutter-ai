notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Refines ACD-400c-1.

  WHY THIS IS A REFINEMENT OF THE ADMISSION RULE AND NOT A NEW REPORTING REQUIREMENT.
  Read on its own, ACD-400c-1 is satisfied by a change that reclassifies unapproved work
  as held rather than withholding it — the work would still be absent from the offer, and
  every clause of the parent would still hold. That is a materially different queue, and
  the difference is invisible to the parent's criteria. This L3 closes that hole by naming
  where the withheld work must NOT turn up. It is a negative control on the admission
  rule, in the same shape as ACD-400a-5's composite control.

  THE SCOPE FENCE, STATED SO IT IS NOT MISREAD. The PO's ACD-400c notes say the exclusion
  being invisible in the counts is an ACS-1100-shaped follow-up about what the queue
  OUTPUTS, must be flagged to the user rather than authored, and must not be silently
  pulled into an L2 here. This AC does not require the queue to report its exclusions, and
  a correct implementation of it changes nothing about the queue's behaviour: the sentences
  above are already true today, verified by execution. What it forbids is a FUTURE change
  that quietly relocates withheld work into the held list under cover of satisfying the
  parent. It is recorded here rather than omitted because a specification of an admission
  rule that cannot distinguish withholding from reclassification is not a specification of
  that rule. Raised explicitly in the sign-off rather than folded in silently.

  THE COUNT CLAUSE IS NOT A REQUEST FOR A NEW COUNT. The queue already prints a count with
  each list. The clause asserts only that the existing counts do not include withheld work
  — which is what they do today. It does not ask for a third count of what was excluded;
  that is the follow-up above.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L3.
