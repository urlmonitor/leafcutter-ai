it_requirements:
  - >-
    THE 14-DAY BRANCH is branch (c) of BO-4400g-2's one decision function, never a separate rule. A workspace
    is cleared when the door's unsent-work check finds nothing unsent, all its own commits are on its own line
    on the shared project, not all are on the main line, and no file in it has changed for at least the
    pushed-unmerged threshold. That threshold is a named default of 14 days, kept in one place in
    worktree_landed.py, apart from the 7-day no-own-work threshold. It never borrows the 7-day value, which
    "ten-day-1" catches.
  - >-
    "On its own line on the shared project" is judged against the shared project's refs as the pass's
    start-of-pass contact found them (BO-4400g-2 FRESH MAIN LINE ONLY), never against a remembered
    remote-tracking ref. A commit on neither that line nor the main line keeps the workspace as
    holds_unsent_work naming the commit by full identifier; an uncommitted change keeps it as
    holds_unsent_work naming the file.
  - >-
    GIT ONLY: the pass asks no pull-request service anything (no gh, no hosting API, no network call besides
    the git contact with the shared project), and no answer depends on whether one is reachable. A still-open
    but idle pull request is the same case as "stale-1" (user decision 2026-11-16).
  - >-
    The workspace's line on the shared project and the shared main line are never deleted or pushed to.
    BO-4400g-2's never-delete rule applies unchanged, and this branch adds no exception to it.
  - >-
    The per-work mode used by flows never applies this branch, so a flow never clears pushed but unmerged
    work (BO-4400g-4, BO-4400a-1).
  - >-
    The clear goes through the door like every other clear, and a door refusal is relayed as BO-4400g-2 states.
  - >-
    PROOF RUNS THE DEPLOYED MAKER as a separate process against real temporary repositories with a real bare
    hub. Lines are pushed to the hub and nothing is merged; ages are set through file modification times (15,
    10 and 3 days). The hub's refs are snapshotted before and after. No pull-request tool or service is
    reachable in the test (for example, a gh on PATH that fails the test if it is called). No git mock, no
    build.py spawn, and isolated HOME and git config.
test_required: true
test_intent:
  - clause: '"stale-1" is cleared through the same clearing door a single clearing request uses, and no folder of it remains'
    needs_test: true
    reason: A pass without the 14-day branch keeps every abandoned pushed workspace forever, which is the pile-up this branch removes.
  - clause: the line of work of "stale-1" on the shared project, and the shared main line, are identical before and after, so its two commits can still be fetched
    needs_test: true
    reason: Clearing is only safe because the work stays on the shared project, so a pass that also deletes the line would lose it.
  - clause: '"ten-day-1", "recent-1", "stale-dirty" and "stale-ahead" are each identical before and after'
    needs_test: true
    reason: Each one fails a different part of the rule (10 days catches a reused 7-day threshold, 3 days is plainly young, an uncommitted change, an unpushed commit), so each must be snapshotted.
  - clause: 'the pass''s one answer lists "stale-1" as cleared by work name and location, and lists as kept: "ten-day-1" and "recent-1" as not yet on the main line, "stale-dirty" as holding unsent work naming the file by path, and "stale-ahead" as holding unsent work naming the commit by identifier'
    needs_test: true
    reason: The kept reasons and the named file and commit are computed by different checks, and the unattended caller acts only on this answer.
