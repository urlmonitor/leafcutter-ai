notes: |
  A WINDOW THIS RECORD DOES NOT CLOSE, STATED SO NOBODY BELIEVES IT IS CLOSED. Between a
  close and the next nightly run there is no open flag, so TQ-600a-13-vi passes every PR
  for up to a day. The approved design accepts "reappears next red night"; it does not
  require the hold to survive the close in the meantime. Closing that window would need
  the per-PR check to consult something besides the open issue (for example the latest
  nightly verdict), which changes the one-source-of-truth decision and is the owner's to
  make. Note especially that the escape hatch causes this window on every successful
  fix: other PRs are released the moment the fix merges, before a night confirms it.
