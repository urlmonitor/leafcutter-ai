notes: |
  THE DEFECT, OBSERVED (2026-08-18). Generating a ticket from the real AC BO-2400g-2
  produced this frontmatter:
      files_touched:
      - scripts/build.py
      - templates/agents/change-scope-reviewer.md
      - templates/agents/pr-reviewer.md
      - unit_tests/_workflow_engine_harness.py
  Two files the requirement exists to change are missing:
  templates/workflows-js/fast-lane-ship.js (the primary file, and the FIRST entry in the
  AC's own doc_links) and scripts/build_orchestration/fast_lane.py. This AC owns the
  omission half. The inventions in that same list are BP-1100a-4's half.

  WHY THE OMISSION HAPPENS, MECHANICALLY. generate_ticket_from_ac.py:_build_files_touched
  (line 535) is a union of two sources and neither of them reads "what does this
  requirement change":
    - Source 2 (lines 576-581) filters doc_links by relationship against
      _EDIT_SURFACE_RELATIONSHIPS (lines 104-106) = {constrains, creates, implements,
      modifies, specifies}. Every doc_link on BO-2400g-2 is 'describes' or 'related', so
      Source 2 yields the empty set. The filter is not itself wrong — it exists to keep
      reference pages out of the surface — but it makes the whole derivation depend on an
      annotation the authoring convention does not reliably supply.
    - Source 1 (lines 561-574) reads it_requirements. In the STRUCTURED form it takes
      reference_file_path, which is exact. In the LIST form it scrapes path-shaped tokens
      out of prose bullets via _extract_paths_from_prose (line 496), which is a guess.
  BO-2400g-2 uses the list form and all-describes doc_links, so 100% of its emitted
  surface came from prose scraping. BO-2400e-3, whose output is correct, uses the
  structured form (reference_file_path at line 50) — and its own doc_link to that same
  file is 'describes' and contributed nothing either. The two ACs differ in authoring
  shape, not in how clearly each states what it changes.

  WHY THE THIRD CLAUSE (SAY SO WHEN YOU CANNOT TELL) IS LOAD-BEARING. The generator
  already has a place to say it: its own self-check records "files_touched has N path(s)"
  as a PASS and only warns when the list is EMPTY (generate_ticket_from_ac.py:2790-2793).
  A confidently wrong four-path list therefore reports as a pass today. A derivation that
  cannot determine the surface must degrade loudly, because a partial surface presented as
  complete is worse than an empty one: the empty one is visible, the partial one reads as
  scope.

  WHO "THE PERSON DRIVING THE TICKET" IS (settled 2026-08-18, do not re-open). The reader
  is whoever answers the build-confirmation gate: /build-ac's leaf path prints
  "Found AC / Priority / Ticket path" and then "Build this ticket now? (yes / review /
  skip)" (templates/skills/build-ac/SKILL.md, Mode A output contract), and the goal path
  gates each leaf at the readiness prompt (ACD-1200b-2). That gate is the last point at
  which a human can refuse before a coder is dispatched, and it does not display the
  surface today. The readiness report is deliberately NOT accepted as sufficient on its
  own: it is opt-in, and it is the very report that prints "[PASS] files_touched has 4
  path(s)" over BO-2400g-2's wrong surface (KI-ACS-002 / false-green mechanism M8), so a
  reader who trusts it is the reader being failed. It stays in scope only through the
  negative clause — no report may call an undetermined surface satisfactory.
  The ticketless fast lane is out of scope by construction: every clause here is
  conditioned on "when a ticket is generated", and the fast lane generates none.

  WHY IT MATTERS, IN THIS PROJECT'S OWN TERMS. CLAUDE.md records wrong files_touched as a
  documented phantom-done driver: files_touched defines the surface downstream agents and
  the scope reviewer treat as in-bounds. A ticket that omits the file the work must change
  lets change-scope-reviewer flag the REAL edit as out of scope, and lets a done-check pass
  over a file that was never touched (EPIC-PhantomDoneFilesTouched, 2026-07-07).

  THIS IS NOT ACD-400b-6. ACD-400b-6 is done and correct within its own scope: it forbids
  a first-wins or truncating reduction across the paths that already qualify, and
  ACD-400b-6-i pins order-independence. Neither says anything about which relationship
  values make a path qualify, nor about paths that arrive from prose. That is precisely
  why BO-2400g-2 still drops its primary file with ACD-400b-6 green. Anyone reconciling
  these two should treat ACD-400b-6 as the union rule and this AC as the membership rule.

  TESTS MUST NOT BE GREP-ONLY. The observable is the WRITTEN TICKET, not the generator's
  source: run the real generator over a real on-disk AC fixture and assert the
  files_touched list in the frontmatter it actually wrote. A test that asserts the
  relationship set contains some value, or that the derivation function mentions a field,
  passes on every variant of this bug. Use BO-2400g-2's exact shape as a fixture — all
  doc_links 'describes'/'related' plus list-form it_requirements — because that is the
  shape that fails and the shape hand-written fixtures do not naturally reproduce.
  One caution for whoever writes the test: the generator writes an implemented_by
  back-reference into the source AC, so it must be pointed at a COPY of the store, never
  at docs/acceptance-criteria itself.

  THE STALE-DOC CAVEAT IS NOW DISCHARGED. The it_requirements constraint below asks for a
  follow-up documentation AC covering the how-to section that this AC and BP-1100a-4 make
  stale. That AC is BP-1100a-5, which depends on both and owns the page. Nothing about
  this AC's own surface changed as a result — the page is still deliberately not in it.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
  assigned_agent, it_requirements, estimated_complexity, delivers_to, expects_from and
  test_spec are the IT PO's to set. Note that this tree's existing L2s (BP-1100a-1,
  BP-1100a-2) carry no test_spec, so none is authored here; the test shape the IT PO
  should encode is stated above. change_target is 'code' rather than the siblings'
  'pipeline' because the surface is a Python script, matching ACD-400b-6/-7/-8 which own
  that same file.
