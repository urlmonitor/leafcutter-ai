id: GE-127a-1
title: "The change that takes a file past its permitted length is refused at the moment it is committed"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked file of a kind the size standard covers stands below its
    permitted length,
  And a change is staged that leaves that same file above its permitted length,
  When the author performs an ordinary commit — no extra command, no extra flag,
    and nothing invoked by hand,
  Then the commit does not complete,
  And the outcome names that file, states the length the standard measured it
    at, and states the length permitted for a file of its kind,
  And given instead a change is staged that leaves that same file still below
    its permitted length,
  When the author performs an ordinary commit,
  Then the commit completes and nothing about that file's length is reported at
    all — no warning, no note, and no line naming the file,
  And given a change is staged that leaves one covered file above its permitted
    length while a second covered file in the same commit stays well below its
    own,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the file named as being over is the
    first one only — the second file's compliance neither excuses the first nor
    is itself reported as a problem.
depends_on:
  - GE-127a
