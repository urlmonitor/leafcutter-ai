id: BO-3200c-2-i
title: "Finalize merges to main only on the person's own answer, and only reports a pause that was actually recorded"
component: build-orchestration
components:
  - build_orchestration
  - ac_driven_dev
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target:
  - code
  - pipeline
risk_surface: auth
criteria: |
  Given a finalize run that has reached the merge-to-main gate, and a resume answer for that
    gate whose channel is "person" and whose choice is to proceed,
  When the gate is resolved,
  Then the pull request is merged to main, by the same provenance rule finalize's own closure
    gate already applies.

  Given a finalize run at the merge-to-main gate and no resume answer from the person for it,
  When a live agent reply arrives for that gate in exactly the shape of a valid decision
    naming "ok" (for example a reply from an agent dispatched to "ask the user"),
  Then the pull request is not merged, the agent reply is not recorded as the person's choice,
    and the run pauses resumably at the merge-to-main gate.

  Given a finalize run at the merge-to-main gate,
  When the only resume answer present has a channel other than "person", or has no channel at
    all, or names a different gate,
  Then that answer is treated as no answer: the pull request is not merged and the run pauses
    resumably at the merge-to-main gate.

  Given a finalize run at the merge-to-main gate and a resume answer for that gate whose channel
    is "person" and whose choice is to decline,
  When the gate is resolved,
  Then the run halts before the merge, the pull request is not merged, and the outcome reports
    that the person declined, distinguishable from a pause awaiting an answer.

  Given a finalize run that reads or writes its pause record,
  When it dispatches that read or that write,
  Then the dispatch goes to the agent chartered to run workflow shell commands, and never to
    the status-reporting agent that is not permitted to run commands.

  Given a finalize run pausing at a gate,
  When the pause record is confirmed written,
  Then the run reports that it is paused awaiting the person's input.

  Given a finalize run pausing at a gate,
  When the write of the pause record fails, is refused, or cannot be confirmed,
  Then the run does not report that it is paused awaiting input; it reports a distinct
    pause-persist-failed outcome naming the gate, and the pull request is not merged.
depends_on:
