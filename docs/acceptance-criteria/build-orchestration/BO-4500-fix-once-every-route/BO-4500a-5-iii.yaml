criteria: |
  Given a quick-fix run for the criterion BP-601 that changed scripts/target.py, wrote
    unit_tests/test_bp_601.py, created the record BP-601 and wrote a changelog entry,
  When the workflow makes each of its two commits,
  Then each calls the shared commit step in supervised mode naming BP-601 and exactly the
    files that commit is for,
  And the workflow continues past a commit only on a committed answer, and stops reporting the
    answer's status and reason on any other.

  Given the same run is started in a workspace whose current branch is main,
  When the workflow reaches a commit,
  Then the shared step refuses and the workflow stops with that refusal, recording nothing.

  Given quick-fix's commit recipes before this change and the shared step after it,
  When the migration is reviewed,
  Then quick-fix's ban on the shared stash (BP-600c-3-ii) and its protected-branch refusal
    (BP-600f) are each present in the shared step before quick-fix is moved,
  And their regression tests run against the shared step and pass.
