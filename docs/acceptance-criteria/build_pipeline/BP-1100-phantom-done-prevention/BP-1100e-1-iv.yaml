id: BP-1100e-1-iv
readiness: draft
priority: medium
title: "The reconciliation no-ops cleanly when the ticket has no files_touched frontmatter"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket (or a repository whose tickets) carries no files_touched frontmatter
    at all — the field is absent, not merely empty
  When the pre-done reconciliation runs
  Then it no-ops cleanly: it does not flag the ticket and does not error, because there
    is no declared scope to reconcile the actual changes against
  And it reports (to stderr / advisory log) that reconciliation was skipped for lack of
    a files_touched declaration, so the skip is visible rather than silent
  And a repository that does not use files_touched frontmatter at all is never blocked
    or errored by this check
depends_on:
  - BP-1100e-1
