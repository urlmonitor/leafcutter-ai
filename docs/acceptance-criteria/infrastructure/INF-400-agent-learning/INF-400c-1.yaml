id: INF-400c-1
title: "An ADR documents the decision on whether learning emissions reuse the existing telemetry sink"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
criteria: |
  Given the existing feedback infrastructure uses two JSONL sinks:
    - feedback.jsonl (phase-agent sign-off feedback via submit_feedback.py),
    - agent_telemetry.jsonl (structured telemetry events including knowledge_captured),
  And the knowledge-emission mechanism (INF-400b) must decide whether to:
    - Option A: route learning emissions through agent_telemetry.jsonl (reuse existing sink),
    - Option B: create a separate dedicated sink (e.g., knowledge_emissions.jsonl),
  When the system is designed for learning emission routing,
  Then an ADR is authored at docs/architecture/adrs/ADR-NNN-learning-emission-sink.md
    that documents:
    1. The decision context (what learning emissions are, volume expectations,
       consumer requirements),
    2. The options considered (reuse telemetry sink vs. separate sink vs. other),
    3. The chosen option with rationale,
    4. The consequences (impact on harvester design, replay semantics,
       backward compatibility with existing telemetry consumers),
  And the ADR is authored BEFORE any harvester implementation begins,
  And the ADR references INF-400b and INF-400c as the driving requirements.
depends_on: [INF-400c]
