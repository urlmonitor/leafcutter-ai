assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The seven records under docs/acceptance-criteria/knowledge-management/KM-200-artifact-analytics/ (KM-200.yaml plus KM-200a..KM-200f.yaml, merged in PR #433) are REAL on-disk records produced by the actual authoring path with real PyYAML serialisation — they are the fixture this AC requires, and the CLAUDE.md 'Real-artifact behavioral spot-check' convention is what makes them mandatory rather than optional. The known failure this guards against is a hook whose parser matched only the indentation style of hand-typed fixtures and was a complete no-op on the real column-0 block-list serialisation."
  - "The records must be exercised as they exist, not copied into a test fixture directory with hand-applied edits. Copy the seven files verbatim into a temporary git repository preserving their relative store path, and apply exactly one mutation between the two runs: adding, then removing, the marker on KM-200.yaml. The committed store records must be unchanged when the test finishes."
  - "Both runs must be fresh OS processes. In-process re-execution and importlib.reload() mask cold-import bugs and the hook's fail-open module-resolution fallback, which is exactly the path this AC is meant to prove was not taken."
  - "The staged set must be established through a real git index (git add in the temporary repo), because the hook determines its input from git rather than from argv. Passing the seven paths directly exercises a different code path from the one pre-commit uses."
  - "Evidence must come from the DEPLOYED hook where possible (python3 scripts/build.py, then run .leafcutter/scripts/commit_guardian/run_hook.py against the staged set) — a source-tree-only run cannot detect a missing deploy_map entry, which is the standing deployment hazard for this hook's dependencies."
  - "This AC asserts the two runs and their difference only. It must not assert anything about the other pre-existing orphans in the store; that boundary belongs to ACS-1200b-3."
test_spec:
  - name: test_real_km200_records_pass_with_marker
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The seven real on-disk KM-200 records, staged in a temporary repo with the marker on KM-200.yaml only, produce exit 0 from a fresh hook process with no SKIP set."
  - name: test_real_km200_records_blocked_without_marker
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The identical seven files with the marker removed exit non-zero and report six violations naming KM-200a through KM-200f."
  - name: test_marker_is_the_only_difference_between_the_two_runs
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A byte-level diff of the two staged sets differs only in the marker lines on KM-200.yaml, so the passing run is attributable to recognition and not to the check having stopped running."
  - name: test_committed_store_records_unmodified_by_the_test
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "After the test completes, the seven records in the real store are byte-identical to their committed content."
