level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run R that has no staged decision record, for example a run whose decision no human
    approved, or a run id that names another run,
  When python -m kernel decisions publish --run-id R runs,
  Then it exits with code 3 and the message "no staged decision record for this run",
  And no file under docs/decisions/ is created or changed.
