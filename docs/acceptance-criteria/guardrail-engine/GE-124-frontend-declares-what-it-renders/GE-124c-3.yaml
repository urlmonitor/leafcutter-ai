notes: |
  VERDICTS 3 and 4 of four — NOT REPORTED and PASS. They are one AC because
  they share the single guarantee that matters here: the check is quiet unless
  something is wrong with something you changed.

  STAGED-SET SCOPING IS STATED, NOT ASSUMED. The commit tier is naturally
  scoped to the staged set, and that is exactly why it was worth writing down:
  an unexamined convention is one refactor away from becoming a whole-tree scan
  that fails on the entire existing frontend. Scenario 1 fixes it, and its last
  clause fixes the reading that matters — an unstaged file is NOT EXAMINED, and
  not examined is not passed. Mirrors GE-124e-4 scenario 4 at the other tier.

  ONE PRINCIPLE, TWO SUBJECT TYPES. This AC and GE-124e-4 are the same rule:
  only what the change touched is evaluated. Here the subject is a file path and
  the diff selects it directly; there the subject is a criterion id and the diff
  selects it through two routes. Matches the house pattern —
  `check_done_proof --mode ci-changed`, the diff-scoped component-vocabulary CI
  job, GE-111c-1 ("Only links whose source the commit staged are evaluated"),
  and the presence-only-assertion staged-hunks ratchet.

  SCENARIO 3 IS THE BACKFILL MECHANISM, and it is why no cutoff or exempt list
  is needed anywhere in this tree: the existing untouched frontend is not
  retrofitted, and each legacy file joins the guardrail on the day someone next
  edits it. The mock-data invariant is explicit that a
  missing-component-declaration finding implies its subject is staged.

  The fourth scenario is the false-positive guard that GE-117d-2 also carries —
  a diff with nothing in scope must produce zero verdicts, not a set of
  satisfied ones, and an empty verdict set must read as proceed rather than as
  "nothing was checked, therefore fail".

  The pass record in scenario 2 is deliberately a RECORD, not a success banner.
  GE-124g-3 constrains how it may be counted, and GE-124e-5 constrains the
  language a pass may use.
