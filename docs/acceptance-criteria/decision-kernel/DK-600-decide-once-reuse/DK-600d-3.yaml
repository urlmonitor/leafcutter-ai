criteria: |
  Given a staged record dec-d53e1c52cd47c832 that passed validation,
  When the publish command writes it,
  Then the record is written to docs/decisions/dec-d53e1c52cd47c832.yaml with the staged record's
    content,
  And docs/decisions/index.json is regenerated and includes an entry for dec-d53e1c52cd47c832,
  And python -m kernel decisions validate, run afterwards, exits 0 and reports ok as true, no
    problems, and a records count that includes the new record.
