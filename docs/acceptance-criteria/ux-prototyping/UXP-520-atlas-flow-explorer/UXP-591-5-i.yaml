risk_surface: internal
it_requirements:
  - 'A push from an open drawer does not first rewrite the entry it leaves: that entry keeps the URL last
    replaced into it (?step=resolve, ?step=code) and its stored state; only the new entry starts with
    no drawer.'
  - '''Open sub-flow'' in the drawer and the drill affordance on the node share the one push path.'
  - Back reopens the drawer from the entry's ?step= through the same lookup as a deep link (UXP-591-2).
delivers_to: null
expects_from:
  ac_id: UXP-591-5
  contract: 'pushEntry(flowHref(targetFlowId), state: {crumbs: string[] (Flow ids, entry flow first),
    filters: {source: ''real'' | ''mock'', kind: ''user'' | ''data'' | ''architecture'', realization:
    ''all'' | ''built'' | ''spec'' | ''mock''}}) and the popstate restore that reads flow and drawer from
    the URL.'
test_spec:
  - name: picking python-coder-internal with the resolve drawer open pushes /flows/leafcutter/python-coder-internal
      and Back reopens resolve
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: criterion
    must_catch:
      - closing the drawer replaces the left entry's URL before the push
      - Back returns the flow with no drawer
  - name: '''Open sub-flow'' from the code drawer pushes python-coder-internal and Back reopens the ''Coders
      make it green (prio 6-8)'' drawer'
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: seam
test_rationale: Both push entry points (selector and drawer button) are exercised, because each can close
  the drawer with a replace before pushing.
