it_requirements:
  - >-
    New how-to under docs/how-to/ (name chosen by documentation-expert) with the repo's doc
    frontmatter, registered through the doc-index flow. Commands, report fields, the durable log
    path and the worktree_cleanup.sweep_interval_hours key are copied from the built behaviour
    (BO-4400d-2 / BO-4400d-3), and the key is also listed in docs/reference/skills-config-fields.md.
  - >-
    The relation to the operator's machine-local ~/bin/wsl-reclaim timer is stated (the packaged
    sweep covers workspaces and scratch; the machine-local tool is not changed).
  - >-
    ONE RULE (user decision 2026-11-16): the workspace kept reasons and the 7-day and 14-day idle rules are
    stated with the exact reason values and threshold defaults the built pass uses (BO-4400g-2, BO-4400g-2-v),
    and the guide links to docs/how-to/clear-a-workspace.md for their detail instead of copying its table.
test_required: true
test_intent:
  - clause: the guide shows the command to run a preview and the command to run a real sweep, each with an example report naming the count per kind and the bytes freed
    needs_test: true
    reason: The commands and report fields must be the built sweep's, which a doc test tied to the sources catches when they drift.
  - clause: 'the guide lists every reason an item is kept -- for a workspace, the landed-work pass''s reasons (not yet on the main line, holds unsent work, no work of its own yet, in use, landing could not be confirmed, shared project unreachable), and for scratch, not yet expired -- and what the person can do about each'
    needs_test: true
    reason: The sweep now reports the pass's reasons, so a page still listing the old four would mislead, and the closed set can be checked against the sources.
  - clause: the guide states that a workspace with no work of its own is cleared once no file in it has changed for 7 days, and that one whose work is pushed but never merged is cleared once it holds nothing unsent and no file in it has changed for 14 days, its work staying on its line on the shared project
    needs_test: true
    reason: The two figures must equal the pass's named defaults, which a doc test can compare with the maker's source.
  - clause: 'the guide states where the sweep''s durable report log is written'
    needs_test: true
    reason: A wrong log path sends the person to an empty file, and the path can be checked against the built sweep.
  - clause: the guide shows the setting that controls the interval between automatic sweeps and its default of 24 hours
    needs_test: true
    reason: The key name and default must match the built config, which a doc test reads.
