id: TQ-500f-3-ii
components:
  - testing_quality
  - build_orchestration
title: "The /build-feature path runs the same red-baseline reader the fast lane uses, and does not take the test writer's word for it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given two tickets driven through /build-feature, each with a newly added
    test covering the same requirement, whose test requirements entry
    carries must_catch: ["revert the fix"],
      K1: the test writer's sign-off reports its red baseline as red, and the
          test's only failure is
          "ImportError: cannot import name 'refresh_config_v2'",
      K2: the test writer's sign-off reports red, and the test fails with
          "AssertionError: expected 1 refresh call, got 3",
    and a third ticket K3 that has no source requirement (no source_ac),
  When the ticket reaches the step between the test writer and the coder,
  Then the /build-feature path runs the same red-baseline reader the fast
      lane runs, over the same inputs (the requirement ids and the test
      root), before the coder is dispatched,
    And K1 does not reach the coder: the drive stops that ticket with the
      reader's report naming the test and the absence-only red, even though
      the test writer's own sign-off said red,
    And K2 reaches the coder as it does today,
    And for K1 and K2, which have a source requirement, the full shared reader
      applies, including every halt reason it already has in the fast lane
      (for example no newly added test tagged as covering the requirement),
    And K3 records "red-baseline reader not applicable: no source requirement"
      and continues to the coder; it is never recorded as verified,
    And for the same tests and run outcomes, the /build-feature verdict and the
      fast-lane verdict are identical.
depends_on:
  - TQ-500f-3
  - TQ-500f-3-i
