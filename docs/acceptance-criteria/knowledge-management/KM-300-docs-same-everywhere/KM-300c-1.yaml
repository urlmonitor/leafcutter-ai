assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Implement as a new blocking check hook in its own tracked source file (templates/scripts/commit_guardian/check_doc_index_links.py), not inside transform-doc-index: that hook is fail-open by contract (always exits 0) and only runs when a doc other than INDEX.md is staged, so it cannot refuse a commit"
  - "Register it in the tracked templates/scripts/commit_guardian/commit_guardian.json hooks_manifest (tier judgment, files matching docs/*.md so it also runs when only docs/INDEX.md is staged), ordered AFTER transform-doc-index, plus a row in the package README Commit-Guardian hooks table, following the create-hook scaffold pattern. Rebuild with python scripts/build.py so the deployed scripts/commit_guardian/ copy and .pre-commit-config.yaml (both gitignored) pick it up"
  - "Must read the map as staged (the index version after the transform hook re-staged it), not the working-tree file and not HEAD"
  - "Must inspect only map entries' link text and link targets; link recognition must cover both the table rows and the single-file list entries, and be shared with KM-300c-2's resolution check"
  - "A link target is machine-specific if it contains a backslash, a drive letter, a leading '/', or a URL scheme such as file:"
  - "The refusal message must name the map path, each offending line number and the offending text or target, state that link paths must use '/', and give the regenerate command with the path valid in the layout the hook runs from (deployed or source), not a hard-coded source path"
  - "Must complete within 1 second for a map of 1,000 entries"
  - "Must not ship before KM-300a-1 is merged, or it refuses every commit made on Windows"
  - "New hook file must stay under the 400-line .py limit"
delivers_to: null
expects_from:
  ac_id: KM-300a-1
  contract: "The generator emits forward-slash-only links, so a correctly generated map passes this check"
