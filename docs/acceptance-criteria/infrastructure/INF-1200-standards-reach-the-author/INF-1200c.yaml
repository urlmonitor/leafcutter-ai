  - path: docs/acceptance-criteria/agent-registry/AR-100-technology-ownership/AR-100.yaml
    relationship: depends_on
    status: exists
    relevance: >-
      THE INPUT, NOT THE SUBJECT. AR-100 owns that ownership of a kind of file
      is real and complete. This criterion consumes that answer and asks
      whether the owner was informed. If ownership is wrong or missing, this
      criterion faithfully informs the wrong party or nobody — and that is
      AR-100's defect to fix, not this one's. Do not re-decide ownership here,
      and do not propose a second place to record it.
  - path: config/agent_registry.json
