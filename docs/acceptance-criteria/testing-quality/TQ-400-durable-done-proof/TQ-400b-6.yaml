      and it is what turns "shows every state a record can occupy" from a
      judgement into a check.
  - path: docs/architecture/diagrams/c2-003-ac-readiness-states.md
    relationship: describes
    status: exists
    relevance: >-
      IT-PO ADDITION. THE EXISTING STATE DIAGRAM IN THIS STORE — and it covers the
      READINESS axis, not the work_status axis. Read it before authoring: the new
