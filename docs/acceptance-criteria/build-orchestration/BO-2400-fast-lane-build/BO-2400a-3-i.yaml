id: BO-2400a-3-i
components:
  - build_orchestration
  - testing_quality
title: "Red-baseline gate halts when the batch will not go red"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the red-baseline gate has classified the batch's covering tests and no
    newly-added covering test is classified red,
  When the red-baseline check completes,
  Then the loop halts before the coder agent is dispatched,
  And the halt carries exactly one reason drawn from a fixed named set:
    no_new_covering_tests, when no covering test for the batch is newly-added;
    all_new_tests_green_at_baseline, when every newly-added covering test is classified
    green;
    no_red_outcome_among_new_tests, when the newly-added covering tests are green and
    inconclusive with at least one inconclusive,
  And the halt report names every newly-added covering test with its associated
    acceptance-criterion id and its observed outcome.
depends_on: [BO-2400a-3, BO-2400a-3-ii, BO-2400a-3-v, BO-2400a-3-vi]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "A newly-added covering test that is green at baseline is NOT a halt: it is reported as green_at_baseline and the run proceeds, provided some other newly-added covering test is red. The hard halt fires only when NO newly-added covering test is classified red. This replaces the original requirement that 'a green-at-baseline test is a hard halt, never a warning that proceeds' — see amended_by and BO-2400a-3-v."
  - "A pre-existing covering test never triggers this halt, whatever its outcome (BO-2400a-3-iv). Only the newly-added partition is consulted."
  - "The halt report must name every newly-added covering test with its associated AC id and observed outcome, plus the single halt reason, so the operator can see why no red baseline was established."
  - "The halt reason must be one of a fixed, named set (no_new_covering_tests, all_new_tests_green_at_baseline, no_red_outcome_among_new_tests) rather than free-form text, so callers and tests can branch on it. BO-2400a-3-vii adds baseline_partition_unavailable for the degraded-git case."
  - "The halt must be surfaced as a structured blocker result from the workflow (not a silent skip), mirroring the existing pre-dispatch guard abort shape."
delivers_to: null
expects_from:
  ac_id: BO-2400a-3
  contract: "The red-baseline verdict and the per-test pass/fail results for the batch that this halt path inspects."
test_spec:
  - name: test_loop_halts_when_no_new_test_is_red
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "If no newly-added covering test is red, the loop halts before the coder is dispatched."
  - name: test_halt_reason_distinguishes_no_tests_from_all_green
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "An empty newly-added set halts with no_new_covering_tests; an all-green newly-added set halts with all_new_tests_green_at_baseline."
  - name: test_halt_report_names_offending_test_and_ac
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "The halt report identifies each newly-added covering test, its AC id and its observed outcome."
