notes: |
  THE SMALLEST KIND BY COUNT AND THE MOST DECEPTIVE BY NATURE. A configuration setting
  that works and a configuration setting that nothing reads are byte-for-byte identical
  as artifacts. There is no reading of the file, however careful, that distinguishes
  them. Only running the thing it configures does.

  THE DIFFERENTIAL CLAUSE IS THE WHOLE PROOF. Running the component with the setting in
  place and observing correct behaviour proves nothing on its own: a component with the
  setting hard-coded, or one that ignores it and happens to do the right thing by
  default, passes. Changing the value and requiring the behaviour to change is what
  separates a setting that is honoured from one that is merely present. This is the
  same shape as the prompt proof and for the same reason.

  THIS PROJECT HAS PAID FOR IT REPEATEDLY. A gate configured but never reached, a hook
  whose dependency was not deployed so it never ran, an allowlist read from the wrong
  root so every entry in it was ignored — in each case the configuration was correct,
  present, reviewed, and had no effect. Every one of them would have been caught by the
  differential clause and by nothing weaker.
