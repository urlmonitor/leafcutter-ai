title: "One file gets one answer however its path is written"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  FIXTURE ROOT USED BY EVERY SCENARIO BELOW. Each scenario builds a throwaway
  project root, written <root>, that is a directory of its own and contains no
  part of this repository, and no fixture is written anywhere inside this
  repository's own working tree — a fixture under this repository's tickets/,
  docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/ would take
  its verdict from this repository's reduced-scrutiny list rather than from the
  scenario's. Every scenario is exercised the way a commit exercises the check:
  the file is staged in <root> and the credential check runs over the staged set,
  with the path presented in the spelling named by the scenario.

  Given <root> contains three files, each holding one line with the same
    thirty-two-character opaque token of measured Shannon entropy 5.17:
      tickets/00_inbox/note.md          (a location the project chose)
      src/vendor/tickets/handler.py     (a folder reusing a chosen name)
      src/app.py                        (an ordinary source path)
  And no suppression entries are in force,
  When each file is put through the check once per spelling of its path — as an
    absolute path from the filesystem root, as a path relative to the top of the
    project, as that same relative path written with a leading current-directory
    marker, and as that same relative path written with the separator the host
    platform uses,
  Then each file receives the same verdict under every spelling: the chosen
    location's token is not reported in any of them, and the other two files'
    tokens are reported in all of them,
  Because the check is handed paths by the commit machinery in whatever spelling
    that machinery produces, and a comparison that recognises one spelling and
    not another reopens the hole for every path presented the other way — silently,
    since the author sees a clean result either way.

  Given <root> contains tickets/00_inbox/note.md and src/app.py, both holding the
    same token,
  And no suppression entries are in force,
  When the two files are presented by paths that reach them indirectly —
    docs/../tickets/00_inbox/note.md for the first, and
    tickets/../src/app.py for the second,
  Then the first file's token is still not reported and the second file's token
    is still reported,
  Because the location that decides the verdict is the one the path arrives at,
    not the segments it passes through on the way; a path that merely mentions a
    chosen name while resolving elsewhere must not collect the entitlement, and a
    path that mentions another folder while resolving into a chosen location must
    not lose it.

  Given <root> contains src/vendor/tickets/handler.py holding the same token,
  And no suppression entries are in force,
  When it is staged and presented to the check twice in the same run, once by its
    absolute path and once by its path relative to the top of the project,
  Then the token is reported both times,
  And the two presentations do not disagree with each other,
  Because a single file that is exempt under one of its own names and reported
    under another leaves the outcome to whichever spelling the caller happened to
    use, which is the same undetectable loss this L1 exists to remove.
