id: KM-KGS-100b-9
components:
  - knowledge_management
readiness: approved
priority: medium
title: "A missing or unparseable index falls back to the live full parse"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the read index is enabled but the on-disk index file is absent, or is present
    but cannot be parsed as a valid index
  When an index-backed read is requested
  Then the knowledge query falls back to a live full parse of every declared surface
  And it returns the same correct nodes and edges the live full parse produces for the
    current tree
  And the read completes with a success result — it neither raises an error to the
    caller nor returns partial or stale data because the index was missing or corrupt
depends_on:
  - KM-KGS-100b
  - KM-KGS-100b-5
doc_links:
  - path: scripts/knowledge_query.py
    relationship: describes
    status: exists
  - path: docs/architecture/components/knowledge-management.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Fail-open: an absent index file, an unreadable one, or one that fails to parse/validate must all route to a live full parse of the declared surfaces (config/paths.json), returning a correct, complete result — never partial, never stale."
  - "The fallback catches the specific I/O and parse exceptions (missing file, permission, JSON/decode/schema error), logs at WARNING per the project error-handling policy, and returns a success result to the caller — it never re-raises to the caller and never bare-excepts."
  - "A corrupt index must not be trusted for any surface: the read does not attempt to salvage partial surfaces from an index that failed validation."
test_spec:
  - name: test_missing_index_falls_back_to_live_parse
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "With no index file present, the read returns the same nodes/edges a live full parse produces and completes successfully."
  - name: test_corrupt_index_falls_back_to_live_parse
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "An unparseable/invalid index file causes a live-parse fallback returning correct results, with no error raised to the caller."
  - name: test_fallback_logs_warning_and_does_not_raise
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "The missing/corrupt-index fallback logs at WARNING and returns success rather than raising or returning partial/stale data."
delivers_to:
  agent: python-coder
  contract: "A missing/corrupt-index live-full-parse fallback path that always returns a correct, complete {nodes, edges} success result — reused by KM-KGS-100b-10-i to make a reader-only (writer-disabled) deployment safe by construction"
