criteria: |
  Existing requirements and their references migrate safely, with nothing left dangling.

  Adopting permanent names does not strand the requirements written under the old
  naming scheme: every existing requirement gains its stable name and metadata, and
  every reference between requirements continues to resolve — either kept working as-is
  or migrated cleanly, with no orphaned or dangling pointers left behind.
