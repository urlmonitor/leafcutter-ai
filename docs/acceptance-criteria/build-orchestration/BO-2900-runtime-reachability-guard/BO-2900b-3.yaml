  contract: "The derived set of automation-script paths to collect from — the automation scripts that exist at the time of the check, never a hardcoded list."
test_spec:
  - name: test_only_the_executed_capability_is_collected_from_a_decoy_laden_script
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs the real collector over a fixture automation script that executes the surface with `mark-done` while naming `claim` in a comment, in a printed operator message and in a local variable; asserts mark-done is collected and claim is not."
  - name: test_collected_set_is_byte_identical_after_renaming_all_three_decoys
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Re-runs the collector over the same script with the comment, the message and the variable renamed and asserts an identical list of Invocation records — the property no substring implementation can satisfy."
  - name: test_uncollected_claim_makes_a_registered_claim_capability_report_as_uncalled
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs the full forward check over the same fixture with `claim` registered on the surface and asserts it is reported as having nothing that runs it — the consequence clause, asserted end to end rather than inferred from the collector alone."
  - name: test_collector_recognises_the_real_fast_lane_ship_invocations
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs the collector against the actual templates/workflows-js/fast-lane-ship.js on disk and asserts it collects the real claim/release/mark_done/select_connected/verify_red_baseline/verify_green_and_coverage invocations, so the collector is calibrated against the real artifact rather than a synthetic fixture."
test_rationale: "Every wrong implementation of this collector is a substring scan wearing a different name, and a direct-import unit test handed a list of tokens cannot tell the difference — it would pass on all four wrong variants. The rename-invariance property is only observable by running the real collector twice over two real files, and the consequence clause is only observable by running the forward check on top of it. The fourth test exists because of the repository's real-artifact spot-check rule in CLAUDE.md: synthetic fixtures reproduce the author's own assumptions about the invocation shape, and the shape here is a template literal inside a JavaScript command string, which is exactly the kind of format a hand-written fixture gets subtly wrong."
