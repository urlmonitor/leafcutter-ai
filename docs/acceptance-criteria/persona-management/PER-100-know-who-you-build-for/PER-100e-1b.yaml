title: "Persona creation script writes validated persona.yaml from structured input"
component: persona-management
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given structured persona data as a JSON payload containing identity, goals, frustrations, and context
  When the persona creation script is invoked with --create --slug "field-service-engineer" --data <json>
  Then it creates a new directory at docs/personas/field-service-engineer/
  And writes a persona.yaml file with the provided sections:
    - identity (name, role, archetype)
    - goals (primary goals as a list of strings)
    - frustrations (pain points as a list of strings)
    - context (environment, tools, constraints)
  And each section is a top-level YAML key with a non-empty value
  And the generated persona.yaml passes the persona validation script
