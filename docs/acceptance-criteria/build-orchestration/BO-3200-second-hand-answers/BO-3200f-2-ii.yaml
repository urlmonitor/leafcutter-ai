notes: |
  [PARTLY SUPERSEDED 2026-09-17 -- "this record specifies that harness's observable contract"
  no longer holds: the contract is TQ-600a-1, TQ-600a-1-i, TQ-600a-1-ii and TQ-600a-2. This
