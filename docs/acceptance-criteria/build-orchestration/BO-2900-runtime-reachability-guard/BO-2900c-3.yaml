notes: |
  Satisfies the parent L1's `documentation_triggers: [how-to]`.

  Intended agent is `documentation-expert` — left null per this run's instruction.

  DELIBERATELY NOT A SECOND GUIDE, and the criteria say so as an assertable clause.
  BO-2900b and BO-2900c each carry a `how-to` trigger, and the mechanical response is
  two documents. That would be wrong for the reader: an author renaming a capability
  trips both checks in a single change and needs one page describing one fix. Two
  pages also guarantee divergence, because the reverse-direction content is the half
  that changes least and rots first.

  The rule this decomposition applied: a documentation trigger requires the CONTENT to
  exist and be reachable, not a new file per trigger. Where two sibling L1s document
  two halves of one workflow, their documentation ACs name the shared destination.
  This is the same instinct as defining the invocation-collection rule once at
  BO-2900b-3 rather than in both directions.

  For the writer: BO-2900b-4 owns the guide's existence, placement and forward-direction
  content; this AC owns the reverse-direction content within it. Satisfying one without
  the other leaves the guide half-written.

  2026-08-13 (IT PO enrichment). The shared destination is now named explicitly
  (docs/how-to/capability-automation-connection.md) on both this AC and BO-2900b-4, so
  the "one guide" constraint is mechanical rather than a matter of the writer noticing
  the cross-reference.
