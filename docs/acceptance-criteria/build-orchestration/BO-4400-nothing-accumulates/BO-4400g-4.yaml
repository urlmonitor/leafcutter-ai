it_requirements:
  - >-
    HARNESS EXEC BRIDGE, OWNED HERE (test-designer finding, 2026-11-16): unit_tests/_workflow_engine_harness.py
    only replays static label_responses. It has no shell-runner stand-in that runs the real maker. This record
    adds one, additively. A dispatch whose command is a maker command, recognised by the shared clearing-command
    parser that BO-4300g-2-i owns, is executed against the real deployed maker, and its stdout becomes the
    reply; every other dispatch keeps the static label_responses. The harness is extended, never forked.
    BUILD ORDER: BO-4300g-2-i's parser first, then this bridge, then BO-4400g-4-i (which adds the recorder and
    refusal mode on top of it). The flow proofs of BO-4400a-1, -1-i, -1-ii, -2, -2-i and -3-i run on this same
    bridge, so they are built after it or in the same build.
  - >-
    FINALIZE'S SCRATCH COPY, DECIDED: finalize's cleanup-baseline-worktree step (around line 501 of
    finalize-feature.js) removes the scratch workspace it obtained from the maker (kind scratch, with a slug)
    with remove --path, through workspaceRemoveCommand, which also appends --force. Keeping it out of scope with
    --path would contradict BO-4300g-2-i's approved check, which fails any clearing command that does not name
    the run's own work. So it moves to the name form, remove --kind scratch --slug <the slug the run's own
    workspace step used>, built by the same shared helper. --force is dropped: the maker accepts it and
    ignores it (a loss needs a discard token), so dropping it changes no behaviour. workspaceRemoveCommand(path)
    then has no caller left and is removed in the same change, after a search for other callers, so no
    workflow can send --path. The step stays best-effort, and its answer stays in scratch_clearing.
  - >-
    FLOW SURFACES: requirements authoring (templates/workflows-js/plan-feature.js), the fast lane
    (fast-lane-ship.js, which /fast-lane-build drives), the feature build (build-feature.js, with the
    single-ticket and epic workflows it delegates to, build-ticket.js and build-epic.js) and its finalize
    (finalize-feature.js), and the quick fix (quick-fix.js, the primary driver of /quick-fix). Ship
    is only prose (templates/skills/ship/SKILL.md, which today clears with remove --path). It is owned by
    llm-expert and is companion work, not this agent's surface. The companion change: ship sends remove
    --kind feature --slug <name> (the identity its step 1 already locates by) through the absolute deployed
    maker path, relays the door's answer unchanged, and keeps no other removal instruction. It is its own
    llm-expert record, BO-4400g-4-ii (user decision D4, 2026-11-16), an L3 under this record because
    BO-4400g is at its five-child cap.
  - >-
    ONE REQUEST BUILDER: every flow builds its clearing request through the one shared helper in
    templates/workflows-js/_shared/workspace-answer.js. The helper gains a name-based form that replaces
    workspaceRemoveCommand(path) (see FINALIZE'S SCRATCH COPY) and takes the same work identity (kind and short name, or line-of-work
    name) the flow used to obtain the workspace. No flow composes a remove command of its own, passes --path,
    or takes the work's location from an earlier answer, the target argument or agent prose.
  - >-
    THE COMMAND (settles the planner note under TIMING): every flow except finalize sends the per-work mode of
    BO-4400g-2, <maker> clear-landed --kind K --slug S (or --branch B), to shell-runner as its one clearing
    command. That mode applies the landed rule with no idle threshold: merged work is cleared through the
    door, a workspace with no commit of its own and nothing unsent is cleared at once (BO-4400a-1-i), and
    pushed but unmerged work is kept as not_on_main. Its one-work answer carries the door's own remove answer
    when it clears. Finalize step 7 runs after finalize's own merge step, so its clearing request is the door's
    remove by name (remove --kind K --slug S), carried in the worktree-agent request beside BO-4300g-3's
    removal_authorization. worktree-agent's remove action (BO-4300g-1, todo, llm-expert) issues remove by that
    name; that is a note for BO-4300g-1's builder, and its criteria do not change.
  - >-
    AUTHORIZATION, BUILT ON BO-4300g AND NOT RESTATED: a flow reaches the door only through a dispatch path
    that BO-4300g allows. Any dispatch to a removal-capable agent carries removal_authorization exactly as
    BO-4300g-1 defines it, built only from a definite ok answer of a maker locate by the same name (the
    BO-4300g-3 pattern), and it passes the BO-4300g-2-i repo-wide check. Finalize step 7 keeps BO-4300g-3's
    locate and authorization unchanged; only the door request it leads to takes the name form.
  - >-
    WHO CLEARS, DECIDED (user decision D1, 2026-11-16, option B of the former open question): an end-of-run
    clear in every flow except finalize sends the exact name-based clearing command to shell-runner, never to
    worktree-agent or any removal-capable agent. That one command, naming the flow's own work and no location,
    is itself the caller's authorization for exactly that one workspace; BO-4300g, BO-4300g-2 and BO-4300g-2-i
    are amended to state this exception. Finalize step 7 keeps BO-4300g-3 unchanged (see AUTHORIZATION above).
  - >-
    TIMING, DECIDED (user decision D2, 2026-11-16): a flow clears only after its pull request has merged, by
    the landed rule of BO-4400g-2 applied to its one workspace, never a second rule. A flow that ends before
    its pull request is merged clears nothing: its workspace is kept with reason not_on_main and left as it is
    for the landed-work pass, and the flow's final result carries the answer that says it was kept and why.
    BO-4400a-1 is amended to the same timing. The one exception (user decision Q2, 2026-11-16): the rule's
    idle thresholds (7 days, and 14 days for pushed but unmerged work, BO-4400g-2-v) guard only the
    unattended pass, so a flow that ends with no commit of its own and nothing unsent clears its own
    workspace at once (BO-4400a-1-i). The door's plain remove counts a pushed line as sent, so the command a
    flow sends applies the landed rule without its idle thresholds: the per-work clear-landed of THE COMMAND
    above (decided by the technical planner, 2026-11-16).
  - >-
    ONE CLEARING STEP PER FLOW, SHARED WITH BO-4400a-1: BO-4400a-1 (approved, todo) adds the route-end
    clearing step to requirements authoring, the fast lane, the quick fix and the builds. This record must not
    add a second clearing step beside it. Whichever record is built first adds the single step through the
    shared helper, and the other only changes the request it sends. Build both in one build, after the timing
    decision.
  - >-
    RELAY: the door's answer is relayed verbatim in the flow's final result, one object per BO-4300c-2. A
    refusal is reported as kept, never as success, and is never worked around (BO-4400g-4-i). The no-workspace
    answer of BO-4400g-1-i is reported as already gone, not as a failure. The bounded wait and the
    clearing-not-confirmed outcome of BO-4400a-1 are reused, not redefined.
  - >-
    E2 AND ADR-070: workflow bodies cannot run processes (ADR-030). Every maker command is one plain command
    line with absolute paths, sent through shell-runner (ADR-070 section 2), and each reply passes the section
    5 reply check. Edit templates/workflows-js/ only; the deployed copies come from the build (ADR-001).
  - >-
    EXISTING TESTS that pin the old dispatch sequence or the --path request are updated in the same change,
    never skipped or marked expected-failure: the finalize step-7 drivers of BO-4300g-3 and INF-700a-5-i, and
    the plan-feature dispatch-order test in unit_tests/test_workflow_dual_engine.py.
  - >-
    PROOF RUNS THE DEPLOYED WORKFLOWS under unit_tests/_workflow_engine_harness.py, with label-scripted agent
    replies. The shell-runner stand-in executes the real deployed maker against real temporary repositories
    and a real bare hub, and the pull-request merge is a recording stand-in with no network. The proof
    asserts on the recorded dispatches, the final result and the disk afterwards. It never greps workflow
    source, never spawns build.py (the shared reference layout), and isolates HOME and git config.
test_required: true
test_intent:
  - clause: no folder remains at the location its workspace occupied
    needs_test: true
    reason: A flow that never reaches its clearing step leaves the folder, and the pile-up this family exists for comes back.
  - clause: 'the flow''s final result contains the clearing door''s own answer for that workspace, reporting it cleared'
    needs_test: true
    reason: A flow that removes the folder by its own means leaves no door answer, which is how a second deletion route is caught.
  - clause: the clearing request the flow sent named its work by the same name it used to obtain the workspace, and gave no location
    needs_test: true
    reason: A request rebuilt from a parsed location reintroduces the look-up-parse-resend chain this record removes.
  - clause: the clearing request was made after the work was merged into the main line
    needs_test: true
    reason: A clear placed before the merge would treat a pushed line as sent, and only the recorded order against the hub's merge shows it.
  - clause: 'no flow other than finalizing dispatched an agent whose registered abilities include removing a workspace or deleting a branch: each of their clearing requests was the one clearing command, run exactly as given'
    needs_test: true
    reason: A flow that routes its clear to worktree-agent, or hands shell-runner a changed command, breaks the user's decision D1 and the BO-4300g bound.
  - clause: 'finalizing''s only such dispatch was its step-7 workspace removal, carrying beside its clearing request the authorization that names exactly its own workspace and line of work'
    needs_test: false
    reason: BO-4300g-2 counts finalize's removal-capable dispatches and BO-4300g-3 proves the step-7 authorization, so a test here would repeat theirs.
  - clause: the workspace of "fastlane/tq-200d-4" still exists, identical to its state when its pull request was opened
    needs_test: true
    reason: A flow that clears on a pushed but unmerged line would remove it, which is the timing the user decided against.
  - clause: 'the flow''s final result reports that workspace as kept because its work is not yet on the main line'
    needs_test: true
    reason: The kept reason must come from the real one-work answer, or the person cannot tell kept from failed.
  - clause: the workspace of "fastlane/tq-200d-4" is cleared
    needs_test: true
    reason: A workspace a flow kept must still be reachable by the landed-work pass, or it is never cleared.
  - clause: 'no step of the fast lane, or of any other flow, was run between the flow''s return and that clearing'
    needs_test: true
    reason: The clear must come from the pass alone, not from a flow that has to be run again.
test_spec:
  - name: test_each_merged_flow_leaves_no_folder_at_its_workspace_location
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The deployed plan-feature, fast-lane-ship, build-feature plus finalize-feature, and quick-fix workflows are run
      under unit_tests/_workflow_engine_harness.py run_workflow_under_e2 (a node subprocess), each with label-scripted
      agent replies, a workspace made by the real deployed maker's ensure on a real project and bare hub, and its pull
      request merged on the hub before the flow returns. PREREQUISITE the build must add: the harness today replays
      static JSON label_responses (_build_shim serialises them into the node shim, which holds no process access), so a
      shell-runner stand-in that really runs the dispatched maker command needs an additive exec bridge in the
      harness (a label marked to execute its dispatched command host-side and return stdout). With it, after the
      flow returns, os.path.lexists is false for the workspace location of each flow. Red today: no flow but
      finalize clears (plan-feature.js, fast-lane-ship.js, build-feature.js and quick-fix.js carry no clearing dispatch).
    proves_clause: no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_final_result_contains_the_doors_own_clearing_answer
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      HarnessResult.result (the script's returned value) of each flow contains the maker's one-work answer verbatim,
      including the door's remove answer with removed_path equal to the location the flow's ensure answered. A flow
      that deletes by its own means or reports success without the answer leaves it out.
    proves_clause: 'the flow''s final result contains the clearing door''s own answer for that workspace, reporting it cleared'
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_clearing_request_names_the_work_the_workspace_was_obtained_by_and_no_location
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      From HarnessResult.agent_calls, take the dispatch whose command runs a maker clearing verb and compare its
      flags with the ensure dispatch's: same kind and short name (or same line of work), no --path, no location
      string of the workspace anywhere in the command. Today the shared helper builds only workspaceRemoveCommand(path)
      through makerCommand, whose flags know kind, slug, ticket, path and force and no branch or clear-landed verb.
    proves_clause: the clearing request the flow sent named its work by the same name it used to obtain the workspace, and gave no location
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_clearing_request_is_dispatched_after_the_merge_reached_the_hub_main_line
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      The live stand-in records, at the moment it executes the clearing command, whether the hub's main contains
      every commit the flow made (git merge-base --is-ancestor on the real bare hub), and the dispatch order puts
      the merge before the clear. A variant that places the clear before the merge keeps the workspace as not_on_main
      (the landed rule), so the folder remains and the test fails.
    proves_clause: the clearing request was made after the work was merged into the main line
    code_file: templates/workflows-js/fast-lane-ship.js
  - name: test_only_finalize_dispatches_a_removal_capable_agent_and_each_clear_is_the_one_command
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      For every flow except finalize, no recorded dispatch goes to an agent whose config/agent_registry.json entry
      declares removal_capable true (the set is read from the registry at test time, as BO-4300g-2 does, not a list
      kept here), and each clearing dispatch goes to shell-runner with a prompt equal to the one exact command,
      unchanged (no extra words, one plain command, absolute path). Existing code to leave alone: finalize's
      cleanup-baseline-worktree already sends remove --path through shellStepDispatch.
    proves_clause: 'no flow other than finalizing dispatched an agent whose registered abilities include removing a workspace or deleting a branch: each of their clearing requests was the one clearing command, run exactly as given'
    code_file: templates/workflows-js/plan-feature.js
  - name: test_flow_ending_with_an_open_pull_request_keeps_its_workspace_identical
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      The fast lane for fastlane/tq-200d-4 is driven to a pull request that stays open (commits pushed to its own
      line on the real hub, nothing merged). The workspace is byte-identical (files with .git, refs) to its snapshot
      taken when the pull request was opened. The clearing command still ran (per-work clear-landed with no idle
      threshold) and kept it.
    proves_clause: the workspace of "fastlane/tq-200d-4" still exists, identical to its state when its pull request was opened
    code_file: templates/workflows-js/fast-lane-ship.js
  - name: test_open_pull_request_result_reports_kept_not_on_main
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      HarnessResult.result carries the maker's real one-work answer with kept reason not_on_main, relayed verbatim,
      and not reported as a failure or as removed.
    proves_clause: 'the flow''s final result reports that workspace as kept because its work is not yet on the main line'
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_landed_work_pass_clears_the_kept_fastlane_workspace_after_a_hand_merge
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      After the flow returned, the pull request is merged on the hub by hand (a real merge pushed from a scratch
      clone), then python <deployed worktree.py> clear-landed --repo-root <project> runs as a subprocess. The
      fastlane/tq-200d-4 folder is gone and the answer lists it in cleared. Depends on BO-4400g-2 being built.
    proves_clause: the workspace of "fastlane/tq-200d-4" is cleared
    code_file: templates/scripts/worktree.py
  - name: test_nothing_ran_between_the_flow_return_and_the_pass_clearing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      The harness recorded exactly the dispatches of the one flow run and none after it returned (the test makes
      no second run_workflow_under_e2 call before the pass), and the stand-in log shows the only clearing command
      after the return is the pass's own. A sibling flow's step is never invoked.
    proves_clause: 'no step of the fast lane, or of any other flow, was run between the flow''s return and that clearing'
    code_file: templates/workflows-js/fast-lane-ship.js
  - name: test_plan_feature_reaches_its_clearing_step_in_the_deployed_flow
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      run_workflow_under_e2 on the deployed plan-feature.js (requirements authoring for ac/clear-merged-workspaces),
      driven to its end: a clearing dispatch is recorded and the disk shows the effect.
    proves_clause: no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/plan-feature.js
  - name: test_fast_lane_reaches_its_clearing_step_in_the_deployed_flow
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      run_workflow_under_e2 on the deployed fast-lane-ship.js for fastlane/tq-200d-3 driven to a merged pull request:
      the clearing dispatch is recorded and the folder is gone.
    proves_clause: no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/fast-lane-ship.js
  - name: test_feature_build_and_finalize_reach_their_clearing_in_the_deployed_flows
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      build-feature.js for feature/alpha is driven to its pull request and then finalize-feature.js through step 7:
      build-feature sends its per-work clearing command (kept as not_on_main until the merge), and finalize's
      step-7-remove-worktree is the one dispatch to the removal-capable agent, carrying the name-based clearing
      request beside BO-4300g-3's removal_authorization.
    proves_clause: no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/build-feature.js
  - name: test_quick_fix_reaches_its_clearing_step_in_the_deployed_flow
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      run_workflow_under_e2 on the deployed quick-fix.js for ticket/fix-null-slug driven to a merged pull request:
      the clearing dispatch is recorded and the folder is gone.
    proves_clause: no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/quick-fix.js
