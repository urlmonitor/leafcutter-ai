notes: >-
  The completeness half of BO-4100e, and the one every other child depends on -- nothing
  can be removed, classified or correctly described while it remains invisible. The last
  clause is the substance: a listing derived only from the registration record cannot
  ever surface a leftover that was never registered, so the discovery route has to be
  the location itself. Recovery only; the prevention half is BO-4100a-3-i.
