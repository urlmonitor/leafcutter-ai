notes: |
  SATISFIES THE how-to LEG of GE-126d's documentation_triggers. The reference-doc leg is
  GE-126d-5.

  THE END-TO-END EXERCISE IS THE COVERAGE AND IT IS WHY THIS IS AN ACCEPTANCE CRITERION
  RATHER THAN A DOCUMENTATION REQUEST. The defect KI-CG-020 records is precisely that an
  author can complete the documented procedure, watch the parity check pass, and have
  landed an incompletely registered check. Requiring the procedure-then-parity sequence to
  come out clean is the direct inverse of the observed failure.

  THE AUTHOR WHO NEVER READS THE AUTOFIX CONFIGURATION IS THE REAL READER. KI-CG-020 was
  found by someone reading that configuration for an unrelated reason, which is the only
  way it has ever been found. A procedure that assumes the author will go and look has not
  fixed anything.

  DO NOT RE-LIST THE LEGS IN THE PROCEDURE'S OWN WORDS — GE-126d-3 owns that constraint and
  this record inherits it. A procedure that enumerates the legs in prose while the parity
  check enumerates them in code is how the fourth leg drifted apart in the first place.

