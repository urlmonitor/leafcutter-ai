it_requirements:
- A decline (the agent states the task is outside its role) is a failure naming the decline; the workflow
  never re-sends a different command, to the same or another agent, in its place (the incident's step
  3-4).
- Proof runs the workflow under unit_tests/_workflow_engine_harness.py -- the deployed copy the build
  produces, so the build's workflow transform is exercised -- with label-scripted agent replies, and asserts
  on the RECORDED dispatch list, never on workflow source text. The harness must be able to model a workspace
  step that declines its task, answers in prose, answers exit 0 with a non-JSON path, or answers JSON
  without status (F13); extending the harness for this is in scope of the first AC that needs it.
- Workflow edits are made in templates/workflows-js/*.js and reach .claude/workflows/ only through the
  build; the deployed copy is what the tests run.
- 'HARNESS DEFAULT (duplication audit C2 item 11, KI-BO-009): unit_tests/_workflow_engine_harness.py''s
  agent() stub today answers any unscripted dispatch with {status: ''ok'', exit_code: 0, passed: true,
  ...}, so a workflow that mishandles a refusal is never exercised. The default must stop being a success:
  a dispatch with no scripted reply either returns an error-shaped reply (status ''error'', naming the
  unscripted label) or fails the test loudly; in both cases the harness result records the unscripted
  dispatch so a test can assert on it. A success reply is only ever returned because a test scripted
  it.'
- 'The harness must be able to script, per label, a refusal (the agent declines as outside its role),
  a prose paragraph, a non-JSON reply (including exit 0 with a bare file path), and JSON without status
  -- delivered to the workflow in the shape the real engine delivers them, not pre-parsed into an ok object.'
- 'Blast radius: every existing harness-driven test that relied on the ok default must script its replies
  explicitly (the existing script-specific defaults in _default_label_responses_for_script / _default_args_for_script
  are scripted replies and may stay). The ticket for this record lists the tests that changed; no test
  is skipped or xfailed to absorb the change.'
test_required: true
test_spec:
- name: test_declining_workspace_agent_ends_the_run_naming_the_decline
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With the workspace step scripted to decline, the run ends with status error whose message
    cites the decline.
- name: test_no_substitute_command_is_sent_after_a_decline
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Exactly one workspace dispatch is recorded.
- name: test_no_later_step_is_dispatched_after_a_decline
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: The recorded dispatch list ends at the declined step.
- name: test_harness_unscripted_dispatch_is_never_a_success
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: A minimal workflow run under the harness with one unscripted dispatch receives an error-shaped
    reply (or the test run fails loudly) and the harness result names the unscripted label; no reply with
    status 'ok' or exit_code 0 is produced for it.
- name: test_harness_scripts_refusal_prose_and_non_json_replies
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: A workflow under the harness receives, per scripted label, a decline, a prose paragraph,
    a bare file path with exit 0, and JSON lacking status, each exactly as scripted and not coerced into
    an ok object.
test_rationale: The 2026-09-25 incident was a perfect-enough maker with a caller that carried on, and
  every source grep of plan-feature.js would have passed. So the assertions are made on the recorded dispatch
  list of a real workflow run with scripted hostile answers, which is the only place 'no later step was
  dispatched' can be observed.
