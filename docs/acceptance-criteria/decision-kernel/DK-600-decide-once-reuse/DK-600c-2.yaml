    covers:
    - DK-600c-2
delivers_to:
  agent: python-coder
  ac_id: DK-600c-3
  contract: 'A model-validated kernel.memory.models.DecisionRecord matching config/decision_record.schema.json:
    schema_version ''1.0'', kind ''decision'', id ''dec-<16 hex>'', approval {approval_status: approved,
    approved_by: ''human'' | ''human:<id>'', approved_at: ''YYYY-MM-DDTHH:MM:SSZ''}, evidence: [{id,
    locator, category, content_hash: 64 hex, verification, relevance, source_version}] with no text
    field, assessment {basis, design_reason, selected_rank, ranking: [{option_id, rank, required_passed,
    required_total, required_mean, scores}]}, precedents_considered: [{id, applicability, action,
    note}], provenance {run_id, root_task_id, langfuse_trace_id: 32 hex, repository_revision {commit,
    dirty}, template_version, model_version, kernel_version, decision_versions}; serialised by kernel.memory.codec.dump_record
    (plain YAML subset).'
expects_from:
  ac_id: DK-600c-1
  contract: 'kernel.memory.staging.stage_decision_record(ctx, decision, options, criteria, evidence,
    ranking: list[OptionRanking] (kernel_ranking only), precedents: list[PrecedentNote], basis: ''kernel_ranking''
    | ''resolved_gate'' | ''precedent_reuse'', criterion_evidence: {criterion_id: [evidence_id]},
    supersedes: [dec ids], related: [dec ids]) called once per COMPLETED result, with the Decision
    exactly as resolved (approved_by and approved_at untouched).'
