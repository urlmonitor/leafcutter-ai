criteria: |
  Given the canonical commit_guardian.json is read after the page-documentation
    hook is added
  When a consumer inspects the hooks_manifest.hooks array
  Then it contains an entry for the page-documentation hook with:
    - a stable hook id identifying the new-page-documentation check
    - a files pattern that matches frontend page files at site/app/**/page.tsx
    - pass_filenames consistent with the existing component-integrity hook pattern
    - stages: ["pre-commit"]

  ---

  Given the canonical commit_guardian.json is read after the page-documentation
    hook is added
  When a consumer inspects the top-level configuration section for the hook
  Then it contains a configuration entry exposing the block-versus-warn mode for
    the page-documentation check
  And the mode value can be set to block or to warn-only
  And the configured mode is the value the hook reads at pre-commit time to decide
    whether to block or only warn
