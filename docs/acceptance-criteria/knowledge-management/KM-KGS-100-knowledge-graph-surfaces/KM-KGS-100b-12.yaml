estimated_complexity: M
it_requirements:
  - "All three refresh triggers (post-commit, build-tail, session-start) reuse the single surface-scoped rebuild primitive delivered by KM-KGS-100b-7 — they update only the surfaces that changed at that boundary, not a full rebuild from scratch except where a surface genuinely requires it."
  - "Proactive refresh is gated by the writer flag (proposed `knowledge_index.write_enabled`, default OFF) and is a pure optimization: it must NEVER replace or weaken the mandatory per-read staleness check (KM-KGS-100b-6), so a missed event always degrades to slower-not-wrong on the next read."
  - "Each trigger maps to a specific carrier: post-commit -> the `.leafcutter/pre-commit-config.yaml` post-commit stage (KM-KGS-100b-12-i); build-tail -> scripts/build.py final step (KM-KGS-100b-12-ii); session-start -> the `.claude/settings.json` SessionStart hook (KM-KGS-100b-12-iii)."
  - "A refresh failure at any boundary must be non-fatal to that boundary's primary operation (a commit, build, or session start must still succeed) and log at WARNING; correctness is still guaranteed by the next read's staleness check."
test_spec:
  - name: test_refresh_reuses_surface_scoped_rebuild
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "A refresh event updates only changed surfaces via the KM-KGS-100b-7 rebuild primitive, not a full from-scratch rebuild."
  - name: test_refresh_does_not_replace_per_read_check
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "After a refresh, the mandatory per-read staleness check still runs on the next read (a missed event degrades to slower-not-wrong)."
  - name: test_refresh_gated_by_writer_flag_off_by_default
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "With the writer flag off (default), no proactive refresh writes an index at any boundary."
