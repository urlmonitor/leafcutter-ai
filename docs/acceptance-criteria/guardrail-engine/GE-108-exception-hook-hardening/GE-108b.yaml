it_requirements:
  - "ADR-FIRST: An accepted ADR documenting the enforcement-scope change (requiring genuine WARNING-or-higher logging — not DEBUG/INFO/print and not a mere name coincidence — for a blind-catch handler to count as non-silent) and its false-positive tradeoffs MUST exist before implementation begins. The doc_link ADR-014-exception-guard-enforcement-scope.md is currently status: planned; authoring it is a blocking prerequisite for this leaf."
  - "BUILD-CONVENTION: The committable source of truth is templates/commit-guardian/check_exception_handling.py. The scripts/commit_guardian/ copy is gitignored build output synced by `python leafcutter/scripts/build.py`. The fix MUST edit the template file and then rebuild; do NOT edit scripts/commit_guardian/ directly (ADR-001 self-hosting boundary)."
  - "AST-ONLY: The logging-level / real-logger heuristic must remain purely AST-based — no regex fallback or text matching."
  - "REAL-LOGGER RESOLUTION over name matching: the heuristic must distinguish a genuine logger call at WARNING-or-higher from a same-named user-defined function. Lexical name matching alone (the current _LOG_CALL_NAMES membership test) is insufficient to clear the handler."
  - "THRESHOLD: Only WARNING, ERROR, CRITICAL, and exception-level logging clear the handler. DEBUG, INFO, and print() must NOT clear it. A bare or wrapped re-raise clears it regardless of logging level (consistent with CLAUDE.md Error Handling Policy Rule 3)."
  - "SELF-HOSTING NON-REGRESSION: After the change, leafcutter's own production code must still commit cleanly — the stricter heuristic must not raise new BLE001 violations against handlers that already log at WARNING-or-higher or re-raise."
  - "The heuristic must be deterministic and idempotent: repeated analysis of the same file yields the same BLE001 outcome."
