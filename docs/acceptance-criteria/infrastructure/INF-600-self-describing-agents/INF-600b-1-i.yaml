id: INF-600b-1-i
title: "Card omits hyperlinks for documents that do not exist on disk"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given an agent registry entry with doc_links referencing
    "docs/architecture/nonexistent-doc.md"
  And that file does not exist in the repository
  When the card generator produces the agent card
  Then the non-existent document is listed as plain text (not a hyperlink)
    in the References section
  And the plain-text entry is annotated with "(missing)" or equivalent
    marker so readers know the link target does not resolve
  And the build emits a warning:
    "python-coder: doc_links references docs/architecture/nonexistent-doc.md
     but the file does not exist on disk"
  And the card generation does not fail (the missing doc is a warning,
    not a blocking error)
depends_on:
  - INF-600b-1
doc_links:
  - path: docs/agents/cards/python-coder.card.md
    relationship: describes
    status: exists
  - path: config/agent_registry.json
    relationship: describes
    status: exists
