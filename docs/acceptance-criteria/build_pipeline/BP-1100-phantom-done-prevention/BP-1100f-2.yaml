assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Surface is agent-template prose across templates/agents/pr-reviewer.md (the test-evidence / coverage-sufficiency lens) and templates/agents/test-writer.md (the authoring mandate) — not a mechanical check script."
  - "The evidence lens must classify dispatch-topology evidence (presence, labels, or counts of dispatched helpers that a test mock controls) as NOT covering a declared durable side-effect, and must require at least one test that produces the artifact and reads it back (a real-effect round-trip)."
  - "The test-writer mandate must require a real-effect round-trip test for any work item declaring a durable, observable side-effect; a dispatch-topology-only test does not satisfy coverage."
  - "Keep the distinction explicit and named: 'topology' = labels/counts a mock controls; 'effect' = the artifact actually on disk, read back."
  - "Portable per ADR-001 — keep the rule in the packaged templates and verify via the build.py round-trip; do not depend on the leafcutter repo's own root CLAUDE.md."
