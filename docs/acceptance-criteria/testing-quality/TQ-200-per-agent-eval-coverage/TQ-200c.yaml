documentation_triggers: []
documentation_rationale: |
  No separate documentation AC is authored, deliberately. The vocabulary this L1
  introduces has exactly one reference home — docs/testing/test-angles.md, the page
  that already defines the shared proof vocabulary — and TQ-200c-1 cannot be
  satisfied without that page carrying the new word, because a word that is not
  written down there is by definition not shared between the side that writes a plan
  and the side that consumes it. A separate reference-doc AC would double-book that
  same edit and let an implementer claim c-1 done with the vocabulary undocumented.
  The runner-facing how-to and reference-doc obligations are already owned by
  TQ-200b's documentation_triggers, and this L1 adds no new user-facing command
  surface.
