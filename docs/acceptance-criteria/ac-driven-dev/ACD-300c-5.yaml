notes: |
  Item 8(a). Stale sites named in the request, all in templates/workflows-js/plan-feature.js:
  ~L3132 comment, L3173 "The final gate (IT PO v3 review)", L3212
  buildCancelMessage(... "final gate (IT-PO)" ...), L3223-3224, and L3251
  formatCommitError("it-po", ...). The file is over its size limit (GE-127b-1 growth
  ratchet), hence the last clause. A test asserting the old cancel text, if any, changes in
  the same commit. The "Why why" sites are ACD-300c-5-i.
