notes: |
  Work item 4, part 3 (row missing-setting-database-work in
  scripts/evals/sets/test-writer.jsonl). Placed under TQ-200d-4, which owns the
  database-setting kinds and this row.

  The shared report_says_not_run kind serves the test-runner row too, and there a
  report claiming a run must keep failing. So the widening is scoped to the
  test-writer row (a test-writer-specific kind or spec key is an IT-PO call); the third
  scenario pins that.

  Clause (c) is the false-green boundary the user asked for: the red verification run
  alone is not evidence that the database part stopped at the missing setting.

  Ordering: depends on TQ-200d-4-v because both edit the report_says_not_run entry,
  and on TQ-200d-1-vi because this AC resolves the shared known issue last.

  IT-PO (2026-11-02).
    - Decision: new kind report_says_stopped_before_database (not a spec key on report_says_not_run),
      so the test-writer rule gets its own entry quoting a test-writer sentence while the
      test-runner row keeps the old kind unchanged. Kind count +1 (TQ-200d-1-ii drift
      tests must see the new entry in the same change).
    - Overlap: same database-setting page and README as TQ-200d-4-v (already a
      dependency); test-writer.jsonl and the shared known issue with TQ-200d-1-vi (already
      a dependency). depends_on unchanged.

  OPEN QUESTIONS (for the user at the final gate).
    - OQ-4vi-1: the recorded test-writer gold output for missing-setting-database-work
      says no test file was written and the database test 'was not run'. That contradicts
      the template (write the test, run it red in setUp), which is what the live re-runs
      did. The gold still passes the new kind through its not-run branch. Should the gold
      be re-recorded in the realistic form (test written, red in setUp, stopped before any
      connection)? Recommendation: yes, as a separate follow-up, not in this AC.
    - USER DECISIONS carried over: OQ-6 (docs stay with this AC's implementing agent);
      OQ-7 (legacy test_spec, no test_intent).

  USER DECISIONS (2026-11-03, final gate).
    - Approved, priority high. Build order: TQ-200d-5-iv first, then 1-iv, 1-v, 1-vi, 2-iii, 4-v, 4-vi.
    - OQ-4vi-1 answered: re-recording the missing-setting-database-work gold output is a separate follow-up (known issue), not part of this AC.
