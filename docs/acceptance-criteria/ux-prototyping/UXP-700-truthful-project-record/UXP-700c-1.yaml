id: UXP-700c-1
title: "Every pointer the record makes resolves, and one that does not is named"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project record whose journeys, example datasets and screens point at acceptance
    criteria, at each other, and at files in the project,
  When the record is checked,
  Then every pointer is resolved against what the project holds now,
  And each pointer whose target does not exist is reported naming the artifact that holds the
    pointer, the position within that artifact, and the target that did not resolve,
  And the check states how many pointers it resolved, so a run that resolved none is
    distinguishable from a run in which none were broken.
