id: GE-127d-3-iv
title: "Rewriting comments from one style to another adds no lines for the two-for-one repayment, in either direction"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked JavaScript file measured at 1200 lines against a permitted length
    of 1000, whose previous version carries a run of 4 `//` comment lines,
  And a staged change whose only effect is replacing those 4 lines with one
    `/* ... */` block carrying the same text,
  When the author performs an ordinary commit,
  Then the commit completes, the outcome states that the change added 0 lines,
    and the file is quoted at 1200 both before and after,
  And given the previous version instead carries that block and the staged change
    only restores the 4 `//` lines,
  When the author performs an ordinary commit,
  Then the commit completes and the outcome states that the change added 0 lines,
  And given a staged change to the same file that makes the same restyle and also
    puts 5 new lines of code into it, taking nothing out,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the outcome states that the change added
    5 lines and that the file is required to stand at 1195 or below,
  And the same three outcomes hold for a Python file over its limit when `#` lines
    are rewritten as a string literal standing alone as a statement and back —
    whether that string is a docstring, a bare string between two functions, or a
    trailing DECISION HISTORY string at the end of the module,
  And given the same over-limit file and a staged change that rewrites two `//`
    comment paragraphs separated by a blank line as one `/* ... */` block with a
    blank line inside it, and changes nothing else,
  When the author performs an ordinary commit,
  Then the commit completes, the outcome states that the change added 0 lines,
    and the quoted length is the same before and after,
  And given the same over-limit file and a staged change that only adds blank
    lines or only removes blank lines, anywhere in the file,
  When the author performs an ordinary commit,
  Then the commit completes, the outcome states that the change added 0 lines,
    and the quoted length is the same before and after.
depends_on:
  - GE-127d-3
  - GE-127f-2
