criteria: |
  Anyone looking for who writes requirements finds every agent that does.

  The product, analysis, technical-planning and test-design agents all write
  requirement records, and each one's published profile says so in the same terms,
  so nothing that relies on those profiles misses a writer or mistakes one for a
  step that only produces analysis.
