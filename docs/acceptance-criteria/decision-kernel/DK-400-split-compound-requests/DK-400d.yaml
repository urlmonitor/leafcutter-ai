criteria: |
  Approve, reword, trim or reject the split before any part runs.

  You see your request as you submitted it beside every proposed part, and you
  can approve the split as shown, reword a part, leave parts out or reject it;
  only a person can give that answer, and who gave it and when is kept with the
  split. A reworded part keeps the original proposal beside it and a left-out
  part never runs. If you reject the split, a request that could have been
  taken on as one question goes ahead as one decision, exactly as today; an
  unclear request comes back to you as the clarifying question you would get
  today; and only a request that nothing could handle ends with a plain note
  that nothing was decided and a hint to ask again as one question.
