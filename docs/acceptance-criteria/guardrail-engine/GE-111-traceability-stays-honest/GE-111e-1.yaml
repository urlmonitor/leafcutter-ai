id: GE-111e-1
readiness: approved
priority: high
title: "The block message names the criterion, the broken link, what changed, and the fix options"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111e.yaml"
criteria: |
  Given the traceability reconciliation check blocks a commit because criterion
    AC-X with implemented_by entry "src/foo.py#process_order" points at a symbol
    that moved to "src/orders/foo.py"
  When the check emits its block message
  Then the message names the affected criterion id "AC-X"
  And the message names the broken implemented_by entry "src/foo.py#process_order"
  And the message names the change kind (moved)
  And the message names the symbol "process_order" and its located new location
    "src/orders/foo.py"
  And the message points the developer to the reconciliation options (update or confirm)

  Given the check blocks a commit because criterion AC-Y with implemented_by entry
    "src/gone.py" points at a file that was deleted
  When the check emits its block message
  Then the message names "AC-Y", the broken entry "src/gone.py", and the change
    kind (deleted)
  And the message points the developer to the reconciliation options
