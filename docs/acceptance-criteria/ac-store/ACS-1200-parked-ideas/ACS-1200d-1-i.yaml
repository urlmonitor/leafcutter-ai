  - name: test_buildable_scan_returns_no_record_from_the_tree
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "scan_ac_store.py executed as a process returns a ready set containing no record from the tree, asserted by set comparison rather than by inspecting the leaf predicate."
  - name: test_marker_is_never_restored_automatically
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Re-running every surface over the unchanged tree leaves the record without a marker — nothing re-applies parked on the author's behalf."
