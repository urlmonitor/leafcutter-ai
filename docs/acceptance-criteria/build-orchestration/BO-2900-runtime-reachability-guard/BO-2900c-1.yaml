id: BO-2900c-1
components:
  - build_orchestration
  - build_pipeline
title: "An automation invocation naming a capability that does not exist is refused before the run, not during it"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the product's command surface registers the capabilities `claim`, `release`
    and `mark-done`,
    And an automation script invokes the command surface with the capability
      `mark-complete`, which is not registered,
  When the connection from automation invocations to registered capabilities is checked,
  Then the invocation is reported, naming the automation script, the invocation site
    within it, and the capability name that does not exist,
    And the report lists the capabilities the surface does register, so the author can
      see what was expected,
    And the change is refused,
    And the refusal happens without executing the automation, so the mismatch is
      surfaced before an operator's run reaches that step,
    And an automation script whose invocations all name registered capabilities is not
      reported.
