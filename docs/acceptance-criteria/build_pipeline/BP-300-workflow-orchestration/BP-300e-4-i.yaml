notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with ''
  and with a whitespace-only string, asserting each raises the same typed
  stage/agent-named error as the prose-only case (BP-300e-4) rather than returning
  None/empty or being swallowed. Closes the boundary case where "nothing came back"
  could otherwise read as "nothing to do".
