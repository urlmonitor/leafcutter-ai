id: ACD-1600c-1
components:
  - ac_driven_dev
readiness: approved
priority: medium
title: "An AC missing file targets or a test contract is flagged not implementation-ready"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC is a candidate to be released to a builder,
  When the implementation-readiness gate evaluates it,
  Then an AC in the "no declared files" state (ACD-1600c-4-ii) is flagged NOT
    implementation-ready with the reason "missing file targets", even when its technical
    requirements or documentation links name file paths,
  And an AC whose declared-files list names at least one file is never flagged
    "missing file targets", whatever its technical requirements say,
  And an AC that lacks a test contract (a test_spec) is flagged NOT implementation-ready,
  And a flagged AC is held back for enrichment instead of being dispatched to a coder,
  And the flag names which of the two is missing, as "missing file targets" and/or
    "missing test contract",
  And those two reasons are values of the store's single hold-reason list, which also holds
    "test design pending", "reference file pending" and "file finding undecided"
    (owned by ACD-2500b-2), so a record held for one of those other reasons is reported
    under that reason's own name and is never folded into one of these two.
depends_on: [ACD-1600c, ACD-1600c-4-ii]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Canonical source to change: scripts/ac_store/scan_ac_store.py (the leaf-readiness/completeness gate; source-only Python, no templates/ counterpart)."
  - "The gate must raise 'missing file targets' exactly when the declared-files seam (ACD-1600c-4; AC field declared_files) answers 'no declared files' (ACD-1600c-4-ii), and must never raise it for a record whose declared list names at least one file. Paths named in it_requirements, doc_links (any relationship) or reference_file_path neither raise nor clear the reason."
  - "The gate must flag an AC lacking a test contract (a test_spec, or an explicit test_required: false) as NOT implementation-ready."
  - "The flag must name which of {file targets, test contract} is missing — and both, when both are missing."
  - "Reason strings must come from the single hold-reason list (docs/reference/ac-schema.md plus one code constant) defined by ACD-2500b-2 — never a second, gate-local list. If this AC builds before ACD-2500b-2, it creates that one list holding its two values and ACD-2500b-2 extends it in place."
  - "The gate must not restrict its output to the two reasons it owns: a record carrying another listed reason must keep that reason in the report unchanged."
  - "The held-back decision must be data-driven on the declared-files seam's answer and the test-contract fields, never keyed on specific AC ids, and the gate must not parse declared_files itself."
  - "Gates on enrichment COMPLETENESS, complementary to and distinct from the approval-readiness gate (ACD-1200b). Ship advisory before required and grandfather schema_version < 2 ACs (ADR-026 rules 3-4)."
  - "MIGRATION, EXPLICIT: no record written before ACD-1600c-4 declares files, so every such record carries 'missing file targets'. The advisory-first / schema_version < 2 exemption above therefore stays in force: while the gate is advisory, and for any record reading as schema_version < 2 (absent schema_version reads as 1 -- today that is every record, since ACD-1900a has not landed the slot), the reason is REPORTED but the record is NOT held back from dispatch. Holding applies only to schema_version >= 2 records or once the ADR-026 enforce flag is on (permitted only when zero schema_version < 2 records remain). This AC must not switch the flag on or bump any record's schema_version."
  - "Tests that assert holding run the gate in enforce mode (or on a schema_version >= 2 fixture); a separate test asserts a schema_version-absent record is reported with the reason and still dispatchable in advisory mode."
delivers_to:
  agent: python-coder
  contract: "The implementation-readiness completeness gate: a classifier that flags an AC NOT implementation-ready with one or more reasons, each a value of the single hold-reason list (ACD-2500b-2): this gate owns 'missing file targets' and 'missing test contract' (both when both are absent); 'test design pending', 'reference file pending' and 'file finding undecided' are reported under their own names. Consumed by the real-AC edge case ACD-1600c-1-i and extended by ACD-2500b-2 / ACD-2500b-2-i."
expects_from:
  ac_id: ACD-1600c-4
  contract: "Declared-files answer from scripts/ac_store/declared_files.py over the AC field declared_files: the named state 'no declared files' (ACD-1600c-4-ii) or the declared entries in order, each {path: repo-root-relative POSIX string, state: 'existing' | 'to_be_created'}. Never derived from doc_links."
test_spec:
  - name: test_ac_missing_file_targets_flagged_not_ready
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "An AC in the 'no declared files' state is flagged NOT implementation-ready with 'missing file targets', even when its it_requirements and doc_links name file paths."
  - name: test_ac_missing_test_contract_flagged_not_ready
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "An AC with neither a test_spec nor test_required: false is flagged NOT implementation-ready."
  - name: test_flag_names_which_of_two_is_missing
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The flag names which of {file targets, test contract} is missing (and both when both are absent)."
  - name: test_flagged_ac_held_back_from_dispatch_set
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A flagged AC is excluded from the ready/dispatch set and held back for enrichment."
  - name: test_flag_reasons_drawn_from_single_hold_reason_list
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Every reason the gate emits is a value of the single hold-reason list; a record held for a non-owned listed reason keeps that reason and is not reported as 'missing file targets' or 'missing test contract'."
  - name: test_declared_list_never_flagged_missing_file_targets
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "An AC whose declared_files names at least one file is never flagged 'missing file targets', whatever its it_requirements say (including none)."
    angle: boundary
  - name: test_legacy_record_reported_not_held_in_advisory_mode
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "With the gate advisory, a record without schema_version and without declared_files is reported 'missing file targets' but remains in the dispatch set (ADR-026 rules 3-4)."
    angle: boundary
