notes: |
  USER DECISION Q2: measured against a sample of real agent shell commands before blocking is
  switched on. The varying-count and empty-sample clauses are this component's standing
  anti-vacuity shape (BP-1600a-2 house style): a hand-written sample of already-known-safe
  commands, or a fixed stated count, passes every other clause.

  Where recorded sessions are read from is the IT PO's to decide; the requirement is that the
  sample was issued by agents, not composed for the test.

