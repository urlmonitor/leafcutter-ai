title: "No way of finishing work is left quietly without a routing step"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-1.yaml"
criteria: |
  Given more than one thing in this package drives a unit of work to
    completion and reports a result — an epic drive, a single-ticket drive,
    the fast lane, the quick-fix path and feature finalization each do,
  And a knowledge record emitted during work driven by any one of them is
    equally a learning that should reach its surface,
  When each of those paths is run to completion in a tree whose declared sink
    holds one record carrying learning text and naming one destination,
  Then on every one of those paths that destination contains that learning
    text by the time the path reports its result,
  And where a path is deliberately not given a routing step, it is named as
    excluded in the same place the wired paths are wired, together with the
    reason and the path whose routing step covers its emissions instead,
  And no path both completes a unit of work and leaves an emitted record
    unrouted while not appearing on that exclusion list,
  And a WORKFLOW ARTEFACT added later that completes a unit of work without
    either harvesting or being listed as excluded is detected rather than
    discovered: something fails when it appears — where the set that can be
    detected is the set of workflow artefacts, because that is the set the
    detection is able to enumerate for itself,
  And the residual is stated rather than assumed away: a way of completing a
    unit of work that ships only as a skill or only as a command, carrying no
    workflow artefact, is NOT reached by that detection and would appear
    unnoticed. The detection says which kinds of artefact it examined and which
    kinds it cannot see, in its own output, so a reader of a passing run cannot
    conclude that every future way of completing work is covered.
