criteria: |
  Given an L0 has both L1 children (with their own L2 children) and direct L2 children
  When evaluating whether the L0 is done
  Then the check traverses the full tree to find ALL leaf nodes
  And the L0 is done only when every leaf has work_status: done
  And intermediate L1s with undone leaves do not count as done
