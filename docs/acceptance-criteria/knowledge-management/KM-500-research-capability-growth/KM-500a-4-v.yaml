id: KM-500a-4-v
title: S1 expectations come from two independent reviewers at a pinned revision and are fixed by hash before any run
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given each S1 case needs a reviewed expected outcome
  When the set is prepared for its first run
  Then each expected outcome is derived by two reviewers working separately from source bytes at one pinned Git revision, and each reviewer judgment names the reviewer and that revision
  And each reviewer judgment lists the inputs consulted, and a set in which any listed input is a run report, a system output or the other reviewer's judgment is refused as not independent
  And where the two reviewers disagree, the case carries an adjudication with its reason or is excluded from the set, and the report states how many cases were excluded this way
  And the hash of the case file and the hash of the oracle are fixed before the first run, and every run report carries both hashes
  And a run whose case file or oracle no longer matches the fixed hashes is reported invalidated against S1 and contributes no figure to any S1 result
  And a case whose pinned revision differs from the set's pinned revision is refused rather than scored.
