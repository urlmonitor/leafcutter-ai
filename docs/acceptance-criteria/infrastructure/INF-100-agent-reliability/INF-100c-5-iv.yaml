id: INF-100c-5-iv
components:
  - feedback_collector
readiness: approved
priority: high
title: "Every agent that signs off today, including both AC-coverage gates, is a registered feedback writer"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
created_by: docs/acceptance-criteria/infrastructure/INF-100-agent-reliability/INF-100c-5.yaml
criteria: |
  Given the package as shipped, with its 24 agent definitions that carry signoff: true,
  When the package build runs the consistency check,
  Then the check reports zero agents that sign off but can write to no category,
  And zero writers that name no registered agent,
  And ac-validator and ac-fulfillment-gate are each listed in the allowed_writers of
    complete, knowledge-gap, tooling-issue, convention-ambiguity, blocker and
    success-pattern,
  And restructuring-specialist and change-scope-reviewer are each listed in the
    allowed_writers of the same six categories,
  And the source copy and the template copy of the feedback categories file list the
    same allowed_writers for every category.
depends_on:
  - INF-100c-5
doc_links:
  - path: config/feedback_categories.yaml
    relationship: modifies
    status: exists
  - path: templates/config/feedback_categories.yaml
    relationship: modifies
    status: exists
