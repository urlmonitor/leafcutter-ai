id: TQ-500e-2-i
components:
  - testing_quality
  - ac_store
title: "Work predating the record returns no answer, and the boundary is the record, not the date"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given finished work from before the falsifiability answer existed alongside finished
      work from after it, and, among the older work, one piece that does carry an
      answer,
  When a later reader retrieves answers for all of them,
  Then the older work carrying no answer returns no answer recorded, and is returned
    neither as a reasoned negative nor as a shortfall,
    And the newer work returns whatever its run recorded,
    And the older piece that does carry an answer returns it, so the boundary between
      the two outcomes is the presence of a record rather than the date the work was
      finished,
    And a later sweep over this finished work can tell the no-answer-recorded case
      apart from the answered cases without inspecting a test,
    And a newer piece of work whose run recorded no answer is returned as no answer
      recorded and not as older work, so the carve-out does not silently absorb
      present-day gaps.
depends_on:
  - TQ-500e-2
