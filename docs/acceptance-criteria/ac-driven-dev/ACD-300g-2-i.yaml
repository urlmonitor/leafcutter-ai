assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must detect orphaned AC files by scanning the AC store directory for uncommitted changes, not by relying on workflow state files"
  - "Must present the three-way choice (yes/no/discard) before any destructive or constructive action"
  - "Must complete the orphan scan within 2 seconds for AC stores with up to 500 files"
  - "Must handle errors from the git status operation gracefully per the project error handling policy"
delivers_to: null
expects_from: null
test_intent:
- clause: the workflow detects the uncommitted AC files in the working tree by scanning the AC store directory
    for files with unstaged or staged but uncommitted changes
  needs_test: true
  reason: The orphan scan parses git status lines and qualifies each file by origin_agent and readiness,
    and a wrong filter would miss or invent orphans.
- clause: 'it warns the user: "Found N uncommitted AC files from a prior session: [list of AC IDs]. Commit
    them before starting new work? (yes/no/discard)"'
  needs_test: true
  reason: The warning is assembled from the scan's count and ids, and a wrong count or list would misinform
    the user before a destructive choice.
- clause: if the user chooses "yes", the workflow commits the orphaned files before beginning the new
    triage
  needs_test: true
  reason: The yes branch must commit the orphans before triage, and a missing or reordered commit would
    start new work on top of them.
- clause: if the user chooses "discard", the workflow reverts the uncommitted files and proceeds with
    a clean working tree
  needs_test: true
  reason: The discard branch must restore tracked files and delete untracked ones, and handling only one
    kind leaves the tree dirty.
- clause: if the user chooses "no", the workflow aborts with a message explaining that uncommitted AC
    files must be resolved before a new run can begin
  needs_test: true
  reason: The no branch must abort before triage with an explanation, and falling through would start
    a run over unresolved drafts.
test_spec:
- name: test_acd_300g_2_i_scan_finds_uncommitted_authoring_drafts
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'scanOrphanedAcDrafts via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with
    mocked git status lines ('' M'', ''A '', ''??'') and file reads: drafts from product-owner, business-analyst
    and it-po with readiness draft are returned; a reviewed record and a record from another origin_agent
    are not.'
  proves_clause: the workflow detects the uncommitted AC files in the working tree by scanning the AC
    store directory for files with unstaged or staged but uncommitted changes
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the scan ignores untracked files
  - the scan flags records whose readiness is not draft
- name: test_acd_300g_2_i_orphans_pause_with_count_and_ids_before_triage
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: reachability
  description: 'Drives the real workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py)
    with two orphan drafts in the mocked git status: the run pauses at gate resolve-orphans-choice before
    any ac-triage dispatch, and the gate prompt names the count 2, both AC ids and the yes/no/discard
    choices.'
  proves_clause: 'it warns the user: "Found N uncommitted AC files from a prior session: [list of AC IDs].
    Commit them before starting new work? (yes/no/discard)"'
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_2_i_yes_commits_orphans_before_triage
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'Workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py) resumed
    with the answer yes: a commit-stage-output dispatch naming the orphan ids precedes the ac-triage dispatch;
    a failing commit aborts with status error and no triage.'
  proves_clause: if the user chooses "yes", the workflow commits the orphaned files before beginning the
    new triage
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_2_i_discard_restores_tracked_and_deletes_untracked
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'resolveOrphanedDrafts via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with
    one tracked modified and one untracked orphan and the choice discard: a git restore is dispatched
    for the tracked file, a delete for the untracked file, and the action is continue.'
  proves_clause: if the user chooses "discard", the workflow reverts the uncommitted files and proceeds
    with a clean working tree
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - discard runs git restore only, so untracked drafts stay on disk
  - discard deletes tracked files instead of restoring them
- name: test_acd_300g_2_i_no_aborts_before_triage
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: discrimination
  description: 'Workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py) resumed
    with the answer no: the run returns status error with a message saying uncommitted AC files must be
    resolved first, and no ac-triage dispatch is recorded.'
  proves_clause: if the user chooses "no", the workflow aborts with a message explaining that uncommitted
    AC files must be resolved before a new run can begin
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - an unrecognised or no answer falls through to triage
