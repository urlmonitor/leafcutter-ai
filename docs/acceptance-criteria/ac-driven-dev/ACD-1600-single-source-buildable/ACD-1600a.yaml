title: "A ticket points to its requirement instead of carrying a second copy"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Thin tickets that reference the spec -- never duplicate it.

  A ticket is a lightweight checklist that references its acceptance criteria and
  does not restate the criteria, technical requirements, or contracts. The store
  stays the one authoritative copy, so a requirement can never say two different
  things in two places.
