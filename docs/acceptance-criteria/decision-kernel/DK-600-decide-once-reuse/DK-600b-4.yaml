id: DK-600b-4
title: "How-to: answer the approval and ranked-choice questions"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a person running a decision through Claude Code,
  When they read the how-to for the two questions a decision asks them,
  Then it shows how to approve all proposals, approve a subset, reword a criterion and add an
    option at the approval question,
  And it shows how to choose an option, add an option, or answer in their own words at the
    ranked-choice question, and that adding an option leads to a new ranking,
  And it states that the ranking is advice, that the decision waits for their choice, and that
    leaving or cancelling the run keeps no record,
  And every answer it shows is accepted by the kernel when given exactly as written.
