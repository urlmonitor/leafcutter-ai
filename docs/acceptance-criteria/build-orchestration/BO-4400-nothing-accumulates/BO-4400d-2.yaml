id: BO-4400d-2
title: "Every sweep, previewed or real, reports how many items it cleared and how many bytes it freed"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given the nine workspaces, five scratch items and one orphaned outside item of
    BO-4400d-1, with the size of each item measured beforehand,
  When the sweep is run as a preview,
  Then nothing on disk changes,
  And the preview lists each item it would remove by kind and location with its size
    in bytes, lists each item it would keep with the reason, and states a count and a
    total in bytes for the items it would remove,
  And the workspaces it lists as would-remove, and the kept workspaces with their reasons,
    are exactly those the landed-work pass's preview gives for the same workspaces,
  And when the sweep is then run for real with nothing changed in between, it removes
    exactly the items the preview listed,
  And the real sweep's report states the count of items removed per kind (workspaces,
    scratch items, outside items) and the total bytes freed, which equals the sum of
    the removed items' sizes measured beforehand,
  And when one more expired scratch item of 4096 bytes is added and the preview is run
    again, its count is one greater and its total is 4096 bytes greater.
depends_on: [BO-4400d, BO-4400d-1, BO-4400b-1, BO-4400g-3]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400d.yaml
    relationship: constrains
    status: exists
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400g-3.yaml
    relationship: constrains
    status: exists
    relevance: The landed-work pass's preview, whose would-clear list and kept reasons the sweep's preview reports for workspaces (ONE RULE, 2026-11-16).
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  - agent: python-coder
    contract: >-
      Report: the BO-4400d-1 result object plus counts {workspaces: int, scratch: int, outside:
      int} and total_bytes: int for removed items (preview: would-remove), printed as JSON with a
      `--json` flag and as a one-line human summary ("<n> items cleared, <bytes> freed") otherwise.
      Preview is a `--dry-run` flag on the same entry point. Consumed by BO-4400d-3.
  - agent: documentation-expert
    contract: "Preview and real commands, the report's fields and the kept reasons (the landed-work pass's reasons for workspaces, not_expired for scratch), for the how-to BO-4400d-4."
expects_from:
  - ac_id: BO-4400d-1
    contract: "Per-item sweep outcome with kind, location and bytes."
  - ac_id: BO-4400g-2
    contract: >-
      clear-landed --preview (BO-4400g-3): preview true, would_clear [{kind, slug, branch, location}] and kept
      entries with their reasons, from the same decision function as the real pass.
package_surface: false
it_requirements:
  - >-
    Preview and real run share ONE selection code path; preview performs no write of any kind
    (no removal, no log, no marker, no lock file left behind). For workspaces that path is the landed-work
    pass's own: the sweep's preview takes the would_clear list and kept reasons of clear-landed --preview
    (BO-4400g-3) verbatim and only adds sizes, and the real sweep takes the real pass's answer. The sweep
    holds no workspace selection of its own (ONE RULE, user decision 2026-11-16).
  - >-
    Byte figures use the single shared size measure delivered by BO-4400b-1 (apparent size, each
    inode once, symlinks not followed), measured immediately before each removal; preview and real
    run use the same measure.
  - >-
    total_bytes is the sum of the removed items' measured bytes, never an estimate; failed items'
    bytes are excluded (BO-4400d-2-i).
  - >-
    PROOF: deployed sweep as a separate process over the BO-4400d-1 fixture; the test measures each
    item itself beforehand, snapshots the whole fixture tree (paths and hashes) around the preview,
    and compares the preview list to the real run's removed list.
test_required: true
test_spec:
  - name: test_preview_changes_nothing_on_disk
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The fixture tree's paths and hashes are identical before and after the preview."
  - name: test_preview_lists_items_with_sizes_reasons_count_and_total
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The preview lists each would-remove item with kind, location and bytes, each kept item with its reason, a count and a total."
  - name: test_sweep_preview_workspaces_equal_the_landed_work_pass_preview
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Over BO-4400d-1's nine workspaces, the test first runs the deployed maker's clear-landed --preview itself,
      then the sweep's preview. The sweep's would-remove workspaces equal the pass's would_clear list by
      location, and each kept workspace carries the same reason as the pass's kept entry for it. pushed-1 and
      fresh-1 are kept in both.
    must_catch:
      - "sweep preview selects workspaces by holds-nothing alone instead of the pass's rule"
      - "sweep preview computes its own kept reasons instead of relaying the pass's"
  - name: test_real_sweep_removes_exactly_what_preview_listed
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "The real run's removed list equals the preview's would-remove list."
    must_catch:
      - "preview and real run use different selection logic"
  - name: test_real_report_counts_per_kind_and_total_equal_measured_sizes
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Per-kind counts match and total_bytes equals the sum of the removed items' sizes measured by the test beforehand."
  - name: test_one_more_expired_4096_byte_item_moves_count_and_total
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Adding one expired 4096-byte scratch item raises the preview count by one and the total by exactly 4096."
    must_catch:
      - "report built from a fixed or estimated figure"
  - name: test_sweep_preview_flag_is_reachable_and_runs_the_pass_preview_underneath
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). The deployed sweep is run with its
      --dry-run flag as a separate process; its workspace section equals, entry for entry, what python <deployed
      worktree.py> clear-landed --preview --repo-root <project> prints for the same fixture, whose --preview flag is
      the convention worktree_migrate.add_parser already uses. Sizes are added by the sweep only (the pass's entries
      carry none), so the comparison removes the bytes key before comparing.
    code_file: templates/scripts/worktree.py
test_design_authorship:
  step: test-designer
  date: "2026-11-16"
test_design_opened_files:
  - templates/scripts/worktree.py
test_rationale: >-
  A report figure is only trustworthy if it moves with the world. Measuring independently, then
  adding exactly one known-size item, is the varying-population check that a fixed or estimated
  figure cannot pass.
origin_agent: business-analyst
created: 2026-10-09
amended_by:
  - reason: >-
      User decision at the BO-4400g plan-feature gate, 2026-11-16 (ONE RULE: the sweep's workspace part runs
      the landed-work pass): the Given now names BO-4400d-1's nine workspaces, and one And-clause says the
      preview's workspace would-remove list and kept reasons are exactly those of the landed-work pass's
      preview. depends_on and doc_links gain BO-4400g-3. Technical field fixed: the documentation-expert
      contract no longer says "the four kept reasons". The new clause has no test_spec entry yet (IT PO).
    by: business-analyst
    at: "2026-11-16"
  - reason: >-
      it-po, 2026-11-16 (ONE RULE): the ONE selection code path requirement names BO-4400g-3's preview as the
      workspace selection. test_spec gains test_sweep_preview_workspaces_equal_the_landed_work_pass_preview, and
      expects_from gains BO-4400g-2. Criteria unchanged.
    by: it-po
    at: "2026-11-16"
superseded_by: null
covered_by: [BO-4400d-2-i]
implemented_by: []
notes: |
  Gap G4: "with dry-run, count and bytes-freed report". The last clause is the
  varying-population check -- a report built from a fixed or estimated figure cannot move by
  exactly one item and exactly 4096 bytes. Bytes are the apparent size of files measured
  before removal; block-size rounding is the IT PO's call but must be the same measure in the
  preview and the real run.

  ONE RULE (user decision 2026-11-16): for workspaces, the sweep's preview is the landed-work
  pass's preview (BO-4400g-3) with sizes added; the sweep adds no workspace rule of its own.
  Scratch and outside items keep this record's own selection and report.
