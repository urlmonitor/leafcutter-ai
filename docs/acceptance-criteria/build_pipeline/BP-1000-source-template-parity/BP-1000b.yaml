id: BP-1000b
title: "Drift is caught before merge, not discovered after release"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  The parity guarantee runs as a release gate, so a drifted copy can never ship.

  Before any branch is allowed to merge, the parity check must pass. If any
  shipped script has diverged from its tested source, the merge is blocked
  until the divergence is resolved — the gap is never left for a post-release
  spot-check to find.
