criteria: |
  Given the BP-300d behavior is implemented (BP-300d-1 through BP-300d-4),
  When the sequence diagram for primary-delivery-command routing is authored,
  Then it shows the runtime-support decision branch: on a supported runtime the
    deployed command hands off to its deterministic workflow, and on an
    unsupported runtime the deployed command falls back to the prose body,
  And it shows build.py deploying the winning command body and the guardrail that
    fails the build if the prose body would deploy on a supported runtime,
  And the diagram is linked from the BP-300d feature area so a reader can trace
    which template becomes the deployed command in each runtime case.
