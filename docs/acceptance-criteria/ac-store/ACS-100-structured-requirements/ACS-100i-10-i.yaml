assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    assigned_agent_read:
      type: string
      description: "The single coalescing read that replaces ac.get('assigned_agent', 'python-coder') at every site: a present-and-null value, an absent key, and an empty string all resolve to the same default producer, and the resolution records whether the value was declared or defaulted so ACS-100i-10's ticket annotation can state which. Default value: python-coder."
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "3"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "FIX ALL THREE SITES OR THE DIVERGENCE SURVIVES. dict.get(key, default) returns the default only when the KEY IS ABSENT; a present-and-null key returns None. Verified on this branch: ac.get('assigned_agent', 'python-coder') appears at lines 2456, 3195 and 3235 and they feed different generation paths. Fixing one or two leaves the null spelling diverging on the others, and a test written against whichever site the author happened to fix will pass. Prefer one shared read used by all three over three parallel edits."
    - "COALESCE THE EMPTY STRING TOO. The schema's minLength: 1 forbids an empty assigned_agent in a conforming record, but the commit-guardian's manual-parse fallback (load_yaml_manual, which does value.strip() on the raw line) produces an empty string from a key with no value, and that reaches the same phase map. A truthiness-based coalesce covers None, absent and empty-string in one read; an `is None` check covers only two of the three."
    - "ASSERT ON THE SERIALIZED TICKET, NOT THE IN-MEMORY MAP. The two paths fail differently and only one is visible in a dict: the computed path builds the map by iterating phase_order, so a None in all_needed (line 964) is silently DROPPED and the record simply loses its producer phase, while the legacy path has no such filter and agents_legacy[assigned_agent] = 'needed' (line 1116) writes a literally nameless entry. It is the serialized ticket that build-feature.js reads and dispatches agentType: phaseName from, so that is where the assertion belongs. Cover both paths."
    - "DO NOT FIX THIS BY REFUSING A NULL PRODUCER. ACS-100i-9 refuses a WRONG name; this criterion is about an ABSENT one. Turning null into an error would refuse 237 records (measured this branch) and contradicts ACS-100i-10's explicit decision that the fallback stays."
    - "THE DEFECT IS LATENT, SO THE FIXTURE MUST CREATE IT. Verified independently on this branch: 18 records set the field to null AND declare no change_target — the legacy-path population — and 0 of those 18 sit at leaf level, so nothing in the real store reaches the nameless-phase branch today. A test that expects the real store to exhibit the bug passes vacuously. Construct the fixture record, and keep the real-store scan as a separate assertion that none of the 18 is offered as buildable."
    - "WRITE FIXTURES THROUGH THE STORE'S OWN WRITER, not as hand-typed indented literals — the key present with no value, and the key absent, both serialised the way the store serialises. This repo has already shipped a parser that was a total no-op on every real record because synthetic fixtures reproduced a formatting bias the real serializer does not have (EPIC-PhantomDoneFilesTouched)."
    - "Report examined-counts on the buildable scan as well: a scan that returned nothing because it read nothing must not pass as a scan that returned nothing because there was nothing to return (KI-ACS-001)."
