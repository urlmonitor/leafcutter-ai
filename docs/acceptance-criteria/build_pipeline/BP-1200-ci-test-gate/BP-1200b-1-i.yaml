id: BP-1200b-1-i
components:
  - build_pipeline
title: "A pull request containing a deliberately failing test is blocked from merging"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a pull request whose changes include a test that deliberately fails,
  When the test check runs on that pull request,
  Then the test check reports a failing result
  And the pull request is reported as not mergeable while that check is failing.
depends_on:
  - BP-1200b-1
doc_links:
