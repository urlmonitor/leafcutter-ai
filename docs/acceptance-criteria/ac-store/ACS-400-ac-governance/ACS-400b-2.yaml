id: ACS-400b-2
title: "Implementation agents can update implemented_by and covered_by fields"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an existing AC YAML file has its implemented_by list changed
    (e.g. a file path appended) or its covered_by list changed
    (e.g. a test path appended) in the staged diff,
  When the committing agent is an implementation agent
    (e.g. python-coder, test-writer, ac-fulfillment-gate),
  Then the commit proceeds without governance violation,
  And the traceability field updates are accepted into the repository.
