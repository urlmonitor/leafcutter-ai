notes: |
  Decomposed from ACS-800b. The explicit level field already exists in the schema
  (level: L0..L3) but is today redundant with the id-string shape; this AC makes
  the field the AUTHORITATIVE source of level, so tooling stops inferring level
  from the id string (see ACS-800e).
