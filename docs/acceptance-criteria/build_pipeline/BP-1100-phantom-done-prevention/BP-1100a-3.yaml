id: BP-1100a-3
components:
  - build_pipeline
title: "The surface a generated ticket names contains the file the requirement says will change"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a requirement that names, in its own record, the runnable file where the
  behaviour it describes will change, and names it ahead of everything else the
  requirement references,
  And the same requirement also references, elsewhere in that record, files it will
  NOT change — pages that only explain the behaviour, and neighbouring requirements
  it must not contradict,
  When a ticket is generated from that requirement,
  Then the surface the generated ticket names as this work's own contains the runnable
  file where the behaviour will change,
  And it contains every other file the requirement says will change,
  And when the requirement offers no way to tell which of the files it references will
  change, the generated ticket states that its surface could not be determined and what
  about the requirement left it undeterminable — rather than quietly emitting a surface
  assembled from whatever paths the requirement happened to mention,
  And that same statement is put in front of the person who is asked to approve the
  build, at the moment they are asked and without their having to run a further check to
  go and find it — that approval is the last point at which anyone can stop the work
  before a coder is dispatched, and that person is the reader this criterion means,
  And no report on that ticket calls its surface satisfactory while the surface is
  undetermined.
depends_on:
  - BP-1100a
