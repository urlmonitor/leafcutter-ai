id: TQ-500g-1-xiv
components:
  - testing_quality
  - build_orchestration
title: "A test held to a wrong version that changes no line the test runs is reported not executed and unfinished, never as a survivor"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given tests T1 and T2 both name must_catch
    "naive chain re-invokes the previous sitecustomize", whose alteration,
    whether pinned, freshly prepared or declared on the requirement, changes
    one line inside chain_sitecustomize(),
    and on the run on the code as written T1 runs that line and T2 never calls
    chain_sitecustomize(),
    and T2 passes under the alteration,
    and a second wrong version, "the migration leaves the column nullable",
    changes one line of a SQL migration file, whose lines cannot be traced as
    run or not run,
  When the wrong-version runs are read,
  Then T1's row is decided by its run as before, caught or survived,
    And T2's row reads "not executed: the test runs none of the changed
      lines", T2 is not counted as a survivor, and the work stops with the
      reason unfinished rather than survivor,
    And the report tells T2's row apart from a test that ran a changed line
      and still passed, so a reader sees that the wrong version could not
      reach T2 rather than that T2 is weak,
    And for the SQL alteration the row says that run-or-not-run could not be
      traced for that file, and its verdict comes from the run as before; it
      is never reported not executed for that reason alone,
    And a line run inside a test counts as run by that test only when that
      test itself ran it on the run on the code as written; another test
      running it does not count,
    And a line run at import or collection time, before any test starts (for
      example a module-level constant in the file that defines
      chain_sitecustomize()), counts as run by every test of that run, so a
      wrong version that changes only such a line is decided for T1 and T2 by
      their runs and is never reported not executed for either.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-i
  - TQ-500g-1-ii
