criteria: |
  Results never arrive without a denominator.

  Any answer about your requirements reports both what it found and how many
  records were in scope to begin with, and that total is established independently
  of the pass that produced the results — so a run that quietly saw a fraction of
  the store can no longer present itself as a complete picture.
