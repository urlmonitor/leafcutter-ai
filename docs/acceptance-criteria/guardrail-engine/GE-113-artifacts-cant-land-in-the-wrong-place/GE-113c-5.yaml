id: GE-113c-5
components:
  - commit_guardian
  - precommit_hooks
readiness: reviewed
priority: medium
title: "The decision-record cross-reference check inspects the staged records in every layout it ships in"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a commit stages docs/architecture/adrs/ADR-901-example.md whose frontmatter lists the
    component "commit_guardian",
    and the cross-reference the check requires between that decision record and the
    component's detail document is missing,
  When the commit-time decision-record cross-reference check runs from its installed copy
    (the copy the project's pre-commit configuration invokes), and again from its package
    source copy,
  Then both runs report the same finding, naming ADR-901-example.md and the missing
    cross-reference, with the severity the check's strict setting gives it,
  And when the cross-reference is added, both runs report no finding,
  And the check reads staged documents, the component registry and the decision-record
    folder from the project root obtained through the one shared root resolver of
    GE-113c-1-iv,
  And a run that was offered staged documents and could read none of them does not report a
    pass (the outcome GE-120a-4 defines),
  And every existing decision record or document the now-working check flags is either fixed
    in the same change or recorded as a known issue naming it, and the check is not narrowed,
    exempted or switched to warn-only to let that change through.
depends_on:
  - GE-113c
  - GE-113c-1-iv
  - GE-120a-4
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-113-artifacts-cant-land-in-the-wrong-place/GE-113c-1-iv.yaml
    relationship: related
    status: exists
  - path: docs/acceptance-criteria/guardrail-engine/GE-120-green-means-checked/GE-120a-4.yaml
    relationship: related
