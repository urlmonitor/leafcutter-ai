notes: |
  THIS RECORD IS THE SUBSTANCE OF THE L1 TITLE — "what to split and roughly where"
  — AND IT IS THE ONE THAT DECIDES WHETHER THE REST OF THE TREE HAS ANYTHING TO
  CONSTRAIN. The incumbent refusal already contains remediation-shaped text. What it
  does not contain is a single fact about the file in hand. Every clause here is
  therefore an assertion about content that can only be produced by looking at the
  refused file: parts that can be located in it, portions that sum against its own
  measured length, and two sides that reconcile with it.

  WHY "AT LEAST HALF" IS A NUMBER AND NOT A HEDGE. A description that names twenty
  one-line parts is technically derived from the file and useless. The threshold
  states the bar the L1's notes set — the author stops investigating and starts
  choosing — in the only form a test can hold: the named parts must account for the
  bulk of the size, not a scattering of it. It is deliberately generous. It is not a
  completeness requirement, and it must not be raised into one, because that is the
  road to a correct-and-complete refactoring plan, which is CR-100's and INF-800's
  territory and explicitly not this goal's.

  THE NO-DIVISION ARM IS NOT A COURTESY, IT IS THE HONESTY OF THIS RECORD. A file
  whose length is one part has no seam between parts, and a gate that names one
  anyway has invented it. Naming a division that does not follow from the file's
  parts is the same defect as a fixed sentence, wearing better clothes. This arm is
  also the reason the reconciliation clause is stated: an invented division does not
  reconcile.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO
  can lift them verbatim into test descriptors.

  (1) "the refusal accounts for that file's measured length as a set of named
      constituent parts of that same file" — MUTATION: replace the per-file parts
      with a fixed inventory selected from the file's KIND alone, so every refused
      file of that kind is described with the same part names and the same portions.
      Under that injection the named parts can no longer be located in the refused
      file's own content and the stated portions no longer sum against its measured
      length; this clause must go RED, and must return to green on revert. Without
      the injection the clause is satisfied by any implementation that prints a
      plausible-looking list.

  (2) "the refusal names at least one division of that file, stated as which of
      those named parts fall on each side of it" — MUTATION: name the division at a
      fixed fraction of the measured length — halfway down the file — instead of at a
      boundary between the named parts. Under that injection the sides no longer
      correspond to whole named parts; this clause must go RED, and must return to
      green on revert. This is the cheapest implementation that satisfies the words
      "names a division" and it is worth nothing to an author, so it must be excluded
      explicitly rather than trusted not to happen.

  BOUNDARY WITH GE-127a AND GE-127b. WHEN a refusal happens — the crossing event and
  the ratchet — is theirs. This record owns only what the refusal SAYS once it has
  happened, and it applies identically to a refusal from either cause. Do not
  restate either population here, and do not make the description conditional on
  which of them fired.

  BOUNDARY WITH GE-127e-2, DELIBERATE AND LOAD-BEARING. This record says the refusal
  must CONTAIN a description and a division. It does not, and cannot, say the
  description is a function of the file — every clause here is satisfiable by an
  implementation whose parts happen to be locatable in most files of that kind. That
  gap is exactly why GE-127e-2 exists, and the two must not be merged: merged, an
  implementer satisfies the containment half, which is the cheap one.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity,
  it_requirements, test_spec, test_rationale and declares_side_effect. Those are the
  IT PO's. The two named mutations above are written to be turned directly into test
  descriptors. delivers_to is null because nothing is enriched yet, not because this
  record is terminal.
