id: TQ-600a-13-xxvi
components:
  - testing_quality
title: "The testing guide and the suite-performance guide say which tests each run actually executes, including the post-merge live-database lane"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the two guides a contributor reads to learn which tests run where — the testing
    guide and the suite-performance guide —
  And the post-merge live-database lane of TQ-600a-13-xxi, which executes the whole
    live-database test folder against disposable databases on every push to main and on
    the heartbeat, alongside the pull request's Proof-of-done check, which still executes
    only the live-database tests of the criteria that pull request changes,
  And the outcome TQ-600a-13 settles for the expensive-test naming suffix: either the
    suffixed tests are genuinely excluded from the default run and reachable through a
    named opt-in, or the suffix is a naming convention with no collection effect,
  When a reader looks up, in either guide, where the live-database tests run and where the
    suffixed expensive tests run, after the change that lands TQ-600a-13-xxi has merged,
  Then the testing guide states that the live-database tests run in three places with
    three different meanings: skipped in the per-PR shards, which start no database; run
    for the changed criteria only in the pull request's Proof-of-done check; and run in
    full after every merge to main and on the 12-hour heartbeat in the post-merge run,
  And it states that a live-database test failing twice in the post-merge run turns the
    `Post-merge suite status` verdict red and so holds open pull requests, that a database
    which never became healthy is reported as did-not-complete, and that a skip in that
    lane is never counted as a pass,
  And each guide's sentence about the suffixed expensive tests states the outcome
    TQ-600a-13 settled — the named opt-in through which they run, or that the suffix has
    no collection effect and how an expensive test is actually run or skipped — and no
    sentence in either guide claims an exclusion the default collection does not perform,
  And no sentence in either guide states that the live-database tests run only on the pull
    request, or never run after merge,
  And this is verified by reading each guide's statements against the runs they describe —
    the post-merge run's lanes and triggers as TQ-600a-13-xxi defines them, and a default
    collection as TQ-600a-13 compares it — never by searching the guides for a phrase.
depends_on:
