id: ACS-1300c-4
components:
  - ac_store
title: "The refusal is written down beside the field it protects, where the next tool author will find it"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a tool author who intends to write a coverage entry from derived evidence, and
    who has read the reference documentation for the coverage field and nothing else,
  When they read the section covering that field,
  Then it states that restoring a coverage entry never promotes a record's finished
    state, names the tool that owns that promotion, and says the rule is a standing
    refusal rather than a feature not yet built,
  And it states the byte-stability rule in the form that forbids rewriting an untouched
    record at all, rather than the form that permits rewriting it with unchanged values,
  And it states that evidence the writer cannot judge is reported as an abstention rather
    than skipped,
  And a tool built by applying only what that section says satisfies the finished-state
    check, the byte-stability check and the abstention check without its author having
    read any acceptance criterion,
  And the section is reachable from the reference page for the coverage field itself, not
    only from a page about this repair, so an author who never heard of the repair still
    meets the rule.
depends_on:
  - ACS-1300c
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: relates-to
    status: exists
    relevance: "THE HOME. This is the page a tool author reads to learn what the coverage field is, so it is where a rule about writing that field has to live. The page currently documents the field's dual purpose and the parent back-link protocol; the refusal belongs alongside them."
  - path: docs/acceptance-criteria/ac-store/ACS-1300-trustworthy-coverage-links/ACS-1300c-1.yaml
