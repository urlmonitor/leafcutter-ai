notes: |
  NAMED MUTATIONS:
    M1 — keep the "otherwise join" fallback for anything unrecognised. Caught by
         test_unrecognised_path_forms_block_only_their_ticket_and_quote_the_value. BO-3900's
         cases stay green, because every one of its inputs is recognisable.
    M2 — "repair" a double-root value by keeping the text after its last drive root. Caught
         by test_already_joined_double_root_path_is_not_rejoined_or_trimmed. A repair like
         that hides the upstream defect that produced the value.
    M3 — halt the whole run on the first unrecognised path. Caught by the sibling-dispatch
         assertion.
    M4 — report every blocked path as "not found". Caught by
         test_unrecognised_form_and_missing_file_are_reported_distinguishably.

  DECIDED 2026-09-14 (user, Q3): drive-relative `C:foo` and rooted-without-drive `\foo` are refused, not resolved against the worktree's drive.

  Background to that decision. Drive-relative (`C:foo`) and rooted-without-drive
  (`\foo`) spellings are refused, not resolved against the worktree's drive. Both are legal
  Windows spellings, but each depends on a per-process current drive or directory that a
  workflow cannot observe.

  A ticket blocked here is still a ticket other tickets may depend on. How dependants of a
  blocked ticket are sequenced is existing behaviour, not changed by this record.
