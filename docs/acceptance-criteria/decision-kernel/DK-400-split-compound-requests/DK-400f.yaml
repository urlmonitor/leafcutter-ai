criteria: |
  One view shows every part's outcome, with a link to its answer.

  While the parts are worked through and once the work ends, you see for every
  part whether it is waiting, decided, answered or not run, with a link to its
  decision record or research findings, and the final report gives one line per
  part. If you reject a split, the report says so in one plain line, whether
  your request went ahead as one decision, came back to you as a clarifying
  question, or ended with nothing decided, so you never have to piece the
  outcome together yourself.
