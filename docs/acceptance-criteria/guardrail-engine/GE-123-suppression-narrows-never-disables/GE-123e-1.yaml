id: GE-123e-1
components:
  - commit_guardian
title: "A new sign-off heading with no feedback id is refused the same way whether a person or an agent makes the commit"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a scratch repository with the commit checks installed, holding a ticket
    file under its tickets folder whose Comments section already contains one
    sign-off heading with a feedback-id line beneath it,
  And a staged change that appends the sign-off heading
    "### 2026-11-16 10:00 — python-coder (status: ok)" followed by the line
    "Implemented the parser." and no feedback-id line,
  When that change is committed three times from the same starting state — once
    with the inline message "Add python-coder sign-off", once with that message
    in a file handed to the commit by file, and once through the shared commit
    step agents use, given that same message file,
  Then each of the three commits is refused and the branch tip is unchanged
    after each attempt,
  And the three refusals name the same ticket file and the same heading text.

  Given the same starting state,
  And a staged change that appends the same heading followed, on the next line,
    by "feedback-id: fb_2026-11-16_a1b2c3d4",
  When that change is committed by each of the same three routes,
  Then each of the three commits succeeds and the branch tip advances by exactly
    one commit,
  Because every refusal scenario in this feature is also satisfied by a check
    that refuses all sign-offs, and this arm is the one that rules it out.

  Given the ticket file already holds, from an earlier commit, the heading
    "### 2026-05-01 09:00 — test-writer (status: ok)" with no feedback-id line,
  And a staged change that edits only the ticket's title line and leaves that
    heading untouched,
  When that change is committed by each of the same three routes,
  Then each of the three commits succeeds,
  Because the check judges the sign-off headings a commit adds; a heading written
    before feedback ids existed, and not touched now, is not new work.
depends_on:
  - GE-123e
