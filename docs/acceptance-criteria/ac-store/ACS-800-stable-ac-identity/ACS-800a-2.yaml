id: ACS-800a-2
readiness: approved
priority: high
title: "A requirement's UID is immutable for the life of the requirement"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement that was assigned stable UID 42 at creation,
  When the requirement is later edited, re-parented to a different parent,
    moved to a different level, reordered among its siblings, deprecated, or
    superseded,
  Then its stable UID remains 42 through every one of those operations,
  And no operation in the store is permitted to change an existing requirement's
    UID to a different value,
  And the UID 42 is never reassigned to any other requirement even after the
    original requirement is deprecated or superseded.
