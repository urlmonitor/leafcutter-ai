notes: |
  CLAUSE 1 OF THREE. The information needed to report honestly was present in the
  anchor case and was discarded; the fourth scenario is the clause that makes
  discarding it a failure.

  BOUNDARY vs BO-3100e: that record decides whether a step delivered. This one is
  what is recorded once it did not. A judgement with no honest report changes
  nothing a user can see, and a report with no judgement has nothing to report.

  The third scenario is the control that stops "stopped short" becoming a label
  every step carries, which would make the run's list of stopped steps as
  uninformative as the completed list it replaces.
