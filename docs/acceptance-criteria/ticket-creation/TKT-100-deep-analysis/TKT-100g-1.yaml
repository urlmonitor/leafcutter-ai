criteria: |
  Given an AC enters the pipeline with criteria text:
    "Users can switch between light and dark themes
    and their preference persists across sessions",
  When the flight-level router evaluates the text,
  Then it assigns level: L0,
  And the classification signal is: no file paths, no agent names,
    no technical patterns, no Given/When/Then syntax, and the text
    describes a user-observable outcome rather than a system behavior,
  And it dispatches the AC to the PO agent for L1 decomposition.
