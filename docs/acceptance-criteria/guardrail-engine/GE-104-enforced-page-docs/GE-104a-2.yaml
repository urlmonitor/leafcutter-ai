readiness: approved
priority: high
title: "Planning-time trigger flips documentation-expert to needed when a ticket adds a new page without its reference doc"
component: guardrail-engine
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-104-enforced-page-docs/GE-104.yaml"
criteria: |
  Given a ticket whose files_touched list contains a new frontend page at
    site/app/<route>/page.tsx
  And files_touched does NOT contain a matching reference doc at
    docs/reference/frontend/<name>.md
  When agent selection resolves the status of the documentation-expert agent
    against the ticket
  Then the documentation-expert agent status resolves to "needed"
    even though its default_status is "not_needed"

  ---

  Given a ticket whose files_touched list contains a new frontend page at
    site/app/<route>/page.tsx
  And files_touched ALSO contains the matching reference doc at
    docs/reference/frontend/<name>.md
  When agent selection resolves the status of the documentation-expert agent
    against the ticket
  Then this new-page-without-doc trigger does NOT fire on that basis
  And the documentation-expert agent is not forced to "needed" by this trigger
    (no false-positive nag when the doc is already part of the planned work)

  ---

  Given a ticket whose files_touched list contains no new frontend page at
    site/app/**/page.tsx
  When agent selection resolves the status of the documentation-expert agent
    against the ticket
  Then this new-page-without-doc trigger does NOT fire
  And the documentation-expert agent remains at its default_status of "not_needed"
    unless some other condition independently requires it
