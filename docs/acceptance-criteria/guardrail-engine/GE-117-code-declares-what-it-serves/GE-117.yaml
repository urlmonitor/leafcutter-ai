level: L0
status: active
req_status: draft
work_status: todo
criteria: |
  Open any file and its own words tell you why it exists and where it belongs.

  Today a reader has to guess which requirement a function fulfils and which part
  of the system a file belongs to. This goal makes that self-evident: the code
  itself states, in plain sight, the requirement it satisfies and the component
  it is part of. New code cannot land without making that declaration, so the
  connection between what was asked for and what was built is never left to
  memory or archaeology. The result is a codebase that explains itself — anyone
  can answer "why is this here?" and "what does this belong to?" from the file
  alone, and that answer is guaranteed to be present rather than hoped for.
