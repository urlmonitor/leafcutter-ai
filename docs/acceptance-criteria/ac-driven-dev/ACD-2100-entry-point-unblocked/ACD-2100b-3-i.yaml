notes: |
  THE FIFTH OUTCOME -- the one the four-way split does not cover, and the reason
  this L3 exists rather than being folded into ACD-2100b-3.

  A registry that is present, readable and interpretable but structurally not a
  registry lands in the absence branch: the lookup over the expected entries finds
  nothing, so the check concludes the agent is absent. That is a specific verdict
  about something the check never established -- the agent may well be listed in
  the real registry, and the operator is sent to audit an agent id that is not the
  problem. It is precisely the defect this L1 exists to close, reappearing one
  level down from where it was fixed.

  THE LAST CLAUSE MATTERS SEPARATELY. Where the current code searches a collection,
  a value that is not a collection raises rather than returning nothing. Whatever
  replaces it must produce this report rather than an unhandled failure, and the
  test should assert the report -- an unhandled failure also stops the run, so a
  fail-closed assertion alone cannot tell the two apart.

  GENERAL FORM, worth stating for whoever implements it: a cause the check did not
  establish must not be asserted. When the outcome fits none of the four named
  cases, say that it could not be determined and say what was seen.

  2026-08-25 (it-po): the it_requirement forbidding a silent empty-collection
  substitution names the specific wrong fix. Guarding the lookup with "if it is not a
  collection, treat it as empty" removes the unhandled failure, passes the last Then
  clause, and reproduces the false absence verdict the first two clauses forbid -- so
  a test written only against the crash would sign this off.
