  contract: "The fail-closed block decision of the verification-consistency guard, which this edge refines for an empty tools list."
it_requirements:
  - "An empty tools list (tools: []) grants no edit/create ability and must be treated identically to a Read/Bash-only list: with requires_verification: true it is a contradiction and the hook exits non-zero (blocked)."
