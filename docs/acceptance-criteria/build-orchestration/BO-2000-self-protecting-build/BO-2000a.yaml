roadmap_phase: phase_1
criteria: |
  "Still passes its own standards" must come with the receipt -- the command run and what it showed, zero new violations.

  When a change claims the project still holds itself to its own standards, that
  claim is only accepted when it is backed by the actual check that was run and
  the result it produced, showing nothing new broke. A bare "verified" with
  nothing to show is turned away instead of waved through, so a hollow assurance
  can never masquerade as a passing result.
