id: BO-530-5
title: "Python sign-off runs a repo-ruff check on changed files that blocks on lint failure"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/build-orchestration/BO-500-computed-quality-gates/BO-530.yaml
criteria: |
  Given a ticket whose changed surface includes one or more Python files,
    and python-coder has finished its implementation work,
  When python-coder evaluates its sign-off for the ticket,
  Then it runs the repository's ruff lint check against the new and changed
    Python files for that ticket,
  And a lint violation in those files — for example a violation that the
    project's error-handling Ruff rules forbid — is detected locally,
  And on a ruff failure the sign-off is recorded as failed (status: failed),
    with the lint violations surfaced as the blocking reason,
  And python-coder does NOT sign off "ok" while the changed Python files have
    outstanding ruff violations.

  Given the changed Python files have no ruff violations when checked locally,
  When python-coder evaluates its sign-off,
  Then the ruff check passes,
  And the sign-off may proceed to "ok" on this criterion,
  And the lint failures are caught before the change reaches commit, the PR,
    or CI, rather than surfacing for the first time in CI.
