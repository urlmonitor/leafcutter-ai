criteria: |
  Given a feature folder contains 3 L2 AC files,
    each with a populated component field and depends_on references to ACs in other components,
  When the diagram generation step runs against that feature folder,
  Then it produces a component-relationship diagram showing all 3 components
    and the dependency edges between them,
  And the diagram uses a standard visual notation (C4 or equivalent)
    that a reviewer can interpret without tool-specific training.
