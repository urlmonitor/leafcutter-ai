estimated_complexity: S
it_requirements:
  - "Resolution failure must be fail-closed: the command exits the review path before any Agent-tool dispatch, leaving zero reviewer agents spawned."
  - "The rejection message must name the expected target forms (finished feature / epic folder / branch / changed-file set) so the user can correct the invocation."
  - "Must distinguish the no-target case from the unresolvable-target case in the message it returns."
