assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The 'before' count is the undeclared count of the same file at the commit's parent (HEAD), computed by the SAME recogniser that computes the 'after' count from the staged content; both counts must come from one code path so a recogniser change cannot manufacture an apparent increase (TQ-100b-5 owns recognition; consume it, do not redefine it)."
  - "Reuse the per-file before/after scalar ratchet helper that GE-127b shipped for file length rather than growing a second comparison implementation; the counted quantity here is undeclared test functions per file."
  - "The refusal output must name the file, the before count, the after count and every test function that is undeclared in the staged content but not undeclared at HEAD, so the author can act without re-running anything."
  - "A file with no version at HEAD is out of scope for this AC: it must not be judged as 'previous count zero' (GE-128b decides that case)."
  - "The verdict must be computed per file; one file's decrease must not offset another file's increase in the same commit."
  - "Read the staged blob and the HEAD blob through git; handle the git subprocess I/O per the project error handling policy (CLAUDE.md Rules 1-3) and fail closed with a clear message when the HEAD version cannot be read for a file that is tracked."
  - "Edit the tracked template under templates/scripts/commit_guardian/ only; the deployed .leafcutter/ copy is a build output verified via build.py."
delivers_to:
  agent: python-coder
  contract: "Per-file ratchet verdict consumed by GE-128a-4's mode handling: for each staged tracked test file, { path: str, before: int, after: int, new_undeclared: list[str], verdict: 'refuse' | 'allow' }. In error mode a 'refuse' fails the hook (non-zero exit); in warning mode it is reported and the hook exits 0."
