criteria: |
  Given the legacy "python-coder" agent template contains behavioral guidance sections (style rules, testing conventions, idioms)
  And the best-practice knowledge layer does not yet have a "python" entry
  When the migration process runs (triggered by the first build after package upgrade)
  Then a best-practice knowledge file for "python" is created in the knowledge layer
  And the file contains all behavioral content extracted from the legacy template (style, testing, idioms, tooling sections)
  And the migration records which legacy template was the source (for audit purposes)
  And subsequent builds generate the python specialist from this migrated knowledge file
