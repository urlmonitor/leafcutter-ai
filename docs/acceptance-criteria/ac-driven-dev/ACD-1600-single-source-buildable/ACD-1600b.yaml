  - "2026-08-14 sequencing pass: added depends_on ACD-1600c (buildable-spec gate, warn mode) and ACD-1900c (the flag the read path branches on). If agents stop reading the ticket body before the store is guaranteed to carry concrete file targets and a test contract, they are handed an unbuildable spec — so 1600c must be in place, at minimum in warn mode, before this flips."
  - "2026-08-14 PAIRED WITH ACD-1900b — neither half satisfies the ADR-026 invariant alone. This L1 is the AGENT half of 'every agent and gate must dual-read'; ACD-1900b is the GATE half. Its three children are all phase-agent-side, so shipping only this one leaves every gate still reading the ticket body."
