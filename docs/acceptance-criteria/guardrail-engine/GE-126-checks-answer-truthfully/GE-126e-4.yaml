notes: |
  SATISFIES THE component-diagram LEG of GE-126e's documentation_triggers. The reference-doc
  leg is GE-126e-5.

  THE ABSENT ARROW IS THE POINT OF THE DIAGRAM. Reporting rather than repairing is the
  constraint most likely to be eroded once the census produces a long list, and a picture in
  which the census has no write path into the checks is harder to erode quietly than a
  sentence in a note.

  DISTINGUISHING THE CENSUS FROM THE PARITY COMPARISON IS A REQUIREMENT AND NOT CONTEXT. The
  two want the same execution machinery and answer different questions, and a reader who
  conflates them will conclude one of them is redundant.

  THE EVERYTHING-EXISTS CLAUSE keeps the diagram from documenting an intention. This component
  already carries a recorded instance of documentation describing behaviour that never
  shipped, and the belief it created was worse than no documentation.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

