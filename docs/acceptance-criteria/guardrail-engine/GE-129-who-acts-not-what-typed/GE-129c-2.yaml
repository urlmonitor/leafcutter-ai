criteria: |
  Given identity enforcement in force and a scratch repository holding one ready acceptance
    criterion and one ready ticket,
  When the fast lane is run end to end on the acceptance criterion, and a ticket-supervisor drive is
    run end to end on the ticket,
  Then in each run the commit specialist commits the change at the run's commit step, and the run
    reports that step complete,
    And the commit is recognised by the guard as a commit (GE-129b-2), including the fast lane's
    git -C form,
    And no command issued by any agent in either run contains COMMIT_AGENT_MODE.
