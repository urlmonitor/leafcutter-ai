notes: "Clarifies the distinction between bare-filename and path-qualified allowlist entries per the scan_secrets.py docstring contract ('may be a bare filename, a relative path, or an absolute path'). Bare-filename matching is the INTENDED behavior — the bug is that path-qualified entries ALSO degrade to basename matching due to the self-comparison defect. — .env-family filenames are deliberately excluded from this scenario space: scan_file matches them against _ENV_FILENAME_RE, appends a single ENV_FILE finding and returns before any content rule runs, so no ENTROPY_HIGH / GENERIC_SECRET finding can exist for such a path. Any future author illustrating this AC must use a scannable filename."
