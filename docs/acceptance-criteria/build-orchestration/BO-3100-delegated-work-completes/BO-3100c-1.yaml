notes: |
  This is the positive half of the structural fix: coordination happens where waiting is a
  real operation. The parent L1 calls this the most valuable of the four children because it
  makes the failure unrepresentable rather than detectable — there is no longer anywhere for
  a coordinator to be left waiting for something it cannot wait for.

  THE THIRD SCENARIO IS THE DISCRIMINATOR. "The result reaches the dispatcher" is satisfied
  trivially by any dispatch that returns something; what must be true is that the something
  is the completed step's own result. A layer that receives a start acknowledgement and then
  proceeds is exactly the arrangement that produced the 2026-08-18 stall, and it passes any
  test that only checks that a value came back.

  The second scenario covers the failure branch, where the temptation to proceed optimistically
  is strongest and where an unconsumed result does the most damage.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", the covering test
  must drive the real coordination path and observe the values crossing the boundary; a test
  that inspects the coordination code for an await passes on a path that awaits the wrong
  thing.

  BOUNDARY: this AC establishes that the new arrangement works. It is explicitly NOT
  sufficient on its own — BO-3100c-2 verifies by ABSENCE that no old arrangement survives,
  because a passing test here is satisfied by a system that still contains several.

  IT-PO ENRICHMENT NOTE (2026-08-26). The dispatch record introduced here is deliberately a
  RUNTIME artifact, not a static declaration. It exists because BO-3100c-2 must sweep by
  observation rather than by source inventory, and a runtime record is the only substrate that
  supports that. Making it a first-class deliverable of this AC — rather than something c-2
  invents — is what keeps c-2 from being forced back into a grep.
