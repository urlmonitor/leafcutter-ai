criteria: |
  What agents report is written down, kept, and never silently discarded.

  Every report an agent is asked to make is accepted from any agent entitled to
  make it, lands somewhere that outlives the temporary workspace the agent ran in,
  and — when it genuinely cannot be written — says plainly which report failed and
  why. The record you read back later is the record that was actually produced,
  not the small fraction that happened to survive.
