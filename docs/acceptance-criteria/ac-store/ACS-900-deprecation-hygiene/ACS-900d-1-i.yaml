title: "Retiring an AC that never claimed any code passes cleanly"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a commit retires an AC whose implemented_by list was already empty in
    HEAD and remains empty on disk (nothing was ever claimed),
  When the deprecation-hygiene hook runs,
  Then there are no implemented_by targets to inspect,
  And the hook does not block the commit,
  And the hook produces no block message for that AC.
depends_on: [ACS-900d-1]
