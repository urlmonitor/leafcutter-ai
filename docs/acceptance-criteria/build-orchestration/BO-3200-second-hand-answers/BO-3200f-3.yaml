it_requirements:
  - "IT-PO DECISION -- PLACEMENT: ONE SWEEP, TWO VERDICTS. This record and BO-3200a-2 share ONE dispatch-site inventory over every agent() dispatch in the canonical workflow sources and ONE report. This record owns the inventory and the ADDRESSING verdict: static -- is every fact or chore dispatch addressed to the executor. BO-3200a-2 owns the EXERCISE verdict: behavioural -- does every fact path obtain its value when no party can be asked to judge. Neither builds a second walker or a second report; whichever lands second extends the first."
  - "DECLARED, NEVER INFERRED. Whether a dispatch carries an exact command comes from the result_use declaration BO-3200a-2 put on the dispatch options, widened to three values: `fact` (a read the build branches on), `chore` (a side effect such as a claim or a release) and `judgement` (with its judgement_reason). A dispatch site with no declaration fails the check and is named. Prompt text, agent name and step label are never used to decide -- KI-BO-20260901-1620 fix direction 2's prompt-text heuristic is rejected here exactly as it was on BO-3200a-2."
  - "ADDRESSING RULES. `fact` and `chore` dispatches must be addressed to the executor. A `judgement` dispatch must NOT be addressed to the executor, which gives no answer to a judgement request, so such a site is always wrong. An addressee that cannot be resolved from the source (built from a variable) is reported as unresolved and never skipped."
  - "THE STARTING INVENTORY IS EVIDENCE TO RE-MEASURE, NOT A LIST TO ENCODE: roughly twenty plan-feature shell steps addressed to status-checker; the fast-lane-ship resolve, producibility and claim steps addressed to status-checker; AND the fast-lane-ship release step addressed to python-coder -- the KI-BO-020 fix. The release step IS in scope and MUST be reported until it is addressed to the executor: the user's 2026-09-16 decision rejected repointing chores at any party other than the executor, and python-coder's registry entry states no shell permission. The check must not special-case it by name in either direction."
  - "THE FIRST SCENARIO REQUIRES THE REPOINTING, NOT ONLY THE CHECK. Every mis-addressed site found is moved to the executor through BO-3200f-1's shared dispatch helper, and its result is read through BO-3200f-1-i's could-not-check mapping -- no per-site prompt and no per-site parser. Sites owned by a named record are verified here, not re-implemented: the plan-feature startup registry read is ACD-2100b-5's, and the fact resolver is BO-3200a-1's."
  - "THE CLAIM STEP'S MUTUAL-EXCLUSION GUARANTEE SURVIVES THE MOVE. A claim that could not be completed through the executor stops the lane as could-not-tell and is never treated as claimed; a release that could not be completed is reported, never assumed."
  - "THE REPORT QUOTES THE ADDRESSEE'S STATED PERMISSION as `true`, `false` or `unstated`. Absence is reported as unstated, never as either value, consistent with AR-200c."
  - "PER-SITE VERDICTS, NO EARLY RETURN, NO MERGING. The report states how many sites were examined, and a run that examined zero sites fails rather than reporting clean (KI-ACS-001)."
  - "COMPLETE OVER THE SOURCE, NOT OVER ONE RUN. The inventory covers every dispatch site in every canonical workflow source, including branches no single run reaches; a run-time trace alone misses an unreached mis-addressed site. It reads the canonical sources, never the deployed build output."
  - "ENFORCE WHERE IT RUNS. The check is wired to a gate whose verdict is consumed on any change to the workflow sources -- a commit-guardian hook or a required CI job. If it is a hook, every module it imports is added to the build deploy manifest (CLAUDE.md). A script that nothing invokes does not satisfy the fourth scenario."
  - "SECURITY CONTAINMENT AT AUTHORING TIME. The check also fails an executor dispatch whose command text sets a guardrail bypass variable (the commit-agent mode and the guard overrides listed in the Claude Code hooks reference), because the executor cannot decline one. This is BO-3200f-2 containment 4's authoring-time enforcement point."
  - "The executor is a utility, not a producer: repointing fast-lane-ship's dispatches must not enter it into the lane's closed producer roster (ADR-035)."
  - "Must satisfy the repository error-handling policy: reading the workflow sources and the registry is external I/O; a source that cannot be read or parsed is reported by name as not examined, never skipped."
delivers_to:
  - agent: python-coder
    contract: "The shared dispatch-site inventory and report, extended by BO-3200a-2: {examined: int, sites: [{workflow: str, step: str, addressed_to: str | null, result_use: 'fact' | 'chore' | 'judgement' | null, stated_permission: true | false | 'unstated' | null, addressing_verdict: 'correct' | 'mis_addressed' | 'undeclared' | 'unresolved_addressee' | 'judgement_to_executor' | 'bypass_variable' | 'not_examined'}]}. BO-3200a-2 adds exercise_verdict per site; it does not build a second inventory."
  - agent: architecture-diagram-author
    contract: "The same per-site listing (workflow, step, addressed party), which BO-3200f-5's second scenario reads instead of re-deriving the dispatch set."
expects_from:
  - ac_id: BO-3200f-2
    contract: "The executor's agent id and registry entry, with permits_shell: true stated literally."
  - ac_id: BO-3200f-1
    contract: "The shared executor dispatch helper every repointed site must use."
test_spec:
  - name: test_bo_3200f_3_every_fact_and_chore_dispatch_in_shipped_workflows_is_addressed_to_executor
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Run the check over the real canonical workflow sources; assert every site declared fact or chore is addressed to the executor, the report lists each by workflow and step with its addressee, and examined is non-zero."
  - name: test_bo_3200f_3_one_site_addressed_to_status_checker_is_named_with_its_stated_permission
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "THE PARTIAL-FIX TEST. Copy the sources, readdress exactly one fact site to status-checker, run the check; assert that site is reported by workflow and step with stated_permission false, and every other correct site neither suppresses nor merges the report."
  - name: test_bo_3200f_3_chore_addressed_to_python_coder_is_reported_with_unstated_permission
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "A release chore addressed to python-coder -- the KI-BO-020 fix shape -- is reported as mis_addressed with stated_permission 'unstated', not skipped because the release works in practice."
  - name: test_bo_3200f_3_judgement_dispatch_is_not_reported_and_judgement_to_executor_is
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "A judgement-declared dispatch to a specialist is not reported; the same dispatch addressed to the executor is reported as judgement_to_executor."
  - name: test_bo_3200f_3_step_added_after_the_check_was_written_is_named
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "With the check unchanged, add to a copied source (a) an undeclared dispatch and (b) a fact-declared dispatch to status-checker; assert both are named."
  - name: test_bo_3200f_3_zero_sites_examined_fails_and_unreadable_source_is_named
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: failure
    description: "Pointed at a directory with no workflow sources, the check exits non-zero rather than reporting clean; a source that cannot be parsed is reported as not_examined by name."
  - name: test_bo_3200f_3_unresolved_addressee_and_bypass_variable_are_reported
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "A dispatch whose addressee is built from a variable is reported unresolved_addressee; an executor dispatch whose command sets the commit-agent bypass variable is reported bypass_variable."
  - name: test_bo_3200f_3_check_verdict_is_consumed_by_the_gate_that_runs
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    description: "Invoke the gate the check is wired into (the hook entry point or the CI job's command) against a source with one mis-addressed site and assert that gate fails -- not merely that the check function returns a violation."
  - name: test_bo_3200f_3_claim_that_cannot_complete_through_executor_stops_the_lane
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "Drive fast-lane-ship under the harness with the claim's executor dispatch failing; assert the lane stops as could-not-tell, nothing is built, and the item is not treated as claimed."
test_rationale: |
  The addressing check is a static property of the source, so its evidence is the real canonical
  workflow files plus planted copies -- a hand-written miniature workflow proves the walker
  parses the miniature. The partial-fix test mirrors BO-3200a-2's and exists for the same
  reason: twenty-odd correct sites must not hide one wrong one.
  The release-to-python-coder test is its own descriptor because that site WORKS in practice,
  which is precisely what makes it tempting to exempt; the user's decision says it is still
  mis-addressed, and the test pins that.
  The gate test is the reachability angle: a check that returns the right verdict and is never
  run satisfies every other descriptor. The claim test covers the one behavioural hazard the
  repointing introduces -- the lane's only mutual-exclusion step now depends on an executor
  dispatch that can fail.
