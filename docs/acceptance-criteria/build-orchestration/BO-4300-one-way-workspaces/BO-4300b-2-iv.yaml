id: BO-4300b-2-iv
title: "A project that declares its own install command gets its workspace built by that command"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" whose install must run through a wrapper of its own
    (one that runs the tools' build and then re-applies settings the build
    alone would drop), and which declares that wrapper as its install command
    in its install configuration,
  When a workspace for the work "alpha" is requested,
  Then the new workspace is built by the declared command, run inside the
    workspace,
  And the request is answered ready,
  And a declared command that fails is refused as a failed install quoting the
    command's own message, never answered ready,
  And a declaration that is not a list of words is refused as a failed install
    naming the setting, without running anything,
  And a project that declares nothing is built exactly as before.
