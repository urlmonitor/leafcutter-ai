criteria: |
  Given an L1 file with id "{PREFIX}-{NNN}{letter}" exists,
  When an L2 AC is created as a child of that L1,
  Then the L2 file is named {PREFIX}-{NNN}{letter}-{number}.yaml
    (e.g. "ACS-100a-1.yaml", "ACS-100a-2.yaml"),
  And the id field equals "{PREFIX}-{NNN}{letter}-{number}" where {number} is
    a positive integer assigned sequentially starting at 1,
  And the level field is set to "L2",
  And the depends_on array includes the parent L1 id (e.g. ["ACS-100a"]).
