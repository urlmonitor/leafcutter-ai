id: ACS-100i-9
components:
  - ac_store
  - commit_guardian
  - agent_registry
title: "A record naming a producer that is not a registered agent is refused, and both the commit-time gate and the store-wide pass reach the same rule"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the agent registry, which lists 60 agents by id,
    And a record whose declared producer reads `finalize-feature-workflow` — a
    name the registry does not list,
  When that record is changed and the commit-time acceptance-criteria check runs,
  Then the check refuses it, and the refusal names the record's file path, the
    offending value, and the fact that no agent by that name is registered.

  And given that same record,
  When every record in the store is validated in one pass,
  Then it is refused there too, with the same message — one rule, reached from
    both entry points, rather than each entry point carrying its own copy that
    can drift from the other.

  And given a record whose declared producer reads `python-coder`, and another
    whose declared producer reads `test-failure-triage`,
  When either is checked at either entry point,
  Then it is accepted.

  And given one further agent is added to the registry and nothing else is
    edited anywhere,
  When a record naming that newly registered agent is checked,
  Then it is accepted — the acceptable vocabulary is read from the registry at
    check time, and no second, hand-maintained list of agent names decides the
    verdict.
