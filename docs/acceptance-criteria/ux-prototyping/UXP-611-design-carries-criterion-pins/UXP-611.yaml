criteria: |
  The design names the criteria it shows, so built-to-design is checkable.

  As a person reviewing a screen, I want the approved design to state which
  acceptance criteria it puts on screen — in the same words the built page
  uses — so that "this page matches the design we approved" can be answered by
  comparing the two rather than by taking someone's word for it. The design
  becomes the other half of a comparison that already has a built half, and a
  screen that quietly drifts from what was approved stops being invisible.
