id: BP-1100e-1-i
readiness: approved
priority: high
title: "out_of_scope entries and generated/lockfiles are exempt from the mismatch flag"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket declares files_touched: ["scripts/build_phases.py"] and
    out_of_scope: ["scripts/legacy_shim.py"],
  And its actual changed files include "scripts/legacy_shim.py" (declared out_of_scope),
    "poetry.lock" (a lockfile), and "scripts/generated/paths_index.py" (a generated file)
  When the pre-done reconciliation runs
  Then it does NOT flag "scripts/legacy_shim.py" (it is in the declared files_touched
    UNION out_of_scope set)
  And it does NOT flag "poetry.lock" or the generated file (lockfiles and generated
    artifacts are exempt source-file categories, not undeclared behavior work)
  And it still flags any source file that is neither declared, out_of_scope, generated,
    nor a lockfile
depends_on:
  - BP-1100e-1
doc_links:
