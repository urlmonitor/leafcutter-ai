assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "main() uses a two-pass algorithm: pass 1 collects every staged done ticket's declared scope via _get_ticket_scope and computes their union; pass 2 computes undeclared source files against that union. A file declared by ANY staged done ticket must not be flagged against the others."
  - "The staged ticket .md paths themselves are excluded from the undeclared set (they are not source files, and the normalisation guard must not reintroduce them)."
  - "PORTABLE SURFACE: this lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py) pinned in BP-1100e-1; ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
