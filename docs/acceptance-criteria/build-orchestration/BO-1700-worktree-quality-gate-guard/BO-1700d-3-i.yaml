criteria: |
  Given the pre-drive gate passed, but the shared hook or resolved config is then
    mutated so the chain would no longer fire before the commit phase runs,
  When the commit-phase gate runs the probe,
  Then the probe returns a non-zero verdict and the commit is refused,
  And the commit-phase gate's verification is independent of the earlier
    pre-drive result (it re-runs the probe rather than trusting the prior pass).
