notes: |
  Satisfies the how-to entry in TQ-400a's documentation_triggers.

  THE SWEEP ALREADY EXISTS — THE GUIDE DOCUMENTS RUNNING IT, NOT BUILDING IT.
  Verified 2026-08-17: check_all_done_acs already walks the whole store, and the
  store-wide mode is already a declared CLI choice. What TQ-400a adds is an
  automated invocation. The guide must therefore describe the sweep as it
  actually behaves at publication, including the preview-by-default posture
  TQ-400b-5 establishes, rather than an idealised runbook.

  Why the criteria are written as reader outcomes rather than as "a guide
  exists": a file with the right name and the right headings satisfies a
  presence check while teaching nobody anything, which is the same
  artifact-satisfies-the-check failure the parent L0 exists to remove. Every
  clause here is a thing a first-time reader must be able to DO or SAY after
  reading, and each is observable by putting the guide in front of someone who
  has not run the sweep.

  The three-population clause is load-bearing: the commonest misreading of a
  store-wide result is to assume the pull-request gate would have caught the
  same records. It would not, and a reader who cannot say why will misjudge how
  much the sweep is telling them.

  IT-PO ENRICHMENT NOTE (2026-08-18) — ONE SURFACE, AND THE INDEX LIES TODAY.
  The BA left the surface open ("the surface to extend or the sibling to link").
  Ruled: extend docs/how-to/done-proof-enforcement.md in place. A second file
  would give the repository two population accounts, and the criterion that a
  reader "can say which records a given layer would never have looked at" is only
  answerable from a single table covering all three. Secondary finding recorded in
  it_requirements: the file's frontmatter description still says "two-layer
  proof-of-done enforcement system" and build.py:1009 regenerates docs/INDEX.md
  from that description, so the generated index currently advertises two layers.
  Retiring the claim in the body while leaving the description untouched would
  leave the index stating the very thing this AC removes.
