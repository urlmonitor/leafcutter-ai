criteria: |
  Given revision A contains an AC and the working checkout has an uncommitted change to it
  When standalone validation and a projection preview run for A
  Then the preview describes A's content, counts and source hashes without publishing changes
  When the same revision and mapping are indexed twice
  Then both reports identify one reusable generation with equal entity and relationship counts
  And neither operation requires starting the kernel
