criteria: |
  Given templates/agents/business-analyst.md is the BA v3 agent template,
  When the template is read,
  Then it contains a section titled "Documentation AC Requirements" (or equivalent),
  And that section instructs the BA to produce documentation ACs when ANY of these
    triggers are present in the L1 being decomposed:
    - Trigger: "new command" -> produce how-to guide AC + sequence diagram AC
    - Trigger: "multi-actor flow (>2 actors)" -> produce sequence diagram AC
    - Trigger: "state machine (>2 states)" -> produce state machine diagram AC
    - Trigger: "new component (script/agent/hook)" -> produce component diagram AC,
  And the section provides a YAML template for documentation ACs with:
    assigned_agent set to architecture-diagram-author or documentation-expert,
    level set to L2,
    depends_on referencing the behavioral AC it documents,
  And the section explicitly states: "If no documentation ACs are produced,
    the BA must include a rationale field explaining why none are needed."
