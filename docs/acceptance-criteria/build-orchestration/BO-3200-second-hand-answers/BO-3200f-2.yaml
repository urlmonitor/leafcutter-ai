it_requirements:
  - "IT-PO DECISION -- ASSIGNMENT CONFIRMED llm-expert. The deliverable is the executor's agent template and its registry entry, registered through the add-agent-to-package skill llm-expert already carries. Output capture and verification are NOT here: they are BO-3200f-1's code. The charter issues BO-3200f-1's capture invocation for the dispatched {command, directory} and returns its output unchanged; it describes no output formatting of its own."
  - "PERMISSION STATED AS A LITERAL VALUE. The executor's registry entry carries permits_shell: true. The live gate reads permits_shell === true, so an absent field is read-only today. How absence is interpreted registry-wide remains AR-200c's decision and is not pre-empted here."
  - "CHARTER AND REGISTRY AGREE MECHANICALLY. Registry validation must fail the build when the executor's template and its registry entry disagree on the shell permission, the tool list, the model tier or the spawn rules. Agreement asserted only by reading both files by eye is not delivered."
  - "SECURITY CONTAINMENT 1 -- TOOLS. The executor's tool list is no broader than ADR-033's tier floor for mechanical agents and contains no Edit, Write, Agent/Task, web or MCP tool. It carries out the command it was given and nothing else; it cannot author files by another route and cannot dispatch anyone."
  - "SECURITY CONTAINMENT 2 -- NO ONWARD DISPATCH, NARROW CALLERS. spawn_allowlist is empty. The executor is dispatched by shipped workflow scripts. It must not be added to any agent's spawn_allowlist without a recorded user decision, because every agent permitted to spawn it acquires unrestricted shell by proxy."
  - "SECURITY CONTAINMENT 3 -- GUARDRAILS AND PERMISSION PROMPTS STILL BIND. 'Admits every exact command' is a statement about the CHARTER only. Every tool-use guardrail and every permission rule that applies to a command issued directly applies identically to one the executor issues. The package must not ship an allow rule, settings entry or hook exemption that pre-approves the executor's commands as a class."
  - "SECURITY CONTAINMENT 4 -- GUARDRAIL ESCAPE HATCHES ARE NOT REACHABLE THROUGH THE EXECUTOR. Several guardrails honour a bypass environment variable (the commit-agent mode, and the documentation and inline-work guard overrides). The executor cannot decline, so a dispatched command carrying such a variable must be stopped mechanically and reported as a guardrail refusal. Two enforcement points exist: authoring time (BO-3200f-3's routing check rejects an executor dispatch whose command sets a bypass variable) and run time (the guardrail refuses the bypass when the caller is the executor). At least one must be load-bearing and tested; which one is a USER DECISION (see notes)."
  - "SECURITY CONTAINMENT 5 -- A BLOCK IS REPORTED AS A BLOCK. When the executor's tool call is blocked by a guardrail or a permission rule, the charter returns the block message verbatim as a not-executed result with no exit status. It never restates the block as its own decline and never invents an exit status (BO-3200f-1-i reason guardrail_blocked; BO-3200g)."
  - "SECURITY CONTAINMENT 6 -- NO INJECTED JUDGEMENT CONTEXT. The executor loads no skills and no agent memory. Its charter states that project instructions about command SHAPE (for example the single-simple-command shell convention) are enforced by guardrails and by the workflow author, not by the executor: it neither rewrites a non-conforming command nor declines it. A command that violates such an instruction is an authoring defect caught upstream, not a reason for the executor to judge."
  - "THE PERMISSION GATE'S VERDICT IS PROVEN ON THE REAL REGISTRY. The classifier plan-feature already uses for its workspace-setup agent must classify the executor's id as permitted when fed the repository's actual registry file, not a fixture."
  - "CHARTER BEHAVIOUR IS PROVEN BY DISPATCH, NOT BY READING THE CHARTER. A test that finds 'every exact command' in the template is dead-prose evidence, rejected by the BO-3100/BO-3200 mechanical-enforcement rule. The first scenario is proven by dispatching the registered executor; see the caveat on the missing live-dispatch surface."
  - "MODEL TIER: haiku per ADR-033 section 2.1 (mechanical, no judgement). If live-dispatch evidence shows that tier refuses or reformats in the first scenario, the tier change is recorded in this record's notes, not made silently."
  - "The executor is a utility, not a producer, and is not added to the fast lane's closed producer roster (ADR-035)."
