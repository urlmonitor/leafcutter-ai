notes: "Verified defect, 2026-08-25. In the output-drift gate's file-scanning step, a key that IS present in the build's output records but whose file is missing on disk produces an informational line and a continue: not counted as verified, not counted as uncomparable, not counted as a gap, and with no effect on the exit status. Deleting a deployed artifact entirely therefore passes the gate silently. It is the most complete form of drift there is and the only one the gate ignores — another instance of this epic's thesis, a check that cannot perform its check reporting a pass."
