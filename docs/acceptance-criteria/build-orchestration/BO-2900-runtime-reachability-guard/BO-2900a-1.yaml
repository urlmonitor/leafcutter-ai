it_requirements:
  config_schema_fragment:
    reachability_verdict:
      type: object
      description: "Extension of the verify_done_eligible() verdict dict with the third eligibility condition: { eligible: bool, reason: str, refusal_cause: 'proof_not_through_entry_point'|'no_entry_point_reaches_code'|'observation_unavailable'|null, unit: str|null, entry_point: str|null, offending_test: str|null } merged into the existing keys. refusal_cause null preserves today's two-condition behaviour verbatim."
  reference_file_path: "scripts/ac_store/done_proof.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "Extend verify_done_eligible() in scripts/ac_store/done_proof.py — do NOT create a second eligibility oracle. The two incumbent conditions (at least one '# covers:<id>' test exists; every such test PASSES) run first and are unchanged; reachability is evaluated only after both pass, so today's failure messages are untouched."
    - "'The unit exposes a runtime way in' is decided mechanically: the module holding the implementing code, or a module that imports it, defines a module-level callable main(argv) — the same surface `python <module> <action> ...` reaches (cf. fast_lane.main, scripts/build_orchestration/fast_lane.py:925). Record the resolved entry point as '<module path>:main' in the verdict. Never infer an entry point from filename, folder, docstring, or an `if __name__` text match."
    - "THE SCOPE FENCE IS MECHANICAL: when no entry point resolves, this rule returns no verdict at all and hands off to the BO-2900a-3 no-way-in rule. Two disjoint refusal_cause values, never one merged 'unreachable' verdict — BO-2900e-1 specifies two different messages with two different clearing actions."
    - "The reached-through fact is CONSUMED from the BO-2900a-2 observation record. This AC must not re-derive it and must not fall back to any source-text signal (import-statement scan, subprocess-string search, entry-point-name grep) when the observation is missing. A missing observation fails closed with refusal_cause 'observation_unavailable', distinct from both real refusals."
    - "The verdict must carry the unit, the un-entered entry point and the offending test nodeid so BO-2900e-1's first message is composable without re-deriving anything, and must be idempotent for a given tree plus test-run result."
    - "done_proof.py is deployed via build_ac_store's deploy_map (scripts/build_phases.py:794). Any NEW module it imports (the BO-2900a-2 observer) MUST be added to that deploy_map in the same change or the deployed check_done_proof hook and the REQUIRED CI done-proof job crash with ModuleNotFoundError — see CLAUDE.md 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest'."
