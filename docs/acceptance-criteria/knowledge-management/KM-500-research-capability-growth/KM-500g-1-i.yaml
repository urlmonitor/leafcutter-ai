id: KM-500g-1-i
title: Observation loss preserves the result and stays visible to the caller
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500g-1
criteria: 'Given the same bounded research request is executed once with observations disabled and once with the
  configured observation destination unavailable

  When each attempt completes

  Then its retrieval evidence and original-question fulfillment outcome remain available independently of remote
  observation delivery

  And the response distinguishes observations disabled from attempted delivery unavailable

  And neither attempt supplies a fabricated accessible trace or silently claims that the observation was recorded
  remotely

  And the unavailable observation cannot change missing evidence into a completed answer or an empty successful
  search

  And no observation failure causes the original retrieval or a capability build to repeat without the existing
  retry and authorization rules.

  '
