priority: medium
criteria: |
  Given the worker is newly installed and disabled with a global agent-call limit of one
  And the local implementation and reviewer settings are available
  When the user enables background work through the CLI
  Then the enabled setting is persisted and status identifies the selected executors, models and global limit
  And the worker can admit eligible features without another per-feature opt-in
  And installation alone starts no background work
  And there is no daily or token-count quota
