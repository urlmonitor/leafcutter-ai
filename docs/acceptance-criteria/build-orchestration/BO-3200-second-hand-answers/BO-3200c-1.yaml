readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a point in a run where only the person who started it can decide,
  When the run reaches that point,
  Then the question is put to that person by a means capable of receiving their answer, and
    the run does not continue until an answer is received.

  Given a run reaching that point in circumstances where the question cannot be put to the
    person,
  When it reaches that point,
  Then the run stops, records enough to be resumed at that same question, leaves everything
    authored so far in place unchanged, and reports that it is waiting for an answer rather
    than reporting that a decision was reached.

  Given that stopped run, resumed with the person's answer supplied,
  When it resumes,
  Then it continues from that question, and the work authored before the pause is present and
    unchanged.
