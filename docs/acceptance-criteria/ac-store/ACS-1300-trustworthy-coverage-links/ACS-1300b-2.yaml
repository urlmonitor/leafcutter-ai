notes: |
  RECOGNITION, NOT A SECOND GATE — the product owner's instruction in ACS-1300b's notes,
  and the reason the third clause is a mutation rather than an assertion. "No second
  writer exists" cannot be observed; "deleting one line makes the link stop appearing"
  can. Two writers of the same field drift, and the drift is invisible precisely because
  both of them write something plausible.

  THE ENTRY-TO-ENTRY COMPARISON IS THE ONE THAT CATCHES NEAR-MISSES. A parallel writer
  that produces `unit_tests/x/test_y.py` where the gate produces
  `unit_tests/x/test_y.py::test_z` satisfies "the link is recorded" and still leaves two
  spellings of the same fact in the store for every reader downstream to disagree about.

  THE FINISHED-STATE CLAUSE IS HERE AND NOT ONLY IN ACS-1300c-1 ON PURPOSE. This is the
  one L1 in the tree whose surface is a delivery path that already flips finished state
  through other steps. An implementer wiring a link into that flow is one line away from
  wiring the badge with it, and the refusal has to be observable at this surface rather
  than only at the repair tool's.

  THE FINAL CLAUSE STOPS THE OVER-EAGER FIX. A path that writes a coverage entry for
  every requirement in scope, tested or not, satisfies every clause above it and
  manufactures exactly the false evidence ACS-1300a's notes call worse than the missing
  evidence it replaces.
