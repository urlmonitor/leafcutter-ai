notes: |
  THE DEFAULT A REPORT DRIFTS TOWARDS IS OPTIMISM. Anything it cannot classify falls
  through to the buildable side, because that is what an unmatched branch does, and the
  figure improves for no reason. This is the same fail-open shape that has made several
  of this project's own gates report clean while checking nothing — a validator that
  matched no files and exited zero, a hook that was never given the file it was meant
  to check. Silence is not a pass, and a report is a gate whose output is a number.

  COUNTING THE UNCLASSIFIABLE AS UNBUILDABLE IS THE CONSERVATIVE CHOICE AND IS
  DELIBERATE. If it is wrong, the figure is pessimistic and somebody investigates. The
  other way round, the figure is flattering and nobody does.

  THE LISTING CLAUSE turns this group into work rather than noise. Unlike the other
  reasons, this one is fixed by editing records, and it cannot be fixed by anyone who
  cannot see which records.
