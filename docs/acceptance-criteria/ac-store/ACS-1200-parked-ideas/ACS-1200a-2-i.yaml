notes: |
  The containment edge case. An inherited or transitive marker would let one
  field at the root of a tree mute every rule beneath it — the "universal mute
  button" outcome ACS-1200c exists to prevent, arriving by the back door.

  The scenario is not hypothetical: a tree part-way through un-parking has
  exactly this shape (root still marked, one branch decomposed). The mixed run
  is the useful assertion — a check that gets the exemption right but silences
  the whole staged set would still pass a test that only looked at exit code.
