change_target: code
risk_surface: safety
declares_side_effect: true
criteria: |
  Given an installed project with the sweep interval set to 24 hours and no sweep
    recorded in the last 24 hours, and one workspace holding nothing unsent,
  When a working session starts in that project,
  Then a real sweep is started without anyone asking for it, and the workspace is gone
    once it finishes,
  And the session is ready for input before the sweep finishes,
  And the sweep's report is written to a durable log location and its one-line summary
    (items cleared, bytes freed) is shown in the session,
  And when a second session starts 10 minutes later, no second sweep is started and
    the session states when the next sweep is due,
  And when two sessions start at the same moment, exactly one sweep runs.
