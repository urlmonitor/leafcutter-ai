id: FIN-200a
title: "Finalizing a feature writes its changelog entry automatically"
component: finalize
level: L1
status: active
readiness: approved
priority: high
req_status: draft
work_status: todo
criteria: |
  A changelog entry is produced as a built-in part of finalizing — never a
  separate manual step.

  Given a feature or epic branch is being finalized,
  When the finalize-feature workflow runs,
  Then a changelog entry describing what shipped is generated as part of the
  workflow,
  And the developer does not have to run any separate changelog step afterward,
  And finalizing completes with that changelog entry present.
