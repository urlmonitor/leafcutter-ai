test_required: true
test_spec:
  - name: test_unwritable_stream_hard_blocks_after_remediation
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "A temp install whose real declaration's stream file exists in an existing log directory and is made non-writable; the real location query (sink_resolution.py --print-location telemetry) prints its path. build-epic.js runs under the E2 harness; asserts a blocked terminal payload, zero ticket-supervisor / phase dispatches, and an operator message naming the printed absolute path and stating it is not writable. Skips when run as root."
    must_catch:
      - "warn-only on a genuine write failure"
  - name: test_stream_path_that_is_a_directory_hard_blocks
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The printed stream path is a directory, not a file. The gate blocks with zero dispatches and the message names the printed path and says it is a directory."
  - name: test_unwritable_log_directory_hard_blocks_as_a_genuine_failure
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The log directory exists but is mode 0555 and the stream file is absent, the unprivileged stand-in for a read-only filesystem (a test cannot mount one). The gate blocks with zero dispatches and the message describes a write failure on the printed path, not a missing directory. Skips when run as root."
  - name: test_genuine_failure_is_not_treated_as_directory_absence
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "For each of the three genuine causes above, the shared probe helper run as a real process returns the genuine-failure classification (not the directory-absent one), creates no directory (snapshot of the enduring root unchanged), and its result's sink_path equals the path the location query printed."
    must_catch:
      - "classify every append failure as directory-absent and mkdir-retry"
      - "report the remediation as 'create the log directory' for a permission failure"
test_rationale: >-
  The hard block is only proven by a real append failure against the real printed
  path, observed through build-epic.js's real dispatch behaviour under the E2
  harness. Permission-based cases skip under root because chmod cannot deny root;
  a read-only filesystem cannot be mounted by an unprivileged test, so a
  non-writable log directory stands in for it and exercises the same
  "exists but cannot be written" classification. The helper-level discrimination
  test exists because a helper that treats every failure as a missing directory
  passes the block tests (the retry also fails) while misreporting the cause,
  which is exactly what the operator message must not do.
