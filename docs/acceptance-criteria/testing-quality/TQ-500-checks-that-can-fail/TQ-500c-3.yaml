notes: |
  THE NON-OBVIOUS HALF OF THE PER-ITEM AXIS. TQ-500c is naturally read as "report each
  test separately", and an implementation that does only that is defensible and still
  leaves a hole: an alteration that nothing noticed disappears the moment the tests
  that were blind to it objected to something else. In the recorded incident the first
  alteration was noticed by exactly one of four tests; had that one test not existed,
  three tests each objecting under the second alteration would have made the first
  alteration look covered.

  WHY THIS IS NOT A DUPLICATE OF TQ-500c-2. The two readings partition differently and
  neither implies the other. A suite in which every test objects to at least one
  alteration passes TQ-500c-2 completely while leaving an entire alteration
  unobserved.

  THE FOURTH CLAUSE IS THE FALSE-FINDING CONTROL. An alteration nobody was exposed to
  says nothing about the tests, and reporting it as unnoticed produces findings whose
  only natural remedy is to stop reporting.
