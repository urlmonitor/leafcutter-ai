assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The in-scope set is exactly the source directories under scripts/ that have a matching templates/scripts/<group>/ counterpart directory (currently ac_store/, commit_guardian/, sync_platforms/). Membership is derived from the presence of the mirror directory, never from a hardcoded allowlist, so the scope tracks reality as pairs are added or removed."
  - "Source-only directories that have NO templates/scripts/ counterpart (currently agent-health/, changelog/, ci/, doc_compliance/, feedback/, knowledge/, proposals/, release/, retrospective/, workflows/, worktree/) must be excluded entirely — they must never enter the comparison and never contribute to the pass/fail verdict. This is the concrete false-positive class the gate must not trip on."
  - "Scope filtering is a property of the pair-discovery step in BP-1000a-1, not a post-hoc suppression: a file is only ever compared if it lives inside a directory that has a mirror. Do not compare-then-exempt; never-compare in the first place."
  - "Exclude build/cache noise (e.g. __pycache__/, *.pyc) from comparison on both sides so transient artifacts never read as drift."
  - "Aligns with ADR-013: only consumer-facing scripts (portable group with a templates/scripts/ source) are in scope; package-development-only tooling is correctly exempt. Reference ADR-013's portable-vs-package-internal boundary as the rationale for the scope rule."
delivers_to: null
