id: GE-123e-2-i
components:
  - commit_guardian
title: "A token in the previous commit's message does not excuse the next commit"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a scratch repository with the commit checks installed,
  And a first commit, made with the inline message "Tidy notes [NO-FEEDBACK-CHECK]",
    that edits a ticket's prose, adds no sign-off heading, and succeeds,
  And the file in which git keeps the last commit message, written by git itself
    during that first commit, now holds the token,
  When a second commit with the inline message "Add python-coder sign-off" appends
    the heading "### 2026-11-16 10:05 — python-coder (status: ok)" with no
    feedback-id line,
  Then the second commit is refused and the branch tip stays at the first commit,
  And no output of the second attempt says that the check was skipped.

  Given a first commit made instead through the shared commit step, with a message
    file whose subject is "Tidy notes" and whose body line is "[NO-FEEDBACK-CHECK]",
    that adds no sign-off heading and succeeds,
  When a second commit is made through the shared commit step with a message file
    holding only "Add python-coder sign-off", appending the same id-less heading,
  Then the second commit is refused and the branch tip stays at the first commit.

  Given either of the first commits above,
  When the second commit appends the same heading followed, on the next line, by
    "feedback-id: fb_2026-11-16_a1b2c3d4",
  Then the second commit succeeds,
  Because a check that refuses whenever the previous message carried the token
    passes the two refusal arms while still reading the wrong commit's message.
