notes: |
  The blast-radius boundary the PO drew: granting the exemption and cleaning up
  genuine orphans are separate pieces of work, and the 54 pre-existing ones must
  survive this change untouched. The point of the L1 is that afterwards the
  remaining orphan count MEANS something again — which is only true if nothing
  was quietly absorbed.

  Record-by-record comparison rather than a count comparison is deliberate: a
  totals-only assertion passes when six records leave the list and six unrelated
  ones join it.

  The 60/54 figures are the measured baseline on 2026-08-14, cited so the
  implementer starts from a real number; the assertion that must hold is the
  before/after set difference, not those literals.

  IT-PO ENRICHMENT (2026-08-14). A live run the same day reported 61 orphans,
  not 60 — the drift the BA anticipated, observed within hours. That is recorded
  in it_requirements as the reason the literals must never enter a test.
