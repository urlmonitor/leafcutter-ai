it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED. This record adds no hooks_manifest id, no new
    top-level key on commit_guardian.json, no agent entry, no skill entry and no paths.json
    surface. Its fixtures vary owns_file_extensions on EXISTING agent entries (a field inside
    an entry, not a new id in the watched `agents` list_ids container) and add nested keys under
    the existing `file_size` top-level section. Plain-list spec form; no fictional fragment.
  - >-
    THE JOIN IS MANY-TO-MANY IN BOTH DIRECTIONS AND MUST BE BUILT AS ONE. A specialist may own
    several kinds of file with different standards; a kind of file may have several owners. The
    implementation this record exists to exclude is the one the language hands you for free: a
    dictionary keyed by kind of file, or by specialist, giving first-match semantics with no
    code written and no warning issued. It is correct on any fixture in which each key appears
    once, and it is the same failure in both directions. State the requirement as a cardinality
    property of the join, not as two lookups.
  - >-
    ATTRIBUTION IS PER KIND OF FILE, NEVER PER SPECIALIST. Each standard in a brief is stated
    against the kind of file it governs. A carrier that models "the standards for this
    specialist" as one value, or that concatenates without attribution, passes both
    single-standard arms and fails the third. Measured: python-coder owns '.py' (limit 400) and
    '.js' (no declared limit); sql-coder owns '.sql' (limit 600). A brief stating "400" to
    python-coder without saying which of its two kinds that governs is a failure of this record,
    not a formatting preference.
  - >-
    THE THIRD ARM IS A NEGATIVE AND IT IS NOT c-1's EXCLUSION. c-1 excludes a specialist that
    owns nothing covered. This excludes a COVERED specialist being told about the wrong one of
    the kinds it owns — a within-specialist precision claim that c-1 cannot see, because from
    c-1's vantage that specialist was correctly in the audience. The fixture is real today:
    python-coder owns '.js', which carries no declared standard, so its brief must state '.py'
    standards and make no statement of a standard for '.js'.
  - >-
    THE FOURTH ARM IS AN INDEPENDENCE CLAIM FOR A SPECIFIC BUG SHAPE, AND THE NUMBERS ARE THE
    SMALLEST THAT EXPOSE IT. A join implemented by mutating a shared accumulator across the
    single compile pass, or by attributing standards to specialists rather than to kinds of
    file, produces cross-contamination that appears only once one standard has two audiences and
    one specialist has three kinds. Three and two are the smallest numbers at which that is
    observable; do not reduce the fixture.
  - >-
    NO SYNTHETIC-ONLY FIXTURES FOR THE FIRST ARM. config/agent_registry.json already assigns one
    specialist more than one kind of file with different standards. A test built only from
    one-kind-per-specialist fixtures reproduces the bias of the implementation it is testing,
    which is the documented shape of this project's worst phantom-done incident (CLAUDE.md,
    "Real-artifact behavioral spot-check before declaring done"). Use the real registry entry for
    the first arm; synthetic variation is admissible only for the fourth arm's three-kinds
    configuration, which does not exist on disk.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the registry
    and declaration reads; log at WARNING or higher or re-raise; no bare or blind excepts. A
    duplicate or conflicting ownership entry must not be silently de-duplicated into a first
    match — silently dropping one side of a many-to-many relation is exactly the defect this
    record exists to catch, and doing it inside an exception handler makes it invisible.
test_spec:
  - name: test_inf_1200c_2_a_specialist_owning_two_kinds_of_file_is_told_both_each_attributed_to_its_own_kind
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      Using the REAL registry entry that already assigns one specialist two kinds of file with
      different standards — not a one-kind-per-specialist fixture, which reproduces the bias of
      the implementation under test — build into a temporary target and read that specialist's
      compiled brief. Both kinds' standards are stated, each attributed to the kind of file it
      governs, and neither is displaced by, merged into, or overwritten by the other.
  - name: test_inf_1200c_2_a_kind_of_file_with_two_owners_reaches_both_of_them
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Assign one covered kind of file to a second specialist as well as the first, build, and
      read both compiled briefs. Every one of them has that kind of file's standards stated. A
      first-match lookup keyed by kind of file tells only the first and is invisible to every
      arm of c-1.
  - name: test_inf_1200c_2_an_owned_kind_of_file_that_carries_no_standard_produces_no_statement_of_one
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      For a specialist owning two kinds of file of which only one carries a standard — real
      today: python-coder owns '.py' with a declared limit and '.js' with none — the brief states
      the covered kind's standard and makes NO statement of a standard for the uncovered one. A
      within-specialist precision claim c-1 cannot see, because from c-1's vantage that
      specialist was correctly in the audience.
  - name: test_inf_1200c_2_adding_a_third_owned_kind_and_a_second_owner_changes_nothing_about_the_rest
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      THE INDEPENDENCE ARM. Extend a specialist's ownership to three kinds of file, one of which
      shares a standard with a kind another specialist owns, and build. Each specialist is told
      the standards for every kind of file it owns and for no other, and what each is told about
      the kinds it already owned is unchanged from the previous build. Three and two are the
      smallest numbers at which a shared-accumulator join or a
      standards-attributed-to-specialists join leaks; the assertion is content equality against
      the prior briefs, so a reordering or a dilution is caught rather than tolerated.
  - name: test_inf_1200c_2_the_first_match_injection_reds_all_three_join_arms_and_leaves_c_1s_movement_arm_green
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's NAMED MUTATION, CARRIED VERBATIM AND OBSERVED AS ONE FOUR-WAY EXPERIMENT.
      MUTATION: key the delivery on a single association in each direction — one owner per kind
      of file and one kind of file per specialist — taking the first match encountered and
      discarding the rest. Under that injection: the two-kinds-one-specialist arm must go RED,
      because only one of the two standards is stated; the two-specialists-one-kind arm must go
      RED, because only the first specialist is told; the independence arm must go RED; and
      INF-1200c-1's movement arm must STAY GREEN, because a first-match lookup rebuilt from the
      ownership record still moves when ownership moves. All four outcomes must be observed
      together and all must revert. THE GREEN OUTCOME IS THE EVIDENCE THAT THIS RECORD IS
      CARRYING SOMETHING c-1 CANNOT: an implementation that passes every arm of c-1 can still
      drop half the audience. An injection run that also reddens c-1's movement arm is a FAILURE
      of this descriptor, not a stronger result.
test_rationale: |
  The PO named this as the arm most likely to be dropped, and the drop is silent: a specialist
  told one of its two standards looks exactly like a specialist told everything. So the
  descriptors are built around cardinality rather than presence, and the first arm is required to
  use the REAL registry entry that already assigns one specialist two kinds of file with
  different standards. A one-kind-per-specialist fixture reproduces the bias of the
  implementation under test, which CLAUDE.md records as the shape of this project's worst
  phantom-done incident — a parser that passed on hand-authored fixtures sharing the
  implementation's own indentation bias.

  The independence arm asserts CONTENT EQUALITY of the previously-owned kinds' statements across
  a build in which ownership grew, rather than merely asserting the new kind arrived. A
  shared-accumulator join does not drop content; it reorders, dilutes or duplicates it, and only
  an equality assertion sees that.

  The BA's mutation is carried verbatim and its stay-green half — c-1's movement arm — is
  asserted explicitly. That green is the entire justification for c-2 existing separately from
  c-1: a first-match lookup rebuilt from the ownership record moves correctly when ownership
  moves and still drops half the pairings, so an implementation can pass every arm of c-1 while
  failing the user's request. An injection run that reddens c-1's movement arm too would mean the
  fixture is not exercising a derivation at all, and is a failure of the descriptor.
