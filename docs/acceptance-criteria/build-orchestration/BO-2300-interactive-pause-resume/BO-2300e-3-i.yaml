it_requirements:
  - "The peek/read reply parser must treat a decline (a reply carrying refusal language or a non-success charter response) as a distinct category from an empty successful read, even though both currently surface as an absence of a usable record."
  - "This must hold independently at BOTH call sites: peekPausedGateId()'s peek-pause-record dispatch and resolveGate()'s read-pause-record dispatch (see BO-2300e-3's it_requirements for why these are two separate, independently-fixable code locations with different downstream consequences)."
  - "Reuse the existing refusal-detection convention already used elsewhere in this file (isAgentRefusal() / AGENT_REFUSAL_MARKERS) rather than introducing a second, differently-worded detector for this code path."
  - "TEST STRATEGY: via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js), stub the peek/read dispatch reply first with the verbatim historical refusal text, then with a genuine {exists: false, stale: false, record: null} empty read, and assert the two produce different classifications -- exercised against both the peek-pause-record and read-pause-record labels."
  - "FILE-SIZE and REACHABILITY: this AC's own fix and cost are accounted for under its parent BO-2300e-3's it_requirements (the KI-CG-20260923 net-content-line constraint and the shared-classification-helper recommendation); this record contributes no independent lines of its own, only the refusal-shape test coverage. Reachability (BO-2900a-3) is proven the same way as the parent -- via run_workflow_under_e2(plan-feature.js) actually executing the refusal-classification branch on a real run, never a synthetic classifier-function fixture."
test_spec:
  - name: test_worktree_agent_style_refusal_not_read_as_empty
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Via the harness, a peek-pause-record dispatch reply carrying the verbatim historical refusal text is classified as 'could not determine', not 'no pause record'."
  - name: test_read_pause_record_refusal_not_read_as_empty
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Via the harness, a read-pause-record dispatch reply (resolveGate's resume-check dispatch) carrying the same verbatim historical refusal text is classified as 'could not determine', not 'no pause record' -- proving the fix at the second, independent call site."
  - name: test_refusal_and_genuine_empty_read_are_distinguishable
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Via the harness, a refusal reply and a genuine {exists: false, record: null} reply produce two different, distinguishable classifications from the workflow, checked for both the peek-pause-record and read-pause-record labels."
