notes: |
  HALT, not warn. A warning on an unreconciled gap is functionally identical to today's
  behaviour, because the partial answer still flows downstream and the next verifier
  still confirms it. Same product posture recorded for ACS-900 in the ac-store
  PROJECT_CONTEXT: always block on a REAL violation.

  The named count is the second load-bearing half. A halt that says only "coverage gap
  detected" is as opaque as the silent pass it replaces.

  SCOPE IS NOT A SHORTFALL (2026-08-13, expert review). As first written this halt
  would have fired on EVERY commit: all eight AC pre-commit hooks scope to staged files
  and "staged scope" was not on ACS-1100b's list of legitimate exclusion grounds, so a
  three-file commit would have halted reporting ~2,781 records unaccounted for. Two
  changes fix it without weakening the halt — "outside the requested scope" is now a
  declared ground, and a scoped answer must report BOTH the scope total and the store
  total. The defect this halt was written to catch survives intact: audit_ac_area.py
  reporting "20 of 20" over a store of 2,784 still halts, because it declares no scope
  and reports no store total.

  Reconciliation arithmetic comes from ACS-1100b-1: covered + declared exclusions must
  equal the total; the residue is the shortfall. The legitimate no-halt cases are in
  ACS-1100c-2; failures inside the coverage machinery itself are in ACS-1100c-1-i.
