notes: >-
  The observable is the commit the branch is rooted at after creation, never a warning
  printed before it -- see BO-4100a's notes for why a pre-flight check is explicitly not
  the shape of this guarantee. The three paths are named because the defect observed on
  2026-09-14 was a DIVERGENCE between them: two paths rooted at the shared line and one
  at the machine's local copy, so parity across paths is part of what is being asserted
  and a test that exercises only one path cannot see the defect.
