assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Root cause: mark_ac_done.py does an unanchored raw_text.replace('work_status: todo', 'work_status: done', 1), so the first occurrence anywhere in the file (prose included) is edited; the column-0 anchored re.sub exists only as a fallback branch"
  - "read_text/write_text use default newline translation, so on Windows every LF line is rewritten as CRLF; read with newline='' and write with newline='' so each line keeps its own ending"
  - "Match only a top-level work_status: key at column 0, mirroring _fl_lifecycle._update_ac_work_status; more than one column-0 match is ambiguous and must be refused, not guessed"
  - "Write atomically (temp file in the same directory, then os.replace) so a failed write never truncates the record"
  - "Re-parse the written file with yaml.safe_load and verify work_status == 'done'; otherwise print an error and exit non-zero"
  - "Fix stays inside scripts/ac_store/mark_ac_done.py; do not import across packages. approve_acs.py has the same unanchored pattern for readiness and is out of scope"
  - "Must follow the repo error-handling policy: specific-exception try/except around file and YAML I/O, report to stderr and return non-zero; no bare or silent excepts"
delivers_to: null
