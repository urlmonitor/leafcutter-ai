test_spec:
  - name: test_retired_requirement_is_not_an_eligible_candidate
    target_dir: tests/ac_store
    framework: pytest
    type: unit
    description: >-
      Builds a candidate population holding one active record and one retired
      record that are otherwise identical in the fields the selector reads
      today (both unfinished, both unlinked to code), runs the selection, and
      asserts the active record is returned while the retired one is not. The
      two records differ ONLY by lifecycle status, so a selector that ignores
      that field cannot pass and a selector that excludes the retired record
      for any other reason cannot pass either.
notes: |
  THE DEFECT THIS CLOSES. The tool's candidate selection reads the
  finished-state field and the implementation-link field, and never reads
  lifecycle status. A retired record keeps both of the fields it does read in
  their eligible state — nothing about retirement changes them — so retiring a
  requirement does not remove it from consideration. It becomes eligible input
  to the very tool whose own governing requirement was retired.

  This is not hypothetical. The ACD-800 tree is being retired to eleven
  deprecated records in PR #768, and every one of them keeps work_status: todo
  and implemented_by: [] — so on the day that lands, all eleven become
  candidates unless this is fixed first.

  THE NEGATIVE ARM IS THE LOAD-BEARING HALF. A test that only asserts "the
  retired record is absent" passes against a selector that returns nothing at
  all, and against one that excludes the record for an unrelated reason. The
  two fixture records must therefore be identical in every field the selector
  reads today and differ only by lifecycle status, and the active one must be
  asserted present in the same run. Stated here so it is not discovered as a
  gap during review.

  SCOPE. This narrows the candidate set and never widens it. It is not a
  position on whether the tool should write the finished-state field at all —
  that is ACS-1600b, which takes the position that the ability should be
  removed outright.
