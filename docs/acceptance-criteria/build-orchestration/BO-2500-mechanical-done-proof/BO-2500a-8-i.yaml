it_requirements:
  - ONE PREDICATE, TWO CALLERS. The reason-present test (a str that is non-empty after strip)
    is defined once beside is_covers_tag_waived in scripts/ac_store/_done_proof_phase_helpers.py,
    is_covers_tag_waived is rewritten to use it, and the commit-time validator imports that
    same function. A re-typed check in templates/scripts/commit_guardian/_ac_schema_validators.py
    repeats the defect BO-2500a-1-ii fixed.
  - The commit-guardian validator reaches scripts/ac_store through the existing _ac_store_locator
    seam, and the import must resolve in the deployed .leafcutter/ layout. A failed import
    refuses the record (fail closed); it never skips the rule.
  - 'ONE ENFORCEMENT POINT (user decision 2026-10-25). The refusal lives in check-ac-schema''s
    staged-records pass only, through the new sibling module called from validate_test_contract.
    config/ac_store_schema.json gets no if/then, no required key and no pattern for test_rationale:
    its only change is the description stating the two meanings.'
  - THE WHOLE-STORE BASELINE STAYS AS IT IS. unit_tests/ac_store/test_acs_100i_7_store_wide_pass.py
    and its recorded baseline (tests/fixtures/acs_100i_7/pre_change_refusal_baseline.json)
    are not edited, and the test passes in the same change with the 99 stored reasonless records
    present. A change that needs that baseline re-recorded has put a rule in the schema and
    is wrong.
  - Applies at every readiness and every change_target. The existing approved-leaf-code rule
    and the test_spec/test_required contradiction rule in validate_test_contract are unchanged.
  - The refusal message (record id, the field test_rationale, and that a test-free declaration
    needs a stated reason) is quoted by BO-2500a-8-ii, so changing its wording later is a
    contract change.
  - 'check-file-size: .py files are limited to 400 counted lines and an already-oversized
    file may not grow net (GE-127b-1 ratchet). _done_proof_phase_helpers.py (820 lines) stays
    net neutral because the reason half moves out of is_covers_tag_waived''s body into the
    new predicate. _ac_schema_validators.py (648) may not grow, so the new rule lives in a
    sibling module, templates/scripts/commit_guardian/_ac_test_rationale_validators.py, called
    from validate_test_contract (the _ac_side_effect_validators.py precedent; the build copies
    every .py in that directory).'
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: the record is refused
    needs_test: true
    reason: The refusal is the gate itself, and a validator that never fires lets the authoring
      side keep producing records the done gate refuses.
  - clause: the refusal names the record id, the field test_rationale, and that a test-free
      declaration needs a stated reason
    needs_test: true
    reason: The message is a contract the planner's instructions quote, and a wrong field
      name sends authors to fix the wrong thing.
  - clause: the refusal applies at every readiness (draft, reviewed, approved) and for every
      change_target, so the authoring side can no longer produce a record the done gate refuses
      at mark time
    needs_test: true
    reason: The old rule fires only on approved leaf code records, so a draft docs record
      is the case that shows the new rule is not scoped like the old one.
  - clause: the same record carrying a non-empty test_rationale is accepted
    needs_test: true
    reason: A refuse-everything validator passes every refusal test, so the accepting case
      proves the rule tests presence.
  - clause: a record whose test_required is true or absent is checked exactly as before, with
      test_rationale still optional for it
    needs_test: true
    reason: Records with test_required true or absent must see no new refusal, and only that
      case catches an over-broad condition.
  - clause: the test "is the reason non-empty" applied here is the same shared rule the done
      gate applies (BO-2500a-1-ii), so for any record the authoring check and the done gate
      agree on whether a reason is present
    needs_test: true
    reason: Two callers of one predicate can drift, and a boundary set run through both the
      authoring check and the done gate is what catches a re-typed copy.
  - clause: a stored record that lacks a reason and is not part of the change being committed
      is not refused by that commit; it is refused the first time it is itself changed
    needs_test: true
    reason: 'Diff scope is behaviour: a whole-store implementation would block every commit
      while about 99 unfinished records lack a reason.'
  - clause: 'the refusal is made by the commit-time record check alone: the store schema carries
      no conditional rule for it, and its only change is a clearer description of test_rationale
      stating both meanings (with test_required false, the reason no test can prove the record;
      alongside test_spec, the justification for that test contract''s shape)'
    needs_test: true
    reason: A schema-level conditional would refuse stored records; validating a reasonless
      record against the JSON schema alone shows the schema stays permissive, while the description
      wording itself is reviewed, not tested.
  - clause: the whole-store baseline test that validates every stored record against the schema
      is unchanged and still passes with the 99 stored records that lack a reason
    needs_test: true
    reason: The existing whole-store baseline test, run unmodified in the same change, is
      the proof; a rule slipped into the schema turns it red.
