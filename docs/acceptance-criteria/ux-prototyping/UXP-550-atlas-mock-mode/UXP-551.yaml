estimated_complexity: L
it_requirements: |
  Author leafcutter-web/fixtures/ as a canned repo root whose subtree mirrors the paths
  every loader reads via repoPath(), each in the real artifact's NATIVE on-disk format so
  the same loaders parse the fixtures unchanged: docs/roadmap.json (roadmap.ts, JSON),
  docs/acceptance-criteria/** + index.yaml (ac-store.ts, YAML), tickets/** (tickets.ts,
  markdown), docs/components.json (components.ts, JSON), config/agent_registry.json
  (agents.ts, JSON), docs/product-truth/flows, mock-data, mockups (flows.ts
  getFlows/getMockData/getScreenTitles, JSON), and tests/** + unit_tests/** (tests.ts,
  traceability.ts). The product-truth / entity mock-data RECORDS (the Plant/Customer/
  Order-style record data) are authored as plain JSON shaped identically to the
  corresponding real artifacts so they can be repurposed directly as test fixtures
  (UXP-551-1). Content is a small curated realistic snapshot sufficient for all 8 views
  (home, /atlas, /coverage, /flows, /now, /pipeline, /roadmap, /architecture) to render
  populated. Read-only fixtures; no writes.
