task_context:
  goal: 'Decide when the Leafcutter decision kernel may publish an approved decision record into docs/decisions by itself
    and when it must ask the user first, recorded as a policy decision file. Today publishing is an explicit human-run command
    (ADR-060) and every record is human-approved. Options: always ask the user before publishing; publish directly unless
    the decision supersedes or corrects an existing record or changes an accepted ADR or policy, and ask otherwise; or another
    option grounded in the repository.'
  component_ids: []
  technologies: []
  constraints: []
rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.always_ask] always ask the user before publishing
    (required mean 0.59, 1/3 passed); 2. [opt.consent_in_final_question] Ask for publish consent inside the decision''s final
    human question, so approving and publishing are one answer (required mean 0.72, 0/3 passed); 3. [opt.direct_unless_risky]
    publish directly unless the decision supersedes or corrects an existing record or changes an accepted ADR or policy, and
    ask otherwise (required mean 0.42, 0/3 passed); 4. [opt.added.1] Publish directly when the important gates are met and
    the decision is not risky, through a new PR flow copied from finalize-feature (required mean 0.36, 0/3 passed). human:user
    chose option [opt.added.1] Publish directly when the important gates are met and the decision is not risky, through a
    new PR flow copied from finalize-feature (kernel rank 4 of 4).'
  origin: template
