    relationship: describes
    status: exists
    relevance: "Existing reference for what the build reports about itself -- the natural neighbour for the clean-result scope statement, and the file to check for overlap before adding a new one."
  - path: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-8-ii.yaml"
    relationship: describes
