it_requirements:
  config_schema_fragment:
    documentation_mandatory_agents:
      type: array
      items:
        type: string
        enum: [documentation-expert, documentation-verifier]
      description: "Protected set (analogue of _TDD_MANDATORY) whose members cannot be downgraded to not_needed once the trigger fires."
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Make documentation-expert and documentation-verifier non-suppressible once the trigger fires: a not_needed override must not strip them."
    - "Locate the protection at the same layer that already guards the TDD agents (the _TDD_MANDATORY protected set in _build_agents_map, ~line 454) so the two behave identically."
