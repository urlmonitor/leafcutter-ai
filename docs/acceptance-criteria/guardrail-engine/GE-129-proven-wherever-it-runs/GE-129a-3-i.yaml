id: GE-129a-3-i
title: "A guard started as a plain command with a path among its arguments, reading nothing and exiting cleanly, has been asked nothing — that clean exit is never reported as a demonstration"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a guard wired before an editing tool call which, when it is started as a plain
    command with the path of a known-bad file among its arguments and with no account of a
    tool call given to it, reads nothing, objects to nothing, and finishes without error,
  When the liveness run examines that guard,
  Then it is not reported as having demonstrated a refusal, and the clean finish is not
    reported as the declared input having been rejected or accepted,
  And it is reported either as never having been asked, or as an attempt that could not be
    run to a verdict, each under its own wording and distinguishable from a guard that was
    asked and allowed the input through,
  And in that same run a guard that was given the editor's own account of the tool call and
    stopped it is reported as having demonstrated its refusal, so the reticence above is
    about this guard rather than about the run.
depends_on:
  - GE-129a-3
