id: TQ-600a-10
components:
  - testing_quality
  - build_pipeline
title: "A test that mutates the package copies the part it mutates, not the whole repository"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the deploy-declaration file: five tests, about 133 s, ten real builds, and
    eight whole-repository copies made before them,
  And what those copies contain: the entire checkout, over eleven thousand tracked
    files, with only caches, the version-control directory and the package manager's
    module directory left out — documentation, tickets and the whole unit-test tree are
    all copied, eight times, so that five tests can edit three script files and one
    configuration file,
  And the alternative that is already proven in this repository rather than proposed
    here: two sibling files meet the identical need — mutate package source, then build,
    without touching the real checkout — using a shared helper that assembles a
    synthetic package root from the template, script and configuration directories plus
    a few derived ones, roughly twenty times smaller,
  And the confirmed fact that makes the swap plausible: every mutation this file makes
    targets a file inside the directories the smaller helper already provides,
  And the honest state of the evidence, which this record does not overstate: the copy
    was never timed. Copying about five hundred files instead of over eleven thousand,
    eight times, is very unlikely to be free, but no second count is claimed and none
    may be asserted in place of a measurement,
  When the file assembles its package copy with the existing synthetic-package helper
    instead of copying the whole checkout,
  Then the copy the file makes contains the directories the helper provides and does
    not contain the documentation, ticket or unit-test trees,
  And the file still performs the same ten real builds, applies the same mutations, and
    runs the same five tests to the same verdicts,
  And the time the file spends making its copies is measured before the change and
    after it, on the same machine in the same sitting, and the measured figures are
    reported as the saving — in place of the estimate this record declines to make,
  And if that measurement shows no reduction, the change is reverted rather than kept
    on the strength of the file-count argument, because a structural argument that
    survives a contrary measurement is a belief.
