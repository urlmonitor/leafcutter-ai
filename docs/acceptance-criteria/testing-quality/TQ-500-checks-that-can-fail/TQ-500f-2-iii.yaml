  template text search, which CLAUDE.md forbids. The proof is an agent eval in the TQ-200d family over the C1 to
  C5 candidate set, scored on which names end in must_catch, which code-side names replace C1 and C2, and that
  C3, C4 and C5 are kept; the eval set (scripts/evals/sets/, run by scripts/evals/run_agent_eval.py) is a
  recommended follow-up requirement, not part of this record's declared files. Substitutes until then:
  pr-reviewer against the Then clauses, and a dry design run on BO-2900a-1-ii.
