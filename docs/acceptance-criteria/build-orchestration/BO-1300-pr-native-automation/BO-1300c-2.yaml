created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300c.yaml"
criteria: |
  Given the automation attempts to merge a pull request and branch protection on main rejects the merge
  When the automation handles that rejection
  Then it surfaces a blocker to the operator stating that branch protection rejected the merge and why
  And it does not retry the merge with verification disabled (no equivalent of "--no-verify")
  And it does not retry the merge using an administrator bypass of branch protection
  And it does not force the change onto main by any other route
  And the pull request remains unmerged
depends_on: [BO-1300c, BO-1300a-3]
