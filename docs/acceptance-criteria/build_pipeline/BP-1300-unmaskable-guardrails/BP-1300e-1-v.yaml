    description: "Edit ONLY the fixture's requirements-dev.txt from ruff==0.15.15 to ruff==0.15.16 and stage it; with the stub reporting 0.15.15 the commit is refused naming 0.15.15 local and 0.15.16 required; with the stub reporting 0.15.16 the same commit completes; no other fixture file changes between the runs (asserted by comparing every other file's bytes)."
  - name: test_bp_1300e_1_v_nothing_in_scope_commits_without_consulting_version
