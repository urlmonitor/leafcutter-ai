criteria: |
  Given a copy whose work is finished and ready to leave,
    and the shared branch cannot be consulted at that moment
    (the remote does not answer, or answers with an error),
  When the workflow tries to establish the state the shared branch is currently in,
  Then no part of the delivery leaves the copy,
  And the run stops and states that it could not establish the shared branch's
    current state, distinguishing that from having established it and found nothing
    wrong,
  And the copy is left in the state it was in before the attempt, with no partial
    replay applied and no change to which commits the copy holds,
  And a state recorded locally at an earlier point is not substituted for the state
    that could not be read.
