    relationship: specified-by
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements: |
  leafcutter-web/lib/data/repo.ts owns the seam: repoRoot() (~line 16) gains a mock
  branch that returns the bundled fixture repo root when mock mode is active, ahead of
  the existing LEAFCUTTER_REPO_ROOT / cwd-parent probing. Whether mock mode is active is
  decided per UXP-553 (LEAFCUTTER_MOCK env default + runtime override) / UXP-553-1
  (production lock). Every loader (ac-store.ts, tickets.ts, components.ts, roadmap.ts,
  agents.ts, tests.ts, flows.ts, traceability.ts, activity.ts) already reads through
  repoPath(), so no loader is edited — the swap is whole-app by construction. No per-page
  code path may special-case mock.
