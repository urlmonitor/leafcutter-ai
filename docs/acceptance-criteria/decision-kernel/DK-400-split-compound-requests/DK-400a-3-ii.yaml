expects_from:
  ac_id: DK-400a-3
  contract: "The no-split path that a caller-supplied decision request takes without any bundling check."
it_requirements:
  - 'The typed-request exemption is an exact check on the item''s input payload schema id (leafcutter.decision_request.v1),
    evaluated before any Jev question is assembled: no bundle question for that item appears in any Jev batch.'
  - The caller's question, options and criteria reach the decision capability unchanged, as today.
  - The exemption is driven by the payload schema, never by goal wording.
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_typed_decision_request_never_checked_for_bundling
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: A decision_request.v1 run whose question bundles three questions has no bundle question in any
      recorded Jev batch, no split record and no split interaction.
  - name: test_typed_decision_request_payload_reaches_decision_unchanged
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: The decision invocation receives the caller's question, two options and three criteria unchanged.
test_rationale: The exemption must hold before Jev is asked, so the test inspects the recorded Jev batches of a
  real run, not a predicate in isolation.
