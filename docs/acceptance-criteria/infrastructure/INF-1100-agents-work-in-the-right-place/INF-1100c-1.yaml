    relationship: describes
    status: exists
  - path: scripts/build.py
    relationship: describes
    status: exists
  - path: config/skills_config.default.json
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Surface is the build pipeline (scripts/build.py + scripts/template_compiler.py): thread the configured test root into a {{config.testing_context.test_root}} placeholder using the SAME {{config.*}} substitution mechanism that already resolves {{config.file_size_limit_py}} in python-coder.md — do not invent a parallel mechanism."
  - "Config key is testing_context.test_root (with sibling readme_path) per the skills_config schema; the consumer's .claude/skills_config.json overrides config/skills_config.default.json. Resolve from the merged config, not a hardcoded literal."
  - "The compiled output must contain the literal resolved value and ZERO remaining {{...}} work-location placeholder tokens."
  - "Deployed/template parity (ADR-001): templates/ is canonical, .claude/ is the build output; both must be produced by the same build.py run."
  - "Must handle config-read errors gracefully per the project error handling policy (wrap file I/O, no bare except)."
delivers_to:
