title: "A ticket the drive carried to completion is recorded done in the ticket's own record"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose record names four phases as needed,
    And the drive carries the ticket through all four,
    And after each one the ticket's own record carries that phase's sign-off,
  When the drive finishes that ticket,
  Then the ticket's recorded lifecycle state is done,
    And the state is written into the ticket's own record, not only into the drive's
      report of the run,
    And the trigger for that write is that every needed phase carries a sign-off in
      the record -- not that the drive counted the ticket among its completed work,
      and not that the delivery phase alone succeeded while another needed phase did
      not,
    And a reader given only the ticket afterwards can tell the work completed,
  So a drive that really finished the work never leaves behind a store in which
    nothing happened.
