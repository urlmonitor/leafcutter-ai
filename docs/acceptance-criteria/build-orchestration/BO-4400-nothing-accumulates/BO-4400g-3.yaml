criteria: |
  Given the project "shop" with the eight workspaces of BO-4400g-2 ("ff-1", "mc-1", "sq-1",
    "idle-1", "open-1", "landed-dirty", "landed-plus", "fresh-1"),
  When the landed-work pass is run as a preview,
  Then every workspace folder, every line of work in the project and on the shared project,
    and the shared main line are identical before and after,
  And the pass ends with exactly one answer, marked as a preview, that lists "ff-1", "mc-1",
    "sq-1" and "idle-1" as would-be-cleared by work name and location, and the other four
    as kept with the same reasons a real pass gives,
  And when the real pass is run next, with nothing changed in between, it clears exactly
    "ff-1", "mc-1", "sq-1" and "idle-1",
  And given one more workspace "ff-4" whose commits reached the main line is added and the
    preview is run again, "ff-4" is added to the would-be-cleared list and nothing else in
    the answer changes.
