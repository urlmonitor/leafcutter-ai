test_rationale: |
  Every clause here is a property of a run, and the only instrument that can see one is a
  run. Drive the lane end to end with the producing step's reply controlled, and assert on
  what the run then did — which agents it dispatched and what it said when it stopped.
  A test that reads the lane's source for the presence of a comparison passes unchanged on
  a comparison that is defined and never reached, which is the documented history of this
  whole family.

  Four shapes, and the second and third are the ones that make this record non-vacuous.

  Deliver an intact bundle — produced by actually running the assembly over real inputs,
  not hand-written — together with the value the producer stated for it, and assert the run
  proceeds and the context-carrying dispatches carry that text.

  Deliver the 2026-08-31 shape: the same bundle with its markup escaped, with the value the
  producer stated for the UNescaped text. Assert the run ends and that no context-carrying
  dispatch was recorded. This is the test that is red today and cannot be made green by any
  amount of reference-rejection, because the reply is content.

  Deliver an alteration that changes NO characters of length — one character swapped for
  another — with the producer's stated value unchanged. Assert the run still ends. This is
  the test that distinguishes a real comparison from a length comparison; a byte count
  alone passes the escaped case (escaping lengthens the text) and fails here, so without
  this test the criterion can be satisfied by something that does not hold.

  Deliver altered content together with a verification value recomputed over the altered
  content. Assert the run still ends. If the lane derives its own side of the comparison
  from the received text, this test cannot fail — it is what proves the comparison has two
  independent sides rather than one.

  Deliver well-formed content with the verification value absent, and again unparseable.
  Assert both end the run, so the missing-value path is not quietly permissive.
declares_side_effect: false
change_target: pipeline
risk_surface: internal
notes: |
  WHY THIS IS A NEW RECORD AND NOT AN AMENDMENT TO BO-2400c-1-iii. That record owns the
  question "is this content, or is it a reference to content?", and it answers it
  correctly. The second occurrence of KI-BO-019 arrived as content and was still wrong.
  Reference-rejection cannot see that and no strengthening of it will: the reply is not a
  locator, it is the bundle, altered. The missing question is a different one — "is this
  content the content that was produced?" — and nothing in the lane asks it. Folding it
  into -iii would put two separable guarantees behind one criterion and make a later
  regression unattributable to either.

  IT IS ALSO NOT BO-2400c-1-iv. That criterion compares one run's dispatched prompts
  against EACH OTHER and requires the prefix to be identical across them. Two prompts
  carrying the same corrupted text satisfy it completely. Cross-dispatch consistency and
  fidelity-to-source are orthogonal, and the run that failed had the first without the
  second.

  WHAT THIS RECORD DELIBERATELY DOES NOT RE-SPECIFY. The mitigation KI-BO-019 records as
  DISPROVED is the third of its three fix options: keep the verbatim contract and enforce
  it, by refusing a reply that looks like a path and by stating the size expectation in the
  prompt. Both shipped; run wf_22fae0b9-291 failed anyway, at 18,190 bytes — under the
  ~20 KB the prompt itself names — with the payload HTML-escaped in transit. So nothing
  here adds another instruction to the producer, another rejection rule based on what the
  reply looks like, or another size statement. Those are all judgements about the shape of
  the received text, and the defect is precisely that a corrupted bundle has the right
  shape. The only thing that separates the intact case from the corrupted one is a
  comparison against what was produced.

  WHY THE SINGLE-CHARACTER CLAUSE IS IN THE CRITERION. The known-issue entry proposes
  "a byte count or digest". A byte count would have caught the observed failure, because
  escaping lengthens text — and it would miss a same-length substitution entirely, which is
  a quieter version of the same fault and would hand a silently altered prompt to the coder.
  Specifying the property (any difference fails) rather than the instrument leaves the
  choice open while ruling out the one that only appears to work.

  THE FAIL-CLOSED POSTURE IS PRESERVED, NOT RELAXED. The gate that caught both occurrences
  was right both times and is untouched. This record adds a reason to stop; it removes
  none. The repair clause is worded to permit a lane that normalises received text and then
  verifies the result — that is a legitimate implementation — while forbidding one that
  normalises and proceeds, which would convert this criterion into the leniency it exists
  to prevent.
