title: "The marker cannot be applied to work that has already been broken down"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200c.yaml
criteria: |
  Given a record that carries parked: true and a non-empty parked_reason while
    the store also contains at least one descendant of it at level L2,
  When the AC schema validator is executed as a process against that record,
  Then it exits non-zero, naming the record id, the L2 descendants found, and
    the rule that a parked record must have no descendant below the feature
    level,
  And when the parent-back-link check is executed against a staged set
    containing that record and its children, the exemption is not granted and
    each missing back-link is reported as a violation,
  And a record that carries parked: true at readiness: approved is likewise
    rejected by the validator, naming the record id, its readiness, and the rule
    that an approved requirement cannot be parked,
  And a record carrying parked: true whose descendants are all at the feature
    level and whose readiness is draft or reviewed is accepted,
  And these verdicts come from executing the validator and the check as
    processes and asserting their exit codes and messages.
