notes: |
  WHY THIS IS A SEPARATE RECORD FROM TQ-600a-1. The fixture and the figure fail
  independently and are consumed by different ACs. A fixture that deploys once and
  reports a hardcoded 1 satisfies the fixture claim and defeats every use of the
  figure; a faithful counter over a fixture that deploys per worker satisfies this
  record and defeats the fixture claim. Bundled, either failure can hide behind the
  other's evidence.

  THE WHOLE-RUN CLAUSE IS THE AUDIT SURFACE FOR THE XDIST CONFLICT. The agreed
  resolution to per-worker multiplication is a file lock plus a run-scoped shared
  directory — the first worker to ask produces the layout, the rest wait on it — and
  that resolution is stated as a claim on TQ-600a-1. This record is what makes the
  claim checkable afterwards: if the resolution regresses to a per-worker build, the
  reported figure rises to the worker count and says so. Without a whole-run figure,
  a per-worker build reports 1 from every worker and reads exactly like success.

  NO LITERAL DEPLOY COUNT MAY APPEAR. The measured 77 counts invocation SITES across
  52 files, not invocations: a looped or parametrised site may deploy more than once,
  and the true per-run figure was not established at authoring time. The bound is
  relational and both of its terms come from the run's own record.
