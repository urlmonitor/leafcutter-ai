id: DK-400c-1-i
title: "A proposal of more than five parts offers five and lists the rest as not covered, never dropping them silently"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a bundled goal for which the host proposes seven parts, p1 to p7, each quoting its
    words from the goal and none waiting for a later part,
  When the proposal is turned into the split,
  Then the split gate offers p1 to p5 for approval,
  And it lists p6 and p7 read-only as not covered by this split, each with its text and quote,
  And it tells the person that the request holds more than five parts and that p6 and p7 will not
    be answered by this split but can be asked again as a request of their own,
  And p6 and p7 can be neither ticked nor run.
