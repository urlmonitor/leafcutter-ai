criteria: |
  Given the filesystem hosting the drive copies does not support copy-on-write
    reflinks (so `cp --reflink=auto` cannot make a reflinked copy),
  When the isolation layer creates a new drive copy,
  Then it does not fail and does not fall back to a plain byte copy of the reflink
    step; instead it moves to the next strategy in order
    (`git clone --reference <cache> --dissociate`, then plain `git clone`),
  And the drive copy that results still has a fully independent, dissociated object
    store identical in isolation guarantees to the reflink path.
depends_on: [BO-1800a-2]
