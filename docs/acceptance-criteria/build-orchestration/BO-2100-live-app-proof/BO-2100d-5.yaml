title: "A live-app check that is switched off records a skipped outcome instead of nothing"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket whose frontmatter sets `live_surface_test: true`
    And a project configuration whose `live_surface_testing.enabled` is `false`, or
      whose `live_surface_testing` block is absent entirely,
  When the ticket is driven to completion,
  Then the ticket's recorded phase outcomes contain exactly one `live-surface-tester`
    entry whose outcome is `skipped`,
    And its reason names `live_surface_testing.enabled` as the term that prevented
      dispatch, and names the configuration file that term is read from,
    And that entry is produced from the ticket's own request — the
      `live_surface_test: true` frontmatter flag — even though no
      `live-surface-tester` phase was added to the ticket's `agents:` map,
    And no development server is started and no HTTP assertion is issued,
    And the ticket's completion summary does not present the live-app check as
      passed,
    And a ticket that does not set `live_surface_test: true` produces no
      `live-surface-tester` entry at all.
