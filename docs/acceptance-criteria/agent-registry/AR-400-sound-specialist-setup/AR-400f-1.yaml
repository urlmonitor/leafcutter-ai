id: AR-400f-1
title: "A hand-off entry already covered by 'every ticket-phase agent' stops the build, naming the entry and what covers it"
component: agent-registry
components:
  - agent_registry
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test specialist "probe-supervisor" whose `spawn_allowlist`
    declaration lists `__ticket_phase_agents__`, "brainstorm-lead" and
    "llm-expert",
    And llm-expert is marked as a ticket-phase agent while brainstorm-lead is
      not,
  When the build runs, and separately when the registry validator runs,
  Then both stop with one finding naming "probe-supervisor", the entry
    "llm-expert", and the covering entry `__ticket_phase_agents__`, classified as
    a redundant hand-off entry,
    And neither prints a warning for it -- the finding is a failure, not a
      warning,
    And "brainstorm-lead" produces no finding, because the covering entry does
      not include it,
    And removing "llm-expert" from the declaration makes both runs pass, with
      probe-supervisor's compiled hand-off list still naming llm-expert exactly
      once (through the covering entry).
depends_on:
  - AR-400f
