    status: exists
  - path: docs/reference/workflow-authoring-contract.md
    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Assertion surface: a gateless run's terminal result carries no paused state and no pending-question record."
    properties:
      status: {type: string, enum: [completed]}
      pending_question: {type: "null"}
    required: [status]
  reference_file_path: "templates/workflows-js/build-feature.js"
  n_location_rule: "1"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: this edge is asserted against the E2 workflow ENGINE (JavaScript). build-feature.js has NO interactive gates today, so it is the natural home for the gateless-run assertion; the shared JS pause helper it imports must be inert on runs that never reach a gate."
    - "A run that reaches no interactive gate must complete with behavior equivalent to a pre-pause-mechanism run: no paused state is entered and no persist agent() is dispatched / no pending-question record is written."
    - "Regression guard: the shared JS pause machinery must be inert on runs that never pause (do not perturb the non-interactive path)."
    - "E2 top-level-body form (ADR-017); deployed/template parity via build.py (ADR-001): python scripts/build.py --target-dir ."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(build-feature.js) with responses that complete the run; assert terminal status completed, no paused_awaiting_input, and no persist agent() dispatch in captured agent_calls. Do NOT test a standalone Python module."
delivers_to: null
expects_from:
  ac_id: BO-2300a-1
  contract: "The shared JS pause/persist mechanism whose inertness this edge asserts: on a run with no interactive gate, that mechanism must not enter the paused state nor dispatch a persist agent()/write a pending-question record."
test_spec:
  - name: test_run_without_gate_completes_normally
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via run_workflow_under_e2(build-feature.js), a run that reaches no interactive gate finishes with status completed and never enters paused_awaiting_input."
  - name: test_no_pending_question_recorded_for_gateless_run
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via run_workflow_under_e2, no persist agent() is dispatched (agent_calls contain none) and no pending-question record is written for a run that hits no decision point."
