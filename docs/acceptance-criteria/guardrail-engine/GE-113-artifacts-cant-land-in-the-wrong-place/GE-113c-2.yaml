assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "RECONCILIATION WITH ACS-300g-6: the already-merged fix made check_components_integrity.py resolve a component detail_ref existence check against the real <repo>/docs/... tree (not <repo>/.leafcutter/docs/...). GE-113c-2 is the behavioral assertion that, in the deployed layout, a guard reads the CONSUMER PROJECT TREE and COMPLETES its check rather than silently finding nothing (the symptom: an orphan component could not be registered because the guard scanned the wrong tree). This is regression coverage / extend-the-fix, NOT a re-implementation — do not mark done; confirm after the branch merges origin/main and extend to any guard whose check input path is derived from the (now-corrected) root."
  - "Every path the guard uses to locate its check INPUT (components.json, detail_ref docs, test-location data) must be built from the shared resolved project root (GE-113c-1), so the input tree is the consumer project's, not .leafcutter/."
  - "A guard must distinguish genuinely-nothing-to-check from looked-in-the-wrong-tree: completing against the correct tree is required, never a silent no-op caused by root misresolution."
  - "Must handle errors gracefully per the project error handling policy; deployed/template parity (ADR-001) via build.py."
