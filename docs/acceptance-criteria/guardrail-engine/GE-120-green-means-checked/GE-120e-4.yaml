notes: |
  THE NON-MERGE AC, and it is not a restatement of GE-120e-1 for other operations — it
  covers the cases GE-120e-1's definition does NOT reach.

  WHY THESE OPERATIONS NEED THEIR OWN AC. GE-120e-1 attributes by comparing the staged tree
  against every state the commit is built on. On a merge there are two such states and the
  carried-in work falls out of the comparison. On an undo or a copy of someone else's change
  there is only ONE state — the branch tip — so the comparison attributes the entire
  changeset to the author, and the defect survives GE-120e-1 untouched. Undoing a mainline
  merge that added tests stages hundreds of test deletions against a single parent; the
  observed contract-shrinking objection reappears word for word on a commit whose author
  wrote none of it. The second signal, the record of the operation in progress naming the
  source change, is what closes that gap, and it is the reason the fourth clause forbids
  keying on a merge marker.

  THE THIRD CLAUSE IS A NEGATIVE CONTROL, not filler. The cheapest way to satisfy the first
  two clauses is a narrowing that also quietly exempts ordinary commits, and nothing else in
  this L1 would catch that — GE-120e-3's ordinary arm has no operation in progress and would
  read as agreement. State it, cover it.

  A JUDGMENT THE IT-PO SHOULD CONFIRM. Treating a straight undo as "not the author's" is a
  scoping choice, not something the PO's notes settled. The argument for it is that the
  deletions in an undo are inherent to reversing someone else's decision rather than a
  decision of the author's own, and that being blocked on them is precisely what teaches the
  override reflex this L1 exists to remove. The argument against is that choosing to undo is
  a deliberate act. If the answer goes the other way for one check, record it as that
  check's behaviour rather than by removing this AC — the copy-of-a-recorded-change half
  stands regardless.
