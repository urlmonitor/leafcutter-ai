title: "A map check that finds no links to inspect refuses instead of passing silently"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300c-1.yaml"
criteria: |
  Given the documentation map about to be committed has section headings such
    as "## Components" and "## Glossary"
  And its entries are written in a form the map checks do not recognise as
    links (e.g. a changed table layout), so the checks recognise zero links
  When the contributor commits
  Then the commit is refused
  And the refusal message states that the map was inspected and 0 links were
    found, and that the check could therefore not verify the map
  And when the checks recognise at least one link per non-empty section, the
    message (on pass or refusal) or the check's output states how many links
    were inspected
