id: TQ-600a-13
components:
  - testing_quality
title: "A test the documentation says the default run skips is a test the default run skips"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the naming convention by which an expensive test is suffixed to mark it as one
    the default run does not pay for,
  And two documents that state the convention has an effect: the suite-performance
    guide says of the shared-layout tests that most "are excluded from the fast default
    run; only the boundary test that mocks-but-forwards subprocess.run runs by
    default", and the testing guide says "The pre-commit suite excludes _MANUAL tests"
    and that they "are excluded from both suites",
  And the verified absence of anything that could produce that effect: the test
    configuration registers two custom markers and no marker for this convention; the
    continuous-integration invocation carries no name selection, no marker selection
    and no deselection of any kind; and none of the repository's per-directory
    collection files implements a skip based on the suffix,
  And the independent confirmation that the claim is false rather than merely
    unenforced: the run's own duration record lists a suffixed test at 13.8 s, and a
    test that was timed is a test that ran,
  And the conclusion this record does not overturn, reached by reading what those tests
    contain: they must not simply be dropped. The suffixed tests in the
    suite-performance directory are the ones that would notice the shared-layout
    routing silently handing a mutator the shared root and corrupting every reader, so
    removing them from the default run would remove the only quick warning of that
    regression,
  When a default collection of the suite is performed and the set of tests it collects
    is compared with the set the documentation claims is excluded,
  Then the two agree — either every suffixed test is genuinely absent from the default
    collection and reachable through a named opt-in, or no document claims an exclusion
    the collection does not perform,
  And the comparison is made by performing a collection and examining what it
    collected, never by searching a document or a configuration file for a phrase,
  And when the two disagree, the comparison fails and names both the specific tests and
    the specific document sentence that disagree, rather than reporting a count or a
    warning,
  And that failure is demonstrated by introducing a disagreement and observing it,
    because a comparison that has never failed has not been shown to be able to.
depends_on:
  - TQ-600a
