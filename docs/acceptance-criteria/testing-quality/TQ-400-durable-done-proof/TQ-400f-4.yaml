assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    DECISION MADE AT ENRICHMENT — REUSE TQ-400e-2'S OUTCOME, ADD A DISTINCT CAUSE KEY.
    The BA left this open; it is now settled so the implementer does not choose
    silently. An unresolvable CHILD SET is reported under the EXISTING
    evidence-not-trustworthy member of the oracle's closed vocabulary (proven /
    unproven / exempt / evidence-not-trustworthy), carrying a distinct, stable,
    machine-readable CAUSE KEY that separates it from TQ-400e-2's unresolvable
    coverage captures; and the run's report must state a sub-count per cause. DO NOT
    mint a fifth outcome member.
    Reasoning, recorded so it can be overturned on its merits rather than by drift:
    (a) the safety semantics are identical on both axes — never write, always report,
    name the source location — and a second outcome would have to restate all of that
    and could then drift from it; (b) four downstream consumers already read that
    closed vocabulary (TQ-400a-4's inventory verdict field, TQ-400b-1's demotion
    population filter, TQ-400c-3's cadence report, TQ-400d-4's triage pile), so a
    fifth member is a vocabulary migration across all four, which is the
    disjoint-vocabulary shape of the EPIC-ComputedQualityGates layer-3 defect; (c) the
    two causes are nevertheless NOT interchangeable for triage — an unresolvable
    coverage capture is fixed in a test file, an unresolvable child link is fixed in
    an AC record — so they must not be indistinguishable in the inventory, which is
    what the cause key and the per-cause sub-count provide; (d) the change is
    asymmetric in cost: adding a discriminator now is cheap, splitting one outcome
    into two later is a migration across four readers.
  - >-
    FOUR RESOLUTION FAILURES, ALL REPORTED, NONE ALLOWED TO ESCAPE THE WALK: (a) a
    covered_by entry naming no record anywhere in the store; (b) a child file present
    but unreadable or unparseable; (c) a cycle reachable from the record through the
    child links; (d) an id resolving to more than one record (KI-ACD-008, live on
    main). Each produces a reported abstention for the affected parent, and none may
    raise out of the walk and take the run's other verdicts with it.
  - >-
    THE CYCLE CASE NEEDS A VISITED-SET TRAVERSAL. A recursive walk written for a tree
    will hang or exhaust the stack on a child-link cycle and destroy the whole run's
    output. Termination must be structural, not a depth cap chosen by guess.
  - >-
    THE ABSTENTION BRANCH MUST BE RAISED AT THE POINT RESOLUTION FAILS, inside the
    descendant traversal — not applied afterwards over a completed verdict. Bolted on
    afterwards, the failure has already been coerced into a has-unfinished-descendants
    or an all-finished verdict before anything can abstain, and the second of those is
    a silent false pass.
  - >-
    THE REPORT MUST NAME, PER ABSTAINING PARENT, THE SPECIFIC UNRESOLVABLE LINK AND
    THE RECORD IT WAS FOUND ON — the literal id string that failed to resolve and the
    parent's repo-relative path. Without the location the defect cannot be fixed at
    source, and an abstention that cannot be fixed at source is a permanent hole in
    the sweep rather than a shrinking one.
  - >-
    THE ABSTAINED PARENT'S FILE MUST BE BYTE-IDENTICAL AFTER THE RUN — no demotion, no
    reason, no date. Same write discipline as TQ-400e-1: do not open the file for
    writing at all.
  - >-
    ABSTENTION IS AN OUTCOME, NOT A SKIP. Abstaining parents are counted separately
    from parents judged complete and from parents judged to have unfinished work, and
    that count must appear in the run's report AND be carried in TQ-400a-4's
    inventory. A skipped record is indistinguishable from a record nobody evaluated,
    which is exactly the invisibility under which the twenty bad parents accumulated.
  - >-
    SCOPE BOUNDARY: this AC does not repair dangling links, does not deduplicate ids,
    and does not gate authoring on either. It owns one guarantee — whatever the
    store's residual link-integrity error rate, the sweep never takes a badge away on
    a child set it could not read.
  - >-
    Must handle errors gracefully per the project error handling policy and must fail
    toward ABSTENTION rather than demotion whenever the child set cannot be positively
    resolved; and the sweep must still complete and emit verdicts for every other
    record in the store when one record's traversal fails.
delivers_to:
  - agent: python-coder
    ac_id: TQ-400f-2
    contract: >-
      The demotion-safety guarantee on the descendant axis: a parent whose child set
      could not be resolved is classified evidence-not-trustworthy with the
      child-link cause key, is never written to, and is never present in the
      population TQ-400f-2 demotes. The report carries the abstention count separately
      and names each unresolvable link with the record it was found on.
  - agent: python-coder
    ac_id: TQ-400a-4
    contract: >-
      Inventory entries for abstaining parents carrying the existing
      evidence-not-trustworthy verdict plus the child-link cause key, so a downstream
      reader can partition child-link abstentions from TQ-400e-2's coverage
      abstentions without string-matching prose.
expects_from:
  - ac_id: TQ-400e-2
    contract: >-
      The existing evidence-not-trustworthy outcome, its never-write discipline, and
      its name-the-unresolvable-thing-and-its-location reporting rule — extended to
      the child-set axis with a DISTINCT CAUSE KEY rather than a fifth outcome
      member. See this record's first it_requirement for the decision and its
      reasoning. TQ-400e-2 is not modified by this AC.
  - ac_id: TQ-400f-1
    contract: >-
      The descendant traversal and its child index, inside which the abstention branch
      must be raised at the point resolution fails. TQ-400f-1 also routes its
      duplicate-id errors here rather than resolving them itself.
