criteria: |
  Given an intended removal is declared by writing a `Removes: <path>` line into a
    commit message, and a contributor who has never written such a line is about to
    declare that their delivery takes a file away,
  When that contributor consults the reference documentation for the delivery
    boundary before writing the line,
  Then the documentation states each of the following as an entry the reader can scan
    to directly, rather than as a procedure to be read from the top:
      the exact spelling of the line and where in the commit message it belongs;
      that one line authorizes exactly one path, so two removals need two lines;
      that the path is written relative to the repository root with forward slashes,
        no leading `./`, and no trailing whitespace, and is matched exactly after
        that normalization rather than by substring or by file name;
      that a path ending in a slash authorizes removals strictly beneath that
        directory, and that wildcards and globs are not accepted in any position;
      that declaring a path authorizes taking away any part of it, up to and
        including the whole file;
      and that a line on any commit of the delivery counts, including one added
        afterwards on a commit that changes no files,
  And the documentation lists, for each way a declaration can fail -- a removal with
    no matching declaration, a declared path that matches nothing the delivery
    removes, and a path written in a form that is not accepted -- what the delivery
    does and what it tells the author, so that an author who has been refused can
    tell a mistyped declaration from a removal they did not intend, without running
    the delivery a second time,
  And for every example line the documentation shows, taking that line and the
    removal set the documentation states it against through the delivery examination
    yields the outcome the documentation records beside it.
depends_on: [BO-1800f, BO-1800f-2, BO-1800f-2-i]
