test_spec:
  - name: test_removed_work_the_drive_completed_still_reports_a_successful_epic
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive an epic in which every piece missing at completion time is one the returned payload's completed record names. Assert the payload leads with a success value, carries an affirmative epic-complete verdict, names the piece as no longer present, and nowhere describes it as unbuilt or not done."
  - name: test_removed_work_the_drive_did_not_complete_withholds_the_completion_claim
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Drive an epic in which a planned piece is missing at completion time and is absent from the completed record. Assert the leading outcome value is not a success value, the epic-complete verdict is not affirmative, the piece is named, and the output states what the operator should do -- the same treatment work discovered after planning receives."
  - name: test_both_kinds_of_removal_in_one_drive_are_judged_separately
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "One missing piece the drive completed and one it did not, in the same drive. Assert the claim is withheld, that the withholding names only the uncompleted piece, and that the completed piece is still reported as no longer present and not as unbuilt -- so the partition is per piece rather than a single flag over the whole missing set."
  - name: test_a_finished_epic_with_nothing_missing_still_reports_success
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "CONTROL. Nothing removed, nothing added, the re-read confirmed, the epic genuinely complete. Assert a success outcome value, an affirmative epic-complete verdict and no missing-work entries -- so a fix that withholds whenever anything looks unusual cannot pass, and the negative cases above are attributable to their conditions."
  - name: test_the_early_no_batches_return_partitions_removals_the_same_way
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Reach the epic completion return taken when there are no batches to run, with a piece missing and no completed record naming it. Assert the same withholding, at the site where the completed record is emptiest and a partition written against the final return's data shape is most likely to misclassify."
  - name: test_no_payload_names_one_piece_of_work_as_both_completed_and_not_built
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Across every scenario in this suite, assert the intersection of the payload's completed work and the work it describes as not built is empty, and that the leading outcome value, the epic-complete verdict and the message agree -- the invariant stated directly, so any future branch that reintroduces the contradiction is caught wherever it is added."
  - name: test_the_contradiction_check_fires_on_a_not_built_wording_disagreement
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Present the suite's epic-outcome contradiction check with a payload that certifies success while stating a named piece of work was not built, and assert the check reports the disagreement. Today it recognises only not-complete wording and passes this payload silently, so without this the whole class remains invisible to the suite."
test_rationale: |
  Every descriptor drives the real epic workflow and asserts on the returned payload
  because the classification this record specifies happens before the merge that
  assembles that payload, and the merge is where the contradiction was produced last
  time. Reading the branch that builds the missing list cannot show which of its two
  meanings reaches the operator.

  The suite is deliberately built around a four-way partition -- removed-and-completed,
  removed-and-not-completed, both together, and nothing removed -- because the two
  cheapest wrong fixes each pass three of the four. Withholding whenever anything is
  missing passes both negative cases and the control but fails the removed-and-completed
  case; treating every removal as harmless passes the control and the completed case but
  fails the uncompleted one. Only the full set separates them, and the mixed case is the
  one that forces the decision to be made per piece rather than once per drive.

  The last descriptor asserts on the check rather than on the driver, which is unusual
  and intentional. The reason this defect reached a reviewer at all is that the suite's
  contradiction detector matches only two phrasings of not-complete and is blind to the
  not-built phrasing the removals branch emits, so the suite was green over a payload
  that plainly contradicted itself. A fix that corrects the driver while leaving the
  detector blind restores the green suite and leaves the next variant of this defect
  just as undetectable, which is exactly how this one arrived.
