id: BO-3200a-1
title: "A fact the build depends on is still obtained when no specialist can be dispatched at all"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build that must know a recorded fact about the project before it can decide what to
    do next,
    And an environment in which dispatching a specialist is impossible,
  When the build resolves that fact,
  Then it obtains the correct value and proceeds, so the value did not come through a
    specialist.

  Given the same fact recorded in a source larger than the size at which a relayed reply is
    shortened — at least 130 kilobytes,
  When the build resolves that fact,
  Then the value it obtains is complete and usable, and the decision it makes from it matches
    the decision it would make from the source read whole.

  Given a fact whose recorded value would cause the build to permit an action,
  When the build resolves it,
  Then the build permits that action, and does not refuse it.
