  contract: The replace-entry path that drawer open, switch and close use.
it_requirements:
- Enter on a focused card calls the same open-drawer intent a click calls, so there is exactly one replaceState
  per open and no second history write.
- The drawer's close control is a native button named 'Close step details'; Enter and Space close through
  the same replace path as a click.
- Every step and branch card is in the Tab order with a visible focus indicator.
- 'flow-explorer.tsx (635 lines) and flow-drawer.tsx (438) are over the 400-line ratchet: any edit must
  leave each shorter than before; extract into components/flows/parts/.'
test_spec:
- name: 'Enter on ''Step 2 of 3: ... (Code)'' opens the resolve drawer at ?step=resolve with history.length
    unchanged'
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: component
  angle: criterion
  must_catch:
