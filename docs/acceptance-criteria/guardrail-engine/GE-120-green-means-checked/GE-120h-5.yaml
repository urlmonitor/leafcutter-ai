id: GE-120h-5
title: "A refusal from the crowded-directory check names only help the author can actually get to, and naming nothing is better than naming something that is not there"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a directory is refused for holding more files than the crowding standard
    allows, and the refusal names help the author is to turn to — a skill, a
    specialist, a workflow, a command, a procedure, a document, or anything else
    it calls by a name,
  When each named thing is sought under the name the refusal gives it, and from
    the place the refusal tells the author to turn to it,
  Then each one is there, and is something the author can use from that place,
  And given a refusal that names help which the project holds no instance of
    under that name, or which exists somewhere but cannot be reached from where
    the refusal is read,
  When the same search is made,
  Then the refusal is judged wrong for naming it, and the judgement follows from
    the named thing not being reachable rather than from the words used to name
    it — so a refusal that drops one unreachable name and introduces a different
    one is caught on the same terms as the first, and removing a single sentence
    settles nothing on its own,
  And given a refusal that names no help at all, and says only that the directory
    holds more files than it may and how far over it is,
  When the author reads it,
  Then this criterion is satisfied — offering nothing is acceptable and offering
    something unreachable is not, because the second closes a gap in the reader's
    head that is still open in the project, while the first leaves it visible.

  Coverage note: what is checked is whatever the refusal names on the day it is
  read, taken from the text the check actually emits, and each named thing is
  then sought as the author would seek it. A finding that one particular phrase
  is absent is not evidence for this criterion: the phrase can be deleted while
  the refusal goes on naming something else that is not there, which is the
  result this record exists to refuse. Note also that the help named here is a
  plain noun phrase rather than a token of any recognisable shape, so a search
  that only looks for names written in a fixed form will pass over it.
depends_on:
  - GE-120h
  - GE-120h-3
