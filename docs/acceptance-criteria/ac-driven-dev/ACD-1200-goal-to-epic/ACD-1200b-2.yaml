  - "The review-all path must terminate cleanly if IT PO v3 does not promote all ACs to approved — re-present the readiness report with updated counts"
  - "Must not modify AC YAML files on the cancel path"
  - "Must re-read AC readiness values from disk after IT PO v3 completes (not from cached state)"
