id: BP-1100d-3-i
components:
  - build_pipeline
  - commit_guardian
title: "No commit recipe the package ships is newly blocked when the delegation hook starts recognising git -C commits"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the commit-delegation hook recognises a commit by the git subcommand that runs,
    so a commit spelled with a global option such as -C is now blocked,
  And the package ships commit recipes in skill, agent and workflow markdown and in
    JS workflow prompts,
  When every shipped recipe is evaluated by the hook's own detector,
  Then no recipe that the previous substring rule allowed is blocked by the new detector
    unless it carries the commit-agent exemption,
  And the recipes that previously committed with the -C spelling route through the
    commit agent (skills run in the main loop) or carry the exemption the workflows
    already use (finalize's closure commit, as fast-lane-ship does),
  And the census fails loudly when it finds no recipes at all, so a broken extractor
    cannot report a clean pass.
