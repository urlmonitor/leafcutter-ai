criteria: |
  Given an AC with title "Required fields reject missing values at commit time"
    and component ac-store,
  And a done ticket whose title, criteria section, and component share no
    significant terms with that AC (e.g. a ticket about "Add changelog
    generation" in component build-pipeline),
  When the cross-reference audit tool is run,
  Then the AC does NOT appear in the matches list for that unrelated ticket,
  And the total match count for that AC is zero.
