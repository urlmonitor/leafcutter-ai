id: INF-100c-5-i
components:
  - feedback_collector
  - build_pipeline
readiness: reviewed
priority: medium
title: "A feedback writer that names no registered agent is reported by the build"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
created_by: docs/acceptance-criteria/infrastructure/INF-100-agent-reliability/INF-100c-5.yaml
criteria: |
  Given the feedback categories file lists "ac-validater" (a misspelling) in the
    allowed_writers of the blocker category,
  And no agent named "ac-validater" exists in the agent registry,
  When the package build runs,
  Then the build output reports "ac-validater" as a writer that names no registered agent,
  And the report names the category it appears in ("blocker"),
  And a writer that appears in three categories is reported once, naming all three
    categories,
  And writers that do name a registered agent (for example sql-coder and epic-supervisor)
    are not reported.
depends_on:
  - INF-100c-5
doc_links:
  - path: docs/known-issues/feedback-collector/open-low-ki-fc-003.md
    relationship: describes
    status: exists
  - path: config/feedback_categories.yaml
    relationship: describes
    status: exists
  - path: docs/architecture/components/agent-registry.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/feedback-collector.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The registered-agent set is the agent ids in config/agent_registry.json, as the criteria state, read at check time and never copied into the check."
  - "Each unknown writer is reported once, naming every category it appears in, in sorted order, so a renamed agent's leftover name is one entry and not one per category."
  - "The report must appear in the build output at WARNING severity or higher on every build where it applies, and must not depend on a verbose or debug flag."
  - "Whether an unknown writer also fails the build is not decided (caveat logged). Until it is decided, the report must not by itself fail the build; INF-100c-5's missing-writer failure is unaffected."
  - "Sentinel writers are excluded by the same rule submission applies (INF-100c-5-ii); this record adds no exclusion list of its own."
test_intent:
  - clause: the build output reports "ac-validater" as a writer that names no registered agent
    needs_test: true
    reason: Detecting the unknown name is a set difference between two files, and a wrong source set would miss it.
  - clause: the report names the category it appears in ("blocker")
    needs_test: true
    reason: The category is looked up per writer, so a report without it would leave the stale entry unfindable.
  - clause: a writer that appears in three categories is reported once, naming all three categories
    needs_test: true
    reason: Grouping by writer is computed, and the naive loop reports the same writer three times.
  - clause: writers that do name a registered agent (for example sql-coder and epic-supervisor) are not reported
    needs_test: true
    reason: A false positive on real agents would make the report noise that everyone learns to ignore.
delivers_to: null
expects_from:
  ac_id: INF-100c-5
  contract: "The build-time consistency check from INF-100c-5, which loads the agent definitions and every category's allowed_writers in one pass and returns unknown_writers as a sorted list of {writer: str, categories: list[str]}; this record fixes what goes into that list and how it is reported."
origin_agent: business-analyst
created: 2026-10-21
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: internal
notes: |
  Requested direction 2 of KI-FC-003 (stale or misspelt writer). A renamed agent leaves its
  old name behind as exactly this kind of writer. Whether the report also fails the build
  is an open question carried to the IT PO / user: the request says "reported", so this
  record asserts the report, not a build failure. A misspelt writer loses no feedback by
  itself; the agent it was meant to name is caught by INF-100c-5 when that agent signs off.
