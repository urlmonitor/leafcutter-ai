  - "DRAW THE CURRENT STATE FROM BO-3200f-3's LISTING, NOT FROM INTENT. Every exact-command connection shown must correspond to a site in the routing check's report, and every such site must appear. If the diagram is authored while mis-addressed sites remain, they are drawn as they are and marked as such, not omitted -- the second scenario's second clause exists to stop the target state being taught as the current one."
  - "SHOW THE CONTAINMENT BOUNDARY: the guardrails and permission rules sit between the executor and the commands it runs, so a reader does not take 'the only party that carries out exact commands' to mean an unguarded one."
  - "SHOW the agent registry as the source of the executor's stated permission, and specialists reached only for judgement dispatches."
  - "Tracked architecture doc subject to check-doc-frontmatter and check-doc-links in the same commit; frontmatter components use graph ids (build_orchestration)."
test_required: false
test_rationale: >-
  A diagram has no executable surface. Its one mechanically checkable claim -- that its
  connections match the shipped dispatch set -- is discharged by requiring it to be drawn from
  BO-3200f-3's per-site listing, which is produced by an executing check with its own tests. A
  test over the diagram text could only assert that names appear in it, which passes on a
  diagram of the target state that omits the mis-addressed sites, the exact failure the
  criteria guard against. Frontmatter and links are covered by live commit gates.
