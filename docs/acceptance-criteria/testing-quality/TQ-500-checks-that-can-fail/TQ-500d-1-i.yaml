notes: |
  THE SECOND CLAUSE IS THE ONE THAT CAN ACTUALLY FAIL. The state assignment is checked
  by TQ-500b-1-i; what is specific here is the wording, because the recorded defect was
  not a wrong state but a right state described in words that read as approval. An
  implementation can place piece H correctly and still print "not applicable" beside
  it, and every reader downstream will believe the second thing.

  THE LAST CLAUSE FORECLOSES THE REGRESSION MOST LIKELY TO BE INTRODUCED IN GOOD FAITH.
  Once the guidance says an immediate pass is expected for this family, the natural
  next step is to let a declared expectation of an immediate pass excuse the answer —
  which restores the inversion in a form that looks like the fix.

  BOUNDARY. Adds no behaviour. It is satisfied only by a regression test over
  TQ-500b-1's reading and TQ-500d-1's record shape, and must not be closed by a change
  that special-cases the three fixture records.
