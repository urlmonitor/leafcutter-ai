it_requirements: |
  The probe/gate decision keys off the commit's originating tree in a way that
  INCLUDES the main tree; there is NO "skip if main tree" shortcut anywhere in the
  probe (BO-1700a-1) or the gate decision (BO-1700b-1). The uniform-across-trees
  guarantee is enforced at the shared probe/gate layer (python-coder), independent
  of the commit-driver prose surface (BO-1700d-3). ADR-001 deployed/template parity
  applies.
