amended_by:
  - date: 2026-08-31
    agent: business-analyst
    reason: "User decisions D1, D2 and D3, raised by the cross-tree seam defect recorded on BO-3500c-2. D1: the criteria named a NEW five-value kind enum {code, tests, docs, diagram, config}. That would have been the fourth overlapping artifact vocabulary in this repository. The store's change-target vocabulary already exists, already has ten values including one for a screen, one for an instruction and one for a schema, and is already carried by 3,381 of 3,694 records (verified counts in live use: code 1241, pipeline 884, prompt 449, docs 260, config 90, schema 73, infrastructure 32, ui 10). The checklist reuses it instead of minting a parallel list. D2: `diagram` is the one value genuinely missing and is added to that vocabulary -- the user's reason (a move to structured data as the foundation for diagrams) also changes the diagram's proof, recorded on BO-3500c-2-ii. D3: `tests` is DROPPED as a kind. It is a proof, not an artifact -- the lane's red-baseline check already is the differential applied to a code deliverable -- and, load-bearing, with the independent per-deliverable sign-off slots of ACD-1800b-1a a tests kind lets one record hold a signed-off code deliverable beside an unstarted tests deliverable: a code deliverable declared finished with its own proof unwritten, which is the phantom-done shape encoded in the field meant to prevent it. The code item's test obligation already has a home on the record."
  - date: 2026-08-31
    agent: business-analyst
    reason: "NOT AMENDED IN THE SAME PASS, AND STALE UNTIL THE IT PO RE-DERIVES THEM. This record is readiness: reviewed and its technical enrichment fields are the IT PO's to author, so the amendment above touched criteria only. Four fields still name the superseded five-value enum and now contradict the criteria: the second it_requirements entry (`The kind value must be exactly one of {code, tests, docs, diagram, config}`), the delivers_to contract, the expects_from contract as quoted by ACD-1800a-4, and the test_spec entry test_checklist_kind_enum_rejects_unknown_value. An implementer reading it_requirements rather than criteria will build the forbidden enum. Also stale for the same reason, in the same tree and outside this pass's named scope: ACD-1800a-3's it_requirements, ACD-1800a-2-i (whose criteria scenario is 'a checklist listing only code and tests'), and ACD-1800a-4 (whose doc_links and expects_from both quote the five-value enum as fixed)."
  - date: 2026-08-31
    agent: it-po
    reason: "RESOLVES THE CONTRADICTION THE ENTRY ABOVE FLAGGED. criteria untouched; only the enrichment fields the IT PO owns were re-derived against decisions D1/D2/D3. it_requirements: the entry fixing the five-value enum is replaced by three -- (a) the kind vocabulary IS the existing change_target enum extended by `diagram` (eleven values), (b) it must be resolved by a shared JSON-Schema $ref rather than restated, because a duplicated literal is the very defect D1 names and a copy is self-consistent from the moment it drifts, and (c) `tests` is rejected outright, the code deliverable's test obligation living in this record's existing test_spec / test_required. Two further entries added: the commit-guardian paths corrected to templates/scripts/commit_guardian/ (scripts/commit_guardian/ is build output, so the old paths pointed at a copy an edit would not survive), and the AC_STORE_DEPLOY_MAP obligation with the run-the-deployed-hook verification, since source-tree unit tests mask a missing deploy entry. delivers_to restated to the eleven-value $ref'd contract and its third consumer named (BO-3500c-2's build-time proof-class derivation). test_spec: the enum test no longer quotes a literal list -- it resolves both enums from the schema and asserts set equality -- and gains a one-edit-changes-both test that a duplicated literal fails, a tests-kind rejection test asserted at BOTH the JSON-schema path and the manual-validation fallback, and a deployed-hook test. No test is a presence grep: each loads the schema or runs a validator."
