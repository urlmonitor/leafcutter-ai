criteria: |
  Focused agents produce higher-quality, more predictable results.

  Each agent in the pipeline sees only the files and context relevant to its role —
  nothing more. This prevents accidental changes to unrelated parts of the project,
  eliminates confusion from irrelevant information, and makes autonomous work reliable
  enough to trust without constant supervision. The narrower the view, the sharper the output.
