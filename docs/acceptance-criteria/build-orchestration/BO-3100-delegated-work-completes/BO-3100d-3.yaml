    angle: seam
    description: "Run BO-3100d-1's claim-check runner scoped to this page and assert every behavioural claim it makes is bound to a check and reported confirmed — none contradicted, none unchecked."
  - name: test_bo_3100d_3_guidance_leads_to_an_arrangement_the_sweep_accepts
    target_dir: unit_tests/workflows/
