id: TQ-200c-5
components:
  - testing_quality
  - ac_store
  - ticket_creation_pipeline
title: "A proof the pipeline cannot honour is announced, and never reported as a success"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a piece of work whose proof demand the pipeline cannot fully honour — a kind
    of proof it has no way to ask for, a demand it can state but cannot deliver to
    anyone able to satisfy it, or a judged demand with nowhere to land,
  When the pipeline reports whether that work is ready to be built,
  Then the report says which demanded kind of proof was not carried through and why,
    naming the work,
  And that outcome is not reported as a success: a report in which a demanded kind of
    proof went uncarried cannot read as ready-to-build,
  And the absence of any proof demand is itself only reportable as a success when the
    work genuinely needs none, decided as TQ-200c-2 requires — never because the
    question of what proof it needs was skipped,
  And every check the pipeline performs on a proof demand is either performed for
    this work, or named in the report as a check that was not performed and why — a
    check that is silently not attempted is not permitted,
  And this holds for the whole routed demand, not for any single field of it, so an
    implementation that stops discarding one authored field still fails while another
    demanded kind goes uncarried.
depends_on:
  - TQ-200c
  - TQ-200c-1
