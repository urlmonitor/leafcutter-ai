id: GE-133a
title: "A store of records that only tools read is not judged by a limit written for folders people browse, and you can see that it was set aside"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  The crowding standard protects a person looking for something. Where nobody
  looks by hand, it does not apply, and where it does not apply, that is said
  out loud.

  The acceptance-criteria store is flat by design: one folder per feature
  family, no folder nested inside another, and every tool that reads it walks
  it from the top. Most of its folders already hold more than the standard
  permits and pass only because a folder already over may keep growing. So the
  first time any family that started small crosses the line, the commit adding
  its next record is refused, for a crowding nobody experiences, and the only
  way through is to switch the check off for that commit.

  After this, whether a location is held to the standard is a stated,
  reviewable property of that location, declared in configuration rather than
  built into the check. A folder set aside is reported as set aside and on
  which stated ground, counted apart from the folders that were judged, so a
  run that judged nothing never reads as a run that found nothing. A
  declaration that cannot be read sets nothing aside, and says so. A folder of
  source or tests is judged whatever it is called.
