criteria: |
  Given the triage agent returns route: "behavioral",
  When the /plan-feature workflow script processes the routing decision,
  Then it skips the product owner entirely,
  And dispatches business-analyst with the user's request plus the parent_l1_id from triage,
  And the business analyst writes L2/L3 ACs under the existing L1 parent,
  And the workflow continues as normal: the business analyst's user gate, the technical
    planner's auto-gated stage, the test-design stage and the final gate.

  Given the triage agent returns route: "technical",
    and no product-truth flow was approved earlier in the same run,
  When the /plan-feature workflow script processes the routing decision,
  Then it skips both the product owner and the business analyst,
  And dispatches it-po directly with the existing AC ids to amend,
  And the technical planner enriches the specified ACs with technical constraints,
  And the technical planner's stage passes without a human gate once its requirement
    rule check passes,
  And the test-design stage follows, and the workflow presents the enriched ACs with
    their test design at the final gate for user confirmation.
