id: BP-600d
title: "One command from diagnosis to done"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  A single entry point orchestrates the full fix lifecycle.

  You provide your diagnosis (what is wrong, where, and why) and the workflow
  handles everything: AC creation, test writing, fix application, test
  verification, commit, PR update, and ticket lifecycle close. The ticket
  ends up in done/ with status complete. No manual steps between invocation
  and resolution.
