notes: |
  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect are deliberately unset. This record was authored at
  the L3 behavioural level only; the technical enrichment is the IT PO's, and readiness stays
  `draft` for the user rather than being promoted here.

  ORIGIN (2026-10-12, user-approved filing). Raised during a declared-files hygiene pass on
  TQ-600a-13 and filed on the user's instruction. The finding as reported: ACD-1600c-4-i's
  closing clause exempts a finished record's to-be-created path that now exists "because the
  finished work is what created it", and that stated reason is FALSE whenever a path is shared
  between records.

  ==========================================================================
  THE PRIOR QUESTION, AND THE ANSWER IS NEITHER OF THE TWO OFFERED READINGS.
  ==========================================================================
  Before the rationale can be called wrong, the field's meaning has to be settled. The question
  was put as a choice between two readings, and the owner's lean (2026-10-12) was for the
  second, explicitly deferred to the BA:

      OWNERSHIP: `to_be_created` claims "my own work creates this path".
      HISTORICAL: `to_be_created` claims "this path did not exist when I was authored",
        making the field a dated note that nothing acts on afterwards.

  BOTH ARE WRONG, AND THE SECOND IS WRONG IN THE DANGEROUS DIRECTION. The marker is a BUILD
  PRECONDITION: a statement about the tree AT THE MOMENT THIS RECORD'S WORK IS BUILT.
  `existing` = "the work expects to find this path"; `to_be_created` = "the work must not
  assume this path is present". It is forward-looking, it is evaluated against the tree as it
  now stands for as long as the work is pending, and it goes inert when the work is built
  because A PRECONDITION FOR WORK THAT HAS HAPPENED IS SPENT.

  WHY OWNERSHIP IS DEAD, AND WHAT WOULD HAVE HAD TO BE TRUE FOR IT. Two things, neither of
  which holds. (1) The enum would need a third value, or a separate owner field, because a
  record whose work EDITS a file a SIBLING CREATES -- the ordinary shape of any multi-record
  family building one module -- has no honest value available: `to_be_created` would be false
  (its work does not create the file) and `existing` equally false (the file is not there to
  find, at authoring time or at build time if it builds first). Nine of the fifteen measured
  declarations are exactly that shape. (2) `to_be_created` + present on an unfinished record
  would have to be a REFUSAL, not a report, because a non-creator asserting "I create this"
  is simply false and nothing about it is salvageable. It is advisory by explicit design, and
  ACD-1600c-4-i's own notes name the benign case: "it can also be legitimate mid-build (the
  file was created by the work in progress)". A field cannot mean a thing its enforcement is
  deliberately built not to enforce.

  WHY THE HISTORICAL READING IS ALSO WRONG, AND THIS IS THE PART THAT MATTERS MOST BECAUSE IT
  IS THE LEAN. Taken seriously it makes the field INERT -- a dated note nothing reads -- and
  that is falsified by the one piece of live enforcement the field has: `existing` + absent on
  an unfinished record is a BLOCKING REFUSAL (ACD-1600c-4-i). Nothing blocks a merge over a
  stale historical note. That refusal only makes sense if the declaration is a claim about the
  tree THE WORK WILL BE BUILT AGAINST, and ACD-1600c-4-i's notes give exactly that reason:
  "'Neither present nor marked' is a claim that cannot be true of any repository state, so it
  refuses" -- i.e. the precondition is UNSATISFIABLE, so the work cannot proceed. So the field
  is read, and acted on, for precisely as long as the work is pending.

  AND THE CONSEQUENCE OF GETTING THIS WRONG IS A DISARMED GATE, WHICH IS WHY THE LEAN IS
  OVERTURNED RATHER THAN ADOPTED. Under the historical reading the three reports on
  TQ-600a-13-x are a gate complaining about a non-problem, and the natural next step -- raised
  as a live option when the question was put -- is to extend the exemption to unfinished
  records too. THAT WOULD BE A MISTAKE. The same comparison that produces those three advisory
  lines is the comparison that produces the `existing` + absent refusal; they are one check
  with two outcomes. Exempting unfinished records to quiet the advisory half would reach into
  the branch that is doing real work. The reports should be RELABELLED, not silenced, and that
  is what this AC's criteria do.

  THE PRECONDITION READING ALSO EXPLAINS THE ASYMMETRY, WHICH NEITHER OTHER READING DOES.
  Refuse `existing` + absent; only report `to_be_created` + present. On the precondition
  reading that is not an arbitrary choice of severity -- it is actionability. An unsatisfiable
  "I expect to find this" blocks the build. A "do not assume this is present" that turns out to
  be present does NOT block anything: the work proceeds, editing rather than creating. The
  advisory exists because that condition has two causes and the check cannot tell them apart.
  The safe declaration for a record that cannot guarantee build order is `to_be_created`, and
  the asymmetry exists so that the safe declaration is never punished.

  WHAT THE STORE'S OWN PROSE SUPPORTS, read again with the precondition reading in hand -- it
  fits all three passages, where the historical reading fits only the middle one:
    - ACD-1600c-4's it_requirements: the value was renamed `exists` -> `existing` "so the
      authored claim cannot be confused with the observed state the pre-pass reports". An
      authored claim about the build tree, held separately from an observation. Exactly a
      precondition.
    - ACD-1600c-4-i's notes: "the marker records intent at authoring time" -- intent being
      forward-looking, which is the precondition and not a snapshot.
    - ACD-1600c-4-iv's notes: "The file was present when the work was done; the declaration
      was true then" -- the precondition held at build time, which is when it had to hold.

  SO THE DEFECT IS NARROWER THAN FIRST FILED, AND BETTER LOCATED. The exemption is right; the
  reason "because the finished work is what created it" is wrong; and the CORRECT reason is
  neither "it was true when authored" (which would make the field inert) nor anything about
  creation -- it is that THE PRECONDITION IS SPENT. That reason is true of all 12 exempted
  entries, creator and consumer alike, which is exactly what the filed reason is not.

  ==========================================================================
  WHAT FOLLOWS: RIGHT BEHAVIOUR, WRONG REASON, AND AN INVISIBLE CONDITION.
  ==========================================================================
  Under reading A the EXEMPTION IS CORRECT -- a declaration that was true when authored should
  not generate a commit-time report forever after, on a finished record nobody can act on.
  ACD-1600c-4-i's behaviour therefore stands and this AC does not disturb it. What changes is
  the reason, and the reason is load-bearing in one specific way: it is what makes the
  condition look accounted-for. "The finished work created it" reads as a complete explanation
  of every exempted entry, so nobody asks how many exempted entries there are, or how many of
  them that sentence is actually true of.

  THE MEASUREMENT, taken 2026-10-12 across the three paths TQ-600a-13-x declares
  (scripts/ci/post_merge_hold.py, scripts/ci/post_merge_notice.py,
  scripts/ci/post_merge_tunables.json), all three of which exist in the tree:

      15  `to_be_created` declarations in total
           hold.py 7 (-vi, -iv, -vii, -viii, -ix, -x, -xiv)
           notice.py 6 (-iii, -iv, -v, -x, -xii, -xiii)
           tunables.json 2 (-ii, -x)
       3  on the CREATING record (-vi created hold.py, -iii created notice.py,
          -ii created tunables.json) -- the three the rationale is true of
       9  on `done` records whose work did NOT create the path -- silently absolved by a
          sentence that is false of every one of them
       3  on TQ-600a-13-x, the one record still `todo` -- the ONLY three a report names

  So the rationale is true of 3 of the 12 exempted declarations and false of 9, and the 12 are
  invisible while the 3 that are visible belong to the one record that has not even been built
  yet. A reader who meets the three advisory lines has no way to learn that twelve more
  instances sit behind the exemption.

  WHAT THIS AC ADDS, IN TWO PARTS, AND THE SECOND IS THE ONE THAT CHANGED ONCE THE SEMANTICS
  WERE SETTLED.

  (a) FOR FINISHED RECORDS: one section in the single store-wide declared-files report,
  counting the exempted entries and stating per line whether the record's own implemented-by
  list names the path -- the mechanical signal separating the one creator from the nine
  consumers, available from the store without any new field. Posture copied from
  ACD-1600c-4-iv: informational, never exit non-zero, never raised at commit time, never
  rewrites a record. This is bookkeeping: the entries are spent preconditions and the only
  thing wrong with them was that nobody could count them.

  (b) FOR UNFINISHED RECORDS: the live advisory is RELABELLED so it names its cause. Today a
  single sentence -- "marked to be created but already exists" -- covers two conditions with
  opposite meanings: a precondition a SIBLING SATISFIED EARLY (the author was right, and chose
  the safe marker) and a marker NO RECORD ACCOUNTS FOR (the author was wrong). The check can
  tell them apart mechanically, from the store alone: does any other record declare this path,
  and is that record finished? Nothing new needs to be stored. This is the half that is worth
  building, because the current wording makes a correct declaration look like a mistake, which
  is what invites the two bad fixes below.

  WHY NEITHER BAD FIX. Refusing at commit time would hold unrelated commits hostage to another
  record's file lifecycle -- the failure ACD-1600c-4-iv exists to prevent. SILENCING the
  unfinished advisory, which is the step the historical reading invites, would reach into the
  branch that produces the `existing` + absent REFUSAL, since both outcomes come from one
  comparison. And re-marking the nine entries to `existing` would assert a precondition those
  records cannot guarantee, converting an advisory into a latent blocking refusal keyed on
  another record's build order -- the trade TQ-600a-13-x's notes refuse for the same reason.

  ==========================================================================
  ONE OPEN QUESTION, NAMED NARROWLY SO IT CAN BE TESTED RATHER THAN RE-DEBATED.
  ==========================================================================
  The precondition reading above was reached from the AC store and the validator's observable
  behaviour ONLY. This record's author does not read source, by design, so one thing is
  asserted rather than verified: THAT THE FIELD'S CONSUMERS TREAT IT AS A BUILD PRECONDITION
  AND NOT AS A SNAPSHOT. The falsifiable form, for whoever checks it:

      In scripts/ac_store/declared_files.py and its four declared consumers -- the
      implementation-readiness gate (ACD-1600c-1/-2), the ticket generator (TKT-600a-3/-3-i),
      the requirement rule check (ACD-2500a-3, ACD-2500c-1-i) and the file-aware pre-pass
      (ACD-2500d-5-i) -- is `state` used to decide what the WORK WILL DO (expect to find vs
      expect to create), or is it compared to the tree as a correctness assertion about the
      record?

  IF THE CONSUMERS TREAT IT AS A CORRECTNESS ASSERTION, the precondition reading is wrong about
  the field as built (though it would remain the right design), and the relabelling in clause
  (b) would need re-deriving. WHAT WOULD NOT CHANGE EITHER WAY: the ownership reading stays
  dead (its two defeats are in the enum's arity and the advisory-by-design severity, neither of
  which is a source-level fact), the `done` exemption's stated reason stays wrong for shared
  paths, and TQ-600a-13-x's three entries stay as they are -- that decision holds under all
  three readings, for three different reasons.

  ==========================================================================
  THE RETIRED-RECORD CLAUSES ARE A SEPARATE FINDING, MADE 2026-10-12 BY RUNNING THE VALIDATOR
  RATHER THAN BY READING THE STORE. FLAGGED FOR THE USER AT THE APPROVAL GATE.
  ==========================================================================
  THIS WAS NOT PART OF WHAT WAS APPROVED FOR FILING, AND IT CORRECTS THE REPORT THAT PRECEDED
  IT. The finding as escalated said TQ-600a-13-x's three entries were "the only visible
  instance" of the condition. That was wrong. `validate_ac_schema.py` over the whole store
  (5,036 records, 2026-10-12) emits SIX report lines across FOUR records:

      TQ-600a-13-x       3 lines  (work_status todo, approved, awaiting build)
      TQ-600a-11         1 line   (status deprecated, work_status todo)
      TQ-600a-11-ii      1 line   (status deprecated, work_status todo)
      TQ-600a-11-iii     1 line   (status deprecated, work_status todo)

  THE SECOND GROUP IS A COLLISION BETWEEN TWO CURES, AND IT IS THE INTERESTING HALF. The
  TQ-600a-11 family was RETIRED, following the retirement shape INF-600b-2 documents, which
  mandates `work_status: done -> todo` on the ground that "done is a claim about the tree and
  not about the past". That demotion is correct on its own terms. But the already-exists
  exemption is keyed on `work_status: done` -- so retiring a record UN-EXEMPTS its declared
  files and converts a silent, correct exemption into a PERMANENT advisory report. Their work
  genuinely created those paths; the paths are still there; and the records now report
  drift forever.

  WHAT MAKES IT WORSE THAN ORDINARY NOISE: IT IS UNCLEARABLE BY CONSTRUCTION. Every other
  instance of this report has an exit -- build the work and the record goes `done` and the
  report stops. A retired record has no such exit, because the only work that would clear it
  is work that was deliberately retired. So the report asks for something it is a contradiction
  to supply, which is precisely the failure mode INF-600b-2's retirement block already
  describes for three OTHER gates: "each refusal offers remedies that are locally reasonable
  and globally wrong ... every one of them is a way of making a retired record look alive".
  This is a fourth gate with the same property, found the same way, and it is not in that
  block's list because the list predates the `declared_files` field.

  WHY THE CLAUSES ARE IN THIS AC RATHER THAN A SIXTH SIBLING, AND THE USER MAY OVERRULE THIS.
  The argument for splitting is real: the retired case keys on `status`, not `work_status`, so
  it is a different population and a different branch. The argument against, which decided it,
  is that this AC's SUBJECT IS THE EXEMPTED POPULATION AND ITS COUNTABILITY. Splitting the
  exemption population across two records would mean no single record states who is exempted
  and why -- recreating, inside the fix, the exact "cannot see the whole population" defect the
  fix exists to remove. The three sections are also one report, as ACD-1600c-4-ii requires.
  If the user prefers the split at the approval gate, the retired clauses lift out cleanly
  into ACD-1600c-4-vi: they are the final Given/When/Then group and share no clause with the
  rest. There is room either way -- the L3 level carries no child cap (check_ac_limits caps
  only L1-per-L0 at 7 and L2-per-L1 at 5), though note ACD-1600c itself is AT its 5-L2 cap, so
  anything here must be an L3 under ACD-1600c-4 and cannot become a new L2.

  ==========================================================================
  THE SHAPE: A CONDITION ON WORK, EVALUATED AGAINST A TREE SOMEBODY ELSE CAN MOVE.
  ==========================================================================
  Filed as the fourth member of the canonical list in INF-600b-2's notes, and recorded there as
  the most common member BECAUSE IT NEEDS NO ERROR TO OCCUR. The full write-up is there; the
  short form, so this record stands on its own.

  `declared_files[].state` states a condition on the tree at THIS record's build time, but it
  is evaluated against the tree AS IT NOW STANDS, and the tree is moved by OTHER RECORDS' WORK.
  So the declared and observed states diverge with NOBODY MAKING A MISTAKE -- which is what
  separates this from shape (2), where a true fact about the past was deliberately parked in a
  present-tense field and defended. Here nothing was parked and nothing was defended: the
  declaration was correct, is still correct as a condition, and merely got SATISFIED EARLY by a
  sibling.

  THE DEFECT IS NOT THE DIVERGENCE -- IT IS THAT THE CHECK CANNOT NAME ITS CAUSE, AND THE
  WORDING PICKS THE WRONG ONE. "Marked to be created but already exists" describes a satisfied
  precondition and a wrong declaration in the same words, and reads as the second. So a correct
  record looks negligent, which is what makes a reader reach for a tidy-up that either arms a
  blocking refusal (re-mark to `existing`) or disarms a live gate (silence the advisory). THE
  REPORT'S INABILITY TO DISTINGUISH IS THE BUG; the divergence is normal operation.

  AND ONE HALF IS UNFINDABLE ON TOP OF THAT: once `work_status: done` the condition is EXEMPTED
  RATHER THAN FLAGGED, so no gate ever surfaces it and nobody can count the population. The
  exemption is right -- a spent precondition has nothing left to check -- but the reason given
  for it is wrong, and a complete-sounding wrong reason is what stops anyone asking for the
  count. Hence the two-part cure above: COUNT the spent ones, RELABEL the live ones. Neither
  half is a refusal, because neither condition is an error.
