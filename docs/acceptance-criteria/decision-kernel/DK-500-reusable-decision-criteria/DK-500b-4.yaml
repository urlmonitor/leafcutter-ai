id: DK-500b-4
title: Questions drafted during a decision run get grouping suggestions within that run's Jev budget
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a decision run in which a criterion was drafted for a gap, "Can the format be read into the knowledge graph as one reviewed kind?",
  And the published library holds cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c, cat-52b16c7b5a23106f, cat-d6ce5f78c181ebd1 and cat-1df63b670163b54e,
  When the drafted criteria are grouped before the approval of proposals,
  Then each drafted criterion is shown at that approval with its suggested existing category or with "none",
  And every Jev call spent on this grouping counts against the run's Jev budget,
  And a suggestion takes effect only when the person accepts it at that approval, and the person can change or undo it there,
  And in a run whose library holds no published category, no grouping call is made.
depends_on:
- DK-500b
- DK-500b-1
- DK-500e-2
covered_by:
- DK-500b-4-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-500e-2
  contract: Gap criteria drafted in the run, each with wording, criterion_id and gap_concern (DK-500e-2 delivers_to).
change_target: code
risk_surface: contract_boundary
it_requirements:
- 'In-run grouping runs after gap drafting and before the approval of proposals, over the published non-retired categories only (Git, read through the generated index). It uses the same exact-match step and the same Jev choice question as offline grouping: one choice per drafted criterion that is not an exact match, batched into as few Jev calls as jev.max_questions_per_call allows.'
- Every grouping Jev call counts against the run's Jev budget (limits.max_jev_calls) through the existing budget gate, and grouping is funded only after the research and assessment reserve (DK-500b-4-i).
- The suggestion (category id or none, with reason and probability) is part of the approval-of-proposals payload built by the kernel. The transport skills need no change; if a skill change proves necessary it is a separate llm-expert AC.
- 'An accepted suggestion links the drafted criterion to its category exactly like an unedited reuse (DK-500d-3): a membership addition is staged with the decision record and published only with it. A changed or undone suggestion stages nothing.'
- Criteria a person adds at the approval are not grouped in the run.
- With no published category, the grouping step makes no Jev call and the payload shows the plain drafted criteria.
test_required: true
test_spec:
- name: test_drafted_criteria_shown_with_suggestion_or_none
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: At the approval of proposals the drafted criterion is shown with its suggested existing category or none.
- name: test_grouping_jev_calls_count_against_run_budget
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The run's Jev call count rises by exactly the grouping calls made.
- name: test_suggestion_effective_only_when_accepted
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Only an accepted suggestion stages a membership addition with the decision record.
- name: test_person_can_change_or_undo_suggestion
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Changing or undoing the suggestion at the approval stages nothing for it.
- name: test_empty_library_makes_no_grouping_call
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: boundary
  description: With no published category the grouping step makes no Jev call.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port; assert the approval payload, call counts and staged files. A direct-import unit test of a helper would not prove the forming flow wires the step.
