estimated_complexity: L
change_target: code
risk_surface: safety
test_required: true
it_requirements:
  - "Production must be ordered so that every condition that can refuse is decided before anything is written. Atomicity is a constraint on the order of the work, not a cleanup step: a refusal discovered after the document exists must not be repaired by deleting it, because a failure during that repair leaves exactly the state this record forbids."
  - "If a write must begin before all conditions are known, it must be staged outside the project tree and moved into place only once the run has committed to succeeding."
  - "The run's exit status must carry the verdict: non-zero on every refusal, zero only on a completed production. Both authoring surfaces instruct an agent as well as a human, so a caller must be able to tell refusal from success without parsing prose."
  - "Every refusal message must state both halves - what about the request was wrong AND what to supply instead - in terms the author can act on without opening another document. A message stating only the problem does not satisfy this record."
  - "Refusal messages go to the error stream and must not be suppressible by the default verbosity."
  - "No refusal may end with a document in the author's hands. Producing something the project's own checks would reject, and leaving the author to fix it, is the failure mode INF-1300a exists to prevent."
  - "Each refusal reason must be implemented through one shared refusal path so the atomicity and message guarantees cannot diverge as reasons are added. Refusal paths written one at a time diverge immediately: the first is careful, the third is an early return that leaves a file behind."
  - "Errors must follow the project error handling policy in CLAUDE.md; an unexpected exception escaping as a traceback is a bare failure and does not satisfy the message contract."
test_spec:
  - name: test_every_refusal_reason_leaves_an_empty_whole_project_difference
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Parameterised over every refusal reason reachable in this tree - undeclared kind, occupied destination, tier-and-number collision, absent or wrong-tier parent, undeclared component, missing obliged field. For each: hash every file in a git-initialised temporary project, make the request, hash again, assert the difference is empty. Each reason is a separate case; none may be skipped or assumed to behave like another."
  - name: test_every_refusal_reason_exits_non_zero
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "For the same parameterised set, assert the process exit status is non-zero and that a successful production exits zero - the verdict read from the outcome alone, before and without reading any message."
  - name: test_every_refusal_message_states_both_the_problem_and_the_remedy
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "For the same parameterised set, assert each message contains an identification of what was wrong AND a statement of what to supply instead. A message containing only the first half fails."
  - name: test_refusal_discovered_late_still_leaves_nothing_behind
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Construct a request that is valid up to the last checked condition and refuses on it. Assert no document exists at the destination, the intended parent is unchanged, no index entry appeared, and no temporary file survives. This is the ordering constraint, not the message contract."
  - name: test_no_refusal_leaves_the_author_holding_a_document
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Across the parameterised set, assert no .md file was created anywhere under the temporary project, including outside the intended destination."
  - name: test_refusal_reason_set_is_enumerated_from_the_implementation_not_from_a_list_in_the_test
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: unit
    angle: reachability
    surface_invoked: "templates/scripts/scaffold/new_arch_doc.py"
    description: "Derive the set of refusal reasons from the shared refusal path itself and assert every one of them appears in the parameterised suite above. A reason added later without a case is a failure, which is what stops this record becoming a claim about the reasons that happened to be written first."
test_rationale: >-
  The message text of a refusal is the easiest thing in this tree to satisfy by inspection -
  it is right there in the source - and CLAUDE.md's gate-and-workflow rule is explicit that
  a grep-shaped assertion passes on dead code. So every descriptor here runs the refusal and
  reads the state afterwards. The whole-project difference is the only observation that can
  tell a refusal that cleans up from one that merely says it did, and it must be taken per
  reason rather than once, because refusal paths are written one at a time and the third one
  is where the early return leaves a file behind. The last descriptor exists because a fixed
  list of reasons in the test would silently stop covering the tree the first time a reason
  is added - the same count-pinned failure this project has recorded elsewhere.
