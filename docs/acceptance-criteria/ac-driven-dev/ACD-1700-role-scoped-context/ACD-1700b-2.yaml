  Given an AC whose assigned_agent matches its deliverable surface --
    prose / skill body / agent template -> llm-expert,
    documentation -> documentation-expert,
    C4 / sequence / state diagram -> architecture-diagram-author,
    Python source -> python-coder,
  When the assignment-quality check evaluates the AC,
  Then it passes with no mismatch flag,
  And the AC is eligible for dispatch to its assigned specialist.
