assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The change must land under templates/. The deployed workflow under .leafcutter/workflows/ is build output."
  - "Must use the same resolution ACD-2100a-1 establishes rather than a second, independent one. Two resolvers on the same startup path is how the five sites came to disagree in the first place."
  - "The registry must be read from the local filesystem only. Adding a network or agent round-trip to satisfy this read reintroduces the failure class ACD-2100b-5 removes."
  - "A worktree that happens to hold its own installed support directory must still resolve to a registry -- the behaviour must not depend on the worktree being empty of one, only on the run reaching a real registry."
  - "Must satisfy the repository error-handling policy: the read is external I/O; a failure must be reported through the outcomes ACD-2100b-1 and ACD-2100b-2 specify, never swallowed into a false verdict."
  - "The read must add no measurable startup cost beyond a single file open -- no directory tree walk over the project on every run."
test_spec:
  - name: test_registry_read_succeeds_from_a_worktree_with_no_installed_support_files
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A real git worktree of a project, asserted first to contain no installed support
      directory, is the process working directory; the startup check returns a verdict
      derived from the project's registry and the run advances to the next step.
  - name: test_startup_check_registry_read_is_reached_from_the_workflow_entry_point
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow's startup charter-check step, driven through the workflow runner from a worktree working directory"
    description: >-
      Driving the real workflow from the worktree reaches the step after the check --
      the verdict is consumed in control flow, not merely computed.
  - name: test_registry_read_uses_the_real_on_disk_registry_file
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The registry fed to the check is the project's own config/agent_registry.json read
      verbatim from disk rather than a hand-built fixture, and the verdict matches the
      permits_shell value that file actually carries for the worktree-creation agent.
test_rationale: >-
  The second Given is the whole test. If the fixture worktree happens to contain an
  installed support directory, the cwd-relative path resolves and the test passes
  against unfixed code -- the same construction hazard as ACD-2100a-1's two-copies
  Given. The absence has to be asserted before the run, not assumed. The real_artifact
  angle is charged because the observed defect was partly about which file was read:
  a hand-built registry fixture placed wherever the test wants proves the parser works,
  not that the resolution reaches the project's actual registry.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100a-5
    contract: "A startup charter check that completes from a worktree working directory, reading the project's registry through the shared repository-anchored resolution rather than a cwd-relative path."
