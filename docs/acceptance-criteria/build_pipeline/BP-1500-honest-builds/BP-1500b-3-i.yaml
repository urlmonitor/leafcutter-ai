notes: |
  THIS IS THE SHARPEST FALSIFIABILITY TEST IN THE SET, and the closest thing to
  a direct restatement of the observed defect. The reporter ran the build
  against a tree carrying a real orphan and read "(no stale files found)". That
  line was TRUE. It was produced by walking eleven paths from a historical
  layout migration, nearly all of which are absent from a current install -- a
  scope of approximately zero, reported in the words of a clean result. Anything
  that can print the same sentence from an empty scope has not been fixed.

  WHY IT IS AN L3 UNDER BP-1500b-3 RATHER THAN A SIXTH L2. It is the boundary
  case of the parent AC's rule: BP-1500b-3 requires the counts to be stated and
  to be greater than zero for a real install; this specifies what happens on the
  one input where that cannot hold. Splitting it out keeps BP-1500b-3's criteria
  about the normal path and gives the zero case somewhere to be tested in its
  own right, which matters because it is the case today's code hits.

  DISTINCT FROM BOTH APPROVED NEIGHBOURS, deliberately and narrowly:
    BP-1500d-4  the check CANNOT READ its record        -> read failure
    BP-1500e    the check DID NOT RUN, an earlier failed -> not reached
    this AC     the check ran, read everything, and had nothing to look at
  All three are the same harm (an unexamined check looking like a satisfied one)
  reached by three different causes, and a fix for any one fixes neither other.
  The parent L1's notes flag that this triplet is the shape a store takes just
  before the general rule should be lifted into its own record -- BP-1500f is
  free and needs no waiver. That lift is a scope decision for the owner and is
  NOT taken here; if it is taken later, this AC becomes a citation to it rather
  than a duplicate of it.

  THE LAST Then CLAUSE IS WHAT STOPS THE CHEAP FIX. Printing "examined 0 files"
  in a quiet line satisfies the first three clauses while remaining just as easy
  to scroll past as the sentence it replaced. A sweep pointed at nothing is
  misconfigured, and the report has to place it where misconfiguration is looked
  for.
