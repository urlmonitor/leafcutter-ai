assigned_agent: test-writer
estimated_complexity: S
it_requirements:
  - "VACUOUS SUCCESS IS THE TARGET STATE. Zero checks exercised with zero failing assertions must be a FAILURE. Assert on the exercised COUNT, not on the absence of assertion failures — the whole defect is that the vacuous path produces no failing assertion of its own, so a test that waits for one will never fire."
  - "The exercised-check count must appear in the harness output on EVERY run, including successful ones. A hard failure catches a harness that breaks loudly; the printed count catches a harness that silently narrows its own subject list, which is the slower and more common decay. Compare the count against the manifest set (GE-119c-3) rather than against a constant."
  - "The setup step that did not complete must be named SPECIFICALLY — for example 'build.py did not produce .leafcutter/scripts/commit_guardian in <copy>' — not reported as a generic setup error. A generic message sends the reader to the wrong layer."
  - "Exercise this against a DELIBERATELY INCOMPLETE SETUP: a second copy created but never built. Do not simulate it by stubbing the harness's own counter or by raising a synthetic exception — a stub reproduces the author's belief about how setup half-fails, and a harness that stands up infrastructure has far more ways to half-fail than a check does."
  - "PRECEDENT TO ENCODE, not merely to remember: this project has shipped this exact shape twice. fast-lane-build.js passed its grep-only structural tests while never executing its red/green gates, and the phantom-done files_touched hook passed its unit tests while being a no-op on every real ticket. Both were green sweeps over nothing. The interlock must be mechanical."
  - "The harness is itself subject to GE-119a: a harness that cannot run reports a could-not-check outcome, distinguishable from a clean sweep. Reuse the shared outcome vocabulary rather than inventing a second one for the test layer."
test_spec:
  - name: test_ge119c1i_incomplete_setup_reports_failure_not_all_passed
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Harness run against a second copy that was created but never built: it reports a failure rather than reporting that every check passed."
  - name: test_ge119c1i_names_the_setup_step_that_did_not_complete
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The failure message names the specific setup step and artifact that did not complete."
  - name: test_ge119c1i_zero_exercised_checks_is_never_a_successful_sweep
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A run in which zero checks were exercised is a failure even though no assertion failed."
  - name: test_ge119c1i_exercised_check_count_present_in_output
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The count of checks actually exercised appears in the harness output on every run, and is compared against the manifest set."
test_rationale: "The vacuous path produces no failing assertion, so the only thing that can detect it is a positive assertion on the exercised count — reasoning about the code cannot substitute, and neither can a stubbed counter, because the failure modes of real infrastructure setup are what is being caught. The setup must therefore be genuinely incomplete, not simulated."
