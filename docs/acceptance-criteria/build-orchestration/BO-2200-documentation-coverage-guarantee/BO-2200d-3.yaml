it_requirements: |
  Author a C4/mermaid sequence diagram of the doc-required ticket phase flow:
  coder -> test-runner -> documentation-expert -> documentation-verifier -> commit, showing
  the verifier's status: ok (advance to commit) and status: blocker (halt before commit)
  branches. This AC satisfies the sequence-diagram documentation_trigger declared on the
  BO-2200b and BO-2200d parent L1s (S7b documentation gate). Cross-link the diagram from the
  build-orchestration and doc-compliance component docs.
