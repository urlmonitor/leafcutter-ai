test_rationale: 'A new reference page, three guides that point to it and a one-line field
  row are prose for people; nothing in them executes. What verifies them: check-doc-links
  proves every link from the guides and the field row to the new page, and from the page to
  the TQ-400e-6 entry, resolves; check-doc-length''s growth ratchet refuses a commit in which
  docs/reference/ac-schema.md grows; the page''s two meanings are compared at pull-request
  review with the schema description BO-2500a-8-i writes; and the last clause, a declaration
  written from the page being accepted, rests on BO-2500a-8-i''s commit-time tests and BO-2500a-1-ii''s
  done-gate tests.'
