notes: |
  USER DECISION AT THE BA GATE (Q3, 2026-09-28): YES, add a mechanical backstop.
  TQ-500f-3-iv and TQ-500g-1-vii are prompt-only, so each is only as strong as
  the supervisor's instruction-following. This AC makes skipping either gate
  observable and blocking. It fails closed: a missing, unreadable, stop or
  out-of-date verdict stops the commit.

  PLACEMENT: an L3 under TQ-500g-1 (L3s have no cap), because the commit phase
  is where TQ-500g-1's runs sit. It also guards TQ-500f-3-iv; that relation is
  recorded through depends_on and doc_links, not by a second parent.

  WHY B6. The runner's verdict is about the code it ran against. On /build-epic
  a coder retry after the runs would otherwise commit code nobody ran wrong
  versions against. The red-baseline verdict has no such rule: it is taken
  before the coder, and a later code change is expected.

  B5 IS THE CONTROL. Tickets with no source requirement must still reach
  commit, and a not-applicable record never turns into "verified" (the
  TQ-500f-3-ii K3 rule).

  FOR IT-PO — WHERE THE CHECK RUNS AND WHERE VERDICTS LIVE. The check must run
  in code on the path to every /build-epic commit and must not depend on the
  supervisor choosing to call it. Candidates: build-epic.js before or after
  dispatching the commit phase, the commit agent's precondition, or a
  commit-time hook that reads the ticket's recorded verdicts. Where the two
  prompt ACs leave their verdicts (ticket comments, frontmatter, a per-ticket
  record file) is set by TQ-500f-3-iv / TQ-500g-1-vii's IT-PO pass and must be
  readable by this check. The BA did not read source to pick one.

  TESTABILITY: behavioural. Drive the chosen surface with fixture tickets B1 to
  B6 (for example build-epic.js under the workflow-engine harness, or the hook
  against staged fixture records) and assert which tickets reach commit. A text
  search of the building-epics skill is not a proof (CLAUDE.md, Verify
  Behaviorally, Not by Grep).
