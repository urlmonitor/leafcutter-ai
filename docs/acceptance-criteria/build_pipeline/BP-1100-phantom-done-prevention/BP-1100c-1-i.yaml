criteria: |
  Given an epic whose tickets only modify documentation files (no files_touched entry
  resolves to a file under scripts/ or scripts/workflows/) and all tickets are at
  status: done,
  When the finalization sequence runs for that epic,
  Then the post-epic angle-testing spot-check phase is not required and is not
  dispatched,
  And finalization proceeds through its existing steps unchanged,
  And the absence of the spot-check phase does not block the merge.
