criteria: |
  Given the test-writer "empty-window" row,
  When its report check reads a report,
  Then a report saying "non-NULL", "non-None" or "non-null" (any case,
      with or without backticks around None) passes,
    And the kept re-run 1 report ("exact-count and non-`None`-count guards")
      and the kept re-run 2 report ("exact non-None count") pass,
    And a report that says only "the check counts the values" fails,
    And a report that names "NULL" or "None" only outside a non-NULL phrase,
      such as "returns None when the feed is empty", fails.

  Given the test-writer "presence-is-not-correctness" row,
  When its report check reads a report,
  Then a report saying "known value", "expected value" or "seeded value"
      (any case, including "known expected value") passes,
    And the kept re-run 1 and re-run 2 reports ("exact expected value from the
      feed") pass,
    And a report that says only "the test checks that each symbol has a
      value" fails,
    And a report that says only "the value is present" fails.

  Given every other row in the test-writer and test-runner sets that checks
      report wording,
  When the sets are scored,
  Then each still checks its one term exactly as before, and the recorded
      gold outputs of both sets still pass.

  Given the change is done,
  Then the report_mentions entry on the test-writer assertion-kind reference
      page states how a row lists equivalent wordings, with the empty-window
      passing and failing examples updated,
    And the drift tests that hold the reference entries equal to the kind
      registry and to the quoted template sentences stay green,
    And the produced-tests section of the evals README states the rule in one
      line linking the entry,
    And the empty-window and presence-is-not-correctness parts of the known
      issue "test-writer rows check unrequested report wording" are struck
      with a note naming this AC (the issue is moved to resolved by
      TQ-200d-4-vi, which fixes its last part, or by this AC if it lands last),
    And one changelog entry names this AC and the two widened rows,
    And no glossary term is added except through the glossary-triage flow,
    And the test-writer template is unchanged (user decision 2026-11-02).
depends_on:
