title: "Suggest the new location when a moved symbol can be located"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111b.yaml"
criteria: |
  Given the symbol tier produced a drift verdict for AC-X because the function
    process_order moved out of "src/foo.py"
  And the symbol-analysis tooling locates a single function named process_order
    now residing in "src/orders/foo.py"
  When the traceability reconciliation check finalizes the verdict for AC-X
  Then the drift verdict carries a suggested new location "src/orders/foo.py#process_order"

  Given the symbol tier produced a drift verdict for AC-Y because the function
    charge_card was removed entirely and the symbol-analysis tooling finds no
    function named charge_card anywhere in the staged tree
  When the traceability reconciliation check finalizes the verdict for AC-Y
  Then the drift verdict carries no suggested new location
  And the verdict records the change kind as removed
depends_on:
  - GE-111b
  - GE-111b-2
