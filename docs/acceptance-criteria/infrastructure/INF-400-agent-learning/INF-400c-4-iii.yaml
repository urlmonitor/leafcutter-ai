it_requirements:
  - "The drive-telemetry emitter's existing record shape is pinned by INF-400g-2 and must not change to accommodate the split"
  - "The harvester must not be given a fallback that reads the telemetry sink when its own sink is absent — an absent sink reports zero records, it does not widen the search. The no-work outcome that fallback would otherwise be papering over is specified by INF-400c-4-iv."
  - "DO NOT LOOK FOR TELEMETRY RECORDS TO LEAVE BEHIND — THERE ARE NONE YET. INF-400g-2 (emit_event.py) is work_status todo and no record of the event_type/ticket_path/agent_name/payload shape has ever been written to debugging/logs/agent_telemetry.jsonl. A builder who reads the separation as 'move the knowledge records out of a mixed file' will find nothing to separate and may conclude the AC is vacuous. It is not: the separation is achieved on the PRODUCER side by INF-400c-4-i repointing the four emit surfaces, and this AC's job is that the reader never reaches across afterwards. The operational stream is not touched at all."
  - "'EVERY EXISTING READER RETURNS IDENTICAL RESULTS' IS NOT VACUOUS, but it is not about the drive-telemetry aggregator either. The readers that exist are ADR-011's named consumers (retrospective-agent, feedback-analyst) and, once built, INF-700b-3's capture-health report — which explicitly reads the mixed stream and is required to skip lines it does not recognise. That report is where filtering the shared file lives; it does not live here, because the knowledge reader never opens the shared file."
  - "DO NOT BUILD IT_REQUIREMENTS ON A MIXING THAT HAS NOT HAPPENED. INF-400g-2's telemetry emitter has never run, so debugging/logs/agent_telemetry.jsonl is today a knowledge-only file with debris in it, not a mixed stream. The load-bearing arguments for two streams are the TWO LIFECYCLES (drain-once-and-watermark versus append-and-aggregate-forever) and the THREE NAMED CONSUMERS (ADR-011's retrospective-agent and feedback-analyst, plus INF-700b-3's capture-health report). Anyone who argues the separation from present-day mixing will find the argument collapses on inspection and may reopen the settlement on a false premise."
  - "THE NO-OTHER-FILE CLAUSE NEEDS A TEST THAT CANNOT PASS ON A FALLBACK THAT IS NEVER TAKEN. Assert it by making the operational stream UNOPENABLE (mode 000, or a directory in its place) while the declared sink is present and populated, and requiring the run to succeed unchanged. A reader that reaches across fails; a reader that does not, passes. An assertion over log lines or over source text proves nothing about which file was opened."
  - "THE ONE-ANCHOR CLAUSE ADDS A SECOND CALL SITE, AND IT IS IN A DIFFERENT SCRIPT FROM THE SINK'S. INF-400c-4 fixes the knowledge sink at build time; this AC's added clause extends the same treatment to the operational stream. Both must read the SAME build-generated declaration rather than two independently correct ones, because two declarations drift and the drift is invisible — each stream resolves fine on its own and only the pairing is wrong. The observable this AC's own descriptor asserts is a FILE COUNT, so the constraint is: exactly one of each stream per install, both named by one artefact, and no code path that constructs either name by joining a bare relative name onto a directory it computed itself."
  - "A THIRD RELATIVE PATH EXISTS AND THIS AC IS THE RECORD THAT NOTICES IT — RAISED, NOT SETTLED HERE. scripts/knowledge/harvest_learnings.py takes --state with a default of debugging/logs/harvest_state.json, a bare relative name, and it sits under the same excluded directory as the two streams this AC separates. It is neither of them, so no clause here or in INF-400c-4 declares it, and it would be left resolving against each process's current directory after both streams stop doing so. That is not a cosmetic asymmetry: the state file is the drain watermark, so one copy per working directory means every fresh working directory re-routes the whole sink and duplicates every learning. Decide its declaration home together with the two streams', not afterwards. Its concurrency behaviour is INF-700a-5-iii's and is not this AC's."
  - "THE ARCHITECTURE-DOCUMENTATION CLAUSE LANDS ON A FOUR-WAY COLLISION SURFACE. docs/architecture/agent_knowledge_system.md is amended by INF-700b-4, INF-700b-5, INF-700c-3 and INF-700a-4, each owning a different section. The paragraph this AC owes is the two-stream rationale (why one sink with a type discriminator was rejected) and it belongs in the section INF-700c-3 opens, referenced not restated. Agree the section boundaries before writing. The assigned agent is python-coder and cannot dispatch documentation-expert; raise the doc paragraph as a hand-off rather than writing a second version of a section another AC owns."
  - "Must handle errors gracefully per the project error handling policy"
