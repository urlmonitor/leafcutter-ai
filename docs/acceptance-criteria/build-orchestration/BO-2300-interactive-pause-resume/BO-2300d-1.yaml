work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run is paused on a pending question with its captured context,
  When a valid answer for the question's declared type is submitted,
  Then the answer is applied according to its type:
    "approve" lets the run proceed past the gate;
    "edit" re-dispatches the paused step carrying the supplied feedback;
    "cancel" stops the run gracefully;
    a priority-choice value sets that priority on the run;
    free-text feedback is carried forward into the paused step,
  And the run resumes from the exact point at which it paused rather than
    restarting from the beginning,
  And any stages the run had already completed before pausing are not repeated.
