  - "Show the real refusal text the check emits for a registered-but-uncalled capability, quoted from a real run rather than paraphrased, and name the two ways forward exactly as BO-2900b-1-i specifies them."
  - "State the invocation rule from BO-2900b-3 in author-facing terms: the connection is the argument the automation passes when it runs the surface as a program, so a capability named in a comment, an operator message or a variable is not connected. Give the concrete shape used in this repository (`python3 <surface> <capability> --flag value` inside the script's executed command)."
  - "Link to the exemption how-to (BO-2900d-4) for the deliberately-undriven case rather than restating the procedure, and link to the refusal-to-action table (BO-2900e-4) rather than reproducing it."
  - "Add a cross-link from docs/how-to/fast-lane-build.md so the guide is reachable from the surface it governs; unreachable documentation does not satisfy the reachability clause."
  - "Register the new page in docs/INDEX.md and satisfy check-doc-frontmatter, check-doc-length and check-doc-index."
