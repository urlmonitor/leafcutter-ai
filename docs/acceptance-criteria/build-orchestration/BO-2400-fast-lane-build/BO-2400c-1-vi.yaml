notes: |
  PRODUCT DECISION, BrainCandy, 2026-08-25 — the split line is DUPLICATE vs ADDITIVE, not
  stable vs volatile. The bundle passes in-band only what the consuming agent does not
  otherwise have. Measured on the run that failed (wf_bd4984e8-438, target BO-2400f-13):
  conventions 38,291 bytes, byte-identical to the workspace CLAUDE.md the harness already
  injects; acs 90,887 bytes, the five AC records the agent can open in its own workspace.
  129,178 of 148,891 bytes were a second copy of something the receiving agent already had.
  What remains — architecture 7,617, high_level 7,105, prior_tests 4,955 — is about 20 KB.

  The stable/volatile line is the right line for a cache, and there is no cache. Verified
  2026-08-25: `cache_control` appears nowhere in templates/, scripts/ or config/;
  `<!-- CACHE_BREAKPOINT -->` is a literal HTML comment inside a prompt string. And the two
  consumers run under different agent types — test-writer and python-coder — so their system
  prompts differ, and a provider prompt cache matching an exact prefix from the start of the
  request could never anchor across them regardless. BO-2400c-2 and BO-2400c.yaml already
  concede this in writing (amended 2026-08-18/19).

  TRADE ACCEPTED DELIBERATELY. The bundle stops being one self-contained artifact, and the
  agents work from the acceptance-criteria store at read time rather than from a frozen
  snapshot. That is safe here specifically because the store lives in the run's own isolated
  workspace, so nothing can change it mid-run — and a frozen copy that has drifted from what
  is on disk is a worse failure than no copy at all.

  REJECTED, and worth keeping rejected: having each agent read the whole bundle from a path.
  It destroys the only observable that distinguishes a lane which assembled its context from
  one which did not, and the engine cannot even confirm the path exists. That is the
  looks-wired-does-nothing failure this whole AC family exists to end. Chunking was also
  rejected: it buys nothing at 20 KB and introduces a lost-or-misordered-chunk failure class
  that did not previously exist.

  THE ARCHITECTURE LAYER IS CURRENTLY COMPOSED BY JUDGEMENT. The bundle prompt names
  docs/architecture/README.md and instructs the agent to substitute "the nearest architecture
  index if that exact path does not exist". That file does not exist — verified 2026-08-25,
  docs/architecture/ holds adrs/, components/, diagrams/ and four loose documents, no README.
  So the layer's content depends on which document an agent picked on the day, and two runs
  aimed at the same target need not produce the same bundle. Pinning it to a path that exists
  is a small change with the largest effect on reproducibility in this record.

  ENRICHMENT NOTE, it-po, 2026-08-25 — THE ORDER THE TWO HALVES LAND IN MATTERS. This record
  and BO-2400c-1-iii are two halves of one fix and are both assigned to python-coder, but
  they touch different languages: -iii is the JavaScript gate and halt wording, this record
  is the Python layer set plus four locations in the same JavaScript file. If -iii lands
  first and alone, its reference-rejection belt will refuse the 149 KB pointer and every real
  run halts — correctly, and uselessly. If this record lands first and alone, the bundle is
  small enough to cross in-band but nothing yet distinguishes a returned locator from
  returned content. Build them together, and keep the two sign-offs separate so a later
  regression is attributable.

  IMPLEMENTER NOTE, 2026-08-26 — WHAT THE ARCHITECTURE PIN RESOLVED TO, AND WHY.
  The pinned path is docs/architecture/diagrams/c1-001-command-map.md, verified present and
  carrying frontmatter diagram_type: context, flight_level: L1 — the system-context diagram,
  which is what "architecture overview" means. The obvious alternative,
  docs/architecture/agent_delivery_workflows.md, is the most RELEVANT document to this lane
