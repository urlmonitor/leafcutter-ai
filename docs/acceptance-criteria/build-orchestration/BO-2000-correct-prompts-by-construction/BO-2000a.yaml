criteria: |
  The full sign-off craft lives in the sign-off block, not in an agent's memory.

  Every phase agent that signs off inherits a complete, portable protocol from the
  shared sign-off block: it resolves its sign-off skill whether it runs in a
  deployed consumer project or in the package source/worktree, updates all parts of
  a sign-off atomically, writes a comment heading the parser can find, degrades
  safely when the feedback sink is unreachable, verifies its own write actually
  landed, and captures learnings afterward. Because this knowledge is in the
  template channel, no agent has to be told these steps in its dispatch prompt.
