criteria: |
  A clear message names the retired requirement and the files still claiming to implement it.

  When a retirement is blocked, the developer is told which requirement was being
  retired, which specific source files still claim to implement it, and what to do
  next — remove the code, or re-point it to the successor — so the fix is obvious
  without forensic investigation.
