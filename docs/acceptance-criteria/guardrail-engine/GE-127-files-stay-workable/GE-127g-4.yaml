it_requirements:
  - "ENRICHMENT DECISION 3 — WHERE THE TEXT LANDS: BOTH, asymmetrically. The substance
    goes in a NEW reference doc under docs/reference/ (suggested
    docs/reference/document-length-standard.md); docs/pre-commit-hooks.md gets a
    one-line pointer to it beside its existing 'docs under line limits' entry."
  - "The reason is measured, not stylistic. docs/pre-commit-hooks.md stands at 292 lines
    against the 300-line limit (measured 2026-10-09) — EIGHT lines of headroom. This
    record requires a statement of: the exclusion mechanism; each declared location; each
    location's stated ground; what a run reports for an unjudged document; the no-edit
    property; that a bound nonetheless applies to each set-aside location, being the size
    beyond which a document there is reported; what standing above that size produces —
    reported, with the commit still completing; that declaring a location set aside
    requires declaring that size as well as its ground, so the bound is mandatory rather
    than optional; and the limit that applies to every document in no declared location.
    That is far more than eight lines, so landing the substance there takes the file across
    its limit and the doc-length gate refuses the very commit that documents the doc-length
    gate. A one-line pointer fits inside eight lines; the substance does not."
  - "THE ENUMERATION ABOVE GREW WITH GE-127g-5's CEILING AND THE CONCLUSION IS UNCHANGED —
    recorded so the line-budget argument is not re-litigated as if it had been made against
    a smaller deliverable. The three ceiling-related statements were added to the list after
    the record's third arm landed; they make the substance larger, not smaller, so the
    conclusion that it cannot fit in eight lines is strengthened rather than affected. The
    complexity band was re-judged at the same time and stays M: the marginal deliverable is
    about a paragraph plus a per-location figure INSIDE a reference doc that was already
    being created, and the file count is unchanged at two — the new doc and the one-line
    pointer. Nothing here approaches a new module or a fourth file."
  - "The new reference doc must carry frontmatter satisfying check_doc_frontmatter's
    docs/** requirements — title, type, status, created, last_updated, components — with
    type: reference and components drawn from docs/components.json. A new document with
    absent or invalid frontmatter is refused at commit time."
  - "The stated ground for each location must be the PROPERTY that earns the exemption —
    regenerated whole, no human author — and must not be reducible to the name of the
    generator that writes it. This is the record's second clause and the enrichment
    decision that makes it checkable: an author with a new generated surface must be able
    to reach the right answer from the text without a discussion."
  - "The grounds published must be the grounds the declaration carries, read from the
    doc_length section of templates/scripts/commit_guardian/commit_guardian.json. Quote
    or paraphrase that source rather than the implementer's summary of it; the text is a
    description of the declaration and must not become a second declaration."
  - "All three declared locations must be listed — docs/agents/cards/, docs/roadmap.md
    and docs/INDEX.md — because listing only the agent-card directory is the stale half
    the record's notes warn about, and docs/INDEX.md at 289 lines against 300 is the live
    demonstration that a second and third generated surface already exist."
  - "The text must state the limits as they are configured — 300 lines for a document,
    400 for a decision record, 25 sections — and must not restate the ratchet rule as if
    it were this record's subject; one sentence that an already-over document is judged
    against its own previous size is enough to make the reported figures interpretable."
  - "HOW THE PER-LOCATION CEILINGS ARE TO BE EXPRESSED, since the authored limits above are
    global and the ceilings are not. The text MUST state THAT a bound applies to each
    set-aside location and that declaring a location requires declaring its size — those
    two are what the criteria ask for. It must NOT present the bound as a single global
    number: the ceiling is per entry and the values differ per location, so one figure
    offered for all three would be false for at least two of them. Publishing each
    location's actual figure beside that location's ground is PERMITTED and recommended —
    an author who must open a configuration file to learn the number has only half the
    answer this record exists to give them — but it is not required by any clause, so a
    deliverable that states the bound qualitatively per location is complete. If a figure
    IS published it must be read from the doc_length declaration in
    templates/scripts/commit_guardian/commit_guardian.json, never restated from the
    implementer's summary or from this record."
  - "THE ABOVE-CEILING OUTCOME MUST BE STATED IN THE DIRECTION THE MECHANISM ACTUALLY
    WORKS: a document above its location's ceiling is REPORTED and the commit STILL
    COMPLETES. Do not write it as a refusal, a block, or a failure, and do not leave the
    outcome implicit for a reader to assume. The whole point of the set-aside class is that
    nobody is refused for length they did not write, so an inverted statement here tells an
    author the opposite of the truth about the one behaviour they came to the page for.
    GE-127g-5 owns the mechanism's own wording — read it rather than inventing a second
    account of it."
  - "Do not add a parity assertion, a published-versus-configured check, or any claim that
    the text and the configuration are mechanically held in step. GE-127d owns honesty and
    the record's own doc_links fence this off explicitly: there is no document-side parity
    gate today, that gap is real, and specifying it here by implication would file it in
    the wrong record."
  - "No diagram and no how-to is required. The obligation is that the information exists
    on a published surface an author would reach."
