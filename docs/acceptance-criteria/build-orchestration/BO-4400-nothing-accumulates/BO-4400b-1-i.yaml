criteria: |
  Given two workspaces "ws-a" and "ws-b" and the project's main copy, each with its own
    stored look-up of the requirements store, its own Python environment in the user's
    shared Poetry environments folder and its own web development server cache, where
    "ws-a" and "ws-b" have names sharing the prefix "ws-",
  When "ws-a" is cleared through the one shared clearing door,
  Then every one of "ws-b"'s and the main copy's items exists afterwards and is
    byte-identical to its state before,
  And "ws-b" still carries the verdict it carried before,
  And the door's answer lists no item belonging to "ws-b" or to the main copy.
