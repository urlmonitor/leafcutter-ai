roadmap_phase: phase_1
risk_surface: safety
criteria: |
  Work finishes, space comes back -- nothing piles up behind you.

  Every run that does work on your behalf tidies up after itself as soon as its
  work has landed on the shared main line -- straight away if it had nothing to
  deliver, and without anyone stepping in if the work lands after the run has
  ended -- not days later when someone remembers to run a separate wrap-up step.
  Its workspace, its supporting material and its temporary files all go with it,
  leaving nothing behind anywhere on the machine, while work that has not yet been
  sent to the team is always kept and work that did reach the team stays safe with
  the team, so nothing is ever lost. Whatever does slip through is swept up
  routinely, and you are warned long before space runs out.
