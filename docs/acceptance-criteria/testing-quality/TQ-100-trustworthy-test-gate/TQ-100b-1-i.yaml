title: "When its AC flips to done, the same test transitions from informational to enforced with no test edit"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given a failing test tagged "# covers: <AC-ID>" whose AC begins with
    work_status not-done, observed in a first run to be reported informationally
    (non-blocking),
  When the AC's work_status is changed to done (for example because its feature
    merged) and the suite is run again, with no change made to the test file,
  Then in the second run the same test is enforced and its failure makes the
    overall run outcome non-passing
  And the transition from informational to enforced is driven solely by the AC's
    work_status change, not by any edit to the test or any manual switch.
depends_on:
