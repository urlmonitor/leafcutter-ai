notes: |
  Authored as an L3 because it is the failure mode a naive reading of INF-500d-1
  produces: "derive the writers from the roster" implemented bluntly makes every
  roster agent a permitted writer of every category, destroying the reviewer-class
  and supervisor-only restrictions that the category vocabulary was designed around
  (Master_Plan Key Design Decision #2, recorded in the file's DECISION HISTORY).
  The restriction axis (which CLASS of writer) is orthogonal to the staleness axis
  (which NAMES exist) and must survive the fix.

  WHY THESE THREE ARE EXEMPT FROM DERIVATION RATHER THAN DERIVED ON A CLASS FIELD.
  An earlier draft of this AC assumed the restrictions could be re-expressed as a
  derived "reviewer-class" / "supervisor-class" / "guard-class" predicate. They
  cannot, and an implementer who tries will ship something wrong:

    - "Reviewer-class" is NOT a roster field. It exists only as a two-line header
      comment in the permitted-writer configuration file naming pr-reviewer and
      architect-review. Nothing machine-readable backs it.
    - The roster's `category` field cannot substitute for it. Measured on
      2026-08-13: sql-coder and sql-query both carry category: supervisor (so a
      supervisor-only derivation would admit two coders to subagent-quality, and
      would NOT admit ticket-supervisor's actual peers by that field alone);
      pr-reviewer carries category: implementation while architect-review carries
      category: planning, so no single category value selects the reviewer pair and
      any value that includes pr-reviewer also admits every other implementation
      agent.
    - The guard-only category's writer is a literal non-agent identity that is
      absent from the roster entirely, so no roster-derived predicate can produce it.

  The three lists are two, two and one entry long, they encode a deliberate design
  decision rather than an enumeration of what happened to exist, and — unlike the
  general-purpose lists, amended for staleness on 2026-06-03, 2026-06-08 and
  2026-07-17 — they have never gone stale. Keeping them literal is the correct
  trade, and the second scenario supplies the guard that stops them going stale
  silently in future.

  OBSERVED, NOT SPECIFIED HERE. On 2026-08-13 the submission path skips writer
  validation entirely for submissions that declare a non-agent source, so the
  guard-only category's restriction is today enforced by convention rather than by
  the check. Recorded for the IT PO's awareness; closing that bypass is a separate
  defect and is deliberately out of scope for this AC.
