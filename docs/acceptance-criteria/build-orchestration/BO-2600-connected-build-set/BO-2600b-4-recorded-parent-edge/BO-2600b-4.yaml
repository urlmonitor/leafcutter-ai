id: BO-2600b-4
components:
  - build_orchestration
title: "A prerequisite that records the criterion as its child is treated as its structural parent, even when the ids do not show the link"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an acceptance-criterion store containing a parent criterion P-590 whose
    covered_by lists seven not-done children [P-510, P-511, P-512, P-513, P-514, P-515, P-516],
    where no child id has the shape of a P-590 descendant (so the parent cannot be
    inferred from the child's id),
  And P-512 lists P-590 in its depends_on and has no other prerequisites and no children,
  And P-515 is assigned to a different implementing agent than P-512,
  When the connected build set for P-512 is resolved with structural-parent
    prerequisites excluded,
  Then P-590 is recognised as P-512's structural parent because P-590's covered_by
    lists P-512, and P-590 is neither added to the set nor expanded,
  And the resolved set is exactly [P-512],
  And none of P-510, P-511, P-513, P-514, P-515, P-516 appear in the set, and nothing
    reachable only through P-590's own prerequisites appears in the set,
  And a parent whose id shape does show the link (e.g. BO-2600b for BO-2600b-4) is still
    recognised and excluded exactly as before: the recorded-edge rule is added to the
    id-shape rule, not substituted for it.
depends_on: [BO-2600b, BO-2600a-1]
doc_links:
  - path: scripts/build_orchestration/fast_lane.py
    relationship: modifies
    status: exists
    relevance: "resolve_connected_build_set's depends_on walk is where the structural-parent test is applied; today it compares a dep only against derive_parent_id(node). The deployed mirror under .leafcutter/scripts/ must stay in step."
  - path: scripts/ac_store/ac_parent_id.py
    relationship: related
    status: exists
    relevance: "derive_parent_id returns None for ids like UXP-510 whose parent link exists only as the parent's covered_by; this AC adds the recorded edge alongside it."
  - path: docs/reference/ac-id-hierarchy.md
    relationship: related
    status: exists
    relevance: "Direct-children scope rule for covered_by: the reason a covered_by listing identifies the immediate structural parent."
  - path: docs/acceptance-criteria/ux-prototyping/UXP-500-product-truth-generation/UXP-590.yaml
    relationship: related
    status: exists
    relevance: "Real-store case: /fast-lane-build UXP-512 resolved to all 13 UXP-590 descendants (including frontend-coder UXP-515) and refused. Use as the shape of the fixture, not as a live-store test dependency."
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/architecture/diagrams/c2-fast-lane-build-path-components.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/build_orchestration/fast_lane.py
  n_location_rule: "1 (resolve_connected_build_set's structural-parent test; scope: parent-edge recognition in resolve_connected_build_set's depends_on walk (single predicate change))"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py"
  policy:
    - "Structural-parent recognition = id-shape rule (derive_parent_id) OR recorded edge (the dep's covered_by contains the node id); the recorded edge is added to, never substituted for, the id-shape rule"
    - "Recorded-edge check reads the dep's covered_by from the store record already loaded for the walk; it must not add a second store scan per dependency (resolution stays linear in the number of ACs reached)"
    - "Tolerant of absent, null, or non-list covered_by and of non-AC entries (test-file paths, ticket paths): such entries never match and never raise"
    - "Default exclude_structural_parent=False stays byte-identical in membership and order for every existing caller (BO-2600a-1 invariant)"
    - "Edit the tracked source scripts/build_orchestration/fast_lane.py only; the deployed .leafcutter/scripts mirror is regenerated by scripts/build.py, never hand-edited"
test_spec:
  - name: test_recorded_covered_by_parent_excluded
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "P-590 whose covered_by lists P-512 (non-derivable id shape) is neither added nor expanded when resolving P-512 with exclude_structural_parent=True"
  - name: test_recorded_parent_resolves_to_exactly_target
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "Resolved set for P-512 is exactly [P-512]; none of P-510/511/513/514/515/516 and nothing reachable only via P-590's own depends_on appear"
  - name: test_id_shape_parent_still_excluded
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "A parent derivable by derive_parent_id (BO-2600b for BO-2600b-4) is still excluded exactly as before - recorded-edge rule is additive"
delivers_to: null
expects_from:
  ac_id: BO-2600a-1
  contract: "resolve_connected_build_set accepts exclude_structural_parent; when True, deps identified as the node's structural parent are skipped in the depends_on walk while the subtree union is untouched."
