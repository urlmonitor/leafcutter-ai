  - ac_id: GE-129a-5
    contract: >-
      The declaration's shape and the step that produces it — the three identity fields, the
      negative_control block in config/verification_flow.schema.json's own names, and the file it
      is written to — which is what the written instructions GE-129a-5 owns have to describe and
      what a walkthrough following them has to produce. Added at enrichment: GE-129a-5 already
      declared this expectation from its side and the producing side was missing.
expects_from:
  - ac_id: GE-129a-1
    contract: >-
      The identity of each subject — the kind of tool call, the tools its group applies to,
      and the guard the entry resolves to — read from the surface at the time of the run.
