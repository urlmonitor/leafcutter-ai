id: AR-300c-3-i
title: "A declared ability that resolves to no installed ability is reported naming the agent, the ability, and where it was looked for"
component: agent-registry
components:
  - agent_registry
  - skill_registry
  - skills_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an agent whose declaration grants an ability that matches no ability
    available to the project -- neither one shipped with the package nor one
    added by the project itself,
  When the build runs,
  Then it reports a failure naming the agent and the unresolvable ability,
    And the report distinguishes 'not shipped with the package' from 'not found
      among the project's own', so the reader knows which of the two to add,
    And every declared ability of every agent is resolved, with the count
      reported, so an agent whose declaration was not reached is not read as an
      agent with nothing wrong,
    And an ability that does resolve is not reported,
  So a grant cannot name something that does not exist, and an agent is never
    told it holds an ability nothing can answer to.
depends_on:
  - AR-300c-3
