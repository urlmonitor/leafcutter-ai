notes: |
  Fidelity gap, not a change of intent: BO-2400a-4 already says the gate "confirms all of
  them pass", and the fast-lane how-to already says XFAIL does not count as passing. In
  the BO-2600b-4 run, 3 of 13 new tests failed on wrong fixtures, the enforcement plugin
  downgraded them to xfail because the AC was not yet done, the green gate passed, and only
  mark_done's stale-todo guard caught the failure, at the commit phase, after the full loop.
  The parent's wording is not changed. Its work_status (done) now overstates the shipped
  gate, so the store owner should reset it.
