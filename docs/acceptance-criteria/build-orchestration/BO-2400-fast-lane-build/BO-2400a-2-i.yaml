title: "Selection truncates a batch that exceeds the cohesion cap"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the number of ready cohesive ACs available exceeds the configured cohesion
    cap M,
  When the fast-lane selection script builds the batch,
  Then the selected batch contains at most M ACs
  And the ACs left over are not included in this batch (they remain ready for a
    subsequent loop).
depends_on: [BO-2400a-2]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    cohesion_cap:
      type: integer
      minimum: 1
      description: "Maximum number of ACs a single fast-lane batch may contain (M). Read from config; not hard-coded."
  reference_file_path: "scripts/ac_store/scan_ac_store.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "The cohesion cap M must be read from a config source, not hard-coded, so it can be tuned without a code change."
    - "When available cohesive ACs exceed M, the batch is truncated to at most M ids and the remainder are left untouched in the ready set for a subsequent loop (no dropped or silently consumed ACs)."
    - "Truncation must respect the same deterministic ordering as BO-2400a-2, so the first M in the stable order are selected reproducibly."
delivers_to: null
