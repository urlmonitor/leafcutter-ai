test_spec:
  - name: test_root_relative_target_inside_docs_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Temp git repo with the ADR file staged and a staged docs/INDEX.md whose ADR target is docs/architecture/adrs/ADR-001-self-hosting-boundary.md; asserts refusal naming docs/INDEX.md, the line number, the target as written, the resolved docs/docs/... path and the regenerate command."
  - name: test_target_to_page_deleted_in_same_commit_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Stages deletion of a page while the staged map still links it; asserts refusal."
  - name: test_all_targets_resolve_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "A staged map whose targets are all relative to docs/ and exist in the index exits 0."
  - name: test_case_mismatched_target_is_refused_on_every_host
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Target glossary.MD while the staged file is glossary.md; asserts refusal, including on a case-insensitive file system."
test_rationale: "Resolution must be judged against the commit being made, so the tests use a real temp git index with staged adds and deletions; a working-tree test would miss the same-commit deletion and the case-mismatch case would pass on Windows."
notes: |
  ORDERING HAZARD: must not ship before KM-300a-2. As of 2026-09-25 every link
  target in the map is project-root-relative inside docs/, so every entry is
  unresolvable and this check would refuse every commit.
  The case-sensitivity clause is deliberate: a case-insensitive existence test
  on Windows would pass a link that is broken on the code host — exactly the
  "works only on the machine that produced it" failure KM-300c targets.
