criteria: |
  Given the ac-supervisor is implemented
    and a single leaf AC exists with readiness: approved and work_status: todo,
  When the ac-supervisor is invoked on that AC,
  Then it dispatches test-writer, coder, test-runner, pr-reviewer, and commit
    in TDD order (test-writer before coder),
  And the AC's work_status transitions from todo to in_progress to done,
  And signoff entries appear on the AC YAML for each dispatched agent,
  And each signoff entry contains an agent id, timestamp, and artifact reference.
