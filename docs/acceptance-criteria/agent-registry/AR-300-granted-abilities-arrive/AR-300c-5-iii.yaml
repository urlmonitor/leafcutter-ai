id: AR-300c-5-iii
title: "A declared sub-agent with no deployable definition stops the build, naming the agent, the sub-agent and where it was looked for"
component: agent-registry
components:
  - agent_registry
  - build_pipeline
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an agent whose declaration permits a sub-agent for which no agent
    definition is available to the project -- neither one shipped with the
    package nor one added by the project itself -- as is true today of
    architect-review, which is permitted architect-review-deep,
  When the build runs,
  Then the build reports failure and does not report success, naming the
    declaring agent and the unresolvable sub-agent,
    And the report says where the sub-agent was looked for, distinguishing
      "not shipped with the package" from "not found among the project's own
      agents", so the reader knows which of the two to add,
    And a central registry entry for the sub-agent with no definition behind it
      does not count as the sub-agent existing,
    And an "every ticket-phase agent" entry that resolves to no agents at all is
      reported the same way, rather than delivering an empty list,
    And every declared sub-agent of every agent is resolved, with the count
      reported, and a sub-agent that does resolve is not reported,
  So an agent is never told it may call on a specialist that will never answer.
depends_on:
  - AR-300c-5
