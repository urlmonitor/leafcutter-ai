estimated_complexity: L
it_requirements:
- Estimate each executable work unit including its inherited implementation obligations; an S/M negative scenario cannot conceal an unimplemented L/XL parent behavior. Reuse complete target-branch behavior only with evidence.
- Resolve canonical hierarchy deterministically from explicit parent/ID contract and preserve all inherited
  L1/L2 positive obligations when selecting executable L3 leaves.
- The candidate must retain the complete required scope, completed context and source revisions; never
  equate only negative L3 child tests with parent behavior fulfilled.
- Whole-feature admissibility is a separate background-lane result and must not mutate ordinary scanner
  rules or AC work_status.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
