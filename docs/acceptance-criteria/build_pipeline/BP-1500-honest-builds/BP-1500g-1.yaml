notes: |
  THE DEFAULT PATH IS THE SUBJECT, AND THAT IS THE WHOLE POINT. An implementer
  who fixes only the opt-in destructive mode has fixed the mode nobody runs by
  accident and left the one everybody runs. The reporter's reproduction used no
  flags at all. BP-1500g-1-i carries the opt-in mode as the second direction; do
  not treat it as the primary case.

  NO PLACEMENT IS PRESCRIBED HERE, DELIBERATELY. The Given says only "placed so
  that the tool which runs capabilities discovers it" -- it names no directory,
  no configuration key and no ownership convention. That is the L1's explicit
  scope boundary and it is repeated here because this AC is the one most likely
  to have a directory written into it during enrichment. Today there is no safe
  placement in either direction, and choosing one may need an ADR. Choosing it is
  the implementer's decision to make and record, not a fact to be copied out of
  this file.

  "STILL RUNS", NOT ONLY "STILL PRESENT". The second Then clause is load-bearing
  and is the reason the first is not sufficient on its own. A repair that leaves
  the adopter's files on disk somewhere the tool no longer looks satisfies a
  presence check and delivers nothing. Byte-identical presence plus discovery by
  name is the pair that makes the outcome real.

  TEST DESCRIPTOR OWED TO THIS AC -- FOR THE IT PO, DO NOT LET IT EVAPORATE.
  BP-1500b-4's test_spec entry

    test_bp_1500b_4_a_default_no_flag_build_does_not_delete_a_real_adopter_owned_skills_directory

  was written against BP-1500b-4's fourth Then clause read as a property of the
  rebuild, and the owner has now decided the repair lives here. On 2026-09-08 that
  entry was REDIRECTED in place rather than deleted: it now declares covers:
  [BP-1500g-1] and its description says so. The IT PO authoring this AC's test
  contract should carry an equivalent descriptor here under its own name. This BA
  run deliberately authored no test_spec -- the test contract is the IT PO's
  jurisdiction on this run by explicit instruction -- so the redirect is the only
  thing holding that entry to this record until then.

  WHY THIS IS NOT COVERED BY BP-1500b-4, IN ONE LINE, SO IT IS NOT RE-LITIGATED:
  that AC is gated behind an orphan sweep that does not exist yet, and its three
  Given categories all sit outside any directory the package claims wholesale.
  The full ruling is in BP-1500g's notes.
