id: BP-1100e-1-viii
title: "A docs-only ticket that declares work as out of scope is answered on that declaration, not on an empty one"
component: build-pipeline
components:
  - build_pipeline
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a ticket whose declared files_touched are documentation-only or config-only
    And whose out_of_scope explicitly names the source files changed by other tickets
      on the same branch
  When the pre-done reconciliation runs
  Then those named files are treated as declared
  And the ticket is not flagged for them.

  Given the same ticket
  When a source file is changed that appears in neither files_touched nor out_of_scope
  Then it is still flagged, exactly as for any other ticket.

  Given a docs-only ticket that declares nothing out of scope
    And whose actual changes touch only its own documentation or config files
  When the reconciliation runs
  Then it is not flagged, as BP-1100e-1-iii already requires.

  Given a docs-only ticket that declares nothing out of scope
    And a source file has changed
  Then it is flagged, because an empty declaration remains an empty declaration.
