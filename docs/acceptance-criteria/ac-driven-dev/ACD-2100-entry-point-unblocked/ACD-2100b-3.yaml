assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "Fail closed in both cases: both runs stop. This L1 refines the reporting of the gate introduced by BO-1500f-1 (work_status: done) and must not supersede it -- a child that relaxes either halt to a warning is the wrong fix."
  - "Only the denial outcome may name a permission setting. Naming it on the absence outcome sends the operator to audit an agent entry that does not exist and is the defect this record removes."
  - "Both reports must name the agent the check was looking for, taken from the value the check actually resolved rather than a literal in the message, so a change to which agent creates the worktree cannot make the report lie."
  - "The distinction must be established from the registry contents -- 'entry present' versus 'entry present and permission withheld' -- and not from a default applied when the lookup returns nothing."
  - "Must satisfy the repository error-handling policy."
  - "The denial case does not exist in the real registry (the worktree-creation agent carries permission today), so it must be constructible from a registry supplied to the run rather than requiring the project's own file to be edited."
test_spec:
  - name: test_absent_agent_and_denied_agent_produce_different_reports
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Two runs differing only in their registry -- one omitting the worktree-creation
      agent, one listing it with repository-command permission withheld -- produce
      reports that differ from each other.
  - name: test_absent_agent_report_names_the_agent_and_says_it_was_not_found
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The first run's report contains the agent id the check resolved and states the
      agent was not found in the registry, and it does not name a permission setting.
  - name: test_only_the_denied_report_names_the_permission_setting
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The second run's report states the agent is listed and not permitted and names
      the permission setting; the first run's report names no permission setting --
      asserted as a pair, because either half alone passes with one shared message.
  - name: test_both_outcomes_are_reached_through_the_workflow_entry_point
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner to its startup charter check, once per registry"
    description: >-
      Both reports are produced by driving the real workflow with the two registries
      and observing the recorded outcome, not by calling the lookup directly.
test_rationale: >-
  Split across two records, each half is satisfiable by one shared message and the
  defect survives; held together, the third Then clause is unsatisfiable without
  actually telling the two apart. That is why the pair assertion, not either message on
  its own, is the test that matters. The denial case has to be constructed -- the real
  registry gives the worktree-creation agent permission at agent_registry.json:1368 --
  and it is worth constructing because it is the one verdict the current code states
  correctly, so a change that makes the other three honest must be shown not to lose it.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100b-3-i
    contract: "A lookup over the registry's agent entries whose result distinguishes three states -- entry present and permitted, entry present and denied, entry absent -- so that a fourth state (the entries collection is not there at all) is representable rather than silently folded into 'absent'."
  - agent: python-coder
    ac_id: ACD-2100b-4
    contract: "The absence outcome and the denial outcome as two distinct recorded halts, both of which the fail-closed guard must observe stopping the run."
  - agent: documentation-expert
    ac_id: ACD-2100d-4
    contract: "The final wording distinction between the absence report and the denial report, which the reference page states so a reader can map a message they received to a remedy."
expects_from: null
