id: TQ-600a-12-i
components:
  - testing_quality
  - build_pipeline
title: "A seed that is missing, incomplete, or built under a different configuration is refused out loud"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the private-copy route configured with a seed directory,
  And the one outcome worse than the current slowness, which is handing a caller a
    tree that looks like a finished layout and is not,
  When the seed directory is absent; or present but lacking the completeness record
    the route already requires of any layout before it hands one back; or present and
    complete but produced under a configuration that differs from the one this run
    would use,
  Then the route raises the layout-production error it already defines for a failed
    production, and the message states which of the three conditions it found and
    which seed path it inspected,
  And it does not quietly fall back to copying the source tree and building, because
    a silent fallback turns a misconfiguration into a mysterious 49-second pause
    nobody traces,
  And it does not hand back the suspect root under any of the three conditions,
  And each of the three conditions has a check of its own that is shown to go red on
    an instance of that condition and green on a sound seed, so no condition is
    covered only by the other two.
