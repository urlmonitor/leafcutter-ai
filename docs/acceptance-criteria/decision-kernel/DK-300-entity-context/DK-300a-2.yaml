estimated_complexity: L
it_requirements:
  - "Only trusted Python AST declaration parsing may supply symbols; source modules must never be imported or executed during build or recognition."
  - "Qualified identity must support path.py::Class.method and module-qualified declaration references; signatures have at most entity_context.max_meaning_chars characters (default 300)."
  - "Purpose is absent when no authored docstring exists; retained purpose is bounded to the first sentence and current meaning limit."
test_required: true
test_spec:
  - name: "test_python_declaration_cards_have_qualified_identity_and_bounded_signature"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_python_declaration_cards_have_qualified_identity_and_bounded_signature: Index functions, classes and methods, resolve both supported qualifications and assert exact qualified identity and bounded declaration signature."
  - name: "test_symbol_purpose_uses_only_first_authored_sentence"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_symbol_purpose_uses_only_first_authored_sentence: A multiline docstring contributes only the first sentence; a declaration without a docstring gains no invented purpose."
  - name: "test_symbol_indexing_never_executes_or_emits_bodies"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_symbol_indexing_never_executes_or_emits_bodies: Index a file whose top-level execution would create a sentinel and assert no execution, implementation-body text, callers or relation expansion."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
