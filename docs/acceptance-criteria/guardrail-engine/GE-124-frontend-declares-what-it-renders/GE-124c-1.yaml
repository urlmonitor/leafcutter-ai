change_target: code
risk_surface: contract_boundary
notes: |
  VERDICT 1 of the four the PO requires the commit tier to keep apart, and the
  one that carries the BLOCK-IS-THE-DEFAULT guarantee. Mirrors GE-117d-1's
  house shape deliberately — same fail-closed default, same enumerate-all-
  offenders rule, no new enforcement idiom.

  "Block by default" is a user-confirmed decision: do not relax it to an
  advisory rollout. The staged-adoption path is the per-path warn opt-in in
  GE-124d-1, which requires someone to name the path.

  Enumerate-all matters more here than it looks: a first-offender-only report on
  a branch that adds six components produces six commit attempts, and six
  blocked commits in a row is how a guardrail gets disabled.

  IT-PO ENRICHMENT NOTE (2026-08-25). This is where the commit tier physically
  comes into existence, so it carries the registration and deployment
  obligations for the whole tier: the hook file in both locations, the
  commit_guardian.json config section and manifest entry, and the deploy_map
  entry for the shared reader every sibling AC also imports.
