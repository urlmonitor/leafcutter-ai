notes: |
  Scope note from the IT PO: the two descriptors are derived strictly from this
  AC's criteria (basename extraction, depth-agnostic). The Windows-separator
  clause in it_requirements is NOT covered by them — the shipped extraction uses
  epicPath.split("/").pop(), which does not split on a backslash. Authoring a
  backslash descriptor here would encode a behaviour the criteria do not state
  and that the implementation does not have; the gap is raised for BA/PO
  reconciliation rather than silently tested or silently dropped.
