agent_id: sql-query
template_file: templates/agents/sql-query.md
proposed_frontmatter:
  pre_flight_reads:
  - source: ticket_path
    required: true
  - source: .agents/agents/<name>/PROJECT_CONTEXT.md
    required: false
    condition: when present
  inputs: []
  outputs:
  - name: completion_report
    type: structured_response
    description: Structured completion payload or sign-off comment
  mutates:
  - name: none
    surface: none
    description: Read-only agent — no filesystem mutations
  behavioral_patterns:
  - name: Conditional Behavior
    trigger: the file is absent
    behavior: 'log one debug line:'
    related_agent: null
  - name: Conditional Behavior
    trigger: any of these are ambiguous
    behavior: ask before writing
    related_agent: null
proposed_registry:
  category: supervisor
  skills_invoked:
  - skill_id: sql-query-past-queries
    mode: always
  - skill_id: signoff
    mode: conditional
  knowledge_channels:
  - channel: 1
    source: template description field
  - channel: 4
    source: pre-flight file reads
  - channel: 6
    source: project files read during execution
  - channel: 7
    source: bash command output (git, build, tests)
  - channel: 8
    source: PROJECT_CONTEXT.md
