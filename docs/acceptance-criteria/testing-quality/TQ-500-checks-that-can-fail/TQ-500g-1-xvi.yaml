id: TQ-500g-1-xvi
components:
  - testing_quality
  - build_orchestration
title: "An operator command clears one work's pins, all of them or one name's, and nothing else clears a pin"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work 07_TICKET-refresh-gate holds pins for
    "drop the retry_due condition" and
    "propagation that reaches only one level deep",
    and the work 08_TICKET-refresh-retry holds a pin for
    "drop the retry_due condition",
  When the operator runs the reset command for 07_TICKET-refresh-gate and the
    name "propagation that reaches only one level deep",
  Then only that pin of 07_TICKET-refresh-gate is cleared; its pin for
      "drop the retry_due condition" and the pin of 08_TICKET-refresh-retry
      are unchanged,
    And the command reports the work, the name and the identity of the
      alteration it cleared,
    And the next gate run for 07_TICKET-refresh-gate sends
      "propagation that reaches only one level deep" to the preparer, and its
      row says "re-prepared: pin reset by the operator",
    And when the operator instead runs the reset command for
      07_TICKET-refresh-gate with no name, every pin of that work is cleared,
      and the pin of 08_TICKET-refresh-retry is unchanged,
    And a reset naming a name the work holds no pin for clears nothing and
      says, by name, that there was no pin,
    And a reset clears no manifest kept from an earlier run
      (TQ-500g-1-xv),
    And no other step clears a pin: not a new workflow run, not a resumed
      drive, not the put-back after a cut-short run, not a change to the
      code, and not the preparation of other names; a pin is otherwise only
      replaced by a re-preparation that passed every check (TQ-500g-1-xii,
      TQ-500g-1-xiii).
depends_on:
