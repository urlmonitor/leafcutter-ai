assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "cmd_create_only builds its payload's branch value as f\"feature/{branch_name}\" -- a restatement of the request, not an observation. cmd_setup_ticket does the same with f\"feature/{slug}\". Both must be replaced by a read of the repository. cmd_create_fastlane_worktree already demonstrates the discipline for base_commit (read back from the created workspace's HEAD, BO-2400f-13-iv); the same read-back must govern branch name and kind on every creation path."
  - "The read must be an INDEPENDENT observation of the repository, not a value the creation step cached on its way past. A report derived from the request and then compared against itself is vacuous -- the comparison and the report must not share a source."
  - "The read-back and its comparison apply to the reconnect/reuse path too. That path is where the existing branch can differ most from the request, and it is the path that currently reports a payload assembled entirely from arguments."
  - "On a mismatch both values must be carried as separate machine-readable fields (requested, actual) and the run must report FAILURE, not success with a warning attached."
  - "BP-600a-2 instructs callers to read the branch name out of this tool's reported output. That instruction is sound only once the output is derived from the artefact, and must not be cited as already covering this record."
  - "Template and deployed copies change together and are verified in parity via the build.py round-trip (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "A creation report whose branch name and kind are read from the repository after creation, carrying the requested and the actual value as separate fields when they differ. BO-4100d-3-i narrows it: when the difference is a sanitisation, the report states both values and succeeds instead of failing."
expects_from:
  ac_id: BO-4100d-1
  contract: "A created branch whose kind is encoded in the branch name and is therefore readable back off the repository. This record reads that branch and compares it against the request; the comparison is impossible if the kind lives only in a side record."
test_required: true
test_spec:
  - name: test_the_reported_branch_name_and_kind_are_read_from_the_branch_that_exists
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The fixture is constructed so the branch that exists DIFFERS from the request -- via the reconnect path onto a pre-existing differently-named branch. The report must state what exists. A report built by string-formatting the request passes only when request and artefact coincide, so the fixture deliberately makes them diverge."
  - name: test_creation_reports_failure_when_the_existing_branch_differs_from_the_request
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The outcome is a failure, not a success carrying a warning, and both the requested value and the existing value are present as separate fields."
  - name: test_no_success_report_names_a_branch_that_is_absent_from_the_branch_list
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "For every creation path and every supported kind, the branch named in a success payload is looked up in git branch --list; absence is a failure of the test. This is the assertion that would have caught the original defect from the caller's side."
  - name: test_the_comparison_and_the_report_do_not_share_a_source
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The branch is altered in the repository after creation and before reporting; the reported value must change with it. An implementation that caches the value during creation and both reports and compares that cached copy passes the other three tests and fails here."
test_rationale: |
  This is the same defect shape as BO-4100a-2 -- a verdict derived from the input rather
  than the artefact -- so it has the same trap: every assertion is vacuous when the request
  and the artefact happen to agree, which is the normal case. Each test therefore requires
  a fixture in which they deliberately DISAGREE, and the reconnect path is the natural way
  to build one because it is the path where an existing branch can legitimately differ from
  the request.
  The fourth test exists because "read from the artefact" is easy to satisfy in appearance:
  an implementation can read the branch once during creation, cache it, and use the cache
  for both the report and the comparison. That is self-consistent and still blind, which is
  exactly BP-600a-2's problem -- reading the name out of the tool's own output is no help
  when the output is the thing that is wrong.
