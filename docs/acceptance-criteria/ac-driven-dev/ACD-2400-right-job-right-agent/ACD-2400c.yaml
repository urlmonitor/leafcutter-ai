title: "Test designs are written by someone who has read the code"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Test designs come from a step that can see the code under test.

  A step with access to the code and existing tests turns the planner's test intent
  into a concrete test design, so the tests written from it are grounded in what the
  code actually does. This is where future guidance on which wrong implementations a
  test must catch will be recorded.
