id: INF-1200c-1
title: "The audience is read off the ownership record, and what a specialist is told moves when ownership moves"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the project's ownership record assigns a kind of file that carries a
    standard to one specialist and does not assign it to a second specialist,
  When each of the two begins work,
  Then the first begins with that kind of file's standards stated in its
    material and the second does not,
  And given that kind of file is then reassigned in the ownership record from
    the first specialist to the second, and nothing else in the project is
    altered,
  When each of the two begins work again,
  Then that kind of file's standards have MOVED — they are stated in the second
    specialist's material, and they are no longer stated in the first's,
  And given a specialist the ownership record assigns no kind of file that
    carries a standard,
  When it begins work,
  Then no kind of file's standards are stated in its material,
  And at no point is a specialist's audience membership decided by its name, by
    what it was called before, by which team or category it belongs to, or by any
    list of specialists held anywhere other than the ownership record.
