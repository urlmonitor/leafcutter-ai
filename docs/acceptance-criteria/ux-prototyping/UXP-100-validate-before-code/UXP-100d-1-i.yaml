criteria: |
  Given a prototype has been presented to the user and the user selected "Reject"
    or "Request changes",
  When the system processes the decision,
  Then no handoff artifact is produced
  And any previously existing handoff artifact for this feature (from a prior
    approval cycle that was later superseded) is marked as "invalidated"
  And the frontend-coder agent cannot find a valid handoff artifact for this feature
