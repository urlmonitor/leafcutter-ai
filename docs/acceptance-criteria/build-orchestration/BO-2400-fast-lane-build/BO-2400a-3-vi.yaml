title: "Test outcomes are classified red / green / inconclusive, with xfail counted as red"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the batch's covering tests have been executed before any implementation change,
    and each test has one reported outcome drawn from passed, failed, xfailed, xpassed,
    skipped and errored,
  And the repository's acceptance-criterion test-enforcement plugin reports a failing test
    as xfailed whenever the acceptance criterion that test covers is not yet work_status
    done — which is the state of every acceptance criterion during a fast-lane run,
  When the red-baseline gate classifies each executed test,
  Then an outcome of failed or xfailed is classified red,
  And an outcome of passed or xpassed is classified green,
  And an outcome of skipped or errored is classified inconclusive, counting as neither red
    nor green,
  And every inconclusive test is reported by test id together with its raw reported
    outcome, so a test that never executed is never read as evidence of a red baseline.
