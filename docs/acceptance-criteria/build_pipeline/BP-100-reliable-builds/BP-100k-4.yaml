notes: "Verified defect, 2026-08-25, found by adversarial review of this epic's own work. check-build-drift is registered with an activation condition rooted at a templates location that exists only in a CONSUMER install layout; in this package's self-host layout templates live elsewhere, and the consumer-layout prefix matches no tracked file at all — the gate has therefore NEVER fired here. check-output-drift names six locations: five are gitignored, and the sixth does not exist at the repository root (this epic's own BP-100k-2 work proved the build writes those rules under the output root, never to the repository root). Both gates declare that they do not consume the staged file list and scan the whole tree by hash, so a path filter was the wrong activation mechanism for either of them in the first place; their siblings in the same manifest use the always-run form. Consequence: roughly 3,000 lines of drift-gate hardening, including everything this epic built, sit behind two gates that cannot fire — and the review confirmed check-build-drift would have blocked the very commit that introduced this finding, had it been able to run. This AC is deliberately written for the DEFECT CLASS rather than the two gates: a registered gate whose trigger cannot match any path the repository can ever stage is a gate that reports a pass it never earned."
