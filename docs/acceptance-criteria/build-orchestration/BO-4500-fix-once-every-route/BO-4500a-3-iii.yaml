risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a-3.yaml"
criteria: |
  Given a judging check, check-file-size, fails on scripts/big.py with the message
    "scripts/big.py: 1210 lines exceeds the 1000-line limit",
  When the shared commit step answers,
  Then the answer is hook_failed with hook_name check-file-size, failing_files listing
    scripts/big.py, and that message reproduced exactly as the check printed it,
  And the step has started no agent, changed no file to satisfy the check, and recorded no
    commit.

  Given the caller then changes scripts/big.py and calls the step again with the same names
    and message file,
  When the second call runs,
  Then it runs the checks from the start with its own single retry, independent of the first
    call.
