notes: |
  WHY THIS DOCUMENT AND NOT A TROUBLESHOOTING DOCUMENT OF ITS OWN. INF-1300a's notes name
  this how-to as the natural home for INF-1300d's refusal troubleshooting, and INF-1300d's
  documentation_rationale gives the reason in terms: the refusal MESSAGES carry the duty of
  saying what to supply, so a separate troubleshooting document would restate them and then
  drift. This record honours that by making the page's entries a bijection onto the means'
  own reason set rather than an independently maintained catalogue — the page tells the
  reader where to stand, the message tells them what to type, and the correspondence between
  them is checked rather than trusted.

  FALSIFIABILITY. Three runs, none of which can be satisfied by a stub or by a search of the
  page. First: execute every command the page publishes, exactly as published. Falsified by
  any that the means rejects, and equally by one that runs only because the observer supplied
  an argument the page never mentioned. Second: derive the refusal-reason set from the means
  at the moment of the reading and require a bijection with the page's entries — falsified by
  a reason with no entry, and falsified by an entry for a reason that cannot occur, which is
  the drift a page acquires when the means narrows and nobody reopens the page. Third, and
  the arm with teeth: for each entry, provoke the real refusal, do exactly what the entry says
  and nothing more, repeat the request, and put the result through the project's own checks —
  falsified by any remedy that leaves the document still refused. A page that is complete,
  accurate about the reasons, and whose remedies do not actually work is the failure this
  third arm exists to catch, and it is the likeliest one, because a remedy is written from
  what the author of the page believes the means needs.

  WHAT WILL NOT FALSIFY IT, STATED BECAUSE IT IS THE TEMPTING CONSTRUCTION. Searching the
  page for the name of each refusal, or for a Troubleshooting heading, or asserting a minimum
  number of entries. All three pass on a page listing remedies that do not work, and the
  repo's own rule — "Gate / Workflow ACs — Verify Behaviorally, Not by Grep" — is not
  suspended because the artifact is markdown. The content of this page is derivable from a
  declaration and from a runnable path, so it is checkable against them.

  THE DUPLICATION FENCE IS A CRITERION, NOT A STYLE NOTE. INF-1300b-4 is retiring four
  measured falsehoods from the two authoring surfaces. If this page reproduces the corrected
  invocation, the corrected field checklist or the corrected verification command, the project
  acquires a third place where each of those must be kept in step, and the next correction
  will reach two of the three. That is how the present situation was built. The page
  references; it does not copy.

  A GAP FOUND WHILE SPECIFYING THIS AND DELIBERATELY NOT CLOSED HERE. The agent that will
  write this page is instructed to load docs/how-to/documentation/write-how-to.md before
  writing anything and told not to proceed without it. That file does not exist in this
  worktree — the folder holds write-adr.md and write-reference.md only. So the how-to genre
  has no canonical convention document while the reference and ADR genres do, and the
  instruction to load it cannot be followed. This is the same shape as the defect the whole
  tree is about: a mandatory step whose means is absent. It is recorded here rather than
  fixed, because authoring a genre convention for the whole project is not a child of
  INF-1300a and folding it in would hide it.
