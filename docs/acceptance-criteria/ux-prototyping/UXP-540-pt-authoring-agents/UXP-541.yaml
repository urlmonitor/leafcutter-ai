title: "A mockup agent drafts each screen populated from the mock data"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: approved
work_status: todo
criteria: |
  Given drafted mock data and a request that involves one or more screens,
  When the mockup agent (mockup-author) runs,
  Then it drafts a mockup for each screen the request implies,
  And each mockup is populated from the drafted mock data rather than placeholder text,
  And each mockup registers a screen id that the flow's steps can resolve,
  And it extends an existing mockup in place when the screen already exists.
