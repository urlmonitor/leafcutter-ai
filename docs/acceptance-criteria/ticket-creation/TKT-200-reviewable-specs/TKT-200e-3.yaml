roadmap_phase: phase_1
criteria: |
  Given tickets must pair each motivating factual claim with a reproduction command and
    an observed result,
  When the documentation step runs for this feature,
  Then a reference document is produced that specifies the capture format: how a claim is
    written, where the reproduction command and observed result live on the ticket, and
    the structured shape a downstream stage re-runs,
  And the reference states what counts as a complete capture versus a flagged one
    (missing command, missing result, placeholder result),
  And it cross-references TKT-200f (clean-tree verification) and BO-1900b (dispatch-time
    re-check) as the consumers of the captured data.
