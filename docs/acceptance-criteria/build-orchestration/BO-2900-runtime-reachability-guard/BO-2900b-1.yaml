notes: |
  The forward half of the bijection. Analytical decisions recorded for the IT PO and
  the implementer:

  - THE INVENTORY MUST COME FROM THE BUILT SURFACE, NOT FROM THE SOURCE TEXT. This is
    the whole reason the AC's last clause is longer than the rest of it. A check that
    derives the capability list by pattern-matching registration calls in the source
    is a source scan wearing a different hat: it will list capabilities that a
    refactor left declared-but-unregistered (false alarms that train people to
    disable the check) and it will silently miss capabilities registered through a
    loop, a table, or a helper (the exact ones most likely to go uncalled). Asking the
    built surface what it accepts is both simpler and honest.

  - THE CONDITIONAL-REGISTRATION CLAUSE IS NOT HYPOTHETICAL PEDANTRY. Once the
    inventory comes from the built surface, "what the surface registers" depends on
    the conditions under which it was built. Stating that a capability not registered
    under those conditions is not checked prevents an implementer from splitting the
    difference — building the surface AND then adding source-scanned extras to the
    list, which reintroduces the false alarms.

  - REFUSES, NOT WARNS. A capability-with-no-caller that only produces a warning is a
    capability-with-no-caller that ships; the regression this tree exists to prevent
    passed through several reviews. If the incumbent backlog makes an immediate hard
    refusal unmergeable, the correct instrument is the recorded exemption of BO-2900d
    (countable, reviewable, individually justified), not a global downgrade to
    advisory.

  BOUNDARY: what counts as an automation invoking a capability is defined once in
  BO-2900b-3 and consumed here — do not re-derive it. The wording of the refusal is
  BO-2900e. The reverse direction (an invocation naming a capability that does not
  exist) is BO-2900c.

  Verification must EXECUTE the check against a fixture pair — a surface with an
  uncalled capability and the same surface once it is called — and compare the two
  outcomes. A test that greps the checker for the capability's name passes on a
  checker that never runs, which is the defect this AC is derived from.

  2026-08-13 (IT PO enrichment) — ENFORCEMENT SURFACE DECISION for the whole
  BO-2900b/BO-2900c pair, recorded once here:

  A new pre-commit hook (`check-reachability`) WITH a CI backstop mode, rather than a
  check inside the done-proof path or a CI-only gate. Reasons:
    - The criteria say "the change is refused". That is a change-scoped verdict.
      verify_done_eligible is criterion-scoped and runs per AC id; it has no notion of
      a change and would have to be given one, which is a worse fit than a hook that
      already receives the staged set.
    - BO-2900c-1 requires the verdict "without executing the automation". A static
      comparison of the built parser against collected invocations is exactly what a
      pre-commit hook can do in under a second; a runtime gate cannot.
    - The two-mode shape is already proven in this repository by check_done_proof.py
      (fast static pre-commit + authoritative `--mode ci` backstop that survives
      --no-verify and hook-config-less worktrees). Reusing it means the known traps —
      deploy-manifest registration, source/template parity, run_hook.py wrapping — are
      already documented rather than rediscovered.
  The BO-2900a family deliberately does NOT move to this hook: those are per-criterion
  eligibility rules and belong in verify_done_eligible, which the same hook and the
  required CI job already consume.
