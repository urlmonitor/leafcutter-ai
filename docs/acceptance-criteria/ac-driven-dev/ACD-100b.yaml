criteria: |
  Given the readiness field has three states (draft, reviewed, approved),
  When the architecture documentation is reviewed,
  Then a state machine diagram exists showing:
    - States: draft, reviewed, approved, done (terminal)
    - Transitions: draft->reviewed (IT PO v3), reviewed->approved (User),
      approved->done (done-linker after merge)
    - Guards: only IT PO v3 may promote to reviewed, only User may promote
      to approved, only the done-linker may set done
  And the diagram is in Mermaid stateDiagram-v2 format,
  And it includes the deferred state as an alternative path from approved.
