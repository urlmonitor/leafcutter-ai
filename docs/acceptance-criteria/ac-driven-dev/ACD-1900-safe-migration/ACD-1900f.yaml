criteria: |
  Upgrade safely: version skew is caught, in-flight work drains, the old path is removed only after.

  A project that upgrades the package and rebuilds keeps working; the build warns -- or safely
  refuses -- when the store's version doesn't match what the package expects; the ability to
  read both old and new shapes is kept for a defined window while any in-flight old-style work
  finishes; and the old path is removed only after that window and a rehearsed rollback.
