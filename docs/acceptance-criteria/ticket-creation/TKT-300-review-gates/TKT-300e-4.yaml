title: "Split is presented at the user confirmation gate before writing"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the IT PO has determined that an AC must be split,
  When it presents the enrichment summary at the confirmation gate,
  Then the summary includes a "Splits" section showing:
    the original AC id,
    the proposed child AC ids,
    the assigned agent for each child,
    and the reason the split was necessary,
  And the user can approve the split, reject it,
    or request a different decomposition before any files are written.
