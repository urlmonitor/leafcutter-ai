notes: |
  ENROLMENT IS PART OF THE PROMISE — the L1's words. A check the census does not know about is
  indistinguishable from a check with no defect, which is the same substitution the census
  exists to detect, occurring inside the census itself.

  DERIVING THE SET FROM REGISTRATION DATA RATHER THAN FROM A LIST is also what stops this
  becoming a fifth registration leg. GE-126d is closing a gap caused by exactly one more
  enumeration than anybody was tracking; adding a census roster would open a new one on the
  same day.

  THE UNLOCATABLE-SCRIPT CLAUSE JOINS UP WITH GE-126e-2's THIRD CATEGORY. A registered check
  whose script cannot be found is a real finding about the registration data and must not be
  quietly removed from the population, because a shrinking denominator makes the instance count
  look better without anything improving.

  SHARE THE MACHINERY IF THE PARITY HARNESS LANDS FIRST and record that decision rather than
  growing a second notion of the registered set. If the two cannot share it, say why at
  enrichment time — the L1 asks for the reason to be written down rather than inferred.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

