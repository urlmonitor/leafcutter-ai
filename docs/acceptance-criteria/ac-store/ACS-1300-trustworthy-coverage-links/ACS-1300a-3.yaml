test_spec:
  - name: test_acs_1300a_3_parent_with_child_ids_is_byte_identical_while_a_leaf_is_repaired
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "THE PAIRING TEST — KEEP BOTH HALVES IN ONE INVOCATION. One out-of-process apply run over a store holding (a) a parent whose coverage list is its own child ids and which is itself named by a coverage tag, and (b) a leaf whose coverage list is test paths and is missing one. Assert the parent's file is byte-for-byte identical AND the leaf gained its missing test path, in that same run. Split apart, the parent half is satisfied by a tool that does nothing."
  - name: test_acs_1300a_3_the_parent_is_reported_as_an_abstention_with_its_reason
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The parent appears in the report as an abstention naming the record and stating that its coverage list carries child requirement ids. Assert presence and reason text, not merely that the file was unchanged — an unchanged file with no report line is the invisibility defect this tree exists to remove."
  - name: test_acs_1300a_3_done_proof_composite_classification_is_unchanged_across_the_run
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "REAL CONSUMER, REAL VERDICT. Call `done_proof`'s own composite/leaf routing for the parent before the run and again after it, and assert the two verdicts are equal. Use the real function — a re-implementation of its rule inside the test would pass while the production tool used a different rule."
  - name: test_acs_1300a_3_parent_back_link_check_still_passes_after_the_run
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "Run the real `check_ac_parent_covered_by` against the post-run parent and assert it passes. The hook reads the index or `HOOK_TEST_FILES` rather than argv, so the test must first confirm the hook actually saw the parent file; an exit 0 from a hook handed no files proves nothing."
  - name: test_acs_1300a_3_a_legacy_record_holding_test_paths_where_child_ids_would_go_is_classified_by_resolution_not_shape
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "A record whose coverage entries look like child ids but resolve to no record in the store must NOT be abstained on as a composite, and a record whose entries look like paths but resolve to real records MUST be. Pins the decision to entry resolution — done_proof's actual rule — rather than to entry shape or to the level field."
