risk_surface: internal
criteria: |
  Given end-of-route clearing (BO-4400a-1, BO-4400a-1-i, BO-4400a-2) is in place,
  When the sequence diagram for end-of-route clearing is read,
  Then it shows, in order, the route pushing its commits, the pull request being
    opened, the pull request being merged into the main line, the route asking the one
    clearing door to clear its workspace, the door obtaining the holds-work /
    holds-nothing verdict and whether the work is on the main line, and the route
    returning its result,
  And it shows the outcomes as separate branches: removed; refused with the unsent work
    named and the workspace kept; and, when the pull request is still open at the
    route's end, kept as not yet on the main line and left for the landed-work pass,
  And it shows the nothing-to-deliver path reaching the same clearing request without
    a push or a pull request,
  And it shows that an epic's workspace is cleared once, after its last ticket.
