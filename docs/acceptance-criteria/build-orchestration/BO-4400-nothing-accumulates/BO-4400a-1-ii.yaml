notes: |
  "At the latest right after the PR is opened" read per ticket would destroy an epic's
  workspace after its first ticket. The trigger is the ROUTE's end state, not any
  intermediate pull-request event. Named wrong version: hooking the clear onto the
  per-ticket pull-request phase -- the third ticket loses its workspace and this record goes
  red while BO-4400a-1 (single ticket) stays green.

  AMENDED 2026-11-16 (user decision Q3, merged timing D2): the clear at the epic run's end
  happens only once the epic's pull request has merged; with the pull request still open the
  workspace is kept as not yet on the main line and the landed-work pass (BO-4400g-2) clears
  it after the merge. The second scenario is the epic's own case of BO-4400a-1's second
  scenario: an epic's pull request is open for the whole drive, so a clear that treats a
  pushed line as sent would remove the workspace there.
