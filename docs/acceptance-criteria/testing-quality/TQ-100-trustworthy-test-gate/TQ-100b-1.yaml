notes: |
  Mechanism (settled): the existing '# covers: <AC-ID>' tag (already mandated by
  the test-writer agent) is the linkage; a conftest/pytest plugin reads the AC
  store once per session and looks up each tagged test's AC work_status. Not-done
  => informational (visible, non-blocking).
  IT-PO note: the AC-store reader to reuse lives at scripts/ac_store/scan_ac_store.py
  (_load_ac, _find_worktree_root, work_status access). conftest currently exists at
  tests/conftest.py and unit_tests/agents/conftest.py — the plugin/session hook can
  live there or as a packaged pytest plugin; in either case keep it deployable so
  ADR-016's pre-pytest build step makes it present in CI.
