work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  At no point during the change does the store answer differently.

  The move happens in steps, and at every step — including a store where some
  records have moved and some have not — the same questions get the same answers
  as before it started. A record that never moves keeps working indefinitely, and
  the whole change can be stood down in one step if it goes wrong.
