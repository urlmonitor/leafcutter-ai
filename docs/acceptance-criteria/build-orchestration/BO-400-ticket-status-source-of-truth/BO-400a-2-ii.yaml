notes: |
  BUG-22, observed in run wf_cc2b46d9-f6f (a 15.5-hour drive of
  EPIC-DeploymentCompleteness that completed 4 of 10 tickets then halted).

  THE OBSERVED STATE. After the drive, all 13 open tickets still carried the todo
  lifecycle state, including the four the drive's own payload named as completed
  batches and which have real feature commits on the branch. The only ticket that
  differed was one already complete before the drive began.

  THIS IS THE INVERSE OF PHANTOM-DONE, AND THAT MATTERS FOR THE FIX. The work is
  real and committed; the record claims nothing happened. So the fix is not another
  gate that withholds completion -- it is a write that was never performed. The
  fail-closed half lives in the sibling BO-400a-2-iii, and the two must land
  together: adding the write without the negative produces a driver that marks
  everything done.

  RELATION TO THE PARENT. BO-400a-2 states this rule for ticket-supervisor, the
  agent ADR-006 flattened away. Nothing in the parent is wrong; it simply names a
  surface that no longer drives phases. This L3 restates the same rule for the
  drivers that do, and deliberately does not touch the parent's criteria.

  CONSEQUENCE. The epic archive check gates on the recorded lifecycle state, so
  every epic driven by this path is unarchivable until the record is written by
  hand -- which is how the defect surfaced.
