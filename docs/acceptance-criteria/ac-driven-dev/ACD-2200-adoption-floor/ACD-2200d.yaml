doc_links:
  - path: docs/known-issues/commit-guardian.md
    relationship: describes
    status: exists
    relevance: >-
      The evidence that all-at-once is the current default and that it is wrong. The
      census scopes a single proposal to register twelve gates together and then
      finds that they are in at least five materially different states — two would
      deadlock ordinary work, four cannot fail, one inspects nothing, one writes to
      the record instead of refusing anything, and three inspect an empty
      population. Its own conclusion is that each is "a separate unit of work with
      its own numbers, its own ratchet shape, and its own definition of done". That
      sentence is this L1's justification.
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-1900-safe-migration/ACD-1900.yaml
    relationship: related
    status: exists
    relevance: >-
      ADJACENT PROMISE, DIFFERENT SUBJECT — do not merge and do not treat as a
      parent. ACD-1900 makes THIS project's move to the v2 build model reversible in
      one step, staged behind a two-stage flag with a kill switch. That is a
      well-tested shape for the same kind of guarantee and is worth reusing; it is
      not the same guarantee, because its subject is one project's internal
      migration and this one's is an arbitrary project's adoption of standards it
      chooses individually.
