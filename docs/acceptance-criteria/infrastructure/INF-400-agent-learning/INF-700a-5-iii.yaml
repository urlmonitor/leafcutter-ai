it_requirements:
  - "THE CONTENDED RESOURCE IS scripts/knowledge/harvest_learnings.py's STATE FILE, AND IT MUST BE INSTALL-SCOPED BEFORE THIS AC IS BUILDABLE. --state defaults to the bare relative name debugging/logs/harvest_state.json, so today each working directory has its own and the race this AC describes cannot occur. It becomes reachable the moment that file is declared install-wide, which INF-400c-4-iii raises and INF-400c-4 must settle. Two consequences: this AC is unbuildable and untestable until that declaration exists, and — more dangerously — an implementation that leaves the state file per-working-directory passes every descriptor here by never producing an overlap. Establishing that the fixture's two runs share ONE state file is a precondition of the suite meaning anything, not a fixture detail."
  - "WHATEVER ARBITRATES MUST HAVE AN OFF SWITCH REACHABLE FROM THE TEST HARNESS. The reachability descriptor requires a run with the arbitration disabled to produce two writes; without a supported way to disable it, that descriptor cannot be written and the other five become unfalsifiable — a concurrency suite that passes because the runs never overlapped is indistinguishable from one that passes because the mechanism worked. Treat the off switch as part of the deliverable and not as test scaffolding bolted on afterwards, and make it explicit enough that it cannot be reached by accident in production."
  - "BOUND THE CRITICAL SECTION TO THE STATE UPDATE. Nothing held for arbitration may be held across an agent dispatch, a commit, a network call or a publication — those are unbounded, and a lock spanning one makes the second unit of work wait on the first's commit phase, which fails this record's own no-delay clause while satisfying its write-once clause. The precedent in this repository is building-epics section 5.1's .epic-commit-lock, and it is a partial precedent only: it is scoped to a worktree root, whereas the thing being contended here spans every working directory of the install. Its stale-PID recovery rule is worth carrying over; its scope is not."
  - "FAIL TOWARD THE DUPLICATE, EXPLICITLY AND IN EVERY DEGRADED PATH. The criteria fix the asymmetry — a visible duplicate is survivable, a learning lost while marked routed is not — so every branch where arbitration cannot be obtained (contention timeout, unreadable state, a filesystem that does not support the chosen primitive) must proceed with the write rather than skip it, and must not record the routed mark on another run's behalf. State this per branch: a default that skips on failure looks conservative, reads as safe in review, and produces exactly the outcome the criteria forbid."
  - "THE MARK CANNOT HONESTLY BE WRITTEN AT ROUTING TIME, AND THIS IS THE SAME STATE AS INF-700a-5's BOOKKEEPING CLAUSE UNDER A SECOND PRESSURE — SOLVE THEM TOGETHER. A routed mark is only true once the write reaches the merged tree, and no completion path can observe that at the moment it routes: four of the five publish to a branch that may never merge. So an unconditional mark written at routing time is the rejected shape, and any mechanism chosen here needs a point at which a mark is confirmed or released against what actually merged. The mechanism itself is deliberately left open by the criteria; what is not open is that the concurrency arbitration and the publication-conditioned mark are one piece of state. Designing them separately is how they end up contradicting each other, and the contradiction surfaces as the loss mode rather than the duplicate mode."
  - "A NON-DETERMINISTIC SUITE MUST NOT BE MADE GREEN BY WEAKENING THE OVERLAP. The bookkeeping descriptor loops deliberately because a torn write is probabilistic. If the suite proves flaky, the permitted responses are to make the overlap MORE reliable or to raise the iteration count; adding a sleep that serialises the pair, or retrying until green, converts the suite into one that cannot fail. Record the chosen synchronisation so a later reader can tell a real overlap from an accidental sequence."
  - "Must handle errors gracefully per the project error handling policy."
