id: BO-4100a-3-i
title: "A refused creation leaves no half-made workspace behind"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: internal
package_surface: false
criteria: |
  Given creation has refused because the shared main line could not be read,
  When the live workspaces and the branches are listed immediately afterwards,
  Then neither listing contains an entry for the requested workspace,
  And no directory remains at the location creation would have used,
  And the counts of live workspaces and of branches are identical to their
    values before the refused request.
depends_on: [BO-4100a-3]
