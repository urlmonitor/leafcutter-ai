change_target: code
risk_surface: contract_boundary
test_required: true
test_rationale: |
  A test that runs only on the CI platform can never see this defect - that is why it has gone
  unnoticed. The assertion has to be made against the separator explicitly (build the index
  with a path built from OS-native parts and assert the emitted key uses the canonical
  separator), so it fails on a POSIX runner when the code is wrong, rather than requiring a
  Windows runner to catch it.
test_spec:
  - name: test_index_path_keys_use_the_canonical_separator_on_every_platform
    target_dir: unit_tests/portability/
    description: "Index keys built from OS-native path objects are emitted with forward slashes regardless of the host separator."
    type: unit
    angle: criterion
    framework: unittest
  - name: test_separator_only_difference_is_not_reported_as_the_record_being_behind
    target_dir: unit_tests/portability/
    description: "An index whose keys differ from a fresh rebuild only by path separator produces no behind or drift finding."
    type: unit
    angle: boundary
    framework: unittest
  - name: test_rebuild_is_byte_identical_across_simulated_host_separators
    target_dir: unit_tests/portability/
    description: "Rebuilding the index with the host separator forced to each value yields identical bytes."
    type: unit
    angle: seam
    framework: unittest
notes: |
  THIS IS A PORTABILITY DEFECT, NOT DRIFT. Stated explicitly because the L1 warns that anyone
  citing it as drift is wrong. Measured 2026-09-07: the checker fails on Windows with
  "[index] by_flow does not match a fresh rebuild"; all 14 by_flow mismatches are
  path-separator-only, produced by generate_product_truth.py line 423 using
  str(path.relative_to(STORE)), with ZERO genuine content differences. Do not write this up as
  the record having drifted, and do not use it as evidence for UXP-700c-1 or UXP-700c-2.

  PLACEMENT NOTE, recorded because it deviates from the authoring request. This was asked for
  as an L2 under UXP-700c. It is authored as an L3 under UXP-700c-3 because the 5-L2-per-L1
  hard cap (ACS-100c-1) combined with UXP-700c's two mandatory documentation ACs leaves exactly
  three behavioural L2 slots, all of which are taken by the L1's own named sub-surfaces. It sits
  under UXP-700c-3 because a false verdict is a property of the gate, which is that AC's
  subject. Alternative homes considered and rejected: UXP-700a (the install path, which is not
  where the defect lives) and GE-120 (whose every L1 is already at 5/5 per the BA memory note of
  2026-09-01). Nothing is lost by the L3 placement: it carries its own test_spec and is
  independently buildable.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
