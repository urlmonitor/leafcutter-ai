notes: >-
  This is the structural cause behind both harms in BO-4100b: the remedy this repository
  currently recommends points a workspace's supporting material at the shared install
  tree, so a workspace is simultaneously judged against something it does not own and
  able to damage something others are reading. Byte-identity of the other two trees is
  the observable, measured across a repair, because that is the operation the current
  arrangement makes destructive.
