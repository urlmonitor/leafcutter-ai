criteria: |
  Given config/paths.json declares a set of knowledge surfaces,
  When the reader runs `python scripts/knowledge_query.py --list-surfaces`
    (optionally with --project-root pointing at a project),
  Then the command prints each declared surface name and exits 0 without
    running the full node+edge traversal,
  And the documented verification step in
    docs/how-to/declare-a-knowledge-surface.md works as written
    (the bug symptom "unrecognized arguments: --list-surfaces" must not occur).
