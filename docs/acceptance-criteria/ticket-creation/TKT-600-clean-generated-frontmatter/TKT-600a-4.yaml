id: TKT-600a-4
components:
  - ticket_creation_pipeline
  - ac_store
  - documentation_system
title: "ADR-010 says a generated ticket's files come from the requirement's declared-files list, and names the documentation-link derivation as the labelled legacy path"
component: ticket-creation
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given ADR-010 as it stands today states that a requirement's documentation links map to
    the generated ticket's files-touched list, in its Context section and again in its
    Consequences section,
    and requirement R declares its files (scripts/ac_store/scan_ac_store.py, marked existing;
    unit_tests/ac_store/test_hold_reasons.py, marked to be created),
    and requirement L is in the "no declared files" state,
  When ADR-010 is amended and then read by someone asking where a generated ticket's
    files-touched list comes from,
  Then ADR-010 states that for a requirement that declares its files, such as R, the
    files-touched list is that declared-files list, in declared order, and nothing else --
    no documentation link, no technical-requirement prose and no reference file path is added,
  And ADR-010 names the documentation-link derivation as the legacy path, used only for a
    requirement in the "no declared files" state, such as L, and states that a ticket built
    that way is labelled "derived, not declared",
  And no sentence left in ADR-010 states that documentation links map to the files-touched
    list without that "no declared files only" qualification -- the Context and Consequences
    statements both carry it or point to the amendment that does,
  And ADR-010 names KI-ACS-002 as the known issue the legacy derivation still carries, and
    states that the issue stays open for records in the "no declared files" state,
  And ADR-010 names the requirement records that decide this (ACD-1600c-4 for the
    declared-files list, TKT-600a-3 for the ticket reading it, TKT-600a-3-i for the labelled
    legacy path), each as a link that resolves to an existing file,
  And the amendment is a dated, separately headed section of ADR-010: the original decision
    text is still present and readable, so a reader arriving at ADR-010 alone can see both
    what was decided in 2026-06 and what the amendment changed.
depends_on:
  - TKT-600a
  - TKT-600a-3
  - TKT-600a-3-i
  - ACD-1600c-4
