title: "Agent degrades gracefully when knowledge-query fails with an error"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given any of the three authoring agents (product owner, business analyst, technical planner) invokes
    knowledge-query during S1,
  When the knowledge-query script exits with a non-zero exit code
    (e.g., paths.json is absent, the script file is missing, or an unknown
    surface name was passed),
  Then the agent captures the error message from the script's output,
  And the agent logs a warning: "knowledge-query failed: <error message> —
    skipping graph context, proceeding with file-based reads only",
  And the agent does NOT abort its workflow or return a blocked status,
  And the agent does NOT retry the failed query,
  And the agent continues through the remainder of S1 and produces its
    AC output normally using only file-based context,
  And the agent does NOT present the error to the user unless the user
    has requested verbose output.
