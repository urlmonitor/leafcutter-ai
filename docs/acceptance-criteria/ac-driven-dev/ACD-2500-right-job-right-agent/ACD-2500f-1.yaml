test_intent:
- clause: each of the three profiles declares it produces "requirement_records"
  needs_test: true
  reason: Consumers of the profiles rely on this declared value, and a revert would go unnoticed without
    a check.
- clause: the product-owner and business-analyst profiles each declare one change surface, the requirement
    store (docs/acceptance-criteria/), with a description of the fields that agent writes, instead of
    "none"
  needs_test: true
  reason: The declared change surface is read by the profile consistency check and must name the requirement
    store.
- clause: the test-designer profile keeps its existing change-surface entry unchanged
  needs_test: false
  reason: The test-designer entry is left untouched, and the general profile parity checks already pin
    it.
- clause: each agent card and registry entry shows the same produces value as its profile
  needs_test: true
  reason: The registry and the generated card are derived copies, and drift from the profile is the defect
    class being fixed.
- clause: the it-po profile, already corrected by ACD-2500e-1, is unchanged character for character
  needs_test: false
  reason: No edit is planned to the it-po profile, and its existing tests from ACD-2500e-1 pin it.
- clause: the list of agents declaring "requirement_records" is exactly it-po, product-owner, business-analyst
    and test-designer
  needs_test: true
  reason: The exact set of requirement writers is the outcome of the parent requirement and is cheap to
    assert over the registry.
test_spec:
- name: test_three_profiles_produce_requirement_records
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Parametrized over product-owner, business-analyst, test-designer: the template frontmatter
    (parsed with template_compiler.parse_frontmatter) has produces == ''requirement_records''.'
  proves_clause: each of the three profiles declares it produces "requirement_records"
  code_file: templates/agents/product-owner.md
- name: test_po_and_ba_declare_requirement_store_change_surface
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Parametrized over product-owner, business-analyst: mutates has no entry named none and
    exactly one entry whose surface names docs/acceptance-criteria/, with a non-empty description that
    names record fields the agent writes (e.g. criteria for the BA, title/criteria for the PO).'
  proves_clause: the product-owner and business-analyst profiles each declare one change surface, the
    requirement store (docs/acceptance-criteria/), with a description of the fields that agent writes,
    instead of "none"
  code_file: templates/agents/business-analyst.md
- name: test_registry_entries_match_profile_produces
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  angle: seam
  description: For the three ids, config/agent_registry.json's produces equals the template's produces;
    both read from the real files, never retyped.
  proves_clause: each agent card and registry entry shows the same produces value as its profile
  code_file: config/agent_registry.json
- name: test_cards_show_profile_produces
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  angle: real_artifact
  description: The committed generated cards of the three agents (docs/agents/cards/<id>.card.md, as test_acd_2500e_1.py
    reads it) show the template's produces and contain generate_agent_cards.render_io_contract's output
    for the template; reads the cards, never spawns build.py.
  proves_clause: each agent card and registry entry shows the same produces value as its profile
  code_file: templates/agents/test-designer.md
- name: test_requirement_record_writers_are_exactly_four
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Over the real registry: the set of ids with produces == ''requirement_records'' equals
    {it-po, product-owner, business-analyst, test-designer}.'
  proves_clause: the list of agents declaring "requirement_records" is exactly it-po, product-owner, business-analyst
    and test-designer
  code_file: config/agent_registry.json
- name: test_registry_gate_accepts_the_new_profiles
  target_dir: unit_tests/agents/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Entry point: python scripts/registry_validator.py as a subprocess on a tmp copy of the
    package (as test_acd_2500e_1.py does): exits 0 with the three entries at requirement_records; control
    with one entry at a typo exits 1 naming it.'
  proves_clause: each of the three profiles declares it produces "requirement_records"
  code_file: config/agent_registry.json
