it_requirements:
- An operation in progress is any of merge, rebase (either backend), cherry-pick, revert or bisect. Stash
  entries are repository-wide, so a stash counts for the workspace whose branch it was made on. A user
  lock is any lock whose reason is not the WSL 'initializing' entry that IT3 of BO-4300f-3 removes. The
  no-change preview reports the same reasons.
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_merge_stash_and_user_lock_keep_the_old_workspace_for_a_decision
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: Legacy worktrees m (mid-merge with a conflict), s (stash made on its branch) and l (locked
    with reason 'on USB drive') are each listed in needs_decision with their reason, in the preview and
    in the run; their folders, register entries, stash entries and branches are unchanged.
- name: test_staged_change_is_carried_over_staged_or_kept_for_a_decision
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: Legacy worktree i holding a staged, uncommitted change is either a brought-over workspace
    whose index still holds that change with identical content, or untouched and listed in needs_decision.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON report, and the state of each legacy worktree, its register entry and the stash afterwards.
  Each kind of not-exactly-carryable state is set up for real, so a cut-over that ignores one of them fails.
