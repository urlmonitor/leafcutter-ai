  - "Function under test (scripts/registry_validator.py): _check_spawn_bidirectionality(spawn_map, spawned_by_map, registry_ids). It takes three plain arguments — spawn_map (id -> spawn_allowlist), spawned_by_map (id -> spawned_by), registry_ids (set of ids) — NOT a registry object; construct these dicts/sets directly in the test. Import by bare module name after adding scripts/ to sys.path."
  - "'allowed-spawner (reverse) relationship' in the criteria maps to the spawned_by field."
  - "Assert a symmetric edge (A.spawn_allowlist has B and B.spawned_by has A) yields no error."
  - "Assert a one-directional edge yields an error whose text names both A and B and the missing reverse direction (current format: 'asymmetric spawn: A.spawn_allowlist includes B, but B.spawned_by does not include A')."
  - "Assert a spawn edge whose target id is absent from registry_ids yields an error naming the dangling target (current format: 'references unknown agent <id>')."
