notes: |
  WHY THIS RECORD EXISTS AND WHY IT IS THE PARENT'S OWN STATED TRIGGER. GE-120f carries a
  reference-doc trigger for two reasons it states directly: a rule the whole family must obey
  has to be written where the next check author will find it, and what is currently written
  down is a vocabulary with no reader. Both are documentation failures, not code failures,
  and neither is fixed by any of the four behavioural records in this family. No
  component-diagram record is produced: the parent rules that out explicitly, because the
  execution surface belongs to GE-120c and is to be extended rather than duplicated.

  THE AGREEMENT CLAUSE IS WHAT STOPS THIS BEING PROSE. Every other clause here is satisfiable
  by writing sentences, and sentences about a guarantee are exactly what this repository
  already has too many of. The agreement clause is not: it fails when the procedure a reader
  is told to follow and the procedure the registration surface enforces diverge, which is a
  property of two artifacts and can be exercised. It is also the failure with the most
  history here — a check documented as taking a remediation action that its own code never
  takes, believed by authors for months, is the anti-precedent this component already
  records. A documented-but-dead procedure is worse than none, because authors believe they
  are covered.

  ARRIVAL COLOURS. Every clause is RED on arrival: no such procedure is written today. The
  final clause — the requirement is described as in force rather than forthcoming — will pass
  trivially the moment the text is written, so it is the one to distrust; it exists to stop
  the document landing before the gate does and describing an intention.

  NAMED MUTATION FOR THE AGREEMENT CLAUSE. INJECTION: change the written procedure so that
  the declaration is described as recommended rather than required, leaving the registration
  surface unchanged. Under that injection an author following the document exactly is
  refused by a gate the document did not warn them about; this clause must go RED, and must
  return to green on revert. The mirror injection is equally valid and worth running: leave
  the document as written and relax the gate to accept a registration without a declaration.
  Either divergence must be caught, because the defect is the gap and not its direction.

  SECOND NAMED MUTATION, FOR THE VOCABULARY CLAUSE. INJECTION: write the document with its
  own synonyms for the known-bad input, the ground for an exemption, and the never-attempted
  value. Under that injection every other clause stays green — the rule is stated, the place
  is named, the procedures agree — and only this clause goes RED. A second vocabulary beside
  the first is how a rule with one reader becomes a rule with none, and it is the exact
  history of the vocabulary this family is built on.

  SCOPE BOUNDARY, STATED SO IT IS NOT DISCHARGED ON THE WRONG SURFACE. The false-green
  catalogue is a different document with a different author and a recommended new entry of
  its own. This record is not satisfied by writing there, and writing there does not satisfy
  it.

  NO COUNT OF INSTANCES MAY APPEAR IN THE DOCUMENT THIS RECORD PRODUCES. Records authored the
  same day disagree about how many instances of this shape exist and the parent records the
  figure as disputed. The document states the rule and the procedure; how widespread the
  defect is belongs to whatever measures it, with the date and the state it was measured at.
