expects_from:
  ac_id: BP-900h-6
  contract: "The executed-guard record captured from the commit path, which this AC requires to be reported against the deployed guard population rather than on its own."
test_spec:
  - name: test_bp900h6ii_narrowed_run_names_every_withheld_guard_and_states_the_deployed_count
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Build a real install, count the guards its deployed pre-commit registry carries, and run the step through the consumer-install entry point as a subprocess in a configuration that withholds some of them. Parse the job's output and assert three things: the stated deployed count equals the count taken from the registry before the run; the union of executed and withheld names equals the deployed guard names, with no guard in neither set and none in both; and each withheld guard appears with a reason. Asserting only that the output mentions a number is not enough — the deployed count must be compared against the registry the install actually produced, since a count read back from the narrowed registry is self-consistent and wrong."
  - name: test_bp900h6ii_a_narrowed_run_and_a_full_run_do_not_produce_the_same_verdict
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Run the same entry point twice as a subprocess: once where every deployed guard is active and passes, once where guards are withheld and the survivors pass. Both commits succeed, so exit status alone cannot separate them. Assert the two verdict lines differ, that only the second is qualified, and that only the first is the unqualified pass. This is the entry that fails on a step which prints its guard names but still signs off with the same pass line either way — the shape the current implementation would take if it merely added a line."
  - name: test_bp900h6ii_a_silent_or_unaccounted_narrowing_fails_the_job
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Must-block case, and the entry that makes this criterion capable of failing. Drive the same entry point in a configuration where a deployed guard is withheld with no recorded reason, and in a second where a deployed guard appears in neither the executed nor the withheld list. Assert both runs exit non-zero and name the unaccounted guard. Without this, a narrowed run satisfies the criterion by staying quiet, which is exactly the current behaviour."
  - name: test_bp900h6ii_the_verdict_is_read_from_the_output_of_the_command_the_workflow_runs
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Read the consumer-simulation step's command from the real on-disk .github/workflows/ci.yml and execute that exact command against a real built install, capturing its output. Assert the accounting appears there. Red today because that command does not invoke the use-the-install path at all, which is the point: a record that is perfect inside a module the job never calls tells an adopter nothing. Direct calls to the report-formatting function do not satisfy this entry."
test_rationale: |
  The job exists to catch an install whose guards are not wired. It currently narrows the
  guard population to two before it observes anything, so the broken-guard case is
  structurally outside what the record can express, and a green run means only that two
  hooks ran. The criterion is therefore about accounting, not about forbidding the
  narrowing — the narrowing has filed justifications and removing it is a different
  decision.

  Each entry kills a different way of appearing to satisfy that.

  Printing the withheld names while keeping one pass line is green on entry 1 and dies on
  entry 2, because the two runs would be indistinguishable at the verdict.

  Qualifying every run unconditionally is green on entries 1 to 3 and dies on the
  no-narrowing half of entry 2, which requires the unqualified pass to still exist.

  Deriving the deployed count from the registry as it stands after narrowing is
  self-consistent and green on any assertion that merely looks for a number; entry 1
  compares it against the registry the install produced, before the step touched it.

  Staying silent about the narrowing is green on everything except entry 3, which is why
  entry 3 is a must-block rather than a diagnostic check.

  Entry 4 is separate because none of the other three prove the adopter or the reviewer
  ever sees any of this. On this branch the job's command does not reach the step, so a
  module-level assertion is green while CI observes nothing at all.

  Angles: criterion, boundary, failure, reachability — at the cap of four, with must_block
  riding entry 3.
