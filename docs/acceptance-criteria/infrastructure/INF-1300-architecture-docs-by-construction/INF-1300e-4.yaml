created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300e.yaml"
criteria: |
  Given the project runs a guard whose purpose is to notice an instruction
    referring to something an adopting project will not receive, and given that
    guard currently holds an entry excusing this particular reference,
  When the means is delivered and the guard is run with that excusing entry
    removed,
  Then the guard reports nothing about this reference,
  And when the means is then withheld from delivery and the guard is run again,
    unchanged and still without the excusing entry,
  Then the guard reports this reference,
  And both runs are observed, because the first alone cannot distinguish a guard
    that watches this reference from one that has merely stopped being able to see
    it,
  And no excusing entry for this reference remains once the means is delivered —
    an entry that excuses a reference needing no excuse makes the guard's silence
    mean nothing for every other reference it covers.
