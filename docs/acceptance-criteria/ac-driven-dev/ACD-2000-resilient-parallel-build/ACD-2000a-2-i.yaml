criteria: |
  Given a requirement whose latest recorded attempt failed because a dependency
    it needed does not exist yet,
  And whose budget for that stage is now spent,
  When the effort stops and asks a person,
  Then what the person is shown states that reason, in one short sentence drawn
    from the latest entry in the requirement's trail,
  And it names the requirement the effort stopped on,
  And a requirement that stops with a trail entry carrying no reason text
    produces a message saying the reason is missing, rather than an empty
    message,
  And no escalation reaches a person with a blank reason.
