work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, and a finished feature whose finalize-feature run reaches
    the ticket closure step (step 3.5) with ticket closure changes staged for the history,
  When the closure step runs,
  Then the closure step dispatches the commit specialist,
    And the commit specialist commits the change,
    And no other agent issues a commit command during the closure step -- neither the status
    checker that performs the closure today nor the chartered executor,
    And the closure step's report names the commit specialist as the agent that made the closure
    commit and quotes the commit's identifier.
