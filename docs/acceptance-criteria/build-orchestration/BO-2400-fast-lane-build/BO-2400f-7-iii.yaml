notes: |
  Observed 2026-09-23 on a fast-lane run aimed at BO-3500. The run passed the
  worktree, verification, resolve and producibility steps -- further than any run
  that day -- and then halted at the claim step reporting that the set was
  "already claimed / in progress" and "owned by a concurrent run", while the same
  payload carried an empty claimed list and an empty excluded list. Nothing was
  held by anyone.

  WHAT ACTUALLY HAPPENED. The claim step was dispatched to a performer whose
  declared charter is investigating and reporting state, with edits restricted to
  ticket files and code edits forbidden. Asked to run a command that changes the
  AC store, it declined -- correctly, and in detail. The decline was then folded
  into the contention branch, because the step's instructions treat a non-zero
  exit OR a refusal flag as meaning the set is held elsewhere.

  WHY THIS IS TWO FAULTS, NOT ONE. The wrong performer is the cause; reporting a
  decline as contention is what made it expensive. An operator reading that halt
  goes looking for a concurrent run that does not exist, and the empty held-set
  that contradicts the message sits in the payload unread. The second fault would
  survive fixing the first: any future refusal, for any reason, would be reported
  the same way.

  THE PERFORMER CHOICE IS CONSTRAINED AND IMPERFECT, AND THE RECORD SAYS SO.
  KI-BO-20260901-1620 establishes that permits_shell is a three-state field read
  as two: per the registry schema, false OR ABSENT means read-only, and only two
  agents declare it at all. The performer the sibling release path switched to
  declares nothing, so the schema also calls it read-only -- that KI exists
  precisely because KI-BO-020's fix reasoned from "does not explicitly forbid"
  rather than from what the schema says, and wrote that reasoning into a comment.
  This record therefore requires a performer permitted to change the store, and
  forbids both editing the registry to manufacture permission and writing a
  comment claiming a schema blessing the schema does not give. The underlying
  three-state defect stays open under its own KI.

  Falsifiability. Four behavioural descriptors over one harness, two of them
  opposed: a decline must halt as not-attempted, and genuine contention must still
  report contention with its members named. A fix that cannot separate them fails
  one whichever way it errs. The fourth descriptor pins the observed payload shape
  -- contention asserted with nothing held -- as unreachable, which relabelling
  alone does not achieve.
