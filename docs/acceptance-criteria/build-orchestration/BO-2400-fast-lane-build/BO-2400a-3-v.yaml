id: BO-2400a-3-v
components:
  - build_orchestration
  - testing_quality
title: "One red newly-added test establishes the baseline; a green newly-added test is surfaced, not fatal"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a batch containing acceptance criterion TKT-600a-1 whose four covering tests are
    all newly-added, of which two are red and two pass because the slice of the criterion
    they exercise is already implemented,
  When the red-baseline gate produces its verdict,
  Then the verdict is that a red baseline is established and the coder agent is
    dispatched,
  And the two passing newly-added tests are each reported individually as
    green_at_baseline, named by test id together with their acceptance-criterion id,
  And a green_at_baseline test neither changes the verdict nor halts the run,
  And the same verdict is produced whether one, two, or all four of the newly-added tests
    are red — one red newly-added covering test is sufficient.
depends_on: [BO-2400a-3, BO-2400a-3-ii, BO-2400a-3-vi]
