id: GE-111b
readiness: approved
priority: high
title: "Catch broken links whether the file moved or just the function moved"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Drift is detected at the level of the actual thing the requirement points to.

  A link is recognised as broken not only when the whole file disappears, but
  also when the specific function or symbol the criterion names is moved out,
  renamed, or removed while the file itself survives — so a refactor that shuffles
  code between files can no longer pass a check that only looked at file paths.
