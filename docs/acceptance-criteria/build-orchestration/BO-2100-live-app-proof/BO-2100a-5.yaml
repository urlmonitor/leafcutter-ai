criteria: |
  Given the dispatch chain from ticket authoring through to a running live-app check
  When an author needs to understand how an opted-in ticket reaches the
    live-surface-tester phase
  Then a sequence diagram exists showing the ordered interaction:
    business-analyst writes `live-surface-tester: needed` into the ticket agents map,
