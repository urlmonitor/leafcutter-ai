id: BO-2500f-3-i
components:
  - build_orchestration
  - ac_store
title: "The reviewer of an inspection is the person whose gate approval is kept in a committed approval file, checked at mark time"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an inspection verification record for record DK-210b-3 that references
    the workflow run "insp-20261025-0912",
  And the tracked approval file for that run, committed with the record, holding
    the run id, the gate id, the answer, the time the answer was given, the AC id
    DK-210b-3, and each inspected file with its content fingerprint,
  When the record is marked done, at any layer that decides done,
  Then the approval file for the referenced run is read from the committed tree,
    with no network call and no read of any local, untracked store,
  And the inspection holds only if the file's answer is "approve", its AC id is
    the record being marked done, and its run id is the one the inspection
    references,
  And the inspected files and fingerprints in the approval file are exactly the
    files and fingerprints the inspection lists,
  And the review date is the time the answer was given as the approval file
    records it, and a date written into the inspection that differs from it is
    refused, naming both,
  And an answer other than "approve", or an approval file for a different record,
    does not count and marking done is refused as unreviewed,
  And when the approval file is missing, cannot be read, or any of the checks
    above does not match, marking done is refused, naming the run id and what was
    missing or did not match, and the inspection's own text is never accepted in
    place of the approval file,
  And because the approval file is committed with the record, the mark command,
    the commit-time done check and the CI checks read the same file on every
    machine and reach the same verdict for the same record,
  And an approval file is never deleted or cleared by any cleanup of workflow runs,
  And an approval file is created only by the inspection workflow's own approval
    step (BO-2500f-3-ii); no command-line or general-purpose write command offered
    by the project creates an approval file with the answer "approve",
  And this check is made only at mark time; checking the record without marking it
    done does not read the approval file (BO-2500f-1).
depends_on: [BO-2500f-3]
