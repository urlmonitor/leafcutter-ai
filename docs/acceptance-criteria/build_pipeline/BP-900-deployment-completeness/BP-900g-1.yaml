id: BP-900g-1
components:
  - build_pipeline
title: "A deployed command referencing a workflow by a path that does not resolve post-deploy fails the build"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given a deployed command whose handoff references a workflow by a path such as
    Workflow("scripts/workflows/build-feature.js"),
  And the workflow .js files are actually deployed to <output_root>/workflows/
    (reachable via the .claude/workflows shim, per BP-811 — not under
    scripts/workflows/), so no artifact exists at scripts/workflows/build-feature.js
    in a consumer install,
  When build.py runs its command-reference reachability check,
  Then the build exits with a non-zero status,
  And the failure names the command, the unresolvable target
    "scripts/workflows/build-feature.js", and states that the path does not
    resolve to a deployed artifact after deployment.
