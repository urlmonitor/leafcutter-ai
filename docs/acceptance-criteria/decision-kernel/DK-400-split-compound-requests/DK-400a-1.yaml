id: DK-400a-1
title: "A bundled request that routing turns away is offered as a split, not ended as a capability gap"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose root goal is the reusable-criteria goal of mock record
    dcp-reusable-criteria-by-hand ("For the kernel we often use similar decision basis and we
    should also reuse them. ... That way we only need LLMs to generate further categories if jev
    thinks some are missing to make better decision"),
  And that goal holds four separate questions: the storage format, the Neo4j projection, the
    clustering method and the mining source,
  And routing finds no single capability for it (no match, reason jev_none),
  When routing runs on the run's root,
  Then a split is started for the goal instead of the run ending blocked,
  And the split keeps the goal exactly as submitted as its subject, with subject kind goal,
    found at routing, work-item depth 0 and trigger jev_none,
  And the run waits for the host to propose the parts (run status waiting_host).
