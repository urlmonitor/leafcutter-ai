notes: |
  USER DECISION 2026-10-09: a missing linter, one that cannot start, or an
  unreadable configuration REFUSES the commit with the reason and install
  instruction. This is decided, not open.

  SQUARED WITH THE COMPONENT'S FAIL-OPEN CONVENTION, FOLLOWING GE-120's LINE.
  commit-guardian fails open on INTERNAL errors so a script bug never blocks an
  unrelated commit. GE-120 does not repeal that. It draws the line at
  visibility: fail-open on one bad input while the check still ran is fine, but
  reporting SUCCESS for a check that never ran is not. Whether a cannot-run
  condition also BLOCKS is a per-check decision. For this check:
    - Linter absent / will not start / config unreadable: BLOCK. The check
      examined nothing, the required CI gate would be the first examiner, and the
      push fails there anyway, so blocking costs nothing that CI would not cost
      later.
    - The check's own internal defect (the fifth scenario): the component
      convention may decide block or allow, but the output must say "could not
      check". It must never say "passed".
  PRE-COMMIT DETAIL THAT MAKES THIS LOAD-BEARING: the pre-commit framework prints
  "Passed" beside any hook that exits 0, whatever the hook writes to stderr. An
  exit-0 fail-open is therefore not merely quiet, it is a printed false green.
  The IT PO must make the fifth scenario's "never states passed" hold against
  that banner, not just in the hook's own text.

  The "nothing to inspect" arm stops the opposite over-correction: refusing a
  docs-only commit because the linter is missing would block work the check has
  no subject in.

  USER DECISION 2026-10-09 -- ACCEPTED: GE-108e's ruff-discovery rule cannot be
  literally reused, because it is implemented inline in the edit-time hook
  (templates/hooks/check_exception_handling_hook.py), which GE-108e requires to
  be self-contained. The substitute recorded in it_requirements ("WHY THIS IS
  NOT LITERAL REUSE OF GE-108e's CODE") -- one locator for this family plus a
  behavioural cross-check test that runs BOTH hooks as subprocesses in three
  real environments (module only, executable only, neither) and asserts they
  agree on installed / not installed -- was accepted by the user on 2026-10-09
  as satisfying "the same answer as the edit-time hook". Decided, not a caveat.
  Criteria unchanged.

  SAME DAY: the reason vocabulary in delivers_to was extended with
  ruff_config_outside_project (BP-1300e-1-iv, user-accepted rule),
  linter_version_mismatch and linter_version_source_unreadable (BP-1300e-1-v,
  user decision that a differing linter version refuses).
