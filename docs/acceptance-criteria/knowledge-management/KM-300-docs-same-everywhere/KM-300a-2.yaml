covered_by: []
implemented_by: []
change_target: code
risk_surface: internal
notes: |
  BA finding, not in the original request: the map is written INSIDE docs/ but
  (as of 2026-09-25) its link targets are project-root paths starting with
  "docs/". Relative Markdown links resolve against the linking file's folder,
  so even with forward slashes every link resolves to docs/docs/... and is
  broken on the code host and locally. Fixing the separator (KM-300a-1) alone
  does NOT make KM-300a's L1 promise ("every entry opens the page it names")
  true. Kept as a separate L2 so the /quick-fix for the separator stays a
  single, minimal behaviour.
