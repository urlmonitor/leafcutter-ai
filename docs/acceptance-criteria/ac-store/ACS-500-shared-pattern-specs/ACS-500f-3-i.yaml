title: "Widened schema still rejects malformed ids and unknown fields"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given an AC record whose id does not match any valid AC id form
    (e.g. "acs-500" lowercase prefix, "ACS_500" underscore separator, or
    "ACS-500a-" with a trailing empty leaf segment),
  When it is validated against the widened schema,
  Then the record is rejected with a validation error naming the id field.

  Given an AC record that includes a field name that is not part of the AC
    schema (e.g. a misspelled "critera" or an invented "foo_bar" key),
  When it is validated against the widened schema,
  Then the record is rejected,
  And the widening to accept pattern_slots does NOT loosen the schema into
    accepting arbitrary unknown fields.

  Given an AC record missing a required field (e.g. no criteria),
  When it is validated against the widened schema,
  Then the record is still rejected for the missing required field.
