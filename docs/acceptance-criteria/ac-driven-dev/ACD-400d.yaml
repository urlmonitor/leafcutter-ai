criteria: |
  What the build system reaches for next is decided by a stated order of importance.

  When several pieces of work are equally available, the queue hands back the most
  urgent one first, and the tie-breakers that follow are stated rather than assumed.
  Work that names no urgency is treated the same way every time, and so is work whose
  urgency nobody recognises — neither case silently drifts to the front or the back.
