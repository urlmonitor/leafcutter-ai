notes: |
  THE DOCUMENTATION AC FOR ACS-1400c'S `how-to` TRIGGER. Intended author is the
  documentation expert; the agent assignment is left for the IT PO to set.

  THE ABSTENTIONS ARE THE OUTPUT THAT MATTERS MOST HERE, and they are the part a
  reader is most likely to misread as failure. Hence the second Then, which is not
  a nicety: a reader who believes the pass is incomplete while records remain will
  go looking for a way to clear them, and the way to clear them is the unsafe bulk
  repair this L1 exists to prevent. The guide has to actively teach that a run
  leaving records alone is the run working correctly.

  THE THIRD Then IS THERE BECAUSE THE REFUSAL WILL LOOK LIKE A BUG. ACS-1400c-1-i
  makes the tool refuse a repair with no adjudication behind it. To someone who
  ran it a year ago and remembers it just working, that refusal reads as breakage
  unless the guide explains it as the point.

  NO SEQUENCE DIAGRAM. One pass over one store, one actor. The L1 says so and
  re-reading the tool confirms it.
