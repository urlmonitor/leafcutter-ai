criteria: |
  One set of override rules, whichever way the file is changed.

  An escape hatch that lets a change through when made with the editing tools
  lets it through when a command makes it, and one that is refused for a
  particular caller is refused on both paths, so the way a change is made is
  never a way around the rules.
