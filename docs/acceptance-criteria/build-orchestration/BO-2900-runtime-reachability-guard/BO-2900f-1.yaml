notes: |
  The core positive behaviour of BO-2900f. Two analytical decisions the BA made
  here that the IT PO and implementer must preserve:

  - THE REQUESTED SET IS THE DENOMINATOR. The record is derived from the gates the
    work item ASKED FOR, not from the gates that were dispatched. Today the two
    are conflated: a gate that config removes from the dispatch set disappears
    from the record entirely, which is exactly the defect. The requested set must
    therefore be captured BEFORE the enablement decision filters it.
  - GATES NOBODY REQUESTED PRODUCE NO ENTRY (the gate D clause). Without this
    negative clause the rule degenerates into recording every gate in the project
    on every work item, which buries the signal it is meant to raise. "Skipped"
    means "you asked and it did not happen", not "it did not happen".

  TERM COLLISION — `skipped` NOW MEANS TWO DIFFERENT THINGS. Read this before
  implementing or writing tests:
    - BEHAVIOURAL sense (pre-existing, approved): BO-2100b-2 says that when a
      ticket does not opt in, "the live-app check is skipped for that ticket".
      There, "skipped" describes the ABSENCE of an action.
    - RECORD sense (introduced by this tree): an entry whose outcome VALUE is
      `skipped`, meaning "you requested this gate and it did not run, here is
      why".
  The two are not the same and the gate D clause depends on keeping them apart:
  the behavioural state BO-2100b-2 describes — a gate the work item never
  requested — must produce NO record at all, precisely NOT a record whose outcome
  reads `skipped`. An implementer who reads the two senses as one will emit a
  `skipped` entry for every unrequested gate on every work item and will believe
  BO-2100b-2 required it.

  Boundary: BO-2900e governs the QUALITY of a failure message that IS emitted;
  this AC governs the EXISTENCE of a record where today there is none. The reason
  string here only has to name the disabling condition and its source — do not
  re-specify message quality at this level.

  OPEN — RECORD SURFACE NOT YET CHOSEN BY THE USER. These criteria say "the
  recorded results" without naming where they live; the user has not decided
  between the git-tracked ticket (`## Comments` / the phase-outcome surface) and
  a durable JSONL sink. Every clause above — the denominator rule, the reason
  content, the gate D negative — holds either way. Do not implement the surface
  before that decision lands.

  2026-08-14 (IT PO enrichment). The OPEN item above is deliberately still open:
  it_requirements enriches everything that is surface-agnostic and states the
  surface dependency as an explicit two-option constraint rather than resolving
  it. Three technical findings from the enrichment pass that bear on the choice
  and are recorded here so they are not re-derived:

  - THE DENOMINATOR ALREADY EXISTS IN CODE. `_build_agents_map` in
    scripts/ac_store/generate_ticket_from_ac.py computes the requested-gate set
    from config/guardrail_gates.yaml and the work item's (change_target,
    risk_surface) classification. That computed map IS the denominator this AC
    asks for; no new concept of "requested" needs inventing, and the gate D
    clause is exactly "a gate not in the map".
  - THE FOUR-VALUE ENUM HAS A SINGLE ENFORCEMENT POINT: VALID_STATUSES at
    scripts/commit_guardian/_signoff_parity_checks.py line 36. Every other
    statement of the enum (templates/skills/signoff/SKILL.md) is prose. If the
    ticket surface is chosen, that line is the load-bearing edit and the prose is
    the follow-on — a `skipped` value added only to the skill text is a no-op.
  - THE EXISTING JSONL PRECEDENT IS BEST-EFFORT BY DESIGN. emit_agent_telemetry
    swallows OSError, increments a dropped-record counter and continues
    (docs/reference/build-telemetry.md). If the JSONL option is chosen, this AC's
    sink must NOT inherit that behaviour; a silently-droppable record cannot
    carry a guarantee about silence.

  MIXED-SURFACE FLAG (S2.8 partial). `assigned_agent: python-coder` covers the
  denominator capture, the record shape and its enforcement, which is where the
  guarantee is decidable. Under the ticket-surface option a portion of the WRITE
  side lives in the JS supervisor/phase driver and in agent prompt templates,
  which python-coder does not own. That portion is unresolvable until the surface
  is chosen; when it is, it needs a companion pass (llm-expert for the templates,
  the workflow surface for the driver). Flagged rather than split, because the
  tree is at its child cap and the split boundary is not yet knowable.
