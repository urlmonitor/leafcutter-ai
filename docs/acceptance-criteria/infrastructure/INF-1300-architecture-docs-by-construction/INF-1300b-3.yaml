expects_from:
  ac_id: INF-1300b-2
  contract: "The produced-versus-authored line INF-1300b-2 draws inside the key — notation meaning is produced, what a particular element stands for in this document is authored. Without that split there is nothing here to mark. INF-1300b-1's single section-shape declaration supplies the regions being partitioned, and INF-1300a-1's harness supplies the check run over the filled document."
notes: |
  WHY THIS IS A BEHAVIOUR AND NOT A PRESENTATION DETAIL. The prohibition on hand-authoring
  is the rule INF-1300 exists to make followable, and a prohibition is only followable when
  its scope is visible at the moment of the act. Today an author holds an instruction in one
  file and a document in another, and must remember which of the document's parts the
  instruction covered. That is how "do not modify the key" becomes either an author who
  leaves the document incomplete or an author who rewrites the produced parts — and the
  collection already contains both outcomes.

  THE THIRD CLAUSE IS THE ONE WITH TEETH AND IT IS NOT COSMETIC. Marking the open parts is
  worth nothing if filling them breaks the document. Requiring that an author who fills
  every prompt and changes nothing else still passes every check turns this record from a
  statement about labels into a statement about the produced document's structure: the
  prompts must sit where content can go without disturbing the frontmatter, the naming, the
  link to the document above, or the size limits on the picture.

  FALSIFIABILITY. Produce a document, and partition it: every line is either produced-and-
  closed or an open prompt. The record is falsified by a line in neither state or in both.
  Then replace each prompt with plausible content of the length a real author would write,
  change nothing else, and run the project's full check set over the result — falsified if
  anything fails, which is the arm that catches a prompt placed somewhere filling it breaks
  a check. Then take an unfilled document and require that its incompleteness is readable
  from the document alone — falsified if telling a finished document from an unfinished one
  requires diffing it against a freshly produced copy. What will not falsify this record:
  reading what produces the document. The partition and the fill-and-check must be performed
  on a produced artifact.

  THE FOURTH CLAUSE ANTICIPATES THE CHEAPEST IMPLEMENTATION. A single repeated marker in
  every open place satisfies the first three clauses completely and tells the author nothing,
  which returns them to copying a sibling to find out what belongs there — the propagation
  failure the L1 records. Requiring the prompt to say what belongs in that place is what
  separates a marked document from a marked-up one.

