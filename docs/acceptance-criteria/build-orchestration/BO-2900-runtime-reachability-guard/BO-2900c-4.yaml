assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    inventory_unavailable_finding:
      type: object
      description: "{ kind: 'inventory_unavailable', surface: '<module path>', cause: str, clearing_action: 'restore the surface so its registered capabilities can be established' }. Emitted INSTEAD OF, never alongside, per-invocation stale findings for that surface."
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "DERIVE THE AUTOMATION-SCRIPT SET, NEVER LIST IT. The set is every automation script that exists at check time, resolved from the location rule in docs/reference/workflow-authoring-contract.md (in this repository: templates/workflows-js/*.js and its deployed twin). Register the same derivation as the hook's `files` pattern in commit_guardian.json AND its template twin, so adding a script needs no edit anywhere. A hardcoded list protects only the scripts someone remembered to add, and its gaps are invisible — the check reports zero findings and looks healthy."
    - "FAIL CLOSED, BUT SUPPRESS THE DERIVED FINDINGS. When the surface cannot be built or interrogated, emit exactly one inventory_unavailable finding naming the surface and the cause, exit non-zero, and emit ZERO per-invocation stale findings for that surface. Reporting every invocation in the repository as stale is a wall of false findings that discredits the guard on its first bad day and gets it switched off."
    - "DO NOT UNIFY THE TWO EMPTY-INVENTORY BRANCHES. On an empty inventory the FORWARD check correctly reports nothing and passes vacuously (BO-2900b-2 state one); the REVERSE check must refuse and suppress. Same condition, opposite correct responses. A single shared 'empty inventory' branch gets one of them wrong — and note that a genuinely empty built parser is NOT the same condition as a surface that failed to build; distinguish them explicitly."
    - "Follow the existing fail-closed convention established by BO-1700b / ADR-017 rather than inventing a second one; a gate that cannot establish its own preconditions refuses and says why."
    - "Import of a surface module must be sandboxed enough that an ImportError, a SyntaxError or a raising module-level statement yields inventory_unavailable with the cause, not a hook crash. Per the repository error-handling policy the exception must be caught by type, logged at WARNING or higher, and converted — never swallowed."
delivers_to:
  agent: python-coder
  contract: "The derived automation-script set (list[Path]) consumed by BO-2900b-3's collected_invocations, plus the inventory_unavailable finding consumed by BO-2900e-1/-2. Guarantees that adding an automation script requires no registration edit anywhere."
expects_from:
  ac_id: BO-2900b-1
  contract: "registered_capabilities(surface) and its failure mode — the seam must signal 'could not be established' as a distinct outcome from 'established and empty', because this AC's two branches turn on exactly that distinction."
test_spec:
  - name: test_a_newly_added_automation_script_is_checked_without_editing_any_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs check_reachability.main() over a fixture tree with three clean automation scripts, then drops a fourth script invoking an unregistered capability into the same location and re-runs with no other edit; asserts the fourth script is reported. A list-based implementation fails this by construction."
  - name: test_uninterrogable_surface_refuses_and_names_the_cause
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Makes the fixture surface raise on import, runs the real check, and asserts a non-zero exit with exactly one inventory_unavailable finding naming the surface and the cause."
  - name: test_uninterrogable_surface_produces_no_per_invocation_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Same run, with several valid-looking invocations present: asserts zero stale_invocation findings, so the fail-closed refusal does not come with a wall of derived false positives."
  - name: test_empty_but_buildable_surface_is_not_treated_as_unavailable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A surface that builds successfully but registers no capabilities produces the forward check's vacuous pass, not inventory_unavailable — the asymmetry with BO-2900b-2 state one is preserved."
test_rationale: "Both invariants here are about what the check DOES rather than what it computes. Derived coverage can only be demonstrated by adding a file to a real tree and re-running the real entry point with no other edit — a direct-import test of a discovery helper would be handed the paths it was supposed to discover. The fail-closed pairing is likewise a property of one whole run: an implementation that refuses but also emits the derived findings, or that suppresses the findings but exits zero, satisfies any test that checks only one half. The fourth test guards the asymmetry against the natural refactor that unifies both empty-inventory branches, which the criteria explicitly forbid."
