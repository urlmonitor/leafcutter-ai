notes: |
  AUTHORED BY THE BUSINESS ANALYST AT BRAINCANDY'S DIRECT REQUEST, including this L0
  and its L1, which are ordinarily the Product Owner's (same arrangement as GE-131).
  BrainCandy's words: "When complexity is too high, we directly spawn an agent that
  will handle the complexity" and, generalising, "We need clear instructions what to do
  if a specific guardrail hits." Kept deliberately small after BrainCandy rejected a
  13-record plan for the complexity check in favour of a 5-record one.

  MEASURED 2026-10-09 (census over the hooks manifest and the autofix routing table,
  read-only): 76 registered hooks, 67 of them pre-commit judgment gates. 18 of the 67
  have a routing rule saying who handles a refusal; 49 have none, including
  check-folder-density and check-file-size-rule-parity. 1 gate (check-complexity)
  prints a machine-readable agent hint. 2 routing rules name hooks that are not
  registered: check-docstrings and check-ac-limits.

  WHAT IS OUT OF SCOPE. Writing declarations for the 49 undeclared gates. The ACs state
  the rule and its enforcement; filling the declarations in is implementation and
  follow-up work.

  ONE L1, as with GE-131. The sparse-tree advisory is accepted.
