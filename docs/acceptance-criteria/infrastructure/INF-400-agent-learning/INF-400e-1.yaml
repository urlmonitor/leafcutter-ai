id: INF-400e-1
title: "Second-run BA produces L2 ACs that reference standing rules without being told"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the business-analyst-v3 agent ran once on component X and discovered
    that component X has a standing AC requiring "all L2 criteria must reference
    the parent L1 in depends_on",
  And that learning was captured and persisted to the component's context file
    (via the INF-400b/c pipeline),
  When the business-analyst-v3 agent runs a second time on a different L1 in component X,
  Then the agent's output L2 AC files include the standing AC reference
    in their depends_on field without the user needing to remind it,
  And the agent does not ask a clarifying question about whether standing ACs apply
    (because it already knows they do from the prior run's learning).
depends_on: [INF-400e, INF-400a, INF-400d]
