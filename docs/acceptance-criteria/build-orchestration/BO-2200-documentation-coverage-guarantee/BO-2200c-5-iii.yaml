notes: |
  This is the behaviour the EPIC-StartingNewWorkTheProperWayAlways drive died on. 22 tickets with
  `change_target: pipeline` and 3 with `change_target: docs` all received a documentation demand;
  one of the 25 owned the document it was told to produce. 22 of the remainder were pointed at the
  same page, which a later ticket in the same epic legitimately creates. Reordering cannot fix it:
  that ticket documents behaviour the others deliver, so it depends on them, and the reverse edge
  closes a cycle.

  NARROWS AN APPROVED SIBLING -- must be reconciled before implementation. BO-2200a-1 (approved,
  work_status done) states that each of `ui`, `schema`, `pipeline`, `docs` "on its own, causes
  documentation-expert to be required", and is covered by a test asserting exactly that on a
  fixture AC. If that fixture owns no document, this AC makes it fail. BO-2200a-1 needs an
  amendment recording that its trigger is necessary but no longer sufficient, and its fixture needs
  an owning doc_link. That amendment is out of this AC's scope -- see the handoff.

  ON THE FRAMING: the cited fail-closed shape (a subsection with zero parseable contract lines) is
  real but is NOT the shape this change would hit. A partial suppression already exists -- a
  parent L1 with `documentation_triggers: []` suppresses the whole documentation-expert
  subsection while leaving documentation-expert and documentation-verifier in the agents map. On
  that path the `## Agent Contracts` heading is still emitted whenever `delivers_to` or
  `expects_from` is present, so the verifier hits its "section present, subsection absent"
  rejection instead. There are three fail-closed shapes, not two:
    - no `## Agent Contracts` at all            -> verifier no-ops (the only safe rendering)
    - section present, subsection absent        -> blocker  <-- the live one
    - subsection present, no parseable lines    -> blocker
  Because `delivers_to`/`expects_from` share the section, the safe rendering is unreachable for
  most tickets. That is the concrete proof that rendering alone can never be made sufficient, and
  it is why the second Given above specifies the delivers_to case rather than the bare one.

  Worth knowing while implementing: on that same existing suppression path documentation-expert is
  still dispatched, sees no contract block, and falls through to its v1 free-text Diataxis
  dispatch -- so today the half-fix does not merely fail to suppress the demand, it produces an
  unconstrained one.
