criteria: "Given install_shims() bridges canonical tool paths into the consolidated\n\
  \  output root (ADR-004 / ADR-016) — the directory shims .claude/agents,\n  .claude/skills,\
  \ .claude/commands, .claude/hooks, .claude/workflows,\n  .gemini, scripts/commit_guardian,\
  \ scripts/doc_compliance and\n  scripts/feedback, plus the single-file shims .pre-commit-config.yaml\
  \ and\n  .claude/settings.json,\nAnd the output root sits at <target_root>/.leafcutter,\n\
  When a build creates those shims as symlinks (shim_strategy \"symlink\", or\n  \"\
  auto\" where link creation succeeds),\nThen reading each link back returns a relative\
  \ path — it does not begin at a\n  filesystem root and contains no directory name\
  \ belonging to the machine the\n  build ran on,\nAnd the relative path is expressed\
  \ from the directory containing the link,\n  not from the directory the build process\
  \ was invoked in, so a link nested\n  one level deep carries one leading parent\
  \ step and a link at the project\n  root carries none: .claude/agents reads back\
  \ as \"../.leafcutter/agents\",\n  scripts/commit_guardian reads back as\n  \"../.leafcutter/scripts/commit_guardian\"\
  , .gemini reads back as\n  \".leafcutter/gemini\", and .pre-commit-config.yaml reads\
  \ back as\n  \".leafcutter/pre-commit-config.yaml\",\nAnd every link resolves to\
  \ exactly the same file or directory inside the\n  output root as it did when the\
  \ target was absolute — the destination is\n  unchanged and only the way the link\
  \ records it differs,\nAnd after the entire project tree (both the links and the\
  \ output root they\n  point into) is moved or copied to a different absolute path,\
  \ each link\n  still resolves to its counterpart inside the relocated output root,\
  \ with no\n  link left dangling,\nAnd re-running the build over a shim that is already\
  \ relative leaves the\n  recorded target unchanged, character for character,\nAnd\
  \ re-running the build over a shim left absolute by an earlier build\n  replaces\
  \ the recorded target with the relative form, so no absolute shim\n  survives a\
  \ rebuild,\nAnd when the canonical location and the output root have no common ancestor\n\
  \  on the filesystem, so no relative path between them can be expressed, the\n \
  \ link is created with an absolute target instead and the build still\n  completes,\n\
  And when a shim is produced by the copy strategy — requested explicitly via\n  shim_strategy\
  \ \"copy\", or entered as the automatic fallback after the\n  platform refuses link\
  \ creation — it remains a copied file or directory\n  exactly as before: a copy\
  \ records no target, so this criterion imposes\n  nothing on the copy path and must\
  \ not be read as a reason to change it.\n"
