title: "risk_surface enum definition with 6 canonical values"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the guardrail engine schema defines a risk_surface field,
  When the schema is validated,
  Then the risk_surface field accepts exactly these 6 enum values:
    internal, contract, auth, privacy, safety, cost
  And no other values are accepted by the schema validator
  And each value is documented with a one-line definition:
    - internal: changes whose blast radius is confined to the owning team or module
    - contract: changes that cross a consumer-facing API boundary or integration point
    - auth: changes that affect authentication, authorization, or identity management
    - privacy: changes that affect personal data handling, retention, or consent
    - safety: changes that affect LLM output safety, content filtering, or harm prevention
    - cost: changes that affect compute spend, API call volume, or billing thresholds
depends_on: [BO-610]
