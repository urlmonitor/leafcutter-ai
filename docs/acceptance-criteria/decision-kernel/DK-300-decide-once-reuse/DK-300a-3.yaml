it_requirements:
  - 'A host''s findings and options are converted by the kernel before use: the host can cite only
    evidence ids the kernel handed it, and cannot mark an option as named in the goal or approved
    by itself.'
  - Named-option verification is deterministic code against the goal text (ADR-053); extracting the
    options from free text stays host work.
  - Every dropped citation, finding or option is reported as a limitation; nothing is dropped silently.
  - 'No kernel code change is in scope of TICKET-20261002-DecisionLifecycleACs: a behaviour gap that
    needs kernel code is closed through its own ticket. Adding covers tags or a missing test does
    not change kernel code.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
