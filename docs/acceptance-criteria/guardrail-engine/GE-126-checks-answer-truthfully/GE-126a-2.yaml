  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND IS NOT TERMINAL. What this record delivers is a VALUE, not
  a code path: a third outcome distinct from both success and refusal. GE-126a-3 must
  reproduce that same value through the seam, and GE-126a-2-i is defined as the case
  where it must NOT appear. Written as a value rather than as a function so that the
  seam implementation cannot satisfy GE-126a-3 with a fourth, similar-but-different
  outcome.

  AGENT AND ORDERING. python-coder. depends_on already carries the ordering; the
  expects_from edge to GE-126a-1 is documentation only and the sequencer does not read
  it (KI-ACD-015).

  A NOTE FOR THE CODER ON THE MIXED-TARGET ARM. Both facts have to come out of ONE
  process invocation. Two runs that each produce one of them is a different and weaker
  guarantee, and it is the shape a test author will reach for first.

