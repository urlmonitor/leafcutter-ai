estimated_complexity: S
it_requirements:
  - "Every worktree_repo_facts.py invocation the step constructs passes an explicit repository reference: `facts` via `--reference`, `base` via its positional start, `branch-standing` via `--repo`. Leaving any of them to the cwd default is the defect."
  - "The reference is derived from the run's own resolved target, which is inside the repository by construction. A fixed literal is not acceptable — it would reintroduce a location the run does not control."
  - "The fallback when no absolute target is available is the prior cwd-relative behaviour. This record may not make any currently-working case worse."
  - "Absoluteness is decided by BO-3900's `classifyPathForm`, never by a leading-slash test. A drive-lettered or UNC target is absolute without a leading slash, so `startsWith(\"/\")` would route exactly those platforms back to the cwd default this record exists to remove — and BO-3900d's scanner over the real workflow scripts refuses that expression outright."
  - "worktree_repo_facts.py itself is not modified. Its cwd default is correct for a caller that has a meaningful cwd; the defect is the step relying on a default that does not hold for a phase agent."
  - "No refusal is weakened. The absent, foreign, occupied and branch-standing refusals keep their existing conditions and discriminators; only the reference they are evaluated against changes."
