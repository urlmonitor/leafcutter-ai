criteria: |
  Given the surfaces configuration in config/paths.json
  When the configuration is loaded
  Then it contains a surface entry keyed "acs"
  And that entry's "path" value resolves to docs/acceptance-criteria/
  And that entry's "edge_fields" value lists implemented_by, covered_by,
    depends_on, and components
  And the entry sits alongside the other declared surfaces under the same
    top-level "surfaces" key, with no surface added to or removed from any
    hard-coded list elsewhere
