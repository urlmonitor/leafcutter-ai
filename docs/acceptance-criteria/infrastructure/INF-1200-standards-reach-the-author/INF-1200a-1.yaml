notes: |
  WHAT THIS RECORD IS FOR. The L1 promises the standard arrives before the work.
  The cheapest reading of "arrives" is "is reachable", and that reading is satisfied
  today and always has been — the standards sit in a configuration file any reader
  can open. This record fixes "arrives" to mean the standard is IN the brief, stated
  in full, with nothing left for the specialist to go and do.

  THE LAST ARM IS NOT DECORATION. Without it, every positive clause here is satisfied
  by pasting the whole standards declaration into every specialist's brief. That
  passes, costs nothing, and destroys the meaning of "the standards for what you are
  about to touch". It also makes INF-1200e's report vacuous, since nobody is ever
  uninformed. The exclusion belongs here rather than in c because it is what makes
  "the standard is in your brief" a statement about YOUR work.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can
  lift it verbatim into a test descriptor.

  MUTATION: replace the stated standards in the brief with a sentence naming where
  the project declares its standards and instructing the specialist to consult that
  declaration before starting work. Under that injection:
    - the "stated in full there" arm must go RED, because the specialist cannot say
      what the standard is from the brief alone;
    - the final exclusion arm must STAY GREEN, because a pointer is equally absent
      from a non-owner's brief.
  Both outcomes must be observed and both must revert. The mutation is not a
  strawman: a pointer is strictly more informative than today's silence, it is the
  first thing anyone reaches for, and it satisfies every loose reading of "the
  standard reaches the specialist".

  MEASURED, 2026-09-09, IN THIS WORKTREE. Exactly one specialist template refers to a
  size standard at all. The ownership record assigns kinds of file to two further
  specialists that refer to none. The user's own example — the kind of file they named
  in the request — falls to one of the two that are told nothing, and carries no
  declared standard either; making that statable is INF-1200b's subject, and it is
  named here only so the reader knows why this tree exists.

  DELIBERATELY NOT NAMED IN THE CRITERIA: any kind of file, any specialist, and any
  figure. Following GE-127c's precedent and the L0's altitude test, this record
  survives a specialist being added, renamed or split and a standard being retuned.
  The user's example lives in these notes and in the config edit that will express it.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The
  mutation above is written to be turned directly into a test descriptor.
