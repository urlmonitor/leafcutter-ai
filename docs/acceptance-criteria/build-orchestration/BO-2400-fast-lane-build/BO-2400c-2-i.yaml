  constraints:
    - "On TTL expiry between invocations, the next invocation must re-send the full stable prefix so the cache is re-primed (a cache-write) — it must never omit the prefix on the assumption it is still cached."
    - "The resulting cache miss must be observable in the recorded telemetry (BO-2400d), so cache behavior can be verified from the run record."
