criteria: |
  Given valid generation A is active for the repository
  And the proposed revision contains an AC record whose implemented_by list names the same test path twice
  And loading that revision yields 28,815 relationships of which 28,814 are distinct, the extra one being an identical second implemented_by relationship from that AC to that test path
  When the snapshot is published
  Then before any node or relationship of the new generation is created in the store, the snapshot holds exactly one implemented_by relationship from that AC to that test path
  And the snapshot carries 28,814 relationships
  And the publication result includes a diagnostic naming the relationship type implemented_by, the source AC record's path, the field locator implemented_by, the target test path, and the number of identical copies found, 2
  And the publication is not failed and is not refused on account of the duplicate

  Given the proposed revision contains two implemented_by relationships from the same AC to the same test path that differ in any recorded property, for example their source locator
  When the snapshot is published
  Then both relationships remain in the snapshot as two distinct relationships
  And no collapse diagnostic is reported for them

  Given the proposed revision contains no identical relationships
  When the snapshot is published
  Then the publication result reports 0 identical relationships collapsed
  And that figure is stated explicitly rather than omitted
