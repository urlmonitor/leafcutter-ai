rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.fail_then_data_ticket] fail naming the edges
    now; a separate ticket fixes the live cycles in the store (required mean 0.81, 3/6 passed); 2. [opt.fail_naming_edge]
    fail with an error naming every AC and edge kind; nothing else (required mean 0.70, 3/6 passed); 3. [opt.fail_then_marker_ticket]
    fail naming the edges now; a separate ticket adds a non-ordering marker (required mean 0.75, 2/6 passed); 4. [opt.added.1]
    Parent link yields, other cycles fail naming the edges, plus a data-fix ticket (required mean 0.53, 1/6 passed); 5. [opt.parent_link_yields]
    a child''s structural-parent depends_on yields to the parent''s expects_from on it (required mean 0.47, 1/6 passed); 6.
    [opt.expects_from_names_only] expects_from only renames ticket dependencies; it does not order the epic (required mean
    0.26, 0/6 passed); 7. [opt.depends_on_wins] depends_on wins: drop an expects_from edge whose reverse is depends_on (required
    mean 0.20, 0/6 passed). user chose option [opt.added.1] Parent link yields, other cycles fail naming the edges, plus a
    data-fix ticket (kernel rank 4 of 7).'
