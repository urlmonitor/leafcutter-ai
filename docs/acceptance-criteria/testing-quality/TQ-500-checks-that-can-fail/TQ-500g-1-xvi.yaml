notes: |
  WHEN TO USE IT. A pinned alteration that a reviewer judges unfaithful to its
  name, or a no-op (KI-BO-20261023), is locked in by the pin. Reset is the
  deliberate way out. When two readings of one name both matter, the analysis
  recommends writing two names instead, each pinned on its own.

  NAME MATCHING. The name given to the command is compared like the pin key
  (trim and case-fold, TQ-500g-1-xii).

  "NOTHING ELSE CLEARS A PIN" is about build steps. Removing the workspace
  removes whatever the workspace holds; where the pin lives is the open point
  in TQ-500g-1-xi's notes.

  OPEN FOR IT-PO. A reset while a gate run for the same work is in progress:
  the BA's default is that the running gate keeps the replacements it already
  read, and the reset takes effect from the next run.

  IT-PO ENRICHMENT (2026-10-23)
  The command is the writer's reset step (the writer owns the pins). The BA's
  default for a reset during a run is kept and enforced by the pin step's
  compare-and-swap. A reset leaves a marker so the next row can say "pin reset
  by the operator" rather than "prepared: not pinned". The operator-facing
  description belongs on the TQ-500g-5 reference page.
