id: INF-500d-5
components:
  - infrastructure
  - feedback_collector
title: "A report that could not be written is held and retried, and a run that lost many of them is not quietly torn down"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a report cannot be written to the durable location at the moment it is filed,
  And the recorded reason is one that means nothing was written,
  When the failure is recorded,
  Then the report's full content is retained in a holding place that is outside the
    temporary workspace the agent ran in and outside the durable location that could
    not be written — the operating system's temporary directory, which the record
    identifier's own fallback file already proves is reachable from every drive,
  And the agent's verdict is still delivered.

  Given a report is placed in the holding place,
  When it is held,
  Then the record identifier it will carry is minted at that moment and stored with
    the held content,
  And the marker recorded in the run cites that same identifier,
  So that the identifier an operator reads in the run is the identifier the record
    ends up having.

  Given held reports exist from an earlier failed write,
  When the next report from the same project is written successfully,
  Then the held reports are written through to the durable location as well,
  And each held report is written with the identifier it was given at hold time,
    unchanged,
  And each held report appears exactly once after the flush, with no duplicate of a
    report that had already been written.

  Given a report whose recorded reason is that the write succeeded but the identifier
    was not captured,
  When failures are collected for holding,
  Then that report is never placed in the holding place,
  So that the flush cannot duplicate a record that already exists.

  Given a run finishes and recorded more failed report writes than the configured
    tolerated share,
  When the drive reaches the point at which its temporary workspace is to be removed,
  Then removal is refused with a message stating how many reports failed to land, out
    of how many attempted, what the tolerated share is, and where the held reports
    are,
  And the refusal happens once at that boundary, not per ticket, so no individual
    phase gains a new way to be blocked,
  And the refusal happens BEFORE the workspace is removed, while the reports are
    still recoverable.

  Given the same refusal is presented and the operator judges the loss acceptable or
    has recovered the reports by hand,
  When the operator explicitly overrides the refusal,
  Then the workspace is removed and the drive completes,
  So that the check can never become a stuck state that no remediation can clear.

  Given a run's failure count is at or below the tolerated share,
  When it reaches the workspace-removal boundary,
  Then removal proceeds unchanged and no operator attention is required.
