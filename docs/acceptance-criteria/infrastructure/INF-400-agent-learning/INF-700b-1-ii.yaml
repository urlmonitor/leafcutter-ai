notes: |
  This is the AC that closes the specific way this loop died: the step declares
  itself mandatory and then permits a warning as the exit, so eight weeks of
  total silence produced no artefact anyone could count. Fail-open is retained
  deliberately — an agent's primary work must not be blocked by a knowledge
  step — but fail-open silently is not.
change_target: prompt
risk_surface: contract_boundary
