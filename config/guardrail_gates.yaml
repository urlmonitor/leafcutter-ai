# ---------------------------------------------------------------------------
# flow_change_gates
#
# Identifies (change_target, risk_surface) pairs that are "flow-change" — i.e.
# structural or pipeline-modifying changes that require design review and
# documentation planning BEFORE any coder runs.
#
# For these pairs, the mandatory_agents list is UNIONED into the computed agent
# map on top of the per-surface gate list. The risk_surface values used here
# are the legacy operational labels (production, all) that correspond to the
# highest-scrutiny scenarios; they are not constrained to ALLOWED_RISK_SURFACES
# because they represent pre-existing call-site labels used by the generator.
#
# mandatory_agents: agents that must appear in the computed agents map for this
#   pair (deduplication against the per-surface gate list is the caller's
#   responsibility).
# phase_constraint: human-readable note on the ordering requirement (enforced
#   by ticket-supervisor's canonical phase ordering, not by this YAML alone).
# ---------------------------------------------------------------------------

flow_change_gates:
  - change_target: code
    risk_surface: production
    mandatory_agents:
      - architect-review
      - documentation-expert
      - python-coder
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before python-coder (priority 6) and
      sql-coder (priority 7).

  - change_target: code
    risk_surface: all
    mandatory_agents:
      - architect-review
      - documentation-expert
      - python-coder
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before python-coder (priority 6) and
      sql-coder (priority 7).

  - change_target: schema
    risk_surface: production
    mandatory_agents:
      - architect-review
      - documentation-expert
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before sql-coder (priority 7).

  - change_target: schema
    risk_surface: all
    mandatory_agents:
      - architect-review
      - documentation-expert
      - test-writer
      - test-runner
      - pr-reviewer
    phase_constraint: >
      architect-review (priority 4) and documentation-expert (priority 10)
      must be dispatched before sql-coder (priority 7).

  - change_target: config
    risk_surface: production
    mandatory_agents:
      - status-checker
      - pr-reviewer
    phase_constraint: >
      status-checker must verify the production environment before
      config changes are merged; pr-reviewer gates the merge.
