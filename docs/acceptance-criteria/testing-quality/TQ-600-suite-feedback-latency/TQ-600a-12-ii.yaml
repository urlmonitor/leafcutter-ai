assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    OPT-IN, NEVER A DEFAULT, AND NEVER A RUN-WIDE SWITCH. An environment variable or
    configuration key that enables seeding for the whole run reaches the three
    ineligible files too, and they go green while asserting nothing. The request must
    originate at the test.
  - >-
    DO NOT REUSE OR EXTEND THE ROUTING MARKERS. shared_layout_reader and
    shared_layout_mutator decide which ROUTE a test takes. A seed decides how a root
    on the private route is PRODUCED. Folding the two together makes the seed visible
    to `_select_route` and puts TQ-600a-5's undeclared-test safety net and
    TQ-600a-2's mutator carve-out at risk for no gain.
  - >-
    INELIGIBILITY ATTACHES TO THE FILE, NOT TO A LIST OF TEST NAMES. The last clause
    is the maintenance clause: a list of 10 test names goes stale the first time
    somebody adds an eleventh, and the staleness is silent.
  - >-
    THE THREE PATHS ARE THE POPULATION AS MEASURED ON 2026-10-05; RE-DERIVE BEFORE
    RELYING ON IT. The eligibility test is whether a deploy COUNT is the subject of
    the assertion. If a fourth file acquires such an assertion, it belongs on the
    list. Record the test in the implementation, not only the three paths, so the
    next author can apply it.
  - >-
    REFUSE LOUDLY, DO NOT SILENTLY IGNORE. A request that is dropped on the floor
    reads to the requesting author as "seeding did not help", and the next step is
    someone widening the mechanism to make it work.
