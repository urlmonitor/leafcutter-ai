id: BO-1500f-3
components:
  - build_orchestration
readiness: draft
priority: high
title: "A workspace that already exists is continued only when it belongs to this same run"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given the workspace an authoring run would use already exists,
  When the run resolves that workspace, before it authors any criterion,
  Then it establishes, from ownership evidence recorded with the workspace itself, whether
    the workspace belongs to this same run resuming or to a different run,
  And it continues into the workspace only when that evidence identifies this same run,
  And when the evidence identifies a different run that is still going, the run refuses the
    workspace, names the other run and when that run started in the refusal, and halts
    before authoring any criterion,
  And when the evidence identifies a different run that is no longer going, the run reports
    the workspace to the user as recoverable -- naming the other run and what that run left
    unfinished -- and halts without taking it over, leaving the decision to the person,
  And when no ownership evidence can be found for an existing workspace, the run treats it
    as not its own and reports it rather than continuing into it,
  And in no case does the run continue into a workspace belonging to a different run without
    the user having said to.
depends_on:
  - BO-1500f
  - BO-1500f-2
