notes: |
  "Nothing drifts into the work queue by accident", made measurable in three
  steps: parked adds nothing, un-parked-but-undecomposed still adds nothing, and
  only a real decomposed and approved leaf arrives. The exclusion holds today as
  a side effect of how the scan selects leaves; this AC pins it as an intended
  guarantee so a future change to that selection cannot quietly promote every
  parked stub into the backlog.

  The 436 figure is the measured baseline on 2026-08-14, cited so the
  implementer starts from a real number; the assertion that must hold is that
  the two ready sets are identical, not that the count is 436.

  Set comparison, not count comparison — an unchanged total made of a different
  set of records is the failure this would otherwise miss.
