roadmap_phase: phase_1
criteria: |
  A pass counts as proof only once the test is shown it could have failed.

  Today the only sign that a test constrains anything is that it failed before
  the work was done. For a whole family of work that evidence cannot exist — the
  test is correct and passing from the moment it is written — and nothing else
  ever asks whether it is capable of failing at all. So a test with no possible
  failure mode sails through every stage and every gate, stays green forever,
  and is later quoted as proof that the rule it names is holding. After this
  goal, a pass is accepted as evidence only when something has demonstrated the
  test would object if the thing it guards were broken; where that demonstration
  is missing, the work reads as unfinished rather than approved.
