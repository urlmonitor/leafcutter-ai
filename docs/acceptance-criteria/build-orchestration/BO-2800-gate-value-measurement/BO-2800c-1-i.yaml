notes: |
  Genuine edge case, not a variant: without it, the safest implementation of BO-2800c-1
  (require a defect identifier) silently DROPS exactly the overrides that motivated the
  goal — the prose-only ones. Dropping them is the same signal loss recorded on BO-400d
  for the `failed` status value.
