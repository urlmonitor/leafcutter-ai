      session REPORTED that 26 schema-violating files consequently looked clean
      — that count is UNVERIFIED and must be independently reproduced before it
      is cited as fact.
    - OBSERVED: 18 checks under templates/scripts/commit_guardian/ share the
      same root-walking resolution pattern (_find_project_root / parents[]);
      many are explicitly documented fail-open.
    - CORROBORATING: setup_ticket_worktree.py create-ac-worktree itself warned
      that verify_precommit_active.py and install_pre_commit_shims.py were "not
