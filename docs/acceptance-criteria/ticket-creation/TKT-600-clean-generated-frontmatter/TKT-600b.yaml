priority: critical   # owner decision at the approval gate, 2026-09-01
roadmap_phase: phase_1
criteria: |
  As someone who turns an acceptance criterion into a ticket and then builds it, I want
  to read that ticket and know which steps its build will actually run — and to trust
  that account, because nothing rewrites it afterwards to agree with itself — so a
  ticket inside an epic finishes without anyone hand-editing it first, and when the
  build does refuse to finish one, the refusal still means something.
