title: "The test gate cannot be bypassed — a missing or failing test check leaves the PR un-mergeable"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given branch protection on main requires the lint check and the test check,
    and the protection exempts administrators (an emergency override is allowed),
  When a normal (non-administrator) pull request targeting main has not reported
    a passing test check — whether because the check is failing or because the
    check has not run at all,
  Then the pull request remains not mergeable on the normal path
  And no normal-path actor can merge it while the required lint or test check is
    absent or failing — the checks are hard-blocking for every non-administrator merge.

  Given the same pull request with a failing or missing required test check,
  When an administrator invokes the emergency override path,
  Then the administrator is permitted to force the merge through
  And this override is an administrator-only emergency exception, not a capability
    available on the normal merge path.
