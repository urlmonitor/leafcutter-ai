criteria: |
  An entry that can never match says so, instead of pretending to work.

  When what you wrote cannot possibly apply — because part of it was read as
  something you did not mean, or because it was discarded on the way in — you
  find out while you are writing it, rather than months later when the thing
  you believed was covered turns out never to have been.
