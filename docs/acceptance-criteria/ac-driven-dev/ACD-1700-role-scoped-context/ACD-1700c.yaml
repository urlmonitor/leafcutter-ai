criteria: |
  See exactly what an agent will receive -- and confirm it is complete and appropriate.

  Before a rebuild lands, a person or an agent can assemble and review the complete
  brief an agent will receive: its role instructions, the reproducible shared
  context, and the task context drawn from the requirement's relationships -- what
  it builds on, what already shipped, what depends on it, its siblings, and its
  linked docs. This makes it possible to confirm, up front, that each agent gets
  context that is both complete and right for its role.
