notes: |
  AUTHORED BY THE BUSINESS ANALYST, NOT THE PRODUCT OWNER — REVIEW THE FRAMING. This L0
  exists because the decision it carries (BrainCandy, 2026-10-09: set the AC store aside
  from the crowded-directory check, openly, not silently) had no home: the suggested host,
  GE-127, is full and is about files. Its wording is the analyst's and should be read by
  the product owner or the user before approval.

  WHY A NEW GOAL AND NOT GE-127h. Three grounds, in order of weight:
    - GE-127 HOLDS 7 OF 7 L1 CHILDREN. The store's tree-limit check refuses an eighth, and
      GE-127's own amendment record and notes say in capitals that no L1 headroom remains
      and that the next scope-shaped record needs a new L0 or a split. Raising its cap
      with a child_limit_override would spend a temporary escape hatch on a permanent
      placement and contradict a recorded decision.
    - THE SUBJECT IS DIFFERENT. GE-127's criteria begin "Files never quietly grow past
      the point where they can be understood" and every one of its seven L1s is about
      file length. Directory crowding is a sibling standard with its own check, its own
      unit and its own grandfathering rule. Filing it under a file-size goal misfiles it
      the way GE-127g's notes warn against.
    - THIS GOAL WILL HAVE MORE CHILDREN. The crowded-directory check has open subjects of
      its own (the refusal's help text under GE-120h-5's judgement; the known issue on
      its grandfather rule), so a density goal is the home they would otherwise lack.
  The sparse-tree advisory (fewer than three children) applies to this goal on day one
  and is accepted.

  IDENTIFIER. GE-133 was checked free on 2026-10-09 by: every `^id: GE-` value across the
  AC store in this worktree (highest GE-131); a grep for GE-133 across every worktree under
