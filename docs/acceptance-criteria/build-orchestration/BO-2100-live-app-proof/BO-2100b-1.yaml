id: BO-2100b-1
title: "Project toggle off means the check never runs, even when the ticket opts in"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project `skills_config.json` whose `live_surface_testing.enabled` is `false`
    And a ticket whose frontmatter sets `live_surface_test: true`
  When the ticket is authored and driven
  Then no `live-surface-tester` phase is added to the ticket's `agents:` map
    And no development server is started for that ticket
    And the live-app check does not run.
