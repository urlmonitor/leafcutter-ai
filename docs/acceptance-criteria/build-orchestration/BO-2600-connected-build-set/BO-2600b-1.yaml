notes: |
  BEHAVIOURAL DECISION (the choice BO-2600b's "left to the BA" section delegated):
  the fast lane ALWAYS excludes the structural parent. There is no per-run operator
  control and no new workflow argument. Reasoning, in the order it decided the question:

  1. An operator who wants a whole branch already has a precise way to ask for it — aim
     at the branch. The flag suppresses only the depends_on walk; the subtree union is
     untouched, so aiming at an L0 or L1 still gathers everything beneath it (this is
     what BO-2600b-1-i pins down). The "always exclude" option therefore costs the
     operator no expressiveness at all. That is what made the decision easy: there is no
     scope reachable under the per-run option that is unreachable under this one.

  2. A per-run switch still has to pick a default, and both defaults are worse. Defaulting
     to include leaves today's broken scope as what an operator gets by default and makes
     BO-2600's promise conditional on knowing a flag exists. Defaulting to exclude adds a
     documented way to opt back INTO the scope explosion the parent L0 forbids — a footgun
     whose only use case is already served by point 1.

  3. The fast lane's own promise is one criterion id in, a pull request out (BO-2400f).
     A second input for scope contradicts that, and it is the input most likely to be got
     wrong precisely when the operator is least able to check — before the run starts.

  4. BO-2600's amended L0 asks that "every way in resolves the same tight set, so the scope
     you get never depends on which entry point you happened to use." /build-ac passes the
     flag unconditionally (build-ac.md:333). Making the lane conditional would leave the two
     entry points disagreeing whenever the operator omitted the switch — the exact defect
     the amendment names.

  The library default stays False. This is a caller decision, deliberately: BO-2600a-1
  fixed resolve_connected_build_set's default as a backward-compatibility invariant, and
  changing it would silently re-scope every other caller to satisfy a preference that
  belongs to one lane.

  Measured evidence this closes (2026-08-18, verified against the live store):
    select_connected --ac BO-2400c-1-v
      -> ["BO-2400c-1","BO-2400c-1-i","BO-2400c-1-v","BO-2400c-2","BO-2400c-2-i"]
    select_connected --ac BO-2400c-1 --exclude-structural-parent
      -> ["BO-2400c-1","BO-2400c-1-i","BO-2400c-1-v"]
  Aiming at one L3 dragged in two unrelated siblings, because the leaf depends on its
  structural parent, which depends on ITS parent, which expands to every not-done leaf
  underneath.
