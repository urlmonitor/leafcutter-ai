it_requirements:
  - "THE CURRENT IMPLEMENTATION DOES NOT SATISFY THIS AC. Verified: claim_build_set reads the YAML (~line 181), tests current_status == 'in_progress' (~line 193) and writes (~line 203) with no exclusion across the three steps. Two efforts can both read todo and both flip. The existing already-in_progress detection at ~193 is exactly the check the race defeats -- it looks like protection and is not."
  - "TAKING MUST BE ONE INDIVISIBLE OPERATION against the store: no observable interval may exist between deciding the requirement is free and recording it as taken. Compare-and-set, exclusive create, or an equivalent -- the technique is the implementer's choice, the absence of the window is not."
  - "PORTABILITY CONSTRAINS THE MECHANISM. leafcutter is installed into consumer projects running on Linux, WSL2 over NTFS, and Windows. Advisory locking (fcntl.flock) is POSIX-only and is not reliably honoured on every mount this package runs on; docs/reference/feedback-concurrency.md records the same class of defect and proposes a platform-split lock. Prefer a mechanism whose atomicity does not depend on advisory locks being honoured -- exclusive create (os.open with O_CREAT|O_EXCL) and same-filesystem atomic replace (os.replace) are the portable primitives. Whatever is chosen must be exercised on the developer platform in the test contract, and its portability limits stated where it is implemented."
  - "THE EXCLUSION MUST COVER THE WHOLE READ-MODIFY-WRITE, not just the status assignment. _update_ac_work_status (~lines 113-125) round-trips the ENTIRE record through yaml.safe_load -> yaml.safe_dump, so two interleaved writers silently drop each other's edits to unrelated fields -- including ACD-2000a's adjudication trail. Protecting only the claim field leaves a lost-update defect on everything else."
  - "LOSING THE CONTEST IS AN ORDINARY OUTCOME, NOT A RUN FAILURE. Check the consumer, not just the producer: fast_lane.main()'s claim branch (~lines 990-1012) returns exit 1 only when the WHOLE set is refused, and reports an already-claimed member through the `error` channel. The loser must be routed to 'select different work'; a losing contender that aborts its drive converts a resolved race into an outage."
  - "ZERO HOLDERS IS A DEFECT, NOT A SAFE FALLBACK. Mutual back-off -- both contenders detect the conflict and both release -- satisfies 'never two holders' and is still a bug: an idle build that looks healthy. The mechanism must resolve the contest, not dissolve it."
  - "DO NOT RESOLVE CONTENTION BY ORDERING THE CALLERS. A single-writer serialisation point is acceptable only if BOTH entry points must pass through it; a scheme that works because the fast lane and the drive happen not to run together reproduces the current gap under a new name."
  - "IDEMPOTENCE AND SELF-CONTENTION. The same owner re-taking a requirement it already holds must be a no-op that leaves one owner and the ORIGINAL instant, not a refusal and not a refreshed timestamp -- ACD-2000b-3 judges staleness from that instant."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): typed except around every file operation, log-or-reraise, no bare except. A lock or exclusive-create failure must never be swallowed into 'claim succeeded'."
delivers_to:
  agent: python-coder
  contract: "An atomic take/release primitive over the claim record: take(ac_id, owner) returns granted|already_taken with the current owner when refused, never both-granted and never both-refused for a free requirement. Consumed by ACD-2000b-2-i (set claims), ACD-2000b-3 (takeover must go through the same take) and ACD-2000b-4 (take-time footprint re-verification)."
expects_from:
  ac_id: ACD-2000b-1
  contract: "The claim record { owner identity, claim instant (UTC ISO-8601), entry-point kind } and the shared take/release helper whose read-check-write this AC makes indivisible."
test_spec:
  - name: test_two_concurrent_processes_reaching_for_one_requirement_yield_exactly_one_owner
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Two real OS processes, released from a shared barrier so their attempts genuinely overlap, both invoke the real claim entry point on one on-disk requirement; asserts the record afterwards names exactly one owner and that exactly one process reported success."
  - name: test_repeated_contest_never_produces_two_holders_or_zero_holders
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Repeats the same two-process contest over a fresh requirement many times (enough iterations to hit the window reliably) and asserts every single round ends with exactly one holder -- never two, never none."
  - name: test_losing_contender_is_told_already_taken_and_does_not_abort
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Asserts the loser's result identifies the requirement as already taken and names the holder, and that its outcome is the ordinary select-other-work path rather than a fatal run failure."
  - name: test_contended_claim_does_not_drop_unrelated_fields
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Runs the contest against a record carrying a populated adjudication trail and asserts no field is lost or reordered by the interleaved whole-record rewrites."
  - name: test_same_owner_retaking_its_own_claim_is_a_no_op
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "The holder takes the same requirement again; asserts one owner and the ORIGINAL claim instant, so self-contention neither refuses the holder nor silently resets the staleness clock."
test_rationale: "The obvious test -- claim the requirement, then claim it again -- PASSES on today's broken read-check-write, because the second read observes in_progress and the already-claimed branch at ~line 193 fires. A sequential test therefore cannot distinguish the defective implementation from a correct one, and neither can two threads in one interpreter, where the GIL and shared caches can serialise the very window under test. The only honest shape is two real OS processes contending for one real on-disk requirement, released from a barrier so the attempts overlap. A single contest is also insufficient: it is a coin flip a broken implementation wins most of the time, so the repeat count is part of the assertion, and 'never zero holders' is asserted alongside 'never two' so a mutual-back-off implementation cannot pass by dissolving the contest."
