criteria: |
  Given an answer reporting 148 records covered against a total of 180,
  When a reader inspects how that figure was arrived at,
  Then the answer names the root it enumerated, the rule by which a record was
    counted as in scope, and each exclusion as a count paired with a stated ground —
    for example 24 records excluded on the ground that they are deprecated and 8 on
    the ground that they are not requirement records,
  And the covered count plus every declared exclusion count sums to the total
    (148 + 24 + 8 = 180),
  And an exclusion recorded with no stated ground is reported as an unexplained
    shortfall rather than as a legitimate exclusion,
  And a ground that is not on the published list of legitimate grounds is treated as
    no ground at all, so "excluded because the query did not reach it" cannot be
    recorded as a legitimate exclusion,
  And an answer a caller deliberately narrowed reports its narrowing as a declared
    exclusion under the ground that the records are outside the requested scope, names
    the scope, and reports BOTH figures — a run over 3 staged records in a store of
    2,784 reads "3 of 3 in scope, scope = staged paths; store = 2,784, 2,781 excluded
    as outside the requested scope" — so the scoped figure and the store figure are
    both visible and a reader can never mistake one for the other,
  And an answer that reports only its scope total, with no store total alongside it,
    does not satisfy this criterion, because a scope total alone is the very "40 of 40"
    shape ACS-1100a-2 forbids,
  And the method names the PROVENANCE of the figure: whether it was computed during
    this run or is a recorded constant carried from an earlier measurement, and, for a
    recorded constant, the date that measurement was taken — "244 of 607 finished
    records, measured 2026-08-13, recorded constant" declares both, and a recorded
    constant reported with no measurement date does not satisfy this criterion,
  And a figure recomputed on every run declares itself as computed at answer time rather
    than leaving the provenance field absent, so an answer showing no date can never mean
    either "fresh" or "unknown" depending on who is reading it,
  And the age of a recorded constant is stated with the figure and in the same place as
    the figure, so a reader learns the figure is five days old without leaving the answer
    to find out,
  And the method names any normalisation applied when matching records to what was
    observed — for instance that identifiers are stripped of surrounding quotes before
    they are joined against a bare token, per ACS-1100a-2 — so a second measurement of
    the same population can reproduce the join rather than producing a different number,
  And a stale measurement is DECLARED here and never halts here: a correctly reconciled
    answer whose recorded constant is old is still returned with its age attached,
    because age is a property of the method and not an arithmetic shortfall, and
    ACS-1100c's halt trigger stays exactly the reconciliation arithmetic,
  And the bug symptom this criterion forbids is a figure hand-typed into prose with its
    date buried in a sentence, read a year later as a current count, while a second
    measurement of the same population reports a different number and no reader can tell
    which one is newer or whether the population moved at all,
  And the method travels with the answer to its caller rather than being written only
    to an operator-facing log, so a consumer of the answer can read the exclusions and
    the measurement age it inherited.
