criteria: |
  A new commit guardian hook extends the pre-commit pipeline with diff-based
  coverage gating powered by diff-cover:

  The diff coverage hook verifies that changed lines in staged files have
  adequate test coverage, using a pre-existing coverage.xml report. The hook
  ships disabled by default, fails open when the tool or coverage artifact is
  missing, supports configurable thresholds (warn-only vs blocking), handles
  stale coverage artifacts and shallow clone environments gracefully, and
  integrates with the onboarding wizard for opt-in enablement.
