criteria: |
  Given the requirement rule check specified by ACD-2500a-1, ACD-2500a-2 and ACD-2500a-3,
  When its reference documentation is authored,
  Then it lists each of the six rule families with its disposition ("fixed" or
    "needs a decision"),
  And it states the finding format: file, record id, rule family, disposition,
  And it states the outcomes for zero records checked and for an unreadable record,
  And it names which existing store check owns each rule shared with this check,
  And it states that judging whether two contract descriptions agree stays with the
    technical planner.
depends_on:
