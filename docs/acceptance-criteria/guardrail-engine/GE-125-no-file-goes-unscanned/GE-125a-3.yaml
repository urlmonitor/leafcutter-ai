  - "THE PASSAGE DOES NOT EXIST YET — THIS IS CREATE, NOT AMEND, IF YOU ARE FIRST. Per the adjudication in GE-125.yaml's notes, the L0's premise that the current description 'is wrong after any one of them lands' was corrected during decomposition: SKILL.md contains NO description of the reduced scrutiny at all, so the reference is wrong by OMISSION. An author looking for a passage to amend will not find one. Whichever of the four documentation records (GE-125a-3, GE-125b-4, GE-125c-4, GE-125d-5) is built FIRST must CREATE the single passage; the other three amend what it created."
  - "SEQUENCING CONSTRAINT, EXPRESSED HERE DELIBERATELY AND NOT AS depends_on EDGES. Before writing, check whether the single passage already exists — a sibling documentation record may have created it. If it exists, amend it in place. If it does not, create it. Do NOT add depends_on edges between the four documentation records: per the GE-125.yaml adjudication that would couple four L1s to each other's delivery order for a reason that disappears the moment the passage exists."
  - "ONE PASSAGE, NOT FOUR. All four documentation records amend one passage in templates/skills/security-scanner/SKILL.md. Do not open a second section, and do not create a document of your own — this record's contribution is an amendment to the shared passage. GE-125d-5 owns the one-section rule for the whole goal and carries the mechanical check for it; a second home for this statement would turn that check red."
  - "THIS RECORD'S FOUR CONTENT REQUIREMENTS, and only these, are what it adds to the shared passage: (1) that there IS somewhere the check looks less; (2) the four locations by name; (3) that they are recognised as locations at the TOP OF THE PROJECT, and that a folder anywhere below the top reusing one of those names is scanned in full; (4) that the reduced scrutiny removes the opaque-token rule ONLY, with the keyword and fixed-prefix rules still applying there. Do not write the sibling records' content — GE-125b-4 owns the both-conditions-together rule, GE-125c-4 owns per-finding decisioning, GE-125d-5 owns the section-count and announcement-parity rules."
  - "NO CREDENTIAL-SHAPED LITERALS IN EXAMPLES. This file is scanned on every commit, so a realistic example would either trip the check or need a suppression of its own — and a suppression on this file would be a real blind spot. Describe the shapes in words, as the neighbouring documentation records in this tree do. Note the irony to avoid: templates/skills/ is itself one of the four exempt locations today, so a credential-shaped literal here would currently go UNREPORTED, which is exactly the defect the passage is describing."
  - "PARITY, BOTH DIRECTIONS, AS A REVIEW OBLIGATION. Check every statement added here against the SHIPPED scanner's behaviour at the time of writing — not against this AC's prose and not against the sibling ACs. Nothing claimed that the check lacks; nothing omitted that the check has. Where the reference and the implementation disagree, THE IMPLEMENTATION IS AUTHORITATIVE: raise the disagreement as a defect against the code AC that owns the behaviour and do not write the intended behaviour down as though it were the actual one."
  - "SEQUENCING AGAINST THE BEHAVIOUR. This text describes behaviour GE-125a-1 introduces, which is why depends_on names GE-125a-1 and GE-125a-2 alongside the parent. Written before that lands it documents an INTENTION, not the behaviour. Write it against the shipped result, or mark it explicitly pending and re-check it once GE-125a-1 and GE-125a-2 are both done — and note they must close as a pair, so a reference written after only GE-125a-1 may describe an entitlement that was narrowed too far."
  - "VERIFICATION IS BY REVIEW AGAINST SHIPPED BEHAVIOUR, NOT BY AN EXECUTABLE TEST, per the BA's instruction and the GE-123a-4 precedent. Do not author code tests for this record and do not add test descriptors to it. The documentation check standing in for a test: (1) the passage exists and is the only one describing when the check looks less; (2) it names the four locations and states they are recognised at the top of the project; (3) it states that a folder below the top reusing one of those names is scanned in full; (4) it states the exemption removes the opaque-token rule only and that the keyword and fixed-prefix rules still apply; (5) two-directional parity against the shipped scanner, with the implementation authoritative on disagreement."
  - "CLASSIFICATION NOTE, VERIFIED 2026-08-24 — do not 'correct' risk_surface to safety. This record is change_target docs with risk_surface contract_boundary. config/guardrail_gates.yaml maps docs/contract_boundary to [documentation-expert, pr-reviewer] and maps docs/safety to an EMPTY list, so choosing safety would silently remove ALL mandatory gating from a record whose only defence is review. The classification is deliberate. Note that the sibling documentation records GE-125c-4 and GE-125d-5 both carry docs/safety and are therefore ungated; that is raised as a caveat against those records and must not be used as precedent to change this one."
test_required: false
test_rationale: |
  This record changes prose only, so it carries no executable behaviour and
  test_required is false rather than test_spec being left empty — the BA asked for
  this explicitly and cited GE-123a-4 as the in-component precedent for how a
  review-verified documentation record is expressed. What stands in place of a test
  is the five-part documentation check recorded in it_requirements, whose last part
  is a two-directional parity review against the shipped scanner.
  Parity is the part that matters and the part a test cannot cheaply take over. A
  reference that claims the four locations are anchored at the top of the project
  when the shipped check still substring-matches reproduces exactly the false
  confidence this goal exists to remove; one that omits the exemption entirely — the
  state today — leaves a reader believing the listed rules apply everywhere.
  Mechanising that comparison would mean reading the scanner's declared location set
  and its per-path behaviour and diffing them against the document, which is a code
  AC of its own.
  IT IS ALSO ALREADY OWNED ELSEWHERE, which is the decisive reason not to duplicate
  it here. The sibling documentation record GE-125d-5 carries test_required true and
  a mechanical test_spec covering the single-section rule and check-to-section
  parity for the whole goal. Adding a competing parity test under this record would
  assert the same property from a second place against the same passage — the exact
  four-descriptions-of-one-behaviour failure the third arm of these criteria
  forbids, reproduced at the test layer.
  ONE GAP IS RECORDED RATHER THAN SMUGGLED IN: nothing mechanical prevents this
  record's contribution from being written into a deployed build output instead of
  the canonical templates/ source, and that failure is invisible in this record's
  own output. It is pinned as the first it_requirement with a build round-trip as
  the check, and raised as a recommended follow-up rather than turned into a test
  under a documentation AC.
