      "registered but wrong" are different verdicts with different enforcement ratings, and the
      script could plausibly end up neither dead nor trustworthy. A fourth position — TQ-100c-2-i
      — asserted the file did not exist at all; that claim was corrected 2026-09-07.
notes: |
  Authored by /quick-fix. Root cause: the two-axis trust ratings were assigned from the
  EXISTENCE of a hook script on disk (scripts/commit_guardian/check_ac_coverage.py) and
  from prose in the source data-map document, rather than from
  templates/scripts/commit_guardian/commit_guardian.json — the registry that decides
  which hooks actually run at commit time. check_ac_coverage.py exists but appears
  nowhere in commit_guardian.json, so it has never executed; check-predone-scope is
  registered (files_touched_reconciliation.enabled:true, strict:false) and so warns on
  every ticket commit. The regression class is "trust rating asserted from file
  presence" — the covering test closes it by cross-checking each edge's claim against
  the registry rather than re-asserting the two literal values.

  PARENT ADDED 2026-08-18 (product-owner). This AC shipped with no parent. Its home is
  KM-ADM-100a ("a connection's trust rating reflects what actually runs, and says how
  much it covered"), under the L0 KM-ADM-100. The `parent` field is explicit because
  compound-prefix ids are not resolvable by derive_parent_id() — see KM-ADM-100 notes.

  STANDING HAZARD RECORDED 2026-09-07 — THIS AC IS FALSIFIABLE BY SCHEDULED WORK ON ANOTHER
  COMPONENT, AND NOTHING PREVIOUSLY LINKED THE TWO. This AC's criteria name a specific
  script and a specific ground: the ac-tested edge is rated `enforcement: none` BECAUSE
  "its named hook check_ac_coverage.py is unregistered dead code". That is a fact about
  the registry, asserted as a requirement. BP-100n-4 (approved, high, phase_1) requires
  day-one triage to register, delete, or formally declare a non-gate EVERY commit-guardian
  script the registry does not name — check_ac_coverage.py included — on the very commit
  that lands its census. Whichever way that triage goes, this AC is affected:
    - REGISTERED and enabled: the ground vanishes and the mandated rating flips from
      `none` to `warn` under this AC's own second clause. Criteria must be amended.
    - DELETED: the edge has no named hook at all; `none` survives but the stated reason
      ("unregistered dead code") no longer describes anything that exists.
    - DECLARED A NON-GATE: `none` survives with a better ground, and this is the only
      outcome under which the record needs no change beyond a citation.
  The store holds two further positions on the same script, neither compatible with this
  one: TQ-100b-5 / TQ-100b-5-i treat it as live coverage-tag reader "R3" in a four-rule
  parity set (with ACS-1300a-1:76 recording it VERIFIED DISQUALIFIED for collapsing
  suffixed ids to their L0 root and being blind to "//"), and TQ-100c-2-i asserted until
  2026-09-07 that the file did not exist at all. Three ACs, three incompatible views, one
  script. All are now cross-linked from BP-100n-4. THE FATE OF THE SCRIPT IS NOT DECIDED
  HERE and is not this AC's to decide — it belongs to whoever runs BP-100n-4's triage. What
  is recorded here is that this AC is a stakeholder in that decision and must be revisited
  with it, rather than discovering after the fact that its criteria assert something the
  registry no longer supports. The underlying regression class this AC was written to close
  — "trust rating asserted from file presence" — is unchanged and still correct; the
  hazard is that its worked example is a moving fact.
