criteria: |
  Given a staged agent definition whose settings declare that it must verify
    the changes it makes (requires_verification is true),
  And that agent's declared abilities include the ability to create files
    (Write) but not the ability to edit existing files (Edit),
  When the commit is attempted,
  Then the consistency guard raises no objection for that agent definition,
  And the commit proceeds as far as this guard is concerned.
