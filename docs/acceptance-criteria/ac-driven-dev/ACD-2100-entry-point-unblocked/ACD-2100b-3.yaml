notes: |
  OUTCOMES 3 AND 4 OF 4, deliberately in ONE record. They are the same lookup
  producing two verdicts, and the behaviour being specified is the discrimination
  between them -- not either message on its own. Split across two records, each
  half passes with a single shared message and the defect survives; together, the
  third Then clause is unsatisfiable without actually telling them apart. Only the
  fourth outcome is a permissions problem, and it is the only one whose report may
  name the permission setting.

  THE SECOND CASE IS THE PRESERVED BEHAVIOUR. `worktree-agent` has
  `permits_shell: true` in the real registry (agent_registry.json:1368), so the
  denial case has to be constructed for the test. It is worth constructing: it is
  the one verdict the current code states correctly, and a change that makes the
  other three honest must not lose it.

  THE GATE IS NOT BEING WEAKENED. This L1 refines the reporting of the gate
  introduced by BO-1500f-1 (`work_status: done`); it does not supersede it. Any
  child that relaxes the halt to a warning is the wrong fix.

  2026-08-25 (it-po): the delivers_to contract to ACD-2100b-3-i is stated as a
  three-state lookup result on purpose. If the lookup's contract is boolean
  ("permitted or not"), the empty-collection case has nowhere to land and b-3-i is
  unimplementable without re-opening this record -- the same shape as the
  a-2 / a-2-i candidate-set contract. The constructible-registry requirement exists
  because a test that edits the project's own config/agent_registry.json to build the
  denial case mutates a real package surface and will not survive review.
