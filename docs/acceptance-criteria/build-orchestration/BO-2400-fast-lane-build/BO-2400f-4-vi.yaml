id: BO-2400f-4-vi
components:
  - build_orchestration
title: "A reported success means a landable pull request — never one with a known-failing required check"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run that has opened a pull request,
  When the run reports its outcome,
  Then an outcome of success asserts both that the pull request exists and that no merge
    check the repository requires is, to the run's own knowledge, unsatisfied for it,
  And given a run that knows a required merge check is unsatisfied — for example a
    required changelog entry it did not produce — the reported outcome is a blocker naming
    that check and the pull request, not a success carrying a warning,
  And the reported outcome distinguishes "pull request opened and landable" from "pull
    request opened but blocked", so an operator who reads only the outcome is never told a
    blocked pull request was delivered.
