notes: |
  WHO RUNS THE STEP (L1 constraint 2) -- BA RECORDS THE USER'S DEFAULT, to be confirmed at the gate
  (question Q1): the commit agent still receives every commit dispatch; its brief shrinks to "author
  the message if none was given, run the step, relay its JSON, apply autofix judgement on
  hook_failed". Message authoring and autofix judgement stay agent work; staging, recording,
  retry budget and branch refusal move into the step.

  The verbatim relay is the C2 lesson: an agent that summarises the answer re-creates the
  unreadable-reply fallback. Template-text tests are the strongest proof available for an LLM
  surface (BO-2400a-1-i's test_rationale makes the same argument).

  IT PO 2026-10-14 -- LAYERING WITH BO-3800a. Shared step = deterministic staging, checks and the
  answer (including remedy / handoff). Commit agent (this record) = runs the step and relays;
  "applying the autofix judgement BO-210 / BO-3800 assign" means: own-context mechanical fix then
  a fresh call, repeatable up to max_automated_fix_retries (config, default 3), or return the handoff for an engage-specialist disposition (it cannot spawn at
  depth 1). Depth-0 caller = commit.js for /commit, each workflow for its own commits, the drive's
  phase loop for builds: engages the specialist at most once and re-offers the identical commit.
  The engage-then-re-offer loop must be one shared block (BO-4500a-5 it_requirements), not typed
  into each workflow.
