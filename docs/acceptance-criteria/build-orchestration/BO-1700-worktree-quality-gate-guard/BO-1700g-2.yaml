    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  Check D must ATTRIBUTE the token to the canary hook's own execution (e.g. run
  only the canary hook by id and assert the token in that invocation's captured
  output), not scan arbitrary content for the token string. Prevents a spoofed
  token from producing a false pass. Implemented in the shared probe helper
  (BO-1700a-1); fail closed (BO-1700b-1); ADR-001 deployed/template parity applies.
