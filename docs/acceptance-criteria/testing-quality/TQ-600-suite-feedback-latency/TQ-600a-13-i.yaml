notes: |
  The prior analysis recommended against deselection and this record agrees with it.
  Its purpose is not to enable the exclusion but to make sure that if the exclusion is
  chosen anyway, the choice is made with its cost attached. The suffixed tests in the
  suite-performance directory are the only quick warning that the shared-layout routing
  has started handing mutators the shared root, and that failure presents as unrelated
  tests failing nondeterministically for unrelated-looking reasons — the most expensive
  kind of bug this suite can have.

  If the parent takes the documents branch, mark this record satisfied without building
  it, and record which branch was taken so a later reader does not mistake a vacuous
  satisfaction for an untested one.
