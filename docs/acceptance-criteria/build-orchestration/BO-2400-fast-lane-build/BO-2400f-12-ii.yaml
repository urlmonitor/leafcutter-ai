test_required: true
test_spec:
  - name: test_fully_producible_set_proceeds_to_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Executed under the E2 harness with a set of ordinary code criteria, the run records the claim and test-writer dispatches and returns no refusal."
  - name: test_draft_readiness_set_is_not_refused
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "A set whose members are readiness draft, with an otherwise identical shape, produces the same dispatches as an approved set — the check does not read readiness."
  - name: test_undeclared_members_default_to_producible
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Against an on-disk fixture store of records carrying neither a stated proof obligation nor a stated producer, the resolver's verdict lists no unproducible members."
test_rationale: |
  A refusal gate is trivially satisfiable by refusing more than it should, and the
  failure is asymmetric: a false refusal costs one resolution and looks like caution,
  so nobody files it, while the lane quietly stops building work it can build. These
  three tests are the only thing standing between a correct gate and one that has
  become a second approval filter. They must execute the lane and assert on the
  presence of the downstream dispatches — asserting merely that no refusal string
  appears is satisfied by a run that crashed.
