title: "Challenge failure (irreducible complexity) accepts high and routes to deeper model"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the complexity challenge (BO-640-1) has been triggered for a ticket with
    estimated_complexity: H,
  When the IT PO responds that the complexity is irreducible with a justification:
    "This ticket involves novel cross-cutting architecture that cannot be decomposed
     without losing coherence",
  Then the ticket's estimated_complexity remains H
  And the ticket is routed to the deeper-reasoning model tier (Opus-class)
  And a rationale field records why complexity was accepted:
    "Irreducible: <IT PO's justification>"
  And the challenge step is recorded as completed (not skipped) in the audit trail

  Given the IT PO responds with "cannot decompose" but provides no justification,
  When the challenge gate processes the response,
  Then it requires a justification before accepting high complexity:
    "A rationale is required to accept high complexity. Why can this not be decomposed?"
  And the ticket does not proceed to agent dispatch until a justification is provided
