criteria: |
  Single authoritative definition for every shared behavior pattern.

  Each recognized pattern — whether an atomic component like a sortable table
  or a composite like a CRUD list page wired to a paginated collection — has
  exactly one AC that defines its behavior. All consuming pages reference this
  single definition. The pattern definition lives in the existing component
  registry; no separate catalog is needed.
