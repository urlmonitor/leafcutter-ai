criteria: |
  Given a documentation-required ticket whose resolved phase order includes
    `python-coder`, `test-runner`, `documentation-expert`, and `documentation-verifier`,
  When the phase order is evaluated,
  Then the index of `documentation-expert` is greater than the index of `python-coder`
    and greater than the index of `test-runner` (docs are written after the code exists
    and after tests run).
  And `documentation-verifier` is the last phase before the commit phase.
