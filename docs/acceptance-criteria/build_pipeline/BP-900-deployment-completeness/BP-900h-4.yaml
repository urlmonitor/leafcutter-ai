assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  reference_file_path: ".github/workflows/ci.yml"
  n_location_rule: "1 — one declaring-file inspection step in the consumer-simulation job, iterating a DERIVED inventory. The number of files inspected must come from that inventory, never from hand-written per-file steps; a step per known file is the hand-maintained list this AC exists to remove, wearing YAML."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir /tmp/lc-consumer-probe"
    - "env -u PYTHONPATH python /tmp/lc-consumer-probe/.leafcutter/scripts/commit_guardian/check_doc_frontmatter.py docs/known-issues/build-pipeline.md"
    - "env -u PYTHONPATH python /tmp/lc-consumer-probe/.leafcutter/scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-4.yaml"
    - "python -m pytest unit_tests/portability/ -q"
  config_schema_fragment:
    type: object
    description: "The declaring-file inventory record the inspection walks, one entry per (guardrail, declaring file) pair. It is a record rather than a bare path list because the criterion demands a missing file be named together with the guardrail that reads it and the location it was expected at, and because the ownership classification - ours to ship versus the operating system's - must be an asserted property rather than a rule buried in a filter."
    required:
      - declaring_file
      - read_by
      - expected_at
      - ownership
      - derivation
    properties:
      declaring_file:
        type: string
        description: "The file the guardrail reads. May be non-code or a helper module; both halves of the 2026-08-25 reproduction are in scope and an inventory limited to JSON misses the module half."
      read_by:
        type: string
        description: "The deployed guardrail that reads it. Required by the criterion's naming clause and by the fact that a bare missing-path report tells the author nothing about who broke."
      expected_at:
        type: string
        description: "The path under the scratch install's deployed output root where it must be found, and the only path a resolution may return. Asserting on this rather than on exit code is what distinguishes an inspection that failed for the right reason from one that failed while pointing at the package checkout."
      ownership:
        type: string
        description: "ours_to_ship or external. The classification the does-not-manufacture-failures clause turns on. An entry with no ownership value is a filter decision made silently, and a filter that excludes everything satisfies the exclusion clause exactly as well as a correct one."
      derivation:
        type: string
        description: "How this entry was derived from the deployed guardrail rather than typed in. Present so a hand-written inventory is visible as such in the report instead of passing as a derived one."
  constraints:
    - "THE INSTALL MUST BE A GENUINE ADOPTER LAYOUT, AND ITS DEFINING PROPERTY IS AN ABSENCE. On 2026-08-25 a real consumer install was built at a scratch root with the package checked out at leafcutter-ai/ (the directory name CLAUDE.md documents) and `python scripts/build.py --target-dir <consumer root>` run against it. In that install neither `<consumer>/config/` nor `<consumer>/leafcutter/` exists - confirmed by direct listing - and that absence is precisely why the two hardcoded candidates in the doc-types ancestor walk both miss. A fixture in which either directory exists is not this layout and is green on the install that shipped broken. Assert the absence as a fixture precondition, not as an incidental property."
    - "THE TWO REPRODUCED BLOCKERS ARE THE FIXTURE'S ACCEPTANCE SET, AND BOTH MUST BE RED BEFORE ANY FIX. From that install: `python .leafcutter/scripts/ac_store/validate_ac_schema.py <ac>.yaml` raises ModuleNotFoundError for _ac_components (validate_ac_schema.py IS deployed; its helpers _ac_components.py and _component_migration_map.py are not), and `python .leafcutter/scripts/commit_guardian/check_doc_frontmatter.py <doc>.md` raises FileNotFoundError naming .leafcutter/scripts/commit_guardian/config/doc_types.json. If the fixture is green on either before the implementation lands, the fixture is resolving against the package tree and every assertion built on it is worthless."
    - "COLD PROCESS, PACKAGE SOURCE TREE OFF sys.path. Every existing unit test in this family imports from the source tree, which contains every module and every config by construction - that is why five prior instances of this class stayed green. A test that imports from scripts/ does not satisfy this AC. Launch the inspection and every probe as a subprocess whose working directory is not the package tree and whose interpreter search path contains no path under the package checkout, and assert that property of the child process rather than assuming it."
    - "ADDING THE NAMED FILES IS NECESSARY AND NOT SUFFICIENT. The register's rule applies verbatim: treat adding the module or the config to the deploy list as a fix for the instance, never for the defect. The same deploy list has been patched four times for this class, five of its eleven entries carry a warning comment about that specific module, and a sixth instance surfaced on 2026-08-25 - check_ac_parent_covered_by.py cannot import derive_parent_id in a deployed layout and exits 0 silently. Reachability must hold by construction or by a gate that fails, never by someone remembering. The inspection must be shown to go red on a tree where any inventory entry is withheld, whichever entry that is."
    - "IDENTIFY THE ENFORCEMENT POINT THAT ACTUALLY GATES, AND NAME EVERY ONE THE CHANGE TOUCHES. This inspection is only as strong as the CI step that consumes its exit code. Name in the sign-off every place the verdict is surfaced and state which one is load-bearing; a verdict routed only through a step that logs, or through a step carrying continue-on-error, is a no-op with a report attached. The same trap exists on the build side, where the deploy_map skip branch logs at WARNING and continues."
    - "WHATEVER THE INSPECTION SURFACES ON FIRST RUN MUST BE ENUMERATED, NOT SKIPPED. Turning this on will reveal a pre-existing set of unreachable declaring files larger than the five in the 2026-08-18 record and the two reproduced on 2026-08-25. That is the intended effect. List the full set in the sign-off and resolve each entry or defer it explicitly with a date. A skip list reintroduces the hand-maintained list inside the mechanism built to remove it."
    - "STAY LOUD - DO NOT RESOLVE A MISSING DECLARING FILE BY NARROWING THE RULE. The fail-closed posture on the document type vocabulary was established deliberately by GE-118c, which removed exactly such a fallback; the sibling diagram-types walk still returns None and degrades silently to a built-in constant and is the next instance waiting. A change that makes the inspection green by restoring a narrower built-in list is a regression even though the error disappears. BP-900h-4-i owns this prohibition in full; it is repeated here only as a bound on what an acceptable fix for THIS AC may do."
    - "PACKAGE-DIRECTORY NAME INDEPENDENCE IS BP-900h-4-i's, NOT THIS AC's - BUT DO NOT FORECLOSE IT. h-4-i owns the layout matrix and the rule that no candidate path may spell a package-directory name, because the same lookup fails differently under different adopter names: with the package at `leafcutter/` the second candidate resolves in a main checkout and fails inside a git worktree, and with it at `leafcutter-ai/` it fails everywhere. Both adopter reports were correct. Build this fixture so h-4-i can parameterise it by layout - the package-directory name and the deployed output root must be inputs to the fixture, not constants inside it - and do not stand up a second fixture there."
delivers_to:
  agent: python-coder
  contract: "A consumer-layout install fixture whose declaring-file resolution is anchored to the deployed output root alone, plus the per-guardrail declaring-file inventory it inspects. BP-900h-5 invokes the guardrails inside this same fixture rather than standing up a second one."
expects_from:
  ac_id: BP-900h-1
  contract: "The empty-project consumer-simulation install and its build invocation, which this AC constrains further rather than replacing."
test_spec:
  - name: test_bp_900h_4_every_declaring_file_of_every_deployed_guardrail_is_present_under_the_scratch_deployed_root
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Build the real scripts/build.py --target-dir into a tmp scratch project that holds only a minimal skills_config.json and that is NOT a descendant of the package checkout, then assert that for every guardrail the package deploys, every declaring file it reads exists and its os.path.realpath is under that scratch deployed output root. TWO NON-VACUITY ASSERTIONS ARE MANDATORY, because a for-each over an empty inventory is green on a broken install: assert the per-guardrail declaring-file inventory is non-empty, and assert it contains the five files confirmed absent on 2026-08-18 - the two type vocabularies read by the document-frontmatter guardrail, config/ac_store_schema.json read by the AC-schema guardrail, config/agent_registry.json read by the planning workflow, and the component-migration helper module. This entry is expected to be RED at authoring time; if it is green before any implementation exists, the inventory is empty or the fixture is resolving against the package tree."
  - name: test_bp_900h_4_ci_inspection_runs_through_its_real_entry_point_and_its_nonzero_verdict_is_not_swallowed
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT. Invoke the declaring-file inspection as a SUBPROCESS through the same command line the CI job runs - never by importing the inspection function - against the scratch install, and assert exit 0 on a complete install. Then assert the consumption half by parsing .github/workflows/ci.yml as YAML: the step that runs this inspection invokes that identical command and does NOT carry continue-on-error true, so a non-zero verdict actually fails the job. Parse the workflow into a data structure and assert on the step's fields; a grep for the script name in the file text is green on a step that is continue-on-error, which is the TQ-100 L-4 defect."
  - name: test_bp_900h_4_inspection_goes_red_when_one_declaring_file_is_deleted_from_the_deployed_root_after_a_green_build
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE NEGATIVE CONTROL THE CRITERION DEMANDS, and the load-bearing entry of this contract. Three runs of the SAME subprocess entry point against the SAME scratch install: (1) after a successful build, exit 0; (2) delete exactly one declaring file from the deployed output root and re-run - assert non-zero AND that the output names all three of the deleted file, the guardrail that reads it, and the deployed location it was expected at; (3) restore the file and re-run - exit 0 again. Run 3 is what makes the red in run 2 attributable to the deletion rather than to a fixture that had already broken. An inspection that stays green on a deliberately incomplete install proves nothing, so a contract without this triple would be worse than none."
  - name: test_bp_900h_4_a_declaring_file_present_only_outside_the_deployed_root_is_still_reported_missing
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "THE RESOLUTION RULE, which is the clause the whole AC turns on. With one declaring file ABSENT from the scratch deployed output root, plant a readable decoy copy of it in each of the three places that made the original defect invisible - the parent directory of the scratch install, the package checkout, and the working directory the subprocess is launched from - and assert the inspection STILL reports the file missing and names the expected location under the deployed output root, never any decoy path. Assert on the reported expected location, not merely on the exit code: an inspection that fails for the right reason and one that fails while pointing at the package checkout are indistinguishable by exit code. A plain does-this-path-exist check passes this test only if the scratch install is genuinely outside the package tree - hence the fixture constraint in entry 1."
  - name: test_bp_900h_4_a_file_owned_by_the_operating_system_or_an_external_tool_is_not_reported_as_missing
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The does-not-manufacture-failures half. Give the inventory a guardrail whose reads include an absolute operating-system path and a path owned by an external tool the package does not ship, neither of which is present under the deployed output root, and assert the inspection reports neither as missing and still exits 0 for an otherwise complete install. Pair it with the control that a package-owned declaring file at a comparable location IS reported missing - otherwise the exclusion can be satisfied by an inspection that excludes everything."
test_rationale: |
  The layout under test is the whole subject of this AC, so the fixture is load-bearing
  in a way the assertions are not. Every build test to date installs into leafcutter's
  own self-hosted workspace, where the package source tree sits beside the deployed
  output root and each of the five missing files resolves anyway. Any of these five
  entries, run against that layout, is green on the exact install that shipped broken.
  The scratch project must therefore be created outside the package checkout, and the
  subprocess must be launched with a working directory that is not the package tree —
  those two properties, not the assertion text, are what make the tests falsifiable.

  Entry 4 is the one that cannot be replaced by a cheaper test. A presence check
  (does this path exist) satisfies entries 1, 2 and 3 and is precisely the
  implementation the criterion rules out, because in the self-hosted workspace it
  passes for the wrong reason. Only planting a decoy at each of the three resolution
  sources — ancestor directory, package checkout, process working directory — and
  asserting the file is still reported missing distinguishes an anchored resolution
  from an accidental one.

  Entry 3 carries the criterion's own demand that the inspection be demonstrated to
  fail, and it is written as a three-run sequence rather than a single red assertion.
  A two-run delete-and-fail pair cannot separate a working guard from a fixture that
  had already broken; the restore-and-pass third run is what attributes the red to the
  deletion. This is the same discipline BP-900g-8 applies to its build subprocess entry
  and BP-900h-1 applies to its unresolved-reference case.

  The non-vacuity assertions in entry 1 are not defensive padding. The failure shape
  this AC exists against is a check that has no opinion about data files at all, and a
  derived inventory that comes back empty produces a passing for-each loop over nothing
  — a success-shaped result from a run that checked nothing, the same shape as the
  bare-directory validator no-op recorded in CLAUDE.md. Asserting the inventory is
  non-empty and contains the five named regression files is what closes it.

  Angles: criterion, reachability, deployed, failure — at the cap of four. seam and
  real_artifact are not charged: this AC has no producer-consumer signature boundary,
  and its input is a directory tree rather than a serialized artifact another tool
  writes. boundary is not charged because the criterion names no range, count or limit.
