id: TQ-600a-13-xxiv
components:
  - testing_quality
  - knowledge_management
title: "The pull request's Proof-of-done check still runs the live-database tests of the criteria that pull request changes, unchanged by the post-merge lane"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that today the pull request's Proof-of-done check starts disposable graph-database
    instances and executes the live-database tests covering the acceptance criteria that
    pull request changes, so a criterion cannot be merged as done until its live-database
    test has passed against a real database,
  And the owner's decision that this stays: the post-merge live-database lane of
    TQ-600a-13-xxi is added on top of it, not instead of it, because moving the proof to
    after merge would let a criterion merge as done with its live-database test never
    having passed,
  When a pull request changes a live-database criterion to done and the Proof-of-done check
    runs on it, both before and after the live-database lane is added to the post-merge run,
  Then the Proof-of-done check starts the same disposable database instances and executes
    the same live-database tests — those covering the changed criteria, and no others — as
    it did before the lane was added,
  And its pass or fail outcome for that pull request is the same as before the lane was
    added: a criterion whose live-database test fails still blocks the pull request,
  And the Proof-of-done check never reads the post-merge lane's verdict, so a green
    post-merge live-database lane cannot stand in for a criterion's own proof, and a red one
    does not change the Proof-of-done outcome of an unrelated pull request (that is the
    hold's job, through `Post-merge suite status`),
  And a pull request that changes no live-database criterion starts the same databases in
    its Proof-of-done check as before (today: on every pull request),
  And this is demonstrated by executing the Proof-of-done selection on two recorded pull
    requests — one changing a live-database criterion to done, one changing none — and
    comparing the tests selected and the outcome with the same pull requests judged before
    the change, never by reading the workflow file for a service definition.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-xxi
