title: "Removing a drive deletes both its working copy and its feature branch"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800a.yaml"
criteria: |
  Given a drive was created as an independent clone with its own feature branch,
  When the drive is removed via the lifecycle `remove` operation,
  Then the drive's entire working-copy directory (including its own `.git`) is
    deleted from disk,
  And the drive's feature branch is deleted,
  And no `git worktree remove` / `git worktree prune` bookkeeping against a shared
    repository is required, because the drive was a standalone clone rather than a
    worktree.
depends_on: [BO-1800a]
