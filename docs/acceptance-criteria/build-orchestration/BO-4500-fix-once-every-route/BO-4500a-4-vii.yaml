notes: |
  Authored by /quick-fix. Root cause: The 'waiting for input' detection is a silence timer: run_without_input() kills the commit's process group after `limit` seconds with no output and reports check_awaited_input. But the commit is already started with stdin=subprocess.DEVNULL, so no hook can block on keyboard input: a read gets end-of-file at once. Silence therefore never means 'awaiting input'; it only means 'slow', and the step kills correct commits. Fix (BrainCandy approved 2026-10-21): (1) keep stdin=DEVNULL and close the remaining interactive paths in the commit's environment: GIT_TERMINAL_PROMPT=0 and GIT_EDITOR=':'; (2) replace the silence timer with an overall wall-clock backstop for a genuinely hung commit, read from config (a new key, e.g. commit_time_limit_seconds, default 1800, replacing input_wait_limit_seconds), reported under its own step_ reason code (e.g. step_timed_out, added to the step family in config/commit_step.json reason_codes) — never check_awaited_input; (3) stop reporting check_awaited_input from silence (retire it, or keep it only for a case that is actually provable). This amends the approved requirement BO-4500a-4-iv, whose criterion defines 'waiting for input' as no output for input_wait_limit_seconds: author the new requirement as a child that amends it (amended_by on BO-4500a-4-iv), and update its tests rather than leaving them asserting the silence rule. config/commit_step.json and its schema must change together with the code; keep the vocabulary in config, not code (BO-4500a final-gate decision).

  Placement: the AC schema stops at L3, so a child of the L3 BO-4500a-4-iv is not
  representable. This record is an L3 sibling under BO-4500a-4 (the one-answer contract L2;
  BO-4500a holds its five-L2 cap, L3s are uncapped) and amends BO-4500a-4-iv, which records
  the amendment in its amended_by. It supersedes -iv's fourth scenario (the 60-second
  wait for keyboard input) only; -iv's attribution scenarios stay in force.
