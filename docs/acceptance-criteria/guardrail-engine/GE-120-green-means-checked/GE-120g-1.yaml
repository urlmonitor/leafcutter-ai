notes: |
  GREEN ON ARRIVAL ON THE KNOWN MECHANISM, AND GREEN HERE FOR A SECOND REASON THAT IS
  WORSE. Half of this criterion already ships: the shared runner no longer lets a delegated
  check leave byproducts beside the installed checks. Zero tests assert it — verified in
  this worktree 2026-09-07, the whole-suite grep for the setting and the environment helper
  returns exactly one hit and it is a test harness configuring its OWN subprocess, not an
  assertion about the runner. So an ordinary red-baseline run comes up green and proves
  nothing.
  THE SECOND REASON IS THE TRAP: this repository's own exclusion file passes over the
  byproducts entirely (verified 2026-09-07, .gitignore lines 41-42), so the first Given is
  FALSE here and the mutation below is silently inert. A mutation proof run in this
  repository and reported as passing is a false green about a false red. The fixture must be
  constructed to the fresh-install shape explicitly; it cannot be this repository as it
  stands.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSES — EXECUTE IT, DO NOT DESCRIBE IT. The two
  clauses "the working copy's tracked content is identical to what it was before" and "the
  attempt has left nothing new of any kind beside the installed checks" both assert an
  absence, and both are green on any implementation on which nothing ever changes anything.

    SEEDING (mandatory, and the order is load-bearing). Build a working copy in the
    fresh-install shape: the checks installed, and NO exclusion entry covering what a
    delegated check writes beside them — in particular no entry for the interpreter's
    compiled-module cache directory or its files. Then, IN THIS ORDER: (1) run one check
    once, so the cache directory and its files come into existence beside the installed
    checks; (2) `git add -A`, so those files become tracked content; (3) commit that as the
    fixture's baseline. Seeding BEFORE the run stages nothing, the fixture then holds no
    tracked byproducts, and the mutation passes — which is the specific way this proof fails
    quietly.

    INJECTION: revert the runner's environment helper so the delegated check process is
    launched bare, with no environment argument at all — the state before the shipped fix.
    Under that injection, in the seeded fixture, an ordinary commit of a change every check
    accepts must be REFUSED and the tracked byproducts must differ after the attempt. Revert
    must restore both the untouched tree and the completed commit.

    IF THE MUTATION DOES NOT GO RED, THE FIXTURE IS WRONG — NOT THE RECORD. Treat a green
    mutation run as a defective fixture and fix the fixture before believing any result from
    it. The two ways it goes quietly are: an exclusion entry still covering the byproducts,
    and seeding performed before the first run rather than after it.

  WHY THE REFUSED-ATTEMPT CLAUSE IS HERE AND IS NOT GE-120g-2's. The second half of this
  criterion asserts the tree is untouched on the path where a check DOES object. It is the
  same guarantee applied to the other path, and it is what stops this record being satisfied
  by an implementation that leaves the tree alone because nothing ever looks at anything: the
  checks that left the working copy untouched are demonstrably the same checks that were able
  to refuse. What it deliberately does NOT assert is WHY the refusal happened — the
  provenance of a refusal is GE-120g-2's whole subject and is not restated here.

  THE FIRST GIVEN IS A CONDITION, NEVER A REMEDY. "A working copy that excludes nothing from
  version control" is written into the Given precisely so the guarantee cannot be discharged
  by adding an exclusion. See the BP-900 doc_link: the missing exclusion file in a fresh
  install is a real gap with a real owner, and it is not this one.

  NO COUNT MAY BE STATED OR IMPLIED, BY THIS RECORD OR BY ANY TEST OF IT. How many judging
  checks alter the working copy by some route other than the compiled-module cache has not
  been measured, and the parent forbids assuming it. The criterion is written over "every
  check whose declared role is to judge" without asserting how many of them the shipped fix
  already satisfies. A descriptor that pins a number is out of contract.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's; the named mutation and its
  seeding step above are written to be turned directly into test descriptors, and losing the
  seeding step makes this record untestable in practice.
