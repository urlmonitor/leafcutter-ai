criteria: |
  Given /flows?q=selected+option&actor=human is open and the tab has one history entry,
  When the person clicks the step row 'Reuse it, or decide anew?' under Retrieving a decision
    as precedent,
  Then a second history entry /flows/leafcutter/decision-retrieval?step=offer-reuse is added,
  And Retrieving a decision as precedent is drawn with the 'Reuse it, or decide anew?' drawer
    open, the filters Real, Data, All and a breadcrumb of only that flow,
  And Back returns /flows?q=selected+option&actor=human with the same search, the
    'Actor: Person' chip and the same '2 flows, 5 steps match' results,
  And Forward returns the flow with the same drawer open,
  And clicking the Retrieving a decision as precedent flow card instead adds an entry at
    /flows/leafcutter/decision-retrieval with no drawer open.
