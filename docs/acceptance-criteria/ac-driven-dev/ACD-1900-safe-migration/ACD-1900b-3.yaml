title: "A gate's verdict is driven by the resolved spec, never a fixed pass"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a gate running against a thinned ticket whose source_ac resolves to a store AC
    whose criteria are deliberately unmet by the work under test,
  When the gate executes,
  Then the gate returns a blocking verdict because it consumes the resolved spec in
    its control flow,
  And when the same work is changed to satisfy the resolved criteria, the gate returns
    ok -- proving the verdict tracks the resolved spec and is not a fixed pass.
