criteria: |
  Given a project config containing:
    - tickets_inbox_path = "leafcutter-ai/tickets/00_inbox"
    - tickets_todo_path = "leafcutter-ai/tickets/01_todo"
    - tickets_done_path = "leafcutter-ai/tickets/99_done"
    - tickets_rejected_path = "leafcutter-ai/tickets/99_rejected"
  When the build system scaffolds the ticket lifecycle directories
  Then it creates "leafcutter-ai/tickets/00_inbox/" (not "tickets/00_inbox/")
  And it creates "leafcutter-ai/tickets/01_todo/" (not "tickets/01_todo/")
  And it creates "leafcutter-ai/tickets/99_done/" (not "tickets/99_done/")
  And it creates "leafcutter-ai/tickets/99_rejected/" (not "tickets/99_rejected/")
  And no directories are created under "tickets/" at the workspace root
