  contract: "The uncalled_capability_finding record and the forward check's exit-code contract; this AC constrains the ways_forward content of that record and the passing outcome of the same-change adoption case."
test_spec:
  - name: test_capability_and_caller_added_in_the_same_change_pass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs check_reachability.main() over a fixture tree where `verify` is registered on the surface and invoked by an automation script in the same working-tree state; asserts a zero exit code and no findings. Written and asserted FIRST so a refuse-everything implementation cannot pass the set."
  - name: test_capability_added_alone_is_refused_and_names_both_ways_forward
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Same fixture with the invocation removed; asserts a non-zero exit code and that the emitted text names both wiring the invocation in this change and recording an exemption for `verify`."
  - name: test_refusal_text_never_offers_disabling_the_check
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Asserts the refusing run's output contains no 'SKIP=', no '--no-verify' and no environment-variable bypass name."
test_rationale: "The adoption trap is a property of WHICH tree state the check reads, and no direct-import unit test can see that: a helper handed two sets returns the right answer whether the sets came from the working tree or from HEAD. Only running the real entry point over a fixture tree in the same-change state distinguishes a survivable guard from one that makes the natural workflow impossible. The positive case is executed first and asserted in the same suite as the refusal so a refuse-everything implementation — which satisfies a negative-only test — is excluded."
