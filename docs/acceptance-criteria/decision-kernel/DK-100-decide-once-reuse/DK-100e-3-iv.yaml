notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-retrieval  branch  evidence-only

  DERIVATION. Branch evidence-only, condition "the new decision already has
  options". "Supplies its own options" covers a typed decision request with
  options (docs/how-to/run-the-decision-kernel.md, Step 3). Whether options a goal
  merely NAMES count as the decision's own at the time the precedent is judged is
  not fixed by the flow; raised as a question in the BA sign-off.

  IT-PO BUILD STATUS (2026-10-02, unverified): built and tested for options supplied in
  a typed request. Goal-named options do not count: they are not known when the
  precedent is judged, so the reuse question can still appear.

  BA QUESTION 2, ANSWERED (2026-10-02): only options supplied with the task count as the own
    options of the decision. Options a goal merely names do not count when the precedent is
    judged, so the reuse question can still appear for such a goal. This matches what is
    built.
