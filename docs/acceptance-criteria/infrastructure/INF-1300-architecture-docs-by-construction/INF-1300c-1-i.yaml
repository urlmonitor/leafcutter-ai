it_requirements:
  - "The state shown in an entry must be read from the document's own frontmatter at the moment the entry is written or refreshed, never carried from a value captured at creation and never inferred from the request, so an entry cannot state a status the document has moved on from."
  - "A document is eligible for listing regardless of its declared state. No status value may be used as a filter that suppresses the entry."
  - "Refreshing an entry must reuse the identity and position established by INF-1300c-1 so a state change updates the existing entry rather than adding a second one."
  - "This record's behaviour contradicts write-c4-diagram SKILL.md section 8 as written ('Do NOT update the README for status: draft docs'). Implementing it without the paired surface correction leaves the shipped behaviour and the shipped instruction disagreeing; the correction is INF-1300e-2's and must land in the same release."
  - "The set of states an entry can show must be derived from the project's declared document status vocabulary rather than from a literal list held in the producer or in the tests."
  - "Failures reading the document's frontmatter must follow the project error handling policy in CLAUDE.md and must not silently fall back to omitting the entry."
test_spec:
  - name: test_freshly_produced_draft_document_is_listed_with_its_state_shown
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Run the real CLI with the listing requested in a git-initialised temporary project. Assert an entry appeared for the newly produced document and that the entry displays the status the produced document's frontmatter declares."
  - name: test_unsettled_document_is_not_omitted_from_the_index
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "Assert the entry exists for a document whose declared status is the unsettled one. Falsified by an implementation that filters on status before writing."
  - name: test_state_change_refreshes_the_existing_entry_without_adding_a_second
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "After the first listing, edit the produced document's declared status on disk and request the listing again. Assert the index holds exactly one entry for that document and that the entry now shows the new status."
  - name: test_entry_state_never_disagrees_with_the_document_it_points_at
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "For every entry in the index after a sequence of listings, open the document the entry links to and assert the state in the entry equals the state the document declares. This is the arm an implementation fails by writing the state once at creation and never reading it again."
test_rationale: >-
  The falsifying observation for this record is a disagreement between two artifacts - an
  index entry and the document it points at - so the test must hold both and compare them,
  which a direct-import unit test over the entry-formatting function cannot do: that
  function will faithfully render whatever state it is handed, including a stale one. The
  third and fourth descriptors are the ones with teeth, because they require a second run
  after the document has changed on disk; an implementation that captures the state at
  creation passes every single-run assertion and produces an index that grows steadily more
  confident about documents that have moved on.
