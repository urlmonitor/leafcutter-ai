assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The comparison baseline is files_touched UNION out_of_scope — an out_of_scope entry is a legitimate declared exemption and must never be flagged."
  - "Generated files and lockfiles (e.g. *.lock, poetry.lock, package-lock.json, and files under known generated/build-output paths) are exempt categories and must not be flagged as undeclared source work; define the exempt set explicitly so it is not open-ended."
  - "The exemptions must not swallow genuinely undeclared hand-written source; a source file that is neither declared, out_of_scope, generated, nor a lockfile is still flagged."
  - "PORTABLE SURFACE: this exemption logic lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py) pinned in BP-1100e-1; ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
