assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "CONFIG PREREQUISITE: the protected-branch list must be read from config/feedback_router.yaml under the key protected_branches (a list, default [main, master]). Do NOT hard-code branch names in feedback-router.js"
  - "Before any auto-committing route runs, feedback-router.js must check the current git branch (e.g. git rev-parse --abbrev-ref HEAD) against protected_branches; if it matches, park the entry and perform no commit"
  - "On a non-protected working branch the route proceeds normally; the branch check must wrap the git call per the project error handling policy"
