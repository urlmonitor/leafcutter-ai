id: ACD-300c-4
components:
  - ac_driven_dev
  - ac_store
readiness: approved
priority: high
title: "Final-gate approval is applied by the store's one approval step, to exactly the records the hold report releases"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the final gate of a /plan-feature run presents a batch of 4 records, ACD-9990a-1,
    ACD-9990a-2, ACD-9990a-3 and ACD-9990a-4, all at readiness "reviewed",
    and the approval-hold report for that batch returns ACD-9990a-3 as held with the reason
    "file finding undecided" and the other three as not held,
    and the user chooses "approve" with priority "high",
  When the workflow applies the approval,
  Then ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4 read readiness "approved" and priority "high",
  And ACD-9990a-3 still reads readiness "reviewed", and its priority is the value it had before,
  And each of the three approved records has gained exactly one new amended_by entry, at the
    end of its list, recording the approval and the date, and every amended_by entry it held
    before is byte-identical to before,
  And every other field of all 4 records is byte-identical to before,
  And the approval is made by the store's one approval step -- the same step a person runs by
    hand to approve records -- given exactly the ids ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4,
    as a deterministic workflow step, so no agent edits any record's readiness or priority
    during approval,
  And the run's closing summary states "3 approved, 1 held" and names ACD-9990a-3 with the
    reason "file finding undecided".
depends_on:
  - ACD-300c
  - ACD-2500d-3-i
doc_links:
  - path: docs/architecture/adrs/ADR-072-code-aware-test-designer-may-read-source.md
    relationship: related
    status: exists
    relevance: >-
      Section 6 says apply-approval MUST receive only the ids the hold report returns as not
      held; the Consequences bullet "The M-5 bypass stays open" is the gap this record closes.
  - path: docs/reference/ac-readiness-and-assignment-gates.md
    relationship: describes
    status: exists
    relevance: The hold reasons and the approval gate the approval step applies.
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-2500-right-job-right-agent/ACD-2500d-3-i.yaml
    relationship: related
    status: exists
    relevance: Defines the "file finding undecided" hold used in the example; do not restate it.
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'IT PO decision (the BA''s open call): the store''s one approval step, scripts/ac_store/approve_acs.py,
  gains an explicit id-list mode and a priority option. Readiness, priority and the single amended_by
  entry are written by that one step in one write per record; there is no second priority-writing step.'
- The id-list mode approves each listed id at any level, never expands an id to its children, and leaves
  the existing --goal and --ac modes unchanged.
- 'The workflow takes the hold report from the same approval step (its dry-run JSON report) and passes
  it only the ids reported not held. The step still checks holds on every id it is given: an id it holds
  is reported held and never written.'
- The approval is a deterministic workflow step with no agent dispatch, and it replaces today's status-checker
  apply-approval dispatch. No agent writes readiness or priority.
- 'Field-targeted writes only: readiness, priority and one appended amended_by entry change; every other
  byte of the record is preserved, and the write-then-read-back check stays.'
- The step's --json output keeps its exact {approved, held} shape; anything added is an additive key.
- The approve_acs.py CLI change is documented in docs/reference/ac-readiness-and-assignment-gates.md in
  the same change.
- 'templates/workflows-js/plan-feature.js is over its size limit and its measured length must not grow
  (GE-127b-1 growth ratchet): lines added are paid for by lines removed or by rationale comments moved
  to docs/reference/plan-feature-workflow-rationale*.md. Build after GE-134a-1 so decision-history lines
  are free.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- approve_acs.py is not deployed today, while /plan-feature runs scripts from .leafcutter/scripts/ac_store/.
  approve_acs.py (and every module it imports that is not deployed yet) is added to the ac_store deploy
  map in scripts/build_phases_ac_store_rc.py, and the workflow invokes the deployed copy; the existing
  deploy-map parity checks must pass.
declared_files:
- path: scripts/ac_store/approve_acs.py
  state: existing
- path: templates/workflows-js/plan-feature.js
  state: existing
- path: docs/reference/ac-readiness-and-assignment-gates.md
  state: existing
- path: scripts/build_phases_ac_store_rc.py
  state: existing
delivers_to:
  agent: python-coder
  contract: 'scripts/ac_store/approve_acs.py gains an id-list mode and a priority option: given ids [str]
    and priority (critical|high|medium|low) it writes, for each id it does not hold, readiness approved,
    that priority and one appended amended_by approval entry, as one field-targeted write per record followed
    by a read-back. --json prints {approved: [id], held: [{id, file, reason}]} (reason in HOLD_REASONS),
    plus an additive already_approved: [id] list; --dry-run --json prints the same report without writing.
    Exit is non-zero when any written record fails read-back, and that record is restored to its pre-write
    bytes.'
expects_from: null
test_intent:
- clause: ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4 read readiness "approved" and priority "high"
  needs_test: true
  reason: Approving the released records with the chosen priority is the core outcome.
- clause: ACD-9990a-3 still reads readiness "reviewed", and its priority is the value it had before
  needs_test: true
  reason: A held record must stay untouched, which is the bypass this change closes.
- clause: each of the three approved records has gained exactly one new amended_by entry, at the end of
    its list, recording the approval and the date, and every amended_by entry it held before is byte-identical
    to before
  needs_test: true
  reason: The append-only audit entry is one of the guarantees the agent edit skipped.
- clause: every other field of all 4 records is byte-identical to before
  needs_test: true
  reason: Byte identity of every other field proves the write is field-targeted.
- clause: the approval is made by the store's one approval step -- the same step a person runs by hand
    to approve records -- given exactly the ids ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4, as a deterministic
    workflow step, so no agent edits any record's readiness or priority during approval
  needs_test: true
  reason: Approval through the one step with exactly the released ids is the contract, and an agent edit
    would bypass the holds.
- clause: the run's closing summary states "3 approved, 1 held" and names ACD-9990a-3 with the reason
    "file finding undecided"
  needs_test: true
  reason: The closing summary's counts and held reason are computed from the step's report.
test_spec:
- name: test_id_list_mode_approves_released_ids_with_priority
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: reachability
  description: Runs approve_acs.py as a subprocess (cwd = tmp repo) with --ids ACD-9990a-1,ACD-9990a-2,ACD-9990a-4
    --priority high --json on a tmp store of 4 reviewed records; exit 0, and the three read readiness
    approved and priority high.
  proves_clause: ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4 read readiness "approved" and priority "high"
  code_file: scripts/ac_store/approve_acs.py
- name: test_id_list_mode_never_writes_a_held_id
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: Given all four ids, ACD-9990a-3 (an undecided file finding) is reported held with reason
    file finding undecided and its file bytes are unchanged, readiness reviewed, priority as before.
  proves_clause: ACD-9990a-3 still reads readiness "reviewed", and its priority is the value it had before
  code_file: scripts/ac_store/approve_acs.py
  must_catch:
  - the id-list mode trusts the caller's filtering and skips the hold check, so a held id passed to it
    is approved
  - a held id is given the new priority even though its readiness stays reviewed
- name: test_approval_appends_one_entry_and_keeps_prior_entries_byte_identical
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: Each approved record whose amended_by already holds a multi-line entry gains exactly one
    entry at the end (approval and date), and the bytes of every prior entry are unchanged.
  proves_clause: each of the three approved records has gained exactly one new amended_by entry, at the
    end of its list, recording the approval and the date, and every amended_by entry it held before is
    byte-identical to before
  code_file: scripts/ac_store/approve_acs.py
  must_catch:
  - the amended_by block is re-rendered through yaml.dump, so a prior multi-line entry changes its bytes
  - the new approval entry is inserted at the start of the list
  - a second approval entry is appended when the priority is written in a separate pass
- name: test_approval_changes_no_other_field_bytes
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: real_artifact
  description: 'Runs the CLI against the tmp store, reads all 4 files back from disk and compares them
    with the before-bytes: outside readiness, priority and the appended amended_by entry every byte is
    identical.'
  proves_clause: every other field of all 4 records is byte-identical to before
  code_file: scripts/ac_store/approve_acs.py
  must_catch:
  - 'the readiness value is replaced at the first ''readiness: reviewed'' text anywhere in the file, which
    can sit inside criteria or notes'
  - priority is written by re-dumping the whole record, which reorders keys and reflows text
- name: test_workflow_approves_through_the_step_with_exactly_the_released_ids
  target_dir: unit_tests/ac_driven_dev/test_design_stage/
  framework: pytest
  type: unit
  angle: reachability
  description: plan-feature.js under run_workflow_under_e2, resumed with approve and priority high; the
    hold reply is the real approve_acs.py --dry-run --json stdout on a tmp store. The approval dispatch
    is the approve_acs.py command with --ids exactly ACD-9990a-1,ACD-9990a-2,ACD-9990a-4 and --priority
    high, and no agent prompt asks to set readiness or priority.
  proves_clause: the approval is made by the store's one approval step -- the same step a person runs
    by hand to approve records -- given exactly the ids ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4, as a
    deterministic workflow step, so no agent edits any record's readiness or priority during approval
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the workflow keeps the status-checker apply-approval agent edit
  - the workflow takes its hold list from approval_hold_report.py while approving with a different step,
    so the two can disagree
- name: test_approval_step_is_deployed_where_the_workflow_runs_it
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: deployed
  description: 'In-process, no build.py: RULE_CHECK_DEPLOY_MAP in scripts/build_phases_ac_store_rc.py
    holds (''scripts/ac_store/approve_acs.py'', ''approve_acs.py''), and every module in approve_acs.py''s
    import closure (_approval_holds and every module it imports) is an entry of the ac_store deploy map,
    so the .leafcutter/scripts/ac_store/approve_acs.py path the workflow runs exists in a consumer; the
    existing deploy-map parity checks (test_acd_2500a_1_deploy_declaration.py) stay green. A run from
    the deployed layout (shared_reference_layout) needs POSIX flock and runs only on CI.'
  proves_clause: the approval is made by the store's one approval step -- the same step a person runs
    by hand to approve records -- given exactly the ids ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4, as a
    deterministic workflow step, so no agent edits any record's readiness or priority during approval
  code_file: scripts/build_phases_ac_store_rc.py
  must_catch:
  - approve_acs.py deployed but the workflow still invoking scripts/ac_store/approve_acs.py from the source
    path
  - approve_acs added to the map while a module it imports is left out, so the deployed copy fails on
    import
- name: test_closing_summary_states_three_approved_one_held
  target_dir: unit_tests/ac_driven_dev/test_design_stage/
  framework: pytest
  type: unit
  angle: criterion
  description: With the step's real --json report (3 approved, ACD-9990a-3 held for file finding undecided),
    the run's closing message states 3 approved, 1 held and names ACD-9990a-3 with that reason.
  proves_clause: the run's closing summary states "3 approved, 1 held" and names ACD-9990a-3 with the
    reason "file finding undecided"
  code_file: templates/workflows-js/plan-feature.js
