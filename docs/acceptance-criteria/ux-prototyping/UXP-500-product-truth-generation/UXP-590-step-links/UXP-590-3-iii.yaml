criteria: |
  Given UXP-510 claims steps [map, derive] of the product-truth generation flow,
  And the map step links [UXP-510] and the derive step links [UXP-510, UXP-700e-2-ii],
  And UXP-700e-2-ii claims step derive of that flow,
  And a fixture flow "leafcutter/fixture-flow" has a step "rollup" linking [UXP-510]
    and UXP-510 also claims step rollup of "leafcutter/fixture-flow",
  When the product-truth validator runs,
  Then it reports zero mislink errors for UXP-510 and UXP-700e-2-ii,
  And removing UXP-510 from the derive step's links produces exactly one error,
    "UXP-510 claims derive, but derive does not link it",
  And removing the rollup claim from UXP-510 while the rollup step still links it produces
    exactly one error naming "leafcutter/fixture-flow", rollup and UXP-510.
