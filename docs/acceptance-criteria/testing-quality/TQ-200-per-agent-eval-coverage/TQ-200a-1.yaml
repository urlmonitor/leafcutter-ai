it_requirements: |
  The scope is a known, enumerable list of agents (see TQ-200a-1-i / -ii). Each
  eval set is a data artifact (the classifier's existing docs/product-truth/classifier/eval.jsonl
  is the shape to follow: one row per line, {id, input, expected}). A coverage
  check enumerates in-scope agents and asserts each has a non-empty set; a missing
  set is an error, not a skip.
