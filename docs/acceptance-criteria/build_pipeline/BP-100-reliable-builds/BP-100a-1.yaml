criteria: |
  Given the hook manifest contains 3 hook entries:
    - hook "check_alpha" referencing script "check_alpha.py"
    - hook "check_beta" referencing script "check_beta.py"
    - hook "check_gamma" referencing script "check_gamma.py"
  And the canonical template directory contains only "check_alpha.py"
    (check_beta.py and check_gamma.py are absent)
  When the build system loads and processes the hook manifest
  Then it emits a warning for "check_beta" naming the missing script and expected path
  And it emits a warning for "check_gamma" naming the missing script and expected path
  And the build continues to completion without raising an error
  And the build returns its normal hook count (3)
