criteria: |
  Given a newly started kernel task, with or without an explicit output contract,
  When the kernel begins intake,
  Then one bounded read-only context enrichment pass completes before intent classification,
  And its context and honest outcome are checkpointed and traced before intent.assessed,
  And the classifier consumes the enrichment alongside the original request,
  And native capability judgments, later repository query hints and host input artifacts retain the context with its provenance and trust boundaries,
  And an explicit contract still controls output routing,
  And resuming a human or host interaction reuses that run's context instead of gathering again.
