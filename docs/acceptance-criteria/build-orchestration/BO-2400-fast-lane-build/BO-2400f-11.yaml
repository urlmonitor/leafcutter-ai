id: BO-2400f-11
components:
  - build_orchestration
title: "The green change is reviewed before it is committed, and the reviewer's own high-confidence findings stop the run"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run whose connected set has reached green (the batch tests pass and
    every acceptance criterion in the set has a passing covers test),
  When the run moves on from the coding loop,
  Then it submits its own change to the repository's existing pr-reviewer agent before
    any part of that change is committed,
  And what it submits for review is the run's actual working diff — the uncommitted
    change as it stands in the worktree — not a written summary, a list of touched
    files, or an account of what the run believes it did,
  And the review is complete and its verdict is in hand before the commit step begins,
    so a finding is a correction to the change that will be delivered rather than a
    follow-up commit stacked on a defect that is already in the delivered history: a
    review that runs after the commit does not satisfy this criterion.

  Given the review returns one or more findings that the pr-reviewer agent itself
    classifies as high-confidence — including any finding its own medium-cluster
    escalation promotes to high-confidence,
  When the run reaches the point at which it would commit,
  Then it does not commit and does not open a pull request,
  And the reported outcome names each finding that blocked it, so the operator reads
    what must be corrected rather than only that review failed.

  Given the review returns no high-confidence findings and returns only findings the
    pr-reviewer agent classifies as medium- or low-confidence,
  When the run reaches the point at which it would commit,
  Then the run proceeds to commit and open the pull request,
  And the non-blocking findings the reviewer surfaced are carried into the reported
    outcome without stopping the run, so reviewer noise cannot halt an otherwise-green
    run.

  Given the run applies no confidence or severity judgement of its own: the decision to
    block is taken solely on the class the pr-reviewer agent assigned to each finding,
  When a finding carries no class the run can read — the reviewer was not reached, it
    returned without a classified verdict, or the verdict cannot be parsed,
  Then the run treats the review as not performed: it does not commit, and it reports
    that no review verdict was obtained, rather than inferring a class, inferring a
    verdict from any other signal, or proceeding on an assumed-clean review.
