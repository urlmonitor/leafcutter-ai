assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THE SURFACE IS SETTLED (user decision, 2026-08-18): THE PULL-REQUEST CHECK LIST, AS A NON-BLOCKING CHECK. The criterion's load-bearing word is 'already'. A new dashboard, a new command, or a file that must be opened deliberately does not satisfy it — the current state (the per-record verdict has been computable all along and the 259-record backlog stayed invisible anyway) is exactly what a pull-only surface produces. The entry must be named so it reads alongside 'Proof-of-done coverage check (BO-2500b)'. It must NOT gate the merge and must NOT be a required check: 259 of 641 done leaf records are unproven today, so a blocking whole-store verdict would be red on every pull request from its first run — including pull requests that touch none of the affected records — and would be switched off within days. .github/workflows/ci.yml already records exactly this reasoning as the reason the whole-store variant ACS-200h was deliberately omitted; stay consistent with it. PRIOR STATUS: two enrichment passes recorded this as a BLOCKING AMBIGUITY; that blocker is now discharged, not merely deferred."
  - "PUSH, NOT PULL. The figures must change when a run completes, with no human republish step in between. Any implementation in which a person copies numbers, regenerates a page, or triggers a publish is a violation, and is testable: complete a second run with different figures and read the surface again."
  - "THE THREE-WAY SPLIT MUST STAY THREE-WAY ALL THE WAY TO THE SURFACE. proven / unproven / exempt must be three separate published counts. Collapsing exempt into proven lets the 37 records that today carry a test-free declaration inflate the good news, which is the specific dishonesty the parent L0 exists to remove. TQ-400e-2's abstention count is a fourth outcome and must not be folded into any of the three either."
  - "The published figures must be attributed to a specific dated occurrence, so a reader can tell WHICH run they are reading. An unattributed number cannot be distinguished from a stale one."
  - "Must read the completed run's structured report from TQ-400c-1 rather than re-running the sweep. A surface that re-derives becomes a second reader of the store and will drift from the report it claims to be showing. This is now also a criteria-level obligation: re-running per pull request puts a whole-store cost on every pull request and makes the figure differ between two pull requests for reasons unrelated to either."
  - "LEGIBILITY IS PART OF THE DELIVERABLE. The counts and the age of the figures must appear in the summary a reader sees in the check list itself, not only inside the job log. A check whose content is reachable only by clicking through has reproduced 'behind a command' with extra steps, which is the exact failure the parent L0 exists to remove."
  - "THE CADENCE THRESHOLD HAS EXACTLY ONE SOURCE: THE SCHEDULE DEFINITION ITSELF. 'Older than the cadence the schedule sets' must be computed by comparing the last completed occurrence's own timestamp against the interval declared by TQ-400c-1's `on: schedule` cron in .github/workflows/ — read from, or derived from, that one definition. Do NOT introduce a second literal for it: no STALE_AFTER_HOURS constant, no hardcoded day count, no threshold copied into the check's own config block. A duplicated threshold drifts the moment the cron changes, and it drifts in the direction that renders a schedule which has silently stopped firing as fresh. If a tolerance is wanted — lapsed only after N missed occurrences rather than one — it must be expressed as a multiple OF the declared cadence and defined in that same place, so there is still exactly one source."
  - "THE LAPSED STATE IS A THIRD STATE, AND IT IS STILL NON-BLOCKING. Lapsed must be machine-checkably distinct from BOTH completed-clean and TQ-400c-4's did_not_complete: three states, three distinguishable renderings, no pair rendering alike and none inferred from the absence of another. It must NOT be implemented by failing the check — the non-blocking obligation holds in every state, and a lapsed-means-red implementation reintroduces exactly the blocking behaviour the criteria forbid, on the path nobody watches until it fires on an unrelated pull request. Like the counts, the lapsed wording and the age of the figures must be legible in the check-list summary itself, not only in the job log."
  - "Must handle errors gracefully per the project error handling policy; the specific failure representation is TQ-400c-4's subject and must not be independently invented here."
delivers_to:
  - agent: documentation-expert
    contract: "The published routine-status surface — a non-blocking entry on every pull request's check list — carrying the four outcome counts (proven / unproven / exempt / evidence-not-trustworthy) attributed to a dated occurrence, with the figures and their age legible in the check list summary itself. This is the surface the TQ-400c how-to documentation trigger must describe: where to look and how to read it."
expects_from:
  ac_id: TQ-400c-1
  contract: >-
    The dated per-occurrence report. This AC surfaces its headline figures on the
    routine status surface the team already reads — the pull-request check list.
    Consumed as the structured artifact TQ-400c-1 emits — the four outcome counts
    plus the occurrence date — never by re-running the sweep.
test_spec:
  - name: test_tq_400c_2_completed_run_publishes_figures_to_the_routine_surface
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT, MANDATORY. Complete a sweep through the real scheduled entry point (subprocess, real argv/env), then read the published surface the way a reader reads it — the actual on-disk/emitted artifact, not the renderer's return value — and assert the headline figures are present there with no intervening manual step. Asserting that a template contains a placeholder for the figures passes on a surface wired to nothing."
  - name: test_tq_400c_2_a_second_run_changes_the_published_figures_unaided
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "REAL PRODUCER INTO REAL CONSUMER. Complete a second run whose population deliberately differs from the first, invoke nothing else, and assert the published figures now match the second run and are attributed to its date. This is the clause that separates a live surface from a snapshot someone pasted once."
  - name: test_tq_400c_2_proven_unproven_and_exempt_are_three_separate_published_counts
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "Given a run containing all three outcomes, the surface shows three distinct counts. Assert specifically that the exempt count is NOT added into the proven count — construct a store where folding them would produce the same total-proven figure a correct implementation must not show."
  - name: test_tq_400c_2_lapsed_cadence_is_its_own_summary_state_at_the_threshold_and_still_non_blocking
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      THRESHOLD PAIR, RELATIVE AGE ONLY. Publish from a completed clean occurrence
      whose timestamp is computed RELATIVE TO NOW against the cadence the schedule
      declares — once just INSIDE the cadence, once just OUTSIDE it — and read the
      check-list summary both times: just-inside must render the fresh clean verdict,
      just-outside must render the lapsed state. Never pin the occurrence to a fixed
      date (a hardcoded timestamp rots and then fails for the wrong reason), and never
      test only a wildly-stale case (that passes on an off-by-one and on a threshold
      effectively set to infinity). THREE FURTHER SUBSTANTIVE DEMANDS RIDE IN THIS
      ENTRY because the four-angle cap is reached here — see test_rationale; they are
      hard conditions, not optional extras. (1) THREE-WAY DISTINGUISHABILITY - produce
      lapsed, fresh-clean, and TQ-400c-4's did_not_complete, and assert all three
      pairs differ on a machine-checkable field of the summary; finding the word
      "stale" somewhere in the output does not establish that a reader can tell them
      apart at a glance. (2) STILL NON-BLOCKING WHILE LAPSED - assert the check's own
      conclusion in the lapsed case is the same non-blocking outcome as the clean case
      and does not turn the pull request red or gate the merge; the tempting-but-wrong
      implementation makes lapsed fail the check. (3) LEGIBLE WITHOUT CLICKING THROUGH
      - assert the lapsed wording and the age both appear in the check-list summary
      the reader sees in the list, not only in the job log.
test_rationale: |
  The cheap green here is a template test: assert the surface template contains a
  placeholder for each figure. That passes on a surface no run ever writes to, which is
  precisely the state this AC exists to leave. The load-bearing assertions are therefore
  both dynamic — the figures appear after a real run, and they CHANGE after a second real
  run — and both must read the surface as a reader does rather than inspecting the
  renderer's return value. The three-way-split test is separated out because the
  collapse-exempt-into-proven defect is arithmetically invisible in any test that only
  checks the total.

  The false green the lapsed-cadence entry closes is the one where no age comparison
  exists at all: with the schedule silently stopped, the last completed occurrence's clean
  figures go on rendering as the current verdict indefinitely, so the check is green,
  nothing anywhere is red, and the surface actively reports health it has no evidence for
  — the worse of the two failure modes, because TQ-400c-4's failed occurrence at least
  makes something visible. That entry is charged `boundary` because the criteria name a
  threshold and the just-inside/just-outside pair is the only assertion that separates a
  real cadence comparison from an off-by-one or from a threshold set to infinity; it takes
  the fourth and last angle slot (reachability, seam, criterion, boundary). The three-way
  distinguishability, the still-non-blocking check conclusion, and the summary-legibility
  assertions therefore ride inside that entry as hard conditions rather than each taking a
  slot of their own — they are not dropped, they simply carry no label, and they are
  restated in it_requirements so an implementer counting angle labels cannot lose them.
