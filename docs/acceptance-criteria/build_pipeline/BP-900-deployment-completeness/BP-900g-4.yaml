title: "The deploy-reachability guard sees script references written in the deployed-path template form"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given extract_script_path_refs in scripts/build_referential_integrity.py, which
    feeds the broken-reference guard (_check_script_reference_guard) that build.py
    runs as a preflight,
  And that agent templates address deployed scripts through the output-root
    template variable, i.e. `python3 {{config.output_root}}/scripts/<subdir>/<name>.py`,
    which renders to `.leafcutter/scripts/<subdir>/<name>.py` in a consumer install,
  When the extractor scans the source templates,
  Then a reference written in that output-root form is extracted and normalised to
    its `scripts/<subdir>/<name>.py` deploy-namespace key, exactly as a bare
    `python3 scripts/<subdir>/<name>.py` reference already is,
  And the guard therefore fails the build when such a reference names a script that
    no build phase deploys, naming the offending template and the missing path,
  And as the first instance of that class, scripts/build_orchestration/fast_lane.py —
    invoked by the build-ac agent at Step 2b.1 — is deployed to the consumer tree
    and EXECUTES there, which additionally requires every module it imports at
    module scope (notably scripts/ac_store/ac_parent_id.py) to be deployed
    alongside it: presence of the entry-point file alone is not reachability,
  And the `--ac-root` argument on that same invocation addresses the consumer's own
    AC store (`docs/acceptance-criteria`) rather than a path under the output root,
    matching the form the same template already uses at its other call sites,
  Because the guard's pattern required whitespace immediately before `scripts/`, so
    every output-root-prefixed reference was silently skipped: the guard reported a
    clean package, its positive-control test passed, and build.py exited zero while
    the deployed build-ac agent died at its first command with
    "can't open file .../fast_lane.py".
