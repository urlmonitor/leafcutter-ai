it_requirements:
  - "Deliverable is a section of docs/reference/ac-schema.md, the reference that documents every other AC field; no second page defines the field."
  - "Names the field and its values exactly as implemented: `declared_files`, entries {path, state}, state `existing` | `to_be_created`; optional; absence = 'no declared files'."
  - "States where the rules are enforced -- the check-ac-schema commit hook (load-bearing) and the agent-side validator -- and that each refusal is a commit-time refusal while the 'already exists' case is a warning."
  - "States the migration posture: records written before the field have no list; the implementation-readiness gate reports them 'missing file targets' but, while advisory and while they read as schema_version < 2, does not hold them (ADR-026 rules 3-4); their generated tickets carry a surface labelled 'derived, not declared' (TKT-600a-3-i)."
  - "Includes a worked example declaring one existing and one to-be-created file, and states which of the two the requirement rule check would report if the new file already existed."
  - "Links to ACD-1600c-3's hold-reason documentation rather than restating the hold-reason list."
  - "Frontmatter last_updated is bumped per the project doc conventions."
