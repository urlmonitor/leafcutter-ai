title: "A web-app change that won't build is automatically stopped"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  The web app is automatically built and type-checked on every change that touches it.

  When a pull request changes the web app, it is built and type-checked
  automatically, and the request is stopped the moment a build or type error
  appears — so a change that would not compile can never merge.
