it_requirements:
  - "Grounded (2026-07-10): the bootstrap tests fail with `TypeError: the JSON object must be str, bytes or bytearray, not MagicMock` because a mocked value flows into scripts/setup_ticket_worktree.py's json.loads(). Fix the test mocks to return a valid JSON string at that boundary (preferred), or make the production code tolerate the input; do not delete or skip the failing tests."
  - "The poetry, pip, no-manifest, and install-failure bootstrap paths must each be GENUINELY exercised — the mock fix must not short-circuit a branch so it silently stops testing the path it names."
  - "Must not weaken the assertions: each path's observable outcome (which dependency manager is invoked, or that a manifest-absent / install-failure branch is taken) stays asserted after the mock fix."
  - "Follow the project error-handling policy for any production-side change: if setup_ticket_worktree.py is changed to tolerate malformed input, the failure path must fail loudly (typed error + WARNING log), not swallow silently."
