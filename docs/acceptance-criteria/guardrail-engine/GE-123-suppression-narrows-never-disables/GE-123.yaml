id: GE-123
title: "Trust that the last check between you and a leaked credential is still on"
component: guardrail-engine
components:
  - commit_guardian
level: L0
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Narrowing a security check never switches it off.

  Some checks are the last thing standing between an ordinary mistake and a
  credential written into the project's permanent history. Today a single line
  written to quiet one noisy result can leave a whole file unexamined, and
  nobody is told; a line that does nothing at all looks exactly like a line
  that works; and describing a security problem in writing is treated as
  causing one. After this goal, narrowing what a check reports only ever
  narrows it — no file quietly loses its protection, an instruction that
  cannot do what it says announces itself while you are still writing it, and
  writing about a risk is no longer confused with taking one.
