id: BP-100k-3-vi
components:
  - build_pipeline
title: "An exemption entry on a recorded output excuses changed content only: a recorded output that is absent or unreadable still blocks, ground or no ground"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: reviewed
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a build manifest recording three deployed outputs, each named in the
    exemption registry with a non-blank ground,
  And the first output's content has been hand-edited so it no longer
    matches its recorded fingerprint,
  And the second output's file is absent from disk,
  And the third output's path now resolves to a directory rather than a file,
  When check-output-drift runs over that workspace,
  Then the first output is reported as a drift exemption naming its ground,
  And the second output is reported as recorded but not found on disk, the
    run summary states missing=1, and the second output is not reported as an
    exemption,
  And the third output is reported as unreadable, the run summary states
    unreadable=1, and the third output is not reported as an exemption,
  And the run blocks the commit,
  And given the registry is then emptied and the gate is run again over the
    same workspace,
  Then the missing and unreadable counts are identical to the first run's,
    showing that the registry entries had no effect on either,
  And every verdict is taken from running the deployed gate as a separate
    process and reading its emitted lines, RESULT line and exit status.
depends_on:
  - BP-100k-3
