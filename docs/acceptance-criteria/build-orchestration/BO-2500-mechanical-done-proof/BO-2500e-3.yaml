title: "A JS-covered AC whose front-end test fails cannot be marked done"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC whose "// covers:<id>" test in a .ts/.tsx file FAILS when the JS test runner
    (vitest) executes it,
  When the done-status of that AC is evaluated,
  Then the AC cannot be marked done,
  And the verdict names the failing linked test and the AC id as the reason,
  So a front-end AC is never marked done on a failing test — the JS path fails closed.
