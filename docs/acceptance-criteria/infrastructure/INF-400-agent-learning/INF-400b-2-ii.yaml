title: "Every shipped description of the knowledge-capture record agrees with every other and with the records actually written"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400b-2.yaml"
criteria: |
  Given the shipped package contains more than one place that tells an agent
    what a knowledge-capture record looks like,
  When a reader compares each of those places against every other one, and
    against the records the system has actually written,
  Then all of them describe the same set of fields, with the same names,
  And the records already on disk are conformant to that set rather than to
    a shape no shipped description matches,
  And exactly one of those places is identified as the one the others follow,
    so a future change to the shape has a single place to be made,
  And each restating place points a reader to that one place, by a reference
    that resolves,
  And a divergence introduced into any single one of those places is reported
    before the package is released, rather than surviving unnoticed as this
    one did.
