id: BO-3200a-1
title: "A fact the build depends on is still obtained when no one can be asked to judge it"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build that must know a recorded fact about the project before it can decide what to
    do next,
    And an environment in which no party can be asked to judge anything -- the only party that
    can be dispatched is one chartered to carry out an exact command and return its output
    verbatim, whose charter admits every exact command so it has no grounds to decline one, and
    which treats whatever it receives as a literal command and so gives no answer to a request
    to look, decide, interpret or summarise; every dispatch to any other party fails
    immediately,
  When the build resolves that fact,
  Then it obtains the correct value and proceeds, so no judgement over the value was requested
    of anyone,
    And every dispatch made while resolving the fact went to that chartered party and carried
    an exact command, and none was addressed to any other party.

  Given the same fact recorded in a source larger than the size at which a relayed reply is
    shortened — at least 130 kilobytes,
  When the build resolves that fact,
  Then the value it obtains is complete and usable, and the decision it makes from it matches
    the decision it would make from the source read whole.

  Given a fact whose recorded value would cause the build to permit an action,
  When the build resolves it,
  Then the build permits that action, and does not refuse it.
depends_on:
