it_requirements:
  - 'ONE RULE REPLACES ONE RULE. is_done_proof_waived(ac_info, repo_root), in scripts/ac_store/_done_proof_waiver.py,
    replaces is_covers_tag_waived at every call site, verified 2026-10-25: _done_proof_phase_helpers.py:570
    (_handle_no_direct_tests, reached by mark_ac_done.py through test_enforcement.verify_done_eligible);
    templates/scripts/commit_guardian/check_done_proof.py:462 (check_staged_done_proofs),
    :534 (check_all_done_acs), :600 (check_changed_done_acs) and its lazy loader (:215-261);
    _done_proof_composite.py:355, :438, :463 and :522 (the roll-up). Edit the template, never
    the scripts/commit_guardian/ build output. Afterwards only the new rule calls the reason-present
    half; KM-ADM-005''s ratchet moves through KM-ADM-005-2.'
  - The rule needs repo_root (fingerprints, wiring, enforces tags), and so does every caller.
    The status-map entries (_build_ac_status_map) must carry verified_by, change_target and
    declared_files, or the composite path waives on less data than the leaf path.
  - SWITCH, NOT BIG BANG. The new rule takes effect through a single declared switch that
    is off when this record lands, so the 63 finished records holding only a stated reason
    are not refused by the next CI run. BO-2500f-4-ii owns turning it on and the guard that
    refuses turning it on early. While it is off, every verdict is the one the old rule gives.
  - Refusal reasons carry the failing part from the BO-2500f-1, -2 and -3 verdicts verbatim;
    a record with only a stated reason is refused with 'a stated reason alone no longer proves
    done'.
  - 'REACH THE GATE THE WAY THE HOOK DOES (carried over from BO-2500a-1-ii): at least one
    test drives the real check_done_proof.py --mode precommit CLI as a subprocess and asserts
    its exit code.'
  - 'Approval reads: the tracked approval file (docs/acceptance-criteria/_inspections/<run_id>.json,
    BO-2500f-3-i) is read through git, only for a record being marked done that carries an
    inspection; no network call and no local untracked store anywhere in this rule. Because
    the file is committed, every layer reads the same file and reaches the same verdict. The
    whole-store sweep (check_all_done_acs) does not re-compare inspected content (TQ-400a/b).'
  - Every new module under scripts/ac_store/ is added to build_ac_store's deploy_map in scripts/build_phases_ac_store.py,
    and its import is proven in the DEPLOYED .leafcutter/ layout, not only the source tree
    (the BO-2500a-1-ii ModuleNotFoundError precedent).
  - 'check-file-size: .py files are limited to 400 counted lines and an already-oversized
    file may not grow net (GE-127b-1 ratchet). done_proof.py (1989 lines), _done_proof_phase_helpers.py
    (820), _done_proof_composite.py (592), templates/scripts/commit_guardian/check_done_proof.py
    (806) and _ac_schema_validators.py (648) are all over; new logic goes in the new sibling
    module and call-site edits stay net non-growing.'
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: 'the missing covering test is waived only when the record''s verification record
      holds: its shape is valid (BO-2500f-1, BO-2500f-1-i), a named check is tagged and wired
      (BO-2500f-2, BO-2500f-2-i), or an inspection''s content is unchanged and its reviewer
      is a person (BO-2500f-3, BO-2500f-3-i)'
    needs_test: true
    reason: This is the new waiver condition; each of the three verification routes needs
      a holding case and a failing case.
  - clause: a record carrying test_required false and a non-empty stated reason but no verification
      record that holds is refused, the reason given being that a stated reason alone no longer
      proves done
    needs_test: true
    reason: The stated-reason-only record is the 63-record population, and refusing it with
      the stated reason is the tightening.
  - clause: the refusal names the part of the verification record that failed
    needs_test: true
    reason: The failing part must reach the refusal, or the reader cannot fix the record.
  - clause: all layers reach the same verdict for the same record, because they consult one
      shared rule, and the earlier stated-reason rule (BO-2500a-1-ii) is replaced by it rather
      than kept beside it
    needs_test: true
    reason: 'Layer agreement is what BO-2500a-1-ii fought for: the same records through every
      layer must get the same verdict, with no caller of the old predicate left.'
  - clause: a parent whose children include a test-free child counts that child as proven
      only under the same rule
    needs_test: true
    reason: The composite roll-up is a separate code path (_done_proof_composite.py) that
      keeps the old rule if it is missed.
  - clause: the commit-time check is exercised the way a commit reaches it, and its result
      is the one a commit receives
    needs_test: true
    reason: A helper returning the right answer while the hook refuses is the phantom-done
      shape, and the real pre-commit CLI's exit code is what a commit sees.
  - clause: a record whose test_required is true or absent is judged exactly as before
    needs_test: true
    reason: Records that owe a test must see no change, and a regression here would reach
      the whole store.
delivers_to:
  - agent: python-coder
    ac_id: KM-ADM-005-2
    contract: 'is_done_proof_waived(ac_info, repo_root, *, compare_content=True) -> verdict
      {waived: bool, method: ''check''|''inspection''|None, failed_part: str|None, reason:
      str}; compare_content=False skips the inspection fingerprint comparison.'
  - agent: python-coder
    ac_id: BO-2500f-4-i
    contract: The same rule; its failure path returns a 'could not evaluate' verdict that
      refuses.
  - agent: python-coder
    ac_id: BO-2500f-4-ii
    contract: The rule plus its single declared switch (off on landing); BO-2500f-4-ii turns
      it on and guards the turning-on.
  - agent: documentation-expert
    ac_id: BO-2500f-5
    contract: The refusal messages of the shared rule and its parts, quoted verbatim in the
      guide's 'what goes wrong' section.
  - agent: python-coder
    ac_id: TQ-400e-3
    contract: The shared rule the honesty sweep's exempt classification calls; with the switch
      on, a stated reason alone no longer yields exempt.
  - agent: python-coder
    ac_id: TQ-400e-4
    contract: The rule's failed_part, which the sweep's report names for a refused reasoned
      declaration.
  - agent: documentation-expert
    ac_id: TQ-400e-6
    contract: The delivered rule (methods, required parts, the inspection ban for code/schema/pipeline,
      're-inspection needed') that the reference entry states as the single rulebook.
expects_from:
