  - agent_registry
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build started from a location that is not the repository — a parent directory that
    is not itself a repository, and a directory unrelated to the project,
  When the build resolves a recorded fact about the project,
  Then it obtains the same correct value it obtains when started from the repository itself.

  Given a build started from a location from which the fact genuinely cannot be located,
  When it resolves that fact,
  Then it reports that it could not locate the source, naming the location it looked in, and
    does not report a value.
