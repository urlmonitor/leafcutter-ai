notes: |
  THE DEFECT, MEASURED (run wf_f982c0ab-e94, 2026-10-23). Three of three tickets
  halted after about 4.2M tokens of correct work, on two parses that read the
  command's answer with a bare JSON parse of the whole relayed text:
  - Red-baseline gate: the gate PASSED (gate_passed true, three red tests,
    verified true), but the relayed text was '<json>\nexit: 0'. The drive halted
    with "red-baseline gate reply could not be verified" and no coder ran.
  - Wrong-version list step: the writer's list command logs "base ref HEAD: 0
    names declared, 14 derived" to stderr. The executor's shell tool merges
    stdout and stderr, so the log line arrived ahead of the JSON, the step read
    null, and the drive halted with "Wrong-version list step did not pass: null".
    This happens for EVERY ticket whose AC has derived wrong-version names; it is
    not intermittent.

  THE OTHER SIDE OF TQ-500f-3-ii's COIN. -ii says no verdict must ever pass.
  This AC says a real verdict must not be thrown away. The N1-N6 clause keeps
  -ii's fail-closed requirement whole: the existing refusal test must stay green
  unchanged, and every case where the text carries no single JSON object answer
  halts as today. Only R1-R4 (one whole line that is a JSON object) change.

  DECISIONS THE BA MADE, FOR THE IT PO / USER TO CONFIRM:
  - N6, two different JSON-object lines, is NOT read as an answer: with two
    candidates the route cannot tell which one the command meant, and picking
    one would be guessing. The case is hypothetical today (no log line on these
    steps is JSON), so this costs nothing.
  - N5, an answer sharing its line with other text, is NOT read. "A whole line"
    is the rule; accepting a JSON object embedded mid-line widens what counts as
    an answer to text a refusal could contain.
  - A JSON object spread over several lines (pretty-printed) is read only when it
    is the whole text (R1 rule). With noise around it, it is not read and halts.
    Assumption: these commands print one-line JSON.
  - Whitespace and a trailing carriage return around the answer line are
    ignored (R4), because a Windows host or the executor may add them.
  - The "exit: N" line is ignored, never cross-checked. A route that wanted the
    exit status would get it from the command's own answer (gate_passed).

  STEPS IN SCOPE. The red-baseline gate parse in build-feature.js and its twin
  build-ticket.js, and the wrong-version step helper (wvStep) in build-feature.js,
  build-ticket.js and build-epic.js. wvStep serves recover, list and finish, so
  the one reading rule reaches all three; the criteria pin the list step because
  that is where the defect was measured. On /build-epic the red-baseline gate is
  run by ticket-supervisor from prompt text (TQ-500f-3-iv), not parsed in the
  JS, so only the wrong-version step is in scope there.

  OUT OF SCOPE: fast-lane-ship.js has the same bare parse of the relayed stdout,
  but the fast lane is owned elsewhere. It is not changed here. Raise it with the
  fast lane's owner; until then the lanes differ in how they read relayed noise,
  though never in the verdict they reach on the same answer.

  CONTRADICTION TO RECONCILE (not edited here, previous BA/IT-PO records are not
  modified): TQ-500g-1-vi's it_requirements say "The reply is parsed as the fast
  lane does: JSON.parse(reply.stdout)". This AC replaces that parse for the
  heavy-lane routes. The IT PO should amend -vi's (and -vii's) entry to point
  here. TQ-500f-3-iv's "stdout must parse as one JSON object" is a prompt rule
  for ticket-supervisor and is left as is.

  IT-PO ENRICHMENT (2026-10-23)
  Described against the implementation already in this workspace: one pure
  reader, parseStepJson, copied identically into build-feature.js,
  build-ticket.js and build-epic.js (no module loader). Twins: wvStep
  (recover, list, finish) and the red-baseline gateVerdict parse. build-epic.js:
  gvStep (drive-head recover, gate-marker close-all/open/close). The BA's
  decisions above (N5 and N6 not read, multi-line only as whole text, CR
  trimmed, exit line ignored) are confirmed and match the code.
  CRITERIA CORRECTED: "for the wrong-version list step also in /build-epic"
  became "for the wrong-version recover step and the gate-marker steps also
  in /build-epic, which has no list step" (amended_by entry, 2026-10-23).
  The BA's STEPS IN SCOPE paragraph above says wvStep on build-epic.js; the
  helper there is gvStep and it serves recover and the gate-marker steps.
  SIBLINGS AMENDED: TQ-500g-1-vi's and TQ-500g-1-vii's parse entries now point
  at this AC's reading rule. fast-lane-ship.js stays on its own strict parse.
  Complexity S: ~10 counted lines of pure helper per file plus three call-site
  swaps; tests already written (three, behavioral, mutation-proven).

  PLACEMENT. TQ-500 has 7 L1s (full), TQ-500f has 6 L2s and TQ-500g has 5 (both
  at or over the 5-L2 cap), so this is an L3. It sits under TQ-500f-3 beside
  TQ-500f-3-ii, whose fail-closed requirement it is the counterpart of; the
  wrong-version list step it also covers is linked through depends_on
  (TQ-500g-1-vi, -vii). BO-3200d ("a large result arrives whole") was
  considered and rejected: its binding handover decision is that results travel
  out of band and never in the reply, which this relay-parsing fix does not
  follow. Moving these steps to an out-of-band handover would be a BO-3200
  follow-up, not this fix.

  TESTABILITY (for the IT PO): drive both twins (and build-epic.js for the
  wrong-version step) under unit_tests/_workflow_engine_harness.py with the
  executor responses R1-R4, the failing-verdict case and N1-N6, and assert on the
  recorded dispatches (coder dispatched or not, next wrong-version step
  dispatched or not, halt text). R3 must use the exact log line from the run; R2
  the exact '<json>\nexit: 0' text. A test of the parse helper alone is not
  enough: CLAUDE.md requires the verdict to be shown consumed in control flow.
