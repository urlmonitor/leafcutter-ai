declares_side_effect: false
estimated_complexity: L
it_requirements:
- Capacity acquisition must be atomic across worker processes and every implementation, repair, reviewer
  and nested call path; a separate per-adapter semaphore is insufficient.
- 'A nested request while its parent holds the only slot must not deadlock or bypass capacity: disable
  nesting or suspend the parent call before separately admitting it, while maintaining truthful in-flight
  accounting.'
- Only proven call completion or reconciled termination releases ownership; expired bookkeeping alone
  must not permit duplicate live calls.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300b-1 (data handoff, not an additional build-order prerequisite): WorkerSettings
  {enabled:boolean, max_agent_calls:integer>=1, implementation:{executor:string, provider:string, model:string,
  endpoint:string, credential_ref:string|null}, reviewer:{executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, credential_ref:string|null}, settings_revision:string}.'
test_spec:
- name: test_background_worker_all_roles_share_atomic_global_capacity
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: boundary
  description: Race two runs' implementation, review and nested requests against limit one; observe maximum
    actual live calls one, not just semaphore labels.
  covers:
  - ACD-1300b-2
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_failed_call_releases_slot_once
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: Executor exception and duplicate completion events release one lease and permit only the
    next eligible call.
  covers:
  - ACD-1300b-2
- name: test_background_worker_nested_call_cannot_deadlock_or_escape_limit
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: With limit one, nested execution is refused or parent is safely suspended before child
    admission; assert bounded completion and no two live calls.
  covers:
  - ACD-1300b-2
