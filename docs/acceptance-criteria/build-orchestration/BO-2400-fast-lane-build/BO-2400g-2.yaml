estimated_complexity: L
declares_side_effect: false
it_requirements:
  - "The reading must be dispatched by the run itself, occupying the space between the Coder phase (fast-lane-ship.js:395) and the Commit phase (:471). No commit for the run may exist at the moment the reading starts; ordering must be verifiable from observable git state, not from the position of a string in the workflow file."
  - "The reader must be bound to the two inputs already in hand at that point — the resolved connected requirement set (batchIds, from resolve_connected_build_set at fast_lane.py:498) and the working diff — and must produce its findings from those alone. It must not require a ticket file to exist anywhere on disk."
  - "Every ticket-keyed examination in templates/agents/pr-reviewer.md must be explicitly accounted for: Contract-Aware Mode (line 102), the contract trace (line 193), the delivers_to/expects_from cross-file trace (line 136), and the completion_manifest / scope_verified check (line 517). Each must either be re-based on the two available inputs or be named in the run's result as an examination that was not performed, with a reason. Silent degradation to a diff skim is prohibited — a review phase that is present but inert reads as coverage and is worse than no phase at all."
  - "ticket files_touched has no equivalent on this lane. The two honest options are to derive an expected surface from the resolved requirements themselves, or to declare that examination not performed. Both satisfy the AC; silently doing neither does not."
  - "Every finding must carry the requirement id it relates to and the repo-root-relative path of the changed file it was found in. A finding that names neither cannot be acted on by BO-2400g-4's severity ladder or rendered by BO-2400g-4-i."
  - "The reader must not obtain any part of its examination by spawning a further sub-agent: sub-agents are hard-limited to depth 1 and a delegating reviewer would silently receive nothing back. The run's own dispatch is top-level and is the only level at which additional readers may be requested."
  - "DO NOT solve the scope-boundary problem here. templates/agents/change-scope-reviewer.md reads out_of_scope from ticket frontmatter and ACD-1600g-3 is independently moving that source to the requirement itself. On this lane, scope adjudication is simply one of the examinations that must either run from the resolved requirements or be named as not performed. Do not contradict ACD-1600g-3's direction."
  - "TESTS MUST NOT BE GREP-ONLY. This is a workflow-and-gate surface, and CLAUDE.md records that the fast lane itself once shipped a phantom-done runner which passed grep-only structural tests while never executing its gates. Assert ordering through real git state, and assert that the reading step executed via the captured dispatch sequence from unit_tests/_workflow_engine_harness.py — never via meta.phases."
  - "Changes to templates/agents/pr-reviewer.md take effect only in the deployed layout (.claude/), so `python scripts/build.py --target-dir .` must run before any test that exercises the deployed reviewer; a template-only edit leaves the running lane unchanged while source-tree assertions pass."
  - "The reading must add no more than one additional agent dispatch to the lane at this AC's scope (BO-2400g-3 adds the second reader deliberately). The lane's leanness claim in BO-2400 is about dropping ORCHESTRATION overhead, not scrutiny, but the cost must stay attributable."
delivers_to:
  - agent: pr-reviewer
    contract: "Reader inputs assembled by the lane with no ticket on disk: {resolved_requirements: [{id, title, criteria}], diff: unified working diff of the run's uncommitted changes}. These two replace everything the thorough path supplies via a ticket."
  - agent: pull-request
    contract: "The run's review result: {reading_state: 'performed'|'not_performed', missing_input: str|null, findings: [{ac_id: str, file: str, severity: str, text: str}], not_performed_examinations: [{examination: str, reason: str}]}. BO-2400g-3 merges its two readers' findings into the same `findings` list; BO-2400g-4 consumes `severity` for its stop/proceed ladder; BO-2400g-4-i renders the advisory subset onto the pull request; BO-2400g-2-i constrains `reading_state` and `missing_input`."
expects_from:
  - ac_id: BO-2400f-1
    contract: "The resolved connected build set for the run — the named id's subtree plus unmet prerequisites, in dependency order — surfaced to the workflow as batchIds. This is the first of the reading's two inputs and the only statement of intent that exists on this lane; consumed as given, not re-computed."
test_spec:
  - name: test_no_commit_exists_for_the_run_when_the_reading_starts
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "In a real temp git tree, a fast-lane run is driven to the reading step and the branch's commit count is asserted unchanged from the pre-run baseline at that moment. Ordering asserted by observable git state, not by the position of a string in the workflow file."
  - name: test_findings_name_the_resolved_requirement_and_the_changed_file
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A run over five resolved requirements with a planted defect yields a finding whose text contains the specific requirement id it relates to and the path of the file it was found in."
  - name: test_reading_produces_findings_with_no_ticket_file_on_disk
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The same planted defect is found with no ticket file anywhere in the tree. A reader wired to ticket frontmatter returns an empty or generic result here and fails."
  - name: test_examinations_that_could_not_run_are_named_in_the_result
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The run's result enumerates, by name, each ticket-bound examination that was not performed. Asserts the list is non-empty when an examination is genuinely unavailable and that it is absent when all examinations ran — a reader that silently degrades produces neither."
  - name: test_reading_phase_is_reached_by_the_real_command_surface
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT: invoke /fast-lane-build's real workflow against a temp store and assert from the run's own recorded step outcomes that the reading step executed. A reading that is implemented but never dispatched passes every other test here. Observe via unit_tests/_workflow_engine_harness.py and assert on the captured dispatch sequence, never on meta.phases."
test_rationale: "This is the AC most exposed to the failure this repository exists to prevent, and the obvious test is the one that would ship it broken: asserting that a review phase is present in the lane passes on a phase whose every substantive mode is inert, which is phantom-done one level up and worse than no phase at all because it reads as coverage. The load-bearing assertions are therefore the no-ticket test (a frontmatter-bound reader cannot pass it) and the not-performed-examinations test (a silently degrading reader produces neither an examination nor a declaration, so it fails both halves). Ordering is asserted through real git state rather than by grepping the workflow for phase order, because the fast-lane runner has already once passed grep-only structural tests while never executing its gates (CLAUDE.md, 2026-07-22). The reachability test is separate because a correctly implemented reading that the workflow never dispatches is precisely that same defect wearing a different hat."
