notes: |
  Gap G4. Backstop for anything end-of-route clearing (BO-4400a) misses: crashed sessions,
  pile-up from before BO-4400a existed, workspaces kept by halted runs whose work was later
  sent by hand. The sweep does not decide anything itself -- verdicts come from BO-4100c,
  "active" from BO-1800d, expiry from BO-4400f-1, clearing from BO-4300e. Its own promise is
  the selection: each of the seven workspaces and five scratch items is a distinct case and
  the wrong selection on any one turns a clause red.
  Prior art outside the package: the operator's machine-local hourly reclaim timer
  (~/bin/wsl-reclaim). The packaged sweep replaces its workspace/scratch half for every
  install; the machine-local tool is not modified by this record.
