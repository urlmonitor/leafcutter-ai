it_requirements:
  - >-
    Edit the template sources only (templates/agents/, templates/skills/). Never edit the
    built copies (ADR-001).
  - >-
    ONE DEFINITION. The whole definition of `feedback-id: (not-a-signoff)` lives in one
    subsection of the signoff skill. It covers the value itself, which entries it applies to,
    that it is written without calling submit_feedback.py, that it never stands in for an id on
    the writing agent's own phase sign-off, and that it never replaces the failure fallback. Any
    other template or skill that uses the value carries only the literal line in its example and
    a pointer to that subsection, never a sentence restating the rule.
  - >-
    The subsection has a stable heading that BO-2000g-3, GE-123e-3 and GE-123e-5 can cite.
    Renaming that heading later changes the contract with those consumers.
  - >-
    COMMENT TEXT ONLY. The person decided this on 2026-11-16 (see BO-2000g-2-i). The value is
    never added as a feedback writer, a category or a submission sentinel. Neither
    config/feedback_categories.yaml nor templates/config/feedback_categories.yaml is edited by
    this record. ticket-supervisor is added to no category's allowed_writers. INF-100c-5-ii
    forbids documenting a sentinel that submission does not implement.
  - >-
    PROXY SIGN-OFFS ARE INCLUDED. These entries carry (not-a-signoff): the entries in which
    ticket-supervisor marks a skipped phase signed off on its behalf (ticket-supervisor.md ~:350;
    building-epics SKILL.md ~:457 for the ac-validator skip and ~:496 for the test-writer skip),
    the warnings (ticket-supervisor.md ~:373 and building-epics ~:546 for contract shrinking,
    building-epics ~:605 for the produces trait), and the commit agent's supervised-path audit
    entry (commit.md ~:302).
  - >-
    INSERT ONLY, as in BO-2000g-1. Insert one line directly under each heading, using the body's
    own indentation. The pseudocode entries in building-epics (~:457, :496, :546) keep their
    `<today> <time>` heading spelling, and no other body line changes.
  - >-
    SEQUENCING. This record must merge with or before GE-123e, which removes the
    [NO-FEEDBACK-CHECK] bypass. GE-123e-3's refusal and GE-123e-5's reference name
    `feedback-id: (not-a-signoff)` and point at the signoff skill subsection. If they ship first,
    they point at something a reader cannot find. Once the bypass is gone, a copied note example
    without the line also stalls the drive.
  - >-
    The IT PO verified these locations on 2026-11-16. Line numbers drift, so find each one by its
    text: commit.md:302, ticket-supervisor.md:350 and :373, building-epics SKILL.md :457, :496,
    :546 and :605.
test_intent:
  - clause: "the skill defines, in exactly one place, the value `feedback-id: (not-a-signoff)` for a Comments entry that does not sign off the writing agent's own phase"
    needs_test: true
    reason: "A definition written twice in the skill can drift into two different rules, and a missing definition leaves GE-123e-3's refusal pointing at nothing."
  - clause: "it states that this value is written without calling the feedback submission step"
    needs_test: true
    reason: "Without this sentence an agent may run the submission for a note and file a feedback record for something that is not a sign-off."
  - clause: "it states that the value never stands in for an id on an entry that signs off the writing agent's own phase, and never replaces the failure fallback on a phase sign-off whose submission failed"
    needs_test: true
    reason: "Without both prohibitions the value becomes a universal pass for any phase sign-off whose submission was skipped or failed, a misuse the lint cannot see."
  - clause: "no other agent template or skill restates that definition; each one that uses the value refers to the signoff skill for it"
    needs_test: true
    reason: "A second copy of the rule in ticket-supervisor or building-epics is the drift to catch, so the check must search the whole agent and skill trees and not only the files this record edits."
  - clause: "the first line of the example's body (the line directly under its heading) is exactly `feedback-id: (not-a-signoff)`"
    needs_test: true
    reason: "Every listed note entry, including the three building-epics pseudocode entries with `<today> <time>` headings, must open with the exact value, and a close variant or a later position would pass a looser check."
  - clause: "it is not a real-id placeholder, an invented id, or the failure fallback"
    needs_test: true
    reason: "The tempting wrong version gives the proxy sign-offs a real-id placeholder or (submit-failed), which the person's decision forbids and which still looks correct to the lint."
delivers_to:
  - agent: python-coder
    contract: >-
      Consumed by BO-2000g-3 and BO-2000g-4. One documented value, `feedback-id: (not-a-signoff)`,
      defined in one subsection of the signoff skill (templates/skills/signoff/SKILL.md) and used
      verbatim as the first body line of every note example. The template lint accepts it, and
      the real-hook proof commits it unchanged.
  - agent: python-coder
    contract: >-
      Consumed by BO-2000g-2-i. The value is comment text only, and neither feedback categories
      file changes.
  - agent: python-coder
    contract: >-
      Consumed by GE-123e-3. The literal line "feedback-id: (not-a-signoff)" and the signoff
      skill subsection that defines it. The refusal names the value verbatim, points at that
      subsection, and gives no other convention. This record must be on main before GE-123e-3
      ships.
  - agent: documentation-expert
    contract: >-
      Consumed by GE-123e-5. The single definition of the literal line
      "feedback-id: (not-a-signoff)", in one subsection with a stable heading in
      templates/skills/signoff/SKILL.md. The commit-guardian reference
      (docs/architecture/components/commit-guardian.md) points at that subsection by section and
      restates neither the value's rule nor a second convention. This record must be on main
      before GE-123e-5 ships.
