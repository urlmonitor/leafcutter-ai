criteria: |
  Given UXP-100d describes a handoff from UX design to frontend implementation,
  When a component diagram is produced for this handoff system,
  Then the diagram shows the handoff artifact as a central data store with four
    sections: layout, flow, terminology, and hierarchy
  And the diagram shows the UX designer agent as the producer (writes the artifact
    on approval)
  And the diagram shows the frontend-coder agent as the consumer (reads the artifact
    at implementation time)
  And the diagram shows the component library catalog as a reference source that
    both agents read (UX designer for composition, frontend-coder for version checking)
  And the diagram follows the C4 component diagram conventions used in this project
