id: TQ-500a-2
components:
  - testing_quality
  - build_orchestration
title: "\"No substitute proof was possible, and here is what I tried\" is a valid answer"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a piece of work for which the ordinary before-and-after evidence was
      impossible, and whose writer, having attempted it, could construct no
      alteration to the guarded behaviour that any of the tests would object to,
  When that piece of work is handed on,
  Then its hand-off record carries a negative answer in the record's existing
    nested form — the negative result, the reason no substitute evidence was
    obtainable, and the suggested next step — and that record is a conforming
    answer,
    And the piece of work is not reported as a shortfall for carrying it,
    And a negative written as a bare no, with no reason and no next step, is
      malformed rather than conforming, and is distinguishable in the output from
      the reasoned negative above,
    And the reasoned negative is retained as the answer for that piece of work, so
      a later reader sees that the question was put and what the attempt was,
      rather than seeing no answer at all.
depends_on:
  - TQ-500a
