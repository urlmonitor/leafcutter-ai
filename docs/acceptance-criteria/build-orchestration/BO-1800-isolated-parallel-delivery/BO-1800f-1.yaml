notes: |
  Scope. This is the currency half of BO-1800f, and it is scoped to the moment of
  delivery. It does not ask for the copy to be kept current while work is in
  progress; BO-1800f's own notes record why (restating a copy's history underneath
  running agents trades silent deletion for silent corruption of in-flight work).

  Why the criteria insist on the state "at that moment". The recorded failures were
  not caused by a missing comparison -- they were caused by comparing against a
  locally-held picture of the shared branch that was itself out of date. CLAUDE.md
  records an audit that reported clean for exactly this reason: the tree and the
  picture it was compared against were stale in the same way, so they agreed. A
  behaviour that re-reads a stale local record satisfies a naively-worded criterion
  while reproducing the defect, so the clause above rules it out explicitly.

  Falsifiability. The fixture must advance the shared branch between the moment the
  copy is made and the moment of delivery. Without that advance, a correct
  implementation and one that reuses a locally-recorded state are indistinguishable,
  and any test built on such a fixture passes on both. With it, the introduced file
  is absent from the prepared delivery under the incorrect implementation. The
  assertions are on the prepared delivery's content and on the copy's history, so
  no test that only inspects source text can satisfy this record.
