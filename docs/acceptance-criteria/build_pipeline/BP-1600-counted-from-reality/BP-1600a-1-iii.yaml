notes: >-
  THIS RECORD IS WHAT MAKES DAY-ONE LANDING POSSIBLE WITHOUT FORCING A DISPOSITION, AND IT IS
  NOT AN ALLOWLIST. The census fails on the commit that lands it. Measured at 468e0490f on
  2026-09-07 the reported set is two scripts, and neither can honestly be wired that day: one
  has an approved record requiring its detection to be extracted into a shared pass instead,
  and the other cannot be wired without breaking a repair that another approved record
  specifies, because it blocks exactly the file moves that repair performs. With only two
  states — wired or failing — the census would force a contradiction with the store on its
  first run, and the natural remedy for that is to weaken the census. The third state resolves
  it, and the citation requirement is what stops the third state from becoming the weakening.


  THE DIFFERENCE BETWEEN A GROUND AND A POSTPONEMENT IS THE WHOLE DESIGN. "Held back until the
  work-item repair has landed, decided in that record, which names this script" is a ground: it
  is falsifiable, it has an owner, and it expires when the cited record does. "Triage deferred"
  is a postponement: it has no owner, no end, and no way to be wrong. The sibling surface's
  register requires a ground and calls a blank one no ground; this record goes one step further
  and requires the ground to name where the decision lives, because on this surface the honest
  grounds all happen to have such a record already, so the stricter rule costs nothing today and
  closes the loophole permanently.


  THE CENSUS IS FORBIDDEN TO RECOMMEND, AND THAT IS A CORRECTION OF A REAL RISK RATHER THAN A
  STYLE PREFERENCE. The obvious wording for a finding on this surface is "this script is not
  wired — wire it". For one of the two scripts that sentence is false, and it is false against
  an approved high-priority record. A census whose output contradicts the store trains its
  readers to ignore it.


  WHAT IS DELIBERATELY NOT HERE. No expiry mechanism, no review date, no owner field beyond the
  cited record. Each was considered and each adds a second place where the disposition lives,
  which is the defect one level up: the cited record already carries the owner, the reasoning and
  the schedule, and duplicating any of that here creates two statements free to disagree. If the
  register ever needs an expiry, the honest form is that the cited record reaching its own
  completion invalidates the ground — which is a question for whoever builds that, not a field
  to mint now.
