estimated_complexity: S
it_requirements:
  - >-
    TIME THE COPY STEP, NOT THE FILE. Ten real builds at roughly thirteen seconds each
    dominate this file's total. A before-and-after of the whole file will show noise and
    the change will be judged on it.
  - >-
    RATIO, ONE SITTING, SAME MACHINE. An absolute second threshold on this host will be
    flaky, will fail on a loaded day, and will be deleted by whoever is unlucky enough
    to hit it.
  - >-
    A NULL RESULT IS A RESULT AND MUST BE REPORTED AS ONE. The point of agreeing the
    revert in advance is that the file-count argument is strong enough to win an
    argument it should lose. If the measurement disagrees, the measurement wins.
  - >-
    DO NOT RESTATE THE ESTIMATE AS A FINDING. "Tens of seconds" is a ballpark offered
    with its uncertainty attached in the source analysis. It must not reappear anywhere
    as an achieved saving.
  - >-
    THE VERDICT FUNCTION TAKES TWO DURATIONS AND RETURNS A VERDICT, AND THAT SHAPE IS
    WHAT MAKES THIS RECORD CHEAP TO PROVE. Two of the four descriptors feed it
    constructed timings. Keep the comparison in a pure function with no I/O, separate
    from the harness that produces real timings, so the scaling descriptor and the
    null-result descriptor cost microseconds instead of two real copies of an
    eleven-thousand-file checkout. If the verdict logic is inlined into the measuring
    code, those two descriptors become expensive and will be dropped.
  - >-
    SAME NUMBER OF COPIES ON BOTH SIDES, AND STATE IT. The criteria require "the same
    number of copies". The file makes eight; a before-and-after that times one copy
    against eight is a ratio about arithmetic rather than about copy size. Record the
    copy count alongside both durations so the comparison is auditable later.
  - >-
    REPORT WHERE THE MEASUREMENT CAN BE FOUND, NOT ONLY THAT IT HAPPENED. The parent's
    criteria require the measured figures to be reported "in place of the estimate".
    Put them somewhere durable — the AC's amended_by, or the changelog entry for the
    change — not only in a commit message body or an agent transcript, both of which
    this repository has already lost findings to.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-10
    contract: >-
      The smaller package copy, and the before-and-after copy timings taken around it.
test_spec:
  - name: test_tq600a_10_ii_both_copy_timings_are_taken_in_the_same_run
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Execute the measurement harness once. It produces a whole-checkout copy timing
      and a synthetic copy timing from that ONE invocation, over the same number of
      copies, and reports both figures and the copy count. The two timings coming from
      one invocation is the assertion — two numbers obtained separately satisfy the
      words and not the point.
  - name: test_tq600a_10_ii_the_claim_is_a_ratio_and_survives_a_slow_host
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    must_catch:
      - "the verdict compares against an absolute second threshold instead of a ratio, so scaling both durations by the same factor flips it"
    description: >-
      Call the verdict function with a pair of durations, then with both scaled by the
      same factor as a loaded host would scale them, and assert the verdict is
      unchanged. Constructed durations, no real copy: the behaviour under test is the
      comparison, and making it depend on a real measurement would make it flaky in
      exactly the way it exists to prevent.
  - name: test_tq600a_10_ii_a_measurement_showing_no_reduction_fails_the_change
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    must_catch:
      - "a pair of timings in which the smaller copy is not faster is reported as a success, so the agreed revert never triggers"
      - "the no-reduction case is reported as a warning rather than a failure, which is the same thing one step quieter"
    description: >-
      Feed the verdict function a pair of timings in which the smaller copy is not
      faster. It reports failure, not a warning. THIS IS THE DESCRIPTOR THAT CANNOT
      BE DROPPED: it is the only one that makes the agreed revert real rather than an
      intention, and it is cheap precisely because it feeds constructed numbers.
  - name: test_tq600a_10_ii_a_genuine_reduction_passes
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      The paired control. A pair of timings in which the smaller copy is faster is
      reported as a success, so a harness that rejects everything does not satisfy this
      record.
test_rationale: |
  Two of the four descriptors feed the harness constructed timings rather than real
  ones, which is deliberate: the behaviour under test is how the harness responds to a
  measurement, and the response to a disappointing measurement cannot be exercised by
  hoping for a disappointing measurement.

  The scaling descriptor is the mechanical form of the one-sitting-ratio rule. Scaling
  both figures by the same factor is exactly what a loaded host does, and a verdict that
  changes under that scaling is a verdict about the host rather than about the change.

  This repository has three recorded precedents of a check that examined nothing looking
  like a check that found nothing. A saving that was never measured looking like a saving
  that was measured is the same defect pointed at a performance claim.
