title: "Agents handle knowledge-query failures and format results consistently"
component: knowledge-management
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given agents need to handle failure modes and format knowledge-graph
    results during their knowledge-acquisition phases,
  When the knowledge-query script returns zero results, encounters an
    empty graph, fails to run, or returns overlapping nodes,
  Then the Agent Protocol section in SKILL.md defines the exact handling
    behavior for each case: log messages for zero-result and empty-graph
    conditions, graceful degradation on script failure, and citation and
    deduplication formats for overlapping findings,
  And agents proceed without error in all non-success cases using
    file-based context as a fallback.
