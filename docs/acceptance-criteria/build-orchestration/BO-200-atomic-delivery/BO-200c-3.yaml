criteria: |
  Given a ticket-supervisor reaches the commit phase,
  When the commit message needs to be composed,
  Then a dedicated commit agent is dispatched to write the message
    (the supervisor does not compose the message itself),
  And the commit agent uses the commit skill to encode project conventions,
  And the resulting message is attributed to the commit agent in the work envelope.
