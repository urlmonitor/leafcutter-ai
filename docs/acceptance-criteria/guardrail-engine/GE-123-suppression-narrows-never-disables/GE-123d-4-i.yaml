    description: "The same line placed at the scanner's own repository-relative source path is reported and blocks — the sharpest instance of an executable file inside a prose location"
  - name: test_generic_secret_exemption_does_not_follow_the_entropy_prose_prefix_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "In one run over a Python file under the skill-prompt area, the generic-credential finding is reported while the high-entropy rule's existing file-level exemption for that same path is unchanged — pinning that this AC narrows nothing about KI-CG-004 and inherits nothing from it"
test_rationale: "Both criteria are about which of two gates wins for a file the location list already covers, and that is only observable at the level of a real run: the second scenario asserts an exact count of one across two files staged together, which a predicate called twice cannot demonstrate. Each entry therefore runs the canonical templates/ copy of the pre-commit check as a subprocess against real files staged in a throwaway git repository and asserts on the exit status and the finding set. The fourth entry is deliberately a fence rather than a behaviour: it pins that the new generic-credential exemption and the pre-existing high-entropy file-level exemption (KI-CG-004) reach different verdicts for the same path, so that a later reader cannot mistake one for the other and cannot close this AC by touching that defect. The deployed angle is not charged; the project convention pins these tests to the canonical templates/ copy per ADR-001."
