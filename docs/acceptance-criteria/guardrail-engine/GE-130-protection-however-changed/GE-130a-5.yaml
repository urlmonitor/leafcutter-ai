readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the hooks reference catalogue and the shipped hook settings,
  When a reader looks up the documentation guard, the guide-read guard or the task-lock guard,
  Then each catalogue entry's matcher shows the editing tools and shell commands, identical to
    the matcher that guard is registered with in the shipped settings, established by reading
    both,
  And each entry states which command forms it refuses before they run, and that a command whose
    effect cannot be told beforehand is examined afterwards and stops the run rather than being
    refused,
  And the guide-read guard's entry states that a guide printed by a shell command counts as read
    and that listing or naming it does not,
  And the task-lock guard's entry states that reading commands and the build workflow's own
    steps are not refused under the lock,
  And each entry states which rollout stage, warn-only or blocking, the guard is in on the
    command path.
