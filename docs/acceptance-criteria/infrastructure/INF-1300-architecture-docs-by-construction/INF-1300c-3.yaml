id: INF-1300c-3
title: "Listing the same document twice updates its entry rather than adding a second one"
component: infrastructure
components:
  - documentation_system
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300c.yaml"
criteria: |
  Given the index already lists a document at a given place in the collection,
  When the listing is requested again for that same place, with a changed title or
    a changed state,
  Then the existing entry is brought up to date where it already sits, and no
    second entry for that place appears,
  And every other entry in the index is unchanged, character for character,
  And given the listing is requested twice with nothing changed in between,
  When the index is read after each request,
  Then the index is identical after the second request to what it was after the
    first,
  And an entry whose document has been moved or removed from the collection is not
    left pointing at nothing without that being visible to a reader of the index.
depends_on:
  - INF-1300c
