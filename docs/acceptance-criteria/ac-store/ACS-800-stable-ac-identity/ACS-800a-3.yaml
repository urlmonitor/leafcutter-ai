id: ACS-800a-3
components:
  - ac_store
readiness: approved
priority: high
title: "Every requirement in the store has exactly one unique UID"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given the full set of requirements currently stored,
  When the store is validated for identity integrity,
  Then every requirement carries a non-empty stable UID,
  And no two requirements share the same UID,
  And a creation or edit operation that would produce a requirement with a
    missing UID or a UID already held by another requirement is rejected with an
    error that names the duplicate UID and both requirements that claim it.
