readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run in which some records present in the store could not be read,
  When the reconciliation reports,
  Then it states how many records it could not read and names them,
    And its result reads as incomplete,
    And it does not state that no conflicts were found.

  Given a run in which every record present was read,
  When the reconciliation reports and no pairing disagreed,
  Then its result reads as clean,
    And the clean result states the number of records it covers,
  So a clean result is a claim about a known population rather than an absence of
    output.

  Given a run in which the number of records examined is smaller than the number
    present,
  When the reconciliation reports,
  Then the result reads as incomplete even where every record it did examine
    agreed,
  So partial coverage cannot produce a clean verdict.

  Given a run that could not read the store at all,
  When the reconciliation reports,
  Then it reports that it could not run, naming why,
    And it produces no clean result and no conflict count,
  So a reconciliation that did not happen is never mistaken for one that found
    nothing.
