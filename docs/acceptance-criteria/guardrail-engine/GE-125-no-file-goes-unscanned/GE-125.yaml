readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  No file loses credential detection because of where it sits.

  The check that stops a credential reaching the project's permanent history
  currently stops looking at some files entirely, and decides which ones by
  their location rather than by what is in them. The credentials it stops
  looking for are the ones with no recognisable shape — the modern, opaque kind
  a service hands you — so the protection that is switched off is the only
  protection those values ever had. Nothing is said when this happens, so a
  clean result and an unexamined file look identical. After this goal, the
  reduced scrutiny applies only where it was meant to and only to material that
  cannot execute, it is applied one finding at a time rather than to whole
  files, and wherever it applies you are told.
