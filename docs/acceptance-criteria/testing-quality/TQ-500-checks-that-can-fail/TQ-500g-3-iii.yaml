test_rationale: The matching rule is pure source analysis, so unit tests feed base and working-tree source straight
  to _cs_asserts and pin each rule and its exact detail text, including the swap case that a count or multiset rule
  misses and the controls (J, inserted assertions, approx to exact) that a position or any-change rule would wrongly
  stop. The integration tests use a real temp git repo and the real record step, because 'existed before the work'
  is a git fact and the list must not exempt; the marker-file test proves nothing is run; the finish test proves
  the stop is reached on the one entry every route calls.
