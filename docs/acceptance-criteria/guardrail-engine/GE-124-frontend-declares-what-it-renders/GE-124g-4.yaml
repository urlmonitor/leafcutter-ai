id: GE-124g-4
readiness: approved
priority: high
title: "A test that only finds the element does not cover the criterion"
component: guardrail-engine
components:
  - testing_quality
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124g.yaml"
criteria: |
  Given a front-end test that declares it covers UXP-100d-2
  And its body locates the element by the selector derived from UXP-100d-2 and
    asserts only that the element is present
  When the test is assessed as evidence for that criterion
  Then it is not accepted as covering UXP-100d-2
  And the reason given names the missing part — the test locates the element but
    asserts nothing about the criterion

  Given a front-end test that declares it covers UXP-100d-2
  And its body locates the element by the same selector and asserts that an
    out-of-stock plant shows the sold-out state
  When the test is assessed as evidence for that criterion
  Then it is accepted as covering UXP-100d-2

  Given a front-end test whose only assertion is that an element carries the
    expected criterion marker
  When the test is assessed as evidence for that criterion
  Then it is not accepted as covering it

  Given any attempt to configure an existence-only test to count as covering a
    criterion
  When the configuration is loaded
  Then no such setting exists
depends_on:
  - GE-124g
  - GE-124f-3
