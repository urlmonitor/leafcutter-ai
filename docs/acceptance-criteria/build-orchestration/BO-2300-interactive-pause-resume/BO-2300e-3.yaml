amended_by:
  - reason: "it-po enrichment (2026-09-29): assigned_agent python-coder -> llm-expert, for consistency with every other AC in this feature folder that edits templates/workflows-js/plan-feature.js (see BO-2300e-2's amended_by for the full precedent list). Added it_requirements flagging that this fix, unlike BO-2300e-2's routing-only change, is likely to add net content lines against the check-file-size ratchet (KI-CG-20260923) and must be resolved via a shared classification helper or an explicit escalation, plus a reachability requirement tied to BO-2900a-3. Criteria unchanged."
  - reason: "business-analyst wording fix (2026-09-29): replaced the verb 're-persist' with 're-establish' in the third Then/And clause (does not resume, clear, re-persist -> re-establish, or otherwise act on the run...). check-ac-schema's declares_side_effect derivation (_DURABLE_EFFECT_RE in _ac_schema_validators.py) matched the bare 'persist' stem inside 're-persist' -- the regex's persist(?:ed|s)?\\b alternative has a trailing \\b but no leading one -- and, having no notion of negation, read this record's explicit denial of persisting as an assertion that it DOES persist, wrongly demanding declares_side_effect: true. This record asserts no durable effect at all: its Then clauses are exclusively about how an outcome is REPORTED and about what the workflow must NOT do (not proceed, not resume, not clear, not re-establish/re-persist). Meaning is unchanged -- 're-establish' names the same prohibited action (bringing the pause record back into being as though the check had legitimately found it empty) that 're-persist' named; verified the replacement against every alternative in _DURABLE_EFFECT_RE (written to disk/a file; <durable noun> is/are written; is/are written to/into/under; writes/saves a/the/an file/record; persist(ed/s); saved to disk; is/are saved; record is persisted; created/removed from disk; deletes a file; state-changing command; leaves the system in a different state; changes the system's state; commits a change/transaction; pushed to; deployed to; updates the database/store) and none matches. The declares_side_effect derivation now correctly returns False; the field is deliberately NOT set on this record, in either direction. The regex's own leading-\\b gap and its lack of negation-awareness are real defects in the guard itself and are being filed separately as a known issue -- this edit works around them without weakening the criterion or authoring a false declares_side_effect value."
