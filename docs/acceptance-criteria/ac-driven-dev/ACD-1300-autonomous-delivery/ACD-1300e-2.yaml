priority: medium
criteria: |
  Given a feature run has persisted its workspace, completed AC evidence, counters and next safe step
  When the worker restarts or is re-enabled
  Then it recovers the same run and worktree instead of starting a second feature build
  And it retains attempt, elapsed-time and review counters
  And it reconciles any uncertain in-flight action or remote proposal before deciding which action can safely continue
  And an unresolved recovery uncertainty remains a visible blocker
