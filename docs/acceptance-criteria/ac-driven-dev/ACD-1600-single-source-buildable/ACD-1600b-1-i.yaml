criteria: |
  Given a ticket lacks a resolvable source_ac (the field is absent or points to a non-existent AC),
  When a phase agent tries to resolve its authoritative spec,
  Then it halts and reports the missing or unresolvable pointer,
  And it does not proceed by treating the ticket body as the authoritative spec.
