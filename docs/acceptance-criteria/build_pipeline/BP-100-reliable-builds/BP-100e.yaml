id: BP-100e
title: "Sign-off timestamps are always machine-parseable — no ambiguous dates slip through"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  Every sign-off and comment heading carries a precise, parseable timestamp.

  When an agent signs off a ticket, the pre-commit hook guarantees the
  timestamp conforms to YYYY-MM-DD HH:MM — rejecting prose approximations
  like "(current session)" or "(now)" that break chronological ordering.
  The signoff skill recipe enforces a mandatory time-capture step before
  any edit, so agents cannot skip it. The result: audit trails you can
  sort and query without manual cleanup.
