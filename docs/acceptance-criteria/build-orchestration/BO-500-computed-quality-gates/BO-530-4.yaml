it_requirements:
  - "The smoke check must exercise a real render of the changed surface (dev/route render), not a static/type/lint check — render-time-only misconfiguration (e.g. ssr:false) must be reachable by the check."
  - "On render failure the sign-off MUST be failed/blocked, never advisory — a render failure cannot be downgraded to a warning that still allows an 'ok' sign-off."
  - "The deterministic render-and-capture helper (launch dev render, exercise the changed route, classify success vs render error) is a python-coder/webapp-testing surface; this AC owns the sign-off-gate behavior in the frontend-coder template + signoff skill."
delivers_to:
