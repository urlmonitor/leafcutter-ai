id: GE-120a-3
title: "The numbering rules for all four namespaces are written down in one place"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a contributor who is about to create a new acceptance criterion, decision record, work
    item, or architecture diagram, and who does not already know this project's conventions,
  When they open the numbering reference document,
  Then it states the one-number-one-artifact rule ONCE, as a single rule that all four
    namespaces obey, rather than as four separately-worded rules,
  And for each of the four namespaces it states: the shape the number takes, where the
    authoritative list of already-claimed numbers lives, and how to obtain a free one,
  And for each namespace it states which artifact is expected to move when two claim one
    number, so the reader is not left to negotiate that at the moment of a block,
  And it states that a number, once published, is never reused — including numbers belonging to
    retired artifacts,
  And the document is reachable from the documentation index,
  And the document does not duplicate the enrolment rule, which GE-120b-4 adds to this same
    document as a distinct section.
depends_on:
  - GE-120a
  - GE-120a-1
  - GE-120a-2
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: context
    status: exists
    relevance: "Today the acceptance-criterion identifier format and the never-reuse rule are documented HERE and nowhere else, and only for that one namespace. The three other namespaces have no written numbering rule at all. This AC is what stops a four-namespace rule living in a one-namespace document."
  - path: docs/architecture/adrs/README.md
    relationship: context
    status: exists
    relevance: "States 'Every ADR owns exactly one integer' — the only place the uniqueness rule is currently written for the decision namespace, buried in a generated index."
  - path: scripts/next_diagram_seq.py
    relationship: context
    status: exists
    relevance: "The diagram allocator. Its own docstring calls itself 'the canonical source of truth for sequence allocation', but no user-facing document points a contributor to it — which is a large part of why the unnumbered diagram population exists."
  - path: docs/reference/artifact-numbering.md
    relationship: modifies
    status: planned
    relevance: "IT PO 2026-08-17 — the concrete home for the one document GE-120a-3, GE-120b-4 and GE-120d-5 all write sections of. docs/reference/ is the established surface for lookup-shaped rules, and a new file avoids expanding either single-namespace incumbent into a four-namespace authority."
  - path: docs/conventions/adr-numbering.md
    relationship: modifies
    status: exists
    relevance: "The existing single-namespace numbering convention. It must be re-pointed at the new four-namespace reference for the shared rule rather than left as a competing statement of it — two documents stating the same rule is the drift this AC exists to prevent."
  - path: docs/architecture/adrs/ADR-029-adr-number-collision-prevention.md
    relationship: context
    status: exists
    relevance: "Carries the free-number rule the never-reuse clause must reproduce exactly: a number is free only when it has neither a file nor a citation. Reusing a number that text still cites converts a dangling reference into a confidently wrong one."
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "The document is `docs/reference/artifact-numbering.md` — one new file, three sections written by three ACs (this one the rules, GE-120b-4 the enrolment table, GE-120d-5 the bypass rules). Do not create three documents and do not expand `docs/reference/ac-schema.md` or `docs/conventions/adr-numbering.md` into a four-namespace authority; both are single-namespace documents whose scope would then contradict their own titles."
  - "`docs/conventions/adr-numbering.md` and `docs/reference/ac-schema.md` must be re-pointed at the new document for the shared one-number-one-artifact rule rather than continuing to state it independently. A rule stated in two documents is a rule that will drift, which is the failure this AC exists to prevent."
  - "The never-reuse clause must reproduce ADR-029's operative definition rather than a looser paraphrase: a number is free only when it has NEITHER a file NOR a citation. 'No file exists at this number' is the wrong test and converts dangling references into confidently wrong ones."
  - "Doc frontmatter is mechanically enforced: `check-doc-frontmatter`, `check-description-field` and `check-doc-length` all gate `docs/**/*.md` at commit time, and `transform-doc-index` regenerates `docs/INDEX.md`. Index reachability is satisfied by that regeneration, not by a hand-added link — verify by running build.py and confirming the entry appears."
  - "The per-namespace 'where the authoritative list of already-claimed numbers lives' must name the real surfaces and must include the loose files, not only the folders: `GE-114-*.yaml`, `GE-115.yaml` and the GE-119 record sit at the namespace root, so a folder-only listing under-reports what is taken and is itself a way to mint a second collision."
  - "The which-artifact-moves rule per namespace must match the rule the gate's own message emits (GE-120c-2) — the document and the block message are read together by a blocked author, and a divergence between them is worse than either alone."
test_required: false
test_rationale: |
  change_target is docs and the deliverable is prose; there is no executable behaviour to
  assert. Verification is the documentation-verifier phase plus the mechanically-enforced
  frontmatter and index gates (check-doc-frontmatter, check-description-field, check-doc-length,
  transform-doc-index). The one substantive consistency claim — that the documented
  which-artifact-moves rule matches the wording the gate emits — is asserted from the code side
  by GE-120c-2's output tests and by GE-120b-3's quote-the-real-wording requirement, so it does
  not need a duplicate assertion here.
delivers_to: null
expects_from:
  ac_id: GE-120a-1
  contract: "The set of namespaces the uniqueness pass covers and the number shape it recognises per namespace, so the document describes the rule that is actually enforced."
