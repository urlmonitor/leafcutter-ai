notes: |
  The second case is the reason the old halt existed. When a test-writer writes tests that
  pass against nothing, those tests are green at baseline just like real backfill tests.
  Only the mutation proof tells the two apart, so it must refuse when there is nothing to
  break and must not take that as a pass.
