notes: |
  The coverage analogue of the phantom-done family (BO-2500, BP-1100): a green verdict
  over a partial scan is a phantom all-clear. Cited as a parallel only — those trees
  govern proof that WORK is done, this governs proof that a QUERY was complete. Do not
  fold this AC into them.

  TQ-100c-2-i is the nearest neighbour and is deliberately not duplicated: it asks
  "does this one done AC have a test?", this asks "how much of the population did your
  verdict actually see?".

  ==========================================================================
  THE SELF-CONTRADICTION IS RESOLVED (2026-08-13, expert review).
  ==========================================================================
  The original clause read: "an unqualified all-clear is available only when every
  consumed answer covered its full total with all remaining records declared as
  exclusions with grounds". That is incoherent — covering the FULL total leaves no
  remaining records to declare, so the two halves of the condition cannot both hold.

  The reading now adopted, stated unambiguously in the criteria: an unqualified
  all-clear requires covered == total, with NO declared exclusions and NO
  could-not-classify records. Any declared exclusion, however legitimate, produces a
  QUALIFIED verdict carrying the covered count and the exclusion grounds. The rejected
  alternative reading — that a reconciled answer with declared exclusions unlocks an
  unqualified all-clear — was rejected because it would let a verdict over "0 covered,
  180 declared excluded" print an unqualified all-clear, which is the exact defect this
  L1 exists to stop.

  CONSISTENCY WITH ACS-1100c-2 (checked explicitly). ACS-1100c-2 PASSES the "0 covered,
  all declared excluded" case, and that stays true — the two ACs govern different
  things. ACS-1100c-2 governs whether the ANSWER halts (it does not: the arithmetic
  reconciles). This AC governs what a VERDICT built on that answer may CLAIM (clear for
  0 of 180, never an unqualified all-clear). Reconciling is not the same as being
  all-clear-eligible, and the criteria now say so in a clause of their own so no
  implementer has to infer it.

  The halted-input clause closes the obvious loophole: if a halt could be downgraded to
  "pass, coverage 0 of 31", the halt of ACS-1100c-1 would buy nothing downstream. It now
  covers the ACS-1100d-1 dropped-coverage halt too.
