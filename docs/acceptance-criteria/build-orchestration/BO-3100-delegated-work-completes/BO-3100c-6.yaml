assigned_agent: architecture-diagram-author
estimated_complexity: M
change_target: docs
risk_surface: internal
it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert — for the same reason the diagram itself states."
  - "'NO DISPATCH ARROW BETWEEN TWO SPECIALISTS' IS THE LOAD-BEARING ELEMENT and must be a declared, checkable property of the drawing, not a happy accident of the current layout. It states the durable invariant as a shape rather than as a rule to remember, which is the only form that survives the rule being forgotten."
  - "The coordinating layer must be marked as the only element that dispatches AND awaits, and specialists marked as elements that do work and return. The two capabilities must be separate declared attributes, because 'dispatches' alone does not distinguish the correct arrangement from the broken one — the broken one dispatched too."
  - "The coherence claim must be enforced by an executable test comparing the diagram's declared dispatch edges against the dispatch record of a real drive in BOTH directions: no drawn edge that never occurs, and no occurring dispatch that is undrawn. A diagram that omits a dispatch that actually happens is how the belief drifted away from the behaviour in the first place."
  - "The diagram page must declare its elements, their capability attributes, and its edges in a machine-readable form so the coherence test reads data rather than a picture."
  - "The comparison must be made against a drive that exercised more than one entry point, or the drawing can be complete for one path and silent about the rest."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
delivers_to:
  - agent: reference-author
    contract: "The published diagram path and its declared element capabilities, so BO-3100d-3's delegation reference can point an author at the shape before they design new coordination."
expects_from:
  - ac_id: BO-3100c-1
    contract: "The per-dispatch runtime record {dispatch_id, source, target_step, ...} from a real drive — the data the drawn edges are compared against."
  - ac_id: BO-3100c-2
    contract: "The sweep's clean verdict across entry points, establishing that the absence claim the diagram draws is actually true before it is drawn."
test_spec:
  - name: test_bo_3100c_6_diagram_declares_capabilities_and_no_specialist_to_specialist_edge
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Parse the declared elements and edges: assert the coordinating layer carries both the dispatches and awaits attributes, specialists carry neither, and no declared edge has a specialist at both ends."
  - name: test_bo_3100c_6_diagram_matches_a_real_drive_both_directions
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "THE COHERENCE CHECK. Drive real work through more than one entry point, collect the dispatch records, and assert two-way equality with the diagram's declared dispatch edges — every drawn edge occurred, every occurring dispatch is drawn."
  - name: test_bo_3100c_6_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  This is the diagram a future author consults before adding coordination, so its cost of being
  wrong is the whole defect recurring. The two-way coherence test is what makes it a check
  rather than an illustration: the direction that matters most is the unusual one — an occurring
  dispatch that is NOT drawn — because that is precisely how the picture and the behaviour
  drifted apart before.
  Requiring more than one entry point in the comparison closes the obvious loophole: a drawing
  complete for one path and silent about the others would pass a single-path check while leaving
  the reader with a false map.
  Deliberately NOT covered: layout and legibility, which are human judgement.
