title: "Cache TTL expiry mid-drive re-primes the prefix instead of dropping it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the cache TTL elapses between two invocations during a drive,
  When the next invocation runs,
  Then the stable prefix is re-sent to re-prime the cache (a cache-write occurs)
    rather than being omitted
  And the resulting cache miss is observable in the recorded telemetry.
