notes: |
  WHY THIS IS A SEPARATE L2. AR-400b's notes: "a check that is a fault rather
  than a warning must be right about what counts as an instruction, or it will
  be switched off". This record is the "misses real references" half (narrow
  phrasing, letter case); its L3s are the "flags false ones" half and the two
  diagnostics. The eight forms are the ones the real tree uses on 2026-10-12;
  they are a floor, not a closed list.

  WHAT HAPPENS TO A CASE-ONLY MISMATCH IS AR-400b-2-v. This record only requires
  that it be recognised and attributed to the right identifier.

  RECOGNITION FEEDS BOTH L1s. AR-400a-1 checks existence over exactly what this
  rule recognises; housing it under AR-400b reflects where the L1 placed the
  "correctness of recognition" promise.
