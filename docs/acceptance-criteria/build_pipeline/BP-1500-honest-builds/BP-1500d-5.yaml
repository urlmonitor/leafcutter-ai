notes: |
  WHY THIS CHILD EXISTS. BP-1500d carries documentation_triggers: [reference-doc], so
  a documentation AC is required alongside the behavioural ones. It is the fifth and
  last child, which puts this L1 exactly at the five-child cap with no override.

  HOW IT OBEYS THE MANDATORY PROOF SHAPE. BP-1500d's notes bind every child to proof
  by running a real build into a project outside the producing package's own parent
  folder, with a negative control, and forbid proof by reading source for a string. A
  documentation AC accepted on "the document exists and mentions the record" would be
  precisely the grep-shaped acceptance that rule exists to refuse -- and would be
  especially hollow here, because the defect being documented is invisible from inside
  the producing package's own workspace. So the subject of the criteria is not the
  document's contents but what happens when a reader FOLLOWS it against a real
  out-of-package install, and the negative control is the same pair of deliberately
  non-portable installs the behavioural children use.

  WHAT THE REFERENCE MUST NOT BECOME. Not a how-to for rebuilding, and not a
  restatement of BP-1500c's drift guarantee. Its subject is where the record lives,
  what makes it readable elsewhere, and what the two silent outcomes look like from an
  adopter's side.

  ASSIGNED AGENT. assigned_agent is set here and left null on the behavioural
  children, because documentation-expert is definitional to what a documentation AC
  is rather than technical enrichment. The it-po should still review it and owns every
  other technical field on this record.

  ORDERING. The reference can only be checked against installs produced by BP-1500d-1
  through -4, so it is the last of the five to become verifiable. depends_on carries
  only the parent link, as the authoring request specified.
