assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    AGENT CONFIRMED BY FILE TYPE: python-coder. The surface is a workflow script under
    templates/workflows-js/; every other record that modifies finalize-feature.js
    (FIN-100g-3, FIN-100g-4-i, FIN-100f-2, BO-1000b-1-i and others) assigns python-coder,
    and the test is a Python unittest driving the script through the Node harness.
    frontend-coder is for web UI, llm-expert for prompts (that half is TQ-600a-13-xviii).
  - >-
    SCOPE — ONE SCRIPT, BY EVIDENCE. Both scripts named in -xviii's follow-up were read on
    this branch (fresh off origin/main, 2026-10-14). Only finalize-feature.js needs a
    change.
    (a) templates/workflows-js/finalize-feature.js DOES NOT READ PR CHECKS ANYWHERE. Its
    only `gh pr` reads are `gh pr list` (Step 1, ~line 921), and `gh pr view --json state`
    (Step 3.5 at ~line 1422 label `step-3.5-pr-state`; Step 4 at ~line 1852-1858 label
    `step-4-pr-state`; Step 7's `announceUnpublishedLearnings()` at ~line 203-229 label
    `step-7-pr-merged-probe`). Its regression halt (`reason: "test_regression"`, Step 3,
    ~lines 1085-1382, and the Step 4 defensive guard at ~lines 1836-1849) is driven by
    LOCAL post-merge test runs and test-failure-triage, never by PR checks, so the hold
    cannot be misread as a regression there. THE REAL MISCLASSIFICATION IS IN STEP 4:
    after the confirmation gate (`resolveGate("step-4-merge-gate", ...)`, ~lines
    1874-1912) it dispatches `pull-request` (label `step-4-merge-pr`, ~lines 1921-1927)
    with `gh pr merge <N> --merge --auto`, then UNCONDITIONALLY does
    `completedSteps.push(4); outcome('Step 4 of 9', 'PR #N merged to main')` (~lines
    1929-1930) without reading `mergeResult`. With `--auto` and a failing required check,
    GitHub queues auto-merge and the PR stays open — so a held PR is recorded as merged,
    Step 5 syncs an unchanged main, Step 7 removes the worktree, and the run returns
    `status: "ok"` "finalized" (~lines 2088-2141). That is the false-success direction:
    the hold is reported as neither external nor a failure, but as done.
    (b) templates/workflows-js/fast-lane-ship.js NEEDS NOTHING. It ends at "Phase 6 — Pull
    Request" (~lines 2033-2153): it dispatches `pull-request` (label `fastlane-pr`) with
    an explicit push / create / return script and returns; it never merges, never reads
    PR checks, never polls. Its terminal payload is built by
    `buildFastLaneDeliveryOutcome(prUrl, unsatisfiedRequiredChecks)` (~lines 421-458),
    called once at ~line 2130 with a LITERAL `[]` — that list carries only checks the run
    itself evaluated before commit (the changelog-presence gate), not GitHub check
    results. No path in the script can classify `Post-merge suite status` at all. Should
    a future change feed real PR check results into that list, this record's rule must be
    applied there too (the hold would otherwise land in `status: "blocked"` as an
    unsatisfied required check, i.e. as the branch's own).
  - >-
    WHERE THE READ GOES. In Step 4, after `step-4-pr-state` reports OPEN and BEFORE the
    merge confirmation gate, so the user is never asked to merge a held PR: one dispatch
    (status-checker, a new label — indicative `step-4-pr-checks`) running `gh pr checks
    <N> --required --json name,state,bucket,link,description` and returning the JSON
    array verbatim. Note `gh pr checks` exits 1 when any check fails and 8 when any is
    pending — the reply must still carry the array; the prompt says so. The E2 engine has
    no process or filesystem access (ADR-024), so the read is necessarily a dispatch and
    the classification is a PURE function over its reply (indicative
    `classifyPrChecks(checks)` -> `{ hold: <entry|null>, ownFailures: [<entry>...] }`),
    defined in the script and safe to execute directly. Recognition is by EXACT name
    `Post-merge suite status` (TQ-600a-13-vi's settled ruleset string) and a failing
    state (`bucket: "fail"`, or `state` FAILURE / ERROR / CANCELLED / TIMED_OUT /
    ACTION_REQUIRED when `bucket` is absent). No case-folding, trimming or prefix match.
    A same-named check from another source can only make the workflow stop — the
    conservative direction — so source pinning is not needed here (-x owns that).
  - >-
    THE THREE OUTCOMES (names indicative; the distinctness is the requirement).
    Hold failing, no other failing check: no merge gate, no merge dispatch; return
    `{ status: "halted", halted_at_step: 4, reason: "held_externally", external_hold:
    { name, state, link, description }, ... }` with a message quoting `description`
    verbatim and the link, saying the cause is the correctness lane on main and not this
    branch, that a later /finalize-feature run completes the merge once the hold lifts
    (Step 4's existing `step-4-pr-state` MERGED probe already makes that resumable), and
    that a broken hold check is the owner's break-glass (TQ-600a-13-xvii) which agents and
    workflows never perform. `reason` must never be `test_regression` or the branch-failure
    reason, and `status` never "ok". Step 4 records an outcome line (one per path, per the
    repo CLAUDE.md skip-branch rule).
    Hold failing beside others: no merge; return a branch-failure halt (indicative
    `reason: "required_checks_failing"`) listing the OTHER failing checks as
    `own_failures` and the hold separately as `external_hold`, never inside
    `own_failures`.
    Hold not failing: Step 4 continues exactly as today (gate, merge dispatch, existing
    outcome recording), whatever the other checks say — this record does not change how
    non-hold failures are handled when the hold is absent.
    Unreadable or malformed checks reply: log it and continue exactly as today; never
    classify an unreadable reply as a hold (GitHub still enforces the required check).
  - >-
    FORBIDDEN ACTIONS ARE OBSERVABLE AS DISPATCHES. After the checks read on the held
    paths the only dispatch permitted is the baseline cleanup already used by every halt
    (`cleanupBaselineWorktree()`). No `step-4-merge-gate`, `step-4-merge-pr`, Step 5 sync,
    Step 6, or Step 7 removal dispatch; no prompt that runs `git push`, `git commit`,
    `gh run rerun`, `gh pr checks --watch`, `gh pr edit`, or names .github/workflows/
    post-merge-*.yml, scripts/ci/, scripts/ci/post_merge_tunables.json, the ruleset or a
    `post-merge-red` issue. The checks read itself happens exactly once per run.
  - >-
    OUT OF SCOPE, FILED AS A FINDING, NOT FIXED HERE: Step 4 also records "merged" without
    reading `mergeResult` when the hold is NOT the cause (any other blocked merge, a
    queued auto-merge, an agent refusal). That is a separate false-success defect in the
    FIN-100 family and changes the hold-absent path this record promises to leave alone;
    it needs its own record. Likewise whether `--auto` should stay on the merge command.
  - >-
    TEST COST: about 0.2-0.7 s per harness run of finalize-feature.js (measured
    2026-10-14 on this host: the five INF-700a-5-i finalize harness tests took 2.81 s in
    total including collection). Four runs (A, B, C, plus the near-miss name) plus the
    pure classifier cases stay under about 4 s, inside the family's 15 s default-run
    budget, and the test stays in the default run. No build.py, no network, no `gh`.
delivers_to: null
