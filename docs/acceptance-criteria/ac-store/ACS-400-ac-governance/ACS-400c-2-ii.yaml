test_required: true
test_spec:
  - name: test_a_record_taken_from_the_other_parent_is_not_an_amendment
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: scripts/commit_guardian/check_ac_governance.py
    description: "A real git repo with a real id collision resolved in the other branch's favour; the hook must exit 0 rather than demand amended_by for criteria the committer did not write."
  - name: test_a_real_criteria_edit_during_a_merge_is_still_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    surface_invoked: scripts/commit_guardian/check_ac_governance.py
    description: "Same merge, but the staged record matches NO parent. The refusal must still fire -- this is the anti-over-broadening guard that stops the fix becoming a merge-shaped hole."
  - name: test_outside_a_merge_a_criteria_edit_is_still_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    surface_invoked: scripts/commit_guardian/check_ac_governance.py
    description: "An ordinary commit on a real repo with no MERGE_HEAD. Proves the baseline resolver did not relax the gate for the overwhelmingly common case."
test_rationale: |
  The existing governance tests all run with HOOK_NO_GIT=1, which makes
  _load_head_content return None before any git call. That simulation path cannot
  reach the behaviour this record is about, so every one of them would stay green
  through the defect and through a broken fix alike.

  These tests therefore build a REAL temporary git repository, create a REAL id
  collision on two branches, and leave a REAL merge in progress with MERGE_HEAD on
  disk, then invoke the deployed hook as a subprocess. That is the only arrangement
  in which the distinction under test -- "differs from HEAD" versus "authored by
  this commit" -- physically exists.

  The second and third cases carry as much weight as the first. The fix's whole
  risk is that it excuses too much, and a suite containing only the positive case
  would pass just as happily against a hook that skipped the amended_by audit
  during any merge whatsoever.
