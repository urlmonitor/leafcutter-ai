created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300b.yaml"
criteria: |
  Given a docs folder whose pages include a description containing the
    non-ASCII characters "—" (em dash) and "ü"
  When the documentation map is generated on a Windows host, whose default
    text line ending is CR LF and whose default text encoding may not be UTF-8
  Then every line of the map ends with a single LF character and the map
    contains zero CR characters
  And the map is encoded as UTF-8 without a byte-order mark
  And the "—" and "ü" characters appear in the map as their UTF-8 encodings,
    not as replacement characters or escape sequences
  And the map ends with exactly one trailing LF
  And generating from the same docs folder on a Linux host yields a file with
    the same line endings, encoding and trailing newline
depends_on:
  - KM-300b
