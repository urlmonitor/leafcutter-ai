title: "Handoff targets resolve in the actual consumer install tree — copy-tier presence is insufficient"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given a consumer install produced by running build.py --target-dir against a
    fresh project root,
  When each deployed command's Workflow(...) / Skill(...) handoff target is
    resolved against the deployed consumer tree (not against the templates/ source
    tree),
  Then every target resolves to an artifact that actually exists in the consumer
    install (by registry name or by a path present under the consumer root),
  And a target that is present only in templates/ but absent from the deployed
    consumer tree is treated as UNRESOLVABLE and fails the build,
  Because reachability must be asserted at the consumer surface, not merely at the
    copy tier.
