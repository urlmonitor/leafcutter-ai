id: GE-120g-2
title: "A commit is refused only because a check objected, and a set of verdicts that objects to nothing always lets it through"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a working copy that excludes nothing from version control, and in which the
    byproducts an earlier run of the checks left beside them are already tracked
    content,
  And a change is staged that every registered check accepts,
  When the author performs an ordinary commit — no extra command, no extra flag, and
    nothing invoked by hand,
  Then every check reports that it found nothing to object to,
  And the commit completes, and no reason for refusing it is reported at all,
  And given instead a change is staged that exactly one check objects to, every other
    check accepting it,
  When the author performs an ordinary commit,
  Then the commit does not complete,
  And the reason reported is that check's objection, naming the check and what it
    objected to,
  And whenever a commit does not complete, at least one check has reported an
    objection — the running of a check is never itself the reason, however that run
    went and whatever it left behind.
depends_on:
