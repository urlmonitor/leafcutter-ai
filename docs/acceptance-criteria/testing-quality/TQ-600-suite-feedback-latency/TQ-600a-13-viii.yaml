notes: |
  RESOLVED 2026-10-08 — the four points this record used to list: (1) merging the fix
  closes the notice, which no longer releases anything; (2) the label is dropped; (3) the
  full keyword family is accepted; (4) the description is the only place read, and any
  open notice number counts.

