title: "It reports before it blocks, and the switch to blocking is earned rather than scheduled"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store still holding records classified as unrecorded drift,
  When the store-wide check runs in its initial posture,
  Then it reports its findings and does not prevent work from merging,
  And when the same check is asked to adopt the blocking posture while records
    classified as unrecorded drift remain, it refuses and names the records that
    would have to be bypassed,
  And when it is asked to adopt the blocking posture against a store whose only
    remaining findings are classified as deliberate exclusions, it adopts it and
    thereafter prevents a newly introduced unrecorded child link from merging,
  And in the blocking posture the deliberate exclusions do not prevent work from
    merging.
