it_requirements:
  - "THE QUESTION MUST BE RAISED BY A LAYER THAT STILL HAS THE MEANS TO ASK. The harness strips AskUserQuestion from every subagent, so a gate raised from inside a dispatched agent cannot satisfy the first criterion at all — no prompt wording fixes it. In this system that layer is the workflow runtime, the same one BO-3100c relocates coordination to; the two must be sequenced together."
  - "REUSE THE EXISTING PAUSE SUBSTRATE (ADR-024 / scripts/pause_store.py). Do NOT author a second pause mechanism. Two pause stores are two places for a resumable record to be lost, and the third criterion — resume and find the work unchanged — is exactly what would silently stop holding."
  - "THE PAUSE RECORD MUST BE SUFFICIENT TO RESUME AT THE SAME QUESTION, not merely to restart the run. It must identify the gate, the choices offered, and the point to continue from. A record that only says a run was paused is a discard with a note attached."
  - "THE AUTHORED WORK MUST BE LEFT IN PLACE UNCHANGED — no rollback, no cleanup, no move to a quarantine location. The third criterion is asserted after an actual resume, so any 'tidying' on the pause path fails it."
  - "THE OUTCOME A CALLER BRANCHES ON MUST MEAN WAITING, not concluded. An unresolved gate reported with a terminal success or terminal cancel value is the false-success shape; PR #565 removed the default-to-discard, and this must not reintroduce a default-to-anything."
  - "THE PAUSE MUST BE REACHED WHEN ASKING IS IMPOSSIBLE, and impossibility must be DETECTED rather than assumed from the environment: the run must attempt to ask and pause on the absence of a means to receive an answer. Deciding in advance that a context is non-interactive is how a gate silently stops being asked."
  - "RESUME MUST BE IDEMPOTENT AND SINGLE-USE: resuming twice with the same answer must not double-apply the decision or duplicate the work authored before the pause."
delivers_to:
  - agent: python-coder
    contract: "A paused-at-decision run record extending the existing pause substrate: {run_id: str, gate_id: str, question: str, choices: list[str], resume_point: <opaque>, authored_paths: list[str]}, plus a terminal outcome value meaning `awaiting_answer` that is distinct from every settled value. BO-3200c-3 distinguishes this from a declined answer; BO-3200c-4's how-to is executed against a real run in this state."
  - agent: how-to-author
    contract: "How a person inspects a paused run, supplies an answer, and resumes it — the concrete commands and the record fields they read — so BO-3200c-4's steps can be run against a real paused run rather than described."
  - agent: architecture-diagram-author
    contract: "The ordered interaction trace of both paths — question reaching the person and answered; and question unaskable, run paused, record written, work left in place — so BO-3200c-5's diagram can be compared against each."
