title: "An AC referenced by multiple nodes is counted once in the feature rollup"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: in_progress
criteria: |
  Given an acceptance criterion referenced by two or more steps or branches in the same flow,
  When the feature-level "N/M ACs done" rollup is computed,
  Then that criterion is counted exactly once in both N and M,
  And the rollup total M is strictly the number of distinct ACs in the flow, never the sum of per-node AC counts.
