id: DK-600e-1
title: "A new decision looks up earlier published decisions through the index"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a new decision run whose task names the component decision_kernel and the roadmap phase
    phase_kernel_1_founding,
  And published records listed in docs/decisions/index.json,
  When the decision's precedent step asks the decision store for matches,
  Then candidates are chosen through the index by the component and roadmap-phase filters and by a
    text score against the question,
  And when the task names no component and no roadmap phase, candidates are chosen by the text
    score alone,
  And each candidate record's sha256 is checked against its index entry before the record is used,
  And only records listed in the index are candidates.
depends_on:
  - DK-600e
