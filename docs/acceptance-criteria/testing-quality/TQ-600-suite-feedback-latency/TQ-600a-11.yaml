  THE ORIGINAL test_rationale, PRESERVED BECAUSE TWO OF ITS ARGUMENTS GENERALISE.
  The weak test it was written against was "import the accessor and assert it
  returned the C class" — which passes on a change nobody adopted, on a store of
  three fixture files, and at a call site that must not have it, "which are precisely
  the ways this has already shipped broken, twice in opposite directions". From that:
  assert the speed claim over the REAL store, because the cost is a function of the
  store's size and a synthetic fixture reproduces none of it; assert it at the ENTRY
