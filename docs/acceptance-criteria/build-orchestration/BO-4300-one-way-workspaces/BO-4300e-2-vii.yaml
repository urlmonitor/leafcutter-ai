notes: |
  Observed defect 2 (2026-10-25): clearing a workspace whose current commit was detached
  answered a misleading NOT_FOUND. The user allowed either "remove it with the usual
  unsent-work checks against the commit it points at" or "refuse naming the detached state";
  this record picks remove-with-checks and states the detached state in any refusal. The
  gamma arm was not asked for: checking only the detached commit would miss unpushed commits
  still on the workspace's own line, so both are checked. The same defect may affect finding
  a workspace by location (BO-4300e-1); flagged to the orchestrator, not specified here.
