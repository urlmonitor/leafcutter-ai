rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.declare_then_merge] build GE-133 with both stores
    declared, then commit the E1 merge (required mean 0.77, 1/3 passed); 2. [opt.shard_by_prefix] shard the decision store
    by id prefix, then merge (required mean 0.57, 0/3 passed); 3. [opt.hold_and_defer] commit the merge now without the records,
    re-publish them in a later tracked PR (required mean 0.47, 0/3 passed); 4. [opt.hold_then_restore] commit the merge now
    without E1''s two records, restore them inside the E1 PR (required mean 0.45, 0/3 passed); 5. [opt.exempt_index_file]
    exempt the generated index.json by filename, then merge (required mean 0.41, 0/3 passed). user chose option [opt.declare_then_merge]
    build GE-133 with both stores declared, then commit the E1 merge (kernel rank 1 of 5).'
  origin: template
