it_requirements:
  - "This is a one-shot BACKFILL under the repository's backfill discipline: a second run is byte-stable (verify by running twice and diffing); infer-then-VALIDATE before any write; insert ONLY the `spawn_allowlist` frontmatter key (the key AR-300c-5 fixes) into each template, never rewrite a whole file or reformat unrelated keys; an agent whose permission cannot be derived unambiguously goes to a review report, never a guessed value. Place the script where one-shot migrations live, not in the build's hot path."
  - "THREE SOURCES, read independently and unioned per agent: (1) the registry `spawn_allowlist` field, (2) any existing frontmatter `spawn_allowlist` key, (3) the hand-written sub-agent table in the template BODY. The body-table parse must be validated against the five real on-disk tables (business-analyst, frontend-coder, test-writer, python-coder, architect-review), not hand-typed fixtures. llm-expert's checklist prose is NOT a table and is not a source."
  - "The macro `__ticket_phase_agents__` is carried across as that one list item, never expanded into the names it resolves to on migration day."
  - "Report every agent by name with the source(s) of each permitted sub-agent, a separate list of agents whose sources disagreed, and per-source holder counts. A total alone cannot be checked."
  - "An agent no source permits gains no key; an existing explicit `spawn_allowlist: []` (ac-triage, onboard-config-section) is left byte-identical. Empty and absent are equivalent downstream (AR-300a-5)."
  - "DECIDED, NOT OPEN (BrainCandy, 2026-10-09, decision 11): python-coder KEEPS test-runner. The union grants it; the registry's omission was drift, and test-runner is python-coder's documented inner-loop runner. The disagreement is still listed in the report (that is the criterion), but no review-report entry or user prompt is raised for it."
  - "SEQUENCING with decision 10: the consolidation produces the union exactly as the criteria state -- architect-review is declared architect-review-deep and the report lists the disagreement. The removal of architect-review-deep is a SEPARATE, later remediation step owned by AR-300c-5-iii's it_requirements; it must not be folded into the migration (a migration that silently drops a permission is the defect this criterion forbids). Order on the real tree: this consolidation -> AR-300c-5-iii remediation -> AR-300a-5-i body-table deletion."
  - "After the migration the registry `spawn_allowlist` becomes derived; do not hand-edit it here. It is regenerated from the declarations by the transform-agent-registry hook at commit time (AR-300c-5-ii), which is how python-coder's registry entry gains test-runner."
