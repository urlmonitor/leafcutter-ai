id: GE-125b-1-i
components:
  - security_scanner
  - commit_guardian
title: "The kind gate is applied at every reduced-scrutiny location, not only the one known to hold code"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a throwaway git repository holding the four listed locations at its root,
  And three files are staged for commit in one run, at the repository-relative
    paths
    "tickets/00_inbox/attachments/repro.py" — a reproduction script attached to
      an incident ticket,
    "docs/acceptance-criteria/example-component/EXMPL-001.yaml" — a record in the
      acceptance-criteria store,
    "docs/retrospectives/retro.md" — a retrospective write-up,
  And each of the three carries one identical line holding the same
    twenty-four-character opaque token used by the parent criterion, whose
    entropy is above the shapeless-value rule's threshold, and none of the three
    lines carries a ticket or epic identifier,
  And no suppression entries are in force,
  When the staged set is checked by the pre-commit secrets check,
  Then exactly two shapeless-value findings are reported across the three files,
    and they name "tickets/00_inbox/attachments/repro.py" and
    "docs/acceptance-criteria/example-component/EXMPL-001.yaml",
  And the retrospective is not reported,
  And the check exits reporting findings present, so the commit is blocked,
  Because the gate is decided from the kind of the file in front of it at
    whichever listed location that file sits, and not from a judgement about
    which locations are known to contain code. The skill-prompt area is where the
    executable content was measured; it is not the only listed location a script
    can be committed into. The acceptance-criteria record is reported for the same
    reason the script is: YAML is not an admitted kind, because the product owner
    decided on 2026-08-25 that the acceptance-criteria store shall be scanned.
    Only the Markdown write-up is prose the gate still admits.
depends_on:
  - GE-125b-1
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "CANONICAL SOURCE. The change lands in `templates/scripts/commit_guardian/check_secrets.py`; `scripts/commit_guardian/` and `.leafcutter/scripts/commit_guardian/` are build outputs per ADR-001 and a deployed-copy-only fix is reverted by the next `python scripts/build.py --target-dir .`. `check_hook_parity` enforces all four locations. Rebuild and re-run the commit_guardian suite before claiming this."
  - "THE GATE MUST BE LOCATION-AGNOSTIC BY CONSTRUCTION, NOT BY COVERAGE. There must be exactly one kind decision, applied to whatever file is in front of it, with no branch keyed to which of the four listed locations the file sits in. The cheap implementation that satisfies the parent — special-casing the skill-prompt area because that is where KI-SEC-001 measured executable content — is exactly what this AC exists to forbid, and it must be structurally impossible rather than merely untaken: a per-location branch is a defect even when all four branches currently agree."
  - "PRODUCT DECISION MADE 2026-08-25 — THIS AC'S SECOND FILE IS THE ARM THAT INVERTED, AND A CODER MUST NOT REOPEN THE DECISION. The acceptance-criteria record is REPORTED here, and that is a change from how this record was originally written. It was previously silent, because `.yaml` was on the admitted-kind list fixed by GE-125b-3, which meant this repository's own AC store kept the exemption it had and its YAML was never scanned for opaque tokens. That choice was recorded as OPEN in GE-125's notes and this AC was named there, in advance, as the arm that would invert if the decision were closed. On 2026-08-25 the product owner closed it: THE ACCEPTANCE-CRITERIA STORE SHALL BE SCANNED, the admitted list shrank to `.md` and `.txt`, THIS ARM INVERTED — the acceptance-criteria record moved from silent to reported and the expected count here rose from one to two — and GE-125b-3's first arm gained a finding. The decision was measured, not argued: over all 3,260 store records with the location exemption disabled and the `TICKET-`/`EPIC-` residual-entropy filter still applying, the store yields 58 findings across 48 files (1.4%), from 7 distinct strings that are all file paths scoring 4.51-4.56, with zero real credential markers found in the same sweep. Build the list exactly as GE-125b-3 specifies. A coder, reviewer or test-writer must NOT re-admit `.yaml` and must NOT 'fix' this arm back to one finding: the decision is CLOSED and reopening it requires the product owner, not an implementation judgement. If implementation surfaces a reason to change the list, STOP and raise it as a product question."
  - "THE LOCATION LIST AND THE TICKET-IDENTIFIER FILTER BOTH SURVIVE THIS, AND THIS AC MUST NOT BE READ AS EVIDENCE OTHERWISE. `docs/acceptance-criteria/` is still one of the four reduced-scrutiny locations — only the KIND gate narrowed, so a `.md` or `.txt` file in the store is still admitted there, which is why the third fixture is silent. Separately, the `TICKET-`/`EPIC-` residual-entropy filter is not path-gated and is untouched: a store line carrying a ticket or epic identifier whose residual entropy is below the threshold remains exempt everywhere, regardless of location and kind. That filter is why the measured store-wide number is 58 and not 625. The fixture line in this AC deliberately carries NO ticket identifier, so it exercises the kind gate rather than that filter; do not add one, and do not let this arm be cited as showing that store lines with ticket identifiers now report."
  - "COORDINATION WITH GE-123d-4-i, NOT A MERGE — AND THE TWO KIND LISTS NOW DIVERGE. GE-123d-4-i governs the kind gate on the PROPOSED `GENERIC_SECRET` exemption; this governs it on the EXISTING `ENTROPY_HIGH` one, and its contract already requires that if the location data is ever shared between the two, the kind gate is applied on both sides or the sharing does not happen. After the 2026-08-25 decision the two admitted-kind lists differ — `.md`/`.txt` here, `.md`/`.yaml`/`.yml`/`.txt` in GE-123d-2 — so sharing the location data now also requires reconciling the lists first. The divergence is recorded in GE-125b-3's notes. Neither record closes the other. Do NOT edit any GE-123 file and do NOT add a depends_on edge into the GE-123 tree."
  - "THROWAWAY ROOT, AND ASSERT IT IS NOT ITSELF EXEMPT. All three fixtures are real files inside a `tempfile`-backed throwaway git repository with the listed locations constructed INSIDE that root; none may be written under this repository's own `tickets/`, `docs/acceptance-criteria/` or `docs/retrospectives/` trees. Because the location match is a substring test (KI-SEC-001), assert as a precondition that the root path ABOVE the constructed directories contains none of the four segment names. If the check cannot be pointed at a throwaway root, raise that as a defect against this goal and stop — it is not a licence to place a fixture in a real prose tree."
  - "THE LIVE-PATH CONTROL IS MANDATORY IN THIS INVOCATION. Every one of the three paths here contains a listed name, so the one silent file is evidence only alongside a file the exemption cannot reach that is reported in the same run. Carry the parent's `scripts/build_probe.py` control into this test — as a fourth staged file or by running in the same invocation — and assert it IS reported. Without it a fixture whose token never reached the entropy threshold produces an identical green result."
  - "VERIFY BY EXECUTION AND BY EXACT COUNT. Stage the files in the throwaway repository, run the pre-commit secrets check as a process, and assert the exit status together with the parsed findings and their 1-based line numbers. The assertion is an equality — exactly two across the three — because an at-least-one assertion is satisfied by an implementation that reports all three, which is the deleted-exemption failure. Calling `_is_prose_exempt` with three path strings discharges nothing: it cannot show the commit was blocked and cannot express the count."
  - "FIXTURE TOKENS ASSEMBLED AT RUNTIME from concatenated fragments, per `unit_tests/commit_guardian/test_scan_secrets_suppression.py`. No `.security-allowlist` entry may be added for this tree; needing one is the signal the fragments were collapsed into literals."
  - "ERROR HANDLING PER CLAUDE.md. The kind decision is pure over a path string and must not be wrapped in try/except (Rule 4); any file or subprocess access added by the tests is wrapped in a typed `except` that logs at WARNING or re-raises (Rules 1-3)."
test_spec:
  - name: test_kind_gate_applies_at_the_ticket_tree_not_only_the_skill_prompt_area
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Three files staged in one commit across three different listed locations of a throwaway root — a .py under tickets/00_inbox/attachments/, a .yaml in the acceptance-criteria store, a .md in the retrospectives area — carrying the identical runtime-assembled token yield EXACTLY TWO findings, naming the .py and .yaml paths and their 1-based line numbers, with a non-zero exit. Red against any implementation that keys the gate to the skill-prompt area, and red against any that still admits .yaml."
  - name: test_acceptance_criteria_store_yaml_is_reported_under_the_kind_gate
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Pins that .yaml at a listed location is REPORTED — the arm that inverted when the product owner decided on 2026-08-25 that the acceptance-criteria store shall be scanned. This is NEW behaviour, not today's behaviour preserved: it is red today and is the evidence the narrowed kind list actually landed. If it is ever re-baselined to silent, the admitted list has been widened back and that requires a product decision, never a quiet test edit."
  - name: test_live_path_control_reported_in_the_same_invocation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "The parent's scripts/build_probe.py control carried into THIS run: a path containing none of the four listed names, holding the identical token, IS reported. Every path in this criterion contains a listed name, so without this the one silent file is an absence rather than evidence."
  - name: test_no_per_location_branch_in_the_kind_decision
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Behavioural, not structural: the same .py filename staged in turn at each of the four listed locations of the throwaway root is reported at all four, and the same .md at each of the four is silent at all four — eight verdicts from one decision. A per-location branch that agrees today still fails this the moment one branch drifts, and it cannot be satisfied by grepping the source."
test_rationale: |
  Four descriptors, and the shape is set by what the parent already covers. The parent
  proves a script is reported and the prose beside it is not, at one location. Every
  cheap way to satisfy that — most obviously a branch that special-cases the
  skill-prompt area because that is the only place KI-SEC-001 measured executable
  content — leaves a Python file in the ticket tree exempt. The first descriptor is
  that gap made observable, and the fourth is its generalisation: eight verdicts driven
  from one decision, asserted behaviourally so that a source-level grep for a location
  branch cannot substitute for it and so that a branch which currently agrees still
  fails once it drifts.

  The second descriptor inverted on 2026-08-25 and its job changed with it. It was
  written as a fence: the .yaml arm was silent today and would still be silent after
  the gate landed, so it proved nothing about the fix and existed only to make the OPEN
  product decision on the admitted-kind list visible at test level. The product owner
  then took that decision — the acceptance-criteria store SHALL be scanned — so the
  descriptor is now a genuine red-today assertion and part of the evidence that the
  narrowed list landed. Its fence role survives in the other direction: if it is ever
  re-baselined back to silent, the list has been widened again and that must be a
  product decision, not a test edit.

  The third descriptor exists because all three paths in the criterion contain one of
  the four listed names, so the run measures the exemption as much as the scanner. A
  weaker shape — asserting the exemption predicate's return value for three path
  strings — was rejected for all four: it cannot show the commit was blocked, it cannot
  express the exactly-two-across-three count, and it passes identically on dead code.
