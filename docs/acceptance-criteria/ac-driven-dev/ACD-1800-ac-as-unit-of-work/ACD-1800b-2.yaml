readiness: reviewed
priority: medium
title: "A requirement is done only when every deliverable is signed off"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement with three deliverables of which two are signed off and one
    is still unsigned,
  When the requirement's completion state is evaluated,
  Then the requirement is reported as not done,
  And when the remaining deliverable is subsequently signed off,
  Then the requirement is reported as done,
  And the requirement's done state is computed solely from the per-deliverable
    sign-offs recorded on the requirement.
depends_on: [ACD-1800b, ACD-1800b-1]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Done-state is COMPUTED solely from the per-deliverable sign-offs recorded on the AC; implement the computation in scripts/ac_store/ (alongside mark_ac_done.py / done_proof.py) as the single computed source of AC-level done."
  - "A requirement with any unsigned deliverable is reported not done; it becomes done only when every deliverable is signed off (anti-phantom-done)."
  - "No independent AC-level 'done' flag may be set directly by an agent; done is always derived from the per-deliverable sign-offs."
  - "Grandfather ACs with no checklist (schema_version < 2): legacy done-derivation; never mass-revert already-done ACs (ADR-026 rule 4). Ship advisory before required (ADR-026 rule 3)."
  - "Canonical source only: scripts/ac_store/*.py; never a deployed .claude/ copy or build-output mirror."
delivers_to:
  agent: python-coder
  contract: "Computed AC-level done verdict derived solely from the per-deliverable sign-offs; consumed by the ticket-level done rollup (ACD-1800c-2) and by the not-applicable edge case ACD-1800b-2-i."
expects_from:
  ac_id: ACD-1800b-1a
  contract: "Per-deliverable sign-off record schema (deliverables[].signoff = {status: needed|signed_off|not_applicable, by, at, reason?}) that this done-computation reads to decide requirement-level done."
