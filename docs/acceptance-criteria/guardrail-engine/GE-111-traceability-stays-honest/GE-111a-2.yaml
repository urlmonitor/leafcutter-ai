notes: |
  User-confirmed decision (GE-111a notes + PO framing memo): enforcement is
  BLOCKING, not audit-only, by default. A configurable warn tier may exist as a
  deliberate opt-in, mirroring GE-100's warn-vs-block config — but the default
  and headline behavior is BLOCK. This AC pins BLOCK as the default and warn as
  an explicit, opt-in-only alternate mode.

  IT-PO enrichment (2026-06-22): config home and key named explicitly in
  it_requirements; absence-of-config must resolve to BLOCK, not warn.
