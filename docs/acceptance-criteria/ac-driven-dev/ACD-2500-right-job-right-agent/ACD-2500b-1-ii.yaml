test_intent:
- clause: the type checker reports no finding for scripts/ac_store/_test_intent.py
  needs_test: false
  reason: The type checker run is the proof; a unit test cannot observe a static typing finding.
- clause: for a criteria text whose outcome clauses are "Then one row is written" and "And the count is
    1", the reader returns the same clauses, in the same order, as before the change
  needs_test: true
  reason: The reader feeds every test-intent check, and a changed clause list would break them all silently.
- clause: a criteria text with no outcome clause gives the same result as before the change, and raises
    no error
  needs_test: true
  reason: The no-match case is exactly the code being changed, so its result must be pinned.
