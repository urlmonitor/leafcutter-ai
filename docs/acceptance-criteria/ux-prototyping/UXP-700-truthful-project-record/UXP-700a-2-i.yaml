id: UXP-700a-2-i
title: "Zero-artifact derived lookups are present and empty, never absent"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store index produced for a record holding zero artifacts,
  When a reader asks that index for the artifacts belonging to a component, to an entity, to a
    journey, and to an acceptance criterion,
  Then each of those four lookups returns an empty result,
  And no lookup fails on account of its entry being missing from the index,
  And the state "this lookup was never written" does not occur, so an empty result is the only
    thing a reader has to interpret.
