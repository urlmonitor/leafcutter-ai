notes: |
  FIELD EVIDENCE — 2026-09-23, CI on PR #862. The required Proof-of-done gate failed with:

      [check-done-proof] BO-400e: composite BO-400e has no coverable children
      [check-done-proof] BP-1100e-1: composite BP-1100e-1 has no coverable children

  Both composites have children that are present in the status map and genuinely covered.
  BO-400e's five children were all done with passing covers-tagged tests. The flattening
  returned an empty list for both, so neither could be proven and the gate refused them.

  Cause: _resolve_all_child_ids's recursive step branched on `if child_covered_by:` —
  non-emptiness — while the top-level caller branched on _has_resolvable_child. Because the
  dominant convention for a LEAF in this store is to record its test files in covered_by,
  every such leaf looked composite one level down, was recursed into, and yielded nothing.
  BO-2500a-6's M-2 remediation had introduced _has_resolvable_child for exactly this
  confusion and applied it at one level only.

  The bug is invisible until someone marks a composite done whose children use the
  test-path convention, which is why it survived: composites whose children use the
  child-id convention (BO-400a-2 and friends) resolve fine.

  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — restore the non-emptiness test. Caught by
         test_children_recording_test_paths_are_leaves_not_empty_composites.
    M2 — stop recursing entirely and treat every direct child as a leaf. Caught by
         test_a_genuine_nested_composite_is_still_expanded.
    M3 — treat unresolvable entries as leaves so they demand their own tests. Caught by
         test_an_unresolvable_entry_still_contributes_nothing.
