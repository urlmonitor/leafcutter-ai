notes: |
  THE SPAWN ANALOGUE OF AR-200b-2. AR-200b's criteria (as amended 2026-09-30 and
  re-approved 2026-10-01) already cover an obligation "when a specialist's own
  definition declares that it may use something". A declared sub-agent
  permission is such a declaration, so this leaf sits inside the parent's
  promise without widening it.

  MEASURED (orchestrator probe, 2026-10-09, production code): of the 25 agents
  with a non-empty spawn allowlist after macro expansion, 2 lack the `Agent`
  tool in their frontmatter `tools:` -- build-ac (permitted ac-triage) and
  business-analyst (permitted research-agent). They are permitted sub-agents
  they cannot dispatch. Measurements, not constants: derive both populations.

  THIS LEAF STATES ITS OWN DERIVATION. Like AR-200b-2, the obligation comes from
  a STRUCTURED declaration, not from body prose naming a tool, so AR-200b-1's
  prose detector, its control case and its mutating-tools scope do not apply.
  The dispatch tool is not state-mutating, and an agent lacking it does not stop
  loudly -- it does the delegated work itself, in its own context, which is the
  failure delegation was meant to avoid.

  REFUSE, AND WHY THAT IS SAFE HERE. Same reasoning as AR-200b-2 (as corrected
  2026-10-09): the contradiction is caught when the agent is defined, and the
  fix -- adding the dispatch tool -- sits in the same header block as the
  permission, so refusing demands no second edit elsewhere. This differs from
  the derived registry copy (AR-300c-5-ii), which reports rather than refuses.

  GRANT THE CAPABILITY, DO NOT DELETE THE PERMISSION. The cheapest way to pass
  is to empty build-ac's and business-analyst's permissions. That satisfies the
  comparison and leaves both agents unable to delegate work their own bodies
  describe delegating. The permission encodes the intended route; it is the
  thing to preserve.

  EXACT MATCH. `tools:` is a bare comma-separated string; the dispatch tool's
  name must be matched as a whole token after a defined parse, never as a
  substring, or a longer tool name embedding it produces a silent false pass.
  The comparison should share AR-200b-2's parse rather than write a second one.
  Real-data trap: business-analyst's tools line carries a trailing YAML comment
  ("tools: Skill, Read, Write, Edit, Bash  # Write/Edit scoped to ..."), so the
  parse must be checked against the on-disk templates, not hand-typed fixtures.
