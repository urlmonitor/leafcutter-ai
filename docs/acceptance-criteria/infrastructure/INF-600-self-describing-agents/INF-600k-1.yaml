id: INF-600k-1
components:
  - infrastructure
readiness: approved
priority: medium
title: "A workflow filename in spawned_by passes registry validation as an external caller"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600k.yaml"
criteria: |
  Given an agent's registry entry lists a workflow filename (for example
    "finalize-feature.js") in its spawned_by array
  And that workflow filename is not the name of any agent in the registry
  When the build validates the agent registry
  Then validation recognizes the workflow filename as a legitimate external caller
  And validation does NOT report it as an "unknown agent" error
  And the build does not fail on account of that spawned_by entry
depends_on:
  - INF-600k
