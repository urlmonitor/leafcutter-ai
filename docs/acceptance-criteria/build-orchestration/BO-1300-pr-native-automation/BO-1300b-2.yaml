created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300b.yaml"
criteria: |
  Given an open pull request whose required checks include "Lint (ruff)"
  And at least one required check is still pending (neither success nor failure)
  When the automation evaluates whether to merge
  Then it does not merge while any required check is pending
  And it waits, re-checking the required-check states, until every required check has reached a terminal state
  When every required check reports success
  Then the automation merges the pull request
depends_on: [BO-1300b, BO-1300b-1, FIN-100]
