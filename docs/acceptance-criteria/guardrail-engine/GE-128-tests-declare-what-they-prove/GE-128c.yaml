notes: |
  THE GUARD ON THE GUARD, AND WITHOUT IT THIS WHOLE TREE IS SATISFIABLE BY A SCRIPT.
  The cheapest implementation that clears GE-128a across the entire backlog is a
  pass that writes a plausible-looking name above every undeclared test. It would
  pass every positive scenario in this tree and would convert an honest, countable
  gap into a dishonest green across thousands of records — using the standard built
  to cure it. That is the same failure family the project's false-green register
  catalogues: an assertion of proof recorded where an observation of evidence
  belongs.

  NO CRITERION BENEATH THIS TREE MAY SPECIFY A BULK BACKFILL OF THE EXISTING
  POPULATION. This is a refusal, not a sequencing preference. An L2 proposing one
  must be withdrawn rather than approved. Declarations are added as the work
  reaches each test, by whoever can say what the test actually proves.

  THE DEFECT ALREADY EXISTS AT A SMALL RATE, WHICH IS THE EVIDENCE THAT IT SCALES.
  The register records roughly 87 distinct declaration identifiers in the test tree
  naming a record that does not exist — accumulated by hand, without anyone trying.
  A mechanical pass would produce that shape thousands of times. Carry the figure
  at the confidence it was recorded and keep it out of any criteria block.

  A REJECTED DECLARATION IS A MISSING ONE, NOT A SEPARATE CATEGORY. Decomposition
  should resist inventing a third state between declared and undeclared. A name
  resolving to nothing counts toward the same per-file quantity GE-128a ratchets,
  which is what makes the two records compose instead of interfering. What DOES
  differ is the message: being told "you did not declare" and "you declared
  something that does not exist" are different problems with different next steps,
  and that distinction is GE-128e's.

  WHAT THIS DOES NOT COVER, DELIBERATELY. A declaration naming a requirement that
  exists but is RETIRED is not a name resolving to nothing — it resolves to
  something, and to something important. That case is GE-128d's and the two must
  not be collapsed, because collapsing them makes the correct response to a retired
  requirement "delete the name", which is exactly what GE-128d forbids.

  MANDATORY NEGATIVE ARM. Every positive reading is satisfied by a gate that
  refuses everything. Assert in one run: a test declaring a requirement that exists
  is accepted, and a test declaring one that does not exist is refused with the
  reason stated. Both, together.
