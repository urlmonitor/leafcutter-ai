notes: |
  WHY THIS IS ITS OWN RECORD. The parent settles that the list of explanations is
  closed and that anything unrecognised is reported. It does not settle how tightly
  a value must match an entry on that list to count as recognised, and that is where
  the closure is actually won or lost: a match that fires on a prefix, or on a
  substring anywhere in the value, is an open list wearing a closed list's clothes.
  The third scenario is the control that stops the first two being satisfied by
  removing the recognition entirely.

  THIS IS THE SAME LESSON THE ADJACENT RULE ALREADY LEARNED. GE-123d-3's fourth
  scenario exists because "contains whitespace" as a literal test was defeatable by
  one keystroke. The shape here is identical: a recognition that is not anchored to
  the whole value is defeatable by typing something familiar in front of a
  credential. Reuse that reasoning rather than re-deriving it, and do not close
  either record as a duplicate of the other — that one is about a proposed exemption
  for the keyword rule, this one about the existing exemption for the shapeless-value
  rule.

  FIXTURE PLACEMENT — STATED, NOT INHERITED. Every fixture must be a real file
  created inside a tempfile-backed throwaway project root, with the ticket area
  constructed INSIDE that root and the check run against that root. No fixture may
  be created under this repository's own `tickets/`, `docs/retrospectives/`,
  `docs/acceptance-criteria/` or `templates/skills/` trees.

  A CAUTION ON THE FIXTURE VALUES THEMSELVES: the near-miss values here are
  deliberately shaped to look like this project's own identifiers, so they must be
  assembled at runtime from concatenated fragments like every other credential-shaped
  fixture string in this tree — both to keep the module free of literals and so that
  the near-miss is constructed from a stated convention rather than typed by eye.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Every arm runs the real
  pre-commit secrets check over real staged files and asserts the process exit
  status and the reported findings. Asserting what the recognition returns when
  called directly does not discharge any arm.
