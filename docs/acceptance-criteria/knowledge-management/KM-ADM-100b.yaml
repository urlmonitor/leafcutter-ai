title: "A connection the project does not have shows up as a gap you can see"
component: knowledge-management
level: L1
status: active
req_status: draft
readiness: draft
priority: medium
criteria: |
  Missing connections are recorded and drawn as gaps, never quietly left out.

  A relationship the project needs but does not yet have is written down as a known
  gap and shown as one, so "considered and absent" can be told apart from "never
  thought about" — and a gap can never be mistaken for a working link.
