criteria: |
  Given the reference documentation for the agent knowledge system is where a
    reader establishes what the system does rather than what it was meant to
    do,
  When a reader opens it,
  Then it states at which point the routing step runs, and names each way of
    completing work that carries it and each that does not, with the reason for
    each omission,
  And it states what each figure in the routing step's report means, and what
    each of its outcome statuses means to whatever called it,
  And it states the three outcomes a completed piece of work can report for
    its routing step — completed, could not complete, did not run — and that
    none of the three changes the outcome of the work itself,
  And it states what the routing-run recency answer reports and how that
    differs from the count of records waiting and from the capture-health
    figures, so a reader knows which of the three answers their question,
  And for as long as no way of completing work carries the routing step, it
    states that a captured learning does not reach its surface without a manual
    run — and the change that wires the first one removes that statement,
  And it points to, rather than restates, the rule for what may be written and
    the definition of the waiting count,
  And every claim it makes about when something runs is one a reader can check
    by running the way of completing work that it names.
