criteria: |
  The number you cite means one thing — and it keeps meaning that one thing.

  Almost everything in this project is referred to by a number: requirements,
  tickets, decisions, diagrams. Those numbers are how people and automation
  point at work, so the moment two unrelated things claim the same number, or a
  new thing quietly takes no number at all, or one number ends up on two copies
  that can disagree with each other, every reference built on top of it stops
  being trustworthy. That has already happened here, more than once, and nothing
  noticed. After this goal, a number identifies exactly one thing, nothing can
  come into existence without taking a number, the numbering that already drifted
  is repaired rather than frozen in place, and a clash surfaces the moment it
  appears — with the fix in hand, at a point where it cannot be skipped.
