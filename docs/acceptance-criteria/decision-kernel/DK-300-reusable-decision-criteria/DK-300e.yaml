req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Fresh criteria are drafted only for the gaps the approved ones leave open.

  If Jev, the kernel's judging model, finds that the reused categories leave out
  something this decision needs, new criteria are drafted for that gap alone,
  and you can always add your own. When no approved category fits yet, the
  decision is framed the way it is today, so an empty library costs nothing,
  and the newly written questions become material for the next review of past
  decisions.
