notes: |
  Why this is a sibling of BO-1800f-1 and not nested under it. Currency and
  non-destructiveness fail independently: a delivery can be perfectly up to date and
  still take content away, because fitting the copy's work onto a newer state is
  where content gets dropped. The known issue this tree comes from says the same
  thing from the other side -- it keeps the manual audit as a backstop precisely
  because the audit is what would catch a bad replay. Nested under BO-1800f-1, this
  record would be vacuous in every test where currency is correctly implemented,
  which is the shape of check that looks green because it examined nothing.

  The ordering in depends_on is deliberate and is not nesting. It records that the
  examination happens on the post-currency delivery -- the "still" in BO-1800f's own
  wording -- while leaving both records as direct children of BO-1800f.

  Deliberate removals are not in scope for refusal. The value is that undeclared
  removals are refused, never that removals are refused; BO-1800f-2-i carries the
  declared case and is the discriminating half of this pair.

  Falsifiability. The fixture must introduce the removal AFTER the delivery has been
  brought up to date, so that an implementation which treats "we brought it up to
  date" as proof of safety proceeds and fails. The paired add-only delivery is required: a
  behaviour that refuses every delivery passes the first half and fails the second,
  and a behaviour that refuses nothing does the reverse, so neither can satisfy this
  record and no source-text inspection can satisfy either half.
