  - name: test_resume_no_pending_leaves_state_unchanged
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "The run's existing state is left unchanged by a no-op resume."
  - name: test_resume_no_pending_reports_nothing_to_resume
