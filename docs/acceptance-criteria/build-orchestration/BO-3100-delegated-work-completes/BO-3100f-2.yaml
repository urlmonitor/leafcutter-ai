notes: |
  CLAUSE 2 OF THREE, and the one the anchor case violates most visibly.

  The second scenario is the mandatory control: a leading value that never reads as
  success is worth as little as one that always does, and is the cheapest way to
  satisfy every other scenario here.

  The fourth scenario closes the ordering hole. A run that recomputes its leading
  value from the most recent step would pass the first scenario whenever the stopped
  step is not last, which is most of the time.

  VERIFY BY EXECUTION, per CLAUDE.md: assert on the value a real run returns, not on
  an internal structure that knows the right answer while the returned value still
  reads as success.
