id: BP-600a-1
components:
  - build_pipeline
title: "Quick-fix operates in the current worktree when it can, and self-isolates when it cannot"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given a user invokes /quick-fix with a diagnosis specifying a file and root cause,
  When the workflow runs its isolation-decision guard, before any other action,
  Then it inspects the current working directory once and takes exactly one of
    the two paths below, and every later phase is anchored to whichever it took.

  Case A — the current working directory is inside a git worktree whose current
  branch is neither empty (detached HEAD) nor "main" nor "master":
  Then the workflow performs all operations (AC creation, test writing, fix,
    commit, changelog, push) in that current worktree,
  And git branch --show-current returns the same branch name both before
    and after the workflow completes,
  And no new worktree directory is created during execution.

  Case B — the current working directory is not a git repository at all, or HEAD
  is detached, or the current branch is "main" or "master":
  Then the workflow creates one new worktree for itself, on a non-default branch,
    before doing any other work — reusing the existing one, without failing, when
    a worktree for the same derived slug already exists,
  And it takes the worktree root and the branch name from what that creation step
    itself reports, rather than assembling either by any other means,
  And every later phase reads and writes under that worktree root, and not under
    the directory the session started in,
  And the branch established by that step is the branch still checked out when
    the workflow completes.
depends_on:
  - BP-600a
