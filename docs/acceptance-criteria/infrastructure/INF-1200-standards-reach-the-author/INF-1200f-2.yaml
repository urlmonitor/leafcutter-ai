notes: |
  THE PRESERVATION OBLIGATION, STATED EXPLICITLY BECAUSE IT IS EASY TO LOSE IN A
  REWRITE. One pairing already delivers this property correctly, from a single
  declaration. Any generalisation must leave that pairing at least as faithful and at
  least as useful as it is now. A rebuild that regresses the working cell while covering
  more cells has made things worse, and a decomposition that does not say so invites
  exactly that trade — because the trade looks like progress in every count anyone will
  run.

  WHY "AT NO FEWER POINTS" IS A CRITERION AND NOT A STYLE NOTE. A figure stated once, in
  a section headed with the project's standards, is easy to skip and easy to forget by
  the time a decision is being made. A figure stated at the points where the decision
  arises — including in a trigger that makes the specialist stop and ask before
  producing work that would exceed it — is what changes the work. The count is a proxy
  for that, and it is the only proxy a test can hold. It is deliberately a floor rather
  than an exact number: adding points is fine, removing them is the regression.

  THE TRIGGER ARM IS NAMED SEPARATELY BECAUSE IT IS THE FIRST THING TO GO. It is the
  most specific, most awkward reference to generalise — it is embedded in an instruction
  rather than in a list — and it is the single most valuable one, because it is the only
  place where the figure is attached to an action rather than to a fact. A
  generalisation that carries the figure into a standards block and drops it out of the
  trigger has kept the letter of every other record here and lost the thing that made
  this pairing work.

  THE LAST ARM IS THE INTERFERENCE CHECK. Once a specialist owns two kinds of file with
  standards — which INF-1200c-2 requires to work — there is a real risk that supplying
  the second overwrites, reorders or dilutes the first. Stating it as an arm means the
  regression is caught in the tree that caused it, rather than noticed months later by
  someone wondering why the trigger stopped firing.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: generalise by replacing that specialist's several in-context figure
  references with a single derived statement of its standards at one place in the brief,
  removing the stop-and-ask reference. Under that injection:
    - INF-1200a-1, INF-1200b-2, INF-1200c-1, INF-1200d-1 and INF-1200f-1 must ALL STAY
      GREEN for that specialist — it is informed, from one declaration, faithfully, with
      no authored statement of its own;
    - the at-no-fewer-points arm must go RED;
    - the trigger arm must go RED.
  All outcomes must be observed together and all must revert. The five green outcomes
  are the entire justification for this record existing separately: this mutation is a
  clean, defensible, well-engineered generalisation that every other criterion in the
  tree reports as a success, and it makes the one thing that currently works worse.

  A SECOND MUTATION WORTH RUNNING. MUTATION: keep all the reference points but resolve
  them from a value rounded or defaulted for presentation. Under it the point-count and
  trigger arms stay green and the changed-figure arm goes RED, and INF-1200f-1's
  comparison goes RED with it. A figure that is nearly right at the moment of decision
  is a second figure.

  MEASURED, 2026-09-09, IN THIS WORKTREE. One specialist's material refers to the figure
  for the kind of file it owns in five places, one of which is a stop-and-ask trigger
  and one of which is a completion signal. Five is today's floor for the first arm; the
  IT PO should pin the count from the tree as it stands at enrichment rather than from
  this note, since a legitimate change may move it before implementation starts.

  DELIBERATELY NOT NAMED IN THE CRITERIA: the specialist, the kind of file, and the
  figure. The pairing is identified by the property it already has, which is both
  sufficient to find it and stable if it is renamed.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above, including which records must stay green, are written to be turned
  directly into test descriptors.
