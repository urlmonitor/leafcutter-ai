id: BO-3200f-2
title: "The executor's charter and its registry entry both admit every exact command, so it has no grounds to decline one"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given exact commands of each kind the shipped workflows carry out today -- a read of the
    acceptance-criteria store, a claim that moves an item from todo to in progress, a git command
    run inside a worktree, and a repository script run with arguments,
  When each is dispatched to the chartered executor,
  Then each is carried out and its result returned in the three parts BO-3200f-1 specifies,
    And no result is a refusal, a request for confirmation, or a statement that the command is
    outside the executor's remit.

  Given the agent registry,
  When the executor's entry is read for whether it may run repository commands,
  Then the entry states that it may, as an explicit value rather than by leaving the permission
    unstated,
    And the permission gate that the entry workflow already consults before dispatching a shell
    step classifies the executor as permitted.

  Given the same four exact commands and the executor's registry entry,
  When each command is compared with the permission the entry states,
  Then no command the executor carries out is one its stated permission excludes.
