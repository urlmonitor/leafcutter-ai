id: BO-610-3-i
title: "Empty change_target or risk_surface field is rejected"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file has change_target set to an empty list: [],
  When the frontmatter validation runs,
  Then it rejects the ticket with an error message:
    "change_target must contain at least one value"
  And the ticket cannot proceed to the guardrail engine

  Given a ticket file has change_target set to null,
  When the frontmatter validation runs,
  Then it rejects the ticket with the same error:
    "change_target must contain at least one value"

  Given a ticket file has risk_surface set to an empty string: "",
  When the frontmatter validation runs,
  Then it rejects the ticket with an error message:
    "risk_surface must be one of: internal, contract, auth, privacy, safety, cost"

  Given a ticket file has risk_surface set to null,
  When the frontmatter validation runs,
  Then it rejects the ticket with the same risk_surface error
