assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Drive creation MUST set gc.auto=0 and maintenance.auto=false in every drive clone before any work commits, so no automatic repack/maintenance can start while the drive runs (ADR-018 Decision §2, Migration §2/§3)."
  - "This MUST be established as part of the clone-creation lifecycle (sibling step of BO-1800a-2/-3) on the portable clone-lifecycle surface (scripts/ or templates/scripts/) deployed by build.py."
  - "git config write failures MUST be handled per the project error handling policy."
