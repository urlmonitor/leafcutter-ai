notes: |
  THE EDGE THE USER SINGLED OUT, AND THE ONLY PART OF IT SETTLED HERE. What happens when the
  specialist runs and the file still does not meet the demand? Three answers are available
  and two of them are wrong:

    - RETRY WITHOUT END. Wrong, and expensive in a way that is invisible until the bill
      arrives. A file that resists restructuring resists it identically on the second and
      tenth attempt.
    - GIVE UP SILENTLY, OR LET THE CHANGE THROUGH. Worse. Letting it through reopens the
      standard for exactly the files it exists for. Giving up without saying so leaves the
      author holding a refusal with no explanation, which is indistinguishable from the
      feature not existing at all — and that is the state the repository is in today.
    - STOP, AND ACCOUNT FOR IT. The answer this record fixes.

  WHAT IS FIXED HERE AND WHAT IS DELIBERATELY LEFT OPEN. Fixed: that there is a bound, that
  reaching it stops rather than passes, and that the stop carries what was asked, what was
  done and what remains. Left to decomposition and enrichment: the value of the bound, the
  surface the account appears on, and whether a partial improvement — the file smaller than
  before but still short of the demand — is kept or discarded. That last one is a real
  question and must be SETTLED EXPLICITLY rather than defaulted: keeping partial progress is
  humane and makes the next attempt cheaper, and it also means a stopped run leaves the file
  in a state nobody chose. Name the decision; do not inherit it.

  THE THREE OUTCOMES MUST BE TOLD APART, AND THIS IS THE STORE'S STANDING DISCIPLINE RATHER
  THAN A NEW IDEA. The demand was met; the specialist ran and fell short; the specialist
  could not be reached or produced nothing usable. GE-127f-2-i insists on the same
  separation one layer down for its own inputs, and BO-3000a insists on it for a phase that
  returned nothing versus one that returned something unusable. Collapsing any two of these
  into one message costs the reader the only information that tells them whether the file is
  hard or the machinery is broken.

  WHAT THIS RECORD MUST NOT BECOME. A criterion asserting that the file is eventually always
  restructured successfully. Some files will not be, and the nine files in this repository
  standing above 1,500 lines are named in GE-127f's notes as exactly that population. This
  record promises an honest stop, not a guaranteed success.
