title: "The lint check judges the working copy you commit from — in a worktree, and in an adopter's project by the adopter's own rules and declared scope"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario: A worktree is judged by its own configuration and scope
    Given a git worktree of this repository whose installed checks resolve into a
      shared install location outside the worktree,
    And the worktree's own lint configuration and declared scope differ from the
      install location's (for example, the worktree's declared scope adds one
      tree),
    When a commit is attempted in the worktree with a staged violation inside the
      added tree,
    Then the commit is refused,
    And the configuration, scope and staged files used are the worktree's own,
      never the install location's.

  Scenario: The same change gets the same verdict in the main copy and a worktree
    Given identical staged content and identical lint configuration in the main
      working copy and in a worktree,
    When the commit is attempted in each,
    Then both commits give the same verdict and name the same findings.

  Scenario: An adopter's project is judged by the adopter's own rules
    Given a project that installed the package, with its own lint configuration
      selecting only rule F401 and its own scope declared in the one place package
      configuration provides,
    When a commit is attempted there with a staged in-scope file carrying rule
      E741 and no F401,
    Then the commit completes, because the adopter's rules do not select E741,
    And given a staged in-scope file carrying rule F401,
    When the commit is attempted,
    Then the commit is refused, naming the file, line and F401.

  Scenario: An adopter who declared no scope gets the documented default
    Given an installed project that declared no lint scope,
    When a commit is attempted with a staged Python file anywhere in the project
      that the adopter's lint configuration does not exclude and that carries a
      violation of a selected rule,
    Then the commit is refused,
    And a staged file the adopter's configuration excludes is not refused.

  Scenario: An adopter's CI that reads the declaration agrees
    Given an adopter's CI lint step that reads the same declared scope,
    When the declared scope is changed,
    Then the commit-time check and that CI step apply the changed scope together.
