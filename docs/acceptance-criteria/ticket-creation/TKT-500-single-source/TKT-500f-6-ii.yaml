title: "Test files and tickets-path .py do not trigger the Test Requirements section"
component: ticket-creation
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f.yaml"
criteria: |
  Given a leaf AC whose files_touched list contains only .py paths that are
    test files or tickets-path files and no implementation .py file:
    "unit_tests/test_generate_ticket.py" (a test_*.py file),
    "scripts/ac_store/generator_test.py" (a *_test.py file),
    and "tickets/00_inbox/helper.py" (a .py under tickets/),
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains no section headed "## Test Requirements",
  And ticket generation completes without recording a warning about a missing
    Test Requirements section.

  Given a leaf AC whose files_touched list contains
    "unit_tests/test_generate_ticket.py" (a test file)
    alongside "scripts/ac_store/generate_ticket_from_ac.py" (an implementation file),
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains a section headed "## Test Requirements",
  And the test stub entry in that section names the implementation file
    "scripts/ac_store/generate_ticket_from_ac.py" and not the test file.
depends_on: [TKT-500f-6]
