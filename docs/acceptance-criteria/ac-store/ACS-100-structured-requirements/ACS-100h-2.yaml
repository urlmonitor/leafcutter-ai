    relationship: specifies
    status: exists
  - path: docs/how-to/ac-traceability-store.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: L
it_requirements:
  - "Must preserve L1 IDs unchanged during horizontal splits (ID stability invariant)"
  - "Must verify no delivers_to or expects_from references are broken after rewiring"
  - "Must be idempotent — running the rewiring step again on an already-split tree produces no changes"
  - "Must handle the case where a moved L1 has no L2 children without error"
delivers_to:
  agent: llm-expert
  contract: "Set of modified AC YAML files with updated depends_on and covered_by fields, ready for gate and audit"
expects_from:
