id: DK-300d-3
title: "Routed work uses canonical references as hints and retrieves its own evidence"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given intent has selected a supported capability and interpretation context contains resolved canonical references,
  When native judgments, research planning or host work consume that context,
  Then permitted canonical references can guide task-specific retrieval after intent,
  And function bodies, artifact criteria, callers, relations and precedent are retrieved only when that routed task needs them,
  And interpretation meanings and caller claims remain labelled separately from supporting task evidence in judgments and host artifacts,
  And a question about live availability still requires observations rather than accepting a meaning card as proof,
  And an approval-dependent decision still waits for the required human approval.
