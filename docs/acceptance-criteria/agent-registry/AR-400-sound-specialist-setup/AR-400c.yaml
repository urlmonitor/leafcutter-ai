criteria: |
  No more warnings about abilities that nobody needs to act on.

  The build stops reporting things that are not faults, and the real faults
  that noise was hiding are fixed: grants a specialist never uses are removed,
  and authoring guidance no longer asks people to write by hand what the
  system already delivers.
