test_spec:
  - name: test_tq600a_9_i_a_member_that_writes_receives_its_own_copy
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A group member alters the artifact it was handed. The artifact the other members
      receive afterwards is byte-identical to the one the producer finished with.
  - name: test_tq600a_9_i_a_mutation_by_one_member_is_invisible_to_the_next
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the writing member is handed the shared artifact itself instead of a copy of it"
      - "the member is handed a copy made by reference or by symlink rather than by content, so a write through it still reaches the shared tree"
    description: >-
      Execute the group and compare the shared artifact's bytes before and after the
      writing member ran. Without this, copy-on-write is satisfiable by a comment.
  - name: test_tq600a_9_i_the_group_reaches_the_same_verdicts_in_three_arrangements
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_child_session(), one child pytest session per arrangement, each producing its own preparation"
    description: >-
      Run the group in declaration order, in reverse, and each member alone. The set of
      pass and fail verdicts is identical across all three. Three SEPARATE child
      sessions: a reversed run that reuses the forward run's memoised artifact is not a
      reversed run and proves nothing about order.
  - name: test_tq600a_9_i_breaking_one_members_subject_reddens_only_that_member
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "breaking the planted adopter file leaves the survival member green, because the shared preparation re-supplies the file regardless of the behaviour under test"
      - "breaking the collision message leaves the message member green"
      - "breaking the declared winner leaves the declared-winner member green"
      - "breaking the cross-platform winner leaves the cross-platform member green"
      - "breaking any one subject reddens more than one member, which means the four runs shared a preparation instead of each producing their own"
    description: >-
      Four runs, one per member of the four-way group, each in its own child session and
      each breaking only that member's named property. Exactly one member is red in each
      run. THIS IS THE DESCRIPTOR THAT CANNOT BE DROPPED.
  - name: test_tq600a_9_i_a_sound_group_passes_whole
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The paired control. With nothing broken, every member of every group passes.
      Without this, four descriptors that all demand reds are satisfied by a group that
      fails everything.
test_rationale: |
  The vacuity hazard is the reason this record exists and is invisible to any test that
  only checks the group passes. Sharing one build across four assertions produces a
  faster suite and, if done carelessly, a weaker one — and the weakening is silent,
  because every test still goes green. The four-run discrimination descriptor is the
  only one that can tell the two apart.

  Order independence is asserted by executing three arrangements rather than by
  reasoning about what the members touch, because the whole class of defect here is a
  member touching something nobody realised it touched.

  The sound-group control is present because four red-demanding descriptors with no
  green path are satisfied by a group that refuses to run at all.
