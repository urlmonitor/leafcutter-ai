title: "Ticket authoring adds live-surface-tester to the agents map when both toggles are on"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket whose frontmatter sets `live_surface_test: true`
    And a project `skills_config.json` whose `live_surface_testing.enabled` is `true`
  When the business-analyst authors that ticket via the ticket-authoring skill
    (templates/skills/ticket-authoring/SKILL.md)
  Then the ticket's `agents:` map contains the entry `live-surface-tester: needed`
    And this mirrors the existing rule that adds `user-surface-smoker: needed`
    when `user_facing_surface` is non-null.
depends_on: [BO-2100a]
