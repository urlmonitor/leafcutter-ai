notes: |
  Idea stub — covered_by deliberately empty (see KM-200 notes).

  THIS IS THE SEED REQUIREMENT. The whole capability was requested because a
  hand-made weekly report produced a 3:1 authoring-to-closing ratio that is
  misleading as stated. The three buckets, with the numbers observed 2026-08-13:
    - buildable backlog — approved L2/L3 at work_status todo. The ONLY bucket that
      gates throughput.
    - authoring WIP     — draft/reviewed L2/L3. 159 L2 + 49 L3.
    - idea stubs        — childless L0/L1, i.e. level in {L0,L1} and not covered_by.
      47 at the time of writing; this tree adds seven more.
  A fourth, done, is already tracked (544 -> 651 over the reporting week).

  Without the split, the cheap-capture convention this very tree is the first use
  of makes the growth ratio look worse while being exactly the right behaviour. Any
  decomposition that reports one undifferentiated requirement count fails this AC.

  The bucket definitions are project vocabulary, not an implementation detail —
  hence the reference-doc trigger. Note the dependency risk for whoever builds it:
  the idea-stub bucket is defined by an ABSENT covered_by list, so it breaks
  silently if the store ever starts auto-populating covered_by, or once ACS-800
  moves hierarchy out of ids and into metadata.
