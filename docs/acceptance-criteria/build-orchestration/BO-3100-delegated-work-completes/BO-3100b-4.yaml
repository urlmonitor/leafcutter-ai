  - path: docs/architecture/diagrams/c3-003-phantom-done-real-effect-intent-verification.md
    relationship: describes
    status: exists
    relevance: "The adjacent artifact-layer sequence; this one is its orchestration-layer counterpart and must not be confused with it."
  - path: docs/architecture/components/phantom-done-prevention.md
    relationship: modifies
    status: exists
    relevance: "The component page the new diagram must be reachable from."
assigned_agent: architecture-diagram-author
estimated_complexity: M
change_target: docs
risk_surface: internal
it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert. A dispatch to documentation-expert that then dispatches a leaf author is the defect BO-3100c forbids."
  - "THE TWO STATE CAPTURES MUST BE SEPARATE INTERACTIONS, one before the specialist runs and one after. That pair IS the fix, and it is the only thing that distinguishes this diagram from a drawing of the broken arrangement — a diagram showing the reply arriving and a verdict following looks identical whether or not the verdict was read from the reply."
  - "The verdict arrow must originate from the comparison, not from the reply. The reply's arrow must terminate without feeding the verdict."
  - "The coherence claim in the second scenario must be enforced by an executable test that compares the diagram's declared interaction sequence against the ordered build-record trace of a REAL re-run, in both directions: no drawn interaction absent from the run, no run interaction absent from the drawing."
  - "The diagram page must declare its interaction sequence in a machine-readable form (front-matter list or equivalent structured block) so the coherence test compares data with data rather than parsing a rendered picture."
  - "The real run used by the coherence test must be a genuine re-run driven end to end, not a hand-authored trace. A fixture trace reproduces the author's assumption about the ordering, which is exactly the assumption under test."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
delivers_to: null
expects_from:
  - ac_id: BO-3100b-2
    contract: "The ordered build-record trace of a real build in which a step produced nothing and was re-run — the sequence of {step_id, attempt, outcome} entries plus the dispatch and state-capture events — obtainable programmatically so the diagram can be compared against it."
  - ac_id: BO-3100b-1
    contract: "The fact that the state capture happens at dispatch and again at the attempt to finish, and that the verdict derives from their comparison, so the diagram draws the ordering that actually holds."
test_spec:
  - name: test_bo_3100b_4_diagram_declares_the_required_ordering
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Parse the diagram's declared interaction sequence and assert it contains, in order: dispatch, pre-run state capture, reply returned, post-run state capture, verdict formed from the comparison, finish prevented, step re-run — with the verdict's source being the comparison and not the reply."
  - name: test_bo_3100b_4_diagram_matches_a_real_re_run_both_directions
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "THE COHERENCE CHECK. Drive a real build in which a step produces nothing and is re-run, capture its ordered trace, and assert set-and-order equality with the diagram's declared sequence in both directions. A drawn interaction that never occurs, or an occurring interaction that is not drawn, fails."
  - name: test_bo_3100b_4_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  The claim this diagram makes — that the verdict follows the state comparison rather than the
  reply — is invisible in a rendered picture and equally invisible to a reviewer, because both
  arrangements draw the same boxes in nearly the same order. The only test that can distinguish
  them compares the declared sequence against the ordered trace of a REAL re-run, in both
  directions.
  Deliberately NOT covered: whether the diagram is clear or well laid out. That is human
  judgement and no test here claims it.
