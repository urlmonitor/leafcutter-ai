notes: >-
  This exists because of the specific failure recorded in
  KI-BO-20260909-worktrees-go-stale-within-minutes: a compensating staleness pre-check
  PASSED and the workspace was STILL rooted somewhere else. A check that runs before the
  thing it is checking has been made can only ever verify an input, so this AC moves the
  assertion to after creation and makes it a post-condition on the artefact. The
  pre-check's verdict is deliberately part of the Given, to make a test that satisfies
  this AC by strengthening the pre-check fail.
