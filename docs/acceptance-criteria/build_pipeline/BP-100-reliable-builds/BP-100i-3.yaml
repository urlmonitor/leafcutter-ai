criteria: |
  Given the canonical template directory contains 5 hook scripts:
    - check_alpha.py
    - check_beta.py
    - check_gamma.py
    - check_delta.py
    - run_hook.py
  And the deployed output directory (where build.py writes commit guardian
    files for the consumer project) contains only 3 of those scripts:
    - check_alpha.py
    - check_beta.py
    - run_hook.py
  (check_gamma.py and check_delta.py were not deployed)
  When the parity check runs at pre-commit time
  Then the commit is blocked with exit code 1
  And the error message lists "check_gamma.py" and "check_delta.py" as scripts
    present in the canonical template but absent from the deployed output
  And the error message names the deployed output directory that was checked
