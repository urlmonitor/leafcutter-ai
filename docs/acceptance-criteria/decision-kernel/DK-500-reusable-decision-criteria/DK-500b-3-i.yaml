criteria: |
  Given cat-40cc613f737e3323 is retired with replaced_by cat-d15d52392d7aa94c,
  And its preferred wording "Is every record that enters docs/decisions authorised by a person, either per decision or by a standing rule the person approved in an ADR, and never by a record or a precedent?" is also an other wording of cat-d15d52392d7aa94c,
  When a new sighting with exactly that wording is grouped,
  Then it is placed in cat-d15d52392d7aa94c and never in cat-40cc613f737e3323,
  And when a replacement is itself retired, the placement follows replaced_by until it reaches a category that is not retired,
  And when the retired category was split into several replacements, the wording gets "none", naming the replacements for a person to choose.
