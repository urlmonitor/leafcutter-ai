criteria: |
  Given a contributor who needs to see what a build produces without risking
    the changes they have open in the active worktree,
  When the how-to guide for safely exercising the build is produced,
  Then it states that the build must never be run against the active worktree
    root or any path inside it, that a disposable target directory outside the
    worktree must be used instead, and that dual-tree files are edited in the
    package source and reconciled by comparison rather than synced by a build,
  And it gives the concrete ordered steps a contributor follows to exercise the
    build safely and confirm their in-progress work is untouched afterward.
