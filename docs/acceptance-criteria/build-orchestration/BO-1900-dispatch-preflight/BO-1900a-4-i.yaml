id: BO-1900a-4-i
components:
  - build_orchestration
title: "No phase agent is spawned while the isolated working copy is still undetermined"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a resolved target whose isolated working copy is still not determined,
    And no later step has since established one,
  When the drive reaches the point where it would spawn a phase agent,
  Then no phase agent is spawned,
    And the drive holds the work back with a reason naming the undetermined working
      copy,
    And it does not fall back to the location the process happens to be running in,
      nor to the epic's work-store folder, nor to any other location it can find,
    And once a working copy has been established for that target, the same drive
      spawns the phase normally,
  So an unanswered question about where the work belongs stops the drive instead of
    being answered by whatever is nearest.
