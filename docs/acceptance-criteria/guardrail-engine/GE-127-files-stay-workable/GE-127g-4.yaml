test_rationale: >-
  No executable test contract, and the reason is specific rather than procedural. Every
  clause in this record is a property of published prose — what the text STATES — so the
  only machine-checkable shapes available are a grep for a path string in a markdown file
  (which passes on text that lists the locations and omits the grounds, the exact failure
  the record's notes name as most likely) or a parity check between the published text and
  the declaration. The second is the better test and it is explicitly out of scope: the
  record's own doc_links state that no document-side parity gate exists, that the gap is
  real, that it is not this record's work, and that it must not be specified here by
  implication. Writing it into test_spec would do precisely that. Verification therefore
  runs through the documentation-verifier phase agent against EVERY clause of ALL THREE
  arms — the arm about what is not judged and on what ground, the arm about the bound that
  nonetheless applies to a set-aside location, and the arm about a document in no declared
  location. Deliberately not scoped to a clause count: the record gained an arm after its
  first enrichment pass and a fixed count is the thing that went stale.
  TWO CLAUSES ARE PASS/FAIL, AND THEY FAIL IN DIFFERENT DIRECTIONS. The first is the
  ground stated as the earning PROPERTY rather than as the generator's name: a deliverable
  that restates the declaration verbatim satisfies the listing clause and fails this one,
  and it is the clause the record's own notes name as most likely to be dropped. The
  second is 'a document above its location's ceiling is reported AND the commit still
  completes', and it is the clause most likely to be delivered BACKWARDS rather than
  omitted — a reader's default assumption about any gate is that exceeding a threshold
  gets you refused, so a writer working from that assumption produces a sentence that
  reads naturally and is the opposite of the truth. The asymmetry is why both are
  pass/fail and why the second deserves its own read: dropping the ground clause leaves an
  author where they started, whereas inverting the ceiling clause actively misinforms them
  about the one behaviour the set-aside class exists to provide — that nobody is refused
  for length they did not write. An omission is a gap; an inversion is a wrong answer
  delivered confidently, and this record's whole purpose is to be the place an author gets
  the right one.
  THE FOLLOW-UP GAP IS NOW PARTLY DISCHARGED, AND HERE IS WHAT REMAINS. GE-127g-5 closed
  the half that was about the DECLARATION going silently wrong: an entry declaring no
  ceiling is rejected, so the declaration can no longer be incomplete unnoticed, and a
  document above its ceiling is reported, so unchecked growth inside a set-aside location
  is surfaced rather than invisible. What is still unaddressed is the half this record
  sits on — PUBLISHED TEXT versus CONFIGURATION. Nothing checks that the reference doc
  still describes the declaration after the declaration changes, so a location added or a
  ceiling altered leaves the published description quietly stale, which is the same
  reviewable-by-nobody condition the parent L1 exists to end. A document-side
  published-versus-configured parity gate, mirroring the code-side rule's existing one,
  would close it. It needs its own record under GE-127d and must not be smuggled in here
  — see the eighth it_requirement — and there is now LESS room than when this was first
  noted: GE-127 holds 7 of 7 L1s and GE-127g holds 5 of 5 permitted children, so it needs
  a split or a new L0 rather than a sibling anywhere in this subtree.
