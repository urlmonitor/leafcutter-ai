criteria: |
  A warning about the wrong specialist means something is really wrong.

  The safeguard that flags a mismatch between the work requested and the
  specialist assigned stops firing on work that was routed correctly, so it
  becomes a signal worth stopping for rather than background noise everyone has
  learned to wave through.
