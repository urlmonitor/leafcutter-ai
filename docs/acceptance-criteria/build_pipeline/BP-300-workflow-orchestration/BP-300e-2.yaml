notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with
  an input string of the form '<prose>\n{"...": "..."}\n<prose>' asserting the returned
  value equals the intended object. Also coverable by a workflow-level integration test
  that dispatches a stubbed agent returning prose-wrapped JSON and asserts the run
  reaches its next stage.
