id: BP-1100c-2
title: "Spot-check findings are recorded in the retrospective and defects open remediation tickets before close"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the post-epic angle-testing spot-check phase has produced findings for a
  behavioral epic,
  When finalization processes those findings,
  Then every spot-check finding is written into the epic's retrospective document
  before the epic merges,
  And for each finding classified as a defect, a remediation ticket is created before
  the epic is marked closed,
  And the epic is not closed while a spot-check defect has no corresponding remediation
  ticket.
