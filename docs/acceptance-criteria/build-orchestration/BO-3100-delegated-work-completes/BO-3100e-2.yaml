readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step newly added to a build, which no rule anywhere in the system names,
    And it carries its own declaration of the result it produces,
  When it ends having produced that result,
  Then it is counted as done.

  Given that same newly added step,
  When it ends without that result having come into being,
  Then it is not counted as done,
    And the reason names the result its own declaration promised,
  So a step added after the judgement was built is checked on arrival rather than
    passing unexamined.

  Given a build in which every step that ran carries a declaration,
  When the build's record of the run is read,
  Then the number of steps whose result was looked for equals the number of steps
    that ran,
    And no step is exempt from the check by virtue of not appearing in any list,
  So the check cannot be satisfied for the steps somebody remembered while being
    absent for the rest.

  Given two steps that produce different results,
  When each is judged,
  Then each is judged against the result its own declaration names and not against
    the other's,
  So the judgement is specific to the step rather than a single condition applied
    to all of them.
