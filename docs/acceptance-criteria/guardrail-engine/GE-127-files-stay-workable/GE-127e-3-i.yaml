it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED. WATCHED_REGISTRIES binds exactly two
    containers on commit_guardian.json: hooks_manifest.hooks (by entry id) and the
    document's own top level (by mapping key). This record adds neither — it changes how
    one unproducible result is reported inside an existing gate. Both containers were read
    in this worktree: `check-file-size` is already a manifest id, `file_size` is already
    one of the 37 top-level keys, and anything nested inside `file_size` is invisible to
    the watcher. Plain-list spec form, and no config_schema_fragment invented to satisfy
    the structured-spec validator — the BP-100k-4 / BP-100k-4-i fictional-key precedent is
    not repeated.
  - >-
    THE UNAVAILABILITY VOCABULARY IS REUSED, THE EXIT STATUS IS NOT — THIS IS THE DECISION
    THE BA DEFERRED AND IT IS TAKEN HERE, WITH ITS REASONING. GE-127a-1-i pinned
    BP-1600a-2-ii's contract for a file whose LENGTH could not be established: an
    "INDETERMINATE: reason=<text>" line naming which situation occurred, at exit 2,
    alongside exit 0 clean and exit 1 for a measured finding. That contract is reused HERE
    IN ITS LINE SHAPE AND ITS NAMING DISCIPLINE — a single machine-readable token, followed
    by `reason=` and a specific reason, naming the situation that actually occurred — and
    is NOT reused in its exit status. The substantive difference decides it: a failure to
    MEASURE leaves the verdict unknown, which is what exit 2 means; a failure to DESCRIBE
    leaves the verdict perfectly known — the file's length was established and found over
    — and only the advice missing. This record positively requires the commit to be refused
    in that case, so the run must exit 1 with the ordinary refusal for that file, carrying
    the could-not-be-described line INSIDE that file's refusal block on the same stream.
    Routing it to exit 2 would be a defect three times over: it would move the verdict,
    which the title of this record forbids; it would collapse the very distinction
    GE-127a-1-i's third clause exists to hold, by making a known-over file report as
    indeterminate; and structurally the exit-2 paths in main() print to stderr and return
    immediately, suppressing the refusal block this line is required to be attached to.
  - >-
    THIS IS NOT A THIRD VERDICT SET, AND THE GUARD ALREADY DEMONSTRATES WHY. check_file_size
    already emits "EMPTY HISTORY: reason=<text>" — the same token-and-reason line shape as
    INDETERMINATE, deliberately named distinctly, and deliberately NOT carrying exit 2,
    because an empty previous-length history is a legitimate completing result. The
    could-not-be-described state is the same construction applied to a different step: one
    shared line grammar, one naming discipline, and a status decided by the VERDICT rather
    than by the token. Choose a token in that grammar which cannot be misread as either of
    the existing two, and record it in the guard's own module docstring alongside them.
  - >-
    NAME THE REASON SPECIFICALLY, AND DO NOT COLLAPSE DISTINCT CAUSES. "Could not be
    described" will have more than one cause — content that will not parse into parts, a
    part set that cannot account for half the quoted length (GE-127e-1 routes that state
    here), a kind for which no extractor exists. These are different facts about the world
    and the reason text must say which occurred, exactly as GE-127a-1-i requires the two
    measurement situations to be named separately. A single shared sentence for all causes
    costs the author the only information that tells a genuinely unparseable file from a
    gap in the gate.
  - >-
    THE DESCRIPTION STEP MUST BE STRUCTURALLY INCAPABLE OF MOVING THE VERDICT. The verdict
    is computed from length alone and must be fixed BEFORE the description step runs, so no
    outcome of that step — success, failure, or an exception — can change whether the commit
    completes. Do not compute the verdict from anything the description produced, and do not
    let the description step raise into the classification loop. The recorded defect on this
    guard's measurement step is the same shape one step earlier, and this one would be
    quieter: a caught exception in the description step turning a refusal into a completed
    commit silently undoes GE-127a and GE-127b for exactly the files hardest to describe,
    and no test in either of those records would notice, because their fixtures describe
    cleanly.
  - >-
    THE STATEMENT IS AN ATTACHMENT TO A REFUSAL, NEVER A FINDING OF ITS OWN. A file that is
    within its permitted length produces no could-not-be-described line even when it is
    undescribable, and no exit-status change. Gate the emission on the file already having
    been refused, not on the description step having been attempted — the cheap
    implementation reports the failure wherever it occurs and would break GE-127a-1's
    silence arm from a direction that record cannot see.
  - >-
    Must follow the repo error-handling policy: the description step performs I/O and
    parsing, so specific-exception try/except, and log at WARNING or higher or re-raise. The
    re-raise-equivalent here is the could-not-be-described line itself. A swallowed error
    must never become an absent description that also relaxes the verdict, and must never
    become an empty parts list that reads to the author as "this file has no parts".
  - >-
    EXERCISE THE UNDESCRIBABLE STATE FOR REAL. Make the content genuinely unresolvable into
    parts at run time — a covered file whose bytes do not parse, or whose structure yields
    no locatable part — never by asserting that an error branch exists in the source.
    BP-100k-4-i's standing constraint applies unchanged, and this record's own notes say so:
    a source assertion stays green on precisely the swallow-and-continue implementation this
    record forbids.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE. Edit
    templates/scripts/commit_guardian/ only; scripts/commit_guardian/ and the repo-root
    .pre-commit-config.yaml are untracked build outputs overwritten by build.py, and
    templates/commit-guardian/commit_guardian.json is a decoy. Re-run `python
    scripts/build.py --target-dir .` — the hook runs from the deployed layout, so an unbuilt
    failure path is unverified however green the source-tree tests are.
test_spec:
  - name: test_ge_127e_3_i_an_undescribable_over_limit_file_is_still_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Stage a covered file that stands above its permitted length and whose content is
      genuinely unresolvable into parts at run time, and perform an ordinary commit. The
      commit must not complete, exactly as it would have had the description been produced,
      and the exit status must be the ordinary finding status — not the indeterminate one.
      NAMED MUTATION (mandatory, run it, do not merely describe it — the BA's injection 1):
      "the commit does not complete, exactly as it would have had the description been
      produced" — MUTATION: make the description step, on failing to resolve a file's
      content into parts, yield an empty description and allow the run to continue to a
      clean result for that file. Under that injection the commit completes for a file that
      is over its permitted length; this clause must go RED, failing BY THE COMMIT OUTCOME
      as well as by the text, and must return to green on revert. This is the exact shape
      already recorded in this guard for the measurement step, and it is the reason this
      record exists rather than being trusted to the implementer.
  - name: test_ge_127e_3_i_the_outcome_states_that_no_description_could_be_produced_and_names_the_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      The refusal carries a could-not-be-described line for that file, naming the specific
      reason — content that would not parse, a part set that could not account for the
      quoted length, or no extractor for the kind — rather than one shared sentence for
      every cause. Two runs exercising two different causes must produce two different
      reasons, which is what stops the line degrading into a second fixed sentence.
  - name: test_ge_127e_3_i_no_substitute_advice_stands_in_for_the_missing_description
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      The outcome offers no parts, no division, and no substitute wording that reads as
      advice about that file. NAMED MUTATION (mandatory, run it — the BA's injection 2):
      "the outcome offers no parts, no division, and no substitute wording that reads as
      advice about that file" — MUTATION: when the description cannot be produced, fall back
      to a fixed sentence of general refactoring advice. Under that injection this clause
      must go RED, and must return to green on revert. Without it the clause is an absence
      and is green against any implementation that emits nothing. This injection is the
      anti-precedent in miniature: a placeholder standing in for a result, indistinguishable
      to the reader from the real thing.
  - name: test_ge_127e_3_i_a_describable_file_under_its_limit_commits_and_is_not_refused_for_having_guidance
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A covered file standing BELOW its permitted length, for which a description could be
      produced, commits cleanly with nothing about it reported. NAMED MUTATION (mandatory,
      run it — the BA's injection 3): "a file is never refused because guidance about it
      could be produced, only because of its length" — MUTATION: refuse any file for which
      named parts could be produced, regardless of its measured length. Under that injection
      this arm must go RED, failing by the commit outcome, and must return to green on
      revert. Without it the arm is satisfied by a guard that refuses nothing at any commit,
      which is today's implementation exactly.
  - name: test_ge_127e_3_i_an_undescribable_file_under_its_limit_produces_no_could_not_be_described_statement
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      THE ARM THAT STOPS THE FIX OVERSHOOTING. Take the same undescribable file, bring it
      below its permitted length while it remains undescribable, and commit. The commit
      completes and no could-not-be-described statement is made about it — the statement is
      an attachment to a refusal, not a finding of its own. Without this descriptor the
      cheap implementation reports the failure wherever it occurs and makes every commit
      touching an undescribable file noisy, breaking GE-127a-1's silence arm from a
      direction that record cannot see.
  - name: test_ge_127e_3_i_the_could_not_be_described_state_does_not_take_the_indeterminate_exit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE VOCABULARY DECISION MADE EXECUTABLE. Three runs, distinguished by exit status and
      by token: a covered file measured and found over but undescribable exits with the
      ordinary finding status carrying its refusal block and the could-not-be-described
      line; a covered file whose LENGTH cannot be established still takes GE-127a-1-i's
      INDETERMINATE path at exit 2; a clean run exits 0. An author, and pre-commit, can tell
      the three apart without inspecting anything else. This is the descriptor that fails if
      someone later routes the description failure through the indeterminate path — which
      would move the verdict and collapse GE-127a-1-i's third clause.
  - name: test_ge_127e_3_i_the_could_not_be_described_line_reaches_the_registered_hook_output_and_status
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate through the registered hook path with an
      undescribable over-limit file staged and assert the line and its named reason appear
      in the hook's own output stream, inside that file's refusal block, with the commit
      outcome carried by the exit status rather than an advisory note. A state printed by a
      function nothing at commit time calls is inert, and a line printed on a stream the
      hook does not surface is invisible to the author.
  - name: test_ge_127e_3_i_the_deployed_copy_still_refuses_an_undescribable_over_limit_file_in_a_cold_process
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold
      process — a description module placed outside templates/scripts/commit_guardian/
      without a scripts/build_phases.py deploy-map entry surfaces here as
      ModuleNotFoundError rather than passing, and would in production be an import error at
      commit time whose handling could itself relax the verdict. With an undescribable
      over-limit file staged, the deployed run refuses the commit and emits the named line.
test_rationale: |
  The clause carrying the actual guarantee — the commit does not complete, exactly as it
  would have had the description been produced — is asserted BY THE COMMIT OUTCOME and not
  merely by the text, because a gate that prints a worried message and exits 0 is
  indistinguishable from a passing one to pre-commit, which reads only the status. All three
  of the BA's injections are carried into descriptors verbatim; two of them are required to
  fail by the commit outcome for exactly that reason.

  The undescribable state is produced by making the content genuinely unresolvable at run
  time. This record's own notes rule out the alternative, and BP-100k-4-i's standing
  constraint says why: a test asserting that an error branch exists in the source stays green
  on precisely the swallow-and-continue implementation this record forbids — which is the
  shape already recorded on this guard's measurement step, one step earlier in the same run.

  The seam descriptor is where the deferred vocabulary decision becomes falsifiable rather
  than a note in a field. Three runs, three statuses, three tokens: an undescribable but
  measured file exits with the ordinary finding status, an unmeasurable file still takes
  GE-127a-1-i's INDETERMINATE exit 2, and a clean run exits 0. Nothing else in the tree fails
  if someone later routes the description failure through the indeterminate path, and that
  routing would move the verdict — which is the one thing this record's title forbids.

  The two boundary descriptors are what stop the fix overshooting in the two available
  directions: the under-limit describable file proves guidance never becomes a reason to
  refuse, and the under-limit undescribable file proves the statement is an attachment to a
  refusal rather than a finding of its own. Without the second, every commit touching an
  undescribable file becomes noisy and GE-127a-1's silence arm breaks from a direction that
  record cannot see.
delivers_to: null
expects_from:
  ac_id: GE-127e-1
