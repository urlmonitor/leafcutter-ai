delivers_to: null
expects_from: null
test_intent:
- clause: the store's schema check, the commit-time record check and the requirement rule check each reject
    "api-guide" as an unknown trigger name and accept "reference-doc"
  needs_test: true
  reason: All three checks must reject the same unknown name, and one check reading a stale list would
    silently accept it.
- clause: the trigger names are declared in exactly one list, which the schema check and the record check
    both read, and the rule check's single trigger-to-specialist map has exactly one entry for each name
    in that list
  needs_test: true
  reason: Single-sourcing is the deliverable, and a leftover duplicate list only shows itself when the
    lists drift apart.
- clause: given a sixth name "api-guide" is added to that one list and given a specialist in the rule
    check's map, with no other edit
  needs_test: false
  reason: Precondition line of the next scenario, not an outcome, so there is nothing to prove here.
- clause: all three checks accept "api-guide"
  needs_test: true
  reason: Accepting the new name in all three checks after one edit proves they read the one list.
- clause: given a name is in the list but has no entry in the map, or has a map entry but is not in the
    list
  needs_test: false
  reason: Precondition line of the next scenario, not an outcome, so there is nothing to prove here.
- clause: a test fails naming that trigger name and the side it is missing from
  needs_test: true
  reason: The parity test is the guard against future drift, and it must name the trigger and the missing
    side.
test_spec:
- name: test_record_check_rejects_unknown_trigger_and_accepts_reference_doc
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Runs validate_ac_schema.py as a subprocess on an L1 record with documentation_triggers
    [reference-doc, api-guide] in a tmp repo: non-zero exit naming api-guide; with [reference-doc] alone
    it exits 0.'
  proves_clause: the store's schema check, the commit-time record check and the requirement rule check
    each reject "api-guide" as an unknown trigger name and accept "reference-doc"
  code_file: scripts/ac_store/validate_ac_schema.py
- name: test_commit_hook_rejects_unknown_trigger_and_accepts_reference_doc
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Runs check_ac_schema.py as a subprocess with HOOK_ROOT set to the tmp repo and the record
    named in HOOK_TEST_STAGED_FILES: non-zero exit naming api-guide; the reference-doc-only record passes.'
  proves_clause: the store's schema check, the commit-time record check and the requirement rule check
    each reject "api-guide" as an unknown trigger name and accept "reference-doc"
  code_file: templates/scripts/commit_guardian/check_ac_schema.py
- name: test_commit_hook_fallback_without_jsonschema_rejects_unknown_trigger
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'check_ac_schema._validate_file with validate_with_jsonschema made to raise ImportError
    (jsonschema absent, so validate_manually runs): the L1 with [reference-doc, api-guide] gets an error
    naming api-guide, and [reference-doc] alone gets none. The fallback takes the names from the loaded
    schema''s documentation_triggers enum, so a tmp schema whose enum adds api-guide makes the fallback
    accept it.'
  proves_clause: the store's schema check, the commit-time record check and the requirement rule check
    each reject "api-guide" as an unknown trigger name and accept "reference-doc"
  code_file: templates/scripts/commit_guardian/_ac_schema_validators.py
  must_catch:
  - validate_manually keeps not checking documentation_triggers, so without jsonschema the hook accepts
    api-guide
  - validate_manually checks against a hard-coded copy of the five names instead of the schema's enum
- name: test_rule_check_reports_unknown_trigger_and_accepts_reference_doc
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: criterion
  description: The requirement rule check (run as in test_acd_2500a_2_v) reports api-guide on the L1 as
    a failed finding and raises no unknown-trigger finding for reference-doc.
  proves_clause: the store's schema check, the commit-time record check and the requirement rule check
    each reject "api-guide" as an unknown trigger name and accept "reference-doc"
  code_file: scripts/ac_store/_rc_doc_triggers.py
- name: test_trigger_names_live_in_one_list
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: With a tmp repo whose schema enum drops how-to, validate_ac_schema.py rejects how-to (it
    reads the list), validate_ac_schema has no trigger-name collection of its own, and TRIGGER_SPECIALISTS
    has exactly one key per enum name in the shipped schema.
  proves_clause: the trigger names are declared in exactly one list, which the schema check and the record
    check both read, and the rule check's single trigger-to-specialist map has exactly one entry for each
    name in that list
  code_file: scripts/ac_store/validate_ac_schema.py
  must_catch:
  - validate_ac_schema keeps _DOC_TRIGGER_VALUES as a second list that is used when no schema is passed
  - the map is compared only by count, so a misspelled key with the same count passes
- name: test_sixth_name_is_accepted_after_one_list_edit
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'A tmp repo whose schema enum adds api-guide, plus api-guide added to TRIGGER_SPECIALISTS:
    validate_ac_schema.py, check_ac_schema.py and the rule check''s evaluate_record all accept api-guide.'
  proves_clause: all three checks accept "api-guide"
  code_file: scripts/ac_store/validate_ac_schema.py
  must_catch:
  - the record check falls back to a hard-coded list and still rejects api-guide
  - the commit hook validates against a copy of the names instead of the schema file under HOOK_ROOT
- name: test_list_and_map_parity_names_trigger_and_side
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: The parity check (run in the normal suite) passes on the shipped schema and map; fed a
    list with an extra api-guide it fails naming api-guide and the map side, and fed a map with an extra
    key it fails naming that key and the list side.
  proves_clause: a test fails naming that trigger name and the side it is missing from
  code_file: scripts/ac_store/_rc_doc_triggers.py
  must_catch:
  - the parity check compares only the counts
  - the parity check checks one direction only, list to map
  - the failure message omits which side the name is missing from
