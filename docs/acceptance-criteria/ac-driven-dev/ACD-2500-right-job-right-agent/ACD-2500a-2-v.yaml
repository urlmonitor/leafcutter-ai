notes: |
  AMENDMENT NEEDED: ACD-200b / ACD-200b-1 promise that the IT PO template contains a
  "Documentation Gate" section and that the IT PO itself checks and fills documentation
  ACs before setting readiness: reviewed. With this AC the CHECK moves to the rule check;
  ACD-200b-1's "template contains the section" clause becomes false once ACD-2500e-2
  removes S7b. Amend ACD-200b-1 (or supersede it by this AC) before ACD-2500e-2 builds.
  ACD-200b's option (a) "IT PO creates the missing doc ACs itself" is authoring, not a
  rule; it is not relocated here (this check never creates records).
  ACD-200b-1's table lists 4 triggers and omits reference-doc; the it-po S7b table and
  this AC list 5. The 5-entry table is the one to keep.
