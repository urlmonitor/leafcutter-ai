id: ACS-500g-1-i
components:
  - ac_store
readiness: approved
priority: high
title: "A pattern candidate is a proposal — existing ACs are never rewritten by the scan"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a store-wide scan has produced a pattern candidate covering source ACs
    ACS-310a-2, ACS-320b-1 and ACS-340c-4,
  When the scan finishes and the candidate has not yet been approved,
  Then those three source ACs are byte-for-byte unchanged — none has gained an
    implements_pattern value, lost criteria text, or had pattern_bindings added,
  And no pattern AC has been written into the store,
  And the candidate report states, per source AC, what would change if the
    candidate were approved (criteria replaced by implements_pattern plus the
    named bindings).

  Given the same candidate is then approved,
  When the promotion is carried out,
  Then the pattern AC is written,
  And each source AC is converted to reference it,
  And any source AC whose behavior is only a partial match is left unconverted and
    listed as needing a separate deviation decision rather than being force-fitted.
depends_on: [ACS-500g-1]
