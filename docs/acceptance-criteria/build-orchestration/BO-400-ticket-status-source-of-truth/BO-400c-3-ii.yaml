notes: |
  DECIDED INTENT (from the user): on ordinary branch commits, moves into
  tickets/99_done/ MUST be caught by the prohibition — branches must never
  archive; archiving happens ONLY via the finalize-feature flow running on
  main. The implementation must define the mechanism that distinguishes an
  ordinary branch commit from the finalize archive step (env/context flag or
  allowlist); this carve-out is what keeps finalize working while blocking
  premature branch-side archival.
