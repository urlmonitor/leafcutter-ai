notes: |
  AUTHORED 2026-09-08 by PO v3 at BrainCandy's request, as stage 1 of PO -> BA -> IT-PO.
  Placed under the EXISTING ACD-400 rather than a new L0 — see the ACD-400e notes for
  the placement reasoning, which covers all three new siblings.

  WHAT THE GAP ACTUALLY IS. Verified by reading the code on this branch, not inferred.
  `scan_ac_store.py` applies four admission tests in sequence (lines 994-1001): leaf
  level, work_status, `status: active`, and `_is_approved`. The first three are
  specified by ACD-400a-1. The fourth is not specified anywhere. It was added later
  and never reached the store.

  THREE CONSEQUENCES THE BA SHOULD DECOMPOSE AGAINST, IN ORDER OF SHARPNESS:

  1. A one-line edit to `_is_approved` redirects every subsequent build and no test
     objects. Confirmed: no test in `unit_tests/` exercises `_is_approved` or asserts
     that an unapproved record is withheld. `unit_tests/ac_store/test_readiness_gate.py`
     sounds like the missing test and is not — it covers `classify_readiness()` in
     `goal_to_epic.py` (ACD-1200b-1/-2), a different surface with a different job.
     That near-miss is worth naming in the L2s so nobody cites it as existing coverage.

  2. ABSENT MEANS EXCLUDED, AND THAT IS A DECISION, NOT A DEFAULT. `ac.get("readiness", "")`
     treats a record with no readiness field identically to a rejected one. The
     docstring calls this "conservative", which is a defensible product choice — but it
     is a choice, and it is the direct cause of the large invisible population that
     ACS-100g's bulk-approval tool exists to work around. The L2s must state the
     absent-field verdict explicitly and prove it, rather than letting it stay an
     artefact of a default argument.

  3. EXCLUDED WORK VANISHES ENTIRELY — IT IS NOT EVEN REPORTED AS BLOCKED. The approval
     test runs BEFORE ready/blocked classification (line 1000 precedes line 1008), so an
     unapproved record appears in neither list and in no count. This is the shape
     ACS-1100 (honest coverage answers, `scope: standing`) exists to forbid: an answer
     that saw a fraction looks exactly like one that saw everything.
     DELIBERATELY NOT AUTHORED HERE. Making the scanner report its exclusions is a
     change to what the queue OUTPUTS, not to how it SELECTS, and it is a distinct
     capability. ACS-1100 is a standing contract that this tree inherits rather than
     duplicates. Flagged to the user as a recommended follow-up; do not silently pull
     it into an L2 under this L1.

  DO NOT TOUCH THE FAST LANE. BO-2400f-2 (approved, done) makes fast-lane selection
  deliberately readiness-agnostic, and BO-2400f-12-ii states as a hard constraint that
  "readiness, priority, req_status and status must not appear anywhere in the
  producibility decision." Two selectors, two deliberately opposite rules. Any L2 that
  unifies them contradicts an approved criterion in another component. What this L1
  fixes is that only one of the two rules is currently written down.
