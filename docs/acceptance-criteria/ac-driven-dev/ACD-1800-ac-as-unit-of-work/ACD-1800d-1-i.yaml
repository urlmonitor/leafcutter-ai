notes: |
  Edge case of ACD-1800d-1 enforcing the ACD-1600d canonical-source rule at the
  deliverable back-reference level: traceability that points at a build-output copy
  is worse than none, because it sends a builder to a file that gets overwritten.

  IT-PO enrichment (2026-08-12): reuses the ACD-1600d canonical-source resolver
  (cross-tree dependency, carried via depends_on/it_requirements -- no files created
  outside this folder). Added ac_store to graph components.
