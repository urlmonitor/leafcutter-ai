    relationship: specifies
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "An empty implemented_by list (missing, null, or []) MUST yield zero inspection targets and therefore no block — nothing was ever claimed, so there is nothing to orphan. Normalize null/missing/[] to the same empty-target outcome."
  - "This case is outcome-identical to the emptied-list case in ACS-900d-1; the implementation MUST NOT special-case 'never claimed' versus 'just emptied' — both reduce to zero targets => no block. (No HEAD-vs-staged provenance check on implemented_by is needed for the pass decision.)"
  - "Pass path MUST be silent on stdout and exit 0 for that AC, per the no-false-positive guarantee."
  - "Deployed and packaged-template copies of the hook MUST stay in parity (ADR-001)."
delivers_to: null
