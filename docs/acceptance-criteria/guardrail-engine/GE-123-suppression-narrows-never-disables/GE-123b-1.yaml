notes: |
  THE DISPOSITION DECISION, made explicitly as GE-123b's notes require rather
  than by default. Three options were on the table: announce and proceed, refuse
  the entry for that file and report the finding anyway, or block. CHOSEN:
  REFUSE AND ANNOUNCE, never block. Announce-and-proceed was rejected because
  this L1's promise is about the outcome, not only about silence — a file that is
  announced as unprotected is still unprotected. Blocking was rejected because
  this check runs on every commit, so a hard error over one too-broad line
  becomes a repository-wide outage; that is the same reasoning GE-113c-3-v
  recorded, and refusal already fails closed, because the author immediately
  sees the findings they were trying to hide. GE-120's "a check that cannot run
  says so" is satisfied by the announcement and is not repealed; its unit is
  visibility, so it does not by itself demand blocking. The announcement's
  contract is specified in the child GE-123b-1-i.

  WHAT "EFFECTIVE COVERAGE" IS COUNTED IN — the definition the whole L1 turns on,
  and the one that reconciles it with its sibling. Coverage is the set of RULES
  still able to report on a file after the allowlist is applied, NOT the set of
  findings the file happens to produce today. Under the findings reading, this
  criterion would forbid GE-123a-2's third arm (suppressing the only finding a
  file currently produces, which that AC establishes as legitimate) and the two
  L1s would contradict each other. Under the rules reading they agree exactly.
  GE-123b-3 is the criterion that makes this distinction testable in its own
  right.

  MEASURED TODAY, end-to-end through the multi-file entry point (2026-08-18),
  with an ordinary source filename and no env-named file involved:
    - arm 1 baseline: 0 findings, clean exit. Target: 4 findings, findings-present
      exit. This is a WELL-FORMED single line collapsing an ordinary .py file to
      nothing, and no warning is emitted on any stream.
    - arm 2 baseline: 4 findings, all of them in "helpers.py". Target: 8.
    - arm 3 baseline: 3 findings — ALREADY CORRECT. Labelled regression guard;
      green on arrival here is expected and is not a TDD-order violation.
    - arm 4 baseline: 3 findings — ALREADY CORRECT. Labelled regression guard.
  Arms 3 and 4 are the mandatory paired positives: without them the criterion is
  satisfied by an implementation that stops honouring suppressions, or that bans
  the rule wildcard outright.

  ARM 4 IS THE ONE THAT STOPS THE CHEAP FIX. The tempting implementation is to
  reject the rule wildcard, or any entry that "looks too broad", at parse time.
  Arm 4 is a rule-wildcard entry that is perfectly safe because it is pinned to
  one line, and it must keep working. The test is the resulting coverage, never
  the shape of the line.

  VERIFICATION STANDARD (inherited from GE-123's notes, and non-negotiable here):
  a sibling audit in this family found two criteria verified only against the
  matching logic in isolation that described situations the real entry point
  cannot produce. Every arm above was measured through the multi-file entry
  point with real files on disk, and must be tested the same way. Coverage of the
  suppression predicate in isolation does not discharge this criterion.

  IT-PO RE-VERIFICATION (2026-08-18, before enrichment): all four baselines were
  re-measured through scan_files with real files on disk and a real allowlist in
  the same temporary root — 0, 4, 3, 3 — matching the BA's figures exactly. The
  arm-4 run confirmed the reported rules are the private-key header, the
  password assignment and the high-entropy token, with the cloud access key
  suppressed, as the criterion states.
