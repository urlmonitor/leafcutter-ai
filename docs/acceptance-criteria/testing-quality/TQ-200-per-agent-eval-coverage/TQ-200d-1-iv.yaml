it_requirements:
  - >-
    Code change, all in scripts/evals/produced_tests_scoring.py: (1) a helper that turns every assertion of the
    file into the comparison it states - a bare assert (as today) and the unittest calls self.assertEqual / assertEquals(a,
    b) as a == b, assertTrue(<compare>) as that comparison, assertGreater(a, b) as a > b and assertGreaterEqual(a,
    b) as a >= b; assertTrue of a non-comparison, assertIsNotNone and any other call give no comparison. (2) counts_rows_and_non_null
    (:111-121) and _count_kind (:97-108) read those comparisons instead of walking only ast.Assert (:117). (3) _count_side
    (:87-94) accepts the count on either side of an == and, for an exact count (processed or non-NULL), a non-literal
    integer expression on the other side (len(window), len(seed), or a name assigned from one) as well as an int
    literal; a comparison whose two sides are the same expression (len(volumes) == len(volumes)) is no count. The
    > n / >= n bounds stay literal-only with the existing rules (> n for n >= 0, >= n for n >= 1). (4) asserts_known_seeded_value
    (:130-141) reads equality comparisons from the same helper, seeded value on either side; _numbers (:124-127)
    keeps reading seeds only from assignments, so a number that appears only inside assertion calls is never a seed.
  - >-
    Reuse decision (IT PO): the sql-side _equality_statements (sql_test_writer_eval/evidence_kinds.py :79-87) returns
    unparsed strings and cannot carry the bound rules, so it is not imported; the new helper accepts the same call
    names (assertEqual, assertEquals) so the two families read unittest the same way. sql_test_writer_eval/ is not
    changed by this AC.
  - >-
    The rows in scripts/evals/sets/test-writer.jsonl are unchanged; the recorded gold outputs of the test-writer
    set still pass, and the existing bad-output probes in unit_tests/evals/fixtures/tq200d1/bad/ (empty_window_len_literals,
    empty_window_null_skipping, presence_*) keep failing.
  - >-
    Unit tests never call a live model; they score recorded outputs and probe fixtures only. Kept live outputs are
    copied by the test-writer from the kept-outputs folder of the 2026-11-02 runs (<session scratchpad>/kept_runs/run1|run2/<set>/<row>/,
    local to the run machine, as the known issue names it) into unit_tests/evals/fixtures/tq200d-rerun/<set>/<row>/run1|run2/
    as flat '<name>.py.recorded' files plus report.md (and transcript.jsonl where the row reads commands), the gold-output
    form place_outputs reads, so a bare pytest never collects them. Absolute local paths in a copied file (for example
    a sys.path line naming a user temp folder) are replaced with a neutral placeholder and nothing else is changed.
    No committed file names the scratchpad path. If another TQ-200d re-run AC has already created a needed fixture
    file, it is reused, not copied again. Probe fixtures for this AC: test-writer/empty-window/run1 and run2 (test_buy_volume_window.py)
    and test-writer/presence-is-not-correctness/run1 and run2 (test_live_value_presence.py); each weakened copy
    (asserting only presence) is built by the test from the fixture, not stored.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched and does not grow;
    no new module is added at the top of scripts/evals/. unit_tests/evals/ is at its density cap, so this AC's tests
    go in their own subfolder (named in test_spec) with an __init__.py, like unit_tests/evals/tq200d1ii/.
  - >-
    DOCUMENTATION (part of done) - on docs/reference/produced-tests-eval-assertion-kinds-test-writer.md the counts_rows_and_non_null
    entry's 'Passes when' must state that bare asserts and the unittest calls assertEqual/assertEquals, assertTrue(<comparison>),
    assertGreater and assertGreaterEqual are read; that the > / >= bounds are the same as for assert; that an exact
    count may compare against a non-literal integer expression such as len(seed) but not against the same expression;
    and it gains a unittest passing example (self.assertEqual(len(volumes), len(window)) with self.assertEqual(sum(v
