notes: |
  Added 2026-07-07 during the post-epic hardening remediation. The original
  entry point aborted when the read-only probe failed, which prevented recovery
  from ever running against the very corruption (a corrupt HEAD) it exists to
  repair. Covered by an unmocked real-git regression test.
