it_requirements: |
  New script scripts/commit_guardian/precommit_canary.py with a
  templates/scripts/commit_guardian/ mirror; deployed and template copies edited
  together and verified via the build.py round-trip (ADR-001). The manifest entry
  is added to the CANONICAL templates/scripts/commit_guardian/commit_guardian.json
  (the config/ copy is a build output, never the source of truth). build_precommit
  must emit the canary into the generated pre-commit config. The manual-only stage
  is what guarantees the canary NEVER runs on a real commit — it exists solely as
  the artifact the probe's Check D invokes on demand (single-producer contract
  with BO-1700a-1).
delivers_to:
