notes: >-
  Written specifically so that BO-4100b-1 cannot be satisfied by weakening or disabling
  the check. Narrowing what a check may refuse over and stopping it refusing at all are
  indistinguishable from BO-4100b-1's evidence alone; this AC forces the true-positive
  case to stay green and is the boundary that keeps BO-4100b from drifting into the
  silent-check failure BO-1700 exists to prevent.
