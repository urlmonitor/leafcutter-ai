    relationship: relates
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Plan execution MUST wrap step execution so that RecoveryError, subprocess.CalledProcessError, ValueError, and RuntimeError (including BLOCKED / unrecoverable steps) surface as an operator-facing 'Recovery halted' report naming the failing step — never a raw Python traceback. Execution stops at the failed step; later steps do not run on a partially-repaired store."
  - "This is the operator-experience guarantee behind BO-1600d-3's 'a failed step stops recovery with a clear report' it_requirement — pinned here as a testable behavioral criterion rather than prose."
  - "PORTABLE SURFACE: lives in the same standalone recovery script (templates/scripts/git_recovery.py); ADR-001 deployed/template parity applies."
