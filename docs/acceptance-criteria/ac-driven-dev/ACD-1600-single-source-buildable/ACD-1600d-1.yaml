id: ACD-1600d-1
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "A file target pointing at a deployed copy of a template is flagged for the canonical source"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC whose it_requirements name a file target under a build-output or deployed location
    (for example scripts/workflows/plan-feature.js or a .claude/ path) that has a canonical
    package-source counterpart under templates/,
  When the pointer-quality check evaluates the AC,
  Then the target is flagged as pointing at a generated or deployed copy,
  And the check requires the AC to name the canonical templates/ source that is edited by hand,
  And the flag names both the deployed path and its expected canonical source.
depends_on: [ACD-1600d]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Canonical source to change: scripts/ac_store/validate_ac.py (AC authoring-time validation; source-only Python)."
  - "The pointer-quality check must flag a file target that is a deployed/build-output copy of a templates/ source (for example scripts/workflows/*.js or a .claude/ path) and require the AC to name the canonical hand-edited templates/ source instead."
  - "The flag must name BOTH the deployed path and its expected canonical templates/ counterpart."
  - "The deployed<->canonical mapping must be resolved from the build deploy map in scripts/build_phases.py (counterpart-driven), not a hard-coded list nor the scripts/ prefix alone — a scripts/ path with no templates/ counterpart must NOT be flagged (ties to ACD-1600d-1-i)."
  - "Ship advisory before required and diff-scope the check so it grandfathers pre-existing (schema_version < 2) ACs (ADR-026 rules 3-4): existing consumer stores are full of build-output pointers (legacy ACD-400b itself has implemented_by: scripts/...), so a required, non-diff-scoped gate would retroactively flag a whole legacy store on upgrade."
delivers_to:
  agent: python-coder
  contract: "The pointer-quality check: given an AC file target, resolve whether it is a deployed copy of a templates/ source and, if so, flag it with the expected canonical path; consumed by the false-positive edge case ACD-1600d-1-i."
expects_from: null
test_spec:
  - name: test_deployed_copy_target_flagged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "An AC naming a build-output/deployed copy that has a templates/ counterpart is flagged by the pointer-quality check."
  - name: test_flag_names_deployed_and_canonical_paths
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The flag names both the deployed path and its expected canonical templates/ source."
  - name: test_canonical_mapping_resolved_from_deploy_map
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The deployed<->canonical mapping is resolved from the build deploy map, not a hard-coded list or the scripts/ prefix alone."
