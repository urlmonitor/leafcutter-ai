notes: |
  WHY A SIBLING L1 AND NOT A CHILD OF GE-127c, WHICH IS THE SEMANTICALLY RIGHT PARENT.
  GE-127c owns the scope decision and holds one L2 against a cap of five, so on
  structure alone it is the obvious host and on meaning it is the right one. It is ruled
  out mechanically, and the reasoning is recorded here so it is not re-litigated:

    - GE-127c is work_status: done. check_done_proof proves a done L0/L1 composite by its
      covered_by children being themselves done-and-covered. Adding a todo child makes it
      a done composite with an unfinished child — the ACD-400a defect class this
      repository found twenty live instances of in one sweep — and the AC-store rule
      requires the parent to be staged in the same commit as the child, so the violation
      would be staged with it rather than lying latent.
    - The same objection rules out GE-127a, GE-127b, GE-127d and GE-127e: all five
      non-f L1s are done.
    - GE-127f is todo and holds four of five, but its subject is the two-for-one removal
      obligation on an addition, not which documents are in scope at all. Filing a scope
      decision there would misfile it as precisely as filing it under check-secrets
      would have — the mistake that left BP-600f in the wrong component for six weeks.

  So the L0's last free L1 slot is the correct home, not the residual one. Arithmetic
  measured over the whole store on 2026-10-09 by id-derived parent attribution, not by
  listing folders: GE-127 held 6 of 7 L1 children before this record and holds 7 of 7
  after it, with no child_limit_override. THERE IS NOW NO L1 HEADROOM UNDER GE-127. The
  next scope-shaped record in this family needs a new L0 or a split, and this paragraph
  is the warning for whoever hits that.

  THE TWO DESIGN QUESTIONS, SETTLED HERE RATHER THAN LEFT TO THE IMPLEMENTER.

  (1) DIRECTORY, SUFFIX, OR A GENERAL CONCEPT? ANSWER: the general concept, expressed as
  declared path patterns each carrying its own stated reason; and for the agent cards the
  pattern is the DIRECTORY they are written into, not the .card.md suffix. Four grounds,
  in order of weight:
    - THERE ARE ALREADY TWO INSTANCES, SO A ONE-OFF IS ALREADY WRONG. The cards are one.
      docs/roadmap.md is a generated mirror and stood at 286 lines against a 300-line
      limit when this was authored — under the limit, and climbing, with the same
      unactionable refusal waiting at the end of it. A mechanism that names one
      generated surface produces a third discussion the next time.
    - THE SIBLING GATE ALREADY EXPRESSES OUT-OF-SCOPE AS A CLASS WITH A REASON, not as a
      list of individual files, and the reason it gives for machine-authored files is the
      reason that applies here. Expressing the same decision two different ways in two
      sections of one configuration file is drift by construction.
    - A DIRECTORY CANNOT BE DODGED BY A RENAME AND HAS NO FALSE-EXEMPT SURFACE. Every
      document in the cards directory is generated, so a directory rule exempts exactly
      the generated population. A suffix rule additionally exempts any hand-authored
      document anywhere under docs/ that happens to carry that suffix, which widens the
      exemption past the population it was written for — and a suffix is a naming
      convention, which a generator change can break while the directory stays.
    - THE DECIDING PROPERTY IS WHETHER ADDING AN AGENT REQUIRES AN EDIT. The current
      mechanism matches a document's bare filename against a declared list, so each new
      agent's card is a new unexempt document until someone edits the list. That is why
      this recurred four times in one session rather than once. "No edit to the
      declaration when a new document of the same generated kind appears" is stated as a
      criterion in GE-127g-1 precisely because it is the property that distinguishes the
      fix from the symptom.
  MEASURED EVIDENCE FOR THE "TOO NARROW AND ALSO TOO BROAD" CLAIM, 2026-10-09, raw line
  counts with no exclusions: the doc-length exclusion list holds two bare filenames,
  README.md and CHANGELOG.md. There are 12 files named README.md under docs/, all
  hand-authored, and all of them are exempt from that single entry at any depth. So the
  present mechanism simultaneously cannot express the class that needs exempting and
  silently exempts a dozen documents that do not. Both halves are fixed by the same
  change of shape.

  (2) SILENT OR REPORTED? ANSWER: reported, and the counts must move with the
  populations. Three grounds:
    - THE RECORDED HOUSE FAILURE. "A check that examined nothing must not look like a
      check that found nothing" is in CLAUDE.md with three instances behind it, one of
      which is this very store's validator exiting zero for eight days having checked
      zero files while the instruction that prescribed it was itself the no-op.
    - THE IN-TREE PRECEDENT. GE-127c-1 already requires the code-side gate to state
      which kinds of file it measured, "so a kind that was never measured is not read as
      having passed". Reporting is this goal's established convention and a silent skip
      would be the inconsistent choice, not the conservative one.
    - A SILENT EXCLUSION MAKES AN OVER-BROAD EXCLUSION UNFINDABLE. This is the argument
      that is specific to this record rather than inherited. The failure mode of a
      pattern-shaped exclusion is that it matches more than intended; under a silent skip
      nothing in the output distinguishes "no document is over its limit" from "every
      document was set aside", so the widening is invisible until a document grows
      unchecked for months. That is why GE-127g-2 requires the two counts to MOVE when
      the populations move, and not merely to be stated: a stated count is satisfiable by
      a literal.

  MEASURED IN THIS WORKTREE ON 2026-10-09, WITH METHOD, CARRY THE CONFIDENCE LABELS AND
  DO NOT UPGRADE THEM.
    - READ FROM CONFIGURATION, NOT DISPUTED: the doc-length limit is 300 lines, 400 for
      a decision record, with a blocking severity and a two-entry exclusion list of bare
      filenames.
    - MEASURED, RAW LINE COUNTS WITH NO EXCLUSIONS: 65 documents under docs/agents/cards/
      totalling 11,526 lines in the working tree; 3 of the 65 stand above 300 — 2,809, 639
      and 355 — and the next three stand at 276, 235 and 207. 901 markdown documents under
      docs/ in total.
    - THE SYMPTOM WAS OBSERVED HAPPENING, INDEPENDENTLY, DURING THIS AUTHORING PASS, AND
      IT RECONCILES THE TWO SETS OF FIGURES EXACTLY. This worktree was provisioned fresh
      from origin/main. Before any record here was written, six of the generated cards were
      ALREADY modified in the working tree — timestamps show them all rewritten in the same
      instant, eight minutes before the first file in this subtree was created — and none of
      the added lines belongs to any record authored here. python-coder's card is +287/-3,
      documentation-expert's +15, architecture-diagram-author's +8, test-writer's +8,
      frontend-coder's +4, llm-expert's +4; the added lines are assignment entries for
      unrelated decision-kernel records that accumulated on main. The committed lengths at
      HEAD are 2,525, 340, 635 and 268 — which are precisely the figures the report that
      prompted this record cites. So the earlier-recorded divergence was not a divergence
      at all and no counting-rule explanation is needed: the report states the COMMITTED
      lengths and the measurement above states the WORKING-TREE lengths after a
      regeneration the provisioning step performed. Both are correct and they differ by
      exactly the regeneration.
    - CONSEQUENTLY, THE LIVE ARM IS THE GROWTH ARM AND NOT THE CROSSING ARM. Three cards
      were already over the 300-line limit when committed — 2,525, 635 and 340 — and the
      regeneration left all three longer: 2,809, 639 and 355. Those are three present-tense
      ratchet refusals waiting on the next commit that stages them. The crossing arm is
      prospective rather than live: architecture-diagram-author's card went 268 to 276, still
      under the limit, and the generated roadmap mirror stands at 286. This is the measured
      reason GE-127g-1-i exists and why its growth arm is stated first.
    - ONE FIGURE REMAINS UNRECONCILED AND IS NOT ADOPTED EITHER WAY: the report counts
      eleven cards, three of them over the limit; this worktree holds 65 card documents, three
      of them over the limit. The over-limit count agrees; the population count does not, and
      no explanation for the difference was established. No criterion in this subtree asserts
      a card count or a line count as a fixed fact, and any that did would be at the wrong
      altitude — the population is expected to move, which is the subject of GE-127g-1's
      second arm.
    - NOT MEASURED AND NOT TO BE ASSERTED: how many documents in total would change
      verdict once the declared patterns are pinned. That number cannot exist until
      enrichment pins them.

  WHAT IS LEFT TO ENRICHMENT, FOLLOWING GE-127c's PRECEDENT. The concrete set of declared
  patterns and the exact wording of each stated reason are the IT PO's to pin, exactly as
  GE-127c states the principle and leaves the extension list to enrichment. The criteria
  below fix what must be true of any such set: it is declared rather than built in, each
  entry carries a reason, a new document of an already-declared generated kind joins
  without an edit, the set is reported, and a hand-authored document is still judged.

  ==========================================================================
  DOES THE CARDS ENTRY COME OUT? DECIDED 2026-10-09: NO, IT STAYS. HERE IS WHY.
  ==========================================================================
  AGENT CARDS BECAME STATIC the same day this L1 was approved. The trailing per-agent
  AC-assignment section — 3,787 of 11,526 total card lines, 33%, present in 17 of the
  64 cards — is removed, taking python-coder.card.md from 2,809 lines to 162 and the
  count of cards above the 300-line limit from 3 to ZERO. Every measurement in this
  record that made the cards "the strongest example" is now a statement about the past.
  The honest question is therefore whether the cards entry belongs in a list of
  locations set aside from a standard they no longer breach, and the two answers are
  both reasonable. This block is the decision and the reasoning, recorded here rather
  than left to be rediscovered.

  THE CASE FOR REMOVING IT, STATED AT ITS STRONGEST SO IT IS NOT STRAW. A declaration
  is a claim about what needs an exemption. Three cards above the limit is why anyone
  wrote one; zero cards above the limit means the exemption now protects nothing, and
  an entry that protects nothing is an entry nobody re-examines. This L1's own second
  design question answers "silent or reported?" with "reported", on the specific ground
  that "a silent exclusion makes an over-broad exclusion unfindable" — and an exclusion
  that is not needed at all is the limiting case of over-broad. Keeping it also costs
  something real: the set-aside count GE-127g-2 requires will include 64 documents that
  would pass the standard unaided, so the reported figure overstates how much of the
  project is unjudged.

  THE DECISION: IT STAYS. Three grounds, in order of weight.

    (1) MEMBERSHIP IS BY KIND, AND REMOVING IT WOULD MAKE MEMBERSHIP BY SIZE. This
        L1's criteria say that whether a document is held to the standard "is a stated,
        reviewable property of THE KIND OF DOCUMENT IT IS", and GE-127g-4's second
        clause requires each ground to be the earning PROPERTY and not the name of the
        generator. The ground pinned for the cards in this record's it_requirements is
        "Regenerated whole from templates/agents/ by the build's agent-card phase. No
        human author decides the length of any document here and no hand edit survives
        the next regeneration, so a length refusal names work nobody wrote and
        prescribes a remedy nobody can apply." EVERY WORD OF THAT IS STILL TRUE. Not
        one clause of it mentions size. Dropping the entry because the documents got
        shorter would silently install a second, unstated membership test — current
        length — alongside the stated one, which is precisely the drift this L1 exists
        to end. The exemption is a statement about who can act on a refusal, and nobody
        became able to act on one.

    (2) IT IS THE ONLY DIRECTORY-SHAPED ENTRY, SO REMOVING IT EMPTIES GE-127g-1. The
        other two declared entries, docs/roadmap.md and docs/INDEX.md, are single
        FILES. GE-127g-1's own notes say "THE SECOND ARM IS THE WHOLE RECORD" — the arm
        where a newly generated document joins the set with no edit to the declaration
        — and this record's own design question one names the deciding property as
        "whether adding an agent requires an edit". With the cards gone the declared
        set is two filenames, which is the basename-list mechanism this L1 was written
        to replace, wearing a path. The no-edit property would have no population, the
        general mechanism would be a one-off for two files, and the next generated
        directory to appear would start the discussion over — which is the "third
        discussion" ground this record already rejected once.

    (3) THE REGRESSION IT COVERS IS CHEAP AND THE REGRESSION IT WOULD INVITE IS NOT.
        Keeping the entry costs a line of configuration and an inflated set-aside count.
        Removing it means that the first future card to cross 300 lines — a long agent
        template, a new generated section, a verbose contract table — reinstates the
        unactionable refusal on whoever happens to stage the regeneration, and the fix
        is a fresh round of this same argument. The asymmetry is not close.

  WHAT THE DECISION COSTS, RECORDED SO IT IS NOT DISCOVERED AS A SURPRISE. The cards
  are now a declared set-aside location sitting FAR below its ceiling — 162 lines
  against a bound sized for a different growth story. Two consequences follow and
  neither is fatal. First, GE-127g-2's set-aside count will be dominated by 64
  documents that need no exemption, so a reader using that count as a measure of how
  much of the project is unjudged will overstate it; that is a reporting nuance for
  GE-127g-4's published text to handle, not a reason to shrink the declaration.
  Second, and this is the one to watch, the cards stop being the location that
  EXERCISES the mechanism. Every arm of GE-127g-1 and GE-127g-5 that was going to be
  demonstrated against the real cards directory must now be demonstrated against a
  constructed fixture. Both records already specify fixtures rather than the real tree,
  so nothing breaks — but the mechanism loses its live worked example, and a mechanism
  with no live instance is one nobody notices decaying.

  AND THE PART THAT MUST NOT BE LEFT DANGLING: GE-127g-5's ceiling for the cards —
  report_above_lines: 10000 — was derived from a measured +284-lines-per-regeneration
  growth rate that this change removes entirely. Carrying the number forward with a
  void derivation is exactly the "figure that looks measured, cites a tool, carries a
  date, and is none of those things" failure BP-1500a records against itself. The
  derivation is marked SUPERSEDED on GE-127g-5, with the new measured basis stated and
  the numeric re-derivation handed to the IT PO under that record's own rule that the
  reasoning is the deliverable and the numbers are its output.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's.
