roadmap_phase: phase_3
criteria: |
  PR descriptions assemble themselves from the ticket's acceptance criteria.

  When a change is ready for review, the PR title, summary, and test plan
  are composed from the structured AC data the ticket already carries. The
  title comes from the L1 benefit statement. The summary connects to the
  L0 goal. The test plan is the L2/L3 Gherkin scenarios. Reviewers see
  exactly what the change delivers and how to verify it, without anyone
  writing a description from scratch.
