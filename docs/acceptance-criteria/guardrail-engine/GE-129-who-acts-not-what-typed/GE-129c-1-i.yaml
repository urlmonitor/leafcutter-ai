criteria: |
  Given the commit specialist dispatched by finalize-feature's closure step with no ticket path,
    and a staged change,
  When it reaches its confirmation step,
  Then it does not ask for a person's confirmation, does not return a question status, and does
    not wait for a reply,
    And it either commits the change under the dispatching run's approval, leaving the audit
    record of GE-129c-3, or ends with the failed step of GE-129c-4,
    And it never ends with the change neither committed nor reported as failed.
