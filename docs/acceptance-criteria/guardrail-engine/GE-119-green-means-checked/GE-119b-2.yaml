notes: |
  THE STRUCTURAL AC. The PO's instruction: treat the shared root-walking pattern as ONE
  defect with 18 instances, not 18 defects. GE-112, GE-118a-1 and GE-118b are three prior
  point patches in this same area; a fourth point patch is the failure mode to avoid.

  EVIDENCE LABEL: "18 checks share the _find_project_root / parents[] pattern, many
  explicitly documented fail-open" is OBSERVED. The criteria deliberately say "every check
  registered in the hook manifest" rather than hardcoding 18, because the manifest is the
  authoritative set and the count will move; the 18 figure is the provenance of the finding,
  not the acceptance threshold.

  OPEN FOR THE IT-PO, do not pre-decide: templates/scripts/commit_guardian/_resolve_root.py
  already exists in this family. Determine whether it is (a) the shared facility this AC
  asks for, already present but not universally adopted, or (b) a partial earlier attempt
  that itself has the defect. The two answers imply very different work — adoption sweep
  versus build-then-adopt — and the difference is not visible from the AC store.

  SCOPE: this AC removes the REASON a check cannot run. It says nothing about what a check
  does when it still cannot — that is GE-119a, and GE-119b-1-i pins the seam between them.

  IT-PO ANSWER (2026-08-14): (a) — ADOPTION SWEEP. _resolve_root.py exists and 27 files in
  the family already reference it; 19 files still carry a private root walk, including both
  observed-failing checks. The enumerated un-migrated list is in it_requirements. The
  estimate stays L: 19 files is a large migration even though nothing is being invented.
  The OBSERVED "18 checks" figure measures at 19 files today; the manifest set is 54
  entries. Neither number is an acceptance threshold.
