title: "Failing because the code was missing is recorded as just that, and never proves a test guards code that already exists"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the test writer writes two tests for one piece of work, before any
    code for it exists —
      test A, for a new function summarise_window() that does not exist yet,
      test B, a regression test for the existing function refresh_config(),
        whose bug (it retries on every call during a database outage) the
        work fixes,
  When the writer runs both tests and records its red baseline,
  Then each red baseline entry states which kind of red it is:
      absence — the named thing could not be imported or found, so no code
        under test ran; or
      assertion — the code under test ran and produced the wrong result,
    And test A's absence red is accepted as evidence that summarise_window()
      does not exist yet, and as nothing more,
    And test B counts as red only if its red is assertion-shaped — it reached
      the existing refresh_config() and observed the retry-on-every-call
      result; an absence red for test B (for example a failed import of a
      helper name the writer invented) is not accepted, and the writer rewrites
      test B to reach the existing code before handing on,
    And when any test passes before the work is done because it asserts too
      little, the writer's remedy is a stronger assertion; adding a comment is
      never given as a way to make a passing test fail.
