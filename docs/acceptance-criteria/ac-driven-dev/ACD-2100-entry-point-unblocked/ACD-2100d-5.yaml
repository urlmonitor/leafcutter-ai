notes: |
  PLACEMENT. The run was dispatched with parent_l1_id ACD-1300e. That L1 is full at five L2s
  (cap 5, no override) and its subject is resuming after an answer, not starting a run. The
  defect is the ACD-2100 goal word for word ("Starting new work the proper way always
  succeeds"). Its L1s: ACD-2100a, -b, -c are full at five L2s and every L2 under -b is done
  (a done parent cannot take a todo child); ACD-2100e is documentation-only. ACD-2100d ("the
  installed copy behaves like the one that was fixed") had one free slot and is the closest
  fit: the route a user runs is the INSTALLED command and skill starting the INSTALLED
  workflow, and the two halves fell out of agreement. ACD-2100d's notes warn against
  restating a sibling's behaviour "but in the deployed layout"; this record does not -- its
  subject is agreement between the entry surfaces and the workflow, which no sibling owns.
  ACD-2100d is now at 5/5. If the PO prefers a dedicated L1 (ACD-2100 has two free L1 slots),
  this record and its four L3s can be re-homed as one unit.

  WHY DONE RECORDS DID NOT CATCH THIS. ACD-2100d-1 ("neither run stops at a check performed
  before the first question") and ACD-2100a-5 are done, and their tests start the workflow
  with a hand-built args object that already carries the verdict. That is the false green:
  the evidence never used the arguments the entry surfaces build. ACD-2100d-5-i is the record
  that closes it.

  FIX DIRECTION -- OPEN, FOR THE IT PO AND THE USER AT THE GATE. The criteria hold under both
  directions the KI lists:
    1. restore the permission pre-flight to the command and the skill and pass its verdict; or
    2. stop requiring the verdict when the maker's answer is supplied, since the workspace is
       already made and the workflow no longer runs a workspace-setup step itself.
  BA recommendation: direction 2. The skill's 2026-10-10 rewrite (TICKET-20260928-BO-4300-entry-skills)
  retired the pre-flight on purpose; restoring it re-adds a second argument that can drift
  and a pre-start step that can fail, to guard a step the run no longer performs. Direction 2
  has two consequences the IT PO must carry: (a) ACD-2100b-5's it_requirement that a direct
  invocation with no verdict halts must be narrowed to "with neither the maker's answer nor a
  verdict" (ACD-2100d-5-ii keeps that case halting), and its test
  test_direct_workflow_invocation_with_no_preflight_verdict_halts amended to match; (b) a
  registry that denies shell permission no longer halts at startup when the maker's answer is
  supplied -- the ADR-070 permits_shell lint and the shell-reply decline rule cover that
  instead. Under direction 1, the command's and the skill's text both gain the pre-flight
  step, and ACD-2100d-5-i guards it like any other argument.
