criteria: |
  Given a ticket's source_ac is BO-250a (level: L1)
    and BO-250a.yaml has depends_on: [BO-200, BO-300]
    and BO-200 (level: L0) has title: "Every delivery is all-or-nothing"
    and BO-300 (level: L0) has title: "See what the build produced",
  When the pull-request agent assembles the PR body's Goal line,
  Then the PR body contains TWO goal lines:
    - "**Goal:** [BO-200: Every delivery is all-or-nothing](...)"
    - "**Goal:** [BO-300: See what the build produced](...)"
  And both L0 ACs are listed (none is silently dropped)
  And each goal line links to its respective AC file path.
