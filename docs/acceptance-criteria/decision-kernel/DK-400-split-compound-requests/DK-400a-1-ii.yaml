criteria: |
  Given run A, whose root goal is the reusable-criteria goal turned away by routing
    (trigger jev_none) and offered as a split that the person approves,
  And run B, whose root is the single request "Write release notes for the last ten merged pull
    requests", which no registered capability can meet,
  When both runs have ended and the capability-gap list across runs is read,
  Then run A contributes no capability-gap record,
  And run B contributes one capability-gap record, the same record it would produce today,
  And run A's goal does not appear in the list as a build opportunity.
