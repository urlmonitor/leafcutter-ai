work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a requirement from which buildable work has already been derived once, so its
    deliverable checklist and its grouping ticket already exist,
  When work is derived from the same requirement a second time,
  Then no duplicate deliverable checklist item is created,
  And no duplicate grouping ticket is created,
  And no duplicate sign-off slot is created,
  And the second derivation resolves to the existing work rather than creating a
    second copy of it.
