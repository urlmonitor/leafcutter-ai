criteria: |
  Given the component library catalog file does not exist or contains zero entries,
  When the UX designer agent attempts to compose a prototype,
  Then the agent does not produce any prototype output
  And the agent returns a diagnostic message stating "Component library catalog
    is empty or missing — cannot assemble a prototype without known components"
  And the diagnostic identifies the expected catalog file location
