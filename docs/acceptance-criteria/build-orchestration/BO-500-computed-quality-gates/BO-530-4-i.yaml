id: BO-530-4-i
title: "No frontend files changed -- dev-render smoke check is skipped, not failed"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/build-orchestration/BO-500-computed-quality-gates/BO-530-4.yaml
criteria: |
  Given a ticket whose changed surface contains no frontend files
    (e.g. it changes only Python files, configuration, or documentation),
  When the sign-off gate evaluates whether the dev-render smoke check applies,
  Then the dev-render smoke check is skipped as not-applicable,
  And the skip is recorded as "skipped" (no frontend surface to render),
    not as a pass and not as a failure,
  And the absence of a frontend render does NOT block the sign-off,
  And the sign-off can proceed on its other criteria.
depends_on: [BO-530-4]
