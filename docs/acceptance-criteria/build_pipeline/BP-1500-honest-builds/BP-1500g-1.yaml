    reason: "Added assigned_agent (python-coder), estimated_complexity (L), it_requirements, test_spec, test_rationale and delivers_to. Criteria, title, depends_on and all doc_links UNCHANGED; readiness remains draft. THE SUBSTANTIVE FINDINGS THIS ENRICHMENT ADDS, all re-verified against origin/main 1cce5b48a rather than copied from any record. (1) FIVE readers of `_PRE_CONSOLIDATION_PATHS` exist, not the two named in KI-BP-009: `_cleanup_stale_paths` (the load-bearing one -- unconditional on the default path) and `_run_migration_report`, which prints `rm -rf` instructions naming the adopter's own directory. The latter is named in no prior record. (2) The co-claim overlap is EIGHT of eleven paths, not one: `.claude/agents`, `.claude/skills`, `.claude/commands`, `.claude/hooks`, `.gemini`, `scripts/commit_guardian`, `scripts/doc_compliance`, `scripts/feedback`. `.claude/workflows` is in `shim_map` and absent from the cleanup list -- safe by omission, not by design -- and nothing in the suite asserts any relationship between the two tables. (3) The ownership signal in `_cleanup_stale_paths` today is inverted: a symlink into the output root is taken as proof of package ownership and a REAL DIRECTORY as proof of staleness, which is precisely why the adopter's correct workaround triggers the deletion. (4) LINE NUMBERS ARE DELIBERATELY ABSENT FROM THE it_requirements EXCEPT AS A DATED SNAPSHOT: four different line numbers for this one constant now exist across the store and KI-BP-009, and all four were right about some tree. On origin/main 1cce5b48a the constant is at build.py:1791; in the authoring worktree it is at :1769; KI-BP-009 says :1189. The constant name is stable and the numbers are not."
