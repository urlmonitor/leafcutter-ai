notes: |
  THE RULE, stated once for all three L2s. With the limit at 15, a staged function is
  allowed when

      score <= max(15, its highest score across the parent commits)

  A function with no previous version in any parent is held to 15. "Previous" is the
  committed blob of each parent: HEAD, plus MERGE_HEAD during a merge. The staged
  version (`git show :path`) is judged, never the working tree. There is no stored
  baseline: reducing a function from 30 to 20 and committing it makes 20 its ceiling
  from then on.

  SHAPE. GE-131a-1 is the rule (pure judgement, including fail-closed parsing).
  GE-131a-2 switches it on and proves it refuses through a real commit, including the
  refusal wording. GE-131a-3 is the documentation edit that reference-doc requires.
  Intended as one ticket; target about 11-12 tests in total.

  DEFERRED — named here as follow-ups, deliberately not specified:
    - A renamed or moved function keeping its previous score (body-hash matching).
      Until then a pure move of an over-limit function is judged as new and refused
      unless it is reduced to 15; the refusal tells the author to commit a pure move
      with SKIP=check-complexity. Trigger for the follow-up: the first time a file
      split forced by the file-length check (GE-127) is refused by this one.
    - A "nothing to examine" outcome line when no Python file is staged.
    - Richer refusal text (describe the function, suggest a split), per GE-127e.
    - Distinguishing an unreadable previous version from an absent one.
    - Property getter/setter pairing beyond what qualified name plus position gives.
