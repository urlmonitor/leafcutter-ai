id: BO-2900g-3
components:
  - ac_store
  - build_orchestration
  - testing_quality
title: "One set of words for a required proof, with the reached-the-real-way kind named once"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two independent definitions of how a required proof is described, which
      disagree today:
      one permits a set of kinds that includes an older name for the
        reached-the-real-way proof, and requires the way in to be named only for
        that kind,
      and the other permits a different set of kinds altogether and carries the
        reached-the-real-way name on a separate axis of its own,
  When the two are reconciled into the project's single definition,
  Then exactly one statement of the permitted kinds remains, and every producer
    and every reader of a required-proof description resolves to it,
    And the reached-the-real-way kind is called by the name the test-angle
      taxonomy uses for it,
    And a described proof of that kind is required to name the way in, keeping the
      field the older definition already used for that purpose,
    And the older name for that kind is absent from the permitted kinds, with no
      translation layer that accepts it as a synonym,
    And the kinds one definition permits and the other does not are each either
      carried into the single definition or dropped from it — none is left
      permitted on one side only.
depends_on:
  - BO-2900g
