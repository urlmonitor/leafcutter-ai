id: DK-100b-1-i
title: "Only what you approved, edited or added goes on to research and assessment"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given proposed options opt.kernel_entry_point, opt.consult_precedent, opt.session_records and
    opt.trace_analyzers, and 5 proposed criteria including crit.small_slice,
  When you approve opt.kernel_entry_point, opt.consult_precedent and opt.session_records, reword
    crit.small_slice, and add an option of your own,
  Then research and assessment run on those 3 options plus your added option, which is recorded as
    proposed by you (proposed_by human:user, with an id such as opt.added.1),
  And crit.small_slice is assessed in your wording,
  And opt.trace_analyzers is neither researched nor assessed.
depends_on:
  - DK-100b-1
