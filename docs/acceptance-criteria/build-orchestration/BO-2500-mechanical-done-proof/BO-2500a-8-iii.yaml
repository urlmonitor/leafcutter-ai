notes: |
  Wave 1. Defect 2 of the brief: the waiver is undocumented in the three guides,
  and test_rationale is defined with only one of its two meanings. Per the user's
  scope change 3 (PO gate 2026-10-25) the guides point to TQ-400e-6 and do not
  restate its rules.

  User decision 2026-10-25 (IT PO stage): the account goes into a NEW page,
  docs/reference/test-free-declarations.md; docs/reference/ac-schema.md gets only
  a one-line row linking to it, with no net growth. The IT PO's declared_files
  need the new page added (state to_be_created).

  Boundary with TQ-400e-6. TQ-400e-6's reference entry also lives in
  docs/reference/ac-schema.md, at the test_required / test_rationale rows. This
  record changes the field DEFINITION (what the field means); the exemption RULES
  (when honoured, when refused, who is eligible) stay TQ-400e-6's. If TQ-400e-6 is
  not built when this record is, the link points at the existing rows and the open
  question in the BA report applies.
