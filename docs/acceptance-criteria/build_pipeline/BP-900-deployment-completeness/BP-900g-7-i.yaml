assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  reference_file_path: "scripts/build_referential_integrity.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The classification decision the pass must make per registry field, before any resolution is attempted. Making this an explicit, data-driven decision rather than an implicit regex is what keeps the prose case out of the findings without an allowlist."
    required:
      - field_role
    properties:
      field_role:
        type: string
        description: "Whether a registry field is a DECLARATION (its value names an executable artifact the package advertises as present, and is therefore subject to resolution) or PROSE (free-text description, not subject to resolution even when it contains a token shaped like a file name). The role must be derived from the registry's own structure — which key the value sits under — never from whether the value happens to look like a path."
      finding_kind:
        type: string
        description: "For declarations that fail to resolve, which concern the finding belongs to: 'missing' (exists nowhere — this rule) or 'undeployed' (exists in the package tree, reaches no consumer — the deployment-completeness rules). The two must never be merged into one 'unresolved reference' verdict."
  constraints:
    - "PROSE VS DECLARATION MUST BE STRUCTURAL, NOT LEXICAL. Decide whether a field is subject to resolution from WHERE it sits in the registry (which key), never from whether its value pattern-matches a path. A lexical rule flags description text, the first author to hit that adds a suppression, and suppressions are permanent. BP-900g-4's over-permissive prefix is the in-repo precedent: it accepted any single leading segment, mis-normalised a host-project path into a deploy key, and cost BP-900g-5 an entire clause to undo."
    - "DO NOT MERGE THE TWO CONCERNS INTO ONE VERDICT. 'Exists nowhere' and 'exists but is not deployed' must surface as distinct finding kinds with distinct remedies. This is the more expensive of the two failure modes: an author handed 'unresolved reference' for a never-written artifact edits the deploy map, finds nothing to add, and concludes the guard is noisy."
    - "THE EMPTY-REGISTRY CASE IS A REQUIRED GUARD, NOT AN EDGE CASE TO SKIP. A registry with zero declaration entries must produce zero findings and must not raise. EPIC-BOPhantomDoneRemediation T03 is the precedent: _check_change_target carried an empty-list guard, the identically structured _check_risk_surface did not, and all 22 tests passed because none exercised the empty shape."
    - "FIXTURES MUST BE THE REAL FILES. The four shapes are asserted against config/package_boundary.json and config/test_requirements.schema.json loaded from disk with json.load. A hand-built dict reproduces the author's mental model of the parse shape, which is the bias that hid the files_touched no-op for an entire epic (EPIC-PhantomDoneFilesTouched KI-1) and survived the first remediation spot-check."
    - "NO NEW ENFORCEMENT POINT. This AC refines BP-900g-7's single pass; it must not add a second checker that runs somewhere else. Two passes over the same registries will drift, and the one that is not wired into scripts/build.py will be the one the tests assert on."
    - "Exactly one finding for the four-shape fixture is the assertion, not 'at least one'. A rule that emits the correct finding plus a spurious one has failed this criterion even though the blocking case still blocks."
delivers_to: null
expects_from:
  ac_id: BP-900g-7
  contract: "The universal registry-entry resolution pass and its finding record {registry_file, entry_location, artifact, kind}, reachable from `python scripts/build.py --target-dir <target>`. This AC constrains that same pass's discrimination — the field_role classification that keeps prose out, and the kind value that keeps 'missing' separate from 'undeployed' — and reuses the same entry point rather than introducing another."
test_spec:
  - name: test_bp_900g_7_i_four_entry_shapes_in_one_registry_yield_exactly_one_finding
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: boundary
    description: "One registry file carrying all four shapes at once — resolvable-and-deployed, exists-but-undeployed, exists-nowhere, and a free-text description field containing a token shaped like a file name. Assert EXACTLY one finding (not 'at least one'), that it names the exists-nowhere entry, and that its kind is 'missing'. The discrimination is the assertion; the individual cases are not."
  - name: test_bp_900g_7_i_empty_and_fully_resolving_registries_produce_zero_findings
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: boundary
    description: "The zero/all shapes: a registry with no declaration entries, and a registry every one of whose entries resolves, both yield zero findings and neither raises. The empty case is the EPIC-BOPhantomDoneRemediation T03 shape — an identically structured sibling check that lacked the empty guard passed all 22 of its tests."
  - name: test_bp_900g_7_i_four_shapes_through_the_same_build_subprocess_flag_only_the_missing_one
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier and its paired must-NOT-block control, both through the SAME `python scripts/build.py --target-dir <tmp_target>` subprocess used by BP-900g-7. Against a temp package tree carrying the four-shape registry: exit is non-zero, the output names the exists-nowhere entry, and the output does NOT name the prose token or the undeployed entry. Then remove only the exists-nowhere entry and re-run the same command: exit zero. Calling the checker function directly does not satisfy this."
  - name: test_bp_900g_7_i_prose_vs_declaration_holds_against_the_real_on_disk_registries
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Load config/package_boundary.json and config/test_requirements.schema.json from disk with json.load — no fixture copies, no hand-typed dicts — and assert every description/free-text field in them is classified PROSE and every classification-list entry is classified DECLARATION. The distinction is a property of those files' actual structure, so a hand-built dict tests the author's model of them rather than the files."
test_rationale: |
  This AC is the false-positive and mis-attribution control for BP-900g-7, so the
  tests have to be able to fail in the two directions a resolution rule dies in, and
  a direct-import unit test can only see one of them.

  Too wide. A lexical rule that flags a token in description prose gets suppressed by
  the first author who hits it, and the suppression outlives everyone. Entry 1 puts
  the prose field in the SAME fixture as the three declaration shapes and asserts
  exactly one finding, so a rule that is right about the missing artifact and also
  wrong about the prose still goes red. Entry 4 then re-runs that distinction against
  the real config files, because the prose-vs-declaration boundary is a property of
  their actual key structure — the hand-typed-fixture bias is what hid the
  files_touched parser no-op for a whole epic and survived its first spot-check.

  Under-specified. If 'never written' and 'not deployed' collapse into one verdict,
  every author is sent to the deploy map for a defect no deploy map edit can fix.
  Entry 1 asserts the kind, and entry 3 asserts the undeployed entry is NOT named in
  the build's own failure output.

  Entry 3 also re-charges reachability rather than inheriting it from BP-900g-7. The
  BA's hand-off suggested inheritance; that is declined deliberately. The rule this AC
  refines is a CLASSIFIER, and a classifier can be correct in isolation while the
  build never reaches the branch that consults it — the discrimination has to be
  observable in the build's own exit and output, which is the only thing an author
  ever sees. Entry 2 is the empty/all guard and stays at the unit-of-behaviour level
  because there is nothing to reach when there is nothing to classify.
