assigned_agent: workflow-architect
estimated_complexity: S
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Must handle errors gracefully per the project error handling policy"
  - >-
    Every command in the revised sequence must remain a single, simple command
    per the repository shell convention — no chaining, no `cd`.
  - >-
    The HEAD copy must be written to a temporary file first. A redirect of the
    form `git show HEAD:<path> > <path>` truncates the target before git runs,
    so a failed lookup destroys the very fix the proof exists to protect.
  - >-
    Restoration must be proved by a byte-comparison against the saved copy.
    `git status --porcelain` showing the path as modified only proves the file
    differs from HEAD, which is also true of a partial or corrupted restore.
  - >-
    The two copies must live outside the worktree so they survive a crash mid-proof
    and are never picked up by `git add` or by a pre-commit hook.
