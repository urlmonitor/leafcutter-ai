test_required: true
test_spec:
  - name: test_creation_refuses_when_the_shared_main_line_cannot_be_read
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "With the remote made unreachable in a real fixture repository and local main 39 commits behind, the creation request ends in a refusal and a non-success outcome."
  - name: test_the_local_main_copy_is_not_used_as_a_substitute_starting_point
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "After the refusal, no branch exists that is rooted at the stale local main tip -- the assertion that distinguishes refusing from warning-and-proceeding, which is what the code does today."
  - name: test_the_refusal_states_that_the_shared_main_line_could_not_be_read
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The refusal carries a machine-readable reason identifying an unreadable shared line, distinguishable from any other refusal reason this command can emit."
  - name: test_every_creation_path_refuses_when_the_shared_line_cannot_be_read
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "All three subcommands are exercised under the same unreachable-remote fixture; each refuses. A refusal wired into one path only fails here."
test_rationale: |
  The failure this closes is not a crash but a success: today the tool prints a warning
  and hands over a workspace rooted at a stale local copy. So the decisive assertion is
  not that an error is raised -- it is that no branch rooted at the stale local tip exists
  afterwards. A test asserting only "a warning was printed" or "exit code is non-zero" can
  pass against an implementation that still creates the workspace, which is why the
  negative assertion on the branch list is stated separately.
