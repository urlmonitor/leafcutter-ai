work_status: todo
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a reader tracing how a workflow obtains a recorded fact or carries out a chore,
  When they open the component diagram for dispatch from a workflow,
  Then it shows the workflow body with no direct access to files or commands, the chartered
    executor as the only party that carries out exact commands on the workflow's behalf,
    specialists reached only for judgement, and the agent registry as the source of the
    executor's stated permission,
    And no reporting specialist is shown carrying out an exact command.

  Given the diagram,
  When its parties and connections are compared with the shipped workflows and the agent
    registry,
  Then every party and connection it shows exists there,
    And every exact-command dispatch in the shipped workflows corresponds to a connection the
    diagram shows to the executor.
