notes: |
  WHY (c) STATUS-CHECKER. It is the agent finalize-feature's step 3.5 dispatches for the closure
  commit today (GE-129c). Naming it here pins that the reroute is required, not optional.

  WHY (d) COMMIT-HELPER. A name that merely contains "commit" must not match. An implementation
  that tests "name contains commit" passes (a)-(c) and fails (d).

  THE SECOND SCENARIO. Case (5) of the probe: `--agent commit` gives a top-level session an
  agent_type with no agent_id. This record pins only that the name alone never earns the
  specialist's go-ahead; what does happen (prompt or refusal) is GE-129d-1-ii, not restated.

  Unestablishable identity (agent_id without agent_type, unreadable input, internal failure) is
  GE-129a-2-i. Caller-mintable signals (token, environment, marker files, working directory,
  prompt) are GE-129a-3.

  declares_side_effect: true -- derived from "the commit specialist commits the change".
