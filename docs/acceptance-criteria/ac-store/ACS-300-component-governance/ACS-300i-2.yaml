change_target: code
risk_surface: internal
notes: |
  REOPENED 2026-08-25 (was work_status: done, readiness stays approved — the requirement is
  right, the implementation does not meet it). The criteria say the validator rejects ANY
  entry where exposed_interfaces is absent or null. docs/components.json has 45 entries and
  9 declare the field, so 36 absent entries are currently accepted. Counts verified directly
  against the file, not inferred.

  Same root cause as its sibling ACS-300h-1 and same instance of KI-CG-001: the rejection
  logic exists in check_components_integrity.py but runs only over components present in the
  diff, and the script states that pre-existing drift is accepted. A validator that accepts
  36 violations is not rejecting "any" entry. Close it by backfilling or by narrowing the
  criteria to state the weaker guarantee honestly — not by observing that the hook is quiet.
