id: TQ-200d-1-v
components:
  - testing_quality
title: "The refresh-gate row passes when one of its tagged tests catches the wrong version, and the tagged tests that rightly pass under it do not block"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
