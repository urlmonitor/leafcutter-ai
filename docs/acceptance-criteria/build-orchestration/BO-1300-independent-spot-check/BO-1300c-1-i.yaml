id: BO-1300c-1-i
readiness: approved
priority: high
title: "Reviewer tempted to fall back to running tests must refuse and exercise the feature instead"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300c.yaml"
criteria: |
  Given a spot-check reviewer is unsure how to probe a feature and the easiest path would be
    to run the existing unit test suite and report its result
  When the reviewer decides what to do next
  Then the reviewer does not run the unit test suite as a substitute for exercising the feature
  And the reviewer instead invokes the feature directly to probe the uncovered gap from its
    assigned angle
  And if the reviewer genuinely cannot exercise the feature for its angle, it reports that it
    could not exercise the feature (and why) rather than reporting unit-test output as its result
