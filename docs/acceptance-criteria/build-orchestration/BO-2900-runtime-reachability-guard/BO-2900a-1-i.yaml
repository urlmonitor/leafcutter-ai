  contract: "The reached_through boolean of the observation record, computed as 'the target callable was entered while an entry-point frame was an ancestor on the same call stack during that test's execution' — supplied as one fact, not two."
test_spec:
  - name: test_entering_a_different_action_does_not_make_the_criterion_eligible
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Runs verify_done_eligible over a fixture surface with `report` and `mark-done` actions where the proof invokes main(['report']); asserts eligible is False and the reason states the way in was entered but the code under proof was not reached."
  - name: test_invoking_the_action_under_proof_makes_the_criterion_eligible
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Same fixture with the proof invoking main(['mark-done', ...]); asserts eligible is True, proving the refusal above is about the path taken and not about the surface being entered."
  - name: test_unrelated_extra_invocation_does_not_launder_a_direct_import_proof
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A direct-import proof to which a bare main(['--help']) call is added stays ineligible — the ritual-invocation workaround is closed."
test_rationale: "This AC exists solely to distinguish two implementations that are indistinguishable by inspection and by any unit test of a predicate: 'entry point entered AND target called' versus 'target reached through the entry point'. Only running a real proof whose two facts are true independently — a surface invocation of `report` plus a direct call into the `mark-done` handler — separates them, and only the executing call stack carries the ancestry the distinction needs. A direct-import unit test of the predicate would be handed pre-computed booleans and would pass on the trapped implementation."
