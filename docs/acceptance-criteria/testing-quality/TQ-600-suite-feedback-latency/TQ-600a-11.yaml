  ==========================================================================
  WHY THIS RECORD IS RETIRED (2026-10-09). READ THIS BEFORE ANYTHING BELOW IT.
  ==========================================================================
  Everything from "WHY THIS LEVER IS DIFFERENT" onward was written while this record
  had a subject. It no longer does. Agent cards are becoming STATIC: the trailing
  per-agent AC-assignment section is removed from every card, and with it the
  whole-AC-store walk that produced it. That walk WAS this record — the 2026-10-08
  amendment had already narrowed the whole criterion down to it, and the notes below
  record that only one of its two functions is even reachable in production. Delete
  the walk and the speed claim has nothing to measure, the four-part admission test
  has nothing to admit, and the declared set the seam test requires to be non-empty
  holds only a site that fails part (1) of the test itself.

  THREE THINGS A LATER READER MUST NOT CONCLUDE FROM THIS RETIREMENT.

    - NOT "the C parser was a bad idea". It is 10-13x faster and that measurement
      stands. What changed is that the one place where that speed was both large
      enough to matter and safe enough to take has been removed for unrelated reasons.
    - NOT "nothing was built here". The store's work_status: todo and implemented_by
      [] are stale. scripts/ac_store/yaml_safe_loader.py and five test modules under
      unit_tests/ac_store/ named for this record and its three children all exist on
      origin/main as of 2026-10-09. The final amended_by entry names them and states
      the consequence: two of this record's descriptors cannot survive the deletion of
      _scan_all_ac_assignments and must be retired or re-pointed deliberately.
    - NOT "the negative invariant went with it". The prohibition on the permissive
      parser reaching any BLOCK/PASS decision point, and the DO-NOT-RE-MIGRATE
      instruction behind it, are the most valuable content in this file and they are
      not retired — they are homeless. They need a record under a correctness parent
      rather than under a suite-latency one. That record is deliberately not authored
      here; see the final amended_by entry.

  THE THREE CHILDREN GO WITH IT, each for its own reason, stated on its own record:
  -i covers the fallback branch of an accessor whose only caller is the deleted walk;
  -ii is the evidence that licenses a substitution that is no longer being made; -iii
  exists only to prove -ii's instrument has a needle.

  ==========================================================================
  THE RETIRED TEST CONTRACT (moved here from test_spec, 2026-10-09).
  NONE OF THIS IS WORK WAITING TO BE DONE. DO NOT AUTHOR ANY OF THESE TESTS.
  ==========================================================================
  test_spec is now null and test_required is false. The five descriptors below stood
  in test_spec until this retirement; they are recorded here so the reasoning is not
  lost, and moved OUT of test_spec because that field is a present-tense instruction
  to test-writer and these are a contract against code that no longer exists.

  (1) test_tq600a_11_store_sweep_is_at_least_five_times_faster_than_the_pure_python_parser
      — integration / real_artifact. Timed a full pure-Python sweep against a full
      accessor sweep over the real store, in one process, asserting the RATIO and
      never an absolute second count. Its standing caveat: it measured the PARSER,
      not any entry point, so a green result was never evidence that any gate, hook
      or check got faster.

  (2) test_tq600a_11_the_agent_card_store_walk_beats_a_fifth_of_its_same_sitting_pure_python_baseline
      — integration / real_artifact. THE DESCRIPTOR THAT CANNOT SURVIVE AT ALL: it
      was written against `_scan_all_ac_assignments`, the whole-AC-store walk the
      static-cards change deletes. Ran that walk twice in one process, once as
      shipped and once forced to pure-Python, asserting (a) the accessor arm at most
      one fifth of the forced-pure arm as a ratio, (b) both arms returning EQUAL
      output so the ratio was about the same work, (c) each arm reporting its parsed
      file count, the two equal and equal to the files on disk, so a fast arm that
      parsed nothing failed, and (d) both raw figures printed on failure so a loaded
      host and a walk that left the accessor were distinguishable. The (b)/(c)
      pairing is the reusable part: the cheapest way to make anything look fast is to
      do less work, and an output-equality plus a counted-population assertion is
      what closes that off.

  (3) test_tq600a_11_no_undeclared_call_site_resolves_the_c_backed_parser
      — unit / seam. Derived the set of C-parser call sites mechanically from source,
      counting the inline `getattr(yaml, "CSafeLoader", …)` idiom the same as the
      shared accessor so the seam could not be bypassed by copy-paste, and asserted
      it equalled a small DECLARED set. Also asserted the set was NON-EMPTY, so
      deleting the last adopter failed rather than passing vacuously. Its declared
      set named the two call sites in scripts/generate_agent_cards.py that this
      change removes, so the assertion is false on arrival. The INVERSION is the
      reusable idea: an allowlist of exceptions cannot describe a world where the
      exception is the rule, so assert over the small bounded set, never the large
      growing one.

  (4) test_tq600a_11_the_required_store_validation_gate_rejects_a_record_the_c_parser_accepts
      — integration / discrimination. **THIS IS THE ONE WHOSE SUBJECT OUTLIVES THE
      RETIREMENT, AND IT IS THE REASON THIS BLOCK EXISTS.** It fed the store-wide
      schema validation entry point a record containing a tab character inside a flow
      sequence (`key: [\t]`), asserted that it reported a violation and exited
      non-zero, and IN THE SAME TEST asserted that the accessor parses that identical
      input to `{'key': []}` without raising — proving the divergence is real on this
      install and that the gate sits on the strict side of it. It was required to go
      RED if anyone re-routed that gate onto the accessor, and a version that only
      grepped the source for `yaml.SafeLoader` did not satisfy it.
      FOR WHOEVER HOSTS THE NEGATIVE INVARIANT: this descriptor is the executable
      form of that invariant, and it should be carried into that record rather than
      re-derived. The retirement entry explains why the invariant needs a new home
      under a correctness parent rather than under this suite-latency one. A
      retraction that lives only in prose gets re-litigated; someone will read the
      13x figure and re-route the required gate, and a test that goes red when they
      do is the only durable form of that decision.

  (5) test_tq600a_11_the_accessor_is_reachable_the_way_the_build_reaches_it
      — integration / reachability. Imported and ran the card-generation walk the way
      the build phase reaches it, through the `sys.path` insertion of
