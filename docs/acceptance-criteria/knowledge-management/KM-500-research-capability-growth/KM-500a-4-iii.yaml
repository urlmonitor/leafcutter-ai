it_requirements:
- "Authorization is an explicit per-invocation input naming the provider and the disclosed context it covers. It is never inferred from the presence of credentials, environment variables, a configuration default or an earlier run. No mechanism exists today (no authorization concept in kernel/config.py or the existing evaluation scripts), so this record defines it; the input itself must not contain secrets."
- "The prerequisite check runs before any provider client, secret loader or kernel environment with a Jev factory is composed. Credential presence is checked without constructing a client and without reading the secret value into the report or logs."
- "KernelService.start_run raises ProviderUnavailable when no Jev credential is configured (kernel/service.py _require_jev). The runner must decide not_run before reaching that call, and must also map a ProviderUnavailable that escapes to not_run with the named actor, never to failed or to a crash."
- "Unmet prerequisites are reported with stable strings per actor ('provider authorization missing', 'Jev credentials missing'), at case level and at run level. Score fields (quality figure, pass rate, threshold verdict) are absent from the real-model portion, not null-as-zero and not 0%."
- "No fallback: a real-model case whose provider is unavailable is never executed with a scripted provider in its place. Scripted cases in the same invocation run normally under the scripted label with their own denominators."
- "Disclosure: an unauthorized invocation sends no case text, repository content or holdout content to any external service. A missing-authorization not_run must leave zero provider calls observable to the test (call counter on the provider seam), not merely zero calls reported."
test_required: true
test_intent:
- clause: "every real-model case is reported not_run with the unmet prerequisite \"provider authorization missing\""
  needs_test: true
  reason: The prerequisite outcome is computed per case and a wrong check would score unauthorized cases.
- clause: "no provider client is set up and zero provider calls are made"
  needs_test: true
  reason: Setting up the client before the check would disclose context without authorization, which only an observed call count can catch.
- clause: "the real-model portion of the report has no quality figure, pass rate or threshold verdict: those fields are absent, never 0% and never 100%"
  needs_test: true
  reason: A defaulted 0% or 100% would read as a measured result, and only a serialization check catches it.
- clause: "the run-level verdict is not_run, which a reader of the report cannot confuse with failed"
  needs_test: true
  reason: The run-level verdict is derived from the case outcomes and could collapse into failed.
- clause: "every real-model case that needs Jev is reported not_run with the unmet prerequisite \"Jev credentials missing\", naming the actor"
  needs_test: true
  reason: The credentials path differs from the authorization path and today surfaces as ProviderUnavailable from start_run.
- clause: "no case is retried with a scripted Jev in place of the real one"
  needs_test: true
  reason: A silent scripted fallback would turn a credentials gap into an apparent real-model pass.
- clause: "the 12 scripted cases execute and are labelled scripted, the 40 real-model cases are not_run, and the two groups have separate denominators"
  needs_test: true
  reason: Mixed invocations split into two denominators, which is computed behaviour a merge bug would change.
test_spec:
- name: test_missing_authorization_reports_every_real_case_not_run_with_prerequisite
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: Ask for 40 real-model cases with no authorization input and with real credentials present in the environment; every case is not_run with the unmet prerequisite "provider authorization missing", so presence of credentials is never read as authorization.
  proves_clause: every real-model case is reported not_run with the unmet prerequisite "provider authorization missing"
  code_file: integrations/kernel_path_prerequisites.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - a missing authorization producing a score
    - authorization inferred from the presence of credentials or an environment variable
- name: test_unauthorized_run_makes_zero_provider_calls_and_builds_no_client
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: Count calls on the provider seam and on the client and secret-loader factories; with no authorization all counters stay 0 before any kernel environment with a Jev factory is composed, and KernelService.start_run is never reached.
  proves_clause: no provider client is set up and zero provider calls are made
  code_file: integrations/kernel_path_prerequisites.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - the Jev client constructed before the authorization check, disclosing context
    - a case text sent to the provider before the check
- name: test_not_run_real_portion_serializes_without_score_fields
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: Serialize the not_run report to JSON and assert the real-model portion has no quality_figure, pass_rate or threshold_verdict key, and no 0 or 100 percent value stands in for one.
  proves_clause: 'the real-model portion of the report has no quality figure, pass rate or threshold verdict: those fields are absent, never 0% and never 100%'
  code_file: integrations/kernel_path_evaluation.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - pass_rate defaulted to 0 or null-as-zero in a not_run report
    - a vacuous 100 percent pass rate over an empty executed set
- name: test_run_verdict_is_not_run_not_failed
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: criterion
  description: The run-level verdict of an unauthorized real-model run is exactly not_run and differs from failed; the exit status and report text cannot be read as failed.
  proves_clause: the run-level verdict is not_run, which a reader of the report cannot confuse with failed
  code_file: integrations/kernel_path_evaluation.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
- name: test_missing_jev_credentials_names_actor_and_maps_provider_unavailable
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: criterion
  description: With authorization granted but no Jev credential, every Jev-needing real case is not_run with "Jev credentials missing" naming actor jev. A ProviderUnavailable raised by KernelService.start_run, which _require_jev raises, is also mapped to not_run and never to failed or a crash.
  proves_clause: every real-model case that needs Jev is reported not_run with the unmet prerequisite "Jev credentials missing", naming the actor
  code_file: integrations/kernel_path_prerequisites.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
- name: test_no_scripted_jev_fallback_for_a_real_case
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: With Jev credentials missing, a scripted Jev double bound in the same invocation records zero calls from real-model cases; those cases stay not_run.
  proves_clause: no case is retried with a scripted Jev in place of the real one
  code_file: integrations/kernel_path_evaluation.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - a real-model case silently retried with a scripted Jev and reported as a pass
- name: test_mixed_invocation_runs_scripted_cases_and_splits_denominators
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: One invocation asks for 12 scripted and 40 real-model cases without authorization; the 12 execute under the scripted label, the 40 are not_run, and the two groups have separate denominators that are not summed.
  proves_clause: the 12 scripted cases execute and are labelled scripted, the 40 real-model cases are not_run, and the two groups have separate denominators
  code_file: integrations/kernel_path_evaluation.py
  to_be_created: true
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - the 12 scripted and 40 real cases merged into one denominator of 52
    - scripted cases skipped because real cases are not_run
- name: test_unauthorized_run_is_reachable_from_knowledge_cli_with_no_credentials
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Run the sibling kernel-path command of integrations/knowledge_cli.py as a subprocess with real-model cases, no authorization argument and a cleared environment, and assert a not_run JSON report with the unmet prerequisite string and no score fields.
  proves_clause: every real-model case is reported not_run with the unmet prerequisite "provider authorization missing"
  code_file: integrations/knowledge_cli.py
