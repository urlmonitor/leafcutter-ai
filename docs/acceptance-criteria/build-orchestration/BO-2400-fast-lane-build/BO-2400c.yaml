    date: "2026-08-18"
    reason: "Honest-promise correction. This L1 claimed a cost saving that nothing in the product measures: the lane orders a stable prefix in the HOPE that a cache anchors, and there is no observation anywhere that one ever did. Its L2 BO-2400c-2 tried to close that with configuration ('set the cache TTL to one hour') for a knob leafcutter does not own — verified 2026-08-18 that the string cache_control appears nowhere in scripts/, templates/ or config/; the 'cache breakpoint' is a literal <!-- CACHE_BREAKPOINT --> HTML comment inside a prompt string, a textual convention, not a provider cache-control block. leafcutter never issues the model API call (the workflow engine's agent() does; we hand it plain prompt text), so a TTL setting here would be a config value nothing reads — a new phantom-done. BrainCandy's decision: re-spec BO-2400c-2 and BO-2400c-2-i as MEASUREMENT rather than configuration. This L1 is amended to state what is actually owned and observable, so the L2s have an honest parent to hang off."
