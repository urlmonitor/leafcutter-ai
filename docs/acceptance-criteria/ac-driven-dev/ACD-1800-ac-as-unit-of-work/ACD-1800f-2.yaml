it_requirements:
  - "Add ONE new optional AC field, `observation_proofs`: absent/null when nothing is authored, otherwise a list with minItems 1. Each item carries exactly the four keys the consuming craft already reads -- `surface`, `fixture_input`, `assertion`, `placeholder_signature` -- so migrating a hand-typed stanza is a copy, not a translation."
  - "`placeholder_signature` IS REQUIRED ON EVERY PROOF, not optional. templates/agents/user-surface-smoker.md Step 4.2 currently checks it '(if present)', and that optionality is the placebo hole: without it a smoke check degenerates into an exit-code check that passes on an unimplemented stub. Enforce presence and non-emptiness at authoring time in the schema and in both commit-guardian validators."
  - "`surface` is per-proof, never on the declaration. Its value set is the one the craft already understands: slash_command, pre_commit_hook, agent_orchestrated, cron. This is what lets one requirement carry several proofs against different surfaces (third Then clause), and it is where the legacy `user_facing_surface` value is derived from."
  - "THE STORE IS THE SOURCE; ANY TICKET COPY IS DERIVED. Expose a resolver from canonical source under scripts/ac_store/ that returns the ordered proof list for a work item given only AC ids -- no ticket path argument, no ticket read. The fourth Then clause is unsatisfiable by any design whose only reader path goes through a ticket body, and ACD-1800f-4's grain-invariance clause depends on this resolver existing."
  - "During the ADR-026 dual-write window the generator MAY additionally render the resolved proofs into the ticket body's `## Smoke Fixture` block so the unmodified craft keeps working. If it does, the block must be marked generated and must be re-derived from the store on every generation -- never hand-edited, never the source. scripts/ac_store/generate_ticket_from_ac.py contains ZERO occurrences of 'Smoke Fixture' today, so this is a new emitter, not a repoint."
  - "MIXED SURFACE -- FLAGGED, NOT SILENTLY ABSORBED (S2.8 partial flag). The Python-side portion of this work (schema slot, validators, resolver, generator emitter) is python-coder's. Repointing templates/agents/user-surface-smoker.md to take its stanzas from the resolver instead of the ticket body is a `.md` agent-template edit that python-coder and pytest cannot act on; it needs an llm-expert pass. Do not let the Python half be signed off as if the craft had been repointed -- see the caveat in notes."
  - "Land the field OPTIONAL and additive; absence is legacy mode -- derive nothing, never fail (ADR-026 rules 1 and 4). ACD-1800f-1's declaration slot is a hard prerequisite because additionalProperties:false is enforced today."
  - "Mirror the shape validation into scripts/commit_guardian/check_ac_schema.py, its manual fallback scripts/commit_guardian/_ac_schema_validators.py, and scripts/ac_store/validate_ac_schema.py. A rule added only to the JSON schema is a no-op on the branch that actually gates a commit when jsonschema is unavailable."
  - "Canonical source only (config/ac_store_schema.json, scripts/ac_store/, scripts/commit_guardian/); never a deployed .claude/ copy or the workspace-parent build-output mirror (ADR-001). Any new module imported by a hook must be added to build_ac_store's deploy_map (scripts/build_phases.py ~794) in the same change."
delivers_to:
  agent: python-coder
  contract: "AC-record field `observation_proofs: null | [{surface: 'slash_command'|'pre_commit_hook'|'agent_orchestrated'|'cron', fixture_input: str, assertion: str, placeholder_signature: str}, ...]` (minItems 1 when present; all four keys required), plus a store-only resolver exported from scripts/ac_store/ with signature `resolve_observation_proofs(ac_ids: list[str], *, ac_root) -> list[{ac_id: str, proof_index: int, surface: str, fixture_input: str, assertion: str, placeholder_signature: str}]` that takes no ticket path. Consumed by ACD-1800f-3 (the unproven verdict and the proofs-executed count), ACD-1800f-4 (bundle union, isolation and attribution) and by templates/agents/user-surface-smoker.md once repointed."
expects_from:
  ac_id: ACD-1800f-1
  contract: "The `observable_effect` declaration slot and its accessors. A requirement that carries observation_proofs must also declare observable_effect; the pairing rule (declared-with-no-proof) is ACD-1800f-3's verdict, not a validation error here."
test_spec:
  - name: test_requirement_carrying_two_proofs_validates_and_both_are_resolvable
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Writes a real AC record with two observation_proofs entries against different surfaces, runs the real store validator (exit 0), then calls the resolver with only the AC id and asserts it returns both proofs in authored order with their four keys intact. Multiplicity is asserted at the resolver, because a single-proof design silently drops stanzas from any migrated multi-stanza ticket."
  - name: test_proof_missing_placeholder_signature_is_rejected_at_all_three_enforcement_points
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A proof carrying surface, fixture_input and assertion but no placeholder_signature is rejected by scripts/ac_store/validate_ac_schema.py, by check_ac_schema.py, and by check_ac_schema.py with jsonschema forced unavailable so the manual fallback branch runs. The three-of-four migration is the failure mode that silently weakens every proof in the store."
  - name: test_proofs_resolve_from_the_store_with_no_ticket_in_existence
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Resolves the proofs for an AC in a temp store where no ticket file exists anywhere on disk, and asserts the full proof set comes back. This is the fourth Then clause, and it is the assertion no ticket-body implementation can pass."
  - name: test_generated_ticket_block_is_rederived_from_the_store_not_preserved
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Generates a ticket for an AC with two proofs, edits the rendered ## Smoke Fixture block by hand, regenerates, and asserts the block matches the store again -- the dual-write copy is derived and cannot become a second source."
  - name: test_empty_proof_list_is_rejected_so_absence_is_the_only_no_proof_state
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "observation_proofs: [] fails validation; the declared-but-unproven case is expressed by absence and adjudicated by ACD-1800f-3, never by an empty list that a downstream loop would read as satisfied."
test_rationale: "The format this AC gives an AC-side home has never had a producer -- generate_ticket_from_ac.py contains zero occurrences of 'Smoke Fixture' -- so the tempting shape of test is 'the field parses'. A parsed stanza that nothing runs is exactly the state the ticket-body block is in today, which is why every descriptor here drives the real validator or the real resolver over a real on-disk record. The no-ticket-on-disk descriptor is the decisive one: it is the only assertion that distinguishes a store-sourced proof from a ticket-sourced one, and it is what ACD-1800f-4's grain-invariance clause rests on. Execution of the resolved proofs is deliberately covered by ACD-1800f-3 and ACD-1800f-4 rather than restated here."
