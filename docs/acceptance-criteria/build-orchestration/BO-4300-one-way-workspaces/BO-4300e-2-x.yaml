risk_surface: safety
criteria: |
  Given a project "shop" whose landing place holds two leftovers of the
    feature work "invoice-export":
    in one run, the leftover of a clearing of "feature/invoice-export" that
    stopped part-way after 10 of its items were deleted,
    and in a second run, the folder "feature/invoice-export" whose workspace
    record still says it is ready but part of whose repository has been
    deleted, so that the repository's history can no longer be read,
  When, in each run, the workspace for "invoice-export" is asked for, and then
    the workspace maker is asked where the workspace for "invoice-export" is,
  Then the request for the workspace is not answered ready with the leftover
    folder, and its answer states that an earlier clearing of that workspace
    stopped part-way and that asking to clear it again finishes it,
  And the question where the workspace is is not answered with the leftover as
    a ready workspace, and its answer states that the workspace is half-cleared,
  And the leftover folder is identical before and after both requests,
  And neither request fetches from or pushes to shop's shared project.
depends_on: [BO-4300e-2, BO-4300e-2-ix, BO-4300e-2-xi, BO-4300e-1]
