id: UXP-591-2-iv
title: "An old /flows?flow=... link without &step= redirects permanently to the flow's canonical address"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given an old link in the /flows?flow= form that names a flow but no step,
    /flows?flow=leafcutter%2Fflow-render-pipeline,
  When a person follows it,
  Then the Atlas answers with a permanent redirect (308) whose location is
    /flows/leafcutter/flow-render-pipeline, with the '/' in the flow id literal and no ?step=,
  And the page then opens leafcutter/flow-render-pipeline with no drawer open and no
    'Step not found' notice, with Source Real, Kind Data and Realization All and a breadcrumb
    showing only "How a flow renders in the Atlas", exactly as the canonical address does when
    opened directly,
  And the tab's history holds /flows/leafcutter/flow-render-pipeline and not the old
    /flows?flow= address, so Back does not return to it.
depends_on:
  - UXP-591-2
  - UXP-591-2-iii
