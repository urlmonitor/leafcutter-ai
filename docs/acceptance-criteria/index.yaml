# docs/acceptance-criteria/index.yaml
#
# Component registry for the AC store.
# Each entry declares one component namespace for acceptance criteria.
#
# Fields:
#   id          — machine-readable identifier (kebab-case, unique)
#   prefix      — short ALL-CAPS prefix used in AC file names (e.g. FIN-001.yaml)
#   description — human-readable description of what this component's ACs cover
#   owner       — component owner identifier; null means ownership is unassigned
#
# Add a new entry for each component that has its own AC namespace.
# Run check_ac_schema.py (installed by build.py) to validate this file.

components:
  - id: finalize
    prefix: FIN
    description: "ACs for the finalize-feature workflow"
    owner: build_pipeline
  - id: ticket-creation
    prefix: TKT
    description: "ACs for the ticket-creation pipeline (v1 and v2)"
    owner: build_pipeline
  - id: build-pipeline
    prefix: BP
    description: "ACs for the build system: phase orchestration, artifact wiring, drift detection, and config-driven path resolution"
    owner: build_pipeline
    directory_patterns:
      - "scripts/build*.py"
      - "scripts/build_phases.py"
      - "scripts/build_precommit.py"
      - "leafcutter/scripts/build*.py"
  - id: build-orchestration
    prefix: BO
    description: "ACs for build orchestration: pre-dispatch sequencing gates, dependency-cycle detection, parallelism limits, file-conflict isolation, and pre-drive reachability checks (e.g. telemetry sink)"
    owner: build_pipeline
    directory_patterns:
      - "templates/workflows/build-feature.md"
      - "templates/workflows-js/build-epic.js"
  - id: infrastructure
    prefix: INF
    description: "ACs for cross-cutting infrastructure: agent context injection, pre-commit hooks, and project conventions"
    owner: null
  - id: ux-prototyping
    prefix: UXP
    description: "ACs for the UX prototyping agent: component-aware static mockups, user validation gates, and design-to-implementation handoff"
    owner: null
  - id: persona-management
    prefix: PER
    description: "ACs for persona definitions, AC targeting by persona, and persona knowledge graph queries"
    owner: null
  - id: ac-store
    prefix: ACS
    description: "ACs for the acceptance-criteria store: schema governance, ID format, bidirectional traceability, pattern reuse, and component registry integrity"
    owner: null
    directory_patterns:
      - "docs/acceptance-criteria/**/*.yaml"
      - "scripts/ac_store/*.py"
      - "config/ac_store_schema.json"
  - id: guardrail-engine
    prefix: GE
    description: "ACs for code quality guardrails: duplicate detection, coverage gating, complexity enforcement, and change-driven quality gates"
    owner: null
    directory_patterns:
      - "scripts/commit_guardian/check_*.py"
      - "templates/commit-guardian/check_*.py"
  - id: knowledge-management
    prefix: KM
    description: "ACs for the cross-surface knowledge graph: surface ingestion from paths.json, node/edge derivation, AC-to-code traceability, query layer, and graph visualisation"
    owner: null
    directory_patterns:
      - "scripts/knowledge_query.py"
      - "scripts/visualise_knowledge_graph.py"
      - "config/paths.json"
  - id: testing-quality
    prefix: TQ
    description: "ACs for test-suite trustworthiness: which tests gate main, how unbuilt/in-flight features are tolerated, accepted-failure tracking, and staged enforcement rollout"
    owner: null
    directory_patterns:
      - "conftest.py"
      - "tests/conftest.py"
      - "unit_tests/conftest.py"
  - id: stakeholder-delivery
    prefix: SD
    description: "ACs for stakeholder-facing delivery of product value: the presentation-agent that renders the Product Owner's approved value propositions into self-contained HTML decks (now) and tailored stakeholder emails (later). A delivery/communication agent class with a stakeholder audience, distinct from the engineer-facing documentation-expert."
    owner: null

# Composite Pattern AC Example (AC ACS-500e-1)
#
# Atomic pattern ACs define a single reusable behavior. A composite pattern AC
# wires multiple atomic patterns together using the depends_on field.
#
# Atomic pattern ACs (PTN-010, PTN-011, PTN-012 — stored in the pattern-owning component folder):
#
#   id: PTN-010
#   title: "Sortable table — column sorting behavior"
#   component: ac-store
#   level: L2
#   status: active
#   pattern_slots:
#     - "{columns}"
#     - "{default_sort_column}"
#   criteria: |
#     Given a page contains a table with sortable columns {columns},
#     When the user clicks a column header,
#     Then the table rows are sorted by that column,
#     And clicking the same header again toggles between ascending and descending order,
#     And the table is initially sorted by {default_sort_column} ascending.
#
#   id: PTN-011
#   title: "Filter bar — text and dropdown filter behavior"
#   component: ac-store
#   level: L2
#   status: active
#   pattern_slots:
#     - "{text_filter_field}"
#     - "{dropdown_filter_fields}"
#   criteria: |
#     Given a page contains a filter bar with a text input for {text_filter_field}
#       and dropdown filters for {dropdown_filter_fields},
#     When the user enters text in the text input or selects a dropdown option,
#     Then the table rows are filtered to only show matching results,
#     And clearing the filter input restores all rows.
#
#   id: PTN-012
#   title: "Paginated collection — page-size selection and navigation"
#   component: ac-store
#   level: L2
#   status: active
#   pattern_slots:
#     - "{default_page_size}"
#     - "{page_size_options}"
#   criteria: |
#     Given a page displays a collection with page-size control offering {page_size_options},
#     When the page loads,
#     Then the collection shows at most {default_page_size} rows,
#     And the user can navigate forward and backward through pages,
#     And changing the page-size selector resets to page 1.
#
# Composite pattern AC (PTN-020 — depends on PTN-010, PTN-011, PTN-012):
#
#   id: PTN-020
#   title: "CRUD list page — wiring between sort, filter, and pagination"
#   component: ac-store
#   level: L2
#   status: active
#   depends_on:
#     - PTN-010
#     - PTN-011
#     - PTN-012
#   criteria: |
#     Given a page implements PTN-010 (sortable table), PTN-011 (filter bar),
#       and PTN-012 (paginated collection),
#     When the user changes a filter,
#     Then pagination resets to page 1,
#     And when the user changes the sort column,
#     Then the current filter state is preserved,
#     And when the user changes the page,
#     Then the current sort column and filter state are preserved.
#
# A consuming page AC referencing the composite pattern:
#
#   id: ACS-500e-2
#   title: "Invoice list page uses crud-list-page composite pattern"
#   component: ac-store
#   level: L2
#   status: active
#   implements_pattern: PTN-020
#   pattern_bindings:
#     columns: "invoice_number, date, amount, status"
#     default_sort_column: "date"
#     text_filter_field: "invoice_number"
#     dropdown_filter_fields: "status, date_range"
#     default_page_size: 25
#     page_size_options: [10, 25, 50, 100]
#   criteria: "No page-specific wiring behavior — all behavior inherited from composite pattern PTN-020."
#
# Key design invariants (ACS-500e-1):
#
#   1. Atomic patterns (PTN-010 through PTN-012) define isolated behaviors with
#      no depends_on between them — they are independent reusable units.
#   2. The composite pattern (PTN-020) uses depends_on to declare which atomic
#      patterns it wires together. Its criteria describes ONLY the inter-pattern
#      wiring behavior (e.g. "filter changes reset pagination") — not the atomic
#      behaviors already defined by PTN-010, PTN-011, and PTN-012.
#   3. PTN-020 is itself a reusable pattern: consuming page ACs reference it via
#      implements_pattern: "PTN-020" exactly as they would reference an atomic pattern.
#   4. depends_on on a pattern AC is purely declarative (documentation of
#      composition intent). No runtime resolution is required for the AC store to
#      remain valid — a validator may warn when a depends_on target is absent but
#      MUST NOT block commits for missing patterns.

# Pattern AC Placement Convention (AC ACS-500a-2)
#
# Pattern ACs follow the SAME file-placement convention as all other AC YAML files:
#
#   docs/acceptance-criteria/<component>/<feature-folder>/<id>.yaml
#
# No separate "pattern catalog" directory or registry file is created.
# A pattern AC is stored in the same component folder as the consuming ACs
# that reference it. It uses the same `component` field as those consuming ACs.
# It appears in the parent AC's `covered_by` list just like any other child AC.
#
# Example placement (component: ac-store, feature-folder: ACS-500-pattern-reuse):
#   docs/acceptance-criteria/ac-store/ACS-500-pattern-reuse/ACS-500a-1.yaml  (pattern)
#   docs/acceptance-criteria/ac-store/ACS-500-pattern-reuse/ACS-500a-2.yaml  (consuming)
#
# Pattern AC example — demonstrates the pattern_slots / implements_pattern / pattern_bindings fields.
#
# Pattern AC (ACS-500a-1, stored in docs/acceptance-criteria/ac-store/ACS-500-pattern-reuse/):
#
#   id: ACS-500a-1
#   title: "Sortable table shared behavior pattern"
#   component: ac-store
#   level: L2
#   status: active
#   pattern_slots:
#     - "{columns}"
#     - "{default_sort}"
#   criteria: |
#     Given a page contains a sortable table with columns {columns},
#     When the user loads the page,
#     Then the table is sorted by {default_sort} ascending by default,
#     And each column header is clickable to toggle sort direction.
#
# Consuming AC (ACS-500a-2, stored in the same folder):
#
#   id: ACS-500a-2
#   title: "Invoice list page uses sortable table pattern"
#   component: ac-store
#   level: L2
#   status: active
#   implements_pattern: ACS-500a-1
#   pattern_bindings:
#     columns: "invoice_number, date, amount, status"
#     default_sort: "date"
#   criteria: |
#     Given the Invoice List page is open,
#     When the user loads the page,
#     Then the table is sorted by date ascending by default,
#     And each column header (invoice_number, date, amount, status) is clickable
#       to toggle sort direction.
