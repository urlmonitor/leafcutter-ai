title: "Non-agent files are not inspected by the consistency guard"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a commit that stages files which are not agent definitions (for example
    a source-code file or a documentation page) alongside no agent definitions,
  And one of those staged files happens to contain the words that name the
    verification setting or the edit abilities,
  When the commit is attempted,
  Then the consistency guard does not inspect those non-agent files,
  And it raises no objection based on their contents,
  And the commit proceeds as far as this guard is concerned.
