notes: |
  THE RUNNER'S RULE — ONE RUNNER FOR EVERY ROUTE. The routes (TQ-500g-1-v, -vi,
  -vii) only call it. No route may carry a copy of this rule.

  WHY T2 SURVIVES ALTHOUGH T1 CAUGHT IT (the non-obvious clause). must_catch is
  declared on a test's own entry, as "wrong versions THIS test must catch". A
  group verdict ("some test noticed") is exactly the collapse TQ-500c exists to
  prevent: KI-TQ-010's inert fourth sibling would pass it. The per-test,
  per-wrong-version outcome record itself is TQ-500c's rule and is not
  re-specified here.

  "THE FIX UNDONE" IS HELD TO A GROUP RULE, NAMED WRONG VERSIONS TO A PER-TEST
  RULE. It is added by the L1 whether or not any entry names it, so no single
  test is answerable for it unless its own entry names it (T1 here, as
  "revert the fix"). BA ASSUMPTION: "revert the fix" in must_catch means "the
  fix undone" and is not prepared a second time; IT-PO to confirm the
  spelling-equivalence rule (exact string, or a fixed list of aliases).

  "PASSED ON THE CODE AS WRITTEN" is the control: a test that fails on the
  finished code catches nothing, and the route's green check should already
  have stopped the work before the runs.

  NEW FILE CASE (for IT-PO): when the work created the file, "the fix undone"
  is the file absent, which is an absence red (TQ-500f-3-i) and would be
  handled by TQ-500g-1-ii as "did not load". Decide whether "the fix undone"
  is then not applicable for that file; the BA did not decide this.

  TESTABILITY: behavioural. A temp git repo with a real refresh module, real
  T1 to T4 test files, a temp AC store carrying the must_catch entries, and a
  real pytest run through the runner's production CLI. Assert on the verdict
  and on the byte-identity of the file afterwards.
