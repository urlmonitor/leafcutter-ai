    ruleset or the notices; declare a fix only when the change touches a test in the
    notice's failing set or the code it exercises; the owner-only break-glass of
    TQ-600a-13-xvii; every other failing check handled as before) is written once — in
    the building-epics skill as the canonical home — and the other runbooks point to it,
    so the five cannot drift. The check is recognised by its exact name `Post-merge suite
    status`.
  - >-
    WHY THE DEMONSTRATION IS A SCENARIO, NOT A SEARCH. A runbook that contains the right
    sentence and still debugs its own diff is the failure mode; the evidence is the
    decision reached on a recorded state, not the presence of text.
  - >-
    MEMORY CONTEXT: this repository has recorded finalize workflows false-halting on red
    checks, and agents taking `SKIP=` on gates; both are the behaviour this record
    prevents for this check.
