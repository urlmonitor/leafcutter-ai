  - path: docs/known-issues/ac-store/open-high-ki-acs-002.md
    relationship: related
    status: exists
    relevance: >-
      The doc_links derivation is wrong in both directions; a 'modifies' link outside the
      declared list is either a stale link or a file missing from the list, and only the
      author can say which.
  - path: docs/reference/ac-schema.md
    relationship: describes
