notes: |
  Split out of INF-500d-4 by the IT PO, 2026-10-09, because the prompt surfaces
  are a separate agent boundary (llm-expert owns templates/agents and skills). The
  criteria restate INF-500d-4's first and fourth scenarios for the case where the
  agent follows its shipped instructions, which is how most reports are actually
  filed. Without this record the code fix could be fully correct and still be
  bypassed by an explicit workspace-relative override that the instructions tell
  the agent to pass.
