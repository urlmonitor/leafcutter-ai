id: GE-130f-1
title: The documentation guard is seen to stop an edit it exists to stop, through the way a session invokes
  it, in whichever project it is installed in
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the documentation guard's declared known-bad input, in the declaration form GE-120f-1
    defines: an edit made with the editing tools to a code file in a folder of the project the
    guard is installed in, where an architecture document of a level the guard blocks for
    describes that folder, with no documentation override in effect,
  And its declared acceptable input: the same kind of edit to a code file in a folder that no
    architecture document describes,
  When both inputs are put through the entry point a Claude Code session invokes the guard by,
    from a separate working copy in the way GE-120c-1's harness runs checks,
  Then the known-bad edit is not carried out, and the refusal names the file and the
    architecture document that describes its folder,
  And the acceptable edit is carried out with no refusal, in the same run,
  And the guard's liveness record, as GE-120f-1 defines it, says the rejection was observed,
  And given the guard is installed in a second project whose code folders and architecture
    documents are laid out differently from this repository's, with nothing else changed,
  When the equivalent known-bad edit in that project is put through the same entry point,
  Then that edit is not carried out either, so the folders the guard watches come from the
    project it is installed in and not from a list naming one project's folders.
depends_on:
- GE-130f
