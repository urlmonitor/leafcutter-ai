assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  The post-coder placement must hold against the LAST coder when several coders are present
  (python-coder, sql-coder, frontend-coder). A placement that only clears the first coder
  would let docs be written before another coder finishes — assert against the maximum
  coder index.
