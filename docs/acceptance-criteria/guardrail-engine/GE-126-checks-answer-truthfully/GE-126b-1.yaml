it_requirements:
  - "The statement obligation must hold structurally rather than by inspection: there must be no return, raise-to-exit, or sys.exit path out of the check's entry point that a caller can reach without the statement having been emitted. Adding a second diagnostic elsewhere does not satisfy this, and the L1 says so."
  - "Every assertion must be made against the copy the build deploys under .leafcutter/. The pair recorded on 2026-08-25 was produced with the deployed copy and the reproduction must use the same one (ADR-001, ADR-013)."
  - "Coverage must reach the check through its process entry point. The existing check_ac_governance test module calls internal functions directly by design; that seam cannot observe an exit path and must not be reused for this criterion."
  - "The two runs must differ in exactly one variable - the working directory. Any second difference between them makes the comparison uninterpretable, which is precisely why the recorded 2026-08-25 pair was believed."
  - "The no-store run must announce and must not block. This check ships to consumer repositories that have no acceptance-criterion store; blocking there would make this repair worse than the defect. Visibility is the unit of the rule and the fail-open convention (GE-116a-1-iii) is not repealed."
  - "The examined count must be produced from the collection the check actually iterated, not from a separately computed figure. A count derived independently of the inspection is a second unverified claim, which is the defect this record closes arriving one layer up."
  - "Must add no measurable latency to a commit-time run; the statement is emitted on every invocation including the empty-scope one that most commits produce."
  - "Error handling must follow the four rules in CLAUDE.md. If the check fails internally it must still have stated what it examined before it fails open, or the fail-open path becomes a new silent exit."
test_spec:
  - name: test_no_store_run_states_the_resolved_root_and_an_examined_count_of_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Deployed check run by subprocess from a directory tree containing no acceptance-criterion store states the root it resolved and that it examined zero records - the path that produced total silence on 2026-08-25."
  - name: test_store_run_states_examined_one_and_refuses_that_one_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The second run states examined-one and names the resolved root, AND refuses the staged violating record by name - the count is corroborated by a verdict rather than standing as a number the check printed about itself."
  - name: test_the_two_runs_differ_only_in_working_directory_and_in_outcome_value
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "The recorded 2026-08-25 pair reproduced: identical argv, identical environment, identical target file, only the cwd differs - and the two outcome values now differ in a way a caller reads without parsing prose."
  - name: test_no_exit_path_is_reachable_without_the_statement_having_been_emitted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Every terminating condition the check can reach - no store at the resolved root, store found with nothing in scope, records examined, and an induced internal failure - is driven as a separate subprocess run and each is asserted to have emitted the statement. Driven by execution, never by reading the source for the statement's position."
test_rationale: |
  The instrument this record is about already exists and already passes any test that
  asks whether a diagnostic line is emitted — it emits one, on the two paths where the
  check did inspect something. So a criterion-level test written the obvious way is
  green today against the defect. Two things make the contract real. First, the pair:
  same argv, same file, only the working directory differing, which is the comparison
  that made KI-CG-018 believable and the only one that names WHY the outcomes differ.
  Second, the fourth descriptor, which drives every terminating condition as its own
  subprocess run rather than reading the source for where the statement sits — a
  grep-for-placement test passes on dead code and would also pass on a statement that
  is emitted but wrong. The refusal in the second run is what stops the examined count
  being a self-report.
