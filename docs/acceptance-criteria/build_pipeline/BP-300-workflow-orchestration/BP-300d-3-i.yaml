criteria: |
  Given a build for an unsupported Claude Code runtime where the prose body is
    the intended deployed body for the primary delivery commands,
  When build.py completes the command-deployment phase,
  Then the build succeeds with a zero exit status,
  And the supported-runtime routing guardrail (BP-300d-4) does NOT fire against
    the prose bodies, because deploying prose on an unsupported runtime is the
    documented fallback rather than a regression.
