notes: |
  USER DECISION Q5 (2026-09-17): fix first. documentation_guard and
  readme_read_guard must be shown to block a known-bad edit before GE-130a widens
  them. inline_work_guard already blocks and is out of this L1.

  FINDINGS THIS L1 EXISTS FOR (observed 2026-09-17 at HEAD 9845d253):
    - documentation_guard signals a block with exit 1, which does not block a
      PreToolUse call, and its DOC_MAPPING names another project's folders
      (live_trader/, collector/, models/, sql_functions/ ...), so it matches no
      path in this repository.
    - readme_read_guard never checks a Write: a Write carries no old_string or
      new_string, so the trivial-edit skip is always true. Its gated prefixes also
      never match through symlinks and alembic/versions/ does not exist here
      (recorded in GE-120f).
    - docs/reference/claude-code-hooks.md says a non-zero exit never blocks, while
      its own escape-hatch table and two shipped guards block with exit 2.
  Suggested known issues for the IT PO to file: the three findings above.
  IT-PO ENRICHMENT (2026-09-25) - THE FIVE DECISIONS THE CHILDREN DEPEND ON.

  D1 HOW A REPAIRED GUARD PROVES IT REFUSES. On the filesystem, not from the guard. The
  harness (GE-120c-1's) builds a real second working copy, writes the target file, records its
  digest, runs the guard through the exact settings.json command with the tool payload on
  stdin, and then APPLIES the tool call only if its single decision interpreter says Claude
  Code would have allowed it. The verdict is the after-digest: blocked means byte-identical
  (or still absent, for a create); allowed means changed as requested. The function that
  writes currently.state takes the before and after digests as its ONLY arguments - the exit
  status and stderr are attached as evidence and are not in its signature. That signature is
  the mechanical form of GE-130f-1-i, and its named mutation (decide the record from the
  message or the ending) must be run and shown to turn only GE-130f-1-i red.

  D2 WHERE documentation_guard's FOLDER MAP COMES FROM. From the installing project:
  docs/components.json, whose entries carry primary_code (the folders) and detail_ref (the
  architecture document describing them), plus the architecture documents' own components
  frontmatter for the reverse direction. Both are project-owned data the package does not
  author. No folder name from any project may appear as a literal in the guard. The
  second-project clause is exercised by building a second scratch project through the same
  harness with a deliberately different layout (for example src/api/ and src/jobs/ with their
  own architecture docs), installing the package into it with
  python scripts/build.py --target-dir <copy>, and driving the equivalent known-bad edit
  there. A map rewritten to THIS repository's folder names passes GE-130f-1's first scenario
  and fails its second - which is exactly why the second scenario exists.

  D3 readme_read_guard IN A WORKTREE, AND WRITE COVERAGE.
  Gated-folder detection: resolve both sides before comparing. Resolve the edited path and
  each gated folder to their real targets, resolve the project root the same way, and decide
  containment on the resolved pair (Path.is_relative_to / os.path.commonpath) rather than on a
  string prefix of the unresolved path. A resolved path that leaves the project must be a
  non-match, never an exception - today's containment test RAISES in the main workspace and
  merely fails the prefix test in a worktree, which is why one fix can leave every worktree
  inert (GE-130f-2-ii). A gated folder must match under BOTH spellings, its in-project path
  and its resolved target, so .claude/hooks gates whether it is reached directly or through
  the link into the installed copy. Every layout is tested in ONE run and reported per layout
  and per gated folder side by side.
  Write coverage: the small-edit allowance is opt-in on a MEASURABLE payload. It may apply
  only when the payload carries the fields its size is computed from; a payload that does not
  (a Write, which is {file_path, content}) is not small, it is unmeasurable, and unmeasurable
  is checked. Absent input must never be read as benign input - that is this defect's pattern
  entry in docs/reference/false-green-mechanisms.md. The guard must NOT manufacture a
  before-image by reading the file off disk to synthesise a diff: that would let a whole-file
  rewrite with a small net delta back through the same hole.

  D4 WHERE THE LIVENESS RECORD LIVES AND WHAT READS IT (GE-130f-3's gate). A new top-level
  session_hooks_manifest section in templates/scripts/commit_guardian/commit_guardian.json,
  keyed by hook script name. Each entry names the settings.json matcher and command string it
  corresponds to, and carries entry_point, negative_control and currently in
  config/verification_flow.schema.json's own shapes. Chosen over templates/settings.json (a
  host-parsed, user-editable file with a fixed hook-entry shape) and over
  hooks_manifest.hooks (whose members are COMMIT-time gates, counted by BP-1600a-2's census
  and emitted onto entry lines - a PreToolUse guard does not belong there). Two readers:
  GE-120f-1's liveness runner WRITES currently from observation, and GE-130f-3's settings
  check READS it. Command coverage being switched on is derived from templates/settings.json -
  the guard's script appearing under a PreToolUse matcher that includes Bash - because that is
  the file Claude Code actually reads; a boolean in commit_guardian.json would be the inert
  twin of the real switch. The check must be reached by something that blocks: a
  hooks_manifest.hooks entry on the commit path is the load-bearing gate (so a commit that
  widens templates/settings.json is refused), with a unit test under unit_tests/ as the
  second, non-load-bearing enforcement point. The task-lock guard's exclusion is carried as a
  field with a reason on its own manifest entry, never as a name literal in the checker.

  D5 GE-129a-1's PROBE. Recorded on GE-129a-1 itself; summarised here only because it is in
  the same build slice. Capture in the guard, drive from a runbook, reduce with a collator;
  findings written to templates/scripts/commit_guardian/caller_identity_findings.json against
  config/caller_identity_findings.schema.json, with an explicit unobserved state for every
  case and mode nobody has actually run.

  NEEDS THE USER (raised at this L1, decided nowhere below it):
    1. session_hooks_manifest is a NEW TOP-LEVEL KEY in a watched registry
       (_package_surface_registry.WATCHED_REGISTRIES watches commit_guardian.json on its
       document top level), so GE-130f-1 declares package_surface: true. Confirm the section
       name, and that commit_guardian.json rather than a new config file is the right home
       for session-hook verification state.
    2. GE-130f-1 and GE-130f-2 now carry expects_from GE-120f-1 and GE-120c-1, but their
       depends_on lists only GE-130f (BA-owned, write-locked for this pass). GE-120f-1 is not
       built yet, and its runner is the only writer of the record this tree reads. Either the
       ordering edge belongs in depends_on (a BA amendment), or GE-130f-1/-2 deliver the first
       writer for their own two entries and GE-120f-1 absorbs it later. Flagged, not decided.
