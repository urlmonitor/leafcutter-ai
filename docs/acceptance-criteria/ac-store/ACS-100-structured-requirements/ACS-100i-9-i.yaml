test_rationale: |
  Grepping the validator for a quote-stripping expression is not evidence: it
  cannot tell a rule that runs from one that is defined and never reached, and
  it says nothing about which of the two possible behaviours (refuse vs.
  normalise) actually happens.

  Execute the validator against a real on-disk fixture store containing all
  three quoted spellings that exist in the live store, byte-for-byte as PyYAML
  emits them, and assert a non-zero exit that names each offending record by
  file path. Do NOT hand-type the fixture as an indented literal: the repo has
  already shipped a parser that was a complete no-op on every real record
  because the synthetic fixtures reproduced an indentation bias the real
  serializer does not have (EPIC-PhantomDoneFilesTouched). Round-trip the
  fixture through the same writer the store uses.

  The no-mutation scenario needs its own assertion, because it is the one a
  normalising implementation would silently violate while still passing the
  refusal test: read the fixture file back after the run and assert its bytes
  are unchanged.

  Assert the negative too — an unquoted `python-coder` record in the same
  fixture store must pass in the same run. Without that, an implementation that
  refuses everything passes the positive test.

  Guard the empty run: assert on the count of records the run reports examining,
  not only on the exit code (KI-ACS-001 — the store-wide validator printed
  success on a run that resolved to zero files for eight days while the
  instruction to use it was already in CLAUDE.md).
declares_side_effect: false
notes: |
  DECISION: refuse, do not normalise. Three reasons, in order of weight.

  1. Every downstream reader does an exact string match, and they are spread
     across two languages. `generate_ticket_from_ac.py` uses the value as a dict
     KEY in the phase map; `build-feature.js` dispatches `agentType: phaseName`
     from that map; the agent cards group records by the raw value; the fast lane
     is about to join them. A normaliser would have to be replicated at every
     read site, and the one site that gets missed fails open — silently, in the
     dispatcher. A rule that refuses at authoring time has exactly one site.

  2. Normalising makes the text on disk differ from the value the system acts
     on. That gap is the entire class of defect this AC set exists to close;
     reintroducing it as the fix would be self-defeating.

  3. The correction is a two-character edit, and there are 16 of them. The cost
     of refusing is trivial; the cost of a silently-normalised store is a value
     nobody can grep for.

  COUNTS ARE FROM THE LIVE STORE at 2026-08-25 on branch
  acs-assigned-agent-validation: `"python-coder"` x10, `"test-failure-triage"`
  x5, `"documentation-expert"` x1. All three unquoted names ARE registered
  agents, which is why these 16 are separated from the 24 in ACS-100i-11 that
  name something that is not an agent at all — different defect, same field.
  Re-measure at implementation time; the numbers drift as other work lands, and
  a test that pins 16 without re-measuring will fail for the wrong reason.

  WHY THIS IS AN EDGE CASE AND NOT A SECOND RULE: quoting does not make the name
  wrong, it makes it unmatchable. Left unhandled, a registry-membership rule
  would refuse `"python-coder"` with the message "no agent named
  \"python-coder\" is registered", which is true, useless, and sends the author
  looking for a missing agent instead of a stray quote. The value this criterion
  adds is the message, not the refusal.

  ---
  IT-PO TECHNICAL ENRICHMENT, 2026-08-25 — ONE FINDING THAT CHANGES THE
  IMPLEMENTATION, RAISED AS A CAVEAT RATHER THAN AS AN EDIT TO THE CRITERIA.

  The criteria describe the 16 values as ones "none of which string-match their
  unquoted twins". Verified on this branch, that is true on ONE of the two parse
  paths and false on the other:

    - On the PyYAML path — the real one, since PyYAML is installed and
      check_ac_schema.py's jsonschema branch is authoritative — the source line
      is ordinary YAML double-quoting and yaml.safe_load returns the bare name.
      It DOES string-match its unquoted twin. A store-wide scan of parsed values
      finds 24 refusable records, not 40.
    - On the manual-parse path (load_yaml_manual, and the ImportError branch of
      load_yaml_from_string) the value is value.strip() of the raw text, so the
      quote characters survive and it does NOT match.

  Both halves of the criterion's intent survive this, but the implementation does
  not: the refusal must be driven by the record's RAW SOURCE LINE, not by the
  parsed value, or it will find nothing in the live store. That is why the
  helper's signature gains raw_text and why the reference file for this criterion
  is the entry point that owns the Path, not the parser.

  The third scenario — that a quoted and an unquoted record are not treated as
  two different producers by anything that groups by producer — is already
  satisfied on the PyYAML path and is violated only on the manual-parse path,
  which is where the seam test belongs.

  Fourteen of the 23 finalize-feature-workflow records are ALSO quoted, so a
  single record can fail both this rule and the parent's membership rule at once.
  The message-ordering constraint above exists for those 14.
