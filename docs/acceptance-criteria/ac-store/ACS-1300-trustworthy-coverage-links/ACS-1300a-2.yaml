id: ACS-1300a-2
components:
  - ac_store
title: "Repair happens only when it is asked for, and the run that changes nothing still says everything"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store on disk holding one record with a missing link, one record whose
    coverage list names a file that is absent, and one record whose coverage list is
    already correct,
  When the repair tool is invoked out of process with no apply request,
  Then no file under the store differs by a single byte from its content before the run,
  And the report names the same missing link and the same absent-file claim it names
    when the apply request is given, so a run that changed nothing cannot be mistaken
    for a run that found nothing,
  When the same tool is then invoked out of process with the apply request,
  Then the record with the missing link holds the naming test's path afterwards, written
    in the same entry form the store's existing coverage entries use,
  And the record whose claim named an absent file no longer carries that entry,
  And in that same invocation the already-correct record's file is byte-for-byte
    identical to its content before the run, so the run that left it alone is the same
    run that demonstrably changed the other two,
  And invoking the tool with the apply request again against the resulting store changes
    no file at all, adds no duplicate entry, and reports the two repaired records as
    already correct rather than as still broken.
