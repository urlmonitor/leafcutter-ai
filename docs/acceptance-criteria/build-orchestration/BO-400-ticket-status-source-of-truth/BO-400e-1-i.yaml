  post_write_commands:
    - "python -m pytest unit_tests/prompt_assembly/ -v"
  constraints:
    - "DO NOT SIMPLY ADD 'handoff' TO THE POSITIVE SET. That one-line change makes a DANGLING handover pass -- a phase that handed work to a sibling that never ran would be read as accounted for, and the close would succeed with real work missing. That is a phantom-done vector, and a worse defect than the deadlock it fixes. The status is conditional on the named recipient having recorded a passing outcome afterwards."
    - "THE RECIPIENT IS NAMED IN THE RECORD, NOT SUPPLIED BY THE CALLER. Resolve the handover's target from the handing phase's own entry, consistent with BO-400e-1: the close reads the ticket's record and takes nothing about the demanded set from the party asking for the close."
    - "ORDER MATTERS. The recipient's passing entry must come AFTER the handover, not merely exist. A sibling that passed earlier and was then handed fresh work has not discharged it. The third scenario -- a reviewer handing work BACK, with nothing recorded since -- must stay outstanding for the same reason."
    - "VERIFY BY EXECUTION, NEVER BY GREP. The constant, the predicate and the outstanding loop are all already present in the source, so a test that finds any of them passes on the broken driver. Drive real records through the real workflow scripts via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert on the close decision."
    - "BOTH TWINS IN ONE CHANGE, per BO-400a-2-ii."
    - "TEMPLATES ARE BUILD SOURCES. Keep the deployed copies in step (check-build-drift is the gate) and confirm the behaviour through the deployed layout before sign-off."
