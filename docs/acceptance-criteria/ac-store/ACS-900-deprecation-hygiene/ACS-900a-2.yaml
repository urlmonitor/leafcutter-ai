notes: |
  Defines what "the claimed code is gone" means against the implemented_by file
  list. "No longer references the retired behavior" from ACS-900a is operationalized
  as: file absent, or anchored entry whose anchor is gone. The legitimate-pass
  cases (deletion, empty list, re-point to successor) are owned by ACS-900d.

  IT-PO enrichment (2026-06-22): the #anchor parsing is the one genuinely NEW
  resolution step beyond cross_reference_audit.py (which reads implemented_by but
  never splits the anchor). Pinned the staged-tree evaluation surface and the
  dependency-free floor (substring search, no AST) in it_requirements so the
  python-coder does not reach for jcodemunch/parsing. delivers_to refined to a
  concrete verdict-map shape.
change_target: code
risk_surface: contract_boundary
