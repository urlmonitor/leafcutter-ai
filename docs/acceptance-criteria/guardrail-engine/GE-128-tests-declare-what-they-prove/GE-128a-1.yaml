id: GE-128a-1
title: "The test-declaration check reaches a verdict on a test with a docstring on every supported Python version"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L2
status: superseded_by
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Scenario 1 - a declaration carried in the docstring is recognised, not crashed on
  Given a staged test file containing exactly one test function, test_alpha,
    with no declaration comment on the line above its definition, whose body
    opens with the docstring "Checks alpha. covers: GE-128a-1"
  And the test-declaration check runs under Python 3.14
  When the check evaluates that file
  Then it reports test_alpha as declared and reports no violation for the file
  And its output contains no traceback and no attribute error.

  Scenario 2 - an undeclared test with a docstring is a violation, not a crash
  Given a staged test file containing exactly one test function, test_beta,
    whose body opens with the docstring "Checks beta." and which carries no
    declaration anywhere (not above the definition, not in the docstring, not on
    the first body line)
  And the check runs under Python 3.14
  When the check evaluates that file
  Then it reports test_beta by file and function name as a test with no
    declaration
  And the commit outcome is the one the check's configured mode gives any other
    violation - allowed with a warning in warning mode, refused in error mode
  And its output contains no traceback and no attribute error, so a refusal in
    error mode is distinguishable from a crash by the output and not by the
    outcome alone.

  Scenario 3 - a first statement that is a constant but not text is "no declaration"
  Given a staged test file containing exactly one test function, test_gamma,
    whose first body statement is the bare number expression 42 and which carries
    no declaration anywhere
  And the check runs under Python 3.14
  When the check evaluates that file
  Then it reports test_gamma as a test with no declaration, exactly as in
    Scenario 2
  And it does not report test_gamma as declared
  And its output contains no traceback.

  Scenario 4 - the verdict does not depend on the interpreter version
  Given the three files from Scenarios 1, 2 and 3
  When the check evaluates each of them once under Python 3.13 and once under
    Python 3.14, in the same mode
  Then for each file the set of reported undeclared tests and the commit outcome
    are identical across the two versions
  And neither run on either version produces a traceback.

  Scenario 5 - the real files that crashed on 2026-09-16 now get a verdict
  Given the committed test files test_km_kgs_100a_3.py,
    test_km_kgs_100a_3_i.py, test_km_kgs_100a_3_v.py,
    test_km_kgs_100a_3_viii.py and test_km_kgs_100a_3_ix.py from the unit-test tree
  When the check evaluates each of them under Python 3.14
  Then every run ends with a declared/undeclared verdict for each test function in
    the file and no run produces a traceback or attribute error.
