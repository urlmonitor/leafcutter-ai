it_requirements:
- A structural parent reference defines membership, not an executable prerequisite. Normalize hierarchy
  separately before topological ordering.
- Internal evidence must match the same run/worktree revision and cover inherited obligations; external
  evidence must prove required completion on the selected target branch.
- A local approved review or draft PR is never target completion; do not set done on AC source records
  to release dependents.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300f-1 (data handoff, not an additional build-order prerequisite): FeatureCandidate
  {feature_id:string, ancestor_ids:string[], source_revision:string, obligations:[{ac_id:string, parent_id:string|null,
  level:string, criteria:string, revision:string}], remaining_ac_ids:string[], completed_context_ids:string[],
  readiness:object, estimates:object, unanswered_questions:object[], dependency_edges:object[]}.'
test_spec:
- name: test_background_worker_internal_checks_release_only_same_feature_dependent
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: COUNTS passing in STATUS releases JSON there while EXPORT stays blocked; another branch's
    checks cannot substitute.
