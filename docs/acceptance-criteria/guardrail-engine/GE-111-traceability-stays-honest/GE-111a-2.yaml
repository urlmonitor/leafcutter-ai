id: GE-111a-2
readiness: approved
priority: high
title: "Blocking is the default; a warn-only tier exists only as an explicit opt-in"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111a.yaml"
criteria: |
  Given the commit guardian configuration has the traceability reconciliation
    section absent, or present without an explicit enforcement-mode setting
  And a staged commit breaks an AC-to-code link for criterion AC-X
  When the traceability reconciliation check runs at pre-commit time
  Then the check finishes with a blocking (non-zero) outcome
  And the commit does not complete

  Given the commit guardian configuration has the traceability reconciliation
    section with its enforcement mode explicitly set to warn
  And a staged commit breaks an AC-to-code link for criterion AC-X
  When the traceability reconciliation check runs at pre-commit time
  Then the check emits an advisory message naming AC-X
  And the check finishes with a non-blocking (zero) outcome
  And the commit is allowed to proceed
