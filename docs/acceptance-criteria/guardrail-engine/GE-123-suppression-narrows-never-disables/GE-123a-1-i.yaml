notes: |
  WHAT WAS INFERRED, AND FROM WHICH TEXT. This record was reconstructed from the
  dangling reference in GE-123a-1's covered_by after the authoring run that
  created it did not write the file. Three pieces of the parent were used, and a
  reviewer should check the reading against them:

    1. GE-123a-1's MEASURED RED BASELINE paragraph — "five env-named files each
       carrying the four secret shapes above reported ZERO problems". The parent
       records the collapse as measured across FIVE files, but its own scenario
       exercises exactly ONE environment-named file (".env") alongside one
       ordinary source file. The gap between the measured evidence and the
       parent's scenario is the first arm here: a fix that works for the first
       such file only would pass the parent and leave four of the five measured
       files exactly as they are today. The arithmetic is the parent's own —
       "the fix must take the env-named file to five" — multiplied across the
       five files of the baseline: twenty-five.

    2. GE-123a-1's VERIFICATION STANDARD paragraph — "a sibling audit in this
       family found two criteria verified only against the matching logic in
       isolation that described situations the real entry point can never
       produce ... Coverage of the per-file scan in isolation does not discharge
       it." Stated there as a rule about how to test, it has a behavioural
       consequence that is testable in its own right and is the third arm here:
       what the per-file scan produces and what the run reports to the author
       can differ, and only the latter protects anyone. An aggregator that
       de-duplicates by rule id across files would reproduce the collapse above
       a correctly-fixed per-file scan.

    3. GE-123a-1's delivers_to contract — "so that every downstream AC in this
       tree can assume an env-named file has more than one suppressible
       finding." Every downstream AC, not one file. GE-123a-2 relies on this for
       five files at once; that reliance is only sound if the parent's behaviour
       is established for a set, which is what this record does.

  The second arm (order independence) is not stated in the parent's text; it was
  added because the first arm's failure mode — a short-circuit that survives at
  run level — is most cheaply hidden by an implementation whose behaviour depends
  on what it has already seen. It is an edge case of the same behaviour, not a
  new direction.

  MEASURED RED BASELINE: as the parent records, the five-file set reported ZERO
  findings with one suppression line present, and the same content in an ordinary
  source file reported four. Against this criterion (no suppressions at all) the
  baseline is five findings across the five files — one filename finding each.
  All three arms are red.

  ENV FILENAMES ARE THE SUBJECT HERE, as in the parent and for the same reason:
  the short-circuit is what this branch is about. The tree-wide constraint against
  environment filenames as casual illustrative examples is unaffected; the
  ordinary files in the second arm use ordinary source filenames.

  VERIFY THROUGH THE REAL MULTI-FILE ENTRY POINT with real files on disk. A test
  that calls the per-file scan five times in a loop asserts nothing this criterion
  is about and specifically cannot fail the third arm.
target_epic: EPIC-SuppressionNarrowsNeverDisables
