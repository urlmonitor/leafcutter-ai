notes: |
  Owns the HAPPY-PATH and MISSING-PATH for the module->component surface (GE-117a).
  Scope is diff-only: only new/changed files are evaluated; unchanged files with a
  legacy component-less docstring are never retrofitted (third scenario pins this).
  Presence of the docstring itself is GE-100's concern, NOT re-specified here — this
  AC assumes a docstring exists (or is added in the diff) and asserts it must name a
  RESOLVABLE component. The invalid-but-present-name case is GE-117a-1-i; the
  no-module-docstring boundary vs GE-100 is GE-117a-1-ii. The verdict object shape
  is the spine consumed by GE-117d/e — keep it stable across all three surfaces
  (module-component, symbol-ac, decision-history-ac).
