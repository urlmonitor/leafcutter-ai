id: GE-124c-4
readiness: approved
priority: high
title: "A how-to tells a blocked author which of the two mistakes they made and how to clear it"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given an author's commit has just been rejected by the frontend declaration
    check
  When they open the how-to named in the block report
  Then the how-to has one section per verdict code the check emits, keyed by the
    code as printed
  And the missing-declaration section shows the remedy — add the declaration in
    the shape their file type uses, or record a visible per-item opt-out reason
  And the unresolved-id section shows the different remedy — correct the id or
    author the criterion — and states plainly that this is not the same mistake
    as a missing declaration
  And the how-to states that an untouched file is never reported, so an author
    does not go looking for a change they did not make
depends_on:
  - GE-124c
  - GE-124c-1
  - GE-124c-2
  - GE-124c-3
