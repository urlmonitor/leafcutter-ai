criteria: |
  Given the deployed goal_to_epic.py running from .leafcutter/scripts/ (a location
    outside any git worktree, where no .git marker exists in any parent directory)
    and the caller supplies BOTH --store-root and --inbox-dir explicitly,
  When main() is invoked,
  Then _find_worktree_root() is NOT called (because neither default path is needed)
    and the script proceeds to run() using the supplied paths
  And the symptom ("deployed script crashes with FileNotFoundError 'Could not locate
    worktree root' outside the git tree even when --store-root/--inbox-dir are passed")
    must not occur
