criteria: |
  Given AC ACD-800a-1 already has implemented_by containing
    "tickets/99_done/EPIC-Example/01_example.md",
  When the cross-reference audit with --apply finds the same ticket
    as a high-confidence match for that AC again,
  Then the ticket path is NOT appended a second time to implemented_by
    (the list retains exactly one entry for that path),
  And the tool logs "no-op (already linked)" for that AC,
  And work_status remains done (not re-set).
