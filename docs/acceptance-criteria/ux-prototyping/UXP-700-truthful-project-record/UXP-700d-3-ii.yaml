test_required: true
test_rationale: |
  A marker nothing checks is a second hand-written field that drifts. The failure test
  builds a mismatch and asserts both values are named; the reachability test drives the
  real checker CLI, because a verdict helper that is never called from main() checks
  nothing.
test_spec:
  - name: test_declaration_disagreeing_with_the_product_root_is_reported
    target_dir: unit_tests/product_truth/
    framework: unittest
    type: integration
    angle: failure
    description: "A journey declaring an example_product other than its product root is reported naming both values."
  - name: test_uxp_700d_3_reachable_from_entry_point
    target_dir: unit_tests/product_truth/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: docs/product-truth/scripts/validate_product_truth.py
    description: "The checker CLI, run as a subprocess over a store with a mismatched and an undeclared example artifact, reports both."
notes: |
  The pure verdict helper lives in product_ownership.py beside the ownership predicate it
  cross-checks (ADR-044 section 7); validate_product_truth.py only loads records and calls
  it. A root counts as an example root only when it equals EXAMPLE_PRODUCT, so the
  project's own `guardrails/` dataset is not reported as undeclared.

