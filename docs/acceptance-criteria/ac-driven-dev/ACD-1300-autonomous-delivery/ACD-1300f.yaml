criteria: |
  Let background work start only when the whole feature is ready.

  Every approved feature is considered without a separate opt-in, but it enters
  only when all remaining required work is clear, small or medium in size, and
  its prerequisites can be respected. A feature with unresolved or oversized
  work stays intact in the backlog with an explanation instead of being partly built.
