criteria: |
  Given a drive clone whose current branch is `main`,
  When a drive step attempts `git commit` onto `main`,
  Then the local pre-commit main-guard prevents or flags the commit with a message
    saying work must go on a feature branch, not `main`,
  And this local guard is defense-in-depth only -- it is explicitly NOT the
    guarantee (the server-side gate in BO-1800b is), so a bypass of the local guard
    still cannot land on the hub's `main`.
depends_on: [BO-1800e-1]
