assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Surface is the .js workflow + shared helper: implement the wait loop in the BO-1300b-1 helper (scripts/pr_merge_gate.py) and call it from finalize-feature.js Step 4 BEFORE `gh pr merge`. The verdict drives the merge: merge only when the verdict is GREEN (every required check == success)."
  - "MODIFY existing: finalize-feature.js Step 4 currently calls `gh pr merge --merge --auto` unconditionally after the confirmation gate. Gate that call on the GREEN verdict from the poller; never merge while any required check is pending."
  - "Poll with a bounded loop: configurable interval and a configurable maximum wait window (the timeout that BO-1300c-1-i surfaces). Put both tunables in a config home (e.g. a merge_gate section in an existing config or a new config/pr_merge_gate.yaml) — do NOT hard-code the interval/timeout."
  - "Must be idempotent / re-entrant: re-running the gate re-reads live check states; a check that has already gone terminal is not re-waited."
  - "Must not regress FIN-100: this check-green gate sits alongside FIN-100's post-merge test gate (finalize-feature.js Step 3 runs first). Depend on FIN-100; do not re-spec its regression triage."
  - "Error handling per project policy: wrap gh polling in typed try/except, log at WARNING; transient gh errors should be retried within the wait window, not treated as a terminal failure."
delivers_to:
  agent: python-coder
  contract: "GREEN verdict (all required checks success) that authorizes the BO-1300a-3 PR-merge step; a bounded wait loop whose timeout window is consumed by BO-1300c-1-i"
