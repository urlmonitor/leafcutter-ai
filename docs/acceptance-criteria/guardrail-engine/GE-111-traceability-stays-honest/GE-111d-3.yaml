    relationship: parent
    status: exists
  - path: "docs/architecture/components/commit-guardian.md"
    relationship: describes
    status: exists
it_requirements:
  - "Route applicability is derived from the verdict object, not re-computed: UPDATE is always offered; UPDATE-with-suggested-location is offered iff verdict.suggested_location is non-null (GE-111b-3); CONFIRM is offered iff change_kind is moved/renamed on a SURVIVING file (it must NOT be offered for a file-path-floor 'deleted' verdict, consistent with the GE-111d-2 boundary that confirm cannot clear a vanished file)."
  - "Produces structured route content (not the final formatted string) handed to GE-111e for assembly — single-responsibility: this AC decides WHICH routes apply, GE-111e renders the message."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4)."
assigned_agent: python-coder
estimated_complexity: S
delivers_to:
  agent: python-coder
  contract: "The applicable-routes content {update: {suggested_location: str|null}, confirm: bool} per flagged AC that GE-111e includes in the block message"
expects_from:
  ac_id: GE-111b-3
  contract: "Whether a suggested new location exists (and the change kind), which determines what the update route can name and whether confirm is offered"
origin_agent: business-analyst
