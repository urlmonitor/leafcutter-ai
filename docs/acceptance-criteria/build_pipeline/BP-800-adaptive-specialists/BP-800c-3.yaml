id: BP-800c-3
title: "Package update with new best practices does not require user action"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project with existing generated specialists (python-coder, go-coder)
  And the user updates the leafcutter-ai package to a new version containing improved Go best practices
  When the user runs the build (without any additional flags or commands)
  Then the "go-coder" specialist is regenerated with the updated best practices
  And the "python-coder" specialist is regenerated unchanged (no diff if its best practices did not change)
  And no manual configuration step, setup command, or migration script is required from the user
  And the build output reports which specialists were updated: "Updated: go-coder (best practices v1 -> v2)"
