it_requirements:
  - Selecting a flow, drilling (on the node or with 'Open sub-flow' in the drawer) and clicking a breadcrumb
    each add exactly one history entry at flowHref(targetFlowId) with no ?step=, written with window.history.pushState
    (owner decision 2026-10-09). The App Router (Next.js 14.1+) integrates pushState with no server round-trip
    or remount; router.push is not used, because it re-renders the server route and remounts view state.
  - 'Each pushed entry stores its view state {crumbs: string[] (Flow ids, entry flow first), filters:
    {source: ''real'' | ''mock'', kind: ''user'' | ''data'' | ''architecture'', realization: ''all'' |
    ''built'' | ''spec'' | ''mock''}}: select -> [target], drill -> previous crumbs + [target], crumb
    -> previous crumbs cut after the target; filters unchanged. The state is kept in history.state under
    one namespaced key, merged into, never overwriting, the App Router''s own keys (__NA, __PRIVATE_NEXTJS_INTERNALS_TREE);
    not sessionStorage (owner decision 2026-10-09).'
  - 'No in-memory history stack: dropping Forward entries on a new push is the browser''s own behaviour,
    and a reload or a Back from another Atlas page works from the URL plus the stored entry state alone.'
  - The push decision lives in the same pure navigation function as the drawer replace (proposed leafcutter-web/components/flows/flow-navigation.ts)
    and is tested by replaying the dataset's FlowNavigation sessions.
  - A pushed URL reloaded in place renders the same flow through the catch-all route (UXP-591-1).
  - jsdom does not run the App Router's history integration, so the real-browser behaviour (history length
    under the App Router, Back/Forward without a page reload) is proven by this AC's Playwright spec in
    leafcutter-web/e2e/, run in CI against `next build` + `next start` (owner decision 2026-10-09; harness
    set up under UXP-591-1).
delivers_to:
  agent: frontend-coder
  contract: 'Push-entry path: pushEntry(flowHref(targetFlowId), state: {crumbs: string[] (Flow ids, entry
    flow first), filters: {source: ''real'' | ''mock'', kind: ''user'' | ''data'' | ''architecture'',
    realization: ''all'' | ''built'' | ''spec'' | ''mock''}}) adds one entry with window.history.pushState,
    the state kept in history.state under one namespaced key, merged into, never overwriting, the App
    Router''s own keys (__NA, __PRIVATE_NEXTJS_INTERNALS_TREE); not sessionStorage (owner decision 2026-10-09).
    Popstate restore reads the URL for the flow and the drawer (?step=) and history.state for crumbs and
    filters. An entry with no stored state falls back to {crumbs: [urlFlowId], filters: the flow''s own
    source and kind with realization ''all''}, or {crumbs: [], filters: real/user/all} for an unknown
    id, or {crumbs: [default entry], filters: real/user/all} for /flows. Used by UXP-591-5-i to -v.'
expects_from:
  - ac_id: UXP-591-1
    contract: The target flow's canonical address /flows/<flow id>, used as the address of each added
      history entry.
  - ac_id: UXP-591-1
    contract: 'Playwright harness in leafcutter-web: @playwright/test devDependency, leafcutter-web/playwright.config.ts
      (testDir ./e2e, Chromium, webServer running `next start` on a production build), `npm run e2e`,
      and the CI steps that run it after `npm ci`.'
test_spec:
  - name: drilling into Build adds one history entry at /flows/leafcutter/how-acs-are-built with a two-flow
      breadcrumb
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: criterion
    must_catch:
      - the drill replaces the entry instead of pushing
      - the pushed URL keeps a ?step=
  - name: selector and breadcrumb clicks each add one entry with their breadcrumb rules, and a push after
      Back discards the Forward entries
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: boundary
  - name: the view rendered by the catch-all route pushes the canonical address on drill
    target_dir: leafcutter-web/__tests__/
    framework: vitest
    type: integration
    angle: reachability
    surface_invoked: default export of leafcutter-web/app/flows/[...id]/page.tsx for leafcutter/deliver-a-feature,
      rendered, then a drill on 'Build'
  - name: flow-navigation replays every FlowNavigation session in atlas-flows.mock.json record by record
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: unit
    angle: real_artifact
    covers:
      - UXP-591-5
      - UXP-591-5-ii
    description: Each record's history_op, history_stack, history_index, address_bar, crumbs, drawer and
      filters match the navigation function's output.
  - name: under next start selecting a flow and drilling into a sub-flow each add exactly one history
      entry
    target_dir: leafcutter-web/e2e/
    framework: playwright
    type: e2e
    angle: deployed
    surface_invoked: real clicks on a flow-selector button and on the Build step's drill affordance in
      Chromium against `next start` of a production build
    description: history.length read with page.evaluate grows by exactly one per select and per drill,
      and the address bar shows the target's canonical address with no ?step=. No `// covers:` tag until
      the done-proof gate can run Playwright specs (see UXP-591-1).
    must_catch:
      - the App Router adds a second entry for one pushState
      - the drill replaces the entry under the real router
test_rationale: The 44 FlowNavigation records are the approved specification of push, replace and pop,
  so replaying them against the pure navigation function covers every session; the component and route
  tests prove the React glue performs what the function decides, and the Playwright spec proves the entry
  count under the real App Router.
