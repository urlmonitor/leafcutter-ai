notes: RQ6 and readiness evidence in RQ3; BA-04, QA-02; RQE-04. Inherit TQ-400 proof durability rather than re-authoring
  its verdict or demotion machinery. Draft behavioral specification under the user-requested BA pass; technical
  enrichment and proof remain pending.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Keep canonical file-level Test identity, callable coverage anchor and executed case/run identity distinct. A declared
  reference establishes a relation only; executed proof requires attributable run/artifact, tested revision and
  environment.
- Preserve source publication SHA separately from historical tested SHA, real versus scripted actors, command/test
  outcome separately from original-question fulfillment, and deployment scope separately from local verification.
- Historical receipt content may be explicitly hashed and cited without becoming Git-immutable or current proof.
  Missing, inaccessible or mismatched execution evidence remains unverified; do not infer fail or pass.
- The RQE-04 historical example uses seven declared references and earlier-revision local/Aura receipts with scripted
  Jev and supplied candidate. It cannot establish real Jev, independent builder, current revision, semantic usefulness
  or deployment readiness.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_proof_answer_separates_declarations_execution_and_fulfillment
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Consume RQE-04-P through public research and assert seven declared references remain distinct from
    historical execution receipts, source/tested revisions, environment, scripted actors and the partial research
    outcome.
  must_catch:
  - Reporting a passing harness as completed real-Jev research or current deployed proof.
  covers:
  - KM-500f-2
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_declaration_only_evidence_cannot_pass_executed_proof_check
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Assess RQE-04-N with only declared references and work_status=done; assert execution, real-provider
    and deployment proof remain unavailable or unverified.
  must_catch:
  - Treating covered_by or work_status=done as a passing execution result.
  covers:
  - KM-500f-2
  requires_db: false
- name: test_proof_consumer_preserves_identity_and_receipt_provenance
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Read real serialized proof metadata through its real answer consumer, keeping file reference, callable
    anchor and run ID separate, and preserve the receipt hash and historically tested SHA after cold reload.
  must_catch:
  - Matching proof solely by a test filename while losing the tested revision or receipt identity.
  covers:
  - KM-500f-2
  requires_db: false
- name: test_mismatched_or_missing_execution_artifacts_do_not_establish_readiness
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Use wrong-revision, inaccessible and simulated receipts with a current-source question; assert limitations
    remain visible and no absent result is relabeled passed, failed, deployed or real-provider verified.
  must_catch:
  - Crediting a historical or simulated run to a current live-provider or deployment claim.
  covers:
  - KM-500f-2
  requires_db: false
