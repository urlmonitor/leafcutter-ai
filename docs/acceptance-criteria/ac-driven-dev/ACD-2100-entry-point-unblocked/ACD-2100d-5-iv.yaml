it_requirements:
  - >-
    Edit both pages in place and keep their reference genre; no new page. The check-doc-length
    ratchet applies to docs/**.md; tighten existing prose to make room if needed.
  - >-
    State the start contract as the workflow implements it after ACD-2100d-5: the installed
    command and skill pass userInput and workspace; workspace (the maker's answer) is what a start
    needs; args.workspace_setup_permission is required only for a start without the maker's
    answer.
  - >-
    Quote startup-halt reports word for word from the workflow, including the neither-argument row
    and its remedy as delivered by ACD-2100d-5-ii; no paraphrase is presented as a quote.
  - >-
    Remove the claim that the skill runs the permission pre-flight (sec. WSP was retired on
    2026-10-10, TICKET-20260928-BO-4300-entry-skills). Where
    scripts/worktree/check_workspace_setup_permission.py is still named, say it serves only a start
    without the maker's answer.
  - >-
    docs/reference/plan-feature-workflow-rationale.md holds comments moved verbatim out of
    plan-feature.js. Its sections "Pre-Stage-0 workspace-setup permission gate" and "No pre-flight
    verdict at all fails closed" are rewritten to match the code comment as changed by ACD-2100d-5
    and -ii, and say whether the verdict is required when the maker's answer is supplied, and why
    (the workspace already exists and the workflow runs no workspace step of its own).
  - >-
    Check docs/reference/plan-feature-workflow-rationale-gates.md, section "The pre-flight outcome
    field", against the new contract. If it contradicts it, flag that at sign-off rather than
    editing a file this record does not declare.
test_intent:
  - clause: >-
      the pages list the arguments the installed /plan-feature command and skill pass, and say which of them the workflow requires
    needs_test: true
    reason: The listed arguments can drift from the entry texts, which reading those texts the way ACD-2100d-5-i does catches.
  - clause: each startup-halt report the pages quote is word for word what the workflow produces
    needs_test: true
    reason: Quoted halts drift from the workflow's output whenever either changes, which a check against the workflow catches.
  - clause: >-
      the pages do not say that the skill runs a permission pre-flight unless the installed skill contains that step
    needs_test: true
    reason: This stale claim is in the pages today, and a check against the installed skill catches it coming back.
  - clause: >-
      the rationale notes say whether the startup verdict is required when the maker's answer is supplied, and why, matching what the workflow does
    needs_test: false
    reason: This is an explanation of a design choice, reviewed at sign-off; the behaviour it describes is tested on ACD-2100d-5.
  - clause: >-
      the reference page's row for a run that arrives with no maker's answer and no verdict gives the remedy that ACD-2100d-5-ii's report gives
    needs_test: true
    reason: The row and the halt are written in different files and drift apart unless compared.
test_spec:
  - name: "test_pages_list_the_arguments_the_entry_texts_pass_and_which_are_required"
    target_dir: "unit_tests/reference/"
    framework: "unittest"
    type: "unit"
    angle: "real_artifact"
    description: "The arguments read from the installed command and skill (through the ACD-2100d-5-i support module) are each listed on the pages, and the page marks workspace as the one a start needs and the verdict as required only without it."
    proves_clause: "the pages list the arguments the installed /plan-feature command and skill pass, and say which of them the workflow requires"
    code_file: "docs/reference/plan-feature-layout-and-startup-checks.md"
  - name: "test_quoted_startup_halt_reports_match_the_workflow_word_for_word"
    target_dir: "unit_tests/reference/"
    framework: "unittest"
    type: "integration"
    angle: "reachability"
    description: "plan-feature.js driven through the E2 harness to each startup halt the pages quote (including neither argument) returns a report that appears word for word on the reference page, whitespace-normalised."
    proves_clause: "each startup-halt report the pages quote is word for word what the workflow produces"
    code_file: "docs/reference/plan-feature-layout-and-startup-checks.md"
    surface_invoked: "templates/workflows-js/plan-feature.js driven through unit_tests/_workflow_engine_harness.py run_workflow_under_e2"
  - name: "test_pages_claim_no_skill_preflight_unless_the_installed_skill_has_it"
    target_dir: "unit_tests/reference/"
    framework: "unittest"
    type: "unit"
    angle: "discrimination"
    description: "Neither page says the skill runs a permission pre-flight unless the installed skill contains that step."
    proves_clause: "the pages do not say that the skill runs a permission pre-flight unless the installed skill contains that step"
    code_file: "docs/reference/plan-feature-layout-and-startup-checks.md"
    must_catch:
      - "revert the fix"
      - "a page still says the skill runs the permission pre-flight"
  - name: "test_no_argument_no_verdict_row_gives_the_halt_reports_remedy"
    target_dir: "unit_tests/reference/"
    framework: "unittest"
    type: "unit"
    angle: "real_artifact"
    description: "The reference page's row for a run with no maker's answer and no verdict contains the remedy of the halt report ACD-2100d-5-ii produces."
    proves_clause: "the reference page's row for a run that arrives with no maker's answer and no verdict gives the remedy that ACD-2100d-5-ii's report gives"
    code_file: "docs/reference/plan-feature-layout-and-startup-checks.md"
