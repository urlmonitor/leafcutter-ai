id: BO-3800a-1
title: "A refusal that asks for a craft leaves the author's change untouched, does not advance the run past delivery, and re-offers that same change to the same standard once the file has been put right"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven and its delivery step is reached with the
    author's change standing in the working tree,
  And the standard that judges delivery refuses it with an outcome that names one
    file, states a demand of 120 measured lines against that file, and states that
    a demand of that size is handed to a restructuring specialist rather than to
    the author inside this change,
  When the run adjudicates that refusal,
  Then the author's change is still present and is exactly what it was before the
    refusal — not reverted, not rolled back, not stashed away, not discarded and
    not re-derived,
  And the delivery step is not recorded as completed,
  And nothing that ordinarily follows delivery runs,
  And given the restructuring specialist has since run against the named file and
    the file now meets the demand,
  When the run continues,
  Then delivery is attempted a second time with the author's original change still
    in it,
  And that second attempt is judged by the same standard that refused the first,
    with nothing suppressed, skipped, waived or overridden to make it pass,
  And the second attempt completes because the file now meets the demand, so no
    part of the change is re-authored, re-staged or re-derived by anyone,
  And given instead the same refusal in a run inspected at the moment after the
    refusal and before any restructuring has happened,
  When the sequence of steps the run has taken is read,
  Then delivery has not been attempted a second time — the re-offer follows the
    restructuring and never precedes it.
depends_on:
  - BO-3800a
