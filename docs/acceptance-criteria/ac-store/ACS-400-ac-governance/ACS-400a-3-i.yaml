title: "Human user is always authorized regardless of agent registry membership"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given an AC YAML file is staged for commit with a new or changed criteria field,
  When the committing agent's identity is not in the agent_registry.json
    (e.g. origin_agent: "BrainCandy" or any string not matching a registered agent ID),
  Then the governance check treats the committer as a human user,
  And the commit proceeds without governance violation,
  And the criteria field change is accepted.
