notes: |
  Requested direction 2 of KI-FC-003 (stale or misspelt writer). A renamed agent leaves its
  old name behind as exactly this kind of writer. Whether the report also fails the build
  is an open question carried to the IT PO / user: the request says "reported", so this
  record asserts the report, not a build failure. A misspelt writer loses no feedback by
  itself; the agent it was meant to name is caught by INF-100c-5 when that agent signs off.
