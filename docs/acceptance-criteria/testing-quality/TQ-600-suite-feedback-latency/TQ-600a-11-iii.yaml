criteria: |
  RETIRED 2026-10-09 WITH ITS PARENT CHAIN. This record proves that TQ-600a-11-ii's
    agreement check has a needle — it is a guard on a guard, and it has no independent
    subject. TQ-600a-11-ii is retired because the substitution it licensed is not being
    made, so there is no comparison left to demonstrate the fallibility of. This record
    is the only one of the four whose retirement follows purely by construction: its
    expects_from names the comparison itself as the thing it needs, and without that
    comparison it is explicitly "unbuildable" in its own words. Text below is preserved
    verbatim for audit.

  Given the record-by-record comparison of TQ-600a-11-ii, which over the real store
    finds no disagreement — a result that on its own is indistinguishable from a
    comparison that compares nothing,
  And an input constructed so the two parsers genuinely resolve it differently: a
    mapping with a duplicate key whose two values differ is the cheapest instance,
    and any input for which the two are OBSERVED to yield unequal objects is
    acceptable in its place,
  When that input is included in the compared set,
  Then the comparison reports a disagreement, exits non-zero, and names the input,
  And it names the field, or the path within the parsed object, at which the two
    results differ, together with both values,
  And removing that one input returns the comparison to a clean result, so the
    non-zero outcome is attributable to the input rather than to the harness,
  And the demonstration is itself part of the suite, so a later change that makes
    the comparison vacuous turns a test red instead of turning a report quiet,
  And the construction of the divergent input is verified by observation at
    implementation time rather than taken from this record: if the chosen input turns
    out to produce equal objects under the installed library, a different input is
    found, and the one actually used is named in the test.
