id: TQ-100d-1-ii
title: "An allowlisted test that has started passing is flagged so the stale entry is removed"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100d.yaml
criteria: |
  Given a known-failing-tests allowlist entry (valid and unexpired) for a test
    that is now passing,
  When the allowlist check runs,
  Then the now-passing allowlisted entry is flagged with a message naming the
    entry and its test
  And the flag indicates the stale exemption should be removed
  And the check signals this as a violation (so a now-passing test cannot keep a
    permanent exemption).
depends_on:
  - TQ-100d-1
doc_links:
