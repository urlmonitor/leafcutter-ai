title: "BA agent checks for existing pattern before writing new behavioral AC"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the business-analyst-v3 agent is decomposing an L1 AC into L2 behaviors,
  And the store contains a pattern AC defining "sortable-table" behavior,
  When the agent encounters a page requirement that includes sortable-table behavior
    (e.g. "the parts list supports column sorting"),
  Then the agent produces an L2 AC with:
    implements_pattern referencing the existing sortable-table pattern AC ID,
    pattern_bindings mapping the page-specific values to the pattern's slots,
  And the agent does NOT write a new standalone criteria body
    that restates the sorting behavior already defined in the pattern.
