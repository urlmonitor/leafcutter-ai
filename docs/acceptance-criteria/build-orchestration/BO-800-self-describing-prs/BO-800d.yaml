id: BO-800d
title: "PRs stay accurate even when the ticket scope changed during implementation"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_3
criteria: |
  The PR reflects the final state of the ACs, not the original specification.

  If a ticket's acceptance criteria were amended mid-drive -- scope
  narrowed, edge cases added, a feature adjusted -- the PR description
  is assembled from the current state of the ACs at PR creation time.
  Reviewers see what was actually built, not what was originally planned.
