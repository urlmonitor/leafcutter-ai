notes: |
  This is the regression replay the L0 and the parent L1 both call for. It is
  deliberately written as THREE states rather than the obvious two, and the first
  state is the reason.

  THE CALIBRATION FINDING — READ THIS BEFORE IMPLEMENTING OR TESTING BO-2900b.
  It is tempting to record "this guard would have failed the instant that change
  landed" as a single scenario over the forward check. It would not have. In the state
  that actually shipped, the command surface registered NOTHING: the functions existed,
  their tests passed, and there was no capability for the forward check to find
  uncalled. An inventory-based forward check passes VACUOUSLY on an empty inventory —
  it reports zero findings and looks healthy. The forward check first bites in state
  two, which the repository never occupied, because the capabilities and their callers
  arrived together in the corrective change.

  What this means concretely:
    - State one is caught by BO-2900a-3 (nothing reaches the code, so no criterion
      over it may be marked done). Not by this L1.
    - State two is what this L1 prevents for every future capability.
    - Anyone testing this L1 with a fixture modelled on the real regression will build
      state one, watch the check pass, and conclude the check is broken — or, worse,
      "fix" it by widening it into source scanning until it fires. The first scenario
      is written into the criteria precisely so that passing there is the specified,
      asserted outcome rather than a surprise.

  A vacuous-pass check is only safe while its sibling exists. If BO-2900a-3 is ever
  descoped, this L1 alone does not cover the regression it was created for.

  Verification must EXECUTE the check over all three fixture states in one test run
  and assert all three outcomes. Asserting only state two proves nothing about the
  vacuity boundary, which is the finding this AC carries.
