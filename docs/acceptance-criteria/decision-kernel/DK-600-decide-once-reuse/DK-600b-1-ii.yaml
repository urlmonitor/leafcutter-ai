id: DK-600b-1-ii
title: "A free-text answer at approval is kept as a limitation, never turned into criteria"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the approval question for 4 proposed options and 5 proposed criteria,
  When you answer in your own words, for example "also weigh how much CI time each option adds",
    instead of approving, trimming, rewording or adding,
  Then your answer is kept word for word as your input,
  And it is noted among the decision's limitations,
  And no criterion is created from your answer: the criteria are the 5 proposed ones and no other.
depends_on:
  - DK-600b-1
