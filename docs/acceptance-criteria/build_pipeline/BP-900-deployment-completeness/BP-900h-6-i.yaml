notes: |
  Found by an empirical read of scripts/ci/_use_install_step.py on this branch, not by a
  failing test. Pointed at a directory, run_use_install_step unconditionally performs
  git init, rewrites skills_config.json, deletes 53 of the 55 hooks from the deployed
  .pre-commit-config.yaml, and commits. There is no test of what the directory is. The
  registry rewrite is the sharpest edge: it opens the config path and writes, so when the
  deployed config is a symbolic link into the shared install tree — the arrangement this
  workspace's worktrees actually use — the deletion lands in the shared artifact and every
  install reading it loses 53 hooks silently.

  WRONG FIXES TO EXPECT.
  1. Move the entitlement test lower, after git init "so the repository state can be
     inspected". That is not a guard; the target is already modified when it fires.
  2. Refuse unless the directory is empty. The CI job's target is the workspace root,
     which holds the package checkout and the built install, so an emptiness rule turns
     the real job red and will be reverted or weakened within a day. The condition must be
     about entitlement, not emptiness.
  3. Copy the symlinked registry's content into a regular file and keep writing the
     original path. Byte-identity of the shared artifact is the assertion precisely so the
     rewrite has to land inside the target.

  SCOPE BOUNDARY. This AC is about what the step is allowed to touch. It says nothing
  about which hooks the step may narrow away or how the narrowing is reported — that is
  BP-900h-6-ii, deliberately kept separate so a fix to one is not accepted as a fix to
  the other.
