change_target: code
risk_surface: contract_boundary
test_required: true
test_rationale: |
  Without this record an implementer discharges UXP-700b-1 by making any imperfect run fail,
  which repeals the project's deliberate fail-open convention and would block unrelated work.
  This is therefore the paired acceptable input: it proves the degraded run is visible AND
  non-blocking, and both halves must be asserted or the pair is not a control.
test_spec:
  - name: test_one_malformed_journey_is_named_and_the_rest_are_examined
    target_dir: unit_tests/product_truth/
    description: "The report names the malformed journey and states four journeys examined."
    type: integration
    angle: failure
    framework: unittest
  - name: test_degraded_run_outcome_is_neither_clean_nor_nothing_examined
    target_dir: unit_tests/product_truth/
    description: "The outcome value differs from both the clean-pass outcome and the nothing-examined outcome."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_degraded_run_does_not_block_the_triggering_work
    target_dir: unit_tests/product_truth/
    description: "The caller is not stopped by a single unreadable input."
    type: integration
    angle: criterion
    framework: unittest
notes: |
  The unit of the rule is visibility, not blocking. Three distinct outcomes are required by
  this record together with UXP-700b-1: nothing-examined, degraded, checked-and-sound. A design
  that collapses degraded into either neighbour fails this record.
target_epic: EPIC-TruthfulProjectRecord
