it_requirements:
- Capability checks must cover harness tools and executor compatibility, not just an endpoint responding
  or a model claiming tool support.
- Availability failures preserve requested settings and expose an actionable diagnosis without credential
  contents or alternate-provider execution.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300b-1 (data handoff, not an additional build-order prerequisite): WorkerSettings
  {enabled:boolean, max_agent_calls:integer>=1, implementation:{executor:string, provider:string, model:string,
  endpoint:string, credential_ref:string|null}, reviewer:{executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, credential_ref:string|null}, settings_revision:string}.'
- 'Runtime interface from ACD-1300g-1 (data handoff, not an additional build-order prerequisite): ACEvidence
  {run_id:string, feature_id:string, ac_id:string, obligation_ids:string[], source_revisions:object, workspace_id:string,
  head_sha:string, changed_files:string[], checks:[{command:string, exit_code:integer, evidence_ref:string}],
  outcome:passed|blocked|failed}.'
- 'Runtime interface from ACD-1300g-3 (data handoff, not an additional build-order prerequisite): ReviewResult
  {run_id:string, review_id:string, review_number:1|2, executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, reviewed_sha:string, disposition:approved|changes_required|failed, findings:[{finding_id:string,
  ac_ids:string[], severity:string, description:string}], execution_id:string, evidence_refs:string[]}.'
test_spec:
- name: test_background_worker_invalid_capacity_and_credentials_block_enable
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: failure
  description: Parameterize zero/negative/noninteger limit and missing reviewer credentials; assert actionable
    setting-specific failure and zero admitted features.
  covers:
  - ACD-1300b-1-i
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_model_without_required_tool_execution_fails_closed
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: Use an endpoint that returns text but cannot complete read/edit/check tool round trip;
    assert blocked admission and no substitute executor.
  covers:
  - ACD-1300b-1-i
- name: test_background_worker_missing_runtime_has_consumer_diagnosis
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: failure
  description: Fresh consumer lacking a required harness/runtime gets a named missing prerequisite, not
    a dev-checkout import fallback.
  covers:
  - ACD-1300b-1-i
