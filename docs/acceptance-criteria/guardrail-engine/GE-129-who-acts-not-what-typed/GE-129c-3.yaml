id: GE-129c-3
title: "Every commit by a dispatched commit specialist leaves an audit record naming the run that approved it"
component: guardrail-engine
components:
  - commit_guardian
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, and the commit specialist dispatched in three runs:
    (a) by ticket-supervisor with a ticket path,
    (b) by the fast lane,
    (c) by finalize-feature's closure step,
  When it commits in each run,
  Then for each commit an audit record is persisted that names the commit's identifier, the
    dispatching run (the workflow or supervisor, and the ticket or acceptance criterion where the
    run has one), the caller identity the guard accepted, the commit subject and the files in the
    commit,
    And each record can still be read after its run has ended and the run's worktree has been
    removed,
    And searching the audit records for any one of the three commit identifiers returns exactly
    one record,
    And no record states a person's confirmation or a token as the approval.
depends_on:
  - GE-129c
  - GE-129a-1
