    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "When the parent record cannot be parsed or the parent id cannot be derived, the hook does NOT treat the tree as parked — a failed marker read never becomes a silent exemption."
  - name: test_store_walked_exactly_once_with_exemption_enabled
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The exemption lookup adds no additional store walk; the existing single-walk invariant still holds."
  - name: test_deployed_hook_exercises_exemption
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    description: "After build.py, the hook executed from the deployed .leafcutter/ path via run_hook.py produces the same two verdicts as the source copy — no ModuleNotFoundError, no fail-open fallback taken."
