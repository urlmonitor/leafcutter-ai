risk_surface: contract_boundary
notes: |
  THE STATIC HALF OF "NONE MAY BE WEAKENED" (TQ-500g criteria), added on the
  user's answer to Q1 (2026-10-22). TQ-500g-3-ii sees weakenings a run can see
  (skipped, expected to fail, gone). This AC sees the ones a run cannot: a test
  that still passes but asserts less, compares more loosely, or tolerates more.

  J IS THE CONTROL: adding an assertion, even a loose one, beside the existing
  strict one is strengthening and must pass. A check that stops every changed
  test brings back the blanket ban.

  LISTING DOES NOT EXEMPT. Every changed existing test is compared, listed or
  not; the list's 'strengthened' claim is the thing being checked.

  ACCEPTED STRICTNESS: a behaviour-preserving rewrite that lowers the count
  (for example two asserts merged into assert (a, b) == (1, 2)) also stops the
  work. There is no exemption entry; the writer keeps the assertions as they
  were or hands the test back. Revisit only if it proves noisy.

  NOT SEEN HERE (left to pr-reviewer): a widened expected literal under the same
  operator (== 200 becoming == 2000), a weakened helper or fixture that the test
  calls (fixture edits must be listed under TQ-500g-3-i but are not compared),
  and a tolerance that is not a plain number on both sides.

  TECHNICAL DETAIL FOR IT-PO (user's stated design, 2026-10-22)
  - Deterministic, static, AST-based; no pytest run, no LLM. Same check step as
    TQ-500g-3-i, same JSON object and exit code; no second CLI. Runs after -i's
    comparison and before -ii's runs (it needs no pytest).
  - Scope: every test (function or Class::method) present at --base-ref and
    in the working tree whose source changed, in the changed existing test
    files -i already computes.
  - Assertion count: assert statements + self.assert*(...) calls +
    pytest.raises(...) + pytest.approx(...) calls inside the test. Stop when the
    count drops.
  - Loosened comparison: a strict comparison (== or is inside an assert, and
    the strict self.assert* family such as assertEqual / assertIs) that is
    replaced by in, >=, <=, != (or is not / assertIn / assertGreaterEqual and
    similar) or removed. Suggested rule: per test, the count of strict
    comparisons must not drop; IT-PO to pin the matching rule and the strict
    and loose method lists.
  - Tolerance: for pytest.approx calls with rel= or abs= given as numeric
    literals on both sides, matched in source order within the test, stop when
    either grows. Adding rel/abs where the base had none counts as widened when
    the new value exceeds pytest.approx's default (rel 1e-6, abs 1e-12).
  - A test whose source does not parse on either side is already inconclusive
    under TQ-500g-3-i.

  USER APPROVAL (2026-10-22): criteria approved by user 2026-10-22 as written,
  answered directly by the user in the main session's AskUserQuestion;
  readiness set to approved.

  IT-PO ENRICHMENT (2026-10-22): THE MATCHING RULE, PINNED
  Count (a): assert statements + assertion calls (assert*-named callees,
  self.fail, pytest.fail/raises/warns/deprecated_call); pytest.approx is not
  counted. Loosened (b): strict comparisons (== / is in an assert, the strict
  assert* and mock *_with methods) are matched PER SUBJECT (the non-literal
  operand, unparsed), as a multiset per subject; a subject with fewer strict
  comparisons now than at the base stops. Per-subject matching catches an
  operator swap with equal counts (a multiset or count rule would not) and lets
  an inserted assertion pass (a per-position rule would not). Tolerance (c):
  approx calls paired by expected argument, rel/abs literal or pytest default,
  stop on any increase. Result: F, G, H, K, I, L stop; J passes.
  NOT SEEN (add to the pr-reviewer list): a dropped match= on pytest.raises, a
  widened places/delta on assertAlmostEqual, a non-strict form swapped for a
  looser non-strict form (>= 1 becoming >= 0), and everything listed above.
  ACCEPTED STRICTNESS (added): renaming the subject variable stops the work,
  like merging two asserts.

  USER DECISION (2026-10-22): per-subject matching stays. A renamed asserted
  variable stopping the work is accepted strictness; revisit only if it proves
  noisy.
  USER DECISION (2026-10-22): a dropped match= on pytest.raises, a wider
  places/delta on assertAlmostEqual, a looser non-strict form (>= 1 becoming
  >= 0) and a widened expected literal stay known gaps, left to pr-reviewer.

  USER DECISION (2026-10-22/23): RULE (D) ADDED TO THIS AC, built in this lane
  before commit (answered directly by the user in the main session's
  AskUserQuestion). An assertion that was unconditional at the base and, after
  the work, (1) sits under an if / while / try (including try: ... except
  AssertionError: pass and except Exception: pass) or inside a nested
  function, lambda or class that was not there at the base, or (2) comes after
  a newly added early return, pytest.skip(...), pytest.xfail(...), raise
  SkipTest or raise unittest.SkipTest in the same test, is reported as
  weakened and stops the work, even when the test is listed as strengthened.
  Deterministic, from the code alone, no run. Reported as
  "<file>::<test>  assertion now conditional" or "assertion after an early
  return|skip". Controls: an assertion already conditional at the base that
  stays so is not reported; a conditional assertion added beside the
  unconditional one (count goes up) is not reported. Readiness stays approved:
  the user approved adding the rule. The known-gaps list, as the user decided,
  is unchanged by this decision: a dropped match= on pytest.raises, a wider
  places/delta on assertAlmostEqual, a loose form made looser (>= 1 -> >= 0),
  and a widened expected literal.
  Reviewer-noted gap (not a user decision): broadened raises(Exception).

  IT-PO ENRICHMENT (2026-10-23): RULE (D) PINNED
  'for' and 'match' were added to the conditional forms by the orchestrator, as
  the same class as if/while (a loop can run zero times; a match may skip a
  case body). 'with' is excluded: a plain with block always runs its body.
  Assertions are matched base-to-now by normalised text (ast.unparse) in source
  order; a text present only after the work is new and not judged, which is
  what keeps P and Q quiet. The detail names the nearest guard
  ("under <kind>") or the exit ("return", "pytest.skip(...)", ...). The
  review-fix behaviours H-1, H-2, M-4 and M-5 (test_tq500g3iii_review.py) are
  folded into the rule (a)-(c) it_requirements.

  ACCEPTED CODER DEVIATION (rule b): when both operands of a strict comparison
  are literals (a tautology such as assert 1 == 1), the subject is the
  constant "<literal>" rather than the unparsed left operand. Accepted.

  SECOND REVIEW (2026-10-23)
  (1) Fixed test-first: reordering identical assertions that carry different
  guards is not loosening (pairing matches by guard signature first, then by
  normalised text in source order); keyword-argument forms of unittest
  assertions (assertEqual(first=a, second=1), mixed positional/keyword) carry
  the same facts as the positional form. Pinned by
  unit_tests/build_orchestration/test_tq500g3iii_review2.py.
  (2) Accepted consequence of the user's rename strictness: since the H-1
  symmetric subject, renaming EITHER operand of a two-non-literal comparison
  (for example result == expected -> result == expected_value, or a renamed
  loop variable) reports "== removed".
  (3) Reviewer-noted gaps outside the pinned rule (not user decisions):
  - exits beyond the closed list: sys.exit, os._exit, pytest.exit,
    pytest.importorskip, an aliased or bare skip(), a helper that skips,
    raise Exception;
  - @pytest.mark.skip / skipif / xfail decorators added to the test;
  - with contextlib.suppress(AssertionError) (with is not a guard);
  - an already-guarded assertion gaining another guard, or a second or
    different exit before an already cut-off assertion;
  - a nested def that is then called is still reported "under function"
    (false positive by rule);
  - x == 1 -> x == pytest.approx(1, rel=0.5);
  - assertEqual -> assertAlmostEqual, places=, nan_ok;
  - 0 < x < 5 -> 0 < x;
  - the symmetric subject key joined with ' | ' can collide with a BitOr
    expression text (harmless).

  EQUIVALENT WRONG VERSION REMOVED (2026-10-23): the must_catch "new test
  compared against an empty base" was dropped from
  test_only_changed_tests_present_on_both_sides_compared. It is an equivalent
  wrong version: _cs_edits.compare_file never yields an Edit for a newly added
  test (kind 'added' only for non-test names), and even an in-process 'added'
  edit against an empty base cannot produce any loosened item (no fewer
  assertions, no strict base facts, no base approx, no base sites), so no
  test can catch it. The scope guard it names is enforced upstream by
  TQ-500g-3-i.

  MUST_CATCH MOVED (2026-10-23): "output order depends on set or dict
  iteration" moved from test_static_and_deterministic to
  test_listing_does_not_exempt_and_unlisted_reported_alongside. The wrong
  version survived the former: it compares two runs with each other, and two
  runs of a set-ordered output can coincide by chance. The latter pins the
  exact file order of the eight items, so it catches the wrong order.
