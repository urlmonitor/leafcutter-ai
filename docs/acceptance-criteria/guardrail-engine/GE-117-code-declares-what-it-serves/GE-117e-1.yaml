  - "2026-10-22 [business-analyst, user-directed (BrainCandy)]: criteria only. Named the 'surrounding commit context' explicitly: the ticket the workspace maker records for the branch (branch.<branch>.leafcutterTicket, written for ticket workspaces per docs/reference/workspace-maker-answer.md) and that ticket's source_ac frontmatter (scalar or list, per real tickets). Split the AC scenario into (a) exactly one existing AC id -> insert; (b) none, several, or one unresolvable id -> no insertion, defer to GE-117e-1-i; (c) no recorded ticket, or recorded ticket file absent -> no insertion, never from commit message or branch name, report the missing record. Component scenario, title, depends_on, req_status and readiness unchanged."
  - "2026-10-22 [it-po, user-approved (BrainCandy)]: aligned technical fields with the amended criteria. it_requirements[2] now names the AC source precisely (branch.<branch>.leafcutterTicket, then that ticket's source_ac, single value or list), treats a missing recorded ticket file as no record, and keeps the never-commit-message/branch-name rule and GE-124c-2-i resolution. test_spec: the single-AC test's fixture now records a ticket whose source_ac is one id in the temp store; added test_ge_117e_1_single_declared_ac_not_in_store_inserts_nothing for case (b)'s unresolvable single id; the commit-message boundary test now asserts the 'no declared record' report and covers a recorded ticket path whose file is missing. readiness draft -> approved on the user's approval. criteria, title, depends_on and req_status untouched."
