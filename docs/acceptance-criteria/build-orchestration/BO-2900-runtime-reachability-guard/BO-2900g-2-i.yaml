notes: |
  This L3 exists because the parent AC's central property — DERIVED, not
  backfilled — is invisible in any single record. A record that carries the
  declaration looks identical whether it was derived at authoring time or set by
  a sweep three weeks ago, so every test that inspects one record passes on the
  sweep-only implementation. The discriminating observation is a SECOND record
  authored after the sweep, by an author with no knowledge of the field.

  THE LAST CLAUSE IS THE ONE THAT CANNOT BE FAKED. Requiring the guarantee to
  hold when the sweep was never run removes the sweep from the causal chain
  entirely. An implementation that satisfies the first three clauses by running
  the sweep on every authoring pass fails this one, and it should: re-deriving
  the whole store on every author is not the same guarantee and does not survive
  the store growing.

  This is deliberately the same test shape as BO-2900f-1's entry-count
  invariance across an all-enabled and an all-disabled run: assert a property
  across two runs that differ in exactly the suspected cause, rather than
  inspecting one run's output.

