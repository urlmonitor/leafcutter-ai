notes: |
  THIS IS THE AXIS THAT ACTUALLY LOCATED THE RECORDED DEFECT, and it is not a
  presentation preference. In KI-TQ-010 three of four sibling tests objected to the
  injected fault and the fourth — the one carrying the piece of work's headline claim
  — did not. A single combined verdict would have said "the suite catches it" and
  that test would still be inert today.

  WHY PER ALTERATION AND NOT ONLY PER TEST. The recorded table has three alteration
  columns, and the collapse survives one level of aggregation: the second test
  objected only under the second alteration and the fourth only under the third. A
  record giving one verdict per test across all alterations hides which alteration a
  test is blind to, and an alteration that no test objected to at all becomes
  invisible the moment any other alteration was caught.

  THE FOURTH CLAUSE IS NOT PEDANTRY. In the recorded table, three of the four cells
  in the last column are dashes — those tests were never exposed to the third
  alteration. Recording "not exposed" as "did not object" would have marked three
  sound tests inert and produced exactly the flood of false findings whose only
  natural remedy is to switch the check off.
