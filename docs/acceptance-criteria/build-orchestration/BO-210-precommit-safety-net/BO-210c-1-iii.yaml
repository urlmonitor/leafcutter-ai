created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given the safety-net feature adds or edits agent and skill templates (for example the
    auto-fix skill, the sign-off skill, and the commit agent template),
  When a reviewer scans every bash command block in those new or edited templates,
  Then no command chains with the and-and operator, the semicolon, the or-or operator, or a pipe
    into another command,
  And no command uses a directory-change as a prefix to another command,
  And each documented command is a single simple invocation, so it matches the project's
    auto-allow shell convention.
