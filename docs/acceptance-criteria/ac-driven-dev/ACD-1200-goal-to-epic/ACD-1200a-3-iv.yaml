id: ACD-1200a-3-iv
components:
  - ac_driven_dev
readiness: draft
priority: medium
title: "The epic name ends on a word that means something, not on an article or preposition"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/ac-driven-dev/ACD-1200-goal-to-epic/ACD-1200a-3.yaml"
criteria: |
  This AC complements ACD-1200a-3-iii, which requires the derived epic name to be cut only at a
  word boundary. That requirement is met by a name ending "...InThe" — it is a complete word,
  correctly bounded. This AC adds the requirement that the final word carry meaning on its own.

  Given the concise-title summariser is unavailable, so the epic name is derived by truncating
    the goal AC's title,
  And a goal AC whose title produces the PascalCase form
    "WiringReconciliationActuallyLandsInTheStore", which exceeds the length cap,
  When the epic folder name is derived,
  Then the derived name does not end on a function word — no article, preposition, conjunction
    or auxiliary verb is its final word,
  And it ends instead on the last meaning-carrying word that fits under the cap, giving
    EPIC-WiringReconciliationActuallyLands rather than EPIC-WiringReconciliationActuallyLandsInThe,
  And the length cap is still respected,
  And the cut is still at a PascalCase word boundary with no partial word, no dangling separator
    and no empty segment, so ACD-1200a-3-iii is not regressed.

  And Given a goal AC whose title produces a PascalCase form in which no meaning-carrying word
    fits under the cap at all,
  When the epic folder name is derived,
  Then the derived name is still non-empty and is still a usable folder name — dropping trailing
    function words never yields a bare prefix with no name after it.

  And Given every acceptance-criterion title currently held in this repository's own store,
  When each one is put through the same derivation with the summariser unavailable,
  Then no derived name ends on a function word.

  Coverage note: covered only by a test that exercises the derivation with the summariser
  UNAVAILABLE. When the summariser answers, the name it returns is used instead and this defect
  cannot appear, so a test that lets the summariser run passes on the broken fallback and proves
  nothing. The store-wide sweep is a no-regression leg and cannot stand alone either — it is
  vacuous on any day when no title in the store happens to truncate onto a function word. The
  reported case must be exercised as an explicit input.
