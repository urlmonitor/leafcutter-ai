id: BO-2500a-8-iv
components:
  - build_orchestration
  - ac_store
title: "Every unfinished test-free record with no reason is sorted into a class first; records in a class the user gives reasons get their own hand-written reason, approved in batches, and every other record is listed with the user's decision"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the unfinished records declared test-free with no stated reason, measured
    2026-11-01 over docs/acceptance-criteria, active records only, reason counted
    present when non-empty after whitespace stripping: 97 records, 94 with
    work_status todo and 3 with work_status in_progress (ACD 35, BO 19, DK 19,
    ACS 14, GE 8, BP 2), and measured again by the same rule when the backfill
    starts,
  When the backfill is carried out,
  Then every record in the starting population is sorted into a class before any
    reason is proposed, and the user decides by class whether that class gets
    reasons,
  And records with change_target prompt are given no reason: they are listed on
    the decision list as one class, to be proved by eval cases, and need no
    per-record decision,
  And a reason is proposed only for a record in a class that gets reasons, and is
    written for that record alone, naming what its deliverable is, the judgement
    no test can make about it, and what verifies that judgement instead,
  And a reason may cover a record's prose clauses; it need not claim that every
    clause of the record is out of a test's reach,
  And a deliverable has behaviour a test can observe only when a test could fail
    for a reason outside the page's own text, that is by comparing the deliverable
    to a real artefact or by running its example through a real hook or step; a
    check that only matches words on a page or the shape of a diagram does not
    observe it,
  And no two records are given the same text, and no text is produced by filling
    a template from change_target or any other field,
  And proposed reasons are shown to the user in batches, each entry listing the
    record id, its title, its change_target and the proposed reason, and a reason
    is written to a record only after the user has approved the batch holding it,
  And a record for which the user rejects the reason, or for which no honest
    reason can be written because its deliverable has behaviour a test can observe,
    is not given a reason and is listed on the decision list with that finding for
    the user's decision,
  And the records of a class the user decides gets no reason are listed on the
    decision list with that decision,
  And a record given a reason by this backfill is not marked done until BO-2500f-4
    is built; the reason alone does not release it,
  And when the backfill ends, every record in the starting population either
    carries an approved reason or appears on the decision list with the user's
    decision recorded, for the record or for its class,
  And the 46 finished test-free records with no reason are not given a reason by
    this backfill; they go to TQ-400d triage or to the wave-2 migration
    (BO-2500f-4-ii), so a finished claim is never justified after the fact by a
    sentence,
  And the run reports the count of records given a reason, the count listed for a
    decision, and the measurement date and inclusion rule of the starting
    population.
depends_on: [BO-2500a-8, BO-2500a-8-i]
