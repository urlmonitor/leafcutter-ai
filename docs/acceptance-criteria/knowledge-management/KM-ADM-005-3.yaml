id: KM-ADM-005-3
components:
  - knowledge_management
  - testing_quality
title: "A finished L0, L1 or docs-only composite whose children the done gate proves leaves the untagged-done count, named, under a ground that says tags were read and tests were not run"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the untagged-done ratchet, which counts finished records that no test tags
    and already excludes records under the grounds "superseded" and "waived: declared
    test-free with a stated reason" (KM-ADM-005-1),
  And a finished record that carries no covers tag of its own and whose covered_by
    lists at least one acceptance-criterion id as a child (a composite),
  When the ratchet measures its count,
  Then the composite leaves the count under the ground "proved through its children
    (tags read, tests not run)" only when all three of these hold:
      (a) the done gate's own composite rule, looked up when the ratchet runs and
          given the set of ids tagged by the done gate's own covers-tag pattern, finds
          no unproven child;
      (b) its covered_by is complete: every live (not superseded) record on disk
          whose parent is this record is listed in it;
      (c) it is level L0 or L1, or its change_target is exactly "docs",
  And every finished record is placed in exactly one bucket, tested in this order:
    tagged, superseded, waived, proved through its children, untagged,
  And a finished L1 X-100a whose children X-100a-1 and X-100a-2 are both finished and
    each tagged by a collected test leaves the count under the new ground,
  And a finished L1 X-100a whose child X-100a-2 has work_status todo stays counted,
    even when X-100a-2 carries a covers tag,
  And a finished L1 X-100a whose finished L2 child X-100a-1 is itself an untagged
    composite with an unfinished or untagged child X-100a-1-i stays counted,
  And a finished L2 X-100a-1 whose change_target is code, schema, pipeline, config or
    prompt stays counted while it has no covers tag of its own, even when every one of
    its children is finished and tagged,
  And a finished L2 X-100a-1 whose change_target is "docs" and whose children are all
    finished and tagged leaves the count under the new ground,
  And a finished L1 X-100a whose covered_by lists X-100a-1 but omits a live child
    X-100a-2 that exists on disk stays counted, while a superseded child X-100a-3
    missing from covered_by does not keep it counted,
  And a child whose only mention of its id is a prose "covers:" line that the done
    gate's covers-tag pattern does not accept does not prove its parent, even when
    the ratchet's own tag reading counts that child as tagged,
  And when the done gate's composite rule is replaced at run time by one that reports
    an unproven child for every record, a composite that left under the new ground is
    counted untagged again, and when it is replaced by one that reports none, a
    composite with an unfinished child leaves the count if (b) and (c) hold,
  And the ground's published wording states that the children's tags were read and
    their tests were not run, and never states or implies that any test passed,
  And the ratchet's published measurement lists, by id, each record excluded under
    this ground, beside the ground's count,
  And the new ground is on the published list of legitimate grounds (ACS-1100b-1),
    and untagged plus every exclusion count plus tagged still equals the number of
    finished records enumerated,
  And in the same change the recorded high-water mark is lowered to the count
    measured at build time, with that measurement's date, commit and inclusion rule
    recorded beside it, and is never left at the old value or raised.
depends_on: [KM-ADM-005, KM-ADM-005-1]
