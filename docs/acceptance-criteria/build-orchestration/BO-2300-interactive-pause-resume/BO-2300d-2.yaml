criteria: |
  A sequence diagram documents the pause -> ask -> answer -> resume interaction
  across the workflow engine, the durable pending-question store, and the
  answerer, showing:
    - the run reaching an interactive gate and pausing instead of cancelling;
    - the structured question (declared type + valid answer shape) plus the
      context snapshot captured at pause time being emitted and persisted to the
      durable store;
    - the answerer being shown the context and supplying an answer;
    - the answer being validated against the declared type (wrong-shape or
      unparseable answers re-prompting) and, when valid, applied by type;
    - the run resuming from the pause point with earlier committed stages
      preserved.
  A reader can follow one full round-trip from pause to resume, including the
  cross-process durable-wait case.
depends_on: [BO-2300a-1, BO-2300b-1, BO-2300c-1, BO-2300d-1, BO-2300e-1]
