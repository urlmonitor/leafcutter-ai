criteria: |
  Given the publishing flow and its corrections,
  When the state diagram is drawn,
  Then it shows the states staged, published (in review, then merged) and superseded,
  And its transitions are: publish, from staged to published; keep staged, an end state that is
    never found as precedent; merge; and correct, from published to superseded when a later
    decision is published with --correct,
  And superseded is drawn as an end state with no way out of it, labelled "kept on record,
    corrections appended only".
