  - "Must maintain a configurable mapping of package names to framework identifiers (not hardcoded inline)"
  - "Must handle errors gracefully when manifest files contain invalid syntax"
  - "Must not perform source code analysis (import parsing) — manifest-only detection"
  - "Must produce deterministic output for the same set of manifest files"
