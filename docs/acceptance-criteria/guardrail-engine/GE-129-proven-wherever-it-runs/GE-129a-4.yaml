assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    THE PAIRING CLAUSE COSTS A REAL DECLARATION AND THAT COST IS PART OF THIS RECORD. At least
    one genuine session guard — one that really does deny a tool call — must be declared in the
    section GE-129a-2 establishes and genuinely examined in the change that lands this. A fixture
    cannot stand in; the clause's whole value is that the report distinguishes this tree's inert
    guard from a live one standing beside it on the same surface, which no fixture pairing can
    do. Affordable candidates observed on this surface: enforce_commit_delegation, wired
    PreToolUse on the Bash matcher and documented in CLAUDE.md as blocking a direct `git commit`;
    and inline_work_guard, wired PreToolUse on Edit|Write and reported in this workspace as
    hard-blocking file-mutating one-liners. VERIFY THE CANDIDATE BEHAVES AS DESCRIBED BEFORE
    RELYING ON IT — a pairing guard that turns out not to deny anything either would make this
    clause unsatisfiable at the last moment, and the two guards above are named here as leads,
    never as findings.
  - >-
    THE COPY EXAMINED IS THE ONE THE ENTRY'S COMMAND RESOLVES TO, AND RESOLUTION IS PERFORMED,
    NOT ASSERTED. The entry walks up from the current directory to an installed hook directory,
    so the target is not a fixed path and must not be written as one. Perform the walk-up from
    where the editor would run, report the absolute path it landed on, and assert that path is
    what was loaded. A test that hard-codes either templates/hooks/... or .claude/hooks/... has
    asserted a constant, not a resolution — and resolving through those links is the very
    mechanism that made the worked example inert, so getting this wrong reproduces the defect
    inside the machinery built to find it.
  - >-
    THE SURFACE READ AND THE GUARD EXAMINED MUST COME FROM THE SAME LAYOUT IN THE SAME SWEEP.
    GE-129a-1 owns which copy of the settings surface is enumerated and states the path it read;
    this record owns which copy of the guard is loaded. Assert the two agree rather than assuming
    it. Enumerating one repository's entries while examining another's produces a full, plausible
    and entirely wrong report, and nothing else in the tree would catch it.
  - >-
    NO VERDICT MAY BE HARD-CODED FOR A GUARD RECOGNISED BY NAME — this is what makes naming a real
    script in a criterion non-expiring, and it is the clause most easily defeated by a convenience
    branch. The implementation must contain no mapping from a guard's name to an expected state,
    no allowlist, and no special case for readme_read_guard. The record does not assert that guard
    is inert; it asserts that whatever is reported about it is what its own examination produced,
    which stays true and stays meaningful on the day it is repaired.
  - >-
    DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME AND MUST NOT BE PRE-SUPPRESSED. On the landing
    commit most session subjects will report that no attempt has ever been made, because none
    has. Do not seed records, do not write exemptions ahead of the first run, and do not add the
    pairing guard's declaration in a way that quietly also declares the others. A postponement is
    not a ground for an exemption.
  - >-
    THE REAL-SURFACE SWEEP MUST NOT BE ABLE TO DEGRADE SILENTLY INTO EXAMINING NOTHING — ADR-045
    §7's governing test applies to this record too, and its in-criteria pairing clause is an
    IN-REGIME guard, which §7 explicitly says is not enough. The independent, out-of-regime guard
    for the non-empty real population lives on GE-129a-1's §7 descriptor; this record must rely on
    that one rather than growing a second, and must not satisfy its own non-empty precondition by
    asking the liveness run.
  - >-
    AC_ENFORCE_STRICT=1 on every pytest invocation below. The sweep must not mutate the repository
    it examines (GE-129a-3's constraint applies unchanged here, where the surface is real rather
    than a fixture, and matters more for exactly that reason). Error-handling policy applies to
    the resolution walk-up and the subprocess calls: specific exception types, logged at WARNING or
    higher or re-raised. A failed resolution is `blocked` and is reported by name; it must never
    become an absent subject.
test_spec:
  - name: test_ge129a4_the_worked_example_is_examined_on_the_real_surface_and_reported_as_unproven_beside_a_guard_that_refused
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      THE RECORD'S ACCEPTANCE SHAPE, AND BOTH HALVES BELONG TO ONE RUN. Over the repository's REAL
      settings surface and the resolved copies: assert readme_read_guard is among the reported
      subjects, that the state reported for it is the one its own examination produced, and that
      while it allows its declared input through it is absent from anything the run describes as
      protecting the work. IN THE SAME RUN, assert at least one OTHER guard the same real surface
      names is reported as having demonstrated its refusal. Read both verdicts from the run's own
      output; assert neither against a literal. Without the second half the first is satisfied by a
      run that reports every real guard as unproven.
  - name: test_ge129a4_the_examined_copy_is_the_one_the_entrys_command_resolves_to
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      Assert the run states which copy of each guard it loaded, that the stated path equals the
      path the entry's own command resolves to when executed from where the editor runs, and that
      no other copy was examined in its place. NAMED MUTATION (mandatory, run it): examine the
      canonical copy under templates/ instead of the resolved one. Under that injection the run
      still produces a full, plausible report and every other descriptor in this record stays
      green — only this one goes RED. That asymmetry is the point; record both sides of it.
  - name: test_ge129a4_the_enumerated_surface_and_the_examined_guard_come_from_one_layout
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      Assert the settings-surface path GE-129a-1's reader reported and the guard paths this
      record's examination reported belong to the same layout root. PAIRED: construct a layout in
      which they would differ (a deployed copy whose settings surface and hook directory are out
      of step) and assert the run refuses or reports the mismatch by name rather than producing a
      report that looks ordinary.
  - name: test_ge129a4_the_reported_state_moves_when_the_guard_is_repaired_and_no_verdict_is_hard_coded
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE NON-EXPIRY DESCRIPTOR, AND THE ONE THAT KILLS A NAME-KEYED IMPLEMENTATION. In a
      disposable copy of the real layout, change the guard so its declared input IS stopped,
      leaving its declaration byte-identical, and assert the run reports it as having demonstrated
      its refusal; revert and assert it returns to not-demonstrated. Assert the declaration bytes
      are identical across both runs and that the altered file is the same path the run reported
      loading. An implementation that recognises this guard by name and reports a fixed verdict
      fails here and passes everything else.
test_rationale: |
  Three fixture-based siblings already specify this mechanism, and every one of them can be
  satisfied in full against a fixture surface while the real one is never read — which is not
  hypothetical, it is how this family's own machinery came to have a motivating example it cannot
  see. So the descriptors above are the only ones in the tree that run against the repository as it
  actually stands, and they are written so that no clause is satisfiable by a report that merely
  looks complete.

  Two of them exist to defeat specific cheap implementations rather than to cover a Then clause.
  The resolution descriptor defeats an examination of the canonical copy, which produces a report
  indistinguishable from a correct one. The repair descriptor defeats a name-keyed verdict, which
  is the natural shortcut once a real guard is named in a criterion, and it is what keeps that name
  from expiring the day the guard is fixed.
delivers_to:
  - ac_id: GE-129a-4-i
    contract: >-
      The resolution of the real surface to the copy the entry's command reaches, and the
      examination performed against that copy. GE-129a-4-i requires that resolution to be
      performed once per layout rather than once overall, since it is the resolution itself that
      differs between layouts. Added at enrichment: GE-129a-4-i already declared this expectation
      from its side and the producing side read null.
expects_from:
  - ac_id: GE-129a-3
    contract: >-
      The observation: an input presented as the event presents it and a verdict read as the
      protected surface reads it. This record requires that observation to be made against the
      real surface and the resolved copy, rather than against a stand-in.
