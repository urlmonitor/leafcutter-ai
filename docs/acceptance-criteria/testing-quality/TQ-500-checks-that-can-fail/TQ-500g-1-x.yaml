  - path: docs/acceptance-criteria/testing-quality/TQ-500-checks-that-can-fail/TQ-500g-1-v.yaml
    relationship: relates-to
    status: exists
    relevance: "The fast-lane route that calls the list step and passes the base ref; the first route this fallback unblocks."
  - path: docs/reference/ac-schema.md
    relationship: describes
