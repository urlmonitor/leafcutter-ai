criteria: |
  Given the tree traversal for goal ACD-050 has identified 3 leaf ACs:
    - ACD-050a-1 (title: "Validate input schema")
    - ACD-050a-2-i (title: "Reject oversized payloads")
    - ACD-050b-1 (title: "Return 404 for unknown IDs")
  When the system generates tickets for the collected leaves,
  Then it produces exactly 3 ticket files (one per leaf AC)
  And each ticket file contains the ac_coverage field referencing its source AC ID
  And each ticket's title derives from the source AC's title
  And the ticket generation uses the same mechanism as the single-AC /build-ac path
    (generate_ticket_from_ac.py per AC).
