criteria: |
  A deliberate exception, recorded in the open — never a silent one.

  Some screen files genuinely render no requirement of their own, and some parts
  of the product are not ready to be held to this yet. You can excuse either
  case, but only on purpose: a skipped file carries a written reason that shows
  up in the change for a reviewer to challenge, and a relaxed area is listed
  somewhere a person can find it.
