id: BP-1500h-1
title: "A file-location setting left empty is treated as 'not configured' by every part of the build, and said once"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a scratch consumer project whose settings file sets a file-location
    setting to the empty string -- for example `changelog_categories_path: ""`
    -- and every other setting to a working value,
  When the build installs the package into that project,
  Then the build passes,
    And no line of its output reports an attempt to open the project folder as a
      file (no "Is a directory", no "could not read <project folder>"),
    And the output says, exactly once for that setting, that it is not
      configured, naming the setting,
    And every step of the build that reads that setting -- the step that checks
      configuration scaffolds for staleness, the step that installs
      configuration scaffolds, and the referential-integrity check -- treats the
      feature as off: none of them reads, writes or checks a file for that
      setting, and no scaffold for it is installed, not even at the shipped
      default location,
    And, by contrast, when the setting is absent altogether those same steps
      use the shipped default location for it -- the scaffold is installed
      there and the steps that read it read it -- and no "not configured" line
      is printed for it,
    And the same holds for every file-location setting the build reads, not only
      the example.
