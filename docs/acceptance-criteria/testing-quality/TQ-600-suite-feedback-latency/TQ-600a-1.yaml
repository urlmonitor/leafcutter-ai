notes: |
  THE MEASURABLE IS A COUNT, NOT A DURATION. Wall clock on this workspace is
  contaminated — the profiling run shared a WSL host with other agent activity, so
  a criterion phrased as "the suite is faster" is unfalsifiable here on a bad day
  and falsely satisfiable on a good one. The number of real package deploys
  executed in a run is host-load-independent and is the thing the change actually
  controls. Assert the count.

  WHERE THE COUNT LIVES. The figure itself, the bound it must satisfy, and the
  obligation to emit it into the run's own output and into the TQ-600c-1 cost
  record are TQ-600a-6, split out of this record. This one owns the behaviour; that
  one owns the audit. They fail independently, which is why they are separate: a
  fixture that deploys once and reports a hardcoded 1 satisfies this record and
  defeats every use of the figure, and a faithful counter over a per-worker build
  satisfies that record and defeats this one.

  "ONCE PER RUN" MUST NOT SILENTLY MEAN "ONCE PER WORKER". A pytest session-scoped
  fixture runs once per xdist worker, not once per run. TQ-600b-5 makes parallel
  execution the default, so the obvious implementation of this record produces the
  layout N times at a measured 59.8s each and gives back most of what this L1
  recovers — while still reading as "session-scoped, produced once" in the source.
  The resolution stated in the criteria is a lock plus a run-scoped directory shared
  across workers: the first worker to ask produces, the rest wait. TQ-600a-6's
  whole-run figure is what makes a regression to a per-worker build visible, because
  the reported count then rises to the worker count instead of staying at one.

  THE LIMIT IS DELIBERATELY NOT "EVERY TEST SHARES ONE LAYOUT". Collapsing every
  test onto a single layout is the wrong answer and is ruled out by TQ-600a-2 —
  see the read-vs-mutate boundary in the parent L1's notes. That is why TQ-600a-6's
  bound is one plus the tests routed to a copy of their own, not one.
