id: INF-500d-4-x
components:
  - infrastructure
  - knowledge_system
title: "The per-machine log-root declaration is kept out of git, so a repository that commits its install never ships one machine's paths to another"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build writes the log-root declaration (config/knowledge_sink.json under the
    install's output root), which records absolute paths that are only true on the
    machine that ran the build,
  And the consumer repository tracks its install directory in git,
  When the build finishes,
  Then the install's config directory carries an ignore rule that keeps the
    declaration out of git, so `git status` in that repository never lists the
    declaration as a new file and `git add` of the install directory never stages it,
  And the rule names only the declaration, so every other file in the config
    directory stays committable as before,
  And running the build again leaves exactly one such rule and keeps any other line
    already present in that ignore file,
  And the declaration itself is still written with absolute paths, unchanged, because
    ADR-069 requires one absolute durable root that outlives every workspace,
  And the bug symptom ("another checkout receives a declaration naming a root that
    does not exist there, so the knowledge writers refuse it as stale until the next
    local build") does not occur for a repository that adds its install after this fix.
