title: "Non-problem categories take no fix action; success-pattern is offered for codification"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given three unresolved entries:
    - F1 with category: complete
    - F2 with category: success-pattern, note describing a reusable approach worth keeping
    - F3 with category: success-pattern, note describing a one-off observation with no reusable content
  When the router classifies each,
  Then F1 (complete) is treated as a non-problem and routed to neither /quick-fix
    nor /create-ac — it is resolved with a note that no fix work was required,
  And F2 (codifiable success-pattern) is routed to /create-ac so the reusable
    approach becomes a documented acceptance criterion,
  And F3 (non-codifiable success-pattern) is resolved with a note that the
    observation needs no follow-up artifact,
  And in no case is a bug-fix or feature build dispatched for a complete-category entry.
depends_on: [ACD-1500a-2]
