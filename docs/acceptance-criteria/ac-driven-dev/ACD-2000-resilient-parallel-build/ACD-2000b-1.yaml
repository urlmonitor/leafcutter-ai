it_requirements:
  - "EXTEND, DO NOT REPLACE. Canonical source is scripts/build_orchestration/fast_lane.py -- claim_build_set (~line 128) and release_claim (~line 224). No lockfile, no separate claim registry, no second status vocabulary (ACD-2000b's standing instruction)."
  - "THIS IS A REAL CHANGE, NOT A RESTATEMENT OF WHAT EXISTS. Verified: today's claim writes work_status: in_progress and nothing else -- no owner, no instant. The first Then clause is already satisfied; the second and third are satisfied by no code in the repository."
  - "The claim must record an OWNER IDENTITY and a CLAIM INSTANT, both readable by an unrelated process from the requirement record alone. The instant must be timezone-explicit (UTC, ISO-8601); a naive local timestamp is unusable for the staleness judgement ACD-2000b-3 builds on it."
  - "Owner identity must stay meaningful to a DIFFERENT process on a DIFFERENT host or worktree. A bare process id is not sufficient -- pids are reused and are meaningless across hosts and worktrees. Record enough to identify the effort (host, process, run identity) plus which entry point took it."
  - "THE NEW FIELD IS BLOCKED ON ACD-1900a-1's ADDITIVE SLOT. config/ac_store_schema.json sets additionalProperties: false and it IS enforced today (jsonschema.Draft7Validator in scripts/ac_store/validate_ac_schema.py ~line 152 and in the check_ac_schema commit hook -- verified empirically). Writing a claim field before its optional slot exists makes every claim produce a schema-invalid record and blocks commits repo-wide. Land the slot first."
  - "DECISION RECORDED (ACD-2000b hazard 4): the claim is a DEDICATED record, not a further overload of work_status. Rationale -- a lifecycle value may be set by anyone, a lock may be released only by its holder; overloading makes every work_status writer an unwitting lock manipulator. ACD-2000b-1-i asserts the consequences of this choice."
  - "DUAL-WRITE DURING THE MIGRATION. Keep writing work_status: in_progress alongside the new claim record while ac_unit_of_work.enforce is false. scan_ac_store's ready filter matches a single work_status value (default todo), so a claim that stops flipping work_status silently makes claimed requirements ready again -- a regression introduced by the fix itself. The dual write retires at the enforce stage, not here."
  - "ONE RECORD, BOTH CALLERS, ENFORCED IN SHARED CODE. The take and the read must live in a shared store-level helper that BOTH the single-requirement fast path and the general drive already pass through -- not as an added step in templates/skills/building-epics/SKILL.md. A prose instruction to remember to claim is unenforceable, and the fast-lane-claims-while-the-drive-does-not-look split is precisely the gap this AC closes."
  - "HANDING BACK MUST CLEAR OWNER AND INSTANT, not merely flip the status. A released record that retains a stale owner makes ACD-2000b-3's staleness rule read a dead owner as a live one, which is worse than having no reclaim rule."
  - "PRESERVE THE REST OF THE RECORD. Every claim and release currently round-trips the whole AC through yaml.safe_load -> yaml.safe_dump (_update_ac_work_status, ~lines 113-125). The claim write must leave every other field byte-stable, because ACD-2000a's adjudication trail passes through this same write on every claim."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file and YAML I/O in typed try/except and log-or-reraise; no bare except, no silent swallow."
  - "Canonical source only -- scripts/build_orchestration/ and scripts/ac_store/. Never edit a deployed .claude/ or workspace-parent build-output copy."
