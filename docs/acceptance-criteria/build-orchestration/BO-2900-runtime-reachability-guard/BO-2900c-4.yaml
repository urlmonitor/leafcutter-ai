notes: |
  Two invariants that share one root cause — the check is only as good as the two sets
  it compares — kept in one AC because testing either requires the same fixture
  scaffolding, and separating them would produce two ACs neither of which stands alone.

  - DERIVED COVERAGE, NOT A REGISTERED LIST. A guard that walks a hardcoded list of
    automation scripts protects exactly the scripts someone remembered to add. The new
    script — the one written by someone who has not read this tree — is the one that
    goes unchecked, and its absence is invisible: the check reports zero findings and
    looks healthy. The scenario is written as "add a script, edit no list" precisely so
    a list-based implementation fails the test.

  - FAIL CLOSED ON AN UNREADABLE SURFACE, AND FAIL QUIETLY IN THE RIGHT WAY. If the
    command surface cannot be interrogated, the registered-capability inventory is
    empty. A naive reverse check then reports EVERY invocation in the repository as
    naming a nonexistent capability — a wall of false findings that discredits the
    guard on its first bad day, and which an operator clears by disabling it. The
    correct behaviour is the opposite pairing: refuse the change (do not pass silently
    on an inventory you could not build) but report the cause, not the symptoms. That
    pairing — refuse, and suppress the derived findings — is the whole content of the
    second scenario, and it is easy to get half right.

  Note the deliberate asymmetry with BO-2900b: the forward check on an empty inventory
  reports nothing and passes vacuously (see BO-2900b-2), which is safe because there is
  genuinely nothing to strand. The reverse check on an empty inventory would report
  everything, which is not safe. Same empty inventory, opposite correct responses. An
  implementer who unifies the two behind one "empty inventory" branch will get one of
  them wrong.

  Verification must EXECUTE the check with the surface made uninterrogable, and assert
  both that the change is refused and that no per-invocation findings were produced.

  2026-08-13 (IT PO enrichment). One distinction added that the criteria imply but do
  not name: "the surface could not be established" and "the surface was established and
  is empty" are DIFFERENT conditions with different correct responses, and the seam must
  return them as different outcomes. Collapsing them into a single empty set is the
  mechanism by which the forbidden unification happens in practice.
