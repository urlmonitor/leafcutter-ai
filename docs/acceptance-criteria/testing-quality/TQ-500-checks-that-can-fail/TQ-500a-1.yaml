notes: |
  THE SECOND THEN CLAUSE IS THE HARD NON-GOAL, WRITTEN AS A REQUIREMENT. KI-TQ-010
  states plainly that the affected family of work cannot be spotted from the text
  of a requirement — an absence-shaped expected outcome, a zero-location rule, and
  the phrase "negative control" are each suggestive and none is dependable. So the
  clause does not merely omit classification: it forbids the requirement text from
  being an input at all. TQ-500a-1-i is its falsifiable half, and it is written so
  that an implementation which quietly classifies fails it.

  ONE ANSWER PER PIECE OF WORK, NEVER PER RUN — carried forward from BP-1100g-5,
  whose predecessor BO-1000b-1-i shipped a double-recording defect for exactly this
  reason. A run-level answer lets one piece of work inherit another's.

  DELIBERATELY NOT SPECIFIED HERE: what a good alteration is. That is the writer's
  judgement, guided by TQ-500d-2. This AC specifies only that the answer exists,
  is singular, is declared, and rides the record that is already read.
