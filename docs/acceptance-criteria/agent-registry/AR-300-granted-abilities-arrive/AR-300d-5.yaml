notes: |
  WHY ONE L2 COVERS ADD, REVOKE AND NEW-AGENT. AR-300d was at 4 of 5 L2s; the
  abilities side spends three L2s (d-1 new agent, d-2 added, d-3 revoked) plus
  d-4 (no marker). This takes the last slot and states all three cases for
  sub-agents in one record. The ticket-phase macro case -- the one that justifies
  keeping the macro as a macro -- is its own L3, AR-300d-5-i.

  THE CHEAP FIX THIS FAILS. Placing a sub-agent marker into each of the 25
  permitted definitions would deliver correctly on the day it ships and fail the
  new-agent clause the first time someone adds the 26th -- the same trap
  AR-300d's notes describe for abilities. The placement that exists today for
  this section is precisely a body marker that no template carries.

  REVOCATION IS WHERE 'DERIVED' IS PROVED. Every additive clause is satisfied by
  an accumulating design; only removal -- over a compiled tree left by an earlier
  build -- distinguishes a section derived afresh from one patched. An agent
  still told it may dispatch a sub-agent that was deliberately taken away is a
  worse outcome than the original defect.

  THE BLAST-RADIUS CLAUSE. A delivery keyed off a shared structure rather than
  the per-agent declaration passes the first two clauses while handing the
  permission to everyone (or revoking it from everyone). Visible only in the
  agents nobody looked at.

  THE "NO CENTRAL RECORD ENTRY" CLAUSE mirrors AR-300d-1 for delivery. It does
  not claim an agent needs no registry entry for any purpose -- only that the
  sub-agent section does not depend on one.
