id: BP-100n
components:
  - build_pipeline
readiness: reviewed
priority: high
title: "Something the build cannot find is reported as missing, never treated as nothing to check"
component: build-pipeline
level: L1
status: active
criteria: |
  A guard that finds nothing where something should be says so, instead of passing.

  Absence is the easiest thing for a check to misread. A file the build recorded
  writing but that has since been deleted, a capability whose output was never
  produced, a platform the equality guard never exercised — each of these looks,
  from inside the guard, exactly like "there is nothing here to check". Each has
  been reported as a pass.

  Every guard states what it could not find and why, counts it as its own reported
  condition, and fails the run. No guard infers from an empty result that there was
  nothing to verify, and no skip is indistinguishable in the build's output from a
  check that ran and passed.
depends_on:
