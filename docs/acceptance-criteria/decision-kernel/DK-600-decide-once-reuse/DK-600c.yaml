notes: |
  DERIVED FROM leafcutter/decision-staging (all 5 scenarios):
    steps    detect, build-record, write-staged, announce
    branch   not-stageable
  Also the journey step decision-lifecycle/stage.

  STANDING RULES TO CARRY INTO L2. The record holds evidence locators and hashes,
  never evidence text. A non-human approver or a missing approval time is
  refused. The record is staged under the run folder and no file in the
  repository changes. The completed-run message names the staged path and the
  publish command, and the skill never publishes on its own.

  "Where the evidence came from" in the criteria is the benefit-language form of
  locators and hashes. Keep it that way at L1.

  Docs: a reference doc for what a decision record contains, and a sequence
  diagram for the hand-off from the decision executor to the record builder,
  the file backend and the skill.

  TRUE STATUS (2026-10-02): work_status in_progress, derived from the direct children by the
