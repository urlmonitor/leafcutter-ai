id: KM-400b-5-iii
title: "Publication write batches are bounded by payload size as well as by row count, so one batch of large records cannot outrun the writer's time limit"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: todo
parent: KM-400b-5
criteria: |
  Given the writer declares a per-batch row cap of 250 and a per-batch payload budget of 2,000,000 bytes
  And a snapshot of 11,307 nodes in which 11,000 nodes carry a payload of about 1,000 bytes each
  And 300 nodes of one label carry a payload of about 200,000 bytes each
  And 7 nodes carry a payload of 2,500,000 bytes each
  When the snapshot is published into an empty store
  Then no write batch holds more than 250 rows
  And no write batch holds more than 2,000,000 bytes of payload, except a batch holding exactly one record
  And the 300 nodes of about 200,000 bytes are written in batches of at most 10 rows each
  And batches of the 11,000 small nodes still hold up to 250 rows each, so they are not split further than the row cap requires
  And each of the 7 nodes larger than the budget is written alone in a batch of one row, and is neither dropped nor rejected
  And the publication result names each of those 7 nodes as larger than the payload budget, with its identity, label and size in bytes
  And every one of the 11,307 nodes is written exactly once, so the sum of rows across all node batches is 11,307
  And the publication result states the row cap and the payload budget that were in force

  Given the same snapshot holds 28,814 relationships, 40 of which carry a property payload of about 150,000 bytes each
  When the relationships are written
  Then no relationship batch holds more than 250 rows or more than 2,000,000 bytes of payload, except a batch holding exactly one record
  And every one of the 28,814 relationships is written exactly once

  Given a snapshot whose nodes all carry a payload of about 1,000 bytes
  When it is published
  Then the batches are the same as with a row cap alone: full batches of 250 rows and one final partial batch
depends_on: [KM-400b-5]
