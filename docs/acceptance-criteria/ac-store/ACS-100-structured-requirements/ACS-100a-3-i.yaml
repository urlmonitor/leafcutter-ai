id: ACS-100a-3-i
components:
  - ac_store
title: "A test_spec framework the project actually ships is accepted, and an unknown one is still refused"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an acceptance-criterion record whose test_spec names a test framework this
    repository actually ships a runner or skill for,
  When the schema validator checks that record,
  Then the record validates, and a component-wide validate_ac_schema run over the
    directory containing it reports every file valid,
  And this holds specifically for `framework: playwright`, which the package ships a
    Playwright-driven `webapp-testing` skill for and which two approved, high-priority
    records (BP-1400c-1 and BP-1400c-1-i) already declare for a headless route-render
    check.

  And given a record whose test_spec names a framework this repository ships nothing
    for — an invented value such as "jasmine" or an empty string —
  When the same validator checks it,
  Then validation still fails, and the diagnostic names the offending value and lists
    the accepted members, so widening the vocabulary does not turn the field into a
    free-text box.

  Coverage note: the discriminating half is the second block. A test that only asserts
  playwright is accepted would pass equally against a schema that dropped the enum
  altogether, which is the opposite of what this criterion asks for — the field must
  admit what the project ships and refuse what it does not. Both halves are required.
depends_on: [ACS-100a-3]
