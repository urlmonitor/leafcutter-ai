assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - The reserve and the cost of a research round are computed from configuration and the budget the
    context reports (limits.max_jev_calls); nothing is hard-coded.
  - A decision with a complete earlier assessment never ends blocked on the budget, and a ranking
    is never built from a partially scored assessment.
  - Usage of calls made before a budget stop is kept, so budget, envelope usage and trace agree.
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_a_round_that_does_not_fit_beside_the_reserve_ends_in_the_ranked_question
    target_dir: tests/kernel/grounding/
    framework: unittest
    type: unit
    angle: boundary
    description: 'EXISTS (tests/kernel/grounding/test_round6_budget.py::TestTheReservedAssessment::test_a_round_that_does_not_fit_beside_the_reserve_ends_in_the_ranked_question):
      no research round starts; the ranked question names the Jev call budget; limitation says limited
      evidence'
    covers:
      - DK-300a-4-i
  - name: test_with_one_more_call_the_round_is_requested_as_before
    target_dir: tests/kernel/grounding/
    framework: unittest
    type: unit
    angle: boundary
    description: 'EXISTS (tests/kernel/grounding/test_round6_budget.py::TestTheReservedAssessment::test_with_one_more_call_the_round_is_requested_as_before):
      one more call left: the research round is requested'
    covers:
      - DK-300a-4-i
  - name: test_the_humans_choice_resolves_and_the_final_report_says_the_evidence_was_limited
    target_dir: tests/kernel/grounding/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/grounding/test_round6_budget.py::TestTheReservedAssessment::test_the_humans_choice_resolves_and_the_final_report_says_the_evidence_was_limited):
      the resolved report carries the limited-evidence limitation'
    covers:
      - DK-300a-4-i
  - name: test_no_budget_for_a_new_assessment_ranks_the_last_complete_one
    target_dir: tests/kernel/grounding/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/grounding/test_round6_budget.py::TestFallbackToTheLastCompleteAssessment::test_no_budget_for_a_new_assessment_ranks_the_last_complete_one):
      the ranked question uses the last complete assessment'
    covers:
      - DK-300a-4-i
  - name: test_the_run_asks_the_ranked_question_instead_of_blocking
    target_dir: tests/kernel/grounding/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/grounding/test_round6_end_to_end.py::TestTheBudgetIsReserved::test_the_run_asks_the_ranked_question_instead_of_blocking):
      through the service, the run asks instead of blocking'
    covers:
      - DK-300a-4-i
