agent_id: retrospective-agent
template_file: templates/agents/retrospective-agent.md
proposed_frontmatter:
  pre_flight_reads:
  - source: ticket_path
    required: true
  inputs: []
  outputs:
  - name: completion_report
    type: structured_response
    description: Structured completion payload or sign-off comment
  mutates:
  - name: none
    surface: none
    description: Read-only agent — no filesystem mutations
  behavioral_patterns:
  - name: Conditional Behavior
    trigger: the epic has < 3 completed tickets
    behavior: note this and produce a lightweight retro
    related_agent: null
proposed_registry:
  category: supervisor
  skills_invoked:
  - skill_id: route-learning
    mode: conditional
  knowledge_channels:
  - channel: 1
    source: template description field
  - channel: 6
    source: project files read during execution
  - channel: 7
    source: bash command output (git, build, tests)
