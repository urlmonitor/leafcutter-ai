    proves_clause: "its report states, for each block, how many installed copies were inspected and names the routes that carry it"
    code_file: scripts/shared_block_identity.py
    to_be_created: true
    convention_test_file: unit_tests/test_build_workflow_phase.py
  - name: test_identity_check_is_reachable_after_a_real_install
    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "Run the real build_workflow_scripts install into a temporary layout, then run the identity check over that layout's installed routes and assert it passes with a non-empty report. The check's module is created by this record, so the install entry point is the opened production surface."
    proves_clause: "it passes"
    code_file: scripts/build_phases_workflows.py
