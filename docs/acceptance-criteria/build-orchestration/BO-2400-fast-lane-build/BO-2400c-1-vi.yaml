test_rationale: |
  Two distinct claims here, each with its own executable shape, and neither provable by
  reading the lane's source.

  The composition claim — which layers the bundle contains and which it does not — is
  proved by running scripts/injection_builders.py's assemble-bundle subcommand as a REAL
  SUBPROCESS and asserting on its actual stdout: the architecture, high-level and
  prior-tests content is present, the conventions content and the build set's AC YAML text
  are absent, and the output is on the order of twenty kilobytes for realistic inputs. A
  test that asserts a smaller argument list, or that greps the workflow for a layer name,
  proves nothing: both pass unchanged while the lane keeps passing the dropped layers.

  The instruction claim — that every context-carrying dispatch tells its agent to read
  each record from the run's store — is proved by EXECUTING the lane under
  unit_tests/_workflow_engine_harness.py with run_workflow_under_e2 and label_responses,
  and asserting on the RECORDED dispatches' prompt text for BOTH the test-writer and the
  coder. Asserting it for the test-writer alone passes today, which is exactly the gap:
  the coder prompt has never carried it.

  The named-source claim is proved by pointing the assembly at a path that does not exist
  and asserting the run ends naming that path — not by asserting a string appears in the
  prompt, since the current prompt already names a path that does not exist and instructs
  the agent to substitute something else.

  Grep-shaped evidence is rejected at review for every part of this criterion. A grep over
  fast-lane-ship.js for a layer name, a label, or an argument passes on dead code, and
  dead-but-green is the documented history of this entire feature.
