assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    done_proof_xfail_skip_exclusion:
      type: object
      description: "Pass-state classification that treats xfail, xpass, and skipped outcomes as non-passing for done-proof purposes, so a covers-linked test with only those outcomes cannot make an AC eligible for done."
  reference_file_path: "scripts/ac_store/pytest_ac_enforcement.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Only an actual passing outcome counts toward done proof; xfail, xpass, skip, and error outcomes must all be treated as non-passing."
    - "This must reuse the same outcome classification used by the pytest enforcement layer so xfail-masking cannot silently satisfy the done gate (see project memory: pytest xfail-masking)."
    - "When the only covers-linked test is xfail/skipped, the AC is blocked and the reason names the non-passing outcome."
    - "Classification must be idempotent for a given test-run result."
