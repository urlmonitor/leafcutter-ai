notes: |
  THIS IS THE ONLY AC IN THE TREE THAT MAY PROMISE A DISPATCH, and the mechanical reason is
  absolute: a git pre-commit hook is a subprocess at commit time — it can block and print, it
  cannot spawn an agent. A shared-build job can fail and print — it cannot spawn an agent
  either. A PostToolUse hook on Edit|Write runs inside the live session and its output is
  returned into the running agent's context. That is the whole difference, and it is why
  GE-122c-2 promises strictly less.

  THE NEGATIVE CLAUSE — no dispatch on a clean write — is not symmetry for its own sake. The
  anti-precedent guard dispatches its placeholder for EVERY novel term it sees, which is how it
  came to rubber-stamp everything. A dispatch that fires unconditionally is indistinguishable
  from no guard at all, and is more expensive.

  OPEN FOR THE IT PO, deliberately not decided at L2: whether the guard blocks the write or
  permits it and dispatches alongside. The criterion requires the dispatch and the message; it
  does not require the write to be reverted. GE-122d-3 separately establishes that the
  authoring-time stage announces rather than reverts on a cannot-run condition, which suggests
  the same disposition here, but it is a technical judgement.

  RESOLVED BY THE IT PO (2026-08-17): the write is NOT reverted. The block-decision channel is
  used because it is the only way to reach the session, not to undo the author's work.

  IT PO HAZARD NOTE (2026-08-17) — this stage fails silently in a way the other two do not. A
  pre-commit hook that crashes produces a visible non-zero exit; a CI job that crashes turns the
  build red. A PostToolUse hook that crashes, times out, or cannot import its dependency emits
  no decision at all — and no decision is exactly what a clean write looks like. That is why the
  deployed-layout execution test is not optional here, and why the timeout budget matters.
