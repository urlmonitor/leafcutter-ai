id: BO-2400c-1-vi
components:
  - build_orchestration
  - injection_builder
title: "The bundle carries only what the receiving agent does not already have"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given every agent the lane dispatches into the run's workspace is already handed that
    workspace's project conventions by the harness that dispatches it,
  And the run's acceptance-criteria store sits inside that same workspace, where any
    agent working there can open it,
  When the lane assembles its context bundle for the run,
  Then the bundle carries only content the receiving agent does not otherwise have —
    the architecture overview, the high-level parent acceptance criteria for the target,
    and the prior tests for the area,
  And the project conventions are not one of the bundle's layers: the bundle would be
    carrying a second copy of text the receiving agent is handed anyway, and that copy is
    the single largest duplicate in the payload,
  And the full text of the build set's own acceptance criteria is not one of the bundle's
    layers either, because each context-carrying dispatch instead tells its agent to open
    each id's record in the run's own store — the instruction the test-writer dispatch
    already carries and the coder dispatch does not,
  And every context-carrying dispatch carries that instruction, so no agent is left
    expected to reason about records it was neither given nor told to go and read.

  Given the same run,
  When the assembled bundle is measured,
  Then it is small enough to cross an agent boundary intact as text in a return value,
    on the order of twenty kilobytes rather than the order of a hundred and fifty,
  And that smallness is a property of what the bundle contains rather than of a limit
    imposed afterwards, so the transport contract in BO-2400c-1-iii is a check on an
    already-small payload and not the thing making it small.

  Given the architecture layer is being obtained,
  When the lane names where that layer comes from,
  Then it names one path that exists in the workspace, exactly, with no instruction to
    fall back to the nearest equivalent when the named path is absent,
  And a named source that cannot be opened ends the assembly with that source named,
    rather than being replaced by whatever the assembling step judges closest — a layer
    chosen by judgement differs between two runs aimed at the same target, so the same
    target stops producing the same bundle and no comparison across runs means anything.
depends_on: [BO-2400c-1, BO-2400c-1-ii, BO-2400c-1-iii]
