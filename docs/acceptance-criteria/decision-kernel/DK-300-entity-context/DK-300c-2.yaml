id: DK-300c-2
title: "Scope filtering precedes matching and every disclosure"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a cached index was prepared with broader access than the current run,
  And the run restricts allowed source IDs, read roots and denied path patterns,
  When initial matching or later direct entity lookup runs,
  Then only entries permitted by the current run participate in matching, uniqueness, ambiguity, counts and projection,
  And resolved source paths and symlink targets must remain within permitted scope,
  And denied entries disclose no existence, name, title, locator, signature, hash or derived coverage count,
  And a run without repository-read permission cannot obtain cached repository meanings or a fingerprint derived from denied content,
  And the initial pass performs no repository write, host operation, network call, embedding call, model call or human interaction.
depends_on: [DK-300c]
