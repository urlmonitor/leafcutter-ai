id: BO-2900d-3
components:
  - build_orchestration
  - testing_quality
title: "An exemption covers only the item it names, and one whose item is gone is reported as stale"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an exemption is recorded for one unit that has no runtime way in,
    And a second unit with no runtime way in sits alongside it, sharing its folder and
      its purpose, with no exemption of its own,
  When the reachability guard runs,
  Then the first unit is not reported and the second unit is reported,
    And no exemption is applied to any unit other than the one it names.

  Given an exemption whose named unit no longer exists,
  When the guard runs,
  Then the exemption is reported as stale, naming it,
    And it is not counted among the exemptions in force,
    And a later unit that happens to take the same name is not exempted by it.
depends_on:
  - BO-2900d
  - BO-2900d-1
  - BO-2900d-2
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-2900-runtime-reachability-guard/BO-2900d-2.yaml
    relationship: related
    status: exists
    relevance: "The inventory this AC keeps accurate — a stale entry inflates the count and hides behind it."
  - path: docs/architecture/adrs/ADR-017-worktree-quality-gate-guard.md
    relationship: related
    status: exists
    relevance: "The project's fail-closed convention, consulted when deciding whether a stale entry should refuse; this AC deliberately does not follow it — see the IT PO decision in notes."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    stale_exemption_entry:
      type: object
      description: "{ item: str, reason: str, recorded: str, state: 'stale' } — a registry entry whose named item cannot be resolved in the tree at check time. Reported in its own section of the exemption inventory, excluded from total_in_force, and NON-REFUSING on its own (see the IT PO decision in notes)."
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "BREADTH: matching stays exact-item equality. No folder scope, no glob, no prefix, no 'and its siblings'. A folder-shaped exemption is an unbounded promise about code that does not exist yet — every future file dropped there becomes exempt with no reason recorded for it."
    - "TIME: an entry whose named item cannot be resolved in the tree at check time is classified `stale`, reported by name in its own section of the exemption inventory, and EXCLUDED from total_in_force (BO-2900d-2)."
    - "WHETHER A STALE EXEMPTION REFUSES (IT PO decision, see notes): it REPORTS ONLY. A stale entry must not, on its own, cause a non-zero exit. It grants nothing (it matches no item), so the safety property is already carried by the not-counted rule; refusing would block an author who is unrelated to the dead entry, which is the documented way guards get switched off."
    - "NAME REUSE MUST NOT SILENTLY RE-ARM AN ENTRY. Resolution is against the item as it exists NOW, so a new unit reusing a deleted unit's path is exempted only if the check would also exempt it as a fresh entry — which, for identical paths, it would. Therefore the registry record MUST carry `recorded` (date) and `recorded_by`, and a stale entry that later resolves again must be reported in the inventory as re-armed, so the reuse is visible to review rather than silent. This is the criteria's name-reuse clause implemented as visibility, not as a hash of the file's contents."
    - "Resolution must distinguish 'item does not exist' from 'the tree could not be read'. An I/O failure while resolving must fail closed with a named cause per the error-handling policy, never be reported as a batch of stale entries."
delivers_to:
  agent: python-coder
  contract: "The `stale` section of the exemption_inventory_report ({ item, reason, recorded, state: 'stale' }[]) and the guarantee that total_in_force excludes it. Consumed by BO-2900d-2's inventory output and documented as contract by BO-2900d-5."
expects_from:
  ac_id: BO-2900d-2
  contract: "exemption_inventory_report, emitted on every run, with its in_force list, total_in_force count and stale section — this AC owns what goes in the stale section and what is excluded from the total."
test_spec:
  - name: test_exemption_does_not_cover_a_sibling_in_the_same_folder
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs the real guard over a fixture tree with two no-way-in units in one folder, one exempted; asserts the exempted unit is not reported and the sibling is, in the same run."
  - name: test_exemption_naming_a_deleted_unit_is_reported_stale_and_excluded_from_the_total
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With a registry entry naming a unit that no longer exists, asserts the emitted inventory names it in the stale section and that total_in_force excludes it."
  - name: test_stale_exemption_alone_does_not_refuse_the_change
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A change with no findings and one stale entry exits zero; asserts the report-only decision holds and an unrelated author is not blocked by somebody else's dead entry."
  - name: test_a_new_unit_reusing_a_deleted_units_path_is_reported_as_re_armed
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Recreates a unit at the stale entry's path and asserts the inventory reports the entry as re-armed with its recorded date, so the reuse is visible rather than a silent inheritance of somebody else's decision."
test_rationale: "Both halves of this AC are properties of the whole run: which units the guard reported, what the inventory section contained, and what exit code the run produced. A direct-import test of a matcher would prove exact-string equality and say nothing about the sibling being reported in the same run, about the stale section existing at all, or about the exit code — and the exit-code assertion is the entire content of the report-only decision. The fourth test exercises the name-reuse clause as an observable output rather than as an internal flag, because a re-armed entry with no visible trace is indistinguishable from a fresh, deliberate one."
