id: KM-500d-1
title: Let agents discover and use the right knowledge entry point
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: in_progress
parent: KM-500d
criteria: 'Given an agent has an information need and may know either an exact operation or only a research
  question

  When it discovers the supported knowledge interfaces from the normal agent-facing entry point

  Then it can distinguish canonical source scanning, standalone typed retrieval and the governed research run
  and resume path

  And the available route describes its accepted inputs, supported operations, scope, permissions and expected
  outcomes

  And a known valid operation can be invoked directly while an unresolved question can enter the existing clarification
  and capability-growth flow

  And the documented examples reach those public interfaces and produce attributable results or explicit disabled,
  unsupported or unavailable outcomes

  And a disabled backend does not prevent ordinary agent startup or create an implicit network dependency

  And the legacy source scanner is not advertised as automatically performing the research or query-build loop.'
