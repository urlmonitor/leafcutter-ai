criteria: |
  Given a dispatch payload that, in addition to (or instead of) the allowlisted pointers,
    carries a free-composed prose field that restates the task or repeats the sign-off steps,
  When preflight validates the payload before spawn,
  Then the payload is rejected,
  And the held-back reason names the non-allowlisted field that carried the prose,
  And no phase agent is spawned.
