id: ACD-400a-3
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Scanner does not treat an AC's own ancestor as a build-order blocker"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the AC store contains an approved, active, todo L2 AC "X-100a-1"
    whose only depends_on entry is its own parent L1 "X-100a",
  And "X-100a" is an L1 composite whose work_status is not done
    (an L0/L1 parent is never built as a leaf, so it never reaches done),
  When the scanner is invoked with leaf and todo filters,
  Then "X-100a-1" appears in the ready list,
  And "X-100a-1" does NOT appear in the blocked list,
  And no blocked entry names "X-100a" as a blocker of "X-100a-1"
    (an AC's own ancestor is excluded from the dependencies that gate readiness).
depends_on: [ACD-400a]
doc_links:
  - docs/acceptance-criteria/index.yaml
  - docs/reference/ac-schema.md
  - docs/architecture/components/ac-driven-dev.md
  - scripts/ac_store/scan_ac_store.py
  - scripts/ac_store/ac_prioritizer.py
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The fix must live in the scanner's classification path (_classify_ac / the dependency-blocking logic); do not add a second, parallel blocking codepath."
  - "Ancestor detection must reuse the existing derive_parent_id() helper applied transitively (walk parent -> grandparent -> ... to the root); do not re-implement parent-id parsing."
  - "An AC's own ancestor at ANY depth must be excluded from the blocking set, not merely its immediate parent."
  - "Only genuine non-ancestor depends_on entries may gate readiness; a leaf whose only depends_on entries are its own ancestors must classify as ready, never blocked."
  - "scripts/ac_store/ac_prioritizer.py must produce results consistent with the scanner's classification (share or mirror the same ancestor-exclusion logic; no divergent blocking rules between the two)."
  - "The scanner must remain read-only (never mutate any AC YAML), run in O(n) over the store, and be idempotent (repeated invocations on an unchanged store yield identical ready/blocked lists)."
  - "Must handle malformed or missing depends_on / parent-id derivation gracefully per the project error handling policy (no bare except; log or raise typed)."
delivers_to:
  agent: python-coder
  contract: "Ancestor-aware classification: a leaf AC whose only depends_on entries are its own transitive ancestors is classified ready (never blocked), and the ancestor is never named as a blocker; consumed by ACD-400a-3-i, ACD-400a-3-ii, and ACD-400a-4"
expects_from:
  ac_id: ACD-400a-1
  contract: "The leaf filtering and blocked-classification logic this behavior refines"
origin_agent: business-analyst-v3
created: 2026-08-12
amended_by: []
superseded_by: null
covered_by: [ACD-400a-3-i, ACD-400a-3-ii]
implemented_by: []
test_spec:
