assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: KM-400b-5-v
  contract: "The KM-400b-5-v retry record for the batch in flight when the publication failed {batch: the KM-400b-5-iii batch descriptor {phase: str, label_or_kind: str, ordinal: int, total: int, rows: int, payload_bytes: int}, attempts: int, attempt_causes: list of str, max_attempts: int}."
origin_agent: BrainCandy
created: '2026-10-21'
amended_by: []
superseded_by: null
covered_by:
  - tests/knowledge/test_km_400b_5_vi.py
implemented_by:
  - knowledge/adapters/neo4j_writes.py
  - knowledge/adapters/neo4j_backend.py
  - knowledge/cli_sync.py
  - knowledge/__main__.py
change_target: code
risk_surface: contract_boundary
test_required: true
it_requirements:
  - "The failure result must expose cause class, time limit in seconds, phase, batch descriptor, attempts made and progress as discrete machine-readable fields, not only inside a message string."
  - "The reported time limit must be read from the effective writer configuration, never from a literal."
  - "A figure that does not apply must be reported as not applicable, never as 0 (ACS-1100)."
  - "Tracking the current phase and batch must add no store round-trips to the publication."
  - "The failure result and its log entry must contain no payload content and no credentials."
  - "The new fields must be added without removing or renaming the existing failure fields that carry the original cause and the removal outcome (KM-400b-5-ii)."
test_intent:
  - clause: "the result states that the cause is the writer's time limit, and states that limit as 30 seconds"
    needs_test: true
    reason: The limit must come from the effective configuration, which a hard-coded value would misreport.
  - clause: "the result names the phase as writing nodes"
    needs_test: true
    reason: The phase is tracked state that could be stale or unset when the error arrives.
  - clause: "the result names the slow batch: label AcceptanceCriterion, batch 34 of 46, 250 rows, 3,100,000 bytes"
    needs_test: true
    reason: The batch identity is computed output that could name the previous or next batch.
  - clause: "the result states that 3 attempts were made"
    needs_test: true
    reason: The attempt count is carried from the retry step and could be lost when the failure is wrapped.
  - clause: "the result states the progress reached: 8,250 of 11,307 nodes and 0 of 28,814 relationships written"
    needs_test: true
    reason: Progress counts only completed batches, and counting the failed batch would overstate it.
  - clause: "the result still reports the removal outcome for G33 as required for a failure after storing"
    needs_test: true
    reason: Adding the new fields could replace the existing removal outcome in the result.
  - clause: "the result is distinguishable from a failure caused by the store being unavailable or read-only"
    needs_test: true
    reason: Cause classification is logic that could map a timeout to a generic store failure.
  - clause: "the result names the phase as writing relationships and names that batch with its kind, ordinal, rows and bytes"
    needs_test: true
    reason: Relationship phase tracking is a separate path that could keep reporting the node phase.
  - clause: "the result names the phase as activation"
    needs_test: true
    reason: The activation step is outside the batch loop, so phase tracking could still name the last write batch.
  - clause: "the result states that no write batch was involved, rather than naming a batch or reporting a label, row count or byte count of 0"
    needs_test: true
    reason: A default-initialised batch descriptor would report zeros, which this clause forbids.
  - clause: "the phase and batch named in the result are those the publication was executing when the error was received"
    needs_test: true
    reason: Attribution relies on publication-side state rather than the error text, which a parser of the message would get wrong.
test_spec:
  - name: test_failure_states_time_limit_cause_and_the_effective_limit
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Time out all attempts of batch 34 on a backend whose query_timeout is 30 and then 12, and assert the failure result states a time-limit cause and a limit equal to each configured value.
    proves_clause: "the result states that the cause is the writer's time limit, and states that limit as 30 seconds"
    code_file: knowledge/adapters/neo4j_backend.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "a literal 30 in the result regardless of the effective query_timeout"
      - "a limit read from the uncapped constructor argument instead of the capped one"
  - name: test_failure_names_the_phase_as_writing_nodes
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Assert the discrete phase field of the failure result equals the nodes phase when a node batch timed out.
    proves_clause: "the result names the phase as writing nodes"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "a phase left unset until the first relationship batch"
      - "a phase carried only inside the message string"
  - name: test_failure_names_the_slow_batch_by_label_ordinal_rows_and_bytes
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Assert the batch field holds label AcceptanceCriterion, ordinal 34 of 46, 250 rows and 3,100,000 bytes, and not the previous or next batch.
    proves_clause: "the result names the slow batch: label AcceptanceCriterion, batch 34 of 46, 250 rows, 3,100,000 bytes"
    code_file: knowledge/adapters/neo4j_domain_build.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "the descriptor of batch 33 reported because it is updated after the write"
      - "a zero-based ordinal that names batch 33 of 46"
      - "rows reported from the row cap rather than the batch"
  - name: test_failure_states_three_attempts_were_made
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Assert the failure result carries attempts equal to 3 after the retry record from KM-400b-5-v passes through the failure wrapping.
    proves_clause: "the result states that 3 attempts were made"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "an attempts figure dropped when the error is wrapped in a ValueError"
      - "an attempts figure of 1 from a fresh retry record per publication step"
  - name: test_failure_reports_progress_of_completed_batches_only
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: boundary
    description: Assert progress is 8,250 of 11,307 nodes and 0 of 28,814 relationships after batch 34 fails, with the failed batch's 250 rows not counted and the 28,814 shown as a figure not 0 of an unknown total.
    proves_clause: "the result states the progress reached: 8,250 of 11,307 nodes and 0 of 28,814 relationships written"
    code_file: knowledge/adapters/neo4j_domain_build.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "progress incremented before the write returns, reporting 8,500"
      - "progress taken from the store's partial count of 8,237 instead of completed batches"
  - name: test_failure_still_reports_the_removal_outcome
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: Assert publication_removal is outcome removed with node and relationship figures and the message still states the removal alongside the new time-limit fields.
    proves_clause: "the result still reports the removal outcome for G33 as required for a failure after storing"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "new time-limit fields that replace publication_removal"
      - "a message rebuilt from the new fields that loses the removal sentence"
  - name: test_time_limit_failure_is_distinguishable_from_unavailable_and_read_only
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Produce a time-limit failure, a read-only refusal and a generic unavailable failure and assert the cause class field differs for each, with no time-limit fields on the other two.
    proves_clause: "the result is distinguishable from a failure caused by the store being unavailable or read-only"
    code_file: knowledge/adapters/neo4j_backend.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "every Neo4jError mapped to one generic store failure class"
      - "a read-only refusal reported with a time-limit cause"
  - name: test_relationship_batch_failure_names_phase_kind_ordinal_rows_and_bytes
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Time out relationship batch 80 of 116 of kind COVERED_BY and assert phase is relationships and the batch holds kind, ordinal 80 of 116, 250 rows and 400,000 bytes.
    proves_clause: "the result names the phase as writing relationships and names that batch with its kind, ordinal, rows and bytes"
    code_file: knowledge/adapters/neo4j_domain_build.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "a phase that stays nodes after the node loop ends"
      - "the batch label field left holding the last node label"
  - name: test_activation_failure_names_the_activation_phase
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Succeed every write batch and time out the switch_active transaction on all attempts, and assert the phase is activation.
    proves_clause: "the result names the phase as activation"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "a phase still holding relationships from the last write batch"
      - "an activation timeout that is not classified as a time-limit failure"
  - name: test_activation_failure_states_no_write_batch_was_involved
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Assert the activation failure reports batch as not applicable and no label, rows or bytes of 0 anywhere in the result or message.
    proves_clause: "the result states that no write batch was involved, rather than naming a batch or reporting a label, row count or byte count of 0"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "a default-initialised descriptor reporting rows 0 and bytes 0"
      - "the last write batch left in the result"
  - name: test_phase_and_batch_come_from_publication_state_not_the_error_text
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: discrimination
    description: Raise a time-limit error whose message names a different label and batch than the one executing and assert the result names the executing phase and batch, and that no extra store statement was issued to find out.
    proves_clause: "the phase and batch named in the result are those the publication was executing when the error was received"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
    must_catch:
      - "a parser that reads the label and batch out of the error message"
      - "an extra round-trip to the store to discover the slow statement"
  - name: test_km_400b_5_vi_reachable_from_sync_entry_point
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: reachability
    description: Run `python -m knowledge sync --root <repo>` in a fresh subprocess with only the Neo4j driver replaced by a StoreDouble that times out one node batch on every attempt, and assert exit 2 and a printed error naming the nodes phase, the batch and the attempts.
    proves_clause: "the result names the slow batch: label AcceptanceCriterion, batch 34 of 46, 250 rows, 3,100,000 bytes"
    code_file: knowledge/adapters/neo4j_projection.py
    covers: [KM-400b-5-vi]
    requires_db: false
