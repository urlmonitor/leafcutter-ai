notes: |
  The load-bearing reconciliation case (ACS-900 + ACS-900d notes): for
  superseded_by, "reconciled" includes re-pointing implemented_by to the
  successor, NOT only deletion. This MUST pass — the code moved to the successor.
  The verdict is computed against the retired AC's own (now-emptied) list, so an
  intact file is not a false positive.

  IT-PO enrichment (2026-06-22): pinned the load-bearing scoping rule — verdict is
  against the retired AC's OWN implemented_by, never a store-global file set — and
  explicitly de-scoped successor-claim verification (avoids coupling to cross-AC
  reconciliation). This is the single most likely false-positive source, so the
  scoping is stated as a hard it_requirement.
change_target: code
