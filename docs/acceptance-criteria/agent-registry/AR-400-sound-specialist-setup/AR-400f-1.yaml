notes: |
  USER DECISION 4 (BrainCandy, 2026-10-12), BINDING: redundancy becomes a
  declaration-shape error. Today this exact case prints
  "[WARNING] ticket-supervisor.spawn_allowlist: llm-expert is redundantly listed
  because it is already included in __ticket_phase_agents__" and continues.

  The last clause keeps AR-300c-5's delivery behaviour (one name per agent)
  intact while removing its tolerance of the declaration.
