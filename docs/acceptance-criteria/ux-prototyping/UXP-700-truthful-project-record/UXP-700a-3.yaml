id: UXP-700a-3
title: "A newly installed record carries none of another project's content"
component: ux-prototyping
components:
  - ux_prototyping
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the tooling is installed into a project that has never used it,
  When the artifacts in that project's record are enumerated,
  Then the count is zero for every artifact type,
  And no artifact belonging to the tooling's own example product, and no artifact belonging to
    the tooling's own project record, is present in the installed project,
  And the example product remains obtainable by asking for it by name, so a person who wants to
    see a worked example can still get one without it having arrived by default.
depends_on:
  - UXP-700a
  - UXP-700a-1
