title: "Reference doc: how a source file's length is measured, including the decision-history exclusion"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the measurement rule in force (GE-127d-3: no comment of any style, no standalone
    Python string and no blank line counts),
  When the size standard's reference documentation for source files is written or updated,
  Then it states the rule in the same words the standard publishes, and names what is left
    out: every comment, every standalone Python string and every blank line — which is why
    a decision-history block is left out,
  And it shows one Python and one JavaScript example with the raw line count and the
    measured length side by side,
  And it states that a decision-history block costs no measured lines, so moving a file's
    decision history into another file or document frees no measured lines,
  And it links GE-134a and the decision-history convention in the doc-enforcer skill rather
    than restating that convention.
