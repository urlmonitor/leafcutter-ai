notes: |
  USER DECISION 2026-10-09: for adopters, parity means the adopter's own lint
  configuration plus a scope declared in ONE place in package configuration,
  which this repository's own CI also reads. Default when undeclared: the whole
  project minus the configuration's own excludes. Decided, not open.

  WHY THE WORKTREE ARM NEEDS A DIFFERING CONFIGURATION. With identical
  configuration in the install location and the worktree, an implementation that
  reads the install location's copy passes every arm. The first scenario's
  differing scope is what separates "reads the worktree" from "happens to read an
  identical copy". Same discipline as GE-118's history: four point fixes there
  passed their tests in layouts where the bug could not reproduce.

  VERIFY IN A DEPLOYED LAYOUT. The adopter arms must run against a built install
  in a separate project, not against the source tree, because the source tree is
  the one layout where install-location resolution cannot go wrong (CLAUDE.md
  "New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest").

  The package cannot see an adopter's CI. The last arm only constrains a CI step
  that reads the declaration. The package does not promise to configure the
  adopter's CI.

  USER DECISION 2026-10-09 -- ACCEPTED: the it_requirement "THE GOVERNING
  CONFIGURATION MUST BELONG TO THE PROJECT" (a governing ruff configuration
  found outside the subject root -- an ancestor directory or the user-level
  config -> could_not_check naming it, reason ruff_config_outside_project) was
  added by the IT-PO beyond this record's criteria. The user accepted it on
  2026-10-09; it is decided, not a caveat. The reason name was added to
  BP-1300e-1-iii's vocabulary the same day. Criteria unchanged.
