id: ACD-1600c-4-iii
components:
  - ac_driven_dev
  - ac_store
readiness: approved
priority: high
title: "A declared path outside the repository, or inside a copy the build regenerates, is refused"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given requirement R declares five files:
      /home/dev/repo/scripts/a.py,
      ../other-repo/scripts/b.py,
      scripts\ac_store\c.py,
      .claude/agents/test-writer.md, a copy the build regenerates from templates/agents/test-writer.md,
      templates/agents/test-writer.md,
  When R is checked before it enters the repository,
  Then R is refused with one message for each of the first four entries, each naming R and the
    path as written,
  And the message for /home/dev/repo/scripts/a.py and ../other-repo/scripts/b.py states that a
    declared path must be relative to the repository root and stay inside it,
  And the message for scripts\ac_store\c.py states that declared paths use forward slashes,
  And the message for .claude/agents/test-writer.md states that it is a regenerated copy and
    names templates/agents/test-writer.md as the file to declare instead,
  And templates/agents/test-writer.md produces no message.
depends_on:
  - ACD-1600c-4
doc_links:
  - path: docs/known-issues/ac-store/open-high-ki-acs-002.md
    relationship: related
    status: exists
    relevance: >-
      The BP-1100g-1 occurrence: the deployed .claude/agents/test-writer.md was named as the
      file to edit; the reachability test passed, the source under templates/ was untouched,
      and the next build erased the work. A declared list must not be able to repeat that.
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Path-form rules live once in the declared-files seam (ACD-1600c-4) and are invoked by the load-bearing check-ac-schema hook (both branches) and the agent-side validator: refuse absolute paths (POSIX or drive-letter), any path that leaves the repository root, and any backslash -- each message naming the record and the path exactly as written."
  - "Regenerated-copy detection must read the build's own definition of which roots it regenerates and from which source (the build deploy definition, including the .claude/ to .leafcutter/ link) -- never a second, hard-coded root list in the check. Adding a regenerated root to the build must extend the rule with no change to the check."
  - "When a regenerated copy has no source the build definition can name, the entry is still refused and the message states that no source could be determined -- never a guessed source."
  - "Exactly one message per offending entry, even when an entry breaks more than one rule; no duplicate from the JSON-schema layer."
  - "The check is lexical plus the build mapping: it must not require the declared path to exist, and must not resolve symlinks in a way that makes the verdict depend on the checkout's filesystem."
test_spec:
  - name: test_absolute_and_escaping_paths_refused_as_not_repo_relative
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "/home/dev/repo/scripts/a.py and ../other-repo/scripts/b.py each get one message naming R and the path, stating declared paths are repo-root-relative and stay inside it."
    angle: failure
  - name: test_backslash_path_refused_with_forward_slash_message
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "scripts\\ac_store\\c.py gets one message naming R and the path, stating declared paths use forward slashes."
  - name: test_regenerated_copy_refused_naming_template_source
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: ".claude/agents/test-writer.md is refused as a regenerated copy, and the message names templates/agents/test-writer.md as the file to declare."
  - name: test_template_source_path_produces_no_message
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "templates/agents/test-writer.md produces no message; the five-entry record yields exactly four messages."
  - name: test_regenerated_copy_without_known_source_refused_without_guess
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A path under a regenerated root with no mappable source is refused and the message says no source could be determined, naming no source."
    angle: boundary
  - name: test_regenerated_roots_read_from_build_definition
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A fixture build definition with an extra regenerated root makes a path under it refused, with no change to the check."
    angle: seam
