notes: |
  THE COLLISION BETWEEN THIS L1 AND ACD-2000b. Flagged in ACD-2000a's hazard 1
  and again in the component PROJECT_CONTEXT.md; it is the one failure that
  neither L1's own tests would catch, because it only appears when both land.

  VERIFIED MECHANISM (do not re-investigate): `_update_ac_work_status()` in
  scripts/build_orchestration/fast_lane.py (~lines 113-125) rewrites the ENTIRE
  AC record on every claim and every release -- `yaml.safe_load` of the whole
  file, mutate one key, `yaml.safe_dump` of the whole file back. It is called by
  `claim_build_set()` (~line 128) and by `release_claim()` (~line 224). So every
  single claim/release cycle from ACD-2000b passes ACD-2000a's entire trail
  through a load/dump round trip.

  THE THREE THINGS THAT ROUND TRIP CAN DO TO A TRAIL:
    1. REORDER. safe_dump sorts keys by default; nested structures and any
       author-meaningful ordering are at its mercy. The append-only guarantee of
       ACD-2000a-1 says nothing about a writer that faithfully re-emits every
       entry in a different order -- so this L3 says it.
    2. LOSE FIDELITY. Comments are dropped, dates may be re-typed, multi-line
       strings may be re-wrapped. A trail entry whose text is silently re-flowed
       is still "present" and would pass a naive count assertion.
    3. TRUNCATE. A rewrite is read-all / write-all. An interruption between the
       two leaves a shortened or empty file -- and because the trail is the
       durable retry budget (ACD-2000a-2), a truncated trail silently RESETS the
       cap. That is the most dangerous outcome in this whole L1: it converts a
       crash into an infinite retry loop rather than into an escalation. Hence
       the atomicity clause (third Then).

  THE FOURTH THEN CLAUSE is about writer scope, not concurrency on one file:
  two efforts working on two DIFFERENT requirements must not be able to affect
  each other's records. It is cheap to satisfy with per-requirement files (which
  is the store's shape today) and it fails immediately on any implementation
  that introduces a shared side-log -- which is a plausible response to hazards
  1-3 and would reintroduce exactly the container-grain conflation ACD-2000a
  exists to remove.

  ORDERING NOTE FOR THE IT PO: ACD-2000a and ACD-2000b are siblings with no
  depends_on edge between them, and this L3 is the reason they cannot be
  implemented in ignorance of each other. Whichever lands second must run this
  test. Consider a delivers_to/expects_from contract between ACD-2000a-1 and the
  ACD-2000b claim leaves rather than a dependency edge.

  TESTABILITY. Drive the real claim and release functions against a real AC file
  with a real trail, and diff the file. Simulate the interrupted write (kill
  between read and write, or a write to a full/failing target) rather than
  asserting that a temp-file-and-rename idiom appears in the source -- the latter
  is a grep test and passes on an idiom applied to the wrong path.

  2026-08-17 (IT PO enrichment). Assigned python-coder; the surface is one Python
  function in scripts/build_orchestration/fast_lane.py and its two callers.
  Complexity M. The BA's ordering note is taken up as a CONTRACT rather than a
  dependency edge, exactly as suggested: ACD-2000a-1 delivers the no-whole-record-
  rewrite constraint to the ACD-2000b claim path, and this AC expects the claim
  record fields from ACD-2000b-1. No depends_on edge was added, so the safe
  migration order is untouched.

  TWO CORRECTIONS TO THE BA'S MECHANISM NOTE, both verified against the file and
  both sharpening rather than contradicting it:
    - The reorder is not merely "at safe_dump's mercy". Line 122 passes only
      allow_unicode=True, so sort_keys keeps its PyYAML default of True and the
      whole record is re-keyed ALPHABETICALLY every time. It is deterministic and
      total, not incidental.
    - The truncation window is wider than "an interruption between the read and
      the write". Line 121 opens the LIVE path in mode "w", which truncates at
      open -- so the file is already empty before the first byte of new content is
      produced, and any failure during serialisation (not only a crash between the
      two operations) leaves an empty AC record.

  RECONCILIATION FLAG FOR THE ORCHESTRATOR: the expects_from entry naming
  ACD-2000b-1 was written while ACD-2000b's own enrichment was in flight in a
  concurrent pass. If ACD-2000b-1 ends up specifying its own separate writer for
  the claim fields, that is a contradiction between the two sides of this contract
  and must be resolved before either branch is built.
