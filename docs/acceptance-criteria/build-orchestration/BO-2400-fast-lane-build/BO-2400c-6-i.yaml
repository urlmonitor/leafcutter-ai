title: "A cycle-adjacent subtree resolves identically before and after, proved on a constructed store"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a purpose-built store fixture containing a dependency cycle among at least two
    records, at least one record outside the cycle that depends on a cycle member, and
    at least one record that is reachable from the target only by passing through a
    cycle member,
  When the connected build set is resolved for a target in that fixture — once by the
    resolution as it behaved before the store reading was consolidated, and once
    afterwards,
  Then the two answers are identical: the same ids in the same order,
  And in particular the record reachable only through a cycle member is present in both
    answers or absent from both, so the consolidation cannot have narrowed reachability.

  Given the same fixture,
  When the resolution removes the cycle members from its working view in order to
    produce a deterministic order,
  Then the removal is not observable to the tree walk: the records the walk is given
    still include the cycle members,
  And the resolution still reports the cycle it found, exactly as it did before, so
    consolidating the reading did not also silence the cycle diagnostic.

  Given the repository's own acceptance-criteria store,
  When a guard for this behaviour is considered,
  Then it is built on the constructed fixture and not on that store, because that store
    contains no cycle today — verified 2026-08-24, when a timed resolution run captured
    the resolver's diagnostic output and it reported none — so a guard resting on the
    live store would pass without exercising the behaviour at all, and would keep
    passing on the day the behaviour broke.
