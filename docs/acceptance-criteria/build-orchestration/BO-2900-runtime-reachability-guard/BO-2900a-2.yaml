notes: |
  This AC exists because BO-2900a-1 is otherwise trivially satisfiable by the very
  defect it prohibits, and that is not a hypothetical.

  THE SELF-DEFEATING IMPLEMENTATION. The cheapest way to answer "did this test go in
  through the way in" is to search the test file for the name of the entry point, or
  for a subprocess invocation of the module. That implementation is a presence scan.
  It stays green on a test that mentions the entry point and never runs it, and it
  goes red on a test that reaches the entry point through a fixture or a helper whose
  text does not name it. Shipping BO-2900a-1 on a source scan would put a
  phantom-done guard inside the phantom-done guard — which is precisely how the
  fast-lane runner shipped: its structural tests were green while its gates never
  executed.

  WHY THE THREE DECOYS IN TEST Q ARE NAMED INDIVIDUALLY. A comment, a docstring and
  an uncalled helper are the three forms a partial implementation typically survives:
  a naive substring scan is fooled by all three; a scan that strips comments is still
  fooled by the docstring and the dead helper; an import-graph scan is still fooled by
  the dead helper. Naming all three makes the fixture adversarial rather than
  illustrative. The final clause — delete every mention and the verdict is unchanged —
  is the decisive assertion; it is a property no text-based implementation can satisfy.

  BOUNDARY. This AC governs the METHOD of the determination only. What the
  determination is used for is BO-2900a-1; what happens when there is no way in at all
  is BO-2900a-3; the wording of the resulting refusal is BO-2900e. Do not restate any
  of those here.

  Implementation caution for the IT PO: whatever observation mechanism is chosen must
  itself be exercised end to end. An observation harness that silently records nothing
  makes every test look like test Q and blocks the whole store; one that records
  everything makes every test look like test P and restores the original defect. The
  fixture pair in the criteria is the minimum viable check, and both verdicts must be
  asserted in the same run — asserting only the rejection lets a
  reject-everything implementation pass.

  2026-09-30 (BA). Three L3 children added: BO-2900a-2-i (the observation spans
  the tree of programs a proof launches, not only the process it runs in),
  BO-2900a-2-ii (a run that could not be watched is a third answer, never a
  negative one) and BO-2900a-2-iii (the question must name the code under proof;
  an unnamed question returns undecidable). All three are edge cases of THIS AC's
  existing guarantee — the judgement comes from watching the run — so none of them
  is a new L2, which was unavailable anyway: BO-2900a is at its five-L2 cap and
  BO-2900 at its seven-L1 cap.

  CONTRACT GAP FLAGGED FOR THE IT PO, NOT DECIDED HERE. The record shape stated in
  this AC's it_requirements and delivers_to — one named piece of code, one entry
  point, two booleans, one process — cannot express what the three children
  require: a run spanning several programs, an undecidable third state, and a
  subject derived from the unit rather than from a field. This AC needs AMENDING,
  not replacing; its criteria (execution-derived, decoy-immune, per-test,
  ancestry-aware, loud when unavailable) are right and unchanged, and the
  BA pass deliberately left the contract to the technical layer that owns it.
  Note also that the empty subject in the consuming rule's question is what makes
  reached_through structurally unreachable today; see BO-2900a-2-iii.

  2026-09-30 (IT PO enrichment — the contract amendment the BA pass flagged and left
  here). it_requirements.config_schema_fragment.reach_record and delivers_to were
  AMENDED, not replaced, and criteria, title, req_status and depends_on are untouched;
  it_requirements and delivers_to are not in check_ac_governance._PROTECTED_FIELDS
  (verified: {criteria, title, req_status, depends_on}), so no amended_by entry is
  required. Four changes, one per thing the three children need and the old shape
  could not carry: target -> reached_code as a SET derived from the run; reached_through
  bool -> tri-state so an unnamed question and an unwatched run stop being expressible
  as a plausible negative; observation_ok -> observation + a closed unwatchable_cause
  vocabulary, with the boolean retained only as a derived alias so existing call sites
  do not silently change meaning; and a new processes list so ancestry joins across the
  process boundary by pid/ppid rather than by "both happened somewhere in the run".
  The subject of the question is deliberately NOT looked up in a store field: no field
  anywhere names a callable (surface_invoked — 271 records, 368 occurrences, zero of
  '<module>:<callable>' shape, 166 free prose), and asking the store for one is exactly
  how target_spec="" arose. Three constraints were APPENDED rather than edited: retire
  the bespoke non-pytest runner that violated this AC's own hosting constraint, match
  frames on the resolved file path, and grow observe_test_run's signature accordingly.
  Open item carried out of this pass and NOT edited here, because it belongs to a
  different record: BO-2900a-1's expects_from still quotes the pre-amendment shape and
  its refusal_cause vocabulary still spells the third state 'observation_unavailable'
  rather than distinguishing unwatched from undecidable. That AC needs the same
  amendment before it is built.

  2026-08-13 (IT PO enrichment). Mechanism chosen: a call-level execution recorder
  (sys.monitoring, sys.setprofile fallback) rather than coverage.py line/arc data.
  Coverage arcs answer "was this line executed" but carry no call-stack ancestry, and
  ancestry is exactly what BO-2900a-1-i's reached-through-versus-entered distinction
  requires. The observation_ok flag is added as an explicit third state precisely
  because the IT PO caution above names two silent failure modes that no verdict-only
  assertion can detect.
