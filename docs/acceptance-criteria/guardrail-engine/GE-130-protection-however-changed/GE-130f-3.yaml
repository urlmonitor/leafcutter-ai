id: GE-130f-3
title: Neither repaired guard can be switched on for commands until its refusal on the editing path has
  been observed
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the documentation guard and the guide-read guard, each with a liveness record for its
    editing-path known-bad input as GE-120f-1 defines it,
  And coverage of shell commands, as GE-130a specifies it, can be switched on for each of them
    in the project's shipped hook settings,
  When the shipped hook settings are checked,
  Then a guard whose command coverage is switched on while its editing-path record does not say
    the rejection was observed is named, together with the value its record carries, and the
    check fails,
  And a guard whose command coverage is switched on and whose editing-path record says the
    rejection was observed is not named,
  And a guard whose command coverage is not switched on is not named, whatever its record says,
  And the task-lock guard is outside this rule and is never named by it,
  And the named and the not-named cases above are established in one run over the same settings.
depends_on:
- GE-130f
- GE-130f-1
- GE-130f-2
