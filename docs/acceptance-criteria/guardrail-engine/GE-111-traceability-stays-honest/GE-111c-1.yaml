estimated_complexity: M
it_requirements:
  - "The staged-source trigger set must come from git's staged change list (git diff --cached --name-only, including renames via -M so the OLD path of a rename is in scope) — mirror the established staged-files-only scoping in check_ac_circular_deps (only cycles involving a STAGED AC), check_ac_schema Phase 2 (diff-filter M staged files), and ACS-400e-2 (only staged AC YAML files inspected)."
  - "Scope membership rule: an AC is in scope iff the FILE PORTION of any of its implemented_by entries (anchor stripped) matches a staged source path (the pre-rename old path for a rename). This must build the in-scope set BEFORE anchor parsing so symbol-anchored entries on a staged file are included (criteria scenario 2)."
  - "Must scan the full AC store on disk to find which ACs reference staged files, but evaluate ONLY the in-scope subset — the store scan is read-only and must complete within the pre-commit latency budget (target under 2s); prefer a single pass indexing implemented_by file portions by path."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4) for the git subprocess and YAML reads; fail open (empty in-scope set => no block) only on unexpected internal errors."
delivers_to:
  agent: python-coder
  contract: "The in-scope AC set (list of {ac_id, entry} whose implemented_by file portion is staged) that GE-111b evaluates for drift"
