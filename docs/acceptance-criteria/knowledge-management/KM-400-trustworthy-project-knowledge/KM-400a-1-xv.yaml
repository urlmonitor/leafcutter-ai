id: KM-400a-1-xv
title: Decision properties retain approved reasoning and reject unapproved history
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given a canonical Decision dec-0123456789abcdef has a human approval, a selected option and supporting reasoning
  When its native fields are exposed in the repository graph
  Then its authored id, title, repository_id, decision_type, question, task_context, options, selected_option_id, rationale, approval and provenance remain queryable
  And authored schema_version, kind, description, components, repository_wide, change_target, risk_surface, roadmap_phase, file_globs, criteria, assessment, evidence, assumptions, unresolved_risks, final_outcome, corrections, precedents_considered, related, supersedes and superseded_by retain their original values
  And nested options, criteria, rankings, evidence, corrections and provenance retain their identities, types, order and same-record associations without adding model defaults
  And human approval status, approver and time remain attributable rather than being inferred from the presence of the record
  And missing approval, invalid selected-option references, duplicate local identities, invalid source identity, unsupported schema or unknown declared vocabulary fail explicitly
  And each target declared in supersedes, superseded_by, related or a non-null corrections entry's superseded_by must exist in the canonical store, while a precedent reference may identify a record outside that store
  And when decision A declares decision B in superseded_by, B must declare A in supersedes, preserving the original decision and its correction history
  And an absent or empty canonical Decision store yields no records rather than synthetic decisions or runtime-event substitutes
  And pending records outside the selected immutable source are not imported as approved history
depends_on: [KM-400a-1]
