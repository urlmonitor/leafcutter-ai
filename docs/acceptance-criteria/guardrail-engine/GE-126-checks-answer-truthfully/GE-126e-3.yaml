  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  THE SHARED-MACHINERY QUESTION, ANSWERED AT ENRICHMENT TIME AS THE L1 ASKED. Two candidate
  sources of a shared notion of the registered set exist today. The first is
  check_hook_parity.py, which already reads the registration data for a different purpose and
  is in this repository now - the census should read the same data through the same accessor.
  The second is GE-120c-3's parity harness, which is APPROVED AND UNBUILT; it cannot be
  extended because it does not exist, and its folder is byte-frozen so this tree cannot amend
  it to arrange sharing. The recorded decision is therefore: share with check_hook_parity's
  reader of the registration data now, and if GE-120c-3's harness lands before this record is
  built, extend that harness rather than writing a second execution engine and record the
  change. This is the reason the L1 asked for, written down rather than inferred.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY - the only edge in the tree to
  architecture-diagram-author. GE-126e-4's diagram has a specific obligation this record
  supplies: showing the population as DERIVED rather than held. A diagram drawn before this
  lands would have to show a census-owned list, which is the design this record forbids.

  ENROL AND EXECUTE FROM THE SAME LAYOUT. The sixth it_requirement is mine: GE-126e-1 requires
  the census to execute deployed copies, so enrolling from the source manifest would measure
  one population and describe another. It is the kind of split nobody notices until the two
  layouts diverge by one check.

