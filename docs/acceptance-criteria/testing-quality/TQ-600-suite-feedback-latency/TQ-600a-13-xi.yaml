assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE ALLOWED-WRITE LIST IS ENFORCED IN ONE PLACE EVERY WRITE PASSES THROUGH. The shared
    REST client refuses, before sending anything, every write that is not one of: create
    an issue carrying the label `nightly-red`; comment on a `nightly-red` issue; close or
    reopen a `nightly-red` issue; create or edit the hold check's own marked comment on
    the pull request being evaluated. Refused by construction: git refs, repository
    contents, pull-request create/update/merge/review, merges, labels on other issues or
    pull requests, workflow dispatch, releases. Reads are unrestricted.
  - >-
    DEFENCE IN DEPTH IN THE WORKFLOWS. No job in either workflow holds `contents: write`
    or the right to create or merge pull requests; the test-running job holds
    `contents: read` only; checkouts in the flag and hold jobs do not persist a git
    credential in the workspace. So even a step that bypasses the client cannot push.
    These are the enforcement points that actually run on the hosting service; the
    client allowlist is what the unit layer can observe. Both are required.
  - >-
    THE NIGHTLY NEVER REGENERATES A BASELINE. Refreshing .github/test_durations.json — or
    any recorded baseline a timing-ratio test reads — stays the job of test-durations.yml,
    through a pull request. A red nightly "fixed" by moving the baseline is the named
    failure this record exists to stop.
  - >-
    LATER TRIAGE FITS INSIDE THE LIST. A diagnosis posted as a comment on the flag is an
    allowed write and needs no change here; anything that opens a pull request does.
  - >-
    A SYNTHETIC SCRATCH REPOSITORY STANDS IN FOR "A REAL SCRATCH CLONE OF THE REPOSITORY" —
    A MEASURED COST SUBSTITUTION, FLAGGED. Measured at enrichment (2026-10-08): a depth-1
    clone of this repository takes 5.16 s, over half of the whole family's ~10 s test
    budget, and its tracked content is irrelevant to the property under test (branches,
    tags, index and working tree unchanged). The descriptors use a real git repository
    built by the shared harness, with a local bare repository as its origin so a push is
    observable as a change of the bare repository's refs. If the owner wants the literal
    clone, it belongs in a `_MANUAL` test run by the nightly itself — not in the default
    suite. Recorded as a caveat for the BA.
  - >-
    THE TESTS COST UNDER 1 s. The in-process paths (green, red, did-not-complete, hold,
    pass, declared fix, failed read) run against the recording fake server and the scratch
    repository; the mutation descriptor executes only the nightly's flag job — never its
    test-running job — on mutated copies of the workflow file, so it starts no pytest.
delivers_to: null
expects_from:
