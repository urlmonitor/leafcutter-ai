id: GE-124c-3-i
readiness: approved
priority: high
title: "One unreadable file does not block the rest of the commit, and is named"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given the staged set contains two in-scope screen components
  And one of them cannot be read by the declaration check — its markup does not
    parse
  And the other carries a component-level declaration whose ids all resolve
  When the commit-tier declaration check runs
  Then the unreadable file does not cause the commit to be rejected
  And the unreadable file is named in the check's output together with the
    reason it could not be read
  And the readable file is still evaluated and its pass record is still produced
depends_on:
  - GE-124c-3
