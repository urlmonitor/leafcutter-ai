title: "Work whose local pre-commit check was skipped is still caught by the CI gate"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the proof-of-done pre-commit check was skipped locally (via a skip flag, or
    because a worktree lacked the hook configuration),
  When the resulting commit is pushed and CI runs on the fresh checkout,
  Then the required CI proof-of-done check still detects the missing or failing proof
  And blocks the merge, so the local skip cannot let unproven work reach the
    protected branch.
