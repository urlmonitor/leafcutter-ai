notes: |
  Engineering shape (out of criteria prose, for IT-PO): a new commit_guardian
  hook (e.g. check_agent_verification_consistency) inspects staged
  templates/agents/*.md frontmatter. Rule: requires_verification: true AND
  tools contains neither Edit nor Write -> exit non-zero (fail-closed). This
  is the contradiction that broke build.py's registry self-description
  validation post-merge (pt-classifier.md: requires_verification: true,
  read-only). "Blocked fail-closed" = hook returns non-zero exit for this case.
