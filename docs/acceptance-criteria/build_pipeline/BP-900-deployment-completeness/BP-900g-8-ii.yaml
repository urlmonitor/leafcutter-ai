estimated_complexity: M
it_requirements:
  reference_file_path: "scripts/build_phases.py"
  n_location_rule: "all — every deploy phase that ships a file a deployed script reads, AND the deploy_map skip branch. That skip branch is the enforcement point that actually runs, and it currently fails open: it logs 'source script not found, skipping' at WARNING and continues, so it already sees a missing entry and lets the build pass. A closure whose verdict is routed only through it changes nothing. Name every enforcement point the change touches in the sign-off and state which one is load-bearing."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir /tmp/lc-consumer-probe"
    - "env -u PYTHONPATH python /tmp/lc-consumer-probe/.leafcutter/scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-8-ii.yaml"
    - "env -u PYTHONPATH python /tmp/lc-consumer-probe/.leafcutter/scripts/commit_guardian/check_doc_frontmatter.py docs/known-issues/build-pipeline.md"
    - "python -m pytest unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The dependency record the closure emits, widened so that a non-code read is the SAME kind of thing as an import rather than a second notion bolted alongside it. The defect is that a JSON file is not a dependency as far as any existing guard can tell; if the widening produces two record shapes, two code paths follow, and the data path is the one that ends up logging a warning while the module path raises. One record, one discriminator, one verdict path."
    required:
      - dependency
      - kind
      - read_by
      - deploy_phase
      - resolution
      - enforcement_point
    properties:
      dependency:
        type: string
        description: "The intra-package file the deployed script needs - a module it imports or a non-code file it reads. Recorded as the path the build would have to ship, so a red build hands the author a remediation list rather than a diagnosis."
      kind:
        type: string
        description: "One of: module, data, unresolvable. Three values, not two. 'unresolvable' is required because a data read is an ordinary call against a path that may be constructed, so the static half will not always decide - and an unknown silently classified as not-ours is the same fail-open in a new place."
      read_by:
        type: string
        description: "The deployed script that imports or reads it. Demanded by the criterion's naming clause, and necessary because the second hop of a transitive chain is the hop the author actually has to fix."
      deploy_phase:
        type: string
        description: "The phase in scripts/build_phases.py that would have to carry it. Without this the failure names a gap and no owner."
      resolution:
        type: string
        description: "derived or underivable. The field that keeps the underivable set visible; a closure that drops what it could not resolve looks exactly like a closure that found nothing to complain about."
      enforcement_point:
        type: string
        description: "Which gate consumes this verdict and fails the build on it. Present so a sign-off cannot claim enforcement while the verdict is routed only through the branch that logs and continues."
  constraints:
    - "VERIFY FROM THE DEPLOYED LAYOUT, IN A COLD PROCESS, WITH THE PACKAGE SOURCE TREE OFF sys.path. Every existing unit test in this family imports from scripts/, which is exactly why all five prior instances of this defect stayed green: the source tree contains every sibling and every config by construction, so the assertion is structurally incapable of failing there. A test that imports from the source tree does not satisfy this AC, whatever it asserts. The reproduction to reproduce, confirmed on 2026-08-25 in a genuine adopter install (package checked out at leafcutter-ai/ and built with `python scripts/build.py --target-dir <consumer root>`, an adopter main checkout rather than a worktree): `python .leafcutter/scripts/ac_store/validate_ac_schema.py <ac>.yaml` raised ModuleNotFoundError for _ac_components, and `python .leafcutter/scripts/commit_guardian/check_doc_frontmatter.py <doc>.md` raised FileNotFoundError for the doc_types declaring file. Both must be red before the change and green after, observed from that layout and never from the package repo."
    - "ADDING THE NAMED MODULE OR FILE IS NECESSARY AND NOT SUFFICIENT. Stated as the register states it: treat 'add the module to deploy_map' as a fix for the instance, never for the defect. That map has been patched four times for this same class (done_proof.py, test_enforcement.py, ac_parent_id.py, ac_coverage_resolver.py), five of its eleven entries now carry a comment explaining why that particular module must not be forgotten, and a sixth instance was found on 2026-08-25 - check_ac_parent_covered_by.py cannot import derive_parent_id in a deployed layout and exits 0 silently. A list that needs a warning per entry is a record of the mechanism's absence. Reachability must hold by construction or by a gate that fails the build, never by someone remembering."
    - "STAY LOUD; A SILENT FALLBACK IS A REGRESSION EVEN WHEN IT MAKES THE ERROR DISAPPEAR. The fail-closed posture on the document type vocabulary was established deliberately by GE-118c, which removed precisely such a narrowing. The sibling _find_diagram_types_json in templates/scripts/commit_guardian/diagram_type_validators.py is the identical walk and still returns None, degrading silently to a built-in constant - the next instance, already waiting, and the shape a lazy fix here will reach for. No change may reinstate a silent fallback to a narrower built-in list on either side. Note the second-order consequence: a silently-degrading reader is invisible to any startup or verdict sweep because it produces an answer, so if this change leaves one in place, name it in the sign-off as a blind spot rather than counting it as covered."
    - "DEPLOY WHERE THE EXISTING WALK ALREADY REACHES, AND WHERE A WORKTREE STILL SEES IT. `.leafcutter/config/` already exists and is git-tracked in a consumer install (it carries commit_guardian/ and feedback_categories.yaml), so a declaring file placed there is reachable by the ancestor walk as written and survives into a git worktree. A destination that requires the walk to grow another hardcoded candidate trades this defect for the next one. Neither `<consumer>/config/` nor `<consumer>/leafcutter/` exists in a genuine adopter install - confirmed by direct inspection on 2026-08-25 - which is why the two existing candidates in _find_doc_types_json both miss."
    - "PACKAGE-DIRECTORY NAME INDEPENDENCE IS OWNED BY BP-900h-4-i AND IS NOT RE-SPECIFIED HERE. That AC owns the layout matrix and the prohibition on spelling a package-directory name in any candidate path. This AC must not contradict it: any path this change constructs must derive the location rather than name the directory, because the same lookup fails differently under the two adopter directory names - with the package at `leafcutter/` the second hardcoded candidate resolves in a main checkout and fails inside a git worktree, and with it at `leafcutter-ai/` it fails everywhere, main checkout included. Both adopter reports were correct. Reference h-4-i for the proof; do not build a second layout matrix here."
    - "WHATEVER THE GATE SURFACES ON FIRST RUN MUST BE ENUMERATED, NOT SKIPPED. Turning a derived closure on will reveal a pre-existing set of undeclared dependencies well beyond the files named in this AC's doc_links. That is the intended effect. The full set must be listed in the sign-off and each entry either resolved or explicitly deferred with a date. Parking the remainder behind a skip list reintroduces, inside the mechanism built to remove it, the hand-maintained list that is the defect."
    - "IDEMPOTENT AND WITHIN THE PREFLIGHT BUDGET. The derivation must be deterministic and byte-stable across runs on an unchanged tree, use static analysis of the package's own files only, and add no network call and no per-file subprocess to the build preflight."
delivers_to:
  agent: python-coder
  contract: "A deployed-dependency set that includes non-code reads, and a build failure naming the file, the reading script, and the deploy phase — the same verdict shape g-8 produces for modules, so the two do not report differently for the same class of gap."
expects_from:
  ac_id: BP-900g-8
  contract: "The derived intra-package dependency closure and the temporary-target deployed-tree harness. This AC widens the closure's notion of a dependency rather than building a second closure beside it."
test_spec:
  - name: test_bp_900g_8_ii_derived_closure_for_a_deployed_guardrail_contains_the_non_code_files_it_reads
    target_dir: unit_tests/
    framework: unittest
    type: unit
    angle: criterion
    description: "Compute the closure for the deployed guardrails from the code and assert the non-code half is in it: config/doc_types.json in the closure of the document-frontmatter guardrail, config/ac_store_schema.json in the closure of the AC-schema guardrail, config/agent_registry.json in the closure of the planning workflow. For each, assert the closure ALSO reports it as not covered by the deploy declaration at HEAD, so the containment claim and the verdict claim are both exercised. Assert the closure's contents and the containment verdict - never that a filename appears in a list literal in build_phases.py, which is green on a hand-maintained map."
  - name: test_bp_900g_8_ii_build_subprocess_blocks_when_a_non_code_read_is_withheld_from_the_deploy_manifest_with_the_same_force_as_a_module
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier; charges deployed at the same time. Copy the package tree to a temp dir and run python scripts/build.py --target-dir <tmp_target> as a SUBPROCESS in three states: (1) unmodified tree - exit 0; (2) one NON-CODE dependency of a deployed script withheld from the deploy declaration - non-zero, and the output names the file, the reading script, and the phase that would have to carry it; (3) one MODULE dependency withheld instead - non-zero with the same three elements named. Then assert the same-force clause by comparing (2) and (3): both are non-zero and both report the same shape, so a data-file gap cannot be a warning while a module gap is an error. State (1) is not optional - a positive-path build alone cannot tell a working guard from an absent one."
  - name: test_bp_900g_8_ii_a_non_code_read_added_after_the_guard_exists_fails_the_build_without_any_change_to_the_guard
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: failure
    description: "THE DERIVED-NOT-HARDCODED CONTROL, and the entry the criterion explicitly demands. In a temp copy of the package tree, create a config file that has never existed before under a name the guard cannot know, add a read of it to a deployed script, and add it to NO deploy map. Run build.py as a subprocess and assert non-zero naming the new file and the script that reads it. Then add it to the appropriate deploy map and assert the build passes. A guard that recognises only the five files named in this AC's doc_links is green on entries 1 and 2 and dies only here - which is the difference between widening the mechanism and deploying the five known files, the failure mode the AC notes forbid."
  - name: test_bp_900g_8_ii_a_read_of_an_operating_system_or_external_tool_path_is_not_added_to_the_derived_set
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: boundary
    description: "The does-not-demand-what-the-package-does-not-own half. In a temp copy, add to a deployed script a read of an absolute operating-system path and a read of a path owned by an external tool the package does not ship; run build.py as a subprocess and assert exit 0 with neither path named in the report. Pair it with the control that a package-owned config file added in the same commit IS still named - otherwise the exclusion is satisfiable by a rule that excludes everything, which is the same defect as no rule at all. Also assert that whatever the derivation cannot resolve statically is reported as underivable rather than silently dropped from the set, since a silent drop is indistinguishable from a clean closure."
test_rationale: |
  The failure mode this AC is against is not five forgotten files; it is that every
  guard in the family is phrased in terms of scripts, so no guard was capable of having
  an opinion about a JSON file. That makes the derivation clause, not the presence
  clause, the thing the tests have to be able to falsify — and entry 3 is the only one
  that can. A guard hardcoded to the five files named in this AC's own doc_links passes
  entries 1 and 2 completely, because those entries name exactly those files. Entry 3
  introduces a config file the guard cannot possibly know about, after the guard
  exists, which is the construction the criterion itself specifies.

  Entry 2 runs build.py as a subprocess against a temp target rather than calling the
  preflight function, and it runs both the withheld and unmodified states through the
  same command. A positive-path build alone cannot tell a working guard from an absent
  one, and a guard exercised only through its own function is not evidence that
  build.py consumes its verdict. The third state in that entry — withholding a module
  instead of a data file and comparing the two reports — is how the same-force clause
  becomes falsifiable; without it, an implementation that logs a warning for data files
  and raises for modules satisfies every other assertion in this contract.

  Entry 4's second half is the one most likely to be dropped. An exclusion rule for
  operating-system and external-tool paths is trivially satisfiable by a rule that
  excludes too much, and a closure that silently omits what it could not resolve
  statically looks exactly like a closure that found nothing to complain about. The
  criterion's own reasoning says a data read is an ordinary function call against a
  path that may be constructed, so underivable reads are expected and must be visible
  in the report rather than absorbed into a clean result.

  Angles: criterion, reachability (which charges deployed in the same subprocess test,
  as the taxonomy explicitly permits), failure, boundary — at the cap of four.
