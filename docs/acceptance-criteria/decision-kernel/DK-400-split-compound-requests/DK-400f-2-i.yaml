criteria: |
  Given the reusable-criteria split where p1 reached its budget stop, p2 and p3 wait for p1,
    and p4 was decided,
  When the run ends partial,
  Then the split section has four lines, one per part:
    "p1 not settled: its decision reached its budget stop",
    "p2 not run: waits for p1, which was not settled (budget stop)",
    "p3 not run: waits for p1, which was not settled (budget stop)",
    "p4 decided: Mine from both Langfuse traces and published decision records (<p4's record
    id>, staged)",
  And p1's line never says "not run", because p1 ran,
  And the report gives the run's outcome as partial, not completed.
