notes: |
  RETIRED 2026-09-09 with the whole ACD-800 tree. Decision, mechanism and the
  live-code hazard are recorded once, in ACD-800's notes — read those.

  THIS RECORD'S OWN REASON. Idempotency is a genuinely good property and was
  the right thing to specify, but it is idempotency OF the forbidden write:
  "work_status remains done (not re-set)". It guarantees the phantom-done badge
  is awarded exactly once rather than not at all, so it cannot outlive the
  operation it protects. It also uses ACD-800a-1 as its own worked example,
  which makes it unreadable once that record is retired.

  BUILT, DESPITE THE FIELDS. Covered by a green test tagged
  `# covers: ACD-800c-2` in tests/ac_store/test_cross_reference_audit.py.
