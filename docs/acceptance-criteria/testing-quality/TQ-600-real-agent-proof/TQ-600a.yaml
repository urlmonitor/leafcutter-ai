id: TQ-600a
components:
  - testing_quality
  - agent_registry
title: "Check what an agent actually does by asking the real agent, only when you choose to"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Ask the real agent, get a clear pass or fail, and keep the record.

  When you switch it on, each case asks the agent exactly as the project ships it
  and passes or fails on one definite check of its reply, leaving a record of what
  was asked, what came back and whether it passed; left off, nothing is asked and
  nothing is counted as passed, and a switched-on run that cannot reach the agent
  fails by name.
