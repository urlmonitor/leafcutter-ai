notes: |
  WHY THIS IS NOT ALREADY COVERED BY BP-900g-10. The parent forbids continuing with a
  NEUTRAL default — an empty mapping, an empty list, a passthrough — on the grounds
  that a neutral default is indistinguishable from a correct result. A substitute rule
  is the opposite shape and slips straight past that wording: it is not neutral, it is
  not empty, and it is emphatically distinguishable from a correct result. It produces
  a large, confident, specific set of findings. That is what makes it worse than the
  neutral case, not better — nobody investigates an empty result for half a day, and
  920 findings command immediate attention and point in the wrong direction.

  THE MISDIRECTION IS THE HARM, and it is what the criterion is written to prevent.
  Rank the two failures by what they cost the reader: a guardrail that stops costs one
  lookup of a filename. A guardrail that substitutes costs an investigation of 920
  records that were never wrong, and ends with a consumer editing their identifiers to
  satisfy a rule that does not apply to them. The second outcome is reachable from the
  first only by an implementation that treats "I have something to fall back on" as
  permission.

  ONE FURTHER TRAP. Reporting the substitution as a warning and then proceeding does
  not satisfy this criterion. The parent already establishes why — a warning into a
  transcript carrying hundreds of lines is observationally equivalent to silence — and
  here the warning would be printed immediately above 920 findings that appear to
  explain themselves.
