it_requirements:
  config_schema_fragment:
    type: object
    description: "Contract-violation record the harness raises on an instruction-less dispatch. Extends the harness's existing contract_violation surface; registers no persisted config key."
    properties:
      kind:
        type: string
        enum:
          - instruction_less_dispatch
      step:
        type: string
  reference_file_path: "unit_tests/_workflow_engine_harness.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Extend the existing contract_violation surfacing in unit_tests/_workflow_engine_harness.py so an intercepted agent() dispatch whose first argument is an object or empty value (no instruction string) raises a contract violation that names the instruction-less dispatch and fails the test."
    - "No such violation is raised when the first argument is a non-empty instruction string."
    - "The violation is on the dispatch contract itself, so it must fire even when the dispatch test-double is stubbed to return a success value (BP-1100f-4-i) — a return-value stub cannot suppress it."
    - "Maintain SPEC PARITY with the BP-1100f-1 pr-reviewer lens predicate (the same 'instruction-less first argument' definition); the .py harness and the .md lens cannot share code, so mirror the single normative definition."
    - "Errors handled per the project error-handling policy (typed exceptions, no bare except, log-or-raise); the violation must be raised loudly, never swallowed."
    - "Portable per ADR-001 — the harness ships in the package and behaves the same in any consumer that runs build.py."
test_spec:
  - name: test_harness_raises_contract_violation_on_object_first_arg
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "Drive a tiny workflow via run_workflow_under_e2 that dispatches agent() with a bare object as the first argument; assert the harness raises a contract_violation naming the instruction-less dispatch and fails the test."
  - name: test_harness_raises_on_empty_first_arg
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "Drive a workflow dispatching agent() with an empty or whitespace-only first argument; assert the same instruction-less-dispatch contract_violation is raised."
  - name: test_harness_passes_nonempty_instruction_string
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "Drive a workflow dispatching agent() with a non-empty instruction string; assert no contract_violation is raised and the workflow completes."
