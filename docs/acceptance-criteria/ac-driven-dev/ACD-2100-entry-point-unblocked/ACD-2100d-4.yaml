notes: |
  ONE PAGE SERVING THREE TRIGGERS. ACD-2100a, ACD-2100b and ACD-2100d each declare a
  reference-doc documentation trigger, and all three want the same page: which copy
  of the route runs where, what the startup checks are, and where a repair has to
  land. Authoring three pages would fragment it, and there is no slot for a
  documentation child under a or b in any case -- both are full at five. This record
  is deliberately homed under d because the subject is the source-versus-installed
  boundary, which is d's subject.

  IT DOES NOT SERVE ACD-2100c's TRIGGERS. That L1 asks for a sequence diagram and a
  how-to about the gate and pause-and-resume flow, which is a different subject and
  has no slot under c. Reported to the it-po rather than smuggled in here.

  2026-08-26: those triggers are now served by `ACD-2100e-1` (the sequence diagram)
  and `ACD-2100e-2` (the how-to), authored as a sibling L1. The boundary this
  paragraph draws is unchanged and still binding IN BOTH DIRECTIONS: this page must
  not describe the gate flow, and neither `e-1` nor `e-2` may restate which copy runs
  where or what the startup checks report. What has changed is only that the other
  side of the boundary now has an owner, so "reported to the it-po" is closed.

  WHY THE READER IS IN THE GIVEN. The failure this page exists for is a message about
  a missing file, and the reader arrives already confused about which of two copies
  they are looking at. A page organised around the layouts rather than around the
  reader's question would be accurate and useless.

  THE LAST CLAUSE IS THERE because an unreachable page is not documentation, and the
  component declaration is what puts it in the component view alongside the criteria
  it explains.

  2026-08-25 (it-po): assigned documentation-expert and sized M -- larger than a
  single-contract reference page because it reconciles three layouts, an installer
  mapping and the closed set of startup checks, each owned by a different sibling.

  TEST CONTRACT: test_required: false, with the reason recorded in test_rationale rather
  than left to inference. This follows the store's convention for a prose reference page
  whose rules are enforced by executing tests on the records that own them
  (BO-2900f-5 is the closest precedent). It is permitted here because change_target is
  docs -- the schema validator rejects test_required: false only on a leaf CODE AC.

  TWO ORDERING GAPS FOUND AND NOT EDITED (depends_on is BA-owned). The criteria need two
  upstream deliverables that depends_on does not carry:
    - ACD-2100d-2 supplies the second Then clause in full -- which directory a repair
      must land in and which are regenerated. Nothing else in the tree produces it.
    - ACD-2100b-4 supplies the closed set of startup-check outcomes the third Then clause
      enumerates. depends_on names ACD-2100b-3, which is two of the four outcomes.
  Both are recorded above as expects_from contracts, but the build sequencer reads
  depends_on only (KI-ACD-015, open), so an expects_from edge orders nothing. The
  recommended edit before approval is depends_on: [ACD-2100d, ACD-2100a-5, ACD-2100b-3,
  ACD-2100b-4, ACD-2100d-1, ACD-2100d-2]. Left to the BA rather than applied here.

  COMPONENTS LEFT AS AUTHORED ([ac_driven_dev, documentation_system]) rather than tagged
  build_pipeline like its d siblings. The deliverable is a prose page owned by the
  documentation surface; the build-side facts it states are owned by ACD-2100d-1,
  ACD-2100d-2 and ACD-2100d-3, all three of which already carry build_pipeline. Tagging
  this record too would put a page into the build component view for a reader who cannot
  act on it, and would not add a fact the graph does not already have.
