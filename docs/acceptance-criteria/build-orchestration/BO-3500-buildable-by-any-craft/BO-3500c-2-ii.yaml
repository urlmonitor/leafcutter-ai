amended_by:
  - date: 2026-08-31
    agent: business-analyst
    reason: "Findings F4 and F5, plus the one-instrument judgement call. F4: a render gate is not affordable — no renderer is installed, there is no root package manifest, and a portable package installed into arbitrary repositories cannot assume a JavaScript runtime. F5 dissolves the problem rather than weakening the proof: the user is moving to structured data as the foundation for diagrams, and a structured source is schema-validatable, so the malformed-source failure a render catches is caught earlier and more precisely with no renderer at all. The render clause is replaced by schema validation plus element resolution. The third scenario records the decision that a diagram is a distinct authoring kind but NOT a distinct instrument — it is the reading-class check with a per-file-type reference extractor, of which the schema validation is the parameter. The fourth scenario routes diagrams not yet held as structured data to the up-front refusal of BO-3500c-4 rather than to a weaker proof."
