criteria: |
  Given the product-truth store,
  When validate_product_truth.py runs,
  Then it errors (non-zero exit) if any step/branch impl_status differs from the value
  recomputed from its ACs' work_status (D1),
  And if any AC's product_truth differs from the by_ac inversion, or an AC carries a
  product_truth no flow references (D2),
  And if index.json by_component / by_entity / by_flow / by_ac differ from a fresh rebuild
  (D3),
  And if a step/branch screen resolves to no registered mockup — a warning when the flow
  is not approved, an error when it is (D4).
