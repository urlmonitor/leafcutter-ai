  - path: docs/product-truth/mock-data/leafcutter/decisions.mock.json
    relationship: specified-by
    status: exists
    relevance: "report_lines: one line per part starting with the part id; [] while the gate is open; record dcp-split-bounds-mid-run."
  - path: docs/how-to/run-the-decision-kernel.md
