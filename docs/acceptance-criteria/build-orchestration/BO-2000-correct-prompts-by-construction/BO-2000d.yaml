title: "Package-surface ACs must carry a machine-checkable implementation spec"
component: build-orchestration
level: L1
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A package-surface AC cannot reach a coder without a real, checkable spec.

  For ACs that touch the package surface (assigned to python-coder in the
  build_pipeline or build-orchestration components), the implementation
  requirements MUST carry the config-schema fragment, resolved reference-file path,
  N-location rule, required skills, and post-write commands. A machine-checkable
  schema enforces this so a thin or fictional entry (for example an unresolvable
  registration reference) cannot pass, and the IT-PO agent's own template states
  the obligation. The spec is validated at authoring time, before it can ever be
  handed to an agent.
