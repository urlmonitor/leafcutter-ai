roadmap_phase: phase_1
criteria: |
  Given the reconciliation is run for the first time over a store that already
    contains disagreeing pairs,
  When it reports,
  Then the number of conflicts present at that moment is recorded as the starting
    population,
    And every one of them is listed with the same detail as a conflict found later.

  Given a subsequent run,
  When it reports,
  Then it states the current number of outstanding conflicts and the starting
    population it is measured against,
  So progress is legible without anyone keeping their own tally.

  Given a conflict that was present in the starting population and one raised
    afterwards,
  When both are reported,
  Then neither is exempted, deferred by default, or reported with less detail than
    the other,
  So being old is not a reason to be ignored.

  Given a store whose starting population is large,
  When the reconciliation runs,
  Then it still reports every conflict rather than a sample or a capped list,
    And it does not stop the work of the project on account of them,
  So the backlog is neither hidden nor turned into a blockade.
