notes: |
  The step is the "test-planner with source access" decided at the PO gate (user decision
  1). No such agent exists yet in templates/agents/; IT-PO: creating and registering it
  is part of this AC's delivery or a sibling AC - decide at enrichment.
  ADR-009 (planner has no source access) is left intact: the code-reading work moves to a
  step that is allowed to read code, rather than the planner gaining access.
  ACS-500c-2 (preserve implements_pattern / pattern_bindings) and TKT-300a-4 (criteria
  byte-identical) now bind this step too - last clause.
  Named alteration: design an entry from the criteria text alone without opening the
  file -> the "files opened" list is empty and ACD-2400c-1-i rejects the ungrounded path.
