      - Sufficiency is asked once per criterion (5 questions), satisfaction once per option and criterion
        (20). The criteria's '20 judgements, each for satisfies and for sufficient' reads as 40; BA
        to clarify.
      - A first assessment runs BEFORE the targeted round (it classes criteria and finds the round
        due); the ranking comes from the assessment after the round. 'Retrieved before the assessment
        starts' holds for the ranking assessment only.
      - No test isolates the supporting-mean tie-break of rank_satisfies.
