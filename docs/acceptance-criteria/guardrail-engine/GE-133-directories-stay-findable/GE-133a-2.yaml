id: GE-133a-2
title: "A set-aside folder is reported as set aside with its stated ground and counted apart from the judged ones, so a run that judged nothing never reads as a clean run"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the configuration declares docs/acceptance-criteria/ as a set-aside
    location with a stated ground,
  And a commit stages one file in each of 5 folders: 2 store folders that stand
    at 19 and 30 countable files after the commit, and 3 folders outside the
    store, scripts/tools/, unit_tests/tools/ and docs/guides/, each standing at
    or under 15 after the commit,
  When the author performs an ordinary commit,
  Then the commit completes, and its outcome states that 3 folders were judged
    and 2 were set aside,
  And it names each of the 2 store folders together with the stated ground its
    declared location carries,
  And neither store folder appears among the folders reported as within the
    limit, nor among the folders reported as already over the limit — a folder
    that was never judged is reported as set aside and as nothing else.

  And given the same commit with one file also staged in a third store folder,
  When the author performs an ordinary commit,
  Then the judged figure the outcome states is 3 and the set-aside figure is 3,
    and the third store folder is among those it names as set aside — so the
    set-aside figure moves with its own population and is not a fixed number.

  And given a commit in which every staged file lies in a store folder,
  When the author performs an ordinary commit,
  Then the commit completes, and its outcome states that 0 folders were judged
    and names each store folder as set aside,
  And it does not state that the folders it checked are all within the limit,
    because it judged none.
depends_on:
  - GE-133a
