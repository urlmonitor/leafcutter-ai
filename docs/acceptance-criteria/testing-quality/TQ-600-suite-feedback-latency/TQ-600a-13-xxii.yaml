estimated_complexity: S
it_requirements:
  - >-
    AGENT CONFIRMED: python-coder (scripts/ci/ module plus workflow glue, as TQ-600a-13-v).
  - >-
    ONE NEW STAGE VALUE, NAMED ONCE. Add one did_not_complete stage for the live-database
    start-up (indicative `live_database_startup`) to the stage vocabulary of TQ-600a-13-v,
    defined in the single place that vocabulary lives today and rendered by every reader of
    it. It must not reuse `setup` or any other existing stage, and its human wording must
    say the live-database tests never ran. Applies equally when the failure is on the live
    first execution or on the live retry.
  - >-
    WHO OBSERVES THE ENDING. A service container that never reports healthy fails the job
    during container initialisation, before any step runs, so no module in that job can
    record anything: the verdict job must attribute the stage from the live job's result
    plus the absence of its report, which is only possible because the live lane runs in
    its own jobs (TQ-600a-13-xxi). That a failed service health check ends the job before
    its first step is UNVERIFIED for this repository — record it once from a real run in
    notes. "Healthy, then refuses the first connection" is observed inside the job: the lane
    must establish that every instance accepts a connection before it executes any test,
    and record a failed reachability result in its report so the verdict job reads
    `live_database_startup` and not a list of connection errors.
  - >-
    NO NODE IDS FOR THIS ENDING. When the stage is the live-database start-up, the live
    lane's `failing` list in the verdict artifact is empty and no consumer prints a
    "failing tests" heading for that run, whatever the per-test report would otherwise
    contain.
  - >-
    THE HOLD'S WORDING NEEDS THE STAGE WITHOUT THE NOTICE. Today the hold (TQ-600a-13-vi)
    distinguishes red from did-not-complete from the verdict job's step names alone and does
    not read the artifact. To say "the live-database tests never ran" in the hold's output
    and its pull-request comment, the hold must learn this stage by a read that does not
    depend on the notice write succeeding (TQ-600a-13-ii rule). The mechanism is the
    implementer's choice; likely surfaces, to confirm against source: scripts/ci/
    post_merge_hold.py and its wording helper, and scripts/ci/post_merge_notice.py's
    renderer. Any file actually changed is added to declared_files.
  - >-
    NOTICE LIFECYCLE UNCHANGED. The new stage enters the notice through the existing
    did-not-complete path: raise when none is open, update the open one, close nothing, lift
    no hold. No new branch in the lifecycle.
  - >-
    "PRODUCED, NOT SIMULATED" — WHERE IT IS CHEAP AND WHERE IT IS NOT. A database address
    that never answers and a listener that accepts the health probe then refuses the next
    connection can both be produced locally without a real graph database. A service
    container failing its health check during job initialisation is an event of the hosting
    service and cannot be produced in the unit layer; there the honest form is to execute
    the verdict job's real steps with the dependency results and missing report the runner
    would give it, stated as a substitution.
  - >-
    TEST COST: under 0.5 s of the family's 15 s default-run budget; no build, no GitHub, no
    real graph database in the default run.
