id: INF-1300d-1
title: "A kind of picture the project does not declare is refused; one it declares but has retired is honoured under its current name"
component: infrastructure
components:
  - documentation_system
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300d.yaml"
criteria: |
  Given the project declares a vocabulary of kinds of picture, in which one name
    is marked as a retired alias of another,
  When a document is requested for a name the vocabulary does not declare at all —
    including a name that differs from a declared one by a character or two, or
    that differs only in how the words are joined,
  Then nothing is written anywhere, and the refusal names the value that was
    asked for, says it is not declared, and lists the names that are,
  And the refusal does not substitute the declared name the asked-for name
    resembles, does not choose the closest match, and does not produce a document
    of any kind,
  And given instead a name the vocabulary declares but marks as retired in favour
    of another,
  When a document is requested for it,
  Then the request is not refused: a document is produced, it declares the current
    name rather than the retired one, and the run states that the substitution was
    made and which name was used,
  And a name that differs from a declared one only in letter case, or only in
    surrounding whitespace, is treated as the declared name rather than as an
    unknown one.
