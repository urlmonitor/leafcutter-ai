id: BP-1100a-2
title: "Ticket-supervisor pre-dispatch read halts a behavior ticket with only documentation in files_touched"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose acceptance criterion describes runtime behavior and whose
  files_touched lists only documentation surfaces (SKILL.md and ADRs) with no file
  under scripts/workflows/ or templates/workflows-js/,
  When ticket-supervisor performs its read-ticket step before dispatching the first
  coder,
  Then ticket-supervisor surfaces a structured blocker that names the ticket and
  states the behavioral criterion has no executable file in files_touched,
  And the first coder phase is not dispatched until files_touched is corrected to
  include the executable surface.
depends_on:
  - BP-1100a
