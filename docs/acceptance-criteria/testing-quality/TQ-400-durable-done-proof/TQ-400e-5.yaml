risk_surface: internal
notes: |
  The PO's stated rationale for TQ-400e: without a durable exemption path the same
  records get re-flagged every cycle, the report becomes noise, and the team stops
  reading it — at which point the cadence in TQ-400c is worthless even though it
  technically runs.

  Must be proven with TWO consecutive real runs over the same on-disk store, not
  by asserting an idempotency flag or a "seen" set exists. The no-write clause
  matters independently: an implementation that recorded "exemption confirmed" on
  the record each cycle would churn the store and defeat the byte-level stability
  that TQ-400e-1 and TQ-400e-3 rely on.

  IT-PO ENRICHMENT NOTE (2026-08-17). "Stays settled" has two implementations that
  are indistinguishable on every obvious test: deterministic re-evaluation, and
  remembered state. Only the second is wrong, and the difference is invisible
  until the memory is lost or drifts. The test_spec therefore includes a third run
  after deleting every artifact the earlier runs produced — the only check that
  separates the two. Also note the three-point hash rather than two: a
  confirmation write on run 1 followed by an identical write on run 2 gives
  identical bytes between runs 1 and 2 and still churns the store, so the
  before-run-1 hash has to be in the comparison.
