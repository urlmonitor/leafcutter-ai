id: BP-600b-2
components:
  - build_pipeline
title: "Quick-fix AC id is a next unused child suffix under its parent, in the matched component"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the AC store holds the component's criteria as a hierarchy of L0
    feature directories containing L1, L2 and L3 records,
  When the quick-fix workflow creates a new AC for a bug in that component,
  Then the new AC's id begins with the prefix registered for that component in
    the AC-store index, so the record is addressable within the component that
    actually owns the diagnosed file,
  And the id is formed by extending its parent's id with the next unused child
    suffix — an integer for a new L2 sibling under an L1, or a Roman numeral
    for a technical-constraint L3 child under an L2 — rather than by taking the
    next free number in a flat per-component sequence,
  And no id is ever reused, including one belonging to a record that has been
    superseded or deprecated: the numeric slot stays permanently occupied,
  And the id the workflow chooses matches the position the file is written to
    in the hierarchy, so the record's name and its place in the tree agree.
