id: GE-124c-1-i
readiness: approved
priority: high
title: "A file that lacks the floor while carrying element pins yields exactly one finding"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given the staged set contains `components/atlas/detail-drawer.tsx`, an
    in-scope screen component with no component-level declaration
  And the file pins KM-ADM-004 on one rendered element
  When the commit-tier declaration check runs
  Then exactly one finding is reported for that file with the code
    "missing-component-declaration"
  And no second finding is reported for the same file and the same code from the
    element surface
  And the single finding's message states that the file does pin KM-ADM-004 and
    that an element attribute never satisfies the component-level floor

  Given the same file pins three criteria on three separate rendered elements
  When the commit-tier declaration check runs
  Then exactly one finding is still reported for that file with the code
    "missing-component-declaration"
depends_on:
  - GE-124c-1
