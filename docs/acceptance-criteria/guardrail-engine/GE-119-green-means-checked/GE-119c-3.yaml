    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A manifest fixture entry with no harness case is reported by name as uncovered and the sweep fails."
  - name: test_ge119c3_ghost_harness_case_reported
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A harness case naming a check absent from the manifest is reported, so the sweep cannot be satisfied by exercising an uninstalled check."
  - name: test_ge119c3_expected_set_derived_from_manifest_not_a_list
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    description: "Adding an entry to the manifest fixture changes the expected set with no change to the harness code — the set is read, not hard-coded."
  - name: test_ge119c3_new_manifest_entry_without_a_case_fails_the_sweep
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Registering a new check without adding a harness case fails the sweep rather than passing silently."
test_rationale: "A test asserting that today's manifest is fully covered passes forever and cannot fail on the day a new check is added without a case — which is the only day this AC matters. Coverage therefore requires a manifest FIXTURE carrying the omission, exercised in both drift directions. Asserting the current state would be the same class of always-green assertion this whole tree exists to eliminate."
