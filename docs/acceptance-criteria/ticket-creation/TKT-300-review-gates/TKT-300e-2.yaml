criteria: |
  Given an L2 AC with id "X-1" is split into children "X-1a" and "X-1b",
  When the split is complete,
  Then the union of criteria text in the children covers
    every clause from the original AC's criteria field,
  And no behavioral requirement from the original is lost or omitted,
  And each child's criteria describe only the portion
    relevant to that child's assigned_agent.
