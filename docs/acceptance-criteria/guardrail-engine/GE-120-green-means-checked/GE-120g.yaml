id: GE-120g
title: "Being looked at leaves your work untouched, and only an objection stops you"
component: guardrail-engine
components:
  - commit_guardian
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Inspection changes nothing, and nothing but an objection refuses your commit.

  A check whose job is to judge your work leaves that work exactly as it found
  it; only the checks that are declared to fix things as they go are permitted
  to change anything. And when you are refused, it is because some check
  objected to something — never as a side effect of a check having run.
depends_on:
