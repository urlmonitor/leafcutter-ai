criteria: |
  Given an AC with estimated_complexity: S,
  When the AC prioritizer maps it to the unified priority schema,
  Then the priority field in the output entry is "high".

  Given an AC with estimated_complexity: M,
  When the AC prioritizer maps it to the unified priority schema,
  Then the priority field in the output entry is "medium".

  Given an AC with estimated_complexity: L,
  When the AC prioritizer maps it to the unified priority schema,
  Then the priority field in the output entry is "low".

  Given an AC with estimated_complexity: XL,
  When the AC prioritizer maps it to the unified priority schema,
  Then the priority field in the output entry is "low".
