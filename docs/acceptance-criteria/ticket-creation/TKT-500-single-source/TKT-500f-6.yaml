id: TKT-500f-6
components:
  - ticket_creation_pipeline
readiness: approved
priority: high
title: "Generated ticket carries Test Requirements when an implementation .py is in scope"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f.yaml"
criteria: |
  Given a leaf AC whose files_touched list contains at least one path that
    ends in ".py", is NOT under a docs/ directory, is NOT a .yaml or .json
    configuration file, and is NOT under a tickets/ directory
    (for example "scripts/ac_store/generate_ticket_from_ac.py"),
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains a section headed "## Test Requirements",
  And that section contains at least one test stub entry describing a test to be
    written for the qualifying implementation file,
  And the test stub entry names the implementation file it applies to.
depends_on: [TKT-500f]
doc_links:
  - path: scripts/goal_to_epic.py
    relationship: constrains
    status: exists
    relevance: "Facade only since the 2026-09-14 decomposition. The goal-path generator this AC constrains is now scripts/ac_store/epic_tickets.py, below — the SINGLE shared classification/emission helper must be called from there, not from the facade."
  - path: scripts/ac_store/epic_tickets.py
    relationship: constrains
    status: exists
    relevance: "Owns _call_generate_ticket_from_ac and generate_tickets_for_leaves — the goal-path half of the two generators that must not drift apart."
  - path: scripts/ac_store/generate_ticket_from_ac.py
    relationship: constrains
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: specifies
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Classify each files_touched entry: a path qualifies as an implementation .py when it ends in .py AND is not under docs/ AND is not a .yaml/.json file AND is not under tickets/ AND its basename does NOT match test_*.py or *_test.py. The Test Requirements section is emitted when one or more qualifying entries exist."
  - "Emit the '## Test Requirements' heading and at least one stub line per qualifying implementation file. Implement the classification + emission in a SINGLE shared helper used by BOTH scripts/goal_to_epic.py and scripts/ac_store/generate_ticket_from_ac.py so the two generators cannot drift — do not inline or duplicate the predicate in either generator."
  - "The stub entry text must name the implementation file path so a downstream reader (the ticket-supervisor test-writer gate) can map the requirement to the file in scope."
  - "The classification predicate has no portable code path into the ticket-supervisor template (the supervisor is markdown prose, not Python). Reconcile the generator's predicate and the supervisor's notion of 'implementation .py in scope' by SPEC PARITY: state the rule once normatively (ac-schema.md) and keep both sides matching it — never assume a shared import across the .py/.md boundary."
delivers_to:
  agent: ticket-supervisor
  contract: "A generated ticket whose presence-or-absence of a '## Test Requirements' section is the authoritative signal for whether the test-writer phase is required (read by the ticket-supervisor test-writer skip rule, templates/agents/ticket-supervisor.md)"
expects_from: null
origin_agent: business-analyst
created: 2026-06-22
amended_by:
  - reason: "it-po technical enrichment 2026-06-22: repointed delivers_to from non-existent 'ac-supervisor' to the real gating agent 'ticket-supervisor' (no agent named ac-supervisor exists in config/agent_registry.json). NOTE FOR FINAL-GATE REVIEWER: the criteria PROSE elsewhere in this cluster still says 'ac-supervisor' (see TKT-500f-6-iii) and should be corrected to 'ticket-supervisor' in a follow-up BA edit — criteria left unchanged here per role boundary."
superseded_by: null
covered_by: [TKT-500f-6-i, TKT-500f-6-ii, TKT-500f-6-iii, unit_tests/ac_store/test_tkt_500f_6.py]
implemented_by: []
test_spec:
  - name: test_qualifying_implementation_py_emits_test_requirements_section
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "An AC whose files_touched holds a qualifying implementation .py (e.g. scripts/ac_store/generate_ticket_from_ac.py) generates a ticket body containing a section headed exactly '## Test Requirements'."
  - name: test_section_contains_at_least_one_test_stub_entry
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The section is non-empty — it carries at least one stub entry describing a test to be written, so a bare heading does not satisfy the AC."
  - name: test_test_stub_entry_names_the_implementation_file
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The stub entry names the qualifying implementation file it applies to, which is what makes the section actionable rather than decorative."
  - name: test_both_generators_emit_the_section_from_one_shared_helper
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "The it_requirements no-drift rule: the same AC driven through generate_ticket_from_ac.py and through the goal path (epic_tickets.py) produces the same section, and the classification predicate is reached from a single shared helper rather than inlined in each generator."
  - name: test_generated_section_is_read_by_the_real_test_writer_signal
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Round-trip the generated ticket through the consumer that actually reads the heading to decide whether the test-writer phase is needed, rather than asserting on a hand-built string — the section's presence must be a live signal, not just present text."
change_target: code
risk_surface: contract_boundary
