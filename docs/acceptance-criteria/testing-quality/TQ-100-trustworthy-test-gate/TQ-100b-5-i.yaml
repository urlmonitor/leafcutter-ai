title: "Changing one coverage-tag rule without the others is blocked, not merely noted"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given every coverage-tag recognition rule in the closed set named by TQ-100b-5 —
    R1, R1f, R2 and R3 there — agrees over the committed unit-test tree and the
    parity check passes,
  When exactly one of those rules has its recognition behaviour changed and every
    other rule in the set is left unchanged — for example the done-proof reader
    (R1) is taught to accept a tag spelling, or to reject an id shape, that the
    other rules still treat the old way — and the parity check is run again,
  Then the parity check fails and blocks, naming the capture whose verdict differs
    and which rule of the set changed its answer
  And the blocking run and the earlier passing run go through the same entry
    point over the same tree, so the difference in outcome is attributable to the
    rules' behaviour and not to a different check being invoked
  And mirroring the same change into every other rule in the set makes the same
    entry point pass again, so mirroring into only one of the remaining rules is
    not sufficient to clear the block.
