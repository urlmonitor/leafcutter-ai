    type: behavioral
    angle: failure
    description: "No instruction anywhere in the finalization prompt tells the agent to replace or write a status line in the frontmatter. Derived by scanning the prompt rather than checking one known location, so a direct write reintroduced elsewhere fails too."
  - name: test_the_blanket_override_is_not_used
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    angle: failure
    description: "No --force appears on any set_ticket_status.py invocation in the finalization prompt."
