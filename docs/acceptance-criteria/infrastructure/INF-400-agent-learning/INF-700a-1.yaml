id: INF-700a-1
components:
  - infrastructure
  - knowledge_system
  - build_orchestration
title: "Work that finishes leaves its learnings on their surfaces, with nobody having run anything"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a.yaml"
criteria: |
  Given a unit of work has run to completion — every phase it dispatched has
    finished and the thing driving it is about to report the result,
  And three agents during that work each emitted a knowledge record carrying
    learning text, naming three different destination files,
  When the driver reaches its completion sequence — after the phases that
    perform the work have returned, and before the phase that publishes the
    unit of work's own output runs,
  Then by the time the driver reports the unit of work finished, those three
    destination files each contain the learning text of the record that named
    them — each record's text is written into the file that record named,
    during this unit of work and by the routing step rather than by the
    emitting agent,
  And the routing step ran early enough in that sequence for its writes to be
    carried by the publication the unit of work already makes: a completion
    path that routes after its own output has been published has no publication
    left to carry the writes, and satisfies nothing here however green its
    figures look,
  And a record emitted after the routing step has read the sink — the phases
    that publish the work emit too — is not lost by that ordering. It stays in
    the sink, is not counted here as written or as nothing to do, and reaches
    its surface on a later completed unit of work. What this run must say about
    it is INF-700a-5-ii's; this clause exists so the ordering above cannot be
    read as licence to discard the tail,
  And no person invoked the routing step: the same result is reached by a run
    in which the only human action was starting the work,
  And the result the driver reports states how many knowledge records the
    routing step read, how many it wrote to a surface, and how many it left
    unwritten,
  And running the same unit of work a second time over the same records adds
    nothing further to those three files,
  And a driver that reports the unit of work finished while those three
    destination files are unchanged, or while its reported result carries no
    routing figures, fails this criterion — regardless of which files name the
    routing step or in what order,
  And those three files still hold that learning text after the working
    directory the unit of work ran in has been removed: a completion path that
    changes them only inside a directory that is later reclaimed has not
    satisfied this criterion, and the figure it reported as written was wrong.
    The durability outcome and where the write is published are INF-700a-5's;
    this clause exists so no reading of the criterion above can be satisfied by
    a file that is about to be deleted.
