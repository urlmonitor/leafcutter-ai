title: "Ticket creation failure is non-fatal and does not halt the workflow"
level: L2
component: finalize
status: superseded_by
parent: FIN-100e
criteria: |
  Given Step 6a is creating tracking tickets for pre-existing failures
  When the create-ticket agent dispatch throws an error for one entry
  Or the create-ticket agent returns a response without a ticket_path
  Then the workflow logs a warning with the test ID and error details
  And pushes null into created_tracking_tickets as a sentinel
  And continues processing the remaining triage entries
  And the workflow does NOT halt — it proceeds to Step 6b (ticket closing)
