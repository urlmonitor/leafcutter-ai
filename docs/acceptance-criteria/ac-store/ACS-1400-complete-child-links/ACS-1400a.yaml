notes: |
  KEEPS THE BACKLOG FROM REFILLING. This L1 is about the moment work lands. The
  historical population is ACS-1400c and the out-of-band view is ACS-1400b;
  neither belongs here, and a repair that clears the store while this stays open
  buys a store that rots again.

  THE CENTRAL INSIGHT, AND IT IS THE ONE MOST LIKELY TO BE LOST IN DECOMPOSITION:
  the guard's SILENCE currently means three different things — it passed, it was
  never handed the file, or it declined to look because `depends_on` did not name
  the structural parent. Only the first is a pass. A criterion that merely makes
  the check stricter, without making its silence unambiguous, leaves the defect
  intact in a new shape. GE-120's could_not_check outcome already exists in this
  very file (`_emit_could_not_check`, OUTCOME_COULD_NOT_CHECK) as the established
  vocabulary for "did not run" — reuse it rather than inventing a second channel.

  ON THE `depends_on` HATCH SPECIFICALLY. It is not a bug someone left behind; the
  code comment says it "prevents false positives for cross-branch depends_on
  entries." That rationale deserves to be engaged rather than deleted. But the
  measurement says the exemption has swallowed the majority of the real
  population, and the records it swallowed are not cross-branch curiosities —
  BP-100b's eleven children each name their SUCCESSOR in depends_on rather than
  their structural parent, which is a coherent authoring choice that the guard
  then silently reads as permission. Whatever replaces it must distinguish "this
  child deliberately depends elsewhere" from "this child's parent link is
  unrecorded," and it must do so out loud.

  DO NOT MAKE THIS A NEW HOOK. There is one guard for this rule and it should stay
  one. A second check on the same field is how two readers of the same evidence
  drift apart, which this repo has already paid for once (EPIC-ComputedQualityGates
  FP-1).

  VERIFY BEHAVIOURALLY, AND KNOW HOW THIS HOOK IS INVOKED. It reads the git index
  or HOOK_TEST_FILES, NOT argv, so passing a path on the command line does not
  make it check that path. A test that hands it nothing and asserts exit 0 proves
  nothing at all. This trap is already written into ACS-1300a-3's it_requirements
  and into CLAUDE.md; it has produced false-green results in this repo three times.

  DOCUMENTATION: `[reference-doc]`. ac-schema.md currently describes an
  unconditional blocking rule that the code does not implement. Whatever this L1
  settles, the written rule and the enforced rule must agree when it lands —
  shipping without that leaves the documentation contradicting the behaviour,
  which is the condition that let the gap persist unnoticed. No how-to: nobody
  invokes this deliberately, it fires on commit. No sequence-diagram: one check,
  one file, no multi-actor flow.
