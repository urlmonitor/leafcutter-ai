id: UXP-514-5
title: "None of the four drift checks reports a clean result on an empty input set"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a record in which the input set for one of the four drift checks is empty - no journey
    step carries an implementation status, or no acceptance criterion carries a back-reference,
    or the index holds no derived entries, or no journey step names a screen,
  When the record is checked,
  Then that check reports that it was not exercised, naming the input it needed,
  And it does not report that no drift was found,
  And the run's overall outcome is not the outcome for a record that was checked and found sound
    while any of the four reports it was not exercised,
  And each of the four is reported independently, so three exercised checks and one unexercised
    check are distinguishable from four exercised checks.
