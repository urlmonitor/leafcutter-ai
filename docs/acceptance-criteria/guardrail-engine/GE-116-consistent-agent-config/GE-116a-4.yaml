id: GE-116a-4
components:
  - commit_guardian
title: "Agent with no verification setting is treated as not requiring verification"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a staged agent definition whose settings do not mention verification at
    all (the requires_verification setting is absent),
  And that agent's declared abilities include neither the ability to edit files
    nor the ability to create files (read-and-inspect only),
  When the commit is attempted,
  Then the guard treats the agent as not requiring verification,
  And it raises no objection for that agent definition,
  And the commit proceeds as far as this guard is concerned.
