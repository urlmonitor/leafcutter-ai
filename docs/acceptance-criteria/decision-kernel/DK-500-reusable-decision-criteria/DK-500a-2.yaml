notes: |
  SETTLED (L0 notes, ADR-058 section 6, ADR-056): the kernel never reads Langfuse on the hot path; only the offline mining job does. "Making a decision never waits on it" is the customer form of this rule in DK-500a.
  Comparison across three mining states (never run / in progress / failed) is the anti-vacuity device: an implementation that ignores mining entirely passes, which is the intended behaviour; one that reads mining output or Langfuse during the run shows a different call count or a request.
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: mine; leafcutter/decision-forming: reuse-criteria.
  Authored by the business-analyst stage of /plan-feature (route strategic) under decision dec-93c1c730463c1f3c; readiness draft, no product approval implied.
