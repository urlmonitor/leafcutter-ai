notes: |
  WHAT THIS L1 IS AND IS NOT. It requires that the guarantee of a valid result
  LIVE at the commit boundary and in the acceptance check rather than in the
  route's own sequencing. It does NOT author new checks. Any new or changed hook
  belongs to the commit_guardian / precommit_hooks components and gets its own
  AC there; this one owns the relocation of responsibility and the proof that
  nothing was lost in the move.

  THE MOVE IS ONLY SAFE IF THE INVENTORY IS TAKEN FIRST. Enumerate every
  correctness property the current route guarantees by sequencing before
  removing any of it, and for each one name the boundary check that now carries
  it or record explicitly that it is being dropped and why. An unenumerated
  property is a property that disappears silently.

  THREE VERIFIED HAZARDS THAT MAKE THE NAIVE VERSION OF THIS A FALSE GREEN:
    1. The AC hooks validate only the files present in that commit's INDEX --
       they do not read the store. A fact true of the store but not of the
       staged set is structurally unreachable to them. Their silence is not a
       pass; it means they were never given the file. This is how ACD-400a
       carried a stale covered_by for five days and a falsely done parent
       through every commit in the window. Collapsing to one commit
       (ACD-2200d) changes what is in the index at check time -- work that
       through this L1 together with ACD-2200d, never separately.
    2. Several of those hooks ignore argv entirely and read the index or
       HOOK_TEST_FILES. Passing a path on the command line does not make them
       check that path. Verify a hook actually saw the file before trusting its
       exit code.
    3. AC field validation is not single-sourced. config/ac_store_schema.json,
       the commit hook's manual-validation fallback, and the agent-side
       validator are three separate enforcement points. A rule added to one is a
       partial and sometimes no-op gate.

  ADDITIONALLY: a check that runs only in CI is not a commit-boundary guarantee
  for a local run and a hook that is not established in a worktree is silently
  skipped for the whole session. Both are known live conditions in this
  repository. State which of the two boundaries carries each property.
