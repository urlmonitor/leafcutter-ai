criteria: |
  No silent pass — a check that could not run says so, loudly.

  When a safety check cannot reach what it needs in order to inspect your work,
  it reports that in plain language instead of finishing quietly as though
  everything was fine. You can always tell "nothing wrong here" apart from
  "I never looked".
