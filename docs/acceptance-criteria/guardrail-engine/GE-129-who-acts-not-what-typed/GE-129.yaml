criteria: |
  Safeguards check who is acting, never what they typed.

  Some actions in your project are reserved for one trusted part of the system,
  because that part carries the checks, the confirmation and the record that make
  the action safe. Today that reservation is satisfied by typing a publicly known
  word, and the same safeguard stops harmless work that merely mentions the action.
  After this goal, a reserved action is taken only by the part entrusted with it,
  recognised by who is actually acting; work that only talks about the action is
  left alone; automated runs keep working without a shared secret; and what the
  project's rules say is protected is exactly what is protected.
