criteria: |
  The leafcutter-ai package provides an AC-first development workflow where
  individual acceptance criteria are the atomic unit of work — each AC is a
  standalone YAML file that carries business requirements, IT requirements,
  agent assignment, dependencies, documentation links, and verification state,
  enabling agents to work from precise, testable specifications with full
  traceability from requirement to implementation to test.
