notes: |
  ADR-026 "Self-host is a self-consistent build" (rule 6), "Behavioral spot-check on a real
  on-disk ticket in a fresh process" (rule 7), and the "Go / No-Go for the final cutover"
  section. Dogfood-first proving lives in phase_acbuild_2b_ticket_demotion (why this L1's roadmap_phase
  is _2 and not _3, per the ADR); the go/no-go criteria it defines govern the phase_3 legacy
  removal (ACD-1900f). Go = strict store validation 0; all required CI green on >=10 consecutive
  self-host merges under enforce:true; a full self-host epic driven end-to-end thin + AC-sign-off
  and behaviorally spot-checked on a real ticket in a fresh process; render comprehension test
  passes; every new gate script in deploy_map with no ModuleNotFoundError; >=1 consumer (or
  consumer-sim) upgraded green; rollback rehearsed. No-go: any required gate red, any deployed
  -hook import error, or a shadow check showing a gate that verified zero ACs.
