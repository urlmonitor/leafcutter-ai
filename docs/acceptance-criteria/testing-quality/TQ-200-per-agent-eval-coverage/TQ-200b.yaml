title: "A shared runner scores every agent's eval set and blocks merges on regression"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  As someone who owns the pipeline's agents, I want a single shared runner that can
  take any agent's eval set, run the agent once per row, score each result, and
  report pass/fail plus a score — and I want that report wired into CI as a quality
  gate — so that agent evals are executed the same way for every agent and a
  regression is caught automatically before it merges rather than discovered in
  production.

  The runner is output-type aware (it applies the label / artifact / markup scoring
  the agent's set declares), its results are reportable in a machine-readable form,
  and CI fails the change when an agent's score drops below its golden baseline.
