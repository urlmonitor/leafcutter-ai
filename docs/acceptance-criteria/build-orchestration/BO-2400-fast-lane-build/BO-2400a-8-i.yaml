criteria: |
  Given the fast-lane component diagram after BO-2400f-5-i and BO-2400f-5-iii are built,
  When a reader looks at the lane's collaborators,
  Then the command-step-runner appears as the collaborator that runs every command step,
    shown separately from the test-writer, coder and pr-reviewer,
  And the agent registry appears as the source of each agent's shell permission and
    declared step kinds (reads_store, changes_store, changes_repository, publishes),
  And the structural check from BO-2400f-5-ii appears as reading both the lane and the
    registry,
  And status-checker no longer appears as a collaborator of the fast lane.

  Given the same diagram,
  When it is compared with the lane,
  Then every agent it shows the lane dispatching is one the lane actually dispatches.
