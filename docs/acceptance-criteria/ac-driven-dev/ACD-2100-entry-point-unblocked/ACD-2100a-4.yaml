    contract: "A pause record whose on-disk location is a function of the project being operated on, written durably before process exit and readable from any working directory. Without it, ACD-2100c-2's 'pause instead of discard' degrades to a persist failure when run from a worktree."
  - agent: python-coder
    ac_id: ACD-2100a-5
    contract: "A pause-store read, write and read-back that all resolve through the shared repository-anchored resolution."
