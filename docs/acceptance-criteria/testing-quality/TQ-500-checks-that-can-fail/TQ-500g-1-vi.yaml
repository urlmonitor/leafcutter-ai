notes: |
  WIRING ONLY — the rule lives in TQ-500g-1-i. Mirrors TQ-500f-3-ii for the
  later gate: /build-feature does not dispatch ticket-supervisor; its per-ticket
  driver is inlined JS and twinned in build-ticket.js, so this is a workflow-JS
  change. Respect the E2 leaf invariant and ADR-006 (no workflow() call from
  inside the workflow; run the runner through a depth-1 executor agent, as
  fast-lane-ship.js does).

  K4 (RESUME) IS THE NON-OBVIOUS CASE. A resumed ticket whose later phases are
  already signed off would otherwise skip straight to commit. The runs guard the
  code on disk now, not the code as it was when someone last signed off.

  PLACEMENT: after the coder's code is green and before commit. The exact phase
  position relative to review is IT-PO's call; never after commit.

  TESTABILITY: drive both twins under the workflow-engine harness with the K1
  to K4 responses and assert on the recorded dispatches; one seam test executes
  the recorded runner commands from this route and from the fast lane against
  the same fixture repo and asserts identical verdicts.

  IT-PO ENRICHMENT (2026-09-28)
  PLACEMENT DECIDED: right before the commit dispatch, after review. The BA
  left this to IT-PO.
  Lane: fast lane (python-coder) after -1-i..-iv. Can share a build with
  -1-v, but each AC keeps its own tests. The JS ratchet decision is open.

  IT-PO AMENDMENT (2026-10-14): THE THREE-STEP DESIGN ON MAIN
  Same sequence as TQ-500g-1-v: recover (resume), list, test-breaker (only
  when something is owed), then one finish call from the wrapper TQ-500g-1-v
  builds. Reply on stdin; a writer stop halts the ticket. The commit is reached
  only on finish's gate_passed true.
  NEW FOR THIS ROUTE: the batch runs in parallel in one shared worktree, so the
  sequence must not overlap a sibling's finish or commit. It uses the route's
  existing commit-phase exclusion; if there is none, that is a blocker before
  the build. Executor spawn reciprocity for build-feature.js and build-ticket.js
  must be settled (command-step-runner names only user and fast-lane-ship.js).
  CRITERIA CLAUSES FOR THE BA (criteria untouched here):
    - "Then the route makes the wrong-version runs through the one shared
      runner, with the same inputs the fast lane passes": still true. Proposed
      addition, so the preparation is part of the behaviour: "after asking the
      writer what is owed and, when anything is, having test-breaker prepare it
      from that list unchanged".
    - "And K4's resumed drive makes the runs again before commit rather than
      relying on any earlier sign-off": proposed addition "and puts back any
      code a cut-short earlier run left altered before anything reads it".
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-v (the
  wrapper), -iv or -ix (BA/user to add). The backfill caveat for must_catch
  entries without in_scope_files in TQ-500g-1-v's notes applies here too.

  IT-PO ALIGNMENT (2026-10-21): AGAINST THE MERGED FAST LANE (#1280) AND -x
  Every step takes --base-ref HEAD: list and finish pass it, finish forwards
  it to the writer and the runner. Owed items carry scope and go to
  test-breaker unchanged. Labels pinned: bf-wv-{recover,list,test-breaker,
  finish} in build-feature.js, bt-wv-* in build-ticket.js, phase "Wrong-Version
  Runs", executor command-step-runner (not status-checker, which the twins'
  red-baseline gate still uses; do not copy that).
  RESUME SIGNAL: build-feature.js = the worktree was reused, not created by
  worktree-setup (the counterpart of the fast lane's workspaceCreated ===
  false); recover runs once at the drive head, never inside driveTicketPhases,
  because recover closes every open journal in the worktree and would undo a
  parallel sibling's in-flight run. build-ticket.js has no creation step, so it
  recovers on every drive right after the Worktree Guard (a no-op when clean).
  REGISTRY: command-step-runner spawned_by gains build-feature.js and
  build-ticket.js; card regenerated; executor template adopter_notes updated.
  No new registry entry, so package_surface: false (ACS-100i-8 watches new
  entries only).
  SERIALIZATION: the sequence rides inside the existing commitLane turn, ahead
  of the knowledge-routing stage. OPEN BLOCKER for the epic path: commitLane
  does not exclude siblings' non-commit phases, and finish's "fix undone" and
  derived scope read every uncommitted change in the shared worktree. User
  decision needed before the epic-path wiring is built.
  NO PYTHON CHANGES. JS growth expected +55..70 (build-feature.js) and +45..60
  (build-ticket.js) measured lines; a one-time check-file-size skip for both
  files is expected at commit.

  USER DECISION (2026-10-21): ONE TICKET PER CHUNK
  Resolves the parallel-batch blocker above. When any ticket in a
  /build-feature batch has source_ac (or its source_ac cannot be read), the
  batch is driven one ticket at a time, so each ticket's runs see only its own
  changes. Batches with no source ACs stay parallel. Decided at the batch
  loop's BATCH_SIZE chunk step, from a source_ac key (always present, [] when
  none) on the epic planner's ticket items. commitLane placement and the
  drive-head recover are unchanged. No criteria clause contradicts the rule.

  IT-PO NOTE (2026-10-23): STEP REPLY READING RULE MOVED TO TQ-500f-3-v
  The executor it_requirement said the reply is "parsed as the fast lane does:
  JSON.parse(reply.stdout)". That strict whole-text parse halted live runs
  (wf_f982c0ab-e94): the writer's stderr log line, merged into the relayed
  stdout ahead of the list JSON, made the list answer null. TQ-500f-3-v
  replaces it in wvStep (recover, list, finish) with one reading rule
  (parseStepJson); the entry now points there. The fail-closed checks are
  unchanged. fast-lane-ship.js keeps its own parse (out of scope). Criteria,
  work_status and readiness untouched.

  IT-PO RECONCILIATION (2026-10-23): PINNING (TQ-500g-1-xi, -xii)
  Before: wvRuns dispatched test-breaker whenever listed.owed was non-empty,
  with owed. After: the list command carries --work-key "<ticket stem>",
  test-breaker is dispatched only when listed.to_prepare is non-empty, with
  to_prepare unchanged, and not at all when it is []. The "to prepare" list is
  an output of the shared list step (wrong_version_writer.py list --work-key,
  decided in _wvp_plan), never computed in JS.
  FILE SIZE: the change cannot be made in the twins (both over the 1000-line
  cap; a replaced line counts as added). The twins' identical block moves to
  templates/workflows-js/_shared/wrong-version-runs.js (marker pair
  WRONG-VERSION-RUNS), which shrinks each twin by about 44 counted lines, and
  the to_prepare change is made only there. Labels (bf-wv-*, bt-wv-*) and the
  twin parity are unchanged because WV stays per twin.
  This record is done; the change is built under TQ-500g-1-xi, whose
  declared files include both twins and the shared source. The existing
  route tests' list stubs gain to_prepare in that change.
