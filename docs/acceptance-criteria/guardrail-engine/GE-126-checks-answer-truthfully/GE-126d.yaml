notes: |
  THE ALLOWLIST IS NOT THE DEFECT. Not every check should have a fixer dispatched
  at it, and a closed roster is the right design. The defect is that it is a
  fourth leg of registration documented nowhere in the procedure that exists to
  enumerate the legs — so an author can complete the documented procedure, watch
  check_hook_parity pass, and land a check outside the loop with nothing
  reporting the omission. Any L2 that proposes opening the allowlist or
  defaulting new checks into it has misread this record.

  THE SYMPTOM IS REDUCED PROTECTION RATHER THAN A FALSE PASS, AND THAT IS WHY IT
  IS HERE ANYWAY. An omitted check still blocks the commit; it simply gets no
  autofix attempt, so the cost is friction. It belongs under this goal because
  the false answer is at the interrogation surface: "is my new check properly
  registered" is answered yes by a complete-looking procedure and a green parity
  check, and the answer is wrong. That is this goal's shape exactly — an
  enumeration everyone trusts that is missing an item.

  REUSE ACS-100i-9's SHAPE — this is the same problem it solved. One list, read
  by both the procedure and the parity check, with one message format so the two
  are identical rather than merely similar, and explicitly no second copy of the
  legs written into the procedure text as prose. If the procedure enumerates the
  legs in its own words and the parity check enumerates them in code, a fifth leg
  will drift apart from the documentation the same way the fourth did.

  THE REPORT IS A WARNING WITH A ROUTE, NOT A HARD FAILURE. Exclusion is
  legitimate, so a check present in the manifest and absent from the allowlist
  must be reported by name alongside the deliberate-exclusion route rather than
  blocked. Decide at L2 what recording a deliberate exclusion looks like; the
  criterion is that the choice becomes explicit, not that it becomes forbidden.

  THE ACCEPTANCE SHAPE IS THE OMISSION, NOT THE PROCEDURE TEXT. A test asserting
  that the procedure document mentions a fourth step passes on a sentence nobody
  reads. Register a fixture check the documented way while omitting the fourth
  leg and require the parity check to name it; register one that records a
  deliberate exclusion and require the parity check to stay quiet. Then confirm
  the seven checks currently on the allowlist are unaffected — they are the
  regression boundary.

  BP-1100b-5 IS NAMED AND IS NOT IN SCOPE. It is the worked example and it will
  need amending or a knowing acceptance when it is built. Do not edit it from
  this tree and do not add a depends_on edge to it — this record does not gate
  that one.
