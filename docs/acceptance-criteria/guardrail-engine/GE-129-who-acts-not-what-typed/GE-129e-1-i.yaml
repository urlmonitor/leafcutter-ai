criteria: |
  Given the retired-token check of GE-129e-1 and its declared exemption list,
  When the check runs with, in turn:
    (a) an exemption entry naming the commit specialist's agent definition,
    (b) an exemption entry naming a whole directory that contains a shipped skill,
    (c) an exemption entry naming a known-issue record, with no stated reason,
    (d) an exemption entry naming a known-issue record, with a stated reason,
  Then (a) and (b) fail, naming the entry and the shipped surface it would have excused,
    And (c) fails, naming the entry and stating that it has no reason,
    And (d) passes, and COMMIT_AGENT_MODE in that known-issue record produces no finding.
