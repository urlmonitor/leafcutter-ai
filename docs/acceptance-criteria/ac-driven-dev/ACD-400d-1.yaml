    relationship: related
    status: exists
    relevance: "THE SECOND NEAR-MISS, and it is not coverage for this AC -- but NOT for the reason first recorded here, and the correction matters because the original reasoning was backwards. CORRECTED 2026-09-08 by execution, superseding an IT-PO claim of the same date. The prior text is quoted so the change is auditable: 'its two fixtures BOTH record estimated_complexity S. With sizes equal, urgency-then-size and size-then-urgency produce the identical list, so the test passes on the two-key order ACD-400a-1 asserts. It cannot distinguish the two implementations.' That is FALSE. Equal sizes are exactly what FORCES the urgency key to decide the outcome, so the test discriminates sharply. Both orderings were computed against the two verbatim fixtures (BO-FL-TEST-010 medium/S, BO-FL-TEST-011 high/S) using the real _PRIORITY_ORDER and _COMPLEXITY_ORDER tables: the shipped three-key order returns [011, 010] and the assertion PASSES; the two-key order ACD-400a-1 states returns [010, 011] -- because equal complexity falls through to id ascending -- and the assertion FAILS. So test_ac2_deterministic_sort_order is a live behavioural pin on the three-key order, and the contradiction with ACD-400a-1 is HARDER than 'no test exists': a green test in this repository asserts three keys while two records in the store assert two, and neither side can see the other. It still is not coverage for THIS AC, for the reason that survives the correction: it exercises fast_lane.select_batch, a different entry point from the backlog queue this AC governs. Do not cite it as existing coverage."
