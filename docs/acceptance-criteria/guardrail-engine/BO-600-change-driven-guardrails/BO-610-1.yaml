title: "change_target enum definition with 10 canonical values"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the guardrail engine schema defines a change_target field,
  When the schema is validated,
  Then the change_target field accepts exactly these 10 enum values:
    code, schema, ui, infra, pipeline, prompt, model, config, docs, dependency
  And no other values are accepted by the schema validator
  And each value is documented with a one-line definition:
    - code: production application logic
    - schema: database DDL, migration files, or seed data
    - ui: user interface markup, styles, or client-side components
    - infra: infrastructure-as-code, container definitions, or cloud resources
    - pipeline: CI/CD workflows, build scripts, or deployment automation
    - prompt: LLM prompt templates or system instructions
    - model: ML/LLM model selection, parameters, or evaluation criteria
    - config: application configuration files or environment variables
    - docs: documentation, architecture guides, or README content
    - dependency: third-party library versions or package manifest changes
depends_on: [BO-610]
