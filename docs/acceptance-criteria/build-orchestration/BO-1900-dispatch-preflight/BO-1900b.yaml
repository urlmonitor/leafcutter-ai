roadmap_phase: phase_1
criteria: |
  Stale or false premises stop the dispatch instead of wasting an agent run.

  The factual claims a ticket relies on ("build X fails", "these tests are red",
  "module Y is missing") are reproduced and confirmed at the dispatch moment, so a
  premise that has since been fixed -- or was never true -- halts the dispatch.
  This is the dispatch-time freshness check; capturing and first-verifying those
  premises at authoring time is covered by TKT-200e and TKT-200f.
