criteria: |
  Given a YAML file has a status field,
  When the schema validator checks the status value,
  Then "active", "deprecated", and "superseded_by" each pass validation,
  And any other string (e.g. "draft", "done", "inactive", "") causes validation
    to fail with a diagnostic error,
  And the error message names the invalid value and lists the allowed enum members.
