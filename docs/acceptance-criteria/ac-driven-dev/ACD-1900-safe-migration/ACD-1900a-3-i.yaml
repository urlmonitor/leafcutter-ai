title: "Edge: strict enforcement is prevented while any v1 record remains"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC store that still contains at least one schema_version < 2 record,
  When a change attempts to enable strict additionalProperties:false enforcement,
  Then the change is refused with an error naming the count of remaining v1 records,
  And when the same enforcement is attempted against a store where every record is
    schema_version 2, the enforcement is accepted,
  And in neither case is any already-valid record rejected mid-migration.
