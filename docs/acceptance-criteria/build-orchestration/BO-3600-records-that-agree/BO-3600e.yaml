notes: |
  WHY THIS NEEDS SAYING OUT LOUD. The obvious place to hang the check in BO-3600a
  is on the files being committed. That version would have found NONE of the eight
  records behind this goal: every one of them had been finished weeks earlier and
  nothing in any subsequent change touched them. This repo has the failure on
  record twice already — the AC hooks that read only the commit index and so never
  see a parent they were written to check (CLAUDE.md, "AC-store commits — stage the
  parent alongside the child"), and the population-versus-change scoping filed as
  KI-CG-001 and named in KI-BO-028 as the dominant mechanism in the sibling
  registers. A change-scoped reconciler is a reconciler whose silence means
  nothing.

  THE EXISTING BACKLOG IS PART OF THE DELIVERY, not a follow-up. A check switched
  on over a store with a large standing population of conflicts either blocks
  everything or is immediately suppressed; neither is the outcome. The starting
  population must be measured, made visible, and burned down, with the same
  three-verdict disposition BO-3600d defines.

  ADJACENCY — TQ-400a makes the identical scoping argument for the test-based
  done-proof sweep, down to the detail that the verdict is already computable but
  only ever computed over staged files. That is the same lesson on a different
  evidence source. Cite it, reuse whatever traversal it produces, and do NOT
  re-specify the done-proof verdict rule here: this L1 owns scope and burn-down,
  not what counts as proof.

  DECOMPOSED 2026-08-26 (business-analyst). Five L2 children, this L1's full child
  cap: BO-3600e-1 (every record examined whether or not a change is in flight, with
  the examined counts as the clause that makes a narrow implementation falsifiable
  — a change-scoped and a whole-store reconciler produce identical output on a
  clean store), BO-3600e-2 (a run that could not examine everything reports
  incomplete; only a full pass reports clean), BO-3600e-3 (the starting population
  is measured, listed in full, and never grandfathered), BO-3600e-4 (the count
  falls only by decision, never by exclusion — the clause that stops the burn-down
  being achieved by narrowing the check), BO-3600e-5 (the how-to, verified by being
  walked end to end against the real store).
