    angle: seam
    description: "THE PROSE-TO-ENFORCEMENT TIE. Construct the arrangement the page's guidance directs an author to for work that needs a result, then run BO-3100c-2's sweep over it and assert it passes. Guidance that leads to an arrangement the sweep rejects is worse than no guidance."
  - name: test_bo_3100d_3_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  A test asserting this page CONTAINS the right sentences is exactly the grep on prose the goal's
  hard constraint rejects, and it would have passed on building-epics §2.1-R1 for the entire
  period that rule was silently not firing. So the page's statements are covered by BO-3100d-1's
  claim-check mechanism — each one exercised against the running system — and its guidance is
  covered by constructing the arrangement it recommends and running BO-3100c-2's sweep over it.
  Deliberately NOT covered: whether the page is well written or persuasive. Human judgement, and
  no test here claims it.
