id: INF-600l-2
readiness: draft
priority: medium
title: "The mirror check is opt-in to the leafcutter agent subsystem and resolves the card path from convention, not a hardcode"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600l.yaml"
criteria: |
  Given a consumer project that uses the leafcutter agent subsystem (it has an agent
    registry and generated agent cards under the leafcutter card-path convention)
  When the build runs the extended consistency check
  Then the card<->registry mirror comparison runs and reports mismatches per INF-600l-1
  And the check locates each agent's card via the configured/derived card-path
    convention rather than a single hardcoded path, so a project whose card location
    differs from the default still has its cards found
  And the mirror comparison is scoped to the leafcutter agent subsystem (it only
    applies where the registry + card convention are in use), so it does not impose
    itself on unrelated files
depends_on:
