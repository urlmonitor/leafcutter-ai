it_requirements:
  - "Surface is agent/skill prose: the commit-phase behavior is governed by templates/agents/commit.md and the worktree/branch convention in templates/skills/building-epics/SKILL.md (worktree-agent creates the non-main working branch). State the branch-checkout invariant in those bodies; do NOT add Python."
  - "MODIFY existing: templates/agents/commit.md and templates/skills/building-epics/SKILL.md must make explicit that the commit phase refuses to commit when the checked-out branch is the repository default (main/master), naming that as a defect rather than committing."
  - "Default-branch name must be resolved dynamically (e.g. the repo's HEAD default), not hard-coded to the literal 'main' — repos may use 'master'."
  - "Must align with the existing worktree-per-epic model (ADR-006): one working branch per unit of work; do not contradict the building-epics worktree lifecycle."
