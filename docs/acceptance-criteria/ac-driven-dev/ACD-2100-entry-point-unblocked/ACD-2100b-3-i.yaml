test_rationale: >-
  A registry that is present, readable and interpretable but structurally not a registry
  lands in the absence branch: the lookup over the expected entries finds nothing, so
  the check concludes the agent is absent -- a specific verdict about something it never
  established, and the operator is sent to audit an agent id that is not the problem.
  That is the defect the parent L1 exists to close, reappearing one level down from
  where it was fixed, which is why enumerating four outcomes is not sufficient. The
  unhandled-failure clause is asserted separately because the current code searches a
  collection and a non-collection value raises rather than returning nothing; whatever
  replaces it must produce a report, and since a crash also stops the run, a fail-closed
  assertion alone cannot tell the two apart.
