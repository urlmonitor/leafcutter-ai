change_target: code
risk_surface: contract_boundary
notes: |
  THE SHARPEST HALF OF THE DEFECT, AND THE MOST TESTABLE. BO-2400g-2 states, in its own
  record and twice over, that this work must not touch
  templates/agents/change-scope-reviewer.md — once as an it_requirements bullet opening
  "DO NOT solve the scope-boundary problem here", once as a notes heading of the same
  words, plus a doc_link whose relevance text says the same thing again. The generated
  ticket named that file as part of the work's surface. The requirement's clearest
  instruction was inverted into its opposite.

  WHY THIS DESERVES ITS OWN RECORD RATHER THAN A CLAUSE IN BP-1100a-4. The parent's rule
  is "a mention is not a change surface". This case adds something the parent's rule does
  not imply: that the failure INTENSIFIES with the requirement's clarity. Because
  _extract_paths_from_prose is lexical, every additional sentence spent forbidding a file
  is another opportunity for its path to be scraped in. An author who states a prohibition
  once, weakly, is safer than one who states it three times — which is exactly backwards
  and is a property no test of the parent's homogeneous cases would surface. The third
  criterion clause exists to pin that inversion.

  WHY IT MATTERS. This is the one case where the wrong surface actively defeats the
  guardrail built to catch it. change-scope-reviewer's job is to flag edits outside the
  declared boundary; when the forbidden file is listed in files_touched, the reviewer
  reads it as in-bounds and an edit the requirement explicitly prohibited passes review
  silently. CLAUDE.md records wrong files_touched as a documented phantom-done driver
  (EPIC-PhantomDoneFilesTouched, 2026-07-07); this is its worst shape.

  RELATIONSHIP TO ACD-1600g — CITED, NOT DEPENDED ON, AND DELIBERATELY SO. ACD-1600g-1
  gives the exclusion a structured home on the requirement; ACD-1600g-3 moves the scope
  reviewer's read to it. Neither is required here. This AC is satisfiable today because
  BO-2400g-2's prohibition is already stated inside its own record, so a derivation that
  declines to name a file the requirement marks as not-to-be-touched has something to
  read. A structured field would make the check mechanical rather than possible — an
  enabler, not a prerequisite. Depending on ACD-1600g would put the most testable half of
  this defect behind a schema migration, and would blur two layers that are cleanly
  separate: ACD-1600g governs where an exclusion is DECLARED and READ; this AC governs
  what a generator may WRITE as the surface. If ACD-1600g lands first it simply becomes
  the cleanest input to this rule, with no change to these criteria.

  TESTS MUST NOT BE GREP-ONLY. Run the real generator over a copy of the real BO-2400g-2
  record and assert that templates/agents/change-scope-reviewer.md is absent from the
  files_touched of the ticket it actually wrote, and absent from the rest of the ticket as
  a named change target. Asserting that the generator's source contains a prohibition
  keyword, an exclusion list, or a negative-verb regex passes on a filter that never runs.
  Point the generator at a COPY of the store: it writes an implemented_by back-reference
  into the source AC.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L3; the IT
  PO sets assigned_agent, it_requirements, estimated_complexity, the contracts and the
  test contract. No test_spec is authored because this tree's existing L3 (BP-1100a-1-i)
  carries none.
