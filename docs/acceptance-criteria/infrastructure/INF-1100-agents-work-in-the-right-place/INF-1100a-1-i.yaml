id: INF-1100a-1-i
title: "Absent test_root configuration falls back to the documented default"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the project configuration does not declare a test location
    (no test_root key is present in skills_config.json),
  When an agent resolves where a test file must go,
  Then it uses the documented default test location of "tests/",
  And it records that the default was applied because no configured value was found.
depends_on:
  - INF-1100a-1
doc_links:
  - path: templates/agents/test-writer.md
    relationship: describes
    status: exists
  - path: config/skills_config.default.json
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "Surface is the test-authoring agent template prose: when the compiled value for the test root is the documented default (because no project value was configured), the agent must use 'tests/' and must state in its output that the documented default was applied for want of a configured value."
  - "There must be exactly ONE documented default ('tests/'); the agent must never substitute an arbitrary guess when config is absent."
  - "The single-default fallback is owned end-to-end with INF-1100c-1 (the compiler supplies the default at substitution time); the agent prose only needs to surface that the default was applied."
delivers_to: null
