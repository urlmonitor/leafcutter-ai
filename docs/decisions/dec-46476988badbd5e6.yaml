options:
  - id: opt.depends_on_wins
    title: 'depends_on wins: drop an expects_from edge whose reverse is depends_on'
    description: 'Within each cyclic group, drop every expects_from edge whose reverse is a depends_on edge, with a WARNING
      on a successful run; any cycle left still fails. 5 groups still fail (4 live: ACD-2500d-1/d-3/d-3-i, BO-2400f-3-ii/f-5-iii,
      BO-2900b-3/c-1/c-4, BO-4300a-1/c-2). Breaks ticket 08 AC-3. In 7 of the 12 pairs the dropped edge is the one the producer''s
      delivers_to backs, so the consumer is built first. Needs a whole-graph rule in the epic index, separate from the shared
      per-record rule.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.fail_naming_edge
    title: fail with an error naming every AC and edge kind; nothing else
    description: Ticket 08 keeps every expects_from edge as a hard ordering edge. A cycle stops generation with an error that
      names every AC on the cycle (including ACs outside the requested set it passes through), each edge's field (depends_on
      or expects_from) and whether it is a structural-parent link. 10 live groups then block epic generation over their ACs
      (e.g. ACD-2500b-1/-i, BO-2900a-1/a-2, BO-4300a-1/c-2, INF-1300d-1/-i, TQ-500g-1-vii/viii); the DK-400 E1/E2 sets are
      unaffected; the existing BO-4300 epic is not regenerated. No follow-up ticket.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.fail_then_data_ticket
    title: fail naming the edges now; a separate ticket fixes the live cycles in the store
    description: 'Ticket 08 keeps every expects_from edge as a hard ordering edge. A cycle stops generation with an error
      that names every AC on the cycle (including ACs outside the requested set it passes through), each edge''s field (depends_on
      or expects_from) and whether it is a structural-parent link. 10 live groups then block epic generation over their ACs
      (e.g. ACD-2500b-1/-i, BO-2900a-1/a-2, BO-4300a-1/c-2, INF-1300d-1/-i, TQ-500g-1-vii/viii); the DK-400 E1/E2 sets are
      unaffected; the existing BO-4300 epic is not regenerated. A separate, user-approved ticket then resolves the 10 live
      groups by shape: remove sibling depends_on edges that point the wrong way (e.g. BO-2900a-2 -> a-1); two-way handshakes
      and child/parent cycles follow the user''s answers on what the edges mean. Not ''drop or invert the wrong edge in each''
      - several pairs have no wrong edge.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.fail_then_marker_ticket
    title: fail naming the edges now; a separate ticket adds a non-ordering marker
    description: 'Ticket 08 keeps every expects_from edge as a hard ordering edge. A cycle stops generation with an error
      that names every AC on the cycle (including ACs outside the requested set it passes through), each edge''s field (depends_on
      or expects_from) and whether it is a structural-parent link. 10 live groups then block epic generation over their ACs
      (e.g. ACD-2500b-1/-i, BO-2900a-1/a-2, BO-4300a-1/c-2, INF-1300d-1/-i, TQ-500g-1-vii/viii); the DK-400 E1/E2 sets are
      unaffected; the existing BO-4300 epic is not regenerated. A separate ticket adds a machine-readable flag on an expects_from
      entry (e.g. build_order: false), honoured by _prerequisite_ac_ids and therefore by the generator, the epic index and
      check_ac_circular_deps; authors mark relation-only edges (today 4 are marked in prose only, e.g. TQ-600a-5 -> TQ-600a-2).
      Needs a schema change.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.parent_link_yields
    title: a child's structural-parent depends_on yields to the parent's expects_from on it
    description: In the epic index, a child's depends_on on its own structural parent is not an ordering edge when the parent's
      expects_from names that child (the generator already drops parent edges, _gtfa_store.py:351-361); the child (producer)
      is built first. Resolves 7 of 15 groups; 8 remain (6 live) and fail naming the edges. Conflicts with KI-ACD-021's view
      that a parent can be a real build predecessor.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.expects_from_names_only
    title: expects_from only renames ticket dependencies; it does not order the epic
    description: Revert expects_from from ordering and cycle detection; use it only to translate a ticket's depends_on entry
      to the epic's NN_ name. Breaks AC-3 (the producer is no longer placed first). A mutual pair inside one epic gives two
      tickets that depend on each other; /build-feature never releases either, and its recheck reports them as discovered_after_planning,
      which names the wrong cause.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.added.1
    title: Parent link yields, other cycles fail naming the edges, plus a data-fix ticket
    description: 'Ticket 08: the ordering graph is depends_on plus expects_from, except that a child''s depends_on on its
      own structural parent is not an ordering edge when the parent''s expects_from names that child (the user''s answer:
      the parent link is hierarchy only and the parent''s expects_from decides; the child is built first). This resolves 7
      of the 15 cycle groups without dropping any expects_from edge. Any remaining cycle fails generation with an error naming
      every AC on the cycle (including ACs outside the requested set), each edge''s field (depends_on or expects_from) and
      whether it is a structural-parent link. A separate, user-approved data-fix ticket resolves the remaining live cycles
      in the AC store (wrong-way sibling depends_on edges, two-way handshakes).'
    assumptions: []
    evidence_ids: []
    proposed_by: user
    approved_by: user
criteria:
  - id: crit.keeps_ac3
    question: Does the option keep ticket 08 AC-3 and BO-2600a-5, so that every expects_from edge between two ACs in the epic
      either orders the epic producer-first or stops generation, and none is dropped while an epic is still written?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-e28abbce6cf68813
      - ev-ea728583eccc440b
      - ev-6ed1e7ed97bf8398
      - ev-0f2dd1179bc3647a
      - ev-c89c04b599fc44df
  - id: crit.no_ticket_cycle
    question: Is every epic the option writes free of ticket-level depends_on cycles, so /build-feature's planner can eventually
      release every ticket?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-7acf4633935e48d9
      - ev-ea728583eccc440b
      - ev-02378d4a5e97cc0c
      - ev-8a9d8f97eea58b07
      - ev-c89c04b599fc44df
  - id: crit.conflict_order_correct
    question: For an epic written over one of the store's cycles, is each producer (the AC whose delivers_to names the consumer,
      or whose contract the consumer's expects_from cites) built before its consumer - or does the option write no epic for
      that cycle?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-c89c04b599fc44df
      - ev-78b1e123e612fb18
      - ev-6ed1e7ed97bf8398
      - ev-abafb7bd6177ae3c
      - ev-7acf4633935e48d9
  - id: crit.defined_for_every_shape
    question: Is the option's result defined and independent of traversal order for every cycle shape in the store (expects_from-only
      2-cycles, 3- and 4-node cycles, a cycle through an AC outside the requested set)?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-78b1e123e612fb18
      - ev-8a9d8f97eea58b07
      - ev-1cafceba41896bee
