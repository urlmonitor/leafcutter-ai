title: "Baseline (Step 0) and post-merge (Step 3) test runs use identical build/deploy setup"
level: L2
component: finalize
status: active
readiness: approved
priority: high
parent: FIN-100a
criteria: |
  Given Step 0 captures the baseline by running the project build
  (python scripts/build.py, whose install_shims deploys scripts/commit_guardian,
  scripts/feedback, scripts/doc_compliance and the .pre-commit-config.yaml)
  before executing the full test suite in the temporary origin/main worktree
  When Step 3 runs the full test suite on the post-merge feature worktree
  Then Step 3 first performs the same build/deploy step against the feature
  worktree root before invoking the suite
  And both runs therefore collect and deploy the identical set of runtime
  artifacts
  So that deploy-dependent tests (for example those asserting on
  scripts/commit_guardian/* script paths, such as test_check_ac_governance,
  test_ensure_precommit_config, test_precommit_canary, test_verify_precommit_active,
  and setup_ticket_worktree bootstrap-gate tests) cannot fail RED in one run and
  pass in the other purely because of missing build state
  And the regression_candidates set difference (post_merge_failures minus
  baseline_failures) reflects only real code differences and never environment
  skew between the two runs
origin_agent: "BrainCandy"
created_by_ticket: "tickets/00_inbox/TICKET-20260707-restore-ci-test-baseline.md"
assigned_agent: "python-coder"
estimated_complexity: M
it_requirements: |
  - CONCRETE GAP (grounded 2026-07-10, observed 3x): in
    templates/workflows-js/finalize-feature.js, Step 0 captures the baseline by
    running `pytest --tb=no -q` (around line 440), while Step 3 runs the
    `test-runner` agent over the "full suite" (around lines 671-677). These are a
    DIFFERENT command AND a DIFFERENT scope, and NEITHER step runs
    `python scripts/build.py` / install_shims first. Deploy-dependent tests that
    invoke the deployed scripts/commit_guardian/* scripts therefore fail RED
    post-merge but not in the baseline, are mis-classified as regressions, and
    finalize HALTs falsely.
  - REQUIRED BEHAVIOR: Step 0 and Step 3 MUST use the SAME test command AND the
    SAME test scope, AND the SAME build/deploy state — either run
    `python scripts/build.py` before BOTH runs, or make the deploy-dependent tests
    resolve their scripts build-independently. The two runs must not differ on any
    of the three axes (command, scope, build state).
  - PR #234's "Step 3 build symmetry" is INCOMPLETE: it added a build to Step 3 but
    did not equalize the command/scope (Step 0 still `pytest --tb=no -q`, Step 3
    still the test-runner full suite). Verify and COMPLETE the symmetry across all
    three axes.
  - The Step 3 build/deploy MUST target the post-merge worktree root via
    `python scripts/build.py --target-dir "<WORKTREE_ROOT>"` (git -C "${WORKTREE_ROOT}")
    so install_shims deploys into the worktree being tested (not the ambient CWD);
    if Step 0 downgrades self-description enforcement
    (--self-description-enforcement warning) Step 3 MUST use the same level.
  - DO NOT DISABLE THE GATE: a genuine NEW test failure (present post-merge, absent
    from a build-symmetric baseline) MUST still be classified `regression` and MUST
    still HALT finalize. This AC removes environment skew as a false-regression
    source; it does not weaken real-regression detection.
  - This AC constrains only the environment/command/scope parity of the two test
    runs; it does not alter the triage set-difference logic (FIN-100c) or the
    null-baseline conservative path (FIN-100c-3).
  - A regression guard test SHOULD assert that the Step 0 and Step 3 dispatch paths
    use the same command, scope, and build/deploy instruction, so the two cannot
    drift apart again.
test_spec:
  - name: test_finalize_step0_step3_run_symmetric_command_scope_build
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "finalize-feature.js dispatches step-0 baseline and step-3 post-merge with the same test command, scope, and build/deploy instruction; a build-symmetric baseline produces no false regressions while a genuine new post-merge failure is still classified regression and still HALTs."
delivers_to:
  - agent: "test-failure-triage"
    contract: "provides post_merge_failures (Step 3) collected under the SAME build/deploy state, command, and scope as baseline_failures (Step 0), so the FIN-100c set-difference triage consumes a valid baseline and never mis-classifies environment skew as a regression"
expects_from:
  - agent: "test-runner"
    contract: "runs the project build/deploy before pytest and returns failures collected on the deployed post-merge state"
doc_links:
  - path: "templates/workflows-js/finalize-feature.js"
    relevance: "Step 0 baseline runs `pytest --tb=no -q` (~L440); Step 3 runs the test-runner full suite (~L671-677); the two must be equalized on command, scope, and build/deploy state"
  - path: "templates/workflows/finalize-feature.md"
    relevance: "Step map rows 0 and 3 — baseline vs post-merge test runs must use the same setup"
  - path: "docs/how-to/finalize-feature.md"
    relevance: "Baseline capture builds before running the suite; the post-merge run must match"
