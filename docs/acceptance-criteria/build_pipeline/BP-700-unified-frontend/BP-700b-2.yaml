title: "Trigger conditions match only frontend file extensions"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the unified frontend agent's trigger_conditions in agent_registry.json
  When a ticket has files_touched containing ".tsx" or ".jsx" or ".vue" or
    ".svelte" or ".html" or ".css" or ".scss"
  Then the dispatch system sets the agent status to "needed" for that ticket
  And when a ticket has files_touched containing only ".py", ".sql", ".md",
    ".json", ".yaml", or ".toml" extensions
  Then the dispatch system does NOT set the agent status to "needed"
