it_requirements:
  - "NEVER COLLAPSE ABSENT INTO EMPTY. Every consumer reads through the ACD-1600g-1 three-state seam; defaulting a missing boundary key to an empty list is forbidden anywhere in the call path. It is a one-line convenience and it destroys the entire guarantee of this AC."
  - "THE ANNOUNCEMENT GOES IN THE OUTCOME A PERSON READS -- the reviewer's Step 4 comment body in templates/agents/change-scope-reviewer.md -- and it must name the AC id(s) that carried no boundary. A log line, a debug print, or a field only a machine reads does not satisfy the third Then clause."
  - "ADVISORY, NOT FATAL. ADR-026 rule 4 forbids failing on an absent new field and rule 3 requires new gates to ship advisory before required, so absence alone must not escalate the sign-off status to blocker. The requirement is that the absence is ANNOUNCED, not that it stops the build."
  - "PRECISION ABOUT WHAT IS ACTUALLY DEGRADED TODAY, verified 2026-08-17 -- carry it into the fix rather than re-deriving it. With the list treated as empty: Tier 2's FIRST clause ('the file's top-level directory or component is listed in out_of_scope') is unreachable, but Tier 2's SECOND clause (a wholly different top-level component) still fires and must keep firing. Tier 1's second condition ('the file is NOT named in out_of_scope') is trivially satisfied, so an unexpected file in a SIBLING directory downgrades to a [scope-extension] tag and the review continues. Tier 3 already routes the absent-plus-partial-overlap case to ambiguous. The genuine uncovered gap is therefore absence with FULL component overlap, which today takes Tier 1 soft with no signal at all -- that is the case the announcement must cover."
  - "DO NOT 'FIX' THIS BY MAKING ABSENCE A TIER 2 BLOCK. That contradicts ADR-026 rule 4 and would stall every commit in the store during the cutover window, since no AC carries the field yet. The middle path is deliberate: the component PROJECT_CONTEXT.md classifies a stalled repo as a lesser risk than a false green, but this AC is not the place to take either extreme."
  - "DECLARED-AND-EMPTY MUST NOT TRIGGER THE ANNOUNCEMENT. It is the author's positive statement that nothing is excluded and is a fully migrated record. The two states must produce materially different outcomes and both must be asserted in the same test run."
  - "THE ANNOUNCEMENT MUST BE COUNTABLE, not prose-only: emit the list of un-migrated AC ids and a count alongside the human-readable line, so the backfill queue can be measured over time. An announcement nobody can aggregate turns a measurable migration gap back into a vibe."
  - "Canonical source only -- scripts/ac_store/scope_boundary.py and templates/agents/change-scope-reviewer.md in the source tree, never the deployed .claude/ copies (ADR-001). Deploy-manifest first if a hook comes to depend on the module (ADR-026 rule 2; scripts/build_phases.py ~line 794)."
delivers_to:
  agent: change-scope-reviewer
  contract: "Undeclared-boundary advisory: { undeclared_members: [ac_id], count: int, message: str }, rendered as its own section in the Step 4 comment body of templates/agents/change-scope-reviewer.md and countable for the migration backfill queue. Never escalates the sign-off status on its own; an AC that declared an empty boundary is absent from this list."
expects_from:
  ac_id: ACD-1600g-1
  contract: "read_boundary(ac_record) -> { declared: bool, paths: list[str] }. The `declared` flag is the entire input to this AC -- if the seam collapses absent into empty, there is nothing left here to implement."
test_spec:
  - name: test_absent_boundary_is_announced_and_names_the_requirement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Runs the real adjudication over a staged diff in a temp git tree against a real on-disk AC record with no boundary key; asserts the emitted outcome contains the advisory and the AC id."
  - name: test_declared_empty_boundary_produces_no_announcement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Identical staged diff and harness, AC record carrying an explicitly empty boundary: asserts no advisory is emitted and the outcome differs from the absent case. The pair must be asserted in one run so an unconditional-warning implementation fails."
  - name: test_absent_boundary_does_not_report_clean_scope
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "With an unexpected file that fully overlaps the change surface's component -- the case that silently takes Tier 1 soft today -- asserts the outcome is not reported as clean."
  - name: test_absent_boundary_does_not_escalate_to_a_blocking_status
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Absence alone yields an advisory, never a blocker sign-off status -- the ADR-026 rule 4 guard against over-correcting into a stalled repository."
  - name: test_component_mismatch_still_blocks_when_no_boundary_is_declared
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A file in a wholly different top-level component still yields a hard finding on a boundary-less AC -- Tier 2's second clause is untouched by the advisory path."
  - name: test_undeclared_members_are_counted_for_the_backfill_queue
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A five-member bundle in which three members declare no boundary yields a count of three and exactly those three ids, so migration progress is measurable rather than narrative."
test_rationale: "This AC is defined by a DIFFERENCE between two runs, so no single-case test can verify it: a test that only exercises the absent case passes on an implementation that emits the advisory unconditionally, and a test that only exercises the declared-empty case passes on one that never emits it. The absent and empty records are therefore driven through the same harness over the same staged diff and their outcomes compared. A direct-import unit test of the three-state reader would prove the reader distinguishes the states while leaving completely unproven the thing the AC is about -- that the distinction reaches the outcome a person reads. That is the same shape as a gate whose condition is computed and then discarded, which is the failure this whole tree was written against. The two guard tests exist because both natural over-corrections are invisible to the four main assertions: escalating absence to a blocker (stalls every commit during the cutover, since no AC carries the field yet) and replacing the Tier 2 condition wholesale while rewiring it (deletes the only block clause that works today)."
