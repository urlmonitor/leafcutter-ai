notes: |
  The reverse half of the bijection. Analytical decisions recorded for the IT PO and
  the implementer:

  - THIS DIRECTION IS THE CHEAP ONE AND IT IS STILL WORTH ITS OWN AC. Both directions
    compare the same two inventories — the capabilities the built surface registers,
    and the invocations the automation makes. Once BO-2900b-1 and BO-2900b-3 exist, the
    reverse comparison is nearly free. It is separated because it fires on a different
    change (a rename or removal, not an addition), has a different remedy (fix the
    call, not add a caller), and produces a different message. Folding it into
    BO-2900b would give one AC two failure modes and one message, which BO-2900e then
    could not specify cleanly.

  - "BEFORE THE RUN, NOT DURING IT" IS THE ENTIRE BENEFIT. A stale invocation already
    fails today — loudly, in the middle of an operator's build, after the earlier steps
    have taken effect. Nothing needs to be built to make it fail; what this AC buys is
    the timing. The clause is testable: the check must reach its verdict without the
    automation being executed. Without that clause, an implementation that simply runs
    the automation and watches for an error technically satisfies every other line here
    while delivering none of the value.

  - LIST WHAT DOES EXIST. Naming only the unknown capability leaves the author guessing
    whether the name is wrong, the capability was removed, or the surface failed to
    build. Listing the registered set answers all three at once and costs nothing,
    since the inventory is already in hand.

  - THE NEGATIVE SCENARIO (a clean script is not reported) is included because a
    reverse check that reports every invocation is indistinguishable from a broken one
    at first glance, and it is the failure mode of an implementation whose inventory
    is empty because the surface failed to build. See BO-2900c-3's derivation rule.

  Verification must EXECUTE the check against a fixture pair — one script with a stale
  invocation, one with only valid ones — and assert both outcomes.
