id: BP-1100c-1
title: "Finalization of a behavioral epic dispatches at least two independent angle-testing agents"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic that modifies executable code (one or more tickets list a file under
  scripts/ or scripts/workflows/ in files_touched) has all its tickets at status: done,
  When the finalization sequence runs for that epic,
  Then it dispatches at least two independent angle-testing spot-check agents whose
  brief is to invoke or simulate the feature at runtime and probe edge cases from the
  outside,
  And the spot-check phase is distinct from in-loop pr-review of the diff against AC
  text,
  And finalization does not report the epic as ready to merge until the spot-check
  phase has run.
