assigned_agent: python-coder
estimated_complexity: M
declared_files:
  - path: scripts/ac_store/_inspection_approval.py
    state: to_be_created
  - path: scripts/build_phases_ac_store.py
    state: existing
it_requirements:
  - 'THE APPROVAL FILE (user decision 2026-10-25): docs/acceptance-criteria/_inspections/<run_id>.json,
    a tracked file committed with the record, shape {run_id: str, gate_id: str, answer: ''approve'',
    answered_at: ISO-8601 UTC str, ac_id: str, inspected: [{path: str, blob: 40-hex str}]}.
    It is NOT the ADR-024 pause/resume store (.leafcutter/paused_runs/, gitignored, cleared
    on resume); this module never imports or reads scripts/pause_store.py.'
  - 'READ FROM GIT, NEVER FROM AN UNTRACKED FILE. Each layer reads the version it decides
    on, through git: the pre-commit check reads the index ('':<path>'', what is being committed),
    the CI checks read the head commit, and the mark command reads the index, falling back
    to HEAD. An approval file present only as an untracked working-tree file is ''missing'',
    so the person stages it with the record before marking done. No network call anywhere.'
  - 'Matching: answer is exactly ''approve''; ac_id is the record being marked done; run_id
    equals the inspection''s gate_run (and the file name); the inspected list equals the inspection''s
    list as a set of (path, blob) pairs; the review date is answered_at, and a date in the
    inspection that differs is refused, naming both.'
  - 'FAIL CLOSED: a missing, unreadable, non-JSON or wrongly shaped file, or any mismatch,
    refuses with the run id and what was missing or did not match. The inspection''s own text
    is never used in place of the file.'
  - 'No cleanup touches docs/acceptance-criteria/_inspections/: pause_store.py clear, worktree
    close and run-cleanup paths operate on their own stores only. Nothing in the project deletes
    an approval file.'
  - 'Single writer: the only code that produces an approval file is BO-2500f-3-ii''s approve
    step. No CLI subcommand, script or general-purpose helper in scripts/ or templates/ writes
    into the approval folder; a test asserts this by scanning those trees. Residual trust
    is accepted and recorded (user decision 2026-10-25): an agent with shell access could
    still write a file by hand.'
  - TESTS USE COMMITTED FIXTURES, NO NETWORK. Each test builds a temporary git repository
    holding a record, its approval file and the inspected files, commits or stages them, and
    drives the real check_done_proof.py --mode precommit and ci-changed CLIs as subprocesses,
    plus the reader directly for the edge cases. The same fixture run through all layers must
    give one verdict.
  - Called only from mark-time paths (the shared done rule of BO-2500f-4). check-ac-schema
    and requirement_rule_check never call it, so checking a record without marking it done
    is never refused on these grounds (BO-2500f-1).
  - Every new module under scripts/ac_store/ is added to build_ac_store's deploy_map in scripts/build_phases_ac_store.py,
    and its import is proven in the DEPLOYED .leafcutter/ layout, not only the source tree
    (the BO-2500a-1-ii ModuleNotFoundError precedent).
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: the approval file for the referenced run is read from the committed tree, with
      no network call and no read of any local, untracked store
    needs_test: true
    reason: Reading through git is the mechanism; an untracked file with the right content
      must be refused, which shows the committed tree is what is read.
  - clause: the inspection holds only if the file's answer is "approve", its AC id is the
      record being marked done, and its run id is the one the inspection references
    needs_test: true
    reason: Answer, record id and run id are three bindings, and each needs a case that breaks
      it.
  - clause: the inspected files and fingerprints in the approval file are exactly the files
      and fingerprints the inspection lists
    needs_test: true
    reason: The approved file set must equal the inspected set; one different fingerprint
      must refuse.
  - clause: the review date is the time the answer was given as the approval file records
      it, and a date written into the inspection that differs from it is refused, naming both
    needs_test: true
    reason: The review date comes from the approval file, and an inspection date that differs
      must refuse naming both.
  - clause: an answer other than "approve", or an approval file for a different record, does
      not count and marking done is refused as unreviewed
    needs_test: true
    reason: A non-approve answer and an approval for another record are the two routes to
      a false approval this clause names.
  - clause: when the approval file is missing, cannot be read, or any of the checks above
      does not match, marking done is refused, naming the run id and what was missing or did
      not match, and the inspection's own text is never accepted in place of the approval
      file
    needs_test: true
    reason: 'Failing closed is the safety property: missing, unreadable and mismatched files
      each need a case, and the inspection text must never stand in.'
  - clause: because the approval file is committed with the record, the mark command, the
      commit-time done check and the CI checks read the same file on every machine and reach
      the same verdict for the same record
    needs_test: true
    reason: Same verdict on every layer is the reason the file is tracked; one fixture through
      the mark command, pre-commit and CI modes shows they agree.
  - clause: an approval file is never deleted or cleared by any cleanup of workflow runs
    needs_test: true
    reason: A cleanup that removed approval files would silently un-prove finished records;
      running the run-cleanup paths over a fixture shows the file survives.
  - clause: an approval file is created only by the inspection workflow's own approval step
      (BO-2500f-3-ii); no command-line or general-purpose write command offered by the project
      creates an approval file with the answer "approve"
    needs_test: true
    reason: A second writer would reopen forgery by command; a scan of scripts/ and templates/
      for writes into the approval folder catches one being added.
  - clause: this check is made only at mark time; checking the record without marking it done
      does not read the approval file (BO-2500f-1)
    needs_test: true
    reason: Reading the file outside marking is behaviour a write path could add; committing
      an unfinished record with no approval file must pass.
