id: BO-2400a-1-iii
components:
  - build_orchestration
title: "The registry schema defines step_kinds once, and the registry gate that actually runs rejects an unknown kind by name"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the agent registry schema after this criterion is met,
  When it is read,
  Then it defines an optional step_kinds field on an agent entry: an array of unique
    strings, each one of reads_store, changes_store, changes_repository or publishes,
  And the schema is the only place that list of four kinds is written down: the registry
    gate and every other reader take the allowed kinds from the schema.

  Given a registry whose agent entry "fixture-agent" lists step_kinds ["reads_store",
    "deploys"],
  When the registry gate runs — at commit time, and when the build validates the
    package without building it,
  Then the gate rejects the registry,
  And the rejection names the unknown kind "deploys" and the agent id "fixture-agent".

  Given the schema's list of kinds gains a fifth kind "fixture_kind",
  When the gate runs over an entry listing step_kinds ["fixture_kind"],
  Then the entry is accepted without the gate itself being edited.

  Given an entry that lists the same kind twice, for example ["publishes", "publishes"],
  When the gate runs,
  Then the gate rejects it and names the repeated kind and the agent id.

  Given an entry with no step_kinds field, and another entry with step_kinds [],
  When the gate runs,
  Then both are accepted,
  And both are read as declaring no step kind at all.

  Given a registry that is valid apart from fields other than step_kinds,
  When the gate runs,
  Then its verdict on those other fields is the same as before this criterion: only
    step_kinds gains schema-based checking, and the registry is not newly validated
    against the whole schema.
depends_on: [BO-2400a-1]
