criteria: |
  Given UXP-100b describes a gap detection and research initiation workflow,
  When a sequence diagram is produced for this workflow,
  Then the diagram shows the following actors: UX designer agent, component
    library catalog, gap detection logic, and research pipeline
  And the diagram shows the sequence: (1) agent queries catalog, (2) agent
    compares required components against catalog, (3) gap detection classifies
    missing entries, (4) research requests are dispatched for each gap
  And the diagram distinguishes the near-match path from the entirely-new path
    as alternative branches in the sequence
