id: ACS-500g-6
components:
  - ac_store
readiness: approved
priority: critical
title: "The first pattern produced is the three-round seeded-gap agent-evaluation protocol"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the pattern capability has produced no patterns yet,
  When the first pattern is authored,
  Then it is the agent-evaluation protocol — a parameterised specification for
    verifying that a newly built or modified agent actually does a good job,
  And it declares at least three slots: one naming the agent under test, one naming
    the task set or fixtures used for each of the three rounds, and one naming the
    known-missing items each round's fixtures deliberately contain,
  And its parameterised body specifies three rounds, each round giving the agent
    under test a task drawn from that round's task set,
  And each round's task material contains deliberately seeded gaps or defects whose
    correct answers are recorded before the round is run,
  And each round scores the agent solely on which of that round's recorded seeded
    items it reports,
  And a run of the protocol is instantiated purely by supplying values for the
    declared slots — the three-round structure itself is not restated per agent.
depends_on: [ACS-500g, ACS-500g-2]
