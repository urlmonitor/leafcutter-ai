notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400c.

  WHY THIS IS SEPARATE FROM ACD-400c-1 RATHER THAN A CLAUSE ON IT. The recorded-value
  rule and the absent-value verdict are changed by different edits and could each be
  changed without the other. More importantly they answer different questions: one asks
  what an author's stated decision means, the other asks what the system decides on the
  author's behalf when they stated nothing. The second is the one that has a population
  attached to it — about three records in ten per the schema doc — and the one that a
  reader is most likely to guess wrong.

  THE THIRD CLAUSE IS THE ONE THAT MAKES THIS TESTABLE RATHER THAN RHETORICAL. Asserting
  that an absent approval is withheld is satisfiable by any implementation that withholds
  it for any reason. Asserting that a store with an absent approval and a store with a
  draft approval return the SAME answer pins the specific verdict — absent is treated as
  rejected, not as a distinct third state. An implementation that starts treating absent
  as a special case (offering it, or reporting it separately) fails this clause and
  passes every other sentence.

  THE INCONSISTENCY THE PO ASKED TO HAVE SURFACED, RECORDED HERE AS FACT, NOT PROPOSAL.
  Absent approval is treated harshly (the work vanishes). Absent urgency is treated
  generously (the work is ranked as though it were middle-urgency — ACD-400d-3). Both
  postures ship today; both are defensible in isolation; the inconsistency between them
  was invisible until both were written down, which is the whole argument for writing
  them down. NO CHANGE IS PROPOSED to either.

  RULED 2026-09-08 BY BrainCandy: KEEP BOTH DEFAULTS AS THEY SHIP. The asymmetry is
  accepted, not merely unresolved. That distinction is the point of recording it here:
  a reader who rediscovers the inconsistency next year should find a decision, not an
  open question they are tempted to close on their own initiative. The paragraph above
  is kept verbatim as the case that was put; this paragraph is its answer. Harmonising
  the two defaults now requires reversing a ruling, and this AC together with
  ACD-400d-3 are still the two records that would have to be amended to do it — which
  was always the point of stating each behaviour explicitly rather than by omission.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
