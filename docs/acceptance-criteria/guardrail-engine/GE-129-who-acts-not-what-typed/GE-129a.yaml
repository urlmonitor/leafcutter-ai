notes: |
  DECIDED 2026-09-17 -- LIVE PROBE IS THE FIRST L2 UNDER THIS L1 AND BLOCKS EVERY
  SIBLING (GE-129b..e and all other GE-129a children). In a scratch repository,
  record what identity the guard actually receives for (1) the top-level session,
  (2) a subagent dispatched through the Agent tool, (3) an agent dispatched by a
  workflow script's agent() call, (4) a subagent of a subagent, (5) a top-level
  session launched with --agent set to the commit specialist's name, (6) a
  same-named agent defined at user or plugin scope. If (3) carries no usable
  identity, GE-129c cannot be met as framed: stop and return to the user before
  decomposing further. The finding is recorded in the hooks reference (GE-129e)
  and replaces BO-3200f-2-iii's own 'establish from the live payload' clause
  rather than duplicating it.

  DECIDED 2026-09-17 (Q3) -- IDENTITY RULE. agent_type is accepted as sufficient,
  with its limit stated in writing (GE-129e), plus two safeguards:
    - agent_id must be present TOGETHER WITH agent_type naming the commit
      specialist. A name alone does not count: case (5) gives a top-level session
      an agent_type with no agent_id.
    - a BP-1000-family parity check flags a commit agent definition that diverges
      from the shipped one, or a duplicate definition of the same name at another
      scope.
  Stated limit: this protects against automation taking a shortcut (every recorded
  incident), not against someone who can write the project's agent definitions --
  who could equally edit or delete the guard.

  IDENTITY SOURCE: only what the harness supplies and a command cannot set. Never
  command text, environment variables, marker files, working directory or dispatch
  prompt -- BO-3200f-2-iii already states this and it carries over unchanged.

  DECIDED 2026-09-17 (Q6) -- NO GRACE PERIOD. The token is ignored by the guard
  (neither honoured nor treated as an error) from the moment identity enforcement
  ships, together with GE-129c's reroute and GE-129e's corrections.

  Absence of agent_id means the top-level session; that path is GE-129d.
