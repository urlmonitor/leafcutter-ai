id: BO-1000b-2-i
components:
  - build_orchestration
title: "On HALT the recap reports which steps completed, which step halted, and why"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given finalize halts partway through the sequence (for example a test
    regression is detected before the pull request is merged),
  When the halt summary is produced,
  Then the summary reports which steps completed with their recorded outcomes,
    names the step at which the run halted, and states the reason for the halt
    together with the remediation the user must take,
  And the mainline-affecting steps that were never reached are not reported as
    completed.
depends_on: [BO-1000b-2]
doc_links:
  - path: docs/architecture/components/finalize.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-017-dual-engine-workflow-support.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "1"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - The halt summary must be composed from the same per-step outcome record as
      BO-1000b-2, reporting ONLY the steps that recorded an outcome as completed;
      steps never reached (especially mainline-affecting ones: PR merge, main
      sync) must not appear as completed.
    - It must name the halting step and state both the halt reason and the
      required user remediation (mirror the existing HALT-on-test-regression
      message shape already in the finalize workflow).
    - Reuse the record-backed composition — do not build a separate halt-only
      summary path that could diverge from the success recap.
    - No new config key. ADR-001 build.py round-trip parity.
delivers_to: null
expects_from:
  ac_id: BO-1000b-2
  contract: "The record-backed end-of-run summary composition from BO-1000b-2, reused on the halt path with only recorded outcomes reported and the halting step named."
test_required: true
test_spec:
  - name: test_halt_summary_reports_completed_steps_halting_step_reason_and_remediation
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "When finalize halts partway through, the halt summary reports which steps completed with their recorded outcomes, names the step at which the run halted, and states the halt reason together with the required user remediation."
  - name: test_halt_summary_does_not_report_unreached_mainline_steps_as_completed
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Mainline-affecting steps that were never reached (e.g. PR merge, local mainline sync) are not reported as completed in the halt summary."
