    description: "Parse the declared participants and interactions; assert the person is a distinct participant, the question travels from the raising layer to the person and the answer back, and no declared interaction has a specialist in the answering position."
  - name: test_bo_3200c_5_pause_path_is_drawn_with_its_three_elements
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Assert the alternative path is declared and contains, separately: the run pausing, the resumable record being written, and the authored work being left in place."
  - name: test_bo_3200c_5_diagram_matches_real_runs_down_both_paths
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "THE COHERENCE CHECK. Drive one real run down the answered path and one down the pause path, capture both ordered traces, and assert each declared path matches its corresponding run in order and in both directions."
  - name: test_bo_3200c_5_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  The failure this diagram corrects is invisible in a picture: the interaction shape was right
  and only the identity of the answering participant was wrong, so a reviewer comparing the old
  drawing to the old behaviour would have found them in agreement. Making "who is in the
  answering position" a declared, asserted property is what turns that from a matter of reading
  into a matter of testing.
  Driving BOTH paths for the coherence check is required, not thorough: the pause path is the
  behaviour that was missing, and a check against the answered path alone would pass on a diagram
  that documents only the case that already worked.
  Deliberately NOT covered: layout and legibility, which are human judgement.
