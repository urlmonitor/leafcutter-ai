notes: >-
  Follow-up identified during /quick-fix BP-016 (merged as 47fb660f, PR #441).
  BP-016 fixed the tracking half — the shims are now untracked and matched by
  .gitignore, so one developer's absolute paths are no longer published to every
  clone. This AC covers the remaining robustness half. install_shims() builds
  both canonical_path and source_path as absolute paths and passes the absolute
  source straight to Path.symlink_to(), so every link bakes in one machine's
  directory layout; that is what made BP-016's damage possible in the first
  place, and it still breaks any tree that is moved, copied, rsynced or
  bind-mounted at a different path.
  Two shim depths exist and need different prefixes, which is why the relative
  target must be computed against the link's parent directory rather than the
  process working directory: .gemini and .pre-commit-config.yaml sit at the
  project root, while .claude/* and scripts/* sit one level down.
  Scope note: the single-file shims created alongside the directory shims are
  included deliberately — they are produced by the same function from the same
  absolute source_path and carry the identical portability hazard, and fixing
  only the directory half would leave .pre-commit-config.yaml pointing at a
  machine-local path.
