criteria: |
  You are told which two things collide and exactly what to do about it.

  When a numbering problem is found, you get the number in question, both pieces
  of work that claim it, and a clear next step — and while you are still working,
  the right specialist can be brought in to renumber for you rather than leaving
  you to untangle it by hand.
