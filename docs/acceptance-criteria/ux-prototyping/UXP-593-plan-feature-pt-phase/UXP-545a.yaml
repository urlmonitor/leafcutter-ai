    relationship: specifies
    status: exists
assigned_agent: frontend-coder
estimated_complexity: S
it_requirements: |
  commitStageOutputProductTruth in templates/workflows-js/plan-feature.js reuses the
  no-main-commit guard: it dispatches a branch-check status-checker and returns
  status:error (never dispatching commit) when the branch is main or cannot be
  confirmed non-main. Satisfies the In-Place Workflow Specs protected-branch AC policy.
