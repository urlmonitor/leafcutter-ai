notes: |
  THE FIRST AND LAST CLAUSES TOGETHER ARE THE WHOLE POINT. Retrieval that re-derives the
  answer from the tests as they stand today answers a different question — "would these
  tests catch it now" — and returns a fresh green that looks exactly like recovered
  evidence. What a later citation needs is the answer the run actually emitted, however
  stale, precisely so that its staleness is visible.

  THE SECOND AND THIRD CLAUSES ARE THE COLLAPSE THIS L1 CLOSES, SEEN FROM THE FUTURE. A
  reasoned negative and no record at all are both honest and they mean opposite things:
  one says the question was put and could not be answered, the other says nobody asked.
  Returning them identically is how a green result gets quoted as proof of a rule.

  BOUNDARY WITH TQ-500b-1. That AC assigns states during the run, at hand-off. This one
  makes the assignment survive the run and be addressable afterwards by name. An
  implementation satisfying b-1 with an in-memory report that ends with the process
  fails here.
