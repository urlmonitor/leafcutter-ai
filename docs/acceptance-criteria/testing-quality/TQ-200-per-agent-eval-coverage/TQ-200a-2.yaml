readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an eval set for an agent,
  When a row is scored,
  Then the scoring method is chosen by the agent's output type — a label, an
    artifact, or markup,
  And each output type has its own defined scoring method (see TQ-200a-2-i for
    label, TQ-200a-2-ii for artifact, TQ-200a-2-iii for markup),
  And an eval set declares which output type it uses so the runner applies the
    matching scoring method.
