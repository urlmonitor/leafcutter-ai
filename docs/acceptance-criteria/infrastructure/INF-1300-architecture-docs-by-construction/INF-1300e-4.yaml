notes: |
  THIS IS THE ONLY RECORD IN THE TREE THAT IS ABOUT THE FAILURE NOT RECURRING. Everything
  else delivers the means; this one restores the detection that would have caught its absence
  in the first place and has been switched off for this case for three months. Without it the
  tree fixes one instance of a defect whose alarm remains disabled.

  THE TWO-RUN CONSTRUCTION IS THE WHOLE RECORD AND IT IS NOT OPTIONAL. A guard that reports
  nothing is indistinguishable from a guard that cannot see. Delivering the means makes the
  guard silent by itself, so a single green run proves nothing at all — it is satisfied
  equally by a guard that was correctly reassured and by a guard that no longer looks at this
  reference for any reason, including the excusing entry simply still being there. Only
  withholding the means and requiring the report to come back separates the two. This is the
  same movement construction INF-1200c-1 and BP-900c-4-i settle for other subjects, reused
  rather than reinvented.

  THE LAST CLAUSE IS ABOUT MORE THAN TIDINESS. An exception list that excuses a reference
  which no longer needs excusing is a list nobody trusts and everybody adds to. Each stale
  entry lowers the cost of the next one, and the guard's whole value is that its silence
  means something. The L0 flags the removal for the IT PO to place because the list belongs to
  a completed record in another component; stating the property here means the removal is
  driven by this tree's own acceptance rather than depending on someone remembering.

  FALSIFIABILITY. Take the guard as the project runs it. Remove the entry excusing this
  reference, deliver the means, run: the record is falsified if the guard reports this
  reference. Then, changing nothing else, withhold the means from delivery and run again:
  falsified if the guard reports nothing. Both runs must be observed together and the state
  must be restored afterwards. Then read the exception list: falsified if an entry for this
  reference remains. What will not satisfy this record: running the guard once, with the means
  delivered, and reporting a clean result — that is the exact shape of evidence this project
  has repeatedly recorded as a check that examined nothing.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's. In
  particular, WHERE the exception-list edit is booked — under this tree or as an amendment to
  the completed record that owns the list — is an IT PO placement decision, not a criterion.
