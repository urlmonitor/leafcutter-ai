title: "Denying the surface, and citing no record at all, are refused on the same terms as omitting the declaration"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a change that adds a new entry to a package registry,
  And the only acceptance criterion it cites carries `package_surface: false`,
  When the change is evaluated at commit time,
  Then the change is refused,
  And the refusal states that the cited record denies registering a package
    surface while the change adds one, and names both the record and the entry —
  so that an incorrect declaration is reported as a contradiction between the
  record and the change, not as a missing field.

  And given a change that adds a new entry to a package registry and cites no
    acceptance criterion at all,
  When it is evaluated,
  Then the change is refused,
  And the refusal states that a change adding a package-registry entry must cite
    the acceptance criterion that declares it,
  And the refusal names the registry file and the entry key.

  And given a change that adds a new entry to a package registry and cites three
    acceptance criteria, exactly one of which carries `package_surface: true`,
  When it is evaluated,
  Then the change is allowed, and the two records that made no declaration are
    not reported — one declaring record is sufficient.
