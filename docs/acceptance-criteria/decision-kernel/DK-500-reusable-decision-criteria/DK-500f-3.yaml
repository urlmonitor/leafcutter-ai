id: DK-500f-3
title: Without a learning store, outcome statistics are off and nothing else changes
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_colony_1_collect
criteria: |
  Given no learning store is configured, or self-learning is switched off (LEAFCUTTER_SELF_LEARNING=false),
  When categories are published and a design decision reuses cat-1dc11c5a2ffa7310,
  Then no outcome aggregate is built and none is requested,
  And the usage counts are still generated, cat-1dc11c5a2ffa7310 at 3,
  And the decision is offered the same categories, spends the same Jev calls and reaches the same approval of proposals as with the store configured.
depends_on:
- DK-500f
- DK-500f-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500f-2
  contract: Aggregate rebuild, switched off without a store.
change_target: code
risk_surface: internal
it_requirements:
- 'With no Neo4j configured, or with LEAFCUTTER_SELF_LEARNING=false, the startup choice selects no statistics backend: no connection is attempted and no aggregate is requested. Decision records still follow memory.backend (ADR-065 section 4).'
- Usage counts come from Git and do not depend on the store.
- 'A decision run is identical with and without the store: the same offered categories, the same Jev calls and the same approval payload.'
test_required: true
test_spec:
- name: test_no_aggregate_built_or_requested_without_store
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With no store configured or with LEAFCUTTER_SELF_LEARNING=false, publishing makes no statistics connection and builds no aggregate.
- name: test_usage_counts_still_generated
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The usage index is still generated, with cat-1dc11c5a2ffa7310 at 3.
- name: test_decision_run_identical_with_and_without_store
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A design decision reusing cat-1dc11c5a2ffa7310 offers the same categories, spends the same Jev calls and reaches the same approval payload with and without the store.
test_rationale: Drive the rebuild through the ColonyMemory port with a fake statistics backend that records rows, over a fixture of published decision and category records; one live test against a real Neo4j proves server compatibility, as ADR-062 requires before claiming it.
