it_requirements:
  - "The sink path must be declared once and read by both sides — two literals kept in sync by convention do not satisfy this AC"
  - "The parity check must compare resolved paths, not source strings, so a relative-vs-absolute difference is caught"
  - "The check needs TWO failure branches, not one. Branch 1 (paths differ) is the mismatch. Branch 2 (the declared value IS the operational telemetry stream) is the settlement discriminator, and without it a one-line edit to the reader's argparse default passes the AC while producing the outcome the criteria reject. Both branches must be independently exercisable."
  - "Must handle errors gracefully per the project error handling policy"
  - "Must not silently create the sink file as a side effect of resolving its path"
  - "WHERE THE DECLARATION LIVES — IT PO decision RE-DECIDED 2026-09-07, REPLACING THE config/paths.json BULLET THAT STOOD HERE. That bullet is withdrawn as an instruction, not merely annotated: config/paths.json is a tracked, reviewed, PROJECT-RELATIVE paths SSOT, and what is declared here is an absolute path that differs per machine and per install and is produced by the build. The two cannot be the same artefact. THE FOUR PROPERTIES THAT BULLET ARGUED FROM SURVIVE AS THE TEST ANY HOME MUST PASS: one declared SSOT; readable by both sides WITHOUT importing the reader; ships through build.py so a consumer install sees a correct value; and tolerant of a sink FILE that does not exist yet. THE HOME IS NOW A BUILD-GENERATED CONFIGURATION ARTEFACT that build.py writes into the target, derived from the target root the build already resolves (scripts/build.py line 1899). The fourth property is met by the artefact recording a path and nothing validating its existence: whatever checks the deployed configuration must never require the sink file or the directory holding it to exist, for the reason INF-400c-4-iv gives. Do NOT put the declaration in a Python module constant — the parity check and the prompt-surface check both need to read it without importing the reader."
  - "TWO CONSEQUENCES OF THAT HOME A BUILDER WILL HIT, stated because neither is visible from the criteria. (a) Nothing in scripts/build_phases.py today GENERATES a configuration file carrying install-specific values — the config phases copy files — so this is a NEW build output rather than a new key in an existing one, and it must be added to the deploy manifest for exactly the reason done_proof.py had to be: a hook or gate that reads it runs from the deployed layout, not the source tree. (b) The artefact holds a machine-specific absolute path, so it must not be tracked by version control; a tracked home is disqualified by the same property that disqualified config/paths.json, and committing one would make every clone claim a path belonging to whoever built last."
  - "build.py's TARGET DEFAULTS TO THE CURRENT DIRECTORY WHEN --target-dir IS OMITTED (scripts/build.py line 1899: target_dir if given, else Path.cwd()). A bare build run from inside an isolated working directory therefore fixes that directory's own root into the declaration, with no flag typed and no warning printed. That is the silent-sink-split hazard INF-400c-4-v owns, and it is reachable by accident rather than by misuse — treat the default-to-cwd branch as an in-scope surface of that AC rather than as user error."
  - "ONE SIDE OF THE PARITY CHECK IS PROSE, AND THAT IS NOT A DETAIL. The reading side resolves the declaration at runtime; the emitting side is four markdown surfaces an LLM reads, which cannot call a resolver. THE EARLIER FORM OF THIS BULLET SAID THE EMITTING SIDE IS THE PATH LITERAL EXTRACTED FROM EACH SURFACE, AND THAT IS WITHDRAWN — INF-400c-4-i's criteria now forbid any shipped surface carrying a destination of its own, so there is no literal left to extract and a check built to compare one would compare nothing and pass. The emitting side of the comparison must instead be what the surface tells the agent to READ OR INVOKE in order to obtain the sink, resolved the way an agent following that instruction would resolve it. WHAT SURVIVES UNCHANGED IS THE COUNT: state how many emitting surfaces the check inspected in its own output — a check that resolves zero surfaces and reports agreement is the failure mode this AC exists to prevent, one level up."
  - "SEQUENCING AGAINST THE TWO IN-FLIGHT TEMPLATE ACs. This AC touches scripts/ and config/ only and touches no template, so its file set is disjoint from INF-700b-1 (adding the text field to the same four surfaces, in implementation now) and it can land in parallel with it. INF-400c-4-i is what touches the templates and must land after both. Do not bundle this AC's change into a template commit."
