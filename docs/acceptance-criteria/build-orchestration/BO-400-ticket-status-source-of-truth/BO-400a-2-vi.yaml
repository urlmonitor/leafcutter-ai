assigned_agent: llm-expert
estimated_complexity: S
delivers_to: null
expects_from: null
it_requirements:
  - "CANONICAL SOURCES ONLY (ADR-001): edit templates/agents/architect-review.md, templates/agents/conflict-resolver.md, templates/agents/pr-reviewer.md and templates/workflows/pr-review.md. Compiled and deployed copies are build outputs."
  - "Replace the instructed `## Escalation` heading, in the instruction text and in every fenced example of the agent's output, with a bold `**Escalation**` label line. Keep the Branch and Reason lines and their wording unchanged."
  - "Do not touch the templates' own section headings (for example `## Step 5 — Escalation Log` or `## Escalation section (required on every run)` in the template body); only the heading the AGENT is told to write changes. Renaming a template's own section heading is allowed only if a test or another file depends on the old instruction wording, and must then be updated together."
  - "Nothing in templates/, scripts/ or unit_tests/ parses `## Escalation` from agent output (checked 2026-10-14); re-check before changing, and update any consumer found in the same change."
test_spec:
  - name: test_escalation_section_is_a_bold_label_in_the_three_templates
    target_dir: unit_tests/agents/
    framework: pytest
    type: unit
    angle: criterion
    description: "For architect-review, conflict-resolver and pr-reviewer: locate the escalation instruction and its fenced output examples; assert they introduce the section with `**Escalation**` and that no fenced output example contains a line `## Escalation`."
  - name: test_no_agent_template_instructs_a_level_two_heading_in_output
    target_dir: unit_tests/agents/
    framework: pytest
    type: unit
    angle: boundary
    description: "Scan every templates/agents/*.md for an instruction to append/add/write a `## ` heading to the agent's output or comment, and for fenced output examples whose first line is a `## ` heading; assert none. Must not flag the template's own `## ` section headings."
  - name: test_scan_flags_a_template_that_instructs_a_level_two_heading
    target_dir: unit_tests/agents/
    framework: pytest
    type: unit
    angle: discrimination
    description: "NEGATIVE CONTROL. Run the same scan over a temporary template that says 'append `## Escalation` to your output'; assert it is flagged, so the store-wide test cannot pass by scanning nothing."
test_rationale: |
  The defect is in prompt text, so the honest seam is the text the agent receives.
  The behavioural consequence (a misplaced sign-off overruling a failure) is now
  blocked independently by BO-400a-2-v; this record removes the cause. The
  store-wide scan keeps a new template from reintroducing it, and its negative
  control keeps the scan from passing vacuously.
