    contract: >-
      A restructuring specialist that can be asked for by a supervisor as part of an
      ordinary workflow — a first-class identity with a defined tool set, an invocation
      path and its own sign-off protocol — rather than a slash command a human runs by
      hand. Every criterion in this tree presupposes it and none of them re-specify it.
  - ac_id: GE-127f-3
    contract: >-
      A refusal that names the file, states how much must leave it, and states which of
      the two dispositions applies — author-clearable, or handed to a restructuring
      specialist. This tree consumes those three facts as given, computes none of them,
      and derives none of them by a second route.
