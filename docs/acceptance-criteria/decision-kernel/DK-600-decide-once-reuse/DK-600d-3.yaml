notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-publishing step    write-published
    leafcutter/decision-publishing step    check-store
    leafcutter/decision-lifecycle  step    publish

  DERIVATION. Two publishing steps folded into one L2 under the five-L2 cap: a
  store that validates after the write is the post-condition of the write
  (scenarios write-published and check-store). Also carries the journey scenario
  decision-lifecycle/publish (validated, written, index regenerated; its "reviewed
  and merged in git" clause is DK-600d-4). Validator output shape from
  docs/how-to/file-and-reuse-decisions-with-the-kernel.md (Verification).

  STANDING RULE carried from DK-600d: publishing is the only writer of the
  published decision store.

  JOURNEY NODE NOTE. decision-lifecycle/publish expands into the whole publishing
  sub-flow. If the journey node should roll up the sub-flow, list DK-600d (the
  composite) in its implements instead of, or as well as, this AC.

  IT-PO BUILD STATUS (2026-10-02, unverified): built and tested. Pointers: amended_by.
