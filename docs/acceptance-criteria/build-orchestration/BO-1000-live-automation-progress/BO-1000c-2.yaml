it_requirements:
  - "Surface: the /finalize-feature launch contract (templates/commands/finalize-feature.md + main-loop poll/relay instruction) — the observable 'updates arrive in the conversation over time' is produced by the launcher relaying incrementally, so this is llm-expert prose, not a finalize-feature.js edit."
  - "The relay must deliver a progress line for the in-flight step BEFORE the run finishes — the launcher surfaces new journal lines as they appear rather than waiting for run completion."
  - "Multiple distinct updates must reach the conversation across the run (at least one per executed/skipped step that emits a line), not a single end-of-run batch. Poll cadence and dedup must ensure over-time delivery without repeating already-relayed lines."
  - "This behavior depends on BO-1000c-1a writing the journal incrementally (append-as-you-go) and BO-1000c-1b's poll/relay loop; do not re-implement the journal or the relay here — this AC asserts their combined over-time delivery guarantee."
  - "Keep the /finalize-feature command doc and its deployed copy in parity via build.py (ADR-001)."
