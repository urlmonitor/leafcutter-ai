id: BP-200e-2
title: "Agent emits a structured completion report showing checklist pass/fail per item"
component: build_pipeline
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the llm-expert agent template at templates/agents/llm-expert.md exists,
  When the "Response Payload" section is read,
  Then it specifies a "Prompt-Quality Checklist Results" table with columns:
    Item, Status, Notes
  And it lists all 6 checklist items as rows:
    - No compound bash commands
    - Tool allowlist matches body
    - No tools in body absent from allowlist
    - spawn_allowlist declared
    - Signoff section present
    - Stop-and-ask rules present
  And each row has a Status value of "pass" or "fail"
  And each row has a Notes field for violation details when status is "fail"
