criteria: |
  Given a consumer project with leafcutter-ai installed,
  When the user invokes the logging-convention detection skill,
  Then the system scans all .py files in the customer's project,
  And identifies the dominant logging pattern (e.g. "structlog", "logging.getLogger",
    "loguru", "print-based", "mixed"),
  And presents a summary: pattern name, file count, example usages,
  And asks the user which convention to enforce going forward.
