assigned_agent: documentation-expert
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: >-
    A reference page with one entry per kind and the two drift tests, which the
    scorer L3s (TQ-200d-2-i, TQ-200d-2-ii, TQ-200d-4-i, TQ-200d-4-iv) update in
    the same change as their scorer edits.
expects_from: null
test_required: true
package_surface: false
it_requirements:
  - >-
    The registry of kinds is the produced-tests scoring module's KINDS mapping
    (scripts/evals/produced_tests_scoring.py), which also spreads in the
    sql-test-writer kinds (scripts/evals/sql_test_writer_eval/) and the
    test-designer kinds (scripts/evals/designer_eval/). The drift test reads
    that mapping, not a hand-kept list.
  - >-
    Entry format is the documentation-expert's call, but each entry carries a
    machine-findable heading (for example the kind name in backticks as an H3)
    and a quoted template sentence the test can locate and match against the
    named template.
  - >-
    DOCUMENTATION (this AC's deliverable): docs/reference/produced-tests-eval-assertion-kinds.md
    with frontmatter (title, description, components) so build.py indexes it;
    scripts/evals/README.md links to it; docs/reference/README.md lists it.
  - >-
    DOC-DRIFT TESTS (two): (1) the set of kind headings on the page equals the
    registry's keys; (2) every quoted template sentence appears verbatim in the
    template it names. Both under unit_tests/evals/.
  - >-
    GLOSSARY: 'assertion kind' and 'produced-tests mode' go through the
    check-glossary-coverage hook and glossary-triage if the hook flags them; no
    hand-added entries.
  - >-
    CHANGELOG: one entry for TQ-200d-1-ii through scripts/changelog/emit_entry.py.
origin_agent: business-analyst
created: 2026-10-29
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target:
  - docs
  - code
risk_surface: internal
notes: |
  Placed under TQ-200d-1 because TQ-200d-1 introduced the produced-tests mode
  and its kind registry. Built first among the scorer fixes: they depend on it
  so each updates its own entry, and the drift test then holds the page to the
  registry and to the templates (the 2026-10-25 scorer defects were all "the
  check is stricter than the template sentence it checks").
