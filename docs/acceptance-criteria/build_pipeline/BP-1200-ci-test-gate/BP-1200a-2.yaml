id: BP-1200a-2
title: "The CI test command is documented as the single authoritative way to run the suite from a clean checkout"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the project documentation,
  When a person who has never set up the project locally looks for how to run
    the test suite,
  Then there is a single documented command sequence that, starting from a clean
    checkout, installs the development dependencies, performs any required
    preparation step, and runs the full suite over both the integration and unit
    test directories
  And that documented sequence is the same sequence the continuous-integration
    check executes, so following it locally reproduces the CI result
  And the documentation does not assume the reader already has any locally
    generated build output present.
depends_on:
  - BP-1200a
doc_links:
