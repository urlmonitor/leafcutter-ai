amended_by:
  - reason: "BA refresh, 2026-09-07. Two corrections. (1) The clause 'no shipped template pairs the string knowledge_captured with the telemetry sink path' was over-broad: the signoff knowledge-capture section legitimately names both, in the scope note at lines 959-965 that records the disagreement and defers it to INF-400c-4. As written the criterion would have been satisfied by deleting an honest description of the mismatch. Replaced with a clause requiring that paragraph to state the settlement instead. (2) The Then clauses asserted properties of the shipped TEXT ('when the shipped template text is read'), which is the grep-shaped coverage this repository's CLAUDE.md forbids for gate and wiring ACs. Restated as a property of where a record LANDS when an agent follows the surface literally."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA amendment, 2026-09-07, following INF-400c-4's rewrite around the approved decision that the sink resolves against the repository rather than the process's current directory. Two clauses added, nothing removed. WHY: this AC's Then clauses were all about WHICH file a record lands in, and were satisfiable by four surfaces that agree on a bare relative name — at which point an agent working inside an isolated working directory appends to a file that is reclaimed with that directory, in an install where every other clause here is green. The added clauses state the outcome as reaching the same file from anywhere in the install and as the record surviving the removal, and forbid a surface handing the agent a name the agent finishes resolving for itself. CONSEQUENCE FOR THE MECHANISM, RAISED FOR THE IT PO RATHER THAN SETTLED HERE: INF-400c-4's it_requirements describe the emitting side of the parity check as 'the path LITERAL extracted from each shipped surface'. A surface that must not hand over a directory-resolved name may no longer carry a comparable literal at all, so the check's emitting side may have to compare what the surface tells the agent to invoke rather than a string it names. The criteria are written as where the record lands precisely so they survive whichever form is chosen. UNCHANGED: the four surfaces, the settled-scope-note distinction, the best-effort clause, and the landing order in the it_requirements."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA revision, 2026-09-07, same day, following the anchor being re-settled as a build-time absolute path written into the deployed configuration. The clause added in the entry above forbade a surface handing over a name the AGENT finishes resolving; that was the right instinct against the previous anchor but too weak against this one. Under a build-fixed absolute path, no name a surface could carry is correct in two installs at all — a surface carrying one is right only on the machine the change was authored on, which is the most convincing possible way to be wrong, because it works for whoever writes it. The clause is therefore hardened from 'no name the agent resolves' to 'no destination of its own', and a two-install test descriptor was added: build into two temp projects at different absolute locations and require each surface to reach its own project's sink. That pair cannot be satisfied by any written-down destination. WHAT THIS SETTLES THAT THE PREVIOUS ENTRY RAISED: it flagged, as a question for the IT PO, whether the parity check's emitting side could still compare a path LITERAL extracted from each surface. It cannot — there is no longer a literal to extract, by criterion. The emitting side of the comparison has to be what the surface tells the agent to invoke or read. That is now a consequence of the criteria rather than an open question, and the landing order in the it_requirements is unaffected by it."
    by: business-analyst
    at: 2026-09-07
