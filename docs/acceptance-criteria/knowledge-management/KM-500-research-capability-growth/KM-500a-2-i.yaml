criteria: |
  Given a sufficient typed research request retains its requested records or structural population and the authorized registered query candidates
  When the system prepares candidates for the existing semantic operation decision
  Then it excludes a candidate only when authoritative typed scope or result facts prove that candidate returns the wrong requested population
  And it retains compatible and unknown candidates, including source-hydratable fields and operations whose enumeration may be bounded
  And descriptions alone neither establish population compatibility nor prove complete enumeration
  And a nonempty candidate set, including one remaining candidate, still receives the existing bounded semantic operation decision under unchanged acceptance thresholds
  And an empty set caused by proved incompatibilities returns ordinary unsupported without a paid operation decision or graph query
  And the original question, identities, fields, hierarchy, source restrictions, query provenance and cumulative budgets remain unchanged
  And selection uncertainty remains distinct from missing user meaning and from an established unsupported population
  And ordinary candidate absence or selection uncertainty adds no assessment that can veto useful sibling evidence through merge or continuation
  And no low-confidence choice forces execution, user clarification, repeated selection or a capability build
  And explicit registered operations retain their existing deterministic validation path
  And successful operation selection alone never declares a complete count or complete answer.
