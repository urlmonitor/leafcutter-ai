it_requirements:
  - A rejected mid-run split resumes the work item from its own kept routing result as one decision or research
    step; the run carries on with its other work and is not blocked by the rejection.
  - For a research item the split names no decision record (whole_decision_id stays null) and the item returns its
    evidence bundle to its parent as today.
  - Reachability uses the injected depth-1 producer of DK-400b-2.
