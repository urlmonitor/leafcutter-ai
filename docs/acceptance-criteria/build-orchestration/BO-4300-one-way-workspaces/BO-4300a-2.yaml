notes: |
  F10 and KI-BO-20260921 "abandons the epic worktree branch": a re-run moved the epic from
  EPIC-FilesStayWorkable to a fresh epic/files-stay-workable cut from the shared main line
  and drove the epic from the main checkout. OPEN (Q4, not decided here): which naming scheme
  achieves this. This record fixes only the observable -- one piece of work, one workspace,
  whichever route asked -- so it holds under any scheme the user picks, including an alias
  for the old EPIC-<Name> spelling.
