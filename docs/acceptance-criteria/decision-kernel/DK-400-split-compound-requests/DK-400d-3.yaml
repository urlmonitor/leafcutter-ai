  (DK-400d-3-i, flow split-reject; jev_none ends blocked, ambiguous falls back to today's
  clarification question, user rule at the final gate 2026-10-05), accepted as one (DK-400d-3-ii)
  and found mid-run (DK-400d-3-iii), both flow split-reject-kept-whole. The report line for each
  is DK-400f-3.
