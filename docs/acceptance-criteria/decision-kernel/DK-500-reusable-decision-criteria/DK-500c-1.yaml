id: DK-500c-1
title: Only a person's approval in a kernel run turns a candidate into a staged category record
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the candidate cat-73d233fc8b15c735 with proposed_by criteria_mining, approval_status proposed and the preferred wording "Maintainability: does it keep working with little upkeep as decisions and the harness evolve?",
  When human:user accepts it in a kernel run after changing its preferred wording to "Does it keep working with little upkeep as decisions, components and the harness evolve?",
  And that run ends,
  Then the category carries approval_status approved, approved_by human:user and the time of the approval,
  And its id is still cat-73d233fc8b15c735 after the wording change,
  And its record is written into that run's staged area with lifecycle_stage staged and that run's id, and it has no place in the published library yet,
  And no file in the repository changes.
depends_on:
- DK-500c
- DK-500b-1
covered_by:
- DK-500c-1-i
- DK-500c-1-ii
implemented_by: []
assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  agent: python-coder
  contract: 'Staged category record in the approving run''s staged area (<run_root>/runs/<run_id>/staged/criterion_categories/<id>.yaml): {id: cat-<16 hex>, repository_id, kind: criterion_category, pref_label, alt_labels[], broader: id|null, replaced_by: [], members[] {decision_id, criterion_id}, decision_types[], components[], lifecycle_stage: staged, approval_status: approved, proposed_by, proposed_at, approved_by: human(:<name>), approved_at, run_id, retirement: null, mined_from[]}, plus base_sha256: sha256 of the published file the change started from, or null for a new category. Validated against config/criterion_category_record.schema.json. Consumed by publish (DK-500c-2).'
expects_from:
  ac_id: DK-500b-1
  contract: Grouping suggestions and mined candidates presented in a kernel run.
change_target:
- code
- schema
risk_surface: contract_boundary
it_requirements:
- 'IT PO default (confirm with the user): review happens in a kernel run a person starts with python -m kernel criteria review. The run is bound to a new native capability criteria.review, registered in config/capability_registry.json through native_registration (ADR-055). It presents the open candidates and grouping suggestions from the mining store at one human approval interaction, where each item is accepted (optionally changed), rejected or left open.'
- Approval sets approval_status approved, approved_by from the human-answer submission (human(:<name>)?) and approved_at in ISO-8601 UTC. Editing a label, broader or the filters keeps the kernel-minted id.
- When the run ends, each accepted item is written once to <run_root>/runs/<run_id>/staged/criterion_categories/<id>.yaml with lifecycle_stage staged and run_id set (record_path null). The run's limitations name each staged path and the publish command, exactly as decision staging does.
- 'A new record schema, config/criterion_category_record.schema.json beside the decision record schema, defines the record file with authored fields only: id, repository_id, kind, pref_label, alt_labels, broader, replaced_by, members, decision_types, components, lifecycle_stage, approval_status, proposed_by, proposed_at, approved_by, approved_at, run_id, retirement, mined_from. Derived views (usage_count, member_view, replaces) and paths never appear in the file; it uses the same plain-YAML subset as decision records.'
- 'Filters come only from declared vocabularies (ADR-061 section 4): component ids from the component registry, and decision_types validated by the same rule as decision_type in the decision record schema.'
- No file in the repository is written during the run (ADR-060); the staged files and the run record are its only durable outputs.
- 'Staging is idempotent per run: resuming or re-finalizing a run never stages a second copy or a different id.'
test_required: true
test_spec:
- name: test_accepted_candidate_is_approved_by_human_with_time
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: After human:user accepts cat-73d233fc8b15c735 with a changed preferred wording, it carries approval_status approved, approved_by human:user and the approval time.
- name: test_id_kept_after_wording_change
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The record's id is still cat-73d233fc8b15c735 after the wording change.
- name: test_record_staged_in_run_area_with_run_id
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: When the run ends, the record is under <run_root>/runs/<run_id>/staged/criterion_categories/ with lifecycle_stage staged and the run id, and not in docs/criteria/.
- name: test_no_repository_file_changes
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A before/after snapshot of the repository shows no changed file.
- name: test_review_command_reachable
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: integration
  angle: reachability
  description: python -m kernel criteria review starts a run that waits for a human with the candidates in its question payload.
- name: test_staging_idempotent_on_resume
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Resuming the finished run again stages no second copy and no different id.
test_rationale: Exercise the review run and the publish command through their public CLI and RunService boundaries on a temporary repository copy and run root; assert staged files, published files, exit codes and byte-level before/after snapshots of docs/decisions/. Model-level unit tests alone would not prove that nothing is written outside the staged area or that publish is all-or-nothing.
