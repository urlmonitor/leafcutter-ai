notes: |
  THE NEGATIVE THAT MAKES THE POSITIVE MEAN SOMETHING. Every other record under INF-1300c
  describes something appearing in the index. All of them are satisfied by an implementation
  that lists every document it ever produces, flag or no flag. That implementation is
  defensible in review — the index is more complete, after all — and it takes a decision out
  of the author's hands that the authoring surface deliberately leaves in them. Only this
  record can fail on it.

  THE SECOND CLAUSE IS THE SHARPEST AND IT IS A PAIRED OBSERVATION. Requiring the produced
  document to be IDENTICAL with and without the listing pins the flag to exactly one effect.
  Without it, an implementation could change what it writes into the document depending on
  whether the document will be listed, which is the kind of coupling nobody looks for and
  which makes the two paths quietly different artifacts.

  THE WHOLE-PROJECT COMPARISON IS STATED IN THE CRITERIA ON PURPOSE. An observation that
  checks only the index has already assumed it knows where a stray write would land. The
  writes worth catching are the ones nobody predicted — a temporary file left behind, a
  neighbouring document's frontmatter touched, a sequence-number cache written somewhere.
  Comparing the whole tree before and after is the only construction that can see them, and
  it costs no more than the narrow one.

  FALSIFIABILITY. Take a full snapshot of a scratch project. Produce a document without
  asking for the listing. Snapshot again and take the difference: the record is falsified if
  the difference contains anything other than the new document and the single added line in
  its parent. Then produce the same document into a fresh copy with the listing asked for,
  and compare the two produced documents byte for byte — falsified if they differ. What will
  not falsify it: reading what produces the document for the presence of a conditional
  around the index write. That conditional can be present and still be reached on both
  paths.

