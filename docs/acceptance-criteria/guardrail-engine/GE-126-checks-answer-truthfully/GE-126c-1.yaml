it_requirements:
  - "All three arms must be run out of process against real files on disk in a fully built workspace. An in-process import of either copy cannot distinguish them, because the distinguishing fact is which path the file was loaded from."
  - "The refusal outcome value must be distinct from BOTH the ordinary success value and the verdict values. A caller must not be able to read the refusal as either, and a two-valued result cannot express three states."
  - "The second and third arms are regression coverage for the deployed copy and are not optional: without them this criterion is satisfied by making the build-source copy exit non-zero unconditionally while the deployed copy stays broken."
  - "The clean-record arm must exercise a record whose parent genuinely lists it, produced by the same writer the real store uses rather than hand-authored, so the pass is a verdict rather than an artefact of a fixture the parser mishandles."
  - "The refusal must not be reachable from the deployed copy under any condition this record creates. GE-126c-1-i is the fence and must be built in the same pass - a guard added at the top of the canonical file ships to every deployed location and refuses every commit in the repository."
  - "Error handling must follow the four rules in CLAUDE.md. The current behaviour - warn and return success - is a Rule 3 violation dressed as a fail-open, and the replacement must not preserve its shape with a different exit code."
test_spec:
  - name: test_build_source_copy_refuses_and_names_the_copy_that_enforces
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_ac_parent_covered_by.py"
    description: "In a fully built workspace, running the templates/ copy by subprocess against a child record whose parent omits it returns the refusal outcome - neither the ordinary success value nor a verdict - and its report names the deployed copy."
  - name: test_deployed_copy_blocks_the_same_record_naming_the_missing_back_link
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_parent_covered_by.py"
    description: "The deployed copy run against the identical record blocks, names the record and names the missing back-link - the arm that stops the fix being an unconditional refusal in templates/."
  - name: test_deployed_copy_passes_a_record_whose_parent_does_list_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "A child record whose parent's covered_by genuinely contains it, serialised by the store's real writer, produces the ordinary success value from the deployed copy - the discriminating control against a copy that blocks everything."
  - name: test_the_three_runs_return_three_distinct_outcome_values
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "The refusal, the block and the pass are compared to each other and are three different values, so a caller cannot read the build-source refusal as either a verdict or a pass. The 2026-08-25 behaviour - warning then ordinary success from the templates/ copy - is asserted absent."
test_rationale: |
  The single obvious test — the templates/ copy refuses — is satisfied by making that
  file exit non-zero on its first line, which passes while the deployed copy stays
  broken and every commit in the repository starts failing. The three arms are one
  criterion for that reason and the BA record says so explicitly. All three must be
  subprocess runs because the distinguishing fact is which path the file was loaded
  from, which an in-process import erases. The clean-record arm uses a real-serialiser
  fixture because this repository has already shipped a parser that was a no-op on every
  real record while passing on hand-indented fixtures.
delivers_to:
  agent: python-coder
  contract: "The refusal outcome for a copy that cannot enforce: a value distinct from both ordinary success and any verdict, carried by the build-source copy of check_ac_parent_covered_by. GE-126c-2 defines the message that accompanies it, GE-126c-3 defines what the refusal is keyed to, and GE-126c-1-i requires the deployed copies not to inherit it."
