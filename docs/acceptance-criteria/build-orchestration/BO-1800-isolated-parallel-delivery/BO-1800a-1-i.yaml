it_requirements: |
  ADR-018 Context: the 0-byte "shadow" loose-object corruption came from a
  killed-mid-commit writer against a SHARED store. Per-clone isolation confines
  that failure to the crashing drive. This L3 asserts the blast-radius boundary,
  not a recovery path (recovery is BO-1600d, de-prioritised). Test by simulating a
  killed writer in one clone and asserting the sibling clone is unaffected.
