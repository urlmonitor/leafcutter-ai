notes: |
  ONE OF THE TWO SITUATIONS THE PRODUCT OWNER LEFT TO DECOMPOSITION, and the answer is
  the one BO-3500a's notes asked for: this is a data defect and it should say so. Its
  sibling BO-3500a-3 is the other situation. Neither is answered by substituting a
  coder; that shared constraint is BO-3500a-1-i.

  WHY THE DISTINCTION IS WORTH A SEPARATE CRITERION rather than a nicer error message.
  The two situations have different owners and different remedies. An unrecognised
  craft is fixed by editing one record, today, by whoever wrote it. An absent craft is
  fixed by building a capability, later, by somebody else. A run that reports both the
  same way sends every reader down the wrong path half the time, and — worse for this
  tree — makes BO-3500d's backlog figure meaningless, because a hundred typos and a
  hundred genuine capability gaps would be indistinguishable in the count of what
  cannot be built.

  THE FOURTH SCENARIO is the one that will actually be hit. Sets are resolved, not
  chosen, so the defective record is usually not the one the operator aimed at. A
  report that names the aimed-at requirement is worse than useless: the operator opens
  a record that is perfectly correct.

  TESTABILITY. Execute a run against a store containing a record with an unresolvable
  craft name and assert on the run's terminal outcome and on the store afterwards. The
  machine-distinguishability clause is deliberately phrased so it cannot be satisfied
  by wording alone — the two endings must differ in something a caller can branch on.

  NOT DECIDED HERE, and flagged for the IT PO: which registry defines "exists". This
  criterion says "this project has no craft of that name" and leaves the resolution
  source to enrichment. Note the seam with ACD-1800a-1, which already requires a
  requirement's declared craft to resolve against the project's craft registry — that
  is the store-side validation of the same fact, and the two must agree on the source
  or a record can pass one gate and fail the other.
