  n_location_rule: "all"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - Every already-satisfied short-circuit branch (PR already open, branch
      already synced, closure commit exists, PR already merged, worktree absent)
      must still emit a start line that (a) occupies its "Step X of N" position
      and (b) names the concrete already-satisfied condition that caused the skip.
    - A skip must never be a silent early-return: no step may vanish from the
      progress output. This pairs with BO-1000b-1-i (the skip is also recorded as
      a "skipped" outcome so the per-step record has no gap).
    - Audit every existing short-circuit/idempotency guard in the workflow to
      confirm each now narrates its skip; missing a branch is the primary defect
      risk here.
    - No new config key. ADR-001 build.py round-trip parity.
