criteria: |
  Given the file templates/agents/llm-expert.md exists,
  When the section headed "Skills" is read,
  Then it lists exactly 3 skills in a table:
    - "add-agent-to-package" with condition: new agent template is complete and must be promoted
    - "add-skill-to-package" with condition: new skill body is complete and must be promoted
    - "signoff" with condition: end of every ticket phase
  And the table includes columns for skill name and when to invoke
  And each row references the SKILL.md file path to load
