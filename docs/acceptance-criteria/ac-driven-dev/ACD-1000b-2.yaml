id: ACD-1000b-2
title: "/ba slash command invokes BA v3 for L2/L3 decomposition"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the user types /ba followed by a reference to L1 ACs or a feature area,
  When the business-analyst-v3 agent is invoked,
  Then it reads the referenced L0/L1 ACs from the AC store,
  And it decomposes each L1 into testable L2 Gherkin behaviors,
  And it identifies edge cases as L3 ACs under each L2,
  And it checks for existing L2/L3 ACs to avoid duplication,
  And it assigns assigned_agent, estimated_complexity, and depends_on fields,
  And it logs assumptions that were inferred rather than stated.
