change_target: code
risk_surface: contract_boundary
notes: |
  The failure this blocks: "abstain when the evidence is untrustworthy" is one
  sloppy implementation away from "abstain whenever no valid tag was found",
  which silently exempts the entire 259-record unproven population — the exact
  backlog TQ-400d exists to work through. Untrustworthy evidence and absent
  evidence must reach opposite outcomes.

  Both outcomes must be observed in a SINGLE run over one store, otherwise two
  separately-configured runs could each pass while the real discrimination does
  not exist.

  IT-PO ENRICHMENT NOTE (2026-08-17) — WHERE THE FORK HAS TO LIVE. This is an
  architectural constraint, not a coding detail, and it is the reason the AC can
  fail even when the intent is right: if the sweep consumes a flattened list of
  resolved ids, 'capture present but unresolvable' and 'no capture at all' are
  already the same input and no downstream branch can tell them apart. The
  per-capture resolution outcome must be carried through from the reader. Second
  addition: an explicit prohibition on any threshold or ratio-based safety valve.
  A guard of the form "if most records look unproven, something is wrong, stand
  down" is a plausible piece of defensive coding that would neuter the sweep on
  its very first real run against 259 unproven records.
