id: GE-130c-1-ii
title: A stop after the fact says the change is still there -- it is never read as an undo
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a command the before-check could not judge has changed a watched file that its
    protection's rule refuses,
  When the after-the-fact check stops the run,
  Then the stop states that each named file remains changed in the working copy and has not been
    put back,
  And it states what the caller must do before continuing: put the file back, or make the change
    in a way the protection's rule allows,
  And the named files' content after the stop is identical to their content when the command
    finished.
