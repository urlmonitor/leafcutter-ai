criteria: |
  Given the "require a pull request before merging" protection is enabled on main
  And the PR-native delivery, the required-check merge gate, and the blocked-merge surfacing behaviors are all in place
  When the automation runs a full unit of work whose required checks all pass
  Then the work is committed to a working branch, a pull request is opened and updated, the required checks turn green, and the pull request is merged into main
  And the run completes without any direct push to main
  And the run completes without disabling or bypassing the branch rule
depends_on: [BO-1300d, BO-1300a, BO-1300b, BO-1300c]
