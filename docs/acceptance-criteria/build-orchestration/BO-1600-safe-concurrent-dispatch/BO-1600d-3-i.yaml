assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "NEW GIT-VERSION GUARD HELPER: the leafcutter package has NO git-version guard helper today (confirmed absent). This AC's behavior REQUIRES one — add a small helper (e.g. _git_version()/_require_git_version() in the recovery module templates/scripts/git_recovery.py) that parses the installed git version and gates the --refetch flag behind version >= 2.36. Probe the version BEFORE the refetch action; never invoke an unsupported flag and let git error opaquely."
  - "On git older than 2.36, either use a supported fetch that restores the needed objects, or refuse with a message naming the minimum version (2.36) — the version-refuse must be a clean, explicit stop, not an opaque git error."
  - "Ordering safety: do not remove the zero-byte objects until the refetch path for restoring them is confirmed viable, so a version-refuse never leaves the store worse than the halted state."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap the version probe and fetch subprocess in try/except with a specific exception type and log at WARNING or higher; a failed/ambiguous version probe must refuse the refetch, never assume support."
