notes: "Distinct pre-existing defect in allowlist PARSING, not a regression from the GE-113c-3 suffix-match fix — the hole behaves identically in the pre-fix and post-fix code, which narrowed around it without closing it. Root cause: the allowlist line parser accepts a file path field that yields zero path segments (empty string, '.', './', whitespace-only), and an empty segment tuple is trivially a segment-suffix of EVERY finding path, so one malformed line silently suppresses that rule repository-wide. Verified end-to-end against the real pre-commit path (check_secrets imports scan_files from scan_secrets): against a file containing an AWS key, a password assignment, a PEM header and a high-entropy token, the baseline reported 4 findings; adding a wildcard-rule entry with an empty path field reported 0 (scanner fully disabled) and adding a rule-scoped entry with an empty path field reported 3 (that rule disabled repo-wide). Real-world exposure to date is nil — a live audit found zero occurrences across 30 .security-allowlist files on disk and across all 16 revisions of the tracked file's history — so the risk is prospective, from a future typo. The warn-and-skip disposition (rather than a hard error) is deliberate: check_secrets runs on every commit, so a hard error would escalate a cosmetic typo into a repository-wide commit outage, whereas skipping fails closed and is self-announcing because the author immediately sees the finding they were trying to suppress. Examples deliberately avoid env-filename files: a sibling audit found that scan_file short-circuits those to a single ENV_FILE finding and never scans their content, which made two sibling ACs describe unreachable scenarios."
