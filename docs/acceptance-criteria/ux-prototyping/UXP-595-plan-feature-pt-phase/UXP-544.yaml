id: UXP-544
components:
  - ux_prototyping
title: "pt-classifier is dispatched once after ac-triage and the run-set is derived from its outcome"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given /plan-feature has classified the request via ac-triage,
  When the product-truth phase begins,
  Then pt-classifier is dispatched exactly once (always-on) before any authoring agent,
  And the set of artifact agents to run is derived from the classifier's outcome
  (full-set / mockup+data / mockup-only / mock-data-only / none) via the canonical
  OUTCOME_TO_STAGES mapping, not from any advisory dispatch array,
  And an outcome of none dispatches no product-truth agents and proceeds straight to
  the AC pipeline.
depends_on:
  - UXP-595
doc_links:
  - path: docs/architecture/adrs/ADR-021-plan-feature-product-truth-phase.md
    relationship: specifies
    status: exists
  - path: docs/product-truth/flows/leafcutter/author-product-truth.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements: |
  The always-on classifier dispatch and the outcome->run-set derivation are
  implemented in the E2 workflow templates/workflows-js/plan-feature.js, inserted
  after ac-triage/covered handling and before the AC pipeline. The run-set comes from
  OUTCOME_TO_STAGES (the row-for-row inverse of the validator's OUTCOME_BY_COMBO);
  outcome=none is a fast-path that skips the whole phase.
