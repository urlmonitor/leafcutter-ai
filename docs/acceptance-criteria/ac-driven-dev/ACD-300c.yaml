criteria: |
  After the product owner's stage and after the business analyst's stage, the
  workflow presents the produced ACs to the user and waits for explicit
  confirmation. The user can approve (continue to next stage), request edits
  (re-invoke the same agent with feedback), or cancel (abort the pipeline and
  keep any ACs already written as drafts). The technical planner's stage has no
  human gate: it is approved automatically once its requirement rule check
  passes. A requirement rule check runs after every authoring stage and fails
  closed — a stage whose check fails is re-authored, never approved. No
  downstream agent is invoked without the prior stage's approval. The final
  gate follows the test-design stage: the user sets one priority for the batch,
  and approval promotes to approved exactly the records the approval-hold
  report releases; held records stay reviewed, shown with their reason.
