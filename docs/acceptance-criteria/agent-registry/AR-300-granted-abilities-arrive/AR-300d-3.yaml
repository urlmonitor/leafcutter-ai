implemented_by: []
notes: |
  REVOCATION IS THE CASE NOBODY WRITES, AND IT IS WHERE 'DERIVED' IS PROVED.
  Every additive criterion in this tree is satisfied by a design that appends to
  something already recorded. Only removal distinguishes a section derived from
  the declaration on each build from one accumulated over time -- and an
  accumulating design tells an agent it may use an ability that was deliberately
  taken away, which is a worse outcome than the original defect rather than a
  cosmetic one.

  PER AGENT, NOT PER ABILITY. The clause about the other holders exists because
  the cheapest implementation of revocation removes the ability from a shared
  structure, silently revoking it for everyone.
