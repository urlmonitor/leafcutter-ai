priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run that ended with a resolved decision approved_by human:user at 2026-10-02T05:39:33Z,
  When the decision executor finishes,
  Then it hands the decision to the record builder,
  And the handed-over decision keeps its approver human:user and its approval time
    2026-10-02T05:39:33Z unchanged.
