    relationship: context
    status: exists
    relevance: "Sibling L2 and this L1's existing child: one canonical dataset per entity per component, extend never duplicate. This AC applies the same rule to descriptions."
  - path: docs/acceptance-criteria/ux-prototyping/UXP-500-product-truth-generation/UXP-514.yaml
    relationship: context
    status: exists
    relevance: "Complementary, not duplicate. UXP-514-6 guards the duplicate copy while it exists; this AC removes the duplication."
