id: DK-300b-3
title: "Fixed work and output limits hold independently of prose length"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given an admitted goal contains 100 distinct IDs, a glossary term repeated 100 times and long authored definitions,
  And supplied caller text exceeds 12000 characters,
  When recognition selects and projects candidates using its default limits,
  Then it considers the full goal before at most 12000 caller-text characters, taking newest conversation first,
  And it performs at most 64 distinct candidate lookups ordered by explicit IDs and qualified symbols, then typed or longest phrases, then unique short names with deterministic source-offset ties,
  And repeated occurrences do not increase identity slots or distinct lookup work,
  And at most 16 total identities including ambiguity alternatives are returned, with at most three alternatives per ambiguous mention,
  And meaning text is at most 300 characters per identity with sentence-boundary cuts when possible,
  And at most eight explicit unresolved references retain names no longer than 128 characters,
  And the bounded meaning projection may retain a representative mention and occurrence count while the checkpoint preserves all admitted mentions for its retained identities,
  And serialized projected entity meanings, unresolved references, coverage, budgets and limitations together occupy at most 8000 characters, excluding the separate goal and caller channels,
  And detected, resolved, returned and omitted counts state every reduction without presenting omitted cards as unscanned text.
depends_on: [DK-300b]
