test_rationale: >-
  Every arm is about a check RUNNING during a commit, so no test reads the manifest
  as text to prove a check runs. A test that asserts five entries appear in
  hooks_manifest.hooks is green on a registration that is unreachable, misstaged,
  filtered to nothing, or pointing at a script the deployed tree does not carry —
  and this repository has shipped all four of those. Evidence strength differs by
  entry, and the type field says which is which. behavioral means a real git commit
  or merge through installed pre-commit shims (arm 1). integration means a
  real subprocess of the registered run_hook.py entry against a real scratch git
  repo (arms 2, 3, 4 and the review-finding snapshots). That is the wrapper the
  registered entries invoke, but it is not a full commit. unit is reserved for the
  two manifest or baseline reads: the arm-4 exemption declaration and the arm-5
  inventory. Arm 4 is four refusals plus one declaration, because
  check-ac-done-on-merge structurally cannot refuse. The refusals are the entries
  that cannot be faked: three of the four are vacuous here and one is unarmed by
  default, so green results alone would satisfy a naive reading while changing
  nothing. The parity test is a regression guard, not a criterion clause.
declares_side_effect: false
delivers_to:
  agent: python-coder
  contract: >-
    The five new members of hooks_manifest.hooks in
    templates/scripts/commit_guardian/commit_guardian.json — ids check-folder-density,
    check-test-fixture-bloat, check-sql-complexity, check-debug-scripts,
    check-ac-done-on-merge — each with language: system, always_run: true,
    pass_filenames: false, change_set_source: handed_by_commit_path and NO files
    key. The first four: tier: judgment, stages ["pre-commit"], entry through
    run_hook.py. check-ac-done-on-merge: tier: transform, stages ["post-merge"],
    entry invoking hooks/check_ac_done_on_merge.py directly (no run_hook.py), and
    negative_control {not_applicable: true, reason: <structural ground>}. Consumed by GE-120h-3-i, which
    judges their shape, and by GE-120h-4, whose per-check statements must match them.
