test_required: true
test_rationale: |
  This record is about wording, and wording is only evidence when it is the wording a real
  run produced. Drive the lane with the producing step's reply controlled and assert on the
  run's terminal output — never on a string found in the lane's source, which proves only
  that a message was authored, not that this run reaches it.

  Three shapes.

  Drive the escaped-content case and assert the terminal output states that the bundle was
  produced and altered in transit, and carries both compared values. Asserting only that
  the run halted passes on today's behaviour, which halts for a stated reason that is
  wrong; the assertion has to be on what it says.

  Drive an alteration that destroys the structural landmark, and assert the output reports
  the delivery failure and does NOT report the landmark as missing. This is the ordering
  test: an implementation that checks the landmark first reports the symptom and passes
  every test written about the symptom.

  Drive every unusable state in ONE test and compare the messages pairwise. Asserting each
  in isolation is what allows a single undifferentiated wording to satisfy all of them —
  the same trap BO-2400c-1-iii records for its three states, now with a fourth member.
