criteria: |
  Given the four places in the repository that each define a coverage-tag
    recognition rule of their own, named here as the closed set this AC is about:
      R1, the canonical capturing rule in the AC-store test-enforcement module,
        which the done-proof verdict applies and which the pytest enforcement
        plugin and the fast lane reuse by import rather than redefining;
      R1f, the duplicate of that same rule written out a second time in the
        commit-time done-proof check's import-fallback branch, which is the copy
        that runs whenever the enforcement module is not importable;
      R2, the separately written rule carried by the commit-time test-tag check,
        which only detects that a tag is present and never captures its value;
      R3, the separately written rule carried by the AC-to-test coverage check,
        which captures the value but recognises Python "#" comments only and so
        is blind to the "//" tags the other three accept,
  And the unit-test tree exactly as committed,
  When every rule in that named set is run over that same on-disk tree,
  Then each produces the same set of records of (file, test function, captured
    value), including the same verdict on every capture: recognised tag,
    rejected non-tag, or malformed tag
  And any capture that one rule recognises and another does not is reported as a
    disagreement naming the captured value, the file, and every rule that accepted
    it alongside every rule that did not
  And the comparison covers every rule in the named set, so a comparison that comes
    out clean over any proper subset of the set — any pair, or any three of the
    four — does not satisfy this criterion
  And the comparison is made from the rules' output over real files, not from
    comparing their pattern strings, so two patterns that read differently but
    behave identically are not reported and two patterns that read similarly but
    behave differently are.
