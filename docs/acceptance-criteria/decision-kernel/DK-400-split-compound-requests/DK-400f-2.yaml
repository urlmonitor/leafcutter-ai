    status: exists
    relevance: "Run statuses, gap records, resume answers and the run report as they are today."
  - path: docs/analysis/2026-09-30-decision-kernel-design-5-client-observability.md
    relationship: describes
    status: exists
    relevance: RunService resume validation, the RunEnvelope, report.md, tracing and redaction.
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: documentation-expert
  contract: The exact report line forms listed in this AC's it_requirements, which the how-to of DK-400f-4 explains.
expects_from:
  ac_id: DK-400e-2
  contract: Decided parts' record ids, chosen option titles and precedents_considered actions (DK-400e-2 delivers_to
    shape).
it_requirements:
  - 'report.md gains a split section built from report_lines (template text, no LLM): one line per part in part
    order, each starting with the part id: ''<id> decided: <chosen option title> (<dec id>, staged)'', with '';
    <earlier part id>''s record cited as precedent'' when an earlier part''s record was used as evidence or reused;
    ''<id> answered: <findings>''; ''<id> not settled: ...'' (DK-400f-2-i); ''<id> not run: waits for <id>, which
    was not settled (<stop reason>)''; ''<id> not run: left out at the split''.'
  - report_lines is empty while the gate is open and for every run without a split; report.json carries the same
    lines.
  - The lines are stored on the split record (report_lines), so the envelope, report.md and the progress view never
    disagree.
  - 'Handle failures per the project error handling policy: catch specific exceptions, log at WARNING with the run,
    work item and split ids involved, and never swallow a failure silently; a rejected submission leaves run state
    unchanged.'
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default: batch order inside E3 does not guarantee that DK-400e-1''s
    flip lands first, and a later default change must not silently flip a test (dec-9925ebf1895222f4).'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_report_has_one_line_per_part_in_record_form
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: 'For the split-bounds split report.md has exactly three split lines: p1 decided with its record
      id, p2 decided with its record id and p1''s record cited as precedent, and p3 not run, left out.'
  - name: test_report_has_no_split_lines_while_gate_open
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: The envelope and report written while the gate is open have empty report_lines.
test_rationale: The report is a written artifact, so the tests read report.md back from the run's artifacts.
origin_agent: business-analyst
