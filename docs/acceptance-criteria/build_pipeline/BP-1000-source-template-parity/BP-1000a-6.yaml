id: BP-1000a-6
components:
  - build-pipeline
title: "After the feedback source relocation, deploying feedback to a target still installs and shims the scripts with no consumer regression"
component: build-pipeline
level: L2
status: superseded_by
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000a.yaml"
criteria: |
  Given the feedback deployable-script source has been relocated to the tracked
    templates/scripts/feedback/ mirror (per BP-1000a-5)
  And a clean external target project with no prior leafcutter deployment
  When the build is run against that target project
  Then every feedback script that exists under templates/scripts/feedback/ is
    deployed to the target's feedback scripts location and shimmed exactly as it
    was before the relocation
  And the set of feedback script files present in the target after the build is
    identical to the set that the pre-relocation build produced for the same
    target
  And no feedback script is missing, renamed, or left unshimmed compared to the
    pre-relocation behavior
depends_on:
  - BP-1000a
  - BP-1000a-5
