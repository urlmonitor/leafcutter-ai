title: "An interrupted update never destroys the work record it was updating"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a requirement's record in the store, holding its wording, its links and its
    accumulated notes, currently showing that work on it has not started,
  And a lean build that is recording that work on it has now begun,
  When that update is interrupted before it completes — the run is killed, or the
    write fails partway through,
  Then the record still contains everything it contained before the update, and can be
    read back and understood,
  And the record is never left empty,
  And anyone reading the record while the update is in flight sees either the whole of
    the old content or the whole of the new content, never a half-written mixture.
depends_on: [BO-2400e]
