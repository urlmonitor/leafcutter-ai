  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Reading, listing and searching are never blocked.

  Commands that only look at files go through without being stopped by a file
  protection, and this is shown on real everyday commands before any protection
  starts blocking, so wider protection does not get in the way of finding out
  what is there.
