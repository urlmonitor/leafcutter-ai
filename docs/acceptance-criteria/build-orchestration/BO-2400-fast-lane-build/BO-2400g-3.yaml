assigned_agent: llm-expert
estimated_complexity: M
declares_side_effect: false
it_requirements:
  - "Both readers must be requested by the RUN's own dispatch, which is top-level. A reviewer agent that tries to obtain the second opinion by spawning them from inside itself hits the depth-1 sub-agent limit and silently gets nothing back — the inert-phase failure BO-2400g-2 exists to prevent, reappearing one level down. This is the third Then clause's implementation consequence."
  - "Reuse the two existing readers rather than authoring a third: templates/agents/find-design-smells.md for the cross-cutting examination and templates/agents/find-structural-smells.md for the local one. A single generic 'review this diff' reader does not satisfy the first Then clause — it produces plausible output while systematically missing cross-cutting smells, which need reasoning over the whole change rather than the function in front of it."
  - "TIER ASYMMETRY MUST NOT BE FLATTENED. The cross-cutting reader is Opus-tier because its smells need whole-target reasoning about data flow, ownership and change locality; the local reader is Sonnet-tier. Running both at the cheap tier to protect the lane's cost story satisfies every dispatch-shaped clause and fails the first Then clause in practice. Preserve each agent's declared model."
  - "BOTH readers RETURN findings rather than writing a file, so the run must deliberately carry their output onward into its result. 'Asked for and then discarded' is a silent, plausible outcome that every dispatch-counting test would call a pass — this is the single most likely way this AC ships as decoration."
  - "Merge both readers' findings into the single review-result `findings` list defined by BO-2400g-2, preserving each finding's requirement id, file path and severity. Do not introduce a second findings format for design findings; BO-2400g-4's ladder and BO-2400g-4-i's rendering both read one list."
  - "The two readers may be dispatched in parallel from the top-level loop, matching templates/skills/code-smell-review/SKILL.md. Neither may block on the other's result, since the criteria require both examinations to happen independently."
  - "TESTS MUST NOT BE GREP-ONLY. Assert the two separate reader requests from the run's own captured dispatch sequence via unit_tests/_workflow_engine_harness.py, never from meta.phases — that field is a declaration consumed by the progress UI and stays correct on a workflow whose real dispatch is wrong."
  - "Agent template changes take effect only in the deployed layout, so `python scripts/build.py --target-dir .` must run before any test that exercises the deployed readers."
  - "COST IS A USER DECISION, NOT AN IMPLEMENTATION SHORTCUT. Adding two readers per run has a real cost and BO-2400c/BO-2400d exist to show the lane is cheaper and faster. BO-2400's L0 promises to drop ORCHESTRATION overhead, not scrutiny. If the measured cost proves unacceptable, escalate it as a scoping decision — do not quietly resolve it by making the readers shallower or collapsing them into one."
delivers_to:
  - agent: pull-request
    contract: "The same review-result object defined by BO-2400g-2, with the `findings` list now carrying entries from BOTH readers — the cross-cutting (design) reader and the local (structural) reader — each entry keeping its {ac_id, file, severity, text} shape. Consumed by BO-2400g-4's severity ladder and BO-2400g-4-i's pull-request rendering without either needing to know which reader produced a finding."
expects_from:
  - ac_id: BO-2400g-2
    contract: "The reading step positioned between the Coder and Commit phases, its two bound inputs (the resolved requirement set and the working diff), and the review-result object whose `findings` list this AC extends with a second reader's output."
test_spec:
  - name: test_cross_cutting_problem_with_no_local_mistake_is_surfaced
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A planted change that is locally clean but spreads one concept across four files yields a finding. This is the assertion a single generic 'review this diff' reader routinely fails while still producing plausible output."
  - name: test_local_mistake_with_no_design_problem_is_surfaced
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The mirror case, run in the same suite so an implementation that only performs one of the two examinations cannot pass both."
  - name: test_two_distinct_readers_are_asked_for_by_the_run
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "From the run's own recorded step outcomes, assert two separate reader requests were made by the run, not one request that internally covers both. Assert on the captured dispatch sequence via unit_tests/_workflow_engine_harness.py, never on meta.phases."
  - name: test_both_sets_of_findings_survive_to_the_run_result
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT: drive the real command surface over a change containing one planted problem of each kind and assert both appear in the run's final result. Because both readers return findings rather than writing a file, an implementation that asks for them and drops their output passes every dispatch-level test and delivers nothing."
test_rationale: "Design review and code review are different capabilities, and the cheapest implementation — one reader told to 'look for problems' — produces convincing output while systematically missing the cross-cutting smells, because those require reasoning over the whole change rather than over the function in front of it. The discriminating test is therefore the locally-clean, structurally-spread change; its mirror is run in the same suite so a single-examination implementation fails one of the pair whichever one it chose. The survival test exists because both readers RETURN their findings instead of writing them anywhere, which makes 'asked for and then discarded' a silent, plausible outcome that every dispatch-counting test would call a pass."
