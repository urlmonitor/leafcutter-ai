notes: |
  WHY AN L3. GE-129b-1 and GE-129b-2 are both satisfiable by "ignore everything inside quotes":
  every mention in b-1 is quoted, every commit in b-2 is not. That implementation makes
  `bash -c 'git commit'` a free pass. Only the second halves of (a)-(d) turn red under it. The
  opposite mutation -- "any quoted git commit is a commit" -- turns only the first halves red.
  The pairing is the discriminator.

  declares_side_effect: false -- the Then clauses assert run, refusal and absence of a commit.
