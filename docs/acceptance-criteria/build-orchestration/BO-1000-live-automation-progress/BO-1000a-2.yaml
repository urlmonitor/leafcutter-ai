it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "1"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - N must be derived from a single source of truth for the step sequence
      (one declared list/count), never hard-coded per line, so every
      start-of-step line in a run reports an identical N and N cannot drift from
      the number of steps the workflow actually declares.
    - X must advance monotonically with no duplicate or skipped position for the
      steps that execute (skips are still counted and reported — see BO-1000a-3);
      derive X from the same ordered sequence, not an independent counter.
    - Shares the narration helper introduced in BO-1000a-1.
    - No new config key. ADR-001 build.py round-trip parity.
