id: BO-2400a-3-ix
components:
  - build_orchestration
  - testing_quality
title: "A criterion whose new tests all pass before any change is recognised as a test backfill and sent to a mutation proof, not halted"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a batch containing only UXP-510, whose implementation already exists in the
    repository, and whose 4 covering tests are all newly-added in this run,
  And all 4 are classified green at baseline and none is inconclusive,
  When the red-baseline gate produces its verdict,
  Then UXP-510 is classified as a test backfill, with proof route mutation instead of
    red-first,
  And the run does not halt with all_new_tests_green_at_baseline,
  And the verdict names UXP-510, its 4 green newly-added tests, and the route mutation,
  And the run goes no further than the mutation proof of BO-2400a-3-x for UXP-510
    until that proof has passed.

  Given the same batch,
  When the gate decides whether UXP-510 is a backfill,
  Then it decides only from the observed outcomes of UXP-510's newly-added tests. It
    does not consult the criterion's work_status, its history of being demoted, or any
    field or flag saying it is a backfill, so a run cannot opt into the mutation route
    by labelling itself.

  Given a criterion whose newly-added covering tests are 3 green and 1 inconclusive
    (skipped or errored),
  When the red-baseline gate produces its verdict,
  Then the criterion is not classified as a test backfill,
  And the run halts with no_red_outcome_among_new_tests exactly as BO-2400a-3-i states,
    because a test that did not run cannot be proven by breaking the code it should
    exercise.
depends_on: [BO-2400a-3, BO-2400a-3-v, BO-2400a-3-vi]
