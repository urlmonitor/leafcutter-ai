id: GE-122d-5
title: "Which stage you can skip, and what still catches you, is written down"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a contributor who wants to know whether they can proceed past a numbering block, and what
    the consequence of doing so is,
  When they read the bypass section of the numbering reference document,
  Then for each of the three stages it states whether that stage can be bypassed and, when it
    can, exactly how,
  And for each bypassable stage it states which later stage will catch the same clash, so
    bypassing is described as deferring the block rather than removing it,
  And it identifies the shared build as the stage with no bypass,
  And it states what happens when the check cannot establish uniqueness rather than finding a
    clash, and that this disposition differs by stage,
  And it states the one condition under which a commit proceeds despite the check not reporting
    success — a defect in the guard after the collection was fully read — and that this is not a
    bypass the contributor invokes,
  And the section lives in the same numbering reference document as GE-122a-3 and GE-122b-4.
depends_on:
  - GE-122d
  - GE-122d-2
  - GE-122d-3
doc_links:
  - path: docs/how-to/managing-pre-commit-hooks.md
    relationship: related
    status: exists
    relevance: "Where the commit-time bypass mechanism is already described. The reference section should point here for the mechanism and confine itself to the consequence."
  - path: docs/reference/ac-schema.md
    relationship: context
    status: exists
    relevance: "Currently documents the unlimited fail-open convention for the acceptance-criterion hooks. The bypass section must not contradict it — GE-122d-3-i draws the boundary, and this document is where a reader finds it."
  - path: docs/reference/artifact-numbering.md
    relationship: modifies
    status: planned
    relevance: "The same document GE-122a-3 creates and GE-122b-4 extends. This AC adds the third and last section."
  - path: docs/architecture/adrs/ADR-029-adr-number-collision-prevention.md
    relationship: context
    status: exists
    relevance: "The other written fail-open statement, and an accepted decision rather than a convention. GE-122d-3 requires it to be amended; this section must describe the amended disposition, not the superseded one."
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "The section is written into `docs/reference/artifact-numbering.md`, the file GE-122a-3 creates and GE-122b-4 extends. Third section, same document — a separate bypass document is how a contributor hitting a block ends up in the wrong file."
  - "The authoring-time stage's bypass status must be stated accurately and it is not obvious: that stage is neither invoked nor skipped by the contributor, and it can fail SILENTLY — a PostToolUse hook that crashes, times out or cannot import its dependency emits nothing, which is indistinguishable from a clean write. 'Cannot be bypassed on purpose but can be absent without anyone noticing' is the true statement, and a reader who believes it always runs is worse informed than one who knows it might not."
  - "Do not assert that the shared build is unbypassable until GE-122d-2's required-check step has actually landed. Until then it is a failing report, not a block, and documenting the intent as the state is the same class of error as ADR-029's claim that an unregistered hook was wired."
  - "The cannot-establish section must describe the AMENDED disposition, not ADR-029's superseded fail-open one. Cross-reference the amending decision record so a reader who finds ADR-029 first is not misled by it."
  - "The non-bypass clause (a commit proceeding after a guard defect that occurred post-read) must be stated as a designed disposition with its reason, and explicitly not as an escape hatch a contributor can invoke. An undocumented case of that shape reads to a later contributor as either a bug or a hidden loophole, and both readings cause harm."
  - "Doc frontmatter, description and length are mechanically enforced; if the three-section document exceeds the doc-length gate, split by section into linked documents rather than trimming the dispositions — the per-stage differences are the content."
test_required: false
test_rationale: |
  change_target is docs and the deliverable is prose. Every disposition this section records is
  asserted from the code side by the ACs that implement it — GE-122d-2's required-check
  evidence, GE-122d-3's per-stage outcome tests and GE-122d-3-i's boundary test — so a test here
  would be a second, independently-maintained statement of the same facts, which is precisely
  the drift the one-document decision exists to prevent. The documentation-verifier phase checks
  that the recorded dispositions match the implemented ones.
delivers_to: null
expects_from:
  ac_id: GE-122d-3
  contract: "The per-stage block-or-announce disposition, so the document records the dispositions that were actually implemented."
