notes: |
  DECIDED 2026-09-17 (user, default accepted; recorded on GE-129a-4) -- CUSTOMISATION: a project may
  customise its commit specialist only with a recorded exemption. Without one, any divergence is a
  failure, matching the user's "flags a divergent definition". "With a stated reason" is part of the
  decision as relayed on 2026-09-17: an exemption with no reason fails.

  WHY (w). A check that tests only for an empty reason lets a blank one through; whitespace is the
  cheapest way to satisfy "a reason field exists".

  WHY (v). The exemption is for customising the definition, not for shadowing it. The mutation "an
  exemption silences every parity finding for the project" passes (x) and fails only (v).

  WHY THE LAST SCENARIO. A check that passes every divergent definition passes (x); removing the
  exemption and seeing the failure return is the only form that implementation cannot meet.

  WHY (x) STATES THE EXEMPTION. A pass that says nothing is indistinguishable from a check that did
  not compare (GE-120 "green means checked").

  Where and in what form the exemption is recorded is the IT PO's. The stated limit (GE-129e-4)
  still holds: anyone who can write the exemption can also write the definition.

  declares_side_effect: false -- the Then clauses assert a pass or a failure with named findings.
