it_requirements:
  - "The peek-pause-record / read-pause-record result parser must distinguish three outcomes, not two: (1) a genuine empty read -- the dispatched agent actually queried the store and found nothing, e.g. {\"exists\": false, \"stale\": false, \"record\": null}; (2) a refusal -- the dispatched agent declined the request, well-formed or not; (3) a failure -- no reply, a transport/exception error, or a reply that is not valid JSON or lacks the expected exists/record shape. Only (1) may be reported as 'no pause record exists'; both (2) and (3) must be reported as 'could not determine'."
  - "This fix must be applied at BOTH of the two existing peek/read call sites independently: peekPausedGateId()'s peek-pause-record dispatch (which currently collapses any of the three failure shapes to a bare `return null`) and resolveGate()'s read-pause-record dispatch inside its resume-answer branch (which currently collapses the same failure shapes to `{status: \"nothing_to_resume\"}`). These are two separate, independently-maintained code locations with two different downstream consequences -- a peek-pause-record false negative causes the pipeline loop to needlessly re-dispatch an already-answered step's authoring agent (~L3131-3136), while a read-pause-record false negative causes a genuinely-supplied resume answer to be discarded as though there were nothing to resume. A fix, or a test suite, that only exercises one of the two call sites cannot detect a defect left in the other."
  - "The dispatch itself, not only its reply parse, must be brought inside the three-way classification: in the current code, `await agent(...)` for both peek-pause-record and read-pause-record sits OUTSIDE the existing try/catch -- only the subsequent parseAgentJson(...) call is wrapped. A transport/execution error thrown by the dispatch itself therefore currently propagates uncaught rather than resolving to any outcome at all; the fix must wrap the dispatch call itself (or equivalent), not just its reply's JSON parse, or this AC's own failure branch is unreachable in normal execution."
  - "If a shared classification helper is factored out for use by more than one of peekPausedGateId()/resolveGate()/pauseAtGate(), it must be added to (or deliberately kept out of, if self-contained per call site) unit_tests/workflows/test_acd_2100c_1.py's `_assemble_gate_machinery_source()` extraction list consistently with where it is called from -- that test builds a standalone Node driver from an explicit, named list of top-level functions/consts extracted from plan-feature.js, and a new top-level helper referenced by resolveGate()/pauseAtGate() but absent from that list throws ReferenceError under that test, independent of whether the helper's own logic is correct."
  - "The refusal-vs-failure distinction should be consistent with the existing refusal-detection convention already used elsewhere in this same file (isAgentRefusal() / AGENT_REFUSAL_MARKERS, used at the wtParsed===null branch ~L2519-2530) rather than introducing a second, differently-worded refusal detector for this new code path."
  - "The 'could not determine' outcome must be surfaced to whatever consumes the peek/read result (the caller deciding whether to proceed, pause, or resume) as a distinguishable value from both the empty-read outcome and a genuine paused_awaiting_input record -- never silently coerced to one of those two on the way out."
  - "This is a parsing/interpretation fix, not a routing fix: it must hold even after BO-2300e-2 correctly routes the dispatch to command-step-runner, because a chartered agent can still refuse (no workspace named), time out, or return a malformed reply."
  - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js), configuring the peek/read dispatch's stubbed reply to each of the three shapes above in turn, and assert the workflow's resulting classification for each -- exercised independently against BOTH the peek-pause-record and read-pause-record labels (label_responses is keyed by label, so each can be stubbed independently). Do not grep the source for a status string."
  - "FILE-SIZE RATCHET (KI-CG-20260923): unlike BO-2300e-2's reassignment-only diff, this fix is likely NOT achievable at net-zero content lines -- it adds a three-way classification at two independently-maintained call sites plus the additional try/catch wrapping each dispatch call itself. plan-feature.js is a workflow body the ratchet can never relieve by extraction and is already far over the per-file content-line limit (~3,400 non-blank lines against a ~400-line cap), so it refuses ANY net growth, comments included. Prefer factoring the three-way classification into ONE shared helper called from both call sites (see the shared-helper it_requirement above) -- writing the logic once instead of twice is very likely to net fewer lines than today's two independent inline collapses, even after adding the helper's own definition. If a shared helper still nets positive, or is infeasible, this is a blocker to raise back to the IT PO / user before implementation, not something to route around with an unexplained `SKIP=check-file-size` -- the one precedent on record (ACS-1600a-1) required the full reasoning recorded in the commit message."
  - "REACHABILITY (BO-2900a-3): proven via run_workflow_under_e2(plan-feature.js) with the peek/read dispatch's stubbed reply set to each of the three shapes in the TEST STRATEGY above -- the real engine must actually execute the classification branch on a real run of plan-feature.js. A test that unit-tests an extracted classifier function against synthetic inputs without ever invoking it from a running plan-feature.js gate does not satisfy this AC; per BO-2900a-3, a passing test over code no real invocation path reaches does not make the criterion eligible to be marked done."
test_spec:
  - name: test_refusal_reply_reported_as_could_not_determine
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Via run_workflow_under_e2, stubbing the peek-pause-record label's reply as a well-formed refusal, the workflow classifies the outcome as 'could not determine', not as 'no pause record'."
  - name: test_read_pause_record_refusal_also_reported_as_could_not_determine
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Via run_workflow_under_e2, stubbing the read-pause-record label's reply (resolveGate's resume-check dispatch) as a well-formed refusal, the resume path classifies the outcome as 'could not determine' and does not report 'nothing_to_resume' as though the record were genuinely absent -- independent proof the fix was not applied to peek-pause-record only."
  - name: test_could_not_determine_does_not_advance_past_gate
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Via the harness, when either the peek-pause-record or the read-pause-record outcome is 'could not determine', the workflow does not proceed past the gate as though no pause exists, and does not resume, clear, or re-persist the run's record."
  - name: test_genuine_empty_read_still_reports_no_record
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Via the harness, a genuine empty read ({exists: false, stale: false, record: null} from an actual store query) on EITHER the peek-pause-record or read-pause-record label is still correctly classified as 'no pause record exists', confirming the fix does not turn the legitimate empty case into a false positive for 'could not determine' at either call site."
test_rationale: >-
  The defect's own diagnosis is that a refusal on this path parses identically
  to the legitimate empty case, which is why it stayed invisible for three
  days while the write-side twin of the same defect failed loudly. A test that
  only checks the write path (persist) would leave this half unverified; the
  boundary test against a genuine empty read is included so the fix cannot
  overcorrect into treating every read as undetermined. peekPausedGateId()'s
  peek-pause-record dispatch and resolveGate()'s read-pause-record dispatch
  are two independently-maintained call sites with two different downstream
  consequences (needless step re-authoring vs. a discarded resume answer), so
  at least one test targets each label independently rather than assuming a
  single shared fix covers both.
delivers_to: null
expects_from:
  ac_id: BO-2300e-2
  contract: "The command-step-runner dispatch and its reply (exit status/stdout/stderr) for peek-pause-record and read-pause-record; this AC governs how that reply is classified once received, including when the dispatch itself fails or is declined."
