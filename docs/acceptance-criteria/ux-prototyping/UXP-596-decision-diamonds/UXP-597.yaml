id: UXP-597
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "A conditional fork renders as a decision diamond showing its condition, distinct from a step card"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: in_progress
criteria: |
  Given a rendered flow whose steps carry one or more conditional branches,
  When the Atlas /flows graph for that flow is drawn,
  Then each conditional fork is drawn as a diamond-shaped decision node rather than a rounded step card,
  And the diamond displays the fork's condition/question text,
  And the diamond is visually distinguishable at a glance from an ordinary step card.
depends_on:
  - UXP-596
doc_links:
  - path: docs/architecture/adrs/ADR-025-first-class-flow-decisions.md
    relationship: specified-by
    status: exists
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "buildFlowGraph in leafcutter-web/lib/data/graph.ts must emit each conditional fork as a node with meta.variant === 'decision' carrying the fork's condition text; ExplorerInner in leafcutter-web/components/flows/flow-explorer.tsx must map meta.variant === 'decision' to the 'flowDecisionNode' React Flow node type."
  - "The diamond is rendered by FlowDecisionNode in leafcutter-web/components/flows/flow-nodes.tsx (registered in flowNodeTypes as flowDecisionNode) as a rotated-square diamond, visually distinct from the rounded FlowStepNode card."
  - "The fork's condition/question text must be shown inside the diamond shape."
  - "Diamond synthesis must not require any new field in the stored flow JSON (derived from existing branch data — see UXP-600)."
  - "Rendering must stay within the existing React Flow render budget for typical flows (< ~50 nodes); no per-node network or blocking work."
delivers_to: null
expects_from:
  UXP-600: "decision nodes are synthesized from existing branch data (from/condition/label/target) by buildFlowGraph in lib/data/graph.ts"
