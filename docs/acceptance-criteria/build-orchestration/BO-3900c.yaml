  contract: "BO-3900's per-script classification, whose 'unrecognised' outcome (drive-relative, rooted-without-drive, empty or blank, or second root after the first segment) carries the input value verbatim and is never resolved onto a root."
test_required: true
test_spec:
  - name: test_unrecognised_path_forms_block_only_their_ticket_and_quote_the_value
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Each of the four unrecognised forms blocks only its own ticket, with a reason quoting the value verbatim, while the two well-formed siblings are dispatched."
  - name: test_already_joined_double_root_path_is_not_rejoined_or_trimmed
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The incident's corrupted value, if it arrives as input, is refused rather than joined a second time or cut down to its trailing absolute part."
  - name: test_unrecognised_form_and_missing_file_are_reported_distinguishably
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A form refusal and a not-found refusal carry different stated reasons."
  - name: test_path_form_refusal_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "The refusal is observed in a run of build-feature.js's own body through _workflow_engine_harness.py."
test_rationale: |
  The incident's root shape was a fallback: whatever was not recognised got joined. A fix
  that recognises Windows absolute paths but keeps that fallback still joins the next
  unforeseen spelling. So the fallback itself needs a test that feeds it spellings no
  recognition rule covers. Refusing per ticket, not per run, is asserted with well-formed
  siblings in the same batch. Otherwise halting the whole run would pass as refusing the
  bad ticket.
