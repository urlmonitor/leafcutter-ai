criteria: |
  Damage outside the new part blocks delivery as surely as a failing new check.

  Finding that the project no longer works has the same consequence as finding
  that the new work does not: the run stops and hands you the reason. A broken
  project is never reported and then delivered anyway, and the work is never left
  stranded — it goes back to being pickable, ready to be attempted again.
