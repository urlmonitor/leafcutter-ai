assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - 'This L2 is a roll-up: its production changes are made by its five children (BO-2500a-8-i
    to -v). Its own outcome is the last clause, agreement between the authoring check and
    the done gate, which holds only if both call the one shared reason-present predicate in
    scripts/ac_store/_done_proof_phase_helpers.py, never a second copy.'
  - 'Build order: BO-2500a-8-i first (it defines the refusal and creates templates/scripts/commit_guardian/_ac_test_rationale_validators.py);
    then -v in the same file, so -i and -v run one after the other in one lane; -ii and -iii
    in parallel after -i; -iv last (each backfilled record must pass -i''s and -v''s checks
    when it is committed).'
  - ADR-076 section 1.2 (templated reasons MUST be rejected) is now enforced mechanically
    for identical text only (BO-2500a-8-v). Near-duplicates and change_target-filled templates
    that differ in a word are policed by the planner's instructions (-ii) and by the user's
    batch approval (-iv).
test_required: true
test_intent:
  - clause: the declaration carries a reason written for that record from the moment it is
      authored, and a declaration without one is refused by the commit-time record check when
      the record is added or changed (BO-2500a-8-i)
    needs_test: false
    reason: Proven by BO-2500a-8-i's own tests of the commit-time refusal; this roll-up adds
      no behaviour here.
  - clause: the technical planner's instructions produce the declaration and its reason together
      (BO-2500a-8-ii)
    needs_test: false
    reason: Proven by BO-2500a-8-ii's with-and-without prompt comparison.
  - clause: a reference page for test-free declarations explains the declaration and states
      the reason field's two meanings apart, linking to the single exemption rulebook, and
      the guides a person reads point to that page (BO-2500a-8-iii)
    needs_test: false
    reason: A documentation outcome, verified as BO-2500a-8-iii's rationale states.
  - clause: every unfinished record already declared test-free without a reason gets a reason
      written for it and approved by the user, or is listed for the user's decision (BO-2500a-8-iv)
    needs_test: false
    reason: A one-time data backfill, verified by the user's batch approvals as BO-2500a-8-iv's
      rationale states.
  - clause: a reason identical, after normalising, to another record's reason is refused,
      so one reason cannot be copied across records (BO-2500a-8-v)
    needs_test: false
    reason: Proven by BO-2500a-8-v's own tests of the duplicate-reason refusal.
  - clause: for any record, the authoring side and the done gate (BO-2500a-1-ii) agree on
      whether its declaration is complete, so a record the authoring side accepts is never
      refused at done because its reason is missing
    needs_test: true
    reason: 'Agreement across the two layers is this parent''s own outcome: one boundary set
      of records run through check-ac-schema and through check_done_proof.py must get matching
      answers, which no single child''s test observes.'
test_spec:
  - name: test_authoring_check_and_done_gate_agree_on_every_reason_boundary
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: boundary
    surface_invoked: "real check_ac_schema.py and check_done_proof.py --mode precommit, each as a subprocess, compared record by record"
    description: "In unit_tests/commit_guardian/test_bo_2500a_8_authoring_done_agreement.py, a store-shaped temp tree holds one test_required-false record per boundary reason: absent, null, empty string, spaces only, tab and newline only, a non-breaking space only, a zero-width space only, a non-string (a number, a list), and a real sentence. Each record is run through the real check-ac-schema hook (check_ac_schema.py as a subprocess, record staged through HOOK_TEST_STAGED_FILES) and through the real check-done-proof hook (check_done_proof.py --mode precommit as a subprocess, record staged with work_status done and no covers tag anywhere). The test asserts, per reason, that the two exit codes are both 0 or both non-zero, and that the answer matches the reason-present rule (non-empty str after strip: the non-breaking space is absent, the zero-width space is present). A re-typed copy of the rule in either layer disagrees on at least one value. Expected red today: the authoring check accepts every reasonless record the done gate refuses."
    proves_clause: "for any record, the authoring side and the done gate (BO-2500a-1-ii) agree on whether its declaration is complete, so a record the authoring side accepts is never refused at done because its reason is missing"
    code_file: scripts/ac_store/_done_proof_phase_helpers.py
  - name: test_a_record_the_authoring_hook_accepts_is_never_refused_at_done_for_a_missing_reason
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "check_ac_schema.py as the pre-commit hook runs it (git-staged path), then check_done_proof.py --mode precommit, both as subprocesses"
    description: "In a fresh git init temp repo the record is written with yaml.safe_dump and staged with git add; check_ac_schema.py is run the way the pre-commit hook runs it (cwd in the repo, no HOOK_TEST_STAGED_FILES). For a test-free record with no reason the hook must refuse, so no such record reaches done. For the same record with a real reason, it accepts and the real check_done_proof.py --mode precommit run in that repo also exits 0. Asserts the property: authoring exit 0 implies done-gate exit 0, for both records."
    proves_clause: "for any record, the authoring side and the done gate (BO-2500a-1-ii) agree on whether its declaration is complete, so a record the authoring side accepts is never refused at done because its reason is missing"
    code_file: scripts/ac_store/_done_proof_phase_helpers.py
