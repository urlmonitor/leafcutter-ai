notes: |
  CONCEPT B. The ticket is a grouping/scoping container. SUPERSESSION INTENT
  (recorded, not applied here): replaces the premise of ACD-400b (generator produces
  a fully WIRED ticket with a per-ticket agents map + sign-offs). Complements
