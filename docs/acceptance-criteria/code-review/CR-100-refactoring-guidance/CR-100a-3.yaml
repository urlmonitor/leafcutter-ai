    relationship: describes
    status: exists
  - path: templates/skills/review-for-code-smells/
    relationship: implements
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The catalogue-location check must parse the deployed review-for-code-smells SKILL.md and assert the twelve Modern smell names are NOT enumerated there as a catalogue (they must live only in the two bucket skills) — a behavioral parse, not a mere heading grep."
  - "The same parse must confirm the core skill defines a severity rubric and a finding format that mandates a named-smell title plus a what's-wrong explanation."
test_required: true
test_spec:
  - name: test_core_skill_defines_method_not_catalogue
    target_dir: unit_tests/
    framework: pytest
    type: unit
    description: "In unit_tests/test_code_smell_review_wiring.py, parse the review-for-code-smells SKILL.md and assert none of the twelve Modern smell names are enumerated as a catalogue there, while a severity rubric and finding format are defined."
    covers:
      - CR-100a-3
  - name: test_finding_format_requires_named_smell_title
    target_dir: unit_tests/
    framework: pytest
    type: unit
    description: "Assert the finding format defined in the core SKILL.md requires a named-Fowler-smell title plus a what's-wrong explanation, so a generic-warning title does not satisfy the format."
    covers:
      - CR-100a-3
