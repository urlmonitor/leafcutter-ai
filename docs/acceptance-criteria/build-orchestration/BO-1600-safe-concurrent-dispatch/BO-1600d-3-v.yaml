it_requirements:
  - "Detect when an in-place cache-tree rebuild does not clear a linked worktree's poisoned cache-tree; in that case escalate to the fresh-worktree fallback rather than looping the in-place rebuild."
  - "The fresh-worktree creation must appear as its own line in the dry-run plan (heavier, distinct action) so the human explicitly sees and confirms it; it is never applied silently."
  - "Verify the fresh worktree reads cleanly (no cache-tree error) as the success condition."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
