it_requirements:
  - "The docs-only branch returns the normalised out_of_scope set rather than an empty set. It must not return files_touched, which for a docs-only ticket contains no source paths and would change nothing."
  - "BP-1100e-1-iii is preserved unchanged in effect: a docs-only ticket whose diff contains no source file is flagged in neither the old behaviour nor the new, because the reconciliation only ever flags on changed source files."
  - "An empty or absent out_of_scope on a docs-only ticket still yields an empty declared scope, so the guard's original purpose — a docs ticket cannot silently absorb source changes it never mentioned — is unchanged."
