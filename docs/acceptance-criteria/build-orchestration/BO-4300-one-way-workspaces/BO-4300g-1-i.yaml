file_findings:
  - file: templates/agents/worktree-agent.md
    verdict: consistent
    line_range: null
    found_in: null
    reason: Its remove section holds the default policy that deletes the remote branch with the workspace (lines 132-138), which is the behaviour the workspace-only and exact-match criteria change, though a workspace's own local branch lives inside its folder (the maker removes the folder and deletes the remote only with --delete-remote-branch), so "still exists locally" is observable only through a same-named branch in the host clone that the fixture must create.
    decision:
      choice: assignment stands
      reason: The user resolved "locally" as the main project clone's same-named branch (decision E), so the charter change stays with llm-expert and the host-clone branch is a fixture concern of the shared proof harness.
      by: it-po
file_findings_opened_files:
