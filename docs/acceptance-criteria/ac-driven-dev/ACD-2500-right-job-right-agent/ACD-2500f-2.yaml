criteria: |
  Given the prompt-engineering agent's guidance for inferring an agent's produces value maps
    "role: planning" to "analysis",
  When an agent author follows that guidance for business-analyst (a planning agent that
    writes requirement records) and for architect-review (a planning agent that writes none),
  Then for business-analyst the guidance leads to "requirement_records", not "analysis",
  And for architect-review it leads to the same value it leads to today,
  And the guidance names writing requirement records as the signal for "requirement_records",
    ranked above the role signal, so a planning role alone never decides it,
  And no other agent template or skill in the package maps a requirement-writing role to
    "analysis".
