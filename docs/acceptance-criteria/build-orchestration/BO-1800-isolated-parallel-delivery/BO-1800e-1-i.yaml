it_requirements:
  - "A local pre-commit/pre-push main-guard MUST prevent or flag a git commit onto main with a message that work must go on a feature branch, implemented as a commit_guardian hook (ADR-018 Decision §4 local, advisory)."
  - "The guard MUST be framed explicitly as advisory defense-in-depth only (bypassable via --no-verify); it is NOT the guarantee — the server-side gate in BO-1800b is — so a bypass still cannot land on the hub's main."
  - "The hook MUST live on the portable commit_guardian surface (templates/ hook script + commit_guardian.json registration) deployed by build.py — never repo-root CLAUDE.md."
