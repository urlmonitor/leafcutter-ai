estimated_complexity: M
it_requirements:
  - "The leaf-collection traversal (traverse_ac_tree / its _dfs_collect_leaves helper in scan_ac_store.py) must, by default, omit any L2/L3 leaf whose work_status is 'done' and any leaf whose status is one of the superseded forms ('superseded_by' or 'superseded') from the emitted leaf list. The exclusion happens at emission time only — a node may still be skipped from emission while its covered_by children continue to be traversed."
  - "A superseded leaf that was split must NOT short-circuit recursion: the traversal must still descend into its covered_by replacement children so they are collected when they are themselves emittable (active + todo). The critical case is a superseded BO-100d-1 being skipped while its children BO-100d-1a / BO-100d-1b are still collected."
  - "Exclusion must be parameterizable via two keyword flags (suggested names exclude_done and exclude_superseded) defaulting to True, so the function remains unit-testable with each exclusion independently disabled. With both flags False, the function must reproduce the prior unfiltered leaf set exactly."
  - "Audit every caller of traverse_ac_tree for reliance on the old unfiltered behavior before changing the default. goal_to_epic.py imports traverse_ac_tree for goal-mode leaf collection (the intended beneficiary of the new default). scan_ac_store.py main() filters work_status / status / readiness separately downstream, so its own pipeline must not be double-filtered or broken — verify it either passes flags explicitly or is unaffected by the new default."
  - "Recurse-but-skip-emit and the seen-set de-duplication must remain compatible: a replacement child reachable only through a skipped superseded parent must still be reached exactly once. Wrap any added YAML/file I/O per the project error handling policy."
delivers_to:
  agent: python-coder
  contract: "list[str] — leaf AC ids beneath the goal with done and superseded leaves omitted by default, but with replacement children of superseded leaves still included; consumed by goal-mode ticket generation (ACD-1200a-2)"
