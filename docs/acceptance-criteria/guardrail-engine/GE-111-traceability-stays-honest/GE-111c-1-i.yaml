notes: |
  The user-facing promise of GE-111c: "you are asked to fix exactly what this
  commit broke and nothing more." A pre-existing broken link whose source is NOT
  in the commit is out of scope for the pre-commit gate — it should be surfaced by
  a separate store-wide scan, NOT this commit-time check.

  IT-PO enrichment (2026-06-22): confirmed the exclusion is structural (scope set
