notes: |
  One of the two failure modes the parent L1 names explicitly as what makes this hard rather
  than routine: "the retry must terminate — a specialist that parks identically every time
  must end as a visible failure, not an endless loop."

  A build that loops forever is worse than the defect it replaced. The 2026-08-18 stall at
  least ended; an unbounded retry consumes the drive and produces no report at all, which is
  the same invisibility arriving by a different route.

  THE FAILURE MUST NAME THE STEP AND THE ATTEMPT COUNT. Without those, a chronic parker is
  reported as a generic build failure and the diagnosis starts from nothing — the same cost
  KI-BO-018 records, where a misdirected message sent the reader to fix something that was
  already correct.

  The third scenario stops the bound from being implemented as "one attempt only", which
  would defeat the retry BO-3100b-2 requires.

  Deliberately left to the IT PO: the value of the bound and whether it is fixed or
  configurable. The criterion requires only that a bound exists, is finite, and is reported.

  IT-PO DECISION (2026-08-26). Bound = 3 attempts total (initial + 2 retries), configurable
  through one declared key with that default, validated at load so it cannot be set to zero or
  to unbounded. Configurable rather than fixed because a consumer project with a slower or
  flakier environment has a legitimate reason to raise it; validated at load because the whole
  point of the bound is that it cannot be removed, and an unvalidated config key is exactly how
  it would be.
