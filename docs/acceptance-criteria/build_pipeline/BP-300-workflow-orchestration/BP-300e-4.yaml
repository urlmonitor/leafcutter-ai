notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with a
  prose-only input string, asserting it raises a typed error (not a generic crash and
  not a silent None/skip) whose message carries the failing stage/agent identity passed
  in by the caller. Also coverable by a workflow-level integration test that dispatches a
  stubbed agent returning prose-only output and asserts the run halts with the named
  error rather than proceeding. This AC is the "never blind" guarantee — the deliberate
  boundary between tolerated cosmetic wording (BP-300e-1..3) and a genuinely unusable
  reply.


  ADJUDICATION 2026-08-17 — halt-by-default vs the step-0 baseline exception.
  This AC now carries the declared-exception mechanism, so the argument is recorded here
  in full. Do not re-open it without reading this section.


  THE TWO POSITIONS.
  Side A is this AC (and its L3 child BP-300e-4-i): a reply with no recoverable structured
  result must stop the run with a typed error naming the stage and agent, "neither silently
  skipped nor swallowed", never "the run appearing to succeed with missing output".
  Side B is the finalize step-0 baseline site. Its in-source rationale reads: "Malformed
  reply is not the same as 'baseline failed' — degrade gracefully (same as run_failed path)
  without spuriously halting." The "AC-4" that comment cites is a TICKET-BODY-LOCAL label,
  not a store id: it is AC-4 of tickets/99_done/EPIC-FinalizeFeatureHardening-2/
  09_finalize_p2_hygiene.md ("Step result parsing uses a defined structured contract (or a
  tolerant parse that distinguishes 'agent said halt' from 'reply was malformed'), so a
  malformed-but-benign reply does not spuriously halt finalize"), delivered in commit
  e76e7fcbd. That ticket predates AC-store-first authoring and carries no ac_coverage
  mapping. The STORE AC that carries the same requirement at that same site is FIN-100a-2
  "Baseline capture degrades gracefully on failure" (readiness reviewed, work_status done),
  whose it_requirements state: "Parse-failure of the agent response must also degrade
  gracefully (status: parse_failed)".


  THE DECISION — option (c), a hardened form of (a).
  Side A holds by default. The exception survives, but ONLY through a single declared
  degradation register, and only for substitutes that point the run toward more checking.
  Three clauses make the register non-abusable: (1) a reading point not in the register
  halts; (2) a registered degradation must be reported in the run's own account of what
  happened, so it cannot pass as success; (3) a reading point whose reply IS the stage's
  product is refused the exception outright, however it is declared.


  GROUNDS.
  Side B's rationale is genuinely sound AT THAT ONE SITE and nowhere else by default. The
  baseline is an advisory input to a conservative default: a null/parse_failed baseline
  makes triage treat every post-merge failure as a regression (FIN-100c-3), which is the
  SAFER direction. Halting there instead would strictly reduce finalize's availability while
  buying no safety, and would regress FIN-100a-2 — an approved, done, tested behaviour. That
  is why option (b) was rejected.

  Plain option (a) was rejected as too weak. The defect the audit found is not that an
  exception exists; it is that the exception is implicit and unbounded. Expressed as a bare
  `catch { <safe default> }` it is indistinguishable at a glance from an accidental swallow,
  and it has metastasised to roughly 50 sites — 26 in plan-feature.js and 24 in
  finalize-feature.js. Behaviourally confirmed via the E2 harness: injecting a prose-only
  pre-flight reply into finalize-feature.js produced dispatch_count=6 and no error, the run
  sailing on with the worktree root defaulted. Merely requiring the set be enumerable would
  let someone enumerate all fifty and declare compliance.

  Clause (3) is the load-bearing one. It kills the worst instance, plan-feature.js:2231-2235,
  where the catch sets stepResultObj = {} so acs_written becomes [] and the AC-authoring
  stage reports success having written nothing. That is verbatim the outcome this AC's own
  second clause forbids — "the run appearing to succeed with missing output" — so no
  declaration can ever admit it. The direction test is the discriminator between the two
  sites: the baseline substitute causes MORE checking, the authoring substitute manufactures
  an unearned success.


  WHAT THIS OBLIGES.
  The step-0 baseline site keeps its behaviour but must become a register entry rather than
  a bare catch. Every other swallowing site either becomes a register entry that passes the
  direction test, or halts. The register's completeness and its ratchet against new
  undeclared swallows is specified separately in BP-300e-4-ii, because that is a whole-run
  inventory property this AC's per-reply Given/When/Then cannot carry.


  PROOF CONSTRAINT. Every clause above is stated so it is provable by EXECUTING the workflow
  under the E2 harness (run_workflow_under_e2) with an injected prose-only reply, and
  asserting on the run's halt/continue behaviour, its substitute value and its reported
  outcomes. Nothing here is satisfiable by reading the .js text — a grep-only proof over
  workflow source is the defect class BP-1100b-5 exists to reject, and a `catch` block is
  precisely the construct whose presence proves nothing about which branch runs.
