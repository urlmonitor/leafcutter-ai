notes: |
  Flow node split-detect, the accepted-as-one case (user decision 2026-10-05, DK-400 Q1).
  The real case is the run of 2026-10-01 (run-5d246775f5e54f11), where the person had to add a
  composite option because five decisions were squeezed into one choice.
  Left to the IT PO: where this is caught, at routing or at the start of the decision
  capability on the root work item. Both must reach the same split gate (DK-400d). The check now
  runs on every routed request, so its cost and false-positive rate matter. DK-400a-3 and
  DK-400a-3-i pin the false-positive side.
  IT PO (2026-10-05): settled where bundled_accepted is caught (BA open point 2): at routing, in the
  route pass that selected the capability on the root work item, never inside the decision
  capability; the routing result is kept on the split record for a kept-whole rejection.
