criteria: |
  Tests run green and identically on a fresh checkout, with no leftover local
  files needed.

  Anyone who takes a clean, untouched copy of the project can run the full test
  suite and see it pass — the result does not depend on artifacts left behind by
  earlier local work, and it comes out the same way every time. How the
  fresh-copy gap is closed is an implementation decision deferred to an ADR and
  is intentionally not specified here.
