criteria: |
  Given a run containing two steps that did not complete,
    And the first was decided in advance not to be run, for a blocker declared
      before it would have started, so it never ran,
    And the second ran, attempted its work, and could not finish because of a
      confirmation it could not obtain,
  When the run records their outcomes,
  Then the first is recorded as skipped, carrying its declared reason,
    And the second is recorded as stopped short, carrying what stopped it,
    And neither is recorded using the other's word,
    And a reader of the record can tell, for each, which of the two happened.

  Given a step that ran and stopped short,
  When the run records its outcome,
  Then it is not recorded as skipped,
  So a step that failed to happen is never filed as a step nobody expected, which is
    the substitution that makes a run's report come out clean.

  Given a step that was decided in advance not to be run,
  When the run records its outcome,
  Then it is not recorded as stopped short,
  So the distinction holds in both directions and the word "skipped" keeps the
    meaning it already has.

  Given the vocabulary the run uses for step outcomes,
  When the words "skipped" and "stopped short" are each traced through the run's
    records,
  Then each carries exactly one meaning throughout,
    And no third sense of either word is introduced,
  So the words stay usable as evidence rather than needing interpretation per
    record.
