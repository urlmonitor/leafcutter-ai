it_requirements:
  - "Both composite rollup paths must use the shared retired predicate from ACS-900d-4 and must reach the same verdict on the same tree. These are the pre-commit path, _done_proof_composite._unproven_composite_children (it currently calls is_superseded_ac), and the CI path, done_proof._resolve_all_child_ids (it currently calls is_superseded_ac on a _build_ac_status_map entry)."
  - "A retired child adds nothing to the verdict in either direction. Its work_status is never read, so a todo retired child does not block the parent. Its covers tag and done status are never counted as proof, so a done retired child does not prove the parent."
  - "When every AC-id child of a live composite is retired (zero live children), the composite falls back to the leaf rule. It needs its own '# covers: <parent-id>' tag or a valid covers-tag waiver (is_covers_tag_waived: test_required false plus a non-empty test_rationale) (user decision 2). It is never proven vacuously. The current code returns the parent id as unproven unconditionally when live_children == 0. That must change to the leaf rule, so a parent WITH its own covering test passes and one without it is refused for the missing covers tag."
  - "A child whose supersession is structurally invalid (missing successor, empty list, self-reference, per -ii and -iii) is NOT retired and counts as a live child. This keeps the KI-ACS-016 exemption from becoming a phantom-done route."
  - "The refusal for an unproven composite must name each unfinished LIVE child by id and must never name a retired child. The reason strings already used by check_done_proof for unproven composites stay unchanged."
  - "The cycle guard (_seen) and the fail-closed behaviour for unresolvable children (ac_root None, or child file missing, reported as unproven) must be kept."
delivers_to: null
