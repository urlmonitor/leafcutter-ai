notes: |
  Source: KI-ACS-20261015-superseded-records-held-to-forward-rules. Today the
  done-proof gate and the approved-code test-contract rule ignore status
  superseded_by, so a done record whose behaviour was deliberately removed can
  only be "retired" by gaming readiness/change_target or by leaving a false
  done in the store. This L2 is the core exemption; its L3s pin the todo-shape
  variant (-i), the structural rules that still apply (-ii), self-supersession
  (-iii), the parent-composite interaction (-iv), and the first real use (-v).

  Placement: parented under ACS-900d ("honestly reconciled retirements pass
  cleanly") because this is the same promise from the gate side — an honest
  retirement must commit without friction. ACS-900 owns the lifecycle of a
  RETIRED AC (PROJECT_CONTEXT governance map); ACS-200 (coverage of LIVE ACs)
  is the rule being exempted from, not the owner.

  The last And clause is the discrimination contrast: an implementation that
  simply turns off done-proof for everything passes the first Then but fails
  the last one.

  Scope decision for the user: the request names status superseded_by. The
  schema calls "superseded" a functionally equivalent older form, so the BA
  included it in the predicate. "deprecated" (no successor) is NOT covered here
  — whether a deprecated record is also exempt was not asked and is left open.

  IT-PO enrichment (2026-10-15): the user settled the scope. Only status
  superseded_by or superseded counts as retired; deprecated does not. Call
  sites were found by grep and named in it_requirements: check_done_proof.py
  (three entry points), done_proof.py verify_done_eligible and
  _verify_composite_eligible, the composite rollup in
  _done_proof_composite._unproven_composite_children and
  done_proof._resolve_all_child_ids, and
  _ac_schema_validators.validate_test_contract (owned by -i). A shared
  predicate ALREADY exists, is_superseded_ac (KI-ACS-016), but it is weaker:
  any non-empty superseded_by, or req_status superseded, counts, with no
  successor-existence or self check. This AC replaces it, which deliberately
  changes the KI-ACS-016 contract. About 24 records in the store carry
  req_status superseded, so a census is required before merge.
  Complexity was raised from M to L because the wiring spans 4+ files plus the
  deploy map.
  Builder-side filters were left alone because they are not gates:
  scan_ac_store.traverse_ac_tree (exclude_superseded) and
  _xref_ac_store._RETIRED_AC_STATUSES (which also includes deprecated).

  Final gate (2026-10-15, BrainCandy): approved, priority high. KI-ACS-016
  decision: run the census, then fix the affected records honestly by giving
  them a superseded status and an existing successor. The stricter predicate
  stays the only rule. No legacy req_status path is kept.
change_target: code
risk_surface: contract_boundary
