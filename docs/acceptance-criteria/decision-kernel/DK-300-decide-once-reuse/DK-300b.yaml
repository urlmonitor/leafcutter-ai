notes: |
  DERIVED FROM leafcutter/decision-forming (6 of its 15 scenarios):
    steps    approve-proposals, choose, resolve
    branches revise-proposals, rerank, no-answer
  Also half of the journey step decision-lifecycle/form (shared with DK-300a).

  STANDING RULES TO CARRY INTO L2. A free-text answer is kept as the person's
  input and noted as a limitation, never turned into criteria. The ranking is
  shown as evidence and the decision waits for the choice. A resolved decision
  carries a human approver and an approval time. With no answer or a cancel, the
  decision never resolves and nothing is staged (this is the boundary with
  DK-300c, whose own not-stageable branch covers a decision with no human
  approval).

  Docs: a how-to for answering the approval and ranked-choice questions, and a
  state diagram for the decision moving from proposed to approved, ranked and
  resolved, with the re-rank loop and the no-answer exit.

