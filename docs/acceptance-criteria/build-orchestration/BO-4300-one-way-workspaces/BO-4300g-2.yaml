notes: |
  ORIGIN: user request via /plan-feature, 2026-10-23. At the user's reference point, plan-feature
  still sends these steps to the workspace agent: its pause-store read (line 1570), its gate-answer
  and pause-persist shell steps (lines 1645 and 1749), and its stage-end script steps (line 2198,
  tracked by TICKET-20261021-PlanFeatureScriptStepsToShellRunner). Line numbers are hints; verify
  them against HEAD.

  OVERLAP CHECK: BO-4300c-3 already requires the WORKSPACE step to go through one single-command
  agent. This record covers the non-workspace steps, which BO-4300c-3 does not reach. The
  stage-end script ticket should be generated from, or reconciled with, this record so the same
  behaviour does not have two owners.

  Proof runs the deployed workflows under the workflow engine harness and asserts on the
  recorded dispatch list and the registered abilities of each dispatched agent type. It never
  greps the workflow source (user request; CLAUDE.md "Gate / Workflow ACs -- Verify Behaviorally,
  Not by Grep").

  USER DECISIONS 2026-10-25 (recorded by IT PO): C -- TICKET-20261021-PlanFeatureScriptStepsToShellRunner
  is superseded by the ticket generated from this record. F -- finalize's new step-7 locate is a
  single maker command through shell-runner, so it is one more non-removal dispatch this record's
  finalize scenario counts.

  must_catch ON THIS RECORD'S test_spec: kept. This record is the fix for KI-BO-20260921 defect 2
  and a routing guard (no removal-capable dispatch outside finalize step 7), which is the bug-fix /
  gate-or-guard case the test-designer rule allows must_catch for. Even read narrowly, the entries
  stay as test-quality guidance; none is deleted.

