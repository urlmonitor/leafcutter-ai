id: GE-120h-3-i
title: "A check that works out for itself what to examine is switched on without a condition it never reads, because a filter the check ignores is a promise nothing keeps"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a check that works out for itself which of the author's changes to examine and
    never consults the list of filenames the commit path would hand it,
  When that check is switched on,
  Then it is switched on to run whatever the change contains, rather than under a
    condition naming which changes would activate it,
  And it is switched on so that no list of filenames is handed to it, since it would be
    ignored,
  And its entry declares that the check derives its own change set, so that the fact is
    readable from the list itself rather than only from the check's own code,

  And given instead the same check switched on to run whatever the change contains AND
    carrying a condition on which changes activate it,
  When the judgement of whether each switched-on check can ever be reached is made,
  Then that entry is reported as one that contradicts itself and the run fails,

  And given instead a check switched on under a condition naming a location this
    repository holds no file under,
  When that judgement is made,
  Then the entry is reported as one no checkout could activate — which is a stronger
    verdict than a condition that merely matches nothing today, and it fails the run,

  And given every check switched on by the change this record governs,
  When that judgement is made over the whole list,
  Then no entry the change added is reported in either of those two classes.

  Coverage note: the two failing arms are covered by constructing the contradictory entry
  and the location-anchored entry and running the reachability judgement over them, and
  the last arm by running that judgement over the real list after the registration. A test
  that reads the added entries as text and asserts which keys are present stays green on
  an entry whose condition is satisfied by nothing.
depends_on:
  - GE-120h-3
