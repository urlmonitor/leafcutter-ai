title: "A dangling registry entry is caught at build/commit time, never silently shipped to consumers"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100b-11.yaml"
criteria: |
  Given a developer stages a change to a commit-guardian hook registry
    (commit_guardian.json) that adds a hooks_manifest entry with id
    "check-orphan" whose entry references scripts/commit_guardian/check_orphan.py
  And no file exists at scripts/commit_guardian/check_orphan.py
  And the developer does not stage any check_orphan.py file
  When the pre-commit hook framework runs the registry referential-integrity check
  Then the commit is blocked before the commit object is created
  And the error names the hook id "check-orphan" and the missing script path
  And the dangling entry never reaches the deployed registry that a consumer
    install would copy

  And given the build system runs build.py to regenerate the deployed registry
    from the canonical template
  When the build completes
  Then the deployed registry contains no hook id that is absent from the
    canonical template registry
  And the build reports a non-zero result if it would otherwise emit a deployed
    registry entry whose referenced script is absent from the template tree
