id: DK-500d-2
title: Reused criteria are marked as reused at the approval of proposals and are used only once approved
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a design decision whose proposals hold the reused criteria of cat-1dc11c5a2ffa7310 and cat-d15d52392d7aa94c and one criterion drafted for a gap,
  When the person reaches the approval of proposals,
  Then each reused criterion is shown with its category id and preferred wording, set apart from the drafted criterion,
  And the person can approve all, approve only some, edit a criterion or add one, for reused and drafted criteria alike,
  And when the person approves only the criterion of cat-d15d52392d7aa94c and the drafted one, the criterion of cat-1dc11c5a2ffa7310 is neither researched nor assessed,
  And no reused criterion is researched or assessed before the person approves it.
depends_on:
- DK-500d
- DK-500d-1
covered_by:
- DK-500d-2-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-500d-1
  contract: Reused criteria linked to their category ids (DK-500d-1 delivers_to).
change_target: code
risk_surface: contract_boundary
it_requirements:
- The approval-of-proposals payload marks each reused criterion with its category id, pref_label and reuse kind, set apart from drafted ones, and carries the gap verdict (DK-500e-1) and the in-run grouping suggestions (DK-500b-4). It reuses the existing approve-all, approve-some, edit and add answers.
- Only approved criteria are researched or assessed. The gate is the existing approval step, and reused criteria have no path around it (ADR-060).
- The kernel builds the presentation text, and the Claude Code and Codex transport skills stay transport-only. If a skill change proves necessary it is a separate llm-expert AC.
test_required: true
test_spec:
- name: test_reused_marked_with_category_and_set_apart
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Each reused criterion is shown with its category id and preferred wording, apart from the drafted criterion.
- name: test_person_can_approve_some_edit_and_add
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The approval accepts approve-all, approve-some, edit and add for reused and drafted criteria alike.
- name: test_unapproved_reused_criterion_not_researched_or_assessed
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Approving only cat-d15d52392d7aa94c's criterion and the drafted one means cat-1dc11c5a2ffa7310's criterion gets no research or assessment call.
- name: test_no_research_before_approval
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: No research or assessment call for any reused criterion happens before the approval answer.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, call counts and staged files rather than internal helpers.
