criteria: |
  RETIRED 2026-10-09. THE CARRIER WAS THE WRONG MECHANISM; THE NEED IS MET AT READ
    TIME. Do not reinstate this, and do not read the text below as a live requirement.
    The purpose stated in the second-to-last clause — each agent identifying exactly
    which criteria it is responsible for without inspecting another agent's — is
    better served by querying the acceptance-criteria store, which is the source of
    truth and can be grouped by assigned_agent by any consumer at the moment of
    reading. Caching that query into generated markdown is what produced a working
    tree that was dirty after every build and could not honestly be committed. THIS IS
    A RETIREMENT OF THE CARRIER, NOT OF THE REQUIREMENT: the requirement was not wrong
    and is not abandoned. Its sibling INF-600b-3 now specifies the opposite property
    of the card — that adding a criterion to the store moves no card — and the two are
    the before and after of one decision rather than a contradiction. Read the final
    amended_by entry and the notes before concluding anything from the text below,
    which is preserved verbatim for audit.

  Given a ticket that references multiple L2/L3 ACs via its
    ac_traceability frontmatter field
    (e.g. ac_traceability: [INF-600g-1, INF-600g-2, INF-600g-3])
  And the ticket's agents map assigns multiple agents
    (e.g. python-coder: needed, test-writer: needed)
  And each AC YAML file has an assigned_agent field
    (e.g. INF-600g-1.yaml has assigned_agent: python-coder,
     INF-600g-2.yaml has assigned_agent: python-coder,
     INF-600g-3.yaml has assigned_agent: test-writer)
  When the ticket body or agent card is generated
  Then it includes a per-agent AC assignment section that groups ACs
    by their assigned_agent:
    "### python-coder
     - INF-600g-1: spawned_by/spawn_allowlist reciprocity validation
     - INF-600g-2: __ticket_phase_agents__ redundancy detection
     ### test-writer
     - INF-600g-3: skills_invoked cross-reference"
  And each agent can identify exactly which ACs it is responsible for
    without inspecting ACs assigned to other agents
  And the grouping enables agents to implement one AC at a time
    (sequentially within their assigned set) rather than attempting
    all ticket work at once
