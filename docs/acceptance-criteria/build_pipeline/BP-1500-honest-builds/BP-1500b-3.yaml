id: BP-1500b-3
title: "A clean sweep states the installed tree it examined and how much of it, so the all-clear is checkable"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a project whose installed tree carries no orphans at all,
  When the install is rebuilt,
  Then the build's clean result for the sweep states which installed tree it
    examined, which parts of that tree it walked, how many installed artifacts
    it inspected, and how many current sources it compared them against,
  And both stated counts are the real ones for that run, so rebuilding after
    adding one template raises the compared-against count by exactly one and
    rebuilding after removing one lowers it by exactly one,
  And for a project that has actually received an install, both stated counts
    are greater than zero,
  And a reader who does not believe the result can reconstruct the same scope by
    hand from what the report states alone, without reading the build's source,
    and arrive at the same two counts.
depends_on:
