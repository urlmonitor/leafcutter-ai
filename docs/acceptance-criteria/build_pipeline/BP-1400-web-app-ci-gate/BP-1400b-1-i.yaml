it_requirements:
  - "Exercises the FAILING path of the blocking web-app style job (BP-1400b-1): a fixture web-app file under leafcutter-web/ containing a raw apostrophe / unescaped entity in JSX markup (the react/no-unescaped-entities rule) must make `next lint` report a failing result that names the violation, so the check concludes red and the PR is marked not-mergeable."
  - "react/no-unescaped-entities must actually be an ENABLED rule in the leafcutter-web/ ESLint config (eslint-config-next enables it by default) — if a project override has disabled it, the gate would not catch the real incident this AC exists to prevent; confirm it is active."
  - "The deliberately-violating change must be transient/scoped to the verification (a throwaway PR or a temporary fixture removed before merge) so it does not become a standing lint failure — this AC verifies the GATE blocks, it does not ship a broken web app."
  - "Not-mergeable enforcement assumes the required-status-check wiring in BP-1400a-4; the blocking OUTCOME of THIS AC is the style check reporting failure."
