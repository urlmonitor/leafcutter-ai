title: "Each check's override rate is reported per check and per problem kind over a chosen window"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a body of recorded blocking findings and override records covering a chosen
    reporting window, for example the last 90 days,
  When the override report for that window is produced,
  Then it states, for each gate, how many blocking findings it raised, how many of those
    were overridden, and the resulting override rate as a proportion of that stated
    denominator,
  And it states the same three figures broken down per problem kind within each gate, so a
    gate whose overrides all cluster on a single problem kind is distinguishable from one
    whose overrides are spread across every kind it reports,
  And it states, for each overridden finding, whether a defect matching that finding's
    signature was subsequently recorded on the same piece of work, so overrides that were
    later vindicated are distinguishable from overrides that let a real problem through,
  And the reporting window is a parameter of the report rather than a fixed period.

  Given override records of the three kinds BO-2800c-1 produces — a human-declared
    override, an automated cross-agent phase skip, and an absent-manifest assumed pass,
  When the override report is produced,
  Then each gate's override figure is broken down by how the override arose, so an
    automated skip is not read as a human judgement that the gate was wrong,
  And the assumed-pass records are reported separately from the declared and automated
    overrides and are excluded from every override-rate numerator, because no finding was
    overruled in those cases and including them would inflate every gate's rate with
    evidence that was simply never supplied.
