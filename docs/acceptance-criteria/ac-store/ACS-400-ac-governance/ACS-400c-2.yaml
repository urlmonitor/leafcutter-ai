title: "Criteria amendment appends the author to amended_by"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an existing AC YAML file has its criteria field changed in the staged diff,
  When the governance check compares the staged version to the previous version,
  Then the amended_by list in the staged file must contain a new entry
    that was not present in the previous version,
  And that new entry must identify the amending agent and the date
    (e.g. "amended by business-analyst-v3, 2026-06-05"),
  And if no new amended_by entry is present, the commit is blocked with an error
    stating "criteria was modified but amended_by was not updated".
depends_on: [ACS-400c]
