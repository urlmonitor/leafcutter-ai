notes: |
  USER DECISION (2026-10-21): fix known issue KI-TQ-20261021 by running the
  reachability check against a small fixture repository built in a temporary
  directory — a few valid records, the malformed record, and the deployed
  guardrail — instead of the real repository. Of the two fixes the known issue
  suggests, the user chose this one over a time limit that scales with store
  size, because the fixture removes the dependence on store size instead of
  chasing it.
  KNOWN ISSUE: KI-TQ-20261021-acs200g-hook-run-outgrows-its-30s-timeout
  (docs/known-issues/testing-quality/). The check passes one staged record but
  points the guardrail at the real repository, so the guardrail indexes the
  whole store first: about 5,270 records, measured cold 22.2 s and warm 1.2 s
  against a hard 30 s limit, and continuous integration never has the index
  cache. It failed shard 3/8 in 4 of the last 6 main runs on 2026-10-21 and
  blocks every pull request through the required test-suite aggregate.
  The check must still drive the REAL deployed entry point (not an imported
  function or a mock), because reachability of that entry point is what the
  check exists to prove for ACS-200g. The valid-record scenario is a control:
  without it, a fixture that the guardrail cannot read at all would also
  "block" the malformed record. The 10-second bound is a BA choice that leaves
  a two-thirds margin under the existing 30 s limit; a fixture of four records
  should take on the order of the 1.2 s warm full-store run or less.
  Assigned to test-writer because the change lives entirely in the test; no
  production behaviour of the guardrail changes. If the guardrail turns out
  to read the real store regardless of the repository root it is given, that
  is a separate guardrail defect and needs its own record.
  IT PO ENRICHMENT (2026-10-21): the user chose this fix (the fixture store)
  on 2026-10-21 and approved building it now, as relayed by the main session.
  readiness is set to reviewed, not approved: the IT PO may not record an
  approval relayed through another agent. The user, or the main session
  acting on the user's own message, promotes it to approved.
  The enrichment confirms the change is test-only. The hook takes its schema
  and store from HOOK_ROOT and its index cache location from
  `git rev-parse --git-dir` in its working directory, so a git-initialised
  fixture used as both HOOK_ROOT and cwd confines every read and the cache
  write to the fixture. Read-only-fixture proof: the id keys of
  <fixture>/.git/ac_store_index_cache.json equal the four fixture ids. The
  real cache's existence, mtime and size are checked as well. amended_by
  stays empty: this is a new record, and the parent's covered_by already
  lists it.
