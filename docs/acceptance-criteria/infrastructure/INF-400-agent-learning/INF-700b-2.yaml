amended_by:
  - reason: "IT PO technical enrichment, 2026-08-26. Declared package_surface: true — the hook entry lands in templates/scripts/commit_guardian/commit_guardian.json, one of the four registries the AC schema enumerates as package surfaces, so the structured it_requirements form is obligatory and check-package-surface-declaration would otherwise refuse the landing commit. Named all three enforcement points and identified the required-status-check as the only one that satisfies 'refused rather than merely reported'. Dispositioned the three research-agent references that are unrelated to this feature but block the gate's activation, and forbade closing the gap with an allowlist. Corrected the notes' count of 43 references across 11 files: the checker reports 13 imperative references to 5 targets, of which 10 across 6 files are this feature's."
    by: it-po
    at: 2026-08-26
superseded_by: null
