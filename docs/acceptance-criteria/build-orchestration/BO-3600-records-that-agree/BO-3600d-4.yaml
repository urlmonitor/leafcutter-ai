notes: |
  Satisfies one half of BO-3600d's documentation_triggers: [state-diagram,
  reference-doc]; BO-3600d-5 satisfies the other.

  The whole point of the L1 is that a conflict cannot vanish, so a state diagram is
  the artifact that either shows that or exposes that it is not true: an exit with
  no destination state is exactly what the picture makes obvious and prose does not.

  The third and fourth scenarios pin BO-3600d-3's re-raise transition and
  BO-3600d-2's closed outcome set into the diagram, so a later reader cannot infer
  a fifth verdict or assume a resolution is permanent.

  assigned_agent deliberately unset — the diagram surface belongs to the IT Product
  Owner's assignment pass.
