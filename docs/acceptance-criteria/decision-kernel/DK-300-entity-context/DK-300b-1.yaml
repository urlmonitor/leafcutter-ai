    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "boundary"
    description: "tests/kernel/entity_context/test_recognition.py::test_all_admission_boundaries_preserve_exactly_16000_characters: Exercise model, payload/schema, adapter/CLI and service boundaries with an exactly16000-character Unicode/whitespace goal; assert checkpoint and intent receive verbatim content."
  - name: "test_late_entity_in_thousand_word_goal_is_scanned"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "reachability"
    description: "tests/kernel/entity_context/test_recognition.py::test_late_entity_in_thousand_word_goal_is_scanned: Place a real ID near the end of a1000-word admitted goal; assert full scan, eligible exact identity and one unchanged intent rather than prefixes or sub-intents."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
