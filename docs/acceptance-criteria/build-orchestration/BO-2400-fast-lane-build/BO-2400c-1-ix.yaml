estimated_complexity: M
it_requirements:
  config_schema_fragment:
    fast_lane_delivery_failure_report:
      type: object
      description: >-
        The terminal payload for a run that ended because what arrived is not what was
        produced. Shape: {phase: "context-bundle", cause: "delivery_altered", message: str,
        stated_value: str, derived_value: str, stated_bytes: int, received_bytes: int}.
        `message` LEADS with the statement that the bundle was produced and then altered
        between production and arrival, and carries both compared values in that leading
        statement rather than only inside an appended detail blob. `cause` joins the three
        BO-2400c-1-iii already defines (not_obtained, a_reference, incomplete) as a fourth
        disjoint member; no member's message is a restatement or a superset of another's.
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "2"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SCOPE — JAVASCRIPT ONLY, AND NO NEW DATA. Everything this record reports is already produced by BO-2400c-1-viii's comparison; nothing in scripts/injection_builders.py belongs here. The two locations counted by n_location_rule are both in templates/workflows-js/fast-lane-ship.js: (1) classifyContextBundle, currently ~297-390, where the ordering between the delivery comparison and the landmark check is decided; (2) the halt payload construction reached from the gate at ~1077-1090, where exactly one cause is named. If this record is built in the same pass as -viii, say so in the sign-off and keep the edits attributable, because a later regression in the WORDING and a later regression in the COMPARISON have different owners."
    - "THE ORDERING MUST BE ENFORCED WHERE THE CLASSIFICATION IS COMPUTED, NOT IN THE WORDING. The delivery comparison is evaluated BEFORE the breakpoint-marker and empty-layer checks, so that corrupted content whose landmark did not survive is classified as a delivery failure and not as incomplete content. This mirrors the decision BO-2400c-1-iii already made in the other direction (reference-rejection before the marker check, or a locator containing the marker collapses two states into one). An implementation that checks the landmark first and then rewrites its message to mention delivery passes every assertion about wording while still reporting the symptom — which is why the covering test asserts on the message produced by a run in which the landmark is genuinely destroyed, not on the message alone."
    - "BOTH COMPARED VALUES APPEAR IN THE LEADING STATEMENT. The producer-stated value and the value the lane derived from what arrived must be readable without re-running anything and without parsing a serialised detail object. Appending JSON.stringify(bundleResult) after a message that still leads with composition does not satisfy this: the existing halts already do exactly that, and both recorded occurrences still sent an operator to look at an assembly that had not failed."
    - "THE MESSAGE MUST NOT NAME A COMPOSITION CAUSE. A delivery failure is not 'was not obtained' (obtained was true), not 'a location standing in for content' (the reply was content), and not 'incompletely composed' (assembly is working and its output was correct). Each of those names a different fault and sends the reader somewhere the fault is not. The covering test asserts their ABSENCE from the delivery-failure payload, because asserting only that the right words are present passes on a message that contains both."
    - "ONE CONSTRUCTION SITE, FOUR MUTUALLY DISTINGUISHABLE MESSAGES. The fourth cause joins BO-2400c-1-iii's three at the site that already builds them; do not add a second site. BO-2400c-1-x extends this SAME site with the shortfall case, so a second site would let two records' messages drift apart while each one's own tests stay green. Distinguishability is a pairwise property and must be asserted pairwise in one test: four messages asserted in isolation can all be satisfied by one undifferentiated wording."
    - "DELIBERATELY NOT IN SCOPE: the general rule that a halt must not state a reason its own evidence denies. BO-2400c-1-iii assigns that to the BO-2400f-4-vi family and duplicating it here would give it two owners and no home. Implement the instance, not the rule."
    - "NO GREP TESTS. This record is about wording, and wording is evidence only when it is the wording a real run produced. A test that finds a message string in fast-lane-ship.js proves the message was AUTHORED, not that any run reaches it — and this family already shipped a month of green tests over a layer that never ran. Every assertion here reads HarnessResult.result from a run executed under unit_tests/_workflow_engine_harness.py."
delivers_to:
  - agent: python-coder
    contract: "A single halt-message construction site carrying four disjoint causes, of which the fourth names delivery and carries both compared values. BO-2400c-1-x extends this same site with the stated-versus-received quantities for the shortfall case; the site is shared deliberately so the two records' messages cannot drift."
