it_requirements:
  - "ANNOUNCE ON EFFECT, NEVER ON APPLICATION. The notice fires only when at least one finding was actually withheld. It must NOT fire because the reduction applied to a staged file. The reduced locations include the acceptance-criteria store, the ticket tree, the retrospectives and the skill prompts, so an announce-on-application implementation would print on nearly every commit in this repository — and a notice printed on nearly every commit is read on none. This is the single decision that separates a useful notice from noise, and it must not be revisited as a configuration option."
  - "GENUINE SILENCE on a run that withheld nothing: nothing at all on the error stream — no header, no zero count, no per-file line — and nothing added to the output stream. Measured today, main() in templates/scripts/commit_guardian/check_secrets.py already returns 0 before producing any output on such a run; that property must be PRESERVED, not re-achieved by emitting an empty or zero-valued block."
  - "The human silence here and the always-present machine zero in GE-125d-2 are DELIBERATELY OPPOSITE and both must hold. A person is shown nothing; a caller is always given an explicit total of 0 so that absence is never a reading. This is a resolved tension, not a contradiction — do not print a zero line for symmetry with the record, and do not drop the record for symmetry with the silence."
  - "ONE notice block per run: never one per file, never one per finding. A single header carrying the exact total and the exact affected-file count, then at most 10 per-file lines, then exactly one remainder line naming how many further affected files are not listed. No second block may be written for any further file, and the remainder line must be omitted when nothing was omitted."
  - "The 10-line bound and the EXACT total are independent requirements and both are load-bearing. The bound stops a pathological run burying the header; the exact total stops the bound hiding the size of the gap. Do not replace the exact total with a bounded, rounded or approximate one, and do not make the bound configurable in a way that lets a caller turn the summary back into a per-file report."
  - "Exit status must be decided ONLY by the findings that were reported, and must be identical to what the check decides today on the same input. This is the property most easily lost when a threshold or roll-up is added later: any future change that lets the withheld total influence the verdict — a cap, a ratio, a 'too much withheld' gate — is a regression against this record, not an enhancement."
  - "The negative control must remain its own arm and must NOT be folded into a sibling as an afterthought clause. An implementation that prints an unconditional warning satisfies every other criterion in this L1; the 40-file reduced-but-clean run is the only arm that fails it."
  - "Generate the 40-file and 30-file fixtures inside the throwaway repository at test time rather than committing them, and assemble their credential-shaped content at runtime from fragments as unit_tests/commit_guardian/test_scan_secrets_suppression.py does — so the files written into the throwaway repository are byte-identical to real content while no detection rule fires on the test source itself."
  - "A 30-file, 412-withheld run must add no second pass over file contents and must keep the accounting O(number of findings). The notice must be assembled once per run, not incrementally appended per file, or the one-block guarantee becomes an emergent property of the loop rather than a decision."
  - "CLAUDE.md error-handling policy applies: the emitter's writes are wrapped in a typed except that logs at WARNING or higher and never silently swallows, and a failure to emit must never change the exit status. The pure decision of whether to speak at all is not I/O and must not be wrapped (Rule 4)."
  - "ADR-001 parity: edit templates/scripts/commit_guardian/check_secrets.py, then run `python scripts/build.py --target-dir .` and verify the deployed copy. check_hook_parity enforces all four locations; a deployed-copy-only fix is reverted by the next build."
