id: BP-900h-4
components:
  - build_pipeline
title: "The install under test is a vendoring consumer, so a guardrail's data file cannot pass by borrowing the package's own tree"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: critical
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h.yaml"
criteria: |
  Given the consumer-simulation install of BP-900h-1, which builds into a scratch
    project holding only a minimal skills_config.json,
  And a guardrail the package deploys that reads a declaring file it does not itself
    contain — a schema that defines its rule, a vocabulary of permitted values, a
    registry of records it looks up, or a helper module it loads,
  When the install is inspected after the build,
  Then every declaring file that a deployed guardrail reads is present under that
    scratch project's deployed output root,
  And each declaring file is resolved ONLY from the scratch project's deployed output
    root — never from the package checkout beneath it, never from a parent directory,
    and never from the invoking process's working directory — so a file that would
    resolve only because the target happens to be the package's own workspace is
    reported as missing,
  And the inspection names each missing declaring file together with the guardrail
    that reads it and the deployed location it was expected at,
  And a file the guardrail obtains from outside the install — an operating-system
    path, or data owned by an external tool the package does not ship — is not
    reported as missing, so the check does not manufacture failures for things the
    install was never responsible for,
  And the inspection is demonstrated to FAIL when one declaring file is deleted from
    the deployed output root after a successful build, because an inspection that
    stays green on a deliberately incomplete install proves nothing.

  Because on 2026-08-18 five declaring files were confirmed absent from a deployed
  output root while every build test passed: two type vocabularies read by the
  document-frontmatter guardrail, the schema read by the AC-schema guardrail, the
  agent registry read by the planning workflow, and a component-migration helper
  module. None of these was detectable, because every build test to date installs
  into leafcutter's own self-hosted workspace, where the package source tree sits
  beside the deployed output root and each of those files resolves anyway. The layout
  under test, not the check, is what made the gap invisible.
depends_on:
  - BP-900h
  - BP-900h-1
