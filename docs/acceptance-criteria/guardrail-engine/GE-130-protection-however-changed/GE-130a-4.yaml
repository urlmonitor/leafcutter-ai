notes: |
  USER DECISION Q5: the task-lock guard may be widened immediately; no GE-130f dependency.
  GE-130d notes: blocking every shell command under the lock would stop the workflow it protects.

  DECIDED 2026-09-17 (user) -- CALLER-IDENTITY EXEMPTION. The build workflow's own dispatched
  agents may write under the lock; every other caller's writing command is stopped (including the
  top-level session); reading commands pass. The exemption comes only from harness-supplied
  identity (GE-129a), never from command text, environment or prompt; if identity cannot be
  established the command is stopped.
  DEPENDENCY RISK: GE-129a's live probe records whether an agent dispatched by a workflow script's
  agent() call carries usable identity (its case 3). If it does not, this exemption cannot be
  met as written and returns to the user.

  ATTRIBUTION POLICY DOES NOT APPLY HERE. The 2026-09-17 "stop only on positive attribution"
  policy (GE-130c-2, GE-130c-2-i, GE-130c-2-ii) covers the documentation guard and the guide-read
  guard only. This guard stops any non-exempt writing command under the lock regardless of whose
  change it was; its lock semantics are unaffected by the GE-130c records.

  SUPERSEDED 2026-09-17: the earlier OPEN paragraph (name any refused /build-feature step, no
  exemption invented) is replaced by the decision above; old criteria are quoted in amended_by.

  The existing INLINE_WORK_GUARD_MODE=warn is a per-call override (GE-130b), distinct from the
  project-wide warn-only rollout stage (GE-130d-3).

  declares_side_effect: false.
