notes: |
  The ACS-100h-7a conflict is settled at the L0 and MUST NOT be re-litigated. What this
  AC adds is a mechanism that stops the exemption from WIDENING: the exemption is a
  declared record naming both the surface and the mandating AC, so a future implementer
  cannot claim exemption by assertion.

  THE GENERAL BOUNDARY (carried into the criteria text deliberately, not left in
  notes): independence applies to the DENOMINATOR — how many records were in scope —
  never to the RULE applied per record. Where an AC already mandates one shared
  implementation of a rule, that mandate stands and ACS-1100 wraps a coverage
  statement around it.

  ==========================================================================
  ACS-900e — CORRECTED RESOLUTION (2026-08-13, expert review).
  ==========================================================================
  The first authoring pass claimed ACS-900e "governs the RULE (how an AC is mapped to
  its source files)" and was therefore resolved by the denominator-versus-rule boundary.
  THAT WAS WRONG. Read ACS-900e-1's it_requirements: the shared unit it mandates is
  named explicitly as _load_ac_yamls — "load each AC dict, read its implemented_by
  list", extracted into an importable shared module. That is an ENUMERATION over the AC
  store: it is the denominator path, not a per-record rule. The boundary above does not
  touch it, and no second exemption entry can be justified on those grounds.

  It is resolved instead by the corrected ACS-1100a-2. _load_ac_yamls is a FILTER-FREE
  enumeration of the AC store — it loads every AC dict — so a total drawn from it shares
  no filter, match key or join key with the deprecation hook's own retired-AC selection.
  One shared filter-free enumeration serves both the total and the results, exactly as
  ACS-900e-1 demands and exactly as ACS-1100a-2 now permits. No second traversal, no
  exemption entry, no conflict. This is why "same pass" had to be struck from
  ACS-1100a-2: with it in place, ACS-900e-1's mandated shared helper would have been
  non-compliant by construction.

  ACS-100c-6 binds the already-exempt tree-counter surface, so it needs no new entry
  either.

  DEPENDENCY (2026-08-13, expert review). ACS-100h-7a is readiness: approved but
  work_status: todo — its single shared callable does not exist yet, and the duplication
  it targets is still live (two copies of check_ac_limits.py in the package source at
  675 and 637 lines, verified 2026-08-13). The exemption record cannot name a callable
  that has not been built, so ACS-100h-7a is a genuine depends_on prerequisite and has
  been promoted out of doc_links into depends_on.
