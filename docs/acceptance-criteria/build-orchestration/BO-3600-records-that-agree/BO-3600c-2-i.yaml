id: BO-3600c-2-i
title: "A reference whose subject moved says where it went, and never asserts a deletion it cannot establish"
component: build-orchestration
components:
  - ac_store
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fault entry naming a file, a position, and the thing at that position,
    And that thing is no longer at that position but is found elsewhere in the same
      file,
  When the register is checked,
  Then the flag states that the position has moved and names the position where the
    thing was found.

  Given the same entry where the thing is found in a different file,
  When the register is checked,
  Then the flag states that the subject has moved and names the file it was found
    in.

  Given the same entry where the thing is not found anywhere the check looked,
  When the register is checked,
  Then the flag states that the reference could not be resolved and names where the
    check looked,
    And it does not state that the subject was deleted,
  So the reader is not given an instruction the check cannot support.

  Given an entry whose reference resolves unchanged,
  When the register is checked,
  Then nothing is stated about it having moved,
  So the moved report is a consequence of movement and not an annotation on every
    reference.
