notes: |
  THE SECOND ARM IS THE WHOLE RECORD. The first arm is satisfiable by naming all 65
  documents individually, which is the mechanism that exists today and the mechanism that
  recurred four times in one session. Only the second arm — a 66th document that appears
  in no entry by name, committed with no edit to the declaration — distinguishes a
  declared class from a longer list. If an implementation satisfies the first arm and not
  the second, nothing has been fixed and the next agent added will reproduce the original
  report exactly.

  THE THIRD ARM IS THE NEGATIVE CONTROL AND IS NOT OPTIONAL. Without it, every clause
  above is satisfied by disabling the doc-length gate outright, or by a gate that silently
  fails to run on the cards directory for an unrelated reason. The arm names which three
  documents must be reported, so the control proves the gate both ran and measured the
  right population. This is the same construction GE-118c used for the same reason: a fix
  must be distinguishable from switching the check off.

  WHY THE LOCATION AND NOT THE FILENAME SUFFIX — THE REASONING, STATED HERE SO THE
  IMPLEMENTER DOES NOT RE-DECIDE IT. Both would satisfy the first two arms today. The
  location is chosen because every document in that directory is generated, so the
  exemption lands on exactly the generated population; a suffix rule additionally exempts
  any hand-authored document anywhere under docs/ carrying that suffix, which widens the
  exemption past the population it was written for, and GE-127g-3 is the record that would
  go red if it did. A suffix is also a naming convention a generator change can break
  silently, while the directory it writes into is the thing the generator is configured
  with. The full argument, including why a general declared-pattern mechanism is right
  rather than a one-off for this directory, is in the parent's notes under design question
  one; do not re-derive it.

  MEASURED IN THIS WORKTREE ON 2026-10-09, RAW LINE COUNTS WITH NO EXCLUSIONS, AND THE
  FIGURES IN THE CRITERIA ARE ILLUSTRATIVE OF A SHAPE RATHER THAN FIXED FACTS: 65
  documents under docs/agents/cards/, 11,526 lines in total, 3 above 300 (2,809, 639,
  355), next three at 276, 235, 207. The committed lengths of those same three at HEAD are
  2,525, 635 and 340 — the difference is a regeneration this worktree arrived already
  carrying, which the parent's notes record in full and which reconciles this measurement
  with the figures in the report that prompted the record. A test that pins 65 or 2,809 as
  a constant will go red the next time an agent or an assignment is added, which is the
  opposite of this record's point — the population is expected to move, and the second arm
  is the clause that says so.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE LIST. MUTATION: express the exclusion as the 65 current filenames instead of
      their location.
      MUST GO RED: the second arm only.
      MUST STAY GREEN: the first and third arms, and every arm of GE-127g-3. That
      asymmetry is the evidence that the second arm is this record's actual subject.

  (2) THE SWITCH-OFF. MUTATION: exclude every document under docs/ from the length
      standard.
      MUST GO RED: the third arm, and every arm of GE-127g-3.
      MUST STAY GREEN: the first and second arms, which a disabled gate satisfies exactly.

  (3) THE UNREAD DECLARATION. MUTATION: hardcode the directory in the gate's own code and
      ignore the declaration.
      MUST GO RED: the third arm, which empties the declaration and requires the three
      over-limit documents to be named.
      MUST STAY GREEN: the first and second arms. This is the BP-900g-7 shape — a registry
      naming something nothing consumes — and the third arm is the only clause that
      catches it.

  ==========================================================================
  THE MEASURED FIGURES IN criteria NO LONGER DESCRIBE THE TREE (2026-10-09).
  ==========================================================================
  Agent cards became static the day this record was approved. The trailing per-agent
  AC-assignment section is removed from every card: 3,787 of 11,526 card lines, 33%,
  across 17 of the 64 documents. python-coder.card.md goes 2,809 -> 162. The count of
  cards above the 300-line limit goes 3 -> 0.

  So the criteria's "3 stand above the 300-line limit — the longest at 2,809" and the
  measured block above are both now historical. They were never fixed facts — this
  record says so twice — but a reader checking them against the tree will find they do
  not match, and should find this paragraph first rather than concluding the record is
  wrong.

  NOTHING IN THIS RECORD NEEDS TO CHANGE, and the reason is the construction it was
  given: every test_spec entry builds its own throwaway repository rather than reading
  the real directory. Arm 1's fixture wants "at least one far above" the limit; arm 2
  adds a 420-line document; arm 3 asserts against "the set the fixture constructed,
  never against a pinned count". Had any of those been written against the real tree,
  this change would have broken all three — which is the clearest retrospective
  vindication of the no-pinned-figures rule this record and GE-127g-5 both insist on.

  WHAT IS GENUINELY LOST: the live worked example. The third arm's negative control
  cannot be demonstrated against the real cards directory any more, because emptying
  the declaration now names nothing. The mechanism will still be proved, but only in
  fixtures. A mechanism with no live instance is one nobody notices decaying, and that
  is a cost of the cards entry staying rather than an argument against it.

  THE ENTRY STAYS. See GE-127g's notes block "DOES THE CARDS ENTRY COME OUT?". The
  ground that bears most directly on this record: docs/agents/cards/ is the only
  DIRECTORY-shaped entry of the three declared locations, so it is the only one under
  which this record's second arm — the one its own notes call "THE WHOLE RECORD" — has
  a population. With it gone, the declared set is two filenames and the no-edit
  property has nothing to be true of.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's, as is the concrete set
  of declared locations and the wording of each stated reason.
