title: "Rule and pre-commit hook are a paired unit — one manages both"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given the logging rule (templates/rules/logging.md) and the no-print hook
    (scripts/commit_guardian/check_no_print.py),
  When a developer looks at either artifact,
  Then the rule file references its paired hook (e.g. "Enforced by: check-no-print"),
  And the hook's commit_guardian.json entry references its paired rule
    (e.g. "paired_rule: logging"),
  And both enforce the same convention (no contradictions between what the rule
    tells the agent and what the hook blocks mechanically),
  And build.py ships or skips both as a unit based on the customer's config.
