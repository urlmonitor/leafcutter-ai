notes: |
  CONCEPT A (part 1) -- the checklist is not merely declared (ACD-1800a-1) but
  derived/validated against what the requirement actually changes, so a code
  requirement that omits its tests is caught. "Change surface" = the set of
  artifact kinds the requirement will change.
