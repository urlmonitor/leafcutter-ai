notes: |
  DECOMPOSED 2026-09-07, not superseded. This AC packs four separately-failing checks into one
  set of And clauses with a single implementation reference, no fixture and no named error
  string. Each check now has its own child with its own fixture and its own named finding:

    UXP-514-1  D1  step impl_status vs the status recomputed from its criteria
    UXP-514-2  D2  an AC's product_truth back-reference vs the by_ac inversion
    UXP-514-3  D3  the derived index lookups vs a fresh rebuild
    UXP-514-4  D4  a step's screen resolving to a registered mockup, gated on approval
    UXP-514-5      anti-vacuity: none of the four reports clean on an empty input set
    UXP-514-6      the artifacts[] scalar fields D3 does not look at

  WHY THE ANTI-VACUITY SIBLING EXISTS. Every clause above is of the form "errors if ANY X
  differs". That is universally quantified, so all four are vacuously true when their input set
  is empty, and an empty store consequently produced "OK ... (0 warnings)" and exit 0 on
  2026-09-07. UXP-514-5 is the instance, for these four checks, of the general rule in
  UXP-700b-3.

  COVERAGE STATUS as at 2026-09-07: DONE IN NAME ONLY. work_status has been done since
  2026-07-14 and no test drives any of the four checks. The covered_by entries above are child
  ACs, not tests; the tests are specified per child.

  ID FORM. The children use the canonical child-id form UXP-514-N so derive_parent_id() resolves
  them to UXP-514. They are level L3 because their parent is level L2 - the same relationship
  UXP-609-2 has to UXP-609. The authoring request called them L2, meaning the granularity, not
  the positional level field. Numeric-sibling ids (UXP-517, UXP-518, ...) were deliberately NOT
  used: derive_parent_id() resolves those to nothing, which is how UXP-490 accumulated nine
  children while counting as zero against the 3-7 cap.
