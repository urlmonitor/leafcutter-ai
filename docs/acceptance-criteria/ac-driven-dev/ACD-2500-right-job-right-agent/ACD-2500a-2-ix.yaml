assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- The step reuses the existing stage-end rule-check runner of /plan-feature (the one that runs after po,
  ba, itpo and test-design) with --stage itpo-handback and --before-ref HEAD, where HEAD is the batch
  as committed before the hand-back pass; no second runner and no agent-side judgement of the result.
- 'Fail-closed as for the other stages (ACD-2500a-1): the stage passes only on exit 0, verdict passed
  and records_checked above 0; a dispatch error or unreadable report is a failed stage.'
- On failure the findings (file, family, message) are shown to the user and the run stops before the final
  gate; the hand-back stage is reported not complete and nothing is committed as approved.
- 'templates/workflows-js/plan-feature.js is over its size limit and its measured length must not grow
  (GE-127b-1 growth ratchet): lines added are paid for by lines removed or by rationale comments moved
  to docs/reference/plan-feature-workflow-rationale*.md. Build after GE-127h-1 so decision-history lines
  are free.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- Before the hand-back round, /plan-feature commits the test-design output (test_spec, test-design authorship,
  file_findings and their opened-files lists) as its own stage commit, so that --before-ref HEAD for --stage
  itpo-handback is the post-design batch. Without it every designer field would read as a hand-back edit.
  If a commit is not possible, the step passes an equivalent post-design --before-snapshot instead; it
  never runs the hand-back check against the pre-design batch.
declared_files:
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from:
  ac_id: ACD-2500a-2-vii
  contract: "The rule check accepts the hand-back stage (planner decision: --stage itpo-handback) and applies that stage's owner map: assigned_agent, file_findings[].decision, it_requirements, declared_files, delivers_to and expects_from allowed; every other protected field (criteria, test_intent, test_spec, a file finding's fields other than its decision, file_findings_opened_files and test_design_* marks) reported as a 'protected fields' finding with disposition 'needs a decision'; exit 0 only on verdict passed."
test_intent:
- clause: /plan-feature runs the requirement rule check for the hand-back stage on the batch, with the
    batch as committed before the hand-back pass as its before-state
  needs_test: true
  reason: Running the check after the hand-back pass is the missing wiring, and without it the owner map
    is never applied.
- clause: that check reports exactly one "protected fields" finding, naming ACD-9990a-1, the field criteria
    and the hand-back stage, and no finding for the assigned_agent or the finding decision
  needs_test: true
  reason: The workflow must surface exactly the disallowed edit and not the allowed ones, which depends
    on the stage it passes.
- clause: 'the run does not reach the final gate: the hand-back stage is reported not complete, and the
    user is shown the finding'
  needs_test: true
  reason: Stopping before the final gate is the gate behaviour, and a run that continued would let a disallowed
    edit be approved.
- clause: given instead the hand-back pass makes only the assigned_agent and decision changes
  needs_test: false
  reason: Precondition line of the next scenario, not an outcome, so there is nothing to prove here.
- clause: the same check runs for the hand-back stage and passes
  needs_test: true
  reason: Allowed hand-back edits must pass, or every legitimate reassignment would block the run.
- clause: the run goes on to the final gate
  needs_test: true
  reason: A passing check must let the run continue, or the new step would block every run.
test_spec:
- name: test_handback_pass_runs_rule_check_for_handback_stage
  target_dir: unit_tests/ac_driven_dev/file_findings/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Real plan-feature.js under run_workflow_under_e2 on the technical route with the _handback_support.py
    label table (convention: test_acd_2500d_3_i_handback.py); the hold report says R is undecided until
    it-po-findings-round-1 has run (by_round). Entry point: the workflow dispatch. After it-po-findings-round-1
    the workflow dispatches rule-check-itpo-handback (not rule-check-test-design) whose command carries
    --stage itpo-handback and a before-state; position: after the round, before pause-persist of final-gate.'
  proves_clause: /plan-feature runs the requirement rule check for the hand-back stage on the batch, with
    the batch as committed before the hand-back pass as its before-state
  code_file: templates/workflows-js/plan-feature.js
- name: test_handback_before_state_is_the_post_design_batch
  target_dir: unit_tests/ac_driven_dev/file_findings/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Real plan-feature.js under run_workflow_under_e2 on the technical route with the _handback_support.py
    label table (convention: test_acd_2500d_3_i_handback.py); the hold report says R is undecided until
    it-po-findings-round-1 has run (by_round). The hand-back check''s before-state is the batch as it
    stood when the hand-back began (test-design output included): between rule-check-test-design and it-po-findings-round-1
    the workflow commits the test-design output or otherwise fixes that before-state, so the designer''s
    fields are not judged as hand-back edits.'
  proves_clause: /plan-feature runs the requirement rule check for the hand-back stage on the batch, with
    the batch as committed before the hand-back pass as its before-state
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - running the hand-back check with --before-ref HEAD while the test-design output is still uncommitted,
    so every designer field is reported as a hand-back change
  - re-running the check with --stage test-design after the hand-back, so the allowed reassignment fails
- name: test_handback_check_reports_only_the_disallowed_edit
  target_dir: unit_tests/ac_driven_dev/file_findings/
  framework: pytest
  type: unit
  angle: seam
  description: 'Producer -> consumer seam. Producer: the real requirement_rule_check.py CLI with the workflow''s
    flags (--stage itpo-handback --changed-since HEAD --before-ref HEAD) on a tmp git store where ACD-9990a-2''s
    assigned_agent and finding decision changed and ACD-9990a-1''s criteria changed: exactly one ''protected
    fields'' finding (ACD-9990a-1, criteria, itpo-handback). Consumer: that stdout fed as the rule-check-itpo-handback
    reply; what the user is shown names ACD-9990a-1 and criteria and not assigned_agent.'
  proves_clause: that check reports exactly one "protected fields" finding, naming ACD-9990a-1, the field
    criteria and the hand-back stage, and no finding for the assigned_agent or the finding decision
  code_file: templates/workflows-js/plan-feature.js
- name: test_failed_handback_check_stops_before_final_gate
  target_dir: unit_tests/ac_driven_dev/file_findings/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Real plan-feature.js under run_workflow_under_e2 on the technical route with the _handback_support.py
    label table (convention: test_acd_2500d_3_i_handback.py); the hold report says R is undecided until
    it-po-findings-round-1 has run (by_round). rule-check-itpo-handback replies verdict failed, exit 1:
    no final-gate dispatch and no final-gate pause record, no approving commit, the stage is reported
    not complete, and the run''s user-facing output carries the finding''s file, family and message.'
  proves_clause: 'the run does not reach the final gate: the hand-back stage is reported not complete,
    and the user is shown the finding'
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - showing the failed check at the final gate instead of stopping before it
  - treating exit 0 with verdict failed as a pass
- name: test_allowed_handback_edits_pass_handback_check
  target_dir: unit_tests/ac_driven_dev/file_findings/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Real CLI, --stage itpo-handback --before-ref HEAD on a tmp git store. Case A, per the
    criteria: only assigned_agent and the finding decision changed. Case B, the widened owner map the
    expects_from contract names: also a declared_files entry and an it_requirements entry added and the
    delivers_to and expects_from texts changed. Both: verdict passed, exit 0, records_checked > 0.'
  proves_clause: the same check runs for the hand-back stage and passes
  code_file: scripts/ac_store/requirement_rule_check.py
- name: test_passing_handback_check_reaches_final_gate
  target_dir: unit_tests/ac_driven_dev/file_findings/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Real plan-feature.js under run_workflow_under_e2 on the technical route with the _handback_support.py
    label table (convention: test_acd_2500d_3_i_handback.py); the hold report says R is undecided until
    it-po-findings-round-1 has run (by_round). rule-check-itpo-handback replies passed: the run reaches
    final-gate (pause record persisted) and the gate context offers R and S. Control: the failing reply
    in the test above does not reach it.'
  proves_clause: the run goes on to the final gate
  code_file: templates/workflows-js/plan-feature.js
