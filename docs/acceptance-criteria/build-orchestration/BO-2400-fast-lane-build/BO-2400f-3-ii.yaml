id: BO-2400f-3-ii
components:
  - build_orchestration
title: "Wherever the run is launched from, every step is told the run's own workspace by name, so a legitimate step is not taken for a misrouted one"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an operator starts a fast-lane run for one acceptance criterion from a checkout
    other than the workspace the run opens — the main checkout, a sibling worktree of the
    same repository, or a subdirectory of either,
  And the run has opened its own workspace and confirmed its location (BO-2400f-3,
    BO-2400f-3-i),
  When the run asks an agent to perform any step after that — context bundle, claim,
    test-writer, coder, review, release, changelog, commit, push or pull request,
  Then the request carries the target explicitly, as three facts together: the
    workspace's absolute location as the worktree step confirmed it, the branch the run
    created there, and the acceptance-criterion id the run was started for,
  And the request states that this run opened that workspace for that criterion, so an
    agent that starts in a different location reads the target as the run's own
    workspace and not as a task aimed somewhere it should not go,
  And no step takes its target from the location the run was launched from, and the
    launch location does not appear in any step request as a place to work.

  Given the same acceptance criterion and the same store,
  When one run is launched from the main checkout and another from a sibling worktree,
  Then every step request in both runs names the target in the same form, differing only
    in the workspace location each run opened,
  And neither run has a step declined as misrouted or injected.

  Given a step agent nevertheless declines its step because it judges the target
    foreign,
  When the run reads that reply,
  Then the run ends as a declined step (BO-2400f-5-iii) naming the step, the agent, the
    target it was given, and its reason.
depends_on: [BO-2400f-3, BO-2400f-3-i, BO-2400f-5-iii]
