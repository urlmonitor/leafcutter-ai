id: GE-130b-2
title: An override refused for a caller is refused on every path that caller can use, and a caller who
  cannot be identified gets the same answer on both paths
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a caller for whom BO-3200f-2-iii refuses a guard's override -- the chartered executor --
    and a caller whose identity cannot be established, identity being decided as GE-129a
    decides it,
  And the override for the documentation guard, the guide-read guard or the task-lock guard set,
  When either caller makes a change that guard refuses without the override, on every path that
    caller holds -- the editing tools, shell commands, or both,
  Then the change is refused on each of those paths, and each refusal names the guard and the
    override it refused,
  And the unidentified-caller policy applied on the shell path is the one the declaration states
    for that override, identical to the editing path,
  And in the same run a caller for whom the override is honoured has the same change let through
    on both paths, so no path refuses an override the other honours.
depends_on:
- GE-130b
- BO-3200f-2-iii
- GE-129a
