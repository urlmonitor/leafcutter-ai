criteria: |
  Given the build-time guard has detected that "scripts/ac_store/ac_prioritizer.py"
  is referenced in the compiled template "agents/build-ac.md"
  but is not in the deployable script set,
  When the guard emits the error report,
  Then the report entry for this reference contains all three fields:
    (a) the missing path: "scripts/ac_store/ac_prioritizer.py"
    (b) the referencing template: "agents/build-ac.md"
    (c) a suggested action: one of "add a deploy phase in build_phases.py"
        or "add to the external-dependency allowlist"
  And no field is empty or omitted
