title: "Correcting a child list never re-judges whether the parent is finished"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a parent claiming to be finished whose child list omits a child that is
    not finished,
  When the one-off adjudicated pass repairs that parent's child list,
  Then the parent's finished-state value is unchanged from before the run,
  And no record anywhere in the store has its finished-state value changed by the
    run,
  And the parent's newly complete child list is reported, so the now-visible
    disagreement between the parent's claim and its children is left standing for
    the separate reader that judges it.
