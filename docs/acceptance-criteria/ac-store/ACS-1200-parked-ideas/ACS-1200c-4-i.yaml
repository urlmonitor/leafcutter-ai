notes: |
  Calibration evidence, 2026-08-14: of the childless feature-level records in
  the store, all but one sit at draft or reviewed. BP-900d is the lone approved
  one. Approved means "ready to build" while an empty child list means "nothing
  to build" — the record asserts both, so it is a data defect either way, and
  the risk this AC guards against is that the parked convention absorbs it and
  makes the defect permanent.

  This AC does NOT fix BP-900d and does not require anyone to. It requires that
  the record stays visible and correctly described. Deciding its fate is
  ordinary store hygiene, out of scope here for the same reason the 54
  pre-existing orphans are (ACS-1200b-3).

  It also does not count or tabulate the childless population — that is
  KM-200c's remit; this criterion names one record.

  IT-PO ENRICHMENT (2026-08-14). Complexity raised S -> M: despite naming one
  record, this AC adds a whole new state to the orphan scan's report
  classification, plus the data-driven predicate that decides it. Sequenced
  after ACS-1200b-2 it is cheaper; built before it, it forces the classification
  design that ACS-1200b-2 owns.
