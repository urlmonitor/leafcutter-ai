it_requirements:
- Edits templates/agents/test-writer.md; canonical/deployed parity via the build (ADR-001).
- The halt reason string is the vocabulary value 'test design pending' (ACD-2500b-2).
- Tests are tagged with the requirement id through the existing '# covers:' convention.
- Behaviour for legacy designs (ACD-2500b-3) is unchanged.
- The test writer never writes to an AC record.
