notes: |
  This is the guard that keeps the gate adoptable AND keeps it honest. The store
  has a substantial pre-existing violation baseline — a store-wide scan in this
  worktree on 2026-08-14 reported 57 records whose parent omits them from its
  back-link — so a gate scoped to the whole store on every pull request would
  fail every contributor immediately and be disabled within a day. The second
  scenario is the paired constraint: the cheapest way to satisfy the first
  scenario is to stop failing anything, and that would silently turn the gate
  into a rubber stamp. Touch-it-and-you-own-it is the boundary between the two.
  Note the deliberate asymmetry with ACS-200h: the whole-store rule set is not
  waived, only deferred to the protected-branch run.
