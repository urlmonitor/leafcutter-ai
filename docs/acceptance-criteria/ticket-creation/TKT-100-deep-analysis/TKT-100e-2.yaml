criteria: |
  Given the PO agent has produced an L0 AC with id "TKT-100",
  When it decomposes the L0 into L1 feature behaviors,
  Then it produces between 3 and 7 L1 ACs (inclusive),
  And each L1 AC has exactly one assigned_agent value
    selected from the agent_registry.json entries where is_ticket_phase: true,
  And each L1 AC has depends_on containing at minimum the parent L0 AC ID,
  And the union of all L1 ACs covers the full scope of the L0 outcome
    (no L0 behavior is left unaddressed by any L1).
