id: INF-500
title: "You can see what happened and why — retrospectives and analysis are never blocked by tooling gaps"
component: infrastructure
level: L0
status: active
work_status: todo
criteria: |
  Operational visibility that works even when the project has been reorganised.

  After a drive completes, you can always answer "what happened and why?"
  The retrospective pipeline resolves facts correctly even after epic folders
  have been moved to their archive location. The feedback analysis pipeline
  turns accumulated agent observations into a prioritised, actionable
  summary on demand — without waiting for a full epic lifecycle to complete.
  Tooling gaps never force you to reconstruct history manually.
