assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Define the bare case precisely: a workspace where 'python scripts/build.py --target-dir .' has never run — no .leafcutter/ directory and no scripts/commit_guardian/ deployed copy, only templates/scripts/commit_guardian/. This is DISTINCT from a built-but-incomplete workspace where the layout exists and one artifact is absent; the classifier must discriminate on the presence of the LAYOUT, not on the absence of whichever single file was looked up first."
  - "Message wording is a criterion, not polish. It names the actionable cause — the workspace has not been built, and the single command that fixes it ('python scripts/build.py --target-dir <workspace>', or ./build-self.sh in the package's own workspace) — instead of the internal symptom 'ac_parent_id.py not found via package import, script-relative, or project-root walk'."
  - "Which of the two acceptable outcomes occurs must be READ FROM the recorded cannot-run disposition for check-ac-parent-covered-by (GE-120a-2), not decided by where resolution happened to fail. Two different resolution failures under the same disposition must produce the same outcome; if they do not, the disposition is decoration."
  - "An ordinary clean pass is FORBIDDEN in this state under either disposition. This is the seam between the two L1s: without this clause an implementer can satisfy GE-120b-1 by making resolution succeed in the linked and buildable cases while leaving the bare case exiting 0 exactly as before, with both parent ACs' letter met."
  - "Share the cause-detection helper with GE-120d-2-i, which draws the same never-built vs built-but-incomplete line on the set-up side. Two independent classifiers for one distinction will drift."
  - "ADR-001 deployed/template parity: edit templates/scripts/commit_guardian/ then run 'python scripts/build.py --target-dir .'; scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ must match afterwards."
test_spec:
  - name: test_ge120b1i_never_built_copy_does_not_report_clean_pass
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Working copy with no deployed and no built layout, 6 violating staged files: the result is blocked or could-not-check, never an ordinary clean pass."
  - name: test_ge120b1i_outcome_follows_the_recorded_disposition
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Which of the two acceptable outcomes occurs changes when the recorded cannot-run disposition changes, and not otherwise."
  - name: test_ge120b1i_message_names_unbuilt_workspace_not_missing_module
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The output names the unbuilt workspace and the resolving command rather than an internal module import failure."
test_rationale: "The condition must be a genuinely never-built working copy. Deleting one file from an otherwise built layout exercises the built-but-incomplete case, which this AC exists to distinguish FROM — a test built that way would pass while the never-built path still exits 0. The run must also be out of process so the source tree cannot silently supply the missing prerequisite."
delivers_to: null
expects_from:
  ac_id: GE-120a-2
  contract: "The recorded cannot-run disposition for this check, which selects between the two acceptable outcomes."
