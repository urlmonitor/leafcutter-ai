notes: |
  THE ONE-OFF REPAIR OF THE HISTORICAL BACKLOG. Deliberately run, whole-store, both
  directions of rot in a single pass. Keeping the record accurate for work that
  never reaches the ticket pipeline is ACS-1300b, not this. The guarantees that
  make this repair safe to run are ACS-1300c — decompose them there, and do not
  duplicate them here.

  THE JOIN IS EXACT AND MECHANICAL. Match on the `# covers: <id>` tag, id to id.
  No text similarity, no keyword heuristics, no ticket-body matching. This is the
  specific line that made ACD-800 the wrong parent, so it must not drift back
  toward heuristics at L2 — an inexact join writes false evidence, which is worse
  than the missing evidence it replaces.

  WHAT THIS L1 MOVES, CORRECTED 2026-09-01 — IT IS TRACEABILITY AND REPORTING, AND
  IT UNBLOCKS NOTHING. Restoring a coverage link does not change mark-done
  eligibility and never did: verify_done_eligible resolves a record's proof from
  its direct `# covers:` tag first and reads the coverage list only on the
  composite path, and every rotted record has a direct tag by construction.
  Measured: 527 of 549 rotted records are already eligible. No L2 or L3 under this
  L1 may imply that the repair unblocks work. The value is that the store's record
  of what proves what becomes true — for every downstream gate and every human who
  reads the field — not that anything becomes buildable. The narrow case with
  downstream teeth is a PARENT with a stale child list, where the composite path
  does read the field; that is ACS-1300a-3. The 276 records that are eligible today
  and not marked done are a SEPARATE sweep and are not this L1's job.

  BOTH DIRECTIONS BELONG IN THIS ONE L1, and the BA should not re-cut them into
  siblings. They are one traversal of one store producing two kinds of correction,
  and they share a report. Figures re-measured 2026-09-01 (see the L0 notes for
  method, denominator and the correction history): forward rot is the dominant case
  at 549 of 850 tagged-and-resolving records under the FILE-LEVEL rule — 585 under
  the stricter function-level rule, so always say which rule a figure uses — of
  which 376 have an entirely empty list; inverse rot is 9 of the 416 records that
  name a test at all (525 such entries), concentrated in two missing files.

  THE DENOMINATOR ABOVE WAS ITSELF WRONG FOR ONE COMMIT, AND THAT IS THE WHOLE
  POINT OF THIS PARAGRAPH. It read "549 of 856" until 2026-09-01: a re-measured
  NUMERATOR was pasted against a denominator carried over from the earlier count,
  by an author who supplied the new 549 without the 850 that went with it. 850 is
  the tagged-and-resolving population (937 distinct tag ids, of which 850 resolve
  to a record); 856 came from a different count and appears nowhere in the
  re-measurement. The inverse-rot figure was wrong the same way — 521 was an
  entry count standing where a record count belonged.

  Both errors were caught by reading the measurement back against the record,
  not by any gate: no validator compares a figure to its denominator, and both
  passed schema validation and the full pre-commit hook suite. This is the
  identical failure this tree documents two paragraphs down ("244 of 607") and
  the one ACS-1100 exists to prevent, committed inside the record that cites it.
  Anyone amending these figures must restate the denominator in the same edit.

  PROVISIONAL, AND THE POINT GENERALISES: an independent re-measurement was in
  flight when this was authored. No count may be written into a criteria block, at
  any level. A criterion pinned to a number is falsified by the next commit that
  changes the number, and this repo has the hand-typed "244 of 607" in the artifact
  map as a live example of exactly that rot (see ACS-1100's notes).

  DOCUMENTATION: `[how-to]`. This is a repair a person runs deliberately against
  the whole store; the how-to is what makes it runnable by someone who did not
  build it. No sequence-diagram — it is one pass over one store, not a multi-actor
  flow. No component-diagram — it is a repair script, not a new architectural
  layer.
