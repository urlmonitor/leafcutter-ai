criteria: |
  Repeat questions are found in past decisions and run history for your review.

  A review of both the decisions you have already published and the recorded
  history of earlier decision runs, including runs that never ended in a
  published decision, finds the questions that keep coming back and offers them
  as candidate categories. The review runs on its own, apart from any decision
  being made, so making a decision never waits on it, and nothing it finds is
  used until a person approves it.
