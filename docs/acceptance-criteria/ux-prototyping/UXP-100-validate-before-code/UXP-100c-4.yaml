title: "Rejection stops the pipeline and records the rejection rationale"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the user reviews a prototype and selects "Reject" with rationale:
    "This feature does not solve the problem I described — the workflow
    is backwards",
  When the rejection is recorded,
  Then the pipeline sets the feature status to "ux-rejected"
  And no implementation work is dispatched for this feature
  And the rejection rationale is stored alongside the prototype artifact
    so the PO can review why the feature was rejected
  And the PO is notified that the feature requires re-framing before
    another prototype can be attempted
