notes: |
  WHY THE OBSERVED DEFECT NEEDS TWO CRITERIA, NOT ONE. The same authoring mistake —
  a note appended to a suppression line — lands in a different field depending on
  whether the author wrote a line-number field. With one, the note joins the
  line-number field (the sibling criterion). Without one, it joins the file path
  (this criterion). A fix that only inspects the line-number field leaves the
  two-field spelling silently broken, and the two-field spelling is the shorter,
  more natural thing to write.

  WHY THE PREDICATE HERE IS DELIBERATELY NARROW. There is no general test for "a
  path that can never match": a suppression may legitimately name a file that does
  not exist yet, or one not in this scan. Rejecting on non-existence would break
  ordinary use. Whitespace followed by the comment marker is the one signal that
  is both specific to the observed mistake and vanishingly unlikely in a real
  path — and the third arm above is the guard that keeps it that narrow.

  REJECT, DO NOT REPAIR. The alternative — stripping the note and honouring the
  entry — was considered and rejected for this iteration: it silently changes what
  the entry means based on a guess, and if the guess is wrong the author is back
  to believing in a suppression that does not do what they think. Warning and
  skipping fails closed, because the author immediately sees the finding they were
  trying to hide. If appended notes are later made a supported part of the grammar,
  that is a change to what is accepted, and this criterion is what it must amend.

  VERIFICATION STANDARD FOR THIS TREE. Exercise every arm with a real temporary
  allowlist file and real files on disk through the multi-file entry point; a
  sibling audit in this family found criteria verified only against the matcher in
  isolation that described unreachable situations. Examples use ordinary source
  filenames, never environment-file names, per the tree-wide authoring constraint.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. Kept at python-coder, complexity M. The
  load-bearing constraint added is that the note signal is evaluated per FIELD
  rather than per spelling: the two-field and three-field cases are one rule seen
  twice, and a fix written per spelling leaves whichever spelling was not enumerated
  silently broken — the exact shape of the defect being closed.
target_epic: EPIC-SuppressionNarrowsNeverDisables
