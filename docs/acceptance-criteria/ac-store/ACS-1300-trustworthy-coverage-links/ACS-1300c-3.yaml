id: ACS-1300c-3
components:
  - ac_store
title: "Evidence the run cannot judge produces a stated abstention, never a silent skip and never a write"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store containing a record whose file cannot be parsed, a coverage tag in the
    test tree naming an id that no record in the store carries, and a record whose
    coverage entry resolves to neither a test path nor a requirement id,
  And, in the same store, a record whose evidence the run can judge and which needs a
    coverage entry restored,
  When the repair tool is invoked out of process with the apply request,
  Then each of the three unjudgeable cases appears in the report as its own abstention,
    naming the record or the tag and stating the reason it could not be judged,
  And none of the three has its file changed by the run,
  And the run does not stop at the first of them: all three are reported by that single
    invocation,
  And the fourth record was repaired in that same invocation, so abstaining is a decision
    this run reached rather than the whole of what it did,
  And the run's outcome reports that abstentions occurred rather than reporting a clean
    result, so a run that could not judge part of the store is distinguishable from one
    that found nothing to judge,
  And the count of records the run examined includes the three it abstained on, so an
    abstention subtracts from what was decided and never from what was looked at.
depends_on:
  - ACS-1300c
