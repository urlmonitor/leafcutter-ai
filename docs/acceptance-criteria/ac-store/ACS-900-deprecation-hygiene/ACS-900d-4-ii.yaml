assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "New structural rule: for any staged record whose status is 'superseded_by' or 'superseded', check_ac_schema.py must refuse when superseded_by is null or empty ('a superseded record must name at least one successor'), and must refuse once for each successor id that is not in the store, naming both the record id and the missing successor id. No such check exists today (verified by grep of templates/scripts/commit_guardian/). It belongs in the schema gate because it is a structural rule, not a forward-build rule."
  - "Successor existence must be checked against the WHOLE AC store, using the same store-id set the retired predicate uses (one walk or one index load per hook run). A successor that already exists on main and is not restaged must resolve."
  - "This structural rule and the retired predicate from ACS-900d-4 must agree. Whenever this rule refuses a record, the predicate returns not-retired for it, so check-done-proof also reports the missing covering test in the same run. Both messages appear. Neither may hide the other."
  - "Parent-to-child links: check_ac_parent_covered_by.py must apply to retired records exactly as to active ones. It must NOT consult the retired predicate. Leaving it unchanged satisfies this, but a test must pin it."
  - "Schema shape: both enforcement points must apply unchanged to retired records. These are the jsonschema path (config/ac_store_schema.json) with the validate_manually fallback in _ac_schema_validators.py, and scripts/ac_store/validate_ac_schema.py (the required 'AC store valid' CI check). Neither may consult the retired predicate."
  - "Known enforcement-point disagreement to reconcile, not to work around: config/ac_store_schema.json accepts status 'superseded', but _ac_schema_validators.VALID_STATUSES and validate_ac_schema._STATUS_VALUES do not. So a status 'superseded' record is refused for shape by the manual and CI paths even though the predicate counts it as retired. Fix the two constants so all three agree with ac-schema.md, which says 'superseded' is accepted for older records. Do not narrow the predicate instead."
  - "check_ac_limits.py has its own _SUPERSEDED_STATUSES set, which leaves superseded children out of the child cap. A record that fails the structural rule above is not retired, so this module should use the shared predicate. Otherwise a bogus supersession still escapes the cap. If the coder leaves it as is, record the reason in the ticket."
delivers_to: null
expects_from:
  ac_id: ACS-900d-4
  contract: "The shared pure predicate, which returns not-retired when superseded_by is null or empty, or when any successor id is missing from the store-id set; plus that same store-id set, reused for the structural successor check"
