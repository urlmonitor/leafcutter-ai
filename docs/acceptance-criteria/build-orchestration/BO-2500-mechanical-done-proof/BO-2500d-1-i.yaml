notes: |
  This is the criterion that stops the reconciliation from becoming a slide. Permitting a
  veto-only reviewer is a narrow concession, and narrow concessions widen: the next step
  is a reviewer whose approval is read at the mark-done site, and at that point BO-2500's
  whole guarantee is gone and nothing in the store would have objected. So the guard was
  re-aimed rather than retired.

  The acceptance scenario is load-bearing, not politeness. A guard phrased only as "reject
  changes involving a reviewer" would reject the lane as it ships today, and a guard that
  rejects the status quo gets relaxed, disabled or routed around within one drive. The
  distinction the guard must actually make is between a verdict that removes members from
  the delivered set and a verdict that adds them.

