criteria: |
  Given the staged file `storefront-vue/src/pages/PlantListingPage.vue` whose
    page root element is
    `<main class="listing" data-screen="plant-listing" data-ac="UXP-100d-2">`
  And a design registered under the name `plant-listing` exists in the
    product-truth store
  When the chain reader evaluates the file
  Then the file is recorded as realising the design `plant-listing`
  And the recorded chain runs from the built file through that design to the
    flow step that uses it and on to the criteria the step implements

  Given a staged page whose page root carries `data-screen="plant-lsting"`
  And no design is registered under that name
  When the chain reader evaluates the file
  Then a finding is reported naming the unresolvable design name
  And the finding is of the same kind as an unresolvable criterion id — a stated
    name that resolves to nothing — and is not a silent pass
