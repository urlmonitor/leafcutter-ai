notes: |
  Inherited and not repealed: the component's fail-open convention (an internal error in
  the script itself warns and exits 0) still applies to bugs in the gate. Content that
  cannot be tokenized is not a bug in the gate; it is a measurement that did not happen,
  and GE-120's line holds: reporting success for a check that never ran is not permitted.
