    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    done_proof_js_covers_linkage:
      type: object
      description: "Covers-tag linkage that discovers '// covers:<id>' tags in .ts/.tsx front-end tests and links each to its active AC id, produced by the SAME shared extract_covers_tag routine that discovers Python '# covers:<id>' tags (one seam, not a second parser)."
  reference_file_path: "scripts/ac_store/test_enforcement.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Extend the SAME single tag-extraction routine (extract_covers_tag in scripts/ac_store/test_enforcement.py) that discovers Python '# covers:<id>' tags to also match '// covers:<id>' in .ts/.tsx files — do NOT add a second parser, so JS and Python covers-linkage semantics cannot drift apart."
    - "The '// covers:<id>' tag must be discovered from .ts and .tsx front-end test files and linked to the referenced AC id, mirroring the Python '# covers:' linkage of BO-2500a-1."
    - "Extraction must be idempotent for a given test tree and must not alter the existing Python '# covers:' extraction behavior."
    - "Must complete within the fast-lane latency budget (well under 2s for a typical batch of ACs)."
delivers_to:
  agent: python-coder
  contract: "JS covers-tag linkage { ac_id: [test_location, ...] } produced by the shared extract_covers_tag seam extended for '// covers:' in .ts/.tsx; consumed by the JS eligibility verdict (BO-2500e-2), the fail-closed verdict (BO-2500e-3), and end-to-end mark-done (BO-2500e-4)."
expects_from: null
test_spec:
  - name: test_js_covers_tag_discovered_and_linked
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A '// covers:<id>' tag in a .ts/.tsx test for an active AC id is discovered and linked to that AC."
  - name: test_js_and_python_covers_use_same_seam
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "JS '// covers:' and Python '# covers:' linkage are produced by the same extract_covers_tag routine (one shared seam, not a second parser)."
