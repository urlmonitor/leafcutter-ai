test_rationale: "A direct-import unit test over a new helper predicate would prove the rule's arithmetic while leaving unproven the only thing that matters — that verify_done_eligible actually REACHES the new condition on a real evaluation. That is precisely the defect this tree exists to close: the fast-lane functions had passing direct-import tests and were reached by nothing. Each test therefore drives the real verify_done_eligible() over a fixture AC store and a fixture unit with a genuine argparse main(), and asserts the verdict the oracle returned. The eligible and ineligible cases are asserted in the same run so a reject-everything implementation cannot pass."
