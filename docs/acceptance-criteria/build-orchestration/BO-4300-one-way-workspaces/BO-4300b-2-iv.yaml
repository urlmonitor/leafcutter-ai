notes: |
  DIAGraph's install must go through scripts/rebuild_leafcutter.py, which runs build.py and then
  re-applies two DIAGraph-owned commit-guardian hook registrations a bare build.py drops (DIAGraph
  ADR-013). Its declaration would be:
  ["{python}", "scripts/rebuild_leafcutter.py", "--target-dir", "{workspace}", "--config-path", "{config_path}"].
