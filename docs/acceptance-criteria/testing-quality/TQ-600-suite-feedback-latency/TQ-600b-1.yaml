notes: |
  THIS IS THE CRITERION THAT DECIDES WHETHER PARALLELISM MAY SHIP AT ALL. The
  parent L1's boundary is explicit that "the suite is faster with several workers"
  is not sufficient, and the reason is not pedantry: a parallel run that is fast
  and wrong is strictly worse than a slow correct one, because it retires the
  safety net while appearing to improve it. Speed is the motivation; equivalence is
  the acceptance criterion.

  THE THIRD CLAUSE NAMES THE CHEAP WRONG CHECK EXPLICITLY. Comparing exit statuses
  is the implementation somebody will reach for first, and against this suite it is
  vacuous: the measured baseline already exits non-zero (2 failures, 96 collection
  errors), so a parallel run that exits non-zero for a hundred new collision
  failures compares equal to it. Comparing pass counts is the second-cheapest wrong
  check and cancels out in exactly the way TQ-600a-4's notes describe.

  THE COMPARED-COUNT CLAUSE IS THE ANTI-VACUITY CONTROL. A comparison over two
  empty result sets is equal, exits clean, and proves nothing — the same shape as
  the AC-store validator that globbed zero files and exited 0 for eight days.

  WHAT THIS AC DOES NOT DECIDE: how many workers, which distribution strategy, or
  which runner. Those are it-po decisions, and TQ-600b-5 covers the separate
  question of the runner being installed and actually used.
