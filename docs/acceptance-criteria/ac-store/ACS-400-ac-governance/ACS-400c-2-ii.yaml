assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The baseline is a merge parent ONLY when that parent's committed blob is identical to the staged blob. Anything less exact would excuse a real edit."
  - "Comparison is against the INDEX (git diff --cached), never the working tree, which may hold edits that are not part of this commit."
  - "Outside a merge the parent list is [HEAD] alone, so the resolved baseline is HEAD and behaviour is unchanged. This record must not relax any ordinary commit."
  - "A comparison that cannot be performed (subprocess failure, unreadable parent set) resolves to HEAD -- the strict answer. Never excuse a path because the check failed."
  - "Merge-parent discovery reuses _file_size_ratchet.resolve_parent_revisions, which reads EVERY line of MERGE_HEAD (octopus-safe) and fails closed. A second implementation would be free to get both wrong."
delivers_to: null
expects_from:
  ac_id: ACS-400c-2
