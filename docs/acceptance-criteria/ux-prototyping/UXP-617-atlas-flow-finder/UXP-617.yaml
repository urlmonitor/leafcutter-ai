notes: |
  PRODUCT TRUTH IS ALREADY APPROVED. The owner approved this feature at all three
  product-truth gates: mock data leafcutter/atlas-flows v4 (bb878207a), mockups
  atlas-flows-finder (new) and atlas-flows-canonical-url v2 (cd4359cba), and flow
  leafcutter/explore-flows-in-atlas v6 (1fabfee90). The flow's eight new steps and
  five new branches each carry an acceptance_scenario. Those scenarios are the
  intended source for this L1's L2 children; their implements lists are empty
  until the L2s exist.

  OWNER DECISIONS, FIXED (2026-10-12): Jev is its own actor value, never shown as
  "AI agent". Bare /flows is the finder overview, not a drawn flow.

  PARENT CHOICE. Placed directly under UXP-490 rather than under UXP-591, which
  already has five L2s. The finder is a separate promise: finding the right flow,
  where UXP-591 is about exploring one flow once you have it.

  SUPERSESSION THE BA MUST RESOLVE. Two approved, not-yet-built L2/L3s under
  UXP-591 contradict the owner's decisions:
  - UXP-591-1-i says bare /flows opens the default entry flow. The finder
    overview replaces that.
  - UXP-591-5-iii says a filter change that excludes the drawn flow re-picks a
    new flow. This contradicts "a filter change never swaps the drawn flow".
  Both are readiness approved and work_status todo. They must be amended or
  superseded before either side is built. Otherwise /fast-lane-build could ship
  behaviour the owner has already rejected.

  documentation_triggers [how-to, reference-doc]: a how-to, because a person
  needs to learn the search, the facets and shareable links. A reference doc,
  because the address parameters (q, actor= with stored values such as human,
  llm and jev, io=gap and the rest) store values, not labels, and a shared link depends on them staying
  stable.
