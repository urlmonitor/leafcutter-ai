assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "Applicability is determined by whether the ticket's changed-file set includes any frontend surface; an empty frontend set yields a skipped (not failed, not passed) outcome."
  - "A skipped smoke check must be distinguishable in the sign-off record from a passed one, so an auditor can tell 'rendered clean' apart from 'nothing to render'."
