    description: "A done L2 and a done L3 with no covers tag each still produce a violation carrying the existing \"no '# covers: <id>' or '// covers: <id>' tag found anywhere under <test_root>\" reason string — the leaf path is provably unchanged."
    covers:
      - BO-2500b-1-ii
test_rationale: |
  A direct-import unit test over a helper would not be sufficient. The defect is that
  check_staged_done_proofs has no notion of level at all, so the fix must be observed
  through the real entry point against real on-disk AC YAML records and a real test tree
  containing real covers tags — the same artifacts the hook reads at commit time. The
  three tests are deliberately a triad rather than one happy path: the pass case alone
  could be satisfied by skipping composites unconditionally, which is exactly the
  falsely-done-composite hole this repo has 20 recorded instances of, so the
  unproven-child case is what makes the fix honest. The leaf case is a regression pin on
  a required CI gate: it asserts the existing reason string verbatim, so any change that
  loosens the leaf requirement while making composites pass is caught.
