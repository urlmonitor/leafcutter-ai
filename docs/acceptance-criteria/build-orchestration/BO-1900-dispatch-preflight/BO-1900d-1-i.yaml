readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a dispatch payload that omits a required allowlisted pointer (for example no
    ticket_path) or supplies an empty value for one,
  When preflight validates the payload before spawn,
  Then the payload is held back,
  And the reason names the missing or empty required pointer,
  And no phase agent is spawned.
