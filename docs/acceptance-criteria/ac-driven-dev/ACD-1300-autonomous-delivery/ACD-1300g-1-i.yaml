it_requirements:
- Separate endpoint availability from full harness/tool capability; an empty tool result or claimed check
  without execution evidence cannot satisfy the contract.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300g-1 (data handoff, not an additional build-order prerequisite): ACEvidence
  {run_id:string, feature_id:string, ac_id:string, obligation_ids:string[], source_revisions:object, workspace_id:string,
  head_sha:string, changed_files:string[], checks:[{command:string, exit_code:integer, evidence_ref:string}],
  outcome:passed|blocked|failed}.'
