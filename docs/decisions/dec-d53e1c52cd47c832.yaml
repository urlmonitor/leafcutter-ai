decision_type: design
question: 'Decide what to build next for the Leafcutter decision kernel so that it is wired into the real development workflow
  and has direct impact. Today nothing outside kernel/ and the /leafcutter skill calls the kernel, and docs/decisions holds
  one record, while design decisions answered by the user in Claude Code sessions are not recorded anywhere the kernel can
  reuse. Options: run trace analyzers over the recent kernel traces; file human decisions made in Claude Code sessions as
  decision records; have agents consult the kernel for precedent before asking the user a design question, applying standing
  policies such as POL-GIT-001 directly; or another option grounded in the repository.'
