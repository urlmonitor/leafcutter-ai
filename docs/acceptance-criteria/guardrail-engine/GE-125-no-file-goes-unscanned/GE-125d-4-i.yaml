notes: |
  ANTI-PRECEDENT, LOAD-BEARING AND ALREADY CITED TWICE IN THIS COMPONENT. A
  guard here is documented as automatically dispatching a specialist and does
  not — its remediation path is a placeholder that always reports success. The
  recorded lesson is that a documented-but-dead promise is worse than a missing
  one, because authors believe they are covered. A self-description that is a
  hand-written list sitting beside the real decision is the same failure with a
  slower fuse: correct on the day it is written, silently wrong afterwards.

  WHY THE THIRD ARM IS PHRASED AS IT IS. The natural way to verify "the answer
  follows the decision" is to read the code and see that both come from one
  place. That is exactly the verification method this whole goal exists to
  replace — the original exemption was perfectly visible to anyone reading the
  source, and that was not enough. Both halves must be executed: ask for the
  answer, then check a path, and compare.

  NO FIXTURE UNDER A REDUCED LOCATION IS NEEDED HERE. The subject is the answer,
  not a scan. Where a path is needed to confirm the classification, it should be
  an ordinary source path inside the throwaway repository that is made reduced
  or not reduced by the change under test, so the arm measures the change rather
  than the pre-existing set.

  IT-PO NOTE, 2026-08-24 — WHERE THE ONE PLACE IS TODAY. The decision is the
  _PROSE_FILE_PREFIXES tuple read by _is_prose_exempt in
  templates/scripts/commit_guardian/check_secrets.py. Naming it makes "exactly
  one definition" a checkable claim rather than a principle, and it tells
  whoever implements GE-125d-4 which object the answer must be derived from. If
  GE-125a, GE-125b or GE-125c relocates or restructures that definition, this
  record still holds unchanged — the requirement is one definition with two
  readers, not this particular tuple.
