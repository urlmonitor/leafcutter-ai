criteria: |
  Given a legacy fat ticket that embeds its full spec in the ticket body and has no
    resolvable source_ac,
  When the same resolver used by phase agents and gates runs,
  Then the spec is returned from the ticket body via the fallback path,
  And the resolver does not error solely because the store lookup missed.
