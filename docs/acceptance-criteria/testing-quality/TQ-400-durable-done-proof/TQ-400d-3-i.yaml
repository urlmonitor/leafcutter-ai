notes: |
  The product owner named this explicitly: "Nothing is quietly exempted just for
  being old." It is a real and attractive shortcut — the pile is large (259
  records) and mostly historical, so a cut-off looks like pragmatism. It is
  precisely the grandfathering the L0 exists to prevent, and the sharpest evidence
  against it is that the canonical lapse case (BO-2500d-2, see TQ-400a-1-i) was an
  OLD record: the age of a record says nothing about whether its criterion still
  holds.

  Note the contrast with the change-scoped CI check, which legitimately ignores
  pre-existing records so it can be a required gate without failing on history
  (check_changed_done_acs, check_done_proof.py:476-489). That scoping is correct
  for a merge gate and wrong for this sweep — the records it skips are exactly the
  ones TQ-400 exists to examine.

  Distinguish showing age from acting on it: age is genuinely useful triage
  context, so the criterion permits displaying it and forbids only its use as an
  outcome.

  IT-PO ENRICHMENT NOTE (2026-08-17). The criteria state a prohibition, and a
  prohibition that nothing attempts is unfalsifiable — an implementation carrying
  an age-based clearing path passes "both records appear in the pile" trivially.
  test_spec therefore makes the attempt: clearing the old record without a
  decision must be refused identically to clearing the new one, through the same
  entry point TQ-400d-3 guards. The date-shift invariance test is the companion
  control for a cut-off that every fixture happens to sit on one side of.
