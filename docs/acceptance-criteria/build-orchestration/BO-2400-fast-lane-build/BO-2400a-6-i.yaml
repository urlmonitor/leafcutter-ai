criteria: |
  Given the fast-lane how-to after BO-2400f-5-i, BO-2400f-5-iii and BO-2400f-3-ii are
    built,
  When an operator reads it,
  Then it says that every command step of a run — resolve, producibility, claim, context
    bundle, release, and any changelog, commit, push or pull-request step an agent is
    asked to do — is run by the command-step-runner agent, and that test-writer, coder
    and pr-reviewer stay on their own agents,
  And it describes the declined-step halt: what the operator sees (the step, the agent
    asked, and the agent's quoted reason), how it differs from a claim-contention halt
    and from a refusal to build an unproducible set, and that a command which ran and
    failed is reported as that step's failure and not as a decline,
  And it gives the remedy for a declined step — check which agent the step was asked of
    and that its registry entry permits the step — and states that a declined step never
    means another run holds the set, so the operator does not go looking for one,
  And it says what happens to claims when a step is declined: nothing is claimed if the
    decline comes before the claim, and the claim is released if it comes after, so a
    retry for the same criterion is not blocked,
  And it says a run may be launched from any checkout of the repository, including the
    main checkout and a sibling worktree, and that every step is told the run's own
    workspace by location, branch and criterion id.

  Given the same how-to,
  When it is compared with the run's actual halt kinds,
  Then every halt kind the how-to names exists in the lane, and the declined-step halt is
    among them.
