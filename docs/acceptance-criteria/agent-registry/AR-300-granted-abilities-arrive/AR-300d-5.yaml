change_target: code
risk_surface: contract_boundary
it_requirements:
  - "The section is derived afresh from each agent's own `spawn_allowlist` declaration on every compile; nothing is patched into a previously compiled prompt. Revocation is proved over an output tree left by an earlier build: the stale compiled prompt is overwritten and the removed sub-agent appears nowhere in it."
  - "Placement is declaration-driven (the same append path as the skills section, scripts/agent_skills_declaration.py append_declared_skills is the precedent). The marker-gated `{{my_spawn_allowlist}}` placement in scripts/template_compiler.py must not be the route; if any of it remains, it must not be what delivers the section. No marker is required in any body."
  - "The NEW-AGENT clause: a new template with only a `spawn_allowlist` declaration receives its section on first compile with no registry entry, no include list and no body marker. The section's optional Role/Tier columns (AR-300a-5) must therefore tolerate a missing registry row -- a missing row must not drop the sub-agent or fail the compile."
  - "Blast radius: the computation is keyed per agent; no shared structure (e.g. a union of all agents' allowlists, or a single table computed once) may feed any agent's section."
  - "Tests compile in-process (build_agents into a temp output root) or mutate a COPY of the package; they must not mutate the shared reference layout and must not spawn their own build.py."
test_spec:
  - name: test_sub_agent_added_to_declaration_appears_on_next_compile
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Adding one sub-agent to an existing agent's declaration only makes its compiled prompt (both roots) name it beside the ones already named."
  - name: test_sub_agent_removed_from_declaration_vanishes_over_a_stale_compiled_tree
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Removing one sub-agent from the declaration only, then compiling over the previous output, leaves no mention of it anywhere in that agent's compiled prompt."
    must_catch:
      - "the compiler patches or appends into the existing compiled prompt instead of regenerating it"
  - name: test_no_other_agents_compiled_prompt_changes_on_add_or_revoke
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Every other compiled prompt, including another agent permitted the same sub-agent, is byte-identical across the add and the revoke."
    must_catch:
      - "the section is computed from a shared structure rather than per agent"
  - name: test_new_agent_with_only_a_declaration_receives_its_section_on_first_compile
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: seam
    description: "A new template with a `spawn_allowlist` declaration, no registry entry and no body marker gets the section on its first compile."
test_rationale: >-
  Additive clauses are satisfied by an accumulating design; only revocation over a
  stale tree distinguishes a derived section, hence its must_catch. The blast-radius
  descriptor checks the agents nobody looked at, where a shared-structure design
  shows. The new-agent descriptor is the one the 'marker per template' cheap fix
  fails.
