criteria: |
  Each AC-authoring agent (PO v3, BA v3, IT PO v3) queries the cross-surface
  knowledge graph via the knowledge-query skill during its knowledge-acquisition
  phase, before producing or enriching any AC YAML. The query results inform
  deduplication checks, cross-component awareness, and agent/skill discovery
  so that authoring decisions are grounded in the full project context rather
  than limited to the files each agent reads directly.
