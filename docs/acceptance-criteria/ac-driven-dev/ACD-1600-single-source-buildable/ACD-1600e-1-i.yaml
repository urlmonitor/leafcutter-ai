criteria: |
  Given an AC whose Given references product or runtime state, for example "Given a ticket carries source_ac",
  When the authoring-quality check evaluates it,
  Then it is NOT flagged as an authoring-pipeline precondition,
  And the check distinguishes planning-pipeline framing (authoring roles, readiness state, enrichment steps)
    from legitimate runtime or domain preconditions.
