notes: |
  Satisfies BO-300d's documentation_triggers: [reference-doc].

  The second scenario is what makes this checkable rather than a request for prose:
  the documented taxonomy is compared against what a run actually emits in both
  directions, so an entry describing an intended vocabulary fails.

  The third scenario matters more than it looks: the whole value of BO-300d-4's
  control case is that a clean report MEANS something. If the reference entry does
  not say what its absence asserts, the operator has to guess, and the control case
  buys nothing.

  assigned_agent deliberately unset — the reference surface belongs to the IT
  Product Owner's assignment pass.
