id: BO-520-1
title: "Ticket frontmatter supports a change_type field with a defined enum"
component: build-orchestration
level: L2
status: superseded
req_status: superseded
work_status: todo
criteria: |
  Given a ticket markdown file under tickets/,
  When its YAML frontmatter is parsed,
  Then it may contain a "change_type" field
  And valid values for change_type are exactly:
    flow_change, data_change, doc_change, prompt_change, config_change
  And the ticket_frontmatter_guard hook validates change_type against this enum
    when the field is present

  Given the ticket-authoring skill produces a new ticket file,
  When the skill writes frontmatter,
  Then it includes a change_type field with a value from the enum
  And the value is positioned after the "priority" field and before "depends_on"
    in the frontmatter key order
depends_on: [BO-520]
