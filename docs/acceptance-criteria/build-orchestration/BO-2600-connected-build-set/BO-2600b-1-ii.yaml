change_target: pipeline
risk_surface: internal
notes: |
  This is the regression the always-exclude decision could plausibly introduce: a run that
  used to build five criteria now builds none, and a bare "nothing to build" message would
  leave the operator unable to tell whether the work is finished or the new scope rule
  removed it. Stating the exclusion on the empty path costs one sentence and is the
  difference between a tight scope the operator trusts and one they route around.
