id: BO-2400f-7-viii
components:
  - build_orchestration
title: "The claim command tells 'held' apart from every other failure by its exit status, and names what is held"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an acceptance-criteria store in which the target XY-100a-1 reads work_status
    in_progress,
  When the claim command is run for a set whose target is XY-100a-1,
  Then it changes no acceptance criterion,
  And it ends with a non-success exit status reserved for "held", which it ends with on no
    other outcome,
  And its standard output carries its outcome: nothing claimed, XY-100a-1 named as held,
    and the target marked refused.

  Given a set in which every member, the target included, already reads in_progress,
  When the claim command runs,
  Then it ends with the same "held" exit status and names every member as held.

  Given the claim command fails for any other reason — an id the store does not contain,
    a store it cannot read, or an unexpected error,
  When it ends,
  Then its exit status is non-success and is not the "held" status.

  Given a set in which only non-target members read in_progress and the rest read todo,
  When the claim command runs,
  Then it ends in success, claims the todo members and names the in_progress ones as
    excluded, unchanged from BO-2400f-8-i.
