notes: |
  Decomposed from ACS-800a (stable opaque UID scheme). Defines the UID FORMAT and
  ASSIGNMENT rule: sequential allocation from one store-wide counter, opaque value
  that carries no hierarchy meaning, allocated at creation. The opaque UID is the
  NEW identity field that ACS-800b's metadata hierarchy points at; it is distinct
  from today's position-encoded id string (e.g. ACS-100h-3). This AC deliberately
  does not pin the textual form of the UID (bare integer vs. zero-padded vs.
  prefixed) — only that it is sequential and opaque; IT-PO/python-coder finalize
  the concrete representation and add the field to config/ac_store_schema.json.
