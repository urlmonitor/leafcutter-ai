criteria: |
  Given the traceability reconciliation guardrail resolves links at two
    granularities (file-path floor and symbol tier)
  When the reference documentation for the guardrail is produced
  Then the reference documents the #symbol anchor syntax for an implemented_by
    entry (path, separator, symbol name) and that an absent or empty anchor means
    file-path-only evaluation
  And it documents the three-tier resolution model: file-path floor, symbol tier
    when an anchor is present and tooling is available, and suggested-new-location
    when a moved symbol can be located
  And it documents the graceful-degradation behavior when the symbol tooling is
    unavailable or the language is unsupported (symbol tier skipped, file-path
    floor still authoritative)
  And it documents that the change kinds reported are deleted, moved, renamed, or
    removed
