criteria: |
  Given the read index is enabled but the on-disk index file is absent, or is present
    but cannot be parsed as a valid index
  When an index-backed read is requested
  Then the knowledge query falls back to a live full parse of every declared surface
  And it returns the same correct nodes and edges the live full parse produces for the
    current tree
  And the read completes with a success result — it neither raises an error to the
    caller nor returns partial or stale data because the index was missing or corrupt
