work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a persona.yaml file that is missing the required "identity" section
  When the persona validation script is run against the file
  Then it exits with a non-zero status
  And the error message names the missing section: "identity"
  And the error message includes the file path that failed validation

  Given a persona.yaml file where the "goals" section is present but empty (null value)
  When the persona validation script is run against the file
  Then it exits with a non-zero status
  And the error message states that "goals" must be a non-empty list
