    relationship: describes
    status: exists
assigned_agent: test-writer
delivers_to: {"agent":"python-coder","contract":"Executable recognition evaluation report: {corpus_version:string,case_count:int,passed:boolean,cases:list[{id,expected,observed,violations}],by_family:dict[family,{precision:number,recall:number,coverage:number}],paired_intent:{baseline,entity_context,caller_context_equal:boolean,model_call_counts}}. Empty cases are invalid; each named negative control must fail. Tests and harness reside in tests/kernel/entity_context/ and the repository's evaluation surface."}
expects_from: {"ac_id":"DK-300e-2","contract":"Executable recognition evaluation report: {corpus_version:string,case_count:int,passed:boolean,cases:list[{id,expected,observed,violations}],by_family:dict[family,{precision:number,recall:number,coverage:number}],paired_intent:{baseline,entity_context,caller_context_equal:boolean,model_call_counts}}. Empty cases are invalid; each named negative control must fail. Tests and harness reside in tests/kernel/entity_context/ and the repository's evaluation surface."}
origin_agent: business-analyst
created: 2026-10-03
amended_by:
  - reason: "IT PO review on 2026-10-03 adds technical contracts and planned test specifications under existing user authorization; readiness is now reviewed. BA criteria, implementation status and historical evidence are preserved."
superseded_by: null
