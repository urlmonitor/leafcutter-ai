id: ACS-1600a
title: "Automation leaves your retired requirements alone"
component: ac-store
components:
  - ac_store
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Only requirements still in force are ever eligible for an automatic change.

  Whatever a tool considers changing is drawn from the requirements the project
  still holds itself to. A requirement that has been retired or replaced is
  outside that set by construction, so retiring a requirement is on its own
  enough to put it beyond the reach of automation — nobody has to remember to
  exclude it, and no later tool inherits the omission.
