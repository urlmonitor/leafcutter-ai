criteria: |
  Given a build for a supported Claude Code runtime where each of the remaining
    primary delivery commands is defined by two source templates:
    - templates/commands/create-ticket.md and templates/workflows/create-ticket.md
    - templates/commands/finalize-feature.md and templates/workflows/finalize-feature.md
  When build.py deploys the command set for the supported runtime,
  Then the deployed commands/create-ticket.md is the workflow-invoking body and
    NOT the prose flow from templates/workflows/create-ticket.md,
  And the deployed commands/finalize-feature.md is the workflow-invoking body and
    NOT the prose flow from templates/workflows/finalize-feature.md.
