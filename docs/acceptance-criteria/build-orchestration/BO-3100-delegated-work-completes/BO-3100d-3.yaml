notes: |
  Satisfies the reference-doc entry in BO-3100d's documentation_triggers.

  The constraint is quoted in the user's own words because every child of BO-3100 is meant to
  be traceable to it, and because its value is that it references no harness version, no fork
  mode and no depth limit — which is exactly why it survives changes to all three.

  THE NEGATIVE CLAUSE IS DELIBERATE. Saying what is true is not enough here: the depth story
  is already believed, is written into two decision records, and will be re-derived by anyone
  who reads them. The documentation has to actively contradict it, not merely omit it.

  THE THIRD SCENARIO TIES THE PROSE TO AN ENFORCED OUTCOME. Guidance that leads an author to
  an arrangement the sweep then rejects is worse than no guidance; making the sweep the
  arbiter means the documentation cannot quietly diverge from what the system permits.

  Sequenced after BO-3100c because the coordinating layer it directs authors to must exist and
  be the only one, and after d-1 because the executable claim-checks are the instrument for
  the second scenario.

  IT-PO ENRICHMENT NOTE (2026-08-26). One requirement is worth stating plainly because it is
  counter-intuitive for a documentation AC: this page must NOT be load-bearing. Its correctness
  is checked, and its guidance is tied to the sweep, but nothing may depend on an author reading
  and obeying it. A page that is the only thing preventing the wrong arrangement is a fourth
  prompt-level rule, and this tree exists because the previous three did not fire.
