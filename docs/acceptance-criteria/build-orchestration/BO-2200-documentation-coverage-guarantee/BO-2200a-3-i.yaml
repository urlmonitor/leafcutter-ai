created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200a.yaml"
criteria: |
  Given the declarative `documentation_gates` policy and the ticket generator building
    the agents map for a leaf AC,
  When the AC's `change_target` is `code` and its `risk_surface` is `cost`,
  Then the generated agents map does NOT include `documentation-expert`
    (the `cost` risk surface is explicitly excluded from the triggering set).
  And when the AC carries neither a `change_target` nor a `risk_surface` field at all
    (an AC that predates the computed-gates classification), the generator completes
    without error and does NOT force `documentation-expert` from the documentation
    policy on the basis of absent classification.
depends_on: [BO-2200a-3]
