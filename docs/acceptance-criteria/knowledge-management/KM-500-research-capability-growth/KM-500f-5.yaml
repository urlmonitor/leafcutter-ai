id: KM-500f-5
title: Select regression and fixture evidence that can distinguish the requested outcomes
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500f
criteria: 'Given an agent asks which regressions and existing fixtures would protect a query-activation change or
  distinguish completed empty results from unsupported source mappings

  When research recommends existing test evidence for that task

  Then each recommended test or fixture is accompanied by the behavior it guards, its source reference and the inspected
  evidence supporting that recommendation

  And any claimed discriminating fixture identifies its seeded facts, expected result, comparison case and actual
  versus simulated boundaries

  And a declaration or filename alone is insufficient to claim a fixture reaches the required branch or catches
  the specified wrong outcome

  And the proposed regression set states the inspected change scope and selection reasons without claiming exhaustive
  or minimal coverage when consumer evidence is incomplete

  And missing test requirements, fixture contents or execution evidence are reported as missing rather than inferred
  from a test name or a done AC

  And missing negative or comparison evidence remains an explicit test-design gap even if the available happy-path
  test passed.

  '
