title: "Agent Protocol specifies standard invocation syntax with keyword and surface parameters"
component: knowledge-management
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the knowledge-query SKILL.md contains an "Agent Protocol" section,
  When a consuming agent reads the Agent Protocol to determine how to invoke
    the knowledge-query script,
  Then the protocol specifies two invocation patterns:
    (a) keyword query: "python scripts/knowledge_query.py --query <term>"
        where <term> is derived from the agent's current context
        (user request keywords, component name, or L1 title),
    (b) surface-scoped query: "python scripts/knowledge_query.py --surface <name>"
        where <name> is one of the valid surface keys from paths.json,
  And the protocol states that agents MUST use the Bash tool to execute
    these commands (not Read or any other tool),
  And the protocol states that the --project-root flag is NOT required
    when the agent's working directory is the project root,
  And the protocol provides at least one concrete example of each
    invocation pattern with realistic parameter values.
