notes: |
  The KI symptom is end-to-end: the agent ran, the submit was refused, the fallback hid it.
  A config-membership assertion alone (INF-100c-5-iv) can pass while the installed copy is
  stale, so this record proves acceptance through the real submission path in a built
  install. The third scenario keeps the fix narrow: registering the gates must not open
  the reviewer-only category to them. Rejection wording is owned by INF-100c-3-i.
