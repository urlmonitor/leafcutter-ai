criteria: |
  Given the automation delivers every unit of work to main through a pull request
  When a reader opens the architecture documentation for build-orchestration PR-native delivery
  Then a sequence diagram shows the actors of the delivery flow (the supervisor, the commit phase, the pull-request phase, the remote, and main)
  And the diagram shows the ordered interactions: commit onto a working branch, push the branch, open or update the pull request, merge the pull request into main
  And the diagram shows that no interaction pushes unit-of-work commits directly to main
