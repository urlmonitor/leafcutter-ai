id: BP-100f-4
components:
  - build_pipeline
title: "Build status output never crashes on a console whose encoding cannot represent the message"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given build.py runs on a console whose stdout encoding cannot represent a
    character in a status line (e.g. a Windows cp1252 console and the ✓ glyph
    printed by build_colors.success() after the manifest write)
  When  any build_colors print helper (success, warn, error, info, dry_run,
    heading) emits that line
  Then  the line is still written, with unrepresentable characters replaced,
    and the build continues to completion
  And   the bug symptom ("UnicodeEncodeError: 'charmap' codec can't encode
    character '✓'") must not occur
  And   on a UTF-8 capable console the original characters are printed unchanged
depends_on: [BP-100f]
