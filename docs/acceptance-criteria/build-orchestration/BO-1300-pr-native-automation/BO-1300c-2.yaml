it_requirements:
  - "Surface is agent/skill prose: the 'never bypass' constraints already live in templates/agents/commit.md (refuses --no-verify) and templates/agents/pull-request.md (no force-push to main). MODIFY those bodies + the building-epics merge-gate path so a branch-protection rejection on `gh pr merge` is surfaced as a blocker and explicitly forbids retry with `--admin`, verification-disabling flags, or any force route. This is prompt/skill-body wording — llm-expert."
  - "Forbid specific bypass routes in prose: no `gh pr merge --admin`, no `--no-verify`-equivalent, no `git push --force` to the default branch, no direct push to main (backstopped by the BO-1300a-4 pre-push hook)."
  - "The blocker must state branch protection rejected the merge AND why (carry the gh error reason through to the operator), and leave the PR unmerged."
  - "Must reuse the existing structured blocker/escalation schema in building-epics; do not invent a new channel."
