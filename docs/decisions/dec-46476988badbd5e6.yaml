      - ev-f62f8d6fb5b8983b
      - ev-c89c04b599fc44df
      - ev-78b1e123e612fb18
      - ev-e76679f1c524e356
  - id: crit.message_actionable
    question: Does the report name every AC on the cycle (including ACs outside the set it passes through) and, for each edge,
      its field (depends_on or expects_from) and whether it is a structural-parent link?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-78b1e123e612fb18
      - ev-02378d4a5e97cc0c
      - ev-c89c04b599fc44df
      - ev-abafb7bd6177ae3c
      - ev-8a9d8f97eea58b07
  - id: crit.within_ticket_scope
    question: Can ticket 08 land with this option without editing any AC record (AC edits go to their own ticket)?
    priority: supporting
    kind: design_judgement
    evidence_ids:
