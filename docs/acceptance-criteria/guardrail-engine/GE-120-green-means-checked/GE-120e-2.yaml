notes: |
  THE SURFACE-SIZING AC, and the reason this L1 is not two point patches. The PO named two
  checks and then explicitly told the BA to enumerate from the manifest instead — this AC is
  that instruction made mechanical. Fixing the two observed checks leaves every other
  self-deriving check blaming the wrong author, and leaves the next one to inherit the flaw.

  WHY THE SOURCE IS RECORDED RATHER THAN DETECTED. The obvious shortcut is to treat
  pass_filenames: false as "derives its own diff". It is not: the manifest carries fifty-two
  entries with pass_filenames: false and only a handful of them compute a diff at all — most
  simply scan the tree. A predicate built on pass_filenames would sweep in dozens of checks
  that have no change set to narrow and would still miss a check that is handed filenames
  and derives a diff anyway. Recording the source on the entry is the same move GE-120a-2
  makes for the cannot-run disposition, for the same reason: a family-wide property that is
  inferred rather than declared is wrong for some member on day one.

  DO NOT hard-code the manifest's current entry count anywhere. It was 54 when this AC was
  written and it moves with every addition; a test pinned to the number fails for the wrong
  reason and gets edited to match rather than investigated.

  RELATION TO GE-120c-3 — same shape, different registry question, no overlap. GE-120c-3
  asks whether every manifest check is EXERCISED by the harness. This one asks where each
  manifest check gets its CHANGE SET. Reuse GE-120c-3's manifest-reading callable rather
  than writing a second manifest reader; two readers will disagree and the disagreement will
  be settled by whichever is quieter.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
