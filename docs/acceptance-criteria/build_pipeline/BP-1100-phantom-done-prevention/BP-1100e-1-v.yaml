created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a done ticket whose frontmatter serializes files_touched (or out_of_scope)
    as a PyYAML-default column-0 block sequence (dashes at column 0, no indentation),
    as an indented block sequence, or as an inline flow-sequence files_touched: [a, b]
  And any declared entry may be single- or double-quoted and may carry a trailing
    inline YAML comment
  When the pre-done reconciliation parses the ticket's declared scope
  Then it extracts the full set of declared paths from whichever serialization form the
    ticket actually uses — it does NOT silently return an empty declared set on a real
    column-0 ticket (which would make the check a no-op) nor on a flow-sequence ticket
  And it strips surrounding quotes and trailing inline comments from each entry so the
    stored path matches the path reported by the diff
  And it correctly parses the real on-disk epic tickets (e.g. a ticket declaring its
    files_touched entries as column-0 dashes yields those paths, not zero)
