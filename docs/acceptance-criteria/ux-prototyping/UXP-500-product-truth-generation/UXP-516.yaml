criteria: |
  Given the AC store schema,
  When an AC carries a product_truth block,
  Then product_truth is a defined, tool-owned field on the AC schema (a list of
  back-reference objects with flow, node, node_kind, flow_kind, screen, mock_data,
  entities, source, asof),
  And the schema documents it as GENERATED by generate_product_truth.py and never
  hand-edited,
  And an AC with no referencing flow node omits the field entirely.
