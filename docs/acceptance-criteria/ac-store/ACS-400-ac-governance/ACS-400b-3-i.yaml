title: "Mixed commit with both allowed and disallowed field changes is fully rejected"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given an existing AC YAML file has both work_status changed (allowed)
    AND criteria changed (disallowed) in the same staged diff,
  When the committing agent is an implementation agent (e.g. python-coder),
  Then the entire commit is blocked (not partially applied),
  And the error message identifies the disallowed field change (criteria)
    without suppressing the fact that work_status was also changed,
  And no partial commit occurs — the repository state is unchanged.
