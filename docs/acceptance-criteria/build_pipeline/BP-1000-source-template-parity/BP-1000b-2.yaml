assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "On a drift verdict the gate must perform a HARD EARLY RETURN that mirrors the existing test-regression HALT (the workflow returns { status: 'halted', halted_at_step: <parity-gate-step>, reason: 'parity_drift', ... } and the PR-merge step is structurally unreachable after that return). Do not raise an unhandled exception — surface the block through the workflow's existing HALT/return contract."
  - "The halt summary forwarded to the user must carry the drift detail (the per-pair drift report owned by BP-1000c-1), so the halt is actionable. This AC owns the HALT/return semantics; the report content comes from BP-1000c-1."
  - "Keep distinct from BP-1000a-2, which establishes that a drifted pair produces ok=false (the verdict). This AC owns the WORKFLOW HALT behavior: that ok=false at this gate stops the workflow before the PR-merge step and surfaces drift the same way a regression halt does."
  - "The halt must be idempotent: re-running finalize after the drift is unresolved must HALT again at the same gate with no residual state that could let the PR-merge step proceed."
