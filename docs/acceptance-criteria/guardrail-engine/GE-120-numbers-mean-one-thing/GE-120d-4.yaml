criteria: |
  Given a reader trying to understand where the numbering rule is enforced and what each stage
    guarantees,
  When they read the component diagram,
  Then it shows the three stages, the single shared rule evaluation all three invoke, and the
    collection each reads,
  And each stage is annotated with what it can do when a clash is found — bring in a specialist,
    stop a commit, or fail a build — so the differing strength of the three promises is visible
    on the drawing,
  And each stage is annotated with whether it can be bypassed, and the shared build is
    identified as the one that cannot,
  And it shows the rule evaluation as a single element the three stages share, not as three
    parallel copies,
  And the diagram carries a sequence number allocated by the project's own allocator and is
    placed where the enrolment rule expects a numbered diagram,
  And it is linked from its parent architecture document in both directions.
