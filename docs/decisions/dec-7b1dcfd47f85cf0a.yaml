rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.added.1] Rename the step field human to description,
    holding one plain sentence of what happens, and add an actor_kind field (deterministic, jev, llm or human) (required mean
    0.74, 2/3 passed); 2. [opt.strict_guide] a strict field guide with a never-list, generated contract text moved out of
    human, a length bound and a code-token lint enforced as gates, and field purposes moved into Pydantic model descriptions
    (required mean 0.72, 1/3 passed); 3. [opt.two_tier_text] Keep a one-line persona human field and move engineering narrative
    into a separate optional notes field that the Atlas hides by default (required mean 0.64, 1/3 passed); 4. [opt.narrative_bound]
    keep the narrative human field and add only a length bound (required mean 0.24, 0/3 passed). human:user chose option [opt.added.1]
    Rename the step field human to description, holding one plain sentence of what happens, and add an actor_kind field (deterministic,
    jev, llm or human) (kernel rank 1 of 4).'
