  note: >-
    readiness was demoted approved to draft by this pass per the ACS-1300a-1-i precedent,
    because criteria changed. BrainCandy reviewed that on 2026-09-01 and restored approved,
    judging both changes corrections to already-approved intent — this AC is scheduled
    high-priority phase_1 work and a re-approval cycle would stall it for no gain in
    correctness. Recorded here rather than left as a bare field change, so the restoration
    is attributable and the demotion is not mistaken for one that never happened.
    Two changes to criteria and no change to what the check must DO.


    (1) THE FOUR HARD-CODED POPULATION SIZES ARE REMOVED FROM criteria. They were stale AND
    internally unreachable as a pair. "66 on disk" is a NON-RECURSIVE listing, which yields 18
    unreferenced, not 19; reaching 19 required also counting hooks/check_ac_done_on_merge.py,
    which needs a RECURSIVE listing, which makes the disk figure 71. Consistently non-recursive
    the pair is 66/18; consistently recursive it is 71/19. An implementer following the old
    criteria literally writes a non-recursive listing, gets a number that does not match, and
    either fudges it or never notices that hooks/ holds five gate scripts. RE-MEASURED
    INDEPENDENTLY AT b846121c9 by this amendment, not inherited from the sibling agent's count:
    registry 61 entries / 5 enabled:false; disk 67 non-recursive giving 18 unreferenced, 71
    distinct names recursive giving 19, and 72 giving 20 under the adopted rule. A fourth rule —
    the last-whitespace-token extraction the it_requirements previously told implementers to
    copy — also gives 19, but a DIFFERENT 19, by falsely reporting check_done_proof.py. Three
    incompatible rules producing "19" over three different sets is why the numbers left
    criteria: they are observations, they belong in notes with a date and a commit, and
    BP-100n-4-ii already requires the check to STATE its populations in every run, which is a
    number that cannot go stale. The requirement that both populations be enumerated from live
    sources is strengthened, not weakened — criteria now describe the enumeration instead of
    reciting its output.


    (2) RECURSION IS NOW DECIDED EXPLICITLY IN criteria, AS BEHAVIOUR. The listing is recursive
    and identity is the script's PATH beneath the gate directory, not its bare filename.
    Grounds, measured: hooks/ holds five gate scripts and THREE OF THEM ARE LIVE — spawn
    consistency, verification consistency, and files-touched-reconciliation under the id
    check-predone-scope — so a non-recursive population drops five gates including three that
    run, and hides check_ac_done_on_merge.py, which nothing invokes. Path identity is forced by
    recursion rather than chosen: check_ac_limits.py exists at BOTH the top level and in hooks/,
    and only the top-level one is on an entry line, so under bare-filename identity the hooks/
    copy is silently covered by its namesake and reported invoked when nothing invokes it. The
    entry lines already carry the hooks/ segment, so the invoking side reads path-relative
    without inventing anything. One clause was added to the added-script arm requiring the same
    behaviour when the new script is added inside a subdirectory — without it the recursion
    decision has no red baseline and any non-recursive implementation passes.


    NO FIFTH POPULATION WAS ADDED. BP-100n-4-ii fixes the run summary at exactly four numbers
    and that is untouched; this amendment REMOVES numbers from criteria and adds none.


    GE-127b WIRED AS A doc_link PLUS AN it_requirements CONSTRAINT, NOT A depends_on EDGE, AND
    THE REASON IS MECHANICAL. check_file_size.py is the one member of the unreferenced set whose
    registration blocks the commit that registers it — this AC's own implementation edits
    scripts/build_phases.py, measured at 2603 lines under the hook's own docstring-stripping rule
    (3873 raw) against a 400-line cap. GE-127b's ratchet makes that registration a no-op for
    files already over. WHY NOT depends_on: scan_ac_store._classify_ac blocks an AC on any
    non-ancestor depends_on entry until that entry reaches work_status: done, and GE-127b is an
    L1 composite, which the scanner's own contract states is never built as a leaf and never
    reaches done — the edge would not sequence this AC behind GE-127b, it would remove this AC
    from the ready set permanently. Second reason: the dependency runs both ways in substance.
    GE-127a and GE-127b each carry a doc_link declaring THIS AC their precondition, because the
    size gate cannot fire until this AC's triage registers it. Neither direction is a whole-AC
    dependency — both are one-script sequencing — and writing either as a depends_on would
    falsify the graph. The constraint quarantines exactly one script and says explicitly that
    the deadlock is not to be resolved by weakening the census, raising the cap, or exempting
    the offenders.


    THIRD DEFECT FOUND WHILE MEASURING, CORRECTED IN it_requirements. The constraint "THE
    INVOKING SIDE IS THE ENTRY LINE" told implementers to take "the last .py token — exactly the
    extraction build_precommit._check_hook_script_integrity already performs". Those are two
    different rules. That function takes the last WHITESPACE-delimited token, which is a flag
    rather than a script for the three entries that carry arguments after theirs: check-done-proof
    ("check_done_proof.py --test-root ."), check-product-truth-validate and
    check-product-truth-generate (both "--quiet"). So the AC instructed an extraction that
    reports check_done_proof.py — a registered, invoked, required gate — as invoked by nothing.
    The constraint now specifies the last-.py-token rule and requires _check_hook_script_integrity
    to be fixed to match in the same change, since it is silently skipping those same three
    entries in the opposite direction today.


    THE AC'S NAMED EXEMPLAR IS ALSO STALE AND IS RECORDED AS SUCH. check-ticket-signoff-parity is
    no longer unreferenced: BP-1100g-5-i registered it under its documented id at 406375c88
    (PR #660), which is where 59 entries became 61. The delivers_to contract to TQ-500b-1 already
    anticipated this and the it_requirements constraint is inverted from "register it" to "assert
    it, do not re-add it". A narrower defect survives and is deliberately left out of scope: the
    entry carries no --enforce while README.md line 46 still says the config uses one, so the gate
    is reached but not at the documented enforcement level — a documentation-versus-config
    question about one gate, not a member of this AC's census.


    NOT DONE, DELIBERATELY: BP-100n-4-i and BP-100n-4-ii untouched; no test_spec descriptor
    changed, since every one of them already asserts over the check's own reported set and
