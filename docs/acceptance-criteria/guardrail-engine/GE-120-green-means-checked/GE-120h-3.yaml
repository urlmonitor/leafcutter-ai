notes: |
  PARTIAL PROGRESS — THREE OF FIVE ARMS LANDED IN 5d0792d13 (PR #808), AND THIS RECORD IS
  CORRECTLY STILL work_status: todo. Read this before concluding either that nothing
  shipped or that this is finished; both readings are available from the bare status and
  both are wrong.

    LANDED, observed rather than asserted:
      - Arm 1 (each of the five runs on an ordinary commit, and the commit completes) —
        the four pre-commit gates were seen Passing in the very commit that registered
        them; check-ac-done-on-merge is post-merge and was exercised through its deployed
        entry point.
      - Arm 2 (pre-existing state is reported, and does not by itself refuse) —
        check-folder-density reported templates/scripts/commit_guardian (109 files) and
        unit_tests/commit_guardian (142) as PRE-EXISTING against a limit of 15, and the
        commit completed.
      - Arm 5 (the record of advertised-but-unrun checks is smaller by exactly these five)
        — the inventory baseline went 14 -> 9, naming none of the five.

    NOT LANDED — this is what keeps the record open:
      - Arm 4, the anti-theatre clause: for each of the five, an input that check exists to
        refuse, put through the commit path it is now registered on, must actually be
        refused. NONE of the five has been shown saying no. Three are vacuous in this
        repository and a fourth is unarmed by default, so all five passing proves only that
        they do not crash. This arm is the difference between five gates and five entries.
      - Arm 3, the nothing-to-examine clause: a check whose subject this repository holds
        no instance of must SAY it had nothing to examine, rather than report that it
        examined something and found it clean. Unverified, and the early signs are that it
        currently fails: check-sql-complexity and check-debug-scripts exit 0 silently here,
        which is indistinguishable from a clean pass. That is GE-120a's defect appearing
        inside the fix for GE-120h, and it may need the GE-120 outcome vocabulary
        (OUTCOME_NOTHING_TO_INSPECT, check_outcome.py) wiring into those two scripts.

    Do not mark this done on the strength of the registration commit. Registration is arm
    1; arms 3 and 4 are the ones that distinguish a switched-on check from a decorative
    manifest entry, and they are precisely what KI-TQ-007 is about.

  THIS IS THE IMMEDIATE HALF, AND IT IS DELIBERATELY NOT THE WHOLE DECOMPOSITION. The
  parent forbids "register the missing checks" as the answer; GE-120h-1 and GE-120h-2 are
  the durable rule and this record is the cleanup that rule makes observable. It is
  written as a behaviour rather than as a task because a task is done when five lines are
  added to a file, and five lines added to a file is not evidence that anything runs.

  WHY EXACTLY THESE FIVE, AND WHY NOT THE OTHER NINE. The inventory record on main marks
  precisely these five as needing no code work, each with a measured reason. The other
  nine each need real work first — a shrink-only ratchet over existing violations, an
  unhandled parse error, an argv fix that would otherwise make the check read zero files
  and always pass. Registering those nine as they stand would either wall off large parts
  of the repository or install gates that cannot fail, and a gate that cannot fail is the
  defect this L0 is named after. Do not widen this record to them: the set is defined by
  the ready-to-register ground, not by the number five, and if the inventory's grounds
  have changed by the time this is built, take the set from the record rather than from
  this sentence.

  THE FOURTH CLAUSE IS WHAT STOPS THIS BEING THEATRE, AND IT IS UNCOMFORTABLE ON PURPOSE.
  Three of the five have nothing to bite on in this repository and one is unarmed by
  default. Registering all five and observing five green results would satisfy a naive
  reading of "they now run" while changing nothing about whether the package's promise is
  true. The demonstration must therefore be a refusal delivered through the registered
  commit path, under settings that arm the check, for each of the five.

  package_surface: true MUST BE SET ON THIS RECORD DURING TECHNICAL ENRICHMENT. It is not
  a formality and it is not deferrable: adding these five entries to the registry trips
  check-package-surface-declaration, which refuses the commit unless a cited criterion
  declares it, and the absence of such a criterion is the recorded reason the five are
  still unregistered today. The field is the IT PO's to set (as are the structured
  implementation fields the schema then requires), which is why it is flagged here rather
  than written here.

  A NEWLY REGISTERED ENTRY IS JUDGED BY THE EXISTING REACHABILITY RULE ON THE SAME COMMIT.
  That is the subject of GE-120h-3-i and the reason this record has a child: the
  registration shape is not free, and the natural-looking shape is the wrong one.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's fields.

  ---- IT PO ENRICHMENT, 2026-09-14 ----

  HOW EVERY NAME IN THE PACKAGE-SURFACE SPEC WAS VERIFIED, AND WHY THAT PARAGRAPH
  EXISTS. KI-CG-20260831-fictional-config-schema-fragment records two approved ACs
  that declared a structured config_schema_fragment naming a commit_guardian.json
  top-level key that was never created, and notes that the validator checks only that
  the declaration is well-SHAPED — it never opens the file to see whether the key is
  real. Nothing below was copied from a sibling record; each was read off disk in this
  worktree on 2026-09-14:
    - reference_file_path templates/scripts/commit_guardian/commit_guardian.json —
      opened and parsed. 38 top-level keys, hooks_manifest.hooks holds 62 members.
    - The nine entry properties in the fragment — obtained by tallying the key
      frequency across all 62 existing members: id/tier/name/entry/language/stages/
      pass_filenames/change_set_source present on 62 of 62, always_run on 9 of 62.
      No property was invented.
    - tier: judgment — the manifest's tier vocabulary is judgment (56) and transform
      (6); all five are validators.
    - language: system — 62 of 62.
    - always_run: true + pass_filenames: false + no files key — the shape already used
      by check-file-size, check-build-drift, check-identifier-uniqueness and
      check-hook-trigger-reachability, each read in full from the manifest.
    - change_set_source: handed_by_commit_path — NOT taken on trust from the field's
      apparent meaning. change_set_source.py was read: _SHARED_SOURCE_MARKERS is
      ("get_authored_change", "_authored_change") and _classify_hook credits
      self_derived only when the entry's script text contains one of them, otherwise
      the entry goes to .failures. All five scripts were grepped for both markers:
      zero hits. The only two self_derived entries in the manifest are
      check-doc-frontmatter and check-contract-shrinking, and both do import the
      shared source. So handed_by_commit_path is the only value these five can
      truthfully carry today. Recorded as a caveat on GE-120h-3-i, whose criteria ask
      for the derived declaration.
    - The five scripts — all five stat'd on disk, four in
      templates/scripts/commit_guardian/ and check_ac_done_on_merge.py in that
      directory's hooks/ subdirectory, which build_commit_guardian() deploys because
      it walks the guardian directory with rglob.
    - test_fixture_bloat DECLARED ABSENT, AND CHECKED RATHER THAN ASSUMED. It is not
      among the 38 top-level keys. check_test_fixture_bloat.py reads
      load_config().get("test_fixture_bloat", {}) and then config.get("enabled",
      False), so the missing key makes it inert. It is therefore NOT declared in the
      fragment, and the fragment says so explicitly so the next author does not
      "complete" the spec by creating it.
    - The post-merge stage — the manifest's stages today are pre-commit (60),
      commit-msg (1), manual (1). post-merge would be the first, which is why the
      shim-installation constraint is recorded rather than assumed.

  WHY THE FRAGMENT DESCRIBES AN ARRAY MEMBER AND NOT A CONFIG KEY. The schema's
  if/then makes the five structured fields mandatory once package_surface: true is
  set, and the field is named config_schema_fragment — which invites exactly the
  fiction the KI describes, because the honest answer here is that this change
  registers no configuration key at all. The fragment therefore describes the thing
  this change genuinely brings into existence: five members of hooks_manifest.hooks.
  That container is watched by _package_surface_registry.WATCHED_REGISTRIES through
  ("hooks_manifest.hooks", "list_ids"), so it is a package surface by the gate's own
  definition and the declaration is true.

  ---- CRITERIA AMENDMENT, 2026-10-08 (approved by BrainCandy) ----

  ARM 4 NOW APPLIES TO EACH OF THE FIVE THAT CAN REFUSE, AND DEMANDS A DECLARED EXEMPTION
  FOR ANY THAT CANNOT. Why: check-ac-done-on-merge structurally cannot refuse anything —
  main() returns 0 unconditionally and its __main__ guard maps OSError/ValueError to exit
  0; it is a post-merge, tier-transform AC-closer, not a gate. Arm 4 as first written was
  therefore unsatisfiable for it (confirmed independently by architect-review,
  ac-validator and a direct reading). Approved by BrainCandy on 2026-10-08.

  The exemption is declared, not silent: in this codebase it is a
  negative_control: {not_applicable: true, reason: ...} on the check's hooks_manifest
  entry, whose reason states the structural ground. It is valid ONLY when the check has
  no code path that produces a refusal under any input or setting. It is NOT available to
  check-test-fixture-bloat (unarmed by default, but armable) nor to check-sql-complexity
  or check-debug-scripts (nothing to examine here, but they refuse given an instance) —
  for those, a refusal through the registered commit path must still be shown. Shape and
  enforcement of the declaration remain GE-120f's.

  work_status MUST REMAIN DRIVEN BY EVIDENCE. This amendment changes what arm 4 asks; it
  satisfies nothing. Arm 4 stays open until the four refusals are demonstrated and the
  one declaration is present and true. The technical follow-through (test_spec entry
  test_ge120h3_each_of_the_five_can_still_refuse_through_the_registered_path, and the
  it_requirements constraints that still read "for each of the five") is IT-PO's and is
  deliberately not edited here.

  ---- IT PO FOLLOW-THROUGH, 2026-10-08 ----

  ARMS 3 AND 4 WERE DELIVERED IN TICKET-20260930-GE-120h-3. This supersedes, but does
  not erase, the "PARTIAL PROGRESS — THREE OF FIVE ARMS LANDED" section above. That
  section was true of 5d0792d13 / PR #808 and stops being true when this ticket's PR
  lands. The record stays work_status: todo until that PR merges and the work is
  validated. This note records the delivery. It does not claim that the work is done.
    - Arm 3: check_sql_complexity.py and check_debug_scripts.py now emit GE-120a-1's
      OUTCOME_NOTHING_TO_INSPECT on a genuine zero-subject commit. An unreadable .sql
      is named and reported could_not_check, never nothing_to_inspect.
    - Arm 4, delivered as FOUR REFUSALS PLUS ONE DECLARED EXEMPTION, as the amended
      criteria now require. check-folder-density, check-sql-complexity,
      check-debug-scripts and check-test-fixture-bloat (armed only in a private
      deployed copy) are each shown refusing through run_hook.py.
      check-ac-done-on-merge carries negative_control {not_applicable: true, reason}
      on its hooks_manifest entry.
    - Arms 1 and 2 gained the asserted tests they lacked, backfilled in
      test_ge_120h_3_registration.py. Arm 5 is still evidenced by the existing
      inventory staleness test.

  DEFECTS FOUND ON THE WAY. Neither was known when this record was enriched.
    - check-folder-density COULD NEVER REFUSE. Its before-snapshot came from
      `git ls-files`, which reflects the index, so it already contained the files this
      commit staged. A folder pushed over the limit by this commit was classified
      PRE-EXISTING and allowed through. The fix reads BEFORE from
      `git ls-tree -r HEAD`. _classify_folders is untouched, so arm 2's ratchet is
      intact.
    - pr-reviewer caught a RENAME/DELETE REGRESSION in this ticket's own diff (H-1).
      Once the fix was in, AFTER was computed as the HEAD tree plus the staged-new paths, so
      a rename inside an at-limit folder, or a delete plus an add, read as 16 and was
      refused. AFTER is now the index read independently. The same review found that
      root-commit detection depended on matching English git stderr (M-1) and that an
      unreadable .sql was swallowed and reported as nothing_to_inspect (M-2). All
      three are covered in test_ge_120h_3_snapshots.py.

  ENRICHMENT CORRECTED IN THE SAME PASS. The 2026-09-14 fragment's
  tier: {const: judgment} for all five was wrong for check-ac-done-on-merge, which is
  correctly tier: transform, post-merge and invoked directly. The enrichment note's
  line "tier: judgment ... all five are validators" is superseded by the fragment's
  per-id allOf. test_spec now names the tests that exist on disk.
