id: BP-900h-6-iii
components:
  - build_pipeline
title: "The simulated adopter tracks no file of at least one kind the deployed guards watch for, so a guard that only misfires in a project unlike this one is exercised rather than assumed absent"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the consumer-simulation project that attempts a first commit,
  And the set of file kinds that the deployed guards' activation conditions
    select between them,
  When the simulation is prepared,
  Then the project it commits in tracks no file of at least one of those kinds,
    chosen from that set as it stands at run time rather than from a kind named
    in the job,
  And the job states which kind it left absent, so the coverage it claims is
    readable in its own output instead of inferred from the job passing,
  And given the install step deploys files of a watched kind into the project,
  When the project is prepared for the commit,
  Then whether those deployed files are tracked is decided deliberately and
    stated, because a simulation that silently tracks the package's own
    deployed sources presents every language-conditional guard with exactly the
    files it wants and can never observe their absence,
  And given a guard that blocks a commit whenever the project tracks no file of
    the kind it watches for,
  When the simulation runs against that guard,
  Then the job fails and names it — the negative case that establishes this
    coverage can actually turn the job red,
  And given no such guard is present,
  When the simulation runs,
  Then the first commit completes and the job passes,
  And the set of watched kinds is read from the deployed guard configuration at
    run time, so a guard registered later that watches a new kind is covered by
    this simulation without the job being edited.
