assigned_agent: llm-expert
estimated_complexity: M
package_surface: true
it_requirements:
  config_schema_fragment:
    type: object
    required:
    - id
    - name
    - tier
    - role
    - permits_shell
    - portable
    - spawn_allowlist
    - spawned_by
    - is_ticket_phase
    - template_path
    - model
    - step_kinds
    properties:
      id:
        const: command-step-runner
      tier:
        const: utility
      permits_shell:
        const: true
      portable:
        const: true
      is_ticket_phase:
        const: false
      spawn_allowlist:
        maxItems: 0
      template_path:
        const: templates/agents/command-step-runner.md
      step_kinds:
        type: array
        uniqueItems: true
        minItems: 4
        items:
          enum: [reads_store, changes_store, changes_repository, publishes]
  reference_file_path: config/agent_registry.json
  n_location_rule: '1'
  required_skills:
  - llm-expert
  - add-agent-to-package
  post_write_commands:
  - python scripts/build.py --validate-only
  - python scripts/build.py --target-dir .
  constraints:
    - >-
      Package surface artefacts, all of them written together as in add-agent-to-package:
      the canonical template templates/agents/command-step-runner.md, the one registry
      entry in config/agent_registry.json (the only location changed in that file), the
      docs/agents/README.md row, and the agent card docs/agents/cards/command-step-runner.card.md,
      which build.py generates and nobody writes by hand. build.py --validate-only must pass
      before the deploy build.
    - >-
      The agent id is command-step-runner. The template filename stem, its frontmatter
      name, the registry id and every reference in BO-2400f-5-i, -5-ii, -5-iii, -3-ii and
      -10-iii must be the same string. If the id is changed at approval, change it
      everywhere in one edit.
    - >-
      The registry entry must declare permits_shell true explicitly. It is a utility-tier,
      portable agent with is_ticket_phase false, so it never appears in a ticket agents:
      map and never counts as a test-writer or coder invocation. Its spawn_allowlist is
      empty (it runs at depth 1 and spawns nothing), and its spawned_by names the
      dispatching workflow (fast-lane-ship.js) in the form the registry validator already
      accepts for workflow spawners.
    - >-
      No other agent's registry entry is edited, and permits_shell is not added to or
      changed on any existing agent. BO-2400f-7-iii forbids granting permission by editing
      the registry.
    - >-
      Least privilege. The template grants shell execution and read access only, with no
      file-editing or file-creating tool. The decline scenario (no hand edits) must be
      backed by what the agent can do, not only by what it is told.
    - >-
      The template states the reply contract as one machine-parseable JSON value. A result
      is {"command": string, "workspace": string (absolute path), "exit_status": integer,
      "stdout": string, "stderr": string}, where stdout and stderr are verbatim. A decline
      is {"declined": true, "step": string, "agent": "command-step-runner",
      "reason": string} and never contains an exit_status key. The presence of
      exit_status is the one signal BO-2400f-5-iii uses to tell a result from a decline,
      so the template must not blur it.
    - >-
      The request the template must accept is {step, command, target: {workspace (absolute
      path), branch, ac_id}}, with a statement that the run opened that workspace for that
      AC. BO-2400f-3-ii composes this shape. A request with no absolute workspace is
      declined, not guessed.
    - >-
      The template must not hold an allow-list of lane commands or step names. Its role is
      any single given command in the named workspace, so a step added to the lane later
      needs no template change.
    - >-
      The command-step-runner's entry lists all four kinds in step_kinds, using the field
      and vocabulary BO-2400a-1-iii defines (which is in depends_on). This record does not
      edit the schema or the registry gate. No other agent entry gains step_kinds.
    - >-
      The entry must pass BO-2400a-1-iii's registry gate unchanged. If the gate rejects
      it, fix the entry and never the gate.
    - >-
      The model tier is declared in the registry and justified against ADR-033. The
      capability that matters is verbatim relay of possibly large JSON, not reasoning.
    - >-
      The template must satisfy the registry self-description enforcement (currently
      error-level) and the frontmatter reference. The build must deploy it: build.py
      --validate-only passes, and a build compiles it to .claude/agents/command-step-runner.md.
      The agent card docs/agents/cards/command-step-runner.card.md is generated by the
      build and not hand-written. A docs/agents/README.md row is added as in
      add-agent-to-package.
    - >-
      The commit that adds the agent must pass check-agent-registry,
      check-agent-spawn-consistency, check-agent-diagrams and check-doc-types-agents
      without their exemption lists being edited to admit the new agent.
test_required: true
test_spec:
  - name: test_registry_declares_command_step_runner_with_permits_shell_true
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: criterion
    description: "config/agent_registry.json has an entry with id command-step-runner whose permits_shell is the boolean true (not absent, not truthy-string)."
    must_catch:
      - "no registry entry for the command-step-runner exists (today's state)"
      - "the entry exists but permits_shell is absent"
      - "the entry exists but permits_shell is false"
  - name: test_command_step_runner_declares_all_four_step_kinds
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: criterion
    description: "The command-step-runner registry entry's step_kinds lists exactly reads_store, changes_store, changes_repository and publishes."
  - name: test_only_the_command_step_runner_declares_step_kinds
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: real_artifact
    description: "In the shipped config/agent_registry.json exactly one entry carries step_kinds, and it is command-step-runner."
  - name: test_shipped_registry_with_command_step_runner_passes_the_step_kinds_gate
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: seam
    covers: [BO-2400a-1-i, BO-2400a-1-iii]
    description: "Running BO-2400a-1-iii's registry gate over the shipped config/agent_registry.json, with the command-step-runner entry present, reports no step_kinds violation."
  - name: test_agent_index_readme_lists_command_step_runner
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: real_artifact
    description: "docs/agents/README.md has a table row for command-step-runner."
    must_catch:
      - "the agent is registered and deployed but missing from the package's agent index"
  - name: test_command_step_runner_entry_and_template_are_one_agent
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: seam
    description: "The entry's template_path exists, the template frontmatter name equals the registry id, portable is true, is_ticket_phase is false and spawn_allowlist is empty."
  - name: test_command_step_runner_template_grants_shell_but_no_file_editing_tool
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: failure
    description: "The template frontmatter tools include the shell tool and include none of the file-editing or file-creating tools, so a request to edit by hand cannot be carried out even if the prompt were ignored."
    must_catch:
      - "the template inherits a default tool set that includes Edit or Write"
  - name: test_command_step_runner_template_states_result_and_decline_shapes
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: criterion
    description: "The template body names every result field (command, workspace, exit_status, stdout, stderr) and every decline field (declined, step, agent, reason), and states that a decline carries no exit_status."
  - name: test_command_step_runner_template_treats_nonzero_exit_as_a_result
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: discrimination
    description: "The template tells the agent that a command which ran and exited non-zero is reported as a result with that exit_status, and never as a decline."
    must_catch:
      - "the template tells the agent to report a failed command as 'could not complete this step'"
  - name: test_command_step_runner_template_runs_in_named_workspace_regardless_of_launch_checkout
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: criterion
    description: "The template tells the agent to run in the named workspace even when it started in a different checkout, and not to call such a request misrouted or injected, relocate the command, or alter it."
  - name: test_fresh_build_deploys_the_command_step_runner_agent_definition
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: deployed
    description: "Building the package into an empty temporary target directory produces .claude/agents/command-step-runner.md whose frontmatter name is command-step-runner."
test_rationale: |
  The agent is an LLM prompt, so its runtime behaviour cannot be proved without calling a
  model. "Runs exactly once", "JSON returned unchanged" and "does not judge the step" are
  model behaviour, and a unit suite must stay deterministic. The tests therefore pin three
  things: the permission the lane will rely on (the registry entry), the capabilities the
  agent holds (tools), and the contract the agent is given (template text). The tools test
  is the strongest of these, because a missing Edit/Write tool enforces the no-hand-edit
  decline mechanically and does not depend on the model reading its prompt.

  Schema and gate behaviour for step_kinds is tested in BO-2400a-1-iii. This record tests
  only its own entry: it declares all four kinds, it is the only entry carrying the field
  (on the shipped registry), and it passes a-1-iii's gate. That last test is the seam
  between the two records. The README test covers the agent-index clause that the
  registry and deploy tests cannot see.

  The deploy test uses the angle a registry-only check misses: an entry and a template
  that both exist but that the build never compiles into .claude/agents/ would let every
  other test pass while every installed project fails to dispatch the agent.

  The last criteria scenario (command-step-runner dispatches do not count toward the test-writer
  plus coder total of 2) can only be observed once the lane dispatches the command-step-runner.
  Its test lives in BO-2400f-5-i's test_spec with covers: [BO-2400a-1-i, BO-2400f-5-i].
  Any live verification of the model behaviours is a manual smoke run and is not part of
  this contract.
delivers_to:
  agent: python-coder
  contract: "A registered, deployed agent command-step-runner (config/agent_registry.json entry with permits_shell: true; templates/agents/command-step-runner.md; compiled to .claude/agents/command-step-runner.md). Request: {step: string, command: string, target: {workspace: absolute path string, branch: string, ac_id: string}}. Reply is exactly one JSON value, either result {command: string, workspace: string, exit_status: integer, stdout: string (verbatim), stderr: string (verbatim)} or decline {declined: true, step: string, agent: 'command-step-runner', reason: string} with no exit_status key. BO-2400f-5-i routes every command step to it; BO-2400f-5-iii classifies its replies."
expects_from:
  ac_id: BO-2400f-3-ii
  contract: "The request's target block {workspace: absolute path as the worktree step confirmed it, branch: string, ac_id: string} plus the statement that this run opened that workspace for that AC. The shape is fixed here so this record can be built first; BO-2400f-3-ii makes the lane send it."
