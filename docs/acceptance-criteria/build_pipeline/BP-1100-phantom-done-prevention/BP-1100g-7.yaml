test_rationale: |
  Genuinely test-free: change_target is docs and the observable is one mermaid sequence
  diagram. There is no executable behaviour to assert, and the AC's central content — that
  a particular arrow is ABSENT and that a boundary is legible to a human reader — is a
  comprehension property no unit test can evaluate. The mechanical properties that do
  exist are already enforced by dedicated hooks and must not be duplicated here:
  check_diagram_naming (path/sequence convention), check_mermaid_parent_link (linkage
  from the component page) and check_mermaid_complexity (participant budget).
