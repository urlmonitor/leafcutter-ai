notes: |
  Plan-feature has no AC id for a run (L1 constraint 1), so it names its run (BO-4500a-4-iv). The
  done-parent gap from the same KI is out of scope (BO-4500a-1-ii notes). Open PR #968
  (audit/plan-feature-next) edits plan-feature.js; the implementer must rebase onto it, not
  re-derive its pause-gate fixes.

  IT PO 2026-10-14 -- SCOPE FLAG (criteria NOT edited). The criteria name three commits (after a
  stage, final, orphan recovery). plan-feature.js also commits from the product-truth stage and the
  flow-reconciliation step. Those two are carried as it_requirements here so the census
  (BO-4500a-5) can pass; the BA may prefer to name them in the criteria.
