it_requirements:
  - "When files_touched frontmatter is absent (not just empty), skip reconciliation entirely — there is no declared baseline to compare against — and do not flag or error. Distinguish absent (no-op skip) from empty-but-present (a declared empty scope, which BP-1100e-1 evaluates normally)."
  - "The skip must be observable (advisory note to stderr/log naming the reason), consistent with the fail-open posture of BP-1100e-2, so a repository not using files_touched is never blocked by the check."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
