criteria: |
  Counts split into real backlog, work being written, and parked ideas.

  A single total hides three very different populations, so writing an idea down
  cheaply currently looks exactly like falling further behind. Requirement counts
  are reported separately as work that is genuinely queued and gating throughput,
  work still being drafted, and ideas deliberately parked for later — so growth in
  one is never mistaken for growth in another.
