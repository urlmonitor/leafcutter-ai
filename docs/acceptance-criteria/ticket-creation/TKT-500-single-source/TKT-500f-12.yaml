criteria: |
  Given a leaf AC at level L2 or L3 whose generated ticket has a files_touched
    list containing at least one implementation .py file (an AC whose work
    changes code, not docs/config only),
  When a ticket is generated from that AC by generate_ticket_from_ac.py,
  Then the generated ticket's agents map wires the ac-validator phase and the
    ac-fulfillment-gate phase as needed phases,
  And those two phases appear in the agents map so the AC-traceability gates run
    against the ticket rather than being absent.

  Given a leaf AC whose generated ticket has a files_touched list containing no
    implementation .py file (docs/config-only work),
  When a ticket is generated from that AC,
  Then ac-validator and ac-fulfillment-gate are wired only as the pipeline's
    existing rules require for such tickets (this AC does not force them onto
    docs/config-only tickets).
