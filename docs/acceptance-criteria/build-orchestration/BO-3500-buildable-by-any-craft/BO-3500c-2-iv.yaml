id: BO-3500c-2-iv
components:
  - build_orchestration
  - llm_authoring
title: "Proof for a prompt: the surface that consumes it loads it and behaves differently with the instruction present"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a member whose artifact is a prompt or an instruction given to an agent,
  When its proof is established,
  Then the surface that consumes that prompt is exercised as part of establishing the
    proof, and the prompt is loaded by that surface during the exercise,
  And the surface's observable behaviour with the instruction present differs from its
    observable behaviour with the instruction absent, in the direction the requirement
    describes.

  Given a member whose instruction has a consumer that behaves the same way every time
    it is given the same input,
  When its proof is established,
  Then the comparison is made against that consumer,
  And it needs no credential and no call to a model, and repeating it returns the same
    answer.

  Given a member whose instruction is consumed only by a model,
  When its proof is established,
  Then the comparison is made by calling that model with the instruction present and
    again with it absent,
  And the run states that this member's proof required a live model call and what it
    cost, so the price of this kind is visible rather than absorbed into the run.

  Given a member whose instruction is consumed only by a model, and a run that has no
    credential for that model or cannot obtain an answer stable enough to be evidence,
  When the run resolves a group containing that member,
  Then it is refused before any craft is dispatched, on the ground that this proof
    cannot be established here,
  And it is never finished on the strength of the instruction merely being loaded.

  Given two members, one whose instruction has a repeatable consumer and one whose
    instruction is consumed only by a model,
  When the run reports on them,
  Then the two are distinguishable in what it reports, because they cost differently
    and can end differently.

  Given a prompt that was written and which no surface loads,
  When its proof is established,
  Then the proof fails, and the reason given is that nothing consumes it — so an
    orphaned instruction is caught at the moment it is written rather than months
    later.

  Given a prompt that is loaded by its surface but whose presence changes nothing the
    requirement describes,
  When its proof is established,
  Then the proof fails, naming the change that was expected and not observed.
