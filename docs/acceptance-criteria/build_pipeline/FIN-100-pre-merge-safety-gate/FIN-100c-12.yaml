title: "A recovered baseline is forwarded to triage with its own consistent, non-null baseline SHA"
level: L2
component: finalize
status: active
parent: FIN-100c-4
criteria: |
  Given the Step-0 baseline was unavailable (the forwarded baseline SHA is null)
    and the post-merge run reported failing tests
  When the targeted main-HEAD rerun completes successfully and a recovered
    baseline is forwarded to triage
  Then the recovery reports the origin/main HEAD commit SHA of the checkout the
    rerun was performed against
  And the workflow sets the baseline SHA forwarded to triage to that recovered
    SHA (a non-null value) rather than leaving it null
  And the pair forwarded to triage is consistent: whenever the recovered baseline
    list is non-null, the accompanying baseline SHA is also non-null and equals
    the SHA of the checkout the rerun ran against
  And when the targeted rerun is unavailable and no recovered baseline is produced,
    the baseline SHA forwarded to triage remains null
