notes: |
  Systemic gap 5. Placed as a new build-pipeline L0 rather than under BP-100
  (reliable-builds, already over its child cap with child_limit_override: 13) or
  guardrail-engine (pre-commit hooks only). BP-100 governs artifact PRESENCE and
  PLACEMENT; this goal governs a distinct property -- that build AND authoring
  guardrails give a deterministic, environment-independent verdict that a dirty
  local deployment cannot mask.
