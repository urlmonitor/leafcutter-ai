it_requirements:
  - "Implement the symbol-AC surface in the same NEW hook check_declaration_traceability.py (module and symbol surfaces share the hook); the decision-history surface (GE-117c) EXTENDS the existing check_documentation.py tail-tag validator — do not duplicate AC-resolution logic across the two, share it (see next requirement)."
  - "Discover top-level public symbols by parsing the STAGED blob in-process with the Python stdlib ast module: walk module-body FunctionDef/AsyncFunctionDef/ClassDef nodes. A symbol is public when its name does not start with '_', EXCEPT that when the module defines __all__ the __all__ membership is authoritative. No MCP/jcodemunch — a commit hook has no MCP channel."
  - "Resolve each declared AC reference against the AC store by EXTRACTING scan_ac_store.py's _load_ac_by_id into an importable shared module that both this hook and scan_ac_store.py depend on (extract-don't-copy; guarantee no regression to scan_ac_store.py's existing behavior). A reference is VALID iff _load_ac_by_id returns a record; None means the id does not exist."
  - "Emit the per-symbol verdict {file, symbol, surface: 'symbol-ac', verdict: 'satisfied'|'missing'|'invalid', declared_refs: [str], resolved: bool}; declared_refs is always a list; keep the shape structurally aligned with the module-component and decision-history verdicts for GE-117d-1 aggregation."
  - "Scope is diff-only AND public-only: only new/changed public symbols are evaluated; unchanged symbols and private symbols produce no verdict."
  - "Docstring PRESENCE is GE-100's floor and is NOT re-specified here; this surface asserts only that an existing public-symbol docstring carries a resolvable AC reference."
  - "Fail-open on INTERNAL hook error only (exit 0, stderr advisory, clean stdout); real missing/invalid declarations fail-closed via GE-117d-1."
  - "Edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together; verify parity via the build.py round-trip (ADR-001)."
