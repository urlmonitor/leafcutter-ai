notes: |
  This AC carries the KNOWN TRAP forward from BO-1000b-1-i's implementation. Read
  before implementing or writing tests for it:

  - CONDITIONALIZE, DON'T ADD. When the skip branch of the enablement `if/else`
    gains a record-writing call, the pre-existing UNCONDITIONAL record-writing call
    that sits AFTER the `if/else` must be moved into the execute branch or guarded.
    Adding the skip-branch call while leaving the unconditional one produces TWO
    entries on the skip path. Symmetrically, moving it without leaving one on every
    path produces a gap. That is why this AC asserts a COUNT, not a presence.
  - TESTS MUST BE BEHAVIOURAL, NOT STRUCTURAL. Assert the cardinality by reading the
    collected records after a run and counting entries per requested gate. A test
    that greps the source for the presence of a recording call passes on the buggy
    double-recording code.
  - IF A STRUCTURAL TEST IS WRITTEN ANYWAY, it must match single-quoted,
    double-quoted AND backtick template-literal argument styles. BO-1000b-1-i's
    count guard used a regex that matched only quoted-string first arguments and
    was therefore blind to the template-literal skip calls that caused the bug —
    it stayed green on broken code. See CLAUDE.md "Skip-Branch Side-Effects".

  THE HALT CASE MOVED OUT (2026-08-13, expert review). The earlier draft asserted,
  in one Then block under a Given describing a completed run, both "no requested
  gate is left with zero entries" and "when the run halts, that gate has zero
  entries". Those cannot both be evaluated against one scenario, and an
  implementer reading them together gets no decidable rule. The completed-run
  invariant stays here — one entry per requested gate, no exceptions, which is
  what makes the count assertion meaningful. The aborted-run carve-out is now
  BO-2900f-2-i, where it has its own Given (a run that halts before a later
  gate's decision point) and can be tested independently. Do not re-merge them:
  the carve-out is the clause an implementer will reach for to excuse a genuine
  gap, and keeping it in a separate scenario forces the halt record to be shown.

  2026-08-14 (IT PO enrichment). Two additions the criteria imply but do not name:

  - THE COUNT MUST BE PER GATE, NOT IN TOTAL. The criteria say both "the number of
    recorded entries equals four" and "each appear exactly once", and only the
    second is load-bearing. A total-only check is satisfied by a compensating pair
    — one gate duplicated, one missing — which is worse than the bug this AC
    guards. The test contract asserts both, with the per-gate assertion as the
    primary.
  - DUPLICATE AND GAP ARE DIFFERENT DIAGNOSES. A duplicate means the unconditional
    post-branch call was left in place; a gap means it was moved into one branch
    only. Reporting them as one 'count wrong' failure discards exactly the
    information the implementer needs to know which half of the conditionalization
    they got wrong, so the violation record carries a kind.

  ENFORCEMENT POINT. On the ticket surface this is the same shape of completeness
  relation that _signoff_parity_checks.py already computes between the frontmatter
  agents map and the Sign-offs checklist, and it runs as a blocking pre-commit
  hook. That is a real advantage of the ticket option for THIS AC specifically:
  the counting machinery and the gate that runs it both already exist. Under the
  JSONL option both are new, and the invariant needs a blocking gate of its own —
  an invariant asserted only in unit tests is not enforcement.
