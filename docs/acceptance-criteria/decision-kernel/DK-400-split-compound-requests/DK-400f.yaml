notes: |
  FLOW NODES: split-report (step); split-reject and split-reject-kept-whole
  (branches) for the plain rejected line; split-part-unsettled (branch) for
  parts that did not settle.

  SETTLED: outcomes shown are pending, decided, answered and not run, each with a
  link to its child decision record or research result. The run report's split
  section has one line per part, starting with the part id and naming its
  outcome. Edited and left-out parts are visible as such. Since flow v5 and
  mock v5 there is one more outcome, not_settled. It has a stop reason, and a
  dependant names the part it waited for (DK-400e). The criteria's "waiting,
  decided, answered or not run" stays the customer summary; the BA shows
  not_settled as well.

  DECIDED on 2026-10-05 (flow-author open point c; see DK-400 "DECISIONS AT THE
  PO GATE", Q4, which wins over this note): the hand split is history only. The
  progress mockup and the mock record dcp-reusable-criteria-by-hand show a
  split made by hand outside the kernel (proposed_by claude_code), including a
  part "settled by a human". The flow has no node for it, and its report_lines
  are [], because the run report knows nothing of a split made outside the
  kernel. The kernel does not record hand splits, and settled_by_human is not
  offered in the kernel path. Build no L2 for either. The hand-split record
  stays in the mock data as real-world evidence only.

  REJECTED SPLITS (user decisions 2026-10-05; see DK-400d and DK-400 "DECISIONS
  AT THE PO GATE" and "FINAL GATE"):
    - Request nothing could handle (trigger jev_none): the run ends blocked,
      and the plain report says the split was rejected and nothing was decided,
      with a hint to ask again as one question.
    - Unclear request (trigger ambiguous): it falls back to today's
      clarification question, and the run is not blocked. This was decided at
      the final gate; it replaces the earlier "jev_none or ambiguous" blocked
      ending.
    - Request that could have been taken on as one (trigger bundled_accepted),
      or a split found mid-run: it goes ahead as one decision.
    - In all three cases the report carries one plain line saying a split was
      offered and rejected, so the person can see why there is no per-part
      section. This was the PO recommendation and is now confirmed as the
      default.
    - Mock v5 carries the report_lines rules for the blocked and kept-whole
      endings. The ambiguous fallback is not in mock v5 or flow v5 yet; the
      mock-data author is preparing v6 (see DK-400d).

  DOCS: reading split progress and the report section belongs in the kernel
  how-to (how-to).
