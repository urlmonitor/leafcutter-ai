notes: |
  2026-09-16 (business-analyst) -- PREMISE NARROWED, READ THIS FIRST. The first scenario's
  environment changed from "dispatching a specialist is impossible" to "no party can be asked to
  judge anything" (only a chartered executor of exact commands is dispatchable), and an And was
  added requiring every dispatch made while releasing to be an exact command to that executor.
  Authorised by the user on 2026-09-16; the old wording, the reason and the list of now-stale
  technical fields are in amended_by. Where the paragraphs below speak of "no specialist
  available" or "performs it itself", read them as "no one available who could decline or judge".

  Anchor case KI-BO-020: every failure path released its claim by dispatching a reporting
  specialist under a role name that was not its own. The specialist refused — correctly, since
  reassigning its role is out of scope — the reply was discarded because the release is
  best-effort, and the claims stayed stuck. The run reported its halt and looked fine.

  THE UNAVAILABLE-SPECIALIST CLAUSE IS THE DISCRIMINATOR, as in BO-3200a-1: an assertion that
  the claim was released passes on a run that got lucky with a cooperative specialist.
  Requiring the release with no specialist available can only be passed by a run that performs
  it itself.

  THE STORE MUST BE ONE THAT OUTLIVES THE RUN. The parent L1 is explicit that the observed
  harmlessness was luck, not design: the damage stayed contained only because a fast-lane run
  claims in its own throwaway copy, so the shared copy was untouched. A test asserted against a
  discarded copy proves nothing, and the severity must not be set by the accident that made the
  first sighting cheap.

  THE SECOND SCENARIO ENCODES THE REAL DAMAGE. Stranded claims are permanently excluded from
  future selection by the guard that correctly refuses occupied work, so a failed run silently
  makes its own target unbuildable and recovery is a hand edit. Asserting re-claimability, not
  just the field value, is what ties this AC to that consequence.

  THE THIRD SCENARIO EXISTS BECAUSE THIS IS NINE PATHS, NOT ONE. KI-BO-020's update records
  that every release dispatch in the lane had the same defect. Fixing the first one found and
  testing only that one leaves eight live.

  IT-PO ENRICHMENT NOTE (2026-08-26). Two additions the criteria imply but do not state:
  abnormal termination and idempotency. The first because an exception escaping the claim region
  strands exactly these records and is the shape KI-BO-022 records as latent — adjacent and not
  claimed by this AC, but a defect the fix must not re-create. The second because the natural
  way to satisfy "release from every stop point" is a release call on several nested paths, and
  a non-idempotent release then fails on the second one, which would be a new failure introduced
  by the fix.
