id: BP-600d-5
title: "Quick-fix reports a not-opened PR as an outstanding action owned by the caller"
component: build-pipeline
components:
  - build_pipeline
status: active
level: L2
req_status: active
readiness: approved
priority: high
work_status: done
roadmap_phase: phase_1
criteria: |
  Given /quick-fix has completed its fix, test, changelog and commit phases on an
    isolated feature branch, and the close phase has reached the confirmation gate
    that guards opening a pull request,
  When the run ends with no pull request having been opened — because no
    interactive user was present to answer the gate, or because the user declined
    — and the workflow returns its terminal result to the caller,
  Then the result marks the absent pull request as an EXPLICIT OUTSTANDING ACTION
    owned by the caller, in the structured result itself and not only in the prose
    message, so that a caller reading only the structured fields can tell that an
    action is required of them and can distinguish this run from one that left
    nothing to do,
  And the result carries what the caller needs in order to act — the branch, and
    the compare URL or the exact command that would open the pull request,
  And the workflow still does not open the pull request unattended: the
    confirmation gate is unchanged and remains the only route to an outward-facing
    PR creation,
  And a run for which a pull request already exists, a run whose push failed and
    halts as blocked, and a run in which a pull request was opened, each report
    exactly as they do today,
  And the bug symptom ("When /quick-fix finishes without opening a pull request, the caller is not told that anything is outstanding. The run returns status: 'ok' with pr_url: '' and a multi-line '/quick-fix complete.' message whose eighth line reads 'PR: none — not opened'. Observed 2026-09-08 on run wf_c7bb170c-822: the fix, AC, test, changelog and commit all landed correctly, the result reported status ok, and the PR was simply never created. The caller only discovered it by reading the raw payload's empty pr_url field and opening the PR by hand. Nothing in the result distinguishes 'finished, nothing left to do' from 'finished, and you must now open the PR yourself'.") must not occur
