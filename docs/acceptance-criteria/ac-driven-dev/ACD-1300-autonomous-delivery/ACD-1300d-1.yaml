id: ACD-1300d-1
title: Expose durable status and actionable attention items in one CLI view
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given one feature is waiting on an external prerequisite, another is blocked and another has a draft PR
  When the user inspects worker status and the blocker inbox after reopening the CLI
  Then the same durable run identities, states and pending requests are visible
  And each blocked item identifies the feature, affected AC, reason, required answer and supporting evidence
  And delivered items link the draft PR and its checked and reviewed revision
  And local checks, reviewed proposal and merged completion remain distinct outcomes
  And agent communication blockers distinguish a request for input, an explicit refusal, a reported execution error and an unusable reply
  And their reason identifies the interrupted phase and the next operator action without exposing credentials
