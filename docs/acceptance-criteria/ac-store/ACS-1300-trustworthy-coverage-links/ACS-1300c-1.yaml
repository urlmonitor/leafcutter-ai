  contract: "The apply step whose write set this refusal constrains."
test_spec:
  - name: test_acs_1300c_1_two_records_are_repaired_and_no_finished_state_line_changes
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "THE CENTRAL TEST — THE PAIRING MUST STAY INSIDE ONE INVOCATION AND ONE SCENARIO. One out-of-process apply run over a real on-disk store holding two unfinished records with empty coverage lists whose naming tests are present and ACTUALLY PASS when run, plus one record already reading as finished. Assert together: both records now hold their naming test's path; the finished-state LINE of each of those two is character-for-character identical; and no file anywhere under the store has its finished-state value changed, the already-finished record included. Separating the refusal clauses from the repair clauses into different scenarios reopens all three no-op escapes."
  - name: test_acs_1300c_1_report_shows_both_records_repaired
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The run's report names both records as repaired. This is what makes the unchanged finished state a refusal a live run exercised rather than the residue of a run that did nothing."
  - name: test_acs_1300c_1_eligibility_reported_for_each_record_equals_verify_done_eligible_s_verdict
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "REAL PRODUCER INTO REAL CONSUMER, ONE ORACLE. For every record in the store, assert the eligibility the report states equals `done_proof.verify_done_eligible`'s verdict computed independently against the post-run store. Assert per record, never on totals — matching totals hide two offsetting misclassifications, and offsetting misclassifications are how a second reader drifts undetected."
  - name: test_acs_1300c_1_eligibility_is_report_only_and_disk_state_is_unchanged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Re-read each record from disk after the run and assert its finished state is the value it had before, including for every record the report names as eligible. The eligibility list must be observable in the report and absent from the filesystem. Additionally compute verify_done_eligible for those records BEFORE the run and assert the verdict is unchanged after it — the report must not present a standing eligibility as something the repair produced."
  - name: test_acs_1300c_1_report_names_eligible_and_unmarked_records_and_says_the_repair_did_not_cause_it
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      THE TWO CORRECTED CLAUSES, ASSERTED AFFIRMATIVELY. Assert (a) the eligibility list
      holds exactly those records the oracle calls eligible AND whose finished state is
      not marked — a record already reading as finished must NOT appear, so the list is a
      standing inventory of what is unmarked, not a roll-call of everything eligible — and
      (b) the report STATES IN ITS OWN TEXT that this eligibility is not a consequence of
      the run, carrying the before-run and after-run verdicts and their equality. The
      neighbouring test asserts the verdicts ARE equal; this one asserts the report SAYS
      SO. A report that is silently correct still lets the next reader conclude the repair
      unblocked the record — that inference is exactly the false premise this criterion
      was amended to kill, and it recurs downstream unless the report closes it in words.
  - name: test_acs_1300c_1_bo_202_as_a_real_store_regression_fixture
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "AGAINST THE REAL RECORD, COPIED VERBATIM, NOT A HAND-TYPED FIXTURE. Copy `docs/acceptance-criteria/build-orchestration/BO-202.yaml` into a temporary store as it exists on disk. Assert the run restores its coverage link, reports it, leaves its `work_status: todo` line byte-identical, and — if the oracle says so — names it eligible and unmarked. Compute BO-202's verdict BEFORE the run as well and assert it is unchanged: BO-202 is this tree's real-artifact instance of the corrected model, eligible or not on its own direct tag before the repair ever touched it, and it is the record most likely to be misread as newly unblocked. A hand-typed fixture reproduces the author's formatting bias; this repository has already shipped a parser that passed every synthetic fixture and no-opped on every real file."
