notes: |
  Decomposed from ACS-800a. The store-wide uniqueness invariant and its
  enforcement (a commit-time / validation-time guarantee, analogous to the
  existing check_ac_schema.py checks). Distinct from ACS-800a-1 (which defines how
  a UID is allocated) — this AC defines the always-true invariant the allocation
  must preserve.
