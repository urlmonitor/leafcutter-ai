id: BO-4400e-4
title: "At any time you can see how much space each workspace and all of them together take"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: internal
criteria: |
  Given three registered workspaces whose folders measure 1.2 GB, 300 MB and 4.0 GB,
    one unregistered leftover measuring 800 MB, and a Python environment of 500 MB
    belonging to the 300 MB workspace kept outside its folder,
  When the space report is requested,
  Then the report lists all four workspaces, largest first, each with its location,
    its verdict (holds work / holds nothing / no verdict), and its size including the
    items it owns outside its folder, so the 300 MB workspace is reported as 800 MB,
  And the report states a total of 6.8 GB, equal to the sum of the listed sizes,
  And the report states how much of the total belongs to workspaces holding nothing
    unsent, as the space a sweep would free,
  And requesting the report changes nothing on disk,
  And when a fifth workspace of 100 MB is added, the total in the next report is
    100 MB greater and the workspace count is one greater.
depends_on: [BO-4400e, BO-4100e, BO-4100c-1, BO-4400b-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4100-sound-workspace-by-construction/BO-4100e.yaml
    relationship: constrains
    status: exists
    relevance: The complete listing, including unregistered leftovers, the report sums over.
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400b-1.yaml
    relationship: related
    status: exists
    relevance: The inventory of items a workspace owns outside its folder.
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  - agent: python-coder
    contract: >-
      Space report, read-only, as one JSON object: {workspaces: [{location: absolute path, verdict:
      "holds_work" | "holds_nothing" | "no_verdict", registered: bool, folder_bytes: int,
      outside_bytes: int, bytes: int}] sorted by bytes descending, count: int, total_bytes: int,
      reclaimable_bytes: int (sum over holds_nothing)}; plus a function returning total_bytes for
      the ensure-time warn / refuse answers of BO-4400e-1 / BO-4400e-2.
  - agent: documentation-expert
    contract: "The report command, its columns and the reclaimable figure, for the how-to BO-4400e-5."
expects_from:
  ac_id: BO-4400b-1
  contract: "Outside-item inventory keyed by workspace."
package_surface: false
it_requirements:
  - >-
    SURFACE: a read-only report verb of the one maker (or an option of its list verb), reusing the
    maker's list / BO-4100e discovery (registered and unregistered), the BO-4100c-1 verdict, and
    BO-4400b-1's inventory for outside items; no second listing or verdict implementation.
  - >-
    Sizes use the single shared size measure delivered by BO-4400b-1, so the report agrees with what
    clearing and the sweep would free.
  - >-
    Strictly read-only: no fetch that writes refs, no marker update, no cache write; the report
    completes within 60 s for 150 workspaces on the reference host, or states which entries it could
    not size rather than stalling.
  - >-
    PROOF: deployed maker as a separate process over real temporary workspaces with real files of
    the stated sizes (scaled down -- the criteria's MB / GB figures may be scaled by a constant
    factor, preserving the ratios and exact sums), a real outside environment folder in a temporary
    HOME, and a full path-and-hash snapshot around the report.
test_required: true
test_spec:
  - name: test_report_lists_all_workspaces_largest_first_with_verdict_and_owned_size
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "All four workspaces are listed largest first with location and verdict; the small workspace includes its outside environment."
    must_catch:
      - "outside items not counted per workspace"
      - "unregistered leftover omitted"
  - name: test_report_total_equals_sum_of_listed_sizes
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "The stated total equals the sum of the listed sizes and matches the test's own measurement."
  - name: test_report_states_reclaimable_space_of_holds_nothing_workspaces
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "reclaimable_bytes equals the sum over holds-nothing workspaces."
  - name: test_report_changes_nothing_on_disk
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Paths and hashes of the fixture tree are identical before and after the report."
  - name: test_adding_a_workspace_moves_total_and_count
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "A fifth workspace of known size raises the total by exactly that size and the count by one."
    must_catch:
      - "total from a cached or fixed figure"
test_rationale: >-
  The report is only worth reading if it agrees with what clearing would really free; real folders
  of known size and a varying population are what show that.
origin_agent: business-analyst
created: 2026-10-09
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Gap G5 (report half): "report total space used by workspaces". Counting outside items per
  workspace is what makes the report agree with what clearing would actually free (the Poetry
  pile-up lives outside the folders). Last clause is the varying-population check.
