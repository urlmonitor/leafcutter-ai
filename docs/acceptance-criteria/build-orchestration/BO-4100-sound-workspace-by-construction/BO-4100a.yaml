criteria: |
  Every new workspace begins at the shared work as it stands now, not as it stood.

  However a workspace comes to exist, the work inside it starts from the current
  state of the shared line rather than from whatever older picture of the project
  happened to be sitting on this machine. You are never quietly handed a starting
  point that the rest of the work has already moved past.
