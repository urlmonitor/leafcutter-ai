criteria: |
  Given a lean fast-lane build produces a batch of test and implementation changes,
  When the changes are committed,
  Then the history contains distinct logical commits rather than a single squashed drop
    (at minimum: a red-baseline commit before implementation, and a green
     implementation commit after the tests pass),
  And each commit message's claims are verifiable in that commit's diff.
