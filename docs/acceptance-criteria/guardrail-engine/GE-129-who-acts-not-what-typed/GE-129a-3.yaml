notes: |
  WHY THIS IS NOT GE-129a-2. GE-129a-2 is satisfied by an implementation that checks identity
  first and keeps the old token check as a fallback ("identity OR token"). Only (a)/(b) of the
  first scenario turn red under that mutation. "Same refusal text" in the first Then rules out a
  second mutation: refusing the token-carrying forms with a special message, which is Q6's
  "treated as an error".

  WHY THE SECOND AND THIRD SCENARIOS. "Ignored" has two directions. The cheap retirement makes
  the token an error ("COMMIT_AGENT_MODE is no longer supported") -- that breaks the commit
  specialist while its instructions still carry the token during the same change, and Q6
  forbids it. The third pins the top-level path so the token cannot be kept as an interactive
  shortcut.

  (c)-(e) are the identity sources the L1 rules out and that BO-3200f-2-iii already lists. Each
  is a way a future "convenience" could re-open the defect one layer up.

  declares_side_effect: true -- derived from "the commit specialist commits the change".
