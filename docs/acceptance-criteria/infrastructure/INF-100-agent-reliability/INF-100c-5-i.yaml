delivers_to: null
expects_from:
  ac_id: INF-100c-5
  contract: "The build-time consistency check from INF-100c-5, which loads the agent definitions and every category's allowed_writers in one pass and returns unknown_writers as a sorted list of {writer: str, categories: list[str]}; this record fixes what goes into that list and how it is reported."
