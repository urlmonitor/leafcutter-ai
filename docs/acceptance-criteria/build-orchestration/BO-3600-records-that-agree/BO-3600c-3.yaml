notes: |
  BO-3600c's notes require the BA to say plainly which kinds of staleness are out of
  reach rather than writing a criterion only a reader could satisfy. This is that
  instruction as behaviour: the scope is declared in the output, so the boundary
  travels with every result instead of living in a design note nobody reads at
  triage time.

  The first scenario is the trap being closed. Of the five instances in KI-BO-028's
  correction list, the overstated-headline one is genuinely undecidable; a check
  that reported the containing entry as clean would give that entry a certificate it
  has not earned, and the next reader would stop looking.

  The third scenario is the same absence-is-not-evidence rule BO-3600e-1 applies to
  scope: a run that examined nothing must not read like a run that found nothing.
