notes: |
  THE FIGURE ON BO-3500 — 660 not-yet-done requirements naming a craft the automation
  does not have — was counted by hand on 2026-08-31 and started going stale the same
  day. This criterion is the difference between a number somebody once produced and a
  number the project has.

  THE DATE-AND-SIZE CLAUSE IS NOT BOOKKEEPING. A coverage figure is quoted long after
  it is produced — in a roadmap, in a retrospective, in an argument about priorities —
  and this repository has a documented history of stale evidence surviving because
  nothing on the artifact said when it was true. A report that carries its own date and
  denominator makes staleness visible at the point of quotation.

  NO-ARGUMENT IS PART OF THE CRITERION. A report that must be pointed at a component
  answers a different question and cannot answer this one, because the operator would
  have to know which component to be worried about, which is precisely what they do not
  know. It is the standing whole-backlog view or it is not this requirement.

  BOUNDARY vs BO-2400f-12 and BO-3500a-3, restated from the Product Owner's note: those
  make one refusal legible at the moment it happens. This is the view across the whole
  backlog, available without aiming at anything. A perfect refusal message still leaves
  the question "how much of my backlog is stuck" unanswered.
