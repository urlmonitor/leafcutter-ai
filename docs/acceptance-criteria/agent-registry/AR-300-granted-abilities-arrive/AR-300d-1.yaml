  agent: approve_acs
  date: '2026-10-01'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  THIS IS THE CRITERION THE CHEAP FIX FAILS. A repair that hand-edits every
  existing definition so the section arrives satisfies AR-300a completely and
  fails this completely -- and that repair is today's design, made correct once
  by hand. The whole defect exists because delivery was made conditional on each
  definition carrying a marker that nothing required and nobody added.

  'NOTHING ELSE EDITED' IS THE ASSERTION, NOT THE SETUP. The temptation is to
  read this criterion as being about the new agent's prompt. It is about the set
  of files that had to change to get there; the prompt is only how the result is
  observed. A test that adds the agent AND its central entry AND a marker, then
  checks the prompt, passes on the broken design.
