title: "Deliberately restricted categories keep an explicit writer list and are exempt from derivation"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given three categories exist whose narrow writer sets are a deliberate design
    decision rather than an oversight — quality-concern, subagent-quality and
    process-finding,
  And the permitted-writer set is derived from the live agent roster for the
    general-purpose categories ONLY, while these three keep an explicit, literally
    enumerated writer list that derivation never widens,
  When a submitter that is an entry in the live roster but is not on the enumerated
    list of one of those three categories submits to it (for example a coder agent
    submitting to quality-concern),
  Then the report is rejected with an error naming the category and stating that the
    category's writer list is explicitly restricted,
  And the same submitter's report to a general-purpose category in the same run is
    still accepted,
  So that broadening the general categories does not silently flatten the two-tier
    vocabulary into "everyone may write everything".

  Given the enumerated writer list of one of those three categories,
  When the permitted-writer configuration is loaded,
  Then every entry on that list is either an identity present in the live agent roster
    or the designated non-agent guard identity,
  And any other value is rejected at load time with an error naming the value and the
    category it appears in,
  So that the lists that stay hand-maintained cannot rot into names that no longer
    exist while the derived lists stay current by construction.
