it_requirements:
  - >-
    Decision (IT PO, 2026-10-30): the kind stops reading wrong_version_contains, and the key is removed
    from row 1 of scripts/evals/sets/sql-test-writer.jsonl, its only user. An entry counts when its ac_id
    matches, its test has a '::' test id whose path or name names the row's function (the row's 'contains'
    value), and its wrong version has at least one non-whitespace character.
  - >-
    The failing detail for a file whose entries cover a different function names the uncovered function
    (fn_refresh_due).
  - >-
    Unit tests never call a live model; recorded outputs and probe fixtures only. The live to-run-later
    file from the KI symptom (all four entries) is added as a recorded positive probe; each failing case
    in the criteria gets a negative probe. The existing review test that pins wrong_version_contains (unit_tests/evals/tq200d2/test_tq200d2_review.py)
    is updated in the same change and listed in the consumer-test sweep, the reason being that the rule
    it pinned is this defect.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched; no new
    module is added at the top of scripts/evals/ (15-file density cap). Tests go in unit_tests/evals/tq200d2/.
  - >-
    DOCUMENTATION (part of done) - the sql_to_run_later_names_wrong_version entry on docs/reference/produced-tests-eval-assertion-kinds-sql-test-writer.md
    must state: the function is checked in the test id, the wrong version only for being non-empty, ac_id
    must match; the live entry 'select refresh_due (retry_due parameter ignored entirely)' as the passing
    example; the wrong-function file as the failing example; and the quoted template line. The entry names
    its passing and failing examples by the recorded probe files that the unit tests score, so a doc-drift
    test can score the named files and check each gives the result the page states.
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md produced-tests section gains (or updates) one
    line for sql_to_run_later_names_wrong_version: a to-run-later entry counts when its test id names
    the function and its wrong version is non-empty; the wrong-version text is free prose, with a link
    to the kind's entry on the reference page. It states the rule in one sentence and does not restate
    the entry.
  - >-
    DOC-DRIFT TEST: the passing and failing example files the entry names score as the entry says; the
    TQ-200d-1-ii drift tests stay green.
  - >-
    KNOWN ISSUE: add to the Status line of docs/known-issues/testing-quality/open-low-ki-tq-20261025-sql-test-writer-eval-rejects-valid-live-outputs.md
    'part (a) fixed by TQ-200d-2-i'; the file stays open until TQ-200d-2-ii moves it.
  - >-
    CHANGELOG: one entry for TQ-200d-2-i written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, naming the to-run-later rule change and its reference entry.
test_spec:
  - name: test_live_to_run_later_entry_in_own_words_passes
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The recorded live to-run-later file (ac_id TQ-9501, test id naming test_fn_refresh_due, wrong version
      'select refresh_due (retry_due parameter ignored entirely)') passes sql_to_run_later_names_wrong_version.
    must_catch:
      - revert the fix
      - function name required inside the wrong-version text
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sets/sql-test-writer.jsonl
  - name: test_to_run_later_entries_that_must_not_count
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Each fails: a file whose only entry tests a different function (detail names fn_refresh_due), an
      entry with an empty or whitespace wrong version, an entry whose test has no '::' test id, a file
      whose ac_id is not TQ-9501.
    must_catch:
      - test-id function check dropped with the prose check
      - blank wrong version counted
      - entry without a '::' test id counted
      - ac_id not checked
      - failing detail omits the uncovered function
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
  - name: test_sql_test_writer_gold_still_passes
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent sql-test-writer --score-gold --results-file <tmp>
    description: >-
      The real CLI replays the recorded gold outputs; the stored-procedure-regression row and every other
      row pass.
  - name: test_reference_entry_examples_score_as_stated_and_template_line_unchanged
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The passing and failing example files named on the entry score pass and fail as the entry says,
      and templates/agents/sql-test-writer.md still holds 'the wrong version in your own words'.
test_rationale: >-
  The defect is a check stricter than the template, so the first test is the real live output that was
  wrongly failed, carrying 'revert the fix'. The negative probes keep the loosened check from becoming
  no check: each names one way the remaining rules could be dropped with the prose rule. Gold replay through
  the real CLI proves the row spec change is wired.
