test_spec:
  - name: test_ge119a1i_four_parseable_definitions_inspected_and_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Five staged agent definitions with exactly one unparseable: findings are reported for the four parseable ones."
  - name: test_ge119a1i_unparseable_definition_warned_by_name_not_blocking
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The unparseable definition is warned about by filename and does not block the commit."
  - name: test_ge119a1i_overall_result_is_ordinary_success_not_could_not_check
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The run's result value is the ordinary success value from the GE-119a-1 vocabulary, not the could-not-check value — the contradiction guard for the whole tree."
test_rationale: "The criterion is a NEGATIVE guarantee: the feature must not change an approved behaviour. It is only observable by running the guard against a real staged set containing a genuinely unparseable definition and reading the result value. Asserting that a fail-open branch exists in the source proves nothing about which result value the branch now returns, which is exactly what GE-119a-1 changes elsewhere in the same family."
