title: "The suite uses the whole machine, without tests treading on each other"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  A run spreads across the cores available and still gives the same answer it
  would give one test at a time.

  Today the suite works through its tests one after another while the rest of
  the machine sits idle, and almost all of that time is spent waiting on
  separate programs to start and finish rather than on any real computation —
  exactly the shape of work that a machine can do several of at once. Running
  them side by side is only worth anything if the answer does not change, so
  this also means tests stop quietly sharing the same scratch space and the
  same checkout: each gets its own, and a run spread across many workers
  agrees with a run done one at a time.
