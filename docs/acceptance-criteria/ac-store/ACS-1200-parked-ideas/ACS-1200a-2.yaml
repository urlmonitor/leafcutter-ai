it_requirements:
  - "ADR-001 SOURCE-AND-DEPLOY: the change lands in templates/scripts/commit_guardian/check_ac_parent_covered_by.py, but the wired gate at .pre-commit-config.yaml:294 executes 'python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/check_ac_parent_covered_by.py'. A template-only change is a no-op for every real commit. python3 scripts/build.py must run and the acceptance evidence must come from executing the DEPLOYED copy, not the template."
  - "The exemption must not be reachable through a degraded path. This hook resolves derive_parent_id through a private _get_derive_parent_id() with a graceful fail-open fallback (around line 377), rather than through the shared templates/scripts/commit_guardian/_resolve_root.py that 27 other guardian files use — because scripts/ac_store/ac_parent_id.py is not in the build deploy_map. Whatever the existing fail-open policy for parent derivation, a FAILURE TO READ THE MARKER must never be treated as 'parked': an unreadable marker is not a decision, and a fail-open marker read turns any resolution error into a silent universal exemption."
  - "Name every enforcement point, and say which is load-bearing. The rule is described in three places that must not drift: the hook source, the deployed copy, and the hooks_manifest entry for check-ac-parent-covered-by in templates/scripts/commit_guardian/commit_guardian.json (id at line 866, with name/_comment/entry). That manifest is deployed twice — to scripts/commit_guardian/ and to config/commit_guardian/ (scripts/build_phases.py:1334-1342) — and its description must state the exemption. The load-bearing gate is the deployed hook invoked by run_hook.py; the manifest text is documentation of it."
  - "PERFORMANCE / no second store walk: the existing suite pins single-walk behaviour (unit_tests/commit_guardian/test_check_ac_parent_covered_by.py::TestStoreWalkedExactlyOnce). The exemption lookup must reuse the store index already built for the run (templates/scripts/commit_guardian/_ac_store_index.py) rather than re-scanning the store per staged file. The hook runs on every commit that touches the AC store."
  - "PREREQUISITE RECONCILIATION — ACD-1403. ACD-1403 (status: active, readiness: reviewed, level: null, work_status: null) asserts that check_ac_parent_covered_by.py 'was removed as part of ACD-1100' and requires unit_tests/commit_guardian/test_check_ac_parent_covered_by.py be deleted. Verified 2026-08-14: the hook exists, the test exists, and the hook is wired at .pre-commit-config.yaml:294 and blocked a real commit with 6 violations. If ACD-1403 is built as written it deletes the coverage ACS-1200a-2, ACS-1200c-1 and ACS-1200c-2 depend on. ACD-1403 must be reconciled (retired or corrected by its owner) BEFORE this AC is implemented. Do not amend ACD-1403 from this tree."
  - "The exemption message must go to stdout as well as stderr and must be emitted once per parked parent, not once per exempted child — the criterion asks for KM-200 named ONCE. This is the same output stream contract ACS-1200c-2 asserts for the block message."
  - "Coverage must execute the hook as a subprocess and assert exit code plus captured output. The existing test file drives the module in-process via importlib.util plus unittest.mock.patch (lines 26-32); in-process patching can satisfy the assertions while the deployed fail-open path is what actually runs. Add process-level differential coverage rather than extending the in-process style."
  - "Staged-set determination is done through git, so the differential runs must be performed against a real git index in a temporary repository — passing file paths to the hook without staging them exercises a different code path from the one pre-commit uses."
