notes: |
  Cross-cutting enforcement outcome shared by all three web-app checks: the L0
  promise that a change breaking the web app is "caught and stopped before it
  merges, not after". Framed outcome-first — the result is visible on the pull
  request and a failing web-app check gates (blocks) the merge. Whether each
  check is wired as a required (blocking) status check vs. an informational one,
  and the exact branch-protection required-status-check list (mirroring BP-1200c-1
  for the Python gate), is the it-po's technical decision at enrichment; this AC
  fixes the OUTCOME, not the wiring mechanism.
  IT-PO note: DECIDED = settings-as-code ruleset edit (the required-checks list
  lives in the `require-ci-lint` ruleset, not classic branch protection) with a
  documented manual fallback; needs the non-EMU urlmonitor account.
