roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a newly added gate configured enabled: true, strict: false,
  When it runs against a change that contains a violation it detects,
  Then it reports the finding on stderr but exits 0 (non-blocking, advisory),
  And the build or commit is not failed by that gate.
