notes: |
  THE WRITE-SIDE HALF OF BUG-23, split out of BO-2900f-1-ii on 2026-08-18.

  THE EVIDENCE. Ticket 03 of EPIC-DeploymentCompleteness ends with:

      ### 2026-08-17 21:10 -- commit (status: ok)
      ### 2026-08-17 21:20 -- commit (status: ok)

  Two entries, same gate, same successful outcome, ten minutes apart. The agent that
  wrote the second one is the commit agent, not the driver. Exactly-once recording is
  therefore the writer's obligation; the driver's obligation is to adjudicate
  correctly from whatever it finds, which is what BO-2900f-1-ii now says.

  WHY IT IS PARENTED UNDER BO-2900f-2 RATHER THAN BO-2900f-1. BO-2900f-2 is the
  exactly-one-recorded-outcome-per-requested-gate cardinality invariant; this AC is its
  write-side enforcement, and the entry count BO-2900f-2 asserts is exactly what this
  AC produces. BO-2900f-1's three L3 children are all driver-side read-back rules over
  a record the driver did not author -- a coherent family this AC does not belong to.
  BO-2900f is also at the five-L2 cap, so a new L2 was not available and would have
  been the wrong shape regardless: this is an edge case of an existing invariant, not
  a new one.

  WHY assigned_agent IS llm-expert. The surface is templates/skills/signoff/SKILL.md
  and the shared templates/agents/_signoff_block.md partial, not Python. Being an
  llm-expert AC, it is not bound by the package-surface if/then in
  config/ac_store_schema.json, which keys off assigned_agent: python-coder -- so
  it_requirements is the list-of-strings form used by the other llm-expert ACs in this
  component (see BO-2500e-6) rather than the five-field object. The parity-guard
  descriptor lands in unit_tests/commit_guardian/ and may need a python-coder companion
  pass if the checker itself has to change; that is flagged here rather than split,
  because whether it changes at all depends on how the update is expressed.

  THE TRAP THIS AC INHERITS. BO-2900f's notes and CLAUDE.md 'Skip-Branch
  Side-Effects' record that the earlier gap-free-records work shipped a
  double-recording bug -- a skip-branch call added while the pre-existing
  unconditional call was left in place -- and that the structural test was blind to it
  because its regex matched only one of the ways the call could be written. That is
  the same shape as the duplicate here, one layer up in the stack, and it is why no
  test on this AC may take the presence of an instruction as evidence that the
  instruction is followed.
