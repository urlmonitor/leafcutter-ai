id: BO-4300e-2-viii
title: "Files that disappear while a workspace is being cleared count as already gone"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a ready workspace "ticket/alpha" holding nothing unsent, whose folder
    "build/tmp" holds 200 files,
  And a program outside the workspace deletes those 200 files and then the
    folder "build/tmp" itself while the clearing of "ticket/alpha" is under way,
  And a second ready workspace "ticket/beta" holding nothing unsent, one of whose
    files "locked.bin" still exists and cannot be deleted during clearing,
  When the clearing of "ticket/alpha" completes, and then the clearing of
    "ticket/beta" completes,
  Then "ticket/alpha" is answered cleared, and no folder or file of it remains
    at its location,
  And the answer for "ticket/alpha" names no file or folder of "build/tmp" as a
    failure,
  And "ticket/beta" is not answered cleared, and its answer names "locked.bin"
    as the item that could not be deleted.
depends_on: [BO-4300e-2, BO-4300e-2-i]
