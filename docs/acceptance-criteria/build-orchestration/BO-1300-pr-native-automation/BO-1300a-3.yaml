criteria: |
  Given an open pull request exists from the working branch into main and the automation is ready to deliver the unit of work
  When the automation makes the work reach main
  Then it does so by merging the pull request
  And it does not run any operation that pushes the unit-of-work commits directly to main (for example a push whose destination ref is main)
  And after delivery the working-branch commits appear on main as the result of the pull request merge, not as a direct push
depends_on: [BO-1300a, BO-1300a-2, FIN-100]
