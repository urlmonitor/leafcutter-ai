id: KM-400c-4-i
title: "The embedding ingestion job requires a provider, and its contract does not admit a missing one"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-400c-4
criteria: |
  Given the embedding ingestion job embed_snapshot, which binds every vector it publishes to its provider's model and dimensions
  When its declared parameter types are read
  Then the provider parameter admits only an embedding provider and does not admit None
  And the provider parameter has no default, so a caller cannot leave it out

  Given the synthetic demonstration, the only caller of embed_snapshot outside the tests
  When it runs its embedding step against a writer that records what it receives
  Then it passes the provider it constructed, not None
  And the job embeds the 3 Decision and Lesson records of its snapshot with that provider's model synthetic-fixture-v1 and 2 dimensions
  And the writer receives those 3 vectors under that model and those dimensions
depends_on: [KM-400c-4]
