assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "ONE WORKTREE, ONE COMMIT PATH, ONE PULL REQUEST. templates/workflows-js/fast-lane-ship.js already opens exactly one PR at the end of the arc; the change is that the non-code phases write into that SAME worktree, not that a second publication path is added. Do not add a per-craft commit or a per-craft PR — splitting them re-creates the drift this component keeps paying for (a page describing code that never landed)."
  - "THE ENDING'S PER-MEMBER ACCOUNT MUST BE DERIVED FROM resolve_connected_build_set's OUTPUT, NEVER FROM THE LIST OF MEMBERS THAT WERE DISPATCHED. Deriving it from the dispatched list makes a dropped member structurally invisible, which is exactly the second scenario's failure. Assert cardinality against the resolved set."
  - "TESTS TRAVEL WITH THE CODE MEMBER (user decision D3, 2026-08-31). No test member is enumerated in a group. verify_red_baseline and verify_green_and_coverage in scripts/build_orchestration/fast_lane.py remain the code member's proof, keyed off that record's `test_spec` / `test_required`; they must not be modelled as a member of their own or the group accounting will show a signed-off code deliverable beside an unstarted tests deliverable."
  - "EVIDENCE IS ARTIFACTS PLUS PULL-REQUEST CONTENTS, NOT HAND-OFF COUNTS. This criterion claims the artifacts ARRIVE TOGETHER; counting dispatches cannot establish that. Assert on the files in the single commit/PR diff."
  - "The operator's instruction is one AC id and nothing else — no member-selection argument may be consulted, defaulted or inferred. That is part of the criterion, not ergonomics."
  - "DEPLOY MANIFEST: any new module the run imports goes into the deploy list in scripts/build_phases.py; verify by running the DEPLOYED entry point, not source-tree unit tests."
  - "NO PRESENCE-ONLY ASSERTIONS: check_presence_only_assertions.py is a live ratchet. Execute the run over a real mixed fixture store and read the working tree and the PR diff."
delivers_to:
  agent: python-coder
  contract: "Group-completion account emitted at the run's ending: one entry per member of the RESOLVED set, each {ac_id, craft, artifact_path, outcome: 'delivered'|'blocked', reason?}, plus the single pull-request reference containing every delivered artifact. Consumed by BO-3500b-2 (which forbids a successful ending for a reduced group) and by BO-3500c-1's done gate."
expects_from:
  ac_id: BO-3500a-1
  contract: "The per-member dispatch plan {ac_id, craft, source} over the fully resolved connected set, so every member of a mixed group is routed rather than the group being refused for containing non-code members."
