notes: |
  STALE SURFACE — raised by the IT PO for BA/PO reconciliation, not resolved here.
  This AC's target file was removed by 63a846ac0 during the markdown-to-JS
  workflow migration, so the AC is unfalsifiable as written while still carrying
  work_status: done. Two follow-ups belong to the requirement owners, not to the
  test contract: (1) decide whether this AC should be superseded/retired now that
  the prose workflow layer is gone, and (2) decide whether the four-section
  completion contract should be re-asserted against
  templates/workflows-js/build-feature.js, whose epic-completion return currently
  emits neither manual_tests nor a four-section message — i.e. the user-visible
  behaviour this AC bought appears to have regressed on the epic path in the
  migration. If (2) is wanted it needs a NEW AC against the JS surface, which can
  then be covered behaviorally via the E2 workflow harness.
