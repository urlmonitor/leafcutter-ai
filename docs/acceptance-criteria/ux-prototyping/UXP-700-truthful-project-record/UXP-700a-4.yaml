  - ux_prototyping
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the set of files a record needs in place before its checker can begin checking,
  When the tooling's own build runs,
  Then the build installs a record into a throwaway empty project and runs that record's
    checker against it,
  And the build fails, naming the file, when any file the checker reads before checking begins
    was not installed,
  And the set of files the build requires is derived from what the checker reads rather than
    restated by hand, so adding a new start-up input to the checker extends what the build
    requires with no second edit,
  And the build states how many required files it checked, and that figure rises by exactly one
    when the checker gains one start-up input.
