assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The recovery entry point + step engine must have a package SOURCE home under the tree build.py deploys from (templates/... — e.g. a templates/skills/ or templates/scripts/ location per the existing deploy convention) and be copied into the consumer's project by build.py, so a fresh install gets it. The canonical source and the deployed copy must be kept in parity via the build.py round-trip (ADR-001)."
  - "The guarantee is PORTABLE: no part of the recovery behavior may rely on the leafcutter repo's root CLAUDE.md or any file not deployed to consumers (ADR-001). Verify a fresh install picks up the helper (the BO-1400a-2 fresh-install-reachability lens is the precedent for this check)."
  - "This AC is the deployment/parity wiring only; the human-invoked-only gate (BO-1600d-1), dry-run-first (BO-1600d-2), and the repair steps (BO-1600d-3) define the behavior being deployed — do not re-derive them here."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
