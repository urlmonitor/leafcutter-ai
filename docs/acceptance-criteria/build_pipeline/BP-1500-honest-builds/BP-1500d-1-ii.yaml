  - ac_id: BP-1500d-1
    contract: "The out-of-package consumer-simulation harness and a real build that produces a record into the receiving project. This AC drives that harness into a state where one managed file's destination steps back out of the project, and reads the record the build leaves. It builds no second harness. NOTE THE PLACEMENT RULE PRECISELY, because the parent states it loosely in three fields (see the parent's notes): the forbidden layout is target EQUAL TO the producing package's parent directory. Being a DESCENDANT of that parent is not forbidden and must not be asserted against -- the correct sibling layout places the receiving project and the package copy side by side under one scratch root, so the target is a descendant of the package copy's parent in every correct run. A precondition written as not-a-descendant rejects the only layout that proves anything here."
  - ac_id: BP-1500d-3
    contract: "The build's failure verdict for a destination that cannot be expressed as a position inside the project at all. This AC's first Then clause offers the implementer that verdict as one of two acceptable outcomes, so the two ACs must not disagree about it: whichever way this behaviour is closed, -3's paired-success run must still pass unchanged. A closure that turns more destinations into refusals is the wholesale-refusal regression -3's it_requirements forbid, arriving under a different name."
