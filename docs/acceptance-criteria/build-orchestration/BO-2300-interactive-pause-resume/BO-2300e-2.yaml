  agent: python-coder
  contract: "Pause-store dispatches routed to command-step-runner with a named workspace in every one of the six call sites, and the agent registry's command-step-runner.spawned_by updated to include plan-feature.js. Consumed by BO-2300e-3, which governs how the workflow classifies the reply these dispatches return."
