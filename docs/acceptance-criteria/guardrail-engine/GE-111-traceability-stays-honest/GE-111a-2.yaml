it_requirements:
  - "The enforcement-mode setting lives in a new traceability_reconciliation section of scripts/commit_guardian/commit_guardian.json (config-driven, not hard-coded), mirroring the GE-100 duplicate_code.strict / diff_coverage.strict warn-vs-block config keys. Suggested key: enforcement_mode with values block (default) | warn."
  - "The default when the section is absent OR present-without-the-key must resolve to BLOCK (the user-confirmed headline behavior). Absence of config must never silently degrade to warn."
  - "Config defaults must be read through scripts/commit_guardian/config.py the same way existing checks read DUPLICATE_CODE_STRICT etc.; do not re-implement JSON loading inline."
  - "The deployed commit_guardian.json and its packaged template source must be edited together and verified in parity via the build.py round-trip (ADR-001)."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4) when reading config."
