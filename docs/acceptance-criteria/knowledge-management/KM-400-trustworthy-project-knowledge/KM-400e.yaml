amended_by:
  - '2026-10-09: business-analyst added KM-400e-6, KM-400e-7 and KM-400e-8 after a
    measured capacity incident in which the backend filled, latched read-only and had
    to be destroyed and recreated, and after 60 consecutive synchronization failures
    caused partly by guessed configuration defaults. The three children add a
    headroom check that refuses an unsafe publication before writing, an operator
    surface that makes retained generations and remaining capacity visible, and a
    rule that an unset required backend setting fails loudly instead of being guessed.
    work_status moved from done to in_progress because three children are todo, and
    KM-400e-5 was amended in the same pass. A temporary child_limit_override of 8 was
    taken, to be removed by a structural rebalance. That rebalance has since happened —
    see the following entry; the override now stands at 6 and two of the three children
    named above no longer live here.'
  - '2026-10-09: product-owner carried out that rebalance on the user''s instruction.
    KM-400e-6 and KM-400e-7 were re-parented to a dedicated retention-and-capacity L1,
    KM-400f, as KM-400f-3 and KM-400f-4; they had to be renamed because parentage in
    this store is derived from the id string, which was safe because both ids were one
    day old, uncommitted and referenced nowhere outside their own files and their
    parents. KM-400e-8 deliberately stayed: it is about honest configuration — an unset
    required backend setting failing loudly instead of being guessed — which is this
    L1''s own subject of continuing honestly when the capability cannot be used, it
    comes from a different incident (60 consecutive synchronization failures) and it
    depends on KM-400e-5''s synchronization job. KM-400f''s subject is staying inside
    declared storage limits, and its wording was not stretched to absorb a fifth child
    it does not honestly describe. That leaves six children here, so
    child_limit_override is reduced from 8 to 6 rather than removed — a deliberate,
    smaller waiver, not an oversight. work_status stays in_progress, correctly:
    KM-400e-5 is in_progress and KM-400e-8 is todo.'
