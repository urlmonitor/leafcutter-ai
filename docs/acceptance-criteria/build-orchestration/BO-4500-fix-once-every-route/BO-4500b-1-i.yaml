id: BO-4500b-1-i
title: "A marker naming no known block, or a block whose source is empty, fails the install and leaves installed routes untouched"
component: build-orchestration
components:
  - build_pipeline
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-1.yaml"
criteria: |
  Given route A's template marks an empty place for a block named ALPHA-ANSWR,
  And the package holds block sources only for ALPHA-ANSWER and BETA-ANSWER,
  When the package is installed,
  Then the install fails with a message naming route A, the line of the start marker, the
    unknown name ALPHA-ANSWR, and the known block names ALPHA-ANSWER and BETA-ANSWER,
  And every installed route is byte for byte as it was before that install began.

  Given route A's template marks an empty place for ALPHA-ANSWER,
  And the ALPHA-ANSWER source exists but holds no text other than whitespace,
  When the package is installed,
  Then the install fails with a message naming the block ALPHA-ANSWER as having an empty source
    and naming route A as a route that needs it,
  And no installed route carries an empty ALPHA-ANSWER marker pair,
  And every installed route is byte for byte as it was before that install began.
depends_on: [BO-4500b-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-1.yaml
    relationship: parent
    status: exists
  - path: docs/acceptance-criteria/build-orchestration/BO-4300-one-way-workspaces/BO-4300c-3.yaml
    relationship: related
    status: exists
    relevance: "Its 'a source block that is missing fails the build' rule, generalised."
assigned_agent: python-coder
estimated_complexity: S
package_surface: false
declared_files:
  - path: scripts/build_phases_workflows.py
    state: existing
it_requirements:
  - >-
    The unknown-name check compares against the DERIVED block set (BO-4500b-1), never a list kept
    in code. The message lists every known block name in a stable sorted order, so the same
    package always produces the same text.
  - >-
    A source is empty when it holds nothing but whitespace (spaces, tabs, CR, LF). Any other
    character makes it non-empty.
  - >-
    Every route that needs an empty block is named, not only the first one found.
  - >-
    Both conditions are found in BO-4500b-1's validation pass, before any installed route is
    written, so a failing install leaves the installed set untouched in every deployed location.
delivers_to: null
expects_from:
  ac_id: BO-4500b-1
  contract: >-
    BO-4500b-1's marker grammar, the derived block set (block name = the identifier of its single
    source in the one sources location), and the validate-all-then-write fill that reports
    failures on stderr with route path and 1-based marker line.
test_intent:
  - clause: the install fails with a message naming route A, the line of the start marker, the unknown name ALPHA-ANSWR, and the known block names ALPHA-ANSWER and BETA-ANSWER
    needs_test: true
    reason: An unknown name must fail with a self-diagnosing message, and a fill that skipped the marker would pass silently.
  - clause: every installed route is byte for byte as it was before that install began
    needs_test: true
    reason: Both failure scenarios must leave the installed set untouched, which a write-as-you-go fill would break.
  - clause: the install fails with a message naming the block ALPHA-ANSWER as having an empty source and naming route A as a route that needs it
    needs_test: true
    reason: A whitespace-only source would otherwise ship a route with no block body at all.
  - clause: no installed route carries an empty ALPHA-ANSWER marker pair
    needs_test: true
    reason: The observable harm of an empty source is an empty installed pair, which must be asserted on the installed text.
test_spec:
  - name: test_unknown_block_name_fails_install_with_diagnosing_message
    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Route A marks ALPHA-ANSWR; the install fails on stderr naming route A, the 1-based start-marker line, ALPHA-ANSWR and the sorted known names ALPHA-ANSWER, BETA-ANSWER."
    proves_clause: "the install fails with a message naming route A, the line of the start marker, the unknown name ALPHA-ANSWR, and the known block names ALPHA-ANSWER and BETA-ANSWER"
    code_file: scripts/build_phases_workflows.py
  - name: test_failed_install_leaves_installed_routes_untouched
    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: failure
    description: "For both the unknown-name and the whitespace-only-source fixtures, snapshot every installed route (all deployed locations) before and compare after the failed install."
    proves_clause: "every installed route is byte for byte as it was before that install began"
    code_file: scripts/build_phases_workflows.py
  - name: test_whitespace_only_source_fails_naming_block_and_every_needing_route
    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: failure
    description: "ALPHA source holds only spaces, tabs, CR and LF; the install fails naming ALPHA-ANSWER as empty and naming route A (and every other route needing it)."
    proves_clause: "the install fails with a message naming the block ALPHA-ANSWER as having an empty source and naming route A as a route that needs it"
    code_file: scripts/build_phases_workflows.py
  - name: test_no_installed_route_carries_empty_marker_pair_after_failure
    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: failure
    description: "After the empty-source failed install, no installed route contains an ALPHA-ANSWER start marker immediately followed by its end marker."
    proves_clause: "no installed route carries an empty ALPHA-ANSWER marker pair"
    code_file: scripts/build_phases_workflows.py
  - name: test_validation_failures_are_reachable_from_the_workflow_build_phase
    target_dir: unit_tests/scripts/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "Call the real build_workflow_scripts entry point on the unknown-name fixture and assert the failure surfaces from it (non-zero exit / raised install error with the message on stderr)."
    proves_clause: "the install fails with a message naming route A, the line of the start marker, the unknown name ALPHA-ANSWR, and the known block names ALPHA-ANSWER and BETA-ANSWER"
    code_file: scripts/build_phases_workflows.py
