assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    Whether a halt releases is decided from the run's own record that a claim succeeded,
    in the one halt path every halt passes through, including declined steps and any step
    added later. It is never decided per step.
  - >-
    A decline before the claim (worktree probe, resolve, producibility) performs no store
    write and dispatches no release. Releasing on a run that never claimed would return
    ACs a concurrent run holds to todo (BO-2400f-8, same rule as BO-2400f-12-i).
  - >-
    A decline after the claim, including an empty or unreadable reply, releases every
    claimed AC that did not reach done. The release is dispatched to the lane's
    command-step agent (command-step-runner via BO-2400f-5-i), not to python-coder.
  - >-
    Release outcome reporting, including partial release, follows BO-2400f-10-ii
    unchanged.
  - >-
    Store assertions are made against a real on-disk fixture store before and after the
    run, not against the run's own report.
  - >-
    Edit the template lane and regenerate the deployed copy through build.py. Template
    and deployed copies stay in parity.
test_required: true
test_spec:
  - name: test_pre_claim_decline_dispatches_no_release
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "Parametrised over the worktree probe, resolve and producibility, a declining reply halts the run and the harness records neither a claim nor a release dispatch."
  - name: test_pre_claim_decline_leaves_store_byte_identical
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "An on-disk fixture store is snapshotted, and after a run declined at resolve every AC file is byte-identical and none reads in_progress."
  - name: test_post_claim_decline_dispatches_release_to_the_command_step_runner
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: seam
    description: "For every dispatch the harness records after a successful claim (discovered from the run, not a hand list), a declining reply at that dispatch halts the run and the release is dispatched with agentType command-step-runner."
    must_catch:
      - "release still dispatched to python-coder (today's state)"
      - "a declined context-bundle step halts without any release dispatch"
      - "only the steps listed in 2026-09 release; a later-added step does not"
  - name: test_post_claim_decline_with_empty_reply_still_releases
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: boundary
    description: "An empty reply at the context-bundle step after the claim is handled as a decline and triggers the release dispatch."
  - name: test_declined_context_bundle_returns_five_claimed_acs_to_todo_on_disk
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Against an on-disk fixture store with a five-AC connected set, a run whose context-bundle step is declined leaves all five reading todo in the store it claimed in."
  - name: test_retry_after_declined_context_bundle_is_not_refused_as_already_claimed
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "After the declined run above, a new claim for the same AC against the same on-disk store is neither refused nor narrowed on the ground that members are already claimed."
test_rationale: |
  The claim that matters here is about the store, not the run's report. The incident run
  reported a release and left five ACs in_progress. So the state assertions (byte-identical
  before the claim, todo after the claim, retry not blocked) run against a real on-disk
  fixture store, as in BO-2400f-12-i. The dispatch assertions (release asked or not, and of
  whom) come from runs executed under the workflow engine harness.

  The pre-claim tests guard the opposite mistake, the one BO-2400f-12-i names: copying the
  post-claim release into every halt branch. The per-dispatch release test discovers the
  post-claim dispatches from the run itself, so "a step added later" is covered without a
  hand-maintained list. It fails against today's code because the release goes to
  python-coder.
