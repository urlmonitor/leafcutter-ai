criteria: |
  One spec, no copies, nothing missing -- agents build straight from the store.

  The acceptance-criteria store is the single place a requirement lives. A ticket
  points to its criteria instead of carrying a second copy, and every agent that
  builds the work reads the requirement from the store itself. Because there is
  only one copy, it can never drift, and because a requirement is only handed to
  a builder once it is genuinely complete -- with the exact files to change and a
  clear test to satisfy -- an agent never has to guess. Every file a requirement
  names is the real file you edit, the requirement reads as the behaviour to
  build rather than the story of how it was written, and any supporting material
  it relies on stays consistent with what it asks for. The result: work reaches a
  builder in a state it can actually be built from, first time.
