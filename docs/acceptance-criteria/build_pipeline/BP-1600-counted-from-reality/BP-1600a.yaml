notes: |
  THE SEAM, AND WHICH CONSIDERATION WON. BP-100n's six children fell into two
  coherent groups of three. Group B — the former -1, -2 and -5 — share the rule
  BP-100n's own title states: an absence is reported as an absence, never as
  nothing to check. Group A — the former -3, -4 and -6 — share a different and
  prior rule: the population a check walks is taken from reality, never from a
  list that can omit things. The existing parent title fits group B, so the honest
  seam is to lift group A out. That is the seam this record names.

  Only one of the three could actually be lifted, and the reason is evidence, not
  taste. A child's parent is derived from its ID STRING, so moving a child renames
  it, and a rename must chase every citation of the old ID or leave a dead link.

    - BP-100n-3 is work_status: done. Its ID appears as a covers-tag in shipped
      source (scripts/build_phases.py) and names its own test file
      (unit_tests/build_guards/test_bp_100n_3.py), with further citations in
      test_bp_100k_2.py. Renaming a done record breaks the evidence chain that
      links criterion to code to green test — the one chain this whole store
      exists to keep honest — and would force implementation-source edits inside
      what is supposed to be a structural bookkeeping change.
    - BP-1600a-2 (then BP-100n-4) is readiness: approved and was, at the time of
      the split, cited from what this record estimated as roughly sixty places:
      the whole of the GE-127 feature folder, GE-126b-5 and -5-i, the GE-120f
      family, BO-210a-2, docs/reference/false-green-mechanisms.md (which names it
      as scheduled work), the guardrail-engine PROJECT_CONTEXT.md, a ticket, and
      unit_tests/commit_guardian/test_ge_127b_1_i.py. On top of that, the OPEN and
      UNMERGED PR #726 (branch ac-authoring/census-ownership) added five more
      references to it — from GE-120c-6, GE-120f, KM-ADM-001, TQ-100b-5 and
      TQ-100c-2-i — on a branch that was not visible from the split's worktree and
      must not have been edited from there. THE ESTIMATE WAS LOW BY ABOUT FOUR
      TIMES, WHICH IS THE POINT WORTH KEEPING: when the move was actually executed
      on 2026-09-07 the measured figure was 232 occurrences across 50 files, not
      sixty. The decision to defer was right for a reason stronger than the one
      given.
    - The former BP-100n-6 and its three children are cited by nothing outside
      their own family. Its own notes anticipated the rename.

  So: the semantically clean seam is group A; the affordable subset of group A is
  one record. Cost won, and it won on a specific ground — not "renames are
  disruptive" in the abstract, but that two of the three are load-bearing in
  artifacts a structural move has no business touching (shipped source, a green
  test file, and an unmerged branch). This L1 is therefore opened at its minimum
  size rather than opened dishonestly wide.

  WHY A ONE-CHILD L1 IS NOT A CATEGORY INVENTED FOR ONE RECORD. The category is
  the group-A rule, which already has three members and a stated expectation of
  more: BP-1600a-1's own analysis records that "two registration surfaces exist in
  this project and until now only one has been counted", which is a claim about a
  growing set of surfaces, not about one script directory. The alternative — filing
  a second surface's census as a sixth child of a parent whose title is about
  absence-reporting — would have hidden the category rather than named it.

  MIGRATION OF BP-100n-4 — DONE, 2026-09-07. This block previously read as a
  future instruction: "when PR #726 has MERGED, BP-100n-4 (with BP-100n-4-i and
  -4-ii) should be renamed BP-1600a-2 (with -2-i and -2-ii) and moved here, as its
  own deliberate change whose entire content is the rename and its citation
  sweep." That is what happened. #726 merged, its five added references were
  therefore visible and were rewritten with all the others, and the move ran as
  its own change containing nothing but the rename and the sweep. This L1 now has
  two children and no longer draws the sparse-parent advisory.

  WHAT THE SWEEP ACTUALLY COST, RECORDED BECAUSE THE ESTIMATE WAS WRONG BY 4x.
  Measured immediately before the move: 232 occurrences across 50 files — 160 bare
  BP-100n-4, 17 BP-100n-4-i, 49 BP-100n-4-ii, of which 30 were folder-qualified
  doc_link paths that had to be rewritten to the NEW feature folder in a separate,
  earlier pass. The ordering matters and is the one trap in this shape of move: a
  single bare-id replacement run first turns
  "BP-100-reliable-builds/BP-100n-4.yaml" into
  "BP-100-reliable-builds/BP-1600a-2.yaml" — right id, wrong folder, and a
  doc_link that resolves to nothing. Longest-match-first, always. The bare id was
  verified to be a clean prefix of both children (a uniq scan over every
  BP-100n-4* form returned exactly three variants and no BP-100n-40 or similar),
  which is what made one textual pass safe for all three records.

  BP-100n-3 is a separate judgement and stays where it is — a done record with
  covers-tags in shipped source is not worth renaming for tidiness, and renaming
  it would break the criterion-to-code-to-test evidence chain from inside a
  structural move. So BP-100n keeps one population record under an
  absence-reporting title. That residue is deliberate and is the last of it.

  WHAT THE SWEEP DID NOT REWRITE, AND WHY — 8 of the 232 occurrences. The rule
  applied everywhere else was that an AC id is an ADDRESS, not a claim: a stale
  address preserves no evidence, it destroys the only information the address
  carried, because the referent still exists and the reader can no longer reach
  it. So the old id was rewritten even inside amended_by entries and notes that
  describe decisions taken while the record was still called BP-100n-4. Two
  surfaces are outside that rule:

    - changelogs/ (5 occurrences in 4 dated entries). A changelog's subject IS the
      historical event — "commit 7c014f693 amends BO-210a-2 and BP-100n-4" is a
      statement about what a specific commit touched on a specific day. Rewriting
      it would make it describe a commit that never touched a file of that name.
      Here the old name is load-bearing as a description of the past, which is the
      one place the address-not-claim argument does not reach.
    - docs/agents/cards/python-coder.card.md (3 occurrences). Generated by
      scripts/generate_agent_cards.py from the AC store. Hand-editing a build
      output is the wrong surface — it is corrected by regeneration, and the store
      it derives from is now correct. Note that this file also carried unrelated
      uncommitted regeneration output at the time of the move, so it was left
      entirely alone rather than partially hand-patched.

  Anyone grepping BP-100n-4 in future will therefore find it only in dated release
  notes and a regenerable index, never in a live pointer.
