title: "Schema hook fails open and never blocks an unrelated commit on its own error"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the now-registered AC store schema hook encounters an unexpected internal
    error during execution (e.g. an AC YAML file has unparseable YAML, or the
    git diff command the hook runs fails),
  When the hook handles that error,
  Then it exits with code 0 (fail-open per project convention),
  And the commit is NOT blocked by this hook,
  And a diagnostic message identifying the hook and the error is written to stderr.

  Given no staged file under docs/acceptance-criteria/ contains an
    implements_pattern field and no staged AC file violates the store schema,
  When the commit is attempted,
  Then the schema hook exits with code 0,
  And the commit proceeds without blocking.
