title: "The planner says what must be proven, not how to prove it"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Planning records which outcomes need a test and why, nothing more.

  The planner marks which expected outcomes of a requirement must be backed by a test
  and gives the reason, and stops there. It no longer writes test designs it has no
  way to ground in the code.
