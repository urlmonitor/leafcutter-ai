assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - >-
    REUSE THE EXISTING NESTED NEGATIVE SHAPE; DO NOT INVENT A SECOND ONE. The
    signoff SKILL §2b already defines {result, reason, remediation} with all
    three sub-keys required, and the third Then clause depends on that existing
    definition rather than on a new one. Point at §2b; do not restate it in
    different words, or the two will drift and the reader will have two shapes to
    parse.
  - >-
    SPELL THE OUTCOME, NEVER A BARE BOOLEAN. What keeps this key clear of the
    §2b Bare-False Rule's one-per-phase auto-retry is the nested-object
    STRUCTURE, not the enum string. Mirror BP-1100g-5's choice of a named
    outcome value over a literal false, and keep its spelling byte-identical to
    §2b.2's — that value is a brand-new enum in the completion_manifest context
    with no other occurrence under templates/ or scripts/, so nothing validates
    it until BP-1100g-5-i's reader lands.
  - >-
    A BARE NEGATIVE MUST STAY PHYSICALLY WRITABLE. Do not add template wording
    that makes the malformed form unexpressible. The third Then clause requires
    the reader to be able to distinguish a bare no from a reasoned negative, and
    a shape nobody can write leaves that reader nothing to detect — the same
    reason BP-1100g-5 deliberately left a reasonless negative writable.
  - >-
    THE REASONED NEGATIVE MUST BE PRESENTED AS FIRST-CLASS, WITH THE SAME
    STANDING AS A POSITIVE ANSWER — not a failure, not a skip, not a downgrade.
    Template wording that frames it as a lesser outcome recreates the pressure
    to fabricate a proof, which is the failure mode this AC exists to prevent and
    is strictly worse than the one being fixed.
  - >-
    Must not state or imply any threshold on how hard the writer must try before
    a negative is acceptable. An unmeetable bar produces fabricated alterations
    recorded as evidence, and no record can establish that an alteration was a
    good choice.
delivers_to:
  - agent: python-coder
    ac_id: TQ-500b-1
    contract: >-
      A third conforming answer shape alongside the two in TQ-500a-1: a nested
      negative carrying result, reason and next step. The reader must place it in
      the answer-taken state, never in the answer-owed state, and must place a bare
      no in neither — a bare no is malformed and reported as such.
expects_from: null
test_required: false
test_rationale: |
  Genuinely test-free at this AC's boundary, on the BP-1100g-5 precedent. The
  deliverable is template prose defining a permitted answer shape in
  templates/skills/signoff/SKILL.md and templates/agents/test-writer.md. A test
  asserting the shape is described in a template is source-presence evidence and
  passes on an implementation that records nothing. The reader-side obligations
  this AC's contract states — a reasoned negative lands in answer-taken, a bare
  no lands in neither and is reported as malformed — are asserted over emitted
  records by TQ-500b-1-i (piece F) and by TQ-500b-1's reading, which carry the
  test contract for them.
