notes: |
  Produced for GE-124a's `documentation_triggers: [how-to]`. The PO's reason is
  explicit: there is no equivalent house convention to copy, because GE-117's
  docstring guidance is Python-only.

  `change_target: code` is carried here under the L0's standing instruction to
  keep `code` on EVERY record in this tree. `docs` would arguably describe a
  documentation AC more accurately; the instruction is followed as written
  rather than reinterpreted, and this note is where to change it if the user
  decides the documentation ACs are the exception. The instruction's own stated
  reason — never `ui`, so the tree cannot enrol itself in the reverse-direction
  gate it defines — holds either way. The same applies to GE-124b-4, GE-124b-5,
  GE-124c-4, GE-124c-5, GE-124d-4, GE-124e-5, GE-124f-4 and GE-124g-5.

  The last criteria clause is not padding — it is GE-124g reaching into the
  authoring surface. The how-to is the first place most authors meet this
  feature, so it is the first place the signpost-not-proof rule can be lost.

  IT-PO ENRICHMENT NOTE (2026-08-25). change_target `code` has a mechanical
  consequence the L0 note does not mention: check_ac_schema.validate_test_contract
  treats any record with change_target `code` as a code AC and REJECTS
  test_required: false on it outright. So every documentation AC in this tree
  needs a real test_spec, not a skip. That is satisfiable and worth having —
  the example blocks are executed against the real reader — but if the user ever
  reclassifies these nine records to `docs`, the test contracts can be
  reconsidered at the same time.
