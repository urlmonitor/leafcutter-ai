it_requirements:
  - "PORTABLE SURFACE: implement as a NEW commit_guardian hook script at 'templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py' (package source), deployed to the consumer's 'scripts/commit_guardian/hooks/check_files_touched_reconciliation.py' via build.py. Register it in the hooks_manifest.hooks[] array of 'templates/scripts/commit_guardian/commit_guardian.json' (id + name + entry via run_hook.py + language + files + stages + pass_filenames), mirroring the existing check-agent-spawn-consistency entry. This complements BP-1100a (pre-dispatch); it does NOT duplicate it."
  - "POST-CHANGE reconciliation, distinct from BP-1100a's PRE-DISPATCH declaration check: compute the set of source files ACTUALLY changed by the ticket (from the real diff) and compare against the ticket's declared files_touched UNION out_of_scope. Do NOT re-derive BP-1100a's pre-dispatch scope-completeness behavior."
  - "The gate point is BEFORE the ticket reaches status: done (at the pre-done/commit-time reconciliation step in the drive/finalize surface), so the mismatch is caught before 'done' masks missing work."
  - "Source files are those with source/executable extensions (.py/.sql/.ts/.tsx/.js). The union-with-out_of_scope exemption and generated/lockfile exemption are BP-1100e-1-i; path normalization is BP-1100e-1-ii; docs/config-only narrow-scope non-false-positive is BP-1100e-1-iii; the no-frontmatter no-op is BP-1100e-1-iv."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap the diff/frontmatter reads in try/except with a specific exception type and log at WARNING or higher; an errored reconciliation must fail open (BP-1100e-2), never hard-block by accident."
  - "PORTABLE per ADR-001: the hook + its commit_guardian.json config section + hooks_manifest entry ship to consumers via build.py, kept in parity via the build.py round-trip (canonical source = templates/scripts/commit_guardian/, the scripts/ copy is a build output); it must NOT rely on the leafcutter repo's own root CLAUDE.md."
