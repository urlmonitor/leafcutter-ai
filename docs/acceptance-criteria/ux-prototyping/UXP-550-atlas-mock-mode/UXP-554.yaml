assigned_agent: frontend-coder
estimated_complexity: M
it_requirements: |
  A CI check exercises the fixture repo two ways: (1) schema validation reusing the
  existing validators (e.g. scripts/ac_store/validate_ac_schema.py for
  docs/acceptance-criteria/**, docs/product-truth/scripts/validate_product_truth.py for
  flows/mock-data/mockups, plus the components.json / roadmap.json / agent_registry.json
  shapes); (2) parse-through by pointing repoRoot() at leafcutter-web/fixtures/ and
  invoking the real loaders (getAtlas + getFlows/getMockData), asserting each fixture
  parses through the loader for its native on-disk format (YAML AC store via ac-store.ts,
  markdown tickets via tickets.ts, JSON via roadmap.ts/components.ts/agents.ts/flows.ts)
  without error and produces populated, well-typed snapshots. The guard runs in CI and
  fails the build on any schema violation or loader parse failure.
