  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "When the green check reports one or more failing batch tests, the loop must NOT perform commit staging — a red batch is a hard block on staging, never a warn-and-proceed."
  - "The loop must report the AC ids whose covering tests are still failing, mapped from the failing tests' covers tags, so the operator sees which behaviors remain unmet."
  - "The refusal must be a structured blocker result from the workflow (not a silent no-op)."
