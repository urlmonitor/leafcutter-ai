estimated_complexity: M
it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "The steps before the decision point must not re-execute on resume. Re-running them is observable as duplicated or rewritten drafted work and is the failure this record exists to prevent."
  - "The waiting record must be cleared as part of moving past the decision point, not on process exit. A record left behind makes the run look permanently paused to anything that lists waiting runs, and the next resume then re-applies an answer to a decision already made."
  - "Clearing the record and applying the answer must not be separately observable in a way that leaves the run both resumed and still listed as waiting if the process dies between them; the later of the two must be the one that commits the run past the gate."
  - "The supplied answer must reach the decision through the same evaluation ACD-2100c-4 governs -- resume must not be a second, unguarded way to answer a gate."
  - "Must satisfy the repository error-handling policy: reading and removing the record are external I/O."
  - "Resume must be safe to attempt when no record exists: it reports that there is nothing to resume rather than starting a fresh run under the old run's identity."
test_spec:
  - name: test_resume_in_a_new_process_continues_from_the_decision_point
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A run paused to disk and its process exited; a second process supplying the
      person's answer continues from that decision point and the steps before it do not
      re-execute -- observed from the resumed run's own record of the steps it ran.
  - name: test_drafted_work_carried_forward_is_the_work_that_was_present_at_pause
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The drafted artifacts are compared byte-for-byte between the moment of pause and
      the moment the resumed run moves past the gate; the resumed run carries the same
      bytes forward.
  - name: test_supplied_answer_is_the_one_applied_to_that_decision
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Two resumes of equivalent paused runs supplying different valid answers take
      different observable branches -- so the answer is applied rather than a default.
  - name: test_no_waiting_record_remains_after_the_resumed_run_passes_the_gate
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      After the resumed run moves past the decision point, a fresh process that lists
      waiting runs does not list it -- the real writer's record consumed and cleared,
      read back by the real reader.
test_rationale: >-
  A new process is part of the Given because resuming inside the same process proves
  nothing about the record: the state is still in memory, and the interval between pause
  and resume is a human one measured in hours. Without this record the pause is just a
  slower discard -- a run can persist a perfectly good record and still restart from the
  beginning on re-entry, redoing the drafting and losing what was reviewed, which is why
  the "steps before it do not re-execute" assertion is separate from the byte comparison.
  The two-different-answers test is what distinguishes an applied answer from a default
  that happens to match. The cleared-record assertion is read by a second fresh process
  rather than by inspecting the store path directly, because the failure that matters is
  that the run still looks paused to whatever lists waiting runs.
