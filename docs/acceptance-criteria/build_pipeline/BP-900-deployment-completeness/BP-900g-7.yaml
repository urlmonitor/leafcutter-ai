id: BP-900g-7
components:
  - build_pipeline
title: "A registry entry naming an executable artifact that exists nowhere fails the build"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given any registry the package ships and its own tooling reads, whose entries name
    an executable artifact by path or by module name and thereby advertise it as
    present,
  And a registry entry naming an artifact that resolves to nothing — absent from the
    source tree, from the template tree, and from every deploy target,
  When the build runs its reference-integrity preflight over the package tree,
  Then the build exits non-zero and the failure names the registry file, the entry
    within it, and the artifact that could not be resolved,
  And the rule is stated as universal resolution over every entry of every registry
    that names an executable artifact — every named artifact resolves, or the build
    fails — and NOT as a list of known-missing names, so a registry written next
    month and an entry added to it tomorrow are both already subject to it,
  And a registry entry naming an artifact that does resolve produces no finding, so
    the check does not have to be suppressed, allowlisted, or narrowed to keep an
    otherwise-correct package tree building,
  And the demonstration is an invocation of the build's real preflight entry point as
    a subprocess over a package tree carrying a deliberately unresolvable entry, which
    must exit non-zero — reading the guard's source and finding the rule written there
    does not satisfy this criterion, because a rule that is written and never reached
    passes that reading while the build stays green,
  Because at HEAD 339b0981c config/package_boundary.json classifies
    check_test_requirements_refs.py as a shipped portable check and
    config/test_requirements.schema.json describes it as a live consumer that
    "verifies schema version consistency across all consumers", while no file of that
    name exists anywhere in the repository — and package_boundary.json is not inert
    prose, scripts/package_audit.py reads it. To every author who consults either
    file, an enforcement that was never written reads as an enforcement already in
    place, which is worse than a known gap: it suppresses the work that would close it.
