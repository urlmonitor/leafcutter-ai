id: GE-113c
title: "Guards work correctly even in the installed copy"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  A guard does its job the same way inside a consumer project as it does at home.

  The guards locate your project correctly even when running from the copy
  installed into a consumer project, so a guard never quietly fails or misbehaves
  because of where it was deployed — closing a latent gap where a guard could not
  complete its check in the installed layout.
