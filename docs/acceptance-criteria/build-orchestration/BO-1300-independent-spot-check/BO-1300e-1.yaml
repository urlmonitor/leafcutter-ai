assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Emitted ticket frontmatter must satisfy the ticket-authoring conventions enforced by the ticket_frontmatter_guard pre-commit hook (required fields including status: todo, description, and any guarded fields) so the ticket is not rejected and the fix flow can pick it up; reuse the existing ticket-creation helper rather than hand-rolling frontmatter."
  - "Tickets are written to tickets/00_inbox/ with status: todo so the standard prioritizer/fix flow picks them up; never write a finding to a done/ folder or with a terminal status."
  - "The ticket body must record provenance: what was probed, the reviewer angle that surfaced it, and the observed problem, traceable back to the consolidated result."
  - "Ticket emission must be idempotent / safe on re-run of the same pass so a repeated spot-check does not create duplicate tickets for an already-recorded finding."
delivers_to:
  agent: python-coder
  contract: "One inbox ticket per distinct finding under tickets/00_inbox/ with guard-valid frontmatter (status: todo) and a body recording probe + angle + observed problem; consumed by the standard fix flow."
expects_from:
  ac_id: BO-1300b-2
  contract: "Consolidated spot-check result { findings: [{ id, angle, summary, detail, blocking }], clean } whose distinct findings become inbox tickets."
