it_requirements:
  - "Must maintain a configurable mapping of driver package names to database identifiers and paradigms"
  - "Must support 'unclassified' paradigm for unknown database drivers (never fail on unknown)"
  - "Must handle errors gracefully when manifest files are unreadable or malformed"
  - "Must produce deterministic output for the same manifest content"
  - "Mapping data must be stored in a data file (not inline in code) to enable easy extension"
