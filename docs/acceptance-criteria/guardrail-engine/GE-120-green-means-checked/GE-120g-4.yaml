notes: |
  Found while acting on KI-CG-20260929, whose cause was identified on
  2026-10-07 and proven by running this check alone against a repaired file:
  0 escaped em-dashes before, 110 after, no other hook involved.

  THE GENERAL SHAPE, which is why this sits under GE-120g rather than under the
  liveness check's own L1: a judging check was handed a path and wrote to it.
  GE-120g-1's enforcement cannot see it because the path is untracked build
  output. Any other check registered with a writable `--manifest`-style
  argument has the same hole available to it.
