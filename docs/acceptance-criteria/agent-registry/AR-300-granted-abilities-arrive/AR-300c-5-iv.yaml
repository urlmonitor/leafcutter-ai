id: AR-300c-5-iv
title: "The authoring reference names one place to permit a sub-agent, and no surface still tells an author to hand-write a sub-agent table"
component: agent-registry
components:
  - agent_registry
  - documentation_system
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an author with no prior knowledge of this change, consulting the
    project reference for how an agent is defined,
  When they look for how to permit an agent to dispatch another agent,
  Then the reference names the agent's own declaration, beside the tools
    declaration, as the one place it is done, and describes the "every
    ticket-phase agent" entry and what it resolves to,
    And it states that the central registry's record of permitted sub-agents is
      derived and must not be authored by hand, naming what happens if it is,
    And it states that an agent permitted any sub-agent must also be permitted
      the tool by which an agent is dispatched,
    And no surface in the project still instructs an author to write a
      sub-agent table into an agent's body, or to make the list arrive by
      placing a marker in the body -- including the prompt-review checklist
      that today requires such a table,
    And the reference states that nothing beyond the declaration is needed for
      a permission to reach the agent,
  So the hand-written tables do not return the first time someone follows the
    instructions.
