notes: |
  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — derive the worktree base from the current directory's checkout top-level instead
         of the repository's main checkout. From a linked worktree this yields
         uxp-700-tranche-2\..\worktrees or uxp-700-tranche-2\worktrees. Caught by
         test_run_started_in_an_unrelated_worktree_names_the_same_location_as_from_main.
    M2 — on an occupied location, choose worktrees\EPIC-OtherEpic-2 or a timestamped
         path. Caught by test_occupied_location_refuses_without_choosing_an_alternative.
    M3 — treat any existing directory at the location as the target's worktree. Caught by
         the plain-directory and other-branch occupants in the same test.
    M4 — clear an occupied location to make room. Caught by the "nothing inside is
         changed" assertion in the real-repository test.

  ASSUMPTION, logged. "The target's branch" is whatever branch naming BO-4000's
  implementation settles on for the target (the incident used epic/truthful-project-record).
  This record does not fix the naming. It only requires that a worktree on a different
  branch is not mistaken for the target's.
