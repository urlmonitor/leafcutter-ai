id: BP-1300f-1-iv
components:
  - build_pipeline
title: "A file that did not exist at the merge base has no inherited type errors, so every type error in it is new"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Scenario: A new file with a type error fails
    Given the file scripts/fresh.py does not exist at the merge base,
    When the pull request adds it with one "return-value" error at line 2,
    Then the check fails,
    And it names scripts/fresh.py, line 2 and code "return-value".

  Scenario: A clean new file passes
    Given the file scripts/fresh.py does not exist at the merge base,
    When the pull request adds it with no type error,
    Then the check passes and reports 1 file inspected and 0 new errors.
depends_on:
  - BP-1300f-1
