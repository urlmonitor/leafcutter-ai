    relationship: describes
    status: exists
    relevance: Atlas routes table and how the app reads the repo; gains the /flows/<product>/<flow> addresses.
assigned_agent: frontend-coder
estimated_complexity: M
change_target:
  - code
  - ui
risk_surface: internal
it_requirements:
  - The not-found state's filter controls are live and use the UXP-591-5-iii re-pick function (first flow
    the selector lists under the new filters).
  - 'The change is one replace to flowHref(repicked) with no ?step= (the unknown flow''s ?step= is dropped)
    and entry state {crumbs: [repicked], filters: new}; never a push.'
  - The 404 view turns into a drawn flow client-side, in the same history entry. If the not-found UI is
    the Flows view rendered by leafcutter-web/app/flows/[...id]/not-found.tsx, the entry state written
    by the replace wins over that boundary's server-rendered not-found props whenever the entry is shown
    again, so Back after a later push draws fern-and-fig/checkout-and-pay, never the notice.
  - A reload of the replaced entry renders the re-picked flow through the catch-all route with a 200.
delivers_to: null
expects_from:
  - ac_id: UXP-591-1-ii
    contract: Not-found mode of the Flows view rendered by leafcutter-web/app/flows/[...id]/not-found.tsx
      with the full flow catalogue in the selector and filters real/user/all.
  - ac_id: UXP-591-5-iii
    contract: 'Re-pick function returning the first Flow id the selector lists under the new filters,
      applied with replaceEntry(flowHref(id), {crumbs: [id], filters}).'
test_spec:
  - name: setting Kind to Architecture on the 'Flow not found' state draws product-truth-architecture
      and replaces the address with /flows/leafcutter/product-truth-architecture at one history entry
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: criterion
    must_catch:
      - the unknown flow's ?step=resolve is carried to the new address
      - the filter change pushes an entry
      - the 'Flow not found' notice stays
  - name: setting Source to Mock on the 'Flow not found' state picks fern-and-fig/checkout-and-pay as
      the first listed flow
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: boundary
  - name: after picking Customer buys a plant and pressing Back the entry shows checkout-and-pay and never
      the 'Flow not found' notice
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: seam
    must_catch:
      - Back re-renders the not-found boundary's server props instead of the stored entry state
test_rationale: The risk is the not-found boundary reasserting itself after the replace; the Back test
  is the one that catches it.
test_required: true
declares_side_effect: false
origin_agent: business-analyst
created: '2026-10-09'
amended_by:
- action: approved
  agent: approve_acs
  date: '2026-10-09'
- reason: "2026-10-14 business-analyst: criteria REPLACED for UXP-617. Owner decision 2026-10-12: a filter change never swaps the drawn flow. Old behaviour (owner ruling at the AC gate 2026-10-09, decision (2)(c)): a filter change on 'Flow not found' cleared the notice, drew the first flow the selector lists and replaced the address. New behaviour, inferred by the BA from the never-swap rule because neither flow v6 nor dataset v4 models a filter change on 'Flow not found' (the dataset's filter invariant requires the previous state to show a graph): the notice and the address stay, no flow is drawn, the selector re-lists under the new filters and no entry is added. NEEDS OWNER CONFIRMATION before readiness goes back up. Title changed. Readiness lowered approved -> draft; it_requirements, expects_from (the re-pick function of UXP-591-5-iii) and the test_spec describe the rejected behaviour."
  agent: business-analyst
  date: '2026-10-14'
superseded_by: null
covered_by: []
implemented_by:
- tickets/00_inbox/TICKET-20261012-UXP-591-5-v.md
notes: |
  Owner ruling at the AC gate (2026-10-09), decision (2)(c): a Source, Kind or Realization change
  while the 'Flow not found' notice shows removes the notice, selects the first flow the selector
  lists under the new filters and replaces the current history entry with that flow's canonical
  URL. The flow leafcutter/explore-flows-in-atlas v5 does not yet model this behaviour (its
  'filterRepicksFlow' branch records it as not modelled), and the leafcutter/atlas-flows v3
  dataset's filter rule still assumes the previous state shows a graph; so no flow node maps to
  this AC and it carries no flow back-link. The selector order used in the Mock example is the
  dataset's (stored flows in Flow.id order), as in UXP-591-5-iii. Owner ruling 3 still holds: the
  filter change adds no history entry. UXP-591-5-ii's Back-onto-an-unknown-id clause concerns a
  'Flow not found' entry nobody changed a filter on; once a filter change replaces that entry, it
  returns as the re-picked flow.

  AMENDED 2026-10-14 (business-analyst, UXP-617): the re-pick behaviour above is retired; see
  amended_by. Still no flow node maps to this AC.
