criteria: |
  A decision that needs you reaches you — your work waits until it does.

  When the build reaches a point where only you can decide, the question is put
  to you. Your answer is the only thing that can settle it, and nothing else is
  ever interpreted as your reply. If the question cannot be put to you, the build
  stops and says so with your work intact, rather than proceeding on a guess
  about what you would have wanted.
