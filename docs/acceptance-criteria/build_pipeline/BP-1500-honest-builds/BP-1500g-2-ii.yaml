id: BP-1500g-2-ii
title: "A collision kept for the adopter is carried only to a surface that really holds the same capability"
component: build-pipeline
components:
  - build_pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
declares_side_effect: false
criteria: |
  Given a project whose discoverable capability directory is a real directory,
    not a link, so the ordinary build merges into it name by name and keeps every
    contested name for the adopter,
  And the other active platform has an output directory of the same name that
    holds a different family of capabilities,
  When that project is rebuilt with the ordinary everyday command,
  Then no contested item is copied into that other platform's directory under a
    name the package never put there,
  And the next rebuild in the copy layout the workspace maker uses leaves the
    output-drift check with no gap for any file in that directory,
  And a file that really is foreign to that directory, placed there by hand, is
    still reported as a gap.
depends_on:
  - BP-1500g-2-i
