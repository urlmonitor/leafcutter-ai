    relationship: describes
    status: exists
    relevance: "The project's catalogue of checks that report success having examined nothing. This AC is that pattern in the build's sweep; add the instance there rather than describing the pattern afresh."
  - path: scripts/build.py
    relationship: describes
    status: exists
    relevance: "Prints the clean result today from a scope of eleven historical paths, most of which do not exist in a current install -- so today's build is already an instance of the Given, not a hypothetical one."
  - path: "docs/acceptance-criteria/build_pipeline/BP-1500-honest-builds/BP-1500d-4.yaml"
    relationship: describes
    status: exists
    relevance: "NEAREST NEIGHBOUR -- cite, do not merge. There the check cannot READ the record it needs, and the record is absent or unreadable. Here every read succeeds and the scope is genuinely, legitimately empty; the fault is reporting that emptiness as an all-clear. Approved."
  - path: docs/reference/build-telemetry.md
