id: BO-4500a-1-ii
title: "A parent record the work edited goes in with the child records that changed it"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
  - ac_store
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a-1.yaml"
criteria: |
  Given the caller names four new acceptance-criterion records BP-100k-4-iv, BP-100k-4-v,
    BP-100k-4-vi and BP-100k-4-vii in the BP-100-reliable-builds folder,
  And their structural parent record BP-100k-4 in the same folder is modified in the working
    tree (its covered_by gained those four ids) but is not named by the caller,
  When the shared commit step runs and every check passes,
  Then the new commit contains the four child records and BP-100k-4,
  And the answer's paths lists all five records, with BP-100k-4 identified as added because it
    is the structural parent of a named record,
  And the check that requires a child to be listed in its parent's covered_by sees the
    edited parent, not the last committed one.

  Given the same four named children,
  And BP-100k-4 is unmodified in the working tree,
  When the step runs,
  Then the commit contains only the four children and BP-100k-4 is not staged.

  Given the caller names BP-100k-4-iv only,
  And the sibling record BP-100k-3, which is not the structural parent of any named record, is
    modified in the working tree,
  When the step runs,
  Then BP-100k-3 is not in the commit and remains modified and unstaged.
depends_on: [BO-4500a-1]
doc_links:
  - path: docs/known-issues/build-orchestration/open-high-ki-bo-20260928-stage-commit-leaves-the-edited-parent-unstaged.md
    relationship: describes
    status: exists
    relevance: "The first scenario is that KI's observed run (wf_a2fd1222-f54) with the outcome inverted. Fix direction 1 offers 'derive each written id's structural parent and stage it when it shows as modified' -- the option taken here, because it keeps the explicit-path rule without trusting every caller to report its parents."
  - path: docs/reference/ac-id-hierarchy.md
    relationship: describes
    status: exists
    relevance: "The id-derived structural-parent algorithm; the step must use the canonical derivation, not a private copy (KI-ACS-20260925-derive-parent-id-copies-disagree)."
assigned_agent: python-coder
estimated_complexity: M
package_surface: false
it_requirements:
  - >-
    The structural parent is derived with the ONE canonical id-to-parent derivation the AC store
    already ships (docs/reference/ac-id-hierarchy.md; scripts/ac_store/ac_parent_id.py), reused,
    never a private copy (KI-ACS-20260925-derive-parent-id-copies-disagree). If that derivation
    returns no parent for an id shape, no parent is added and nothing is guessed.
  - >-
    A parent is added only when (a) a named path is an AC record, (b) its derived parent record
    lives in the same feature folder or the same component tree as the canonical derivation
    resolves it, and (c) that parent is modified in the working tree. Exactly one hop; never a
    grandparent, never a sibling.
  - >-
    The AC-store root(s) are read from the project's configured AC-store location, never
    hard-coded to docs/acceptance-criteria/, so a consumer project with a different store root gets
    the same behaviour.
  - Each added parent appears in both paths and added_parents in the answer (BO-4500a-4 contract).
  - A done parent that refuses todo children is reported as hook_failed like any other check; the step never edits a record to make a check pass.
delivers_to: null
expects_from:
  ac_id: BO-4500a-1
  contract: "Explicit-path staging rule this record extends by exactly one hop."
test_required: true
test_spec:
  - name: test_modified_parent_is_committed_with_its_named_children
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Naming four BP-100k-4-* children with BP-100k-4 modified commits five records; added_parents is [BP-100k-4's path]."
  - name: test_covered_by_check_sees_the_edited_parent
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "With the real check-ac-parent-covered-by hook in the scratch repo's checks, the commit passes because the hook was given the edited parent."
  - name: test_unmodified_parent_is_not_staged
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "With BP-100k-4 unmodified, only the four children are committed and the parent is not staged."
  - name: test_modified_non_parent_sibling_stays_out
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Naming BP-100k-4-iv only, a modified BP-100k-3 is not committed and stays modified and unstaged."
    must_catch:
      - "add every modified record in the folder"
      - "add the grandparent too"
test_rationale: >-
  KI-BO-20260928 shipped because the parent check was never given the parent. The real_artifact
  test runs the real covered_by hook over a commit the real step built, which is the only way to
  show the check sees the edited parent rather than the committed one.
origin_agent: business-analyst
created: 2026-10-12
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  SEAM FROM THE L1 NOTES: "only the files the work touched" must INCLUDE a parent record the work
  edited (repo CLAUDE.md "AC-store commits -- stage the parent alongside the child"). Explicit paths
  must not be read as "only the files the caller happened to name".

  ONE HOP ONLY. The grandparent is never added, matching the direct-children covered_by rule.

  OUT OF SCOPE, recorded so it is not mistaken for coverage: KI-BO-20260928's related gap, a done
  parent that cannot take todo children. Staging the parent makes check-done-proof refuse; that is
  a human decision (reopen or re-home), not something the commit step may decide. The step reports
  the refusal as hook_failed like any other check.
