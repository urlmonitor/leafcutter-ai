roadmap_phase: phase_1
criteria: |
  Agents are handed an allowlisted pointer -- not a hand-composed prose brief.

  The payload a supervisor gives a phase agent is limited to an allowlisted set of
  pointers (ticket path, workspace path, branch, files touched) and cannot be a
  free-composed prompt that restates the task, repeats the sign-off steps, or
  injects a failure premise. This removes the very freedom that let a defective,
  false-premise dispatch be written in the first place.
