notes: |
  Satisfies the how-to entry in TQ-600c's documentation_triggers.

  NO NUMBER APPEARS IN THIS GUIDANCE, AND THAT IS A REQUIREMENT RATHER THAN AN
  OVERSIGHT. TQ-600c's own boundary says the limit must be derived from a measured
  post-fix baseline that does not exist yet, and TQ-600c-3 makes it a single-source
  record the guard looks up instead of a literal. A guide that quoted the figure would
  reintroduce the second source by the back door — and a documented number that
  disagrees with the enforced one is worse than no documentation, because the reader
  believes the document. The clause is written as an absence so it can be checked.

  THE "WHICH RESPONSE IS NOT AVAILABLE" CLAUSE IS THE LOAD-BEARING ONE. The natural
  response to a guard that fails your change is to find the way to turn it off, and a
  guide that explains the guard without addressing that leaves the reader to discover
  the answer themselves. Saying plainly that raising the limit requires a measurement
  and a recorded derivation — and that suppression is not among the responses — is
  what stops the guard being quietly neutered the first time it is inconvenient. This
  repository's own history is of checks that reported clean forever; a check nobody
  may silence but everybody may re-derive honestly is the shape that survives.

  THE SETUP-VERSUS-CALL CLAUSE IS HERE BECAUSE THE READER WILL GET IT WRONG OTHERWISE.
  Two of the three most expensive measured entries were fixture setup rather than the
  test. A contributor told only "your tests are slow" optimises the test body and
  achieves nothing. The guidance has to teach the distinction, not merely expose the
  fields that carry it.

  WHAT IS NOT DECIDED HERE: which surface carries the guidance, and whether it is one
  document or a section of an existing one. Both are it-po decisions, and both should
  be settled together with TQ-600b-6's surface so the two do not each grow an account
  of the other.
