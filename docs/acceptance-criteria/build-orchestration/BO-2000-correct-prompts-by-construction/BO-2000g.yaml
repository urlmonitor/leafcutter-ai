notes: |
  WHY THIS IS ITS OWN L1. The business analyst wrote this capability as eight
  records under BO-2000a. That took BO-2000a to 9 L2s against the limit of 5,
  and the person chose a split over a limit waiver. The cut is natural: BO-2000a
  is the PROTOCOL an agent follows when it signs off, and this L1 is the
  EXAMPLES an agent copies. An example that contradicts the protocol is a
  defect in what the agent is shown, not in what it knows. Its four L2s are
  being renumbered from BO-2000a-6..9 to BO-2000g-1..4 by the BA in the same
  change. covered_by lists those four direct children only.

  THE CAPABILITY, in four parts (one per L2, for orientation only; the BA owns
  the L2 wording):
    1. Every sign-off example an agent is told to copy opens with a feedback-id
       line, and nothing the example said before is lost.
    2. Entries that sign nothing off carry the one documented value,
       `(not-a-signoff)`. It describes the entry and grants nothing else.
    3. An automatic check of the instructions fails on any copyable example that
       is not in that shape. Only an explicitly marked illustration of the
       heading format is exempt, and only that one heading.
    4. Each corrected example, written exactly as the instructions give it,
       passes the real commit check. The uncorrected form is shown to be refused
       by the same route, so the proof cannot pass vacuously.

  WHY THIS MATTERS NOW. GE-123e (authored the same day) removes the message-word
  bypass on the feedback-id check. Once it lands, an agent that copies an
  example without an id is refused with no way round it. These examples must be
  corrected with or before GE-123e, or GE-123e will turn a known annoyance into
  stalled drives.

  BOUNDARY. BO-2000a-3 (done) owns the fallback value used when feedback cannot
  be submitted, and is not reworded. The shape of that fallback's value waits on
  INF-500d-3 and is out of scope here.

  WHY NO DOCUMENTATION TRIGGER. The signoff skill is the reference agents read
  for entry format. It must document `(not-a-signoff)` and the mark for a
  heading-format illustration, or the examples will drift back. That update is
  made by BO-2000g-1 and BO-2000g-2, which change the signoff skill directly,
  not by a separate documentation record.

  change_target is `prompt` because the artifacts corrected are agent
  instructions and skills. Authored at the PO stage, L1 only. BO-2000 is now at
  7 of 7 L1s. Any further capability here needs a split, not a cap waiver.
