notes: |
  DEFERRED BY THE USER -- "LATER". On 2026-09-16 the user accepted the IT PO's containment
  default for BO-3200f-2 containment 4: guardrail bypass variables are refused at AUTHORING TIME
  now, by BO-3200f-3's routing check over shipped workflows, and RUN-TIME enforcement at the
  guardrail comes later. This record specifies that later half so it is not lost. priority is
  `low` (the parent is critical) to reflect that deferral, and roadmap_phase is deliberately
  left unset: which phase "later" means is the user's or the Product Owner's call, not the BA's.
  readiness draft.

  HOW THIS DIFFERS FROM BO-3200f-3, AND WHY BOTH EXIST. BO-3200f-3 is a static check over the
  canonical workflow sources: it sees a bypass variable written into an executor dispatch in a
  shipped workflow and fails the gate. It cannot see a command composed while a run is in
  progress, one whose variable is inherited from the environment rather than written in the
  text, or one sent to the executor from anywhere other than a shipped workflow. This record is
  enforcement at the guardrail itself, for every command the executor issues. The third scenario
  is the discriminator between the two: it holds only if the refusal happens at run time.
  Nothing here restates BO-3200f-3's check.

  PLACEMENT -- AN L3 UNDER BO-3200f-2, NOT UNDER BO-3200f-3. BO-3200f is at 5 of 5 L2s and BO-3200
  at 7 of 7 L1s, so a sibling was not available; L3s are uncapped. BO-3200f-2 is the home because
  it OWNS containment 4 and names both enforcement points; its notes record the user's decision
  and state that the run-time point has no acceptance criterion. BO-3200f-3 owns only the static
  addressing check over shipped sources -- placing a guardrail behaviour under it would read as
  an extension of that sweep, which is exactly the confusion the third scenario exists to rule
  out, and would set this record's depends_on edge on a check it must work without.

  THE KNOWN RISK, FROM THE IT PO (BO-3200f-2 notes, user decision (a)): the guardrail hook may
  not be able to tell from its input that the caller is the executor. The last scenario does not
  assume the answer. It requires that inability to fail closed (block) or to be stated in the
  same decision -- never a silent allow. Which of the two is chosen, and whether it may differ by
  guardrail, is the IT PO's. If the payload genuinely cannot identify the caller, blocking every
  bypass would break the fourth scenario for legitimate callers, so "stated" is the likely
  outcome for some guardrails; that trade is the reason the criterion admits both.

  WHY THE FOURTH SCENARIO. The cheap implementation removes the bypass variables altogether.
  That passes the first three scenarios and breaks the fast lane's commit phase, which issues
  COMMIT_AGENT_MODE=1 git commit today as a non-executor caller. The refusal must be scoped to
  the executor as caller.

  WHY "ANY FUTURE VARIABLE OF THAT KIND". A hand-written list of three is stale the day a fourth
  guardrail gains an escape hatch. CLAUDE_NO_README_CHECK, in the hooks reference's escape-hatch
  table, is already a fourth variable of this kind; the user named three, so the first scenario
  names three, and the fifth scenario covers it and every later one.

  BOUNDARY. That the capture does not hide a command from a guardrail's matcher is BO-3200f-1's
  (guardrail visibility parity). How a block is reported to the workflow -- a guardrail refusal,
  not an executor decline, no exit status -- is BO-3200f-1-i's guardrail_blocked reason and
  BO-3200f-2 containment 5. This record requires only that the block happens and names the
  guardrail and variable.

  declares_side_effect: false -- derived from the Then clauses, which state that a command is
  blocked and not carried out and that a statement appears on the guardrail's error output
  (a transient stream); nothing durable is asserted.

  FOR THE IT PO -- OPEN, NOT DECIDED HERE.
    - Whether the hook payload exposes the caller at all, and if not, per guardrail, whether the
      last scenario resolves to block or to state.
    - If BO-3200f-3's repointing ever moves the fast lane's commit step to the executor, that step
      loses COMMIT_AGENT_MODE under this record; the two must not be enabled together without a
      decision on how the commit step is authorised.
    - estimated_complexity, change_target, risk_surface, it_requirements, test_spec.

  IT-PO ENRICHMENT (2026-09-17) -- THE OPEN ITEMS ABOVE, DECIDED.

  CALLER IDENTITY. The hooks reference documents a PreToolUse payload of tool_name, tool_input
  and session_id -- nothing that names the calling agent. Whether the live harness supplies an
  agent identity is not settled by any document in this repository, so it is made the
  implementer's first finding, recorded in the hooks reference. Command text, environment and
  marker files are ruled out as identity because the caller can set all three; that is precisely
  why COMMIT_AGENT_MODE is "a password, not an identity" today (KI-CG-20260907).

  THE LAST SCENARIO, PER GUARDRAIL. BLOCK for CLAUDE_NO_DOC_UPDATE, INLINE_WORK_GUARD_MODE and
  CLAUDE_NO_README_CHECK; STATE for COMMIT_AGENT_MODE; BLOCK by default for any variable declared
  later. The asymmetry is deliberate: COMMIT_AGENT_MODE is the only one of the four with
  unattended legitimate callers today, so it is the only one where failing closed on an
  unidentified caller breaks the fourth scenario. If the payload turns out to identify the
  executor, STATE is reached only by callers that genuinely cannot be identified, and the
  exposure is small. If it does not, STATE applies to every COMMIT_AGENT_MODE caller, the
  executor included -- which means run-time enforcement for that variable reduces to a stated
  warning and BO-3200f-3's authoring-time check stays the only thing that stops a shipped
  executor dispatch from committing without the gate. That consequence is the user's to accept
  and is to be reported before this record is marked done.

  THE COMMIT_AGENT_MODE CONFLICT. The rule is in it_requirements: no record in this tree removes
  or narrows a bypass variable for non-executor callers, strips one from a shipped command, or
  repoints the fast lane's commit step to the executor. A report about that step from
  BO-3200f-3's inventory is held open for a user decision on commit authorisation. This makes the
  BA's warning -- "the two must not be enabled together without a decision" -- a tested rule: the
  fast-lane commit test fails the moment the step loses its bypass.

  RECOMMENDED FOLLOW-UP (not edited here). BO-3200f-3's it_requirements take the bypass variables
  from "the guard overrides listed in the Claude Code hooks reference", a prose table that already
  omits COMMIT_AGENT_MODE. Pointing that check at the declaration delivered here gives both
  enforcement points one source. The fast lane's commit step also needs a result_use declaration
  under BO-3200f-3's "declared, never inferred" rule, and none of fact, chore or judgement fits it
  cleanly; how BO-3200f-3 should classify it is part of the same user decision.

  CAVEAT FOR THE BA -- TWO OF THE THREE NAMED GUARDRAILS MAY NEVER SEE AN EXECUTOR COMMAND. The
