notes: |
  THE FAILURE THIS RECORD EXCLUDES IS RECONSTRUCTION, NOT ABSENCE — AND THE LAST ARM IS THE
  ONLY ONE THAT CATCHES IT. BO-3800c's notes name the tempting implementation exactly: not
  "send nothing", but "send the file name and let the specialist re-run the standard to find
  out how much". Two moving arms do not catch that build — a reconstruction that happens to
  agree with the refusal moves when the refusal moves, so it passes both. The
  disagreeing-demand arm is the discriminator: construct a refusal whose stated demand is
  deliberately not what a re-derivation would produce, and require the carried value to be
  the stated one. Building that fixture is the work of this record; a decomposition that
  keeps only the moving arms has specified something a reconstruction satisfies.

  HOW TO MAKE THE DISAGREEMENT WITHOUT RESTATING THE ARITHMETIC — CONSTRAINT ON THE FIXTURE,
  NOT A SECOND RULE. The refusal is an INPUT to this record. The fixture must be able to
  present a refusal stating a demand of its own choosing, independent of anything the file
  contains, so that a re-derivation provably disagrees. It must NOT reach that disagreement
  by re-implementing, re-tuning or contradicting GE-127f-1's inequality, GE-127f-2's
  definition of what the change added, or GE-127d's counting rule. If the only way to
  construct the disagreement is to compute a second demand, the fixture has crossed the seam
  and must be rebuilt on a refusal the test supplies directly.

  WHY THIS IS ONE RECORD AND NOT THREE. The two moving arms and the disagreement arm are
  three observations of one property — that the brief is a function of the refusal — and
  they share a single fixture family and a single mutation. GE-127e-2 is the store's
  precedent for exactly this shape: three arms, one record, one injection, with the
  stay-green arm named. Splitting them would produce three records that all go red together
  under every injection either one could carry, which is the definition of a duplicate.

  THE EDGE THAT IS NOT HERE. A refusal that names the specialist but carries no usable
  demand is BO-3800c-1-i's, deliberately, because it is a failure mode with its own wrong
  default (supply one) rather than another observation of this property.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors.

  (1) THE RECONSTRUCTION. MUTATION: give the specialist the named file only, and have the
      brief's demand completed by re-running the standard against that file at the moment
      the specialist is engaged.
      MUST GO RED: the disagreeing-demand arm, necessarily and by construction; and the
      37-line moving arm wherever the re-derivation produces a different number from the
      one the refusal stated.
      MUST STAY GREEN: every arm of BO-3800b-1 and BO-3800b-2 — the right party is still
      engaged and the author still is not — and every arm of BO-3800a-1, BO-3800e-1 and
      BO-3800e-2. That green half is the evidence that WHO is asked and WHAT THEY ARE TOLD
      are separate promises, which is BO-3800c's entire reason for existing apart from
      BO-3800b.

  (2) THE FROZEN BRIEF. MUTATION: give the specialist a fixed brief — the named file
      substituted into a standing instruction to restructure it — with the demand omitted
      entirely.
      MUST GO RED: all three moving/stated arms above.
      MUST STAY GREEN: every arm of BO-3800a-1, BO-3800b-1, BO-3800b-2, BO-3800e-1 and
      BO-3800e-2. This is the build BO-3800c's notes describe as fully satisfying separation
      of duties and fully failing here: the specialist restructures to its own taste, the
      standard refuses again for a different amount, and BO-3800d's bound becomes the normal
      case rather than the exception.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs
  after this pass.
