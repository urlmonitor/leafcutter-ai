criteria: |
  The numbers turn into a recommendation, so the set of checks can finally shrink.

  Once the counts exist, each check is measured against them and comes back with one
  plain recommendation — leave it alone, stop it blocking and let it advise, replace
  it with something cheap and mechanical that catches the same thing every time, or
  fix just the one rule that keeps being waved through rather than the whole check.
  Nothing is weakened or removed on its own: the recommendation is put in front of a
  person, with the evidence that produced it, and a person decides.
