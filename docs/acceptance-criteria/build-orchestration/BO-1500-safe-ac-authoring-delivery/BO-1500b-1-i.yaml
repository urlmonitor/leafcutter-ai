title: The fresh authoring worktree is bootstrapped so pre-commit hooks do not silently skip
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: in_progress
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500b.yaml
criteria: |
  Given a freshly created authoring worktree that does not yet have the
    pre-commit configuration the package hooks need (no .pre-commit-config.yaml
    and no .leafcutter link),
  When the authoring workflow is about to make its first stage commit on the
    authoring branch,
  Then it first establishes the pre-commit configuration in the authoring
    worktree,
  And the AC schema and parent-link hooks actually run against the staged AC
    files instead of being silently skipped,
  And a stage commit that would violate an AC hook is blocked rather than
    landing unchecked.
depends_on:
- BO-1500b-1
doc_links:
- path: templates/skills/build-single-ticket/SKILL.md
  relationship: models
  status: exists
- path: scripts/setup_ticket_worktree.py
  relationship: models
  status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'Worktrees do not inherit .pre-commit-config.yaml (it is a .leafcutter symlink in the project root only).
  Bootstrap it in the authoring worktree before the first stage commit: symlink on native FS, copy on
  NTFS/WSL2.'
- Without bootstrap, commits run with PRE_COMMIT_ALLOW_NO_CONFIG=1 and all AC hooks (schema, parent-link)
  are silently skipped; the bootstrap must make those hooks actually run against staged AC files.
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
test_spec:
- name: test_fresh_authoring_worktree_has_precommit_config_after_bootstrap
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: integration
  description: A worktree created without .pre-commit-config.yaml or .leafcutter resolves both to readable
    targets after the bootstrap step, on the symlink path and on the copy fallback.
- name: test_ac_hooks_execute_against_staged_ac_files_in_the_authoring_worktree
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  description: Committing a staged AC YAML in the bootstrapped worktree produces observable AC-hook output
    (the hook ran), rather than the PRE_COMMIT_ALLOW_NO_CONFIG no-config skip path.
- name: test_stage_commit_violating_an_ac_hook_is_blocked
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  description: Staging a schema-invalid AC YAML and committing in the bootstrapped worktree exits non-zero
    and leaves the branch HEAD unmoved, proving the hook gates rather than decorates the commit.
- name: test_unbootstrapped_worktree_would_have_let_the_bad_commit_through
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  description: Negative control — the same schema-invalid commit in a worktree without the bootstrap succeeds,
    proving the previous test's block is caused by the bootstrap and not by unrelated validation.
