  - name: test_bp_1300e_1_v_adopter_without_exact_pin_is_told_no_version_check_applied
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: deployed
    description: "Two adopter fixtures on the deployed layout: (a) no requirements-dev.txt at all, (b) requirements-dev.txt with ruff>=0.15; stub reporting 0.15.15. Clean staged file commits in both; output states no exact linter version is declared so no version check was applied, names 0.15.15 as the version used, and --json version_check is 'not_declared'."
  - name: test_bp_1300e_1_v_declared_but_missing_version_source_is_could_not_check
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    must_catch:
      - "treats an explicitly declared but missing source as 'no version declared'"
    description: "leafcutter-lint.json sets linter_version_source to tools/missing.txt, which does not exist; staged in-scope file: refused, could_not_check reason linter_version_source_unreadable naming tools/missing.txt."
  - name: test_bp_1300e_1_v_requirements_parser_exactness_table
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: unit
    angle: boundary
    description: "Pure parser over a table: 'ruff==0.15.15' -> exact; 'Ruff == 0.15.15  # c' -> exact; 'ruff==0.15.*', 'ruff>=0.15', 'ruff~=0.15.0', 'ruff' -> not exact; no ruff line -> not exact; '-r other.txt' with the pin in other.txt -> exact; two different exact pins -> unreadable; marker line \"ruff==0.15.15; python_version<'3.12'\" -> unreadable."
  - name: test_bp_1300e_1_v_staged_pin_bump_is_judged_from_the_index
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    must_catch:
      - "reads the version source from the working tree in staged mode"
    description: "Index holds requirements-dev.txt pinning 0.15.15 while the working copy (unstaged) says 0.15.16; local ruff 0.15.15 and a clean staged file: commit completes."
  - name: test_bp_1300e_1_v_files_and_full_modes_apply_the_same_check
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "check_lint_gate.py --mode files --json (BO-570-3's contract); check_lint_gate.py --mode full (run_ci_local.py and CI)"
    description: "With the 0.15.14 stub, both modes report outcome could_not_check, reason linter_version_mismatch, required_ruff_version 0.15.15, exit non-zero; with a 0.15.15 stub both report version_check 'matched'."
  - name: test_bp_1300e_1_v_ci_lint_job_installs_from_the_declared_version_source_only
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: seam
    description: "Parse the REAL .github/workflows/ci.yml with a YAML parser and the REAL leafcutter-lint.json: the lint job's install step is `pip install -r <F>` with <F> equal to the resolved version source; the gate step follows it in the same job; no lint-job step installs ruff any other way and the string 'ruff==' appears nowhere in ci.yml. The live form of 'CI's own run matches by construction' is CI's own lint job, whose --mode full output must show version_check 'matched' -- not a local test, because a developer's local ruff legitimately may differ from the pin."
test_rationale: >-
  The version check is only meaningful when observed through a real commit,
  because the defect it prevents is a printed 'Passed' under a linter CI never
  runs; every commit-path test therefore asserts on pre-commit's own status line
  as well as the hook's text, as BP-1300e-1-iii's tests do. Versions other than
  the suite's real 0.15.15 are produced by a stub ruff module on the hook
  interpreter's path that answers only --version and delegates everything else
  to the real ruff -- the environment is manipulated for real, not the locator
  patched, so the module-first discovery path is exercised exactly as in use.
  Scenario 5 is the anti-copy arm: it edits ONLY the requirements file and
  byte-compares every other fixture file, so any second copy of the version
  fails it. The CI-binding test is deliberately a parse of the real ci.yml plus
  a live full-mode run, not a grep: it pins the one fact that makes CI's own run
  match by construction (same file installed, same file read, same job). The
  adopter arms run on the shared deployed layout in a separate fixture project,
  because the source tree is the one layout where 'this package's pin leaks into
  an adopter' cannot happen. Commit-path tests reuse
  _bp_1300e_lint_gate_fixture.py and declare @pytest.mark.shared_layout_reader
  with @pytest.mark.usefixtures("shared_reference_layout"); none spawns build.py.
