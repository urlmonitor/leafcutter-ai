id: TQ-400f-2
components:
  - testing_quality
  - ac_store
title: "The parent loses its finished badge on disk, and the record names the children that took it away"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a finished parent record that the sweep has judged as having unfinished
    work beneath it, naming two unfinished descendants at different depths,
  When the sweep applies its outcome to the store,
  Then that parent's file on disk no longer reads as finished and reads as work
    still to be done,
  And the parent carries the same knocked-back reason and knocked-back date that
    a record demoted for its own lapsed proof carries — no second, parallel way of
    recording a demotion is introduced,
  And the recorded reason names each unfinished descendant by identifier, so a
    reader holding only that one file, with the run's output gone and without
    re-running anything, can say which children caused it,
  And every other field of the parent's file is byte-identical to before the run,
  And no descendant's file is written to at all by the parent's demotion — the
    parent answers for its children, it does not change them,
  And the demoted parent still passes the store's own record validator, and a
    fresh read of the store in a new process returns it as unfinished work.
depends_on:
  - TQ-400f
  - TQ-400f-1
  - TQ-400b-1
  - TQ-400b-2
  - TQ-400e-1
