title: "A check verifies a record only when the check itself names that record"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test-free record whose verification record names a check,
  When the record's done-status is evaluated,
  Then the verification holds only if the named check exists and carries a tag
    "# enforces: <id>" naming this record's id, and the check is wired as
    BO-2500f-2-i requires,
  And a named check that does not exist fails the verification, naming the check,
  And a named check with no enforces tag for this id fails the verification, naming
    the check and the missing tag,
  And enforces tags are collected by the same scan that collects covers tags, so
    the link graph carries a check-enforces link from each tagged check to the
    record it names,
  And an enforces tag naming an id that is not an active record counts toward no
    record and is reported as dangling, with the id and the check it was found in,
    exactly as a dangling covers tag is (BO-2500a-1-i),
  And where the record's deliverable is of a kind for which BO-3500c-2 defines a
    proof, the check must be the instrument of that kind's proof, and a check whose
    class of proof is weaker than that kind requires does not verify the record,
  And no list of check kinds is kept for this purpose beyond the per-kind proofs
    BO-3500c-2 already defines.
depends_on: [BO-2500f, BO-2500f-1]
