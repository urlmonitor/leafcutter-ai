notes: |
  Reuse, do not re-derive: the VERDICT "does this workspace still hold undelivered work"
  is BO-4100c, and "the listing is complete and every leftover clearable" is BO-4100e.
  This record is that finding and clearing are served by the same one door as making
  (decision 4), and that clearing is safe for unattended callers.

  Q8 removal authorisation -- DECIDED (user, 2026-09-28): a refusal to remove a workspace
  that holds unpushed or uncommitted work returns a ONE-TIME TOKEN bound to exactly what
  would be lost (the workspace, its unsent commits and files). Only a remove request carrying
  that exact token may discard it; the token is invalid for any other workspace and invalid
  once the unsent set changes. It is never an environment variable or config setting, and
  never remembered. The customer intent is unchanged: authorisation is given up front in the
  request rather than asked interactively (finalize's teardown step deadlocks today on an
  interactive "yes" it cannot give), and without it work that never reached the shared
  project is never destroyed. Recorded on BO-4300e-3, BO-4300e-3-i and BO-4300e-5.

  Under decision 1 no version-control command lists the workspaces, so "find" cannot lean
  on one; how they are found is for BA/IT PO. Temporary workspaces used for comparison
  runs (finalize's baselines) are workspaces too: they must be made and cleared through
  this door and leave nothing registered in the real project (F14).

  documentation_triggers: how-to -- clearing a workspace by hand, including how to
  authorise the loss of unsent work, is a user-facing action.

