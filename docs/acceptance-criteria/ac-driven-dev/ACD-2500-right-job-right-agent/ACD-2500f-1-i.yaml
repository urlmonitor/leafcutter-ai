criteria: |
  Given the agent registry and the agent profiles,
    and one fixture agent "fixture-req-writer" whose profile declares a change surface in the
    requirement store (docs/acceptance-criteria/) and produces "analysis",
    and one fixture agent "fixture-reader" that declares no change surface and produces
    "analysis",
  When the profile consistency check runs,
  Then "fixture-req-writer" is listed, naming the agent, the requirement-store change surface
    and the declared produces value "analysis",
  And "fixture-reader" is not listed,
  And none of it-po, product-owner, business-analyst or test-designer is listed once
    ACD-2500f-1 is done,
  And the business-analyst profile as it stood before ACD-2500f-1 (produces "analysis",
    changes nothing) is listed by the check that ACD-2500e-1-i defines, not by this one,
    so each mismatch is reported once.
