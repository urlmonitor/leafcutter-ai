id: INF-1300b-4
title: "What the authoring instructions promise is what a produced document actually is"
component: infrastructure
components:
  - documentation_system
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300b.yaml"
criteria: |
  Given the two authoring surfaces that instruct an author to start every new
    architecture document this way, and which also state what will be produced,
  When each statement those surfaces make about the produced document is compared
    with a document actually produced,
  Then each statement holds: the picture skeleton a surface publishes for a kind
    is the skeleton produced for that kind; the invocation a surface instructs the
    author to run is one the means accepts, with every argument the surface names
    and no argument the surface omits; and the parts a surface says are produced
    are produced while the parts it says are the author's are left open,
  And neither surface attributes any part of the produced document to a source
    document unless that document exists and defines what is attributed to it,
  And no statement remains on either surface that a produced document contradicts,
  And the comparison covers every kind the project's vocabulary declares as
    current, read from that declaration, and is made against the surfaces as they
    are published rather than a restatement of them.
depends_on:
