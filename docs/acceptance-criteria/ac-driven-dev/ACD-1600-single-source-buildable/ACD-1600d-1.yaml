notes: |
  Empirical trigger: an AC's dependency pointed at scripts/workflows/plan-feature.js (a build
  output) with no templates/ source given. Complementary to GE-111 (implemented_by honesty
  across refactors) and BO-1400a-2 (reviewer checks a delivered artifact lands in package
  source); this is an authoring-quality constraint on the AC's OWN pointers.

  IT-PO enrichment (2026-08-12): canonical source scripts/ac_store/validate_ac.py, aligned
  with edge child ACD-1600d-1-i; flag decision is counterpart-driven via the build deploy map.
