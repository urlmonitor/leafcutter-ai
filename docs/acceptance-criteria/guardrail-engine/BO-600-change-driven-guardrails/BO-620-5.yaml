id: BO-620-5
title: "UI-internal pair maps to visual regression + a11y audit + TDD"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_target: ui and risk_surface: internal,
  When the guardrail engine resolves the applicable quality gates,
  Then the resulting guardrail set contains these mandatory gates:
    - visual_regression: before/after screenshots are compared for unintended visual changes
    - a11y_audit: accessibility checks verify WCAG compliance of the changed UI
    - standard_tdd: tests are written before implementation and verified after
  And the visual_regression gate captures a baseline screenshot before the change
    and a comparison screenshot after, flagging pixel differences above a threshold
  And the a11y_audit gate checks contrast ratios, ARIA attributes, and keyboard navigation
depends_on: [BO-620, BO-610-1, BO-610-2]
