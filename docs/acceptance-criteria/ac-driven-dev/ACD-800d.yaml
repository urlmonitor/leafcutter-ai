criteria: |
  Given the cross-reference audit has completed (in any mode: read-only or --apply),
  When the output directory is inspected,
  Then a JSON file exists at debugging/logs/ac_cross_reference_audit_YYYYMMDD.json,
  And the file conforms to a defined schema containing run_date, and a matches array
    where each entry has ac_id, ticket_path, confidence (high or medium), and reason,
  And the file is valid JSON parseable by any standard JSON library.
