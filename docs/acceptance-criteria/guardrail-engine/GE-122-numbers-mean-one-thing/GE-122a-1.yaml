assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "This is the load-bearing PRODUCER of the tree — six ACs (GE-122a-1-i, GE-122c-1, GE-122c-2, GE-122d-1, GE-122d-3, GE-122e-3) consume its verdict. It MUST be a single importable module with a callable entry point, not logic inlined into one hook script. Three stages invoking one evaluation is GE-122d-1's behavioural requirement, and it is unsatisfiable if the pass lives inside a stage."
  - "The verdict object MUST carry, per namespace: an outcome value, every contested number with EVERY claimant path for that number, and the count of artifacts inspected. The inspected count is not optional output — GE-122d-3 and GE-122e-3 both assert on it, and it is the only thing that distinguishes a pass from a pass over nothing."
  - "REGISTRATION TARGET — the single most likely way this work ships inert. `.pre-commit-config.yaml` is a BUILD OUTPUT: `scripts/build_precommit.py` strips every `@package-managed` block and re-renders it from `hooks_manifest.hooks` in `templates/scripts/commit_guardian/commit_guardian.json` on every `build.py` run. A hook added by hand-editing `.pre-commit-config.yaml` works locally and then VANISHES in CI, because the `AC store valid` job runs `python scripts/build.py --target-dir .` before it runs any hook. The canonical registration edit is the `hooks_manifest.hooks` array in `templates/scripts/commit_guardian/commit_guardian.json`; `.pre-commit-config.yaml` is then regenerated by running build.py and the regenerated file committed."
  - "DEPLOY MANIFEST (CLAUDE.md, 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest'). Every new module this pass introduces, and every existing module it starts importing, MUST be added to the matching build deploy list BEFORE the gate is registered — commit-guardian scripts under `templates/scripts/commit_guardian/`, AC-store helpers via the `build_ac_store` deploy_map in `scripts/build_phases.py`, and any `scripts/*.py` helper via `AGENT_SUPPORT_SCRIPT_FILES` in the same file. An undeployed dependency raises ModuleNotFoundError in the deployed layout while source-tree unit tests stay green; once the CI gate is required, that crash blocks every merge (the done_proof.py precedent)."
  - "ADR-001 parity: the canonical source is `templates/scripts/commit_guardian/`; the `.leafcutter/` copy is a build output. Edit the template, run build.py, and let `check-hook-parity` confirm — never edit the deployed copy."
  - "The decision-number namespace is largely REGISTRATION, NOT NEW IMPLEMENTATION. `templates/scripts/commit_guardian/check_adr_collision.py` already exists, is deployed to `.leafcutter/scripts/commit_guardian/`, and already compares staged decision numbers against origin/main plus in-flight branches. Verified 2026-08-17: it is registered in NEITHER `.pre-commit-config.yaml`, NOR either `commit_guardian.json` manifest, NOR `ci.yml` — it has never executed. Reuse its comparison logic rather than reimplementing it. This AC's complexity is driven by the acceptance-criterion and diagram namespaces, not by this one."
  - "check_adr_collision.py's fail-open contract MUST be changed as part of adopting it. It is fail-open by design (exit 0 on any internal error), while GE-122d-3 requires a could-not-read-the-collection condition to block at commit time; registering it unchanged satisfies neither AC. Its fail-open behaviour is an ACCEPTED DECISION recorded in ADR-029 ('The guard is fail-open ... It must never become a deployment blocker'), so changing it requires an ADR amendment or superseding ADR authored by adr-author — not a silent code change. ADR-029's false claim that the hook is already wired must be corrected in the same edit."
  - "The whole-collection load must reuse the existing precedent rather than adding a second store loader: `check_ac_circular_deps.py` already builds a store-wide adjacency list from every on-disk record and then overlays the staged set. Reuse means EXTRACT that loader into a shared importable module both scripts depend on — not import-from-CLI, not copy-paste — with a no-regression guarantee on the existing hook's behaviour."
  - "Must complete a full pass over the present collection (~2,975 requirement records, 33 decision records, 23 diagrams) in under 5 seconds at commit time. A commit-time gate slower than that gets bypassed, and a bypassed gate is precisely the failure GE-122d-2 exists to backstop. Prefer one directory walk per namespace over a per-file git invocation."
  - "Error handling per CLAUDE.md Rules 1-4: every filesystem and subprocess boundary wrapped with a specific exception type; every handler logs at WARNING or above or re-raises; no bare except; no try/except around pure comparison helpers. Ruff E722/BLE001/TRY are enforced at commit time."
  - "Adding a new whole-collection guard is a structural change: `check-adr-coverage` and `check-structural-change` will demand an architecture-doc update and an ADR. Budget for an ADR authored by adr-author, and allocate its number by ADR-029's rule (free only when it has neither a file nor a citation) rather than max+1."
test_spec:
  - name: test_uniqueness_pass_reports_one_finding_per_contested_number
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Over a real on-disk fixture collection holding a duplicated AC id, a duplicated decision integer and a duplicated diagram level-and-sequence, the pass returns a failing outcome and exactly three findings — one per contested number, not one per claimant file."
  - name: test_each_finding_names_every_claimant_path
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Each of the three findings carries the contested number and the on-disk path of BOTH claimants; the assertion is on the paths in the emitted output, not on a helper's return value."
  - name: test_uncontested_artifacts_absent_from_report
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "No artifact whose number is claimed once appears anywhere in the report, over a fixture carrying several thousand uncontested artifacts alongside the three collisions."
  - name: test_repaired_collection_passes_with_per_namespace_counts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With the three collisions resolved, the pass returns a passing outcome AND reports a per-namespace inspected count equal to the number of artifacts the fixture actually contains — so a pass over nothing is distinguishable from a real pass."
  - name: test_pass_runs_from_the_deployed_layout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "After build.py, the pass is invoked from the deployed .leafcutter/ layout (not imported from the source tree) and completes without ModuleNotFoundError — the check a source-tree unit test structurally cannot make."
  - name: test_decision_namespace_gate_is_registered_and_executes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "The decision-number gate appears in hooks_manifest.hooks in templates/scripts/commit_guardian/commit_guardian.json, survives a build.py regeneration of .pre-commit-config.yaml, and then actually fails on a staged duplicate decision number — presence in the manifest alone is not asserted as coverage."
test_rationale: |
  Every descriptor above executes the pass over a real on-disk collection because the coverage
  note forbids grep-only evidence, and because this repository has already shipped a guard that
  passed its inventory checks while never running (check_adr_collision.py). The deployed-layout
  and registration descriptors exist for the same reason: a source-tree unit test imports from
  the one layout in which the deployment defect cannot reproduce, and a manifest-presence
  assertion passes on a hook that is stripped from .pre-commit-config.yaml at the next build.
  Fixture collections must be produced with the real serializer and read back from disk per
  docs/reference/fixture-policy.md — a hand-typed YAML fixture reproduces the serializer bias
  that hid the files_touched defect.
