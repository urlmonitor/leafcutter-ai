notes: |
  Observed 2026-09-25: the context-bundle step was declined by python-coder as misrouted. The
  release then only partly ran, and five acceptance criteria were left in_progress. The retry
  was blocked by those claims.

  OVERLAP. BO-2400f-10-i already requires that every halting path after the claim releases, and
  BO-2400f-10-ii requires that an unreleased claim is named in the halt. BO-2400f-12-i covers the
  pre-claim case for a producibility refusal only. What is new here: (1) a declined step is a
  halting cause, on every step, and a decline with no readable reply counts; (2) the pre-claim
  arm for declines at probe, resolve and producibility; (3) the retry clause, which is the
  operator-visible consequence the incident produced. A partial release is reported under
  BO-2400f-10-ii and is not restated here.

  The retry clause reads the store, not the run's report. A run that says it released and left
  five records in_progress fails this record.
