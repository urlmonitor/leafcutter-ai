criteria: |
  You approve the criteria and pick the option; nothing is chosen for you.

  Nothing proposed is used until you approve it, and you can trim, edit or add to
  the options and criteria before they are assessed; if you add an option or
  answer in your own words at the final question, everything is ranked again
  before you are asked once more. A decision counts only once you have made the
  choice, and if you walk away, nothing is kept.
