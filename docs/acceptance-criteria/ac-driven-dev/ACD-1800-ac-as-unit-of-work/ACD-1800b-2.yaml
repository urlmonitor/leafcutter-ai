roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a requirement with three deliverables of which two are signed off and one
    is still unsigned,
  When the requirement's completion state is evaluated,
  Then the requirement is reported as not done,
  And when the remaining deliverable is subsequently signed off,
  Then the requirement is reported as done,
  And the requirement's done state is computed solely from the per-deliverable
    sign-offs recorded on the requirement.
