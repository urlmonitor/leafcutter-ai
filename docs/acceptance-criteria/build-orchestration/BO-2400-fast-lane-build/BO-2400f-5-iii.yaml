notes: |
  Observed 2026-09-25: the run halted with "connected set already claimed / in progress — a
  concurrent fast-lane run owns these ACs" and target_refused true, while the detail was
  status-checker's own refusal. Nothing had been claimed. The operator was sent looking for a
  concurrent run that did not exist.

  WHY THIS IS NOT A DUPLICATE OF BO-2400f-7-iii. That record covers the claim step only, and
  requires only that a never-attempted claim is not reported as contention. It does not
  require the halt to name the agent and its reason, and it says nothing about resolve,
  producibility, context bundle or any later step. The resolve and producibility clauses here
  are new and are the dangerous ones: a declined resolve read as an empty set ends as a
  clean no-op, which looks like success; a declined producibility check read as "all
  producible" goes on to claim.

  USER DECISION 2026-09-27: command steps move to a dedicated command-step-runner
  (BO-2400a-1-i). It declines only a request outside its role, and when it does, the halt
  follows this record. A command that ran and exited non-zero is the step's result, not a
  decline; BO-2400a-1-i keeps the two distinguishable.

  This record keeps working after BO-2400f-5-i is met. A correctly chartered agent can still
  decline (a model change, a prompt edit, or the launch-location case in BO-2400f-3-ii), and
  the halt must then say so plainly.
