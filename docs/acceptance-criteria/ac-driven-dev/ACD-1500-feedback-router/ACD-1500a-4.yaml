assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Implemented in the classifier agent template (templates/agents/feedback-classifier.md): the prompt must drive deterministic output for identical input — Haiku pinning plus temperature 0 (or the lowest the harness allows) and an output contract that maps the same field set to the same {work_type, size, confidence}"
  - "The prompt must not reference run time, queue position, or any non-entry state; the only inputs to a classification decision are F1's own fields"
  - "The routing matrix downstream (ACD-1500a-3) is already deterministic; determinism risk is concentrated in the classifier, so the constraint is enforced there"
