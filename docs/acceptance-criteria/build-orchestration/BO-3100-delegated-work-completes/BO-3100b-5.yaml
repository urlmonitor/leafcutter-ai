id: BO-3100b-5
title: "A component diagram shows what the exit-time judgement reads and what it can stop"
component: build-orchestration
components:
  - documentation_system
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader deciding whether the exit-time judgement can see a particular kind of work,
  When they open the component diagram for it,
  Then it shows the judgement as a distinct element, shows the project's working state as
    its only input for deciding whether work happened, shows the specialist's reply as an
    input it does not use for that decision, and shows the step's no-op declaration as a
    separate input.

  Given the diagram,
  When it is compared against what the judgement actually reads,
  Then every input it shows is one the judgement reads, and no input the judgement reads is
    missing from it.
depends_on:
  - BO-3100b
  - BO-3100b-1
  - BO-3100b-3
