notes: |
  THE USER'S HARD CONSTRAINT. Also the most under-scoped of the five: the
  contamination is NOT confined to the product-truth store. It reaches into the
  real backlog, which is why this L1 carries the ac_store component tag.

  VERIFIED 2026-09-07 (independently reproduced, not taken on report).
    - 18 demo acceptance criteria for a fictional plant shop sit in the REAL
      backlog: 13 files under UXP-210-buy-a-plant and 5 under
      UXP-220-track-an-order. They carry readiness reviewed or approved,
      req_status approved, work_status done/in_progress/todo, and a real
      assigned_agent (frontend-coder) — indistinguishable, field for field,
      from genuine work.
    - UXP-210a and UXP-220a are level L2 with an empty depends_on — roots with
      no parent, so nothing above them contains or explains them.
    - WORSE THAN REPORTED. The store scanner surfaces TWO of them as READY
      LEAVES, not one: UXP-210d-4 ("Order summary is shown before payment") and
      UXP-210d-5 ("Entering payment details creates a Payment record"), both
      assigned to frontend-coder, both in the ready set alongside 649 real
      items. A third, UXP-210d-6, sits in the blocked set and becomes ready the
      moment its blocker clears. The concrete consequence: an agent can be
      dispatched, today, to build plant-shop checkout and payment handling
      inside leafcutter.
    - Every one of the 10 mockups in the store is fern-and-fig
      (cart, checkout, notify-me, order-confirmation, order-detail, orders-list,
      plant-detail, plant-listing, shipment-tracking, sign-in) and they are the
      only directory under mockups/. There are zero mockups of the real product.
      So the demo is not a corner of the record — for that artifact type it IS
      the record.

  SEPARATION, NOT DELETION — non-negotiable. ADR-022 and UXP-550/UXP-593 (mock
  mode) DEPEND on the example content existing. The requirement is structural:
  its own product root, its own index, its own identity, so that no scan, no
  agent, and no reader crosses from one into the other by accident.
  fern-and-fig stays, and stays referenceable, as an example.

  Scope note for the BA: this L1 must reach into the acceptance-criteria store,
  not only the product-truth store. An L2 set that only separates flows,
  mock-data and mockups leaves the two dispatchable plant-shop tickets in place
  and misses the sharpest edge of the failure.
