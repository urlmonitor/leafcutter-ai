id: BO-400b-1-i
components:
  - build_orchestration
title: "Script refuses done when agents map has needed entries"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given a ticket file with frontmatter:
    status: in_progress
    agents:
      python-coder: signed_off
      test-runner: needed
      commit: needed
  When the script is invoked with --status done (without --force),
  Then it parses the agents: map from the frontmatter
  And it finds entries with value `needed`: [test-runner, commit]
  And it exits with code 1
  And it prints:
    "Cannot set done - agents with status 'needed': test-runner, commit"
  And the ticket file is NOT modified.

  Given the same ticket file,
  When the script is invoked with --status done --force,
  Then it bypasses the agents-map parity check
  And it updates the status to done
  And it prints: "status: in_progress -> done (forced, parity check skipped)"
  And it exits with code 0.
depends_on: [BO-400b-1, BO-400a-2-i]
