id: DK-200a-1-i
title: "An explicit answer contract keeps its route and still receives initial context"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a new request has an explicitly requested evidence answer,
  And the current permitted entity index recognizes a repository term in that request,
  When the kernel starts the run,
  Then entity recognition runs once and checkpoints compact meanings without body evidence,
  And the explicit evidence answer remains the requested output without automatic intent selection replacing it.
depends_on: [DK-200a-1]
covered_by:
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_explicit_contract_still_gets_enriched_without_intent_classification"
implemented_by:
  - "kernel/scheduler/graph.py"
  - "kernel/scheduler/nodes_enrichment.py"
  - "kernel/intent/step.py"
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "An explicit output contract must remain authoritative while still receiving initial entity recognition."
  - "Bypassing automatic answer-kind selection must not bypass the EntityContext checkpoint or introduce another recognition pass."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_explicit_contract_still_gets_enriched_without_intent_classification
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: reachability
    description: "An explicit evidence request retains EVIDENCE_BUNDLE, checkpoints non-empty meanings with separate caller claims and registered capabilities, records exactly one context.recognized event and issues no kernel.intent question."
test_rationale: "The service entry point exercises the explicit-contract branch; a direct call to gathering would miss an early bypass in routing."
