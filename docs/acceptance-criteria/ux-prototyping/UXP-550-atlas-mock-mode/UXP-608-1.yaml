title: "A production deployment that explicitly opts in honors the runtime override"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a production deployment that has EXPLICITLY opted in to allowing runtime mock overrides
    and has no production lock set,
  When a request arrives carrying ?mock=1,
  Then the override is honored and the deployment serves bundled fixtures with the mock badge,
  So default-deny is an opt-out-able safe default, not a hard prohibition — an operator who
    wants overrides in production can turn them on.
