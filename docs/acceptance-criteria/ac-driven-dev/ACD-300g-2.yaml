title: "The commit includes only AC files from the current stage"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the /create-ac workflow has completed a stage and the user has approved,
  And the working tree contains other uncommitted changes outside the AC store
    (e.g. modified configuration files or unrelated documentation),
  When the workflow creates the stage commit,
  Then only files under the AC store directory that were created or modified
    by the current stage's authoring agent are staged for the commit,
  And no files outside the AC store directory are included,
  And no AC files from a previous stage (already committed) are re-staged,
  And unrelated uncommitted changes in the working tree remain uncommitted
    after the stage commit completes.
