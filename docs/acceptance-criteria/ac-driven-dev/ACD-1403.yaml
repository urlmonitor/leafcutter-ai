component: ac-driven-dev
title: "No orphaned test files reference removed scripts"
criteria: |
  Given the script check_ac_parent_covered_by.py was removed as part of ACD-1100,
  When the test suite runs,
  Then no test file attempts to import or invoke check_ac_parent_covered_by.py
  And the orphaned test file test_check_ac_parent_covered_by.py is deleted
  And the bug symptom "40 tests fail with FileNotFoundError" must not occur
notes: "Authored by /quick-fix. Root cause: scripts/commit_guardian/check_ac_parent_covered_by.py was deleted but its test file unit_tests/commit_guardian/test_check_ac_parent_covered_by.py was not removed."
