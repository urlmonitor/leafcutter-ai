id: TQ-600a-13-iv
components:
  - testing_quality
title: "Closing the nightly-red issue without a green night does not end the red streak"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given an open issue labelled `nightly-red` raised by a red night,
  And two ways it can be closed while the nightly population is still failing: a person
    closes it by hand, or a pull request whose description says "Fixes #N" or "Closes #N"
    for that issue is merged — which the hosting service closes automatically, and which
    TQ-600a-13-viii's escape hatch makes the normal way a fix arrives,
  And the rule that closing the flag must not be a way to release the hold on merges,
  When the issue has been closed by either route and the next night is red,
  Then after that night an issue labelled `nightly-red` is open again — the closed one
    reopened or a new one created — so the hold TQ-600a-13-vi reads is restored,
  And the commit list it carries begins at the head commit of the most recent GREEN run,
    not at the moment of the close and not at the red night that preceded it, so a
    culprit merged before the close is still inside the search space,
  And the close is never treated as a green night by anything the flag lifecycle reads:
    the next green run, not the close, is what the following commit range starts from,
  And when the next night is green instead, no issue is opened or reopened and the closed
    issue is left as it is,
  And both routes are demonstrated by closing the issue in the issue-service double —
    once as a person, once as the effect of a merged closing reference — and then
    applying a red night and a green night, observing the resulting open-issue state.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-iii
