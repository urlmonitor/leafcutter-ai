criteria: |
  Given a decomposed parent record whose covered_by lists two of its three
    children — ACS-1200a listing ACS-1200a-1 and ACS-1200a-2 but not the newly
    added ACS-1200a-3,
  And no record anywhere in that tree carries parked or parked_reason,
  And ACS-1200a-3.yaml is staged for commit,
  When the parent-back-link check is executed as a process against that staged
    set, after the parked exemption has landed,
  Then the process exits non-zero,
  And it reports exactly one violation, naming ACS-1200a-3 as the child and
    ACS-1200a as the parent that does not list it,
  And it reports no violation for ACS-1200a-1 or ACS-1200a-2,
  And executing the pre-change implementation of the check against the identical
    staged set produces the same verdict and the same violation set, so the
    exemption demonstrably removed no enforcement from this case,
  And a test that only inspects the check's source does not satisfy this
    criterion: coverage requires executing the check and asserting its exit code
    and its reported violations.
