id: ACS-100c-5
title: "Parent AC amendment does not invalidate existing child ACs"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an L1 AC "ACS-100a" has 3 L2 children with status "active",
  When a PO agent amends the L1's criteria field (widening or narrowing scope),
  Then all 3 child L2 ACs retain their status "active" after the amendment,
  And the AC validator does not flag the children as invalid
    solely because the parent's criteria text changed,
  And the amended_by field is updated only on the parent L1,
    not propagated to the children.
depends_on: [ACS-100c, ACS-100c-4]
