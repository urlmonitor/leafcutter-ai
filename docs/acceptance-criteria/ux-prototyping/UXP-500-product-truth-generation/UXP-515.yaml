id: UXP-515
readiness: approved
priority: medium
title: "Mockup is a first-class artifact type whose screen resolves from flow steps"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: in_progress
criteria: |
  Given a mockup artifact registered in the product-truth store,
  When a flow step carries a screen id,
  Then the mockup is a first-class artifact type with its own schema (mockup.schema.json)
  and index registration,
  And a step's screen resolves to a registered mockup so the validator can gate on it,
  And at least one mockup is drawn in full, to serve as the worked reference for the artifact
  type, while the rest are registered stubs,
  And that fully drawn reference belongs to the example product and is registered under the
  example product's own root, so it demonstrates the artifact type without standing in as a
  screen of the project's own product.
depends_on:
  - UXP-590
doc_links:
  - path: docs/product-truth/schemas/mockup.schema.json
    relationship: implemented-by-step
    status: exists
  - path: docs/product-truth/mockups/fern-and-fig/plant-listing.mockup.json
    relationship: implemented-by-step
    status: exists
    relevance: "The fully drawn reference. It is EXAMPLE content and must stay under the example product root; it is not a screen of leafcutter's own product. See UXP-700d-1."
  - path: docs/acceptance-criteria/ux-prototyping/UXP-700-truthful-project-record/UXP-700d.yaml
    relationship: context
    status: exists
    relevance: "The constraint this AC was re-scoped against: example content is kept structurally apart from a project's own record, and is never deleted."
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements: |
  mockup.schema.json defines the artifact type; each mockup carries a screen id that flow
  steps reference. plant-listing is the fully drawn gold reference; eight other screens are
  registered stubs (readiness: draft) so their flow steps resolve.
delivers_to: null
expects_from: {}
origin_agent: BrainCandy
created: 2026-07-14
amended_by:
- reason: '2026-09-07 business-analyst: re-scoped to resolve a direct conflict with
    UXP-700d. The gold-reference clause named a fern-and-fig mockup inside the real
    store, which made example content the reference screen for the project''s own
    record. The clause now requires the fully drawn reference to be example content
    held under the example product root. Nothing is deleted; ADR-022 and UXP-550/UXP-593
    continue to depend on plant-listing existing and remaining referenceable.'
- action: approved
  agent: approve_acs
  date: '2026-09-07'
superseded_by: null
covered_by: []
implemented_by:
  - docs/product-truth/schemas/mockup.schema.json
  - docs/product-truth/mockups/fern-and-fig/plant-listing.mockup.json
test_required: true
test_spec:
  - name: test_every_registered_mockup_validates_against_the_mockup_schema
    target_dir: unit_tests/product_truth/
    description: "Each *.mockup.json in the store validates against mockup.schema.json, so the mockup is a schema-governed artifact type rather than a convention."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_every_step_screen_id_resolves_to_a_registered_mockup
    target_dir: unit_tests/product_truth/
    description: "A flow step carrying a screen id resolves to a mockup registered in the index; an unresolvable screen id is reported so the validator can gate on it."
    type: integration
    angle: seam
    framework: unittest
  - name: test_one_mockup_is_fully_drawn_and_the_remainder_are_registered_stubs
    target_dir: unit_tests/product_truth/
    description: "Exactly one mockup carries the fully drawn worked reference while the others are registered stubs whose steps still resolve, so the artifact type has a reference without every screen being finished."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_the_worked_reference_is_registered_under_the_example_product_root
    target_dir: unit_tests/product_truth/
    description: "The fully drawn reference resolves under the example product's own root and is not registered as a screen of the project's own product, so example content demonstrates the type without standing in for the real record."
    type: integration
    angle: boundary
    framework: unittest
change_target: code
risk_surface: internal
notes: |
  RE-SCOPED 2026-09-07, not re-pointed. The original third clause read "at least one mockup is
  drawn in full (the gold reference)" and named
  docs/product-truth/mockups/fern-and-fig/plant-listing.mockup.json in implemented_by. That made
  a fictional plant shop's screen the reference screen inside the project's own record, which is
  precisely the failure UXP-700d names.

  Two repairs were considered:
    RE-POINT - move the gold reference to a mockup of leafcutter's own product. REJECTED for
      now: there are zero real-product mockups in the store (all 10 are fern-and-fig), so
      re-pointing would make this AC depend on an artifact nobody has authored, turning a
      shipped in_progress record into a blocked one. Authoring a real-product mockup is a
      product decision, and UXP-700d-4 exists to surface the need for it rather than to force
      it here.
    RE-SCOPE - keep plant-listing as the reference and say plainly what it is. TAKEN. The clause
      now requires the fully drawn reference to be example content under the example product
      root, which satisfies both this AC's purpose (one artifact of the type is drawn in full,
      so the schema is proved against something real) and UXP-700d's requirement (nothing
      example-owned is readable as the project's own record).

  implemented_by is left unchanged: plant-listing.mockup.json really is what implements this,
  and ADR-022 together with UXP-550/UXP-593 require it to keep existing and to remain
  referenceable. Separation, never deletion.
