criteria: |
  Given ACS-100h-7a (approved) mandates exactly one implementation of the AC-tree
    child-counting and limit rule and forbids a second independent traversal,
  When the independent-total requirement of ACS-1100a-2 is applied across the store's
    query surfaces,
  Then the AC-tree child-limit counter appears in a declared exemption record that
    names the surface and names ACS-100h-7a as the mandate granting the exemption,
  And no second traversal of the AC tree is written to produce a total for that
    counter — it meets the coverage requirement instead by self-reporting what it
    examined and excluded from within the one shared callable (ACS-1100b-2),
  And a surface absent from the declared exemption record may not report a total
    derived through its own result filters, match keys, or join keys,
  And a surface that reuses one shared filter-free enumeration for both its total and
    its results needs no exemption entry at all, because it already satisfies
    ACS-1100a-2 — the exemption record is for surfaces that cannot enumerate
    independently, not for every surface that reuses a traversal,
  And the exemption withholds the independent total only: the rule applied to each
    individual record keeps whatever single-implementation mandate already governs it,
    on exempt and non-exempt surfaces alike, and nothing in ACS-1100 authorises
    forking a per-record rule to satisfy a coverage requirement.
depends_on:
