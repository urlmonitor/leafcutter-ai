notes: |
  FIELD EVIDENCE — found 2026-09-23 by BO-400e-5's own sequence diagram, not by a drive and
  not by a test. That record required every participant able to write the recorded state to
  appear, "so that a route which is not drawn is a route which does not exist". Enumerating
  the writers to satisfy that clause is what surfaced this one. Filed as
  KI-BO-20260923-0630.

  The defect: finalize-feature.js step 3.5 sub-step C read the ticket, replaced the status
  line in the frontmatter, and wrote the file back. No parity check, no transition
  validation, no possibility of refusal. It runs over every still-open ticket of the epic
  being finalized, so a ticket the drivers had correctly REFUSED to close was closed anyway
  one step later in the lifecycle, silently.

  Note the contrast that made it obvious once seen: sub-step D, immediately below, already
  invoked mark_ac_done.py as a script and handled its exit code. Sub-step C was the only
  step in that prompt that reached for the file directly.

  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — restore the direct frontmatter rewrite. Caught by
         test_no_step_writes_the_finished_state_directly.
    M2 — invoke the script but add --force so a refusal cannot stop finalization. Caught by
         test_the_blanket_override_is_not_used.
    M3 — invoke the script, then fall back to a direct write when it exits non-zero. Caught
         by the negative scan plus test_a_refused_close_leaves_the_ticket_open_and_is_reported.
    M4 — move the direct write into a different sub-step. Caught, because the negative test
         scans the whole prompt rather than sub-step C.

  This record does NOT make finalization fail when a close is refused. It makes it stop
  lying: the ticket is left open and named. The archive check at finalize step 5 already
  refuses to archive an epic with a non-done ticket, so the refusal surfaces there on its
  own terms rather than through a second mechanism invented here.
