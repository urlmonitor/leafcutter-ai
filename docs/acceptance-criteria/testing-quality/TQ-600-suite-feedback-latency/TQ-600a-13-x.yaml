  - path: docs/acceptance-criteria/testing-quality/TQ-600-suite-feedback-latency/TQ-600a-13-xvii.yaml
    relationship: describes
    status: exists
    relevance: >-
      The owner's break-glass for when the required hold itself is broken.
declared_files:
  - path: scripts/ci/post_merge_hold.py
    state: to_be_created
  - path: scripts/ci/post_merge_notice.py
    state: to_be_created
  - path: scripts/ci/post_merge_tunables.json
    state: to_be_created
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    ASSIGNED python-coder FOR THE PARTS AN AGENT CAN DO; THE REST IS A HUMAN STEP. Editing
    the ruleset and creating the Actions event policy need admin rights; the owner
    performs them by hand. python-coder implements the enforcement-state reader and the
    not-reproduced-red count (reported on the notice by the notice job). The live
    observations are recorded by whoever performs or witnesses them.
  - >-
    THE RULESET AS READ ON 2026-10-08 (the earlier "five contexts" statement was stale and
    is retired). VERIFIED (GitHub expert, API, ruleset updated 2026-10-08T14:30): six
    contexts — Lint (ruff), Component vocab style (components.json), Proof-of-done
    coverage check (BO-2500b), Changelog entry present, AC store valid, Test suite
    (pytest) — each pinned to `integration_id: 15368` (the github-actions app);
    `strict_required_status_checks_policy: false`; `bypass_actors: []`; no pull-request
    review rule. `Post-merge suite status` absent: ADVISORY.
  - >-
    THE ENFORCEMENT-STATE READER IS PURE AND EXACT. "enforced" only when a
    required_status_checks rule lists a context exactly equal to `Post-merge suite status`
    pinned to integration 15368; anything else, including an unreadable response,
    "advisory" with a reason.
  - >-
    THE EVENT POLICY IS A HARD PREREQUISITE — VERIFIED (GitHub expert, docs, 2026-10-08):
    "For public repositories that do not already have an applicable Actions event policy,
    GitHub adds a default policy that blocks workflows triggered by `pull_request_target`"
    and "On November 2, 2026, GitHub will enforce the default policy". `GET /repos/
    urlmonitor/leafcutter-ai/actions/policies` returned `{"total_count":0}`. What a
    blocked run looks like is UNVERIFIED, and whether an event policy can be created on a
    personal-account repository is UNVERIFIED. If the policy cannot be created, or a run
    is not observed after it exists, the FALLBACK is a `workflow_run`-triggered job on the
    default branch that computes the verdict and posts a check run named `Post-merge
    suite status` on the PR head via `POST /check-runs` (`checks: write`); adopting it
    requires amending TQ-600a-13-xi's allowed writes, which this record does not
    pre-authorise. Do not add the check to the ruleset on either route until a run of
    that route has been observed reporting.
  - >-
    ROLLOUT ORDER (user decisions H and J; VERIFIED that a `pull_request_target` check
    does not run on the PR that introduces it). TQ-600a-13-xix (with its minimal timing
    workflow) may land before step (1) and is independent of everything below. (1) merge the
    correctness workflow; dispatch it once on main; (2) owner pre-creates labels
    `post-merge-red`, `post-merge-timing`, `post-merge-flaky`; (3) owner creates the event
    policy; read it back; (4) merge the hold and follow-up workflows; (5) observe the hold
    on later PRs and a re-evaluation; (6) advisory period, with the break-glass procedure
    documented (TQ-600a-13-xvii); (7) add to the ruleset; (8)
    observe a held PR reported unmergeable; (9) rehearse the break-glass within the first
    day (TQ-600a-13-xvii). Steps (3) to (8) before 2026-11-02 if
    possible; after that date (3) blocks everything after it.
  - >-
    THE REPORTED NAME CANNOT DRIFT OR BE SKIPPED — VERIFIED (GitHub expert): a skipped job
    reports success even when required; a job whose `needs:` failed is skipped; path,
    branch or commit-message filtering leaves the check pending; a matrix suffixes the
    name. So: `name: Post-merge suite status`, no matrix, no job-level `if:`, no `needs:`,
    no path filter, and no branch filter that could exclude a PR to main.
  - >-
    DEMOTION AND ADVISORY NUMBERS — ACCEPTED BY THE OWNER AS TUNABLE DEFAULTS (2026-10-08):
    demote when more than one in three red verdicts in the first 14 days, or three in any
    later 14 days, are not reproduced at the same commit; advisory period at least 7 days
    and at least 20 evaluations matching the run history. "Not reproduced at the same
    commit" is computed mechanically from the run history (a failure-concluded run
    followed by a success-concluded run with the same `head_sha`), not judged by a
    person. The numbers live in the family's ONE tunables file (see the next entry); the
    mechanism stays.
  - >-
    ONE NAMED TUNABLES LOCATION FOR THE WHOLE FAMILY: `scripts/ci/post_merge_tunables.json`
    (JSON so the stdlib-only hold can read it; beside the modules so the hold's sparse
    checkout of scripts/ci already carries it and no build deploy rule touches it — the
    repo's config/ directory is deployed to consumers and this file must not be; read
    from the default-branch checkout, so a PR cannot retune its own hold). Keys and
    accepted defaults: `heartbeat_max_hours`
    12 (documentation of the cron; the cron string itself is in the workflow and a test
    asserts it fires at least this often), `staleness_hours` 30 (-xiv),
    `flaky_window_runs` 5 and `flaky_red_threshold` 2 (-xiii), `run_history_page` 30
    (-v), `advisory_min_days` 7 and `advisory_min_evaluations` 20 (this record),
    `demotion_first_window_days` 14, `demotion_first_ratio` "1/3",
    `demotion_later_window_days` 14, `demotion_later_count` 3 (this record). No module
    in scripts/ci/ carries any of these as a literal; a missing or malformed file fails
    the consuming job closed (for the hold: could_not_read-style failure naming the
    file), never falls back to a hard-coded value silently. Created by whichever family
    record lands first that reads a tunable (normally -ii, for the window), extended by
    the rest.
  - >-
    `Post-merge fix proof` (TQ-600a-13-xvi) IS NEVER ADDED TO THE RULESET. It runs only on
    declaring PRs and is read by the hold; requiring it would hold every undeclared PR on
    a check that never reports.
  - >-
    THE ENFORCEMENT-STATE READ: `GET /repos/{o}/{r}/rules/branches/main` (readable without
    admin — VERIFIED twice). Pure parsing of the response is the unit under test; the
    live read is made by whoever records the observation, and by the notice job when it
    reports the demotion count (a read, no new write).
  - >-
    MERGE QUEUE IS NOT AN OPTION HERE — VERIFIED (GitHub expert): merge queues are
    available only in organisation-owned public repositories; this one is user-owned.
    Recorded so nobody designs the stale-pass fix around it.
  - >-
    THE EVERY-PULL-REQUEST, EVENT-POLICY AND HOLDS-MERGES CLAUSES ARE RECORDED LIVE
    OBSERVATIONS, NOT TESTS. They are properties of the hosting service. Until every
    observation in the criteria is recorded in this record's notes, this record is not
    done.
  - >-
    THE TESTS COST UNDER 0.3 s. The reader in-process on captured response shapes; the
    not-reproduced-red count and the tunables descriptor in-process; the name descriptor
    via the shared workflow-step executor.
delivers_to:
  - agent: documentation-expert
    contract: >-
      The enforcement state ("advisory" | "enforced", with the date and evidence of the
      recorded observation) and the demotion rule, which the docs/testing/README.md hold
      section must reflect. Until the observation is recorded the text says advisory.
expects_from:
  - ac_id: TQ-600a-13-vi
    contract: >-
      One job in .github/workflows/post-merge-hold.yml named exactly `Post-merge suite
      status`, under `pull_request_target`, no matrix, no job-level `if:`, no `needs:`,
      no path filter.
test_spec:
  - name: test_tq600a_13_x_the_status_is_reported_under_one_name
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the shared workflow-step executor locating the job in .github/workflows/post-merge-hold.yml by the exact name `Post-merge suite status` and executing it with one synthetic event against the recording fake server"
    must_catch:
      - "the job is renamed or reported under a different case"
      - "the job gains a matrix"
      - "the job gains a job-level `if:` or a `needs:`, so a skip reports as passing"
    description: >-
      The executor finds exactly one job with that exact name and executes it to a
      verdict; it refuses a matrix; the test fails if the executor reports a job-level
      condition or a dependency for this job. Covers the NAME half only; the
      every-pull-request half is a recorded live observation.
  - name: test_tq600a_13_x_enforcement_is_claimed_only_from_an_observed_ruleset
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_hold.py's enforcement-state reader, in-process, on response bodies shaped like the real branch-rules response"
    must_catch:
      - "the family is closed as protecting main with the ruleset never read"
      - "a near-miss context ('post-merge suite status', a trailing space, a suffix) is accepted"
      - "the context is accepted with source 'any' rather than integration 15368"
      - "an empty, malformed or unreadable response is reported as enforced"
    description: >-
      The six-context response: advisory. With `Post-merge suite status` pinned to 15368
      added: enforced. Each near-miss, an unpinned entry, an empty list and a malformed
      body: advisory with a reason.
  - name: test_tq600a_13_x_not_reproduced_reds_are_counted_from_run_history
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py's demotion counter, in-process, on served run histories"
    must_catch:
      - "a red followed by a green on a DIFFERENT commit is counted as not reproduced"
      - "superseded cancellations are counted as reds"
    description: >-
      History: red at X then green at X (counted); red at X then green at Y (not
      counted); a superseded cancellation (ignored). The count over 14 days is as stated.
  - name: test_tq600a_13_x_thresholds_come_from_the_tunables_file
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_notice.py's demotion counter and post_merge_hold.py's staleness bound, in-process, each given a scratch copy of scripts/ci/post_merge_tunables.json"
    must_catch:
      - "a threshold is a literal in code, so changing the config file changes nothing"
      - "a missing or malformed tunables file silently falls back to a built-in default"
    description: >-
      With `demotion_later_count` 3, two not-reproduced reds do not demote; with it set to
      2 in the scratch file, they do. With `staleness_hours` 30 a 31 h run is stale; set
      to 32, it passes. A missing file and a malformed file each fail closed naming the
      file. The real committed file parses and carries exactly the accepted defaults.
test_rationale: |
  Most of this record is not provable by a unit test, because the property lives in the
  hosting service's configuration. That is why it is separate: it is the one place in
  the family whose done-proof is a list of recorded live observations, and the
  2026-11-02 event-policy change makes one of those observations a hard deadline rather
  than a formality. The name, the enforcement reader and the demotion counter are cheaply
  testable and stay tests.
