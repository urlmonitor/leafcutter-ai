id: UXP-300-6
title: A flow may carry an optional review-canvas diagram, and any other unknown top-level key is still refused
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a flow file that carries a top-level `diagram` object with a `canvas` (positive width
    and height), `nodes` (each with id, kind, lane, x, y, summary and source_ref) and `edges`
    (each with id, from and to, and optionally kind and label),
  When validate_product_truth.py runs over the store,
  Then the flow passes the schema check,
  And a flow without `diagram` is unaffected,
  And a `diagram` that misses a required member or carries an undeclared member is refused,
  And a flow that carries any other top-level key the schema does not declare is still refused,
    naming that key.
depends_on:
- UXP-300
doc_links:
- path: docs/product-truth/schemas/flow.schema.json
  relationship: modifies
  status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  `diagram` is an optional, strictly-typed top-level property of flow.schema.json (additionalProperties
  false at every level). It is a projection for review canvases; no package script reads it. It is
  shipped in the package rather than as an adopter extension point because the build_product_truth
  phase overwrites the target's schemas on every build, and an adopter already authors this exact
  block: an extension point would force those flows to rename or nest the key.
delivers_to: null
expects_from: null
origin_agent: Hendrik Henze
created: '2026-11-25'
amended_by: []
superseded_by: null
covered_by:
- unit_tests/product_truth/test_uxp_300_6.py
implemented_by:
