change_target: pipeline
risk_surface: internal
notes: |
  Measured 2026-11-16: yaml.load("a:\t1\nb: 2") raises ScannerError with SafeLoader and
  returns {'a': 1, 'b': 2} with CSafeLoader; "a: [1,\t2]" behaves the same. A 300-parse
  timing of a small block took 0.545 s CPU with SafeLoader and 0.072 s with CSafeLoader.
  The libyaml loader was therefore rejected for parse_frontmatter and the reuse of
  BP-900g-8-vi chosen, which removes 89% of the loader calls with no change in any
  parsed result.
