notes: |
  Observed defect 1, second half (2026-10-25): after the partial delete, a retry answered
  NOT_FOUND, so the maker could neither finish nor report the half-cleared workspace.
  "Half-cleared" here means a folder at a workspace position (kind/slug) inside this
  project's landing place whose repository is gone and which holds nothing but, at most,
  its workspace record and empty folders. Finishing such a folder cannot lose any work. A
  half-cleared folder that still holds other files is BO-4300e-2-vi. The blog arm keeps the
  BO-4300e-2-iii safety rule: an empty folder in another project's landing place is never
  touched, even though it carries no record at all.
