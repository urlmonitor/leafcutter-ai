notes: |
  THE CONTROL THAT KEEPS THE PAIR HONEST. A differential pair is only informative when the
  check is capable of objecting in the first place; two silences agree perfectly. Every way
  this L1 can be mis-implemented — narrowing the change set to nothing, exempting merges
  outright, disabling the check while the fix is worked on — produces agreeing silences and
  a green pair. This AC is what makes those states report a failure instead.

  It is written as a property of the VERIFICATION rather than of any one check, so a future
  check added to the sweep inherits the control automatically rather than needing its own.
