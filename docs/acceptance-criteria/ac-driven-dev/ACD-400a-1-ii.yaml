criteria: |
  Given docs/acceptance-criteria/ contains 10 valid YAML files and 1 file
    with invalid YAML syntax (e.g. unclosed quotes or tab indentation errors),
  When the scanner is invoked with --level leaf --work-status todo,
  Then the scanner exits with code 1,
  And the error output names the invalid file path and includes the YAML
    parse error message,
  And the 10 valid files are still processed and reported in the output
    (the invalid file does not prevent scanning of other files).
