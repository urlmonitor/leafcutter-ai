  Given the documentation-coverage guarantee has been implemented (the documentation_gates
    trigger policy, the documentation-verifier phase, and the Agent Contracts brief),
  When a maintainer needs to understand how documentation is demanded, produced, and
    enforced,
  Then a reference document exists that explains: which change classifications trigger a
    documentation demand (the documentation_gates policy), how the documentation-verifier
    phase enforces that docs really exist and are not placeholders, and how the
    `## Agent Contracts` -> `### documentation-expert` block serves as the single brief the
    writer reads and the verifier asserts against.
