notes: |
  THIS IS WHAT MAKES THE TREE SURVIVABLE. BO-3600d's notes are blunt about it: if
  surfacing is all that happens, the same pairs are re-raised every run, the output
  stops being read, and the check is worse than nothing because it looks like
  coverage.

  The second scenario is the safety valve and the harder half. Silence that persists
  after the facts change is the very failure this goal exists to end, recreated by
  its own noise suppression — a decision, once recorded, would otherwise hide a
  disagreement forever.

  The third scenario keeps a decision from being used as a blanket exemption for an
  entry, which is how a narrow settlement quietly becomes a suppression rule.
