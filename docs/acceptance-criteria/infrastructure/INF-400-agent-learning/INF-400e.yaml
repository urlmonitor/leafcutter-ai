id: INF-400e
readiness: reviewed
priority: medium
title: "Repeat work on the same domain is noticeably better than the first time"
component: infrastructure
level: L1
status: active
criteria: |
  The second time any agent works in a domain, it already knows what matters.

  When you create specifications, write code, or review changes in a domain
  the system has worked in before, the output quality is measurably higher.
  The agent makes fewer mistakes, asks fewer redundant questions, and
  produces work that fits the established patterns without being told.
