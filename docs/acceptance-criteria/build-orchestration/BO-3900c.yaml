it_requirements:
  - "The path form is classified in the workflow body before any agent is dispatched for that ticket, so a refused form costs no agent call."
  - "The refusal applies to one ticket only. Well-formed siblings in the same batch are still dispatched, and the run is not halted because of it."
  - "The blocked result carries a stable, machine-readable reason discriminator that separates 'unrecognised path form' from 'file not found' and from every other blocked reason, so the two can be told apart without parsing message wording. It also carries the path value verbatim: an empty string stays empty and whitespace is preserved."
  - "Nothing is repaired. The value is not trimmed, no text after its last drive root is extracted, and it is not resolved against the worktree's drive or any current directory (user decision Q3, 2026-09-14)."
  - "An already-joined value is recognised by its structure (a drive root, UNC root or leading root after the first segment), not by matching the resolved worktree string, so a corrupted value from any worktree is refused."
  - "'Blank' means empty or whitespace-only."
  - "How dependants of a blocked ticket are sequenced stays unchanged."
