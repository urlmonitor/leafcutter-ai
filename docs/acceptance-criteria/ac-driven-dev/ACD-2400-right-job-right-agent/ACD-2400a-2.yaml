- path: docs/reference/ac-schema.md
  relationship: describes
  status: exists
- path: templates/agents/it-po.md
  relationship: describes
  status: exists
- path: docs/architecture/components/ac-driven-dev.md
  relationship: describes
  status: exists
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
- Each family's rule is read from the one rule source the existing record checks read (config/ac_store_schema.json,
  docs/components.json, docs/acceptance-criteria/index.yaml and the documentation-trigger map); no rule,
  id list or trigger table is restated inside the check. A duplicated rule source is a defect to delete.
- The documentation-trigger-to-specialist map (5 triggers) lives in exactly one machine-readable config
  location read by this check; the it-po.md S7b table and ACD-200b-1's 4-entry table are not sources.
- 'Every write is a field-targeted edit: only the named field changes and every other byte of the record
  is preserved (no whole-file YAML load/dump rewrite; see the fast_lane.py round-trip hazard in the ac-driven-dev
  PROJECT_CONTEXT).'
- 'Repairs are idempotent: a second run immediately after the first changes no file and reports no ''fixed''
  entry.'
- A repair is applied only when fully determined by data already in the store; any ambiguous case is reported
  'needs a decision', never guessed.
- After repairs the check re-evaluates the repaired records and reports passed only when that second evaluation
  yields no finding.
- Contract symmetry asserts presence and mutual pointing only; description text is never compared (semantic
  compatibility stays with the technical planner, TKT-300a-3).
- Namespace-to-graph-id resolution reuses the store's existing namespace-to-graph mapping (the one backfill_components.py
  applies); no second mapping.
delivers_to:
  agent: llm-expert
  contract: 'Five rule families with dispositions (parent back-links: fixed; graph component list: fixed
    when unambiguous; readiness never raised to approved by an authoring agent: fixed; producer/consumer
    contract symmetry: needs a decision; documentation trigger mapping: needs a decision). ACD-2400e-2
    removes the matching it-po.md procedures and points to this check.'
expects_from:
  ac_id: ACD-2400a-1
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
test_spec:
- name: test_every_record_evaluated_against_all_five_families
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Each record in the batch is evaluated by all five families, visible in a per-family evaluation
    count.
- name: test_repair_families_fix_and_report_file_and_value
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Back-link, unambiguous component list and approved-by-agent readiness are repaired and
    each reported 'fixed' naming file and value changed.
- name: test_report_only_families_never_modify_records
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Contract symmetry and documentation mapping findings leave every file byte-identical and
    are 'needs a decision'.
- name: test_repaired_records_reevaluated_before_passed
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: passed is reported only when the post-repair evaluation yields no finding.
- name: test_rule_source_change_changes_verdict_without_second_edit
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Changing a rule in the shared rule source changes this check's verdict with no edit to
    the check.
  angle: seam
