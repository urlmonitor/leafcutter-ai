  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_done_recording.py"
  constraints:
    - "VERIFY BY EXECUTION, NOT BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep', a test that searches the workflow source for a status-setting call passes on the broken driver too, because the driver already contains completion-reporting code. The test must run the real workflow script through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs (extended to record the ticket-record writes the run performed) and assert on what the run wrote."
    - "THE TRIGGER IS RECORDED SIGN-OFFS, NOT THE DRIVE'S OWN TALLY. The observed defect is a drive whose report named four completed batches while the store recorded zero tickets done. An implementation that writes done from the same in-memory tally that produced the report re-creates the defect with an extra step: the report and the record would agree because they share one unverified source. The write must be driven by the phase sign-offs actually present in the ticket's record."
    - "THE DELIVERY PHASE ALONE IS NOT THE TRIGGER. A successful commit phase proves code landed, not that the review and test gates ran. Keying completion off the commit phase would mark done the exact tickets in the observed run that were missing their test-runner and reviewer sign-offs."
    - "BOTH TWINS IN ONE CHANGE. The file headers declare the two drivers twins that must stay in sync; a change landed in only one produces a store where single-ticket drives record completion and epic drives do not, or the reverse."
