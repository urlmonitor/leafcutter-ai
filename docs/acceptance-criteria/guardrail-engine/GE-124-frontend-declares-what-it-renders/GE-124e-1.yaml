id: GE-124e-1
readiness: approved
priority: high
title: "The reverse gate fires only on screen criteria that are already finished"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124e.yaml"
criteria: |
  Given the criteria store contains UXP-607-2, whose change target is the user
    interface and whose work status is done
  When the reverse-direction gate selects the criteria it will check
  Then UXP-607-2 is selected

  Given the criteria store contains KM-ADM-003, whose change target is the user
    interface and whose work status is todo
  When the reverse-direction gate selects the criteria it will check
  Then KM-ADM-003 is not selected
  And its outcome is recorded as skipped with the reason "not done", not as a
    pass

  Given the criteria store contains GE-111f, whose change target is code and
    whose work status is todo
  When the reverse-direction gate selects the criteria it will check
  Then GE-111f is not selected
  And its outcome is recorded as out of scope, distinct from both skipped and
    passed
depends_on:
