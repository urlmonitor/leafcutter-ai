criteria: |
  Each surfaced conflict gets a verdict you can look up later.

  When the two records disagree, somebody decides which one was wrong, and that
  decision is written down where the next reader will find it: the claim was
  overstated, or the fault was already fixed, or the promise was narrowed to what
  was actually delivered. A conflict never disappears just because attention moved
  on, and nobody re-litigates the same disagreement six weeks later.
