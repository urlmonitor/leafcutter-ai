title: "Every package config file a compiled prompt tells the agent to read exists where the prompt says, in a consumer install"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a consumer install produced by build.py into a project that is not the
    package repository (the adopter layout, where package config is deployed to
    <output_root>/config/ and there is no package config/ directory at the
    project root),
  When a compiled agent, skill, command or workflow prompt tells the agent to
    read, load or open a package config file (for example doc_types.json,
    paths.json, agent_registry.json, guardrail_gates.yaml),
  Then the path the prompt names resolves, relative to the install root, to a
    file that exists in that install,
  And the template writes the path through the build's {{config.output_root}}
    placeholder rather than as a bare "config/<file>" or "leafcutter/config/<file>",
    so the same template is correct in the self-hosted layout and in every
    adopter install whatever its configured output_root,
  And the documentation-expert's mandatory pre-flight read of doc_types.json no
    longer halts with "cannot be read" in a consumer install,
  Because at leafcutter v15.0.9 (dcd93781) the documentation-expert template told
    the agent to Read `config/doc_types.json` and to STOP with a blocker when it
    could not, while the build deploys that file to `.leafcutter/config/doc_types.json`.
    In the DIAGraph adopter every ticket with a documentation-expert phase halted
    before writing anything (INF-120c-3 halted exactly this way).
