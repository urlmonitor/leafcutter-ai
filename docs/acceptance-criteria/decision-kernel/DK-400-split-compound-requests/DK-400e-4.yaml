criteria: |
  Given the reusable-criteria split approved with p1 and p4 waiting for no part, and p2 and p3
    waiting for p1,
  When p1's decision ends without a decision because it reached its budget stop,
  Then p1's outcome is not settled, with the stop reason budget stop,
  And p2 and p3 are not run, each with the reason that it waits for p1, which was not settled
    (budget stop),
  And p4 still runs and settles,
  And a part that waits for p2 or p3 is also not run, with the reason naming the part it waited for,
  And the run ends partial, never completed, and the split ends ended_partial.
