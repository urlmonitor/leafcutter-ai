test_required: true
test_rationale: |
  Free-text labels degrade by accumulating near-duplicates rather than by producing invalid
  values, so a test that only feeds an obviously wrong label misses the real failure. The
  near-miss clause is the one that matters and needs its own fixture: a label differing only by
  case is the form a reviewer will not notice and a scan will treat as a distinct facet.
test_spec:
  - name: test_unregistered_component_label_is_reported_with_artifact_and_label
    target_dir: unit_tests/product_truth/
    description: "A journey labelled with a component absent from the registry is reported naming both."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_tag_not_matching_the_declared_shape_is_reported
    target_dir: unit_tests/product_truth/
    description: "A tag violating the declared pattern is reported naming the artifact and the tag."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_near_miss_label_is_reported_as_the_registered_one_having_been_meant
    target_dir: unit_tests/product_truth/
    description: "A component label differing only by case or spacing is reported as a near miss naming the registered label."
    type: unit
    angle: boundary
    framework: unittest
  - name: test_resolved_label_count_rises_with_the_number_of_labels
    target_dir: unit_tests/product_truth/
    description: "Adding one labelled artifact raises the stated resolved-label count."
    type: integration
    angle: seam
    framework: unittest
notes: |
  MEASURED 2026-09-07: tags has no pattern and component is free text in the artifact shapes.
  Note also that index.json currently records component values in the AC-store kebab vocabulary
  (for example ux-prototyping) while docs/components.json uses underscore ids (ux_prototyping).
  Those are two different registries and the IT PO must decide which one artifact labels resolve
  against BEFORE this is built - resolving against the wrong one turns every existing artifact
  into a finding. This is flagged as an open question, not settled here.
target_epic: EPIC-TruthfulProjectRecord
