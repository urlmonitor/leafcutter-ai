notes: |
  THE TRAP THE L1 NAMES, RESOLVED IN THE CRITERIA RATHER THAN LEFT TO THE IMPLEMENTATION.
  "An unrecognised kind is refused" is not specifiable until recognised is defined, and the
  two obvious definitions are both wrong. Refusing everything not current would refuse the
  retired alias, which is a real declared name an author may legitimately hold — and
  refusing it sends them to improvise, which is the behaviour this whole goal exists to
  stop. Accepting anything that resembles a declared name would accept a typo and produce a
  document of the wrong kind that reads perfectly and is silently wrong, which INF-1300d's
  notes call the worse of the two failures because nothing downstream will notice.

  THE LINE TAKEN: membership in the declaration decides acceptance, and nothing else does.
  Declared and current is produced as asked. Declared and retired is produced under the
  current name, with the substitution said out loud — silent correction would be the
  plausible-looking wrong document again, one level down. Not declared is refused, however
  close it looks, because closeness is exactly what a typo has. Case and surrounding
  whitespace are normalised before membership is decided, because those differ in how the
  value is typed rather than in which name is meant, and treating them as unknown names
  would refuse a real request for no reason.

  FALSIFIABILITY. Four requests against a scratch project. A current name: a document is
  produced declaring it. The retired alias: a document is produced declaring the CURRENT
  name, and the run says so — falsified if it is refused, and equally falsified if it is
  produced declaring the retired name, or if the substitution happens without being stated.
  A name one character away from a declared one: falsified if anything at all is written,
  and falsified if the refusal message does not distinguish "not declared" from some other
  failure. A declared name in the wrong case: falsified if it is refused. The near-miss and
  the alias must both be exercised against the SAME implementation in the same run — each
  in isolation is satisfiable by a rule the other defeats, and that pairing is the whole
  content of this record.

  FENCED. What every refusal in this tree must say and must leave behind is INF-1300d-3's.
  How the declaration is read, and what happens when it changes, is INF-1300d-1-i's. This
  record owns only which names are accepted, which are corrected, and which are refused.

