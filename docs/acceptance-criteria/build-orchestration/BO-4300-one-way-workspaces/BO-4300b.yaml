criteria: |
  From any folder, in any project, on any platform -- the same result.

  It makes no difference whether you begin at the top of the project, in the folder
  above it, inside another workspace, or in a project that simply installed these tools,
  nor whether you are on Windows, Linux or macOS. The right project is found, or you are
  told which candidates it could not choose between -- never guessed -- and the workspace
  lands in a predictable place for that project.
