title: "Every criteria change is traceable to the agent that made it"
component: ac-store
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Full audit trail for every change to what a requirement asks for.

  Whenever the criteria field is created or amended, the origin_agent or
  amended_by field must record which authorized agent made the change. If
  a criteria modification is committed without updating the audit trail,
  the commit is rejected. You can always answer "who changed this requirement
  and when?"
