id: BO-400a-3
title: "finalize-feature reads status from frontmatter, not folder position"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic folder where all sub-tickets have frontmatter `status: done`
    but none have been moved to a done/ subfolder
    (all ticket files remain at the epic folder root),
  When finalize-feature-archive-check runs its pre-archive validation,
  Then it scans ALL .md files in the epic folder recursively
    (excluding Master_Plan.md)
  And it reads the `status:` frontmatter field from each ticket
  And it reports all_clear: true because every ticket has `status: done`
  And it does NOT require the existence of a done/ subfolder.
