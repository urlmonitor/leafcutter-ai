superseded_by: null
covered_by: []
implemented_by: []
change_target: docs
risk_surface: contract_boundary
test_spec:
  - name: test_first_consumer_binds_every_declared_slot
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Run the real _ac_schema_validators.validate_pattern_bindings_completeness over the on-disk pattern and its consuming AC; assert it returns zero errors — executes the deployed validator against the real records."
  - name: test_pattern_ref_hook_accepts_the_first_consumer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Run check_ac_pattern_refs over the pattern and consumer files with HOOK_ROOT on the repo; assert exit code 0 — the reference resolves and the target passes _has_parameterized_slots."
  - name: test_consumer_criteria_do_not_duplicate_the_pattern_body
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Run validate_criteria_not_pattern_duplicate over the consuming AC; assert zero errors — proves the body states only agent-specific detail."
  - name: test_store_contains_at_least_one_pattern_and_one_consumer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Walk the real docs/acceptance-criteria/ tree; assert at least one AC passes _has_parameterized_slots and at least one AC sets implements_pattern. Both counts are zero today — this is the cold-start assertion for the whole ACS-500g L1."
  - name: test_pattern_steward_is_registered_in_the_eval_config_triggers
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Run eval_selector's affected-agent computation with templates/agents/pattern-steward.md as the changed file; assert pattern-steward is returned as affected and that a missing result yields the blocking exit code — proves the eval entry is consumed in control flow, not merely present in the config."
notes: |
  The end-to-end proof that the producer half works: the loop the L1 describes
  (empty inventory -> no match -> another one-off spec -> still empty) is broken
  only once a real pattern has a real consumer. Uses the existing consumer
  mechanism (ACS-500b/ACS-500c/ACS-500f) rather than re-specifying it.
