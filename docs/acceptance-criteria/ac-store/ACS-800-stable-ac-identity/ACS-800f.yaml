criteria: |
  The skills and agent instructions that authors follow describe stable names and
  metadata hierarchy — not the old name-encodes-position mechanic.

  When a person or agent reads how to create, split, or move a requirement, the
  guidance matches how the store actually works: it explains permanent names and
  metadata-based hierarchy, so the written instructions never quietly contradict the
  real behavior.
