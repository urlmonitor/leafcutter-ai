status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a person who has been shown a proposed split by the kernel,
  When they read the kernel how-to section on answering a split,
  Then it shows the four answers, approve as shown, reword a part, leave parts out and reject, with
    one example each, and that rewording and leaving out can be combined in one approval,
  And it states that unticking every part is not an approval, and that a set-aside proposal cannot
    be approved but its question can be added by rewording a part,
  And it states what a rejection leads to: a request the kernel turned away ends blocked with
    nothing decided, while a request the kernel would have accepted, or one found mid-run, goes
    ahead as one,
  And it states that only a person answers, and that an answer relayed by the host carries that
    person's own name.
