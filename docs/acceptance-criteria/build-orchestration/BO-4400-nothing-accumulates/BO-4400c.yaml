notes: |
  Gap G3. Prevention side of BO-4400b: if the environment lives in the workspace, it dies
  with it. Detection order the user named: uv.lock present -> uv sync with an in-workspace
  .venv; poetry only when poetry.lock is present, and then with an in-project virtualenv.
  A project declaring neither is handled by BA (likely: plain in-workspace venv, never a
  shared location). Must sit within BO-4300's one maker and BO-4100b (workspace owns its
  supporting material) -- cite, do not re-derive. Package-repo note (memory): this repo
  uses requirements-dev.txt and Poetry bootstrap fails here; the BA must cover that case.
  reference-doc: which declaration selects which set-up, and where the environment lives.
