title: "test-writer is injected before any coder-class agent in the computed chain"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_type: flow_change
    and the assigned work agent is python-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then test-writer appears in the chain with a lower sequence number
    than python-coder
  And test-writer's status is set to "needed"
  And test-writer is dispatched and must sign off before python-coder is spawned

  Given a ticket has change_type: data_change
    and the assigned work agent is sql-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then test-writer appears before sql-coder in the sequence
  And sql-test-writer (if applicable) also appears before sql-coder

  Given a ticket has change_type: doc_change
    and the assigned work agent is documentation-expert (produces: documentation),
  When ticket-supervisor computes the agent chain,
  Then test-writer does NOT appear in the chain
  And the chain does not include any TDD-related agents
