criteria: |
  Given a component entry has depends_on: ["agent_registry", "ac_store"],
  When the validator cross-references each element against the set of
    all component IDs in docs/components.json,
  Then both "agent_registry" and "ac_store" are found as valid component IDs.
  And if any depends_on value is not a valid component ID,
    the validator rejects with an error naming:
    the invalid reference, the component that declared it,
    and the list of valid component IDs available.
