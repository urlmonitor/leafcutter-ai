id: BP-900a-1-1
components:
  - build_pipeline
title: "Build fails if a source ac_store script is missing from the templates directory"
component: build_pipeline
level: L3
status: active
req_status: approved
readiness: approved
priority: critical
work_status: not_started
criteria: |
  Given the templates/scripts/ac_store/ directory is missing one of the 13 expected files
  (e.g. ac_prioritizer.py has been deleted or renamed),
  When build.py is invoked with --target-dir pointing to a consumer project,
  Then the build exits non-zero before writing any partial output to the target
  And the error message names the missing source file
depends_on: [BP-900a-1]
doc_links:
  - path: scripts/build.py
    relationship: implements
    status: exists
  - path: docs/architecture/components/template-compiler.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/build_phases.py
  n_location_rule: "1 — the pre-write source-existence check in build_ac_store()"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Must validate source file existence before writing any output to the target — no partial deployment"
    - "Error message must name the specific missing file(s) to aid debugging"
    - "Must handle errors gracefully per the project error handling policy"
  notes: |
    SOURCE-PATH CORRECTION (2026-08-17): the criteria prose says
    templates/scripts/ac_store/. That directory holds only .gitkeep; the real
    source is scripts/ac_store/. Guard the sources build_ac_store() actually
    reads. See BP-900a-1 notes.

    Today build_ac_store() logs a warning and SKIPS a missing source
    (build_phases.py:881, "source script not found, skipping"). This AC changes
    that to a hard non-zero exit before any target write — that skip is exactly
    how a capability ships half-deployed.
test_spec:
  - name: test_build_exits_nonzero_when_an_ac_store_source_is_missing
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "With one source script absent from scripts/ac_store/, build.py exits non-zero instead of warning and skipping."
  - name: test_missing_source_error_names_the_missing_file
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "The failure message identifies the specific missing source filename."
  - name: test_no_partial_output_written_when_a_source_is_missing
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "The target directory receives no deployed ac_store files when the build aborts on a missing source."
