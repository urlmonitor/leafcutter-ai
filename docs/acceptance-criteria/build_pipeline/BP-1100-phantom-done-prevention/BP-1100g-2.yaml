estimated_complexity: M
it_requirements:
  - "The record must ride the EXISTING completion_manifest: block in the sign-off comment (templates/skills/signoff/SKILL.md §2b), placed after feedback-id: and before the prose summary. Do not introduce a second artifact — that is the asymmetry GAP F is about, one layer up."
  - "The manifest key must be ONE fixed token, declared once and used verbatim in both templates/agents/test-writer.md and templates/skills/signoff/SKILL.md, so BP-1100g-5-i's reader can be extended to it without inventing a second convention. Two spellings of the same key is the same drift this tree exists to prevent."
  - "The honest negative must use the existing nested shape ({result: false, reason, remediation}) rather than a bare false — the §2b Bare-False Rule makes a bare false a malformed manifest and triggers a supervisor retry. 'No way in found, here is what I looked for' must be expressible as a valid record, not as a failure."
  - "The guidance must be a DECISION PROCEDURE over the surfaces this project actually builds — CLI via subprocess, pre-commit hook via run_hook.py, slash command, workflow dispatch, main() invoked with real argv — not a list of candidates with no rule for choosing. It must also restate what does NOT count: importing the module, asserting a symbol exists, assertIn('name', registry_json), and asserting a value was passed as an argument (dispatch topology, not execution)."
  - "An entry point already named in the request must be copied through verbatim. The writer must not substitute one of its own, and must not overwrite a named entry point with the unresolved sentinel."
  - "The recorded way in is a DECLARATION. It must contribute to no done, pass or eligibility decision, and nothing in this AC may inspect a test to check the declaration is true — that question belongs exclusively to BO-2900a's execution observer (BO-2900a-2)."
  - "OBSERVED GAP, CARRIED FORWARD: completion_manifest has ZERO code readers today — grep over scripts/ returns no occurrences; it is read only by the supervisor. Until BP-1100g-5-i's reader exists and is extended to this key, this record has no forcing function. That is a known and accepted state for this AC, not a defect to fix here."
delivers_to:
  - agent: pr-reviewer
    contract: "One completion_manifest key per work item carrying the resolved production entry point: either a non-empty string naming it (command line, hook runner invocation, slash command, workflow dispatch, or main() with real argv), or the nested {result: false, reason, remediation} form whose reason states what was looked for and why no entry point was found. Read by a human reviewer today and, once BP-1100g-5-i lands, by the same manifest reader that handles the seam answer."
expects_from:
  - ac_id: BO-2900g-4
    contract: "A reachability request that either names the production entry point, or carries the single stable sentinel stating the entry point is not declared and must be resolved before the test is written. The writer must be able to tell the two apart without parsing prose."
test_required: false
test_rationale: |
  Genuinely test-free at this AC's boundary, and saying so explicitly rather than
  faking coverage. change_target is prompt: every Then clause here is a statement about
  what an LLM agent writes into its own sign-off record, and no unit test can produce
  that record — the only faithful check is an eval over agent output, which is not in
  scope. The two proxy tests available are both dishonest: grepping
  templates/agents/test-writer.md for the guidance text asserts prose presence, not
  actionability (the same trap flagged on BP-1100g-1's second clause), and validating a
  hand-typed sample manifest asserts the fixture, not the writer. The forcing function
  this AC actually needs is BP-1100g-5-i's manifest reader extended to the entry-point
  key; that extension is recommended as a follow-up rather than smuggled in here as a
  test. Reviewing surfaces: pr-reviewer and the llm-expert Prompt-Quality Checklist.
