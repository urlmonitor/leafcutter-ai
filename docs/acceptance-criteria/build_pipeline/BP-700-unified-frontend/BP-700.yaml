criteria: |
  A single frontend specialist that applies design best practices automatically.

  Every project gets one agent that handles both visual quality and code
  implementation for frontend work. Design principles are built in rather than
  bolted on as a separate skill you might forget to load. The agent is always
  available in every install but only dispatched when the project has frontend
  files to work on — backend-only projects are never bothered by it.
