it_requirements:
  - "TARGET DOCUMENT -- a NEW reference page at docs/reference/plan-feature-layout-and-startup-checks.md. That exact path is already linked as planned from ACD-2100d-1 and ACD-2100d-2; publishing under any other name silently breaks both links and check-doc-links will not catch it because the target simply never appears."
  - "THIS IS A REFERENCE PAGE -- THE LAYOUT AS IT IS -- NOT A TROUBLESHOOTING GUIDE. The reader arrives having already been surprised, but what they need is the fact that resolves their confusion, not a procedure. Route the 'what do I do now' half to the known-issues entries and to the behaviours that fix them; a restated procedure is a second account that drifts from the governed one."
  - "ORGANISE IT AROUND THE READER'S THREE SITUATIONS -- started from the project root, started from a worktree, started from a directory outside the project -- not around the two directory trees. A page organised around the layouts is accurate and useless to someone who does not yet know which layout they are in, which is the whole population this page serves."
  - "EVERY LAYOUT AND STARTUP-CHECK STATEMENT MUST DESCRIBE DELIVERED BEHAVIOUR AND NAME THE RECORD THAT DELIVERS IT. Do not write any of it from intent ahead of the behaviour landing. A reference page that documents what the route is going to do becomes wrong on the day the implementation differs and nothing in the repository detects it -- unlike the behaviours themselves, which have tests."
  - "TAKE THE SOURCE-VERSUS-REGENERATED ACCOUNT FROM THE INSTALLER'S OWN MAPPING (ACD-2100d-2's deliverable), never from a hand-written list of directories. A second list is exactly the artifact that goes stale the first time a directory is added, and this page's whole value is that a reader can trust it about where to put a fix."
  - "QUOTE EACH STARTUP CHECK'S REPORT VERBATIM, never a paraphrase. The reader is holding a message on their screen and matching it to this page; a paraphrase they cannot match sends them away believing the page does not cover their case. Pair each report with what it means and what it does not mean -- KI-ACD-009's four distinct causes all printed the same permissions verdict, and separating them is the point of the ACD-2100b family."
  - "PUBLISH THE RULE AND NOT THE CURRENT DEFECT STATE. The stale deployed workflow and the evaporated 2026-08-18 workaround are the motivating incidents, but they are today's facts and belong in the known-issues entries. If any current-state measurement is stated here at all it must carry the date it was taken, or the page is wrong on the first build after it is written."
  - "THE COMPONENT DECLARED IN THE PAGE'S FRONTMATTER components LIST MUST BE ac_driven_dev -- underscore, not the kebab ac-driven-dev. The taxonomy is two-axis and the two axes take different spellings: this AC record's scalar component field is the kebab namespace key from docs/acceptance-criteria/index.yaml, while a doc's frontmatter components list is validated by check_doc_frontmatter against the keys of docs/components.json, which are underscore graph ids. Writing the kebab form fails the very gate this clause relies on for proof. Corrected 2026-08-25 after verifying that 'ac-driven-dev' is absent from components.json while 'ac_driven_dev' is present. That declaration is what puts the page in the component view beside the criteria it explains, and it is the mechanically checkable half of the last Then clause."
  - "docs/INDEX.md IS GENERATED. Register the page by running the build and committing the regenerated index -- do not hand-edit it. A hand-edited index is reverted by the next build, which is the same class of disappearance ACD-2100d-2 exists to catch."
  - "Tracked reference subject to check-doc-frontmatter, check-doc-length and check-doc-links; keep all three passing in the same commit. Length is a real constraint here -- the page spans three layouts, an installer mapping and four startup checks, so link out rather than absorbing ADR-001 or the build-pipeline document."
  - "DO NOT ABSORB ACD-2100c's SUBJECT. The gate-provenance and pause-and-resume flow is a different page for a different reader, its two documentation triggers are recorded as unserved, and folding them in here would produce a page with two subjects while leaving those triggers formally unserved anyway."
delivers_to: null
expects_from:
  - ac_id: ACD-2100a-5
    contract: "The confirmed behaviour of a run started from the project root, from a worktree and from a directory outside the project -- which copy of each route file is resolved in each case and that all three reach the first user question. The page states these as the delivered behaviour of this record."
  - ac_id: ACD-2100b-3
    contract: "The distinct reports for an agent absent from the registry and an agent denied permission, as two different verdicts rather than one. The page quotes both."
  - ac_id: ACD-2100b-4
    contract: "ORDERING GAP -- SEE NOTES. The complete set of startup-check outcomes that stop a run before the first question, each as a recorded halt distinguishable from the other three. The third Then clause names the checks and what each report means, so it needs the closed set rather than any one member of it."
  - ac_id: ACD-2100d-1
    contract: "The confirmed behaviour of the installed copy on the startup path, which the page states as fact rather than as an expectation."
  - ac_id: ACD-2100d-2
    contract: "ORDERING GAP -- SEE NOTES. The installer-derived source-to-installed mapping: which directory a repair must land in for an install to carry it and which directories are regenerated. This is the second Then clause's entire content and it must come from the installer's own mapping rather than from a list written by hand."
test_required: false
test_rationale: >-
  The deliverable is a prose reference page with no executable surface a test could drive.
  Every fact it publishes is owned and enforced elsewhere by tests that execute: the
  three-layout resolution by ACD-2100a-5, the four startup-check reports by ACD-2100b-1
  through ACD-2100b-4, the installed-copy behaviour by ACD-2100d-1 and the
  source-to-installed mapping by ACD-2100d-2. A test over this page could only assert
  that certain words appear in it, which is the presence-shaped proof this whole tree
  exists to discredit -- it would pass on a page that names a check the route no longer
  performs. The two mechanically checkable clauses in the criteria are already covered by
  live commit gates rather than being untested: the component declaration by
  check-doc-frontmatter and the index reachability by the generated docs/INDEX.md, with
  check-doc-links guarding the inbound links from ACD-2100d-1 and ACD-2100d-2. A bespoke
  unit test would duplicate a running gate rather than add coverage. Recorded explicitly
  so test-writer skips with an accurate reason rather than silently.
