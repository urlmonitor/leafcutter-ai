risk_surface: auth
it_requirements:
  - "THE GATE MUST VALIDATE PROVENANCE, NOT SHAPE. A well-formed reply naming a permitted choice must be REJECTED when it did not come from the person. Any implementation that hardens the parser — which is where KI-ACD-005's own fix direction stops — passes the refusal scenario and fails the first one, because the defect was never that the reply was malformed."
  - "PROVENANCE MUST BE ESTABLISHED BY THE CHANNEL, NOT BY THE CONTENT. The answer is accepted only when it arrives through the means the question was put by (the user-answer channel), never by inspecting a reply for a marker, a role name, or an author field a caller could set. Content-derived provenance is forgeable by exactly the thing this AC excludes."
  - "AN UNSETTLED GATE MUST REMAIN AWAITING, and no choice may be recorded on the person's behalf — not a default, not the last received value, not a null that a downstream branch reads as one of the choices."
  - "AGENT REPLIES MUST NOT BE ROUTED TO THE GATE'S SETTLE PATH AT ALL. The strongest form of this criterion is that a dispatch result is structurally incapable of reaching the settle path, so the rejection is not a check that could be removed. Prefer that over a check where it is achievable."
  - "The rejection must be recorded — which non-person reply arrived, and that it was rejected — so a run repeatedly answered by the wrong source is diagnosable rather than appearing simply to hang."
  - "THE THIRD SCENARIO IS THE ANTI-VACUUM CLAUSE: a gate that accepts nothing satisfies the first two. The person's real answer must settle it and the run must continue according to it."
delivers_to: null
expects_from:
