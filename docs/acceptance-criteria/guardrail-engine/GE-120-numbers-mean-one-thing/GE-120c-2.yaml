id: GE-120c-2
title: "At commit and in the shared build you are told both claimants and what to do yourself"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a commit whose changes introduce a record claiming an identifier that another artifact
    in the collection already claims,
  When the commit-time guard runs,
  Then the commit does not complete,
  And the printed output states the contested identifier, the path of EVERY artifact claiming
    it, and the remediation the author must carry out themselves — which artifact is expected to
    move, and how to obtain a free identifier,
  And the printed output makes NO statement that any agent, specialist, or automated process
    will perform the renumbering on the author's behalf,

  And given the same contested identifier reaching the shared build,
  When the build's numbering gate runs,
  Then the build fails,
  And its printed output carries the same three elements — contested identifier, every claimant
    path, author-performed remediation — and likewise promises no automated renumbering,

  And a reader holding only that printed output, with no access to the collection and no further
    commands run, has every fact needed to act: they can name the other claimant and state which
    identifier the moving artifact will take.

  Coverage note: covered only by a test that executes each stage against a real contested
  collection and asserts on the captured output text — that both claimant paths appear, that a
  free identifier appears, and that no dispatch or automated-fix promise appears. Asserting that
  a message template contains placeholders does not cover it.
depends_on:
  - GE-120c
  - GE-120a-1
