title: "Work that lands in the wrong place gets stopped before it ships"
component: guardrail-engine
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  A misplaced test or artifact can't slip through — the commit is stopped and tells you exactly how to fix it.

  Even when everything upstream is configured correctly, mistakes happen. This
  goal adds the last line of defense: at the moment you try to commit, work that
  has landed outside its configured home is caught and the commit is blocked,
  with a clear message that points you straight at the configuration that decides
  where it belongs. Just as importantly, the escape hatch that lets people wave
  through unrelated structural changes can no longer be used to silently excuse a
  misplaced artifact. And the guards themselves are dependable everywhere the
  product runs — including the installed copy inside a consumer project — so a
  guard never quietly fails to do its job because of where it was deployed.
