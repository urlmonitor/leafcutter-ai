notes: |
  The user-visible outcome of GE-127h ("never pushes a file over its permitted length or
  blocks a change"), stated against both ratchet paths: growth on an already-oversized file
  (GE-127b-1) and crossing the limit (GE-127a-1). The before-length must be measured with the
  same rule as the after-length, so a history block present before the change is not
  counted on either side.
