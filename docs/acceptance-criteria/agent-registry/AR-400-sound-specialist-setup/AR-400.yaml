id: AR-400
title: "A specialist's setup is either sound, or the build says exactly what is wrong"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Real setup faults stop the build; nothing else clutters its report.

  Each specialist is set up by a handful of statements: what it may use, what
  its instructions tell it to use, and who it may hand work to. Today those
  statements can contradict each other, point at things that do not exist, or
  repeat themselves, and the build answers with a long list of warnings in
  which the handful of real faults are buried among dozens that mean nothing.
  People learn to scroll past the list, and the real faults ship.

  After this goal, a fault in a specialist's setup stops the build and names
  the specialist and the fault. Anything that is not a fault is not reported
  at all. A clean build means every specialist's setup is coherent, and a
  report from the build is worth reading every time.
