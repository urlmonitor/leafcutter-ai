it_requirements:
  - "Author a Mermaid sequenceDiagram in the planned web-app CI gate documentation (docs/architecture/components/web-app-ci-gate.md, or a diagram file it references) using the write-c4-diagram skill conventions."
  - "The diagram MUST depict the shared web-app pull-request flow: PR changes leafcutter-web/ -> CI runs the build/type-check check -> pass/fail result reported on the PR -> merge gate decision. Show both the failing path (build/type error -> blocking failure -> not mergeable) and the passing path (clean build -> passing check -> merge not blocked by this check)."
  - "Actor and check naming MUST match BP-1400a-1: the build/type-check check's label must be the same stable ci.yml job name that BP-1400a-4 wires into the required-status-checks list — no divergent labels. Name the actors: the pull request, the CI system, and the merge gate."
  - "Diagram is documentation only — it must not assert behavior beyond what BP-1400a-1 / BP-1400a-4 specify (no invented retry/notification steps). The same diagram may cover all three web-app checks' shared PR flow; BP-1400c-2 documents the route-render-specific headless-load interaction separately."
