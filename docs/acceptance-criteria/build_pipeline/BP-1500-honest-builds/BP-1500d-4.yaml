notes: |
  WHAT THIS CHILD OWNS, AND WHY IT IS NOT BP-1500c. BP-1500d's own criteria state it:
  "The checks that exist to tell you whether anything has drifted or been altered all
  read that account, so wherever it is missing or unreadable they protect nobody --
  and say nothing about it." That sentence is the subject here. The judgement being
  demanded is about the READABILITY of the record, not about what the record, once
  read, says. BP-1500c owns "an installed copy that has fallen behind is reported" and
  is deliberately not restated: BP-1500d is its prerequisite, because drift cannot be
  reported against a record that was never written in the project being checked.

  A check can satisfy BP-1500c perfectly in the producing package's own workspace and
  be entirely inert in a consumer install. That is evidence point 4 of BP-1500d's
  notes, and it is the reason BP-1500c must not be accepted on evidence gathered only
  inside this workspace.

  THE THREE-RUN CONTROL IS LOAD-BEARING. Remove the record, see the could-not-read
  report; substitute a location-keyed record, see it again; restore, see the all-clear.
  A single red proves the check can fail; it does not prove that the red was caused by
  the record. The restore run is what attributes it. This mirrors the discipline
  already applied in BP-900h-4 and BP-900h-1.

  THE DISTINGUISHABILITY CLAUSE IS THE ONE TO GUARD AT IMPLEMENTATION TIME. An
  implementation that logs "no record found" and then returns the same clean verdict
  satisfies the wording of the reporting clause and changes nothing that matters. The
  criterion therefore requires the two outcomes to be distinguishable to an automated
  caller, not only to a human reading output.

  ORDERING. Presupposes the record produced by BP-1500d-1 and the readability
  guarantee of BP-1500d-2 for its positive case. depends_on carries only the parent
  link, as the authoring request specified.

  IT-PO RESPONSE, 2026-08-25. The BA's warning about the distinguishability clause is
  confirmed by the code and is worse than a risk -- it is the present behaviour.
  check_output_drift.py and check_build_drift.py BOTH print a WARNING naming the
  missing manifest and then return 0. So the reporting clause is already satisfied in
  letter, today, by the exact code this AC exists to change. Every assertion about
  output text is therefore green on the defect. Test entry 2 compares the
  caller-visible exit status between the all-clear and the no-record run and asserts
  inequality; that is the only entry that can distinguish the fix from the status quo.

  THE BP-1500c BOUNDARY IS REINFORCED, NOT RELAXED. The BA's in-criteria clause is
  untouched. It now also carries a dedicated it_requirement and test entry 5, which
  asserts that a stale-but-readable install does NOT produce the could-not-read
  verdict -- pinning the boundary from the inside without asserting anything about
  what BP-1500c's drift judgement should be. The realistic over-reach here is a coder
  reaching for an existing drift comparison to produce this verdict, which would
  couple the two guarantees the L1 deliberately separates.

  ORDERING WIRED AS CONTRACTS. expects_from carries -1 (harness and record), -2 (a
  portably readable record plus the location-keyed artifact this AC substitutes) and
  -3 (which bounds this AC's scope). None went into depends_on, per the BA's framing.

  package_surface is deliberately NOT set: per ACS-100i-6 it means the AC registers an
  entry in a registry the build reads to decide what a consumer receives. This AC
  changes two checks' verdicts and registers nothing.

  BA AMENDMENT, 2026-08-25 -- TWO CLAUSES MADE CONCRETE, THE SCOPE WAS NOT CHANGED.
  The Then now says the check could not read "the record file" and names "the record
  file it looked for"; the mandated negative control now names the file operations it
  always performed -- the record file being removed from disk, a substitute record
  file written to disk in its place, and the good record file restored. Nothing new is
  demanded: those are the same three steps, and the it-po's test entry 4 already runs
  them against a real install. The reason for the wording is mechanical and worth
  recording. declares_side_effect is DERIVED from this AC's own Then clause rather
  than authored by opinion, because it non-overridably routes the one phase agent that
  runs the real surface end-to-end and inspects the resulting tree -- which is exactly
  what this criterion's every-run-against-a-real-install clause demands. The customer
  phrasing described durable file operations without naming one, so the derivation read
  false while the record declared true, and the schema check refuses that disagreement.
  WHAT WAS DELIBERATELY LEFT ALONE: the BP-1500c boundary clause ("this verdict
  concerns only whether a record could be read ...") is untouched word for word, as is
  the distinguishable-to-an-automated-caller clause, which is the clause this whole AC
  turns on. Every it-po field -- including declares_side_effect: true -- is as the
  it-po left it.
