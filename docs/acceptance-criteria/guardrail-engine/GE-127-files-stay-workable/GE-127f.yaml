readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Add to an oversized file and it comes back smaller than it started.

  A file that is already too large no longer merely stops growing — it gets
  smaller by about twice what the change adds to it, so what you pay tracks
  what you are doing rather than how large the file already was. Adding
  nothing costs nothing, which keeps an urgent one-line correction in a very
  large file as cheap as it is today. The obligation is capped by the size
  standard itself and ends the moment the file is back within it — nobody is
  asked to take out two hundred lines when twenty would bring it home. And the
  tidying is not asked of the author mid-change: it goes to someone whose
  craft is restructuring code, so the file is genuinely reorganised and new
  work is given a home of its own from the start, rather than existing content
  being shuffled into a neighbouring file to make a number fall.
depends_on:
