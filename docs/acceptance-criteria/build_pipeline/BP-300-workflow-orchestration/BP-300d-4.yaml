title: "The build fails when a primary delivery command would deploy its prose flow on a supported runtime"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-300-workflow-orchestration/BP-300d.yaml"
criteria: |
  Given a build for a supported Claude Code runtime,
  And the resolved deployed body for one of the primary delivery commands
    (build-feature, create-ticket, or finalize-feature) is the prose flow from
    templates/workflows/<name>.md rather than the workflow-invoking command body,
  When build.py runs its command-deployment validation,
  Then the build exits with a non-zero status,
  And the failure message names the offending command and states that on a
    supported runtime the prose body was about to be deployed instead of the
    deterministic workflow invocation,
  And no consumer install receives the prose body as that command's default on a
    supported runtime.
