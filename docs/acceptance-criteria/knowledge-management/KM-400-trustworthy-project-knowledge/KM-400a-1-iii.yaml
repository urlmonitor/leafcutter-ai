id: KM-400a-1-iii
title: Component metadata comes from its registry entry without document overlays
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given the component registry contains knowledge_management and a component with no incoming membership links
  And entries declare id, name, type, description, status and primary_code together with any authored detail_ref, agent_affinity, exposed_interfaces and depends_on
  When Component records are exposed as graph metadata from the selected source revision
  Then each registry entry has one record identified by its exact registry key, including entries without incoming memberships
  And every authored entry field is retained, including each exposed interface's name, type, path, shape and extension values
  And architecture-document fields cannot overwrite the registry entry's type, status or other source values
  And an absent agent_affinity differs from an empty list, and an absent detail_ref differs from explicit null
  And legacy empty primary_code and future nested fields remain as authored without inserting current admission-rule defaults
  And authored order, duplicate references and scalar types are unchanged

  Given the component registry is absent, malformed or contains a key that conflicts with an entry's id
  When component metadata is prepared
  Then an absent registry produces no invented Component records from architecture documents
  And malformed or conflicting registry data produces an explicit failure without rewriting the source
