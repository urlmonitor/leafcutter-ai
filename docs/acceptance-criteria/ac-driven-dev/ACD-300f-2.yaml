title: "Agent Consumption Protocol defines zero-result and empty-graph handling as non-error conditions"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the SKILL.md contains the "Agent Consumption Protocol" section
    (from ACD-300f-1),
  When zero-result and empty-graph handling subsections are added to the
    protocol,
  Then the zero-result subsection states:
    "When a query returns zero matching nodes, the consuming agent logs:
    'knowledge-query returned 0 nodes for <query-term> — proceeding with
    file-based reads only' and continues its normal workflow without error,
    retry, or user prompt",
  And the empty-graph subsection states:
    "When the graph contains zero nodes across all surfaces (fresh project),
    this is a normal condition. The consuming agent treats it identically to
    a zero-result query — log and proceed. Do not prompt the user to confirm
    continuation",
  And neither subsection prescribes a blocked status, a retry loop, or a
    confirmation gate,
  And the log message format uses the exact template shown (with <query-term>
    as the variable placeholder) so all consuming agents produce consistent
    log output.
