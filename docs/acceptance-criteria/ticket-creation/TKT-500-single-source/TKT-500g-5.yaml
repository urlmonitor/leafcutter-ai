superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: internal
notes: |
  PARTLY BUILT. The report no longer calls an authored demand unnecessary — that
  clause shipped with f3ac950c / PR #536 and has a covering test. The second and
  third clauses (say whether the demand ARRIVED, and report a lost demand as not
  ready) are specified here for the first time and are NOT built. This is the
  only AC in the store that governs the readiness-reporting surface at all; a
  search of the whole store found no other.

  WHY A REPORT THAT LIES IS WORSE THAN NO REPORT. The loss was survivable for
  weeks because the readiness check actively certified it: every one of the 85
  records was reported as passing, with the loss itself given as the reason. A
  silent report would have prompted somebody to look.

  NOT IN SCOPE, AND WORTH SAYING. Forty-three records were already marked done
  after being built through the defective path; 42 carry a covering proof by some
  other route and FIN-100c-7 does not. Retro-sweeping those is remediation, not
  this criterion — but the third Then clause is the surface that would surface
  them, so a sweep should be built on this rather than beside it.
