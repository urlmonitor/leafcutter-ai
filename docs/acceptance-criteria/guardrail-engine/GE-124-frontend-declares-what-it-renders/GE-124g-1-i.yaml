notes: |
  The PO's instruction: "NO OPT-OUT, DELIBERATELY ... Say so explicitly at L2
  rather than leaving it to be inferred from silence." Each of GE-124g-1 through
  GE-124g-4 says it in its own criteria; this L3 is the one place it is tested
  as a property of the configuration surfaces themselves, across all four.

  It is filed under GE-124g-1 because a parent had to be chosen and the store is
  the first place the substitution would be attempted. Its scope is all four —
  do not narrow it to the store when implementing.

  A REFUSED KEY, NOT AN ABSENT FEATURE. Absence is indistinguishable from
  "nobody has asked yet", and the first person to ask will add it. A refusal
  that names the key turns the attempt into a conversation.

  The third scenario is the boundary with GE-124d that the PO drew explicitly:
  those escapes apply to whether a FILE MUST DECLARE, never to what a
  declaration is worth.

  IT-PO NOTE (2026-08-25). Sequencing: this is the only AC in the tree that
  cannot be finished before its four siblings, because it asserts a property of
  their configuration surfaces. Build it last within GE-124g, or accept a
  partially red test contract in the interim and record which parts.
