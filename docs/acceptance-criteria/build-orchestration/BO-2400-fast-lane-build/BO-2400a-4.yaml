criteria: |
  Given the coder agent has finished making changes for the batch,
  When the fast-lane loop verifies completion,
  Then a deterministic script runs the batch's tests and confirms all of them pass
    (the batch test run exits zero)
  And the same script confirms every AC id in the batch has at least one test tagged
    "# covers:<id>"
  And commit staging is performed only after both the green check and the coverage
    check pass.
