id: GE-129a-2-i
title: "A commit whose caller identity cannot be established is refused, including when the guard itself fails"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and `git commit -m "chore: unidentified"`
    reaching the guard in each of these conditions:
    (a) agent_id present and agent_type absent,
    (b) agent_id present and agent_type an empty string,
    (c) the tool-call input the guard receives cannot be read as the harness's input structure,
    (d) the guard fails internally while deciding,
  When the guard decides,
  Then in each of (a)-(d) the commit is refused and no commit is added to the history,
    And the refusal states that the caller's identity could not be established and names which of
    the four conditions occurred,
    And in none of them does the commit go ahead because the guard could not decide.
