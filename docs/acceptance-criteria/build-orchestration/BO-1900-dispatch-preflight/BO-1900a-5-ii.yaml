title: "A run that proceeds without a required capability names it rather than staying silent"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run has been allowed to continue after its fit-to-dispatch comparison found one
    capability required by a craft's own instructions to be out of that craft's reach,
  When the run reports its outcome,
  Then the outcome names the capability that was out of reach and the craft that required
    it,
    And the outcome of a run in which every required capability was within reach carries
      no such entry,
    And a reader of the outcome can tell those two runs apart without inspecting how the
      run was configured,
  So the presence of an entry and the absence of one carry different meanings.
