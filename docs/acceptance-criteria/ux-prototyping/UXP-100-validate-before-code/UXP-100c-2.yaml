id: UXP-100c-2
title: "Pipeline blocks until the user provides an explicit prototype decision"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a prototype has been presented to the user for review,
  When no decision has been recorded yet (no "Approve", "Reject", or
    "Request changes" response exists),
  Then the pipeline does not proceed to the implementation phase
  And the pipeline does not dispatch any coding agents for this feature
  And the feature's status remains "awaiting-ux-approval" until a decision arrives
