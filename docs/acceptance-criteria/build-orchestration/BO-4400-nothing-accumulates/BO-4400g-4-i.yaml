  that deletes the folder itself, or falls back to a forced removal after a refusal, leaves
  no folder in scenario 1 and fails. Verified by running the flows, never by searching their
  text (CLAUDE.md "Gate / Workflow ACs -- Verify Behaviorally, Not by Grep").
