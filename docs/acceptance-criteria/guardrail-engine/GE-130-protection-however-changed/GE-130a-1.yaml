notes: |
  USER DECISION Q1 (2026-09-17): block beforehand only when certain. The four clear-write forms are
  the minimum population, not a closed list; the before-check's certainty boundary is the IT PO's
  to set, but anything outside it must reach GE-130c-1 rather than pass unexamined.

  Concrete command inputs for the test author (examples, not an exhaustive grammar):
    echo x > <file>;  sed -i 's/a/b/' <file>;  cp other.py <file>;  mv other.py <file>;
    printf x | tee <file>.

  ORDER (Q5): depends on GE-130f-1 and GE-130f-3 -- this guard is widened only after its
  editing-path refusal is observed.

  declares_side_effect: false.
