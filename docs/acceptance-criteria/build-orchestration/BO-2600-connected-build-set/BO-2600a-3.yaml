readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given /build-ac processing a leaf AC in its single-ticket path (Step 2b),
  And the coordinator resolves the connected build set via the select_connected
    CLI with --exclude-structural-parent,
  When the resolved set is exactly [the target AC] (no un-built children, no
    un-met genuine prerequisites),
  Then the coordinator generates exactly one ticket via generate_ticket_from_ac.py
    and the output is byte-identical to the pre-change single-ticket behavior,
  And no epic folder is created,
  And the Step 3 confirmation prompt shown to the user is the existing single-ticket
    prompt ("Build this ticket now? (yes / review / skip)").
depends_on: [BO-2600a, BO-2600a-2]
