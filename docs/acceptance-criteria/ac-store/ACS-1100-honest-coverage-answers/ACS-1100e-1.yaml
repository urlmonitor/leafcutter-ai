notes: |
  CONSOLIDATION (2026-08-13, expert review). This AC replaces four separate reference-doc
  ACs — ACS-1100a-4, ACS-1100b-3, ACS-1100c-3 and ACS-1100d-3 — which all wrote sections
  of docs/reference/ac-schema.md. The build's file-touch parallelism gate would have
  serialised them into four sequential tickets editing one file, and they made up a third
  of the tree's leaves. One file, one agent, one ticket.

  ACS-1100d-4 (component diagram) is deliberately NOT folded in: different artifact,
  different target document, different agent.

  Satisfies documentation_triggers: [reference-doc] on ACS-1100e, and is the AC named in
  the documentation_rationale on ACS-1100a, ACS-1100b and ACS-1100c.

  The closed-but-extensible list of exclusion grounds is the mechanism that stops
  "excluded because the query did not reach it" being laundered into a legitimate ground.
  "Outside the requested scope" IS on the list, and is what lets a staged-scope pre-commit
  hook report honestly rather than halting on every commit.

  The last clause is the acceptance test that matters: the section is not done if a tool
  author still has to read the AC records to build a conforming answer.

  Intended agent is documentation-expert; assigned_agent is deliberately left null in this
  authoring pass per the run's constraints, for the IT PO to set at enrichment.

  ==========================================================================
  TWO NON-OPTIONAL ADDITIONS (2026-08-18, BA) — from ACS-1100e's PO note.
  ==========================================================================
  1. THE WORKED EXAMPLE IS AN ACCEPTANCE TEST, NOT A DECORATION. The section must quote
     the shipped test-covers edge note and map it field by field onto the vocabulary it
     defines. The falsifier is deliberate and is the whole point: if the vocabulary
     cannot express something the note says, the VOCABULARY is wrong and gains a field —
     the note is not rewritten to fit. A real, reviewed, self-describing answer exists
     and predates the contract; a vocabulary that cannot hold it would be theory.
  2. THE REGISTER GOES IN ONE PLACE. Five records currently each state a fragment of the
     inheritance relationship: ACS-1100's notes, ACS-1100e's notes, KM-200's notes,
     KM-ADM-100's notes and KM-ADM-005's doc_links. Every one of them is correct and none
     of them is complete, so a reader landing on any single one cannot tell inheritance
     from ownership from adjacency. That is the same defect this L0 governs, applied to
     the contract's own documentation. Inheritors: KM-200 (artifact census figures),
     KM-ADM-100 (map trust ratings; shipped the first instance). Adjacent, does not
     inherit: TQ-400 (proof over time, and TQ-400d owns the untagged-finished pile).

  WHY THIS AMENDS e-1 RATHER THAN ADDING A SIBLING OR AN L3. ACS-1100e has exactly one
  child by design, because everything it governs lands in ONE file and the file-touch
  parallelism gate would serialise any split into sequential tickets over the same
  document. A second doc AC would recreate precisely the problem this AC was consolidated
  to solve, and an L3 would imply an edge case where these are core content.

  KNOCK-ON FROM THE OTHER AMENDMENTS IN THIS PASS. The method-record clause now also
  lists measurement provenance and join normalisation and states that staleness never
  halts (ACS-1100b-1, ACS-1100a-2), and the consuming-tool clause now names human-read
  hops (ACS-1100d-1). These are not new scope — they are the section documenting the
  contract as it now reads. If any of those amendments is reverted, drop the matching
  phrase here too.
