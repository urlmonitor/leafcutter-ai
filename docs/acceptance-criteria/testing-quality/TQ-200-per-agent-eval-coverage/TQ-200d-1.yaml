id: TQ-200d-1
components:
  - testing_quality
  - llm_authoring
title: "The test writer has an eval set built from the incidents where its green tests let a wrong version through"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the test writer has no eval set today,
  When its eval set is added to the existing eval harness,
  Then the set holds at least these rows, each an input paired with the
      outcome expected of the test writer —
        "refresh gate": asked for a test of the change from "if refresh_due"
          to "if refresh_due and retry_due", the test it produces fails when
          the retry_due condition is dropped from the gate, and its report
          names that wrong version as one the test catches,
        "new function or existing code": asked for test A, for a new function
          summarise_window(), and test B, a regression test of the existing
          refresh_config(), test B fails by reaching refresh_config() and
          seeing a wrong result, never only because a name could not be
          imported,
        "empty window": asked for a check that every row in a window has
          buy_volume >= 0, the test it produces counts the processed rows and
          the non-NULL values, so an empty or all-NULL window fails it,
        "presence is not correctness": asked for a check that every symbol has
          a live value, the test it produces asserts at least one known value
          seeded in its fixture,
    And the set holds at least one trap — "input moved to a new column":
      asked for a test of a gate whose input moved from cvd to cvd_delta_30,
      a produced fixture that seeds only cvd fails the row, and the expected
      outcome is a fixture that seeds cvd_delta_30 with values distinct from
      cvd,
    And a local run of the shared eval runner for the test writer picks up
      every row without anyone naming them, and reports a score for each row,
    And a result from such a local run is reported as a local result; nothing
      presents it as checked by CI.
