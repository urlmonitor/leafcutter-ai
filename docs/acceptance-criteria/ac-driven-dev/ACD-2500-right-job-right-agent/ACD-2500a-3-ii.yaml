notes: |
  ORIGIN (2026-09-28, user decision on open question Q5 of the declared-files run,
  follow-up C3). Q5: for a record that HAS a declared list, what happens to a documentation
  link tagged as modifying a file that is not on the list? Decision: one "needs a decision"
  finding per such file in the requirement rule check; never raised for "no declared
  files" records; the file is never added to the list automatically.

  WHY A DECISION, NOT A REPAIR. The disagreement has two correct resolutions -- declare the
  file, or re-tag / drop the link -- and the store holds nothing that picks one. ACD-2500a-2's
  rule applies: a repair is applied only when fully determined by data in the store;
  otherwise "needs a decision", never guessed. Auto-adding would re-create the doc_links ->
  files derivation ACD-1600c-4 retires.

  "ADVISORY" (user's word) is read as: a finding for a human, not a commit-time refusal and
  not an automatic change. It is NOT read as "does not affect the check's verdict" -- under
  ACD-2500a-1 / ACD-2500a-2 any finding makes the rule check's verdict failed for the
  authoring stage, and this AC does not carve out an exception. Flagged to the user.

  PLACEMENT. ACD-2500a is at its 5-L2 cap; this is an L3 under ACD-2500a-3 because both read
  the record's declared files through the one seam and report per-file findings in the same
  rule-check report. It is a separate rule (declared files versus 'modifies' links), not a
  variant of the specialist-versus-surface verdict.

  WHY S IS "NOT EVALUATED" RATHER THAN SILENT. ACD-1600c-4-ii makes "not evaluated: no
  declared files" the store's vocabulary for every check that needs declared files, and
  forbids counting such a record as passed. For S every 'modifies' link IS the derived file
  list, so there is nothing to compare against.
