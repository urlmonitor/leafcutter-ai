id: KM-400d-5
title: "Evidence identity survives repeated retrieval without hiding freshness"
component: knowledge-management
components: [knowledge_management]
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-400d
criteria: |
  Given two retrieval runs request the same entity revision and excerpt
  When their results are compared
  Then the evidence reference is stable while retrieval-run IDs differ
  And requested and executed operation, mode, source SHA and generation are recorded
  When exact revision B is requested but only A is published
  Then stale status identifies the available revision
  And A's evidence is used only when older evidence was explicitly permitted
