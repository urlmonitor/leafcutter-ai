notes: |
  THE RESIDUAL, NOT THE LEAK. The leak is largely CLOSED for work that flows
  through the ticket pipeline — see the L0 notes and the ac-fulfillment-gate
  doc_link above for the verification, dated 2026-09-01 on this branch. Do NOT
  author an L2 premised on widening the tag search or on un-skipping L3; both
  landed on 2026-08-26. An AC that re-fixes a shipped fix goes green against work
  it did not do, which is the phantom-done shape this whole neighbourhood exists to
  prevent.

  WHAT IS ACTUALLY LEFT: the fulfillment gate is a ticket-phase agent conditional
  on `ac_traceability` frontmatter. Records created or satisfied outside that path
  — the fast lane, direct commits — never reach it, so no link is written for them
  no matter how good the gate's search has become.

  FIRST L2 SHOULD BE ENUMERATION, NOT IMPLEMENTATION. The delivery paths that
  bypass the gate need to be listed before any of them is wired, and the list needs
  to be derived from the repository rather than from this note. One unenumerated
  path is a permanent slow refill that the next measurement will read as the repair
  having failed.

  RECOGNITION, NOT A SECOND GATE. Prefer routing the bypassing paths to the
  existing link-writing behaviour over building a parallel writer. Two writers of
  the same field drift, and the drift is invisible precisely because both of them
  write something plausible.

  THIS L1 IS BOUND BY THE SAME REFUSAL AS THE REST OF THE TREE: it records the
  link. It does not write work_status. See ACS-1300c and the L0 scope boundary.

  DOCUMENTATION: `[sequence-diagram]`. The subject is where in a multi-actor
  delivery flow the link gets written and which paths currently miss that point —
  a question only an interaction diagram answers legibly. No how-to: this is
  behaviour that happens on its own, not a command anyone invokes.
