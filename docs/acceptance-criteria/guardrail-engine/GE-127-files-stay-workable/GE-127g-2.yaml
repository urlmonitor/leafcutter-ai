notes: |
  WHY THE MOVING FIGURES ARE THE LOAD-BEARING CLAUSES AND A STATED FIGURE ALONE IS NOT.
  A run that prints "3 judged, 2 set aside" is satisfiable by two literals. The second and
  third arms hold one population fixed and move the other, in opposite directions, so the
  only implementation that satisfies both is one that counts each population as it goes.
  This construction is reused from BP-1600a-2 and from GE-120f-3 rather than reinvented,
  and the reason it is needed twice is that a single varying arm is satisfiable by deriving
  one figure from the other.

  WHY THE TWO COUNTS MUST BE SEPARATE AND NOT ONE TOTAL. If set-aside documents are folded
  into a single "documents checked" figure, the figure grows when the exclusion widens,
  which is the opposite of the signal it should give. The specific risk this record exists
  for is an exclusion pattern that matches more than intended; under a single total, that
  widening makes the gate look like it is doing MORE work while it is doing less. GE-127g-3
  is the record that catches an over-wide pattern by its verdict; this record is what makes
  the widening visible in the output before anything is caught.

  WHY THE FOURTH ARM IS STATED SEPARATELY. "0 judged" and "no document exceeded its
  permitted length" are the same sentence to a reader and opposite facts. This repository
  has shipped that confusion three times — the store validator exiting zero having checked
  zero files, a merge audit comparing against a stale reference, and a guard tool reporting
  FAILED with nothing inspected — and twice the documented defence was itself the no-op. The
  arm is not a restatement of the first arm's count clause: the first arm has a judged
  population to count, the fourth has none, and an implementation that reports the count only
  when it is non-zero satisfies the first and fails the fourth.

  THE REASON REPORTED MUST COME FROM THE DECLARATION. If the gate carries its own copy of
  each reason, the declaration and the output drift, which is precisely the failure GE-118c
  records: a configuration file asserting in its own comment that it is the single source of
  truth while nothing read it. Stated here rather than in the criteria as a clause, because
  the criteria require the reported reason to be the declared one and the mechanism is the IT
  PO's.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE SILENT SKIP. MUTATION: set aside the declared documents without reporting them.
      MUST GO RED: all four arms.
      MUST STAY GREEN: every arm of GE-127g-1, GE-127g-1-i and GE-127g-3, none of which
      inspects the output. That is the evidence this record's subject is held nowhere else
      in the subtree.

  (2) THE LITERAL. MUTATION: report the two figures as the numbers observed at
      implementation time.
      MUST GO RED: the second, third and fourth arms.
      MUST STAY GREEN: the first arm, which two literals satisfy exactly. This is why the
      first arm is never sufficient on its own.

  (3) THE SINGLE TOTAL. MUTATION: report one combined figure for documents handled.
      MUST GO RED: the second and third arms, which require the two figures to move
      independently, and the fourth.
      MUST STAY GREEN: the first arm if the total happens to be stated. Recorded because a
      single total is the most natural shape to reach for and the one that inverts the
      signal.

  (4) THE COMPLIANT MISREPORT. MUTATION: count set-aside documents among those found within
      their permitted length.
      MUST GO RED: the first arm's final clause and the fourth arm.
      MUST STAY GREEN: the second and third arms, whose figures a misreport of this shape
      can still state correctly.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's, as is where in the run's
  output the two figures appear.
