criteria: |
  Given a reader who wants to understand when the post-change reconciliation runs
    relative to the ticket lifecycle
  When they view the sequence diagram for this flow
  Then the diagram shows the ordered interaction: the ticket's work completes and its
    gates pass, the pre-done reconciliation computes the actually-changed source files
    and compares them against declared files_touched UNION out_of_scope, and the
    verdict either advises (default) or blocks (strict) before the ticket is marked done
  And the diagram makes visible that this check is POST-change and pre-done, distinct
    from the BP-1100a pre-dispatch scope check
