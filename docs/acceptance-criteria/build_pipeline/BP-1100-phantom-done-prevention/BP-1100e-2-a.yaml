estimated_complexity: S
it_requirements:
  - "_load_config must isinstance-guard before any .get(): a non-dict top level or a non-dict files_touched_reconciliation section returns (False, False); enabled/strict are set only when the value is True (identity check, not truthiness). The caught exception tuple is broadened to (OSError, ValueError, TypeError, AttributeError) with a WARNING log. A wrong-shape config must never crash the hook."
  - "All four subprocess-calling helpers (_get_staged_files, _get_repo_root, _get_branch_diff_files, _is_case_insensitive_fs) must catch (OSError, subprocess.SubprocessError) — not subprocess.SubprocessError alone — so a missing git binary (FileNotFoundError, a subclass of OSError) fails open. Each except block logs a WARNING before returning its safe default (Rule 3)."
  - "This AC makes concrete two failure classes of BP-1100e-2's general 'when the reconciliation itself cannot run, it fails open' clause; it does not change the enabled/strict config contract."
  - "PORTABLE SURFACE: lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py); ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
