declares_side_effect: false
estimated_complexity: M
it_requirements:
- Treat remote timeout as unknown outcome, not proof no side effect occurred; reconcile by run/branch/publication
  identity before another create.
- A changed head cannot consume the old approval; any fresh validation/review still respects persisted
  limits and off state.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300g-4 (data handoff, not an additional build-order prerequisite): PublishedProposal
  {run_id:string, feature_id:string, publication_id:string, remote:string, branch:string, target_ref:string,
  head_sha:string, validated_sha:string, reviewed_sha:string, pr_id:string, pr_url:string, draft:true,
  outcome:delivered}.'
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
  workspace_claim:object, settings_revision:string, next_step:string, ac_evidence:object[], ac_budgets:object[],
  review_count:integer, in_flight_action:object|null, publication:object|null}.'
test_spec:
