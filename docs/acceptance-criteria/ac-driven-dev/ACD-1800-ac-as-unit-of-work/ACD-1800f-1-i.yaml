it_requirements:
  - "Routing derives from the kind list ALONE, by an exact mapping: smoke_surface -> user-surface-smoker, live_surface -> live-surface-tester. Requesting both crafts unconditionally is forbidden: an unrequested user-surface-smoker fires against a requirement with zero smoke proofs, and its 'if ALL stanzas PASS emit ok' aggregation then passes vacuously -- over-routing manufactures the exact false green ACD-1800f-3 exists to remove."
  - "EXEMPTION IS DATA-DRIVEN, NEVER BY NAME. A craft is requested because a kind is present in the declared set, not because an AC id, component or file path was special-cased. A new observation kind must inherit routing by adding an enum member and one mapping entry -- no per-agent branch."
  - "`_SIDE_EFFECT_MANDATORY` (scripts/ac_store/generate_ticket_from_ac.py, ~line 920) must contain exactly the crafts the declaration requested for that work item, so a `not_needed` override cannot silence a requested observation while a craft that was never requested stays overridable. Do not widen the frozenset to both crafts unconditionally."
  - "VERIFIED GAP THE BRIEFING DID NOT NAME -- live-surface-tester is absent from BOTH phase-order lists. `live-surface-tester` has ZERO occurrences in scripts/ac_store/generate_ticket_from_ac.py, so it appears in neither `_CANONICAL_PHASE_ORDER` (~line 165) nor `_FLOW_CHANGE_PHASE_ORDER` (~line 188), while user-surface-smoker is present in both at priority 11.5. It must be added to BOTH lists at its registered priority 11.8 (between user-surface-smoker and ac-validator, before commit) in the same change. A craft emitted as needed but missing from the phase order sorts after the commit phase and its work is lost -- the same failure shape as the build-feature llm-expert ordering defect."
  - "Do not bypass live-surface-tester's second gate: config/agent_registry.json (~line 2675) requires `live_surface_testing.enabled: true` in skills_config.json in addition to the routing condition, and scripts/config_loader.py validates that block. A declaration of the live_surface kind requests the craft; the config gate still decides whether it is emitted, and when it is suppressed the reason must be visible, not silent."
  - "RESOLVE THE REGISTRY LOOSE ENDS IN THE SAME CHANGE. config/agent_registry.json carries `conditional_field: live_surface_test` and `requires_ticket_section: true` on live-surface-tester (~2663-2696) and `conditional_field_legacy: user_facing_surface` on user-surface-smoker (~2631). All three name ticket-frontmatter/ticket-body inputs that will not exist after ACD-1800c. Repoint them at the AC declaration; leaving requires_ticket_section: true dispatches the craft against a section that no longer exists."
  - "config/agent_registry.json is canonical source and is validated by scripts/registry_validator.py during build.py; run ./build-self.sh after editing it, and never edit a deployed .claude/ copy (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "Craft-request mapping consumed by the generator's agents-map builder: observation_kinds(ac) -> requested crafts, where {smoke_surface} -> {user-surface-smoker}, {live_surface} -> {live-surface-tester}, {smoke_surface, live_surface} -> both, and the empty/absent set -> neither. Each requested craft is emitted as `needed` at its registered priority (11.5 / 11.8) and is protected from a not_needed override; each unrequested craft is absent."
expects_from:
  ac_id: ACD-1800f-1
  contract: "The `observable_effect` kind list and the `observation_kinds(ac) -> set[str]` accessor, as the single authored source of routing. This AC must not read `declares_side_effect`, `user_facing_surface` or `live_surface_test` from any record."
test_spec:
  - name: test_live_only_requirement_requests_the_live_craft_and_not_the_smoker
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Runs the real generator over an on-disk AC declaring observable_effect: [live_surface] and asserts the emitted agents map contains live-surface-tester as needed and contains no user-surface-smoker entry at all. Over-routing both crafts is the likely wrong implementation and this is the assertion that catches it."
  - name: test_smoke_only_requirement_requests_the_smoker_and_not_the_live_craft
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "The symmetric case over observable_effect: [smoke_surface]; asserted in the same suite so a request-nothing implementation cannot pass the test above."
  - name: test_requirement_declaring_both_kinds_requests_both_crafts
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "observable_effect: [smoke_surface, live_surface] yields both crafts as needed, each exactly once."
  - name: test_live_craft_is_present_in_both_phase_orders_at_its_registered_priority
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Generates a ticket for a live-only requirement on the canonical path and on the flow-change path, and asserts live-surface-tester appears in the rendered agents map ordered after user-surface-smoker and before commit in BOTH. Today the craft is absent from both order lists, so a routed craft would sort past commit."
  - name: test_no_second_slot_live_routing_reads_only_the_shared_declaration
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "An AC that declares live_surface routes correctly while carrying no live_surface_test / user_facing_surface / declares_side_effect key anywhere, and an attempt to author live_surface_test directly is still rejected by the store validator -- the same slot serves both kinds and no second one was added."
  - name: test_requested_craft_cannot_be_silenced_by_a_not_needed_override
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "An AC declaring live_surface with an explicit live-surface-tester: not_needed override still emits the craft as needed, while an unrequested craft stays absent -- the mandatory set tracks the declaration rather than being hard-coded to one agent."
test_rationale: "Both wrong implementations of this AC are invisible to a static check: requesting both crafts unconditionally satisfies 'the live craft is requested' while manufacturing the vacuous smoke pass, and emitting a craft that is missing from the phase order satisfies 'the craft is requested' while the craft never runs before commit. Only assembling the work for a real on-disk requirement of each kind and asserting WHICH crafts were emitted, and in what order, separates them. Asserting that config/agent_registry.json contains a live_surface_test conditional_field is the grep test the BA warned about -- it passes today against a field no producer can ever set."
