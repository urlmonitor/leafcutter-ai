id: TKT-500f-6-iii-b
readiness: approved
priority: high
title: "ticket-supervisor halts (not silently skips) when Test Requirements is absent but an implementation .py is in scope"
component: ticket-creation
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f-6-iii.yaml"
criteria: |
  Given a generated ticket whose files_touched list contains an implementation
    .py file (for example "scripts/ac_store/generate_ticket_from_ac.py"),
  And that ticket body contains no section headed "## Test Requirements",
  When the ticket-supervisor decides whether to run the test-writer phase,
  Then the ticket-supervisor does NOT skip the test-writer phase,
  And it halts with a structured error stating that an implementation file is in
    scope but the ticket carries no Test Requirements section,
  And the error names the implementation file and the ticket.

  Given a generated ticket whose files_touched list contains only docs,
    .yaml, .json, or tickets-path files and no implementation .py file,
  And that ticket body contains no section headed "## Test Requirements",
  When the ticket-supervisor decides whether to run the test-writer phase,
  Then the ticket-supervisor skips the test-writer phase,
  And it records that the skip was a legitimate docs-or-config-only skip.
depends_on: [TKT-500f-6-iii, TKT-500f-6-iii-a, TKT-500b-1]
