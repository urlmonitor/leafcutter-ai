notes: |
  Scope boundary — do NOT restate TQ-100b-4. That AC fixes the reader itself
  (COVERS_TAG_RE at scripts/ac_store/test_enforcement.py:57 captures `(\S+)`,
  which scrapes bare quotes, f-string placeholders and prose words). This AC owns
  a different guarantee: whatever the reader's remaining error rate, the sweep
  must never take "done" away on evidence it could not resolve.

  Measured at authoring time (2026-08-17) with the project's own scanner over
  unit_tests/: 2,328 tag records referencing 680 distinct ids; 90 resolve to no
  active AC, and 64 of those 90 are reader misfires rather than real dangling
  references. Observed misfire captures include "'", "<id>'", "{self.ac_id}",
  "{nonexistent_id}" and "UNKNOWN". A sweep that treated those 64 as evidence of
  a lapse would demote on noise.

  Why an abstention outcome and not silence: an untrustworthy-evidence record
  that were simply skipped would be indistinguishable from a record nobody
  evaluated, which is the exact invisibility TQ-400a exists to remove.

  IT-PO ENRICHMENT NOTE (2026-08-17) — UPSTREAM CONFIRMED, AND ONE NUMBER
  RECONCILED. depends_on and expects_from both already named TQ-100b-4 and both
  are correct; no change was needed and none was made. A re-measurement at HEAD
  339b0981c with the project's own scanner over unit_tests/ gives 2,328 tag
  records, 680 distinct ids, 80 resolving to no AC of which only 16 are AC-id-
  shaped — so 64 misfires, matching the BA's count, against a slightly different
  no-AC total (80 vs 90) depending on whether inactive records are counted. The 64
  is the load-bearing figure and both passes agree on it.

  THE THREE-WAY DISTINCTION IS THE IMPLEMENTATION RISK. Unshaped capture (noise —
  abstain), shaped-but-dangling id (real lapse — demote), and no capture at all
  (real lapse — demote) are three states, and the natural implementation collapses
  the first two. TQ-400e-2-i guards the third against the first; the seam test
  here guards the second against the first.
