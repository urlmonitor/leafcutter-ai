it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert."
  - "THE REPLY AND THE RESULT MUST BE TWO SEPARATE ARROWS, and the reply must be marked as carrying no part of the result's content. The arrangement this replaces had one arrow doing both jobs, and every diagram of it looked correct at any size — the failure only appears when the payload is large, which is exactly the case nobody draws."
  - "THE CARRIES-NO-CONTENT PROPERTY MUST BE DECLARED DATA, not a visual convention, so the coherence test can assert it against a real run's reply."
  - "THE HANDOVER LOCATION MUST BE SHOWN AS SUPPLIED BY THE CONSUMER'S SIDE, matching BO-3200d-2's decision. A diagram showing the producer choosing the location documents the arrangement that was rejected and will be re-implemented from it."
  - "THE CONSUMER'S VERDICT MUST BE DRAWN AS FORMED FROM WHAT IT OBTAINED AT THE HANDOVER, with no edge from the reply to the verdict — the same negative claim BO-3100b-5 makes about the exit-time judgement's inputs."
  - "The coherence check must run against a result of AT LEAST 149 KB. A diagram checked against a small-payload run cannot pass, because the small-payload case is the one that always looked correct."
  - "The diagram page must declare its participants and ordered interactions in a machine-readable form so the coherence test reads data, not a picture."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
