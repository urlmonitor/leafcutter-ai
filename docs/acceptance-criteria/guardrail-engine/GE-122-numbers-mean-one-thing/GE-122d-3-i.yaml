notes: |
  THIS IS THE PLACE WHERE TWO STANDING RULES OF THIS COMPONENT MEET, and it exists as its own
  record because leaving the meeting-point implicit is how one of them ends up swallowing the
  other.

  The component holds a deliberate, approved fail-open convention: a guard hitting an internal
  error should not hard-block an unrelated commit. A sibling goal holds that a check which cannot
  run must SAY so rather than report success. Neither is repealed here. Read together they give
  exactly the disposition above — announce always, block only when the subject was not inspected.

  THE RISK IF THIS L3 IS DROPPED runs in both directions and both are real. Drop it and lean
  fail-open, and an implementer applies "internal error, therefore proceed" to the unreadable-file
  case too, which reproduces the whole defect GE-122d-3 exists to prevent. Drop it and lean
  fail-closed, and any bug in a brand-new whole-collection guard blocks every commit in the
  repository until someone fixes the guard — which is how guards get deleted.

  THE DISTINCTION IS DECIDABLE IN PRACTICE, which is what makes it a fair thing to ask for: the
  pass knows whether it completed reading every namespace before the error occurred, because
  GE-122d-3 already requires it to track and report that count.

  IT PO NOTE (2026-08-17): the BA's last paragraph is also the implementation instruction, and it
  should be read as one. Because the pass knows the read counts, the disposition MUST be derived
  from them. Deriving it from the exception class instead is the tidy-looking implementation that
  passes every test written today and inverts the boundary the first time an unfamiliar exception
  crosses it.
