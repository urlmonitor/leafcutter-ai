    at: '2026-08-25'
    note: >-
      One phrase in the Then clause changed: "no finished status is written while
      the referral stands" -> "no finished status is recorded while the referral
      stands". The requirement is unchanged and nothing was widened or relaxed;
      "recorded" is what the clause always meant. The change was forced by
      check-ac-schema, whose derive_declares_side_effect() matched the substring
      "is written" and demanded declares_side_effect: true. The derivation is
      negation-blind and this clause asserts that nothing is written, so declaring
      true would have recorded the opposite of what the record says -- and that
      field routes the user-surface-smoker phase agent, so it would have dispatched
      a smoke test for effects this AC guarantees will not occur. An authored false
      is rejected as a disagreement with the derivation, leaving no honest value.
      Reworded rather than mis-declared; the defect is filed as KI-CG-014 and the
      reasoning is in this record's notes so the phrasing is not reverted.
