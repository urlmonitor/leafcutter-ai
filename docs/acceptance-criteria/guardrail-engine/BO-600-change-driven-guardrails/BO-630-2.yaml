id: BO-630-2
title: "High complexity tasks route to the deeper-reasoning model tier"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has estimated_complexity: H (high),
  When the guardrail engine determines the model tier for any agent working on this ticket,
  Then the agent is routed to the deeper-reasoning model tier (Opus-class)
  And this routing applies to every agent in the ticket's agent chain

  Given two tickets: one with estimated_complexity: M and one with estimated_complexity: H,
  When both are processed by the same agent type (e.g., python-coder),
  Then the M-complexity ticket's agent runs on Sonnet-class
  And the H-complexity ticket's agent runs on Opus-class
  And the difference in model tier is the ONLY routing distinction based on complexity

  Given a ticket has estimated_complexity: H and has passed the complexity challenge gate (BO-640),
  When the agent is dispatched,
  Then the dispatch metadata records: model_tier: opus, reason: "irreducible_complexity"
  And the complexity challenge outcome is preserved as audit trail
