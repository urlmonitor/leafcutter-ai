notes: |
  Portability is a first-class safety concern here: a git-root- or __file__-anchored
  path breaks in a deployed consumer install (where scripts live under the package
  subdir) and in worktrees (where the git dir is shared). Anchoring on
  project_root/output_root is the agreed design.
