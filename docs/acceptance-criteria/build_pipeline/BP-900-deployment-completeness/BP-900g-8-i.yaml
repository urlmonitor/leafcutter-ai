notes: |
  EDGE CASE PINNED: the closure that is right once and stops being right.

  THREE SHAPES, THREE DISTINCT FAILURES. The second hop is where a "check the
  siblings" implementation stops — and it is not hypothetical depth-for-its-own-sake,
  because the ac_store package is exactly the kind of module cluster where one helper
  imports another. The newly-added module is the temporal case and is the whole point
  of BP-900g-8's "derived, not hand-maintained" clause; without it, an implementer can
  satisfy g-8 by writing a complete list today and the defect returns on the next
  module. The external-module case is the false-positive control: a closure that
  demands the build ship the standard library is one that gets an allowlist, and an
  allowlist is a hand-maintained list wearing a different name.

  WHY THE THIRD CLAUSE MATTERS MORE THAN IT LOOKS. BP-900g-5 had to spend a clause
  narrowing BP-900g-4's prefix because it had mis-captured a host-project path
  (debugging/scripts/...) as a deploy key. The same boundary applies to a dependency
  closure. BP-900g-6 preserved that bound explicitly and its negative-control tests
  must stay green.

  TEST ANGLES for it-po. `boundary` (one hop / two hops / not-ours) and `deployed`
  (all three inspected in a real temporary target). The newly-added-module shape is
  the one that cannot be faked: it requires adding a module to the package tree inside
  the test and re-running the build, which is also the only construction that proves
  derivation rather than enumeration.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO ENRICHMENT NOTE (2026-08-17). Two additions to the BA's hand-off.

  FIRST, a fourth verdict. The BA's three clauses give three outcomes: ours-and-
  deployed, ours-and-missing, not-ours. Static analysis has a case none of them
  covers — a dynamic reference whose target is built from a runtime value and cannot
  be resolved statically. Folding it into "not ours" is the same fail-open this
  subtree is closing, relocated into the classifier, so UNRESOLVABLE is specified as
  a distinct verdict that reports for a human. This is stated in
  it_requirements.constraints and in the config_schema_fragment rather than in the
  criteria, because it is an implementation-environment constraint the BA could not
  see, not a new behaviour.

  SECOND, the newly-added-module entry is marked as the acceptance test for the whole
  derivation requirement, not merely one of three shapes. It is the only test in
  either this AC or BP-900g-8 that an implementation based on a complete
  hand-maintained list cannot pass. If schedule pressure forces a reduction, this is
  the entry that must survive.

  ON THE DIRECTION QUESTION. The BA's second doc_link raises BP-900g-5's fifth
  it_requirement as pushing the opposite way. That is ruled on in BP-900g-8's notes
  under IT-PO RULING — three sets, two edges, B ⊇ closure(A) checked and C ← B
  derived — and the ruling binds this AC too. Nothing was changed in BP-900g-5.
