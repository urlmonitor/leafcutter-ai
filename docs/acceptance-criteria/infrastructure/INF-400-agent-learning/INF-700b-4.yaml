title: "A sequence diagram shows the capture path end to end, including the branch taken when capture cannot complete"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: medium
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700b.yaml"
criteria: |
  Given the knowledge-capture path spans a phase agent finishing a piece of
    work, the shared sign-off capture step, the durable knowledge record it
    produces, and the failure record written when capture cannot complete,
  When a reader opens the architecture documentation for the agent knowledge
    system,
  Then a sequence diagram shows that path end to end, with one participant per
    actor and one message per hand-off between them,
  And the diagram shows the success path and the cannot-complete path as two
    distinct branches, so a reader can see where an incomplete capture leaves
    its trace,
  And the diagram marks the boundary at which the agent's obligation ends and
    the routing step's begins, without asserting when the routing step runs,
  And every participant, message and artefact the diagram names exists in the
    package under the name given,
  And the diagram names no retired step.
depends_on:
  - INF-700b
  - INF-700b-1
  - INF-700b-1-ii
