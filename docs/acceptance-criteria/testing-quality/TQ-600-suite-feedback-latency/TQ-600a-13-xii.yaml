it_requirements:
  - >-
    NAMES (proposed 2026-10-08, the owner may rename before build): marker `timing_ratio`
    ("asserts a wall-clock ratio; reports, never holds"); workflow
    `.github/workflows/post-merge-timing.yml`, name `Post-merge timing suite`; notice
    label `post-merge-timing`.
  - >-
    SELECTIONS — A PARTITION, AND IT LANDS ATOMICALLY WITH THE MARKER. Default run:
    addopts `-m "not manual and not timing_ratio"`. Correctness lane: `-m "manual and not
    timing_ratio"`. Timing lane: `-m timing_ratio`. These three are disjoint and cover
    every test by construction, but ONLY if the addopts change lands in the same commit
    that registers `timing_ratio` (a direct `markers =` entry in pytest.ini, never inside
    addopts — the measured inert-spelling trap); otherwise a `timing_ratio` test without
    `manual` sits in both the default run and the timing lane. TQ-600a-13-xix (now a
    dependency of this record) makes that change; this record inherits it and must not
    re-spell the selection. A command-line `-m` replaces the
    addopts `-m` (the mechanism PR #1050's opt-in already relies on). The marker is
    applied by an explicit `@pytest.mark.timing_ratio` on the test method or class;
    pytest honours marks on unittest.TestCase methods for `-m` selection, which the
    union descriptor proves on a unittest-style synthetic test rather than assuming. The
    three-way union is asserted by real `--collect-only` subprocesses, never derived.
  - >-
    A SEPARATE WORKFLOW, NOT A JOB IN THE CORRECTNESS WORKFLOW. If the timing lane were a
    job of `post-merge-suite.yml`, its failure would make that run's conclusion failure,
    and decision A reads that conclusion as the hold's verdict. A separate workflow lets
    the timing lane's own run go red — which TQ-600a-13-i requires of an invoked cadence —
    while the hold reads only `post-merge-suite.yml`. Same triggers and coalescing as
    TQ-600a-13-ii, its own concurrency group, the same fresh-machine retry; a timing-lane
    pass-on-retry is recorded and never escalated (noise is the expected cause here).
    TQ-600a-13-xix lands first (it is in depends_on), so the workflow file already exists
    in its minimal form (one job, no retry, no notice); this record extends it to the run / retry / verdict
    shape of TQ-600a-13-ii, reusing post_merge_suite.py with a `--lane timing` argument
    rather than a second module, and keeps its name, triggers and concurrency group.
  - >-
    THE TIMING NOTICE is written by the follow-up workflow's notice job
    (TQ-600a-13-iii's machinery, a second label), on the timing workflow's completion:
    opened on a red timing run, description rewritten each run, closed on a green one.
    LANE ENTRANTS: the notice job compares the timing verdict file's `collected_ids` with
    the previous settled timing run's (one artifact read) and, for each new id, names the
    newest commit in (previous head, current head] that touched that test's file, found
    by `git log` in the follow-up's full-history default-branch checkout; when none is
    determinable it says so in words. The timing workflow's runs are never read by the
    hold: every hold read is pinned to `post-merge-suite.yml` by file name.
  - >-
    MISASSIGNMENT DETECTION, BOTH DIRECTIONS. A correctness test wrongly marked timing
    (the dangerous direction: a corruption guard silently stops holding) is surfaced by
    naming lane entrants with their commit; the marker change itself arrives by pull
    request and is reviewed. A timing test wrongly left in the correctness lane surfaces
    as a red not reproduced at the same commit (TQ-600a-13-x's counter, TQ-600a-13-xiii's
    notice). OPTIONAL, not required: a timing-lane test observed to read no clock during
    its execution could be flagged as suspected misassignment; imperfect (logging reads
    clocks), so recorded as an idea only.
  - >-
    TQ-600a-13-i's "FAILS THE BUILD" — OWNER DECISION 2026-10-08: it means BLOCKS MERGES.
    Applied as follows in this family: a CORRECTNESS-lane failure blocks merges (through
    the required `Post-merge suite status` hold, TQ-600a-13-vi/-x); a TIMING-lane failure
    turns its own workflow run red and is named on the `post-merge-timing` notice, and
    never blocks a merge (decision C, which the owner has not withdrawn). RESOLVED: the
    BA amended TQ-600a-13-i's criteria on 2026-10-08 to state the timing lane as the one
    explicit carve-out (own run red, named on `post-merge-timing`, `Post-merge suite
    status` unchanged), so this record and TQ-600a-13-i now agree. The carve-out is
    proven by TQ-600a-13-i's test_tq600a_13_i_a_timing_lane_failure_leaves_the_hold_unchanged
    together with this record's never-holds descriptor.
  - >-
    THE TESTS COST UNDER 1.2 s. In-process lane classification with a fake runner; the
    union descriptor uses four real `--collect-only` subprocesses of a synthetic project
    with plugin autoload off (about 0.2 s each).
