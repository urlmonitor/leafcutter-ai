    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Surface is the shared helper (scripts/pr_merge_gate.py): a failure (conclusion == failure) on any required check is a terminal RED verdict — the wait loop must exit immediately on RED rather than continuing to poll, and must NOT call `gh pr merge`."
  - "RED is terminal: do not treat a failed check as pending; do not wait for it to flip green. The recorded reason must name the failing required check (hand-off to BO-1300c-1 for operator-facing blocker text)."
  - "Verdict must be a structured value (e.g. status: RED, failing_checks: list[str]) so BO-1300c-1 can name the check — not free text."
delivers_to:
  agent: llm-expert
  contract: "RED verdict naming the failing required check(s), consumed by BO-1300c-1 to compose the operator blocker"
expects_from:
  ac_id: BO-1300b-1
  contract: "The structured required-check set including per-check failure states"
