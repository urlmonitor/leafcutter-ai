notes: |
  Flow node: criteria-library publish. Publish follows the decision records' publish by analogy (validate the whole store and the staged record, write it, regenerate the index; the person commits and the change is reviewed).
  OPEN, asked of the user: (1) the published folder: the mock assumes docs/criteria/<id>.yaml, the name the decision's question used, but dec-93c1c730463c1f3c did not fix it; (2) the publish command's name (a new command, or the decision publish extended to category records); (3) whether a new config/paths.json surface or pre-commit hook is needed. The decision's criterion crit.no_new_package_surface prefers none; if one is added, the IT PO must set package_surface: true on the AC that adds it.
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: publish.
