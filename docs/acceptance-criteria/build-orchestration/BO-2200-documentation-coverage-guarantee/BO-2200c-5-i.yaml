notes: |
  Authored 2026-08-31 from the user's decision on the documentation-ownership split, after the
  EPIC-StartingNewWorkTheProperWayAlways drive hard-blocked: 25 tickets, 25 documentation
  demands, 1 ticket that actually owned the document it was told to produce. 22 of the other 24
  were pointed at the same page by a `relationship: describes` link.

  DELIBERATE DIVERGENCE from the framing this AC was authored against. The framing proposed
  reusing the existing edit-surface relationship set -- {constrains, creates, implements,
  modifies, specifies} -- as the documentation-ownership predicate, so that "ownership means one
  thing in both fields". Measured against the real store, that predicate re-creates the very
  collision it is meant to fix, at seven times the scale: ~170 AC records link
  `docs/reference/ac-schema.md` with `relationship: specifies`, and dozens link
  `docs/architecture/adrs/ADR-034-knowledge-write-ownership.md` with `relationship: constrains`.
  Under the wider set, all ~170 would each be told to write `ac-schema.md`.

  The vocabulary is genuinely ambiguous: `specifies` and `constrains` are used across the store
  to mean "this document governs my work" (an input), while `creates` and `modifies` are the only
  two that unambiguously mean "this record produces or changes this document" (an output). Only
  the latter pair can carry a write demand.

  Coherence between the two fields is preserved in the direction that matters, and stated as the
  final clause: documentation ownership is a strict subset of edit-surface membership. Nothing is
  demanded as a doc target that is not also declared in files_touched. Narrowing the edit-surface
  set itself to match was rejected as a separate, riskier change -- files_touched drives the
  phantom-done surface, and silently shrinking it store-wide belongs to the TKT-500f ACs that own
  that field, not here.

  Store baseline at authoring time: only 18 of 3,694 AC records carry `relationship: creates` at
  all. Under this rule the documentation demand becomes rare by default, which is why the
  ownership-gap check (see the handoff) is a prerequisite and not a nicety.
