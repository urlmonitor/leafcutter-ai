notes: |
  Pins the "infer vs prompt" boundary the PO flagged: the autofix may auto-insert
  only on a CONFIDENT single match (directory_patterns single-match for component; a
  single contextual AC). Ambiguous match, no match, or no confident AC context =>
  PROMPT, never guess and never fabricate. This keeps the autofix from silently
  inserting a wrong declaration (which would defeat the whole point of the guardrail).
