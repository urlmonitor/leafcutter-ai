estimated_complexity: S
it_requirements:
  - "Pre-commit hook must complete in under 2 seconds for a single ticket file"
  - "Hook must not fail when docs/acceptance-criteria/ does not exist (graceful exemption)"
  - "Hook must only inspect staged files, never the full working tree"
  - "Hook error message must name the specific ticket file and component missing source_acs"
