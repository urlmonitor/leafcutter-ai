title: "Changing one coverage-tag reader without the other is blocked, not merely noted"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given the two coverage-tag readers agree over the committed unit-test tree and
    the parity check passes,
  When one reader's recognition behaviour is changed and the other is left
    unchanged — for example the done-proof reader is taught to accept a tag
    spelling, or to reject an id shape, that the commit-time check still treats
    the old way — and the parity check is run again,
  Then the parity check fails and blocks, naming the capture whose verdict
    differs and which of the two readers changed its answer
  And the blocking run and the earlier passing run go through the same entry
    point over the same tree, so the difference in outcome is attributable to the
    readers' behaviour and not to a different check being invoked
  And restoring the mirrored change to the second reader makes the same entry
    point pass again.
depends_on:
  - TQ-100b-5
