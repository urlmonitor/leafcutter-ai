notes: |
  THE CONTENTION RULE AT REQUIREMENT GRAIN. This is the leaf that carries
  ACD-2000b's fifth hazard, described there as "the single most likely defect in
  this L1".

  WHAT EXISTS TODAY (verified, do not re-investigate), all at TICKET grain in
  templates/skills/building-epics/SKILL.md:
    - `physical_edges = { (a, b) | a.files_touched INTERSECT b.files_touched !=
      EMPTY }` (~line 137);
    - a batch is a maximal antichain such that "for all a, b in batch:
      a.files_touched INTERSECT b.files_touched = EMPTY" (~line 145);
    - step 3a (~lines 150-153) re-verifies disjointness before dispatch and
      serialises anything that overlaps; §2 restates the two conditions (~229);
    - ~line 232: "If a ticket's `files_touched` is missing or empty,
      /build-feature MUST treat that ticket as conflicting with EVERY other
      ticket and run it serially (default-conservative)."
  ACs have no equivalent: a requirement carries `depends_on` (logical ordering)
  and nothing expressing physical contention. The INGREDIENT already exists
  AC-side -- `_build_files_touched()` in
  scripts/ac_store/generate_ticket_from_ac.py (~line 497) -- so what is missing
  is the RULE, not the data.

  THE EMPTY-FOOTPRINT CLAUSE IS THE DEFECT MAGNET, and here is why it is worse
  AC-side than ticket-side. `_build_files_touched()` derives paths from
  it_requirements and from doc_links whose relationship is an edit-surface one.
  Docs-only requirements, prose requirements, and -- critically -- every
  requirement not yet enriched by the IT PO derive an EMPTY footprint. Treating
  empty as "collides with nothing" therefore makes precisely the requirements
  with the least analysable footprint the ones that run most freely in parallel.
  SKILL.md ~232 already got this right at ticket grain; the generalisation must
  preserve it, and a naive set-intersection implementation silently inverts it
  (the empty set intersects nothing, so empty reads as safe).

  THE MIGRATION MAKES THIS URGENT, NOT OPTIONAL. Under ACD-1800c a ticket's scope
  becomes the UNION of its members' footprints, so ticket-grain batching gets
  strictly COARSER after the cutover: two bundles sharing one file serialise
  entirely even when the requirements actually in flight are disjoint. Without
  this leaf the migration makes parallelism worse rather than better -- that is
  ACD-2000b's load-bearing argument.

  THE FOURTH THEN CLAUSE IS WHERE THIS AC MEETS THE CLAIM. A single planner
  computing a disjoint batch is not enough once two drives run at once (the fast
  lane claims, the supervisor does not look). Independent choosers can only avoid
  overlap by consulting shared state -- the claim from ACD-2000b-1/-2. So
  contention avoidance is not a separate mechanism; it is the claim plus a
  footprint test, and this clause forbids satisfying the AC with a
  single-scheduler-only solution.

  TESTABILITY. Build a real four-requirement store and assert which pairs the
  real selection code offers together -- then run two real concurrent choosers
  and assert no overlapping pair is ever taken. Asserting that an intersection
  helper exists proves nothing about the empty case, which is the clause most
  likely to be wrong.

  2026-08-17 (IT PO enrichment). THE UN-ENRICHED RECORD IS THE COMMON CASE, NOT
  AN EDGE CASE, and it now has its own test. `_build_files_touched` reads only
  it_requirements path tokens and edit-surface doc_links; `describes` and
  `related` links are excluded by design. Every requirement the IT PO has not yet
  touched therefore derives an empty footprint -- so "empty" is the DEFAULT state
  of a store, not a rarity. A rule that reads empty as safe parallelises the
  majority of the backlog unguarded.

  TAKE-TIME, NOT PLAN-TIME, is the constraint that makes the fourth clause
  reachable. The ticket-grain rule already re-verifies before dispatch
  (SKILL.md ~150-153); the requirement-grain rule inherits that obligation, and
  additionally must compare against requirements CLAIMED BY OTHER EFFORTS rather
  than only against its own batch. This is the point where this AC stops being a
  set-intersection utility and becomes part of the claim mechanism.

  THE PROSE HALF IS DELIBERATELY OUT OF SCOPE. Generalising the rule does not
  license editing `templates/skills/building-epics/SKILL.md` in this change: that
  runbook stays authoritative for tickets until ACD-1800c, and it is a different
  craft's surface. Recorded so an implementer does not "finish the job" by
  rewriting the ticket-grain rule and leaving the two definitions in conflict
  mid-migration.
