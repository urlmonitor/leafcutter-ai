notes: |
  USER DECISION 2026-09-27 (answering the BA's Q2): every fast-lane command step is run by a
  new dedicated command-step-runner agent that declares permits_shell true. Its whole role is to run
  the given command in the named worktree and return its JSON. The user also confirmed that an
  agent whose registry entry is silent on permits_shell is NOT permitted (Q1).

  PLACEMENT. The natural parent, BO-2400f-5, is being reset by the orchestrator and was not to
  be touched, and BO-2400f (13/13) and BO-2400 (7/7) are full. BO-2400a-1 is the L2 that owns
  which agents the fast lane runs and how many; the command-step-runner is an addition to that roster,
  and the last clause keeps BO-2400a-1's two-invocation count true. BO-2400a-1 is also assigned
  to llm-expert, which matches this record's surface.

  ONE AGENT PER RECORD. This record is the agent itself (template, registry entry, deploy):
  llm-expert. Routing the lane's dispatches to it is BO-2400f-5-i (python-coder). The structural
  check (BO-2400f-5-ii) reads the registry and must not name this agent.

  THE ID. USER DECISION 2026-09-27 (round 3): the agent is "command-step-runner", replacing
  "fast-lane-step-runner". The name is deliberately not lane-specific so that the ~40 similar
  status-checker shell dispatches in five other workflows (KI-BO-20260927) can reuse it later.
  This AC set still moves only the fast lane; those workflows need their own ACs.

  STEP KINDS. USER DECISION 2026-09-27 (round 3): an optional machine-readable registry field
  declares which kinds of step an agent may run — reads_store, changes_store,
  changes_repository, publishes — added to config/agent_registry.schema.json within this
  record's scope. The criteria call it "the step-kinds field"; the IT PO settles the exact
  key.

  SPLIT 2026-09-27 (round 4, requested by the IT PO): the schema definition of step_kinds and
  the registry-gate rejection of unknown kinds moved to BO-2400a-1-iii (python-coder), because
  nothing validates the registry against its schema today and the gate is .py work. This
  record keeps the template, the registry entry and the agent-index row (llm-expert). BO-2400f-5-ii's role-coverage clause reads it: a missing field covers nothing.

  THE NON-ZERO-EXIT CLAUSE IS THE ONE MOST LIKELY TO BE LOST. An agent that reports a failed
  command as "I could not complete this step" turns every real failure into a decline, and the
  run then reports it as a declined step (BO-2400f-5-iii) instead of the step's own failure. A
  reply that carries an exit status is a result; a reply without one is a decline.
