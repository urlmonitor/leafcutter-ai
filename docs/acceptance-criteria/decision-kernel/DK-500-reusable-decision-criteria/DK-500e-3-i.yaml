criteria: |
  Given the library holds only the candidate cat-73d233fc8b15c735, the staged cat-6c3eb4f2af148922 and the retired cat-40cc613f737e3323, all for decision type design,
  When a design decision is framed,
  Then nothing is reused, no gap judgement is made, and the decision is framed as with an empty library,
  And the same holds when published categories exist but none fits the decision's type or components.
