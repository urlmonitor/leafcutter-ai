criteria: |
  Given an acceptance-criterion file whose components field is ["not-a-real-component"],
    a name that does not appear in the project's component registry
  When the file is validated at commit time
  Then the file is rejected and its commit is blocked
  And the rejection message names the file and the unrecognized component value
  And an otherwise identical file whose components field is ["knowledge-management"],
    a name present in the registry, passes validation
