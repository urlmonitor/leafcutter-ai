title: "Re-homing a requirement rewrites no cross-references anywhere in the store"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement with stable UID 42 that is referenced by other
    requirements through a dependency link, a coverage link, a delivers-to
    contract, an expects-from contract, and a supersedes link,
  When UID 42 is re-homed under a new parent,
  Then none of those referencing links are modified,
  And every one of those links still resolves to UID 42 after the move,
  And no store-wide find-and-replace across dependency, coverage, contract, or
    supersedes fields is performed as part of the move.
