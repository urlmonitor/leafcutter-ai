id: TQ-200d-4-ii
components:
  - testing_quality
  - llm_authoring
title: "The test runner runs a named test file through the project's configured test command, never as a plain script"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project whose testing_context.test_command is "pytest",
    And a file tests/check_window_total.py that defines
      test_window_total_adds_the_values and never calls it,
    And the request "Run tests/check_window_total.py and report.",
  When the test runner runs the file,
  Then the command it runs is the configured test command with the file as
      its argument, "pytest tests/check_window_total.py" (options may be
      added),
    And in a project with no testing_context.test_command it runs
      "python -m pytest tests/check_window_total.py",
    And it never runs a test file as a plain script, such as
      "python tests/check_window_total.py" or
      "PYTHONPATH=. python tests/check_window_total.py",
    And the test runner's instructions list testing_context.test_command among
      the settings it reads, and offer no plain-script form for running one
      file.
depends_on:
