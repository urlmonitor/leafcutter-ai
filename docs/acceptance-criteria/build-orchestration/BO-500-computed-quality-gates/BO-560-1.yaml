id: BO-560-1
title: "Full agent chain is derived from change_type and the work agent's produces trait"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has:
    - change_type: flow_change
    - assigned work agent: python-coder (produces: production_code)
  When ticket-supervisor computes the agent chain,
  Then it produces the complete ordered sequence without reading any
    manually-authored agents map:
    [architect-review, documentation-expert, test-writer, python-coder,
     test-runner, pr-reviewer, ac-fulfillment-gate, commit, pull-request]
  And each agent in the sequence has a status value (needed or not_needed)
  And the sequence respects the priority ordering defined in agent_registry.json

  Given a ticket has:
    - change_type: doc_change
    - assigned work agent: documentation-expert (produces: documentation)
  When ticket-supervisor computes the agent chain,
  Then it produces:
    [documentation-expert, pr-reviewer, commit, pull-request]
  And no TDD agents or architect-review agents are included

  Given a ticket has:
    - change_type: config_change
    - assigned work agent: python-coder (produces: production_code)
  When ticket-supervisor computes the agent chain,
  Then it produces:
    [test-writer, python-coder, test-runner, pr-reviewer,
     ac-fulfillment-gate, commit, pull-request]
  And architect-review and documentation-expert are NOT included
    (config_change does not require them)
