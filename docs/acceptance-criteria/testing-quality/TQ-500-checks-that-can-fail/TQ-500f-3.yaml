test_required: false
test_rationale: 'Prompt-only: the deliverable is the test writer''s instruction text. The
  falsifiable half (absence-only red is refused for a test that declares wrong versions to
  catch) is enforced mechanically by the red-baseline reader in TQ-500f-3-i, which classifies
  the kind of red from the run itself, and is wired into /build-feature by TQ-500f-3-ii. Neither
  trusts the writer''s label. The writer''s conduct (rewriting test B to reach refresh_config(),
  preferring a stronger assertion over a comment) cannot be unit-tested without a template-text
  search, which CLAUDE.md forbids. Substitutes: pr-reviewer against the Then clauses, plus
  a recommended test-writer eval row (test A new summarise_window / test B regression of existing
  refresh_config) once a test-writer eval set exists (follow-up AC).'
