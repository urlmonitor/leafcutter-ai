assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Must discover PROJECT_CONTEXT.md files in all legacy locations (.claude/, per-agent directories, project root)"
  - "Must preserve PROJECT_CONTEXT.md content verbatim during transfer (no reformatting or content changes)"
  - "Must produce a structured migration summary (JSON or YAML) listing: source_path, destination_path, artifact_type for each migrated item"
  - "Must handle errors gracefully per the project error handling policy if source files are unreadable"
  - "Must be atomic with respect to the overall migration — if context transfer fails, the entire migration rolls back (per BP-800e-1-i)"
  - "Must complete the full migration (detection + knowledge extraction + context transfer + generation) within <60 seconds for typical projects"
