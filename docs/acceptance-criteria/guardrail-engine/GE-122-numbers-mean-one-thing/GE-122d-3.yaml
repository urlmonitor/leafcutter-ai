it_requirements:
  - "The outcome must be a distinct VALUE in the pass's return type — three states at minimum (clean, contested, could-not-establish) — not an exit code plus prose. GE-119a-1 requires machine-distinguishability independently of the exit code, and GE-122d-3-i then adds a fourth (terminated-abnormally) whose disposition differs at commit time. A boolean return makes both criteria unsatisfiable and is the shape to reject at review."
  - "The read count must be tracked per namespace DURING the walk, not derived afterwards from what was successfully parsed. A count computed from the successes is the same number in both the clean and the degraded case, which defeats the entire clause — the blind spot is precisely the difference between attempted and succeeded."
  - "DIRECT CONFLICT WITH AN ACCEPTED DECISION, to be resolved rather than absorbed: ADR-029 records that the decision-number guard is fail-open and 'must never become a deployment blocker' — meaning git unavailable, directory absent or network failure warns and exits 0. Under this criterion, an inability to read the origin/main side of the decision namespace is a could-not-establish condition and must block at commit time. Adopting that guard into this pass requires an ADR amendment or superseding ADR authored by adr-author, landed with the behaviour change, not after it."
  - "Distinguish cannot-read-the-subject from cannot-run-at-all with care: a git invocation that fails while resolving the in-flight side of the decision namespace is a cannot-read condition (part of the collection was not seen), whereas a defect in the pass's own reporting code after every namespace was read is GE-122d-3-i's case and does not block. The pass already knows which it is, because it tracks the per-namespace read counts this criterion requires."
  - "The authoring-time disposition — announce in-session, do not revert — must be implemented through the PostToolUse block-decision channel, the same channel GE-122c-1 uses to reach the session. There is no other way for that stage to say anything, and the author's file must remain on disk."
  - "Error handling per CLAUDE.md Rules 1-4: the unreadable-file branch catches a specific exception type (OSError / PermissionError for access, the parser's own error for malformed content), logs at WARNING or above, and converts to the could-not-establish outcome rather than re-raising into an unhandled traceback. A traceback at commit time is not the same as a could-not-establish result and does not satisfy the criterion."
  - "The test fixture must create the real conditions on disk — a genuinely malformed record and a genuinely unreadable file (mode 000) — per the coverage note. Note that a mode-000 fixture behaves differently when tests run as root (in some CI containers the read succeeds), so the unreadable-file test must either skip explicitly with a stated reason on that platform or use a condition that holds regardless; a silently-passing permission test is a false green."
test_spec:
  - name: test_unparsable_record_yields_could_not_establish_at_commit_time
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With a genuinely malformed record on disk in a namespace the pass owns, the commit-time stage returns the could-not-establish outcome value, names that artifact, states uniqueness was not established for the namespace, and blocks the commit."
  - name: test_unreadable_file_yields_could_not_establish_at_commit_time
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With a genuinely unreadable file on disk, the same disposition holds. The test states its platform assumption explicitly and fails rather than silently passing where the permission condition cannot be created."
  - name: test_degraded_outcome_reports_the_attempted_read_count
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The degraded result reports how many artifacts in the namespace it did read, and that number differs from the clean-run count for the same tree — proving the count is tracked during the walk rather than derived from the successes."
  - name: test_could_not_establish_is_distinguishable_without_parsing_prose
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A caller can tell could-not-establish from clean and from contested by inspecting the returned outcome value alone, with no string matching and no reliance on the exit code."
  - name: test_shared_build_stage_fails_on_the_same_condition
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "The same unreadable-artifact condition in a build checkout fails the build and carries the named artifact, the not-established statement and the read count."
  - name: test_authoring_stage_announces_without_reverting_the_write
    target_dir: unit_tests/hooks/
    framework: unittest
    type: behavioral
    description: "At the authoring-time stage the same condition produces the three statements in the injected session output, and the file the author just wrote is still present on disk with its written content."
test_rationale: |
  The coverage note rules out patching the pass's return value, so every descriptor creates the
  real condition on disk — that is the difference between testing the pass and testing its
  caller. The read-count descriptor is written to fail on the most likely wrong implementation:
  a count derived after the walk from what parsed successfully is identical in the clean and
  degraded cases, so the assertion is that the two counts DIFFER rather than that a count is
  present. The distinguishable-without-prose descriptor exists because GE-119a-1 requires
  machine-distinguishability independent of the exit code, and because GE-122d-3-i adds a fourth
  outcome whose commit-time disposition is the opposite of this one — a boolean or an
  exit-code-only contract cannot express either. The unreadable-file descriptor carries an
  explicit platform caveat because a mode-000 fixture silently succeeds when tests run as root,
  which would make the strictest test in this AC the one most likely to be a false green.
