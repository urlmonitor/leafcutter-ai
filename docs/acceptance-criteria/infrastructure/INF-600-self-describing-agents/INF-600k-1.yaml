notes: |
  Origin: EPIC-FinalizeFeatureHardening retrospective KI-4. CORRECTED 2026-09-28:
  the behaviour was only partly present. _EXTERNAL_CALLERS = {"user",
  "finalize-feature.js"} is a closed literal set in both registry checks, so only
  those two names pass; every other workflow file (for example fast-lane-ship.js)
  is rejected. The earlier statement that this was "already implemented in
  scripts/registry_validator.py" was false. The general rule, that any real
  workflow file is recognised as an external caller, is built by this AC (see the
  it-po amended_by entry of 2026-09-28 for the corrected it_requirements).
  Why now: BO-2400a-1-i's command-step-runner, dispatched by fast-lane-ship.js,
  had to ship with spawned_by: ["user"] because the workflow's own filename would
  have been rejected. This AC also locks the behaviour so the relaxation is
  traceable and regression-protected. Per BO PROJECT_CONTEXT this refines the
  INF-600g registry-validation family rather than landing under build-orchestration.
change_target: code
risk_surface: contract_boundary
