id: BO-1100c-1
title: "Routing configuration is a single JSON file with an array of pattern entries"
component: build-orchestration
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a routing configuration file exists at the project's config location,
  When the commit agent parses the file,
  Then the file is valid JSON containing a top-level array of routing entries,
  And each entry contains at minimum:
    - a "group" field (string, e.g. "tickets", "new-acs", "shipped-acs", "implementation", "status-changes")
    - a "path_pattern" field (string glob or regex matching staged file paths)
    - a "template" field (string message template with interpolation placeholders)
  And entries are evaluated in array order (first match wins),
  And at least 5 built-in entries ship with the default configuration:
    tickets, new ACs, shipped ACs, implementation code, and status changes.
depends_on: [BO-1100c]
