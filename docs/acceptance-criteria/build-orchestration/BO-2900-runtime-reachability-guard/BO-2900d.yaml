criteria: |
  Legitimate exceptions are recorded on the record, never waved through silently.

  Some work is only ever used by other work and has no way in of its own. That case
  is recognised and allowed with a stated, visible reason, so the guard stays
  trustworthy instead of crying wolf until somebody turns it off.
