it_requirements:
  - "Must be a Mermaid stateDiagram (the repo's diagram convention; subject to the check-mermaid-* commit hooks for drift/complexity/naming/parent-link) — author it to pass those hooks."
  - "Must include the unlinked-enforced state (the TQ-100b-1-ii / TQ-100c fail-safe) so the diagram is complete, not just the two-state informational<->enforced happy path."
  - "Transition triggers must name the actual mechanism: covering AC work_status reaching `done` (informational -> enforced), and a `# covers:` tag resolving to no AC in the store (-> unlinked-enforced)."
  - "Place the diagram where a fresh consumer install can reach it if it is a deliverable doc (ADR-001) — under docs/, not a build-output-only path."
