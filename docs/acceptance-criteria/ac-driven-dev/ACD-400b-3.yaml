title: "Generator is idempotent -- re-run with existing ticket exits non-zero without duplicating"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the generator was already run once for AC id ACS-100a-1 and a ticket
    exists at tickets/00_inbox/TICKET-<YYYYMMDD>-ACS-100a-1.md,
  When the generator is invoked again with --ac ACS-100a-1,
  Then the script exits with a non-zero exit code,
  And the error output names the existing ticket file path,
  And no second ticket file is written (the tickets directory contains
    exactly one file matching *-ACS-100a-1.md),
  And the source AC YAML's implemented_by list is unchanged
    (no duplicate path appended).
