criteria: |
  Demo material stays demo — it never poses as your product or your work queue.

  The sample content that ships to show how the tooling works is kept plainly
  and structurally apart from a project's own record and its own list of work to
  be done. Nobody — and nothing acting on your behalf — can read the examples as
  a description of your product, or pick a piece of the demo up as real work.
