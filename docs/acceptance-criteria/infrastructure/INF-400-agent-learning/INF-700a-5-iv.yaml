id: INF-700a-5-iv
components:
  - infrastructure
  - knowledge_system
title: "The claim-store lock works on Windows as well as POSIX, so the completion routing step loads and arbitrates claims on both"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: approved
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-5.yaml"
criteria: |
  Given the completion routing step (scripts/knowledge/completion_routing.py,
    dispatched through completion_routing_cli.py's stage entry point) merges
    claims into the shared claim store under an exclusive lock on a lock file
    beside it (INF-700a-5-iii),
  And a unit of work completes on a Windows host, where the POSIX-only fcntl
    module does not exist,
  When the fast lane (or any other completion path) imports
    completion_routing and runs its stage step there,
  Then the module imports without error on Windows and on POSIX alike,
  And claim_and_confirm_routed takes an exclusive lock on the lock file
    through fcntl.flock on POSIX and through msvcrt.locking on Windows, each
    imported only on the platform that provides it, holds it for the state
    update alone and releases it afterwards,
  And two claims of the same published record made under that lock on either
    platform still yield exactly one new claim,
  And a platform that offers neither primitive raises an error naming the
    missing lock primitive rather than silently
    proceeding without the lock,
  And the bug symptom ("On Windows the fast lane's knowledge-routing step
    (completion_routing_cli.py stage) crashes at import with
    ModuleNotFoundError: No module named 'fcntl' (wf_d4381e19-613,
    2026-10-24); the step fails open, so completed work stages no knowledge
    on Windows") must not occur.
depends_on:
  - INF-700a-5-iii
