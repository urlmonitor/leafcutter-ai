id: DK-300e-2-i
title: "Evaluation cannot pass with no cases or a violated recognition label"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given an evaluation selects no corpus cases or a controlled fault changes an expected entity identity, bypasses a denied-source rule or omits the end of an admitted goal,
  When the same recognition evaluation is run,
  Then it reports a failed or invalid evaluation rather than a passing empty aggregate,
  And each affected case reports the expected label and observed violation,
  And a correct final answer or passing unrelated cases cannot conceal that failure.
depends_on: [DK-300e-2]
