notes: |
  RELOCATED FROM BO-3200f-2-ii SCENARIO 1 (user decision, BrainCandy, 2026-09-17).
  Generalised from "the three live scenarios -- BO-3200f-2's first scenario and both
  scenarios of BO-3200f-2-i" to "the cases that ask a real agent". Everything else is
  carried over word for word.

  WHY AN EDGE CASE AND NOT AN L2. Off is the default and the safe state; the L2 describes
  what the switch turns on. TQ-600a's cap (5 L2s) is kept for the behaviours and the three
  documentation records its triggers require.

  WHAT WAS ADDED. The second and third scenarios come from BO-3200f-2-ii's IT PO
  it_requirement THE SWITCH IS ONE ENVIRONMENT VARIABLE ("unset or '0' is off; any other
  value fails the run naming the variable and the value, so a typo never reads as off").
  They are criteria here because a typo read as off is the silent-skip failure this L1
  forbids, seen from the other side. The exact on and off values (the IT PO chose '1' and
  '0' for LEAFCUTTER_LIVE_DISPATCH) stay in IT PO fields.

  WHY "NOT RUN" AND NOT "PASSED". A case that asked no agent and reads as passed is the
  phantom-done shape. Switched OFF, "not run" is honest. Switched ON, "not run" is not
  available -- see TQ-600a-1-ii.

  DECISION ALREADY MADE -- NO CI JOB NOW (user decision 2026-09-17). The first scenario
  covers CI as it is today: the switch unset.
