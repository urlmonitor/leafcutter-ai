notes: |
  This is the coverage FLOOR criterion — the single behavioural change that makes
  the measured collapse in GE-123a's notes unreachable. Today the per-file scan
  appends one filename finding and returns immediately, so the contents of an
  env-named file are never read and the filename finding is the ONLY finding such
  a file can produce.

  MEASURED RED BASELINE for this criterion, to be reproduced before any fix:
  five env-named files each carrying the four secret shapes above reported ZERO
  problems and exited clean with one suppression line present; the identical
  content in an ordinary source file reported four. Against THIS criterion (no
  suppressions at all) the current baseline is one finding for the env-named file
  and four for the source file — the fix must take the env-named file to five.

  ENV FILENAMES ARE THE SUBJECT HERE, DELIBERATELY. The tree-wide authoring
  constraint forbids env filenames as casual illustrative examples elsewhere,
  precisely because they are short-circuited; this criterion is about that
  short-circuit, so it must name them. Siblings in this tree use "secrets.py".

  VERIFICATION STANDARD: a sibling audit in this family found two criteria
  verified only against the matching logic in isolation that described situations
  the real entry point can never produce. This criterion must be exercised
  through the multi-file entry point with real files on disk. Coverage of the
  per-file scan in isolation does not discharge it.

  The filename finding is still wanted — GE-123a-3 is the positive arm that
  guards it against being deleted rather than de-privileged.
