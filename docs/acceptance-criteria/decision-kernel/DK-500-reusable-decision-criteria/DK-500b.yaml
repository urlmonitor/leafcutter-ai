notes: |
  OPEN: THE CLUSTERING METHOD IS NOT DECIDED. The user asked that criteria can
  be clustered "somehow". dec-93c1c730463c1f3c settles where groupings are
  stored, not how they are worked out. Do not assume a method at L2. Candidate
  families for a later decision: deterministic wording and label matching, text
  or embedding similarity, Jev judging "same question?" pairs, LLM proposal, or
  a mix of these. ADR-053 orders them by cost. Recommendation: run a kernel
  decision on the method before the BA writes method-specific L2s. Method-neutral
  L2s (for example "a grouping is a suggestion until a person accepts it" and
  "no label belongs to two live categories") can proceed now.

  SCOPE. Grouping applies in three places:
    1. to mined candidates (DK-500a),
    2. to questions drafted new for a decision (DK-500e), which may belong to an
       existing category, and
    3. to existing categories, which may sit under a broader one.
  Merges and splits that a person makes are DK-500c. This L1 covers only the
  suggested grouping.
