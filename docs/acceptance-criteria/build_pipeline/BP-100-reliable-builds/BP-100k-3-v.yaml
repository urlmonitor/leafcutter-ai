notes: |
  WHY THIS IS ITS OWN RECORD AND NOT A CLAUSE OF -iv. -iv describes a
  convenience. This record describes the limit on it. If they lived in one
  record, a later change could widen the convenience by amending one criterion
  and nobody would see a constraint being deleted. As a separate record, any
  widening (glob or prefix entries, a global "ignore drift" flag, reading the
  raw registry instead of the validated map) has to retire a named constraint
  openly. This is the explicit "the suppression must stay per-key and
  ground-gated" pin the retrofit was asked to judge. The registry charter
  makes it necessary.

  The groundless-entry clause guards a specific bypass: if Pass 2 read the
  raw registry instead of the validated map, a bare {"path": ...} would
  excuse drift with no questions asked. The covering test separates the two
  readings because a whitespace-only ground fails validation but is a
  non-empty, truthy string in the raw entry.

  Done on 2026-10-08, as a retrofit like -iv: both covering tests now carry
  "# covers: BP-100k-3-v" tags and done_proof.verify_done_eligible returned
  eligible: true for this id.
