notes: |
  Decomposed from ACS-800c. The moved-child bookkeeping (parent's child list and
  child's parent pointer stay consistent — both directions) plus the atomic/auditable
  property. The child-list update reuses the existing parent covered_by update
  protocol (ac-schema.md §Authoring agents), now keyed on UID instead of a derived
  parent id.
