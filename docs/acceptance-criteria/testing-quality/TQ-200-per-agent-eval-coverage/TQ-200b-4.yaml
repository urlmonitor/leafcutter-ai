id: TQ-200b-4
components:
  - testing-quality
title: "A triggering change with a missing or stale eval result is a hard failure, never a skip"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given each eval result records the git SHAs of its trigger inputs (the files in
    its declared dependency closure),
  When the freshness of an agent's eval is checked against the current revision,
  Then a result whose recorded input SHAs no longer match the current inputs is
    STALE,
  And a triggering change (one that touched an agent's dependency closure) that has
    a MISSING or STALE result for that agent is a HARD FAILURE — never a skip and
    never an implicit pass,
  And the check enumerates the affected agents deterministically and treats a
    missing result as an error (mirroring TQ-200a-1's coverage-gap rule: in-scope
    but unproven is a gap, not a silent pass),
  And the guarantee is enforced as a REQUIRED gate — a required CI status check for
    the live model run, plus a fast local pre-commit staleness guard that detects
    and blocks a missing/stale result WITHOUT invoking the model,
  And LLM-noise is absorbed by the agent's threshold: a small flake that still
    scores at or above threshold is NOT a failure, so the gate is
    regression-detecting rather than flaky.
