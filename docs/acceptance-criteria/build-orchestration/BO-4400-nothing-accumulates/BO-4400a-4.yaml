notes: |
  Satisfies BO-4400a documentation_triggers: how-to. Per the BO-4100 framing decision this
  guide describes behaviour that holds by construction; it is not the instrument that makes
  cleanup happen.

  AMENDED 2026-11-16 (user decision Q3): cleanup happens once the work lands. Finalize's
  workspace removal (step 7) is one point where that happens, and the landed-work pass clears
  whatever a route kept, so no route waits for or relies on finalize (BO-4400 KEY FRAMING
  DECISION, as the PO amended it the same day).
