notes: |
  EXPLICIT OPEN QUESTION SURFACED FOR THE IT-PO (per GE-111b PO note and the
  orchestrator's instruction). Mirrors the GE-100 / GE-107 fail-open precedent
  ("fails open when the binary is missing"; OSError fail-open).

  IT-PO RESOLUTION (2026-06-22) of open question #1:
  Trigger signals for fail-open = {binary/index absent, unsupported language,
  version-incompatible resolver, timeout, resolver/parse error}. Each degrades
  the SYMBOL TIER to an advisory skip; the file-path FLOOR is independent and
  still blocks on a vanished file. The skip is a silent-to-stderr advisory at
  commit time and does NOT defer a store-wide scan (that is a separate, out-of-
  scope surface). Concrete precedent: scripts/commit_guardian/check_duplicate_code.py
  fails open on missing jscpd, jscpd v4 incompatibility, and a 30s timeout.
  With the GE-111b-2 default resolver being in-process Python AST, "unsupported
  language" is the dominant fail-open path (any non-.py anchored entry skips the
  symbol tier and is covered by the file floor only) until a cross-language CLI
  resolver is added.
change_target: code
