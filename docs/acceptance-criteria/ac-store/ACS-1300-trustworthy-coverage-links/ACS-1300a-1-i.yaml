notes: |
  RETARGETED 2026-09-01 FROM QUOTE-STRIPPING TO TAG-TOKEN NORMALISATION. The record kept
  its slot because the measurement did not say "this is worth nothing" — it said the
  attributed cause was wrong. Two records are genuinely unmatched today, and the reason is
  a separator, not a quotation mark.

  WHY THE INHERITED LESSON DID NOT TRANSFER. KM-ADM-005 needed _strip_quotes because its
  reader scanned raw YAML text with a regex, so `id: "GE-114-1"` arrived with the quotes
  attached. This join reads the store through a YAML parser, which strips them as a matter
  of course — measured: six ids are written quoted and all six resolve. Inheriting a lesson
  is not the same as inheriting its cause, and this is a clean worked example of the
  difference: the same words, a different reader, no defect.

  THE DEFECT THAT IS REAL, AND IT IS TWO DEFECTS IN ONE LINE. `(\S+)` takes everything up
  to whitespace, so on `# covers: BO-560, BO-560-1` it captures `BO-560,` — which matches
  no record — and never sees `BO-560-1` at all. The first failure loses a link and adds a
  phantom unresolved tag; the second loses a link silently, with nothing emitted at all.
  The second is the worse of the two because it leaves no trace to notice.

  DO NOT SOLVE THIS BY WIDENING THE MATCH. A normaliser that strips trailing non-alphanumeric
  characters generally, or that case-folds, will start attributing tags to records they do
  not name — and a link written onto the wrong record is worse than the missing link it
  replaced, which is the line ACS-1300a's notes draw around this whole tree. The final
  criterion clause and the fourth test are the falsifiers for that over-reach.

  SEQUENCE THIS BEFORE TQ-100b-4, OR WITH IT. That AC narrows the canonical reader so
  unresolved captures must be id-shaped, and explicitly requires that it "removes nothing
  from the resolved list". `BO-560,` is not id-shaped and is not in the resolved list, so
  TQ-100b-4 is satisfied by discarding it — the miss becomes permanent and its only signal
  disappears. Nothing about TQ-100b-4 is wrong; the two simply must not land in the wrong
  order.
