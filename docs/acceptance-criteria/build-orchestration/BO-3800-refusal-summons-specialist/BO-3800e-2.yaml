notes: |
  WHY THIS IS SEPARATE FROM BO-3800e-1, AND WHAT EACH CATCHES. BO-3800e-1's population is a
  refusal that asks for no craft; this record's is a run with no refusal in it at all. They
  are caught by different wrong builds. The over-broad summons — engage a specialist on every
  refusal — reddens BO-3800e-1 and leaves this record entirely GREEN, because there is no
  refusal in its run to trigger anything. That asymmetry is the separability evidence between
  the two and must be observed rather than asserted. The coupling runs the other way and is
  declared below: this record's own injection reddens BO-3800e-1 as well, necessarily,
  because anything eager enough to cost on a clean run also fires on a refused one.

  THE ARM THAT LOOKS LIKE A PERFORMANCE NOTE AND IS NOT. "No file read, no party engaged, no
  standard run that would not have been" is the arm that excludes the resolve-and-warm
  implementations: looking up the specialist in the registry on every ticket, pre-reading the
  refusal path's configuration, or probing that the specialist is reachable before the
  standard has said anything. Each of those is invisible to every other record in this tree,
  is cheap to write while wiring a new dispatch, and turns a capability that should cost
  nothing on the common path into a fixed tax on every drive. The duration arm alone will not
  catch them — a registry lookup is fast — which is why the work arm is stated separately
  from the timing arm.

  WHAT THIS RECORD DOES NOT CLAIM. It does not claim the refusal path is cheap. A run that
  genuinely needs a specialist pays for one, and BO-3800d-1's bound is where that cost is
  governed. This record's whole population is the run in which nothing asked for anything.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift it
  verbatim into a test descriptor.

  THE EAGER PROBE. MUTATION: at every delivery attempt, resolve and engage the restructuring
  specialist before the standard's verdict is consulted, and use its result only if the
  verdict turns out to be a refusal naming it.
  MUST GO RED: the no-specialist-engaged arm and the no-additional-work arm of this record.
  MUST STAY GREEN: every arm of BO-3800a-1, BO-3800b-1, BO-3800c-1, BO-3800d-1 and
  BO-3800d-2 — the eager build satisfies all of them, because everything they observe still
  happens in the right order on the refusal path.
  EXPECTED COUPLING, TO BE REPORTED RATHER THAN SUPPRESSED: both arms of BO-3800e-1 also
  redden under this injection, because a probe that fires on every delivery necessarily fires
  on an author-clearable refusal too. That is a true consequence of the injection and not
  evidence that BO-3800e-1 and this record are one; the separability runs the other way, and
  it is BO-3800e-1's own injection that demonstrates it by leaving this record green.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs after
  this pass — including what counts as "measurably" slower and how the two runs are compared.
