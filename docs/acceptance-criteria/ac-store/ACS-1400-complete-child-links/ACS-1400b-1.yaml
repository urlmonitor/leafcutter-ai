title: "The store-wide answer is produced on a schedule and lands in front of a person"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing at least one child record its parent does not name,
  And nobody has asked for the store to be checked,
  When the recurring store-wide check reaches its next scheduled run,
  Then the answer is delivered to a named destination a person reads, and the
    delivery is recorded,
  And the recorded delivery names the run it came from, so a run that executed but
    whose answer was never delivered is distinguishable from one that was,
  And when the same recurring check runs against a store where every parent names
    every child, the run is recorded as delivered with nothing to act on rather
    than producing no record at all.
