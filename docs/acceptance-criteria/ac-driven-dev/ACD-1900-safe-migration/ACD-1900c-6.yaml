  contract: "The dual-read Step 1 coverage-resolution behaviour of ac-fulfillment-gate.md (accept ac_traceability OR resolve source_ac; absent-coverage falls back to advisory in foundation). This AC extends that Step 1 with the enforce-time flip. The enforce flag (ac_unit_of_work.enforce) is read from config/guardrail_gates.yaml per ACD-1900c-3."
it_requirements:
  - "Canonical surface: the agent-template prose templates/agents/ac-fulfillment-gate.md, Step 1 (the deployed .claude/agents/ copy is build output per ADR-001; never hand-edit it). Author the enforce-time flip: when ac_unit_of_work.enforce = true AND zero in-flight fat (legacy) tickets remain, the former \"absent -> ok\" path returns a BLOCKER for an unresolvable/unmet coverage case."
  - "The flip condition is EXACTLY ADR-026 non-negotiable rule 5: enforce=true AND zero in-flight fat tickets. When enforce=false OR one or more fat tickets remain, retain the dual-read / advisory fallback authored in ACD-1900b-5 (do not block). Read the enforce flag from config/guardrail_gates.yaml (ac_unit_of_work.enforce) consistent with the enforce-enable guard ACD-1900c-3, and derive the fat-ticket condition from the live inventory (data-driven), never a hard-coded flag."
  - "Supersession-safe co-existence: this is the enforce-side twin of the read-side dual-read gate ACD-1900b-5. Do NOT remove the read-side dual-read path -- both co-exist across the cutover window; the skip path is only retired at enforce after fat tickets drain."
  - "No executable pytest surface is authored here (agent-template prose change) -- see test_required. Per CLAUDE.md 'Gate/Workflow ACs verify behaviorally', behavioral correctness is proven by an ADR-026 rule-7 real-thin-ticket spot-check that runs the gate under both states -- (enforce=true + zero fat -> blocker) and (enforce=false OR fat present -> advisory/no-block) -- never grep-only."
