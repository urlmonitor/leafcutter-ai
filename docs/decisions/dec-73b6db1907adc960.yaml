  - id: opt.workspace_skill_rendered_root
    title: Render the Codex skill from the same in-package source into the workspace root where sessions run, with the repository
      root fixed at install time and a prefix rule for the kernel command
    description: 'install-skill gains a host switch: the Codex render (SKILL.md + agents/openai.yaml) goes into the workspace
      root''s .agents/skills/leafcutter (the folder the user''s sessions start in), the target repository path is rendered
      into the skill instead of being guessed from the session''s project root (also fixing the Claude Code skill), and a
      .codex/rules prefix_rule there allows only the rendered kernel command.'
