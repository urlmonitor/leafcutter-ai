notes: |
  Flow nodes: criteria-library approve and stage (the stage step is the immediate consequence of the approval when the run ends, so both are one behaviour here).
  SETTLED by dec-93c1c730463c1f3c: records are staged in the run root and enter Git only through a human-run publish.
  MOCK ASSUMPTIONS this AC adopts and asks the user to confirm: the id scheme cat-<16 hex>, kernel-minted at proposal and never changed by a label edit, merge or split; the staging location <run_root>/runs/<run_id>/staged/criterion_categories/<id>.yaml (kept out of the criteria text, which says "that run's staged area"); approved_by matching human(:<name>).
  Open: where the person reviews candidates (which kernel capability or command opens the review run).
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: approve, stage.
  Authored by the business-analyst stage of /plan-feature (route strategic) under decision dec-93c1c730463c1f3c; readiness draft, no product approval implied.
  IT PO (2026-10-05): the BA's open point 'where the person reviews candidates' is settled as an IT PO default to confirm: python -m kernel criteria review, a run bound to the new native capability criteria.review. The mock assumptions this AC adopted (cat-<16 hex>, the staging path, approved_by human(:<name>)) are taken as the technical contract.
