notes: |
  ==========================================================================
  STANDING CORRECTION — READ THIS BEFORE REUSING ANYTHING FROM THIS RECORD.
  THE FOUR DIVERGENCE CLASSES ARE NOT EXHAUSTIVE. THERE IS A FIFTH.
  ==========================================================================
  This record's criteria name four classes of input on which the pure-Python and
  C-backed YAML parsers are known to differ: a duplicate mapping key, a timestamp
  scalar, the ambiguous numeric forms, and a merge key. That list READS AS COMPLETE
  AND IS NOT. The fifth class is A TAB CHARACTER INSIDE A FLOW SEQUENCE —
  `"key: [\t]\n"` returns `{'key': []}` under the C parser where the pure-Python one
  raises ScannerError — and it is THE ONE THAT ACTUALLY CAUSED THE DEFECTS: a
  fail-open `except yaml.YAMLError` meaning "skip this malformed file" silently
  became "accept it as valid", which is the phantom-done class this repository's
  guardrails exist to prevent. It was found AFTER the four-class list was written,
  during the 2026-10-07 revert of 83 of 85 migrated call sites.

  SO: TREAT ANY SUCH LIST AS A FLOOR, NEVER AS A CLOSED SET. If a future record
  needs the known-divergence classes, it must take five and know that five is also
  only what has been observed so far. Lifting the four-class list out of this record
  as though it were complete would reproduce the exact gap that caused the defects,
  and this record is now deprecated, so nothing else will stop that happening. This
  warning is repeated on the parent TQ-600a-11 and is stated here because this is
  the record that holds the list.

  ==========================================================================
  THE RETIRED TEST CONTRACT (moved here from test_spec, 2026-10-09).
  NONE OF THIS IS WORK WAITING TO BE DONE. DO NOT AUTHOR ANY OF THESE TESTS.
  ==========================================================================
  test_spec is now null and test_required is false. The four descriptors below stood
  in test_spec until this retirement; they are recorded here because that field is a
  present-tense instruction to test-writer and these describe a contract against a
  comparison nobody is building. Two of the four carry named mutations that are
  worth reusing in any equivalence check.

  (1) test_tq600a_11_ii_every_store_record_parses_identically_under_both_parsers
      — integration / real_artifact. Enumerated the real store, parsed each record
      both ways, compared objects AND types, zero disagreements, with the failure
      message naming the record path and the differing field. Cost ~27s of two
      whole-store sweeps on every full run, which is part of why retiring it rather
      than leaving it is the right outcome.

  (2) test_tq600a_11_ii_the_comparison_reports_the_number_of_records_it_examined
      — integration / criterion. The reported examined-count non-zero and equal to
      the number of record files the enumeration found.
      NAMED MUTATION, AND THIS ONE IS GENERALLY REUSABLE: make the enumeration
      return an empty list; this test must go RED while the agreement assertion
      alone stays green. An empty enumeration is the single most likely way any
      store-wide guard becomes a no-op, and this repository has already lived
      through exactly that — the AC validator exited 0 having checked zero files for
      eight days. Any new whole-store check should carry this descriptor's shape.

  (3) test_tq600a_11_ii_the_four_known_divergence_classes_are_present_in_the_compared_set
      — integration / boundary. For each of duplicate key, timestamp scalar,
      ambiguous numeric form and merge key, the compared set contained at least one
      instance and the report named where it came from — a store record id, or the
      test's own supplementary input. SEE THE STANDING CORRECTION ABOVE: the list
      this descriptor enumerates is a floor, not a closed set.

  (4) test_tq600a_11_ii_a_record_only_one_parser_rejects_counts_as_a_disagreement
      — unit / failure. Fed an input that one parser raises on and the other
      accepts; the comparison recorded a disagreement rather than a skip.
      NAMED MUTATION, ALSO REUSABLE: wrap each parse in a try/except that skips on
      error; this test must go RED. That wrapping is the obvious thing a coder
      writes when a parse raises mid-sweep, and it silently converts the strongest
      signal available into no signal at all.

  THE ORIGINAL test_rationale, PRESERVED FOR ITS CENTRAL DISTINCTION. "The analyst
  measured that the C-backed parser reads all 4,635 records without raising. That is
  a different claim from the objects being equal, and the gap between the two is
  exactly where this change can ship broken: a parse that succeeds while resolving a
  value differently is invisible until some downstream gate compares the wrong
  thing." Three of the four descriptors existed to stop a comparison that cannot
  fail — which is the same discipline the sibling TQ-600a-11-iii was written to
  enforce one level up.

  THIS IS THE ACCEPTANCE CRITERION FOR TQ-600a-11, NOT A NICE-TO-HAVE. The parent
  substitutes a parser in 76 places including a required pull-request gate and the
  pre-commit path of every commit. The evidence currently in hand is "it did not
  raise", which is compatible with a value being resolved differently in a record
  nobody looks at until it matters.

  The four classes are the known-divergence set and they are not hypothetical:
  duplicate mapping keys, timestamp scalars, the ambiguous numeric literal forms of
  YAML 1.1, and merge keys are where the pure-Python and libyaml implementations have
  historically parted company. The store may well contain none of them, which is a
  fine outcome — but it has to be an observed outcome, reported, not an assumption.
