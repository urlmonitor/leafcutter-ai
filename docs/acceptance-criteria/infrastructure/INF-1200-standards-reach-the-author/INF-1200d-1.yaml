it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED, WITH THE TRIGGER NAMED. Declaring a further
    standard of an EXISTING sort is a nested addition inside an already-present top-level
    section of commit_guardian.json (file_size, complexity, sql_complexity, folder_density are
    four of its thirty-six top-level keys, all read in this worktree), and the mapping_keys
    container is bound to dotted path "" only — so nested additions are unwatched and
    package_surface is FALSE. THE TRIGGER: a standard of a genuinely new SORT may have no
    existing section to live in, and creating one IS a watched top-level mapping key. If the
    implementation needs that, check-package-surface-declaration will refuse the commit and this
    record must be re-declared package_surface: true with a real config_schema_fragment first.
    Raise it; do not add the key quietly. No fictional fragment is minted here for a key that
    may never exist.
  - >-
    THE WALK IS OVER THE DECLARATION AS IT STANDS, AND NOTHING MAY ENUMERATE STANDARDS. No list
    of known standards, no per-standard branch, no per-standard config key, no mapping from
    standard name to extraction function, and no cache of standards seen on a previous run. The
    incumbent shape this replaces is exact and measurable: scripts/build.py:255-285
    `_inject_file_size_limits` reads file_size.line_limits['.py'] and sets one config key, with
    `_inject_changelogs_dir` beside it doing the same for an unrelated value. Every additional
    value costs another such step today. A generalisation that still has one step per standard
    has not satisfied this record however many steps it has.
  - >-
    THE DECLARATION MUST SAY WHICH KIND OF FILE EACH STANDARD GOVERNS, AND TODAY IT DOES NOT FOR
    THREE OF THE FOUR. Measured: file_size declares its scope explicitly
    (checked_extensions ['.py', '.sql'], line_limits {'.py': 400, '.sql': 600}); complexity
    (max_score 15), sql_complexity (max_score 75) and folder_density (max_files_per_folder 15)
    declare thresholds with NO statement of which kinds of file they govern — that fact lives
    only in the check script's name. A walk cannot derive an audience from a section that does
    not say what it applies to. So this record's work includes adding a per-section declaration
    of applicability, NESTED inside each existing section, and the addition must be data the
    walk reads rather than a branch the walk contains.
  - >-
    THE COUNTING ARM IS A COUNT AND MUST BE COMPUTED FROM THE JOIN, NOT AUTHORED BY THE TEST.
    "The number of declared standards reaching an audience has risen by exactly the number newly
    declared" fails on an implementation that carries one of two, AND on one that carries the new
    standards to everybody — a list of expected recipients authored by the test would pass both.
    Define the counted unit precisely and once: a (standard, specialist) pairing in which the
    specialist owns a kind of file that standard governs and the specialist's compiled brief
    states it. Derive the expected number from the records, never from a literal.
  - >-
    THE WITHDRAWAL ARM FORBIDS ACCUMULATION, AND NO OTHER RECORD IN THIS TREE CAN SEE IT. An
    implementation that adds each newly seen standard to a growing store and never removes one
    passes the arrival arms indefinitely and quietly holds standards the project has retired.
    INF-1200f-1 compares two surfaces for a standard that still exists and INF-1200e counts
    specialists told too little, never too much. State it as a property: what travels is the
    declaration as it stands, computed fresh, with no persisted or cached standards store.
  - >-
    FENCED — DISCHARGED BY THE TELLING, NEVER BY THE REGISTERING. Several standards this record
    carries are also not registered to run; making them run is BP-1600a-2's approved,
    high-priority work. No implementation here may inspect hooks_manifest, count scripts, add an
    entry, or be deferred until that record lands. INF-1200a-3 owns the positive statement that
    the two are independent and its descriptors are the ones that would catch a coupling
    introduced here.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the
    declaration read and every brief write; log at WARNING or higher or re-raise; no bare or
    blind excepts. A section the walk cannot interpret must fail loudly rather than being
    skipped — a silently skipped section is a declared standard that reaches nobody while the
    run reports success, which is precisely INF-1200d-1-i's subject arriving through the back
    door.
  - >-
    CANONICAL VERSUS BUILD OUTPUT. Edit templates/scripts/commit_guardian/commit_guardian.json
    only; scripts/commit_guardian/ and .claude/ are untracked build outputs overwritten by
    build.py, and templates/commit-guardian/commit_guardian.json is a decoy with no file_size
    section. Re-run `python scripts/build.py --target-dir .` as part of the change (ADR-001).
test_spec:
  - name: test_inf_1200d_1_a_standard_the_carrier_has_never_seen_reaches_its_owner_with_the_carrier_untouched
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Declare a standard of a sort the project has never carried outward, governing a kind of
      file the ownership record assigns to a specialist; alter nothing that carries standards
      outward; build into a temporary target and read that specialist's compiled brief. The new
      standard is stated. Additionally assert the negative that carries the record: nowhere in
      the carrier does any step, case, entry or mapping specific to that standard exist —
      measured as the tracked diff containing no change to scripts/build.py,
      scripts/build_phases.py or any carrier module, not by reading their source for a string.
  - name: test_inf_1200d_1_two_new_standards_of_different_sorts_raise_the_reached_count_by_exactly_two
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Declare a second standard of a different sort again, governing a different kind of file
      with a different owner. Both specialists have the standard governing their own kind of
      file stated. The number of (standard, specialist) pairings in which the specialist owns a
      kind of file the standard governs AND its brief states it has risen by EXACTLY the number
      newly declared — the expected number derived from the records, never authored as a
      literal. A carrier that reaches one of the two fails; so does a broadcast, whose count
      rises by standards times specialists.
  - name: test_inf_1200d_1_withdrawing_a_declaration_removes_it_from_its_owners_brief_and_leaves_the_other
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Withdraw one of the two declarations and rebuild. The withdrawn standard is no longer
      stated in its owner's brief, while the other remains stated in its own owner's. What
      travels is the declaration as it stands, not as it once was. This is the only arm in the
      tree that can fail on an accumulating carrier: f-1 compares surfaces for a standard that
      still exists, and e counts specialists told too little, never too much.
  - name: test_inf_1200d_1_the_fixed_standards_enumeration_injection_reds_all_three_arms_and_leaves_every_arm_of_c_1_green
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's NAMED MUTATION, CARRIED VERBATIM AND OBSERVED AS ONE FOUR-WAY EXPERIMENT.
      MUTATION: carry outward only the standards named in a fixed enumeration compiled when the
      delivery was built — one entry per known standard, which is the shape the project already
      has, one entry larger. Under that injection: the first arm must go RED, because a newly
      declared standard is not in the enumeration and does not arrive; the two-new-standards
      counting arm must go RED, because the count does not rise; the withdrawal arm must go RED,
      because a withdrawn standard named in the enumeration keeps arriving; and every arm of
      INF-1200c-1 must STAY GREEN, because the audience for the standards the enumeration does
      know is still derived from the ownership record. All four outcomes must be observed
      together and all must revert. THE GREEN OUTCOME IS THE WHOLE REASON c AND d ARE SEPARATE
      L1s: this mutation is the current state of the project one value larger, it satisfies the
      specialist axis completely, and only this record can fail on it. An injection run that
      reddens c-1's arms too is a FAILURE of this descriptor.
  - name: test_inf_1200d_1_the_three_configured_but_uncarried_standards_reach_their_owners_after_a_real_build
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      AGAINST THE REAL DECLARATION, NOT A FIXTURE. Three standards besides the size one are
      already fully configured with thresholds in
      templates/scripts/commit_guardian/commit_guardian.json — a cyclomatic-complexity score, a
      separate one for database code, and a folder-crowding count — and no specialist anywhere
      is told any of their figures today. After a real build, each reaches the specialists the
      ownership record assigns the kinds of file it governs. This is the arm that proves the walk
      works on the declaration's actual per-check shape rather than on a uniform container a
      fixture invented, per CLAUDE.md's real-artifact rule. Note the fence: whether those checks
      RUN is BP-1600a-2's work and is asserted nowhere here.
test_rationale: |
  "The standards that exist today all reach their audiences" is a snapshot, satisfied once, by
  hand, permanently. So every arm is stated over a standard the implementation has never seen, and
  every descriptor declares that standard at test time and then runs the real build. The first
  arm's negative half — that no step, case, entry or mapping specific to that standard exists in
  the carrier — is measured as the tracked diff rather than by reading carrier source for a
  string, because a source read is the grep shape CLAUDE.md forbids and would pass on a carrier
  that hard-codes the standard under a different name.

  The counting arm is a count and not a list, and the expected number is derived from the records
  rather than authored. That is what makes it fail on both of the two opposite wrong
  implementations at once: a carrier that reaches one of two new standards, and a broadcast whose
  count rises by standards times specialists. A test-authored list of expected recipients would
  pass both, which is the specific trap the BA's notes name.

  The BA's mutation is carried verbatim, and its stay-green half — every arm of c-1 — is asserted
  explicitly. That green is the entire justification for c and d being separate L1s: the injected
  world is today's project one value larger, it satisfies the specialist axis completely, and only
  this record can fail on it. An injection run that reddens c-1's arms means the fixture is not
  isolating the standards axis and is a failure of the descriptor.

  One descriptor runs against the REAL declaration rather than a fixture, because commit_guardian
  .json has no uniform standards container — each check is its own top-level section with its own
  field names. A fixture with a tidy uniform shape reproduces exactly the assumption a naive walk
  would make, which is the documented shape of this project's worst phantom-done incident.
delivers_to:
  - agent: python-coder
    ac_id: INF-1200d-2
    contract: >-
      The declaration walk itself — the per-section traversal that yields, for each declared
      standard, the kinds of file it governs and the content to be carried. d-2 constrains what
      that content may BE: a rule, a prohibition or an exclusion declared without any figure must
      travel in the terms it was declared in, so the walk may not narrow the carried content to a
      numeric value.
  - agent: python-coder
    ac_id: INF-1200d-1-i
    contract: >-
      The run outcome of the declaration walk, into which d-1-i inserts the empty-audience state
      as a named result distinct from delivered — naming the standard and the kind of file it
      governs, and preventing a run in which every standard had an empty audience from reading as
      a successful delivery.
expects_from:
  ac_id: INF-1200b-1
  contract: >-
    The build-time join, read from the standards axis: for each declared standard, the set of
    specialists the ownership record assigns the kind of file it governs. Produced by walking the
    declaration as it stands at compile time, so a standard the carrier has never seen appears in
    it with no step of its own.
