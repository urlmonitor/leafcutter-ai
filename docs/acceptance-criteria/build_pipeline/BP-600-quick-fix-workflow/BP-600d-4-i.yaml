created: 2026-06-05
amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      Reversed the central clause. The original said the workflow "pushes the
      commit to origin but does not attempt to create a new PR" and told the
      user to run /pull-request themselves; the matching it_requirement said
      "Must not create a new PR — only detect and report the absence of one".
      The workflow now DOES create one. The substance of the amendment is the
      gate, not the capability: creation happens only after an explicit user
      confirmation, and a decline still ends with the work pushed and no PR,
      which is the original behaviour preserved as the refusal path. Three
      operational constraints that are part of the same phase were made
      explicit because each has already failed in a real run: the non-EMU
      account switch before any gh pr command, --body-file rather than inline
      --body (a bare AC id was shell-interpolated into a published PR body),
      and the no-merge boundary. The it_requirements entry that forbade PR
      creation was rewritten for the same reason — it contradicted the shipped
      behaviour outright. The original's ticket-lifecycle clause ("the ticket
      lifecycle still closes normally with status: done") is dropped: this
      workflow has no ticket, which is the same pre-existing gap recorded on
      BP-600d-3. Title amended to match. work_status left done.
