notes: |
  WHY A SEPARATE RECORD (BA memory, guard-liveness placement 2026-09-01): the guard is inert by TWO
  mechanisms -- in the main workspace resolving the path leaves the project and the containment
  test raises; in a worktree it does not raise, the resolved path simply fails the prefix test.
  A repair that handles only the first leaves every worktree inert, and worktrees are where the
  drives run. Named mutation that turns ONLY this record red: fix only the leaves-the-project
  case.

  declares_side_effect: false.
  IT-PO ENRICHMENT (2026-09-25).

  THE MECHANISM, NAMED. Detection is by resolving BOTH sides and testing containment on the
  resolved pair - the edited path, each gated folder and the project root all resolved to their
  real targets - and a resolved path that leaves the project is an ordinary non-match rather than
  an exception. A gated folder is gated under both its in-project spelling and its resolved
  target, so a link is not a way out.

  WHY THE LINKED COPY MUST BE FAITHFUL. The distinguishing case is the one where the links stay
  INSIDE the working copy: the resolution does not leave the project, nothing raises, and the old
  prefix test simply fails. If the harness stands up a copy whose gated folders are real
  directories instead, it has built the layout in which the defect does not reproduce - the same
  error KI-CG-20260917's probe made accidentally. Blocked is the correct outcome if that layout
  cannot be built faithfully; a silent substitution is not.

  REPORTING IS PART OF THE CRITERION. Per layout and per gated folder, side by side, with the two
  failure mechanisms distinguishable. An aggregate verdict cannot name the layout a folder failed
  in, which is the clause that makes this record more than a repeat of GE-130f-2.
