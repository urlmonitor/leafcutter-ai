estimated_complexity: M
it_requirements:
  - >-
    CALL THE EXISTING HELPER, DO NOT WRITE A SECOND ONE. Two files already depend on
    the synthetic-package helper. A near-duplicate assembled inside this file would
    drift from them silently and is the cheapest way to turn one maintained thing into
    two unmaintained ones.
  - >-
    THE MUTATION SITES WERE READ FROM SOURCE, NOT GUESSED, AND STILL NEED RUNNING TO
    CONFIRM. Every mutation in the file was confirmed to target a script or
    configuration file the smaller helper provides. That was established by reading,
    not by executing. Run the file against the smaller copy and confirm every test
    still passes before believing it.
  - >-
    THIS FILE STAYS ON THE MUTATE SIDE OF THE BOUNDARY. It alters package source and
    then asserts the build fails. It must keep building its own copy and must never be
    routed onto the shared reference layout. The change is to the copy's size, nothing
    else.
  - >-
    MEASURE THE COPY, NOT THE WHOLE FILE. The file's total time includes ten real
    builds that this change does not touch. Time the copy step specifically, before and
    after, or the saving will be lost in the noise of the builds and the change will
    look like it did nothing.
  - >-
    REVERT ON A NULL RESULT. The criteria require this explicitly because the structural
    argument here is persuasive enough to survive a disappointing measurement if nobody
    writes down in advance that it must not.
  - >-
    THE EDIT SURFACE IS THREE NAMED THINGS IN ONE FILE, AND THEY WERE LOCATED, NOT
    INFERRED. `_copy_package_tree()` at unit_tests/test_bp_900g_8_ii.py line 215 calls
    `shutil.copytree(_REPO_ROOT, dest, ignore=_COPY_IGNORE, symlinks=True)` at line 230;
    `_COPY_IGNORE` is the ignore_patterns at line 150; `_run_build_in_copy()` at line
    234 is the builder. The helper to adopt is `_build_synthetic_full_package` in
    unit_tests/build_guards/test_bp_100k_2.py, which test_acd_2100d_2_i.py loads BY FILE
    PATH under a unique module name rather than importing — copy that loading idiom, it
    exists because these files live in different test directories.
  - >-
    `symlinks=True` IS LOAD-BEARING AND MUST SURVIVE THE SWAP. The current copy
    preserves symlinks. This repository's deployed layout is substantially symlinks —
    `install_shims` creates them, and a worktree whose `.leafcutter` or
    `.pre-commit-config.yaml` symlink is broken silently disables every hook, which
    CLAUDE.md records as a live and repeated incident. If the synthetic helper resolves
    symlinks into regular files, the copy is not equivalent and the swap is not the
    no-op this record assumes. Check this explicitly; it is the most likely way the
    swap changes behaviour without changing a verdict.
  - >-
    TQ-600a-9-iii IS EDITING THE SAME HELPER'S CONSUMERS AT THE SAME TIME. Both records
    depend on `_build_synthetic_full_package`. Neither may change it. If one of them
    turns out to need a change there, the two must be sequenced and the second re-run
    against the first's result, because a helper change breaks both files and neither
    file's tests would attribute it correctly.
  - >-
    DO NOT ROUTE THE COPY TIMING THROUGH THE BUILD COUNTER. `emit_execution_signal`
    counts deploys, not copies, and this record's whole point is that the ten deploys
    are unchanged. Time the copy step directly around the `_copy_package_tree()` call.
