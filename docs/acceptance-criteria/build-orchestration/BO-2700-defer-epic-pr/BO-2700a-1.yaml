  post_write_commands: []
  notes: |
    build-feature.js is a Workflow-engine script (uses injected globals agent()/parallel());
    it is NOT importable as a plain module, so the unit layer cannot execute driveTicketPhases
    behaviorally. Coverage is therefore a STRUCTURAL test (the same pattern as
    unit_tests/workflows/test_fast_lane_ship_structure.py) that parses the JS source and asserts:
    (a) driveTicketPhases's signature includes the isEpicMember parameter; (b) the epic batch
    call site passes true (driveTicketPhases(worktreeTicketPath, true)); (c) a guard filters
    p.agent !== "pull-request" under isEpicMember; (d) the single-ticket call site does NOT pass
    true. This structural coverage is paired with an independent Fable-5 runtime-path review and
    `node --check` rather than a behavioral harness, per the CLAUDE.md workflow-AC caveat.
    The twin build-ticket.js (single-ticket driver) is intentionally out of scope — whether a
    standalone /build-ticket should also defer its PR to finalize is a separate decision.
test_spec:
  - name: test_drive_ticket_phases_has_is_epic_member_param
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    description: "driveTicketPhases signature includes the isEpicMember parameter"
  - name: test_epic_call_site_passes_is_epic_member_true
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    description: "The epic batch call site invokes driveTicketPhases(worktreeTicketPath, true)"
  - name: test_epic_member_filters_pull_request
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    description: "An isEpicMember guard removes the pull-request phase from the dispatched needed phases"
  - name: test_single_ticket_call_site_does_not_defer
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    description: "The standalone single-ticket call site does not pass isEpicMember=true (single-ticket PR behavior unchanged)"
