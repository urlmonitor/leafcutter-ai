it_requirements:
- Reference genre in docs/reference/ (a new sibling page or a section of an existing one, the author's
  choice), within the document-length standard.
- 'Quotes GE-127d-5''s generated measurement-rule statement verbatim (describe_measurement_rule, the text
  of every refusal''s Measures: line), never a paraphrase or a history-specific sentence: the rule leaves
  out every comment, every standalone Python string and every blank line, and a decision-history block is
  left out only as a case of that. Rewrites the existing docs/reference/source-file-length-measurement.md,
  which describes the superseded GE-134a rule.'
- 'The page''s Python and JavaScript examples state their raw and measured counts as the measure gives
  them under the 2026-10-21 rule (re-derive them with the measure before publishing; the old examples''
  counts no longer hold).'
- 'Comparison: GE-127d-5''s parity gate compares only the surfaces listed in file_size.published_rule_surfaces
  (README.md and commit_guardian.json today), resolved relative to the deployed commit_guardian scripts
  directory. A docs/reference page is not in that list, so a verbatim quote can go stale unnoticed. Either
  the page points at the generated statement instead of quoting it, or adding it to the list is decided
  with GE-127d-5''s owner -- a docs/ path does not exist relative to the deployed scripts directory in a
  consumer install, so it cannot simply be appended.'
- Links GE-134a and templates/skills/doc-enforcer/SKILL.md instead of restating the decision-history convention.
