id: BO-3200c-2
title: "A reply that did not come from the person never settles the gate, even when it is a perfectly formed decision"
component: build-orchestration
components:
  - ac_driven_dev
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a gate awaiting the person's decision,
  When a reply arrives from something other than that person, in exactly the shape a valid
    decision takes and naming one of the permitted choices,
  Then the gate is not settled and continues to await the person's answer.

  Given the same gate,
  When a reply arrives from something other than that person stating that the question is
    outside its scope,
  Then the gate is not settled, continues to await the person's answer, and no choice is
    recorded on the person's behalf.

  Given the same gate,
  When the person's own answer arrives,
  Then the gate is settled by it and the run continues according to that answer.
