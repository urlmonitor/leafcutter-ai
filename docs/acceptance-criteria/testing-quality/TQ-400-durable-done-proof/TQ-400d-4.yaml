risk_surface: contract_boundary
notes: |
  Anti-drift, and the same failure class as TQ-400a-3 one layer out. A
  hand-maintained triage list is a fourth reader of the store — after the oracle,
  the sweep, and the trend report — and it will drift, at which point the pile and
  the sweep disagree about what is unproven and neither can be trusted.

  Prove by mutation, in both directions: change the inventory between runs and
  observe records enter and leave the list unaided. Asserting that the list is
  non-empty, or that it was generated from a file with the right name, passes on a
  stale copy that was correct once.

  The two-directional requirement matters — an implementation that only ever adds
  is a common cheap green, and it turns the pile into a ratchet that can never go
  down, defeating TQ-400d-2's progress measure.

  IT-PO ENRICHMENT NOTE (2026-08-17). The derivation obligation is stated in a
  form that cannot be satisfied by inspection: a hand edit to the derived list must
  not survive the next run. That single check separates a live projection from a
  list that was seeded correctly once and maintained thereafter, and it is the only
  clause here that a code reviewer cannot fake agreement with. Also flagged: the
  error path must NOT fall back to a previous run's inventory, because a silent
  stale-inventory fallback reintroduces precisely the drift this AC forbids while
  looking like defensive coding.
