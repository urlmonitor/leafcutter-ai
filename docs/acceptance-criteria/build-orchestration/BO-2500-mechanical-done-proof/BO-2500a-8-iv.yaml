id: BO-2500a-8-iv
components:
  - build_orchestration
  - ac_store
title: "Every unfinished test-free record with no reason gets its own hand-written reason, approved by the user in batches"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the unfinished records declared test-free with no stated reason, measured
    2026-10-25 over docs/acceptance-criteria, active records only, reason counted
    present when non-empty after whitespace stripping: 96 with work_status todo
    (ACD 36, DK 19, BO 17, ACS 14, GE 8, BP 2) and 3 with work_status in_progress,
  When the backfill is carried out,
  Then each record is given a test_rationale written for that record alone, naming
    what its deliverable is and why no executable test can observe it,
  And no two records are given the same text, and no text is produced by filling
    a template from change_target or any other field,
  And proposed reasons are shown to the user in batches, each entry listing the
    record id, its title, its change_target and the proposed reason, and a reason
    is written to a record only after the user has approved the batch holding it,
  And a record for which the user rejects the reason, or for which no honest
    reason can be written because its deliverable has behaviour a test can observe,
    is not given a reason and is listed with that finding for the user's decision,
  And when the backfill ends, every one of the 99 records either carries an
    approved reason or appears on that list with the user's decision recorded,
  And the 46 finished test-free records with no reason are not given a reason by
    this backfill; they go to TQ-400d triage or to the wave-2 migration
    (BO-2500f-4-ii), so a finished claim is never justified after the fact by a
    sentence,
  And the run reports the count of records given a reason, the count listed for a
    decision, and the measurement date and inclusion rule of the starting
    population.
depends_on: [BO-2500a-8, BO-2500a-8-i]
doc_links:
