id: GE-111d-3
readiness: approved
priority: high
title: "The block tells the developer which reconciliation routes apply"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111d.yaml"
criteria: |
  Given the traceability reconciliation check blocks a commit because criterion
    AC-X points at a symbol that moved, and the new location was located
  When the check presents the reconciliation options for AC-X
  Then it offers the update route, naming the suggested new location to point at
  And it offers the confirm route, describing how to affirm the code still
    satisfies AC-X

  Given the check blocks a commit because criterion AC-Y points at source that
    was deleted with no locatable replacement
  When the check presents the reconciliation options for AC-Y
  Then it offers the update route (point at wherever the behavior now lives)
    without a suggested location
  And it offers the confirm route
depends_on:
  - GE-111d
  - GE-111d-1
  - GE-111d-2
doc_links:
