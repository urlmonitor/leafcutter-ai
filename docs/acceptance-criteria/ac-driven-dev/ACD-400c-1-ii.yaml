notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Refines ACD-400c-1.

  WHY THIS IS WORTH ITS OWN RECORD. The unrecognised-value verdict differs between the
  two fields the selection reads, and the difference is only visible once both are
  written down. An unrecognised APPROVAL removes the work from the queue entirely (this
  AC). An unrecognised URGENCY leaves the work in the queue and merely sinks it below
  everything recognised (ACD-400d-4). Same class of author error, two opposite
  consequences, neither stated anywhere before this pass. A reader who learns one and
  assumes the other is wrong in a way that costs them a build.

  THIS IS NOT A REQUEST TO MAKE THE MATCH LENIENT. The criteria state the behaviour that
  ships. Whether a case-insensitive or whitespace-trimming match would be better is a
  product question, and it is a much milder one than the ACD-400d-4 typo question because
  the failure here is loud in the right direction: the work simply does not appear, which
  is the same conservative outcome as an absent approval. No question is escalated for
  this field.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L3.
