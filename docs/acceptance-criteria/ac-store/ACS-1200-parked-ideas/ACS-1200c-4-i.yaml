assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "This AC adds a THIRD state to the report classification introduced by ACS-1200b-2 (orphan / parked / approved-with-nothing-under-it), not a separate branch in scripts/ac_store/scan_ac_orphans.py. The states must remain a partition: BP-900d must land in exactly one section per run, and must not appear as both an ordinary orphan and a contradiction."
  - "The state must be derived from data properties — readiness value plus absence of descendants — never from the record id. A rule keyed to BP-900d by name does not generalise to the next record that reaches the same contradictory state, which is the whole point of naming a real record rather than inventing one."
  - "BP-900d must not be modified by the implementation or by its tests. Its real path is docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900d.yaml; the marker-addition clause must be exercised against a temporary copy, and the committed record must be byte-identical afterwards. This AC requires that the record stays visible and correctly described, not that anyone repairs it."
  - "The report entry must carry the id and the readiness value inline, so the contradiction is legible without opening the file — and must not carry a count or an age of the childless population, which is KM-200c's remit."
  - "The validator half of the criterion is inherited from ACS-1200c-4 and must be exercised through the same predicate — this AC must not introduce its own second implementation of the approved-cannot-be-parked rule."
