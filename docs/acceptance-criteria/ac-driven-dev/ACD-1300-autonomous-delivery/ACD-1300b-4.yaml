it_requirements:
- Use the user-requested isolated accumulating worktree as a scoped exception to ADR-018's independent-clone
  default; do not alter other workflows' isolation policy.
- Claim acquisition/recovery must be atomic and fenced by owner/generation so stale workers cannot continue
  writing; workspace creation must reconcile a prior partial success.
- Enforce protected-target refusal and canonical workspace identity before mutations, with a per-worktree
  single-writer boundary and shared-repository-safe Git operations.
- A worktree cwd is not a security sandbox; delegate tools only through an enforced filesystem/process
  permission boundary established for this run.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300a-2 (data handoff, not an additional build-order prerequisite): Selection
  {feature_id:string|null, ordered_ac_ids:string[], effective_priority:string|null, reasons:[{ac_id:string|null,
  reason:string}], snapshot_revision:string}.'
- 'Runtime interface from ACD-1300b-1 (data handoff, not an additional build-order prerequisite): WorkerSettings
  {enabled:boolean, max_agent_calls:integer>=1, implementation:{executor:string, provider:string, model:string,
  endpoint:string, credential_ref:string|null}, reviewer:{executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, credential_ref:string|null}, settings_revision:string}.'
