id: TQ-500g-1
components:
  - testing_quality
  - build_orchestration
title: "Once the code passes, each wrong version its guarding tests name is applied, run and undone, and one that survives stops the work"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a bug fix that changed the refresh gate from "if refresh_due" to
    "if refresh_due and retry_due", whose guarding test's entry names the wrong
    version "drop the retry_due condition", and whose tests pass on the code as
    written,
  When the work reaches the point after its tests pass and before anything is
    committed, on any build route — the fast lane, /build-feature, a single
    ticket, or /build-epic,
  Then "drop the retry_due condition" and "the fix undone" are each applied to
      the code in turn, the guarding tests are run against each, and the code
      is put back exactly as it was after each,
    And a wrong version that the guarding tests fail to notice stops the work,
      with a report naming the wrong version and the test that let it through,
    And when the guarding tests notice every wrong version, the work goes on
      to be committed,
    And the verdict comes from those runs alone; an agent's statement that its
      tests would catch a wrong version neither passes nor fails the work,
    And tests whose entry names no wrong version and does not declare the
      discrimination angle are not run against wrong versions,
    And every route reaches the same verdict for the same tests and the same
      outcomes, because every route uses the one shared runner.
