title: "The IT product owner writes the declared-files list for every record that changes code or docs, so enriched records reach test design instead of being held"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a code requirement authored through /plan-feature reaches the IT product owner's
    enrichment stage (templates/agents/it-po.md), and the work it describes edits or creates
    files -- for example it edits scripts/build_phases_workflows.py,
  When the IT product owner enriches that record,
  Then the enriched record carries a top-level declared_files list, placed before
    it_requirements, naming every file the record's own change edits or creates, each entry
    {path: <repository-root-relative, forward slashes>, state: existing | to_be_created} in the
    shape docs/reference/ac-schema.md "The declared_files Field" defines,
  And a file the work only reads is not declared (it stays a documentation link), a build
    output is never declared in place of its template source (ADR-001), and an entry marked
    existing names a path that is present in the repository,
  And a record whose work changes no files (for example a pure decision record) carries no
    declared_files key at all, never an empty list,
  And the declared list agrees with the record's it_requirements and with its documentation
    links whose relationship is "modifies",
  And the bug symptom ("Every code requirement authored through /plan-feature reaches the final
    gate held as 'test design pending'. The test-design stage (templates/agents/test-designer.md,
    scripts/ac_store/design_prepass.py) refuses to design a record whose declared_files is
    absent, because it cannot ground code_file or a test directory. Seen 2026-10-21 on
    BO-4500b: all 15 code records were held; the IT product owner had written rich
    it_requirements naming the files (e.g. scripts/build_phases_workflows.py) but no
    declared_files, and they had to be added by hand (commit 3fdeeef8f) before test design
    could run. On main, every record that carries declared_files got it by hand.") must not
    occur.
