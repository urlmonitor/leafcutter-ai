<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fern &amp; Fig — Order confirmed</title>
  <!--
    REFERENCE MOCKUP — screen: order-confirmation
    Populated by hand from docs/product-truth/mock-data/fern-and-fig/catalog.mock.json
    (Customer alex-green + the paid Order 1042 → monstera-deliciosa, EUR 34, with its
    captured Payment pay-1042 / ref auth_9f2a1042). Renders a genuinely-paid order from
    the dataset — Order 1050 is the open cart (pending) used by the cart/declined states,
    so it is not shown here as paid.
    This is the `confirmed` step of both customer-buys-a-plant and its checkout-and-pay
    child flow. Self-contained, low-fidelity, no external assets.
  -->
  <style>
    :root {
      --bg: #f6f5f1; --card: #ffffff; --ink: #23301f; --muted: #6c7a63;
      --line: #e4e1d7; --leaf: #3f6b3a;
      --ok-bg: #e6f0e2; --ok-fg: #2f5a2b; --ok-line: #bcd6b3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    header.site { padding: 28px 32px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
    header.site .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; color: var(--leaf); }
    header.site .tag { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    main { max-width: 640px; margin: 0 auto; padding: 36px 24px 48px; }
    .check { width: 52px; height: 52px; border-radius: 50%; background: var(--ok-bg); border: 1px solid var(--ok-line); color: var(--ok-fg); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 0 18px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 22px; margin-bottom: 18px; }
    .panel h2 { font-size: 15px; margin: 0 0 14px; }
    .meta { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .meta span:first-child { color: var(--muted); }
    .line { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .line.grand { font-size: 18px; font-weight: 700; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    .paid { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; color: var(--ok-fg); background: var(--ok-bg); border: 1px solid var(--ok-line); border-radius: 999px; padding: 2px 10px; }
    .btn { display: inline-block; margin-top: 8px; border: 1px solid var(--leaf); background: var(--leaf); color: #fff; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <header class="site">
    <div class="brand">Fern &amp; Fig</div>
    <p class="tag">Houseplants, delivered.</p>
  </header>
  <main>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Thank you, Alex — your order is confirmed.</h1>
    <p class="sub">A receipt is on its way to alex@fernfig.shop.</p>

    <div class="panel">
      <h2>Order #1042 <span class="paid">Paid</span></h2>
      <div class="meta"><span>Placed</span><span>14 Jul 2026</span></div>
      <div class="meta"><span>Payment</span><span>Card &middot; ref auth_9f2a1042</span></div>
    </div>

    <div class="panel">
      <h2>What you bought</h2>
      <div class="line"><span>Monstera Deliciosa &times; 1</span><span>&euro;34</span></div>
      <div class="line"><span>Shipping</span><span>&euro;0</span></div>
      <div class="line grand"><span>Total paid</span><span>&euro;34</span></div>
    </div>

    <a class="btn" href="#">Track your order</a>
  </main>
</body>
</html>
