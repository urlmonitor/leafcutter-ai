assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "Author under docs/how-to/ with check_doc_frontmatter-compliant frontmatter for docs/** (title, type: how-to, status, created, last_updated, components, description) and stay within the check_doc_length budget."
  - "THE PAGE MUST BE NAMED IN THE GATE'S FAILURE MESSAGE, and the test contract asserts that routing from the real check's output. A remediation page nobody is sent to might as well not exist."
  - "SHOW THE TEST-PROOF FAILURE SIDE BY SIDE, using the real text check_done_proof emits, not a paraphrase. The two failures look superficially identical on a CI page and appear on the same criterion; a reader who cannot tell them apart will 'fix' the wrong one. Reproducing both real messages next to each other is the only form of this that works."
  - "STATE BOTH DIFF-SCOPING FACTS, not just the first: the gate evaluates the criteria a change touched via EITHER route (the criterion's own record, or a changed front-end file that declares or pins it), AND an untouched criterion was never evaluated rather than passed. The second is what turns an apparent regression into the backfill it actually is — without it the likeliest reaction is to hunt for a recent change that caused it, and the next likeliest is to ask for the gate to be turned off."
  - "STATE THE IN-PROGRESS RULE AND WHY IT IS NOT AN ESCAPE: a UI criterion that is not done is skipped, and it comes straight back the moment it is finished (GE-124e-1). Stating it removes the incentive to mark work done to silence the gate, and naming its expiry removes the incentive to leave work unfinished to avoid it."
  - "CARRY GE-124g'S LANGUAGE UNCHANGED — declared, never verified, covered or proven. This page is where a reader most wants the two obligations to be one thing."
  - "change_target stays `code` under the L0's tree-wide instruction; the deliverable is the how-to document."
delivers_to:
  agent: frontend-coder
  contract: "The remediation path out of a reverse-direction failure, written so that clearing it is not mistaken for finishing the criterion and so a first failure on old work is not mistaken for a regression. Reproduces both real gate messages — declaration and test-proof — side by side, and is reachable from the declaration gate's own failure output."
expects_from:
  ac_id: GE-124e-3
  contract: "The failure message and its criterion-id subject that this how-to is reached from, plus the banned-vocabulary constraint its wording must respect"
test_spec:
  - name: test_ge_124e_5_gate_failure_message_routes_to_this_page
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "Run the real reverse-direction gate over an undeclared done UI fixture and assert its failure output names this how-to's path. Routing lives in the check, not in the document, so it must be asserted from the check's real output."
  - name: test_ge_124e_5_page_reproduces_both_real_gate_messages_and_they_differ
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "Capture the real messages from check_ui_ac_declared and from check_done_proof for the same criterion and assert both appear in the page, and that they are not identical. If the two real messages ever converge, this test fails and the page's whole purpose is void — which is information worth having."
  - name: test_ge_124e_5_page_states_both_diff_scoping_facts
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "The page states both routes into the evaluated set (own record changed; changed front-end file declares or pins it) and states that an untouched criterion was not evaluated rather than passed. The second clause is the one that turns an apparent regression into a backfill."
  - name: test_ge_124e_5_page_states_the_in_progress_skip_and_uses_no_proof_vocabulary
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "The page states that an in-progress UI criterion is skipped and returns when finished, and contains no sentence describing the gate's pass as verified, covered, proven or tested. Same banned-word set as GE-124g-2, applied to the reader-facing page."
test_rationale: |
  This page exists because two CI failures on the same criterion look alike, so the only test
  that proves it does its job is one that captures BOTH real messages and confirms the page
  carries both and that they differ. Paraphrases drift, and a drifted paraphrase is worse than
  nothing here — it sends the reader looking for wording that no longer appears. The routing
  test asserts from the check's side, because a remediation page nobody is routed to is not a
  remediation path. The two content tests cover the clauses with no executable counterpart, and
  both target documented reader reactions: hunting for the recent change that "broke" a legacy
  criterion, and marking work done to silence the gate.
