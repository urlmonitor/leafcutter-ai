criteria: |
  Given an author writing a check,
  When they open the reference documentation for what a check may report,
  Then it defines three answers — the subject is in order, the subject has a problem, and the
    inspection could not be performed — states that the third is required whenever the
    inspection did not happen for any reason, states that the third stops the work just as the
    second does, and states that the advice accompanying the third describes restoring the
    inspection rather than changing the subject.

  Given the reference documentation,
  When each rule it states is applied to a check and that check is driven into the
    corresponding state,
  Then the check behaves as the documentation says it will.

  Given the reference documentation,
  When it is read alongside the existing guarantee that a failed inspection must not report a
    clean pass,
  Then it states that both directions are required and that neither replaces the other.
