title: "Automatic retry attempts commit again after recoverable hook failure"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a commit attempt fails because a pre-commit hook reported a fixable violation,
  When the system detects the failure is recoverable (hook exited with a fix applied),
  Then it re-stages the corrected files and attempts the commit again,
  And it retries at most 3 times before reporting permanent failure,
  And if all retries are exhausted, it rolls back to the pre-commit state
    and reports the accumulated errors from each attempt.
depends_on: [BO-200b, BO-200b-2]
