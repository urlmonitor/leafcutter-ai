id: BO-4300c-2-ii
title: "A refusal names the step that failed and never repeats the tools' own words"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
criteria: |
  Given underlying tools that write their own error text when they fail, such as
    a line beginning "fatal:",
  And three requests that each fail at a tool step: a new workspace whose shared
    project cannot be reached, clearing a workspace together with its line on a
    shared project that refuses to delete that line, and the cut-over bringing
    over an old-style workspace whose shared project cannot be reached,
  When the maker answers each request,
  Then each answer's message names the step that failed,
  And no answer's message, and no reason in the cut-over's report, contains any
    line the tool wrote,
  And the tool's own text is still available on the maker's separate diagnostics
    channel.
depends_on: [BO-4300c-2, BO-4300e-2-iii]
