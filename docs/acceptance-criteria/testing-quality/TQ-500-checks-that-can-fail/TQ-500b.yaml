roadmap_phase: phase_1
criteria: |
  Silence about the evidence is never read as approval.

  When neither the ordinary demonstration nor its substitute was captured, the
  work is reported as incomplete and says so in those words. Today the same
  situation is recorded in a way that reads as "correctly not applicable", which
  is how a test that can never fail collects a clean bill of health from every
  stage it passes through.
