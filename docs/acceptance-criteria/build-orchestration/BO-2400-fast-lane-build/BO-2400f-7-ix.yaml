id: BO-2400f-7-ix
components:
  - build_orchestration
title: "The lane reads the claim's reply on any exit status, and declined, ran-and-failed and held end as three different halts"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the claim step's reply is a decline that carries no exit status (BO-2400a-1-i),
  When the run reads it,
  Then it halts saying the claim was never attempted, naming the agent asked and quoting its
    reason (BO-2400f-7-iii).

  Given the claim step's reply carries a non-success exit status, and neither output stream
    holds a held outcome naming at least one member — for example exit status 1 with a
    traceback on standard error and nothing on standard output,
  When the run reads it,
  Then it halts saying the claim command ran and failed, naming the exit status and quoting
    standard error,
  And it does not say the claim was never attempted, and does not say anything is held,
  And the claim is reconciled as BO-2400f-10-iv requires.

  Given the claim step's reply carries an exit status and its output holds a held outcome
    naming XY-100a-1 and XY-100a-2 as held, with the target marked refused,
  When the run reads it,
  Then it halts saying the claim is held, naming XY-100a-1 and XY-100a-2,
  And the halt carries the claim command's outcome unchanged,
  And it says this run did not find out who holds them, and that the remedy is to wait for
    the run that holds them or, if no run does, to return them to todo,
  And it does not say the claim was never attempted,
  And no release is asked for, because this run claimed nothing and a release would return
    another run's claim to todo.

  Given any claim-step reply,
  When the run classifies it,
  Then it ends in exactly one of five outcomes — a usable claim (BO-2400f-7-iv), declined,
    ran and failed, held, or state unknown (BO-2400f-7-vii) — each with its own halt kind,
  And no held halt names zero held members (BO-2400f-7-iii).
depends_on: [BO-2400f-7, BO-2400f-7-iii, BO-2400f-7-iv, BO-2400f-7-vii, BO-2400f-7-viii]
