  validator's verdict, the generator's output checked against its schema, or the
  existing lockstep check — none needs a search of template text.

  IT-PO ENRICHMENT (2026-09-25)

  MIXED SURFACE, KEPT AS ONE AC. The edits are two .json schemas, a .py mirror and one
  YAML entry in templates/agents/test-writer.md. Under the user's routing rule, template
  text goes to llm-expert. It stays with python-coder because (1) the existing lockstep test
  makes the three edits atomic: a split leaves main red between the two merges; (2) S2.8:
  python-coder can act on .md, but llm-expert cannot act on .json/.py; (3) the criteria dictate
  the entry's text, so it needs no prompt-craft judgement. The substantive teaching is
  TQ-500f-4 (llm-expert). Raised to the user as an open question because it puts an
  agent-template edit in the fast lane.

  INTENDED must_catch (not a schema field yet; for the test writer):
    - "add discrimination to ac_store_schema.json only" -> the generated-ticket seam test goes red
    - "add to both schemas but not the generator's angle mirror" -> the generator/done_proof test goes red
    - "validator accepts any string for angle" -> the validator CLI test goes red
    - "misspell the taught-set key" -> the lockstep/taught-set test goes red

  IT-PO PASS 2 (2026-09-25): the open question is resolved as recorded in the first
  it_requirement. This AC is built manually as one change (test-writer -> python-coder -> llm-expert)
  and is never pointed at by the fast lane. The fast-lane remark above is superseded.
