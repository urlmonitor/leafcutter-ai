notes: |
  Three paths, each an adversarial reading of ACS-100i-8.

  Scenario 1 is the difference between omission and denial. Both must be
  refused, but they are different acts and the message should say which one it
  saw: an omission is an oversight, a `false` on a change that adds a
  registration is a contradiction a reviewer needs to read as such.

  Scenario 2 is the hole flagged as Concession 2 on the parent, closed rather
  than merely documented. Note the cost, and confirm it before building: this
  refuses any package-registry addition not traceable to an acceptance
  criterion. That is consistent with the standing project rule that new work
  goes through acceptance criteria, but it is a real blast radius — every
  registry edit made outside the AC path stops working. If that is judged too
  aggressive, the alternative is to accept scenario 2 as an open hole and say so
  in the known-issues entry; what is NOT acceptable is leaving it unstated,
  because an uncited change is precisely how an undeclared surface would arrive.

  Scenario 3 stops the check being over-strict in the ordinary multi-AC case,
  where one behavioural AC declares the surface and its siblings do not.
