title: "Implementation agents are rejected when touching protected requirement fields"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an existing AC YAML file has one or more of the following fields changed
    in the staged diff: criteria, title, req_status, or depends_on,
  When the committing agent is an implementation agent
    (e.g. python-coder, test-writer, sql-coder, commit, pr-reviewer),
  Then the commit is blocked,
  And the error message names the agent, the file path, and each protected field
    that was modified,
  And the error distinguishes "requirement-defining fields" from
    "progress-reporting fields" in its explanation.
