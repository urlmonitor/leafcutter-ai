title: "A resumed /plan-feature run treats the committed hand-back design as done and does not design or commit it again"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given a /plan-feature run "pf-demo-1" on its authoring branch for the batch ACD-9990a-1,
    ACD-9990a-2 and ACD-9990a-3, where ACD-9990a-2 carries one undecided file finding,
    and the run has committed the test-design output as its hand-back design commit
    (labelled test-design-handback, naming those 3 AC ids and run id pf-demo-1),
    and the run then paused or its process ended before the planner's hand-back round
    finished, so the branch has no final test-design commit,
  When the run is started again on the same authoring branch,
  Then the test-designer is not dispatched again for the batch,
  And no second hand-back design commit is made: the branch carries exactly one
    hand-back design commit for pf-demo-1,
  And the run continues with the planner's hand-back round for ACD-9990a-2's undecided
    finding and then runs the requirement rule check for the hand-back stage
    (itpo-handback), with the hand-back design commit as its before-state,
  And when that check passes, the run reaches the final gate offering the 3 AC ids,
  And given instead the branch carries a final test-design commit for pf-demo-1 and no
    hand-back design commit,
  When the run is started again,
  Then that commit is read as the completed test-design stage and not as the hand-back
    design, so no hand-back round is started on resume because of it,
  And given instead the branch carries only the hand-back design commit,
  When the run is started again,
  Then that commit is not read as the completed test-design stage, so the final gate and
    the final test-design commit are still ahead of the run.
