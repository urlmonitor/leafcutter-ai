    angle: real_artifact
    description: "Runs the migration twice against the same real-shaped record files and diffs the files: only the target keys were inserted by the first run, the second run changes no byte, and no record is re-serialised by a load-and-dump."
    proves_clause: "each record ends in exactly one of two states: carrying a verification record that holds under BO-2500f-4, or returned to in_progress through the demotion path TQ-400b defines, with the reason and the date recorded on it"
    code_file: scripts/ac_store/migrate_verification_records.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_4_ii_each_decision_is_entered_in_the_worked_list
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: "For one record of each end state (prove it, redo it, retire it) the worked list of TQ-400d-1 gains an entry carrying the decision; the producer is the real migration, the consumer the real worked-list reader. Waits for TQ-400d-1."
    proves_clause: "each record is entered in TQ-400d's worked list with its decision (prove it, redo it, or retire it), so progress on this population is counted where the unproven-finished pile is already counted"
    code_file: scripts/ac_store/migrate_verification_records.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_4_ii_no_verification_record_is_written_that_was_not_verified
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: discrimination
    description: "With no qualifying approval file and no wired check carrying an enforces tag, the migration proposes only and the record files are byte-identical afterwards; with a qualifying approval or wired tagged check present, only that record gets its verified_by."
    proves_clause: "no verification record is produced from a template: an inspection is recorded only through a review approved as BO-2500f-3-i requires, and a check only where a wired check carries an enforces tag for the record"
    code_file: scripts/ac_store/migrate_verification_records.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
    must_catch:
      - "a migration that writes a templated inspection or check record"
      - "a migration that writes without the user's per-batch approval"
  - name: test_bo_2500f_4_ii_turning_the_switch_on_is_refused_while_any_record_remains_naming_them
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "Real precommit CLI subprocess in a temporary git repo: staging the switch turned on while one finished test-free untagged record has no holding verification record exits 1 naming that record; with none remaining it exits 0; with the switch left off nothing is refused."
    proves_clause: "while any record in the population is still finished with no verification record that holds, the new done rule (BO-2500f-4) does not take effect, and the change that would switch it on is refused, naming the remaining records"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
    convention_test_file: unit_tests/commit_guardian/test_done_proof_test_required_rationale_gate.py
    must_catch:
      - "a guard that checks the switch value but not the remaining population"
      - "a refusal that does not name the remaining records"
  - name: test_bo_2500f_4_ii_finished_records_that_a_test_tags_come_out_untouched
    target_dir: unit_tests/ac_store/
