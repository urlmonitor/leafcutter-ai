notes: |
  Owns the FIX/AUTOFIX route (route 1 of GE-117e). Component inference reuses the
  components.json directory_patterns precedent the PO tied it to (same field
  /quick-fix uses) — unambiguous single-match auto-inserts. The AC inference draws
  on the surrounding commit/ticket context when it supplies a single AC. The
  ambiguous / no-confident-inference case is GE-117e-1-i (prompt, do not guess). The
  observable outcome is behavioral: after autofix, the same commit's re-check passes.

  IT-PO ENRICHMENT NOTE (2026-07-02, user-confirmed): the PO/BA note above conflated
  two registries. directory_patterns lives in docs/acceptance-criteria/index.yaml
  (ids like 'guardrail-engine'), NOT in docs/components.json (ids like
  'commit_guardian') which is the VALIDITY target for module-component declarations.
  The two id namespaces do not map 1:1, so index.yaml directory_patterns cannot infer
  a valid components.json id. Component auto-inference is therefore a PREREQUISITE
  (add a pattern-based inference to components.json, or a components.json<->index.yaml
  bridge); until then the module-component autofix PROMPTS (GE-117e-1-i). AC-ref
  inference via _load_ac_by_id is unaffected. Captured in it_requirements above.
