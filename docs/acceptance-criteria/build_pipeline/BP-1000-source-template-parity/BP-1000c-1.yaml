criteria: |
  Given the merge-gate parity check has found that one or more mirrored
    source-template script pairs are not byte-identical
  When the check reports the failure
  Then the failure output names the specific path of every drifted file (both
    the canonical source path and its shipped template counterpart)
  And for each drifted pair it shows the line-level difference between the
    shipped copy and its tested source
  And when more than one pair drifted, every drifted pair is listed, not only
    the first one found
