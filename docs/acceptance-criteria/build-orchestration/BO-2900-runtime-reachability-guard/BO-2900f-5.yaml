it_requirements:
  - "Create docs/reference/gate-outcome-records.md as a REFERENCE — the contract as it is, for a reader who needs to know what a record means. It is NOT a how-to: the diagnostic walkthrough for 'my check did not run' is BO-2100d-4's and must be linked, never restated. The audience split is the usual one and it is real here: the how-to serves someone who has just been surprised, this page serves someone deciding whether a record set is complete."
  - "Document the record shape exactly as implemented, not as designed: the fields of a requested-gate record ({ gate, outcome, reason, source }), the outcome vocabulary including `skipped`, and the rule that reason and source are both required and non-empty on a skipped entry — reason naming the disabling condition, source naming where it was read from."
  - "STATE THE TWO SENSES OF `skipped` IN ONE EXPLICIT PARAGRAPH. BO-2100b-2 uses the word behaviourally ('the live-app check is skipped for that ticket' when the ticket does not opt in) and this contract uses it as an outcome VALUE. They are opposites at the record level: the behavioural sense produces NO entry, the outcome sense produces one. This is the single most likely misreading of the whole contract and the one that turns the record into noise on every work item — do not leave it to inference."
  - "Document the denominator rule (the requested set, captured before the enablement filter) together with the gate D negative (a gate the work item never requested produces no entry). The two only make sense as a pair; stating the first alone reads as 'record every gate in the project'."
  - "Document the one-entry-per-requested-gate rule AND the halt carve-out from BO-2900f-2-i with BOTH its halves: zero entries plus a recorded halt naming the stopping point is legitimate; zero entries with no halt record is a defect. Publishing only the permissive half turns the carve-out into the documented excuse for every gap."
  - "State that a skipped outcome is never counted as a pass in any roll-up and never makes a work item done-eligible, and name the two exits verbatim from BO-2900f-3: run the gate to a pass, or an explicit recorded re-classification. Say plainly that the skip cannot clear itself — the reader most likely to consult this page is the one hoping it can."
  - "Record the double-recording trap as a named hazard, not a footnote: a skip-branch record requires the pre-existing unconditional record after the if/else to be conditionalized in the same change. Include the reason the original guard missed it — the count regex matched only quoted-string arguments and was blind to template literals — and cross-reference CLAUDE.md 'Skip-Branch Side-Effects'. A reader who sees only 'records exactly once' has the rule without the reason it is hard."
  - "NAME THE SIBLING, DO NOT MERGE IT. BO-1000b-1-i's finalize-workflow per-step record is a different producer on a different surface with the same completeness instinct. State that they are two mechanisms, that neither is an implementation of the other, and that a change to one does not propagate — this is the paragraph that stops a future reader from 'unifying' them."
  - "Cross-link docs/reference/build-telemetry.md rather than duplicating any JSONL record schema, and position the outcome vocabulary against the signoff skill's four-value enum explicitly so a reader who knows that enum does not read `skipped` as a variant of `not_needed`."
  - "SURFACE-DEPENDENT — ONE SECTION CANNOT BE WRITTEN YET. The 'where the record lives' section depends on the user's unresolved choice between the git-tracked ticket surface and a durable JSONL sink; it is the only part of this page with no surface-agnostic form. Draft everything else and hold that section. Do not paper over it with a phrase like 'the recorded results', which is what the criteria had to do and what this reference exists to resolve."
  - "Register in docs/INDEX.md and satisfy check-doc-frontmatter, check-doc-length and check-doc-index."
