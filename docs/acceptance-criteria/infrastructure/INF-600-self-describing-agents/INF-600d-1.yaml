id: INF-600d-1
title: "spawn_allowlist excludes agents whose capability is performed via a skill rather than delegation"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given an agent (e.g. "python-coder") that performs test execution
    directly via its own Bash tool calls (running pytest itself)
    rather than spawning a separate "test-runner" agent
  When the agent's registry entry is inspected
  Then spawn_allowlist does NOT include agents whose work
    the agent performs itself via a skill or direct tool invocation
  And specifically: if the agent runs tests directly (via a skill
    or via inline pytest invocation), "test-runner" is absent from
    its spawn_allowlist
  And the skill-based capability is reflected in skills_invoked
    (e.g. a "run-tests" skill entry) rather than in spawn_allowlist
  And the spawn diagram generated from this registry entry does NOT
    show a spawn edge to the agent whose capability is self-performed
