criteria: |
  Given an epic folder path for which git cannot determine any commits
    (the folder has been moved and no rename history is available),
  When extract_epic_facts.py is run against that path with no
    --first-commit or --merge-commit overrides,
  Then the script exits with code 1,
  And stderr contains a warning message that includes the epic path
    and states that dates could not be determined,
  And stderr mentions the --first-commit / --merge-commit override
    as a recovery option.
