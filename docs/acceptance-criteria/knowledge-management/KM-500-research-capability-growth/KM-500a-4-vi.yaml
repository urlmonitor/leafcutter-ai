  relevance: Parent requires frozen cases and thresholds before scoring the proposed planner.
- path: docs/reference/knowledge-retrieval-answers.md
  relationship: context
  status: exists
  relevance: Existing version identities that a configuration identity is built from.
assigned_agent: python-coder
estimated_complexity: M
declared_files:
- path: knowledge/evaluation_holdout.py
  state: to_be_created
- path: integrations/kernel_path_evaluation.py
  state: to_be_created
