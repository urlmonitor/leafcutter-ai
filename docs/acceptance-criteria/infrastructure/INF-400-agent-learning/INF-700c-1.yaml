id: INF-700c-1
components:
  - infrastructure
  - knowledge_system
title: "A record with no learning in it is never turned into a line on a curated knowledge file"
component: infrastructure
level: L2
status: active
req_status: active
work_status: done
priority: medium
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700c.yaml"
criteria: |
  Given a knowledge record that carries only descriptive fields — the agent,
    the component, a destination and a kind — and no learning text,
  When the writer that appends learnings to knowledge surfaces processes that
    record,
  Then nothing is appended to any knowledge surface,
  And no stand-in line is synthesised from the record's descriptive fields to
    occupy the place the learning would have taken,
  And the file named as that record's destination is byte-for-byte unchanged
    after the run, whether or not it already existed,
  And the run reports that record in a count of records carrying no learning,
    kept separate from the count of records written and the count of records
    that could not be routed,
  And a run whose entire input is records of this shape writes to no file and
    creates no file.
