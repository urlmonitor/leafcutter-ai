notes: |
  Authored by /quick-fix. Root cause: The status-checker agent sometimes returns its reply nested one level too deep: the JSON it puts in the envelope's `output` field is itself a complete {"output": "<raw stdout>", "exit_code": 0} envelope rather than the raw stdout. repoFactsCall parses r.output once, gets {output, exit_code} instead of the facts object, so base.worktree_base and rf.exists are undefined and every caller treats the facts as unavailable. Fix: after parsing, when the parsed value is itself an envelope (a string `output` field alongside an `exit_code`), parse that inner `output` once more and return the result; a genuine facts object is returned unchanged, and unparseable input still returns null so the guard still refuses rather than guessing. Keep the change within the existing line count: templates/workflows-js/build-feature.js is already over the .js size limit, so it must not grow..

  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — parse the envelope's output exactly once (the incident behaviour). Caught by
         test_double_wrapped_facts_envelope_still_yields_the_facts_object.
    M2 — always parse twice. Caught by
         test_plain_facts_envelope_is_parsed_once_and_returned_unchanged.
    M3 — on an unparseable or failed read, fall back to a default worktree base instead
         of returning null. Caught by
         test_unparseable_or_failed_facts_read_still_refuses_without_guessing.

  This record does not change worktree_repo_facts.py, and it does not change which facts
  the worktree step demands. Only the caller's reading of the relayed reply changes.
