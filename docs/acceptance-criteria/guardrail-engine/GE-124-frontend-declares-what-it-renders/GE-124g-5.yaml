risk_surface: contract_boundary
notes: |
  Produced for GE-124g's `documentation_triggers: [reference-doc]`. The PO's
  reason: this is a standing rule about what each kind of evidence is worth,
  binding on future authors of all three traceability checks and on anyone
  adding a new coverage report. A how-to aimed at one task cannot carry it.

  THE REACHABILITY CLAUSE IS THE ONE THAT DECIDES WHETHER THIS WORKS. A standing
  rule nobody encounters is a rule that gets rediscovered as a defect. The
  binding surfaces are the three checks themselves, which is where an author of
  the fourth one will be looking.

  WORDING THE DOC SHOULD NOT DRIFT FROM, per the PO: presence, not proof. On
  screen, not correct. A signpost, not a result.

  IT-PO NOTE (2026-08-25). Reachability is a change to the three CHECKS, not to
  this document — each needs a link added to its docstring or help output. That
  is a small edit in three files, but it is edit work in GE-111's and GE-117's
  code as well as GE-124's, and it is the clause most likely to be quietly
  dropped because it lives outside the deliverable.
