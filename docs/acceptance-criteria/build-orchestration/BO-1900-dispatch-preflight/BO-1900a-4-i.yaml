  constraints:
    - "ASSERT ON WHAT WAS DISPATCHED. The harness records the phase agents a run actually spawned; that list is the assertion. A test that greps the driver for a guard string passes on a guard that is computed and ignored -- the failure this repository has already shipped once in a runner built specifically to prevent phantom-done."
    - "NO AMBIENT FALLBACK. Resolving an undetermined working copy to the process's current location is the single most likely wrong implementation, is invisible in a passing test suite, and is precisely how a phase agent ends up committing into the shared clone. Assert negatively that the ambient location is not used."
    - "THE POSITIVE PATH IS PART OF THE GATE. Once the working copy is established the phase must dispatch. Without that assertion, a gate that refuses unconditionally passes the negative case and deadlocks every drive -- the same trap the pre-coder gate hit and had to be widened for."
    - "BOTH TWINS IN ONE CHANGE."
