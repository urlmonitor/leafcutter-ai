change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a composite acceptance criterion
    And its children record their proof as test-file paths in covered_by, the convention
      a leaf uses
  When the done-proof oracle flattens that composite to its leaf descendants
  Then each such child is classified as a leaf and returned
  And the composite is not reported as having no coverable children.

  Given a composite whose child is itself a genuine composite — its covered_by naming
    further acceptance criteria that resolve in the store
  When the same flattening runs
  Then that child is expanded rather than treated as a leaf
  And the leaves returned are its descendants.

  Given a child that resolves to no acceptance criterion at all
  When the flattening runs
  Then it contributes nothing, as before.
