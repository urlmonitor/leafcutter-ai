title: "The proof-of-done gate scans the same tree whether it runs locally or in CI"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given check_done_proof.py resolves its scan root from --test-root, falling back
    to a built-in default when the flag is absent,
  And the pre-commit hook entry in commit_guardian.json passes --test-root .
    explicitly, because a Python-only default cannot see "// covers:" tags in
    JS/TS tests (BO-2500e-5) and is wrong for consumer projects whose tests do
    not live in that directory,
  And the CI invocation passes no --test-root at all, so it silently takes the
    built-in default,
  When the gate runs with no --test-root supplied,
  Then it scans the whole project from the repository root, exactly as the
    pre-commit hook does with an explicit --test-root .,
  And a "# covers:" tag placed in any test directory of the project — not only
    the one named by the old default — is found and counted as proof,
  And a "// covers:" tag in a JS/TS test is likewise found, so a JS-covered AC
    is not reported unproven merely because the default directory holds no
    .ts files,
  And directories that are not source (node_modules, .next, dist, coverage,
    .git, __pycache__, .venv) remain excluded from the scan,
  And an explicit --test-root still overrides the default, so a caller that
    wants a narrower scan can still ask for one,
  And the bug symptom ("the local hook and the CI gate disagree about which
    tests count as proof, because only one of them passes --test-root") must
    not occur.
