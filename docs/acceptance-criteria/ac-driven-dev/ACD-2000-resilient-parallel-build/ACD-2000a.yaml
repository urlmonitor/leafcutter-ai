criteria: |
  Every failed attempt, retry and decision is recorded on the requirement itself.

  What was tried, what failed, and what was decided about it lives with the
  requirement, so whoever picks the work up next can see how many attempts have
  already been made without reconstructing it from memory. Because that count is
  durable, the system knows when it has retried enough and needs to stop and ask
  a person, instead of looping forever or giving up on the first stumble.
