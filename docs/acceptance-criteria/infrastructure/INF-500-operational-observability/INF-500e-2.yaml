it_requirements:
  - "Unknown must be represented as Python None all the way from collection to rendering, and never as 0, -1 or an empty string in the payload. The three formatters in scripts/agent-health/weekly_health.py are the single choke point: _int(value) renders None as an em dash and 0 as the string 0; _num and _pct follow the same rule; _render_tsv(report) emits an EMPTY cell for None and the literal digits for a measured value."
  - "Every derived figure must propagate unknown rather than absorbing it. weekly_health.py::_ratio_of(numerator, denominator) must return None when EITHER operand is None and must compute normally when both are known. A derived figure that silently substitutes 0 for an unknown operand is the defect this record exists to prevent, and it is invisible in the rendered output."
  - "The machine-readable rendering must carry the availability fact as its own column (prs_available) alongside the empty cell, so a consumer of the TSV can distinguish unknown from zero without parsing a dash. Do not encode availability only in the human-readable Markdown."
  - "The autonomy summary is weekly_health.py::collect_lane_health(telemetry_path) and must return available, reason, lanes, starts, successes, halts, completion_rate and event_total. available must be derived from starts > 0, NOT from the sink file merely existing: a sink holding events none of which are lane-run events is unavailable, and its reason must state the total event count and that none are lane-run events. Reporting 0% completion there would assert that runs were attempted and all failed, which is a different and false claim."
  - "The absent-sink and no-lane-event branches must give DIFFERENT reasons, and both reasons must be non-empty. The absent-sink reason must name the path. An operator reading only the reason must be able to tell an unwired emitter from a missing file."
  - "Reading the sink must tolerate a corrupt line: a line that fails json.loads is skipped and the surrounding records still count. Per the project error-handling policy the file read is wrapped and any OSError is logged at WARNING rather than swallowed, and a malformed line must never abort the section."
  - "The per-lane aggregates must be obtained by reusing build_lane_comparison_report from scripts/agent-health/generate_health_report.py rather than re-reading the sink, so the two reports cannot disagree about the same file. Keep that import if the lane schema changes."
  - "The lane-event vocabularies (_LANE_START_EVENTS, _LANE_SUCCESS_EVENTS, _LANE_HALT_EVENTS) are provisional: nothing has ever emitted a lane event, so they are unverified against real data. Treat a change to them as a change to the meaning of the autonomy tier, and confirm them against what the fast lane actually writes before relying on the section — a drift makes the tier report no lane data while events are arriving."
test_spec:
  - name: TestUnknownIsNotZero::test_tsv_renders_unknown_pr_counts_as_empty_not_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Renders a real report payload through _render_tsv and reads back the named cells: prs is empty, prs_available is False, and the measured commits cell still reads 69."
  - name: TestUnknownIsNotZero::test_tsv_renders_a_real_zero_as_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A genuinely-obtained zero renders the prs cell as 0 while the unobtained cycle_median cell renders empty, in the same row."
  - name: TestUnknownIsNotZero::test_int_formatter_distinguishes_unknown_from_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "_int(0) is the string 0 and _int(None) is a dash."
  - name: TestUnknownIsNotZero::test_ratio_of_propagates_unknown_numerator
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "_ratio_of(None, 10) is None — an unknown numerator propagates instead of being read as zero."
  - name: TestUnknownIsNotZero::test_ratio_of_propagates_unknown_denominator
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "_ratio_of(5, None) is None — an unknown denominator propagates instead of being read as zero."
  - name: TestUnknownIsNotZero::test_ratio_of_computes_when_both_known
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "_ratio_of(5, 10) is 0.5, so propagation is a real branch and not a blanket None."
  - name: TestCollectLaneHealth::test_sink_with_no_lane_events_is_unavailable_not_zero_percent
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "A temporary sink holding two non-lane events reports available False, completion_rate None, event_total 2, and a reason naming that none are lane-run events."
  - name: TestCollectLaneHealth::test_absent_sink_reports_unavailable_with_a_reason
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: failure
    description: "A non-existent sink path reports available False with a reason stating the sink is absent."
  - name: TestCollectLaneHealth::test_lane_events_produce_a_completion_rate
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: criterion
    description: "A sink with 2 starts, 1 success and 1 halt reports available True and a completion rate of 0.5, proving the unavailable path is not the only reachable one."
  - name: TestCollectLaneHealth::test_malformed_line_is_skipped_without_raising
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: failure
    description: "An unparseable line between one start and one success is skipped; the summary reports 1 start and 1 success and raises nothing."
test_rationale: |
  The rendering descriptors drive _render_tsv with a real report payload and read
  back named cells by header index, rather than asserting on the source of the
  formatter. That matters here because the defect this record guards against —
  an unknown printed as 0 — is only observable in the rendered row; a test that
  inspected the formatter in isolation would pass on a renderer that never called
  it. The lane descriptors write actual temporary JSONL sinks and read them back
  through collect_lane_health, so the absent-file, no-lane-event, healthy and
  corrupt-line branches are each executed against a real file rather than a
  mocked reader. Each unknown assertion is paired with a measured-value assertion
  in the same test or the same class, because an implementation that rendered
  everything as a dash would satisfy an unknown-only contract and destroy the
  report.
