criteria: |
  Given a requirement declares 2 existing files, neither of which contains the behaviour its
    criteria change, and the behaviour is found in a third file,
  When the file-aware step runs,
  Then it reports a surface mismatch naming the 2 declared files and the third file where
    it found the behaviour,
  And the declared files of the requirement are unchanged by the step,
  And the requirement is not offered for approval until the mismatch is resolved.
