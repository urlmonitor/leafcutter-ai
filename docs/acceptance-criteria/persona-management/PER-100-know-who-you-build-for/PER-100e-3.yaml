criteria: |
  Given an AC store where 8 ACs reference persona_for: "field-service-engineer"
  And those 8 ACs span components: build-pipeline (3), persona-management (2), infrastructure (3)
  When the persona expert agent is invoked with: "Review what we are building for field-service-engineer and suggest persona refinements"
  Then the agent reads all 8 ACs and their criteria
  And produces a structured suggestion containing:
    - Patterns observed: themes across the AC criteria (e.g., "5 of 8 ACs relate to offline capability")
    - Suggested additions: new goals or frustrations that emerge from the pattern
    - Coverage gaps: persona sections (e.g., "marketing") that have no corresponding ACs
  And the suggestion is presented to the user for approval before any persona file is modified
