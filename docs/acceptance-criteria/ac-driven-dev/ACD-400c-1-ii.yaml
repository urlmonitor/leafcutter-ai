assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Every pytest invocation used to run or verify this test must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "The verdict must be obtained by executing the scanner over a temporary store through its real command surface; no assertion about the source text of scan_ac_store.py satisfies this AC."
  - "The trailing-whitespace fixture must survive the round-trip to disk with its trailing space intact. A YAML writer or reader that trims it turns this test into a duplicate of the exact-match case and the near-miss it exists to catch is never exercised — assert the value as loaded back from the fixture file before asserting the scanner's answer."
  - "Both near-miss records must be asserted absent from BOTH returned lists, not merely absent from the offer. An unrecognised approval withholds; it does not demote. This is the opposite verdict to the one ACD-400d-4 pins on the urgency field, and conflating them is the specific error this AC guards."
  - "This AC authorises no change to the matching rule. Whether the comparison should tolerate case or whitespace is a product question the BA deliberately did not escalate for this field; a lenient match must not be introduced under cover of making this test pass."
test_spec:
  - name: test_capitalised_and_whitespace_padded_approvals_do_not_count_as_approval
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: boundary
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "Leaves recorded 'APPROVED' and 'approved ' alongside one recorded 'approved': only the exactly-matching id is offered, and both near-misses are absent from the offered list and from the held list."
  - name: test_a_near_miss_approval_is_withheld_not_demoted
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "The near-miss records are absent from both lists rather than present-and-ranked-last, distinguishing the approval field's withholding verdict from the urgency field's demotion verdict."
test_rationale: "Asserting only that the near-misses are missing from the offer would also pass on an implementation that demoted them into the held list, which is the urgency field's posture and the wrong one here. Reading both lists is what pins the verdict as withholding."
