criteria: |
  Given a document as it is handed to the author,
  When the author reads it before writing anything,
  Then every part of it is in one of exactly two states and which state it is in
    is visible from the document alone: produced, and not the author's to rewrite;
    or left for the author, carrying a prompt that says what belongs there,
  And no part of the document is in neither state or in both,
  And an author who replaces every prompt with content and changes nothing else
    obtains a document that still passes the project's full set of commit-time
    checks,
  And a document still carrying an unreplaced prompt is distinguishable from a
    completed one by reading the document alone, without comparing it to anything
    else,
  And the prompts say what belongs in each place, not merely that something does.
