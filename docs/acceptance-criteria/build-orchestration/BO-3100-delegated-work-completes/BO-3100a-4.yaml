notes: |
  Satisfies the reference-doc entry in BO-3100a's documentation_triggers.

  THE SECOND SCENARIO IS THE REASON THIS IS NOT PROSE-ONLY. The parent goal exists because a
  written rule stayed on the page while the behaviour drifted away from it — the
  building-epics synchronous-dispatch rule was correct, in force, and did not fire. A
  reference doc whose behavioural claims are each executable against the real assembly
  cannot rot silently: the claim and the check disagree and something fails.

  Depends on both mismatch directions because the doc must describe both failures and their
  different repairs; writing it before BO-3100a-1-i exists would document half the behaviour.

  IT-PO ENRICHMENT NOTE (2026-08-26). The claim-identifier requirement is the mechanism that
  makes the second scenario enforceable rather than aspirational. Without an explicit link
  from each claim to its fixture, "each statement is turned into an assembly run" is a
  process instruction — the unacceptable form — and coverage silently shrinks as the page
  grows. BO-3100d-1 applies the same pairing discipline to the delivery record; the two
  should share one mechanism rather than invent two.
