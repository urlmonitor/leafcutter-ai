criteria: |
  Given a package whose shared-block sources hold two blocks named ALPHA-ANSWER and BETA-ANSWER,
  And three route templates: route A marks one empty place for ALPHA-ANSWER; route B marks one
    empty place for ALPHA-ANSWER and one for BETA-ANSWER; route C marks no place at all,
  When the package is installed,
  Then installed routes A and B carry, between each marker pair, exactly the text of the named
    block's source, byte for byte,
  And installed route C differs from its template only by the configuration values every route
    receives at install,
  And the route templates in the package still hold empty marker pairs after the install.

  Given that package already installed,
  When one line of the ALPHA-ANSWER source is changed and the package is installed again,
  Then installed routes A and B both carry the changed text, and no installed route carries the
    earlier text,
  And a further install with nothing changed leaves every installed route byte for byte as the
    previous install left it.

  Given the ALPHA-ANSWER source contains a configuration placeholder of the kind the package
    resolves in route text,
  When the package is installed,
  Then every installed copy of ALPHA-ANSWER carries the configured value in place of the
    placeholder, exactly as the route's own placeholders are resolved.

  Given a third block, GAMMA-ANSWER, is introduced only by adding its source and marking one
    empty place for it in route C,
  When the package is installed,
  Then installed route C carries GAMMA-ANSWER's text,
  And nothing about how the package is installed had to change for GAMMA-ANSWER to be filled.

  Given the filling and the check that every copy matches its source are run by a harness that
    starts no workflow engine,
  When the harness inspects the installed routes,
  Then both give the same result they give in a full install, judged on the installed text alone.
