title: "The drive never presses on against a repository known to be corrupted"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600c.yaml"
criteria: |
  Given the integrity probe has returned a corrupt verdict for the shared
    repository during a parallel drive
  When the drive orchestration decides whether to continue
  Then it does NOT start, retry, or queue any further ticket commit against the
    corrupted repository
  And the drive exits with a failure outcome (a non-success result the caller can
    detect) rather than reporting partial success
  And a clean integrity verdict is required before any later drive may begin writing
    to that shared repository again
