  - path: docs/how-to/triage-unproven-done-records.md
    relationship: describes
    status: planned
    relevance: >-
      IT-PO ADDITION. THE TARGET FILE. A new how-to; the triage task has no
      existing home, and folding it into done-proof-enforcement.md (191 lines,
      already being extended by TQ-400a-5, 300-line advisory budget) would mix
      "how enforcement works" with "how to work the backlog it produces".
assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - >-
    TARGET DOCUMENT — a NEW how-to at docs/how-to/triage-unproven-done-records.md.
    Cross-link it from docs/how-to/done-proof-enforcement.md (the guide a reader
    arrives from) and from docs/how-to/prove-ac-done.md. A new file changes the
    generated docs/INDEX.md — run `python scripts/build.py --target-dir .` and
    commit the regenerated index rather than hand-editing it (build.py:1009).
  - >-
    THE STATED DECISION CRITERIA ARE THE SUBSTANCE OF THIS GUIDE, NOT A LIST OF
    THREE VERBS. Give an explicit mapping from each sweep cause to the decision it
    indicates, with the discriminating question a reader asks when a cause admits
    more than one. At a pile of 259 records worked by many hands over many cycles,
    the guide's real job is to make two different people reach the same decision on
    the same record; an unguided choice among three verbs produces three different
    piles depending on who is holding the list.
  - >-
    ROUTE, DO NOT RESTATE, FOR EVERY DECISION. "Prove it" routes to
    docs/how-to/prove-ac-done.md; "retire it" routes to
    docs/how-to/deprecating-or-removing-artifacts.md; the cause vocabulary routes
    to docs/how-to/done-proof-enforcement.md; the exemption boundary routes to the
    exemption entry in docs/reference/ac-schema.md (TQ-400e-6). A restated
    procedure is a second account that will drift from the governed one.
  - >-
    PRESENT THE REFUSAL AS DESIGNED BEHAVIOUR AND QUOTE ITS MESSAGE VERBATIM.
    TQ-400d-3 makes a reasonless clear impossible. Quote the exact refusal text the
    delivered path emits — never a paraphrase — and state the correct next step
    beside it. A guide that omits the refusal invites a reader to treat it as a bug
    and go looking for a way around it, which is exactly how a 259-record pile gets
    emptied in one gesture.
  - >-
    NEGATIVE REQUIREMENT — NO BULK ROUTE, IN ANY WORDING. The guide must contain no
    command, flag, loop, script or suggestion that clears, closes or decides more
    than one record without a decision recorded against each. This is the clause
    most at risk of being violated by a well-meaning author trying to make 259
    records feel tractable, and it is mechanically checkable, so it is checked
    rather than trusted. Batching the READING of the pile is fine; batching the
    DECISION is not.
  - >-
    NEGATIVE REQUIREMENT — RECORD AGE MUST NOT APPEAR AS A DECISION INPUT ANYWHERE,
    including in an example, a sort order presented as a triage strategy, or a
    "start with the oldest" aside. Age is not evidence about whether a record is
    proven.
  - >-
    THE PROGRESS FIGURE MUST BE GIVEN AS A READ LOCATION PLUS AN EXPECTED
    DIRECTION BETWEEN CYCLES, taken from TQ-400d-2's delivery. "Progress is
    tracked" is not checkable by a reader; "this number, read here, should fall by
    the number of decisions recorded since the last occurrence" is.
  - >-
    THE MEASURED SCALE MUST BE PRESENTED AS A DATED MEASUREMENT, NOT A LIVE CLAIM.
    259 of 641 was measured on 2026-08-17. Write it with its date, or the guide
    becomes wrong on the first cycle and a reader who checks discovers the guide
    cannot be trusted about anything else.
  - >-
    EVERY STEP MUST BE COPY-RUNNABLE AS WRITTEN AGAINST THE DELIVERED TRIAGE PATH.
    The test contract works a real record from the pile to a recorded decision by
    executing the guide's own steps; a step that needs adjustment is a red test.
  - >-
    Tracked how-to subject to check_doc_frontmatter, check_doc_length and
    check_doc_links; keep all three passing in the same commit.
  - >-
    SEQUENCE AFTER TQ-400d-1, TQ-400d-2 AND TQ-400d-3 LAND, and after TQ-400e-6 if
    both are in flight, so the legitimately-absent populations can be linked rather
    than described from intent.
delivers_to: null
expects_from:
  - ac_id: TQ-400d-1
    contract: >-
      The triage list and the closed decision set as delivered — the entries a
      reader works through and the three decisions plus the explicit
      not-yet-decided state the guide teaches them to choose between.
  - ac_id: TQ-400d-3
    contract: >-
      The refusal behaviour when a record is cleared without a decision, and its
      stated reason, which the guide must present as designed rather than as an
      obstacle. The guide quotes the emitted message verbatim, so the exact text
      is part of this contract.
  - ac_id: TQ-400d-2
    contract: >-
      The remaining-count measure and where it is published, so the guide can
      tell a reader how to see progress between cycles.
  - ac_id: TQ-400e-6
    contract: >-
      IT-PO ADDITION. The single reconciled statement of which records may
      legitimately be exempt, published in docs/reference/ac-schema.md. The
      "legitimately absent from the pile" clause LINKS to it; this guide must not
      carry its own account of who may be exempt.
test_spec:
  - name: test_tq400d5_guide_maps_every_sweep_cause_to_a_decision
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Assert the guide gives an explicit cause-to-decision mapping covering every
      cause string the sweep can emit, with a discriminating question wherever a
      cause admits more than one decision — not merely a list of the three
      decisions. Assert it states the read location and expected between-cycle
      direction of the remaining count, and states which populations are
      legitimately absent from the pile.
  - name: test_tq400d5_a_real_record_is_worked_to_a_recorded_decision_by_the_guides_own_steps
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      PRODUCTION ENTRY POINT. Extract the guide's steps for obtaining the pile and
      recording a decision, execute them as written via subprocess against a temp
      store, and assert the record leaves the awaiting-decision population as a
      RESULT of those steps. Asserting the guide mentions a command passes on a
      command that does not exist or no longer takes those arguments.
  - name: test_tq400d5_the_reasonless_clear_is_refused_with_the_message_the_guide_quotes
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      THE DESIGNED-REFUSAL PATH, BOTH HALVES. Execute the guide's own "what happens
      if I skip the decision" step against a temp store and assert the delivered
      path refuses (must_block), AND assert the refusal text the guide quotes is
      byte-equal to the text actually emitted. A paraphrased message is one a
      reader cannot match to their screen, and it rots silently.
  - name: test_tq400d5_decision_vocabulary_matches_the_delivered_list_and_no_bulk_route_exists
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      TWO SOURCES, ONE VOCABULARY, PLUS THE NEGATIVE SCAN. Assert the decision
      names the guide teaches equal the closed decision enum the delivered triage
      list validates, in both directions — no documented decision the list rejects,
      no accepted decision the guide omits. Then scan the guide and assert no
      documented command, flag or loop decides more than one record at a time, and
      that record age appears nowhere as a decision input.
test_rationale: >-
  change_target is docs, but this guide is the operating procedure for a
  259-record backlog, so its failure modes are behavioural rather than editorial
  and three of the four entries execute the guide rather than read it. Two clauses
  are negative requirements — no bulk route, age is not an input — and a negative
  requirement is invisible to a reviewer reading a diff of additions, so it is
  covered by a mechanical absence scan folded into the seam entry. The refusal
  clause gets its own failure-angle entry because the guide's account of a refusal
  is only useful if the refusal actually fires and says what the guide says it
  says; those are two separate ways to be wrong and both are checkable. NOT
  MECHANICALLY TESTABLE: "they choose between the three decisions using stated
  criteria rather than being left to judge unaided" is the heart of this AC and no
  test can observe two triagers converging. The proxy is deliberately stronger than
  a keyword check — assert the guide provides a mapping that COVERS every cause
  the sweep can emit and supplies a discriminating question wherever a cause admits
  more than one decision, because incomplete coverage of the cause space is the
  mechanically visible form of "left to judge unaided". Similarly "they can state
  that age is no part of any decision" is proxied by the absence scan: a reader
  cannot conclude it from a guide that quietly suggests starting with the oldest.
