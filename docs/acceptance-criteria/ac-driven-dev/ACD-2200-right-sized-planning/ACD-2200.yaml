roadmap_phase: phase_1
criteria: |
  Specifying work should cost in proportion to the work itself.

  Today every request pays the same price: the same stages, the same paperwork,
  the same waiting, whether it is a one-line correction or a new capability. So
  small work either buys a large specification it does not need or quietly goes
  around the route entirely -- and going around is what loses the triage, the
  approval points and the safe staging the route exists to provide. This goal is
  met when a small request produces a small specification and a short exchange;
  when deciding things feels like answering a question rather than restarting a
  stalled machine; when correctness is guaranteed by checks that run whenever
  work is saved instead of by remembering to follow steps; and when the result
  arrives as one clean change that is shared for review only if you say so.
