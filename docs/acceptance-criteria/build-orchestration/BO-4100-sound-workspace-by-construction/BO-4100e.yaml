criteria: |
  Every workspace that exists is accounted for, and none is beyond clearing away.

  The set of workspaces you are shown is complete: one that was left half-made, or
  that otherwise never got registered, is still surfaced rather than sitting there
  invisibly. Any workspace found that way can still be cleared away, so a remnant
  nobody can see is never also a remnant nobody can act on -- and its presence is
  reported as the local leftover it is, rather than as damage to the shared record.
depends_on: [BO-4100]
documentation_triggers: []
documentation_rationale: "The promise is that the listing is complete and the leftover is removable -- both observable in what the system does; a document telling someone where else to look would leave the incompleteness in place."
