id: GE-127d-4
title: "A change that makes an already-oversized file's measured length fall while its total line count rises is refused, and the refusal names that situation"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked covered file with a permitted length of 400 whose previous
    version measures 620 under the rule in force and holds 700 lines in total, so
    it already stands over its limit,
  And a staged version that measures 610 and holds 712 lines in total,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the outcome names the file and states
    that its measured length fell from 620 to 610 while its total line count rose
    from 700 to 712,
  And the outcome states that this combination is refused for a file already
    over its limit, and that a reduction in counted lines and an addition of
    uncounted lines (comments, docstrings) are accepted when made in separate
    commits,
  And this refusal is distinguishable in the outcome from a refusal for crossing
    the limit, for growth, or for an unpaid two-for-one repayment,
  And given a tracked covered file with a permitted length of 400 whose previous
    version measures 390 and holds 450 lines in total, and a staged version that
    takes 12 lines of code out and puts 20 lines of comments in, so it measures
    378 and holds 458 lines in total,
  When the author performs an ordinary commit,
  Then this refusal is not produced and the commit completes — a file whose
    previous version stood at or under its permitted length is never refused by
    this check,
  And given a file whose previous version stood at exactly its permitted length,
    with the same shape of change,
  When the author performs an ordinary commit,
  Then this refusal is not produced,
  And whether the previous version stood over its limit is decided by its length
    under the rule in force now, not under any earlier rule,
  And given the over-limit file above with a staged version that measures 610
    and holds 690 lines in total,
  When the author performs an ordinary commit,
  Then this refusal is not produced,
  And given the over-limit file above with a staged version that measures 620
    and holds 712 lines in total, because the change only put comments into it,
  When the author performs an ordinary commit,
  Then this refusal is not produced,
  And given a newly added file, which has no previous version,
  When the author performs an ordinary commit,
  Then this refusal is not produced.
depends_on:
  - GE-127d
  - GE-127d-3
