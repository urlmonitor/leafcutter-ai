test_spec:
  - name: test_completion_step_writes_all_three_learnings_to_their_named_destinations
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive a completion path to its completion step under the workflow engine harness in a temp tree whose declared sink holds three records, each carrying learning text and naming a different destination. Assert afterwards that all three destination files contain their record's learning text. The assertion is on file contents, not on the routing step's return value."
  - name: test_reported_result_carries_nonzero_read_written_and_unwritten_figures
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the completion path dispatched through the workflow engine harness, not the routing step called directly"
    description: "Assert the driver's returned result carries the three routing figures and that their values match the run just performed (three read, three written, zero unwritten) rather than zeros or absent keys. A result whose figures are absent fails, per the AC's final clause."
  - name: test_the_routing_result_is_consumed_in_the_driver_control_flow
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Run the same completion path twice against routing outcomes that differ (one succeeding, one reporting records left unwritten) and assert the driver's reported result DIFFERS between the two. This is the anti-fire-and-forget test: an invocation whose output goes nowhere produces identical reports and goes red."
  - name: test_a_second_run_over_the_same_records_adds_nothing_to_the_destination_files
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Byte-compare each of the three destination files after the first completed unit of work and after a second one over the same sink; assert the digests are equal. Asserts INF-400c-3's inherited idempotence survives automatic per-completion invocation, without a second dedupe mechanism in the driver."
  - name: test_the_routing_writes_are_inside_the_publication_the_path_makes_for_its_own_output
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "The ordering clause. Drive a completion path with three routable records and assert the three destination changes are part of the publication the path makes for its own output — that is, the published set contains them — rather than sitting unpublished beside it. Then re-wire the same path so the routing step runs after the publishing phase and assert this test goes RED. Ordering is only checkable against the publication boundary; asserting the file contents alone passes on both orderings."
  - name: test_a_record_emitted_by_a_publishing_phase_is_not_counted_and_is_routed_by_the_next_run
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The tail clause. Drive a completion path whose publishing phase emits one record after the routing step has read the sink; assert this run's figures count it neither as written nor as nothing-to-do, then drive a second unit of work in the same repository and assert the learning reaches its destination exactly once. Proves the tail is a deferral and not a discard, which only holds because the sink outlives the working directory."
  - name: test_the_three_destinations_still_hold_the_learnings_after_the_working_directory_is_removed
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: real_artifact
    covers:
      - INF-700a-1
      - INF-700a-5
    description: "The added durability clause. Repeat the first descriptor's run, then remove the working directory the unit of work ran in and read the three destinations IN THE MERGED TREE. Assert all three hold their learning text there. The assertion is made after the removal and against a different directory from the one the routing step wrote in — read before teardown, this test passes on the exact defect the clause was added to forbid. INF-700a-5 carries the full durability contract and its own descriptors; this one exists so this AC's own criteria are not left with an unasserted clause."
test_rationale: |
  Every descriptor drives a real completion path through the engine harness
  and asserts on an artefact or on a difference in the driver's output. None
  of them can pass on dead code: delete the routing invocation and the first
  and fourth go red on file contents, the second goes red on missing figures,
  and the third goes red because the two runs become identical. That third
  test is the one this repository's history demands — fast-lane-build.js
  passed its structural tests while never executing its gates, and fast_lane.py's
  select_batch call was a silent no-op, because both were covered by tests
  that asserted a call string was present rather than that its result changed
  anything. Asserting the presence of a harvest call in a workflow file would
  cover none of these four.
notes: |
  This is link 3 of the four that must all work: ADR-034 recorded "Nothing
  invokes the harvester — knowledge-harvester appears nowhere outside its own
  template and the agent registry", and at 2026-09-07 that is still true. A
  store-wide search finds references only in the agent template, the registry,
  the build deploy manifest, tests, changelogs and acceptance criteria — no
  workflow, command or skill calls it.

  Why "unit of work" rather than "drive". The package has more than one thing
  that finishes: an epic drive, a single-ticket drive, the fast lane, quick-fix
  and feature finalization all end work and report a result. Naming one of them
  in the criteria would wire one and leave the rest silently unwired, which is
  the shape of the original defect. The criteria are written against whatever
  drives a unit of work to completion; INF-700a-1-i is what stops that being
  read as "any one of them will do".
change_target:
  - pipeline
  - code
risk_surface: contract_boundary
