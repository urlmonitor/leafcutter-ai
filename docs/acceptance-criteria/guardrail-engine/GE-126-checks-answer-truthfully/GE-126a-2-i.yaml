assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Both runs of the pair must be executed against the copy the build deploys under .leafcutter/, in the same working copy, differing only in what is staged."
  - "The empty-scope pass must be reachable with no environment variable set at all. A pass that depends on a caller having configured something is not the commit-time path this record protects."
  - "This is a regression fence with no new behaviour of its own: the deployed check's exit status and outcome value for an empty-scope run must be byte-identical before and after the GE-126a work lands. Capture both from the pre-change deployed copy and assert against the captured values."
  - "The third clause must be exercised as a real commit in a scratch repository with the hook chain installed, not as a direct invocation. A staged set of only non-AC files is the most common commit in this repository and the direct invocation does not reproduce how the hook receives it."
  - "Error handling must follow the four rules in CLAUDE.md; an empty scope is an expected condition and must not travel through any warning or fail-open path."
test_spec:
  - name: test_no_target_named_and_empty_scope_is_the_ordinary_success_outcome
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Deployed check run by subprocess with no argv target and no environment target, store present at the resolved root and nothing staged, returns the ordinary success outcome and does NOT return the unresolved-target outcome value GE-126a-2 introduced."
  - name: test_same_working_copy_with_one_violating_record_staged_still_refuses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The paired run - identical working copy, one staged record missing origin_agent - refuses that record. Without this the empty-scope pass is also produced by a check that has stopped running."
  - name: test_commit_staging_only_non_ac_files_is_not_disturbed_by_this_check
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    surface_invoked: "git commit in a scratch repository with the deployed pre-commit chain installed"
    description: "A real commit in a scratch repository staging only files outside docs/acceptance-criteria/ completes, with this check contributing nothing but the ordinary success outcome."
  - name: test_empty_scope_outcome_is_unchanged_from_the_pre_change_deployed_copy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "The empty-scope exit status and outcome value match the values captured from the deployed copy before the GE-126a work landed - the explicit anti-regression assertion the L1 asks for."
test_rationale: |
  This record adds no behaviour, so a criterion-only test is trivially green today and
  stays green under the exact regression it exists to catch — a GE-126a-2 fix that
  treats "no targets" as "targets that did not resolve" would still pass a test that
  only asserts a zero exit, if that test were written against the old outcome
  vocabulary. Two things make it real: the paired violating run, which proves the pass
  is a verdict about scope rather than a check that has stopped; and the e2e commit,
  because most commits in this repository stage nothing under the AC store and the
  direct invocation does not reproduce how the hook receives that case.
delivers_to: null
