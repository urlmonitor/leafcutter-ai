id: KM-500b-4
title: Verify an actual coding agent can deliver and resume a missing-query request
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: todo
parent: KM-500b
criteria: 'Given a ready research need cannot be answered by the eligible query catalog and the task permits
  the governed build and catalog activation

  And the actual coding-agent entry point and any external data transfer are authorized

  When the ordinary research run delivers its missing-query work to that coding agent

  Then the agent receives the original question, resolved inputs, expected result, pinned source, current catalog
  and remaining limits

  And the returned candidate is attributable to that delivery rather than a prewritten candidate substituted
  for the demonstration

  And the independent verifier executes the candidate tests and evaluation before any permitted registration

  And a failed, unsafe or unrelated candidate leaves the prior catalog usable and the original need unresolved
  with its reason

  And a matching verified activation resumes the same research need, invokes the new query and assesses the
  resulting evidence

  And a later independent process can discover and reuse that verified version without rebuilding it

  And denial of activation cannot be bypassed by another host handoff

  And unavailable agent or provider prerequisites are reported as not-run rather than proof of real-agent delivery.'
