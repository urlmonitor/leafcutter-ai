criteria: |
  Given the finding format defined by the core review-for-code-smells method,
  When a single finding is produced,
  Then it includes the file (and location) of the offending code so the reader
    can locate it,
  And it includes a "Before" block quoting the real offending code verbatim,
  And it includes an "After" that is a short direction-only sketch of the fix,
  And the "After" is explicitly not a full rewrite of the code.
