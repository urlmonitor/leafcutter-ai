criteria: |
  Given a reader working in the build-source tree because that is where the check they are
    editing lives and whose workspace is fully built with the deployed layout present,
  When they run the build-source copy against a record that genuinely violates the
    parent-back-link rule and read what it tells them,
  Then the refusal names the copy they ran and names the copy to run instead in a form
    they can act on without further discovery,
  And it states that this copy cannot enforce the rule as a property of the copy rather
    than as a condition of their setup,
  And it does not state or imply that the workspace is unbuilt or that anything the reader
    could install or link would make this copy work,
  And the wording recorded on 2026-08-25 — a warning naming an internal helper that could
    not be imported by three named strategies followed by a skip — is no longer produced,
  And a reader who follows the route the refusal names arrives at a run that produces a
    verdict on the same record rather than another refusal.

  Coverage note: covered by executing the build-source copy in a fully built workspace and
  asserting the refusal names both copies, paired with executing the route it names and
  asserting a verdict is produced. The paired second run is what stops the message being
  checked as a string; a message that names a route nobody can follow is decoration.
