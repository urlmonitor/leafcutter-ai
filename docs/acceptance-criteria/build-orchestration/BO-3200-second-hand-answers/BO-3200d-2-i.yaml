    contract: "The caller-supplied handover location. This AC defines the three states it can be in when the consumer reads it and requires a distinct report for each."
  - ac_id: BO-3200e-1
    contract: "The could-not-tell vocabulary, reused for the not-obtained case rather than reinvented at this site."
test_spec:
  - name: test_bo_3200d_2_i_nothing_at_the_handover_reports_could_not_obtain_and_halts
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    description: "Producer fails before writing anything; assert the consumer reports the result could not be obtained (BO-3200e's undetermined vocabulary) and the run halts."
  - name: test_bo_3200d_2_i_empty_result_reports_empty_and_differs_from_not_obtained
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    description: "Producer deliberately writes zero-length content; assert the report says empty, the run halts, and the captured message and machine-readable outcome both differ from the not-obtained case."
  - name: test_bo_3200d_2_i_inadequate_result_differs_from_both_others
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE THREE-WAY COMPARISON. Drive all three states in one test, capture all three reports, and assert every pair differs substantively and in its machine-readable value. Asserting each halts individually passes on three identical messages."
  - name: test_bo_3200d_2_i_classification_is_total_and_never_raises
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: failure
    description: "Across a missing location, an unreadable location, a zero-length file, whitespace-only content and a complete-but-failing result, classification returns exactly one of the three and raises nothing."
test_rationale: |
  Every one of the three states halts the run, so an assertion on the outcome cannot tell them
  apart — which means a test written per-state passes on an implementation that emits one
  identical halt for all three. The load-bearing test therefore drives all three in one place and
  compares the reports pairwise.
  Moving the handover out of the reply is what creates these three states in the first place, so
  they are a hazard the fix introduces rather than one it inherits; the natural implementation
  collapses them into a single "no usable result" halt, and the reader then has three possible
  causes and no indication which.
