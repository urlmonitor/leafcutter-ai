notes: |
  THE SPLIT IS THE SINGLE MOST IMPORTANT THING IN THIS PAIR OF RECORDS, and the line
  it falls on is not the obvious one. It is NOT readers versus mutators — the routing
  markers already draw that line and it is a different question. It is whether the
  NUMBER OF REAL DEPLOYS is the subject of the assertion.

  The three deploy-count files count deploy signals. Hand them a pre-warmed layout
  and they observe zero deploys. They would not go red; the ones that assert "exactly
  one deploy" would go red and be "fixed", and the one that asserts "produces
  nothing" would go green and stay green while testing nothing at all. Either way the
  465 s they cost is the test, and it is correctly spent.

  The other 17 assert which root a marker routes to, what the run reports, and
  whether a layout survives comparison. None of them can observe how the layout came
  to exist. For them a byte-identical seed is invisible, and 1,069 s becomes about
  120 s.
