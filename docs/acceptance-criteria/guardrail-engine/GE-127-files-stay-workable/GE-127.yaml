level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Files never quietly grow past the point where they can be understood.

  A file that has become too large to hold in your head is the most expensive
  kind of debt this project carries, and the only moment it is cheap to fix is
  the moment it crosses the line. Today nothing tells you when that happens, so
  files pass the threshold unnoticed and are discovered months later, when
  splitting one means unpicking dozens of changes at once. After this goal, the
  moment a file grows past what a person can work in is the moment you hear
  about it, growing an already-oversized file further is refused, the standard
  applies to everything the project is actually written in rather than only the
  two file types someone happened to list first, the limit you are told about is
  the limit that is enforced, and being stopped comes with enough information to
  act on rather than an instruction to go and think about it.
