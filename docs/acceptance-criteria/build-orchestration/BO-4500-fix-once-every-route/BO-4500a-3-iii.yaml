notes: |
  The L1 split: "message authoring and autofix judgement stay agent work". The step is
  deterministic; the boundary is the hand-back. The verbatim message is BO-3800c's "the named file
  and the named demand are CARRIED, never reconstructed" -- if the step paraphrased it, BO-3800c
  would be unbuildable on any route that goes through the step. How many fresh calls an agent may
  make is BO-3800d's / BO-210's bound, not this step's.
