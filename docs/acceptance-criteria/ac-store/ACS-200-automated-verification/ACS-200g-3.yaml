id: ACS-200g-3
components:
  - ac_store
  - testing_quality
title: "The reachability check of the acceptance-criteria schema guardrail runs against a small self-contained repository, so its run time does not grow with the real store"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a self-contained fixture repository built in a temporary directory that
    holds a copy of the deployed acceptance-criteria schema guardrail, three
    valid acceptance-criterion records, and one malformed record whose only
    field is its identifier "ZZTEST-999",
  When the reachability check runs the real deployed guardrail entry point with
    that fixture repository as its repository root and the malformed record as
    the only staged change,
  Then the guardrail reports a failing, blocking result,
  And its output names the record "ZZTEST-999" and the rule it breaks.

  Given the same fixture repository,
  When the reachability check runs the real deployed guardrail entry point with
    one of the three valid records as the only staged change,
  Then the guardrail reports a passing result,
  And it reports no failure for that record.

  Given the real requirement store holds about 5,270 records,
  When the reachability check runs against the fixture repository,
  Then the guardrail reads only the records inside the fixture repository and
    reads no record from the real requirement store,
  And adding records to the real requirement store does not change how many
    records the guardrail reads during the check.

  Given a machine on which no requirement-store index cache exists, neither for
    the fixture repository nor for the real repository — as on a fresh
    continuous-integration runner,
  When the reachability check runs,
  Then each guardrail run finishes in under 10 seconds, at most one third of
    its 30-second time limit,
  And the check passes on that cold machine in every run, without a rerun.

  Given the real working tree and the real requirement-store index cache before
    the reachability check runs,
  When the check has finished, passed or failed,
  Then the real working tree has the same tracked and untracked files with the
    same content as before,
  And the real requirement-store index cache is neither created, changed, nor
    deleted by the check,
  And the temporary fixture repository no longer exists.

  And the symptom ("the reachability check times out on a cold
    continuous-integration runner because a one-record run first reads the
    whole real requirement store, which fails the required test suite on pull
    requests the change under review did not cause") must not occur.
