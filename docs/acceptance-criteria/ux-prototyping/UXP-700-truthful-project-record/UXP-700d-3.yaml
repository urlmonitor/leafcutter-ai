    relationship: specifies
    status: exists
    relevance: "The artifact shape that gains the declaration; a source field already exists with values real and mock and may be the right axis to build on."
  - path: docs/reference/ac-schema.md
    relationship: specifies
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: frontend-coder
  contract: "A self-declared example marker on every example artifact and criterion, so any reading surface can label it without consulting a registry."
expects_from:
