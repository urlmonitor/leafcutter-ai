notes: |
  WHY THIS IS ITS OWN RECORD, AND WHY IT IS AN EDGE CASE RATHER THAN A NEW
  DIRECTION. KI-SEC-001 states the scope of the existing exemption precisely: it
  gates the high-entropy rule only, and the shape-based and keyword-based rules
  still fire in these locations. That is the one part of today's behaviour this L1
  must NOT change. The risk is specific to the fix being asked for here: once a
  per-result allowance exists and is being wired into the reporting path, applying
  it to every finding that passes through is the natural next line of code and
  nobody would notice, because the second scenario is currently green and no
  existing record asserts it.

  THE SECOND SCENARIO IS GREEN ON ARRIVAL, AND THAT IS ITS POINT. It is a
  regression guard, not evidence that the fix landed. Do not cite it as coverage
  for this L1's behaviour, and do not let its passing be read as the first scenario
  passing. Label it as such wherever the red baseline for this tree is recorded.

  EXACT COUNTS MATTER HERE TOO: three findings, not at least one. An implementation
  that widened the allowance to the keyword rule would report two, which any
  at-least-one assertion accepts.

  FIXTURE PLACEMENT — STATED, NOT INHERITED. Every fixture must be a real file
  created inside a tempfile-backed throwaway project root, with the ticket area
  constructed INSIDE that root and the check run against that root. No fixture may
  be created under this repository's own `tickets/`, `docs/retrospectives/`,
  `docs/acceptance-criteria/` or `templates/skills/` trees. This matters more than
  usual for this record: the rules being asserted are the ones that fire everywhere,
  so a badly placed fixture would pass whatever the change did to them.

  EACH OF THE FOUR LINES MUST PRODUCE EXACTLY ONE FINDING so that three is an exact
  expectation: verify the chosen values do not cross-trigger a second rule — in
  particular that the quoted password value is long enough for the keyword rule and
  short enough not to reach the entropy threshold.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Every arm runs the real
  pre-commit secrets check over real staged files and asserts the process exit
  status and the reported findings. Credential-shaped fixture strings are assembled
  at runtime from concatenated fragments rather than written as source literals, so
  this repository continues to need no suppression for the module that holds them —
  which matters here because this record is the one that deliberately contains a
  private-key header and a cloud access key.
