  - name: test_ge119b2_every_manifest_check_resolves_or_reports_could_not_check
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Sweep over hooks_manifest.hooks[] from a separate working copy: each check either resolves its declared prerequisites or reports could-not-check; none silently reports success."
  - name: test_ge119b2_no_private_root_walk_remains_in_registered_checks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Data-driven scan of the check family finds no surviving private root-walk or private resolution fallback in any manifest-registered check — the anti-regrowth guard, supplementing the executed clauses."
  - name: test_ge119b2_new_check_resolves_without_its_own_root_walk
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A newly added check fixture with no root-walking logic of its own resolves its prerequisites through the shared facility."
test_rationale: "The two load-bearing clauses are the ones that begin executed-from-a-separate-working-copy, so they need the GE-119c-1 harness. The source scan is included deliberately but only as a SUPPLEMENT: counting occurrences of a resolution function name measures tidiness, and on its own would pass on a migration that adopted the facility while leaving the private fallback in place — which is the exact partial fix this AC must prevent. Neither shape substitutes for the other."
