notes: |
  A TECHNICAL CONSTRAINT ON ACS-1400b-1 THAT EXISTS BECAUSE THE OBVIOUS
  IMPLEMENTATION IS THE WRONG ONE. Wiring a schedule is easy; the tempting
  shortcut is to re-derive the orphan set inside the scheduled job, because that
  avoids depending on a script's output format. That shortcut creates a second
  reader of the same evidence, and the two drift.

  THE SECOND Then IS WHAT MAKES THIS FALSIFIABLE RATHER THAN A STYLE PREFERENCE.
  Asserting "it calls the scan" is satisfied by code that calls the scan and then
  ignores it — the phantom-done shape this repo's CLAUDE.md documents for gates
  and runners. Perturbing the scan and requiring the report to follow proves the
  result is consumed in control flow, not merely invoked.

  DELIBERATELY SILENT ON OUTPUT FORMAT. Whether the scan should grow a structured
  output mode so the scheduled job need not parse prose is an implementation
  choice, not a behaviour. The criterion holds either way.
