criteria: |
  Given a reader wants to know where an authored proof demand can be lost
    between the requirement that states it and the worker who answers it,
  When that reader consults the architecture documentation for this pipeline,
  Then a sequence diagram shows, in order: the requirement carrying its authored
    demand, the generation step placing that demand into the work item and
    naming the proof writer as owed, the route deciding whether the
    proof-writing phase runs, and the proof writer producing the proof,
  And the diagram marks the two points at which the demand has been dropped —
    the generation step and the route's skip decision — and shows which of the
    two is guarded and which is not,
  And it shows the downstream refusal of a promise that was never claimed as a
    participant beyond an explicitly drawn boundary, with no message crossing
    back into this pipeline,
  And a reader can tell from the diagram alone that a demand surviving
    generation does not by itself mean a proof was written.
