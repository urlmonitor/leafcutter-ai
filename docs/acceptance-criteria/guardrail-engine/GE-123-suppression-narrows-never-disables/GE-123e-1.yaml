it_requirements:
  - "CANONICAL SOURCE: templates/scripts/commit_guardian/check_feedback_id.py (ADR-001). The copies under scripts/commit_guardian/ and in the consumer .leafcutter/ layout are build outputs and are never edited by hand. Show source-to-deployed parity with a build.py round-trip before sign-off."
  - "ONE VERDICT, THREE ROUTES: the verdict depends only on the staged change the commit is built from. That is whatever index git uses for that commit, including the private index the shared commit step sets through GIT_INDEX_FILE. It never depends on how the message travelled. No commit-message source is consulted for the verdict on any route. GE-123e-2 removes the existing ones, and this record must not add one."
  - "UNIT JUDGED: a sign-off heading that the commit ADDS to a markdown file under tickets/. The heading grammar of templates/skills/signoff/SKILL.md §3 is used unchanged. A heading that is already present and not touched is never judged (third arm). The accepted feedback-id placement and the any-non-blank-value rule stay as they are today. The value-shape check (INF-500d-3) is out of scope."
  - "FENCE (gate decision 3, 2026-11-16): deleting the feedback-id line from an EXISTING heading is out of scope, and this change must not start catching it. It is tracked as KI-CG-20261116-removing-a-feedback-id-line-is-not-caught. An implementation that widens the judged unit to deletions exceeds this record."
  - "REFUSAL OUTPUT: the refusal names the ticket path repo-root-relative with forward slashes and quotes the heading line verbatim. It is identical on every route, so the three refusals can be compared as text. On the shared-commit-step route the refusal is asserted as it reaches the caller: the check's output carried verbatim in the step's one JSON answer."
  - "INHERITED: the check may fail open on an internal error only with a visible stderr WARNING and the could-not-check outcome from the check_outcome vocabulary (GE-120a-1). An internal error never produces a silent pass or a silent skip."
  - "LATENCY: one change-set derivation per commit, and no git call per heading on the ordinary-commit path."
  - "TEST EVIDENCE (binding, from this record's notes): verified only through real git commit calls in a scratch repository with the hook installed from the deployed layout. The three routes are an inline -m commit, a commit by file with the git arguments the shared commit step uses (templates/scripts/commit_changes.py: commit -q --cleanup=verbatim -F <file>), and the shared commit step itself driven as an agent drives it. None of these is evidence: hand-writing COMMIT_EDITMSG, setting GIT_COMMIT_MSG or COMMIT_EDITMSG in place of a commit, or calling main() or private helpers directly (FP-7). Every arm asserts whether the branch tip moved as well as the output. Expected test home: unit_tests/commit_guardian/, with one real-commit scratch-repo harness that GE-123e-2, -2-i, -3, -4 and -4-i reuse."
  - "RED-BASELINE HONESTY: with no token in any message, all three routes already refuse an added id-less heading today, and the third arm already passes. Most of this record is therefore expected GREEN on arrival. Its value is the three-route harness and the verdict contract that the siblings build on. The test plan must say which assertions are red today and must not cite a green-on-arrival assertion as proof of a fix."
test_intent:
  - clause: each of the three commits is refused and the branch tip is unchanged after each attempt
    needs_test: true
    reason: Refusing an added id-less sign-off on every route is the check's core behaviour, and only real commits on all three routes, not a hand-written message file, show that the routes reach one verdict.
  - clause: the three refusals name the same ticket file and the same heading text
    needs_test: true
    reason: The refusal text is built from the staged diff the check reads, so a route that hands the check a different change would name a different file or heading.
  - clause: each of the three commits succeeds and the branch tip advances by exactly one commit, Because every refusal scenario in this feature is also satisfied by a check that refuses all sign-offs, and this arm is the one that rules it out
    needs_test: true
    reason: This negative control is the only clause that fails an implementation which refuses every sign-off.
  - clause: each of the three commits succeeds, Because the check judges the sign-off headings a commit adds; a heading written before feedback ids existed, and not touched now, is not new work
    needs_test: true
    reason: Judging only added headings is computed from the diff, and a wider scan would block every edit to a pre-epoch ticket.
test_spec:
  - name: test_ge_123e_1_idless_heading_refused_on_all_three_routes
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "In a scratch repo with the hook installed from the deployed layout (pre-check ticket committed first), the same id-less added heading is committed three times from the same starting state by real git commit: inline -m, commit -q --cleanup=verbatim -F file, and commit_changes.py given that message file. Each attempt exits non-zero and HEAD is unchanged. GREEN on arrival per the record's red-baseline note, so this is the three-route harness contract, not proof of a fix."
    proves_clause: 'each of the three commits is refused and the branch tip is unchanged after each attempt'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
  - name: test_ge_123e_1_three_refusals_name_same_ticket_and_heading
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "From the three real refusals of the first arm, extract the ticket path and the quoted heading line (shared-step route read from the hook_output of its one JSON answer, not the truncated reason). Assert all three name tickets/00_inbox ticket file and the heading text verbatim, with forward slashes and identical text."
    proves_clause: 'the three refusals name the same ticket file and the same heading text'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
  - name: test_ge_123e_1_heading_with_feedback_id_commits_on_all_three_routes
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "Same starting state, staged change appends the heading plus a feedback-id line on the next line. Each of the three real commit routes succeeds and HEAD advances by exactly one commit (rev-list count asserted, not just the exit code). This negative control rules out a check that refuses every sign-off."
    proves_clause: 'each of the three commits succeeds and the branch tip advances by exactly one commit, Because every refusal scenario in this feature is also satisfied by a check that refuses all sign-offs, and this arm is the one that rules it out'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - a check that refuses every sign-off heading whether or not a feedback-id line follows
      - a check that refuses only on the route whose message travels in a file
      - a check that accepts the id line only when the commit message carries it
  - name: test_ge_123e_1_untouched_preepoch_heading_not_judged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "The id-less 2026-05-01 test-writer heading is committed BEFORE the hook is installed. A staged change that edits only the ticket title line is then committed by each of the three real routes; each succeeds. Fails a check that scans every heading of a touched ticket file instead of the headings the commit adds."
    proves_clause: 'each of the three commits succeeds, Because the check judges the sign-off headings a commit adds; a heading written before feedback ids existed, and not touched now, is not new work'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - a check that judges every sign-off heading in a touched ticket file, not only the added ones
      - a check that judges the whole staged file when the diff has no added heading
  - name: test_ge_123e_1_shared_commit_step_is_reachable_as_a_subprocess
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    description: "Run templates/scripts/commit_changes.py as a subprocess (deployed copy with its sibling modules and config, no build.py spawn) with --message-file and the ticket path, in the scratch repo whose hook is the deployed check. Assert the exit code is 1, the single JSON answer has status hook_failed, hook_output carries the heading, and HEAD is unchanged; then the id-bearing variant answers committed. The shared step builds a private GIT_INDEX_FILE, so this proves the check reads the index git hands the commit."
    proves_clause: 'each of the three commits is refused and the branch tip is unchanged after each attempt'
    code_file: templates/scripts/commit_changes.py
