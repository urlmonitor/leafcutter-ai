roadmap_phase: phase_1
criteria: |
  Given the test gate exists as a blocking check on pull requests,
  When a contributor or maintainer reads the architecture documentation,
  Then a sequence diagram shows the ordered flow from a pull request being
    opened or updated, through the continuous-integration system starting the
    test check, running the full suite, and reporting a pass or fail result back
    to the pull request
  And the diagram shows both the failing path (a failing test surfaces a blocking
    failure on the pull request) and the passing path (a green suite reports a
    passing check)
  And the diagram names the actors and the test check consistently with the
    behavior described in BP-1200b-1.
