change_target: config
risk_surface: privacy
test_spec:
  - name: prod_build_excludes_ci_endpoints
    target_dir: leafcutter-web/__tests__/
    framework: vitest
    type: integration
    description: "In a production build, /api/drift-guard and /api/mock-toggle-check are not compiled in and requests to either path return not-found."
notes: |
  Mock-mode hardening follow-up (independent code review finding M-2). The CI-support API routes
  (/api/drift-guard, /api/mock-toggle-check) currently ship in the production build and can leak
  filesystem paths; they must be gated out of a production build. Criteria sharpened to Gherkin by
  BA; L3 edge cases cover no-leakage-on-probe and CI-build presence. IT-PO to enrich.
