test_rationale: >-
  Documentation-only; no executable behaviour. Every field, default, runner and
  outcome it lists is read off the landed files (leafcutter-lint.json,
  _lint_scope.py's default constant, check_outcome.py, ci.yml's lint job,
  run_ci_local.py) at authoring time, and the reviewer re-checks each against
  those files.
it_requirements:
  - "NEW FILE docs/reference/commit-time-lint-gate.md (type: reference, components including commit_guardian, precommit_hooks, build_pipeline) plus a row in docs/reference/README.md."
  - "THE DECLARATION: leafcutter-lint.json at the project's git toplevel, tracked and project-owned, never written by build.py; fields version, steps[].name, steps[].paths ('.' = whole project; repo-relative, no globs), steps[].select (optional; replaces the ruff configuration's selection for that step while its exclude/ignore/per-file-ignores still apply); the default when absent; that a malformed declaration refuses rather than defaulting. Show this repository's file as the worked example, copied from disk."
  - "THE RUNNERS, AND THE NO-COPY RULE: check-lint-gate (staged mode, commit time), ci.yml job lint 'Lint (ruff)' (full mode, template source), scripts/run_ci_local.py (full mode), BO-570-3's sign-off adapter (files mode, --json); none holds its own tree or rule list. State BO-570-3's status as it stands at authoring time (approved/unbuilt today) rather than asserting it is wired."
  - "THE OUTCOMES: refused (findings listed), ok (passed after inspecting named files), nothing_to_inspect, could_not_check with each reason (ruff_not_installed, ruff_failed_to_start, ruff_config_unreadable, declaration_unreadable, ruff_config_partially_staged, no_repository, internal_error); exit status per outcome; that the RESULT line and --json 'outcome' carry the distinction and the exit code does not; and why every could_not_check blocks (pre-commit prints Passed for any exit 0)."
  - "THE JUDGING RULE: whole staged file, from the index; the predates label and how it is derived (HEAD comparison); --force-exclude; and the recorded cross-file-rule assumption with what must change if a cross-file rule is ever selected."
  - "Also list check-lint-rule-claims (BP-1300e-2) and what it checks, since it reads the same declaration."
