id: TQ-600a-13-i
components:
  - testing_quality
title: "Choosing to exclude a test from the default run does not quietly delete it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the branch of the parent record in which real deselection is implemented rather
    than the documents corrected,
  And what the suffixed tests in the suite-performance directory actually cover: the
    routing that decides whether a test is handed the one shared layout or a private
    copy of its own, which when it breaks hands a mutator the shared root and corrupts
    every reader nondeterministically,
  And the asymmetry that makes a careless exclusion worse than today's false claim: a
    false claim costs the run some seconds it did not expect to spend, while an
    exclusion with no invoked alternative costs the only quick warning of a corruption
    that makes unrelated tests fail for unrelated-looking reasons,
  When a suffixed test is excluded from the default collection,
  Then a named opt-in exists that collects it, and that opt-in is invoked on a stated
    cadence by something whose failure fails the build,
  And a suffixed test that fails under that opt-in turns the invoking job red, shown by
    making one fail and observing the job's outcome,
  And the opt-in is shown to collect every test the default collection excluded, so
    the two sets together are the whole suite and nothing falls between them,
  And when no such invoked opt-in is in place, the exclusion is refused rather than
    applied, so the deselection cannot land on its own ahead of the thing that
    compensates for it.
depends_on:
  - TQ-600a-13
