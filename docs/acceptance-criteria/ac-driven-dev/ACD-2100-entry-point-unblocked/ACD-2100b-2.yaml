it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "Fail closed: the run still stops. See ACD-2100b-4."
  - "The four outcome reports must be distinguishable by their observable output alone. A shared catch-all message satisfies each outcome's own record read in isolation and leaves the operator unable to tell a wrong location from a corrupt file."
  - "The report must locate the failure within the contents -- an offset, a line, or the fragment at which interpretation stopped. 'Could not interpret the registry' without a position sends the operator to read the whole file by eye."
  - "The report must not name a permission setting and must not assert anything about any agent's permission."
  - "Must satisfy the repository error-handling policy: the interpretation failure must be caught by type and logged at WARNING or higher before the halt -- it must not propagate as an unhandled failure, which stops the run for a reason the operator cannot read."
  - "Must not emit the registry's contents into the report beyond the fragment needed to locate the failure -- the file can carry project configuration."
test_spec:
  - name: test_truncated_registry_is_reported_as_uninterpretable
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A registry produced by writing the real serializer's output and truncating it
      part-way; the run stops and reports that the file was read but could not be
      interpreted.
  - name: test_uninterpretable_report_differs_from_the_unreadable_report
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Two runs -- one with the registry absent, one with it truncated -- produce
      reports that differ from each other, and neither contains a permission verdict.
  - name: test_uninterpretable_report_states_where_interpretation_failed
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The report names a position within the file, and that position corresponds to
      where the real serializer's output was cut.
  - name: test_uninterpretable_registry_does_not_end_the_run_with_an_unhandled_failure
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      The run stops with the interpretation report as its recorded outcome rather than
      with an unhandled failure -- both stop the run, so the report is the only thing
      that tells them apart.
test_rationale: >-
  The second Then clause is why this is a separate record rather than a clause on
  ACD-2100b-1, and it is the only one a test can hold: asserting that the two reports
  differ is what stops the four outcomes collapsing back into one shared message. A
  truncated file is the realistic fixture -- it is what a partial write or an
  interrupted build-time copy produces -- and per the fixture-authenticity policy it
  must be produced by truncating the real serializer's output, not by hand-typing a
  broken literal, because a hand-typed literal can fail to parse for a reason the real
  artifact never exhibits. The unhandled-failure assertion is separate because a crash
  also stops the run, so a fail-closed assertion alone cannot distinguish the two.
