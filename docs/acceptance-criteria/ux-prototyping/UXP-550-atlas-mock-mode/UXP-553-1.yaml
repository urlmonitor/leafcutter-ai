assigned_agent: frontend-coder
estimated_complexity: S
it_requirements: |
  Enforce a production lock in the repo.ts seam evaluated FIRST in the resolution order
  (lock > runtime override > LEAFCUTTER_MOCK env default). When LEAFCUTTER_MOCK_LOCK=real
  is set, the seam short-circuits to the real repo and ignores any cookie / query / header
  override regardless of the env default. When the lock is unset (dev/preview default),
  runtime overrides from UXP-553 are honored so the in-app toggle works. This is the
  explicit realization of the ADR-021 warning that "a stale override must never leak mock
  data into a real deployment": the lock is the mechanism. Verify with two tests — (1)
  locked deployment ignores a mock cookie/query and serves real data; (2) unlocked
  deployment honors the same override and serves mock.
