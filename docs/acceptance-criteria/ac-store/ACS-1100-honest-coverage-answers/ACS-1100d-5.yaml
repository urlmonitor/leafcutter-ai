notes: |
  THIS IS THE CLAUSE THAT CATCHES THE PHANTOMS, and it is the one thing in this
  area the store did not have. A store-wide search for any record comparing a
  claim's population against the scope of the evidence closing it returned nothing
  but ACS-300h-1's own reopening note. Every neighbouring record governs a step
  earlier or later in the chain:
    - ACS-1100a / ACS-1100b make the ANSWER state its coverage.
    - ACS-1100d-1 makes the figure SURVIVE each hop that consumes it.
    - ACS-1100d-2 caps what a VERDICT built on that figure may claim.
    - This record caps what a RECORD may be marked on the strength of that verdict.
  Without the last step the chain stops one hop short of the place the damage
  actually lands, which is a requirement reading "done" while the property it names
  is false for 36 of 45 records.

  WHY IT SITS UNDER ACS-1100d AND NOT SOMEWHERE ELSE. Marking a requirement
  finished is a consuming hop in exactly d-1's sense: an agent or a person reads a
  verdict earned over a fraction of a population and writes an unqualified
  conclusion about the whole of it. d-1's own 2026-08-18 amendment already
  established that a hop is not only a machine payload and that the single
  laundering incident this repository has repaired happened in a reader's head. The
  done flip is that same hop with a durable write at the end of it. d-2 caps the
  verdict; this caps the write.

  BOTH ROUTES ARE HONEST, AND THE CHOICE IS THE POINT. Widening the evidence
  preserves the guarantee; narrowing the wording admits the weaker one. What is
  forbidden is taking neither and recording the strong claim on the weak evidence.
  ACS-300h-1's and ACS-300i-2's reopening notes independently reached the same two
  routes and the same instruction — "do not close it by re-running the existing
  validator and observing silence" — which is this criterion stated once, per
  record, by hand. Stating it once for the store is the work.

  DIFF-SCOPING SURVIVES THIS UNTOUCHED. Nothing here asks a per-change gate to
  widen. It asks that a requirement claiming a population not be closed by one. A
  requirement written about the change under review closes on a change-scoped
  verdict exactly as it does today.

  SCALE, MEASURED NOT ASSUMED. Two instances are named in the criteria because both
  were verified against the file on 2026-08-25. The known-issue register lists four
  records under KI-CG-001 with this shape and the class is plainly wider, but the
  wider count has not been measured and is deliberately not asserted here.
  Establishing it is a sweep, and a sweep belongs to ACS-200h and TQ-400a, not to
  this record.
