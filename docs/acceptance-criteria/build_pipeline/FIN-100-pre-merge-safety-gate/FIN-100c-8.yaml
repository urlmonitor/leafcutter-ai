title: "Only real regressions block finalization; pre_existing failures do not halt"
level: L2
component: finalize
status: active
parent: FIN-100c
criteria: |
  Given the triage report classifies the post-merge failures against the recovered baseline
  When the workflow evaluates whether to halt finalization
  Then blocks_finalization is set to true only if at least one failure was classified "regression"
  And when every failure is classified "pre_existing" (all also fail on main HEAD),
    blocks_finalization is false and finalization proceeds
  And in the 2026-07-15 case (all 3 deploy-dependent tests pre-existing on main),
    finalization is NOT halted with a false test_regression
