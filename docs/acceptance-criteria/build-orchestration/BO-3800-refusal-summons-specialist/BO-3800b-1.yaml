  - path: docs/architecture/adrs/ADR-019-build-feature-inline-phase-dispatch.md
    relationship: describes
    status: exists
    relevance: >-
      THE CONSTRAINT THAT DECIDES WHICH LAYER DOES THE ENGAGING, AND WHOSE VIOLATION IS
      SILENT. An agent invoked via the Agent tool runs at depth 1 and cannot itself invoke
      the Agent tool — calls beyond depth 1 are SILENTLY DROPPED. The delivery step is
      itself a depth-1 agent, so it cannot be the party that engages the specialist; the
      asking must be done by the depth-0 driver that owns the phase loop. An implementation
      that puts the ask inside the delivery step produces a run in which nobody is engaged
      and nothing complains, which is indistinguishable from this record not being built.
