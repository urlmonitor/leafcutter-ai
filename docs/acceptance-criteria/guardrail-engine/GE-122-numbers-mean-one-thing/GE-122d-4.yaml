notes: |
  Satisfies GE-122d's documentation_triggers: [component-diagram]. The L1 scopes it as "the
  three-stage arrangement and which stage owns which promise".

  DRAWING THE SHARED RULE AS ONE ELEMENT is not a stylistic choice — it is the diagram's main
  assertion, and it is the thing a future contributor is most likely to break by adding a
  stage-specific special case. If the drawing shows three copies, three copies is what the next
  person will build.

  Companion to GE-122c-4, which draws the remediation sequence. This one draws the structure;
  that one draws the interaction. They must agree on which stage engages the specialist.

  IT PO NOTE (2026-08-17): the structural fact most worth putting on this drawing is the one the
  BA could not see — the three stages run from TWO deployed layouts (.claude/hooks/ and
  .leafcutter/scripts/commit_guardian/). That is what makes GE-122d-1's single shared element
  non-trivial, and a diagram that omits it shows a simpler system than the one being built.
