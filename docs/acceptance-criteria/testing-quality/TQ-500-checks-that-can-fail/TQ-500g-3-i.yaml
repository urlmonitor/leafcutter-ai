id: TQ-500g-3-i
components:
  - testing_quality
  - build_orchestration
title: "An edit to an existing test that the sweep list does not name stops the work"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given two pieces of work, each changing three test files that existed before
    the work began — test_refresh.py, test_retry.py and test_export.py —
    and each adding a new file test_refresh_gate.py,
    and each changing the fixture retry_state in a conftest.py that existed
    before the work began,
      W1: its sweep list names the edits in test_refresh.py and test_retry.py
          only,
      W2: its sweep list names the edits in all three existing files and the
          fixture conftest.py::retry_state,
  When each piece of work reaches the step before commit,
  Then W1 stops, naming test_export.py and the tests changed in it, and
      conftest.py::retry_state, as edits to existing tests and their fixtures
      that the sweep list does not name,
    And W2 goes on,
    And when, after W2's list is recorded, the coder or a remedy agent edits
      test_retry.py again, W2 stops at the step before commit naming that
      test as unlisted, because only the test writer's list excuses an edit
      and it no longer matches the test,
    And test_refresh_gate.py, added by the work, is not treated as an existing
      test in either piece of work,
    And the decision comes from comparing the work with the code as it was
      before the work began, and from the sweep list — never from the
      writer's statement that its list is complete.
depends_on:
  - TQ-500g-3
  - TQ-500g-1-v
  - TQ-500g-1-vi
