assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "The verification step must distinguish three outcomes for a bulk data claim: PASS (real run agreed with the claim), BLOCKER (real run contradicted the claim), and INCONCLUSIVE (the real run could not be performed)."
  - "INCONCLUSIVE must never be collapsed into PASS; the unavailable-tool / unreachable-store path is fail-visible — the limitation is surfaced in the review output."
  - "The inconclusive message must name the cause (missing validation means or unreachable data store) so the user knows the claim remains unverified."
