    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "When the sink is unreachable/unwritable, a WARNING is emitted rather than the failure being swallowed silently."
  - name: test_failed_write_count_surfaced
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "A count of failed telemetry writes is surfaced to the operator."
