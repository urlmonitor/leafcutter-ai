id: DK-100e-3
title: "A close match asks you once: reuse it, or decide anew?"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the precedent dec-ef8ddcb79d668a67 scored 0.95, at or above memory.reuse_threshold
    (0.8 by default), not superseded, on a decision with no options of its own,
  When the precedent step finishes,
  Then you are asked once, in plain words, "Reuse it, or decide anew?", naming the earlier
    decision, who approved it and when, and the option it chose,
  And the decision waits for your answer and does not resolve on the precedent's score,
  And a precedent scored exactly 0.8 under the same conditions is offered the same way.
