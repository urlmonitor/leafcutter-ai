it_requirements:
  - "The state is produced by the declared-files seam (ACD-1600c-4) and carries the exact phrase 'no declared files'. Checks that need declared files report such a record as 'not evaluated: no declared files' verbatim and exclude it from any passed count."
  - "Absence of `declared_files` is never a validation violation at any enforcement point -- JSON schema, check-ac-schema hook (both branches), agent-side validator (ADR-026 safety rule 4)."
  - "An empty `declared_files` list is refused at the load-bearing check-ac-schema hook (both branches) and by the agent-side validator, with one message naming the record and saying a requirement with no files to declare leaves the list out."
  - "Nothing back-fills the field: no reader, report, hook or generator writes `declared_files`, and doc_links are never promoted into it."
  - "Store-wide report: a read-only, deterministic listing of every record in the 'no declared files' state, sorted by id, stating the total and the number of records scanned; two runs on the same store are byte-identical. Exposed through the declared-files seam's command-line entry point, not a second parser."
  - "The store-wide report completes within 10 seconds on a store of 5,000 records."
