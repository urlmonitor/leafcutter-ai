test_spec:
  - name: test_prose_only_reply_raises_typed_error_naming_stage_and_agent
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Reader given a prose-only string raises a typed error whose message carries the caller-supplied stage/agent identity (not a generic crash, not None)."
  - name: test_run_halts_on_unparseable_reply
    target_dir: unit_tests/
    framework: unittest
    type: integration
    description: "Stubbed agent returns prose-only output; the run halts with the named error rather than proceeding with missing output."
