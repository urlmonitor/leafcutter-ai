declared_files:
  - path: scripts/ci/post_merge_notice.py
    state: to_be_created
  - path: scripts/ci/_github_rest.py
    state: to_be_created
  - path: .github/workflows/post-merge-followup.yml
    state: to_be_created
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    WHERE THE NOTICE IS WRITTEN (consequence of user decision A). Not in the suite
    workflow. A separate workflow `.github/workflows/post-merge-followup.yml` triggered
    `on: workflow_run` for `Post-merge suite`, `Post-merge timing suite` (-xii) and
    `Post-merge fix proof` (-xvi) with `types: [completed]` (it runs from the default
    branch — VERIFIED doc; chaining limit 3, this is depth 1). Job `notice` (this record)
    runs for the two suite workflows only — `post-merge-red` and `post-merge-flaky` for
    the correctness suite, `post-merge-timing` for the timing suite — downloads the
    triggering run's `post-merge-verdict` artifact and applies it. This record builds the
    workflow file with the notice job alone; when -xv adds its `reevaluate` job, the
    notice job gains `needs: reevaluate` with `if: always()` so it can carry the
    re-evaluation's unrerunnable list onto the canonical notice and a failed fan-out never
    skips the notice (an ordering this record does not wait for). Its failure
    cannot touch the suite run's conclusion, which is the verdict. If the artifact is
    absent the job applies did_not_complete from the triggering run's conclusion
    (TQ-600a-13-v). The job is idempotent: re-running it on the same triggering run
    produces no further writes, which is the recovery path when it failed.
  - >-
    A PURE PLANNER AND A THIN APPLIER. The lifecycle is a function from (run verdict, the
    `post-merge-red` issues as read, the last-green anchor, the commit list) to an ordered
    list of writes; a separate applier performs them through the one REST client. Tests
    assert on the writes OBSERVED AT THE RECORDING FAKE SERVER.
  - >-
    THE NOTICE IS FOUND BY STATE AND LABEL, AND ONLY ISSUES COUNT. `GET /issues?
    labels=post-merge-red&state=open&sort=created&direction=asc&per_page=100`; items with
    a `pull_request` member are excluded. Default page size is 30, so `per_page=100` is
    required (GitHub expert, finding 8). Never by title or body substring. Never the
    search API (separate small rate limit, lags behind writes — GitHub expert, Q8).
  - >-
    THE CURRENT STATE LIVES IN THE DESCRIPTION (user decision I; the earlier
    "latest comment carries the state" rule is retired). VERIFIED (GitHub expert, Q8 and
    finding 5): rewriting an issue body is `PATCH /issues/{n}` under the same
    `issues: write` scope the notice job already holds; there is no separate permission.
    The issues listing returns each issue's body, so a reader gets the state without
    reading comments. Each red run also appends one comment for history.
  - >-
    THE LAST-GREEN ANCHOR IS THE SUITE'S OWN RUN HISTORY, NEVER AN ISSUE EVENT. The head
    commit of the most recent run of `post-merge-suite.yml` on `main` whose conclusion is
    success. Never derived from a close event or any issue timestamp (TQ-600a-13-iv).
    Needs `actions: read`.
  - >-
    ONLY A SETTLED RUN THAT TESTED MAIN MAY WRITE THE NOTICE. A run whose `ref` is not
    `refs/heads/main`, or whose event is not push / schedule / workflow_dispatch, writes
    nothing. A cancelled run superseded by a newer run (the displacement TQ-600a-13-ii's
    coalescing produces) writes nothing — otherwise every burst of merges would post a
    spurious "did not complete". Both decided by scripts/ci/_run_history.py, never
    re-implemented here.
  - >-
    THE COMMIT LIST IS A REAL GRAPH WALK — all parents — in a full-history checkout of
    the DEFAULT BRANCH (no pull-request code is involved). Word-not-list cases: no green
    run on record; an unresolvable anchor; a list truncated with an explicit count.
  - >-
    UNTRUSTED TEXT IS RENDERED INERT. Node ids and commit subjects are rendered as code.
  - >-
    THE STATE BLOCK. The description carries one HTML comment line
    `<!-- post-merge-suite-state v2 {json} -->` (see delivers_to); each history comment
    carries the same block for that run. The description's block is the current state.
  - >-
    LABELS ARE PRE-CREATED AND ASSERTED (user decision J; "observe it on the first red
    run" is retired). VERIFIED (GitHub expert, Q4/Q5):
    creating an issue silently DROPS labels when the caller lacks push access, and a
    missing label would be dropped too. So: the owner pre-creates `post-merge-red`,
    `post-merge-timing` and `post-merge-flaky` before go-live (a TQ-600a-13-x
    prerequisite), and the applier asserts the create response's `labels` contains the
    label, failing the notice job loudly otherwise. Whether a token with `issues: write`
    but no `contents: write` counts as push access for labelling is UNVERIFIED; the
    assertion is what makes the answer visible.
  - >-
    TWO OR MORE OPEN NOTICES — DECIDED 2026-10-08: lowest number is canonical; others are
    closed with `state_reason: duplicate` (VERIFIED value) and a comment naming the
    canonical one. The notice job carries job-level `concurrency` (fixed group per label
    family, `cancel-in-progress: false`) so two runs never apply concurrently. A pending
    notice job displaced by a newer one (VERIFIED: one pending per group) loses nothing
    that matters: the newer one applies a newer verdict, and the description is the
    current state, not a log.
  - >-
    THE NOTICE READ IS ONE PAGE. Every notice decision is made from the single
    `per_page=100` listing above plus the run-history reads; no per-issue reads are needed
    because the listing carries each body. The -xiii flaky window and the -x demotion
    count come from the verdict file and the run history, not from earlier notices.
  - >-
    PERMISSIONS ON THE NOTICE JOB, AND NOTHING MORE: `issues: write` (create, edit body,
    comment, close, reopen), `actions: read` (anchor, artifact), `contents: read` (commit
    walk, checkout with persisted credentials disabled). No `pull-requests`, no
    `actions: write` (the fan-out is a different job, TQ-600a-13-xv).
  - >-
    A FAILED WRITE FAILS THE NOTICE JOB, LOUDLY — AND ONLY THE NOTICE JOB. Per the error
    handling policy, logged and the job ends in failure; a partial application is reported
    naming what was and was not written. Because the notice is not the gate, this costs a
    notice, never the hold.
  - >-
    THE TESTS COST UNDER 0.8 s, IN THE DEFAULT SUITE. In-process through the real REST
    client against the shared recording fake server; one scratch repository of at most
    six commits built once per class (setUpClass), shared by -iv.
delivers_to:
  - agent: python-coder
    ac_id: TQ-600a-13-vii
    contract: >-
      The current streak state, in the canonical notice's DESCRIPTION as one line
      `<!-- post-merge-suite-state v2 {json} -->`: `run_id` (int — the run this state
      describes); `verdict` ("red" | "did_not_complete"); `stage` (string or null);
      `failing` (list of node ids, empty for did_not_complete); `run_url`; `head_sha`;
      `anchor_sha` (40-hex or null); `commits` (list of 40-hex, possibly truncated);
      `commits_omitted` (int >= 0); `red_since` (ISO-8601 — when the current streak's
      notice was opened or reopened).
  - agent: python-coder
    ac_id: TQ-600a-13-vi
    contract: >-
      The same state block, located by the hold on its held path with one read
      (`GET /repos/{o}/{r}/issues?labels=post-merge-red&state=all&sort=updated&direction=desc&per_page=30`,
      items with `pull_request` excluded) as the issue whose block `run_id` equals the
      latest settled run's id. Content only: its absence never changes a verdict.
  - agent: python-coder
    ac_id: TQ-600a-13-viii
    contract: >-
      The notice issue numbers a fix declaration may reference: the canonical open
      `post-merge-red` issue, and any other open one, each carrying the state block whose
      `run_id` identifies the red run it describes.
  - agent: python-coder
    ac_id: TQ-600a-13-iv
    contract: >-
      The open/update/close lifecycle and the run-history anchor, which TQ-600a-13-iv
      constrains for notices closed without a green run.
expects_from:
  - ac_id: TQ-600a-13-ii
    contract: >-
      The verdict artifact `post-merge-verdict` (file `post-merge-verdict.json`) as
      specified in TQ-600a-13-ii's delivers_to.
  - ac_id: TQ-600a-13-v
    contract: >-
      The did_not_complete verdict with its `stage`, applied like red (raise or update,
      never close) but worded differently; and scripts/ci/_run_history.py's settled-run
      function, which decides whether the triggering run may write at all and which
      successful run is the last-green anchor.
  - ac_id: TQ-600a-13-xv
    contract: >-
      ADDED WHEN -xv LANDS, not a build prerequisite of this record. The reevaluate job's
      output `unrerunnable` (JSON list of {`pr`: int, `head_sha`:
      40-hex, `reason`: string}), passed to this job through `env:` from
      `needs.reevaluate.outputs.unrerunnable` and appended to the canonical notice's
      history comment when non-empty.
test_spec:
  - name: test_tq600a_13_iii_each_verdict_and_notice_state_produces_the_stated_writes
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py planner + applier, in-process, through the real REST client against the shared recording fake GitHub server"
    description: >-
      Four cases — red/none-open, red/one-open, green/one-open, green/none-open. Assert
      the exact write set recorded: one create carrying the label with the state in the
      description; one description edit plus one comment and no create; one close plus
      one comment per open notice; no write at all.
  - name: test_tq600a_13_iii_duplicates_are_consolidated_on_the_lowest_number
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_notice.py in-process against the recording fake server"
    must_catch:
      - "the lifecycle searches by title, so a changed failing set opens a second issue"
      - "a red run updates the newest of two open notices rather than the lowest-numbered"
      - "the duplicate is left open"
      - "an unrelated issue, or a pull request carrying the label, is written to"
    description: >-
      Serve open notices #3 and #7, an unrelated open issue, a closed notice from an
      earlier streak, and a labelled pull request. A red run edits #3's description,
      comments on #3, closes #7 as duplicate pointing at #3, and writes nothing else.
  - name: test_tq600a_13_iii_an_unlabelled_create_is_a_failed_write
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "scripts/ci/post_merge_notice.py against a fake server whose create response omits the label"
    must_catch:
      - "the applier trusts its own request and reports success for an issue the service created without the label"
    description: >-
      The fake drops the label on create (the documented silent-drop behaviour). The
      notice job ends in failure naming the missing label.
  - name: test_tq600a_13_iii_only_settled_main_runs_write
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_notice.py in-process against the recording fake server"
    must_catch:
      - "a green dispatch on a feature branch closes the open notice"
      - "a cancelled run superseded by a newer run posts a did-not-complete comment"
    description: >-
      Verdicts on `refs/heads/feature-x`, and a superseded-cancelled run on main: zero
      write requests recorded.
  - name: test_tq600a_13_iii_the_commit_range_starts_at_the_last_green_head
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "a real scratch git repository (shared harness) and the fake server's run history naming the green run's head"
    must_catch:
      - "the walk follows first parents only"
      - "the anchor is the most recent run of any conclusion rather than the most recent successful one"
    description: >-
      Green at G, three commits merged (one via a merge commit with a side-branch commit),
      red at R. The list is exactly the commits reachable from R and not G; with no green
      run, words and no list; with an unresolvable anchor, the anchor is named.
  - name: test_tq600a_13_iii_a_failed_notice_changes_no_verdict
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_notice.py against a fake server refusing every write, then scripts/ci/_run_history.py's settled-run verdict (the function the hold reads) against the same served run history; once -vi exists the same test also calls post_merge_hold.py's verdict entry point"
    covers: [TQ-600a-13-iii, TQ-600a-13-vi]
    must_catch:
      - "the hold derives its verdict from the notice, so with no notice written a red run lets every pull request pass"
      - "the notice applier writes into the verdict artifact or the run record, so a failed notice changes the recorded conclusion"
    description: >-
      Red run history, every notice write refused: the notice job exits non-zero naming
      what was not written; the served run's conclusion and the settled-run verdict for
      that history are exactly what they were with the writes accepted (red). THIS IS THE
      DESCRIPTOR THAT CANNOT BE DROPPED: it is the gap decision A exists to close. It is
      buildable before -vi; the hold-module assertion is added when -vi lands.
test_rationale: |
  The canonical-notice invariant is served with every state likely to break it at once.
  The commit range is asserted against a real repository. Every write is asserted at the
  recording server, through the real client, because the planner can be right and the
  applier wrong.

  The label-drop descriptor exists because the platform documents that a create can
  succeed and silently drop the label; trusting the request rather than the response is
  the natural mistake.

  The last descriptor crosses into the run-history module (and, once it exists, the hold
  module) on purpose: the property "a failed notice does not release the hold" is a
  property of the two together, and testing either alone would miss the coupling the
  redesign removed. Cost: milliseconds plus a scratch repository of a handful of commits,
  under 0.8 s.
