title: "Each domain's context files tell future agents what matters there"
component: infrastructure
level: L1
status: active
criteria: |
  Component subfolders and skill directories carry accumulated context.

  Every domain folder in the project accumulates context files that capture
  what agents have learned about that domain. When a new agent works in that
  domain, it reads these files and immediately knows the local conventions,
  the common patterns, and the pitfalls to avoid. The context grows
  organically with each run.
