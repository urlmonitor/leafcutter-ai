assigned_agent: python-coder
estimated_complexity: L
it_requirements:
- Neutral trusted compiler accepts only strict typed declarative recipes with zero to two bounded traversals, canonical
  edge/kind/filter vocabulary and parameter values separate from syntax.
- Compiler injects repository/generation on every endpoint and relationship; fixed seed, fanout, candidate, result
  and deadline caps apply before activation.
- Persist generated Cypher and content digest beside descriptor and measured test/evaluation provenance; no raw
  host Cypher or arbitrary Python imports execute.
- Expectations are declared candidate checks, not semantic truth; verifier independently executes them and mandatory
  isolation/boundary checks. Unsupported recipe language yields an explicit code-build gap.
test_required: true
test_rationale: Prove observable behavior at the public service/kernel or trusted real-backend admission boundary.
  Provider and host doubles are labeled; no helper-only proof substitutes for the persisted end-to-end flow.
test_spec:
- name: test_km500_b_2_behavior
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Execute generated parameterized Cypher on a real-format projection with positive and negative expectations
    plus isolation and bounded-read tests; reject unsafe recipes, false expectations and modified content.
  covers:
  - KM-500b-2
  requires_db: false
- name: test_km500_b_2_real_query
  target_dir: tests/knowledge_live/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Run compiled query admission and scoped execution against the actual Neo4j test backend; record immutable
    generation, query digest and measured checks. Never substitute a simulated Cypher engine.
  covers:
  - KM-500b-2
  requires_db: true
