title: "test-runner is injected after every coder-class agent in the computed chain"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_type: flow_change
    and the assigned work agent is python-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then test-runner appears in the chain with a higher sequence number
    than python-coder
  And test-runner appears BEFORE pr-reviewer
  And test-runner's status is set to "needed"
  And test-runner is not dispatched until python-coder has signed off

  Given a ticket has change_type: config_change
    and the assigned work agent is python-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then test-runner still appears after python-coder
  And test-writer still appears before python-coder
  And the TDD sandwich (test-writer -> coder -> test-runner) is preserved
    regardless of change_type, whenever the work agent produces production_code

  Given a ticket has change_type: prompt_change
    and the assigned work agent is llm-expert (produces: prompt),
  When ticket-supervisor computes the agent chain,
  Then test-runner does NOT appear in the chain
  And the chain skips TDD-related agents entirely
