assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  reference_file_path: "config/test_requirements.schema.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ac_store/ unit_tests/commit_guardian/ -q"
  config_schema_fragment:
    type: object
    description: "The single reconciled required-proof description. One permitted-kind enum, and the entry-point field carried under one name and required for the reachability kind."
    required:
      - name
      - description
      - type
      - target_dir
      - covers
    properties:
      type:
        type: string
        description: "The single permitted-kind enum after reconciliation. live_dispatch is retired and must not appear, and must not be accepted as a synonym for reachability."
      surface_invoked:
        type: string
        minLength: 1
        description: "The entry-point field, kept under the name the retiring definition already used. Required when the described proof is of the reached-the-real-way kind; may hold the single unresolved sentinel."
  constraints:
    - "THE TWO DEFINITIONS IN SCOPE, NAMED. They are (1) config/test_requirements.schema.json's test_entry.type enum, and (2) config/ac_store_schema.json's test_spec[].angle enum. Those two, and nothing else, are what this AC reconciles."
    - "THE THIRD AXIS IS OUT OF SCOPE AND MUST NOT BE TOUCHED: config/ac_store_schema.json's test_spec[].type enum (unit / integration / e2e / behavioral) is the test-LEVEL axis — how heavy the test is and where it runs — and is orthogonal to the kind-of-proof question this AC settles. It is not one of the two definitions, its values are not disputed kinds, and it must come out of this change with its enum, its meaning and its description intact. Redefining it to the seven angle values makes it a duplicate of test_spec[].angle, deletes the project's only way to say 'this is an integration test', and instantly invalidates every record in the store: at 2026-08-18 all 1,923 test_spec entries that carry a type carry a LEVEL value (behavioral 891, unit 653, integration 352, e2e 15, component 12) and ZERO carry an angle value. Note also that a second key mirroring the same enum is itself a second statement of the permitted kinds and so fails this AC's first Then clause."
    - "ENFORCE ON THE GATE THAT ACTUALLY RUNS. Of the two definitions only one is load-bearing today: config/ac_store_schema.json is read by scripts/commit_guardian/check_ac_schema.py through jsonschema, and since the 2026 rework that verdict is authoritative (validate_manually() runs only when the schema is absent or jsonschema/PyYAML are unimportable). config/test_requirements.schema.json — the file named in reference_file_path — has NO reader at all: outside docs/, the string live_dispatch occurs only in that file. A reconciliation applied only to the inert definition is a no-op. Change BOTH, and state in the sign-off which one gates."
    - "THERE ARE THREE COPIES OF THE ENUM, NOT TWO. The _TEST_ANGLES frozenset in scripts/ac_store/generate_ticket_from_ac.py is a hand-maintained duplicate of the schema's angle enum. It must either read from the single source, or be covered by a cross-source set-equality contract test that reads both real files from disk. Leaving a hard-coded duplicate is exactly EPIC-ComputedQualityGates FP-1 layer 3 — a hook's allow-list and the config it mirrored were disjoint vocabularies, each tested against its own copy. n_location_rule: 'all' covers every one of these locations, not only the reference file. It does NOT extend the change to the out-of-scope level axis."
    - "No translation layer and no synonym: the retired name must be rejected, not rewritten. A mapping that accepts the old name and converts it preserves the two vocabularies with a converter in between that has to be kept correct."
    - "The entry-point field must survive under exactly one name. Note the store-side test_spec item schema is additionalProperties: false and has no entry-point property today, so carrying surface_invoked across is an explicit property addition, not an implicit one; without it the entry point can only be stated inside description prose, which no consumer can read reliably."
    - "Each disputed kind must be explicitly carried into the single definition or explicitly dropped, and the decision recorded. The disputed kinds are the ticket-facing values with no counterpart on the angle axis — 'manual' and 'live_dispatch' — plus 'unit' and 'integration' where the ticket side uses them as kinds of proof rather than as levels. 'e2e' and 'behavioral' are NOT disputed kinds: they are values of the out-of-scope level axis and are not up for a carry-or-drop decision here. Taking the union produces a definition that permits everything and constrains nothing."
    - "MIGRATE, DO NOT DEFER. Before an enum narrows, enumerate every record in the store that already carries a value being removed, and move those records onto a surviving value IN THE SAME CHANGE. 'The hook validates staged files only, so existing records are not invalidated in bulk' is not a mitigation — it converts an immediate, visible breakage into a landmine that fires on whoever next edits an untouched record for an unrelated reason. If the count of affected records makes migration impractical, that is evidence the value must NOT be dropped; say so and keep it."
    - "OUT OF SCOPE — DO NOT BUILD IT HERE. config/package_boundary.json:21 advertises check_test_requirements_refs.py as a shipped portable check and the file does not exist. Per the parent L1 that is a one-line remediation plus, if needed, an L2 widening under BP-900e. Building it under this AC would freeze a vocabulary into an enforcement point in the same change that is meant to settle the vocabulary."
    - "docs/reference/ac-schema.md must be updated in the same change. A machine schema that changes while the authoring-facing page still states the old vocabulary has produced a third definition rather than removing one."
delivers_to:
  - agent: python-coder
    contract: "One authoritative statement of the permitted kinds for a required-proof description, resolvable from a single file path, together with the single name of the entry-point field and the rule that a reachability-kind description must carry it. The test-level axis is NOT part of this contract and is unchanged by it. Consumed by BO-2900g-4 (the producer must conform) and BP-1100g-1 (the taught set must equal it)."
