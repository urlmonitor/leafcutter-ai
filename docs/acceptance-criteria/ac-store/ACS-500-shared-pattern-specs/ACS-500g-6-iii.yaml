it_requirements:
  - "This is the harness change ACS-500g-6-i and ACS-500g-6-ii both flagged as missing. Neither of those docs ACs can be claimed as enforced until this one lands: today nothing in the repo can express a per-round verdict, an all-or-nothing pass, or an invalid round."
  - "Surface — three real files, all verified present: scripts/evals/agent_eval_config.json (the per-agent registry that must carry the opt-in), scripts/evals/run_agent_eval.py (verdict computation, result record, process exit code), and scripts/evals/eval_selector.py (trigger-based selection). Change eval_selector.py ONLY if seeded-gap agents cannot be selected by the existing `triggers` mechanism; if they can, leave it untouched and say so rather than editing it to look thorough."
  - "Opt-in via the EXISTING key, not a parallel one: agent_eval_config.json already has a per-agent `scoring_mode` with values `label` and `artifact`. Add `seeded_gap` as a third value of that same key. Do not introduce a second mode-selection key — two competing switches is the duplicated-source defect."
  - "BACKWARD COMPATIBILITY IS A HARD REQUIREMENT. The three registered agents today — pt-classifier (scoring_mode label, threshold 0.70), mock-data-author and flow-author (scoring_mode artifact, threshold 0.66) — must produce byte-identical verdicts and the identical exit code before and after this change. The fractional-threshold path is untouched; an entry that omits `seeded_gap` gets today's behaviour with no config edit required."
  - "`threshold` MUST BE IGNORED, not reinterpreted, in seeded_gap mode. Do not implement all-or-nothing as 'threshold defaults to 1.0' — a config that sets threshold: 0.8 on a seeded_gap agent must not soften the rule. Reject or ignore it explicitly; a silently-honoured fractional threshold reintroduces exactly the percentage scoring this AC exists to forbid."
  - "Round status is a THREE-valued enum in the persisted result record: pass | fail | invalid. Two booleans are not sufficient — 'cannot be pass while any round is invalid' (ACS-500g-6-ii) must be representable after the fact, from the stored result alone, not only in memory during the run."
  - "The result record holds seeded and unseeded findings in two DISJOINT lists (reported_seeded and additional_findings, or equivalent). Make this a structural property of the record rather than an instruction to the scorer, so no code path can compute a ratio over their union by accident."
  - "Exit code is the gate: non-zero whenever the overall verdict is not pass (any round fail, or any round invalid); zero only when all three rounds are pass. Do NOT change the exit-code semantics of the label and artifact modes while doing so."
  - "Results are append-only under scripts/evals/results/ (the directory exists and is gitignored). A re-run of an invalid or failed round must write a new record beside the earlier one, never overwrite it — otherwise ACS-500g-6-i's 'the earlier failing verdict remains on record' and ACS-500g-6-ii's 'the invalid result stays on record' are both unverifiable."
  - "Seeded items per round travel in the eval row's `expected` payload, which docs/product-truth/schemas/agent-eval.schema.json declares open (additionalProperties: true). Extend that payload rather than adding a fourth top-level row key, and keep the seeded items out of `input_field` — the blinding rule of ACS-500g-6-ii depends on the input/expected split the harness already has."
  - "NO GREP-ONLY TESTS. Every test below must call the verdict computation (and, for the exit-code case, run the harness entrypoint) and assert the returned value. A test that asserts a mode name or a status string is present in the source passes on dead code and is forbidden in this repo — this is a gate AC, and the fast-lane runner shipped phantom-done precisely this way."
  - "Tests belong in unit_tests/evals/ (the package exists, alongside test_eval_selector.py and test_trigger_sha_stamp.py). Include a regression test that pins the unchanged fractional path, not only the new mode."
delivers_to:
  agent: python-coder
  contract: "A seeded_gap scoring mode in scripts/evals/: opt-in via scoring_mode in agent_eval_config.json; a per-round verdict of pass|fail|invalid where pass requires every recorded seeded item; an overall verdict that is pass only when all three rounds pass, with no averaging or percentage path and no honoured fractional threshold; unseeded findings in a disjoint additional_findings list; append-only results under scripts/evals/results/; and a non-zero process exit whenever the overall verdict is not pass. This is the enforcement ACS-500g-6-i (all-or-nothing scoring) and ACS-500g-6-ii (invalid round on a leaked answer key) each declare they depend on and do not themselves provide."
expects_from:
  ac_id: ACS-500g-6
  contract: "The three-round protocol body and the {round_seeded_items} slot, whose per-round recorded seeded items are the input this scorer compares the agent's reported findings against."
