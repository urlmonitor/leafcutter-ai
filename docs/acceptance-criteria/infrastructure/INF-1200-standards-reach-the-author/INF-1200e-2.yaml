id: INF-1200e-2
title: "An examination that could not look says so, and a run that examined nothing never reads as a clean one"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the declaration of standards cannot be read, or the ownership record
    cannot be read, or either can be read and yields nothing to compare,
  When the condition is examined,
  Then the outcome states that the examination could not be carried out, and
    which of its two inputs was unavailable or empty,
  And the outcome does not state that no gaps were found,
  And given an examination that could be carried out,
  When its outcome is read,
  Then it states how many pairings of a specialist and a kind of file it
    examined, and that number is greater than zero,
  And given two runs, one that examined every pairing and found no gaps and one
    that examined none at all,
  When their outcomes are placed side by side,
  Then they are not the same, and which of the two occurred can be told from the
    outcome alone without going and looking at the inputs.
depends_on:
  - INF-1200e
