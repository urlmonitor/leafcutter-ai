notes: |
  GAP C of BO-2900g, first half: make the definition single. BO-2900g-4 is the
  second half — make what is actually produced conform to it — and carries the
  hard ordering constraint as a depends_on edge.

  THE OBSERVED DISAGREEMENT, stated concretely so a reader does not have to
  re-derive it. The ticket-facing definition permits unit / integration / manual
  / live_dispatch and makes the entry-point fact conditional on live_dispatch.
  The store-facing definition states the kind of proof on the seven-value angle
  axis, with no entry-point field at all, and states the test LEVEL — how heavy
  the test is and where it runs — separately on its own axis (unit / integration
  / e2e / behavioral). The disagreement is about the kind of proof: the ticket
  side muddles level and kind into one list and uses an older name for the
  reached-the-real-way kind. The LEVEL axis is a third thing, is not in
  disagreement, and is out of scope — see the 2026-08-18 amendment. This is
  EPIC-ComputedQualityGates FP-1 layer 3 in a different registry: two
  vocabularies, each tested against its own copy, with no cross-source contract
  between them.

  WHY 'NO TRANSLATION LAYER' IS IN THE CRITERIA. A mapping that accepts the old
  name and rewrites it is the cheapest way to make both sides pass, and it
  preserves exactly the thing this AC exists to remove: two vocabularies, now
  with a converter in between that has to be kept correct. The user's stated
  recommendation, carried from docs/testing/test-angles.md, is one vocabulary,
  not a translation layer.

  WHY THE CARRY-OR-DROP CLAUSE EXISTS. Reconciling two enums by taking their
  union produces a single definition that permits everything and constrains
  nothing. Requiring each disputed kind to be explicitly carried or dropped
  forces the decision to be made rather than avoided. It is bounded to the two
  definitions in scope precisely because an unbounded version of it was read as
  licence to delete a third, orthogonal axis.

  BOUNDARY. This AC settles WHAT THE WORDS ARE. It describes no gate, no block
  and no done-state consequence, and it says nothing about whether any proof was
  achieved.

  IT-PO ENRICHMENT NOTE (2026-08-17). declares_side_effect is deliberately NOT
  set here. The Then clauses assert the CONTENT of two config files after the
  change, which is true of every code change; they assert no durable observable
  effect produced by running the work. Marking a config-vocabulary edit would
  route user-surface-smoker onto a JSON edit and is exactly the "a derivation
  that marks everything is indistinguishable from one that marks nothing"
  failure BO-2900g-2 warns about. A third enum copy (_TEST_ANGLES) was found
  during enrichment and is named in the constraints.
