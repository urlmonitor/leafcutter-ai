notes: |
  This AC turns BO-2900e from a one-off text edit into a standing property. Without it,
  the four messages are written once, verified once, and the fifth cause — added a year
  later by someone who has not read this tree — arrives as a bare refusal with no item,
  no side and no action. That is how message quality actually degrades: not by anyone
  rewriting a good message badly, but by new causes bypassing the requirement entirely.

  WHY THE GUARD MUST BE RUN TO CHECK ITS OWN MESSAGES. The obvious implementation
  inspects the guard's message templates. Templates prove nothing about which template
  a run reaches — a cause wired to the wrong template, or to none, passes a template
  inventory and fails a real user. This tree exists because a structural test passed on
  code that never executed; putting a structural test on the remedy would be a
  particularly poor joke. The checks read what a real run emitted.

  THE THIRD SCENARIO IS A DELIBERATE LOOSENING and it is as important as the other two.
  A check that pins exact message strings makes every wording improvement a test
  failure, so the messages freeze at their first draft and the checks get weakened to
  restore movement. Asserting the three required elements — item, side, action — and
  nothing about the prose keeps the messages editable and the requirement intact. State
  the elements; never the sentence.

  BOUNDARY: BO-2900e-1 says what each message must contain and BO-2900e-2 says the run
  must be complete. This AC says the requirement survives the addition of new causes and
  is established by execution. It is not a duplicate of either; it is what stops both
  from decaying.

  Note for the IT PO: the first scenario needs a way to enumerate the guard's refusal
  causes at check time. If that enumeration is derived from source text it inherits every
  weakness described above — prefer deriving it the same way BO-2900b-1 derives the
  capability inventory, from the built object rather than from its source.

  2026-08-13 (IT PO enrichment). The BA's note is adopted verbatim as a constraint: the
  cause registry is read off the BUILT shared message composer that BO-2900e-1 requires,
  which is also why that composer had to be made a single shared function — a per-surface
  composer would give the meta-check two registries to reconcile and a seam to miss a
  cause through.
