notes: |
  SEAM FROM THE L1 NOTES: serialising concurrent commits is BO-1600a's promise (prevention only by
  design) and BO-1800 removes the shared store. This record cites BO-1600a rather than re-specifying
  the lock; it states only that the shared step is where the lock is taken, for every route. Stale
  lock recovery is BO-1600b's (KI-BO-20260901-0920's warning: a lock without stale recovery turns
  corruption into deadlock).

