  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a conflict decided as a narrowing, with the amendment recorded, where the
    fault entry still reads open and the requirement still reads finished so the
    pairing still exists,
  When the reconciliation runs again,
  Then that pairing is not presented as needing attention,
    And it is not counted among the outstanding conflicts,
  So a disagreement that has been settled does not reappear on every run.

  Given the same decided conflict,
  When the fault entry is reopened, or the requirement's wording changes again,
  Then the conflict is raised again as needing a fresh decision,
    And the earlier decision is presented alongside it, stating what it was and why
      it no longer applies,
  So the settlement is retired by the facts changing and not by a person having to
    remember it existed.

  Given a decided conflict and a second, different pairing between the same fault
    entry and a different requirement,
  When the reconciliation runs,
  Then the second pairing is raised,
  So a decision covers the pairing it was made about and nothing wider.

  Given a decision recorded against a conflict,
  When someone asks why that pairing is not being reported,
  Then the decision is findable from the pairing,
  So suppression is always explained by a recorded decision that can be looked up.
