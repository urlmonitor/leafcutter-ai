assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Every scenario must be verified by the exit status of the real pre-commit check, not by the return value of an exemption predicate. A predicate that answers no is not evidence a commit was blocked, and this is the arm where that difference matters most."
  - "The whitespace shape must be a run-of-ordinary-words test, not a contains-a-whitespace-character test. State the invariant the implementation has to hold: adding a single space at the start, at the end, or in the middle of an otherwise unrecognised value must not change the verdict. Any implementation for which one keystroke flips a report into an exemption fails this AC regardless of what the predicate returns."
  - "No rule other than the generic-credential rule may be narrowed anywhere by this feature. The private-key, cloud-access-key, exchange-API-key and high-entropy rules must keep full strength inside every prose location."
  - "The exemption must never be granted at file level. A staged file holding one exempt finding and one reported finding must still block, and the reported count must be exactly one — a count of zero and a count of two are both failures, and both are reachable from plausible implementations."
  - "Every scenario must be red before the implementation lands. In particular, each must fail against an implementation that grants the exemption per file and against one built on a naive contains-whitespace test — those are the two cheapest wrong implementations, and a test suite that cannot distinguish them does not discharge this AC."
  - "The pre-existing file-level high-entropy exemption (KI-CG-004 in docs/known-issues/commit-guardian.md) is explicitly out of scope. Do not close it, do not extend it, and do not cite it as precedent for a file-level generic-credential exemption. The two must remain separately tracked."
  - "The exemption must be unreachable for any value the shape vocabulary cannot classify: unclassifiable defaults to reported, and that default must be exercised, not merely intended."
  - "ADR-001 parity: any code this AC causes to change lives in the canonical copies under templates/; verify through the build.py round-trip."
