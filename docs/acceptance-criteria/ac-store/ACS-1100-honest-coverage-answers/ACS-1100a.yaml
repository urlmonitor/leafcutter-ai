  required and is delivered — by ACS-1100e-1, not by a child of this L1.
change_target: code
risk_surface: contract_boundary
notes: |
  The load-bearing word is INDEPENDENTLY, and it means independent of the query's
  FILTERS and JOIN KEYS — not independent of the traversal. A denominator derived by
  applying the result pass's own filters is worthless: if the filter missed 140
  records, so does the total, and the answer reports 40 of 40. A single filter-free
  enumeration of the store root that yields both the total and the results is
  correct and preferred, because a filter-free enumeration has no blind spot to
  inherit and a second traversal is pure waste. See ACS-1100a-2.

  EXEMPTION (do not re-derive it here — it is settled at the L0): the AC-tree
  child-limit counter is out of scope for the independent-second-source rule,
  because ACS-100h-7a (approved) mandates exactly one implementation of that
  traversal. Do NOT write a second traversal for it. Its coverage honesty is
  satisfied through ACS-1100b instead (the one callable states what it examined
  and excluded).

  Independence applies to the DENOMINATOR, not to the rule applied per record.

  ALREADY SATISFIED, FOR ONE SURFACE ONLY (2026-08-18, PO). KM-ADM-005 shipped a
  denominator on the artifact map's test-covers edge: "244 of 607 done ACs carry no
  covering test tag (measured 2026-08-13)". Two things to take from it:
    - Its counting method is the SHAPE THIS L1 WANTS and is worth copying rather
      than re-deriving: a filter-free rglob over the whole store root yields the
      done population, and the tagged set is joined against it on a separate key
      (the `# covers:` tag). Filter-free enumeration, independent join key — exactly
      ACS-1100a-2, arrived at independently. Its one subtlety is worth carrying into
      L2: it strips quotes from ids before joining, because a quoted `id: "GE-114-1"`
      would otherwise not match its bare-token tag and four records were spuriously
      counted as untagged. A join-key normalisation bug IS a denominator bug.
    - It is a hand-typed constant in a prose note and a python module constant, with
      a measurement date attached. It will rot, and TQ-400 has already produced a
      second, different figure for the same population. This L1 is what stops that;
      when it builds, generate the figure and leave the shipped note working.
