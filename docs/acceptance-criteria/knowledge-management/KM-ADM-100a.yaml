title: "A connection's trust rating reflects what actually runs, and says how much it covered"
component: knowledge-management
level: L1
status: active
req_status: draft
readiness: draft
priority: medium
criteria: |
  Trust ratings come from what really enforces a link — and state what they cover.

  A link is rated on the basis of the check that genuinely runs against it, never on
  a check that merely exists, and the rating declares how much of the project that
  check actually looked at — so "protected" can never be read as "protected
  everywhere".
