created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700g.yaml"
criteria: |
  Given the commit-guardian manifest declares required hooks on stages beyond the
    pre-commit stage (for example a commit-msg or pre-push stage),
  When the probe runs,
  Then it verifies the shared hook and the required hooks for each such stage the
    same way it does for the pre-commit stage, and a stage whose required hook is
    absent causes the probe to exit non-zero naming that stage.
  Or, if the probe deliberately covers only the pre-commit stage, its output
    states that scope explicitly with a stated rationale rather than silently
    ignoring other stages.
depends_on: [BO-1700g, BO-1700a-1]
