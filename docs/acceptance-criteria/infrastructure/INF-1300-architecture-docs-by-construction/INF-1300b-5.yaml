test_rationale: >-
  The failure this page exists to prevent is not being wrong on the day it ships; it is being
  right on that day and silently wrong a month later, because everything it states is
  derivable from a declaration and from an emitted artifact that both move. Every descriptor
  is therefore a comparison against one of those two rather than a reading of the page, and
  three of them are movement arms: add a kind, retire a kind, change a kind's notation. A
  suite that stays green through any of those is not checking the page, it is describing it.
  Two further shapes are deliberately excluded. A stored expected copy of the tables would
  pass precisely when the page and the copy are equally stale, the same construction
  INF-1300b-1 rules out for section shapes. And "the project's checks pass over documents the
  page describes" says nothing at all about the obliged-fact column, because that obligation
  is declared in the vocabulary and enforced nowhere in the codebase — verified by search —
  so that column is asserted against the declaration directly. The both-directions
  requirement on the key column is the quiet one: a one-directional check is satisfied by a
  page that still lists notation the pictures stopped using, which is exactly the state a
  reference drifts into.
