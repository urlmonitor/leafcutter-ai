id: ACS-1300b-3
components:
  - ac_store
  - build_orchestration
title: "A newly added delivery path cannot quietly join the bypassing set"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a repository in which every delivery path either reaches the link-recording step
    or carries a stated exemption,
  When the check over the enumeration runs,
  Then it reports nothing,
  Given the same repository with one delivery path added that neither reaches the
    link-recording step nor carries a stated exemption,
  When the check runs again,
  Then it reports that path by name, together with the classification it lacks and what
    would resolve it,
  And the gate that runs the check acts on its result, so deleting the single line that
    consumes the result turns that same reported case green,
  And in the same run in which the added path is reported, the paths that do reach the
    step are not reported, so the check discriminates rather than firing on everything,
  And a path that reached the step and then had that hand-off removed is reported by the
    same check, so the guard covers regression of an existing path and not only addition
    of a new one.
