  labels and a generated contract section in its narrative,

  When a person opens that node in Atlas,

  Then the author''s narrative before the generated marker appears once,

  And the contract fields and examples appear once in the structured detail display,

  And the generated narrative section and compatibility badges do not repeat those same fields and examples,

  And authored text is not removed merely because it contains words also used by a contract.'
