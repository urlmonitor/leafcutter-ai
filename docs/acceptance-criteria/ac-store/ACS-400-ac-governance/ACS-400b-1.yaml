criteria: |
  Given an existing AC YAML file has its work_status field changed
    (e.g. from "todo" to "in_progress" or "done") in the staged diff,
  When the committing agent is an implementation agent
    (e.g. python-coder, test-writer, sql-coder, frontend-coder),
  Then the commit proceeds without governance violation,
  And the work_status update is accepted into the repository.
