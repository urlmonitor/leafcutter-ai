notes: |
  SCOPE LINE, deliberate and load-bearing. This AC specifies the MEASUREMENTS a retirement
  decision would need — override rate per gate, override rate per problem kind, the
  clustering view, a parameterised window, and whether an override was followed by a real
  defect. It does NOT specify any threshold or any action taken at a threshold.

  PREMISE CORRECTED 2026-08-13. An earlier revision of these notes said the four action
  rules the user described (downgrade a blocker to a warning above a high sustained
  override rate; retire a gate that is almost always overridden with no downstream
  defects; promote a rarely-overridden high-volume gate to a deterministic hook;
  re-prompt a single problem kind rather than the whole gate when overrides cluster on
  it) "all live in BO-2500d-1..4". They do not. A grep of the whole BO-2500 tree for
  "override", "threshold" and "false positive" returns no relevant hit; BO-2500d-1..4 is
  a static fast-lane / heavy-lane agent split whose four L2s are all already
  work_status: done. Those four action rules are written in no AC in the store.

  The scope line still stands on its own merits: measurement and policy are separate units
  of work, and this AC is the measurement half. Each of the four decisions above IS
  computable from the figures required here, which is the point — but where they get
  written is an open question recorded in the BO-2800 L0 notes, not a pointer to BO-2500d.
  Do not add a BO-2500d doc_link to this AC; there is no relationship to record.
