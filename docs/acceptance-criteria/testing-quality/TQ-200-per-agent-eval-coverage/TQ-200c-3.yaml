notes: |
  WHY THIS IS ITS OWN AC AND NOT A CLAUSE OF c-2. The routing decision (c-2) can be
  perfectly derived and still be implemented as a choice between two mutually
  exclusive outcomes — "this is deterministic work" or "this is judged work" — which
  is the shape the existing code already has, merely with a better-informed
  condition. That implementation satisfies every clause of c-2 and is wrong for most
  real llm-expert requirements, because most of them need both: the frontmatter rule
  IS mechanically checkable and the prompt's effect on a model is NOT. Stating
  simultaneity separately means an implementer cannot ship the exclusive version and
  claim the routing AC.

  WHY THE THIRD CLAUSE (ADDING ONE LEAVES THE OTHER UNALTERED) IS LOAD-BEARING. This
  is BO-2900g-1's order-preservation rule applied to a different axis, and for the
  same reason it gives there: an implementation that satisfies a new demand by
  re-deriving or normalising the existing plan has discarded a human's authored
  contract to satisfy a mechanical rule, which is a worse defect than the one being
  fixed. The store has 124 named test contracts on llm-expert requirements. Whatever
  routing adds must arrive alongside them, not instead of them.

  WHY THE FOURTH CLAUSE IS ABOUT TRANSIT AND NOT ABOUT STORAGE. Two demands sitting
  in one YAML record prove nothing. The failure this clause is aimed at is the
  plausible half-implementation where a mixed plan is authored correctly, the
  deterministic half reaches templates/agents/test-writer.md, and the judged half
  quietly evaporates because nothing downstream knows what to do with it — the
  present behaviour generalised. Verified 2026-08-18: the whole test-contract branch
  in generate_ticket_from_ac.py is gated on is_code_ac (line 2740), so today the
  drop happens for the entire plan at once; a naive fix moves the drop to the judged
  entries only, which looks like progress and is still a drop.

  THE FIFTH CLAUSE FORBIDS THE PLAUSIBLE DODGE. "Split it into two requirements, one
  per kind of proof" is a real and tempting answer, and it is wrong here: it makes
  the number of requirements a function of how many kinds of proof a behaviour needs,
  which fragments the store, doubles the parent/child bookkeeping, and leaves the two
  halves free to drift out of agreement about what behaviour they are proving. The
  normal BA rule that one AC carries one behaviour is untouched — this clause is
  about ONE behaviour needing two kinds of proof, not about two behaviours.

  DEPENDENCY REASONING — WHY c-1 AND DELIBERATELY NOT c-2.
    - depends_on TQ-200c-1: two demands cannot be legible as their own kinds unless
      two kinds are sayable. Without c-1 the best available plan is two entries that
      both say "pytest", which fails the second clause by construction.
    - No edge to TQ-200c-2, on purpose. This AC is about the shape and survival of a
      mixed plan, not about how the mix was chosen. It is fully testable against a
      hand-declared pair of demands, and holding it behind the derivation work would
      delay a protection that stands on its own. The interaction is real but
      one-directional and needs no edge: once c-2 lands, mixed plans will be produced
      automatically rather than by hand, and nothing about this AC's behaviour
      changes. Recorded explicitly so the it-po does not add the edge on aesthetic
      grounds (the same reasoning BO-2400g-2 records for its non-edge to BO-2400g-1).

  BOUNDARY. This AC does not decide which kinds any given work needs (c-2), does not
  register the judged demand with the runner (c-4) and produces no verdict when a
  demand cannot be honoured (c-5). It says only that two demands can travel together
  and both arrive.
