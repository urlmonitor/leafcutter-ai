  - reason: "IT PO technical enrichment, 2026-08-26. Named the three concrete deployed-layout hazards the criteria describe abstractly: the checker is not in templates/ so it is never deployed; it computes its root from __file__ and would scan the package checkout through a symlinked .leafcutter; and it resolves skills at templates/skills/, a directory that does not exist in a consumer install where skills deploy to .claude/skills/. Added the silence-is-not-a-pass requirement because the natural repair for the third hazard (treat a missing directory as an empty known-set) produces either a storm of false violations or, on the next repair, a vacuous pass."
