notes: |
  GE-130c notes: attribution to the calling agent is the open design risk (GE-120e). The multi-agent
  case is the real operating condition -- five agents were writing in this worktree during this
  BA run. How attribution is established is the IT PO's; this record fixes only the observable
  outcome. The undeterminable case is GE-130c-2-i.

  DECIDED 2026-09-17 (user) -- ATTRIBUTION MUST BE POSITIVE, BY DESIGN. A stop is made only when
  the change is positively attributed to this caller's command. "Could not tell" never stops
  (GE-130c-2-i, persisted and reported by GE-130c-2-ii); "could not look" still stops
  (GE-130c-1-i).

  FIXTURE: the "other agent" in this record's scenarios must act through the hooks (its edits and
  commands pass the same PreToolUse/PostToolUse hooks) so its change is attributable to it. A
  change made outside the hooks cannot be positively attributed and falls to GE-130c-2-i -- a
  fixture that writes the other agent's file directly from the test would exercise c-2-i, not
  this record.

  RECOMMENDED ATTRIBUTION SOURCES FOR THE IT PO (not binding):
    (a) a per-worktree append-only ledger of hooked Edit/Write allowances and shell PostToolUse
        after-hashes, keyed by GE-129's caller identity (agent_id / session) with a
        per-invocation token fallback;
    (b) an in-flight command registry written at PreToolUse and cleared at PostToolUse, so overlap
        between commands is detectable even without identity;
    (c) GE-130d's looking-only classification as a tie-breaker (an overlapping command that only
        looks at files cannot be the author).
  Precedents for per-worktree records: inline_work_guard.jsonl, readme_markers/.

  SCOPE: this attribution policy applies to the documentation guard and the guide-read guard only.
  The task-lock guard (inline_work_guard) keeps "anyone under the lock is stopped": it stops any
  writing command under the build lock regardless of attribution, except the build workflow's own
  dispatched agents identified by caller identity (GE-130a-4). Its lock semantics are unaffected
  by this record.

  declares_side_effect: false.
