roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Nothing is lost when work stalls, and nothing collides when work runs at once.

  Getting a requirement built is a process that can go wrong: an attempt fails,
  it is tried again, and eventually somebody has to decide what to do. That
  history belongs to the requirement, so anyone -- or anything -- picking the
  work up later can see what has already been tried and knows when trying again
  is pointless and a person needs to be asked. At the same time, more than one
  piece of work can be in flight at once without two efforts landing on the same
  requirement, and an interrupted effort hands its work back instead of leaving
  it looking permanently taken. The result is a build process you can safely run
  in parallel and safely walk away from.
