notes: |
  GREEN ON ARRIVAL — SAY IT PLAINLY, BECAUSE THE FIRST RED-BASELINE RUN WILL LIE.
    This behaviour already ships. PR #728 wrapped the shared launcher's dispatch sites so
    that a launch target which cannot be started at all produces a named reason and a
    refusal instead of an unhandled error escaping the commit. That landed with NO
    acceptance criterion of its own, and it was claimed as implementation of GE-127a-1,
    where no criterion constrains it. This record is the missing specification, written
    after the fact and saying so.
    NO TEST ANYWHERE ASSERTS THE PROPERTY. An ordinary red-baseline run against these
    criteria will therefore come up GREEN and prove nothing whatsoever. Treat a passing
    first run as the instruction to go build the mutation below, not as a completed AC.
    implemented_by is deliberately EMPTY even though satisfying code is on the branch:
    nothing has been verified to implement this, and asserting otherwise is exactly the
    phantom-done shape that produced the GE-127a-1 mis-citation.

  THE NAMED MUTATION THAT MANUFACTURES A REAL RED BASELINE — EXECUTE IT, DO NOT DESCRIBE
  IT. It has two halves and BOTH are required: an injection into the launcher, and a
  genuinely unstartable launch target. Either half alone is inert.

    INJECTION. Revert ONE of the shared launcher's error-handling arms around the point
    where the delegated check process is started — the state before the shipped fix — so
    that a failure to start escapes as an unhandled error rather than being converted into
    a reported reason. Apply it to the INSTALLED copy that commit-time actually runs, not
    to the canonical template; an injection into the template alone does not land and
    fails GREEN, which is the same trap GE-120g-1 records.

    THE UNSTARTABLE CONDITION — MAKE IT REAL, IN BOTH OF ITS TWO SHAPES. In the fixture
    repository, edit the installed registration so one check's declared launch program is:
      (a) a path that does not exist on disk at all; and, in a second run,
      (b) a path that DOES exist and is a real file, with its execute permission removed.
    Both must be exercised. They fail at the same moment for different underlying reasons,
    and an implementation that only handles the missing-file shape passes (a) and leaves
    (b) crashing — which is the specific way a partial fix looks complete here.

    THE PROOF. Under the injection, in the fixture, an ordinary `git commit` must fail
    WITHOUT naming the check and WITHOUT naming the unstartable program, handing the author
    a raw crash report instead. On revert, the same commit must still fail, and must now
    name both. RED is "refused unreadably"; GREEN is "refused, and told what happened". The
    commit outcome is the same on both sides of the mutation — so a descriptor that asserts
    only that the commit was refused CANNOT go red under this injection and does not cover
    this record. Assert on what the attempt reported.

    NEVER SATISFIED BY SOURCE INSPECTION. A test that greps the launcher for the presence
    of an error-handling arm is green on the shipped code today, green under a refactor
    that keeps the arm and drops the reported reason, and green on dead code. It does not
    cover any clause here. Neither does a test that simulates the failure in-process by
    substituting the launch machinery: the condition this record names is that the program
    genuinely will not start, and a simulated failure exercises a different path.

  THE DESCRIPTORS MUST EXERCISE A REAL `git commit`. This is a correction of a shape
    already flagged twice on this surface. GE-127a-1's descriptors reach the gate by
    running the pre-commit tooling against a named hook directly; both the PO and a prior
    BA judged that insufficient here, and they are right: this record's whole subject is
    what an author is handed when a check cannot be started during an ordinary commit, and
    invoking the check by hand bypasses the very dispatch path under test. Every clause
    here is an outcome of a real commit attempt in a real temporary repository with the
    checks installed.

  THE BLOCK-VERSUS-ANNOUNCE DECISION, MADE EXPLICITLY, AS THE L1 REQUIRES.
    GE-120's L0 and GE-120a both instruct that whether a cannot-run condition BLOCKS or
    merely ANNOUNCES is a per-check decision to be made explicitly at L2, with no blanket
    default. For this condition the decision is BLOCK, and the reason is that this
    condition is the only one in the family where the unverified scope is unbounded and
    unknowable: a check that ran and hit a bad input knows what it skipped, and a check
    that fell back to a weaker instrument knows what it examined, but a check that never
    started examined nothing and can report nothing about the staged change. Announcing and
    proceeding would leave the author with a warning whose scope nobody can state.
    This is a decision about ONE condition, not a repeal of the fail-open convention:
    GE-116a-1-iii (approved) is untouched, and GE-120a-1-i remains the contradiction guard.

  BOUNDARY WITH GE-120a-1, LOAD-BEARING AND THE MOST LIKELY MERGE MISTAKE.
    GE-120a-1's population is a check that RAN and could not reach a prerequisite; its
    deliverable is a result value the check itself emits, and its two Roman constraints
    (-i ordinary pass on one bad input, -ii degraded-but-ran) are both further values in
    that same vocabulary. This record's population is a check that never became a process
    at all. It cannot emit a vocabulary value, cannot consume GE-120a-1's delivers_to
    contract, and is not observable from GE-120a-1's fixture. A fully correct
    implementation of GE-120a-1 and both of its constraints leaves every clause here
    unmet. Merged, an implementer satisfies whichever half is cheaper — which on this
    surface means the one that is already shipped.

  WHY THIS IS AN L2 AND NOT A ROMAN CONSTRAINT ON GE-120a-1 — the alternative was
    considered first, specifically because it would have needed no waiver (an L2 parent
    carries no hard child cap, so a third Roman under GE-120a-1 was free). It was rejected
    on four counts, and the fourth is decisive:
      1. Different reporter. Every clause of GE-120a-1 is about what the CHECK reports.
      2. Different population. GE-120a-1 targets one check plus whichever inherit its
         shared vocabulary; this is a property of the way every check is started.
      3. Different surface and different fixture. Nothing in GE-120a's subtree touches the
         shared launcher, and GE-120a-1's fixture is a second working copy without the
         deployed layout — a fixture in which this condition never arises.
      4. GE-120a-1 is work_status: done. Attaching an unbuilt constraint to it would reopen
         a completed node and make a done composite false — the precise done-accounting
         damage that GE-120's own notes cite as the reason GE-118a was rejected as a parent
         for this family. Buying a free slot with a false done is a worse trade than an
         audited waiver.
    GE-120a-2 was also considered as a Roman host, on the ground that this is the case
    where no recorded disposition can be consulted. Rejected: the disposition interaction
    is a fence, not the subject. The subject is that the author is told what could not be
    started, and that half would have been smuggled in under a parent about registration.

  NO COUNT MAY BE STATED OR IMPLIED, BY THIS RECORD OR BY ANY TEST OF IT. How many
    registered checks could fail to start, and under what conditions, has not been
    measured by anyone. No criterion here states one, and a descriptor that pins a number
    is out of contract. The one structural fact relied on — that all registered checks are
    dispatched through a single shared launcher — is carried from GE-120g's measurement
    without its figure, and should be re-measured rather than inherited.

  THE PARENT'S DOCUMENTATION TRIGGER IS DISCHARGED, NOT IGNORED. GE-120a carries
    documentation_triggers: [reference-doc], and GE-120a-5 already owns it: correcting, in
    place, the reference that today records the fail-open convention without its limit. The
    cannot-be-started state is the outer boundary of that same rule and belongs in that
    same correction — as a fourth state alongside ordinary success, degraded-but-ran and
    could-not-check. Authoring a second documentation AC here would produce a second
    document stating a fourth rule, which is the exact failure GE-120a-5's own criteria
    forbid. Recorded here so the omission reads as a decision: no documentation AC is
    produced, and GE-120a-5's sweep should be widened to include this state when it runs.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
    test_rationale, package_surface and declares_side_effect. Those are the IT PO's. The
    named mutation above, with both of its unstartable shapes and its installed-copy
    caveat, is written to be turned directly into test descriptors; losing either shape
    makes this record pass on a partial fix.
