notes: |
  A parity check that has only ever been observed passing is indistinguishable
  from a parity check that is not wired up. This criterion pins the three-run
  proof through one entry point: agree -> pass, one-sided change -> block naming
  the divergence, mirrored change -> pass again. Asserting that a warning is
  printed is not sufficient; the one-sided change must be shown to block.

  TEST ANGLE: the one-sided change must be applied to a real copy of the reader
  and the check run as a process, not simulated by handing the comparison two
  fabricated result sets — a fabricated pair exercises the diff and leaves the
  readers themselves unproven.

  THE MIRROR STEP IS OVER THE WHOLE SET, NOT OVER "the other one" (added
  2026-08-19). The set has four members, so the run that clears the block must
  mirror into every rule that did not change. A partial mirror that clears the
  block would mean the guard is only watching a pair, which is the same hole one
  level down from the one this AC exists to close.
