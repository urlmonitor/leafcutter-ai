id: GE-127e-3-i
title: "Guidance that could not be produced is said so plainly, and whether guidance exists never moves the commit verdict in either direction"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked file of a kind the size standard covers stands above its
    permitted length, and no description of what is inside it can be produced —
    its content cannot be resolved into the parts the description is built from,
  When the author performs an ordinary commit,
  Then the commit does not complete, exactly as it would have had the description
    been produced,
  And the outcome states that no description of that file's contents could be
    produced and names the reason,
  And the outcome offers no parts, no division, and no substitute wording that
    reads as advice about that file,
  And given a tracked file of a covered kind stands BELOW its permitted length
    and a description of what is inside it could be produced,
  When the author performs an ordinary commit,
  Then the commit completes and nothing about that file is reported — a file is
    never refused because guidance about it could be produced, only because of
    its length,
  And given the same undescribable file is then brought below its permitted
    length while remaining undescribable,
  When the author performs an ordinary commit,
  Then the commit completes and no could-not-be-described statement is made about
    it — the statement is attached to a refusal, and is not a finding of its own.
depends_on:
  - GE-127e-3
