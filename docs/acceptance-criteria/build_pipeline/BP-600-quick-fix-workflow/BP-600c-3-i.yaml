id: BP-600c-3-i
components:
  - build_pipeline
title: "Quick-fix workflow detects when the fix breaks existing related tests"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the python-coder has applied a fix to "scripts/build_helpers.py",
  When the workflow runs the green-phase verification,
  Then it runs not only the new quick-fix test but also existing tests
    that import or reference "scripts/build_helpers.py",
  And those related tests are run under the same strict AC enforcement as the
    new test, so a genuine breakage cannot be masked,
  And if any previously-passing related test now fails, the workflow
    halts with a warning listing the broken tests,
  And it does not proceed to the commit phase,
  And the check runs after the new test is green and before the commit phase,
    so that a fix which repairs its own test while breaking a neighbour is
    stopped rather than committed,
  And when no related tests can be found, that empty result is reported plainly
    as "none found" rather than being presented as a clean pass,
  And when the related-test check cannot produce a usable result, the run is
    reported as unverified rather than counted as evidence of no regression.
