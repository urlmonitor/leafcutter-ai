assigned_agent: python-coder
estimated_complexity: L
declares_side_effect: true
it_requirements:
  reference_file_path: ".github/workflows/ci.yml"
  n_location_rule: "one per layout in the set — at least four, and the count must come from the layout set the harness enumerates rather than from four hand-written steps"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/portability/ -q"
  config_schema_fragment:
    type: object
    description: "The per-layout verdict record the inspection emits, one per layout in the set. Recording a layout identity alongside each finding is what makes 'one layout cannot answer for the others' checkable rather than aspirational — an aggregate pass/fail cannot express it."
    required:
      - layout
      - package_dir_name
      - is_worktree
      - deployed_root
      - missing
    properties:
      layout:
        type: string
        description: "The layout's identity as reported, e.g. the prescribed-name install, the differently-named install, the worktree of one of them, or the self-hosted checkout. Present so a failure names WHERE it happened."
      package_dir_name:
        type: string
        description: "The directory name the package occupies in this layout. The variable the whole defect turns on; recording it is what makes the name-independence claim falsifiable."
      is_worktree:
        type: boolean
        description: "Whether this layout is a git worktree of the install rather than its main checkout. The distinguishing fact between the two contradictory field reports."
      deployed_root:
        type: string
        description: "The deployed output root this layout's declaring files were resolved from, and the only root they may be resolved from."
      missing:
        type: array
        items:
          type: object
        description: "Per missing declaring file: the file, the guardrail that reads it, and the deployed location it was expected at. Empty for a layout that passes."
  constraints:
    - "THE LAYOUT SET IS THE DELIVERABLE; THE FIVE KNOWN FILES ARE NOT. A change that copies today's declaring files into the deployed tree makes every layout green and leaves the lookup written against one directory name, so the next declaring file, and the next adopter with a different directory name, reproduce this entry exactly. The regression files named in doc_links are the set the harness must be shown to catch, not the work."
    - "DERIVE THE NAME, NEVER SPELL IT. No candidate path may contain a literal package-directory name. An implementation that adds a third hardcoded candidate for the currently-prescribed name passes every layout that exists today and fails the differently-named layout, which is why that layout is in the set and is not optional."
    - "THE WORKTREE LAYOUT MUST BE A REAL GIT WORKTREE, not a copied directory. The reported trigger is that a directory which is populated in the main checkout is empty in a worktree; a copy reproduces the contents and therefore reproduces neither the trigger nor the defect."
    - "DO NOT REINSTATE A NARROWER BUILT-IN LIST. The fail-closed posture on the document type vocabulary was established deliberately by removing exactly such a fallback. Restoring one would turn every layout in this set green while returning the behaviour to what it was before that removal, and the resulting failures would surface later as wrong verdicts on valid documents rather than as a missing file."
    - "ASSERT THE FILE, NOT THE READER. For every declaring file, the inspection asserts the file's presence under the layout's deployed output root directly. Driving the reader and observing that it did not complain is green for a reader that returns nothing when the file is absent — the sibling vocabulary lookup does precisely this today, so the reader-driven form is known to be blind before it is written."
    - "THE SELF-HOSTED LAYOUT IS A CONTROL, AND ITS LOCAL RESULT IS NOT EVIDENCE. This workspace currently holds hand-placed copies of two declaring files in its deployed output root, placed as a workaround and recorded nowhere because that tree is not tracked. Any verdict taken from it is vacuous for this defect. Layout (d) exists to prove the fix does not break the package's own checkout, never to demonstrate that declaring files arrive."
    - "PER-LAYOUT VERDICTS, NOT A FIRST FAILURE. Every layout in the set is run and reported even when an earlier one has already failed, so one run tells the author the whole remediation set. A harness that stops at the first failing layout turns four layouts into four fix-run cycles, and each intermediate run is green for the layouts it never reached."
delivers_to:
  agent: python-coder
  contract: "A layout-parameterised consumer-install fixture — the same build and the same declaring-file inspection run against an enumerated set of install layouts differing in package-directory name and in main-checkout-versus-worktree — emitting one verdict record per layout and a job conclusion that fails when any layout is incomplete."
expects_from:
  ac_id: BP-900h-4
  contract: "The consumer-layout install and the per-guardrail declaring-file inventory whose resolution is anchored to the deployed output root alone. This AC parameterises that fixture by layout rather than replacing it, and inherits its resolution rule unchanged."
test_spec:
  - name: test_bp_900h_4_i_every_declaring_file_is_present_in_every_layout_and_each_layout_has_its_own_verdict
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Build the real scripts/build.py into each layout in the set and assert, per layout, that every declaring file in BP-900h-4's inventory resolves under THAT layout's deployed output root. NON-VACUITY IS MANDATORY AND HAS TWO HALVES, because a for-each over an empty set is green on a broken install: assert the layout set is non-empty and contains all four shapes the criterion names, and assert the declaring-file inventory is non-empty and contains the document type vocabulary confirmed unreachable on 2026-08-25. Assert the report carries one verdict record per layout, keyed by layout identity — an aggregate pass is indistinguishable from a run that exercised one layout, which is the state of the fixture today."
  - name: test_bp_900h_4_i_an_install_whose_package_directory_carries_a_different_name_resolves_every_declaring_file
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "THE NAME-INDEPENDENCE ENTRY, and the half of the defect a deploy fix does not touch. Build two installs that differ in exactly one respect — the name of the directory the package occupies, one being the prescribed name and one an arbitrary name chosen inside the test — and assert both resolve every declaring file, with identical verdict records apart from the recorded directory name. Then assert the anti-hardcode control: in the differently-named install, plant a readable decoy of one declaring file at the path the CURRENT lookup spells out, and assert the inspection neither resolves nor names that decoy path. An implementation that adds one more literal candidate for the prescribed name passes the first half and dies only on the decoy assertion, which is the difference between deriving the location and enumerating today's two guesses."
  - name: test_bp_900h_4_i_a_git_worktree_of_a_consumer_install_resolves_every_declaring_file_and_goes_red_when_one_is_removed_from_it_alone
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE REPORTED TRIGGER, plus the negative control the criterion demands, in one three-run sequence against a REAL git worktree created from the consumer install — never a copied directory, since a copy reproduces the contents that the worktree lacks. (1) Worktree layout after a successful build: exit 0 and no missing entries. (2) Remove exactly one declaring file from the WORKTREE layout's deployed output root only, leaving every other layout intact, and re-run: assert non-zero, assert the report names the layout, the file, the guardrail that reads it and the location it was expected at, and assert the other layouts are still reported as passing — an implementation that reports the whole run as failed without attributing it to a layout is indistinguishable from the single-layout proof. (3) Restore and re-run: exit 0. Run 3 is what attributes the red in run 2 to the removal rather than to a fixture that had already broken."
  - name: test_bp_900h_4_i_the_layout_sweep_runs_through_its_real_ci_entry_point_and_the_self_hosted_checkout_still_passes
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier. Invoke the sweep as a SUBPROCESS through the same command line the CI job runs — never by importing the inspection — and assert exit 0 across a healthy set including the self-hosted checkout layout, then non-zero with one layout sabotaged. Assert the consumption half by parsing .github/workflows/ci.yml as YAML: the step invoking the sweep carries that identical command and does not carry continue-on-error true, so a non-zero verdict actually fails the job. Parse the workflow into a data structure — a grep for the script name in the file text is green on a step that is continue-on-error. The self-hosted half is a control against the cheapest wrong fix, which is to make the lookup strict enough that only a consumer layout can satisfy it."
test_rationale: |
  The fixture is the subject of this AC, so the layout set is load-bearing in a way the
  assertions are not. BP-900h-4 already anchors resolution to the deployed output root and
  already plants decoys at the three places that made the original defect invisible — that
  work is done and this contract does not repeat it. What h-4 cannot express is that the
  guarantee must hold in more than one layout, because it builds one. Every entry here is
  therefore parameterised by layout, and the per-layout verdict assertion appears in three
  of the four entries: an aggregate pass is exactly what a single-layout fixture already
  produces, so any contract that accepts one is satisfied by the state that shipped broken.

  Entry 2 is the entry a deploy-the-file fix cannot pass. Copying the declaring files into
  the deployed tree makes entries 1, 3 and 4 green, because they are all about whether the
  file is there. Only the decoy half of entry 2 distinguishes a location that is derived
  from one that is spelled out, and the differently-named install is the layout in which
  that distinction has a consequence. The two contradictory field reports differ on nothing
  else, which is why the name is the variable the test varies.

  Entry 3 insists on a real git worktree because the trigger is structural, not incidental:
  a directory populated in the main checkout is empty in a worktree. A copied directory
  carries the contents and so reproduces neither the trigger nor the defect, and a test
  written against a copy is green on the exact install that fails.

  Entry 4's self-hosted half is a false-positive control rather than coverage. The cheapest
  wrong fix here is a lookup strict enough that only a consumer layout satisfies it, which
  would trade an adopter-facing blocker for a package-development one and would be green on
  entries 1 to 3 taken alone.

  Angles: criterion, deployed, failure, reachability — at the cap of four, with must_block
  riding entry 4. seam and real_artifact are not charged: the subject is a directory tree
  across layouts, not a serialized artifact crossing a producer-consumer signature, and the
  cold-process claim belongs to BP-900h-5-ii rather than here. boundary is not charged
  because the criterion names no range or limit; the four layouts are an enumerated set,
  and entry 1's non-vacuity assertion covers its completeness.
