criteria: |
  Given a split whose part p1 is decided, and whose record is staged in the run but not
    published,
  When the person follows p1's link in the split's progress,
  Then it opens p1's staged record in the run,
  And the view says that the record is staged and that a person publishes it,
  And the kernel does not publish the record on the person's behalf.
