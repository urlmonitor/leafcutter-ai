change_target: code
risk_surface: contract_boundary
notes: RQ1/RQ2; RQE-01 and RQE-02 controls. New requested-field and exact-clause guarantee; source values are retrieved
  evidence, never a substituted evaluation oracle. Authored using the business-analyst template under explicit user
  authorization to draft ACs; not approval or implementation proof.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Carry canonical field names and their availability separately through projection and disclosure. Existing generations
  lacking a newly required field remain incompatible for that answer unless republished; do not silently fill from
  an unrelated workspace or lifecycle status.
- An exact criterion answer includes the complete requested canonical clause at its pinned source locator. Truncation
  or byte budgets must mark the clause incomplete and prevent an exact-complete claim; the source oracle is assessment-only.
- Preserve distinct graph lifecycle status, requirement status, work status and readiness even where literal values
  coincide. Absence in canonical source, absence in projection and withheld disclosure require attributable diagnostics;
  otherwise classify availability as unknown.
- Similarity or duplicate/conflict interpretation cites the exact compared clauses and is labeled inference. It
  cannot rewrite canonical requirements or silently select one as authoritative.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_retrieval_discloses_canonical_fields_and_exact_criteria
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Invoke public retrieval against controlled immutable source evidence for RQE-01-P and RQE-02-P; assert
    canonical status fields remain distinct and the entire requested KM-500c-2 criterion, ID, SHA and locator are
    returned.
  must_catch:
  - Returning graph status=active as the work-status answer or a shortened clause as complete.
  covers:
  - KM-500e-2
  requires_db: false
  surface_invoked: python -m knowledge retrieve
- name: test_field_availability_does_not_use_source_oracle_to_fill_response
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Assess RQE-01-N with work_status omitted while status remains active and separately exercise source-absent,
    projection-absent and unknown diagnostics; assert missing required values remain unresolved with only evidenced
    classifications.
  must_catch:
  - An assessor secretly filling omitted work_status from the golden source data.
  covers:
  - KM-500e-2
  requires_db: false
- name: test_disclosure_budget_preserves_incomplete_clause_signal
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Exercise the real projection-to-disclosure boundary with RQE-02-N and a byte-limited criterion whose
    trailing And clauses are omitted; assert partial evidence and unavailable exact-complete proof reach the caller.
  must_catch:
  - Accepting only the first Then clause as the complete acceptance criterion.
  covers:
  - KM-500e-2
  requires_db: false
- name: test_conflicting_clauses_remain_cited_interpretations
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Supply two source-attributed clauses that disagree and assert the answer retains each locator and
    distinguishes the inferred conflict from authoritative source content.
  must_catch:
  - Resolving a conflict by silently rewriting one canonical clause or treating similarity as authority.
  covers:
  - KM-500e-2
  requires_db: false
