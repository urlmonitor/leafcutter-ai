id: BO-2500a-8-ii
components:
  - build_orchestration
  - ac_store
title: "The technical planner's instructions require a record-specific reason whenever they declare no test is needed"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the technical planner's instructions for declaring a requirement test-free,
  When the planner follows them for a requirement whose change is only a guide or
    only the wording of an agent instruction,
  Then the instructions direct it to write test_required false together with a
    test_rationale, and present the two as one declaration, never the first alone,
  And they state that the reason must be specific to the record: it names what the
    deliverable is and why no executable test can observe it,
  And they state that one sentence reused across records, or text filled in from
    the record's change_target, is not a reason,
  And they state that the commit-time record check refuses the declaration without
    a reason (BO-2500a-8-i) and that the done gate refuses it at mark time
    (BO-2500a-1-ii),
  And no passage in the instructions describes setting test_required false as
    complete on its own,
  And for which records may carry a test-free declaration at all, the instructions
    point to the exemption reference entry (TQ-400e-6) and do not restate that rule,
  And a planner run on a docs-only requirement with these instructions loaded writes
    both fields, where the same run without the new instruction writes
    test_required false alone.
depends_on: [BO-2500a-8, BO-2500a-8-i]
doc_links:
  - path: templates/agents/it-po.md
    relationship: constrains
    status: exists
    relevance: "Section 2.7, the `test_required: false` paragraph: 'set this, with no test_intent, when the AC genuinely produces no executable behaviour'. Never mentions test_rationale."
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-076-verification-methods-for-non-test-requirements.md
    relationship: describes
    status: exists
    relevance: 'The decision this record implements: wave 1 (section 1) or wave 2 (section 2)
      of the verification-method rule.'
assigned_agent: llm-expert
estimated_complexity: S
