id: BO-1500e-3
components:
  - build_orchestration
readiness: approved
priority: high
title: PR creation tolerates the active gh account silently reverting to an EMU account
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: in_progress
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500e.yaml
criteria: |
  Given the active gh CLI account has silently reverted to an Enterprise Managed
    User (EMU) account that cannot open pull requests,
  When the authoring workflow reaches the PR-creation step,
  Then it switches the active gh account to the account authorized to create the
    PR immediately before attempting creation,
  And if the CLI create path is still blocked, it creates the pull request via the
    REST API fallback,
  And the pull request is opened to main by one of these paths,
  And the workflow surfaces the resulting PR number and URL (per BO-1500d-1)
    rather than failing the delivery.
depends_on:
- BO-1500e
- BO-1500c-1
doc_links:
- path: templates/skills/build-single-ticket/SKILL.md
  relationship: models
  status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- Before create/merge, switch to the authorized gh account (`gh auth switch --user <acct>`) and VERIFY
  with `gh auth status`.
- On the EMU GraphQL block, fall back to the REST endpoint `gh api -X POST repos/<org>/<repo>/pulls`;
  the PR must open via one of these paths rather than failing delivery.
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
test_spec:
- name: test_gh_account_is_switched_and_verified_before_pr_creation_is_attempted
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: With a recording gh shim on PATH reporting an EMU account, the ordered invocation log shows
    `auth switch` then `auth status` strictly before the first PR-creation call.
- name: test_rest_api_fallback_opens_the_pr_when_the_cli_create_is_emu_blocked
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: With the gh shim failing `pr create` with an "Enterprise Managed User"/GraphQL error, the
    workflow then invokes `gh api -X POST repos/<org>/<repo>/pulls` and the run reports the PR as opened.
- name: test_pr_number_and_url_are_surfaced_after_the_rest_fallback
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: The number and URL parsed from the REST response appear in the workflow's final output,
    so an EMU reversion degrades the path but not the user-visible result.
- name: test_non_emu_failure_is_reported_as_an_error_and_does_not_trigger_the_rest_fallback
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: Discrimination control — when `pr create` fails for an unrelated reason, the workflow returns
    an error carrying the stderr and issues no `gh api ... /pulls` call.
- name: test_cli_create_success_skips_the_rest_fallback
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: When `gh pr create` succeeds, no REST fallback call is made and the CLI-returned PR reference
    is the one surfaced.
