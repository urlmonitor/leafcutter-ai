notes: "Authored by /quick-fix. Root cause: next_seq() globs arch_dir with a non-recursive Path.glob('c{level}-*.md') and main() sets arch_dir = docs/architecture/, but every C4 diagram actually lives in the docs/architecture/diagrams/ subdirectory. The top level of docs/architecture/ contains zero c{level}-NNN-*.md files, so the glob matches nothing and next_seq returns 1 for every level regardless of the 9 existing diagrams — guaranteeing sequence-number collisions the tool exists to prevent. Fix makes the scan recursive (Path.rglob) so diagrams are found wherever they live under docs/architecture/, preserving the documented max(existing)+1 allocation semantics."
