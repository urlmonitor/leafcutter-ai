amended_by:
  - reason: "BA rewrite, 2026-09-07, same day as authoring. This record was written against the repository-anchored resolution rule and is re-footed on its replacement: the sink is an absolute path fixed by the build from the project root it was pointed at. The layouts are still the discriminator and the nested fixture is still the only thing that can fail, but what it must establish changed — from 'resolves to the nearest repository' to 'resolves to the target the package was built into'. THREE CLAUSES ADDED that the new anchor makes necessary and the old one did not. (1) STALENESS: a build-fixed path does not follow an install that is moved by hand, so a declared path whose directory is gone must be reported as stale and distinguished from a sink never written to — INF-400c-4-iv's no-work outcome would otherwise swallow it, and a broken install would read as a healthy empty one. Stated without a new exit status, per that record's enumeration. (2) THE REBUILD-INTO-A-WORKING-DIRECTORY CASE, which is the sharpest edge of this anchor and is a live practice here rather than a hypothetical: this repository's own pre-drive checklist discusses running the build inside a fresh worktree, and a build pointed at an isolated working directory writes that directory's own root into its configuration. The result is records accumulating in a directory that is removed after merge, with every check green — the original defect restored in full, reached by an ordinary rebuild instead of by a relative path. Durability was automatic under the previous anchor and is contingent under this one, so it has to be a criterion. (3) RELOCATION: adopting the declaration must not silently orphan records already accumulating elsewhere. See the notes for the instance of this that exists today and needs an answer before the change lands."
