  reference_file_path: templates/workflows-js/build-ticket.js
  n_location_rule: "2 -- the pre-coder gate in build-ticket.js and its twin in build-feature.js, which must stay identical"
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_test_requirements_guard.py"
  notes: |
    Widening the gate with additional satisfaction routes must not weaken it. A
    test-writer phase that self-skipped, and one running an older template that reports
    no test-writing outcome at all, must both read as "no evidence" rather than as
    permission to proceed.
    Test coverage: one negative case per non-evidence condition (no files written, no
    outcome reported, no test-writer phase scheduled, recorded files gone from disk),
    each asserting behaviorally that the coder phase is NOT dispatched. A grep of the
    workflow source for the blocker string does not satisfy this AC -- such a test
    passes on both the broken and the fixed workflow.
