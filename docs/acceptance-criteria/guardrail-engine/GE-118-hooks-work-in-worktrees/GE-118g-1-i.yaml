notes: |
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE OF ITS PARENT. The parent's arms are all
  satisfiable by a resolution that walks to the enclosing repository by any means —
  including one that lands on the shared clone or on a fixed ancestor. This record is the
  only place where two candidate trees exist at once, so it is the only place a
  resolution that picks the wrong one of several goes red. Its named mutation reddens this
  record alone and leaves every parent arm green, which is the asymmetry that justifies
  the separate file.

  WHY IT BELONGS IN THIS L0 SPECIFICALLY. GE-118's own title names git worktrees. This is
  the clause that makes the new L1 an instance of that L0 rather than a general
  cwd-hygiene record that happens to be filed there: 77 sibling worktrees exist under
  this workspace's parent directory today, so "which of several trees" is the live
  condition here, not a hypothetical.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. MUTATION: resolve the
  repository by walking ancestors from the program's own file location, or by resolving
  to the shared administrative directory's parent, instead of from the invoking tree.
  MUST GO RED: both arms here — worktree A would be reported as carrying B's collision,
  or both would be reported against the clone.
  MUST STAY GREEN: every arm of GE-118g-1, which exercises exactly one candidate tree and
  cannot distinguish the two resolutions. This is the same trap GE-118c recorded from the
  other direction, where an invoking-tree-anchored resolver was wrong for a
  package-bundled file. Record which anchor the implementation uses and why.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
