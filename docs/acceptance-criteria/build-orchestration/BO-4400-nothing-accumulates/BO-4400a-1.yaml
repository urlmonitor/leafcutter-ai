risk_surface: safety
declares_side_effect: true
criteria: |
  Given each of these routes is run against a real test project with a real shared
    project, each in a workspace obtained from the one workspace maker, and each
    driven to the point where its commits are pushed to its own line of work on the
    shared project and its pull request is open:
    - the build of a single ticket,
    - the build of an epic of three tickets,
    - the quick fix,
    - requirements authoring,
    - the fast lane with a build set of one requirement,
    - the backlog build with two tickets,
  When each route returns its final result,
  Then for every route no folder remains at the location its workspace occupied and
    its workspace is absent from the live set,
  And the clearing was performed by the one shared clearing door: the route's final
    result contains the door's own answer for that workspace, reporting it removed,
  And the clearing happened after the pull request was opened and before the route
    returned: the pull request exists and lists every commit the route made,
  And no person was asked to confirm the clearing,
  And commits that are pushed to the workspace's own line on the shared project count
    as sent for this decision, so an open, unmerged pull request never makes the
    workspace read as holding unsent work.
