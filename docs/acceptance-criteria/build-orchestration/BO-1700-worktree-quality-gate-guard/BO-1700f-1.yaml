criteria: |
  Given the main tree has no pre-commit configuration at all (the project does not
    use the framework's quality gates),
  When the guard runs,
  Then it prints an INFO message stating no gates are configured, exits 0, and the
    drive proceeds,
  And it does not raise a failure or block the work.
