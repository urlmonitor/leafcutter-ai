title: "Your project keeps its own record of what the build put there"
component: build-pipeline
level: L1
status: active
req_status: draft
readiness: draft
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  The record of what you installed lives with it, or the build refuses to finish.

  Every install carries its own account of what the build put there, written into
  the project it describes and still readable after that project is moved, copied
  or opened somewhere else. The checks that exist to tell you whether anything has
  drifted or been altered all read that account, so wherever it is missing or
  unreadable they protect nobody -- and say nothing about it. A build that cannot
  produce that account stops and tells you, instead of printing one warning line
  and reporting success.
