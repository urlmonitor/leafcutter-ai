notes: |
  THE THIRD AND FIFTH CLAUSES BOUND THE CARVE-OUT FROM BOTH SIDES, and both are needed.
  An implementation that keys the carve-out on a date is the obvious shortcut and it
  fails twice over: it hides an answer that older work genuinely recorded, and it grants
  amnesty to any newer work whose date can be made to look old. Keying on the presence
  of a record is the only form of the rule that stays true as the epoch recedes.

  THE FIFTH CLAUSE IS THE ANTI-VACUITY CONTROL. Every other clause here can be satisfied
  by a retrieval that returns no answer recorded for everything. That reading is green on
  arrival and cannot fail — the exact defect this tree exists to catch — so the scenario
  needs a case it must answer differently.

  BOUNDARY. Adds no behaviour. It is satisfied only by a regression test over TQ-500e-2's
  retrieval and must not be closed by a change that special-cases these fixtures.
