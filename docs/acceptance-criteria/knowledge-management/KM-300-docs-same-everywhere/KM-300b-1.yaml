criteria: |
  Given the docs/retrospectives folder contains exactly these files:
    - EPIC-ACDrivenDevelopment.md
    - EPIC-AcPatternEnforcementIsMechanically.md
    - epic-lowercase-example.md
    - 2026-05-22-epic-antigravity-support.md
  And the files were created in a different order from their names' order
  When the documentation map is generated on a Windows host and, separately, on
    a Linux host from identical file contents
  Then the Retrospectives section lists the four entries in the same order on
    both hosts
  And that order is determined solely by the entries' paths under one fixed
    comparison rule stated in the map's generator documentation — not by the
    order the file system happens to return files, by file creation time, or by
    the host's locale or case-sensitivity setting
  And the same holds for the order of the sections themselves and the order of
    entries in every other section
