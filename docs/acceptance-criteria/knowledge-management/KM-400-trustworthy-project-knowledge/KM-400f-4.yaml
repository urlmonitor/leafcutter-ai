notes: |
  Authored 2026-10-09. No operator command would have revealed the 32-generation pile
  before it filled the instance. The status operation returns only the active manifest,
  cleanup requires an explicit generation identifier, and there is no sweep mode and no
  listing command — so the accumulation was unobservable from the outside right up to the
  point where the backend latched read-only and recovery became impossible.

  The sweep mode (reclamation without naming a generation) is the operator-facing
  counterpart to the automatic reclamation in KM-400f-2: the automatic path keeps a
  healthy instance bounded, and the sweep is what an operator reaches for when they find
  one that is not.

  The operational-instructions clause carries the parent L1's how-to documentation
  trigger for this work. KM-400f declares documentation_triggers of how-to and
  reference-doc; the documentation obligation is written as a clause of the AC whose
  behaviour it documents rather than as a separate documentation child AC, and the
  cleanup half of the runbook obligation is added to KM-400e-5 by amendment. The
  original wording justified that choice by KM-400e's child cap; under KM-400f no cap
  pressure remains, but keeping the obligation attached to the behaviour it documents is
  the better form regardless.

  Settled design decision, not to be reopened: immutable generations are KEPT. This
  surface makes retention observable; it does not replace generations with in-place
  upserting, and reclamation stays subordinate to KM-400b-3's pinning guarantee.
it_requirements: null
test_required: true
test_spec:
  - name: test_status_lists_every_retained_generation_with_reclaimability
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Invoke the real status operation against a fixture of 32 retained
      generations including one pin-protected; assert all 32 appear with identifier,
      source revision, retirement time and reclaimability, that the pinned one gives its
      continuation as the reason, and that the declared bound and measured usage against
      the ceiling are reported.
    covers: [KM-400f-4]
    must_catch:
      - "return only the active manifest and omit retained generations"
      - "list generations without a reclaimability verdict"
      - "report usage without the ceiling it is measured against"
    requires_db: false
  - name: test_sweep_reclamation_without_a_generation_id_reclaims_the_whole_set
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Invoke reclamation with no generation identifier against 32 retained
      generations; assert every reclaimable one is reclaimed in a single operation, the
      active and pin-protected generations survive, and the result names reclaimed and
      retained identifiers with per-generation retention reasons.
    covers: [KM-400f-4]
    must_catch:
      - "require an explicit generation id and reclaim nothing when none is given"
      - "reclaim only the oldest generation per invocation"
      - "reclaim the active or the pin-protected generation"
    requires_db: false
  - name: test_unknown_ceiling_is_shown_as_unknown_in_status
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: With a backend that does not report a ceiling, assert status shows the
      ceiling as unknown and still reports measured usage, rather than omitting the field.
    covers: [KM-400f-4]
    must_catch:
      - "omit the ceiling row entirely when it cannot be determined"
    requires_db: false
  - name: test_operational_instructions_demonstrate_listing_headroom_and_sweep
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: deployed
    description: Execute the commands the capacity and retention section of the
      operational instructions gives, against a seeded backend, and assert each produces
      the listing, headroom and sweep behaviour the section claims.
    covers: [KM-400f-4]
    must_catch:
      - "document a command whose flag or mode does not exist"
    requires_db: false
  - name: test_live_status_matches_a_real_backends_own_counts
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Against a real database holding several published generations, assert the
      status listing and usage figures equal the backend's own counts and that requesting
      status changes nothing.
    covers: [KM-400f-4]
    requires_db: true
test_rationale: >-
  The defect being closed is that an operator could not see an accumulation, so the tests
  assert what the surface SHOWS against a fixture large enough for the accumulation to
  exist — 32 generations, the measured incident count — rather than the 2-node snapshot
  used elsewhere in this family, under which a status that lists only the active manifest
  looks indistinguishable from a correct one. The instructions test executes the commands
  the runbook gives instead of searching the document for their names: this repository has
  already shipped a done AC in this family whose workflow coverage string-parses YAML, and
  a documented command with a flag that does not exist passes that shape of test while
  failing the operator.
