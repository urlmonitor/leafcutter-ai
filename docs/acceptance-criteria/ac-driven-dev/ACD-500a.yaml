title: "The ticket prioritizer merges AC readiness into its output with a single opt-in flag"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given the existing ticket-prioritizer skill produces a sorted JSON list of
    ready tickets from YAML frontmatter and depends_on DAGs,
  When an operator runs the prioritizer with the --include-acs flag,
  Then the output contains both ready tickets and ready ACs in a single list,
  And each entry carries a source field ("ticket" or "ac") so consumers can
    distinguish origin,
  And ACs that already have a corresponding ticket are deduplicated out,
  And the complexity-to-priority mapping (S=high, M=medium, L/XL=low) produces
    a unified sort key across both entry types,
  And running without --include-acs preserves the existing ticket-only behavior
    with no changes to the output schema.
