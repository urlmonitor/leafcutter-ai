notes: |
  THE setUpClass RE-DEPLOY TRAP, DETECTED RATHER THAN ONLY DOCUMENTED. The
  request asks that it be "documented and detected". The documentation half is
  TQ-500g-5 and the sql-test-writer prompt (TQ-500g-2); this is the detection.

  WHY BOTH D1 AND D2. D1 is the trap. D2 is the control: a detector that marks
  every database run invalid would pass D1 and make database wrong-version runs
  impossible. D2 also shows the straightforward remedy (alter the file the suite
  installs from), but the check must not rely on the remedy being used — it
  inspects what the database held.

  TECHNICAL DETAIL FOR IT-PO: "what the database held while the tests ran" can
  be read from the procedure's installed definition (for example its source in
  the catalogue) captured during or right after the test run, and compared with
  the wrong version and with the code as written. When the suite runs in its
  own transaction or drops the database, choose the capture point accordingly.
  The put-back must restore the database too, not only the file — a database
  left holding the wrong version poisons every later run.

  NEEDS THE CONFIGURED TEST DATABASE (INF-1100d). Without one, the run is not
  run (TQ-500g-2-ii), so this check never starts.

  IT-PO ENRICHMENT (2026-09-28)
  OPEN: how the catalogue is read without a leafcutter driver dependency. See
  the report's open questions. Lane: python-coder after TQ-500g-2 (prompt) is
  done. Otherwise the fast lane pulls the prompt L2 into a python-coder build
  set.
