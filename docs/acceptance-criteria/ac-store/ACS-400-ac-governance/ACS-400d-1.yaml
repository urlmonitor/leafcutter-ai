id: ACS-400d-1
components:
  - ac-store
title: "Governance rules appear in deployed agent instructions after build"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a consumer project has installed leafcutter via build.py,
  When an agent reads its instruction surface
    (CLAUDE.md or the generated agent template),
  Then the instruction text contains the AC governance write-access rules:
    - which agents are authorized to write criteria
      (product-owner-v3, business-analyst-v3, it-po-v3, human user)
    - which fields are protected (criteria, title, req_status, depends_on)
    - which fields are open to implementation agents
      (work_status, implemented_by, covered_by)
  And the rules are present without any manual configuration by the project user.
depends_on: [ACS-400d]
