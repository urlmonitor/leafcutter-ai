notes: >-
  KI-BO-20260831-1331 records that the symptom READS AS store-wide corruption, and the
  misdiagnosis is a distinct harm: it sends the operator to repair the shared record, which
  is both unnecessary and dangerous, while the actual remnant goes untouched. Held as its
  own L2 rather than folded into surfacing or removal because all three are separately
  falsifiable, and this is the one an implementer drops quietly -- a leftover can be listed
  and removable while still being described as corruption, and every other AC in this
  family stays green. The last clause stops the fix being "never mention the shared record",
  which would hide a real failure of it.
