notes: |
  WHY THIS PARENT. Four candidates were checked against the tree before INF-600b was
  chosen, and the reasoning is recorded so it is not re-opened.

    - INF-600b IS the L1 that owns what a card contains. Its own criteria enumerate the
      card's inputs — "each agent's template frontmatter, registry entry, knowledge
      plane mapping, and spawn graph" — and that list does NOT include the
      acceptance-criteria store. So this record does not add a constraint to INF-600b;
      it restores INF-600b's own stated input list, which INF-600b-2 widened. Filing the
      narrowing as a sibling of the record that widened it puts both in front of the
      same reader, which filing it elsewhere would not.
    - BP-018 was the suggested home and cannot host a child: it is itself an L2, sitting
      loose directly under build_pipeline/ with depends_on []. Its subject is also
      different — the compare-before-write guard and provenance carry-through, not what
      a card is made of.
    - BP-1500a is an L1 and names docs/agents/cards/ as a population member, which makes
      it the strongest rival. Rejected because its subject is a DRIFT CHECK over every
      tracked generated artifact, and its own notes forbid the reading that would make
      this record discharge it ("an implementation that gitignores or stops generating
      them does not satisfy this L1"). This record reduces BP-1500a's largest symptom
      and satisfies none of its clauses; that relationship is a doc_link, not a parent
      edge.
    - GE-127g is at 5 of 5 L2 children and GE-127 at 7 of 7 L1s, so that subtree has no
      room at any level even if the subject fitted, which it does not — GE-127g is about
      which documents a size standard judges, not about what a document contains.

  CHILD CAP CHECKED, NOT ASSUMED. INF-600b held two L2 children (INF-600b-1,
  INF-600b-2) against the cap of five; with this record it holds three. INF-600b-1-i is
  an L3 under INF-600b-1 and does not count against the L1's cap. No
  child_limit_override is needed or added.

  WHAT THE SECOND SCENARIO IS FOR, AND WHY IT IS THE RECORD. "Adding an acceptance
  criterion changes no card" is the precise statement of the property, and it is the
  one that would have caught this whole class: the symptom was never that the section
  was wrong, it was that unrelated work elsewhere in the store rewrote a build artifact
  nobody had touched, leaving a permanently dirty tree. A build that merely stops
  rendering the heading while still scanning the store passes a reading of the first
  scenario and fails this one, because any field the scan reads can still reach the
  output. The third scenario exists because an added record is the cheapest of the three
  store mutations to be insensitive to by accident; a retitle and a reassignment are
  what actually moved cards in the measured drift (three of the deleted lines in the six
  dirty cards were retitled entries, not removals).

  THE FOURTH SCENARIO IS THE NEGATIVE CONTROL AND IS NOT OPTIONAL. Removing too much is
  the likelier failure here than removing too little: the section being deleted is 33%
  of all card lines and sits at the END of every card, so an over-wide deletion that
  truncates from the last static section onward produces a shorter card that satisfies
  the first three scenarios completely. The control names the static content by its
  parts rather than by a line count, because a line count goes stale the next time an
  agent is added.

  THE FIFTH SCENARIO IS THE SECOND NEGATIVE CONTROL, against a different failure. The
  first four are all satisfied exactly by a build that produces no cards at all, or by
  one that produces a fixed stub per agent. Requiring one card to move when its own
  agent's description moves — and the rest to stay still — is the only clause here that
  a dead generator fails.

  MEASURED FIGURES ARE CARRIED HERE AND DELIBERATELY NOT PINNED IN criteria. Supplied
  with the change and recorded for the enrichment pass, not as expected values: the
  section is 3,787 of 11,526 total card lines (33%) and is present in 17 of 64 cards;
  python-coder.card.md goes from 2,809 lines to 162; the count of cards above the
  300-line document limit goes from 3 to 0. Any test that pins 64, 2,809, 162 or 33%
  goes red the next time an agent is added, which is the opposite of what this record
  says. The fourth scenario states its length clause as a RELATIONSHIP to the standard's
  limit rather than as a number, for exactly that reason.

  A DOCUMENTATION OBLIGATION THIS RECORD CREATES AND DOES NOT DISCHARGE. INF-600b
  carries no documentation_triggers, so no documentation AC is required of this
  decomposition. But docs/reference/ac-schema.md — the canonical AC schema reference —
  documents the removed behaviour in full under "python-coder — AC Assignments section
  in generated card (INF-600b-2)", including the rendered heading and the data flow.
  That is the ONLY surface in the project that names the section by its heading, and it
  is cited in doc_links as a modify target rather than left to be found. If the user
  wants that update tracked as its own criterion, INF-600b has two free L2 slots after
  this record.

  PRIORITY IS INHERITED, NOT JUDGED. medium, taken from INF-600b. The live symptom — a
  permanently dirty working tree after every build and three present-tense doc-length
  ratchet refusals — argues for high; that is the user's call at approval, not this
  record's.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE RENDERER ONLY. MUTATION: stop rendering the section but keep the whole-store
      scan, passing its result to the card builder where it is discarded.
      MUST GO RED: nothing, on a correct renderer removal — which is the point. This
      mutation is the one the first scenario alone cannot catch, and it is caught only
      because the second and third scenarios compare whole documents across two builds
      rather than searching one document for a heading.
      MUST STAY GREEN: all five scenarios, IF the discarded result genuinely reaches
      nothing. Recorded as the mutation to reason about rather than the one to assert:
      its real cost is the whole-store walk, which belongs to TQ-600a-11's retirement
      and not here.

  (2) THE HEADING RENAME. MUTATION: keep the scan and the grouping, and render it under
      a different heading.
      MUST GO RED: the first scenario, whose clause is "no card NAMES an acceptance
      criterion anywhere in it" rather than "no card carries a section with this
      heading", and the second and third scenarios, which compare whole documents.
      MUST STAY GREEN: the fourth and fifth. Recorded because the only surface in the
      project that names the heading is a reference doc, so a heading-shaped assertion
      is the natural thing to write and it is exactly the wrong test.

  (3) THE OVER-WIDE DELETION. MUTATION: delete from the last static section to the end
      of the card, taking the contributor notes, the skills list or the spawn diagram
      with the assignments.
      MUST GO RED: the fourth scenario only.
      MUST STAY GREEN: the first, second, third and fifth. That asymmetry is the measure
      of how easily this change ships having removed too much, and it is why the fourth
      scenario enumerates the static parts individually instead of asserting a length.

  (4) THE DEAD GENERATOR. MUTATION: produce no cards at all, or produce an identical
      stub for every agent.
      MUST GO RED: the fifth scenario, and the fourth.
      MUST STAY GREEN: the first, second and third, each of which a build that writes
      nothing satisfies exactly. This is the shape GE-127g-1's third arm guards against
      one subtree over, reused here for the same reason: a fix must be distinguishable
      from switching the thing off.

  (5) THE CACHED COMPARISON. MUTATION: satisfy the byte-identity clauses by comparing
      each card against a cached copy of itself rather than against the preceding
      build's output.
      MUST GO RED: the fifth scenario, which requires one card to DIFFER.
      MUST STAY GREEN: the first four. Recorded because "nothing changed" is trivially
      true of a comparison that re-reads its own cache, and the fifth scenario is the
      only clause that forces the comparison to be able to report a difference at all.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's.
