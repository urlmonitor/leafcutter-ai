test_spec:
  - name: test_bp_900g_10_required_dependency_load_failure_stops_instead_of_returning_a_neutral_default
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "The loader for a REQUIRED dependency, given an unloadable dependency, raises a typed failure naming the dependency and the output that cannot be produced — and specifically does NOT return an empty mapping. Assert the raise and assert the empty-mapping return is gone; the current code returns {} and a test that only checks 'a warning was logged' is green on it."
  - name: test_bp_900g_10_absent_unreadable_and_unloadable_all_take_the_stop_path
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "The fail-closed contract across all three failure modes: dependency file absent, present but unreadable (permission denied), and present but unloadable (syntax error). Each must stop; none may degrade to a neutral default and none may be downgraded to a log line. The live code catches OSError, which covers two of the three — a fix scoped to 'file missing' leaves the unloadable branch live behind a change that reads as complete."
  - name: test_bp_900g_10_deployed_script_with_the_dependency_removed_exits_non_zero_and_writes_no_ticket
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier — the acceptance test for this AC. Build into a temp target via the BP-900g-8 harness, DELETE _component_migration_map.py from the DEPLOYED tree, then invoke the deployed generate_ticket_from_ac.py entry point in a GENUINELY FRESH `python` subprocess (never importlib.reload; the package source tree must be absent from sys.path) against a REAL on-disk AC YAML from docs/acceptance-criteria/. Assert BOTH the non-zero exit AND that the output ticket file does not exist. The artifact-absence half is the load-bearing one: a script that writes the degraded ticket and then exits non-zero passes the exit-code assertion while leaving the wrong file on disk."
  - name: test_bp_900g_10_deployed_script_with_the_dependency_present_writes_a_correct_ticket
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: deployed
    description: "The paired positive control through the SAME deployed entry point and the same fresh-subprocess invocation, with the dependency present in the deployed tree: exit zero, the ticket file exists, and its components list matches the source AC's rather than being empty. This is what distinguishes a correct fail-closed change from one that simply refuses to run — and it is also the only entry that would catch the fix being satisfied by making the script always fail."
test_rationale: |
  The degradation is not in the loader. The loader already knows it failed and says so.
  The degradation is in the CALLER that ignores the failed result and carries on with an
  empty mapping — which is why the criterion explicitly disqualifies asserting that the
  loader returns an error when called directly. Entry 1 therefore asserts the neutral
  default is gone, not merely that something was raised somewhere.

  Entry 3 is the acceptance test and it is constructed to defeat three separate false
  greens this repo has already been caught by. It runs the DEPLOYED copy, because the
  source tree contains the dependency by construction and is structurally blind to the
  defect (BP-811, done_proof.py). It spawns a genuinely FRESH subprocess, because
  importlib.reload re-executes in an already-populated namespace and masks cold-import
  failures — precisely how GenReviewFixes H-2 survived. And it feeds a REAL on-disk AC
  file, because hand-typed fixtures reproduce the author's model of the format, which is
  what hid the files_touched no-op for an entire epic and survived its first spot-check.

  Within entry 3 the artifact-absence assertion carries more weight than the exit code.
  An implementation that writes the degraded ticket and then exits non-zero satisfies
  the exit-code half while leaving exactly the wrong file on disk for the next step to
  consume — which is the original defect with a louder ending.

  Entry 4 exists because every other entry passes against a script that refuses to run
  at all. It is also the only assertion that the components list is actually CORRECT
  rather than merely non-empty.

  Entry 2 charges `failure` because the AC's subject is a fail-open/fail-closed
  contract and the three failure modes are not interchangeable — the live code catches
  OSError, which handles absence and unreadability but not an unloadable module.

  Four distinct angles at the cap: criterion, failure, reachability, deployed.
  `real_artifact` is triggered too and could not be given its own slot, so its two
  substantive requirements — the genuinely fresh subprocess and the real on-disk AC
  input — are written into entries 3 and 4 as hard conditions and restated in
  it_requirements.constraints, so they cannot be quietly dropped by an implementer
  counting angle labels.
