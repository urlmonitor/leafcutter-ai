criteria: |
  You are told what could not be checked -- never sent to fix a correct setting.

  When a safety check at the start of a run cannot reach what it needs to look
  at it stops the run as before but reports what actually happened. You can tell
  at a glance whether something is genuinely misconfigured or whether the check
  simply did not get to look and the run is worth retrying.
