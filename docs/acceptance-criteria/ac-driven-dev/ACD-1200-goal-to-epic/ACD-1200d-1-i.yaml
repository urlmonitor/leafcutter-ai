title: "AC already tagged with a different target_epic triggers a conflict warning"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given leaf AC ACD-050a-1 already has target_epic: EPIC-OldBatch,
  And it appears in the leaf set for a new goal-to-epic generation
    that would assign target_epic: EPIC-ValidateApiInputs,
  When the system attempts to stamp target_epic on ACD-050a-1,
  Then it detects the existing target_epic value differs from the new one
  And outputs a warning:
    "ACD-050a-1 already belongs to EPIC-OldBatch. Overwrite with EPIC-ValidateApiInputs? (yes / skip)"
  And if the user answers "yes", the target_epic is updated to EPIC-ValidateApiInputs
  And if the user answers "skip", the AC retains its original target_epic
    and a ticket is still generated for it in the new epic (without modifying the AC tag).
