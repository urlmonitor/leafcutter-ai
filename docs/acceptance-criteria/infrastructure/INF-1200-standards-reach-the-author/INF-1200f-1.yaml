id: INF-1200f-1
title: "The figure in the brief and the figure applied to the work are one figure, and they move together"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a kind of file carries a standard expressed as a figure, and a specialist
    the ownership record assigns that kind of file,
  When the figure stated in that specialist's material is compared with the
    figure the project applies to work of that kind,
  Then they are the same figure,
  And given the declared figure is then changed, with nothing else in the project
    altered,
  When the same comparison is made again,
  Then the two are again the same figure as each other, and both are the changed
    one — neither surface holds the superseded figure,
  And given the declared figure is changed a second time,
  When the comparison is made a third time,
  Then the two are again the same, so agreement is a property of the arrangement
    rather than of the moment it was last inspected,
  And at no point does any material a specialist begins work from state a figure
    for that kind of file other than the one that will be applied to it.
