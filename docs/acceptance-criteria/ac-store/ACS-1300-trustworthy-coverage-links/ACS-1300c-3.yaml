    description: "GE-120, AT THE OUTCOME AND NOT ONLY IN THE BODY. Assert the run's overall outcome for the abstaining fixture is distinguishable from the outcome of a run over a store with nothing to judge. Reporting each abstention in the output while exiting as though clean means an operator reading only the outcome concludes the store is fine."
  - name: test_acs_1300c_3_examined_total_includes_the_abstained_records
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Assert examined equals decided plus abstained for the run, and that the three abstained records are counted in examined. If they dropped out, the run's coverage figure would improve every time it understood less."
