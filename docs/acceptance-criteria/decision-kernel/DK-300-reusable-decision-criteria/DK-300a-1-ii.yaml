notes: |
  Mining runs repeatedly (it is the feedback loop for DK-300e: drafted and person-added criteria in published decisions become material for the next round). Without this rule every round re-proposes the whole library.
  The last clause is consistent with both open options for how a NEW decision's reuse becomes a member pair (DK-300d-3): if the publish already added the pair, the mining finds it is already a member and reports nothing new.
  Open: whether a candidate a person REJECTED is remembered so that the next mining run does not propose it again (see DK-300c-1-ii notes).
