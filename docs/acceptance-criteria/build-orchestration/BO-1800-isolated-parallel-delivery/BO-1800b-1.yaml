it_requirements:
  - "This is a hub (GitHub) branch-protection CONFIGURATION / process requirement, NOT application code: there is no coder deliverable for the server-side rule itself. The deliverable is a how-to/runbook that records the exact settings and how to verify them (ADR-018 Decision §4, Migration §1)."
  - "The recorded configuration MUST require a pull request for hub main and MUST reject direct push, force-push, and branch deletion server-side, independently of any local hook."
  - "The advisory local pre-push/pre-commit main-guard is out of scope here (covered by BO-1800e-1-i) and MUST NOT be presented as the guarantee — the guarantee is server-side."
  - "The runbook/how-to MUST live on a portable docs surface (docs/) — never in repo-root CLAUDE.md."
