assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Exercises the FAILING path of the blocking web-app build/type-check job added in BP-1400a-1: a fixture web-app file (or a transient PR edit) under leafcutter-web/ that introduces a TypeScript type error must drive `next build` (which runs tsc) to a non-zero exit, so the check concludes red and the PR is marked not-mergeable."
  - "The deliberately type-erroring change must be transient/scoped to the verification (a throwaway PR or a temporary file/edit removed before merge, or an isolated fixture the test compiles in isolation) so it does not become a standing build break — this AC verifies the GATE blocks, it does not ship a broken web app."
  - "Not-mergeable enforcement here assumes the required-status-check wiring covered by BP-1400a-4; the blocking OUTCOME of THIS AC is the check reporting failure, with merge-blocking provided by branch protection."
