notes: |
  THE BOUNDARY IS BETWEEN 'SOME' AND 'NONE', NOT BETWEEN 'MANY' AND 'FEWER'.
  AR-300d-3 removes one of three and is satisfied by any implementation that
  filters a non-empty list. Removing the only one crosses into the branch
  AR-300a-3 governs, and an implementation can easily get the filter right and
  the branch wrong -- emitting a bare heading for an agent whose list just became
  empty.
