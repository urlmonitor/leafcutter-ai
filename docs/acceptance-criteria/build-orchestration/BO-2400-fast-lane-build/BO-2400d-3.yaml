criteria: |
  Given telemetry records exist tagged for both the fast lane and the heavy pipeline,
  When the comparison report is generated,
  Then it emits cost per unit of work and time per unit of work for each lane
  And the two lanes are presented side by side so the fast lane can be compared
    against the heavy pipeline.
