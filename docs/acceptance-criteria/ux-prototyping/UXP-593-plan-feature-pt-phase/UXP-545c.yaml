criteria: |
  Given a product-truth stage is presented at its review gate,
  When the user chooses cancel,
  Then no pull request is opened,
  And every product-truth stage committed before the cancelled one is preserved,
  And the cancelled stage's draft is left uncommitted,
  And the run reports where it was cancelled.
