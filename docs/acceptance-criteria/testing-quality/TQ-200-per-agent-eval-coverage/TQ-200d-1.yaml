assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  - agent: python-coder
    ac_id: TQ-200d-4
    contract: "The test writer's registered eval set, which TQ-200d-4 adds its database-setting rows to."
expects_from: null
it_requirements:
- 'Join the existing harness (TQ-200c-4). Register the agent in scripts/evals/agent_eval_config.json with
  ONE eval-set path of JSONL rows ({id, input, expected}). Test-writing agents produce test files, not
  product-truth artifacts, so their scoring type lives in a sibling module under scripts/evals/. run_agent_eval.py
  has 1438 counted lines, over the ratchet, and must not grow: any registration line added there is offset
  in the same file.'
- 'Each row runs in a throwaway sandbox: a temp copy of a small fixture project the row names. Never the
  repository tree.'
- 'Score mechanically wherever the expected outcome is mechanical: the fixture seeds cvd_delta_30 with
  values distinct from cvd; the query or test counts processed rows and non-NULL values; the known seeded
  value is asserted. Judge rubrics are only for report wording. The refresh-gate row''s test half moves
  to a real wrong-version run in TQ-200d-1-i.'
- Local only (user decision; KI-TQ-20260907). Registering the set must not make the CI eval job report
  these rows as passed or checked. The result is stamped as a local run, and nothing claims TQ-200b-2.
- Unit tests never call a live model. Row pickup and scoring are proven through the runner's gold-scoring
  path, using recorded good and bad agent outputs as fixtures.
- Record the before-score against today's test-writer. It is the eval's own red baseline.
- Any database address in a template, fixture or doc is the placeholder postgresql://<user>:<password>@<host>:<port>/<database>.
  INF-1100d-4 scans shipped files.
- Every new or changed Python file stays at or under 400 counted lines (scripts/commit_guardian/_file_size_ratchet.py).
  Files already over the limit must not grow.
test_spec:
- name: test_test_writer_set_registered_and_every_row_scored
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: python scripts/evals/run_agent_eval.py (gold-scoring mode)
  description: run_agent_eval.py, run as a subprocess in gold-scoring mode for test-writer, finds the
    registered set and reports a score for each of the five row ids without any row being named on the
    command line.
- name: test_trap_row_fails_fixture_seeding_only_old_column
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: discrimination
  description: A recorded output whose fixture seeds only cvd fails the 'input moved to a new column'
    row, and the gold output seeding cvd_delta_30 distinct from cvd passes.
  must_catch:
  - trap row scored on report wording only
  - fixture check accepts cvd-only seeding
- name: test_gold_outputs_pass_each_positive_row
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: criterion
  description: The recorded gold outputs for refresh gate, new function or existing code, empty window
    and presence is not correctness each pass their row. An empty-window output that does not count non-NULL
    values fails.
  must_catch:
  - empty-window row passes a NULL-skipping check
- name: test_local_result_never_presented_as_ci
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: failure
  description: The report of a local run carries the local run marker, and the CI eval selection does
    not treat the set as checked.
  must_catch:
  - report omits the local marker
  - CI job reports the set as passed
test_rationale: An eval set's worth is that bad outputs fail it. So each row is proven with recorded good
  AND bad outputs through the real runner, with no live model. The trap row carries the must_catch.
