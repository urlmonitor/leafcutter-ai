it_requirements:
  - "Extend the existing how-to at docs/how-to/managing-pre-commit-hooks.md with a dedicated 'Page-documentation guardrail' section rather than creating a new file — the page-documentation guardrail is a pre-commit hook and belongs alongside the other hook guidance there; only create a separate how-to if the section grows beyond the natural scope of that guide."
  - "Document the block-versus-warn configuration: the page_doc config section with mode: block|warn defined in GE-104a-1-iv (read from commit_guardian.json), including what each mode does — block exits non-zero on a missing doc, warn-only prints the same FIX message but allows the commit — and how an operator switches between them."
  - "Document the deterministic page-to-doc naming convention defined by the shared derive_doc_path helper in scripts/commit_guardian/frontend_page_docs.py per GE-104a-1-i: a page at site/app/<route>/page.tsx maps to exactly one reference doc at docs/reference/frontend/<name>.md (hyphen-joined lowercased route segments, dynamic [param] segments normalized to p_param per GE-104a-1-ii), so an operator can predict the required doc path without reading code."
  - "Document how an author satisfies a block: create the exact reference doc named in the FIX message at docs/reference/frontend/<name>.md, then re-stage and re-commit — give a concrete worked example so a blocked commit is resolvable without guesswork."
  - "State that enforcement is two-layered: the planning-time documentation-expert trigger raises documentation as expected work when a new page is planned, and the commit-time hook is the authoritative backstop that actually blocks an undocumented new page; make clear the commit-time hook is the source of truth."
  - "Must be consistent with the actual config keys, mode values, and derived-path rule shipped by GE-104a-1 / GE-104a-1-i / GE-104a-1-ii / GE-104a-1-iv — do not invent config names or path rules that diverge from the implemented behavior."
