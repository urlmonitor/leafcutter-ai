notes: |
  THE HAZARD IS LIVE AND IT RUNS THE WRONG WAY. Verified by the PO on 2026-08-25:
  the deployed workflow at leafcutter-ai/.leafcutter/workflows/plan-feature.js
  carries NO charter gate, while the source does. So a project where the route
  currently starts would have the KI-ACD-009 blocker ADDED to it by the next
  install. A source-only repair has a window in which installing makes things
  worse, and every consumer walks into it on their next build.

  STANDING GUARANTEE, NOT A ONE-OFF CHECK. It is stated in terms of before-and-after
  behaviour of the same project, so it keeps its meaning for the next change to the
  startup path -- which is the point of writing it as an AC rather than as a release
  note for this repair.

  THE BEFORE MEASUREMENT IS NOT OPTIONAL. "The route still starts" is unfalsifiable
  without it: if the route was already broken in that project, an install that keeps
  it broken passes. Measure first, install, measure again.

  DELIBERATELY WEAKER THAN d-1. This does not require the installed and source
  copies to agree -- that is ACD-2100d-1. It requires only that installing never
  takes a working project backwards, which is the guarantee a consumer actually
  relies on and the one the current stale artifact breaks.

  2026-08-25 (it-po): sized M rather than L because the expensive part -- install into a
  temporary target, start a run there, observe how far it got -- is ACD-2100d-1's
  deliverable and is reused here; what is new is the two-measurement protocol, the
  precondition-not-met verdict, and wiring the check so it keeps running. The
  before-measurement is enforced by a test rather than by an instruction: the boundary
  descriptor requires a fixture that an after-only implementation would pass and this
  one must not, which is the only shape that cannot be satisfied by computing the before
  value and discarding it.

  SEQUENCING CAVEAT INHERITED FROM ACD-2100d-1 (raised to the user, not edited here).
  This record's Given -- a project in which the route already reaches the first question
  -- cannot be constructed until ACD-2100a-5 lands, because the source copy halts at the
  charter gate today. depends_on carries [ACD-2100d, ACD-2100d-1], and ACD-2100d-1's own
  depends_on carries only [ACD-2100d], so no path in the build order reaches ACD-2100a-5.
  The build sequencer reads depends_on only (KI-ACD-015, open), so the expects_from edge
  above does not order anything. The it-po does not own depends_on and has not edited it;
  the recommended edit is to add ACD-2100a-5 to ACD-2100d-1's depends_on before the tree
  is approved, which orders this record correctly by transitivity.

  IT PO ENRICHMENT -- 2026-08-26 (files_touched backfill).

  WHY THIS RECORD PRODUCED AN EMPTY files_touched. generate_ticket_from_ac.py derives the
  ticket surface as the union of path tokens found in it_requirements prose that exist on
  disk, plus doc_links whose relationship is one of constrains / creates / implements /
  modifies / specifies. Every doc_link here was "describes" and no it_requirement named a
  path, so the union was empty. The enrichment below fixes the cause, so a regeneration
  reproduces the same three paths.

  THE THREE PATHS, AND WHY EACH ONE IS THERE.

  scripts/ci/check_consumer_install.py -- this is the answer to the standing-guarantee
  requirement, and it was already sitting there. Verified on 2026-08-26: the script
  creates a temporary target project, runs the real installer into it as a subprocess,
  and inspects the deployed tree; its exit code is consumed by a dedicated CI job. In
  other words the "install into a temporary target" half of this record's protocol
  already exists AND is already read by a deliverability decision. What it does not do is
  start a run afterwards. Extending it is what turns the requirement's words into a gate
  that re-runs on every installer change, and it is strictly cheaper than authoring a new
  script and then having to argue that something invokes it.

  unit_tests/_installed_route_probe.py -- ACD-2100d-1's deliverable, listed here because
  this record modifies it rather than merely calling it. The two-measurement comparison
  and the precondition-not-met verdict have to live in the shared probe, not in this
  record's test file, or the reuse requirement is satisfied in name only: two callers
  would each carry their own notion of "how far the run got" and would eventually
  disagree. Declaring it as a shared edit surface is also what tells a change-scope
  reviewer that a diff to that file under this ticket is expected.

  unit_tests/portability/test_acd_2100d_3.py -- the four descriptors, including the
  boundary one that makes the before-measurement mechanically load-bearing. The generator
  already names this exact path in the ticket's Test Requirements block.

  PATHS CONSIDERED AND REJECTED.

  scripts/build_phases.py -- rejected here even though this record's second criterion is
  violated today by a missing deploy entry (the deployed route reads a charter registry
  that no build phase deploys; see ACD-2100d-1's enrichment note for the verification).
  That repair belongs to ACD-2100d-1, which this record depends_on. Listing the file under
  both tickets would give two tickets authority over one file for two different reasons
  and would make an out-of-scope deploy edit look in-scope under whichever ticket happened
  to be open.

  The CI workflow definition -- rejected. The consumer-install simulation job already
  invokes the script named above, so extending the script needs no workflow edit. If the
  implementer finds a workflow edit is genuinely required, that is a scope change worth
  surfacing rather than absorbing.

  A NEW STANDALONE CHECK SCRIPT -- rejected on purpose. It is the shape the
  standing-guarantee requirement explicitly forbids: a script that proves the property
  once and is never invoked again.

  UNRESOLVED TENSION, LEFT VISIBLE RATHER THAN SILENTLY DECIDED. The last it_requirement
  demands the check's runtime dependencies be in the build deploy manifest, but neither
  the CI check directory nor the test tree is deployed into a target install -- verified
  on 2026-08-26. The honest reading is that the requirement is about what THE ROUTE needs
  at runtime (ACD-2100d-1's surface), not about the checker, which is package-development
  tooling like every other CI gate here. An it_requirement has been added stating that
  reading and naming the two acceptable resolutions, so the implementer does not resolve
  it by writing a second probe.
