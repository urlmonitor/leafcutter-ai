roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the staged record of cat-6c3eb4f2af148922 from run-8e11d78d6e2a6c2e, with the member (dec-93c1c730463c1f3c, crit.filters_from_declared_vocabularies) and the broader category cat-d6ce5f78c181ebd1,
  When a person runs the publish for that run,
  Then the record is checked: every member names a published decision whose criteria carry that criterion, that criterion's question is one of the category's wordings, no wording is a label of another staged or published category, no member pair belongs to another staged or published category, and the broader category is published,
  And the record is written into the published category library with lifecycle_stage published, where it is reviewed and merged like any other change,
  And the generated usage index is rebuilt to include it,
  And no decision record changes.
