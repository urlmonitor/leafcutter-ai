it_requirements:
  - "The router is a NEW depth-0 workflow (templates/workflows-js/feedback-router.js); the queue-build step must shell out to scripts/feedback/aggregate.py --unresolved --format json rather than re-parsing feedback.jsonl directly, so 'unresolved' has one source of truth"
  - "Must treat absence of resolved_at as the sole unresolved predicate; entries carrying resolved_at must never be read into the processing path"
  - "Must report the queued-entry count before any classification begins"
  - "Must handle a missing or empty feedback.jsonl as an empty queue (zero entries), not an error, per the project error handling policy"
