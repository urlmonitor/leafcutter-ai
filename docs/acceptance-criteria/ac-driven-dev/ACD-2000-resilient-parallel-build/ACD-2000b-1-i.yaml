title: "Routine lifecycle edits cannot silently steal or drop a live claim"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement currently taken by one effort,
  When a routine housekeeping pass that marks finished requirements as complete
    runs over the store,
  Then the requirement is either left taken, or its release is recorded as a
    deliberate hand-back naming what released it,
  And it never becomes quietly available with no record that the claim ended,
  And a person editing the requirement's lifecycle by hand while it is taken is
    told the requirement is currently taken and by whom,
  And a scan for work that is ready to pick up does not offer a requirement that
    is taken by a live effort,
  And that same scan distinguishes a requirement a machine has taken from one a
    person has marked as being worked on.
