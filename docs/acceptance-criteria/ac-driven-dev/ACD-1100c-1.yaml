criteria: |
  Given the package previously had a skill directory at
    templates/skills/create-ac/ with SKILL.md and associated workflow at
    scripts/workflows/create-ac.js,
  When the v2.0 migration renames the planning command,
  Then the skill directory exists at templates/skills/plan-feature/SKILL.md,
  And the workflow script exists at scripts/workflows/plan-feature.js
    (or the equivalent new name),
  And the skill registry (config/skill_registry.json or equivalent) contains
    an entry with id "plan-feature" and no entry with id "create-ac",
  And templates/skills/create-ac/ directory no longer exists,
  And templates/commands/plan-feature.md exists (if command templates are used).
