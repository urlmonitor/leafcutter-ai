    target_dir: unit_tests/_shared/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Evaluate the rendered block's decision for the six hostile replies (prose, no commit_answer, string commit_answer, empty, ok-envelope with hook_failed, blocker-envelope with committed); each is report, none continue, retry or engage, and nothing raises."
    proves_clause: "every one of them is report, and none is continue, retry or engage"
    code_file: templates/workflows-js/_shared/commit-answer.js
    to_be_created: true
    convention_test_file: unit_tests/test_build_workflow_phase.py
    must_catch:
