notes: |
  UNASKED-FOR, AND WHY IT IS NOT SCOPE CREEP. The request did not mention the fix-proof path.
  But without this record, adding the live-database lane opens a hole in an existing gate:
  the proof run of TQ-600a-13-xvi starts no database today, so every failing live-database
  test would skip in it, and a skip-blind judgement would release the repository-wide hold on
  a pull request that proved nothing. Keep this record when the family is scoped down.
