      written against.
  - path: CLAUDE.md
    relationship: describes
    status: exists
    relevance: >-
      "Gate / Workflow ACs — Verify Behaviorally, Not by Grep". The third clause is
      the anti-grep clause of this record: no implementation carrying a set of
      kinds written into itself can pass it, however that set is spelled.
