id: INF-500e-3-i
components:
  - infrastructure
  - ac_store
title: "An age the report cannot establish is left out of the cycle time rather than entered as zero days"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a criterion closed during the period whose first appearance cannot be
    established from the recorded history,
  When the ages of the criteria closed in that period are collected,
  Then no age is reported for that criterion,
  And in particular it does not contribute an age of 0 days,
  So that an unknown history cannot pull the median cycle time down and present the
    system as faster than it is.

  Given a criterion closed during a period ending 2026-08-26 whose recorded first
    appearance is 2026-08-30, four days after the period ends,
  When the ages of the criteria closed in that period are collected,
  Then its reported age is 0 days rather than a negative number,
  So that a clock skew or an out-of-order record cannot produce a negative cycle time
    that silently offsets the real ages it is averaged with.
depends_on:
  - INF-500e-3
