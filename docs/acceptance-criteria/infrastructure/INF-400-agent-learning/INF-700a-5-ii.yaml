test_spec:
  - name: test_a_record_emitted_after_the_routing_step_is_named_in_the_difference
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive a completion path in which one record is in the sink before the routing step runs and a second is appended after it. Assert the reported result states two present and one read, and names the unread record. A result that reports only the read count is the silence this AC closes."
  - name: test_an_unread_record_is_not_reported_as_routed_written_or_nothing_to_do
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "With one record left unread, assert the reported result's routing outcome is not the wrote-everything value and not the nothing-to-do value, and that the unread record does not appear in the written count. Three separate not-this assertions, because each is a plausible implementation and each hides the record in a different place."
  - name: test_a_waiting_record_survives_the_teardown_and_is_written_by_the_next_completed_unit_of_work
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "The clause that holds the words to the world, inverted from the version this AC carried before the sink decision. Drive a path that leaves one record unread, complete it, remove the working directory, then read the sink from outside that directory and assert the record is still there. Assert the report describes it as waiting for the next completed unit of work and contains none of the words that would call it lost. Then drive a second unit of work in the same install and assert the learning reaches its destination exactly once. Report and world must agree, and here agreement means the learning DOES arrive — the opposite assertion to the one this descriptor made before."
  - name: test_the_waiting_count_rises_while_a_record_waits_and_returns_to_zero_once_it_is_written
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Assert the count of knowledge waiting to be written is zero before the run, non-zero while the late-emitted record waits, and zero again after the next completed unit of work routes it. Both ends matter: a count that never rises cannot signal a tail, and a count that never returns to zero is the permanently non-empty backlog INF-700c forbids. This test is what distinguishes the two."
  - name: test_the_difference_is_zero_on_a_path_where_nothing_emits_after_the_routing_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Drive a completion path with no emission after the routing step; assert the emitted-versus-read difference is exactly zero. A figure that is permanently non-zero on a healthy path is background noise nobody will read, which is how the waiting count stopped carrying a signal."
test_rationale: |
  The third descriptor is still the one that distinguishes this AC from a
  counter, but it now asserts the opposite outcome from the version written
  before the sink decision, and that inversion is the point: reporting a
  difference is easy, and the tempting wording is wrong in exactly the case
  that matters — it was wrong as "gone" once the record started surviving, and
  it would be wrong as "waiting" if nothing ever collected it. Driving a second
  unit of work in the same test that asserts the report's wording is what holds
  the words to the world, in whichever direction the world happens to be
  pointing. The fourth descriptor asserts both ends of the waiting count for
  the same reason: a rising count and a permanently non-zero count look
  identical at any single moment, and only one of them is allowed.
notes: |
  WHAT THIS AC IS FOR NOW. Once the routing step is ordered ahead of the phases
  that publish the work (INF-700a-1, as refined on 2026-09-07), a residual
  remains: those publishing phases emit too, and their records arrive after the
  sink has been read. With an install-scoped sink that residual is a
  one-run delay rather than a loss. This AC counts and names it. It is the
  smallest of the family's failure records and deliberately so — its severity
  fell when the sink stopped dying with the working directory, and the record
  says so rather than keeping a loud claim it can no longer support.

  THE ONE PLACE THE DELAY BECOMES A LOSS, which is why the AC survives at all:
  nothing guarantees another unit of work ever completes. The last change
  before a project is parked, before a holiday, before a repository is handed
  over — its publishing phases' learnings sit in the sink with no successor.
  Nothing is broken and nothing reports a problem, which is the family's
  original failure mode in miniature. The clause requiring the waiting records
  to stay findable by asking is what keeps that case visible; narrowing the
  window by ordering, or draining the tail deliberately at the end of a
  session, are options an IT PO can weigh and neither is required here.

  THE RESIDUAL THIS AC USED TO STATE IS CLOSED. It previously recorded that
  INF-700a-5 had rejected durable-emission-with-deferred-routing because the
  sink did not outlive the working directory, and that the option could be
  reopened if that changed. It changed on 2026-09-07 and the option was
  reopened and re-decided on the merits: adopted for this residual, rejected as
  the whole mechanism, for reasons recorded on INF-700a-5. Nothing here is
  waiting on that question any more.

  BOUNDARY. INF-400c-4-iv owns a sink that has never been written to, which is
  a no-work outcome and is correct. INF-700a-5-i owns a routing write that
  happened and was never published. This AC owns a record the routing step
  never reached — which, since the sink decision, is still sitting where it was
  written. The three used to present identically to a naive reader as nothing
  there; the emitted-versus-read figure is what separates the third from the
  other two.
change_target:
  - pipeline
  - code
risk_surface: contract_boundary
