notes: |
  Negative acceptance scenario for ACS-200g, mirroring BP-1200b-1-i. Three
  concrete invalid shapes are named rather than "an invalid record" so the case
  is testable and so it exercises more than one of the six rule families: a
  missing required field (schema), a malformed identifier (identifier format),
  and a broken parent back-link (relational). Merge-blocking itself is provided
  by the required-status-check wiring, which is out of scope for this family;
  the outcome THIS case owns is the check reporting failure.
