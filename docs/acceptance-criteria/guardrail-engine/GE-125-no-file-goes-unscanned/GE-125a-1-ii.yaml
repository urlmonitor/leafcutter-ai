criteria: |
  FIXTURE ROOT USED BY EVERY SCENARIO BELOW. Each scenario builds a throwaway
  project root, written <root>, that is a directory of its own and contains no
  part of this repository, and no fixture is written anywhere inside this
  repository's own working tree — a fixture under this repository's tickets/,
  docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/ would take
  its verdict from this repository's reduced-scrutiny list rather than from the
  scenario's. Every path below is relative to <root>, every file holds one line
  with the same thirty-two-character opaque token of measured Shannon entropy
  5.17, no suppression entries are in force, and every scenario is exercised the
  way a commit exercises the check — the files are staged in <root> and the check
  runs over the staged set.

  Given <root> contains these files at the top of the project, whose first
    segment resembles a chosen name without being it:
      tickets-archive/2025/note.md
      old-tickets/note.md
      ticketsnew/note.md
      templates/skills-experimental/example/SKILL.md
  When they are staged and the check runs over the staged set,
  Then the token is reported for all four,
  Because a folder is either one of the four the project chose or it is not, and
    a comparison that accepts a name because a chosen name begins it, ends it or
    sits inside it hands the entitlement to folders nobody chose — a new way to
    lose detection introduced by the change that removes the old one.

  Given <root> contains these files, each carrying the tail of a two-segment
    chosen location without the segment that heads it:
      retrospectives/retro.md
      acceptance-criteria/guardrail-engine/GE-999.yaml
      api/acceptance-criteria/schema.yaml
  When they are staged and the check runs over the staged set,
  Then the token is reported for all three,
  Because two of the four chosen locations are two segments deep and are chosen
    as a whole: the second segment on its own, at the top of the project or
    anywhere else, was never chosen, and treating the entitlement as a set of
    single names rather than a set of locations widens it again.

  Given <root> contains these files, where a chosen name appears as the name of a
    file rather than of a folder:
      src/tickets.py
      docs/retrospectives.md
      src/skills/registry.py
  When they are staged and the check runs over the staged set,
  Then the token is reported for all three,
  Because the entitlement was granted to places, and a file that merely shares a
    place's name is not one — including the third case, where the folder name
    matches the tail of a chosen location while the head is absent.

  Given <root> contains, in the same run, tickets/00_inbox/note.md alongside all
    ten files named above,
  When they are staged together and the check runs over the staged set once,
  Then the token is reported for the ten and is not reported for
    tickets/00_inbox/note.md,
  And the run's exit status reports findings present,
  Because these near misses are worth nothing as evidence unless the one true
    match in the same run still comes out exempt: a comparison strict enough to
    reject all ten and also reject the real one has closed the entitlement rather
    than anchored it.
