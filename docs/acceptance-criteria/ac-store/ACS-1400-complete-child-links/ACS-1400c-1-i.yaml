notes: |
  THIS IS THE ACTUAL URGENCY OF THE WHOLE TREE, EXPRESSED AS ONE CONSTRAINT. The
  gap is not that reconciliation is impossible. It is that reconciliation is one
  command away, that command performs no adjudication, and the brief that would
  prompt someone to run it is now written down in the L0's own notes. Re-verified
  by reading the tool 2026-09-08: it would repair all 47 records, including the
  six the store paid a hook bypass to leave alone and 25 whose repair changes what
  the store believes about whether a record can be finished.

  A DEFAULT-SAFE TOOL IS NOT ENOUGH; THE UNSAFE PATH MUST STOP EXISTING. Adding a
  new adjudicating entry point alongside the current one leaves the current one
  reachable, and the current one is the one whose name matches what a hurried
  person will search for. The refusal belongs on the existing path.

  THE LAST Then IS THE ANTI-VACUITY HALF AND IT IS NOT OPTIONAL HERE. "Refuses to
  repair" is perfectly satisfied by a tool that refuses everything, which is also
  what a broken tool does. The adjudicated repair must succeed in the same
  criterion, or the safety property is indistinguishable from the tool being dead.

  DRY-RUN IS IN SCOPE OF THE MESSAGE, IF NOT OF THE WRITE. The existing preview
  mode prints the unadjudicated plan for all 47 as though it were the plan. A
  refusal on the write path that leaves the preview recommending the damage has
  moved the hazard rather than removed it.
