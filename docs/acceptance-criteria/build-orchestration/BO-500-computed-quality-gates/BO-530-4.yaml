notes: |
  User-originated (BrainCandy) process fix. Motivated by a real escape: an
  ssr:false render bug that only fails at route render time — static and lint
  checks passed, local sign-off marked the ticket done, and the defect reached
  PR/CI. This gate moves that detection LOCAL, before sign-off.
