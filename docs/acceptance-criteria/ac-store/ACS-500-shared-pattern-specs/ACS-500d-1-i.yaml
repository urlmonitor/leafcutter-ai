title: "Deleting a pattern AC is blocked when consumers still reference it"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given three page-level ACs each have implements_pattern: "PTN-001",
  When an agent or user attempts to delete the PTN-001 pattern AC file,
  Then the commit is blocked with an error stating:
    "Cannot delete PTN-001: still referenced by 3 consuming ACs"
  And the error lists the IDs of all consuming ACs that reference PTN-001,
  And the pattern file remains in the store unchanged.
