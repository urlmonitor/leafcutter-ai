notes: |
  WHY A REAL-SURFACE RECORD EXISTS AT ALL WHEN THREE FIXTURE-BASED SIBLINGS ALREADY SPECIFY THE
  MECHANISM. Because every one of them can be satisfied in full against a fixture surface while
  the real one is never read. That is not hypothetical: it is how this family's own machinery
  came to have a motivating example it cannot see. The parent fixes the acceptance shape as a
  property of the real repository, and a property of the real repository needs a record that
  says so.

  NAMING A REAL GUARD IN A CRITERION — DELIBERATE, AND MADE NON-EXPIRING. The house rule in this
  family is to assert over fixtures so an assertion does not expire the day a guard changes. It
  is overridden here because the parent requires this specific guard to end up examined and
  reported. The expiry is handled by the last clause instead of by avoiding the name: the
  record does not assert that this guard is inert, it asserts that whatever the run reports
  about it is what its own examination produced. On the day the guard is repaired the record is
  still true and still meaningful, and an implementation that recognises the guard by name and
  reports a fixed verdict for it fails.

  THE PAIRING CLAUSE HAS A CONSEQUENCE THE IT PO SHOULD SEE COMING. Requiring another guard on
  the SAME REAL SURFACE to be reported as having demonstrated its refusal in the same run means
  at least one real session guard must be declared and genuinely examined in the change that
  lands this — a fixture standing in for it does not satisfy the clause. That is affordable:
  this surface already wires guards that really do stop a tool call. It is also the strongest
  available form of the anti-vacuity rule, because it makes the report distinguish the epic's
  inert guard from a live one standing right next to it, which no fixture pairing can do.
  Nothing here licenses pre-suppressing the day-one state of the others: the correct outcome on
  the landing commit is that most subjects report no attempt ever made.

  NAMED MUTATION. Examine the canonical copy under templates/ instead of the copy the entry
  resolves to. ARRIVAL COLOUR: RED — nothing examines this surface today. Under the mutation the
  run still produces a full, plausible report, and the clause requiring the examined copy to be
  the resolved one is the only thing that goes red; everything else stays green. That asymmetry
  is the point, and it is the same mechanism — resolution through links into the installed tree
  — that made the worked example inert in the first place.

  Authored at the BA stage. L2 behaviour only. No assigned_agent, no it_requirements, no
  test_spec, no estimated_complexity — the IT PO's.
