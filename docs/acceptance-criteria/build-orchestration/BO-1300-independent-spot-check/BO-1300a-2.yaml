created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300a.yaml"
criteria: |
  Given the standalone spot-check command has resolved a review scope for a finished feature
  When the command starts the review
  Then it dispatches exactly three spot-check reviewer agents, no more and no fewer
  And the three reviewers are all dispatched against the same resolved review scope
  And the three reviewers run concurrently rather than one after another
  And the three reviewers are dispatched a single level below the command (the command does
    not spawn a build supervisor or any further nested dispatch chain)
depends_on:
  - BO-1300a
  - BO-1300a-1
