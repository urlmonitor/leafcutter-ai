id: GE-120g-1-i
title: "The leave-it-as-you-found-it rule binds a check by the role it declares, so a check declared to fix as it goes is not caught by it and no judging check can be let off it"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a working copy prepared as for the parent record — nothing excluded from
    version control, and the byproducts of an earlier run of the checks already
    tracked content,
  And a check whose declared role is to fix what it finds as it goes,
  And a change is staged that this check has something to fix,
  When the author performs an ordinary commit — no extra command, no extra flag, and
    nothing invoked by hand,
  Then the alteration that check makes to the working copy is not reported as a
    breach of the rule that a judging check leaves the working copy as it found it,
  And given a check that has just been added to the set, declaring the judging role,
    and named on no list held anywhere,
  When the author performs an ordinary commit that check takes part in,
  Then that check is bound by the rule from the moment it declares the judging role,
  And no check that declares the judging role is excused from the rule — there is no
    entry, flag, list or ground by which one can be.
