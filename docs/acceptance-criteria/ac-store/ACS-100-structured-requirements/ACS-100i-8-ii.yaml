id: ACS-100i-8-ii
components:
  - ac_store
  - precommit_hooks
title: "An entry a merge carries from a parent is not an entry the merge registers"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a merge commit being written, with two OR MORE parents — an octopus
    merge's third and later named branches are parents of the merge exactly as
    much as the first two,
  And a package-registry entry that already exists on AT LEAST ONE of the
    merge's parents (whichever one — including a parent named third or later
    in an octopus merge) but is absent from HEAD,
  When the change is evaluated at commit time,
  Then the merge is allowed with no citation required,
  Because the entry was registered by whichever commit first introduced it —
    where its declaration was already demanded — and carrying it across a merge
    registers nothing new, regardless of which parent carried it or how many
    parents the merge has.

  And given the same merge, plus an entry present in NONE of the merge's
    parents and cited by no acceptance criterion declaring a package surface,
  When it is evaluated,
  Then the merge is refused, and the refusal names that entry —
  so an undeclared registration cannot be smuggled in mid-merge alongside a
    legitimately-carried one, on an octopus merge exactly as on a two-parent one.

  And given an ordinary single-parent commit,
  When it is evaluated,
  Then the outcome is identical to before this criterion existed: an added entry
    with a declaring citation is allowed, and one without is refused.
