notes: |
  FOUND IN USE, 2026-09-08, generating the BO-400e epic. All five leaf ACs came back
  carrying an absolute path:

    implemented_by:
    - /home/henzeh/projects/leafcutter/worktrees/bo400e-acs/tickets/00_inbox/epics/...

  ROOT CAUSE -- an asymmetry between two sibling call sites, not a missing feature.
  goal_to_epic.py has two places that rewrite the back-reference after assembly:

    :2145  relativises BOTH the old path and the new path      <- correct
    :2353  relativises ONLY the old path, writes new absolute  <- the defect

  At :2353 the old path is carefully relativised so the lookup MATCHES what
  generate_ticket_from_ac.py stored, and then the replacement value is passed
  through untouched. The comment above it explains the relativisation of the old
  path and is silent about the new one, which is how the asymmetry reads as
  intentional on a skim.

  `_derive_worktree_from_inbox()` is NOT at fault -- verified by calling it with the
  exact argument used: it returned the correct worktree root. The relativisation
  machinery works; one call site does not use it.

  WHY IT MATTERS MORE THAN A COSMETIC PATH. implemented_by is evidence -- it is what
  a reader consults to find the ticket that delivered a criterion, and what the
  whole-store checks will eventually read. An absolute path resolves for exactly one
  person on one machine and is silently dead for everyone else, while still looking
  populated. Committing one also puts a developer's home directory into the shared
  store.

  THE SECOND CLAUSE IS NOT PADDING. The `if worktree_root is not None:` guard at both
  sites falls through silently when the root cannot be derived, so an underivable
  root and a correctly-derived one produce indistinguishable output. That is the same
  shape as the defences this repository has already had to repair for reporting
  success from a run that checked nothing.
