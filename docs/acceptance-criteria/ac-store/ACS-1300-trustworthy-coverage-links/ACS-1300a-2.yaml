it_requirements:
  - "THE WRITE TECHNIQUE IS DECIDED HERE AND CANNOT BE RETROFITTED. Edit each changed record by targeted line insertion or removal within the file's existing text — the shape already proven in this store by `scripts/ac_store/backfill_components.py` (`_insert_after_id_line`, and `_backfill_file`'s early return for a file already satisfying the condition). A design that loads the store, mutates in memory and dumps it back cannot satisfy ACS-1300c-2 and cannot be made to satisfy it later, because a YAML round trip preserves every value while rewriting every byte."
  - "A FILE NOT IN THE FINDING SET IS NEVER OPENED FOR WRITING. Byte stability inherited verbatim from TQ-400e-1 means DO NOT WRITE, not write-the-same. Combined with the previous requirement this fixes the file-open set to exactly the records the detection pass classified as needing a change."
  - "NEVER WRITES THE FINISHED-STATE FIELD, ON ANY PATH. No code reachable from the apply step may assign `work_status`. Refused, not deferred; not licensed by any strength of evidence. Promotion stays with `scripts/ac_store/mark_ac_done.py` behind its own gate, and ACS-1300c-1-i is the negative control that proves the refusal is enforced rather than merely intended."
  - "`scripts/ac_store/cross_reference_audit.py::_apply_backfill` IS DISQUALIFIED AS A WRITE PATH AND MUST NOT BE CALLED, WRAPPED, OR COPIED. Verified 2026-09-01: it sets `ac_data[\"work_status\"] = \"done\"` at line 457 and then re-serialises the record, breaking the finished-state refusal and byte stability in one call. The anti-duplication advice in this tree's L0 and L1 names that file as a reuse candidate; the ceiling on that advice is READ SIDE ONLY — `_detect_worktree_root`, `_load_ac_yamls`, `_write_report` are safe, the apply layer is not."
  - "THE WRITE STEP CONSUMES ACS-1300a-1's FINDING SET AND DOES NOT RECOMPUTE THE JOIN. A record absent from the findings must be structurally unreachable from the write path, not merely skipped by a condition. Recomputing the join here would create a second reader of the same evidence, which is the drift this tree's anti-duplication rule exists to prevent."
  - "PREVIEW IS THE DEFAULT AND APPLY IS OPT-IN, AND THE PREVIEW REPORT MUST BE THE APPLY REPORT. The two runs must name the same findings; a preview that reports less than the apply run turns 'nothing changed' into 'nothing found', which is how an operator concludes a rotten store is clean. Read-only-by-default is the posture `cross_reference_audit.py` already establishes for this store."
  - "IDEMPOTENCE IS ASSERTED ON FILE BYTES, NOT ON LIST CONTENTS. A second apply run must change no file at all. 'No duplicate entry added' is necessary and not sufficient: a re-write that reorders or re-quotes the same entries has changed the store while adding no duplicate, and at this store's size that churn makes the diff unreadable."
  - "ENTRY FORM FOLLOWS THE RECORD, NOT A NEW RULE. `docs/reference/ac-schema.md` permits both a bare test path and a `path::test_function` form; the appended entry must match the form the record already uses. Pinning one form globally would silently reformat every record using the other, and would put two spellings of the same fact into the store for downstream readers to disagree about."
  - "A RUN THAT COULD NOT DO ITS WORK MUST NOT LOOK LIKE A CLEAN RUN (GE-120), and a partially-completed apply must be recoverable: the report must be sufficient, on its own, to identify every record already written and every record not yet reached."
  - "Must have a real out-of-process entry point — every clause of this criterion is written as 'invoked out of process'. Must handle errors gracefully per the project error handling policy (CLAUDE.md rules 1-4) and must fail toward NOT WRITING: an undetermined verdict leaves the record untouched and reported as an abstention (ACS-1300c-3)."
  - "EVERY FIGURE IN THE REPORT CARRIES ITS DENOMINATOR AND EXCLUSIONS, in ACS-1100's existing vocabulary. No expected count may be hard-coded in the tool or in its tests."
