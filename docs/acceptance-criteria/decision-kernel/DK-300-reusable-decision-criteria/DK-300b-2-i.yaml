criteria: |
  Given the categories cat-52b16c7b5a23106f ("Does every change stay reviewable in normal git review?") and cat-d15d52392d7aa94c ("Does the option keep the rule that only a human approval creates a decision record and that precedent is evidence, never authority (ADR-060)?"),
  And the wording "Is every stored criterion or category reviewable in a Git diff, and does it come into existence only through a human approval, as ADR-060 requires for published records (so criteria mined automatically cannot self-publish)?", which asks both questions,
  And the wording "Can it be put in place with a small change and used with one command or click per run?", which asks a question of cat-1dc11c5a2ffa7310 and a second question no category asks,
  When groupings are suggested,
  Then neither wording is placed in cat-52b16c7b5a23106f, cat-d15d52392d7aa94c or cat-1dc11c5a2ffa7310; both get "none" and are left for a person to split or keep,
  And the wording "Does every published record still go through git review in a pull request?", which asks only the git-review question, is still placed in cat-52b16c7b5a23106f.
