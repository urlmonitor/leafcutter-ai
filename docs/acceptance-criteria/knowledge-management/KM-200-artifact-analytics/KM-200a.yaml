notes: |
  Idea stub — covered_by deliberately empty (see KM-200 notes). The artifact list
  in the criteria is the user's own list plus "etc"; it is illustrative, not
  closed, which is why extensibility is part of the benefit rather than a separate
  child. The reference-doc trigger exists because "what counts as created" and
  "what counts as consumed" must be written down once per artifact kind, or every
  figure downstream becomes arguable.
