  constraints:
    - "The 'is this path declared' answer must be read from the deploy declarations the build actually ships from. No list of known-declared paths may be maintained alongside them: it satisfies every single-run assertion, drifts silently, and reproduces inside this guard the hand-maintained-map staleness BP-900g-8 and BP-900g-9 exist against."
    - "Editing a deploy declaration must change the advice on the next run with no other edit — no separate registration step, and no cached map that must be regenerated for the guard to agree with the declarations."
    - "The derivation must cover every declaration shape that can name an absent path — directory-shipping phases, file lists naming individual paths, and mapping tables. A predicate written against the file-list shape that produced the observed defect leaves the identical hole in the other two."
    - "Glob-derived deploy phases are out of scope: a glob enumerates what is on disk and cannot name an absent path, so no path is ever already-declared by one. Do not add a branch for them."
    - "The new state must fire only on a genuinely broken reference: with the source present at the declared path there is no finding at all, so the branch cannot become a source of entries for healthy paths."
    - "The guard and the deploy loop (BP-900g-9) must resolve declarations from the same source. If the two ever read different sets one of them is wrong and nothing in the build today would say which — so do not introduce a second reader here."
