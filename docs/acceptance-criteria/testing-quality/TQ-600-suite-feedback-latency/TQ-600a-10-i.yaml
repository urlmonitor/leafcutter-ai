title: "A path the smaller copy omits produces a failure that names it, never a test that passes for the wrong reason"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a package copy that has been made smaller, from the whole checkout down to the
    template, script and configuration directories,
  And the hazard that makes shrinking a copy different in kind from sharing one: the
    tests in this file assert that a build FAILS after a deliberate mutation, so a
    build that fails because the copy is missing something unrelated produces exactly
    the same green verdict as a build that fails for the reason under test,
  And the second face of the same hazard: a test that reads a path the smaller copy no
    longer provides, where the read quietly yields nothing rather than refusing,
  When the build run against the smaller copy fails,
  Then the reason it gives is the one the test's own mutation was made to provoke, and
    a test asserting failure passes only when the reason matches that mutation rather
    than merely because something went wrong,
  And when a path a test needs is absent from the copy, the run stops and says which
    path was absent, instead of continuing with an empty or default value,
  And this is demonstrated by removing a required entry from the copy and observing the
    affected test turn red with a message naming the removed entry,
  And a control run against a sound copy shows the same test green, so a check that
    refuses every copy does not satisfy this record,
  And each of the file's failure-asserting tests is shown to turn green only for its
    own provoked reason: injecting a different, unrelated build failure turns it red
    rather than leaving it green.
