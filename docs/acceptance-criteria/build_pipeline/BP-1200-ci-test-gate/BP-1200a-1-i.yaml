id: BP-1200a-1-i
title: "Suite is green across repeated runs with both fixed and varied test-ordering seeds"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fresh checkout that has been prepared per the documented CI test
    command,
  When the full test suite is run several times in succession — at least one run
    with a fixed test-ordering seed and at least two runs with different
    randomized test-ordering seeds,
  Then every run reports the full suite passing
  And the set of passing tests is identical across all runs (no test passes on
    one ordering and fails on another)
  And the overall pass/fail outcome does not change between runs.
depends_on:
  - BP-1200a-1
doc_links:
  - path: docs/acceptance-criteria/build_pipeline/PROJECT_CONTEXT.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-016-ci-fresh-clone-test-dependencies.md
    relationship: depends-on
    status: planned
assigned_agent: test-runner
estimated_complexity: S
it_requirements:
  - "Determinism is verified by RUNNING the prepared suite multiple times, not by authoring production code: at least one run with a fixed seed (pytest -p randomly -p no:cacheprovider with a pinned --randomly-seed) and at least two runs with distinct randomized seeds. This is a test-execution/verification behavior, hence test-runner not python-coder."
  - "The set of passing test node-ids must be IDENTICAL across all runs (compare collected pass sets, not just the aggregate pass/fail count) — order-dependent leakage (a test passing only under one ordering) is a failure of this AC."
  - "Prerequisite is the ADR-016 mechanism in place. DECIDED DIRECTION (final gate): Approach 1 — CI runs the build step AND install_shims' shim_map is extended to bridge .leafcutter/scripts/... -> scripts/... (for scripts/commit_guardian, scripts/doc_compliance, scripts/feedback). 'Prepared per the documented CI test command' therefore means the build step has run and the shim bridge is present; do not run this determinism verification against an unprepared clone."
  - "If a non-deterministic test is found, it must be reported with the seed(s) that reproduce the divergence so a follow-up can fix the offending test — the verification surfaces the offender, it does not silently retry until green."
delivers_to: null
expects_from:
  ac_id: BP-1200a-1
  contract: "A fresh-clone test run that reaches green; this edge case stresses it for determinism across orderings (fixed seed + >=2 randomized seeds, identical pass set across all runs)"
