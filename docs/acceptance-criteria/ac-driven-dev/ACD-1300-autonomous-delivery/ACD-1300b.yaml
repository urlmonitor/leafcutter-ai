criteria: |
  The system works on several features in parallel, each in its own workspace.

  Rather than building one feature at a time, the autopilot runs multiple
  builds concurrently -- each in an isolated workspace so they cannot interfere
  with each other. You configure the concurrency limit based on your resources
  and comfort level. The system respects dependency order within the limit.
