notes: |
  THE PRODUCT OWNER'S THIRD DEFERRED QUESTION, ANSWERED HERE. The question was whether
  the coverage figure is cheap enough to compute given KI-BO-016, and the instruction
  was to say so in the criteria rather than specify something unaffordable.

  THE MEASUREMENT, taken from KI-BO-016 rather than assumed. One full read of the
  backlog cost roughly 90 seconds before BO-2400c-6, and 27 to 39 seconds after, over
  3,232 records. That is the floor and it grows with the backlog. So:

    - AFFORDABLE: one report, produced when asked, costing one read. Tens of seconds
      of an operator's deliberate wait, comparable to the wait a single build already
      pays before its first craft is dispatched.
    - NOT AFFORDABLE, and therefore not specified anywhere in BO-3500d: computing the
      figure on every build run, on every commit, on a routine check, or as anything a
      gate consults. Each of those would multiply a thirty-second cost by the frequency
      of the thing it hangs off, and the resulting tax would be paid by every operator
      to benefit a report almost none of them asked for.
    - NOT AFFORDABLE, and specifically avoided by BO-3500d-3: resolving each possible
      starting point separately to work out how many starting points build. That is the
      figure that most wants computing and the naive way of getting it is a read per
      starting point — thousands of reads. BO-3500d-3 requires it be derived from the
      one read instead.

  THE READ-ONCE CLAUSE IS THE SAME DEFECT KI-BO-016 RECORDS, one level up. That entry
  is about a resolver that re-read the whole backlog once per expansion; a report that
  re-read it once per requirement classified would be the identical mistake with a
  worse multiplier. It was fixed there by a parse-count assertion rather than a
  wall-clock bound, and the same shape of test applies here: assert the number of reads,
  never a duration, or the test is flaky by construction.

  THE SELF-TIMING CLAUSE exists because this cost will drift. KI-BO-016's residual says
  plainly that the single-read floor scales with backlog size and will worsen as the
  backlog grows. A report that states its own duration makes that drift visible to the
  person who would otherwise be the last to know.
