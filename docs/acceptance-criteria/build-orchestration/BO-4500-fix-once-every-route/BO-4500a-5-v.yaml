it_requirements:
  - >-
    WHO RUNS THE STEP: the commit agent (Q1 default, adopted). Its brief becomes: author a message
    file only when none was given; run the shared step once with the caller's explicit path list
    and message file, unchanged; relay the answer. Staging, recording, retry budget, branch refusal
    and process/stash safety leave the template.
  - >-
    REPLY ENVELOPE (the shape every depth-0 caller reads): {status: ok | handoff | blocker,
    commit_answer: <the step's answer object exactly as printed>, earlier_answers: [<verbatim
    answers of earlier calls in this dispatch, in order>]}, and, only when commit_answer.handoff is
    non-null, the handoff object's keys (handoff_target, record_handoff_target, flips_signed_off,
    message, remedy) copied unchanged to the top level so BO-3000a routing and commit.js's existing
    schema read them as today. status is handoff iff commit_answer.handoff is non-null; ok iff
    commit_answer.status is committed; blocker otherwise. Callers decide on commit_answer, never on
    the envelope's prose.
  - >-
    DISPOSITIONS (BO-4500a-3 / BO-3800a): engage-specialist -> dispatch nobody (depth 1, ADR-019),
    edit nothing, return the handoff envelope; mechanical-autofix -> apply the precommit-autofix fix
    in the agent's own context, then make a fresh call of the step, up to max_automated_fix_retries in total (config, default 3; bounded the BO-210c-2 way); author-clears or
    remedy null -> return blocker with the answer. No other retry route exists: never edit check
    configuration, never --no-verify or SKIP=, never reset, stash, checkout or restore.
  - >-
    BO-3800a's commit.md step 0 ("run remedy_handoff.py with the hook output on stdin") is
    superseded by relaying commit_answer.handoff, which the step already built with the same
    builder. Until BO-3800a lands, this record must not reintroduce a second payload path; if
    BO-3800a lands first, its step 0 is rewritten here.
  - >-
    COMPANION SURFACE, THE /commit ROUTE: commit.js (BO-3800a-2) dispatches this agent with the hand
    recipe "Show the planned commit message and file list, then commit", and re-offers with "Attempt
    the SAME commit again". Both prompts must instead instruct running the shared step with the
    explicit path list and message file, and the re-offer must pass the IDENTICAL path list and
    message file captured from the first commit_answer, never re-derived. That .js edit is
    python-coder work and belongs to a follow-up L3 under BO-4500a-5 (recommended to the user); it
    is recorded here so the template and the /commit prompt change together.
  - The person-facing confirmation gate and stage-by-name are kept (as the step's explicit path list); the template carries no literal model name, no hardcoded Co-Authored-By footer and no process-kill or stash command.
delivers_to:
  - agent: python-coder
    contract: >-
      Commit-agent reply envelope {status: ok | handoff | blocker, commit_answer: <verbatim
      BO-4500a-4 answer>, earlier_answers: [answers], plus handoff_target, record_handoff_target,
      flips_signed_off, message, remedy copied from commit_answer.handoff when status is handoff},
      read by every depth-0 route's COMMIT-ANSWER block (BO-4500a-5-i..iv, the /commit route) and by
      the drive's BO-3000a handoff routing.
