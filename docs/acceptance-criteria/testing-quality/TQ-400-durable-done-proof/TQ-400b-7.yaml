notes: |
  Satisfies the reference-doc entry in TQ-400b's documentation_triggers.

  SCOPE — THIS IS NOT A SECOND OBLIGATION. TQ-400b-2 already requires both fields
  to be documented in the store's field reference in the same change as the
  schema edit. That obligation stands and is not duplicated here. What this
  record adds is the acceptance standard for that entry: what a reader must be
  able to answer from it. Anyone enriching or building this AC must treat
  TQ-400b-2 as the owner of the change and this record as its quality bar, and
  must NOT open a second documentation surface for the same two fields — two
  accounts of one field pair is precisely the drift the last criterion forbids.

  Why "the entry exists" would not do: the store's schema refuses unknown fields,
  so an undocumented field is a field nobody else will ever set correctly. The
  four things a reader must be able to state — type, emptiness, writer, moment —
  are the four an author omits when writing to satisfy a presence check, and the
  never-rewritten rule is invisible from the type, so it is the one that gets
  lost and the one whose loss destroys the lapse-duration information the
  cadence reports depend on.

  The validator-agreement clause makes the entry falsifiable against the shipped
  schema rather than against the author's intent.

  IT-PO ENRICHMENT NOTE (2026-08-18) — THE ESCALATED HAND-OFF, AND THE INCENTIVE
  THAT WOULD BREAK IT. The BA escalated the risk that this record becomes a second
  documentation task. The mechanism by which that would actually happen is worth
  naming: documentation-verifier asserts a named doc file has a REAL git diff, so
  an implementer who arrives after TQ-400b-2 has already written an adequate entry
  faces a gate that a zero-line diff does not satisfy. The pressure is therefore
  toward writing SOMETHING — a new section, a restatement elsewhere — which is
  exactly the drift the last criterion forbids. it_requirements now make the
  zero-diff outcome explicitly legitimate and require it to be reported, and the
  test contract is written against the PUBLISHED entry rather than against this
  AC's diff so that outcome passes on its merits.
