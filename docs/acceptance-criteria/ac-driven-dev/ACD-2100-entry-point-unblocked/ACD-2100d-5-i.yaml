notes: |
  THIS IS THE RECORD THAT MAKES THE FIX STICK. The defect pattern (KI-ACD-20261022) is "a
  contract changed on one side": the skill's rewrite removed the producer of an argument and
  the consumer still required it. A check that starts the workflow with an args object written
  into the test is exactly how the done records ACD-2100d-1 and ACD-2100a-5 stayed green while
  every documented start failed. So the arguments must be READ from the installed entry text
  when the check runs.

  Each arm is a named mutation that must turn this record red: drop the argument from the
  command only; add a required argument to the workflow only; rename on the skill side only;
  delete the start line (no silent fallback list). The all-three-agree arm is the paired
  acceptable input: without it, a check that fails on ANY change to the entry text satisfies
  every other arm.

  "The project's own checks" means the test suite run in CI; the check must exercise the
  workflow behaviourally (CLAUDE.md "Gate / Workflow ACs -- Verify Behaviorally, Not by Grep"),
  not compare argument names as strings.
