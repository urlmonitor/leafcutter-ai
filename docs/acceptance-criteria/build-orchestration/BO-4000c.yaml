assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The location named from a run started inside any linked worktree is byte-identical to the one named from the main checkout, because the base is derived from git's shared common directory and never from the start directory's own top-level."
  - "What occupies the location is established from facts about what is on disk, returned by BO-4000's deterministic repository-facts helper in a structured result: absent, a linked worktree of this repository together with its checked-out branch, a checkout of another repository, or any other directory. It is never inferred from the directory name."
  - "An existing linked worktree at the location is reused only when it belongs to this repository (same shared common directory) and is checked out on the target's branch under BO-4000's single branch-name rule. Every other occupant is refused."
  - "A refusal never computes or tries an alternative location (the ADR-039 no-suffix rule, applied to build-feature)."
  - "A refusal is read-only for the occupied location. Nothing inside it is created, changed or removed, no worktree is registered or pruned, and no branch is created for the target."
  - "The refusal names the location and carries a stable, machine-readable discriminator for the occupant kind."
  - "The real-artifact test builds each occupant kind on disk inside a temporary repository, starts from a real linked worktree, and asserts the occupied location's contents are unchanged after the run."
delivers_to: null
expects_from:
  ac_id: BO-4000
  contract: "BO-4000's named-location rule (<worktree base>/<target identity>, base from the main checkout) and its repository-facts object { path, exists, is_git_toplevel, is_linked_worktree, is_main_checkout, same_repository, branch }, used here from a linked-worktree start and against an occupied location."
test_required: true
test_spec:
  - name: test_run_started_in_an_unrelated_worktree_names_the_same_location_as_from_main
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Started inside uxp-700-tranche-2 for EPIC-OtherEpic, the named location equals the one named from the main checkout and is not under uxp-700-tranche-2."
  - name: test_existing_worktree_for_the_target_at_the_location_is_reused
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A linked worktree on the target's branch already at the location is reused and no worktree-opening agent is dispatched."
  - name: test_occupied_location_refuses_without_choosing_an_alternative
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A plain directory, a foreign checkout, and a worktree on another branch at the location each stop the run, name the occupant, and dispatch no worktree-opening or phase agent."
  - name: test_location_decisions_on_a_real_repository_started_from_a_linked_worktree
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "With a temporary real repository, a real linked worktree as the start directory, and each occupant kind really on disk, the decisions match the scenarios."
  - name: test_worktree_start_and_occupancy_are_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "The scenarios are driven through _workflow_engine_harness.py running build-feature.js's own top-level body."
test_rationale: |
  BO-4000's named-location tests start from the main checkout, where the current
  directory's checkout and the repository's main checkout are the same thing. A location
  derived from the current directory's top-level passes all of them. It still nests
  worktrees inside worktrees the first time a run starts from one, which is how the
  incident run was started. The occupied-location cases are separate because the natural
  way around an occupied path is a suffix. That would make the location no longer derived
  only from base and target, and BO-4000's determinism test would not notice, since it
  never occupies the location.
