it_requirements:
  - "Implemented as a spot-check reviewer agent template (templates/agents/*.md) parameterized by angle, or three angle-specific prompt seeds; the angle assignment is injected at dispatch and is part of the prompt body, not user input."
  - "If a new reviewer agent template is introduced it must be registered in config/agent_registry.json and be dispatchable at depth 1 (is_ticket_phase / tier set so the spot-check command can spawn it); a reviewer must not be assigned a tier that the command cannot dispatch."
  - "The three angles (edge/boundary, integration & error-handling, user-facing/usability) are a fixed closed set; the seed for each reviewer must name exactly one angle and instruct the reviewer to stay within it."
  - "Each reviewer's output must be a structured per-angle finding set tagging which angle produced it, so the aggregation step (BO-1300b-2) can attribute findings."
delivers_to:
  agent: llm-expert
  contract: "Three per-reviewer finding sets, one per angle, each tagged with its angle label { angle: edge|integration|usability, findings: [...] }, consumed by the aggregation step (BO-1300b-2)."
