id: BO-3200e-1
title: "A check whose inspection failed reports that it could not tell, and never the finding it would have made"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a check whose subject is in a state that would make it report a problem,
  When it inspects that subject successfully,
  Then it reports that problem as a finding about the subject.

  Given the same check and the same subject in the same state,
  When its inspection cannot be performed — the subject cannot be read, or what it read cannot
    be interpreted,
  Then it reports that it could not tell, names what it was unable to inspect and why, and does
    not report any finding about the subject.

  Given a check whose subject is in a state that would make it report no problem,
  When its inspection cannot be performed,
  Then it reports that it could not tell, and does not report that the subject is in order.
depends_on:
  - BO-3200e
doc_links:
