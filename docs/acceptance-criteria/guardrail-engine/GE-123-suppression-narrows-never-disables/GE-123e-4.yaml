  PROMISE 4 OF GE-123e (merge relief), and the mandatory regression "a merge bringing
  in headings that already have ids completes" (fifth arm).

  THE LINE, DRAWN EXPLICITLY AS THE L1 DEMANDS. When a commit concludes a merge, an
  id-less sign-off heading is judged only if its text, word for word, appears in
  NEITHER side's copy of that ticket file: not the branch being merged into, and not
  the incoming branch. A heading identical to either side's copy is not judged. A
  heading typed or altered during the resolution is. "Edited" means the heading
  line's text changed. This is the ordinary-commit rule (judge what the commit adds
  relative to its parent) applied to both parents of a merge.

  WHY BOTH SIDES AND NOT ONLY THE INCOMING SIDE (fourth arm, deliberate). The
  dispatcher framed the relief as "unchanged from the incoming branch". Scoping to
  the incoming side alone would newly judge the merging branch's OWN old id-less
  headings on every merge. Those headings are untouched and were not judged when
  they were committed (GE-123e-1, third arm). A long-lived branch carrying
  pre-epoch tickets would then be blocked from taking in main for content nobody
  wrote in the resolution. FLAGGED DIVERGENCE: the component's shared change-set
  source scopes a merge against the incoming side alone, on purpose, for checks that
  judge whole diffs (architecture doc, ADR-038 Decision §4). This check judges
  headings added, so the two-parent rule is the natural reading. The IT PO should
  confirm whether the shared source is reused with a heading-level comparison on
  top, or whether a documented exception is recorded.

  STANDING RULE HONOURED (GE-120e-3-ii). No arm skips the check because a merge is
  under way. Arms two and three run in the same verification as arm one, against the
  same repository, because the difference between them IS the criterion. A test that
  only asserts the carried-in merge completes passes on a check that is switched off
  for merges.

  SIXTH ARM IS UNASKED-FOR AND LOAD-BEARING. Without it, "relief for any heading that
  exists on any branch" satisfies arms one, four and five. The relief exists only
  while a merge is being concluded.

  FLAGGED, NOT DECIDED: revert and cherry-pick. GE-120e-4 (done) treats undoing or
  replaying a recorded change the same way as a merge through one general predicate,
  and forbids a merge-specific branch in the shared source. GE-123e promises merge
  relief only. If the implementation consumes the shared operation-record source, a
  conflicted cherry-pick or revert would inherit the same relief. That is consistent
  with the component's convention but not asked for by the L1. The person decides.

  MANIFEST CONSEQUENCE (for the IT PO). The check is registered today as inspecting
  only files the commit path hands it, yet it is given no file names. Comparing
  against each side of a merge means it works out its own change set. The
  component's manifest rule (GE-120e-2) then requires the self-derived declaration
  and the shared source.

  SET-UP NOTE. The id-less headings on each side are committed BEFORE the hook is
  installed, because once installed it refuses them. That is the honest way to
  produce pre-epoch or pre-check content in a scratch repository. It is not a
  simulation of a message.

  TEST-EVIDENCE RULE (for the IT PO; non-negotiable). Every scenario is verified
  through REAL git commit calls in a scratch repository with the hook installed:
  a real conflicted git merge, resolved in the working tree, concluded by a real
  commit with both an inline -m message and a message file passed the way the shared
  commit step passes it. Writing the merge record by hand, or setting the
  environment the check reads in place of a commit, is NOT evidence (FP-7).

  IT PO RESOLUTIONS (2026-11-16, gate decisions; binding through it_requirements).
    Decision 1, "either side": the flagged divergence above is settled. The shared
    change-set source is reused unchanged: it stays incoming-side-only for its
    other consumers, per ADR-038 §4. This check adds a heading-level comparison
    against the HEAD-side copy on top of it. That is recorded as a check-local
    exception to the effect of ADR-038 §4. It still needs writing into
    commit-guardian.md (GE-123e-5) and an ADR-038 amendment (adr-author). No record
    in this tree declares the ADR file yet.
    Decision 2, revert and cherry-pick: the flagged question above is settled. They
    get the same relief through the shared operation-record predicate as it stands,
    consistent with GE-120e-4. The test plan must include one real conflicted revert
    and one real conflicted cherry-pick.
    Decision 3: deleting a feedback-id line is out of scope (fence,
    KI-CG-20261116-removing-a-feedback-id-line-is-not-caught).
    Manifest: check-feedback-id becomes change_set_source: self_derived in this
    record. Its current handed_by_commit_path value was already inaccurate before
    GE-123e, because the script runs its own git diff --cached today.
    Wording note, criteria unchanged: the sixth arm's Because says the relief
    "belongs to the incoming side of a merge". Read it together with the fourth arm
    and decision 1: the relief covers both sides of an operation being concluded,
    and no heading outside one.

  BA AMENDMENT AT THE FINAL GATE (2026-11-16, person approved). The criteria now
    carry decision 2. Two scenarios were added before the negative control: a
    conflicted revert and a conflicted cherry-pick, each with a carried-in id-less
    heading that passes, and each with a resolution-added id-less heading that is
    refused while the carried-in one is not named. The revert's carried-in heading
    comes back because the revert undoes the commit that removed it; its incoming
    side is the reverted commit's parent, per the it_requirement. The negative
    control's Given now says no merge, revert or cherry-pick is in progress, and its
    Because was reworded to remove the contradiction the wording note above
    describes: the relief belongs to the operation being concluded and covers either
    side of it. The title names all three operations. The "FLAGGED, NOT DECIDED"
    paragraph above is kept as the record of the question; decision 2 answers it.
    FOR THE IT PO: the matching test_intent clause for the reworded Because was
    updated to the new text, with its needs_test and reason unchanged. The two new
    scenarios have no test_intent entries yet.

