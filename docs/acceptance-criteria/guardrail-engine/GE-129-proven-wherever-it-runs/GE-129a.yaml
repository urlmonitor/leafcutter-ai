it_requirements:
  - >-
    THE MECHANISM DECISION, SETTLED AT ENRICHMENT AS THIS RECORD'S doc_link ON GE-120f-1
    DEMANDS: ONE RUNNER, A SECOND POPULATION READER BEHIND IT. The session surface is served by
    GE-120f-1's runner through an additional population reader plus a surface adapter, and NOT
    by a second runner. Grounds, in order of weight. (a) ADR-045 §5 binds execution to
    unit_tests/portability/_deployed_check_harness.py with the second working copy built ONCE
    per sweep; two runners build it twice, and the sweep's cost is precisely the thing that gets
    quietly narrowed when it starts to hurt. (b) §7's independent-guard obligation attaches to
    each verifying surface, so a second runner is a second silent-failure mode to guard rather
    than a shared one. (c) The four-state vocabulary, the rollup, the unresolved verdict and the
    outcome propagation are all population-agnostic; duplicating them recreates exactly the
    two-populations-disagree hazard GE-120f-3's own it_requirements forbid. (d) The
    decomposition already isolates every part that genuinely differs behind three seams —
    subject enumeration (GE-129a-1), declaration home and binding (GE-129a-2), input
    presentation and verdict reading (GE-129a-3) — which is a population-reader-plus-adapter
    interface in all but name. The decision is also cheap to reverse late and expensive to
    reverse early: one runner with a pluggable reader can grow a second entry point, whereas two
    runners cannot be merged without re-cutting approved records.
  - >-
    THE CONSEQUENCE OF THAT DECISION, AND IT IS THE CLAUSE MOST LIKELY TO BE DROPPED IN SILENCE.
    GE-120f-3 owns "a run that put an input through none fails as UNRESOLVED rather than clean",
    and it is written ONCE. Because one runner serves both populations, that clause reaches this
    surface unchanged: it MUST NOT be re-authored anywhere beneath GE-129, and GE-120f-3 MUST
    NOT be amended, re-cut or widened — it is approved, nine tickets and ADR-045 cite its id,
    and the BA deliberately authored no duplicate. What the implementation owes instead is PROOF
    that the clause actually reaches here, which is a test and not a note: see the descriptor on
    GE-129a-1 that drives the session population to empty and asserts the run reaches
    GE-120f-3's unresolved verdict through the SAME code path rather than reporting a clean
    session sweep.
  - >-
    THE FIGURE IS STATED PER POPULATION, WHICH IS WHAT MAKES THE SHARED RUNNER SAFE. Sharing the
    runner must not fold session subjects into the figure GE-120f-3's criteria describe; doing
    so would change an approved record's observable behaviour without amending it, which is the
    other way this decision could go wrong. Each population states its own examined figure and
    reaches its own verdict; the run's overall outcome is the refusal of ANY population that
    reached no verdict. Inheriting the RULE is the point; merging the COUNTS is not.
  - >-
    ADR-045 §7 IS CARRIED HERE AS A CONSTRAINT AND DISCHARGED ON GE-129a-1. Everything beneath
    this record is a verifying surface, and §7's governing test — would this surface's silent
    failure be distinguishable from a clean report — is met here in the worst available way. The
    session reader's silent failure (settings.json absent from the deployed copy, a layout in
    which the walk-up resolves nowhere, an adapter that hands every subject an empty payload)
    produces zero findings, which is byte-for-byte what a healthy session surface with nothing
    to report produces. The independent guard is therefore MANDATORY, not advisory, and it must
    not route through the liveness run: see the §7 descriptor on GE-129a-1. No record beneath
    this one may discharge §7 by asserting something the liveness run itself told it.
  - >-
    DECLARATION HOME, SETTLED AT ENRICHMENT: A DECLARED SECTION IN THE GUARDRAIL ENGINE'S OWN
    CONFIG, NEVER templates/settings.json. GE-129a-2 leaves the home to this stage and names
    three candidates. It is NOT the entry object, for a reason stronger than the parser question
    the record poses: templates/settings.json is read by the editor's own settings parser, whose
    tolerance of an unknown key this project cannot test, cannot pin and does not control, and
    whose worst rejection mode is the whole file being refused — which unwires every session
    guard at once. Risking the guard surface in order to hold metadata about the guard surface
    is not an acceptable trade at any level of tolerance, so the parser fact does not need to be
    settled to settle the decision. It is also NOT a block inside the guard script: GE-129a-2's
    criteria require one declaration per ENTRY, a guard wired at two events needs two, and a
    per-script home structurally cannot hold two — the same collapse GE-129a-1 already rejected
    for script-path identity. What remains is a side-car keyed by the identity triple, and
    GE-129a-2 fixes which file and why.
  - >-
    AC_ENFORCE_STRICT=1 ON EVERY PYTEST INVOCATION SPECIFIED BENEATH THIS RECORD. Without it
    pytest_ac_enforcement xfail-masks every descriptor here — all of which cover a not-done AC
    on the day they are written — and the suite reads green while proving nothing, which is this
    tree's own subject committed by its own tooling.
  - >-
    ANYTHING THE RUN IMPORTS MUST BE ON THE BUILD DEPLOY PATH IN THE SAME CHANGE. Put the
    session population reader and the surface adapter INSIDE templates/scripts/commit_guardian/,
    which build_commit_guardian copies verbatim, so no scripts/build_phases.py deploy-map entry
    is needed. A helper placed outside that directory without a deploy-map entry raises
    ModuleNotFoundError in the deployed run while source-tree unit tests stay green — and here
    that failure surfaces as an EMPTY SESSION POPULATION, which is the §7 silent failure named
    above rather than a visible crash.
  - >-
    Error-handling policy applies to the reader's and adapter's filesystem, JSON and subprocess
    I/O: specific exception types, logged at WARNING or higher or re-raised, never swallowed. A
    swallowed settings-surface read error must never become an empty population or an absent
    subject — it is `blocked`, and it must reach the run's verdict as a refusal.
