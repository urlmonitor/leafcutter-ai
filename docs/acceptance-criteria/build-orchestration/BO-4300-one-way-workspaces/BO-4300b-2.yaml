it_requirements:
- Consumer layout (the maker deployed in a folder outside shop's version history) resolves shop by the
  BO-4300b-1 order, never from the maker's own location (F11, KI-ACD-004).
- 'LANDING ROOT (Q5, DECIDED user 2026-09-28): the landing place is ONE rule owned by the maker (templates/scripts/worktree_layout.py):
  landing root = <parent-of-project>/<project-dir-name>-worktrees/, where the project is the resolved main
  checkout (BO-4300b-1) -- never cwd, never the maker''s or any install''s location. Each workspace lands
  at <landing-root>/<kind>/<slug> for its canonical identity (Q4, BO-4300a-2). The same rule holds in the
  consumer layout and in the package''s own dev layout (leafcutter-ai -> <parent>/leafcutter-ai-worktrees/);
  layout is still reported as ''dev''|''consumer''. Nothing is created inside the project''s working tree
  and no ignore entry is written, so tools and tests that scan the project never see a clone.'
- 'LANDING-ROOT OVERRIDE (Q5): only an explicit --landing-root P argument overrides the rule -- never an
  environment variable, a config setting or a remembered value. The maker validates it before writing anything:
  it must resolve to an absolute folder outside the project''s working tree, not inside any existing workspace,
  not inside any other git repository, and creatable and writable; an invalid override is a usage error
  (status error, code USAGE, exit 64) naming the rule it breaks, and nothing is written. locate, list,
  verify and remove apply the same rule and accept the same override; a workspace made under an override
  is found only when the same override is given.'
- The landing rule is stable across requests and keeps projects apart (BO-4300b-2-i).
- shop's install inside the workspace is built from the workspace's own contents with shop's own derived
  config.
- Answers conform to the result contract delivered by BO-4300c-2 (one JSON object on stdout, status/code/exit
  mapping, workspace_path absent on every non-ok answer).
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
  build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
  minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
  must mutate the package and build its own copy says so and justifies it in its ticket.'
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_adopter_request_from_top_and_parent_folder_gives_same_location
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: An installed maker outside shop's history, run from shop's top folder and from its parent,
    answers ok with the same workspace_path both times.
- name: test_adopter_workspace_is_clone_of_shop_at_hub_main_with_own_install
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: The workspace is a clone of shop (origin = shop's hub), base_commit = shop's hub main tip,
    and shop's install files are regular files built inside it.
- name: test_adopter_location_is_stable_and_in_shops_landing_place
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: Repeated requests for alpha in shop return the same workspace_path, located in the one
    place set aside for shop's workspaces.
- name: test_workspace_lands_in_the_sibling_folder_named_after_the_project
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: The ok workspace_path is <shop's parent>/shop-worktrees/<kind>/alpha, and shop's working
    tree (git status --porcelain --ignored) is identical before and after -- no folder, file or ignore entry
    appears inside shop.
- name: test_dev_layout_lands_beside_the_package_repository
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: In a dev-layout fixture (package repository pkg as a child of a non-repo workspace folder
    holding the current install), the ok workspace_path is <workspace folder>/pkg-worktrees/<kind>/alpha,
    not <workspace folder>/worktrees/alpha and not inside pkg.
- name: test_valid_landing_root_override_is_used_and_needed_to_find_it_again
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: With --landing-root naming a valid empty folder outside shop, the workspace lands at <override>/<kind>/alpha;
    locate with the same override finds it, and locate without it answers NOT_FOUND.
- name: test_invalid_landing_root_override_is_refused_as_usage_writing_nothing
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: --landing-root inside shop's working tree, and --landing-root inside an existing workspace,
    each exit 64 with status error, code USAGE and a message naming the broken rule; no folder, lock, branch
    or marker is created anywhere.
- name: test_landing_place_is_not_taken_from_the_environment
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: With environment variables named like a landing-root setting pointing elsewhere, the workspace
    still lands at <shop's parent>/shop-worktrees/<kind>/alpha.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
