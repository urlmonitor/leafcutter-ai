# Affected-agent eval gate for leafcutter-ai (TQ-200b-2 / -b-3 / -b-4).
#
# STATUS: INFORMATIONAL, NOT A REQUIRED CHECK
#   Owner decision 2026-10-06 (TICKET-20261006-AgentEvalGateHonestAboutCredentials):
#   "Agent evals (affected)" is deliberately absent from the main ruleset's required
#   contexts, and no model credential is provisioned. A red result here reports; it
#   never blocks a merge. Read a failure by its step name: "Preflight — model
#   credentials" means nothing was evaluated; "Run evals for affected agents" means an
#   agent scored below its threshold.
#
# WHAT THIS CHECKS
#   On every PR to main this job re-scores ONLY the agent evals whose declared
#   trigger closure the PR touched (TQ-200b-3: an eval runs whenever any file in its
#   trigger globs changes), then checks that no triggered agent is left with a
#   missing or stale result (TQ-200b-4: missing/stale is a failure, never a skip).
#   Each agent's triggers are its OWN files — template, own schema, eval set, the
#   product-truth store paths it reads, the store entry scripts the harness runs, and
#   the shared harness (scripts/evals/agent_eval_config.json). A PR that touches none
#   of them affects no agent and fast-passes, saying that nothing was evaluated.
#
#   The affected/unaffected split is decided by scripts/evals/eval_selector.py. Both
#   the selection and the --check freshness pass diff against the PR base ref, so the
#   set is exactly "what this PR changed", computed deterministically.
#
# ── MODEL ACCESS ───────────────────────────────────────────────────────────────
#   (a) CREDENTIAL: the live eval needs Anthropic model access through a repository
#       secret named ANTHROPIC_API_KEY, exposed via the job `env:` block below. None
#       is configured (owner decision 2026-10-06: nothing is spent on models). When
#       agents ARE affected and the secret is empty, the "Preflight — model
#       credentials" step fails the job BEFORE any eval row runs, with an explicit
#       "no model credentials" error and no score. That is an infrastructure failure,
#       not a quality verdict: a run that cannot reach the model must never print a
#       number that looks like a measurement (KI-TQ-002, KI-TQ-20260907).
#
#   (b) MAKING IT BLOCKING (not done, by decision): add the secret, then add
#       "Agent evals (affected)" to the required status checks of the main ruleset.
#       Both are repository-settings changes a human with admin rights must make; a
#       workflow file cannot make itself required.
#
#   (c) BACKEND: run_agent_eval.py's choose_backend() uses the `claude` CLI unless
#       BOTH ANTHROPIC_API_KEY and LEAFCUTTER_EVAL_USE_API are set (the direct-API
#       path invoke_via_api is currently a documented stub in the harness). This
#       workflow therefore installs the `claude` CLI, which reads ANTHROPIC_API_KEY
#       for headless auth. If/when invoke_via_api is implemented, set
#       LEAFCUTTER_EVAL_USE_API=1 in the env block to switch to the direct-API
#       backend and drop the CLI install step. Both are harness/environment concerns
#       owned by scripts/evals/**; this file only supplies the credential and the CLI.

name: Agent Evals

on:
  pull_request:
    branches: [main]

# One in-flight run per PR; cancel superseded runs to save model spend.
concurrency:
  group: agent-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-evals:
    name: Agent evals (affected)
    runs-on: ubuntu-latest
    env:
      # Consumed by run_agent_eval.py (choose_backend), by the `claude` CLI for
      # headless auth, and by the credentials preflight. Empty when the repo secret
      # is absent — see header (a).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # Need history + the PR base ref to diff against (selector --diff-base).
          fetch-depth: 0

      - name: Fetch PR base ref
        # Ensure origin/<base> resolves for `--diff-base origin/${{ github.base_ref }}`
        # (mirrors the ci.yml typecheck job's base-fetch pattern).
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        # Pins jsonschema/pyyaml (harness runtime deps for artifact-mode scoring)
        # plus lint/type tooling.
        run: pip install -r requirements-dev.txt

      - name: Select affected agents
        id: select
        # TQ-200b-3: compute the affected set from the PR diff. Log affected AND
        # unaffected so nothing is silently truncated out of the run. With nothing
        # affected, every later model step is skipped and the job passes, saying so.
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          echo "Diffing affected agents against ${BASE} ..."
          python scripts/evals/eval_selector.py --diff-base "${BASE}" > /tmp/selection.json
          echo "--- selector output ---"
          cat /tmp/selection.json
          echo "-----------------------"
          AFFECTED="$(python -c "import json; print(' '.join(json.load(open('/tmp/selection.json')).get('affected', [])))")"
          UNAFFECTED="$(python -c "import json; print(' '.join(json.load(open('/tmp/selection.json')).get('unaffected', [])))")"
          echo "AFFECTED   (will run): ${AFFECTED:-<none>}"
          echo "UNAFFECTED (skipped as unaffected): ${UNAFFECTED:-<none>}"
          if [ -z "${AFFECTED}" ]; then
            echo "No affected agents — nothing was evaluated. Fast pass."
          fi
          echo "affected=${AFFECTED}" >> "${GITHUB_OUTPUT}"

      - name: Preflight — model credentials
        # Owner decision 2026-10-06: with no credential, fail HERE — before any eval
        # row runs — with an explicit infrastructure error and no score, instead of
        # letting every row fail and printing a threshold verdict.
        if: steps.select.outputs.affected != ''
        env:
          AFFECTED: ${{ steps.select.outputs.affected }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error title=Agent evals - no model credentials::No model credentials: the ANTHROPIC_API_KEY repository secret is not set, so no agent can be invoked. This is an infrastructure failure, not a quality result: no eval row was run and no score is reported. Affected agents: ${AFFECTED}. This check is informational (not required)."
            exit 1
          fi
          echo "Model credential present; evaluating: ${AFFECTED}"

      - name: Set up Node
        if: steps.select.outputs.affected != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI (live model backend)
        # run_agent_eval.py invokes the model through the headless `claude` CLI
        # (choose_backend() -> "cli"), authenticated by ANTHROPIC_API_KEY. See
        # header (c) for the direct-API alternative.
        if: steps.select.outputs.affected != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Run evals for affected agents
        # Run the LIVE per-agent eval for each affected agent; each run exits
        # non-zero when the agent's golden score drops below its threshold
        # (TQ-200b-2). Every affected agent runs; failures are collected and
        # surfaced together so one regression does not mask another.
        if: steps.select.outputs.affected != ''
        env:
          AFFECTED: ${{ steps.select.outputs.affected }}
        run: |
          set -euo pipefail
          FAILED=""
          for agent in ${AFFECTED}; do
            echo "::group::eval ${agent}"
            if python scripts/evals/run_agent_eval.py --agent "${agent}"; then
              echo "${agent}: PASS"
            else
              echo "${agent}: FAIL"
              FAILED="${FAILED} ${agent}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "Eval gate FAILED for:${FAILED}"
            exit 1
          fi
          echo "All affected agent evals passed their thresholds."

      - name: Enforce freshness — no missing/stale result for a triggering change
        # TQ-200b-4: a triggering change whose agent has a MISSING or STALE result
        # is a failure (selector --check exits 3), never a skip/implicit pass.
        # This runs after the per-agent evals so a fresh result written above is
        # visible to the check. Job success requires BOTH this AND the eval step.
        run: python scripts/evals/eval_selector.py --check --diff-base "origin/${{ github.base_ref }}"

      - name: Upload eval results
        # Always upload so a failed gate can be debugged from the run artifacts.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: scripts/evals/results/
          if-no-files-found: warn
