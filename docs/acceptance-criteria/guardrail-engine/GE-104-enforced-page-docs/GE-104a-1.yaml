it_requirements:
  - "Implement as a new pre-commit hook script at scripts/commit_guardian/check_frontend_page_docs.py, mirroring the structure of scripts/commit_guardian/check_components_integrity.py: read the previous-commit and staged versions of the tree via git, compute added = staged - before, check the derived doc path exists either staged or on disk, emit an actionable FIX message, and return exit 0/1."
  - "Detect newly-added pages by comparing the set of site/app/**/page.tsx paths present in the previous commit (git show HEAD:<path> / git ls-tree) against the staged index, so only pages absent before and present now are treated as new (mirrors the added-key diff pattern in check_components_integrity)."
  - "An edit to a pre-existing page.tsx (present in the previous commit) must NOT trigger a doc requirement — only newly-added pages are gated."
  - "Resolve the expected reference doc path using the single shared page-path-to-doc-path derivation helper defined for GE-104a-1-i / GE-104a-1-ii; this hook MUST NOT inline its own derivation logic so the commit-time and planning-time layers cannot drift on the mapping rule."
  - "Treat the doc as present if it is EITHER staged in the same commit OR already exists on disk; either is sufficient to allow the commit."
  - "The FIX message must name the exact expected reference doc path (docs/reference/frontend/<name>.md) the author must create, in the actionable FIX-line style used by check_components_integrity.py."
  - "Read the block-versus-warn mode from commit_guardian.json (key defined in GE-104a-1-iv): in block mode a missing doc exits non-zero; in warn-only mode the same FIX message is printed but the hook exits 0."
  - "Self-hosting parity (ADR-001): the deployed hook script and BOTH packaged template copies (templates/commit-guardian/check_frontend_page_docs.py and templates/scripts/commit_guardian/check_frontend_page_docs.py) must be created together and verified in parity via the build.py round-trip — never edit one side only."
  - "Handle git/IO errors gracefully per the project error handling policy; fail-open is acceptable for unexpected internal errors (exit 0) consistent with the judgment-hook convention, but a confirmed missing doc in block mode must block."
  - "Must complete in well under one second for a typical staged change set so it does not noticeably slow commits."
delivers_to:
