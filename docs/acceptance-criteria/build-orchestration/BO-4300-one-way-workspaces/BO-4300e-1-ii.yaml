priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
criteria: |
  Given a ready workspace for "alpha",
  When the workspace maker is asked to confirm it: once as the workspace for
    "alpha", once as the workspace for "beta", once naming a kind of work the
    maker does not know, once after the workspace has been switched onto the
    shared main line, and once while it holds an uncommitted change,
  Then the request for "alpha" is answered ready with its location,
  And the request for "beta" is refused as not that work's workspace, with no
    location,
  And the request naming an unknown kind is refused as a malformed request,
  And the request after the switch onto the shared main line is refused naming
    the part of readiness that no longer holds, with no location,
  And the request while it holds an uncommitted change is answered ready.
depends_on: [BO-4300e-1, BO-4300c-1]
