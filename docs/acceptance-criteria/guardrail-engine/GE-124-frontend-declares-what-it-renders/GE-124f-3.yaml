notes: |
  OUTCOME 3 of three. The selector falls out of the attribute mechanically, so
  it is identical to the id the test already names in its coverage tag — which
  makes the usual silent mismatch checkable: a test claiming one criterion while
  exercising another.

  The first scenario's second clause matters because pins are multi-valued. A
  selector built as an exact attribute match would silently fail on
  `data-ac="UXP-607-1 UXP-607"`, so the derived selector has to match on
  membership within the value, not equality of the whole value.

  THE HARD BOUNDARY: this AC checks that a test and an element AGREE about
  which criterion is under test. It says nothing about whether the test asserts
  anything. An existence-only test that locates the element and stops would pass
  this check and must still not count as covering the criterion — that is
  GE-124g-4, which guards this outcome directly.

  IT-PO NOTE (2026-08-25). The covers-tag convention already exists and is
  already shared between scripts/ac_store/done_proof.py and test_enforcement.py
  via a common regex. Front-end tests must use that same convention — inventing
  a second one would put this tree in the position GE-124c-2-i is written to
  fix, one namespace along.
