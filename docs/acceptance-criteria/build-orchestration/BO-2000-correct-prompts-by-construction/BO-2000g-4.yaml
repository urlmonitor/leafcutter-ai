notes: |
  This is the behavioural half of the KI. A lint can pass on text the real check still
  refuses. The python-coder example is the case in point: a real id placed on body
  line 3 is refused. Only a real commit against the real check proves that an agent
  which follows its template exactly is not refused.

  Pinned to the check as it is today: it accepts any non-blank value within two lines of
  a new heading. When INF-500d-3 lands a value-shape check, the "filled with the printed
  id" path keeps this record valid. A verbatim, unfilled placeholder would not. That is
  why placeholders are filled from the submission step's output and not committed as
  literal `<...>` text.

  Varying-population clause (house style, BP-1600a-2): a proof with a hardcoded list of
  N blocks satisfies a stated count. It does not satisfy "one more example means one
  more proven case".

  Memory notes for the implementer: the canonical check lives in the template tree, and
  the scripts-side copy is a symlink. The AC hooks read the git index, not argv, so a
  silent run is not a pass. BO-2000g-4-i is the negative control for both.
test_spec:
  - name: test_every_examined_example_commits_through_the_real_hook
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Marked shared_layout_reader. A scratch git repo is built under tmp_path with the deployed
      check_feedback_id.py and its deployed siblings copied from shared_reference_layout and installed so
      that git commit runs it as a pre-commit hook with the entry and args read from the layout's hook
      manifest. The ticket at tickets/00_inbox/TICKET-demo.md is committed first with its Comments section.
      For every example the BO-2000g-3 enumeration returns, the example is appended exactly as given,
      only placeholders filled (current local date and time, an agent name taken from repository data, a
      listed real-id placeholder filled from a real submit_feedback.py run, or the documented fallback
      when that run fails), staged and committed once. Every commit succeeds and exits 0.
    proves_clause: 'every commit succeeds with the feedback-id check having run and passed, with no bypass token in the commit message and the check not skipped'
    code_file: unit_tests/prompt_assembly/_bo_2000g_4_support.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_inf_500d_4_i_fresh_install.py
  - name: test_the_same_entry_without_its_feedback_id_line_is_refused_for_every_example
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      For every example the harness also commits the same filled entry with its feedback-id line removed
      and the commit must be refused with the heading in the hook output and HEAD unchanged. An example
      whose heading the hook does not recognise fails by file and heading line, naming in particular
      live-surface-tester (status: ok after BO-2000g-1) and the write-c4-diagram <agent-name> entry.
    proves_clause: 'every commit succeeds with the feedback-id check having run and passed, with no bypass token in the commit message and the check not skipped'
    code_file: unit_tests/prompt_assembly/_bo_2000g_4_support.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_inf_500d_4_i_fresh_install.py
    must_catch:
      - a harness whose hook is never installed so every commit passes
      - a scratch ticket placed outside tickets/ so the hook never inspects it
      - a heading the hook does not recognise, passing vacuously
      - SKIP=check-feedback-id left set in the environment
  - name: test_no_bypass_in_command_environment_or_history
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Every commit is made without --no-verify. The environment given to git has SKIP,
      PRE_COMMIT_ALLOW_NO_CONFIG, GIT_COMMIT_MSG and any hooks-path override removed, asserted on the
      env dict actually passed. After the run no commit message in the scratch history, the initial
      commit included, contains [NO-FEEDBACK-CHECK], and no repo-level core.hooksPath is set. COMMIT_EDITMSG
      is never hand-written.
    proves_clause: 'every commit succeeds with the feedback-id check having run and passed, with no bypass token in the commit message and the check not skipped'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - an initial commit message containing [NO-FEEDBACK-CHECK], which the hook reads from COMMIT_EDITMSG on later commits
      - a commit made with --no-verify
      - an environment that still carries SKIP or GIT_COMMIT_MSG
      - hand-written COMMIT_EDITMSG or GIT_COMMIT_MSG offered as evidence in place of git running the hook
  - name: test_committed_feedback_ids_are_template_text_or_submission_output_never_typed
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Each placeholder is filled with the stdout of a real run of the deployed submit_feedback.py from a
      copied layout, with a declared sink and a TMPDIR inside tmp_path (--phase the example's agent,
      --category complete). The proof records the source of every committed feedback-id value
      (template text, or run output) and asserts it by reading the committed ticket back. A refused
      writer takes the fallback path built from that run's own output as the signoff skill documents it.
      Concrete ids and (not-a-signoff) are committed exactly as written. Placeholder spellings come from
      the same reader as the lint.
    proves_clause: 'no feedback-id value in any committed entry was typed by hand: each one is the template''s literal text or the submission step''s printed output'
    code_file: unit_tests/prompt_assembly/_bo_2000g_4_support.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_inf_500d_4_i_fresh_install.py
    must_catch:
      - a placeholder filled with a made-up id such as fb_2026-01-01_00000000
      - a placeholder committed verbatim as literal angle-bracket text
      - a hand-typed (submit-failed) used when the submission run actually succeeded
      - a placeholder spelling list kept in the proof instead of read from the lint's reader
  - name: test_proven_count_equals_examined_minus_exempted_and_is_not_zero
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The proof calls the BO-2000g-3 enumeration in the same run and asserts the number of commits proven
      equals examined minus exempted and is above zero. A second case runs the proof over a tmp_path copy
      of the trees with one more conforming example added and sees one more proven case with no change to
      the proof. No list or count is held in the test.
    proves_clause: 'the number of examples proven equals the number of examples the lint examined and did not exempt, so adding one more conforming example to a template adds one more proven case with no change to the proof'
    code_file: unit_tests/prompt_assembly/_bo_2000g_4_support.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_inf_500d_4_i_fresh_install.py
    must_catch:
      - a proof with its own hard-coded list of blocks that matches today's count
      - a proof that skips exempted and unexempted examples inconsistently with the lint
      - a proof that passes with zero examples
  - name: test_proof_fails_rather_than_skips_when_layout_hook_or_submit_script_is_missing
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Against an empty or broken-symlink layout directory, a missing deployed check-feedback-id hook and a
      missing deployed scripts/feedback/submit_feedback.py, the harness raises a failure and never calls
      pytest.skip. It never spawns build.py and never writes into the shared layout.
    proves_clause: 'every commit succeeds with the feedback-id check having run and passed, with no bypass token in the commit message and the check not skipped'
    code_file: unit_tests/prompt_assembly/_bo_2000g_4_support.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_inf_500d_4_i_fresh_install.py
  - name: test_git_commit_runs_the_deployed_hook_through_the_manifest_entry
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: reachability
    description: >-
      Marked shared_layout_reader. A real git commit in the scratch repo with the deployed hook installed
      from the layout's check-feedback-id manifest entry (python run_hook.py check_feedback_id.py,
      pass_filenames false, pre-commit stage, files ^tickets/.*\.md$) is refused when a new heading has no
      feedback-id line and accepted when it has one. The hook is not called as a function.
    proves_clause: 'every commit succeeds with the feedback-id check having run and passed, with no bypass token in the commit message and the check not skipped'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
  - name: test_committed_entries_are_read_back_from_the_scratch_history
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      After the run, git show HEAD:tickets/00_inbox/TICKET-demo.md and git log in the scratch repo are read
      back. Each proven heading is present in exactly one commit, directly followed by its feedback-id
      line, and the sink written by the real submit_feedback.py runs in tmp_path holds the ids committed
      from run output.
    proves_clause: 'no feedback-id value in any committed entry was typed by hand: each one is the template''s literal text or the submission step''s printed output'
    code_file: unit_tests/prompt_assembly/_bo_2000g_4_support.py
    to_be_created: true
    convention_test_file: unit_tests/feedback/test_inf_500d_4_i_fresh_install.py
