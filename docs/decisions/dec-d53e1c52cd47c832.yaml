    title: Make the kernel the default entry for design, planning and lookup questions in Claude Code sessions
    description: A standing instruction or hook routes every design, planning, where-is and how-to-fix question in a Claude
      Code session through the kernel CLI first, with Claude Code acting as its host, so the kernel gains a real caller, records
      decisions and capability gaps from everyday work, and its failures surface as defects.
