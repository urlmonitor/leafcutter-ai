assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4300e-3
  contract: 'Up-front discard authorisation: the discard_token binding (workspace path and maker record,
    unsent shas, uncommitted files with content) and exact-match acceptance on remove --discard-token.'
package_surface: false
it_requirements:
- 'Q8 (DECIDED user 2026-09-28): the token authorises only the remove request for the workspace it was
  issued for, and only while that workspace''s unsent set is exactly the one it was issued for (BO-4300e-3);
  nothing is persisted between invocations, so there is no remembered authorisation to leak into the next
  request.'
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_authorisation_for_alpha_removes_alpha_only
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: alpha, requested with the token from its own refusal, is removed (ok, folder gone).
- name: test_token_for_alpha_cannot_clear_beta
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: beta, requested with alpha's token, is refused UNSENT_WORK with its own lists and a different
    fresh token, and beta's files, commits and marker are byte-identical before and after.
- name: test_beta_without_its_own_authorisation_is_refused_and_unchanged
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: beta, requested next without a token, is UNSENT_WORK and byte-identical.
- name: test_token_is_invalid_after_a_new_commit
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: gamma refused with token T; one more commit is made in gamma; remove with T is refused
    UNSENT_WORK listing both shas, and gamma is byte-identical.
- name: test_token_is_invalid_after_an_uncommitted_file_is_edited
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: gamma refused with token T; the already-listed uncommitted file's content is edited (same
    path set); remove with T is refused and gamma is unchanged.
- name: test_token_for_a_remade_workspace_at_the_same_path_is_invalid
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: delta refused with token T, then delta is removed with T; delta is re-made at the same path
    with equivalent uncommitted content; remove with the old T is refused and the new workspace is unchanged.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
