id: DK-300a-3
title: "Findings cite only the retrieved evidence, and options you named stay yours"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given 3 grounding evidence items retrieved for the question,
  And a goal that names options of its own, for example "... have agents consult the kernel for
    precedent, file human decisions made in Claude Code sessions, or run trace analyzers over the
    recent kernel traces",
  When Claude Code, as host, synthesizes findings and then proposes options and criteria,
  Then every finding the run accepts cites at least one of the 3 retrieved items and nothing else,
    and a finding that cites any other evidence id is not accepted,
  And each option named in the goal is checked against the goal text and kept as the caller's
    option (proposed_by caller_goal), listed alongside the host's own proposals
    (proposed_by host.generate_options),
  And an option presented as named in the goal whose words do not appear in the goal text is not
    kept as the caller's option.
depends_on:
  - DK-300a
