  constraints:
    - "The same-change adoption path must genuinely pass. The check evaluates the WORKING-TREE state of both sides (built parser plus collected invocations), not the committed state, so a capability and its caller landing in one change produce no finding. An implementation that compares the new capability against the previous commit's callers fails this AC and makes the guard unusable."
    - "The refusal must enumerate exactly the two ways forward from config_schema_fragment, and must not name a skip flag, --no-verify, or an environment variable. Printing the bypass at the moment of maximum frustration converts a blocking gate into an advisory one."
    - "Reuse BO-2900b-1's finding record and message path — this AC adds no new refusal cause and no second code path; it constrains the content of the existing one and asserts the passing case."
