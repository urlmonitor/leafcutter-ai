notes: |
  Measured at 9b16d013: 440 records carry `component: build-pipeline`, 65 carry
  `component: build_pipeline`. Only the 65 are reachable by the current trigger.
  239 records are `python-coder` in the kebab namespace and 215 of those carry no
  structured spec — the gate has never fired on a single one. The third scenario
  is the positive half of the same point: once the trigger is a declaration,
  `component` stops being consulted in either direction, so a package surface
  registered from a non-build namespace is covered for the first time.
