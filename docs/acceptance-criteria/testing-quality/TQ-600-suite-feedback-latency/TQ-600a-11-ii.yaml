notes: |
  THIS IS THE ACCEPTANCE CRITERION FOR TQ-600a-11, NOT A NICE-TO-HAVE. The parent
  substitutes a parser in 76 places including a required pull-request gate and the
  pre-commit path of every commit. The evidence currently in hand is "it did not
  raise", which is compatible with a value being resolved differently in a record
  nobody looks at until it matters.

  The four classes are the known-divergence set and they are not hypothetical:
  duplicate mapping keys, timestamp scalars, the ambiguous numeric literal forms of
  YAML 1.1, and merge keys are where the pure-Python and libyaml implementations have
  historically parted company. The store may well contain none of them, which is a
  fine outcome — but it has to be an observed outcome, reported, not an assumption.
