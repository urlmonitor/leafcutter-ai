id: ACS-1600b
title: "Nothing is marked finished because it looks like something that was"
component: ac-store
components:
  - ac_store
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  No tool awards a finished badge on the strength of a resemblance.

  Automation whose grounds are a likeness it computed may record what it found and
  must stop there. Judging that a piece of work is finished stays with the one
  place that holds that judgement to its own evidence. Where a tool can make that
  judgement from a likeness today, the ability is removed outright rather than
  narrowed to a higher confidence band — every band is a band of the same
  non-observation.
