change_target: code
risk_surface: internal
notes: |
  WHY SESSION-SCOPED AND NOT PER-TEST. A per-test check is more precise about
  blame and far more expensive, and it misses nothing this one catches: any
  fixture that writes the shared configuration leaves it written at session end.
  The blame precision is recovered by naming the fixture in the message.

  WHAT THIS AC DELIBERATELY DOES NOT OWN. The machinery for proving a
  green-on-arrival check could have failed lives in the TQ-500 family — 27
  records under TQ-500-checks-that-can-fail. This AC requires that proof and
  points at TQ-500a for its shape. It must not grow its own version.

  THE 81 COMMITS ARE THE BASELINE, NOT AN ANECDOTE. They are what makes this
  clause falsifiable today, and they are also why the fix has to be in the
  fixtures rather than in a one-time repair of the configuration: the value
  returns on the next run of the suite, from whichever worktree happens to run it.
