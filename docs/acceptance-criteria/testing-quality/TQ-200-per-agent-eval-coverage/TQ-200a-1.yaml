id: TQ-200a-1
components:
  - testing-quality
title: "Every in-scope agent has an eval set of {id, input, expected} rows"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of generative and judgment agents in the pipeline,
  When the eval coverage is assembled,
  Then each in-scope agent has exactly one eval set associated with it,
  And every eval set is a collection of rows where each row has an id, an input,
    and an expected outcome,
  And an agent that is in scope but has no eval set is reported as a coverage gap
    rather than passing silently.
