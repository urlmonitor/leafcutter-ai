    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_done_recording.py"
  constraints:
    - "MIXED SURFACE -- THE AGENT TEMPLATE IS PART OF THIS CHANGE AND IS NOT python-coder'S FILE TYPE. The declared surface spans .js drivers and a .py script (python-coder) AND templates/agents/status-checker.md, a prompt surface owned by llm-expert. The AC could not be split into siblings -- BO-400e is at its five-child cap -- so both surfaces must land inside this one work item: hand the agent template to llm-expert within the same ticket rather than letting a python-coder edit it or, worse, leaving it unedited. An unedited status-checker.md keeps the direct-edit instruction alive at the exact participant that performs the write."
    - "ONE WRITER, ENFORCED STRUCTURALLY -- BETTER WORDING IS NOT THE FIX. The criteria's instruction clause (the close names the checking mechanism and does not describe editing the recorded state directly) is real but it is the WEAKER half, and it is also the only clause a source-reading test can see. It must not be the whole implementation: a fix that is only prompt wording is reopened by the next prompt edit. The route that bypasses the check must be unavailable, not discouraged."
    - "THE LOAD-BEARING PROOF IS THE REFUSING-MECHANISM CASE. Make the checking mechanism refuse, drive the close, and assert nothing was written by any route. That single observation is the only one that distinguishes 'the second door is closed' from 'the second door exists and was not taken this time'. A test suite for this record that omits it proves nothing, however many other assertions it carries."
    - "THE BLANKET OVERRIDE IS NOT THE CONVERGENCE MECHANISM. A close that succeeds only because the override was passed does not satisfy this record. The override also switches off the allowed-transition rules, so it is not a surgical exception. Nor may a narrower override be introduced in its place -- that is the exclusion parameter BO-400e-1 forbids, wearing a different name."
    - "A REFUSED CLOSE MUST SURFACE AS NOT-CLOSED. When the mechanism refuses, the run must report that ticket as not closed rather than reporting success, retrying by another route, or continuing silently. A run whose report and whose store disagree is the phantom-done shape this whole family exists to remove."
    - "VERIFY BY EXECUTION, NEVER BY GREP. The completion code, the prompt and the parity check are all present in the source today; a structural test passes on the broken driver. Drive the real workflow through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert on the records the run wrote."
    - "BOTH TWINS IN ONE CHANGE. Here the twin clause is in the criteria itself: a one-sided landing produces a system in which the single-ticket driver closes through the door and the epic driver does not -- two doors again, one level up."
    - "TEMPLATES ARE BUILD SOURCES, NOT THE RUNNING ARTEFACT. Both the workflow drivers and the agent template are deployed by the build. Keep the deployed copies in step (check-build-drift is the gate) and confirm the single-door behaviour through the deployed layout before sign-off."
