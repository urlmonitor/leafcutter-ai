id: BO-2300a-1-ii
components:
  - build_orchestration
title: "The pause record is written and read by an agent chartered to run commands, so a pause never fails on a scope refusal"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given /plan-feature reaches an interactive gate with no human attached, so it must
    persist a pause record (write, then read back to verify),
  When it dispatches the pause-store write, the verify read, and the resume-side
    peek / read / clear / clear-verify steps, and the step that locates the
    worktree-setup script,
  Then each of those dispatches goes to the agent the registry marks as permitted to
    run repository/shell commands (worktree-agent, permits_shell: true),
  And none of them goes to status-checker, whose charter is ticket-state investigation
    and whose registry entry has permits_shell: false,
  And the symptom ("status-checker refuses the pause-store write as outside its role,
    so the run ends pause_persist_failed and cannot be resumed") must not occur.
depends_on: [BO-2300a-1]
assigned_agent: python-coder
estimated_complexity: S
