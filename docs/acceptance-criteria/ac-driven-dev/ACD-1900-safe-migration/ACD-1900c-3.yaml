assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: ACD-1900a-2
  contract: "schema_version on each record so the enforce-enable precondition can count remaining schema_version < 2 records and name them."
it_requirements:
  - "Canonical source: the enforce-enable path that reads config/guardrail_gates.yaml and scans the store (scripts/ac_store/). Setting ac_unit_of_work.enforce = true MUST be refused while any schema_version < 2 record remains; the refusal must name the remaining v1 records."
  - "The precondition must be data-driven from the store's schema_version distribution (an empty set of v1 records), never a hard-coded record name or count -- new records inherit the rule automatically."
  - "When zero schema_version < 2 records remain, enabling enforce is accepted. This mirrors the schema-side guard ACD-1900a-3-i but governs the flag rather than additionalProperties."
  - "Test must EXECUTE the enforce-enable path against a store with v1 records (expect refusal naming them) and an all-v2 store (expect acceptance) -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_enforce_true_refused_while_v1_present_names_records
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Setting enforce=true while >=1 schema_version < 2 record remains is refused with an error naming the remaining v1 records."
  - name: test_enforce_true_accepted_when_all_v2
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Setting enforce=true when zero schema_version < 2 records remain is accepted."
