title: "The platform only auto-builds what fits the plan"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Roadmap alignment and volume limits keep the self-improvement loop from drifting.

  Before the platform turns feedback into new feature work on its own, it checks
  that the work fits the current roadmap -- off-roadmap items are parked for a
  human instead of built. A cap limits how much it creates automatically, and it
  never auto-commits on protected branches. The loop stays inside guardrails you
  control, so it can run continuously without quietly expanding scope.
