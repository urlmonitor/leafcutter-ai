criteria: |
  Given the grouping behaviours DK-300b-1 to DK-300b-4,
  When a reader opens the grouping reference,
  Then it lists the fields of a grouping suggestion (the placed category or "none", preferred wording, other wordings, broader category, reason),
  And it states the four settled rules: cheapest placement first, precision over recall, in-run grouping within the run's Jev budget and free on an empty library, and every grouping a suggestion a person accepts, changes or undoes,
  And it states the invariants: no label in two live categories, broader never loops and never names a retired category,
  And it defines precision, recall and the share left at "none" for a labelled set and an acceptance setting,
  And it marks the grouping method as pending the decision of kernel run run-b5af8c7fae2248ba, without describing any method as chosen.
