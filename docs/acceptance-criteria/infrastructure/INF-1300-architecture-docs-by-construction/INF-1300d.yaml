criteria: |
  A refusal you can act on -- never a quietly wrong document.

  If what was asked for cannot be produced correctly, you are told what was wrong
  with the request and what to supply instead, and nothing is written. You are
  never left holding something that looks right and is not, and never left with
  no document and no explanation.
