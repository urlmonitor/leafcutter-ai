title: "Any non-positive probe outcome halts every gate; only an all-pass result proceeds"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700b.yaml"
criteria: |
  Given a gate invokes the probe and the probe raises an uncaught exception, OR
    exits with any non-zero code, OR does not complete within its time limit,
  When the gate evaluates the outcome,
  Then the gate treats the outcome as FAIL, halts the operation it guards, and
    surfaces the raw error text (exception message, non-zero exit output, or
    timeout notice) in its own failure message.
  And the ONLY outcome that allows the guarded operation to proceed is a probe
    result with exit code 0 and an empty `failing_checks` list.
  And there is no branch in which an indeterminate, errored, or timed-out probe
    outcome allows the operation to proceed.
depends_on: [BO-1700b]
