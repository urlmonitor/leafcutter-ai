notes: |
  CHILD CAP — THIS L1 IS NOW FULL AS OF 2026-08-18. The default cap is 5 L2s per L1
  (_MAX_L2_PER_L1 = 5 in templates/scripts/commit_guardian/check_ac_limits.py:82,
  enforced as child_count > limit, so exactly five passes). This AC declares no
  child_limit_override. All five slots are taken: BP-1100a-1 and BP-1100a-2 (enforcement
  points that flag a documentation-only surface), BP-1100a-3 and BP-1100a-4 (the derivation
  itself — what the generated surface must contain, and what it must not), and BP-1100a-5
  (the authoring guidance the previous two make stale). A sixth L2 here will be blocked:
  the next author must split the tree (see the ac-tree-split skill) or place the work under
  a different L1, and must NOT reach for child_limit_override, which the hook itself
  describes as a temporary waiver. Note that BP-1100 is also full at seven L1s
  (_MAX_L1_PER_L0 = 7), so a new sibling L1 is not an escape route either. L3 refinements
  are not capped.

  THE THREE GROUPS ARE DELIBERATELY SPLIT. BP-1100a-1/-2 catch a ticket whose surface is
  already wrong; BP-1100a-3/-4 stop the wrong surface being derived in the first place;
  BP-1100a-5 keeps the page an author reads honest about what the derivation does. All are
  wanted — a ticket authored by hand still needs the lens — but they are different
  enforcement layers and must not be collapsed.
