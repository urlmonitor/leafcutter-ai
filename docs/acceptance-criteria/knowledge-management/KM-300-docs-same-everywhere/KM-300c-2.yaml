created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300c.yaml"
criteria: |
  Given the version of the documentation map about to be committed contains an
    entry whose link target, resolved from the folder containing the map, names
    a file that does not exist in the commit — e.g. target
    "docs/architecture/adrs/ADR-001-self-hosting-boundary.md" written inside
    the docs folder (resolving to docs/docs/...), or a target for a page that
    was deleted in the same commit
  When the contributor commits
  Then the commit is refused
  And the refusal message names the map, the line number of each unresolvable
    entry, the link target as written, and the path it resolved to
  And the message tells the contributor how to regenerate the map
  And when every entry's link target resolves to a file that exists in the
    commit, the commit is not refused by this check
  And the check reaches the same verdict on Windows, Linux and macOS for the
    same commit contents (a target differing from the real file only in letter
    case is refused on every host, because it opens nothing on a case-sensitive
    host or code host)
