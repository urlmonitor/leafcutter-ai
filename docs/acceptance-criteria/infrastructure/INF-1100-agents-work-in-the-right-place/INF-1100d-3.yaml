notes: |
  USER DECISION Q3: "a missing connection is reported, never guessed". Safety
  surface: the shipped address named a database LIVE, so a guess can point
  tests at a real database.

  W2 is the control: without it, an agent that reports the missing setting on
  every run passes W1 and trains users to ignore the message.

  MOSTLY PROMPT. The agent conduct is instruction text; an eval over W1/W2 can
  judge the hand-offs. The "stops with a message rather than passing" clause is
  deterministic if the DB test pattern reads the setting at run time — IT-PO
  may split it out as a python-coder L3 if the pattern gains a helper.

  IT-PO ENRICHMENT (2026-09-25)
  SPLIT RECOMMENDED (not performed; readiness left draft pending the decision). Criteria:
    - INF-1100d-3a (llm-expert, prompt): the hand-off / reporting / W2 clauses.
    - INF-1100d-3b (python-coder, code): "a database test for W1, if one exists and is run
      without the setting, stops with a message naming the missing setting rather than
      passing". A shipped resolver (the same module as INF-1100d-3-i's checker, so there is
      one reader of the setting) raises naming testing_context.db_connection_test when the
      setting is unset or blank, and the DB test pattern calls it. Testable by running a
      generated-shape DB test with the setting unset and asserting it errors, naming the
      setting.

  SPLIT PERFORMED (user-approved at the IT-PO gate). The clause "a database test
  run without the setting stops with a message naming the missing setting" moved
  to INF-1100d-3-ii (python-coder, L3). This AC keeps the prompt behaviour: the
  hand-off wording and W1/W2. The split was made as an L3 rather than a sixth
  L2 because the moved clause is a technical constraint of this AC's behaviour,
  not a separate user-facing behaviour. It mirrors INF-1100d-3-i (also split out
  of this AC as a python-coder L3 over the same setting), and it leaves the PO's
  L1 at the default cap with no override. The test_rationale above still
  describes the pre-split recommendation; the deterministic clause now carries
  its own test contract in INF-1100d-3-ii.

  IT-PO PASS 2 (2026-09-25): test_rationale refreshed for the post-split state (the
  pre-split wording above is superseded); readiness -> reviewed.
