notes: |
  WHY THIS AC EXISTS. Decision Kernel run run-92227a2a275f44ff (2026-10-11),
  on a basis the user approved, settled a conflict in TQ-500g-1-iv. The new
  test-breaker agent (the preparer) was meant to have the tools Read and
  Write and no shell. But the agent registry validator refuses any agent
  holding Write unless it carries the post-edit git-diff verification step,
  and that step needs a shell. The chosen option: test-breaker becomes
  READ-ONLY (tools: Read). For each named wrong version it RETURNS exact-match
  replacement pairs per file (old text, new text), or "could not be
  prepared" with a one-line reason. A deterministic writer step, which is
  code and not an agent, turns that reply into the alterations manifest the
  shared runner (TQ-500g-1-i) consumes. It validates the reply, applies the
  replacements to copies of the code as written, keeps the copies outside the
  working tree, computes the real unified diff, and writes the manifest.

  THIS REPLACES THE AGENT WRITING THE MANIFEST ITSELF. Until this decision,
  TQ-500g-1-iv's delivers_to and constraints had the agent write the altered
  copies under copies_dir and then the manifest. The IT-PO amends
  TQ-500g-1-iv to the read-only reply. Its criteria stay about what each
  alteration must be; this AC is the writer. The manifest contract itself is
  unchanged; only its author changes.

  DETERMINISTIC, TESTED STEP. Unlike TQ-500g-1-iv (prompt-only), every
  clause here can be proven without an LLM: a hand-written reply fixture, a
  temp git repo holding refresh_config.py and tests/test_refresh_config.py,
  then assertions on the manifest's entries, on the altered copy byte for
  byte, and on the working tree being unchanged. The technical fields
  (assigned_agent, it_requirements, test_spec, delivers_to, expects_from,
  estimated_complexity, change_target, risk_surface) are left to the IT-PO.

  declares_side_effect: true is the value the schema check derives from the
  Then clause (the manifest is written to disk); it is not a separate choice.

  WHAT THIS STEP DOES NOT JUDGE. Whether an alteration changes anything or
  still loads is the runner's call (TQ-500g-1-ii). An alteration whose new
  text equals its old text is written as prepared, and the runner reports it
  as not applied. What "a test file" means is the runner's existing rule (no
  wrong version ever alters a test file, TQ-500g-1-i), not a second rule.
  The refusal concerns where a replacement is AIMED. The writer's own copies
  and manifest live under the worktree's git directory by design
  (TQ-500g-1-i), which is not a contradiction.

  CLAUSES THE BA ADDED BEYOND THE BRIEF, with reasons.
    - All or nothing per name (R4). A name with one refused replacement gets
      no altered copy at all. A partial copy would run a different wrong
      version from the one named.
    - Names the work did not owe are not written ("invert refresh_due").
      Wrong versions the agent proposes itself are Phase C, still deferred
      in TQ-500g's notes. The owed set comes from the test entries, never
      from the reply.
    - A stale manifest is not left to be read. If an earlier preparation of
      the same work left a manifest and this reply is unreadable, the runner
      would otherwise judge old alterations, possibly of older code.

  OPEN POINTS FOR THE IT-PO (the BA did not decide these):
    1. Name matching. The criteria pin that owed names appear verbatim. BA
       assumption: a reply name is matched to an owed name exactly. A reply
       that changes case or spacing counts as an unowed name, and the owed
       name gets "no alteration returned". Confirm, or allow the alias
       rule's trim-and-case-fold.
    2. A name answered twice. "Exactly once" forbids two entries. BA
       recommendation, in line with "never guessed": "could not be prepared:
       more than one alteration returned", never picking one.
    3. Several replacements in one file. Each old text must occur exactly
       once in the code as written. Decide whether overlapping replacements
       are refused and whether they are applied against the original or in
       sequence.
    4. Line endings. On a Windows checkout the code as written may have CRLF
       line endings while the preparer's old text, read through the Read
       tool, has LF. Decide whether matching normalises line endings. The
       criteria pin only that everything outside the replaced text stays
       byte-for-byte as written.
    5. Non-test files out of scope. A replacement in a non-test source file
       inside the repository that was not among the files passed to the
       preparer is not refused by these criteria. Decide whether to refuse it.
    6. An unreadable reply. The step stops with a named error and writes no
       manifest. Whether the route then halts, or calls the runner (which
       reports every owed name unfinished because no manifest exists), is
       route wiring (TQ-500g-1-v, -vi, -vii). Either way the work never reads
       as owing nothing.

  IT-PO ENRICHMENT (2026-10-11)
  python-coder, fast lane. Depends on TQ-500g-1-i (merged in #1044) and can
  be built alongside TQ-500g-1-iv, using hand-written reply fixtures. The
  BA's open points, decided (details in it_requirements):
    1. Name matching: exact (BA assumption confirmed). Trim-and-case-fold
       stays only for the two aliases.
    2. A name answered twice: could_not_prepare "more than one alteration
       returned"; one is never picked.
    3. Several replacements in one file: applied in sequence, each old
       unique when it is applied, so the sequence settles overlaps. All or
       nothing per name. Names never build on each other.
    4. Line endings: a uniformly CRLF file is matched in LF form and written
       back with CRLF. Every other file is matched raw. Copies are written
       as bytes.
    5. Non-test files outside the dispatched list: NOT refused (open for the
       user, below).
    6. Unreadable reply: the writer stops with a named error and leaves no
       manifest; stale ones are removed first. Whether the route then halts
       or still calls the runner is route wiring.
  PLACEMENT: a public sibling CLI, wrong_version_writer.py, not a subcommand
  of the runner. Owed names are derived through the runner's declared-scope
  reader, never passed in and never taken from the reply.

  OPEN, WHO BUILDS THE DISPATCH LIST. The routes must hand test-breaker the
  owed names with their in-scope files, and no AC yet names the code that
  computes that list. Recommendation: one shared Python entry using the same
  scope reader (for example a list mode on this writer's CLI), so no route
  parses the AC store in JS. That needs a criteria amendment or a new AC; it
  is not added here.
  OPEN, HOW THE REPLY REACHES THE WRITER. test-breaker cannot write its reply
  to a file, so the route must persist it or pipe it. The CLI accepts
  --reply <path> and --reply - (stdin). The transport is route wiring for
  TQ-500g-1-v, -vi and -vii.
  OPEN, OUT-OF-LIST FILES (open point 5). Refusing them would add a second
  scope input to the writer. Recommendation: accept them for now, and revisit
  if a real preparation aims outside the list.

  USER DECISIONS AT THE REVIEW GATE (2026-10-14). Both OPEN items above on
  the dispatch list and on out-of-list files are settled; the criteria are
  amended (amended_by, 2026-10-14).
    1. Owed list (user decision at the review gate, 2026-10-14). The writer
       CLI gains a list step. Given the requirement ids, it reports the owed
       wrong-version names and, for each, the source files in scope for it.
       It uses the same reading of the test entries that the runner uses, so
       the route, the writer and the runner can never disagree about what is
       owed. The route sends that list to the preparer. Pinned in the second
       scenario of the criteria: every owed name exactly once, verbatim, with
       its in-scope files; the fix-undone aliases not listed; tests' own
       files never listed as in scope; an id with no declared wrong version
       lists nothing for it.
    2. Out-of-scope refusal (user decision at the review gate, 2026-10-14).
       The writer refuses a replacement in any file that was not in scope
       for that name in the list, even an ordinary non-test source file
       inside the repository. It is refused the same way as a test file:
       "could not be prepared", a reason naming the file and saying it was
       not in scope, and no altered copy for that name at all. Pinned as
       reply case R9 beside R4-R6. This reverses open point 5 and the
       IT-PO's "accept them for now" recommendation.
  BA FOLLOW-UPS FOR THE IT-PO PASS. The first scenario now owes nine names,
  not eight. The it_requirements entry "Non-test files outside the
  dispatched in-scope list ... are NOT refused here" now contradicts the
  criteria and needs rewriting. BA recommendation: the writer takes the
  in-scope files per name from the same reading the list step uses, not from
  the route, so a route bug cannot widen them. The test_spec entries and test_rationale still
  say "eight names" and have no entry for R9 or the list step. The list
  step's output shape, and the route's use of it (TQ-500g-1-v, -vi, -vii),
  belong in delivers_to. The sentence "the route sends this list to the
  preparer unchanged" is route wiring the routes' ACs implement; it is kept
  here because the user asked for it, and the IT-PO may move its test to the
  route ACs.

  IT-PO PASS (2026-10-14), after the review gate.
  APPROVAL. The user approved this AC, together with the TQ-500g-1-iv
  redesign (read-only test-breaker plus this writer), at the review gate on
  2026-10-14. readiness is set to approved on that decision.
  WHAT CHANGED (criteria untouched):
    - The writer CLI has two steps, list and write. list prints
      {owed: [{name, files}], error}; write keeps the earlier JSON.
    - Per-name scope. The test_spec item schema had no field that puts a
      file in scope for a wrong version (additionalProperties false; the
      AC-level declared_files is per AC, not per name). This AC adds the
      optional field in_scope_files to the test_spec item. A name's
      in-scope files are the union over the entries naming it, minus test
      files. A name with none has files [], so every replacement for it is
      refused (fail closed). The schema change, its reference-doc line and
      its validator test are part of this AC's work. If the user prefers a
      separate AC for the schema field, split it out before the build and
      make this AC depend on it.
    - The list, the write step and the runner share one reading: the
      runner's declared-scope reader, extended in place. The write step
      never takes scope from the route or the reply.
    - The out-of-scope refusal (R9) reverses the earlier "accept for now"
      entry.
    - Route wiring ("the route sends this list unchanged") is tested by
      TQ-500g-1-v, -vi and -vii, not here.
  FOLLOW-UP FOR THE ROUTE ACS. TQ-500g-1-v, -vi and -vii must run the list
  step before dispatching test-breaker and pass its owed array unchanged as
  wrong_versions. Their own fields do not name the writer yet; their next
  IT-PO pass adds the matching expects_from.
  FOLLOW-UP FOR EXISTING must_catch ENTRIES. Entries authored before
  in_scope_files existed list their names with files []. Until the entries
  are backfilled, the preparer can prepare nothing for those names, and the
  runner reports them as unfinished. That is the fail-closed outcome, never
  a silent pass.
