notes: |
  ADD-VS-CREATE — a NEW sibling L0 was chosen over grafting onto GE-118a.
    - Triage suggested GE-118a as the parent. Rejected: GE-118a is an L1 whose
      SUBJECT is one check ("check-secrets resolves its scanner scripts dir"),
      and its only child GE-118a-1 is already done. Hanging a cross-cutting
      policy (18 checks), a failure-mode rule, and a verification mechanism
      under a single-check L1 inverts containment — the general rule would sit
      beneath the specific instance — and it would reopen an effectively
      complete node, muddying done-accounting.
    - GE-118's L0 was also considered as the parent and rejected as too narrow
      in the OTHER direction: its stated scope is dependency RESOLUTION from the
      deployed layout ("hooks find their helpers"). Two of the benefits here are
      not resolution problems at all — a check can also degrade quietly because
      of a parse error, a missing config, or an unbuilt workspace. GE-118 =
      the two point fixes that landed (GE-118a-1, GE-118b, both done);
      GE-120 = the class of defect they are instances of. GE-118 is NOT amended
      or superseded by this tree; it stays as the record of shipped work.
    - No other L0 owns this. GE-111 is traceability surviving refactors,
      GE-113 is misplaced artifacts, GE-116 is self-contradictory settings,
      BO-600 is gate routing. None of them promises "green means checked".

  STANDING-RULE CONTRADICTION — resolve at L2, do not let the BA flatten it.
    This project has an explicit, DELIBERATE fail-open convention: a guard that
    hits an internal error (crash, parse failure, git failure) exits 0 with a
    stderr warning so a script bug never hard-blocks an unrelated commit. It is
    written into the ac-store PROJECT_CONTEXT ("blocking vs fail-open"), into
    the ac-schema reference, and is an approved AC in its own right
    (GE-116a-1-iii, "Unparseable agent definition fails open and does not block
    the commit"). This goal does NOT repeal that convention and must not be
    decomposed as "never fail open".
    The distinction it draws is narrower and sharper: fail-open on ONE bad input
    while the check still ran is fine; reporting SUCCESS when the check never
    ran at all is not. The unit of the rule is visibility, not blocking — a
    degraded run must be distinguishable from a clean run by whoever reads the
    output. Whether "cannot run at all" should also BLOCK (vs. only announce
    loudly) is a per-check decision the BA/IT-PO must make explicitly, not a
    blanket default.

  EVIDENCE (state the confidence levels as recorded — do not upgrade them).
