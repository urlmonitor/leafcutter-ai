assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "The report-state descriptions must be written from the classification as IMPLEMENTED by ACS-1200b-2, ACS-1200c-4-i and ACS-1200d-1-i — four states: orphan, parked, approved-with-nothing-under-it, un-parked-but-not-decomposed. A how-to describing states the scan does not emit is the same reference-versus-enforcement drift ACS-1200a-3 exists to close, one document over."
  - "The removal clause targets INSTRUCTIONAL text only. Sweep docs/how-to/ and docs/reference/ for text telling a reader to set SKIP=check-ac-parent-covered-by (or any equivalent bypass) in order to record an idea, and remove it rather than leaving it beside the new procedure."
  - "EXPLICIT NON-TARGET: docs/acceptance-criteria/ac-store/PROJECT_CONTEXT.md records at line 156 that the KM-200 commit 'only landed with SKIP=check-ac-parent-covered-by'. That is a PO-authored factual account of the defect this goal fixes, not an instruction to anyone. It must not be edited by this AC — deleting the evidence for the goal while implementing the goal is a real risk of a broad grep-and-remove pass."
  - "The two procedures must link to docs/reference/ac-schema.md for the field definitions rather than restating types and validity rules, so the two documents cannot drift apart. Verify the link target exists at commit time."
  - "Standard doc conventions apply: the check-doc-frontmatter hook validates frontmatter on staged docs, and it is known to false-fail on path resolution when committing from a worktree — that is a known hook quirk, not a reason to alter the document."
