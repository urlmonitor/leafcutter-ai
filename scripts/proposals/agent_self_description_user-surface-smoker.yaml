agent_id: user-surface-smoker
template_file: templates/agents/user-surface-smoker.md
proposed_frontmatter:
  pre_flight_reads:
  - source: ticket_path
    required: true
  inputs:
  - name: ticket_path
    type: file_path
    required: true
    description: Absolute path to the ticket markdown file
  outputs:
  - name: sign_off_comment
    type: sign_off_comment
    description: 'Sign-off comment with status: ok | blocker | handoff'
  mutates:
  - name: ticket_frontmatter_agents_status
    surface: ticket frontmatter
    description: Sets agents.user-surface-smoker to signed_off or failed
  - name: sign_offs_checklist
    surface: ticket body sign-offs section
    description: Checks the user-surface-smoker checkbox with timestamp
  behavioral_patterns:
  - name: Stop-and-Ask
    trigger: condition requiring user decision or out-of-scope action
    behavior: Do not proceed.
    related_agent: null
  - name: Conditional Behavior
    trigger: there are uncommitted staged changes
    behavior: 'emit `(status: blocker)` with explanation: "Pre-smoke worktree has
      staged'
    related_agent: null
  - name: Conditional Behavior
    trigger: 'NO match → emit `(status: blocker)`'
    behavior: 'reason: "assertion regex did not'
    related_agent: null
proposed_registry:
  category: testing
  skills_invoked: []
  knowledge_channels:
  - channel: 1
    source: template description field
  - channel: 3
    source: ticket_path from ticket-supervisor
  - channel: 6
    source: project files read during execution
  - channel: 7
    source: bash command output (git, build, tests)
  - channel: 9
    source: agent memory store
