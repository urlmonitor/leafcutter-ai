it_requirements:
  - "REMOVE, DO NOT NARROW: remove every message source the check reads for the token. That is the --commit-msg-file argument, the GIT_COMMIT_MSG and COMMIT_EDITMSG environment variables, and the COMMIT_EDITMSG file in the git directory. Do not introduce a replacement source that could carry a token (git log, MERGE_MSG, SQUASH_MSG, a prepare-commit-msg or commit-msg stage). An argument kept only for backward compatibility must not influence the verdict and must not turn into a refusal or a skip."
  - "Remove the skip branch and its output line ('skipped via [NO-FEEDBACK-CHECK] escape hatch'). Update the module docstring, the CLI help text and the DECISION HISTORY so that no surface of the check describes a bypass. The help text and the refusal advertise it today."
  - "REGRESSION LOCK TO RETIRE, IN THE SAME CHANGE: tests/test_check_feedback_id.py exists only to assert the skip. It hand-writes COMMIT_EDITMSG into a fake git directory around its lines 92-161, sets the two environment variables, and imports _should_skip from the scripts/ build output. Delete it, or replace it with real-commit tests that assert the inverse, in the same change as the code. Leaving it next to the new tests is a defect, because one of the two is then wrong. The module cannot survive unchanged anyway: the symbol it imports is removed."
  - "ENVIRONMENT ARMS: each is a real commit by file run with GIT_COMMIT_MSG (respectively COMMIT_EDITMSG) set in that commit's own environment, and each asserts that commit's outcome. Setting either variable without making a commit is not evidence for any arm (notes, FP-7)."
  - "FENCE: this change does not touch the structural-change token [NO-ARCH-UPDATE] on other checks (GE-113b-*; its own stale-message defect is KI-CG-20261116-arch-bypass-token-reads-the-previous-commit-message), the commit framework's per-hook SKIP setting, or the shared commit step's handling of a skip request."
  - "HOUSEKEEPING for the implementing change (not a declared file of this record): KI-CG-20260901-feedback-id-escape-hatch-reads-the-previous-commit-message moves to resolved in the commit-guardian known-issues register and cites this record."
  - "CANONICAL SOURCE: templates/scripts/commit_guardian/check_feedback_id.py (ADR-001). The deployed copies are build outputs. Show parity with a build.py round-trip."
  - "TEST EVIDENCE (binding): real git commits in a scratch repository with the hook installed, one per route. The routes are inline -m with the token in the subject, inline -m with the token in the body, a commit by file with the shared commit step's git arguments (commit -q --cleanup=verbatim -F <file>), the shared commit step itself, and the two environment arms. The 'same refusal' clause compares each route's refusal text with the plain-message refusal taken from the same starting state. Expected test home: unit_tests/commit_guardian/, reusing GE-123e-1's harness."
test_intent:
  - clause: every one of the six commits is refused and the branch tip is unchanged after each attempt
    needs_test: true
    reason: Each route is a distinct message source the check used to read, and only a real commit per route, not a variable set without a commit, proves that none of them still switches the check off.
  - clause: each refusal is the same refusal the same change receives when committed with the plain inline message "Add sign-off"
    needs_test: true
    reason: A message-dependent branch that still changes the refusal shows up only as a text difference from the plain-message refusal.
  - clause: no output of any of the six attempts says that the check was skipped
    needs_test: true
    reason: The skip line is the observable trace of the old bypass, so its absence on every route is executable evidence that the bypass is gone.
  - clause: 'the commit succeeds, Because the token is now ordinary text: it neither excuses a missing id nor causes a present one to be refused'
    needs_test: true
    reason: This negative control fails an implementation that refuses any message carrying the token.
test_spec:
  - name: test_ge_123e_2_six_token_routes_all_refused_tip_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Parametrised over the six routes, each a real git commit from the same starting state with the deployed hook installed: token in inline subject; token in inline body; message file by commit -q --cleanup=verbatim -F; commit_changes.py with that file; the same -F commit with GIT_COMMIT_MSG naming the file in that commit's own environment; the same with a COMMIT_EDITMSG variable. Every attempt exits non-zero and HEAD is unchanged. RED today for the two environment arms (the check reads both variables and skips); the first four are already refused today because the check reads a stale file."
    proves_clause: 'every one of the six commits is refused and the branch tip is unchanged after each attempt'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
  - name: test_ge_123e_2_no_message_source_still_switches_check_off
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "One real commit per message source the check used to read: the --commit-msg-file argument (hook wrapper passes it), GIT_COMMIT_MSG naming a file, GIT_COMMIT_MSG holding the raw string, COMMIT_EDITMSG naming a file, and the COMMIT_EDITMSG file git itself wrote in the git directory. Each carries the token and each is refused. The environment is set only on a real commit, never without one."
    proves_clause: 'every one of the six commits is refused and the branch tip is unchanged after each attempt'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - the GIT_COMMIT_MSG variable is still read for the token
      - the COMMIT_EDITMSG variable is still read for the token
      - the --commit-msg-file argument is still read for the token
      - the check reads the message file git writes for the current commit instead of the old one
  - name: test_ge_123e_2_each_refusal_equals_plain_message_refusal
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "From the same starting state commit the id-less change with the plain inline message Add sign-off and keep the refusal text. Each of the six token routes must produce byte-identical hook refusal text (the shared-step route read from hook_output). Catches a message-dependent branch that changes wording without skipping."
    proves_clause: 'each refusal is the same refusal the same change receives when committed with the plain inline message "Add sign-off"'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
  - name: test_ge_123e_2_no_attempt_says_check_was_skipped
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "Across all six real attempts, assert stdout plus stderr contain neither the word skipped nor the phrase escape hatch. RED today on the two environment arms, which print the skip line."
    proves_clause: 'no output of any of the six attempts says that the check was skipped'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - the skip line is still printed on a route that is nevertheless refused
      - the skip branch survives for the environment routes only
  - name: test_ge_123e_2_token_with_real_id_commits_as_ordinary_text
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "Staged change appends the heading plus feedback-id: fb_2026-11-16_a1b2c3d4; committed inline with Add sign-off [NO-FEEDBACK-CHECK]. The commit succeeds and HEAD advances by one. Fails a check that refuses any message carrying the token."
    proves_clause: 'the commit succeeds, Because the token is now ordinary text: it neither excuses a missing id nor causes a present one to be refused'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - a check that refuses any commit whose message carries the token
      - a check that treats the token as a reason to inspect the heading more strictly
  - name: test_ge_123e_2_shared_commit_step_with_token_file_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    description: "Run commit_changes.py as a subprocess with a message file holding the subject and the token body line plus the id-less ticket path. Assert exit 1, one JSON answer with status hook_failed, hook_output free of any skip line, and HEAD unchanged."
    proves_clause: 'every one of the six commits is refused and the branch tip is unchanged after each attempt'
    code_file: templates/scripts/commit_changes.py
