notes: |
  ORIGIN (2026-09-09, product-owner, on BrainCandy's brief). The request was for
  "backfill tooling that lets an existing codebase adopt this AC-driven,
  proof-of-done system incrementally". This L0 is HALF of the answer and is
  deliberately the FIRST half. Its sibling ACD-2300 is the backfill itself and
  carries a depends_on edge to this record.

  ==========================================================================
  WHY THE REQUEST WAS SPLIT — AND WHY THIS HALF IS THE PRIORITY
  ==========================================================================
  BrainCandy asked for backfill and then set the governing rule for it in the same
  session: "On all new work we need to have the guards, to not end up in the same
  situation we are in now." Backfill is explicitly NOT making the numbers zero. It
  is establishing a floor and stopping the bleeding.

  Those are two independently valuable and independently shippable products, and
  the known-issues register already sequences them in exactly this order without
  using these words. KI-CG-20260908-gate-test-ac-tags ends with the instruction
  "Ratchet first, backfill opportunistically." A floor with no backfill is a
  complete, valuable outcome: the project stops getting worse from that day. A
  backfill with no floor is the failure mode the user named, because the backlog
  refills behind you while you work through it.

  So: ACD-2200 is the floor and does not depend on any backfill existing.
  ACD-2300 is the backfill and depends on this. Building 2300 first is the wrong
  order and this note is the reason.

  A SINGLE L0 SPANNING BOTH WAS CONSIDERED AND REJECTED. It needed seven L1s,
  which is exactly the hard cap, leaving no room for the documentation L1 or the
  cross-cutting guarantee that later decomposition reliably discovers is needed.
  Two L0s at four L1s each leaves three free slots in each. The cap arithmetic
  precedent is ACS-1300's notes.

  ==========================================================================
  ONE L0 OR TWO ON THE OTHER AXIS — ADOPTION BY OTHERS VERSUS OUR OWN DEBT
  ==========================================================================
  BrainCandy asked explicitly whether "other repos adopting this" and "paying down
  our own debt" are one goal or two. DECIDED: ONE, and it is not a close call.

  They are the same mechanism pointed at two populations. This repository is the
  first customer and its measured numbers — 5,566 untagged test functions, 499
  fixture-bloat violations, 252 tickets with no test requirements, 49 files over
  the complexity limit — are the acceptance fixture for a capability that must
  also work on a repository nobody here has seen. Splitting them produces two
  trees that must behave identically and will drift, and it invites the specific
  failure of building "our debt" as a one-off script and "adopters" as a product.

  The component already holds the precedent for keeping these together: ACD-1900g
  is dogfood-on-self-host-first, proving on this project before any other project
  is asked to adopt. That is INHERITED FRAMING here, not a new L1 — do not author
  a fifth child restating it.

  ==========================================================================
  THE L1 CUT — BY GUARANTEE, NOT BY GATE
  ==========================================================================
  Do NOT re-cut this as one L1 per dormant guard. The census names twelve and each
  has its own known-issue entry, its own ratchet shape and its own definition of
  done. Twelve near-identical L1s would hide that they are eleven instances of two
  promises, and would put this tree at four times its cap.

    - ACD-2200a — FORESIGHT: you know the cost before you commit.
    - ACD-2200b — THE FLOOR: what exists stays workable, what is new is held.
    - ACD-2200c — MONOTONICITY: the tolerated set is counted and can only shrink.
    - ACD-2200d — PACE AND REVERSIBILITY: one standard at a time, and back down.

  ACD-2200b AND ACD-2200c ARE DELIBERATELY SEPARATE and must not be merged. (b) is
  a PERMISSION — you may keep working on what is already short. (c) is an
  OBLIGATION — the shortfall stays counted and cannot be made to vanish. Merged,
  the cheapest implementation satisfies (b) perfectly by exempting the offenders
  and calling it done, which is precisely one of the two non-solutions GE-127's
  notes identify ("raise the number until nothing fails, or exempt the offenders —
  both leave the project exactly where it is"). The same reasoning that keeps
  GE-127a and GE-127b apart applies here unchanged.

  ==========================================================================
  THE EVIDENCE, WITH CONFIDENCE LABELS — CARRY THEM THROUGH, UPGRADE NEITHER
  ==========================================================================
  All figures below are from the census at df1f0cfb5, dated 2026-09-08, over THIS
  repository. Per ACS-1100 (honest coverage answers, scope: standing, inherited)
  any figure a child of this tree reports must state the total it was measured
  against and what was excluded.

    - DERIVED TWICE INDEPENDENTLY AND IN AGREEMENT: 49 of 915 tracked .py files
      hold a function over the complexity limit; 5 of 12 tracked root files
      violate the root-file allowlist; the root-file check matches A, M and R so
      it forbids EDITING those five rather than merely adding new ones.
    - SINGLE MEASUREMENT PASS, UNVERIFIED BY A SECOND METHOD: 5,566 untagged test
      functions across 595 of 597 test files; 499 fixture-bloat violations across
      266 files; 252 of 370 code tickets with no populated test-requirements
      block; 354 tickets that a post-merge write hook would act on; 107 of 261
      directories over the folder-density limit.
    - EXPLICITLY UNCERTAIN IN THE SOURCE AND NOT TO BE PRESENTED OTHERWISE: what
      pre-commit attaches to a hook's stdin was not observed, so the
      "inspects nothing" finding for the ticket-test-requirements gate is
      confirmed only for the empty-stdin case.
    - NOT MEASURED AND NOT TO BE ASSERTED ANYWHERE IN THIS TREE: the same figures
      for any other repository. This capability's whole point is that it works on
      a codebase nobody here has counted.

  A NUMBER IN A CRITERIA BLOCK IS A DEFECT IN THIS TREE. Every figure above is a
  property of one repository on one day. Criteria state the guarantee; the numbers
  live here and in the register.

  ==========================================================================
  THE TRAP THAT APPLIES TO THIS HALF
  ==========================================================================
  BrainCandy named two traps. Both are principally ACD-2300's, and both are
  encoded there. The one that reaches THIS tree is the third state a standard can
  be in: not off, not enforcing, but registered and unable to fail. The census
  found six of twelve in some version of that state, and it is the worst of the
  three because it looks like coverage. As recorded in doc_links, that hazard is
  already owned by TQ-500, GE-120 and GE-126 and is INHERITED here rather than
  restated. ACD-2200a is the record that makes it hard to fall into by accident,
  because a standard whose measured distance-to-compliance is zero on a repository
  that visibly violates it is a report that has caught its own defect.

  ==========================================================================
  ROADMAP — phase_1 IS CLAIMED AND THE CLAIM IS ARGUED
  ==========================================================================
  phase_1's outcome is "Stable MVP that installs into any project and helps the
  user build good software — portable, self-onboarding, and reliable enough to use
  across multiple repos." A package that installs into any project but whose
  standards can only be switched on in a project that was built under them is not
  reliable across multiple repos in any sense the outcome means. This goal is the
  missing half of "installs into any project". Its sibling ACD-2300 makes a weaker
  claim and is deliberately left unphased — see that record.

  No roadmap or vision file was modified while authoring this. If the user
  disagrees with the phase_1 claim, drop roadmap_phase rather than inventing a
  phase for it.

