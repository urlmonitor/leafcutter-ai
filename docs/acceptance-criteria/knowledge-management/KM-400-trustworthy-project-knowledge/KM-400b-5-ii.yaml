  contract: The removal attempt and its outcome on a failed publication.
origin_agent: business-analyst
created: '2026-10-14'
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  Authored 2026-10-14. The hosted instances latched read-only in exactly the condition
  where removal matters most: a full store refuses the deletes that would free it. A
  result that reported only "generation count validation failed" in that state would
  read as a clean failure while ~28k relationships sat stranded. This is not a
  duplicate of KM-400f-1-vi, which covers the retention evaluation being unable to
  read the store. This record covers the publication's own failure result.

  The original cause must survive. A removal error raised inside the failure path
  must not replace the publication's own failure, or the operator learns that cleanup
  failed but never learns why the publication failed.
it_requirements: null
test_required: true
test_spec:
  - name: test_refused_removal_reports_original_cause_and_names_stranded_generation
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Use a backend double that records writes and deletes, fail the publication's count check after storing, then refuse every delete as read-only; assert the result carries the count-check cause with both figures, names R1 and G33 as not removed, states the refusal and the remaining counts, and the active generation is unchanged.
    covers: [KM-400b-5-ii]
    must_catch:
      - "let the removal error replace the original count-check failure"
      - "report the original failure only, hiding the stranded generation"
      - "report the remaining amount as 0 when it could not be counted"
    requires_db: false
  - name: test_partial_removal_is_named_as_partial
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: Let the double accept node deletes and refuse relationship deletes; assert the result names G33 as partially removed and states relationships remain.
    covers: [KM-400b-5-ii]
    must_catch:
      - "report removed because the first delete succeeded"
    requires_db: false
test_rationale: >-
  The existing publish tests never fed a duplicate relationship, so no test drove a
  publication into failure after storing, let alone into a failed cleanup — the precise
  state two hosted instances reached. The double refuses deletes the way a latched
  read-only store does, and the assertions read the result's two causes as separate
  values, because a chained exception that only carries one of them passes any test
  that checks "it failed". Grep-only coverage is forbidden for this record.
