roadmap_phase: phase_1
criteria: |
  Given run R was resumed with the person's answer for its business-analyst decision point, the
    answer was applied, and the run has moved past that decision point,
  When the step that clears run R's pause record declines to run on every attempt (it replies
    that it did not run the command, and gives a reason),
  Then the run's result states that run R's pause record was not cleared, names the declined
    step and the agent that declined it, quotes the stated reason, and gives the record's
    location on disk,
  And it states that the record still names a decision point the run has already passed, and
    that the record can be deleted once nothing is waiting on run R,
  And nothing in the result reports the record as cleared,
  And the record is left on disk unchanged, and the clearing is not sent to any other agent or
    done by any other means,
  And the person's answer and the criteria committed for that stage stay as they were,
  And when the clearing runs and its read-back confirms no record remains, the result carries
    no such statement,
  And the bug symptom (run wf_4a8567df-505, 2026-10-30: the clearing replied "My role is limited
    to the two workspace actions, create and remove", only a warning line was logged, and the
    run's pause record was still on disk after the run had moved past its decision point) must
    not occur.
