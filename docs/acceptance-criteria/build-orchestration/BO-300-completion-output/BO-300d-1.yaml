notes: |
  THE COUNT IS THE WHOLE OF THIS RECORD. Naming the pieces is BO-300a-5's and is
  already done; what is missing is the run stating how many, so the operator is not
  the one doing the arithmetic.

  The third scenario is the identity clause, promoted into BO-300a-5's criteria body
  in the concurrent amendment ("by identity and not by count") and restated here
  only because a stated COUNT is exactly the thing that tempts an implementation to
  compute it by subtraction.

  VERIFY BY EXECUTION. Assert on the text the run emits at the end of a real drive
  over a body of work whose size is known, not on an internal tally.
