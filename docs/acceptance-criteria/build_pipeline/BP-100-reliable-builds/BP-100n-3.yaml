assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    equality_guard_platform_coverage:
      type: object
      description: "Record of which emittable platforms the build-equality guard exercised and which it could not, so a platform excluded from the assertion is a named, failing condition rather than an unremarked omission."
  reference_file_path: "unit_tests/build_guards/test_bp_100k_2.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m pytest unit_tests/build_guards/ -q"
  constraints:
    - "The platform set the guard iterates must be READ from the same source the build reads when deciding what to emit. Replacing one hardcoded literal with a different hardcoded literal — even a complete one — leaves the guard stale the moment a platform is added, which is the defect."
    - "The excluded platform's output family is not incidental: it contains command surfaces carrying live handoff targets that were separately found to be unscanned. Restoring coverage may surface real inequalities; those are findings to fix, not reasons to re-narrow the guard."
    - "Pinning a platform off must not be reachable by any path that leaves the run reporting equality. If a platform genuinely cannot be exercised in a given environment, the guard names it unverified and fails."
    - "Verify behaviorally — execute the guard with the build's platform set extended by one and assert the new platform is exercised without the guard being edited; and execute it with one platform made unexercisable and assert it is named and the run fails. Do not assert on the presence or absence of a platform literal in the guard source."
    - "Must follow the repo error-handling policy: specific-exception try/except around file and configuration I/O, log at WARNING or higher or re-raise; no bare or blind excepts."
    - "A build.py re-run is required before running the guard when any template or build phase has been edited, so the guard compares against the outputs the current build actually produces."
test_spec:
  - name: test_guard_exercises_every_platform_the_build_can_emit
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "The executed guard's record of exercised platforms equals the platform set the build reads when deciding what to emit — compared as sets, so an omitted platform is detected rather than absorbed."
  - name: test_no_platform_is_withheld_by_a_choice_inside_the_guard
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "Running the guard against a build whose platform set enables every platform yields an exercised set with no platform missing; no platform can be excluded except by the build's own configuration."
  - name: test_a_newly_emittable_platform_is_covered_without_editing_the_guard
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "Extending the build's platform set by one and re-running the guard unchanged causes the new platform to appear in the exercised set and its outputs to be included in the equality assertion."
  - name: test_unexercisable_platform_is_named_and_the_run_fails
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "With one emittable platform made impossible to exercise, the executed guard names that platform as unverified and terminates with a failing result rather than reporting equality for the remainder."
  - name: test_output_family_of_an_unexercised_platform_is_not_counted_as_covered
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "An output family emitted only under a platform that was not exercised is reported as uncovered by the executed guard and is absent from the set the equality assertion claims to have verified."
test_rationale: "The incumbent guard is this epic's own bidirectional manifest-versus-output equality assertion, and it pins one platform off in two places — excluding that platform's entire output family, the same family separately found to contain unscanned command surfaces carrying live handoff targets. The guard passes, and its passing means nothing about the excluded family. A test that reads the guard for a platform literal cannot distinguish a complete literal from a stale one, and per the standing rule in CLAUDE.md ('Gate / Workflow ACs — Verify Behaviorally, Not by Grep') such a test is forbidden here and will be rejected. Each descriptor therefore executes the guard against a build whose platform set has been varied deliberately — extended, or made partly unexercisable — and asserts on the exercised set and the run outcome the guard actually produces. The extend-by-one descriptor is the load-bearing one: only a guard reading the build's own platform set can pass it without being edited."
delivers_to:
  agent: python-coder
  contract: "A build-equality guard whose platform coverage is read from the build's own platform set, together with a named unverified-platform failure when a platform cannot be exercised."
expects_from:
  ac_id: BP-100k-2
  contract: "The build's record of every deployed output and its source, which the equality guard asserts equal to what the build actually wrote — for every emittable platform rather than a chosen subset."
