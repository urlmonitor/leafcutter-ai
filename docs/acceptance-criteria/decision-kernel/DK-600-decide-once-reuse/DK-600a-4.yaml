id: DK-600a-4
title: "Every option is assessed against every criterion on its own evidence"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given approved options that make claims and cite files, for example an option citing
    kernel/contracts/decision.py,
  And approved criteria, for example 4 options and 5 criteria (3 required, 2 supporting),
  When the targeted research round runs and Jev then assesses the options,
  Then evidence for each option's claims, and the content of each file an option cites, is
    retrieved before the assessment starts,
  And Jev scores each of the 4 options against each of the 5 criteria, 20 judgements, each for
    satisfies and for sufficient,
  And each of the 5 criteria is classed evidence_answerable or design_judgement,
  And the options leave the assessment ranked by required criteria passed, then the
    required-criteria mean, then the supporting-criteria mean.
depends_on:
  - DK-600a
