notes: |
  SHAPE B, not shape A. A step leaving no verdict is BO-2900f-1's and BO-3100b's;
  this is the step that leaves a POSITIVE, well-formed verdict having produced none
  of its own result. The second scenario is the discriminator that makes the record
  falsifiable: identical reports, opposite judgements.

  The third scenario is the BO-3100b boundary written as a test rather than as a
  boundary note. Files changed; the declared result did not come into being; the
  step still fails. Any implementation that satisfies this by widening the
  did-anything-change test has not satisfied it.

  VERIFY BY EXECUTION, per CLAUDE.md. The result is looked for directly — the
  publication and the review are checked for existence, not inferred from the
  step's own record of itself, which is the input under suspicion.
