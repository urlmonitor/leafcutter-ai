notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.

  THIS IS ONE OF THE TWO AXES OF THE GRID. Deliberately separate from
  INF-1200d, which is the other. This one is answered by walking the record of
  who owns what; d is answered by walking the standards themselves. Merged into
  a single L1, an implementer satisfies whichever axis is cheaper — which is
  exactly how the store arrived at a grid with one cell filled.

  MEASURED BY GREP OVER EVERY SPECIALIST TEMPLATE, 2026-09-09. Exactly one
  specialist mentions the size standard anywhere in its instructions. The
  project's own ownership record assigns kinds of file to two further
  specialists — one covering database work, one covering interface work — and
  neither is told any standard at all, including for kinds of file that already
  carry a distinct configured limit. The user's own example falls to the
  interface specialist, which is the one told nothing.

  DELIBERATELY NOT NAMED IN THE CRITERIA: any specialist, and any kind of file.
  Following the precedent set by GE-127c, this record states the obligation in
  terms that survive a specialist being added, renamed or split. A criterion
  beneath this one that enumerates today's three specialists is at the wrong
  altitude and must be rewritten rather than approved.

  THE ARM MOST LIKELY TO BE DROPPED — SHARED OWNERSHIP. A kind of file may have
  more than one legitimate audience, and at least one specialist today owns two
  kinds of file with different standards. "The owner" is not reliably singular
  in either direction, and a decomposition that assumes one specialist per kind
  of file, or one kind of file per specialist, will quietly under-deliver on
  whichever pairing it drops.
