id: GE-129d-3
title: "A how-to explains committing from your own session: the prompt you answer, when it is refused, and what to do instead"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the behaviours of GE-129d-1, GE-129d-2 and GE-129d-2-i and the probe findings of GE-129a-1,
  When a person reads the how-to for committing from their own session,
  Then it states that each commit the assistant issues is shown at Claude Code's permission prompt,
    that only the person's answer there lets it through, and that a reply typed in the conversation
    does not,
    And it lists every permission mode the probe findings record, each with its outcome for a
    commit (prompted or refused), matching those findings,
    And for a refused mode it gives the steps to commit instead: switch the session to the default
    mode, or run the commit yourself in your own terminal,
    And it states that in a mode where no person is reached, having the session hand the commit to
    the commit specialist -- directly, or through an agent the session dispatched -- is refused too,
    And it states why: that hand-off would otherwise put a commit into the history with no person
    confirming it, the same gap the session's own refused commit closes,
    And for that refused hand-off it gives the same steps to commit instead as for a refused mode,
    and does not present the hand-off as a way to commit in such a mode,
    And every statement it makes about what happens in a named permission mode, for the session's
    own commit and for a hand-off to the commit specialist, matches the probe findings, and it makes
    no such statement about a mode those findings do not record,
    And it states that allow rules and "don't ask again" do not pre-approve commits,
    And it mentions no token, environment setting or flag as a way to commit.
