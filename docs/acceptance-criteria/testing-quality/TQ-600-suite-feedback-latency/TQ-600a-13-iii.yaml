id: TQ-600a-13-iii
components:
  - testing_quality
title: "A red night raises one nightly-red issue, a further red night updates it, and a green night closes it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the night verdict TQ-600a-13-ii produces — green or red, with the failing node
    ids, a link to the run's log, and the head commit the run tested,
  And the decision that the flag is a single open repository issue carrying the label
    `nightly-red`, and that this open issue is the one source of truth the per-PR hold
    reads,
  And the fact, reported by the requester, that no workflow in this repository opens
    issues today and the repository has never had an issue, so this is a new surface
    with no prior convention to inherit,
  When a night's verdict is applied to the flag, with the issue service replaced by a
    recording double that serves a stated set of existing issues,
  Then on a red night with no open issue labelled `nightly-red`, exactly one issue is
    created, carrying that label, whose description contains every failing node id, the
    link to that night's log, and the list of commits merged to the main branch since
    the last green night,
  And on a red night with one open issue labelled `nightly-red`, no issue is created and
    exactly one comment is added to that issue, containing that night's failing node ids
    — which may differ from the night that opened it — that night's log link, and the
    commit list since the last green night,
  And on a green night with one open issue labelled `nightly-red`, that issue is closed
    with a comment linking the green run, and no other issue is created, edited or closed,
  And on a green night with no open issue labelled `nightly-red`, the issue service
    receives no write request at all,
  And the commit list is every commit reachable from the red run's head commit and not
    reachable from the head commit of the most recent green run, so on a nightly cadence
    the list is the culprit's search space,
  And when no green run is on record, the issue says in words that no green night is on
    record, rather than showing an empty list that reads as "nothing changed",
  And issues that do not carry the `nightly-red` label are never read as the flag and
    never written to.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-ii
