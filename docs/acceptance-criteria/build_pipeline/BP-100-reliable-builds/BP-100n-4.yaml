notes: >-
  VERIFIED DEFECT, 2026-08-31, sourced from KI-CG-20260831-hook-scripts-never-invoked. The
  defect is unchanged and the criteria's behavioural clauses stand. The POPULATION SIZES that
  used to appear in criteria have been removed and live here instead — see the census block
  below for why, and treat every number in this record as an observation with a date and a
  commit attached, never as a requirement.


  CENSUS AS MEASURED AT b846121c9, 2026-09-01, BY THIS AMENDMENT — INDEPENDENTLY, NOT
  INHERITED. Registry side: 61 hooks_manifest entries, 5 of them enabled:false
  (check-mermaid-drift, check-diagram-naming, check-duplicate-code, check-diff-coverage,
  check-surface-components-e2 — unchanged since authoring). Disk side, and the number depends
  entirely on the counting rule, which is the whole point of this block:

    - non-recursive listing, bare-filename identity ......... 67 on disk, 18 unreferenced
    - recursive listing, bare-filename identity ............. 71 distinct names, 19
    - non-recursive, using _check_hook_script_integrity's
      last-whitespace-token extraction ...................... 67 on disk, 19 unreferenced
    - recursive listing, path identity (THE RULE ADOPTED) ... 72 on disk, 20 unreferenced

  Three of those four rules can produce a "19", and they produce three DIFFERENT sets of 19.
  The third is worse than merely different: it reaches 19 by falsely reporting
  check_done_proof.py, a registered and required gate, because its entry line ends in a flag
  rather than in the script name. A number that three incompatible rules agree on and three
  incompatible sets underlie is not evidence of anything.


  WHY THE COUNTS LEFT criteria, STATED SO IT IS NOT UNDONE. They have now gone stale twice in
  a single day of elapsed store time — 66/59/60/19 at authoring on 2026-08-31, 67/61/-/18 at
  the sibling re-measurement, 72/61/-/20 under the adopted rule here — and while they were
  stale they were also internally unreachable as a pair: 66 is a non-recursive listing, which
  yields 18, and reaching 19 required silently counting hooks/check_ac_done_on_merge.py, which
  needs a recursive listing, which makes the disk figure 71. An implementer following the old
  criteria literally would write a non-recursive listing, get a number that did not match, and
  either fudge it or fail to notice that hooks/ holds five gate scripts of which three are
  live. Recursion was a real design decision the criteria were making by accident; it is now
  made explicitly, in criteria, as behaviour rather than as arithmetic. THE REQUIREMENT THAT
  BOTH POPULATIONS BE ENUMERATED FROM LIVE SOURCES IS NOT WEAKENED BY THIS — it is
  strengthened, because criteria now describe how the enumeration works instead of asserting
  what it happened to return on one afternoon, and BP-100n-4-ii still requires the sizes to be
  STATED in every run. A number the check prints from what it examined cannot go stale; a
  number written into a requirement can only go stale.


  THE GAP IS IN THE ENUMERATION, NOT THE PREDICATE. BP-100k-4's predicate is sound and is
  not being changed. Its input is hooks_manifest.hooks, so a script that was never registered
  is not in the set it walks, and the guard built to find gates that cannot fire is
  structurally blind to the gate nobody wired up. A completeness guard whose input is the
  registry it is meant to be checking cannot detect incompleteness in that registry.


  DAY-ONE BLAST RADIUS IS THE WHOLE UNREFERENCED SET, AND THAT IS THE CORRECT OUTCOME. The
  check fails on the commit that lands it until every script it reports is registered,
  deleted, or given a grounded record in the non-gate register (BP-100n-4-i). Triaging them is
  part of the work, not a follow-up: a check that lands green because its findings were
  pre-suppressed has proved nothing. Take the set from the check's first run; do not take it
  from the census block above, which is dated evidence that the set moves.

  THE EXEMPLAR HAS CHANGED, AND ITS DEPARTURE IS ITSELF THE ARGUMENT. This AC's named instance
  was the ticket sign-off parity script — deployed, documented as live with enforcement,
  invoked by nothing. It is no longer unreferenced: BP-1100g-5-i registered it under its
  documented id in commit 406375c88 (PR #660) and it is now on an emitted entry line. The
  contract to TQ-500b-1 anticipated exactly this and says whichever AC is scheduled first owns
  the addition; BP-1100g-5-i was first. What survives is narrower and deliberately out of
  scope: the entry carries no --enforce flag while README.md still states the config uses one,
  so the gate is reached but not at the documented enforcement level. That is a
  documentation-versus-config question about one gate, not a reached-versus-unreached one, and
  folding it in would put a second question inside the criterion. THE POINT FOR THIS AC: the
  single most load-bearing fact in its original text — its named example — was falsified by
  ordinary scheduled work within a day. Facts about the world stated as requirements decay at
  the speed the world moves. Criteria state behaviour; notes state observations, dated.

  check_file_size.py IS A SPECIAL CASE AND HAS AN EXTERNAL ANSWER. It is the one member of the
  unreferenced set whose registration blocks the very commit that registers it: this AC's own
  implementation edits scripts/build_phases.py, measured at b846121c9 at 2603 lines under the
  hook's own docstring-stripping rule (3873 raw) against a 400-line cap. Registering it flat
  refuses that commit and walls off a large fraction of the first-party Python tree; recording
  it as a declared non-gate is the disposition this AC already calls implausible for the ten
  config-carrying scripts, of which it is one, and is suppression under another name. The
  third answer was authored on 2026-09-01: GE-127b, "A file already over the line cannot get
  further over it", specifies the ratchet — an oversized file may still be worked on and may
  shrink, but a change that leaves it larger is refused, judged against the file's own
  previous size. Land that and registering check_file_size.py is a no-op for every file
  already over. The sequencing is recorded as a doc_link and an it_requirements constraint
  rather than a depends_on edge, and the doc_link states the mechanical reason: a
  non-ancestor depends_on entry blocks readiness until the dependency reaches
  work_status: done, and GE-127b is an L1 composite that never will, so the edge would not
  sequence this AC — it would delete it from the ready set. GE-127a and GE-127b each already
  carry a doc_link naming THIS AC as their own precondition, since the size gate cannot fire
  until this AC's triage registers it; neither direction is a whole-AC dependency and writing
  either as one would falsify the graph in both.


  MUTATIONS FOR THE ABSENCE-ASSERTING CLAUSES. Two clauses here assert that something is NOT
  reported, and both are green on arrival by construction — there is no red baseline for
  either, because today nothing is reported at all. Each needs an injected mutation to have
  any evidential value:

  (1) "a script named by an emitted registry entry is not reported at all" — MUTATION: build
  the invoking set by kebab-casing each script's filename and matching it against registry
  ids, instead of reading the entry lines. This is the precise over-report the finding's
  Method section controls for: check_ac_limits.py runs under the id check-ac-tree-limits and
  would be falsely reported. Under this mutation the clause must fail, naming at least
  check-ac-tree-limits' script.

  (2) "a script named by a registry entry marked not to be emitted is reported as switched
  off and does not fail the run" — MUTATION: build the registered set from the generated
  commit-time configuration alone (the emitted entry lines) rather than from the whole
  registry. The 5 enabled:false scripts then appear as invoked by nothing and the run fails
  on them. Under this mutation the clause must fail with exactly those 5 named. This is the
  five-false-alarms-on-day-one scenario, and false alarms have exactly one natural remedy —
  weakening the check until they stop — so the mutation must be run, not merely described.


  ANTI-GREP, AND HERE IT IS THE WHOLE POINT. Per CLAUDE.md "Gate / Workflow ACs — Verify
  Behaviorally, Not by Grep", and more sharply: an implementation that compares one hardcoded
  list against another reproduces this exact defect one level up, which is how the incumbent
  guard fails. Both sides must be enumerated at run time — the disk side by listing the tree,
  the registry side by parsing the file the commit would actually consume. The added-script
  clause is the decisive discriminator: it cannot pass on any implementation carrying a
  literal list, and it is the clause to write first.
