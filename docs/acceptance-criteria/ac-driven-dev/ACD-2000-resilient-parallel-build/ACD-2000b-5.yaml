criteria: |
  Given a requirement can be taken by an effort, handed back, and taken over
    when abandoned,
  When an author or an operator consults the reference documentation for the
    requirement record,
  Then the documentation describes what a claim records -- that the requirement
    is taken, by whom, and since when -- and states that both the
    single-requirement fast path and a larger drive use the same record,
  And it states the rule by which an abandoned claim may be taken over, and what
    an operator should check before doing so by hand,
  And it states that a requirement whose change footprint cannot be established
    is treated as conflicting with every other requirement, and explains why the
    opposite reading is the dangerous one,
  And an operator who has read only this documentation can look at a requirement
    that appears stuck and decide whether it is being worked on or abandoned,
    without reading any implementation.
depends_on: [ACD-2000b, ACD-2000b-1, ACD-2000b-2, ACD-2000b-3, ACD-2000b-4]
