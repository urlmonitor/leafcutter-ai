title: "Resolved entries are excluded from the next scan"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the router resolved entry F1 during run A by setting its resolved_at field,
  When the router builds its work queue at the start of run B,
  Then F1 does not appear in run B's work queue,
  And F1 is not re-classified, re-routed, or used to produce a second artifact,
  And only entries still lacking resolved_at are carried into run B,
  And an entry that was parked (not resolved) in run A DOES reappear in run B's
    queue, distinguishing parked from resolved.
depends_on: [ACD-1500c, ACD-1500c-1]
