id: BO-4100d-3-i
title: "A name that had to be altered is reported as altered, and as the altered name"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
package_surface: false
criteria: |
  Given a requested workspace name containing characters the branch name cannot
    carry, so creation alters it,
  When creation reports what it made,
  Then the name it reports is character-for-character the name of the branch that
    exists,
  And the report states that the requested name was altered and gives the
    requested name alongside it,
  And the kind of work carried by the altered name is the kind that was
    requested.
depends_on: [BO-4100d-3]
