it_requirements:
  - "Convention only -- deviations are separate AC files with their own criteria that are independent of the pattern they override"
  - "Pattern resolution must not touch or modify deviation ACs when the pattern is updated"
  - "No automated conflict detection between deviations and updated patterns is required for this AC"
  - "Document in docs/reference/ac-schema.md that deviations take precedence over pattern behavior for their specific aspect"
