notes: |
  Satisfies the component-diagram entry in TQ-400a's documentation_triggers.

  The diagram's job is to make ONE relationship obvious: three checkers, three
  populations, one verdict source. That single picture is what stops the next
  implementer adding a fourth checker with its own verdict logic — the drift this
  repo has already shipped once (two readers of one evidence source, each green
  against its own copy).

  The criteria are written as questions a reader must be able to answer, not as
  "a diagram exists". A diagram file with the right name and four labelled boxes
  satisfies a presence check while leaving the population distinction — the whole
  point — invisible. "Which records would this layer never look at" is the
  question the current state answers badly, and it is the one the diagram must
  answer at a glance.

  The publication-accuracy clause matters because two of the four elements are
  already live. A diagram that draws the intended arrangement rather than the
  delivered one is worse than none: it would let a reviewer believe the
  single-verdict-source constraint holds when the code has drifted from it.

  IT-PO ENRICHMENT NOTE (2026-08-18) — THE SIBLING DIAGRAM ALREADY NAMES THE
  ORACLE. docs/architecture/diagrams/c3-done-proof-evaluation-sequence.md exists
  and already documents verify_done_eligible in scripts/ac_store/done_proof.py as
  the authoritative oracle, with related_code naming both that module and
  templates/scripts/commit_guardian/check_done_proof.py. This AC's diagram is the
  structural view over the same oracle. Naming it differently would reproduce the
  two-readers drift in the documentation layer — the seam test entry exists to
  make that impossible.
