id: GE-129a
title: "The guards that run while you work have been seen to refuse something"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Protection that watches your editing is proven, not merely switched on.

  Each guard the project runs in response to your own actions, rather than at
  commit time, is handed something it must reject and is watched to see whether
  it rejects it. One that has never been seen to say no is named as unproven
  instead of being counted among the things keeping your work safe, so a guard
  that would wave everything through is visible rather than quietly reassuring.
