criteria: |
  Given run-progress journaling is covered today by a regular-expression assertion
  in unit_tests/workflows/test_bo_1000c_1a.py that checks a journal-appending
  function is DECLARED in the finalize workflow source
  (templates/workflows-js/finalize-feature.js) and that its declaration mentions an
  append mode,
  And that assertion is green today with no evidence that any journal record has
  ever been written by a real finalize run,
  When the coverage for run-progress journaling is re-authored,
  Then the declaration regex is no longer the only coverage of that behavior,
  And at least one test executes the finalize workflow under the workflow test
  harness and asserts observable outcomes: one journal record is appended per
  completed step, the records appear in step order, and the records are still
  present when the run ends,
  And a run in which the append cannot happen in the execution environment — for
  example because the engine the workflow runs under exposes no filesystem
  primitive, so the append is swallowed by the surrounding error handler — fails at
  least one of these tests instead of passing,
  And renaming the journal-appending function, or changing the wording of its
  declaration, without changing what is journaled leaves these tests green.

  Given the workflow test harness those tests run under,
  When a workflow body under test asks for a filesystem primitive,
  Then the harness refuses it exactly as the real engine does — the only globals
  reachable from the workflow body are the ones the engine injects (agent,
  parallel, pipeline, phase, log, args, workflow, budget), and no module loader
  is reachable from it,
  And a workflow whose journaling depends on a filesystem primitive therefore
  produces zero journal records under the harness,
  And the re-authored tests are only accepted as satisfying this criterion once
  the harness behaves this way, because until then they pass on a workflow that
  cannot journal in production.
