it_requirements:
  - >-
    File and conventions. Create
    docs/architecture/diagrams/c3-<seq>-wrong-version-runner-components.md through
    the write-c4-diagram skill, allocating <seq> with "python
    scripts/next_diagram_seq.py 3" at write time (035 was free on 2026-10-23).
    Use frontmatter as in c3-030-requirement-rule-check-components.md: type
    architecture, flight_level L3-Component, diagram_type component, parent
    (docs/architecture/diagrams/c2-fast-vs-heavy-lane-phases.md, per OQ-3,
    user decision 2026-10-23), components testing_quality and build_orchestration, related_docs
    (including docs/reference/wrong-version-runs.md) and related_code. Mermaid
    is the house style. At most 300 lines after frontmatter (check-doc-length,
    blocking).
  - >-
    Draw what main holds, from the code, not from the ACs. On ae3a1591c every
    route is wired, so no call is drawn as missing. If a route's call is gone at
    drawing time, draw it as missing. The route surfaces:
    templates/workflows-js/fast-lane-ship.js (fastlane-wv-*), build-feature.js
    (bf-wv-*) and build-ticket.js (bt-wv-*); and /build-epic as build-epic.js
    plus ticket-supervisor following templates/skills/building-epics/SKILL.md
    section 5.10.2. Each reaches the Python CLIs through the executor agent
    command-step-runner.
  - >-
    One runner, no copies of the rule. Draw the shared CLIs once:
    wrong_version_writer.py (list, write), wrong_version_gate.py (finish) and
    wrong_version_runner.py (run, recover). Draw consumer_sweep.py check as the
    first call inside finish. The three JS files and the skill each hold a thin
    dispatch block, copied as text because the workflow engine has no module
    loader. Draw it as a dispatch edge, not as a rule component, and say so in
    the legend.
  - >-
    Scope from the requirement store. Show the runner (_wvr_scope through
    _wvr_records) reading the AC store's test_spec entries: must_catch,
    angle: discrimination, in_scope_files and requires_db. Show it reading the
    covers tags in the test root. Show the to-run-later files
    (<git-dir>/leafcutter/to-run-later/<ac-id>.json, read by _wvr_extras) as a
    second, non-blocking input.
  - >-
    One shared reading. Show scripts/ac_store/pytest_outcome_reader.py, with the
    kind rule done_proof_kind_support / _kind_plugin, used by the runner
    (_wvr_pytest), the proof-of-done check (done_proof verify_done_eligible) and
    the red-baseline reader (fast_lane.py verify_red_baseline / heavy_lane_gate).
    It is also used by the sweep's runs (_cs_runs through _wvr_pytest).
  - >-
    Preparation is separate from the runner. Show agent test-breaker (Read only,
    writes nothing, runs nothing) and the deterministic writer
    (wrong_version_writer.py write, producing
    <git-dir>/leafcutter/work/<work-key>/alterations.json) as one preparation
    step that the route calls before finish. The runner only reads the manifest.
    "The fix undone" is prepared by the runner itself from git, not by the
    preparer.
  - >-
    One database. Show the configured test database reached only through
    scripts/db_check/checker.py: check_test_db for the gate (_wvr_db), and
    resolve_test_db_address inside the pytest plugin _wvr_db_plugin and its
    put-back entry. The setting is testing_context.db_connection_test. No other
    database edge appears.
  - >-
    /build-epic. Mark ticket-supervisor's edge to the CLIs as instruction-driven
    (prompt text, building-epics SKILL section 5.10.2), unlike the three
    workflow-code routes. Beside it draw the mechanical backstop:
    build-epic.js running be-wv-recover and the gate markers
    (gate_verdict_records.py open / close) in code; finish --record and
    heavy_lane_gate --record writing <git-dir>/leafcutter/gate-verdicts/<ticket-key>/
    (open.json, red_baseline.json, wrong_version.json); and the pre-commit hook
    check_build_epic_gate_verdicts.py reading them. Note the residual
    --no-verify bypass.
  - >-
    docs/**.md is under the blocking doc-length ratchet (300 lines after
    frontmatter). docs/how-to/fast-lane-build.md (461) is over the limit and
    must not grow; docs/testing/test-angles.md is at 297, so any pointer there
    adds at most 3 net lines. Any pointer added to either is offset in the same
    file.
  - 'Firewall (as in TQ-500f-5): no behavioural AC is closed by pointing at these documents.'
