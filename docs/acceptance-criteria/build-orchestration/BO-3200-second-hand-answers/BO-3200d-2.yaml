notes: |
  BO-3200d-1 says the result arrives whole. This AC says the arrangement does not depend on the
  producer's cooperation to make that happen, which is the difference between a handover that
  works and one that works when the specialist happens to comply. In KI-BO-019 the specialist
  complied with the task perfectly and declined only the transport, returning a pointer and an
  honest description — and that was enough to halt the run.

  THE FIRST SCENARIO IS THE DISCRIMINATOR: a reply containing none of the content at all. Any
  arrangement that still reads the reply for content fails it, and no arrangement that obtains
  the result out of band can.

  THE SECOND SCENARIO SETTLES PRECEDENCE. Once the reply carries a description alongside the
  result, something has to decide which wins when they disagree, and the answer must be the
  result — this is the same doctrine as BO-3100b-1, where the verdict comes from what exists
  rather than from what was said about it.

  RELATED TO BO-3200a BUT DISTINCT, and both are needed, as the parent L1 states. BO-3200a
  removes the cases where a specialist should never have been the source at all. This covers
  the cases where a specialist legitimately IS the source — it did real work and produced a
  real finding — and only the handover is at fault. A fix to either leaves the other class open.

  Deliberately left to the IT PO: what the agreed handover is. The criterion constrains only
  that it exists, that it carries the content whole, and that it does not run through the reply.

  IT-PO DECISION (2026-08-26). The handover is a CALLER-SUPPLIED, run-scoped artifact location
  passed in the dispatch. The alternative — the producer writes wherever it likes and returns the
  path — was rejected deliberately: it satisfies the first criterion by accident while leaving a
  value the build depends on arriving second-hand, which is the defect BO-3200a exists to remove.
  It also fails the third criterion on a careful reading, since obtaining the result would still
  require the producer to put something load-bearing in its reply. The caller-supplied form makes
  every one of the three criteria structurally true rather than conventionally true, and gives
  BO-3200d-1's run-scoping requirement for free.
