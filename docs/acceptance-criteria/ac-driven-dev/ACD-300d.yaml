title: "All authoring output is written to the AC store, never to ticket files"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  The /create-ac workflow produces only AC YAML files in
  docs/acceptance-criteria/<component>/. It never creates ticket files in
  tickets/00_inbox/. Ticket generation from ACs is a separate downstream
  concern handled by the AC scanner (ticket 01). This separation ensures
  that requirements can be authored, reviewed, and approved independently
  of implementation scheduling, and that the AC store remains the single
  source of truth for what the system should do.
