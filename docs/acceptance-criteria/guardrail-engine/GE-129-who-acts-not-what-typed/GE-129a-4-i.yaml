notes: |
  DECIDED 2026-09-17 (user, default accepted; recorded on GE-129a-4) -- WHEN IT RUNS: at session start
  in the developer's environment AND at install. User-scope and plugin definitions live outside the
  repository, so a check that runs only at commit time, or on a CI machine, cannot see (p1)'s
  duplicates. Both run points are required; each is its own named scenario so dropping either one
  turns this record red.

  WHY "ISSUES NO COMMIT" / "NO SESSION STARTED". A check wired only to commit time, or only to the
  session, would pass a scenario that also committed or opened a session. Excluding those makes
  each case attributable to its own run point.

  WHY (p1) HAS BOTH SCOPES AND THE THIRD SCENARIO. A check that reads only user scope, or reports a
  fixed location, passes a single-scope fixture. Removing one location and seeing exactly that
  location disappear is the anti-vacuity shape GE-129a-4 uses for duplicates.

  OPEN, NOT DECIDED HERE: whether a failure at session start or at install also blocks the session
  or the install, or is shown only. This record requires the failure to be shown; blocking is not
  asserted either way. Return to the user if the IT PO needs it decided.

  declares_side_effect: false -- the Then clauses assert what a session and an install report show.
