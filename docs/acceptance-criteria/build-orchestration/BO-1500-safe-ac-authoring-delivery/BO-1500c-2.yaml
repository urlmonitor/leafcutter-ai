criteria: |
  Given the authoring pull request has been opened against main,
  When the project's required status checks run on that pull request,
  Then the same gates that run on any other PR to main run on this one
    (the lint gate and the AC schema-diff/validation gate),
  And the pull request cannot be merged until those required checks pass,
  And no path exists by which the approved AC files reach main while bypassing
    those checks.
