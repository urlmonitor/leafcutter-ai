id: INF-1300a-2-i
title: "A document with nothing above it says so, and no parent is invented for it"
component: infrastructure
components:
  - documentation_system
  - doc_compliance
  - infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300a.yaml"
criteria: |
  Given a request for a document that sits at the top of the tiers, with no
    document above it, and which therefore names no parent,
  When the document is produced,
  Then it declares itself to be at the top rather than naming any parent, and it
    carries no prose reference to a document above it,
  And no parent is inferred from the folder it was placed in, from its tier, from
    the document most recently added to the collection, or from any source other
    than the request,
  And no other document in the collection has its list of the documents below it
    altered,
  And the project's check on the two-directional link passes over the produced
    document, run as the project runs it,
  And a request that names no parent for a document which is NOT at the top of
    the tiers is refused rather than quietly produced as a top-level document.
