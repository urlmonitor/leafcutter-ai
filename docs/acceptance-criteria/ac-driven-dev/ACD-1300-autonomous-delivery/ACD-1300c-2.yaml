id: ACD-1300c-2
title: Preserve blocked feature progress and release capacity for other work
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given implementation or validation cannot continue for a claimed feature
  When the worker blocks that feature
  Then its worktree, checkpoint, failing AC, attempt counts, elapsed implementation time, check evidence and next requested action are persisted
  And the feature releases execution capacity while retaining its claimed work identity
  And unchanged blocked work is not retried automatically
  And unrelated eligible features may continue
  And declared missing runtime inputs create durable questions before any model dispatch or implementation write
  And unknown ambiguities found during read-only discovery block at the same input gate before writable implementation
  And a missing human decision becomes a specific question rather than an invented answer or a request to restate a supplied decision
  And repository facts available to read are inspected rather than presented as decisions for the user
  And an inability to inspect a required repository fact becomes an execution blocker with its cause, without declaring readiness or inventing that fact
  And an agent request for input preserves each nonblank question as a pending request on the affected AC
  And the request cannot also advance that AC as completed or release its dependent work
