id: TQ-500g-1-xi
components:
  - testing_quality
  - build_orchestration
title: "Once a named wrong version is prepared and passes its checks for a piece of work, every later run of that work applies the same replacement to the current code instead of asking the preparer again"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work 07_TICKET-refresh-gate guards requirement TQ-9101, whose
    test T1 names must_catch ["drop the retry_due condition",
    "the gate always allows"],
    and a first run of the wrong-version gate for that work prepared both
    names, each of which passed every check of TQ-500g-1-xiii, with
    "drop the retry_due condition" prepared as one replacement in
    refresh_config.py: "if refresh_due and retry_due" becomes "if refresh_due",
    and after that run a coder changed refresh_config.py elsewhere: the line
    "log.info('refresh')" now reads "log.info('refresh starting')", and the
    gate line was not touched,
  When the gate runs again for the same work in a new workflow run, not a
    resume of the first one,
  Then neither name is sent to the preparer, and because no owed name needs
      preparing the preparer is not dispatched at all,
    And "drop the retry_due condition" is applied as the same replacement to
      refresh_config.py as it now stands, so the altered code reads
      "if refresh_due" and still carries "log.info('refresh starting')",
    And no altered copy made by the first run is applied, or used to build the
      second run's altered copy; only the replacement (file, old text, new
      text) is reused,
    And the replacements of both names are persisted for the work
      07_TICKET-refresh-gate after the first run, so a third run applies them
      again in the same way,
    And a run for another piece of work never applies the replacements pinned
      for 07_TICKET-refresh-gate, even when it guards the same requirement and
      names the same wrong versions,
    And "the fix undone" is never pinned: on every run it is the changed code
      as it stood before the work began,
    And the pins are private to the workspace the work is built in: they are
      never committed, and when that workspace is removed they are lost, so the
      next run for 07_TICKET-refresh-gate in a new workspace sends both names to
      the preparer and pins them again,
    And when the pins of a run cannot be saved, the gate does not pass: the
      work stops at the pin step, and the failure is never reported only as a
      warning.
declares_side_effect: true
depends_on:
  - TQ-500g-1
  - TQ-500g-1-i
  - TQ-500g-1-ix
