assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Must not invoke any git commit operation when the user chooses cancel"
  - "Must preserve all files on disk in their current state after cancel"
  - "Exit message must clearly distinguish between committed prior-stage ACs and uncommitted current-stage ACs"
delivers_to: null
expects_from: null
test_intent:
- clause: the workflow does NOT create a git commit for that stage's output
  needs_test: true
  reason: Cancel must return before any commit call, and a commit placed ahead of the action check would
    commit the cancelled stage.
- clause: the draft AC YAML files remain on disk as uncommitted working-tree changes
  needs_test: true
  reason: The workflow must issue no restore, checkout or delete on cancel, and any such call would remove
    the drafts the user wants to inspect.
- clause: the workflow exits with a message listing the uncommitted file paths
  needs_test: true
  reason: The exit message lists paths built from the stage's ids and the store path, and a wrong list
    points the user at the wrong files.
- clause: the user can inspect the files, manually commit them, or discard them with a standard git checkout
  needs_test: true
  reason: The message carries the git checkout command anchored to the authoring worktree, and a wrong
    anchor would discard files in the wrong checkout.
- clause: the stage 1 commit remains in git history (it was already committed)
  needs_test: true
  reason: Cancel at gate 2 must not reset or revert the stage 1 commit, and committed_acs must still name
    its ids.
- clause: only the stage 2 draft files remain uncommitted on disk
  needs_test: true
  reason: Which ids count as uncommitted drafts is computed per stage, and mixing in stage 1 ids would
    tell the user to discard committed work.
- clause: the workflow exit message distinguishes between "committed ACs from prior stages" and "uncommitted
    draft ACs from the canceled stage"
  needs_test: true
  reason: The message builds the committed and uncommitted sections from two lists, and swapping or merging
    them hides what is safe.
test_spec:
- name: test_acd_300g_4_cancel_at_gate_makes_no_commit
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: reachability
  description: 'Drives the real workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py)
    on the strategic route with a gate-po cancel resume answer: no commit-stage-output dispatch is recorded
    and the run returns status cancelled.'
  proves_clause: the workflow does NOT create a git commit for that stage's output
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the stage output is committed before the gate action is read
- name: test_acd_300g_4_cancel_leaves_drafts_untouched
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'Same cancel run via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py): no dispatch
    after the gate carries git restore, git checkout, git reset or rm, and acs_as_drafts lists the product-owner
    ids.'
  proves_clause: the draft AC YAML files remain on disk as uncommitted working-tree changes
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_4_cancel_message_lists_draft_paths
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'buildCancelMessage via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with two
    draft ids and store docs/acceptance-criteria: each docs/acceptance-criteria/<id>.yaml path appears
    in the message.'
  proves_clause: the workflow exits with a message listing the uncommitted file paths
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_4_cancel_message_gives_anchored_checkout
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'buildCancelMessage via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with an
    authoring worktree path: the message carries git -C "<worktree>" checkout -- <store>/ and the commit
    hint, and warns that untracked files need an explicit delete.'
  proves_clause: the user can inspect the files, manually commit them, or discard them with a standard
    git checkout
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_4_gate2_cancel_keeps_stage1_commit
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: discrimination
  description: 'Workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py) resumed
    at gate-ba with cancel, the PO commit present in the mocked git log: committed_acs holds the PO ids
    and no git reset or git revert dispatch is recorded.'
  proves_clause: the stage 1 commit remains in git history (it was already committed)
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - cancel at gate 2 reverts or resets the stage 1 commit
- name: test_acd_300g_4_gate2_cancel_drafts_are_stage2_only
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'Same gate-ba cancel run via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py):
    acs_as_drafts holds exactly the business-analyst ids and none of the committed PO ids.'
  proves_clause: only the stage 2 draft files remain uncommitted on disk
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_4_cancel_message_separates_committed_and_drafts
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'buildCancelMessage via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with committed
    [ACD-T-1] and drafts [ACD-T-1a]: the ''Committed ACs from prior stages'' line names only ACD-T-1 and
    the uncommitted-drafts section names only ACD-T-1a.'
  proves_clause: the workflow exit message distinguishes between "committed ACs from prior stages" and
    "uncommitted draft ACs from the canceled stage"
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - committed and draft ids are merged into one list
  - the committed ids are listed under the uncommitted-drafts heading
