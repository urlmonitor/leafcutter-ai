title: "Page-level specs only describe what is unique to that page"
component: ac-store
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Page specs cover only what differs — common behavior is inherited.

  When a page uses a shared pattern, its own AC captures only the page-specific
  details: the entity type, column names, custom copy, or unique interactions.
  All shared behavior comes from the referenced pattern definition. If a page
  deviates from the pattern on one aspect, that deviation is a separate,
  page-specific AC — the pattern itself is never partially overridden inline.
