risk_surface: safety
criteria: |
  Given a project "shop" whose workspace maker made, each holding nothing unsent:
    - a workspace for the feature "alpha", on the line of work "feature/alpha",
    - a workspace for the feature "alpha-v2", on the line of work "feature/alpha-v2",
    - a workspace for the fast-lane fix "tq-200d-3", on the line of work "fastlane/tq-200d-3",
  And a workspace for the feature "beta" holding one unpushed commit and one uncommitted
    file,
  And each of the four was first looked up through the maker by the same name used below,
    and its answered location recorded,
  When clearing is requested by naming the work, never by giving a location:
    "alpha" by its kind "feature" and short name "alpha",
    "tq-200d-3" by its line-of-work name "fastlane/tq-200d-3",
    and "beta" by its kind "feature" and short name "beta",
  Then "alpha" and "tq-200d-3" are each answered cleared, and each answer states the
    location that was cleared, equal to the location their lookup answered,
  And no folder remains at either of those two locations,
  And "alpha-v2" is identical before and after,
  And "beta" is refused exactly as a clearing request giving its location is refused:
    the refusal names the unpushed commit by identifier and the uncommitted file by path,
    and "beta" is identical before and after,
  And every request ends with exactly one answer and asks no question.
