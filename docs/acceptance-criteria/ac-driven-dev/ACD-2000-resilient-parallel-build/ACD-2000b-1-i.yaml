    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "With one machine-claimed and one human-marked-in-progress requirement in the same store, asserts the scan reports them distinguishably rather than collapsing both into one excluded bucket."
test_rationale: "Two traps decide the shape of these tests. First, enumerating writers by grepping for assignments to the field cannot see a writer that reaches the value through a helper -- which is how every writer reaches it today, via _update_ac_work_status -- so each test runs the REAL housekeeping, hook and scan code over a real store and asserts the observable outcome. Second, check_ac_governance.py is fail-open on unexpected exceptions, so a unit test of a lookup predicate would pass while the deployed gate silently skipped the check; only executing the hook itself distinguishes a wired gate from an inert one. The unclaimed-requirement test is paired with the claimed one so a refuse-everything implementation cannot pass."
