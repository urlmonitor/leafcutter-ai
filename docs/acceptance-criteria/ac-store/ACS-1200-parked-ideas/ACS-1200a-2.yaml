title: "The commit-time back-link check passes a parked tree with nothing skipped"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200a.yaml
criteria: |
  Given a parent record KM-200.yaml carrying parked: true and a non-empty
    parked_reason, with covered_by set to an empty list,
  And six child records KM-200a.yaml through KM-200f.yaml, none of which is
    listed in KM-200's covered_by,
  And all seven files staged for commit,
  When the parent-back-link check is executed as a process against that staged
    set, with no SKIP variable set for it and no hook disabled,
  Then the process exits 0,
  And it reports no violation for any of KM-200a through KM-200f,
  And its output names KM-200 once as a recognised parked record, together with
    the reason recorded on that record, so the exemption is visible in the run
    rather than silent,
  And the run is distinguishable from a run in which the check did not execute:
    the same staged set with the parked marker removed from KM-200.yaml exits
    non-zero and reports six violations,
  And a test that only inspects the check's source text for the word "parked",
    or for the presence of an exemption branch, does not satisfy this criterion:
    coverage requires executing the check as a process and asserting its exit
    code and its output.
