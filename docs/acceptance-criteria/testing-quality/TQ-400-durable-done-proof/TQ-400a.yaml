title: "Every finished item is re-examined, not just the ones somebody happens to touch"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  The whole backlog is re-checked, not only the records in front of you today.

  Today the honesty check only ever looks at the handful of records caught up in
  the change you are making right now, so work finished months ago is never
  looked at again. This widens the check to every finished item in the backlog,
  so nothing stays unexamined purely because nobody touched it.
