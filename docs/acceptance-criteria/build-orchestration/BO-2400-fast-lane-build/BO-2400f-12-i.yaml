it_requirements:
  config_schema_fragment:
    fast_lane_refusal_is_inert:
      type: object
      description: "The refusing branch performs no store write of any kind. It does not call the claim writer, the done marker, or the release writer, and it does not rewrite any acceptance-criteria file. Its only outputs are the terminal refusal payload and the process exit status."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
