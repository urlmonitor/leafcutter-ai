it_requirements:
- Use LangGraph as the first workflow runtime with durable local storage; restart survival must not rely
  on MemorySaver, a hosted service or Postgres.
- Checkpoint serialization must be versioned and preserve exact IDs/revisions, budgets, review count,
  claim generation and next safe action.
- Checkpoints do not undo tools, Git or remote publication. Each side effect needs stable operation identity
  plus reconciliation; uncertain calls remain blocked until live process/session and repository/remote
  outcomes are known.
- Resume must fence stale owners and reconcile remote branch/PR identifiers before retry, with no exactly-once
  claim based solely on graph replay.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300b-4 (data handoff, not an additional build-order prerequisite): WorkspaceClaim
  {claim_id:string, owner_id:string, run_id:string, feature_id:string, canonical_worktree_path:string,
  branch:string, target_ref:string, target_sha:string, source_revision:string, generation:integer}.'
test_spec:
- name: test_background_worker_new_process_recovers_same_run_without_counter_reset
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Terminate after saved checkpoint and restart from durable local storage; assert same worktree,
    evidence, next step, attempts/time/review count.
  covers:
  - ACD-1300e-2
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_uncertain_agent_side_effect_is_reconciled
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Crash after file/Git effect before result persistence; restart does not rerun blindly or
    admit stale writer, instead reconciles or exposes blocker.
  covers:
  - ACD-1300e-2
- name: test_background_worker_uncertain_pr_success_does_not_duplicate
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: criterion
  description: Simulate PR created remotely then lost response/checkpoint; restart locates existing proposal
    by operation/run/branch identity and does not issue another create.
  covers:
  - ACD-1300e-2
- name: test_background_worker_recovery_works_without_cloud_database
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With all hosted state services unavailable, local checkpoint recovery succeeds; corrupted/unsupported
    checkpoint produces explicit blocker, not a clean new run.
  covers:
  - ACD-1300e-2
