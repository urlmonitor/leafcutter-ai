notes: |
  AUDIT PERFORMED BEFORE AUTHORING (per this record's own build instructions):
    - Repo-wide grep for the bare name `classifyWorkspaceSetupPermission` returns
      exactly one hit: the definition at plan-feature.js:2010 (line number at time
      of audit, 2026-09-23; the file has grown since BO-1500f-1's 2026-09-14 note
      cited line 1929). All other repo-wide mentions of the name are prose in
      docs/known-issues and in BO-1500f-1.yaml's own notes -- never code, never a
      test assertion, never a call.
    - The string "resolve-workspace-setup-permission" (the dispatch label embedded
      inside the dead function's own parseAgentJson call) appears extensively
      elsewhere in the test suite, but exclusively as the NEGATIVE assertion target
      of tests confirming that label is no longer dispatched anywhere -- e.g.
      unit_tests/workflows/test_acd_2100b_5.py, test_acd_2100b_4.py,
      test_acd_2100b_1.py, test_acd_2100c_2.py, unit_tests/_workflow_engine_harness.py,
      unit_tests/_plan_feature_e2_runner.py. None of these assert the function
      classifyWorkspaceSetupPermission itself exists; they assert about the run's
      own dispatch record, which the dead function cannot affect since nothing
      calls it.
    - No registry, map, or dispatch table in plan-feature.js references the
      function by name; grep for the name found only the definition line.
    - plan-feature.js contains no module.exports/exports statement anywhere, and
      the E2 engine (ADR-030) contextifies the workflow body with exactly agent,
      parallel, pipeline, phase, log, args, workflow, budget -- no module loader,
      confirmed by reading the file rather than assumed.
    - The deployed copy at .leafcutter/workflows/plan-feature.js carries the
      identical dead definition at the same line -- confirmed to be a build-output
      mirror, not touched by this record.
    - parseAgentJson(), called once inside the dead function, is a shared utility
      with 30+ other call sites in the same file and is explicitly NOT in scope for
      removal.
  CONCLUSION: genuinely unreachable dead code. No dynamic reference, no ambiguous
  test, no export. Proceeding with removal (branch: safe to remove).

