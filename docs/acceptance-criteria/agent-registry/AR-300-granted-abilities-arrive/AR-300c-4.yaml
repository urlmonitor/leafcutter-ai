  agent: approve_acs
  date: '2026-10-01'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  AUTHORED BECAUSE AR-300c DECLARES A reference-doc DOCUMENTATION TRIGGER. The
  parent L1 sets documentation_triggers to reference-doc, so a documentation
  criterion is required alongside the behavioural ones rather than optional.

  THE THIRD CLAUSE IS THE ONE THAT MATTERS. A new reference section that states
  the new rule while the old surfaces still describe the old one leaves an
  author with two correct-looking instructions -- which is the same defect as
  two records of the grant, relocated to the documentation plane. The sweep for
  surviving instructions is the criterion; adding a section is the easy part.

  NO ASSIGNED AGENT ON PURPOSE. Agent assignment is the IT Product Owner's lane;
  this criterion is behavioural and is left unassigned, like its siblings.
