criteria: |
  Given a workspace "sq-3" whose three commits reached the main line only as one combined
    commit with the same content, and whose own line was then deleted on the shared
    project when its pull request was merged,
  And a workspace "gone-1" whose own line was deleted on the shared project without ever
    being merged, so its two commits are on neither the shared project nor the main line,
  And neither workspace holds an uncommitted change,
  When the landed-work pass is run,
  Then "sq-3" is cleared and no folder of it remains,
  And "gone-1" is identical before and after,
  And the answer lists "gone-1" as kept for holding unsent work, naming its two commits by
    identifier.
