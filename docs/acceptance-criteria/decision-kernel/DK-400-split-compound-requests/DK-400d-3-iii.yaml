criteria: |
  Given the split-bounds decision question found mid-run at work-item depth 1, offered as
    parts p1 to p3,
  When human:user rejects the split,
  Then that work item goes ahead as one decision, and the run carries on with its other work,
  And the run is not blocked by the rejection,
  And the split's state is kept whole (rejected_kept_whole),
  And when the item found mid-run is a research request instead, a rejection lets it go ahead as one
    research step that returns findings, and the split names no decision record.
