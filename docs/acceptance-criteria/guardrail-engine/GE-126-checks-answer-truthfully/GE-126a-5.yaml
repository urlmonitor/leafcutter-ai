notes: |
  SATISFIES THE reference-doc LEG of GE-126a's documentation_triggers. The how-to leg is
  GE-126a-4.

  ONE PLACE IS THE REQUIREMENT AND IT IS NOT STYLISTIC. ACS-100i-9 is the precedent: a
  rule enforced in two places needs one statement of it and one message format so the
  two are identical rather than merely similar. A contract restated in prose beside the
  behaviour that implements it drifts, and this component has the drift to prove it.

  NAMING ONE CHECK RATHER THAN THE FAMILY IS DELIBERATE. Only one check's argv contract
  is being repaired by this L1. The reference must not assert the contract already holds
  across the family — GE-126e is what establishes how many members honour it. Widen this
  reference when that census reports rather than in anticipation of it.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

