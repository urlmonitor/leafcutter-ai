notes: "Verified defect, reproduced twice on 2026-08-13 while marking GE-118a-1 and GE-118b done. Chicken-and-egg: the coverage gate runs pytest without AC_ENFORCE_STRICT=1, the pytest_ac_enforcement plugin xfail-masks any test whose covered AC is not yet work_status: done, the AC under consideration is by definition still todo, so its genuinely-passing '# covers:' tests are reported as xfail and the gate refuses with exit 3. Adjacent but distinct existing ACs: BO-2500a-3 (positive eligibility when covers-tests pass) states the intended outcome but not this interaction; BO-2500a-2-i (xfail/skip is not passing) is the constraint the fix must not violate. Neither describes the masking loop, and both sit in build-orchestration rather than the ac-store tool surface."
