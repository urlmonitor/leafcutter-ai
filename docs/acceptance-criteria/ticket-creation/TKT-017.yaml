id: TKT-017
components:
  - ticket_creation_pipeline
readiness: reviewed
priority: high
title: "A generated epic's tickets depend on files that exist, whichever route generated it"
component: ticket-creation
status: active
criteria: |
  Given a goal AC whose leaf criteria depend on one another,
  When an epic is generated from it and assembly renames each ticket with the
    numeric prefix that records its build order,
  Then every dependency a ticket declares names a file that exists in the epic
    folder,
    And it names the prefixed filename assembly actually produced, not the
      unprefixed name the ticket had before it was moved,

  And given the same goal generated through the other entry point -- the one that
    takes an explicit list of criteria rather than walking a goal's subtree,
  When its epic is generated,
  Then its tickets' dependencies resolve on the same terms, because a reader
    cannot tell from the result which route produced it and should not have to.

  So a generated epic is committable, and the ordering it records is real rather
  than a set of names that happen to look plausible.
