notes: |
  BO-3100b-1 establishes the verdict; this AC establishes that the verdict has teeth. The
  parent L1 is explicit that the empty result is "stopped from finishing quietly and is made
  to try again" — so a judgement that only logs, or that records the step as complete while
  noting a concern, does not satisfy it. The criterion is written against the attempt to
  finish because that is the moment at which a veto is the difference between an advisory
  observation and enforcement.

  THE SECOND SCENARIO GUARDS AGAINST DOUBLE-COUNTING. A retry implemented by re-entering the
  step without discarding the first attempt's record produces two completed steps for one
  piece of work — the same skip-branch double-recording shape CLAUDE.md records from
  EPIC-InFlightVisibility. "Exactly one" is the load-bearing word.

  THE THIRD SCENARIO KEEPS THE RETRY VISIBLE. A retry that leaves no trace turns a chronic
  parking problem into an invisible slowdown; the record is what lets anyone notice that a
  particular step parks every time.

  BOUNDARY: BO-210's pre-commit safety net re-dispatches a coder after a hook FAILURE and
  assumes the coder ran. This covers the case where it never ran at all. The two must not be
  merged, and a re-dispatch triggered here is not a hook-failure re-dispatch.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", the covering test
  must run the real step lifecycle and observe that a second execution occurred and what the
  record contains, not assert that a veto call appears in the source.

  IT-PO ENRICHMENT NOTE (2026-08-26). One boundary the BA could not have set: an `undetermined`
  verdict from BO-3100b-1 (the snapshot could not be taken) must NOT enter this retry loop.
  Retrying on an unknown burns the attempt budget on a condition retrying cannot fix, and would
  convert a diagnosable transport fault into a chronic-parker failure pointing at the wrong
  thing — the misdirection cost KI-BO-018 records. It halts per BO-3200e-2 instead.
