readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run in which every step completed except one, which stopped short,
  When the run returns its outcome,
  Then the single overall value the run leads with — the one a caller routes on
    without reading anything else — is not a success value,
    And a caller reading only that value cannot take the run for successful,
    And the step that stopped short is named in the same output, so nothing is lost
      by the leading value no longer reading as success.

  Given a run in which every step completed and none stopped short,
  When the run returns its outcome,
  Then the leading value is a success value,
  So the leading value distinguishes the two runs rather than always warning.

  Given a run in which one step stopped short,
  When the leading value, the run's own list of completed steps, and the sentence
    the run states about itself are read together,
  Then all three agree: none of the three reports success while another denies it,
    And the stopped step is absent from the completed list in the same output whose
      leading value is not a success value.

  Given a run in which a step stopped short and a later step then ran and completed,
  When the run returns its outcome,
  Then the leading value is still not a success value,
  So later success does not overwrite an earlier stop.
