readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an outstanding conflict,
  When a verdict is recorded against it that the finished claim was false,
  Then the requirement returns to unfinished by the same transition used when a
    finished record loses its proof, carrying the reason and the date,
    And the verdict is recorded against the conflict's identity.

  Given an outstanding conflict,
  When a verdict is recorded against it that the fault was already fixed,
  Then the fault entry is retired on evidence, and the verdict is recorded against
    the conflict's identity.

  Given an outstanding conflict where neither record is wrong and the requirement
    promised more than was built,
  When a verdict of narrowing is recorded,
  Then the requirement's wording is narrowed,
    And the narrowing is recorded as an amendment stating why,
    And it is not recorded in a form that reads as an ordinary edit,
  So a governance change is never mistakeable for a silent relaxation.

  Given an outstanding conflict,
  When a verdict is recorded that is none of those three,
  Then it is refused, naming the four states a conflict may be in.

  Given an outstanding conflict recorded as not yet decided,
  When the reconciliation runs again,
  Then the conflict is still listed as outstanding carrying that state,
  So not-yet-decided is a recorded state and never the absence of one.
