notes: |
  This is the BLOCKING enforcement half (user-confirmed: always block on a real
  violation; never downgrade to warn). The hook joins the existing commit_guardian
  framework alongside the other check_ac_*.py hooks. IT-PO: standard fail-open on
  internal script error still applies (crash/parse/git failure -> exit 0 + stderr
  warning) — that is error-handling hygiene, not a relaxation of the block-on-
  violation decision. Pair with ACS-900c (the message) and ACS-900d (the clean
  pass) so this AC owns ONLY the block decision, not the message text or the
  reconciliation rules.
