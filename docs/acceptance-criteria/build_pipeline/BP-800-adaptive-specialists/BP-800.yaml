criteria: |
  Project-adaptive agent generation — zero-config language specialists.

  Instead of maintaining a fixed list of language-specific agents, the system
  discovers what your project uses at build time and provisions a specialist
  for each — pre-loaded with behavioral best practices for that language and
  framework. You add a Go service or a graph database, and the next build
  gives you an agent that knows how to work in that world. No manual agent
  configuration, no stale templates for languages you stopped using.
