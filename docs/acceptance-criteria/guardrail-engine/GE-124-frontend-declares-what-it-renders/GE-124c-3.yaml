id: GE-124c-3
readiness: approved
priority: high
title: "An unstaged file is not examined at all, and a fully declared change passes"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given `components/shell/logo.tsx` is an in-scope screen component with no
    component-level declaration
  And it is not in the staged set
  When the commit-tier declaration check runs
  Then no finding of any kind is reported for `components/shell/logo.tsx`
  And the commit is not rejected on its account
  And no pass record is produced for it either — an unstaged file is not
    examined, and not examined is not passed

  Given the staged set contains `components/flows/realization-badge.tsx`, whose
    component-level declaration names UXP-607 and UXP-607-1
  And it pins two elements, and every declared and pinned id resolves
  When the commit-tier declaration check runs
  Then the commit proceeds
  And one pass record is produced for that file naming the criteria it declares
    and the number of pinned elements

  Given `components/shell/logo.tsx` is later edited and staged, still with no
    component-level declaration
  When the commit-tier declaration check runs
  Then it is examined on that run and reported as missing its declaration

  Given the staged set contains no in-scope screen components at all
  When the commit-tier declaration check runs
  Then the commit proceeds
  And no finding of any kind is reported
