assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "The default must be fail-safe: when either toggle is false or absent, the phase must NOT be added."
  - "Coverage must exercise all three negative states (a), (b), (c) plus the positive both-on case, so no single-toggle path can silently enable the phase."
  - "Added 2026-08-13: coverage must also assert the record asymmetry — state (a) produces exactly one skipped record, states (b) and (c) produce none. A test that asserts a record in all three states is wrong and will drive an implementation that records gates nobody requested."
delivers_to: null
expects_from: null
origin_agent: business-analyst
created: 2026-07-10
amended_by:
  - reason: resolve-contradiction-with-BP-014
    note: "2026-08-13 — amended by the business-analyst on the user's explicit decision. This AC previously required only that the agents map contain NO live-surface-tester key in states (a), (b) and (c), with no record of the absence. That contradicted BP-014 (build_pipeline, readiness: reviewed), which requires the phase to emit status: skipped when live_surface_test is not true or live_surface_testing is disabled. The user decided the loud-skip behaviour wins. The original intent is preserved unchanged — the key stays out of the map in all three states — the amendment adds only that in state (a) the absence must be RECORDED. Title updated to match."
  - reason: ba-analysis-requested-set-boundary
    note: "2026-08-13 — the amendment deliberately requires a skipped record in state (a) ONLY. States (b) and (c) are cases where the ticket never requested the check, so per BO-2900f-1 they must produce no record. Applying the loud-skip rule to all three states would record every gate on every ticket and bury the signal. A literal reading of BP-014 ('skipped when live_surface_test is not true OR live_surface_testing is disabled') would cover states (b) and (c) too; that reading is rejected here as over-broad — flagged to the user in the BA sign-off."
