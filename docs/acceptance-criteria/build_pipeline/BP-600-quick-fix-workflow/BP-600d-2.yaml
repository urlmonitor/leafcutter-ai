  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - "python-coder must be dispatched via the Agent tool at depth 1 with diagnosis, test file path, and target file path as prompt context"
  - "Workflow must capture the list of files actually modified by the coder for scope-check in BP-600e-1"
