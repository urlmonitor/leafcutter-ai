id: BP-300e-1-ii
components:
  - build_pipeline
title: "Brace and hash characters inside string values do not fool the extractor"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
work_status: done
criteria: |
  Given a helper agent returns a valid JSON object in which a string value literally
    contains a '{', '}', or '#' character (for example a description reading
    "use {placeholder} — see ## notes"), surrounded by explanatory prose,
  When the workflow reads the agent's reply,
  Then the extraction treats those characters as ordinary text inside the string and
    does not mistake them for the object's own structural braces or for a prose
    delimiter,
  And the workflow recovers the intended object with the string value intact.
depends_on:
  - BP-300e-1
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Brace/bracket depth counting must ignore '{', '}', '[', ']' that appear inside JSON string literals and must honor backslash escapes; '#' carries no structural meaning to the scanner."
  - "The tolerant reader stays a pure, synchronous, dependency-free function; confine try/except to the JSON.parse boundary only."
  - "Behavior must be verified by a runtime behavioral test through the vm.Script replay harness with an object whose string values embed '{', '}', and '#', not a source string-scan."
delivers_to: null
expects_from:
  ac_id: BP-300e-1
  contract: >-
    Inline tolerant reader parseAgentJson whose scanner is string-literal- and
    escape-aware (does not count structural characters inside JSON strings).
