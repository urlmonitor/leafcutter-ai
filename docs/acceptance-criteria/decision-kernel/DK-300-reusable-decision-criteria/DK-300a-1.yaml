criteria: |
  Given the published decision records dec-4673055ef54113d5, dec-acdfd972fcaca478 and dec-d53e1c52cd47c832 each carry the criterion crit.small_slice, worded three different ways,
  And the run history in Langfuse holds the question "Can it be put in place with a small change?" from four kernel runs: run-1dec9568f85745e4 (partial), run-35ecc5ce9780442d (completed, its decision dec-e4c6a3e133b9694b staged and never published), run-5bd2023780654292 (failed) and run-de1c989117414c1c (waiting for a person),
  And no criterion category exists yet,
  When a person runs the offline criteria mining,
  Then crit.small_slice is reported with three published-record sightings, one per decision, each naming its decision id, its criterion id and the wording that decision carries,
  And "Can it be put in place with a small change?" is reported with four run-history sightings, one per run, each naming its run id, its run status and its Langfuse trace id,
  And the sightings from the failed, the waiting and the never-published runs are among them,
  And every candidate category the mining proposes has proposed_by criteria_mining and approval_status proposed, no approver, no staging run and no place in the published library.
