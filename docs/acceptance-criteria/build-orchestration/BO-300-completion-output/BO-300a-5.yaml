id: BO-300a-5
components:
  - build_orchestration
title: "The epic's work is re-read before the drive reports, and anything added after planning is named"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic whose set of work is enumerated once, when the drive fixes its plan,
    And three further pieces of work are added to that epic after the plan is fixed
      and before the drive ends,
  When the drive produces its completion output,
  Then the epic's set of work is read again at that moment and compared with the set
    the plan was built from,
    And each of the three that was never planned is named in the output as discovered
      after planning and not built,
    And the output does not state that the epic is complete,
    And the output states what the operator should do about them,
  So an epic that grows during a drive never loses the additions from both the built
    list and the outstanding list at once.
depends_on:
  - BO-300a
