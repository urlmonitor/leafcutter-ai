id: DK-200c-1
title: "A completed search with no matching evidence remains an honest empty outcome"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given permitted repository sources can be examined but contain no evidence matching the request,
  When initial enrichment completes,
  Then the result identifies that no evidence was gathered,
  And it records which sources were consulted,
  And it passes that outcome onward without inventing repository facts or opening its own human interaction.
depends_on: [DK-200c]
covered_by:
  - "DK-200c-1-i"
  - "DK-200c-1-ii"
  - "tests/kernel/enrichment/test_context_enrichment.py::TestContextEnrichmentEvaluation::test_each_labelled_case_meets_the_context_contract"
  - "tests/kernel/enrichment/test_context_enrichment.py::TestContextEnrichmentBoundaries::test_unrelated_words_do_not_select_arbitrary_repository_text"
implemented_by:
  - "kernel/context_enrichment.py"
  - "kernel/enrichment_sources.py"
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "A completed search with no relevant evidence must identify no_evidence rather than fabricate facts or label a failed search successful."
  - "Consulted sources and limitations must remain available to downstream handling even when evidence is empty."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_each_labelled_case_meets_the_context_contract
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "The unrelated-repository labelled case reports the expected empty evidence, status and consulted-source/limitation facts without altering claims or inputs."
  - name: test_unrelated_words_do_not_select_arbitrary_repository_text
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: unit
    angle: criterion
    description: "Unrelated text yields no evidence; adding an actually matching fact changes production gathering to return that evidence."
test_rationale: "A positive matching counterpart prevents an always-empty gatherer from satisfying the no-evidence criterion vacuously."
