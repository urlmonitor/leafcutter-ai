id: BO-2400c-6-ii
components:
  - build_orchestration
  - ac_store
title: "A caller that supplies no record set still walks the tree correctly"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a caller that walks the acceptance-criteria tree without holding a record set of
    its own — the standalone command-line and store-scanning callers,
  When it walks the tree,
  Then the walk builds the record set itself, as it always has, and returns the same
    answer it returned before the consolidation,
  And so reusing a caller-supplied record set is an option offered to callers that
    already hold one, never an obligation placed on callers that do not.

  Given every other caller of the same tree walk in the repository,
  When the consolidation lands,
  Then each of those callers has been examined in the same change and either supplies
    the record set it already holds or is recorded as having none to supply,
  And no caller is left silently paying a full re-read of the store inside a loop while
    the defect is reported closed.
depends_on: [BO-2400c-6]
