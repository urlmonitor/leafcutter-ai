notes: |
  Documentation AC for GE-130a's reference-doc trigger ("the hooks reference catalogue matcher
  column must reflect the widening"). The first clause is a mechanical agreement with the shipped
  settings, not a prose check -- a catalogue that is already stale (it omits
  enforce_commit_delegation, per BO-3200f-2-iii notes) is the reason.

  2026-09-17 (user decisions): the task-lock guard's entry describes the caller-identity exemption
  of GE-130a-4, not "the workflow's own steps"; the three after-the-fact outcomes are described for
  the documentation guard and guide-read guard only (GE-130c-2 SCOPE). The negative clause keeps a
  writer from copying the attribution wording into the task-lock guard's entry. Old criteria
  quoted in amended_by.

