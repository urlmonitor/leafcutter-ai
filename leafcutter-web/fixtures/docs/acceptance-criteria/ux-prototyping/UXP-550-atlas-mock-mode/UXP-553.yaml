estimated_complexity: S
it_requirements: |
  The mock-mode decision in leafcutter-web/lib/data/mock.ts reads LEAFCUTTER_MOCK as
  the DEFAULT, then applies any runtime override (cookie "mock") which takes precedence.
  Resolution order: production lock > runtime override > LEAFCUTTER_MOCK env default.
