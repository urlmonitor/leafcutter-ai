change_target: code
risk_surface: contract_boundary
notes: |
  WHY THIS IS A SEPARATE CRITERION AND NOT A LINE IN TKT-600b-1. Marking the phase
  "signed off" clears the halt just as effectively as marking it excluded — the
  completion gate treats both as satisfied. It is the phantom sign-off this project
  exists to prevent: a phase that never ran, recorded as having passed, in the very
  record the completion gate trusts. Without this criterion stated separately and
  testably, "signed off" is an available and slightly simpler way to pass TKT-600b-1.

  THE CHECKLIST ROW GOES WITH THE STATUS. Two failure shapes, both real. An excluded
  agent that keeps its checklist row leaves an unticked box that reads as outstanding
  work to a human and is rejected outright by the sign-off parity guard. An excluded
  agent that keeps a row AND gets it ticked is the phantom sign-off wearing a second
  coat. Both are excluded by requiring the row's absence alongside the status.

  PRECEDENT, NOT INVENTION. The hand correction of all 25 tickets (9682d6adf) made
  exactly this distinction, and the register records the reasoning: excluded means
  "explicitly excluded from this ticket", which is precisely what the drive does; signed
  off would have been false. This criterion makes the generator do by construction what
  a person had to do by hand 25 times.
