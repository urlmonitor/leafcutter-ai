  - path: docs/architecture/adrs/ADR-029-adr-number-collision-prevention.md
    relationship: context
    status: exists
    relevance: "Carries the free-number rule the guide must state: a number is free only when it has neither a file nor a citation. Reusing a number that text still cites turns a dangling reference into a confidently wrong one."
  - path: docs/how-to/numbering-a-new-artifact.md
    relationship: related
    status: planned
    relevance: "GE-120b-3's guide, which covers obtaining a number for a NEW artifact. This one covers resolving a clash on an EXISTING one; the two must cross-link rather than each grow a copy of the other's allocation section."
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "Write the reference-repair half FROM THE REPAIR GE-120e-1 ACTUALLY PERFORMS, not from first principles. That repair moves a record cited by nine coverage tags in one test module, by a guard source file and by a release note, while a second release note cites the same identifier meaning the other claimant — the full three-way citation problem in one worked case. Sequence this AC after GE-120e-1 so the procedure is a transcript rather than a guess."
  - "The which-claimant-moves criterion must be the same one GE-120a-3's reference document states and the same one GE-120c-2's block message emits. Three surfaces, one rule; if the guide invents a fourth answer the blocked author is worse off than with no guide."
  - "The dated-historical-record clause must reproduce the existing decision rather than restate it loosely: `scripts/adr_refs.py` already refuses to repoint citations in closed records on the grounds that doing so would make the record claim something that did not happen. Name that behaviour and its rationale; the guide's reader needs to know it is a rule, not an omission."
  - "The find-every-citation step must warn that a bare identifier can be genuinely ambiguous while the collision is unresolved — a search for the contested identifier returns citations meaning BOTH artifacts, and rewriting them uniformly is how a repair creates a worse problem than it fixes. GE-120e-1's case is exactly this."
  - "The end-to-end claim ('a person following the guide reaches a state where the gate passes') must be verified by executing the guide's steps against a real clash and then running the gate, not by review. This is the documentation-verifier phase's job and it needs a real clash to run against — sequencing after GE-120e-1 supplies one."
  - "Doc frontmatter, description and length are mechanically enforced on `docs/**/*.md`; index reachability comes from the regenerated `docs/INDEX.md` after build.py, not from a hand-added link."
test_required: false
test_rationale: |
  change_target is docs and the deliverable is prose; there is no executable behaviour of its
  own to assert. The guide's one falsifiable claim — that following it end to end reaches a
  state where the numbering gate passes — is verified by the documentation-verifier phase
  executing the steps against the real clash GE-120e-1 repairs and then running the gate, which
  is a workflow verification rather than a unit test. The rule-consistency claims are pinned
  from the code side by GE-120c-2's output assertions, so asserting them again here would create
  a second definition of the message that could drift from the first.
