    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  A CI job invokes the runner (TQ-200b-1) across all in-scope eval sets and compares
  golden scores to recorded baselines; a drop fails the job. Held-out scores are
  reported for visibility. The gate should be a required check (parallels the
  BP-1200 / TQ-100 test-gate discipline) so it cannot be bypassed. Baseline storage
  and update policy is part of this AC.
