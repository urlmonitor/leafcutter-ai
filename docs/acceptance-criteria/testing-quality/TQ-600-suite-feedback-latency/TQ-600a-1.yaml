      59.8s deploy and the 63%-concentration finding are not.
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - >-
    THE FIXTURE MUST BE REGISTERED WHERE A WHOLE-SUITE RUN LOADS IT, AND THE
    LOAD-BEARING REGISTRATION MUST BE NAMED. Verified at enrichment: this repo
    has NO root conftest.py and no unit_tests/conftest.py — the only conftest
    files are per-directory (e.g. unit_tests/portability/conftest.py). A fixture
    defined in a per-directory conftest is invisible to the other test files
    holding the 77 measured sites, so it would be shared across a fraction of the
    run while reading as shared across all of it. Register the fixture and its
    deploy signal in a surface the whole run loads (a plugin named in pytest.ini,
    or a root conftest), enumerate every place it is registered, and state which
    one actually gates.
  - >-
    ONE PRODUCTION PER RUN ACROSS WORKERS IS NOW A CRITERION, NOT AN OPEN
    DECISION. The first enrichment pass left this as a choice between sharing
    across workers and reporting N honestly; the rewritten criteria took the
    first branch, so only the mechanism is open. A pytest session-scoped fixture
    runs once PER WORKER under pytest-xdist, so the plain session fixture does
    NOT satisfy these criteria once TQ-600b-5 makes parallel the default:
    production must be serialised on a cross-process lock, and the layout must
    live in a run-scoped directory derived from the workers' COMMON base
    temporary directory rather than from each worker's own. TQ-600b-5 carries
    the same decision; neither AC may assume the other resolved it.
  - >-
    THE ROOT IS PUBLISHED ONLY AFTER THE LAYOUT BEHIND IT IS COMPLETE. A waiting
    consumer must be unable to observe a root whose layout is still being
    written — produce into a private location and publish atomically, or gate
    the handout on a completion marker consulted under the same lock. A path
    that exists is not evidence that the deploy behind it finished, and a
    half-read layout surfaces as a mysterious assertion failure in an unrelated
    test on another worker.
  - >-
    THE DEPLOY SIGNAL FIRES ON EXECUTION, NOT ON HANDOUT. This AC owns the single
    point at which a `python scripts/build.py --target-dir <path>` subprocess is
    really executed (measured 59.8s) and the signal emitted there; TQ-600a-6 owns
    the figure derived from it. Emit on execution only, and make the signal
    reachable from the whole run rather than from the producing worker alone —
    a signal visible only inside the worker that produced the layout leaves
    TQ-600a-6's whole-run clause unsatisfiable from here.
  - >-
    Production must be lazy, on first demand — see TQ-600a-1-i. An eagerly
    created shared layout satisfies every other clause here and taxes every
    single-test debugging run by the full 59.8s.
  - >-
    Deploy failure must not be swallowed. The deploy is a subprocess, so it is
    external I/O under the project error handling policy: wrap it, log at WARNING
    or above, and raise a typed error. Never hand out an empty or half-written
    layout (TQ-600a-1-ii).
  - >-
    The new test directory `unit_tests/suite_performance/` needs an `__init__.py`
    to match every other directory under unit_tests/; omitting it changes
    collection behaviour relative to its siblings.
  - >-
    THE STANDING RULE IN CLAUDE.md GOES STALE THE MOMENT THIS LANDS. Verified at
    enrichment: the sentence "Until that fixture exists, the prohibition alone
    applies" sits at CLAUDE.md line 416, inside the rule authors actually read.
    The reconciliation is TQ-600a-7's to make — it was a caveat at the first
    enrichment pass and the BA has since authored the AC — so this record's
    obligation is only sequencing: this must not reach main in a state that
    leaves the rule teaching authors to do nothing rather than to declare.
delivers_to:
  - agent: python-coder
    ac_id: TQ-600a-1-i
    contract: >-
      A shared reference layout produced on first demand only, and the deploy
      signal that fires when — and only when — production really happens. A
      selection with no consumer must produce no layout and fire no signal; the
      figure that makes that observable is TQ-600a-6's.
  - agent: python-coder
    ac_id: TQ-600a-1-ii
    contract: >-
      The single deploy's result cached as either success (a layout root path) or
      failure (the deploy's captured stdout/stderr and exit status), so every
      waiting consumer raises from the cached failure and the attempt count stays
      at 1.
  - agent: python-coder
    ac_id: TQ-600a-2
    contract: >-
      A routing decision point at fixture-request time that can refuse to hand the
      shared layout to a declared mutator, plus the unshared-path count the
      relational bound in this AC's fourth clause consumes.
  - agent: python-coder
    ac_id: TQ-600a-5
    contract: >-
      The shared reference layout and the routing decision point at
      fixture-request time, which TQ-600a-5 supplies the per-test selector for.
      The decision point must be reachable before the layout is produced, so an
      undeclared or mutator-declared test never triggers the shared production
      merely by being collected.
  - agent: python-coder
    ac_id: TQ-600a-3
    contract: >-
      The layout root path and the instant the single deploy finished, so the
      contents record of TQ-600a-3 is taken before any consumer runs.
  - agent: python-coder
    ac_id: TQ-600a-4
    contract: >-
      The converted set — the identity of every test moved from deploying its own
      copy to consuming the shared layout — as the population TQ-600a-4's per-test
      outcome comparison is sized against.
  - agent: python-coder
    ac_id: TQ-600a-6
    contract: >-
      A single point at which a real package deploy is executed, and a signal each
      time one is, so TQ-600a-6 counts executions rather than handouts of the cached
      layout. Under several workers the producer must make the whole-run figure
      reachable, not only each worker's own, since that is the only way the
      "once per run, not once per worker" claim above stays auditable after the fact.
  - agent: documentation-expert
    ac_id: TQ-600a-7
    contract: >-
      The shared reference layout as delivered, and the exact means by which a
      declared reader obtains its root — the step the guidance teaches an author
      to take, quoted from the implementation rather than paraphrased from
      intent.
expects_from: null
test_spec:
  - name: test_tq600a_1_a_selection_of_read_only_consumers_deploys_the_package_once
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A child pytest session over at least three read-only consumer tests
      executes exactly one real `build.py --target-dir` subprocess, observed
      independently of anything the run reports about itself.
  - name: test_tq600a_1_every_consumer_receives_the_identical_layout_root
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Two consumers in the same session that ask for the layout root receive the
      identical path string, not two paths whose contents happen to match.
  - name: test_tq600a_1_a_run_spread_across_several_workers_still_executes_exactly_one_deploy
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "python -m pytest -n <N> (child session over read-only consumers on several workers)"
    description: >-
      THE DESCRIPTOR THE REWRITTEN SECOND CLAUSE ADDS, AND THE ONE THE EARLIER
      CONTRACT COULD NOT HAVE CARRIED. With more than one worker, the number of
      `build.py --target-dir` subprocesses observed across ALL workers is exactly
      one — counted by the harness itself, not read from anything the run
      reports. NAMED MUTATION: make the layout a plain pytest session-scoped
      fixture with no cross-process lock; the observed count becomes the worker
      count and this test must go RED while the single-worker descriptor above
      stays green. A contract that cannot separate "once per run" from "once per
      worker" gives back most of what this AC recovers.
  - name: test_tq600a_1_consumers_on_different_workers_receive_the_identical_root_path
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      Two consumers pinned to different workers report root paths that are the
      identical string. NAMED MUTATION: derive the run-scoped directory from each
      worker's own base temporary directory rather than from the workers' common
      base; every worker then receives a valid, existing, DIFFERENT root, the
      same-session identity descriptor above stays green, and only this test goes
      RED.
  - name: test_tq600a_1_no_consumer_is_handed_a_root_before_its_layout_is_complete
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      A second requester arriving while the first is mid-production waits, and
      the layout it is then handed is complete — the deploy's full expected file
      set, not a partially written tree. NAMED MUTATION: publish the root when
      production begins instead of when it finishes; the waiter observes an
      incomplete layout and this test must go RED. The fourth clause says this
      case cannot arise, so it must be provoked deliberately to be checked.
  - name: test_tq600a_1_a_cached_layout_requested_many_times_executes_only_one_deploy
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      Fifty requests within one run execute one deploy subprocess. The
      observation is of executions the harness counted, not of any figure the run
      reported — the reported figure and its bound are TQ-600a-6's. NAMED
      MUTATION: produce a fresh layout on every request; this test must go RED.
test_rationale: |
  The measurable is a count, not a duration, because wall clock on this
  workspace is contaminated — the profiling run shared a WSL host with other
  agent activity. A timing assertion is unfalsifiable here on a bad day and
  falsely satisfiable on a good one; the number of real deploys is
  host-load-independent and is what the change actually controls.

  Every descriptor here OBSERVES deploy subprocesses and root paths directly.
  Nothing in this contract reads what the run reported about itself: the
  reported figure, its relational bound and the function-of-the-selection
  control moved to TQ-600a-6 with the reporting surface. That separation is the
  point of the split — a fixture that deploys once and reports a hardcoded 1
  must fail on TQ-600a-6's evidence, not on this record's.

  The three cross-worker descriptors exist because the criteria were rewritten
  to claim cross-worker single production, and the earlier contract could not
  have covered a claim that did not yet exist. They are deliberately separable:
  a plain session-scoped fixture passes the single-worker descriptor and fails
  the multi-worker one; a per-worker base temp directory passes both of those
  and fails only the identical-root one; publishing the root at the start of
  production passes all three and fails only the completeness one. Each names
  the mutation it alone catches, because each of those three implementations is
  a plausible reading of "session-scoped, produced once" in the source.

  No literal deploy count appears anywhere in this contract. The measured 77 is
  a count of invocation SITES across 52 files, not of invocations: a looped or
  parametrised site may deploy more than once, and the true per-run figure was
  not established at authoring time because doing so requires reading test
  source.
