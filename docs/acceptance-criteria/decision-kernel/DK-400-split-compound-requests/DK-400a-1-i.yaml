assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-400a-1
  contract: The split record of DK-400a-1 with trigger 'ambiguous' instead of 'jev_none'; every other field and
    the waiting_host handoff are the same.
it_requirements:
  - trigger ambiguous applies when the root's intent or routing assessment ends insufficient_context (the needs-context
    answer, or an answer below the configured probability or confidence) and the bundle answer is at or above split.bundle_threshold;
    the top candidate is never bound.
  - 'For a bundled ambiguous root the split replaces today''s clarification question: no human question opens before
    the host''s proposal, and no ambiguous gap is recorded at detection.'
  - A not-bundled ambiguous root keeps today's clarification path unchanged.
  - 'If that split is rejected or its proposal leaves fewer than two parts, the root falls back to today''s insufficient_context
    path, unchanged: with routing.on_insufficient_context ''human'' today''s clarification question is opened (the
    same template and choices as today) and the run is waiting_human; follow-ups count against intent.max_clarifications;
    today''s ambiguous gap is recorded only if the request ends unresolved (the person cannot be asked, or the follow-up
    limit is reached), and only then does the run end blocked (DK-400d-3-i, DK-400c-3); it is never offered a split
    again in the same run.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_ambiguous_bundled_goal_starts_split_with_trigger_ambiguous
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Scripted routing with decision and research equally fitting (needs-context) and bundle 0.9 ends
      waiting_host on decompose_goal with trigger ambiguous; no capability is bound and no human question is opened.
  - name: test_ambiguous_single_question_keeps_clarification
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: The same routing answer with bundle 0.2 opens today's clarification question and starts no split.
test_rationale: The ambiguity comes from a real routing or intent assessment, so the test drives the route node
  with scripted Jev answers rather than calling the detector directly.
