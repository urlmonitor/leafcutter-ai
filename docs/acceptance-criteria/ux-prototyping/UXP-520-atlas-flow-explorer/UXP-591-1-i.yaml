    flow leafcutter/explore-flows-in-atlas v6, branch bareFlows). Owner decision 2026-10-12:
    bare /flows is the finder overview, not the default entry flow leafcutter/deliver-a-feature.
    Kept: 200, no redirect, address unchanged, no breadcrumb, drawer or notice. Removed: the
    default flow drawn with Real, User, All and its one-flow breadcrumb. Added: a /flows address
    with a finder query also opens without a redirect. Readiness lowered approved -> draft;
