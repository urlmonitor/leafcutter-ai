notes: |
  WHY A HOW-TO AND NOT ONLY A REFERENCE. Writing a suppression is a task a person
  performs by hand, under time pressure, immediately after being blocked. The
  reference that lists the accepted forms is the right place for the grammar; it is
  not where someone in that position looks, and it is not organised around the task
  they are trying to complete. The parent L1 triggered both kinds deliberately and
  neither substitutes for the other.

  THE THIRD CRITERION IS THE ONE THAT CAN GO STALE. It quotes behaviour owned by
  the code criteria in this L1, so the wording it shows must be taken from what the
  check actually prints rather than paraphrased — a how-to that shows a warning
  nobody ever sees sends the reader looking for the wrong thing.

  ORDER. This depends on the announcement criterion being settled; documenting a
  message before its shape is fixed guarantees the two disagree.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. Assigned documentation-expert, not
  python-coder: the surface is prose in docs/, which is not a build-deployed file,
  so no template/deployed parity applies here (it does apply to the sibling
  reference AC, whose target ships through build.py). test_required is false with
  the documentation check written out in it_requirements, because inventing code
  tests for a prose change produces a test that asserts a string is present in a
  file — a shape this project has repeatedly found to pass on dead content.
