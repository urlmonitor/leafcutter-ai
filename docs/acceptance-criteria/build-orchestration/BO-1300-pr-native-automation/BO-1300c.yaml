criteria: |
  When a merge is blocked, the operator gets a clear explanation instead of a forced change.

  If a required check fails or branch protection blocks the merge, the
  automation stops and surfaces the reason to the operator as a clear blocker,
  rather than bypassing the rule or pushing the change through anyway.
