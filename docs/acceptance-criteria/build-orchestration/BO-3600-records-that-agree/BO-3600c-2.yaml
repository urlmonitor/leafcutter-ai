readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fault entry naming a file that no longer exists in the project,
  When the register is checked,
  Then the entry is flagged as pointing at a file that is not there, naming the
    entry and the file.

  Given a fault entry naming a file and a position within it, together with the
    thing it says is at that position,
    And the file still exists but the thing it names is no longer at that position,
  When the register is checked,
  Then the entry is flagged as carrying a position that has moved,
    And the flag is distinguishable from the flag for a file that is not there.

  Given a fault entry naming a file, a position, and the thing at that position,
    where the thing is still at that position,
  When the register is checked,
  Then the entry is not flagged,
  So the check does not fire on every entry that mentions a file.

  Given a fault entry naming a file and a position but naming nothing that would
    identify what is at that position,
  When the register is checked,
  Then the position is reported as one the check cannot verify, rather than as
    correct and rather than as stale,
  So a reference the check has no means of deciding is never reported as sound.
