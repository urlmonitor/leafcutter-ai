id: TQ-600a-13-iv
components:
  - testing_quality
title: "Closing the post-merge-red notice without a green run neither releases the hold nor ends the red streak"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an open issue labelled `post-merge-red` raised by a red post-merge run,
  And two ways it can be closed while the correctness lane is still failing: a person
    closes it by hand, or a pull request is merged whose description or any of whose
    commit messages contains a closing keyword for that issue — which the hosting service
    acts on automatically for every keyword of the family close / closes / closed / fix /
    fixes / fixed / resolve / resolves / resolved, in any letter case, with or without a
    colon, and which agents in this repository write by habit,
  And the decision that the hold takes its verdict from the run history, not from the
    issue (TQ-600a-13-vi),
  When the issue has been closed by either route, and then the next post-merge run is red,
  Then from the moment of the close until a run on the main branch is green, the
    `Post-merge suite status` check still fails every pull request evaluated in that
    window that has no accepted exemption (TQ-600a-13-viii) — the close releases nothing,
  And after that next red run an issue labelled `post-merge-red` is open again — the
    closed one reopened or a new one created — so people are notified again,
  And the commit list it carries begins at the head commit of the most recent GREEN run,
    not at the moment of the close and not at the red run that preceded it, so a culprit
    merged before the close is still inside the search space,
  And the close is never treated as a green run by anything the notice lifecycle or the
    hold reads: the next green run, not the close, is what releases the hold and what the
    following commit range starts from,
  And when the next run is green instead, no issue is opened or reopened, the closed issue
    is left as it is, and the hold lifts,
  And both routes are demonstrated by closing the issue in the issue-service double — once
    as a person, once as the effect of a merged closing reference — then evaluating a pull
    request against an unchanged red run history, then applying a red run and a green run,
    and observing the verdicts and the resulting open-issue state.
depends_on:
