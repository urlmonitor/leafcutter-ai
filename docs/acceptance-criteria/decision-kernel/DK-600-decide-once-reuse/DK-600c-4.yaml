criteria: |
  Given a decision record staged at
    <run_root>/runs/run-f0f15b38791a428f/staged/decisions/dec-d53e1c52cd47c832.yaml,
  When the run's result is returned to Claude Code,
  Then the result says "decision record staged: " followed by that path, and gives the command
    python -m kernel decisions publish --run-id run-f0f15b38791a428f,
  And the /leafcutter skill shows you that message,
  And the skill does not run the publish command on its own.
