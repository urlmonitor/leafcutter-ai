criteria: |
  Given an epic folder contains zero non-done ticket files
    (only Master_Plan.md and/or tickets already in done/ subfolder),
  When the dependency resolver constructs the graph from the discovered tickets,
  Then the resulting graph is empty (zero nodes),
  And cycle detection finds no cycle in the empty graph,
  And the ready-set computation returns no ready tickets and no blocked tickets,
  And the build system reports "epic complete" without dispatching any
    ticket-supervisor.
