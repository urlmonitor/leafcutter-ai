implemented_by: []
assigned_agent: python-coder
estimated_complexity: L
delivers_to: null
expects_from:
  ac_id: DK-500f-1
  contract: Generated usage index per category (the per-category sum check).
change_target: code
risk_surface: contract_boundary
it_requirements:
- Statistics go only through the ColonyMemory port (ADR-065 section 3), with the Neo4j statistics backend chosen once at startup; no second memory port.
- It uses the same Neo4j and the same LEAFCUTTER_NEO4J_* settings as ADR-062 (A1.3). Aggregate nodes are kept apart from the immutable projection generations (their own label, part of no generation) and are never read by the knowledge projection.
- 'Triggers (A1.1): after a publish that adds or changes a category or decision record, after a decision''s final outcome is recorded, and on an explicit rebuild command. Each trigger rebuilds every aggregate row in full (A1.2), runs outside any decision run and never blocks one.'
- 'Rows derive only from published records in Git: the members of published categories joined with each member decision''s final_outcome.status (pending, confirmed, corrected or abandoned) and context (capability from provenance.created_by_capability, task_type null in V0, decision_type, components, repository_wide, repository_id, policy_version null in V0). The key (repository_id, kind, category_id, context) is unique; decision_count is the sum of the four status counts; all rows share one rebuilt_at.'
- 'When the store is unavailable, the rebuild retries with a bounded backoff (A1.4), then reports and gives up; the next rebuild repairs it. It never raises into publish or into a run. Handle failures per the project error handling policy: catch specific exceptions, log at WARNING with the identifiers involved, and never swallow a failure silently.'
- Category records never hold outcome or success fields; the record schema rejects them.
- A live test against a real Neo4j is required before claiming server compatibility (ADR-062); offline tests use a fake backend at the port.
test_required: true
test_spec:
- name: test_rebuild_rebuilds_every_row_keyed_by_category_and_context
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: An added item triggers a rebuild that rewrites every aggregate row, each keyed by category id and the full context.
- name: test_row_counts_3_decisions_all_pending
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'cat-1dc11c5a2ffa7310''s repository-wide design row has decision_count 3: 0 confirmed, 0 corrected, 0 abandoned, 3 pending.'
- name: test_row_sums_equal_usage_count
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: For each category, the decision counts summed over its rows equal its usage count.
- name: test_all_rows_share_rebuild_time
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: All rows carry the same rebuilt_at.
- name: test_outcome_change_reflected_after_rebuild
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: After dec-acdfd972fcaca478's outcome becomes confirmed and a rebuild runs, the row shows 1 confirmed and 2 pending.
- name: test_category_records_hold_no_outcome_fields
  target_dir: tests/kernel/memory/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A category record with an outcome or success field is rejected by the record schema.
- name: test_live_neo4j_rebuild
  target_dir: tests/kernel/live/
  framework: pytest
  type: integration
  angle: deployed
  description: Against a configured real Neo4j, a rebuild writes the aggregate rows outside every projection generation and reads them back.
test_rationale: Drive the rebuild through the ColonyMemory port with a fake statistics backend that records rows, over a fixture of published decision and category records; one live test against a real Neo4j proves server compatibility, as ADR-062 requires before claiming it.
