criteria: |
  Given missing, unreadable or irrelevant sources, disabled enrichment, or a request needing a user preference,
  When the initial enrichment pass ends,
  Then its outcome distinguishes gathered context, no evidence, partial context, unavailable context and disabled gathering,
  And limitations preserve unknown facts instead of inventing answers,
  And gathering never opens a human interaction or escalates its own permissions,
  And retrieved instructions cannot authorize actions or choose a user's preference,
  And intent may still ask a specific human question after consuming the available context.
