assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "One resolution function serves both depends_on readers (the run-set membership check and the per-ticket release gate), so the two cannot disagree about where a prerequisite lives."
  - "The rule mirrors the ticket frontmatter hook's documented order: <ticket_dir>/<entry>, then <ticket_dir>/done/<entry>, then <ticket_dir>/../<entry> for a ticket inside done/. Entries beginning `tickets/` keep resolving against the worktree root; absolute entries are used as written. Existence is decided by reading the record back through the existing readTicketRecordBack dispatch, not by a new file-system call in the workflow body."
  - "Path handling reuses the BO-3900 inline helpers (classification, normalisation, joining) already in the script. No require/import and no new shared helper file (ADR-030)."
  - "The existing done-prerequisite handling (`succeeded_before_this_run`) is reused unchanged; only the path it reads changes."
  - "A depends_on entry that is an AC id rather than a file path (e.g. `TKT-500f`) is out of scope and its handling is unchanged; record this in notes."
  - "templates/workflows-js/build-feature.js is over its size limit and may not grow; keep the net content-line delta at or below zero without compressing pre-existing code."
delivers_to: null
expects_from:
  ac_id: BO-3900
  contract: "BO-3900's inline classification and join helpers, and its rule that a relative path is resolved onto a stated root rather than guessed."
test_required: true
test_spec:
  - name: test_bare_sibling_prerequisite_is_read_beside_the_ticket
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A done prerequisite named by bare filename is read from the dependant's own folder and releases the dependant."
  - name: test_prerequisite_in_done_subfolder_and_legacy_tickets_prefix_resolve
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A sibling moved to done/, a ticket that is itself in done/, a `tickets/`-prefixed entry and an absolute entry each resolve to the documented location."
  - name: test_membership_check_and_release_gate_resolve_depends_on_identically
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: seam
    description: "The run-set membership check and the release gate see the same prerequisite path for the same entry."
  - name: test_missing_prerequisite_is_reported_beside_the_ticket_not_at_the_root
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A prerequisite that exists nowhere is reported at its sibling path, never at the worktree root."
  - name: test_prerequisite_resolution_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "A resumed epic run through _workflow_engine_harness.py releases a ticket whose bare-filename prerequisite is already done."
test_rationale: |
  The incident was a resumed run: every prerequisite was done on disk and the gate
  correctly reads a done prerequisite as satisfied, but it read the record at the worktree
  root, found nothing, and withheld 7 of 9 tickets. A test that only calls the resolver
  would pass while the gate still used the old join, so reachability drives the real
  release gate. The seam test exists because the defect lived in two call sites that
  resolved independently.
