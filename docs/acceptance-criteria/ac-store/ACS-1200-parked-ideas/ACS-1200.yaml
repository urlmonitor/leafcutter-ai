readiness: draft
priority: medium
criteria: |
  Park an idea in seconds — with nothing switched off to allow it.

  Thinking out loud should be cheap. Today you can write an idea down as a bare
  outline, but the safeguards that keep the requirement store healthy read that
  outline as a mistake and refuse it, so recording an idea means turning a
  safeguard off. Every single time. That teaches everyone that safeguards are
  optional — corrosive on its own, and directly at odds with the work to make
  those same safeguards trustworthy. After this goal, "parked for later" is a
  state the system recognises and respects everywhere it looks, while anything
  that has genuinely been broken down into work is still held to the full
  standard.
