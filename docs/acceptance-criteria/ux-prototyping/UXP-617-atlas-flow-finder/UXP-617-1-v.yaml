title: "When nothing matches, the finder says so and offers to remove each filter with the number of flows that would then list"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/ux-prototyping/UXP-617-atlas-flow-finder/UXP-617.yaml
criteria: |
  Given no step that matches 'tracking' is run by Jev,
  When a person opens /flows?q=tracking&actor=jev,
  Then the summary reads 'No flows match' and no result is listed,
  And the empty state is titled "No flows match 'tracking'",
  And it offers 'Remove Actor: Jev', which links /flows?q=tracking and says it would list
    3 flows,
  And following 'Remove Actor: Jev' lists those 3 flows with the search 'tracking' kept,
  And with no search, a filter combination that matches nothing shows the title
    'No flows match these filters'.
depends_on:
  - UXP-617-1
  - UXP-617-1-iii
  - UXP-617-2
