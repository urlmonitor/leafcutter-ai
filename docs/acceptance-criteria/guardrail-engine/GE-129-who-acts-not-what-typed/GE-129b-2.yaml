notes: |
  (b) is the verified false negative (GE-129b notes, 2026-09-17): the fast lane's token has been
  inert because its commit was never recognised. (c), (d) and (i) are the same class -- anything
  between git and commit, or before git. (e)/(f) are chained forms, (g)/(h) spelling.

  The refusal quoting the recognised command lets GE-129e-3's agreement check compare stated and
  actual outcomes per example.

  DECIDED 2026-09-17 (user) -- COMMIT ONLY, FOR NOW (confirms Q7). Recognition is scoped to the
  `commit` subcommand in every spelling. Other subcommands that add or rewrite commits (merge,
  pull, cherry-pick, revert, rebase, am, commit-tree, stash, notes, fast-import, filter-branch,
  replay) are not guarded; that limit is named in GE-129b-3 and GE-129e-4. Bringing them in would
  route finalize-feature's merge of origin/main and the conflict-resolver's merges through the
  commit specialist or the person's prompt -- the reason for deferring.

  A commit made by a program the command starts (a script file, a git alias configured outside
  the command, a make target) cannot be seen in the command text. That limit is stated in
  GE-129b-3 and GE-129e-4, not hidden.

  declares_side_effect: false -- the Then clauses assert refusal, prompt and absence of a commit.
