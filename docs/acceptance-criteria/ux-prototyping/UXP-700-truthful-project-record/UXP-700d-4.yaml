id: UXP-700d-4
title: "An artifact type whose whole population is example content is reported"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project whose record holds at least one artifact of a given type,
  When the record is checked,
  Then the check states, for each artifact type, how many artifacts of that type belong to the
    project and how many belong to the example product,
  And an artifact type whose project count is zero while its example count is not is reported
    by name,
  And an example artifact is never counted as satisfying that type for the project,
  And a type for which both counts are zero is reported as empty rather than as example-only.
depends_on:
  - UXP-700d
  - UXP-700d-1
