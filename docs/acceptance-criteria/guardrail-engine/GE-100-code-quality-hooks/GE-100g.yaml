criteria: |
  Given the onboarding wizard is running its hook configuration step
  And the jscpd binary IS detected on the system PATH
  When the wizard reaches the duplicate-code hook configuration prompt
  Then it asks the user whether to enable the duplicate code check
  And if the user accepts, it sets duplicate_code.enabled to true in
    the project's commit_guardian.json
  And if the user declines, it leaves duplicate_code.enabled as false
  And it does NOT prompt for threshold values (uses sensible defaults)

  ---

  Given the onboarding wizard is running its hook configuration step
  And the jscpd binary is NOT detected on the system PATH
  When the wizard reaches the duplicate-code hook configuration step
  Then it silently skips the prompt entirely
  And it adds "jscpd (duplicate code detection)" to the post-onboard
    checklist of optional tools the user can install later
