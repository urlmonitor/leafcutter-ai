  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. This is the one place in the
  GE-126a branch where a python-coder record hands something to documentation-expert:
  the enumerated route set and the four seam states. Both GE-126a-4 and GE-126a-5 are
  written against that enumeration, and both are forbidden by their own criteria from
  describing the routes generically. If the coder changes which routes are honoured,
  the two documentation records change with it — that is why this is a contract and not
  a note.

  THE CONTRACT IS DELIBERATELY NOT A PROMISE ABOUT THE FAMILY. GE-126a-5 must name the
  routes for THIS check. The contract above says "for check_ac_governance" for that
  reason; widening it would breach the L0's rule that no record here may state anything
  about the other checks until GE-126e has measured them.

  AGENT AND ORDERING. python-coder. Ordering lives in depends_on. The two expects_from
  edges are documentation of data shape only and are invisible to the sequencer
  (KI-ACD-015).

