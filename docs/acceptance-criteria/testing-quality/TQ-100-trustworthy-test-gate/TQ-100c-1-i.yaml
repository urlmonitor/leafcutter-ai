title: "Removing a covers tag makes a test unlinked-and-enforced, not informational"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100c.yaml
criteria: |
  Given a failing test that was tagged "# covers: <AC-ID>" linking it to a
    not-done AC, observed in a first run to be reported informationally,
  When the "# covers:" tag is removed from the test and the suite is run again,
  Then the now-untagged test is enforced (its failure counts as a real failure
    and drives the overall outcome non-passing)
  And removing the tag does not make the test informational
  And there is no edit to the test that converts an enforced test into an
    informational one by dropping its link.
depends_on:
  - TQ-100c-1
