notes: |
  GE-120e-2 converts a behaviour into a declaration, and a declaration can be wrong from the
  moment it is written — including by an author who records "handed its files" because that
  is the value that needs no further work. This AC closes that: the declaration is checked
  against the check.

  It is deliberately aimed at the entries OUTSIDE the governed set, because those are the
  ones nothing else in this L1 exercises. The governed set is covered by GE-120e-3's
  differential pair; the ungoverned set is covered only here, and it is where a
  misattributing check would hide once the two observed ones are fixed.

  This is the same insight as GE-120a-2-i and GE-120c-3 — a family-wide rule that is not
  mechanically checked against the family's own registry decays one addition at a time —
  applied to a third field. If a shared registry-conformance mechanism emerges from those
  two, this should use it rather than adding a fourth private sweep.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
