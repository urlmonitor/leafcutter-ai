criteria: |
  Spend local capacity on implementation and cloud capacity on focused review.

  The worker builds and checks a complete feature locally, then obtains review
  using the reviewer and model you configure. Successful work becomes a draft
  change proposal with supporting evidence; unresolved review findings return
  to you, and merging always remains your decision.
