notes: |
  This AC exists because the GE-119 defect class was invisible to a full suite of passing
  tests for its entire life. The suite was green and the checks were not running. Repeating
  that outcome with a new harness is the single most likely way this tree fails while
  appearing to succeed.

  The repo rule this operationalises: "If test-writer runs and finds the target suite already
  green, that is a TDD-order violation, not a pass." Here the rule needs its own AC because
  the subject under test is verification apparatus, where the temptation to write the harness
  after the fix is strongest and the loss is greatest.

  The last clause is the enforcement edge — it makes an unproven harness case a reportable
  state rather than an indistinguishable green one, which is the same distinction GE-119a
  draws for the checks themselves.

  IT-PO (2026-08-14): the unproven state must reuse the GE-119a-1 outcome vocabulary rather
  than being a second three-state model. The red baseline artifact must carry the pre-fix
  commit SHA so it can be re-verified rather than trusted.
