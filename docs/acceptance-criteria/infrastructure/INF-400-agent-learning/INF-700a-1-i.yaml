amended_by:
  - reason: "BA amendment, 2026-09-07, on an IT PO observation. The last clause said 'a path added later that completes a unit of work' is detected when it appears; the mechanism the IT PO specified enumerates workflow artefacts. Those coincide today — all five completion paths are workflow artefacts — but they are not the same set, and a completion path shipped only as a skill or only as a command carries no workflow artefact and slips the enumeration. The criterion therefore promised coverage the mechanism cannot deliver, which is the failure mode this AC exists to catch, one level up: an unwired path that nobody notices because a guard reported green. BOTH REMEDIES APPLIED, not one. The clause is narrowed to the set the detection can enumerate for itself, so it is checkable; and the residual is added as its own clause requiring the detection to state, in its PASSING output, which artefact kinds it examined and which it cannot see. Narrowing alone would have left a true criterion and a false impression. The mechanism itself, the enumerate-from-artefacts rule, and the exclusion list are unchanged and remain the IT PO's."
    by: business-analyst
    at: 2026-09-07
