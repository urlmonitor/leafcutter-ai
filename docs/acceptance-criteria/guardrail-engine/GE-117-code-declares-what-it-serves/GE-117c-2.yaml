criteria: |
  Given a developer is adding a new decision-history entry that must record the AC
    behind the change
  When the developer opens the how-to guide for the decision-history declaration
  Then the guide shows the updated tail-tag form carrying both the existing ticket
    reference and the new AC reference on a new entry
  And the guide states that only newly added entries must carry the AC reference and
    that pre-existing entries are never retrofitted
  And the guide explains when an entry may inherit the enclosing symbol's AC and
    when it must carry its own reference
  And the guide states that the referenced AC must resolve to a real AC in the store
    or the commit is blocked
