    status: exists
    relevance: "IT PO. Where the census itself is documented by GE-126e-4. The published figure must route to it for how to obtain a current one rather than restating the invocation."
assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "Every figure published must come from an actual census run and the commit it was measured at must be recorded beside it, so a later reader can re-run at that commit and either confirm or refute the number."
  - "The count that circulates informally today - roughly seventy checks of which three are known instances - came from three checks being looked at while doing other work. It is not a measurement and must not be published as one, in the reference or anywhere else."
  - "The reference must name the census as the route to a current figure and must route to the component documentation for how to invoke it rather than restating the invocation. A second copy of the invocation will drift, and this component has a recorded instance of a documented defence against store rot that was itself a no-op for eight days and reported clean the whole time."
  - "The published procedure must be the procedure the census actually performs - a genuine violation handed to each check and two runs from two working directories compared. A figure whose method is unstated cannot be disagreed with, and a figure nobody can disagree with does not get corrected when it goes stale."
  - "The unexecutable count must be published alongside the other two. Publishing examined and found without it presents a boundary of the measurement as if it were part of the result."
  - "The no-unmeasured-figure clause is a deletion obligation as well as a prohibition: assert that no statement anywhere in the reference material asserts a number for this defect that did not come from a census run."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the page."
test_spec:
  - name: test_the_published_figures_match_a_census_run_at_the_recorded_commit
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "the census entry point at the commit named in the reference"
    description: "The examined, instance and unexecutable counts are read out of the shipped reference, the census is re-run at the recorded commit, and the figures are compared. A reference stating a figure no run produced fails here."
  - name: test_the_published_procedure_is_the_one_the_census_performs
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "The classification procedure the reference describes - a genuine violation, two working directories, the outcomes compared - is checked against what the census actually does, so a reader following the published method reproduces the published number."
  - name: test_no_figure_for_this_defect_appears_that_no_census_run_produced
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "No statement in the reference material asserts a count for this defect family other than the one carried with its commit and date - in particular the informally circulating three-of-about-seventy is absent."
  - name: test_the_reference_names_the_census_as_the_route_to_a_current_figure
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the route to the census named in the reference"
    description: "The route the reference names for obtaining a current figure is followed and produces a census run - so the recorded figure cannot quietly become the answer."
test_rationale: |
  The failure this record pins is a published number nobody can check, and it is
  detectable in exactly one way: re-run the census at the recorded commit and compare.
  That makes the first descriptor an integration test rather than a docs assertion, and
  it is why GE-126e-2 is required to emit a machine-readable report — without that, this
  comparison becomes a parsing exercise and gets skipped. The second descriptor closes
  the gap between a published number and a published method: a figure produced one way
  and described another is not reproducible even when the number is right. The third is
  the L0's standing rule made mechanical and it names the specific unmeasured figure that
  circulates informally today. The fourth stops the recorded figure becoming the answer,
  by requiring the escape route to actually work.
delivers_to: null
expects_from:
  - ac_id: GE-126e-2
    contract: "The machine-readable census report - examined count, instance count with names, unexecutable count with names, commit and date. The reference publishes exactly these fields and the coverage re-runs the census at the recorded commit to compare."
  - ac_id: GE-126e-1
    contract: "The classification procedure - a genuine violation handed to each check, two runs from two working directories, the outcomes compared. The reference publishes this as the method behind the number."
