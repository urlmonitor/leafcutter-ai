id: UXP-523-4
title: Older or unusable contract metadata does not erase readable node detail
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a node has no structured contract metadata or has metadata the Atlas display guard cannot
  use,

  When a person opens that node,

  Then the readable narrative and compatibility input and output detail remain available through the fallback
  display,

  And Atlas does not show an empty structured panel in place of that existing detail,

  And this display fallback does not certify the record as valid or exempt it from the repository''s Product
  Truth checks.'
depends_on:
- UXP-523
