notes: >-
  The obvious way to satisfy BO-4100e-2 is a forced delete that skips every check, which
  swaps one harm for the worse one: the leftover stops being unremovable and starts being
  a silent way to lose work. Once BO-4100e-1 has put the leftover in the listing it is
  inside BO-4100c-1's domain, so the verdict rule already exists and this AC asserts that
  discovery reuses it rather than routing around it. No new verdict is defined here.
