criteria: |
  Given the AC store contains exactly one dependency cycle, confined to one subtree,
    formed by BO-1100a-3 -> BO-1100d-1 -> BO-1100a-3,
  And every other AC in the store is acyclic and otherwise rankable,
  When the store-wide scan / ready-AC ranking runs,
  Then it emits a single warning whose text lists the full cycle path so the user
    can locate and fix the offending depends_on edge,
    for example: "WARNING: dependency cycle detected (skipped from ranking): BO-1100a-3 -> BO-1100d-1 -> BO-1100a-3",
  And the warning names every AC id that participates in the cycle (not a generic
    "a cycle was detected" message),
  And the scan still ranks and emits the acyclic remainder,
  And the process exit code is 0, because the cycle lies outside the requested
    ranking scope and is therefore a warning, not a fatal error.
