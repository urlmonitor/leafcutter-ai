notes: |
  The Linux volume of a WSL distro reports the virtual disk's own free space, which can be
  far larger than what the host drive can actually supply -- the exact blind spot that lets a
  host run out silently. Locating the host drive for the virtual disk is the IT PO's call; a
  failure to locate it falls under BO-4400e-1-i (warn, name the drive, proceed).
