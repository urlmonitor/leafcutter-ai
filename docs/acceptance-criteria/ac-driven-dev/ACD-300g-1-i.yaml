it_requirements:
  - "Must report the specific pre-commit hook name and error output to the user, not a generic failure message"
  - "Must not silently retry or force-overwrite on commit failure"
  - "Must preserve all AC files on disk as uncommitted changes after a commit failure"
delivers_to: null
expects_from: null
test_intent:
- clause: the workflow does NOT dispatch the next authoring agent
  needs_test: true
  reason: Stopping the pipeline on a failed commit is a branch in the stage loop that a missing status
    check would skip.
- clause: it reports the specific hook name and error message to the user
  needs_test: true
  reason: The hook name and the error text are carried from the commit outcome into the message, and dropping
    either leaves a generic failure.
- clause: it lists the file paths that failed validation
  needs_test: true
  reason: The failing file list is copied from the commit outcome into the message, and an empty or wrong
    list leaves the user guessing.
- clause: it advises the user to fix the validation errors and re-run the workflow
  needs_test: true
  reason: Which advice the user gets depends on the hook-versus-conflict branch, so a wrong branch would
    give the wrong next step.
- clause: all AC files from the failed stage remain on disk as uncommitted changes so the user can inspect
    and correct them
  needs_test: true
  reason: The workflow must issue no restore, checkout or delete after a failed commit, and any such call
    would destroy the stage's files.
- clause: it reports "index conflict" with the conflicting file paths
  needs_test: true
  reason: The conflict branch is chosen from the commit outcome, and a wrong branch would report a hook
    failure instead of an index conflict.
- clause: it does NOT silently retry or force-overwrite the conflicting changes
  needs_test: true
  reason: Exactly one commit attempt with no retry or force flag is behaviour a retry loop would silently
    break.
test_spec:
- name: test_acd_300g_1_i_hook_rejection_stops_the_pipeline
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: reachability
  description: 'Drives the real workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py),
    strategic route with gate-po approve, commit agent returning status error with hook_name check-ac-schema:
    no business-analyst dispatch follows and the run returns status error.'
  proves_clause: the workflow does NOT dispatch the next authoring agent
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the next authoring agent is dispatched after a hook rejection
- name: test_acd_300g_1_i_message_names_hook_and_its_error
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'formatCommitError via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with hook_name
    check-ac-schema and message ''criteria assert ... declares_side_effect is not set'': the returned
    text contains both the hook name and that error text.'
  proves_clause: it reports the specific hook name and error message to the user
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the message says only 'A pre-commit hook rejected the staged files' when hook_name is set
  - the hook's own error message is dropped from the user-facing text
- name: test_acd_300g_1_i_message_lists_failing_files
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'formatCommitError via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with two
    failing_files: each path appears in the returned text; with failing_files absent the text still renders
    without a file list.'
  proves_clause: it lists the file paths that failed validation
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_1_i_hook_failure_advises_fix_and_rerun
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'formatCommitError via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) on the hook
    branch (is_conflict false): the text tells the user to fix the validation errors and re-run /plan-feature;
    the conflict branch does not give this advice.'
  proves_clause: it advises the user to fix the validation errors and re-run the workflow
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_1_i_failed_commit_leaves_files_on_disk
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'Workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py) with a failing
    commit: no dispatch after the commit carries git restore, git checkout, git reset or rm, the commit
    instructions say to leave the files as uncommitted changes, and the run''s acs_as_drafts lists the
    stage''s ids.'
  proves_clause: all AC files from the failed stage remain on disk as uncommitted changes so the user
    can inspect and correct them
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_1_i_conflict_reports_index_conflict_and_paths
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'formatCommitError via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with is_conflict
    true and a failing path: the text contains ''index conflict'' and the path, and does not claim a hook
    rejected the files.'
  proves_clause: it reports "index conflict" with the conflicting file paths
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - an index conflict is reported as a pre-commit hook rejection
- name: test_acd_300g_1_i_conflict_is_not_retried_or_forced
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: discrimination
  description: 'Workflow body via run_plan_feature_e2 (unit_tests/_plan_feature_e2_runner.py) with a commit
    agent returning is_conflict true: exactly one commit-stage-output dispatch is recorded, and its instructions
    forbid a retry and --no-verify and contain no force flag.'
  proves_clause: it does NOT silently retry or force-overwrite the conflicting changes
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the workflow re-dispatches the commit after a conflict
  - the commit instructions allow --no-verify or a force overwrite
