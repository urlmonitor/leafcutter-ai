notes: |
  PO placement rationale (2026-07-02). GE-117 is a NEW SIBLING L0, deliberately
  distinct from GE-111. GE-111 governs KEEPING an already-declared AC-to-code
  link honest as code is refactored over time (drift prevention on the AC
  store's implemented_by graph). GE-117 governs ESTABLISHING the declaration in
  the first place — code→AC and code→component links stated in the code's own
  docstrings, checked for PRESENCE at authoring/commit time. Different lifecycle
  stage (author-time vs refactor-time), different surface (docstrings vs the AC
  store graph). They are complementary and MUST NOT be conflated.

  GE-117 also extends, but does not duplicate, GE-100's docstring PRESENCE/quality
  enforcement: GE-100 requires a docstring to exist; GE-117 requires an existing
  in-scope docstring to additionally carry a valid AC reference and/or component
  reference. Do not re-specify presence checks — layer on top of them.

  Scope confirmed with user (BrainCandy) — broadest interpretation, three
  docstring surfaces (module → component; public function/class → AC; new
  DECISION HISTORY entry → AC), diff-only (new/changed code; legacy not
  retrofitted, mirroring the existing tail-tag convention), fail-closed default
  with a deliberate escape hatch (consistent with GE-111d's reconciliation
  escape routes).
