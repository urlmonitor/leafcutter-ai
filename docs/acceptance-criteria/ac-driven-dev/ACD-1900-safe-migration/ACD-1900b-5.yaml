notes: |
  GAP 1(a) from the independent v2 review. Canonical surface: the agent-template prose
  templates/agents/ac-fulfillment-gate.md, Step 1 ("ac_traceability absent -> sign off
  status: ok immediately"). Today that skip path returns ok whenever ac_traceability is
  absent; a thin ticket carries source_ac (not necessarily ac_traceability), so the gate
  hits the skip path and verifies NOTHING = phantom-green. This AC makes Step 1 DUAL-READ:
  accept ac_traceability OR resolve source_ac / the resolved AC's deliverable checklist,
  so a thin ticket is actually verified. It reuses the shared dual-read spec resolver from
  ACD-1900b-1 (hence depends_on). Read-side foundation only (phase_acbuild_1_foundation);
  the eventual "absent -> blocker" enforce-time flip is the separate ACD-1900c-6 (GAP 1b).
  Per CLAUDE.md (gate/workflow ACs verify BEHAVIORALLY): the covering check MUST run the gate
  against a real thin ticket whose resolved AC criteria are unmet and assert it BLOCKS (not
  ok) -- never grep-only. IT-PO to add it_requirements + surface wiring.

  IT-PO enrichment (2026-08-12): prose surface templates/agents/ac-fulfillment-gate.md
  (ADR-001 canonical; .claude/ is build output). test_required: false per the
  change_target: prompt precedent (ACD-1900b-3 is the paired executable python-coder gate
  test; ACD-1800b-1b / ACD-1600b-1-i set the prompt-surface test_required:false precedent).
  Behavioral proof = ACD-1900b-3 gate-verdict tests + ADR-026 rule-7 real-ticket spot-check.
