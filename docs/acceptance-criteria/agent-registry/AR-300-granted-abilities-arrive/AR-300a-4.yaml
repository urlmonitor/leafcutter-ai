notes: |
  THE MEASURED INSTANCE. Exactly one agent's instructions mention its abilities,
  and that section is hand-written rather than delivered. Repairing delivery
  without addressing it produces two accounts in one prompt, and the agent has
  no way to know which is current. The sharpest detail is that the agent holding
  the hand-written section does not hold the means to invoke an ability at all --
  so the account that does exist is the one least able to be acted on. Granting
  that means is AR-200b's promise, in the leaf AR-200b-2.

  WHY THE EQUALITY CLAUSE MATTERS MORE THAN THE COUNT. Two identical accounts
  are untidy. Two accounts that disagree is the defect, and a hand-written list
  drifts from the declaration the first time a grant changes -- with nothing to
  notice, because nothing today compares them.
