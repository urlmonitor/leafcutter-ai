title: "The /build-epic route makes the same wrong-version runs before each ticket is committed"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic driven through /build-epic that holds three tickets —
      K1: its guarding test names must_catch ["drop the retry_due condition"]
          and fails under it,
      K2: its guarding test names the same wrong version and still passes
          under it,
      K3: it has no source requirement,
  When each ticket's code is green and the ticket reaches the step before
    commit,
  Then the /build-epic route makes the wrong-version runs through the one
      shared runner, with the same inputs the fast lane and /build-feature
      pass, after asking the writer what is owed and, when anything is,
      having test-breaker prepare it from that list unchanged,
    And K1 goes on to commit,
    And K2 does not reach commit: its drive stops with the runner's report
      naming the test and the surviving wrong version, and the ticket is
      reported as blocked, not done,
    And K3 records "wrong-version runs not applicable: no source requirement"
      and goes on, never recorded as verified,
    And for the same tests and outcomes the /build-epic verdict is identical
      to the fast lane's and /build-feature's,
    And the verdict is the runner's own; the supervisor's summary of it never
      stands in for it, and the supervisor hands the preparer's reply on
      unchanged.
