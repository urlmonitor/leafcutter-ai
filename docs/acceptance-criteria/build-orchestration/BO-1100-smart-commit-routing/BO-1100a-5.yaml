criteria: |
  Given all staged files belong to the single group "tickets",
    and the staged files are:
      - tickets/02_in_progress/TICKET-001.md
      - tickets/02_in_progress/TICKET-002.md
      - tickets/02_in_progress/TICKET-003.md
  When the commit agent composes the full commit message (subject + body),
  Then the body section lists each affected file or ticket identifier,
  And the body includes at least the ticket IDs: TICKET-001, TICKET-002, TICKET-003,
  And no staged file is silently omitted from the body,
  And the body is separated from the subject by one blank line (git convention).
