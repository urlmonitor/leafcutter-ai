roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the published record dec-ef8ddcb79d668a67 and the regenerated index in the working tree,
  When the change is committed,
  Then it reaches main only through a PR that is reviewed like any other change, for example
    PR #978,
  And the publish command itself made no commit, no push and no merge,
  And once the PR is merged, a later decision run's precedent lookup through
    docs/decisions/index.json returns dec-ef8ddcb79d668a67 for a matching question.
