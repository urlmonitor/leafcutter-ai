criteria: |
  Given a release contains 4 changelog entries:
    - entry-A (ac_id: BO-100a-1, L0 ancestor: BO-100 "Smart sequencing")
    - entry-B (ac_id: BO-100a-2, L0 ancestor: BO-100 "Smart sequencing")
    - entry-C (ac_id: BO-200a-1, L0 ancestor: BO-200 "Atomic delivery")
    - entry-D (ac_id: BO-200a-2, L0 ancestor: BO-200 "Atomic delivery")
  When the release changelog is rendered,
  Then entries A and B appear under a heading: "Smart sequencing"
  And entries C and D appear under a heading: "Atomic delivery"
  And each goal heading appears exactly once
  And entries within a goal group are ordered by creation date ascending.
