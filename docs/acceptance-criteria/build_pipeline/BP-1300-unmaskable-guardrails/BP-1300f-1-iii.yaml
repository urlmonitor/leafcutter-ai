id: BP-1300f-1-iii
components:
  - build_pipeline
title: "A renamed file is compared with its old path at the merge base, so moving a file that has old type errors is not charged for them"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Background:
    Given at the merge base the file scripts/old_name.py has two type errors.

  Scenario: A rename keeps its old errors uncharged
    When the pull request renames scripts/old_name.py to scripts/new_name.py and edits
      one comment line, so git detects the change as a rename,
    Then the check passes,
    And it reports 1 file inspected, 0 new errors and 2 existing errors left untouched.

  Scenario: An error added to a renamed file is charged to its new path
    When the pull request renames the file to scripts/new_name.py and adds one new
      type error to it,
    Then the check fails,
    And it names scripts/new_name.py and the head line of the added error,
    And it does not report the two old errors as new.
