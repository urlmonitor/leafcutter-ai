it_requirements:
  - "Extend docs/reference/ac-schema.md -- do not create a competing page. That file is the normative AC-record reference and the surface authors already consult for field semantics; a separate observable-promise page splits the audience from the record it describes. If the writer disagrees, the burden is to consolidate, not to add a third surface."
  - "THIS FORMAT HAS NEVER HAD AN AUTHOR-FACING DESCRIPTION. The stanza shape is documented only inside the consuming agent template (templates/agents/user-surface-smoker.md ~lines 95-107), and every stanza that has ever existed was hand-typed by someone who had read that template. Write for an author who has not and will not read it; do not link to the agent template as the field reference."
  - "DOCUMENT ONE DECLARATION SLOT AND SAY EXPLICITLY THAT THERE IS NO SECOND ONE. Name the two observation kinds it can request and state that requesting a new kind means a new value, never a new field. Without that sentence the next author faced with a third craft adds a third field -- which is exactly how the repo arrived at three orphaned triggers."
  - "EXPLAIN THE FOURTH PART OF A PROOF, DO NOT MERELY LIST IT. `placeholder_signature` -- what you would see if the promise were unimplemented -- is what separates a proof from an exit-code check. A doc that lists it as a field without explaining the placebo it defeats produces authors who leave it blank, and the store fills with proofs that pass on stubs. State that it is required, and give the reason in the same paragraph."
  - "THE EMPTY-SET SECTION MUST EXPLAIN, NOT STATE. Give the mechanism as a worked counter-example: a loop over zero items with an all-must-pass aggregation emits a pass having verified nothing, which is how the mandatory smoke gate behaves today. The rule alone does not stop the next author reintroducing it in a different aggregation."
  - "USE THE VOCABULARY THE TOOL ACTUALLY EMITS. Document `proven`, `unproven` and `refuted` by the identifiers in the emitted outcome, alongside the prose, so a reader can match the text in their terminal to the section -- and state the different clearing action for each (author a proof vs fix the surface)."
  - "SHOW A COMPLETE, COPYABLE EXAMPLE AGAINST A REAL REPOSITORY SURFACE, not a placeholder. The last Then clause is a reader capability, so the example must be one an author can adapt and have the craft execute; a fabricated surface makes the section untestable against the real-artifact convention in CLAUDE.md."
  - "LINK, DO NOT RESTATE. Done eligibility lives in docs/how-to/done-proof-enforcement.md and the migration rules live in ADR-026. Duplicating either creates the stale copy this tree exists to avoid."
  - "Must pass the repository doc gates: check-doc-frontmatter, check-doc-length and check-doc-index. Register the new sections in docs/INDEX.md if the file's index entry changes."
