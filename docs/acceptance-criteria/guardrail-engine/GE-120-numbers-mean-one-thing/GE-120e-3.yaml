notes: |
  THIS IS THE AC THAT CLOSES THE L1'S CENTRAL HAZARD: a guard switched on over a collection that
  already contains a clash will either block every unrelated change until someone happens to fix
  it, or be configured to tolerate the known-bad entries and thereby certify a broken state as
  clean. The "no exemption list, no allowlist, no known-bad entries" clause is what makes the
  second outcome a test failure rather than a pragmatic decision someone makes quietly under
  delivery pressure.

  THE REINTRODUCE-AND-RE-RUN CLAUSE is the mutation check. Without it this AC would be satisfied
  by a guard that always passes, which is precisely the failure mode the whole GE-120 tree and
  its sibling GE-119 exist to prevent. It costs one extra test and it is the only clause here
  that cannot be satisfied by a broken implementation.

  THE UNNUMBERED-ARTIFACTS CLAUSE IS A NEGATIVE ASSERTION PROTECTING THE USER'S SCOPE DECISION.
  Repair scope was trimmed at the PO gate to the ambiguous cases only, and the 11 unnumbered
  diagrams were explicitly excluded — an absent number is not ambiguous and breaks no reference,
  while renaming published files would risk the dangling references this work exists to prevent.
  Stating it as an acceptance clause means an implementer who "tidies them up while in there"
  fails the test rather than quietly re-expanding a decision the user made deliberately. If a
  later reader believes those diagrams should be numbered retrospectively, that is new work under
  its own requirement, not a reinterpretation of this one.
