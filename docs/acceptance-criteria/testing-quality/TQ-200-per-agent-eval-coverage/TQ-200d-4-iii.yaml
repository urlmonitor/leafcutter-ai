id: TQ-200d-4-iii
components:
  - testing_quality
  - llm_authoring
title: "The test runner reports a run that executed no test as not run, never as a pass"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given three finished runs of a named test file:
      A: the runner's summary reads "no tests ran" (0 collected),
      B: the command exited 0 and printed no runner summary at all,
      C: the runner's summary reads "1 passed",
  When the test runner writes its report for each,
  Then the reports for A and B do not say PASS; each says no test ran, quotes
      the command that was run, and gives the reason (nothing collected, or no
      runner summary),
    And the report for C says PASS and quotes "1 passed" from the run,
    And no report says PASS unless it quotes a count of passed tests, greater
      than zero, from the runner's own summary.
depends_on:
  - TQ-200d-4
  - TQ-200d-4-ii
doc_links:
