criteria: |
  Given two L2 ACs in the same feature folder where AC-A is assigned to agent-X
    and AC-B is assigned to agent-Y,
  And AC-B depends on output produced by AC-A,
  When the IT PO enriches both ACs,
  Then AC-A has a delivers_to field naming agent-Y
    and describing the data shape being delivered,
  And AC-B has an expects_from field referencing AC-A's id
    and describing the same data shape,
  And the contract descriptions on both sides are compatible.
