notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.

  WHY THIS L1 EXISTS AT ALL, AND WHY IT IS FIRST. Being told beforehand and
  being refused afterwards are different goods with different economics. A
  refusal is worth something only once the work exists; advance knowledge is
  worth something even in the runs where nothing would ever have been refused,
  because the work comes out differently. Bind the benefit to that timing or
  the whole tree collapses into GE-127, which already owns refusal completely.

  THE ACCEPTANCE SHAPE WITH TEETH, AND THE ONE WITHOUT. A criterion satisfied
  by "the standard is written down somewhere the specialist could find it" is
  satisfied today and always has been — the standards are in a configuration
  file any reader can open. What discharges this is that the standard is
  present in what the specialist is working from when it begins, without the
  specialist having to know to go looking. The working precedent to generalise
  is the one pairing that already behaves this way: a line limit appears in a
  coding specialist's own instructions, including in a trigger that makes it
  stop and ask BEFORE producing an oversized file rather than after.

  DO NOT LET THIS BECOME "WARN EARLIER". A warning issued while the work is in
  flight is still feedback on work already being done. The promise is that the
  constraint is part of the brief.
