test_spec:
  - name: buildFlowGraph_derives_diamonds_from_branch_data_only
    target_dir: leafcutter-web/lib/data/__tests__/
    framework: vitest
    type: unit
    description: "A flow whose forks are modelled purely with branches[] (from/condition/label/target) and NO decisions[] array still produces decision nodes and labelled edges; the flow JSON shape is unchanged."
  - name: buildFlowGraph_derivation_is_pure
    target_dir: leafcutter-web/lib/data/__tests__/
    framework: vitest
    type: unit
    description: "buildFlowGraph does not mutate its input Flow and returns a deterministic node/edge set for identical input (safe for client-side use)."
change_target: code
risk_surface: internal
notes: |
  Backfill of shipped behavior: diamonds are synthesized at render time from the current
  branch data. The ADR-025 first-class decisions[] schema is deliberately NOT relied on here;
  the forward-dependency boundary is captured in child UXP-600a.
  IT-PO enrichment (2026-08-11): this is the derivation that UXP-597/598/599 render from
  (see their expects_from: UXP-600). delivers_to left null because the Atlas ac-store parser
  reads delivers_to as a SINGLE downstream AC-id string and this fan-out feeds three
  consumers; the dependency is therefore recorded on each consumer's expects_from instead.
  implemented_by verified (branch-driven synthesis in buildFlowGraph; FlowBranch parsing in
  flows.ts).
  RECONCILIATION (2026-08-11): work_status flipped in_progress -> done. Test-backed by two
  passing vitest tests tagged `// covers: UXP-600` in graph.decisions.test.ts (appended to
  covered_by alongside the forward-boundary child UXP-600a); code is shipped. Suite green
  (41/41). Note: child UXP-600a (the first-class decisions[] schema) stays not_started —
  that forward work is undelivered.
