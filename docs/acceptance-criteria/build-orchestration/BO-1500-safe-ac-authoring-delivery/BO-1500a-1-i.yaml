it_requirements:
- Probe `git worktree list` and `git branch` for the deterministic authoring worktree path / branch name
  before creating; reuse on hit, create on miss.
- 'Reuse must be safe in the presence of already-committed stage work (BO-1500b): never delete or overwrite
  committed AC YAML on that branch.'
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
