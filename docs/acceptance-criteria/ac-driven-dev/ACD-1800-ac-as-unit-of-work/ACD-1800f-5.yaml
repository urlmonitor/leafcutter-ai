notes: |
  DOCUMENTATION AC, produced because ACD-1800f declares
  `documentation_triggers: [reference-doc]`. Craft deliberately LEFT UNSET this
  pass (assigned_agent / it_requirements / estimated_complexity / contracts are
  the IT PO's); the intended craft is the documentation surface. ACD-1800a-3 is
  the sibling precedent.

  THIS DOC HAS AN UNUSUAL BURDEN: THE FORMAT IT DOCUMENTS HAS NEVER HAD A
  PRODUCER. The `## Smoke Fixture` stanza format is described only inside the
  consuming agent template (user-surface-smoker.md ~lines 95-107) -- there is no
  author-facing description of it anywhere, and ZERO occurrences of "Smoke
  Fixture" in scripts/ac_store/generate_ticket_from_ac.py. Every stanza that has
  ever existed was hand-typed by someone who had read the agent template. That is
  why the last Then clause is "can author a proof that the craft executes"
  rather than "understands the fields": the documentation is the first
  author-facing surface this format will have.

  THE FOURTH PART OF A PROOF IS THE EASIEST TO OMIT AND THE MOST IMPORTANT TO
  EXPLAIN. `placeholder_signature` -- what you would see if the promise were
  unimplemented -- is what separates a proof from an exit-code check. A doc that
  lists it as a field without explaining the placebo it defeats will produce
  authors who leave it blank, and the store will fill with proofs that pass on
  stubs.

  THE SECOND THEN CLAUSE MUST EXPLAIN, NOT JUST STATE. "Empty proof set is not a
  pass" is a rule; the reason -- a loop over zero items with an all-must-pass
  aggregation emits `ok` having verified nothing, which is how the mandatory
  smoke gate behaves TODAY (ACD-1800f-3) -- is what stops the next author
  re-introducing it in a different aggregation. Same reasoning as ACD-1600g-5's
  worked counter-example.

  ACCEPTANCE IS COMPREHENSION, NOT PRESENCE. The last Then is written as a reader
  capability on purpose: a doc AC verified by "the file contains a heading named
  X" is a grep test wearing a documentation costume.

  2026-08-17 (IT PO enrichment).

  CRAFT: documentation-expert, per the S7b documentation-gate mapping for the
  parent L1's `reference-doc` trigger and the BA's recorded intent. This is the
  batch's only documentation AC and it satisfies the only trigger ACD-1800f
  declares, so the documentation gate passes for the ACD-1800f subtree.

  PLACEMENT DECIDED: extend docs/reference/ac-schema.md. Both new fields are AC
  RECORD fields, and that file is where an author already goes to learn what a
  field means. A dedicated observable-promise page would separate the field
  reference from the record it belongs to and would compete with ac-schema.md the
  first time either is updated.

  test_required: false, with a rationale string (never a list -- a list-valued
  test_rationale is schema-invalid and has blocked commits in this repo before).

  ONE CONTENT ADDITION BEYOND THE CRITERIA, and it is worth the words: the doc
  must state that a requirement declaring NO observable promise is not judged at
  all and that absence is never an error. Without it the unproven rule reads as
  "every requirement now needs a proof", authors add empty or token declarations
  defensively, and the backfill queue ACD-1800f-3 makes measurable is polluted at
  the source.
