risk_surface: contract_boundary
notes: |
  WHAT THIS CHILD OWNS. Point (d) of the guarantee in BP-1500d's notes, which that
  L1 flags as the one that must not be dropped: (a) through (c) implemented over a
  build that still reports success when it gives up leaves the whole family
  unenforceable, silently, exactly as today. This child is therefore the enforcement
  floor for its three siblings, not an extra.

  HOW THE MANDATED NEGATIVE CONTROL LANDS HERE. In the other children the check must
  be shown to go red on a deliberately non-portable record. Here the check IS the
  build's own verdict, so the deliberate breakage is the unproducible record and the
  demanded red is the build's failure. The second run -- the same build succeeding
  once the record can be produced -- is what stops the requirement being satisfied by
  a build that simply refuses every out-of-package target, which would be a
  regression dressed as a fix.

  THE OUTCOME CLAUSE IS SEPARATE FROM THE MESSAGE CLAUSE ON PURPOSE. A build that
  prints a loud, well-worded failure and still reports a successful outcome leaves
  every automated caller exactly where it is today. Both must be asserted; neither
  substitutes for the other.

  ORDERING. This child gates the acceptance of BP-1500d-1 and -2 in practice: an
  install that received no record because the build gave up is indistinguishable from
  one that was never built. depends_on carries only the parent link, as the authoring
  request specified; the it-po should record the gating relationship in the contract
  fields.

  IT-PO RESPONSE, 2026-08-25. The gating relationship is recorded as delivers_to
  edges onto -1, -2, -4 and -5 rather than as depends_on, so it does not impose a
  build order in the opposite direction from the harness dependency. The reciprocal
  expects_from on -1 covers only the harness and the producible-record state this
  AC's paired success run needs. Neither edge went into depends_on, so no cycle
  exists between -1 and -3; they can land in either order.

  THE EXIT CODE IS THE ASSERTION AND IT IS SUPPOSED TO BE RED. Measured 2026-08-25,
  a real build into a temp-root target prints the could-not-compute warning, writes
  output_mappings {} (down from 154 for an in-parent target) and exits 0. That is the
  defect, not a reason to move the assertion. Any future amendment that relaxes test
  entry 1 from the exit code to the warning text or the mapping count should be
  treated as reintroducing the defect into the specification.

  package_surface is deliberately NOT set: per ACS-100i-6 it means the AC registers an
  entry in a registry the build reads to decide what a consumer receives. This AC
  changes a build's exit path and registers nothing.

  BA AMENDMENT, 2026-08-25 -- THE PAIRED-SUCCESS CLAUSE WAS MADE CONCRETE, THE SCOPE
  WAS NOT CHANGED. "reports success and leaves the record in place" now reads "reports
  success and leaves the record file written to disk in that project". This is the
  same guarantee said precisely: "in place" only ever meant a record file present on
  disk in the receiving project, and the it-po's test entry 4 already asserts the
  record's presence in run 2 rather than exit 0 alone. The reason for the wording
  change is mechanical and worth recording. declares_side_effect is DERIVED from this
  AC's own Then clause rather than authored by opinion, because it non-overridably
  routes the one phase agent that runs the real surface end-to-end and inspects the
  resulting tree -- which is how this criterion insists both of its verdicts be
  reached. The clause described a durable file without naming one, so the derivation
  read false while the record declared true, and the schema check refuses that
  disagreement. A future reader must not read this as widening the AC: the failure
  verdict, the separate outcome and message clauses, the attribution control and the
  scope bound against -1, -2 and -4 are all unchanged, and every it-po field --
  including declares_side_effect: true -- is as the it-po left it.
