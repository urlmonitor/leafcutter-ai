criteria: |
  Built screen, approved design, requirement — one chain you can actually walk.

  A finished page says which design it realises, and the design says which
  requirements it answers, so the whole path from the thing on screen to the
  thing that was asked for can be followed without a person joining it up by
  hand. Comparing what was built against what was designed becomes a mechanical
  check rather than a claim someone makes about their own work.
