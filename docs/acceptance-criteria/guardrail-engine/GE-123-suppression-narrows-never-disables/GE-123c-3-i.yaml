notes: |
  THE PAIRED POSITIVE ARM FOR THE WHOLE L1, MEASURED ON THE REAL ARTIFACT. Every
  other criterion in this L1 asserts that some shape now warns. This one is the
  counterweight, and it is the arm that decides whether the feature is safe to
  ship: the check runs on every commit in this repository and in every project the
  package is installed into.

  IT MUST BE THE REAL FILE, NOT A FIXTURE. A hand-written fixture reproduces the
  author's own idea of what a real entry looks like, which is exactly the bias that
  let a sibling defect in this component survive its tests — a parser that no-oped
  on every real artifact passed a full suite of synthetic ones. The 53 live entries
  cover both rule ids in use, wildcard and decimal line-number fields, paths from
  one to five segments deep, and filenames containing dots, dashes and digits.

  BEHAVIOUR IF THE FILE IS ABSENT. A checkout without an allowlist is a normal
  state, not a failure — nothing to load, nothing to warn about, and this criterion
  has nothing to measure there.

  THE THIRD ARM IS NOT REDUNDANT. Silence is trivially satisfiable by loading
  nothing at all, which is why the count of entries loaded and the suppressions
  they still perform are both asserted alongside it.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. The count 53 is correct as measured on
  2026-08-18 and is retained in the criteria as the BA wrote it, but the test must
  DERIVE the expected count from the file rather than hard-code it — otherwise the
  guard fails for the wrong reason the first time anyone adds a suppression, and
  the usual repair is to delete the assertion. Same reasoning for the second arm:
  discover the copies by walking the tree, never by listing paths.
