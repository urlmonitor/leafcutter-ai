notes: |
  Wave 2. Record shape from the brief (field name verified_by; keys method, check,
  wired_as, reviewer, date, inspected[{path, blob}], statement). Field names are
  the IT PO's to confirm; the criteria are written in behaviour terms.

  User decision at the BA gate (2026-10-25): a missing or invalid verification
  record is refused only when the record is marked done, never at write time.
  The brief's write-time if/then schema rule is therefore dropped. Refusing at
  write time would block every edit to the roughly 170 unfinished test-free
  records until each had a verification record.

  The inspection form references the workflow run whose interactive gate recorded
  the approval, not a free-text reviewer or date; see BO-2500f-3-i (revised
  2026-10-25: gate approval, not a GitHub pull-request approval). The last clause
  was reworded 2026-10-25 so it reads as a validation outcome, not a write.

  Only two of the IADT methods (inspection, analysis, demonstration, test) are in
  scope, per BO-2500f's notes.
