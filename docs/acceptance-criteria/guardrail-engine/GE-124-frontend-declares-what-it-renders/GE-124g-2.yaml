notes: |
  PLACE 2 OF FOUR. THIS GATE IS NECESSARY, NEVER SUFFICIENT — the PO calls it
  the sharpest risk in the whole tree.

  THE MESSAGE CLAUSE IS NOT COSMETIC and is the reason it is a scenario of its
  own. A gate that behaves correctly while printing "UXP-607 verified" teaches
  every reader the wrong thing, and the reader is the mechanism by which the
  substitution actually happens — nobody writes a line of code that says a
  declaration is a test, they read a green message and stop looking. The banned
  words are enumerated so the check on this is testable rather than a matter of
  taste.

  The worked case is KM-ADM-004: pinned on a real element, `covered_by` empty.
  The mock-data artifact carries it deliberately so the dataset cannot be read
  as making a pin substitute for coverage.

  RELATIONSHIP TO GE-124e-3-i: that L3 requires the two gates to FAIL
  independently; this AC bounds what PASSING one of them is worth. Both are
  needed — the first stops one gate suppressing the other, the second stops a
  pass being read as a finish.

  IT-PO NOTE (2026-08-25). The criteria say "no tool marks it finished on the
  strength of the declaration gate passing". That is an obligation on the store's
  WRITE surfaces, not on the gate, and it is the half most likely to be skipped
  because it requires looking outside the file being built. mark_ac_done.py and
  the fast-lane completion path are the two concrete places to check.
