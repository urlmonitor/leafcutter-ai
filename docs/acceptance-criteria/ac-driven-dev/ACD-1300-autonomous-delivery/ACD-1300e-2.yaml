notes: |
  Extends ACD-2100c-3 (single-decision resume) to a chain of decisions. Compatible with
  ACD-2100c-3-i: an answer naming a decision other than the one in the record is still
  not applied. The one-answer-per-resume shape is kept deliberately (BA assumption): each
  pause is resumed by the answer for the decision it names. Supplying answers for several
  decisions in one resume is NOT specified here.
