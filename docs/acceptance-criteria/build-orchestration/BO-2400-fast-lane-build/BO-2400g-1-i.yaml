id: BO-2400g-1-i
components:
  - build_orchestration
  - testing_quality
title: "Every requirement the run picked up is asked for the proof, not just the one that was named"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a person points the fast way at one requirement,
  And working out what that requirement is connected to pulls in four more — its
    own detail requirements plus one unfinished prerequisite it depends on,
  When the person writing the tests is told what to write for that run,
  Then all five requirements are asked for a proof that the finished work is reached
    the way the product is really used,
  And the request for the four that were pulled in is the same request as for the one
    that was named — being reached indirectly does not earn a weaker ask,
  And a run that resolves to exactly one requirement is asked once, with no duplicate
    request added for the same requirement.
depends_on: [BO-2400g-1]
doc_links:
  - path: scripts/build_orchestration/fast_lane.py
    relationship: describes
    status: exists
    relevance: "resolve_connected_build_set (line 498) is what turns one named id into the connected set — the subtree plus unmet prerequisites, readiness-agnostic. The resolved set is the lane's only notion of 'the work', and it is exposed to the workflow as batchIds."
  - path: templates/workflows-js/fast-lane-ship.js
    relationship: describes
    status: exists
    relevance: "The Resolve and Claim phases run before Test Writer (line 327), so the full resolved set is already known at the moment the test-writing instructions are composed. There is no ordering excuse for asking only about the named id."
  - path: docs/acceptance-criteria/build-orchestration/BO-2400-fast-lane-build/BO-2400f-1.yaml
    relationship: related
    status: exists
    relevance: "Owns the resolution behaviour itself ('Resolve one AC id to its connected build set, in dependency order'). This L3 consumes that set and must not re-specify how it is computed."
assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: false
it_requirements:
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/build_orchestration/ unit_tests/workflows/ -q"
  config_schema_fragment:
    type: object
    description: "The run-level instruction payload: the per-AC payload from BO-2400g-1 emitted once for every member of the resolved connected set, keyed by member id."
    required:
      - members
    properties:
      members:
        type: array
        description: "One entry per resolved member id, in the resolver's dependency order. Every entry carries the identical reachability request; membership is whatever resolve_connected_build_set returned, never a filtered subset."
        items:
          type: object
          required:
            - ac_id
            - test_spec
          properties:
            ac_id:
              type: string
            test_spec:
              type: array
              items:
                type: object
  constraints:
    - "The set asked is exactly the set resolved. Bind to the resolved connected set the lane already holds (resolve_connected_build_set, fast_lane.py:498, surfaced to the workflow as batchIds) — do not re-resolve, re-filter, or drop members by readiness. How the set is computed belongs to BO-2400f-1 / BO-2400f-2 and must not be restated or reimplemented here."
    - "EXACTLY ONCE PER MEMBER — the duplicate-request hazard is the point of the third Then clause. The obvious repair for the five-member gap is to append the request once per member; the obvious existing behaviour is to append it once per run. Implementing the first WITHOUT removing the second double-asks on every single-member run. This is the 'skip-branch side-effect: conditionalize, don't add' defect recorded in CLAUDE.md, which duplicated an entry on every skipped step and stayed green because the structural test only checked presence. Emit at exactly one place in the composition path — that is what n_location_rule '1' means here."
    - "The request attached to a pulled-in member must be the SAME text as the one attached to the named member — no truncated summary, no 'see above', no weaker note. Assert per member id rather than by counting occurrences: an implementation that emits the request once for the whole run passes a count-based check while leaving four members unasked."
    - "PLANNING-TIME ONLY, INHERITED FROM THE PARENT. This AC says nothing about whether any of the members was actually reached, and nothing it emits may be offered as evidence of that (BO-2900a-2)."
    - "MIXED SURFACE, INHERITED FROM THE PARENT. The Python half composes the per-member payload; the consuming change is in templates/workflows-js/fast-lane-ship.js, whose Test Writer prompt at line 333 must carry it. `.js` is owned by no agent in config/agent_registry.json; the tree's convention (BO-2400a-1, a-3, a-5) is llm-expert. Do not mark this AC done with the emitter alone."
    - "Payload composition must stay a single pass over the already-resolved set: no additional read of the AC store per member, and the five-member case must add no measurable latency over the one-member case beyond the per-member serialisation itself."
    - "TESTS MUST NOT BE GREP-ONLY. Observe the emitted payload behaviourally through unit_tests/_workflow_engine_harness.py by asserting on the CAPTURED DISPATCH SEQUENCE, never on meta.phases."
delivers_to:
  - agent: test-writer
    contract: "The run-level instruction payload in config_schema_fragment: one entry per resolved member id, each carrying the identical reachability request text defined by BO-2400g-1, in the resolver's dependency order, with no member asked twice."
expects_from:
  - ac_id: BO-2400g-1
    contract: "The per-AC instruction payload and the single-source reachability request text. This L3 extends its emission from the named id to every member of the resolved set; it must reuse that request verbatim rather than composing a second one."
  - ac_id: BO-2400f-1
    contract: "The resolved connected build set for the run — the named id's subtree plus unmet prerequisites, readiness-agnostic, in dependency order — as produced by resolve_connected_build_set (fast_lane.py:498) and surfaced to the workflow as batchIds. Consumed as given; this AC does not re-specify or re-compute it."
test_spec:
  - name: test_all_five_resolved_requirements_are_asked_for_the_proof
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A real temp store where the named AC resolves to five members; the emitted test-writing instructions carry the reachability request for every member id, asserted per id rather than by counting occurrences."
  - name: test_pulled_in_members_get_the_same_request_as_the_named_one
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The request text attached to the four pulled-in members is identical to the one attached to the named member. Fails on an implementation that asks fully for the named id and adds a weaker or truncated note for the rest."
  - name: test_single_member_run_is_asked_exactly_once
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A run resolving to one member produces exactly one reachability request for it. Run alongside the five-member case so an implementation that appends per-member and per-run cannot pass both."
test_rationale: "Asking only about the id typed on the command line satisfies BO-2400g-1 completely: that AC speaks of 'one piece of work', and in the single-member case the two implementations are indistinguishable. The connected set is the normal case for this lane, not an exotic one, so the gap would ship silently. The per-id assertion matters more than a count, because an implementation that emits the request once for the whole run passes a count-based check while leaving four requirements unasked; and the single-member case is asserted in the same suite because the natural over-correction — append per member and once per run — double-asks and is invisible when only the five-member case is tested."
