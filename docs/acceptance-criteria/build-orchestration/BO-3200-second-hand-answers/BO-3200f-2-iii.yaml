test_rationale: |
  Most of this record is a guardrail's decision on a payload, so it is proven by running the real
  hook scripts on real payloads -- cheap, deterministic, and the same process the harness runs.
  Every per-variable test enumerates from the declaration and the shipped settings, because a test
  that lists four variables by hand passes on a refusal that also lists four by hand and fails
  the fifth scenario the day a fifth variable arrives.
  The seam test with BO-3200f-3's module unavailable is the discriminator the BA wrote the third
  scenario for: it can only pass if the refusal happens at the guardrail.
  The fast-lane commit test reads the real shipped command because the cheap fix -- deleting the
  bypass -- passes every executor test and breaks that step; it is the test that makes the
  non-removal rule mechanical rather than a sentence.
  The identity tests exist because the known defect in this area is identity by token match;
  without a mintability test the new check could reproduce it one layer up.
  The single live descriptor is last and conditional: whether the live payload identifies the
  executor is unknown today, and the test must report that finding rather than pass by accident.
