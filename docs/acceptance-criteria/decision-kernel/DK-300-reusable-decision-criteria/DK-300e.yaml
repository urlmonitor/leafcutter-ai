notes: |
  USER REQUIREMENT (original idea): "we only need LLMs to generate further
  categories if jev thinks some are missing to make better decision". This is
  ADR-053's order applied to criteria: reuse, then Jev, then an LLM, then a
  human.

  COLD START. With no published categories, behaviour equals today's forming
  flow. This is a regression guard: an empty library must not block, degrade or
  slow down a decision.

  OPEN, for BA / IT PO: what exactly Jev judges (coverage of this decision's
  concerns against the reused set) and how that verdict is shown. The PO
  recommends showing it at the approval gate, so the person sees WHY new
  criteria were drafted, or why none were. A sufficiency verdict that the person
  overrules (by adding criteria) is useful evidence for later calibration.

  Feedback loop: drafted and human-added criteria that end up in a PUBLISHED
  decision become published-record input to DK-300a. Draft-only wordings are
  seen through traces only.
