options:
  - id: opt.yaml_per_decision_component_folders
    title: One YAML file per decision in component-scoped folders, with a schema in config/
    description: 'Layout: docs/decisions/<component_id>/<record_id>.yaml, with docs/decisions/_repository/ for repository-wide
      decisions. Id: the kernel''s dec-<16 hex>, so a filed record maps 1:1 to the run''s Decision. Fields: id, question,
      decision_type, options[] (id, title, description), criteria[] (id, question, priority, kind), selected_option_id, rationale,
      assessments[] in the kernel''s CriterionAssessment shape (criterion_id, option_id, outcome pass|fail|uncertain, evidence_ids),
      evidence[] (locator path#Lx-Ly, content_hash sha256, source_version {commit, dirty}), approval_status using the kernel''s
      ApprovalStatus (not_required|proposed|approved|rejected), approved_by, approved_at, scope filters {components[], languages_or_frameworks[],
      folders[], repository_wide, roadmap_phase}, versions {policy, template, model}, trace {run_id, trace_url}, outcome {status,
      observed_at, evidence[]}, corrections[] (date, by, change, reason; append-only), supersedes / superseded_by. Validation:
      a record schema under config/ checked at commit. Findability: docs/decisions/ must be added as a retrieval source root
      (or knowledge-map surface), otherwise later runs never read it.'
    assumptions:
      - Approval fields and assessment outcomes reuse shapes the kernel already exports (decision request and report schemas);
        the correction log, supersession and file-type filter have no precedent in this run's evidence.
      - Scope levels follow spec 18.4 (repository, language/framework, component, folder); roadmap_phase uses the roadmap's
        phase ids, which 18.4 does not list as a scope.
      - Round 5's evidence on the knowledge-map parser's plain-YAML limits is not in this run's evidence; nested YAML readability
        is unverified here.
      - 'This run''s evidence: the Stage 0 delta''s learned Decision node (question, decision_type, options_json, selected_option,
        approval_status, approver, langfuse_trace_id, repository_revision, created_at; id dec-<16 hex>; ABOUT a component,
        SUPERSEDES another decision) and its provenance fields support the record fields; component ids are the 45 snake ids
        of docs/components.json.'
    evidence_ids:
      - ev-27c8e6023c8b1d02
      - ev-9b13e430034dcba6
      - ev-1d195ec5c4c771bb
    proposed_by: host.generate_options
    approved_by: human:user
  - id: opt.reuse_ac_store_conventions
    title: Reuse the AC store's YAML conventions and id minting
    description: 'Layout: one YAML per decision under docs/decisions/<namespace>/<PREFIX>-NNN.yaml, with a prefix per namespace
      and ids minted the way AC ids are, enforced by extending the AC store''s schema and identifier-uniqueness checks. Reuses
      AC-style fields: components, roadmap_phase, scope, parent, doc_links extended with content_hash and source_version for
      evidence, and superseded_by with an existence check. Decision-specific fields: question, decision_type, options, criteria
      with kind, selected_option_id, CriterionAssessment-shaped assessments, approval_status (ApprovalStatus), approved_by,
      approved_at, kernel_decision_id (dec-<16 hex>), versions, trace_url, outcome, corrections[]. The AC store is already
      a configured retrieval source (repo.acceptance_criteria).'
    assumptions:
      - This run's evidence shows only that docs/acceptance-criteria is a retrieval source; the AC id format, minting, schema
        checks and superseded_by behaviour that this option reuses were evidenced in round 5 but are not in this run's evidence.
      - AC semantics (work_status, depends_on) do not apply to decisions.
      - 'This run''s evidence: AC records already expose title, level, status, work_status, priority, readiness and roadmap_phase
        through the fingerprint-cached get_ac_index, keyed by existing ids such as ACS-100.'
    evidence_ids:
      - ev-9b13e430034dcba6
      - ev-27c8e6023c8b1d02
    proposed_by: host.generate_options
    approved_by: human:user
  - id: opt.yaml_files_plus_generated_index
    title: One YAML file per decision plus a generated, never hand-edited filter index
    description: 'Layout: docs/decisions/<record_id>.yaml (flat, id dec-<16 hex>) holding the full record (question, decision_type,
      options, criteria with kind, selected_option_id, rationale, CriterionAssessment-shaped assessments, evidence with locator,
      sha256 and source_version, ApprovalStatus approval_status/approved_by/approved_at, versions, trace link, outcome, append-only
      corrections, supersedes/superseded_by), plus a generated index listing each record''s scope filters (components[], languages_or_frameworks[],
      folders[], repository_wide, roadmap_phase) and provenance (git SHA, dirty flag, path), rebuilt and never edited, so
      a run filters without opening every file. docs/decisions/ is added as a retrieval source root.'
    assumptions:
      - The index must be kept in sync (rebuilt at commit or on read); no indexer for decisions exists in this run's evidence.
      - Round 5's evidence for the projection key (repository_id, kind, id) and the cached AC index precedent is not in this
        run's evidence.
      - 'This run''s evidence: a planned structured-store source kind would read one record per file with filterable fields
        declared in configuration and return a bounded, ordered sample, and the delta''s projection keys records by (repository_id,
        kind, id) with git SHA and dirty flag.'
    evidence_ids:
      - ev-88966751b3cbceef
      - ev-9b13e430034dcba6
      - ev-27c8e6023c8b1d02
    proposed_by: host.generate_options
    approved_by: human:user
  - id: opt.added.1
    title: Kernel-contract YAML per decision
    description: 'Flat docs/decisions/<dec-id>.yaml, one file per decision, kernel-minted dec-<16hex> ids. Fields mirror the
      kernel''s Decision contract (kernel/contracts/decision.py) and the colony concept §15 decision fields: question, decision_type,
      task_context, options, criteria, evidence, selected option, assessment/confidence, final outcome, corrections with correction
      reason. Concept §12 provenance: origin, root task id, Langfuse trace id, repository revision, policy/template/model
      versions. Filters drawn only from existing vocabularies: component ids from docs/components.json, change_target, risk_surface,
      roadmap_phase, file-type rule globs from templates/rules, plus a repository_wide flag. An approval-provenance block
      (approval_status, approved_by human actor, approved_at); records never self-authorize. Append-only corrections that
      preserve the original evidence and assumptions. JSON Schema in config/ validated at commit. A generated, never hand-edited
      filter index. A decisions surface in config/paths.json. Plain-YAML subset compatible with the stdlib knowledge-map parser.'
    assumptions: []
    evidence_ids: []
    proposed_by: human:user
    approved_by: human:user
criteria:
  - id: crit.findable_by_filters
    question: Can a later run select precedent by component, roadmap phase, repository-wide flag and file type or language
      without opening every record?
    priority: required
    kind: design_judgement
    evidence_ids: []
  - id: crit.knowledge_map_readable
    question: Can the existing knowledge-map ingestion (stdlib parser, paths.json surfaces) read each record's id and filter
      fields without a new parser?
    priority: required
    kind: design_judgement
    evidence_ids: []
  - id: crit.reviewable_diffs
    question: Does a new decision, an approval or a correction show up as a small, reviewable diff in one file?
    priority: required
    kind: design_judgement
    evidence_ids: []
  - id: crit.enforced_ids_and_links
    question: Are record ids unique and supersedes or superseded_by links checked at commit, as check-identifier-uniqueness
      and check-adr-collision do today?
    priority: required
    kind: design_judgement
    evidence_ids: []
  - id: crit.provenance_complete
    question: Does a record carry evidence locators with content hashes, source_version (commit, dirty), policy/template/model
      versions and a trace link, as the active roadmap phase requires?
    priority: supporting
    kind: design_judgement
    evidence_ids: []
  - id: crit.reuses_conventions
    question: Does it reuse existing schemas, id minting and validators rather than adding new ones?
    priority: supporting
    kind: design_judgement
    evidence_ids: []
