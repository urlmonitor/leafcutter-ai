    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: criterion
    description: "The scan continues to rank and emit ready ACs from the acyclic remainder — the clause that distinguishes 'degraded to a warning' from 'silently produced nothing'."
