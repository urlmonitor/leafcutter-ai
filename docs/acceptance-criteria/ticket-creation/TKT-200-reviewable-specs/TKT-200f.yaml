criteria: |
  Premises are confirmed against a clean, CI-equivalent tree -- not a developer's dirty local one.

  Before a ticket leaves the inbox, its captured factual claims are verified
  against a clean, CI-equivalent environment rather than a developer's local tree.
  A premise that only looks true because of stale local artifacts -- for example a
  build that exits 0 locally but fails in CI -- can never become load-bearing.
