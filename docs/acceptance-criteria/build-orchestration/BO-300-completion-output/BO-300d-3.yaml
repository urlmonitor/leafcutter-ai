notes: |
  THE UNDETERMINED ACTION IS THE HARD ONE and is the reason this is its own record.
  It is easy to write an action per cause when the cause is known; the criterion
  that matters is that the undetermined bucket still yields a usable next step
  rather than a shrug. KI-BO-026's own remedy — re-run the build over the same body
  of work — happens to be safe under both possible causes, which is the shape being
  demanded.

  OVERLAP NOTED, NOT DUPLICATED: BO-300a-5's fourth Then clause already requires an
  action for the pieces its re-read surfaced. Those pieces are a subset of the ones
  covered here, and under BO-300d-2 they are exactly the pieces whose cause is now
  undetermined. This record does not change what BO-300a-5 requires; it requires the
  same thing of the pieces BO-300a-5 does not reach.
