id: AR-300c-2
title: "The consolidation carries the union of both rival ability records, and says what it did with each"
component: agent-registry
components:
  - agent_registry
  - skill_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the two central fields that record ability grants today, holding
    different populations -- 32 agents in the older field, 40 in the newer, and
    12 present only in the newer,
  When the grants are consolidated into each agent's own declaration,
  Then every agent named in either field has a declaration afterwards, so the
    population consolidated is the union of the two and not either one alone,
    And for each such agent the abilities declared are the union of the abilities
      the two fields recorded for it, so no grant is dropped,
    And no agent has a declared ability that neither field recorded for it, so no
      grant is invented,
    And the consolidation accounts for every agent in both fields by name,
      reporting for each which side or sides its abilities came from, and
      reporting the three counts it worked from,
    And an agent named in neither field ends with no declaration, rather than an
      empty one,
  So the twelve agents that exist in only one of the two records are carried
    across, and a reader can check the migration rather than trust it.
depends_on:
  - AR-300c
doc_links:
  - path: config/agent_registry.json
    relationship: modifies
