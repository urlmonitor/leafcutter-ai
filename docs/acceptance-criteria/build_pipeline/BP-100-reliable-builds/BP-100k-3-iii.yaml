notes: |
  MEASURED ON THE REPORTING MACHINE, 2026-09-14, IMMEDIATELY AFTER A SUCCESSFUL
  FULL build.py RUN: check-output-drift reported
  `RESULT verified=474 uncomparable=7 exempt=1 gaps=6 drifted=0 missing=0
  unreadable=0` with six named gaps: `.claude/changelog_categories.md`,
  `.claude/scheduled_tasks.lock`, `.claude/settings.local.json`,
  `.claude/skills_config.json`, `.gemini/skills/frontend-design/SKILL.md`, and
  `scripts/commit_guardian/known_failing_tests.py`. The gate's own remediation
  text ("action=run build.py to register it") is demonstrably wrong for at
  least two of the six: build.py had just run to completion and left them as
  gaps regardless, because no template exists that could ever produce them.

  WHY FOUR ARE EXEMPT AND TWO ARE NOT, PER FILE:
    .claude/settings.local.json — gitignored (.gitignore:33); adopter-owned
      machine-local settings; same class as the four scaffolds already in the
      registry.
    .claude/scheduled_tasks.lock — a runtime lock a scheduled task acquires,
      its content a session id, a pid, and an acquisition timestamp that is
      different every time it is written; no template anywhere produces this
      shape of content.
    .claude/skills_config.json — the build's own INPUT, read by config_loader.py
      to drive every phase; no build phase writes deterministic content here,
      because the whole build reads FROM this file rather than TO it.
    .claude/changelog_categories.md — gitignored (.gitignore:35); the exact
      write-if-absent-then-hand-appended class the `.claude/precommit-
      autofix.json` entry already covers, simply never declared for this
      sibling scaffold (both are seeded by build_config_scaffolds.py with
      force=False).
    .gemini/skills/frontend-design/SKILL.md — NOT a registration gap. Its
      template (templates/skills/frontend-design/SKILL.md) carries
      `deprecated: true`; build_skills() and the manifest's
      _compute_output_mappings() both call the shared
      build_phases._skill_is_deprecated() and skip it identically, by design,
      since the skill was deprecated and its principles migrated into
      templates/agents/frontend-coder.md. The file on disk on the reporting
      machine dates from 2026-06-02, before deprecation — a stale leftover
      with no template able to reproduce it today. Registering or exempting it
      would either misdescribe the build (it does not produce this file) or
      create the exact orphan blind spot the registry's own history warns
      against. Correct remedy: delete the file.
    scripts/commit_guardian/known_failing_tests.py — NOT a registration gap
      either, and for a related but distinct reason: scripts/
      build_propagation_audit.py's own DECISION HISTORY (2026-08-18 entry)
      records that this script's TEMPLATE was deleted outright as dead code
      once TQ-100d-1 specified its replacement — "the dead script was deleted
      outright rather than wired up as a weaker competitor." No template
      under templates/scripts/commit_guardian/ produces this filename at all
      today. Same remedy: delete the deployed leftover.

  THIS DIRECTLY CONTRADICTS THE INCOMING HYPOTHESIS THAT BOTH OF THESE WERE
  "genuine deploy-manifest omissions" needing registration. Both are orphans
  of intentional deprecation/deletion decisions already recorded elsewhere in
  this repository's own history; registering either would assert the build
  produces something it was deliberately changed to stop producing.
