created: 2026-07-10
amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      Criteria replaced, not narrowed. The original specified a warn-and-confirm
      gate — warn that commits will land directly on main, ask the user to
      confirm, and on confirmation continue the normal phase sequence. That path
      is gone: main here is PR-only under the require-ci-lint branch-protection
      ruleset with six required status checks, so a direct commit to main cannot
      be pushed and confirming produced work that could never land. The workflow
      now self-isolates on main/master rather than offering to commit there. The
      original's clean-halt-on-rejection clause survives in altered form as the
      final clause: the workflow still halts without creating anything when it
      cannot proceed, but the trigger is now an isolation failure rather than a
      user declining.
  - reason: schema-repair
    by: business-analyst
    at: '2026-08-24'
    note: >-
      This record was itself a live artifact of the flat six-field AC template
      that the same change retires — almost certainly written by a real
      /quick-fix run against the stale BP-600b-1. It was missing level,
      work_status, depends_on, covered_by, implemented_by, superseded_by,
      created, doc_links, assigned_agent and amended_by, and it was an orphan:
      no depends_on, and absent from BP-600's covered_by list, so no parent
      claimed it. Those fields are supplied here and BP-600's covered_by now
      lists it. Two judgement calls worth flagging: (1) level is L1 — a
      single-letter suffix under an L0 is an L1 position in this store's naming,
      and the id is preserved rather than renumbered into the L2 slot its
      behavioural shape would otherwise suggest; (2) work_status is set to todo,
      the value every sibling L1 in this folder carries, and NOT done — the
      behaviour is implemented in the templates, but this record has no covering
      test in covered_by, and marking it done without one is precisely the
      phantom-done pattern check_done_proof exists to refuse.
