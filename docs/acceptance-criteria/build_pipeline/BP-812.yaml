title: "check_secrets.py treats templates/skills/ prose files as prose (no placeholder false-positives)"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
origin_agent: BrainCandy
criteria: |
  Given the deployed check_secrets.py (built from templates/scripts/commit_guardian/)
    and a staged file under templates/skills/ that contains a documentation placeholder
    such as a TICKET-YYYYMMDD-style token in prose,
  When the check-secrets pre-commit hook scans that staged file,
  Then templates/skills/ is treated as a prose-only prefix (in _PROSE_FILE_PREFIXES)
    and the placeholder is NOT flagged as a secret/high-entropy finding
  And the symptom ("check-secrets false-positive on TICKET-YYYYMMDD- placeholders in
    templates/skills/ prose, requiring a .security-allowlist workaround") must not occur
