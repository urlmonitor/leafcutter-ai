notes: |
  THE THIRD MEANING OF SILENCE, AND THE ONLY ONE THAT CANNOT BE REMOVED — only
  made visible. ACS-1400a-1 and ACS-1400a-2 remove the other two. This record
  deliberately does NOT try to make the commit-time check store-aware: that is
  ACS-1400b's instrument, and a commit-time check that walked the whole store
  would report findings the committer cannot act on, which is the same
  unsatisfiable-gate pressure ACS-1400a-1-i guards against.

  WHY THIS IS WORTH A RECORD AT ALL. Three defences documented in this repo's
  CLAUDE.md turned out to be no-ops that reported clean: the feedback-categories
  path check, the schema validator's bare-directory glob, and a merge audit run
  against a stale reference. The shared shape is that a run which examined
  nothing was indistinguishable from a run that found nothing. This AC is the
  local fix for that shape on this check.

  DELIBERATELY NOT A COUNT OF VIOLATIONS. The number that matters is the
  denominator — records examined — not the numerator. A check reporting "0
  violations" while having examined 0 records is the exact defect.
