notes: |
  Item 3, verified 2026-10-16 (BA, by reading only the root lines): check_adr_cross_reference.py:64
  sets REPO_ROOT = parents[2] and joins every staged path, docs/components.json and the ADR
  folder to it (L65, L232, L263, L306, L350); a missing file reads as empty frontmatter and
  returns no finding, so from the installed .leafcutter/ copy the check is INERT. If its
  strict setting is off, the findings are warnings and the commit still completes; the
  criteria require only that the installed copy now sees them. ADR-901 is a fixture name.
  check_structural_change.py is NOT inert and gets no record here: it already resolves the
  root via _resolve_root.find_project_root (L68-70); its parents[2] REPO_ROOT at L83 is an
  unused leftover whose removal is already required by GE-113c-1-iv ("no guard re-derives
  the project root via parents[N]").
