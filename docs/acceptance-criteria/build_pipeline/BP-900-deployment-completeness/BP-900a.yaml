id: BP-900a
components:
  - build_pipeline
title: "Use /build-ac in any consumer project without missing scripts"
component: build_pipeline
level: L1
status: active
req_status: approved
readiness: approved
priority: critical
work_status: not_started
criteria: |
  Given a consumer project that has run build.py successfully,
  And the AC-pipeline entry points are the script paths the build-ac agent
    template, the ac-scanner skill and the build-ac skill invoke — that set
    DERIVED by scanning those templates for their script references, never
    enumerated by hand in this criterion,
  When the user invokes /build-ac (which dispatches the build-ac agent),
  Then every one of those entry points is present in the deployed tree at the
    path the template resolves,
  And the deployed tree also contains every module in each entry point's
    transitive intra-package import closure, that closure DERIVED from what the
    entry point's code actually resolves — import statements, __file__-relative
    path construction and dynamic loader calls, followed through dependencies of
    dependencies — so a module a deployed script begins importing tomorrow is
    covered with no list for anyone to update,
  And each entry point, run from its DEPLOYED copy in a fresh subprocess with the
    package source tree absent from sys.path, completes module import and reaches
    its command-line entry without ModuleNotFoundError,
  And a build whose deploy declaration ships an entry point while withholding one
    module of that entry point's closure exits non-zero, naming the entry point,
    the withheld module and the deploy phase that would have to carry it, instead
    of producing a tree this criterion would certify,
  And no "script not found" or "No such file or directory" error occurs.
  Because an enumerated filename list cannot express this: on 2026-09-14
    scripts/goal_to_epic.py was decomposed into fourteen sibling modules that it
    now imports at module scope, so a deployment carrying goal_to_epic.py and
    none of the fourteen passes a presence check naming goal_to_epic.py while
    raising ModuleNotFoundError the first time /build-ac's goal mode invokes it.
    The list had already gone silently stale once before — _ac_components.py was
    absent from the deploy map and shipped broken until a derived-closure check
    surfaced it, not a manual audit.
depends_on: [BP-900]
