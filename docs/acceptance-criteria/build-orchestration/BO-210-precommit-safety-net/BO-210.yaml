created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a coder agent has signed off on a ticket and the commit phase later fails a pre-commit hook,
  When the pre-commit auto-fix path recovers the commit,
  Then the agent that fixes the violation is the SAME agent type that authored the work,
  And that agent receives the original coder's design context (intent, file rationale,
    consumers already checked, red-baseline test names, design constraints),
  And it fixes only what the hook requires without re-deriving the design from scratch,
  And the commit is retried once, exactly as today,
  And the safety net never weakens the hooks themselves (the skill-vs-hook parity drift
    root cause is explicitly out of scope and handled separately).
