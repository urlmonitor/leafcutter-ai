criteria: |
  Get useful answers and improve what your project can find.

  Research starts with a clear question and produces evidence that can be checked against it. When an essential research ability is genuinely missing, the system can develop and verify that ability for reuse, then return to the original question. Missing information, failed services and unfinished research remain visible instead of being mistaken for a completed answer.
