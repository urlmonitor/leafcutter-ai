notes: |
  BO-4300b's notes: "any platform" includes a Windows/WSL mix. Today two worktree entries made
  from WSL are stuck "locked initializing" and unusable from Windows because the gitdir file
  embeds one platform's path spelling; decision 1 (clones embed no absolute path) makes this
  achievable.
