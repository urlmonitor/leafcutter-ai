criteria: |
  Given goal ACD-050 (title: "Validate API inputs") produces an epic folder
    named EPIC-ValidateApiInputs,
  And 3 leaf ACs are in scope: ACD-050a-1, ACD-050a-2-i, ACD-050b-1,
  And none of these ACs have a target_epic field set,
  When the epic generation completes and the folder is assembled,
  Then all 3 AC YAML files are updated with target_epic: EPIC-ValidateApiInputs
  And the target_epic field is written to each AC's YAML file on disk
  And the target_epic value exactly matches the epic folder name (case-sensitive).
