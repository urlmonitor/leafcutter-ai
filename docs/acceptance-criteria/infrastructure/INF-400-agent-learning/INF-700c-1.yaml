assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "DELETE THE SUBSTITUTION OUTRIGHT. scripts/knowledge/harvest_learnings.py line 351 reads `learning_text = event.get(\"text\", f\"[{entry_kind}] Learning from {ticket}\")`. The default must be removed, not narrowed, not guarded by a flag, not moved behind a config toggle. A default that still exists somewhere on the write path is a defect waiting for the next caller; the emitter-side twin of this prohibition is INF-700b-1-i."
  - "CLASSIFICATION ORDER IS LOAD-BEARING — this is the single change that decides whether INF-700c-2 can reach its resting state. The no-learning-text test must run BEFORE the `entry_kind not in _KNOWN_ENTRY_KINDS` test at line 331. All 28 retained records carry BOTH an unknown entry_kind and no `text` (15 distinct kinds on disk, none of them among the 11 in _KNOWN_ENTRY_KINDS), so kind-first classification puts every one of them in `skipped_unknown`, which returns exit 3 forever — the permanently non-zero backlog the PO's hard constraint forbids."
  - "'No learning text' means: the key is absent, the value is null, or the value is a string that is empty after whitespace normalisation. It must additionally reject a value that is a restatement of the record's own descriptive fields, so that deleting the harvester default cannot be undone by an emitter that inlines the same string."
  - "A FOURTH COUNTER on HarvestResult, disjoint from the existing three: no-learning-text count plus a per-entry_kind breakdown, rendered in summary() alongside routed / unroutable / write_failures. The invariant to assert: routed + previously_processed + skipped_unknown + write_failures + no_learning_text equals the number of knowledge_captured records read. A bucket that does not participate in a total is a bucket that can silently drop records."
  - "NO STATE ENTRY for an ineligible record. Do not add its hash to the idempotency record. The classification must be re-derived from the record on every run, so the resting state survives a fresh clone or a consumer install — debugging/logs/ is gitignored (.gitignore:60), so anything recorded there is not durable and would silently reimpose the manual step INF-700c-2's criteria forbid."
  - "BYTE-FOR-BYTE DESTINATION INVARIANCE. For an ineligible record the writer must not open the destination for append, must not mkdir its parent, and must not touch it. Today _default_capture creates parent directories before writing; an ineligible record must never reach that function. Note that one of the ten destinations, memory/feedback_itpo_bo1700_worktree_gate_parity.md, does not exist and has never existed in git history — the 'creates no file' clause is about that record specifically."
  - "Non-knowledge lines must not enter any bucket. The live stream holds 4 lines with no `event` key ({\"probe\": \"pre-drive-check\"}, from the writability probe this repository's own pre-drive checklist prescribes) and 1 line that is not JSON at all. They are filtered before classification; INF-400c-4-iii owns the stream split and INF-700c-1-i owns the malformed line."
  - "Must not depend on which sink path is configured. The harvester's default is debugging/logs/knowledge_emissions.jsonl, which has never existed; the live records are in debugging/logs/agent_telemetry.jsonl. The eligibility rule is per record and must hold whatever INF-400c-4 settles."
  - "Exit-code consequence, stated here because it is produced here: with the no-learning bucket in place, a run whose entire input is ineligible records has skipped_unknown = 0 and write_failures = 0, so main() returns 0 — the same code an empty input returns. INF-700c-2 asserts that equality; this AC must not introduce a new non-zero code for the ineligible bucket."
test_spec:
  - name: test_record_without_text_appends_nothing_and_leaves_destination_unchanged
    target_dir: tests/knowledge/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "An existing destination file is hashed before and after a run over one textless record and is byte-identical; capture_fn is never called."
  - name: test_record_without_text_creates_no_destination_file
    target_dir: tests/knowledge/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A textless record naming a destination that does not exist leaves the path absent, covering the one of ten destinations that was never created."
  - name: test_no_placeholder_line_is_synthesised_from_descriptive_fields
    target_dir: tests/knowledge/
    framework: unittest
    type: unit
    angle: criterion
    description: "No output anywhere contains a string of the form '[<entry_kind>] Learning from', proving the substitution was deleted rather than relocated."
  - name: test_textless_records_are_counted_separately_from_unroutable_and_written
    target_dir: tests/knowledge/
    framework: unittest
    type: unit
    angle: criterion
    description: "The result exposes a no-learning-text count distinct from routed, skipped_unknown and write_failures, and the five buckets sum to the number of knowledge records read."
  - name: test_textless_record_is_classified_before_entry_kind_routing
    target_dir: tests/knowledge/
    framework: unittest
    type: unit
    angle: seam
    description: "A record with BOTH an unknown entry_kind and no text lands in the no-learning bucket and NOT in skipped_unknown — the ordering guard on which INF-700c-2's exit code depends."
  - name: test_full_real_corpus_of_28_writes_nothing_and_creates_nothing
    target_dir: tests/knowledge/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Run over tests/fixtures/harvest_learnings/unroutable_corpus_28.json with the nine real destination paths staged as temp copies: all nine are byte-identical afterwards, the tenth is still absent, and the no-learning count is 28."
  - name: test_record_with_real_text_is_still_written
    target_dir: tests/knowledge/
    framework: unittest
    type: unit
    angle: criterion
    description: "The eligibility rule does not suppress a record carrying non-empty text with a known entry_kind — the guard against fixing this by writing nothing at all."
test_rationale: |
  The fifth descriptor is the one that would be omitted by a reasonable coder
  and is the one that matters most: a textless record with a KNOWN entry_kind
  would land in the no-learning bucket under either ordering, so only a record
  that is simultaneously textless and unknown-kinded distinguishes the correct
  order from the wrong one — and all 28 real records are exactly that shape. The
  sixth uses the real corpus fixture rather than synthetic records because
  synthetic fixtures for this component have already reproduced a bug-hiding
  bias once in this repository. The seventh is the anti-cheat: every other
  descriptor is satisfiable by a writer that writes nothing ever.
delivers_to:
  agent: python-coder
  contract: "A per-record eligibility rule — a knowledge record is writable only if it carries non-empty `text` — evaluated before entry_kind routing, plus a fourth result bucket counting ineligible records. INF-700c-2 relies on both: on the rule for the resting state, and on the ordering for the exit code."
expects_from:
  ac_id: INF-700b-1
  contract: "The `text` field on the knowledge record, required of a producer and optional to a consumer, whose absence this AC classifies as ineligible rather than invalid"
origin_agent: BrainCandy
