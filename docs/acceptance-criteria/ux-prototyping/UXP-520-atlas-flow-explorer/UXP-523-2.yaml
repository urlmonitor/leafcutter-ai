id: UXP-523-2
title: Examples and contract authority remain distinguishable from proven runtime behavior
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a node includes a labeled JSON example and a source-reviewed or illustrative-design contract,

  When a person opens the node''s contract details,

  Then the example appears separately as readable JSON without adding the contract name as a payload wrapper,

  And its full or projection mode and observed, illustrative or reconstructed origin are visible,

  And a projection states that omitted required and defaulted fields remain in the linked contract,

  And a source-reviewed or illustrative-design contract retains its authority label and explanatory note,

  And any declared missing binding is shown as proposed with its direction, reason and source rather than
  presented as an implemented field,

  And a genuine non-JSON action shows its specific explanation.'
