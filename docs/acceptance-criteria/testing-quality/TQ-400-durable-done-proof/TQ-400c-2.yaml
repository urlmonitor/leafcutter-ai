    note: >-
      Assigned python-coder; complexity M. it_requirements make the push-not-pull
      obligation and the three-way split explicit, and record a BLOCKING ambiguity:
      the criteria never name the routine-status surface. test_spec carries the
      mandatory reachability entry (figures land where the criterion says people
      look, after a real run) plus a seam entry for the second-run update and a
      criterion entry for the exempt/proven collapse. criteria untouched.
superseded_by: null
