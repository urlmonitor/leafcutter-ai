notes: |
  A seeding option that cannot detect a vacuous pass, and an agreement check that
  cannot fail, are precisely the two ways this pair of levers ships broken. This is
  the second of those, stated as its own record so it cannot be absorbed into a
  clause of the mechanism it checks.

  The asymmetry is worth restating because it is counter-intuitive: the dangerous
  outcome of mis-seeding is not a failing test. It is a passing one. "A worker with
  no scheduled consumer produces nothing" is satisfied trivially by a run in which
  nothing could have been produced, and it would then be green, fast, and completely
  empty — indefinitely.
