id: INF-400b-2-i
components:
  - infrastructure
  - knowledge_system
title: "Two learnings captured the same day to the same place are never mistaken for one"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400b-2.yaml"
criteria: |
  Given the knowledge-capture loop is producing records again at ordinary
    working volume, and each record carries the learning it captured as its
    text,
  And two records describe genuinely different learnings, but were captured
    on the same day — down to the same second — by the same agent, in the
    same component, routed to the same destination, and classified with the
    same kind, so that the learning text is the only thing that tells them
    apart,
  When the component that decides whether a record has already been dealt
    with (routed) examines them,
  Then it treats them as two records and deals with both, because a record's
    identity is its timestamp, agent, component, destination and kind
    together with its learning text,
  And neither is discarded as a repeat of the other, and dealing with one
    never marks the other as dealt with,
  And two records that differ only in a field outside identity — a `ticket`
    named on one and absent from the other — have the same identity, so
    naming a ticket on a re-emitted record does not make it a new record,
  And no part of that decision rests on a field that is absent from every
    record the system has ever written,
  And a record that carries no learning text — as every record written before
    the text was captured does — is still given an identity of its own and is
    not reported as missing a required field,
  And running the same decision twice over an unchanged body of records still
    deals with nothing a second time,
  And processed-state written before the text became part of identity is read
    by one rule: a record counts as already dealt with when its current
    identity is in that state, or when its earlier identity — the one built
    without the text — is in that state AND no other record currently in the
    sink shares that earlier identity,
  And a record whose earlier identity is shared with any other record
    currently in the sink is dealt with once more, even though that earlier
    identity is in the state, because the state cannot tell which of the
    records sharing it was the one dealt with,
  And only identities that include the learning text are written to that
    state from now on; an earlier identity is read, never written,
  And the two ways this rule can fail are told apart, because they need
    different answers: the SAME LEARNING DEALT WITH TWICE is visible to a
    reader of the destination and survivable, and is the accepted worst case
    of the earlier-identity rule; a LEARNING LOST WHILE MARKED AS DEALT WITH —
    a record treated as already dealt with on the strength of an identity it
    shares with a different learning — is seen by no reader and must not
    happen. A rule that trades a loss for a duplicate is acceptable; one that
    trades a duplicate for a loss is not.
