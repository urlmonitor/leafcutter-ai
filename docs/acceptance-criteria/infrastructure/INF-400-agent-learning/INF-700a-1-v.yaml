test_spec:
  - name: test_stage_runs_before_each_tickets_commit_and_one_observe_after_it
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive an epic of two tickets through build-feature.js under the driver harness; the timeline of routing calls and commit dispatches is stage, commit, observe once per ticket."
  - name: test_the_stage_manifest_is_named_in_the_commit_prompt_and_nowhere_else
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "The stage's manifest paths appear in that ticket's commit prompt and in no other phase's prompt; paths outside the worktree and the sink's log are dropped."
  - name: test_the_epic_result_carries_each_tickets_routing_and_the_totals
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Differing observe replies per ticket reach the epic result per ticket and summed."
  - name: test_bad_or_missing_replies_count_as_did_not_run_and_change_no_outcome
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Unparseable, unrecognised and missing replies give did_not_run with zero figures and the same status, tickets_completed and epic_complete as a run with good replies."
  - name: test_three_concurrent_tickets_run_stage_commit_observe_one_at_a_time
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "With three tickets proven to run concurrently, no ticket's stage or commit starts while another ticket's cycle is open."
test_rationale: |
  The wiring sits inside a dynamic phase loop that only a real run reaches, and
  the interleaving defect only exists when tickets run concurrently, so every
  test executes build-feature.js through the driver harness, whose parallel()
  really runs the tickets of a batch together.
notes: |
  Found 2026-10-09: INF-700a-1-iv's notes recorded that the real /build-feature
  route is build-feature.js, which dispatches commit itself and so was not
  reached by building-epics section 5.9. This AC closes that gap.
