created: 2026-06-05
amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      Criteria rewritten to state the CONDITIONAL isolation the workflow now
      has. The original text asserted "no new worktree directory is created
      during execution" unconditionally; that clause is preserved verbatim, but
      now scoped to Case A. Case B was added because two conditions the original
      spec did not anticipate make an unconditional in-place workflow
      unworkable in this workspace: sessions frequently start in the untracked
      workspace parent, which is not a git repository at all and so has no
      branch to operate on; and main is PR-only under the require-ci-lint
      ruleset (six required checks), so a direct commit to main can never be
      pushed. Title amended for the same reason — "without branch switching" was
      false on the Case B path. work_status left done: the behaviour is
      implemented in templates/skills/quick-fix/SKILL.md Phase 0 and
      templates/workflows-js/quick-fix.js Step 0a/0b; this is a restatement, not
      a reopening.
