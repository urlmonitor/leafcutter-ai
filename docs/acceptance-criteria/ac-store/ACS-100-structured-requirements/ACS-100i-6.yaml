id: ACS-100i-6
components:
  - ac_store
title: "The structured-spec obligation is triggered by an explicit declaration on the record, not inferred from who is assigned or which namespace it sits in"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an acceptance-criterion record that declares itself as registering a
    package surface by carrying the field `package_surface: true`,
  When the AC-record validator evaluates it,
  Then its implementation requirements are required to be a structured object
    (a plain string, a list of strings, or a null value is refused),
  And the refusal states that a record declaring a package surface must carry a
    structured implementation spec.

  And given a record that does not carry `package_surface: true` — whether the
    field is absent altogether or set to `false` —
  When the same validator evaluates it,
  Then no structured implementation spec is required of it, and it is not
    refused on that ground, regardless of which agent it is assigned to and
    regardless of the value of its `component` or `components` fields.

  And given two records identical in every respect except that one is assigned
    to `python-coder` and the other to `llm-expert`, neither declaring a package
    surface,
  When both are validated,
  Then both receive the same verdict — the assigned agent alone never decides
    whether the structured spec is demanded.
