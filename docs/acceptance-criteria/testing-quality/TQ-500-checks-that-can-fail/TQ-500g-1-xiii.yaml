      times", "changes nothing", "did not load", "changes no line the tests naming it run") or none; applied
      unchanged to a declared replacement.
expects_from:
  - ac_id: TQ-500g-1-xi
    contract: >-
      The per-work-key pin store (_wvp_store, with failed_check on each pin), the plan module (_wvp_plan)
      that calls the checks, and the pin step's promotion rule.
  - ac_id: TQ-500g-1-xiv
    contract: >-
      _wvr_trace: one traced pytest run returning, per test identity, {repo-relative path: set of executed
      line numbers} for the requested files, plus the list of files that are not traceable; _wvr_effect:
      changed_lines(as-written bytes, altered bytes) giving the as-written line numbers a replacement
      changes.
