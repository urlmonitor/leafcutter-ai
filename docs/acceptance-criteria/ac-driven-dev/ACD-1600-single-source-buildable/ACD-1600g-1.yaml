roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement whose intended change surface is the commit-guardian rules,
    and whose author has decided the build-orchestration runbook must stay
    untouched by this piece of work,
  When the requirement is inspected,
  Then the requirement states, as part of its own record, the boundary it must
    not cross -- naming the build-orchestration runbook as deliberately excluded,
  And that exclusion is readable from the requirement alone, without consulting
    any container the requirement is later bundled into,
  And a requirement authored without any exclusion is still accepted and is
    reported as having an empty boundary, not a missing one.
