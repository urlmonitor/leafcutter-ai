notes: |
  This is the CONTRADICTION GUARD for the whole tree. GE-119 draws a line, and this AC is
  the test that the line was drawn in the right place: fail-open on ONE bad input while
  the check still ran is correct and stays; reporting SUCCESS for a check that never ran
  is what stops.

  If an implementation makes this AC fail, the implementation has over-reached into
  "never fail open" and must be narrowed — not this AC weakened. GE-116a-1-iii carries
  readiness: approved, so it outranks any draft criterion in this tree.
