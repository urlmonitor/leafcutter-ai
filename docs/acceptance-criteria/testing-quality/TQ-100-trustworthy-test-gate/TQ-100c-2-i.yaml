it_requirements:
  - "DESIGN DECISION (settled): a done AC with zero covering tests is a HARD failure of the pre-pytest integrity check (non-zero exit), NOT a non-blocking warning — scoped strictly to ACs whose work_status is done ('a shipped feature must have a protecting test')."
  - "DESIGN DECISION (settled 2026-06-24, PREMISE CORRECTED 2026-09-07): build the zero-coverage detection as a violation class of the TQ-100c-2 integrity check (one module). The original wording of this requirement read 'there is currently NO check_ac_coverage.py in this repo'. THAT IS FALSE and was corrected on 2026-09-07: the file exists at templates/scripts/commit_guardian/check_ac_coverage.py. The design decision itself is UNCHANGED — the detection is still a violation class of the TQ-100c-2 integrity module, and the done-scoped hard-fail is still an added severity tier rather than a second coverage walker — but the 'if such a script is later introduced' framing no longer applies, because it is already here. WHAT TO DO INSTEAD OF ASSUMING: read the script before deciding whether to reuse its reverse-direction coverage scan, and read the three incompatible positions the store holds on it (see the doc_link to BP-100n-4 on this record, which cross-links all three). Do NOT reuse its tag-recognition rule: ACS-1300a-1:76 records it VERIFIED DISQUALIFIED 2026-09-01 because it collapses every suffixed id to its L0 root and is blind to '// covers:' tags, so a coverage judgement built on it attributes tags to the wrong record. It is also registered in no hooks_manifest entry today, so it does not run."
  - "Coverage is determined by scanning test bodies for the `# covers: <AC-ID>` tag (the established convention) — an AC is covered iff at least one collected/known test names it."
  - "The violation message must name the offending AC id; the violation class must be reported distinctly from an assertion failure."
