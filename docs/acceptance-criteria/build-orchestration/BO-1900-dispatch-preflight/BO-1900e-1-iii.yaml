notes: |
  THE SHARPEST OF THE FIVE, AND THE EASIEST TO LOSE. The craft's own instructions ask it to
  report a pass-or-fail outcome for each of the two mandated quality capabilities. So a craft
  that cannot invoke them is nonetheless asked to fill in a line describing their result. The
  craft observed on 2026-08-31 refused and said so; a less careful one fills in "pass", and
  the sign-off then carries a result no capability produced. That is a phantom-done vector
  sitting in the craft's own instructions, and it is live today regardless of whether the
  dispatch is ever fixed.

  WHY IT IS SEPARATE FROM BO-1900e-1. The parent prevents the bad dispatch. This AC assumes
  the bad dispatch happened anyway and constrains what may then be claimed. Both are needed:
  a run can be mis-provisioned in ways the comparison does not anticipate, and the sign-off
  must still not be able to attest to a check that did not run.

  WORDING IS LOAD-BEARING — DO NOT "SIMPLIFY" THE FINAL CLAUSE. It reads "no craft produces a
  result line" rather than the more natural "no result is written". This is deliberate.
  KI-BP-20260831-0940 records that derive_declares_side_effect is negation-blind: it matches
  durable-effect phrases inside a Then block without regard to a preceding negator, so
  "nothing is written" contains "is written" and derives true. A refusal criterion phrased the
  natural way is therefore forced to declare the very side effect whose absence is its entire
  content. The same workaround is in force on BO-3500a-1-i. Do not restore the plainer wording
  until the derivation handles negation; if this record is reworded and the commit is then
  refused for an undeclared side effect, this note is the reason.

  PROOF OBLIGATION. Run a craft in a dispatch with one capability withheld and inspect the
  sign-off it produces: assert no outcome value is offered for that capability, and assert
  that a sign-off which does offer one is refused. Both halves must be executed — a test that
  only checks the honest craft's output passes on a system with no enforcement at all, since
  today's craft already volunteers the disclosure by good behaviour rather than by
  construction.
