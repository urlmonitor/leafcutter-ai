criteria: |
  Given the technical planner's instructions after ACD-2500a, ACD-2500b and ACD-2500d have
    shipped,
  When they are read,
  Then they cover routing and splitting, sizing, technical requirements, producer/consumer
    contracts including judging whether both sides agree in meaning, test intent, and the
    knowledge loop,
  And they contain no procedure for authoring test designs, no file-type compatibility table,
    no graph-component-list fill-up, no parent back-link procedure, no documentation-trigger
    coverage gate, no reference-file choice, and no judging of whether declared files hold
    the behaviour,
  And where a removed duty matters to the planner's work, they point to the rule check or the
    step that now owns it,
  And the planner's final self-check list keeps only the items that need judgment.
