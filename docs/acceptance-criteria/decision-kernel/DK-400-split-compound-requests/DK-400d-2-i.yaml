assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-400d-2
  contract: "The subset answer whose lower bound this case enforces."
it_requirements:
  - An approval with every offered part left out is refused by the semantic check of leafcutter.split_answer.v1
    (ADR-067 §4.4) before any state change (exit 3) with an error message saying that at least one part must stay
    in or that the split can be rejected instead; the interaction stays pending at the same state revision.
  - Such an answer is never converted into a rejection.
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default, which stays false until E3 merges (dec-9925ebf1895222f4,
    see DK-400a-1). A test asserting that no split starts must run with splitting on, or it passes for the wrong
    reason.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_unticking_every_part_is_refused_not_rejected
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: Approving the trace-analyzers split with p1 and p2 unticked is refused with the stay-in-or-reject
      message; nothing is recorded as approved or rejected and no part runs.
test_rationale: A refusal must leave state unchanged, which the test checks on the run's state revision after the
  rejected submission.
