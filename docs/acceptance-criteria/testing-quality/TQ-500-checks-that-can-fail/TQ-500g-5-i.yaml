readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a reader who wants to know whether a route can go around the
    wrong-version runs,
  When they open the component diagram for the runs,
  Then it shows one runner, called from the fast lane, /build-feature, the
      single-ticket route and /build-epic, with no route holding a copy of it,
    And it shows the runner reading the requirement store's test entries
      (must_catch and the discrimination angle) to decide which tests are in
      scope,
    And it shows the one shared reading of test runs used by the runner, the
      proof-of-done check and the red-baseline check,
    And it shows the step that prepares named wrong versions as separate from
      the runner, and the configured test database as the only database the
      runs use,
    And it marks /build-epic's call as made through the ticket supervisor's
      instructions rather than through workflow code.
