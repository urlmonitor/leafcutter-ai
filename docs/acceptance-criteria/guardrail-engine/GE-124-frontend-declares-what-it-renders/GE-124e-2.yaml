notes: |
  EITHER SURFACE SATISFIES IT — the PO's rule, and the reason it matters:
  requiring both here would make the optional pin compulsory by the back door
  and contradict GE-124b. The floor is enforced at commit time by GE-124c, which
  is where it belongs; this gate asks only "does anything claim this?".

  The second scenario is the one that proves the rule is real. Its worked case
  is KM-ADM-004, which is pinned on an element and declared in no file. Note
  that same criterion has an empty covered_by in the mock data — satisfying this
  gate says nothing about whether it is tested, which is GE-124g-2's guarantee.

  The three scenarios correspond to the mock-data declaration-status values
  'component', 'element' and 'both'; the fourth value, 'undeclared', is
  GE-124e-3.

  IT-PO ENRICHMENT NOTE (2026-08-25) — THE VACUOUS-GATE HAZARD. The mock-data
  Ac entity carries declared_by and pinned_by, and the obvious reading is that
  the CI gate consults them. It must not: those fields are written FROM the scan
  this gate performs, so reading them would make the gate a consistency check on
  its own output. The gate scans front-end source; the fields are the recorded
  result. GE-124g-1 owns writing them.
