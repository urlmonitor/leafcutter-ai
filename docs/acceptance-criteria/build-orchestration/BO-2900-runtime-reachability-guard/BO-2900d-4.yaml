notes: |
  Satisfies one of the parent L1's two `documentation_triggers` (`how-to`).

  Intended agent is `documentation-expert` — left null per this run's instruction.

  THE DECISION COMES BEFORE THE PROCEDURE, and the criteria order it that way on
  purpose. A guide that opens with "how to record an exemption" is a guide that teaches
  people to exempt; the exemption is the fallback, not the workflow. An author reading
  this page has just been refused and wants the fastest exit — if the fastest exit is
  the first thing on the page, the guard's usage statistics will show it.

  THE LAST CLAUSE IS A CONTAINMENT FENCE. Once an exemption exists, it becomes the
  default answer to every refusal this tree produces, including the two it was never
  meant for: a stale automation call (fix the call) and an uncalled capability (wire it,
  or exempt it deliberately under BO-2900b-1-i's terms). Saying so here is cheaper than
  auditing exemptions later to find out which refusal each one was actually dodging.

  2026-08-13 (IT PO enrichment). The registry location the guide must document is now
  decided: config/reachability_exemptions.yaml (see BO-2900d-1's notes for the full
  rationale). The writer does not need to resolve that question.
