notes: |
  DERIVED FROM leafcutter/decision-publishing (all 10 scenarios):
    steps    decide-to-publish, check-record, write-published, check-store,
             review, merge
    branches keep-staged, no-staged-record, unknown-filter, correct-older
  Also the journey step decision-lifecycle/publish.

  WORDED TO SURVIVE GATED DIRECT PUBLISHING. The built flow has a person decide
  to publish and run the command. The tagline and first clause deliberately
  promise "checked, and reviewed like any change" rather than "you publish each
  one by hand", because the queued direct-publishing change
  (TICKET-20261002-KernelGatedDirectPublish, no ACs) keeps the check and the PR
  review but removes the per-decision human trigger for low-risk records. The
  decide-to-publish and keep-staged L2s will need amending when that ships. This
  L1 should not.

  STANDING RULES TO CARRY INTO L2. Validation runs before anything is written. A
  run with no staged record, or a record naming a component or roadmap phase the
  project does not know, stops with exit code 3 and writes nothing. The store
  validator passes after a publish. A correction appends to the older record and
  changes none of its existing content. Publishing is the only writer of the
  published decision store.

  Docs: a how-to for publishing and correcting a decision, a sequence diagram for
  publish through review and merge, and a state diagram for a record moving from
  staged to published, kept staged, or corrected and superseded.

