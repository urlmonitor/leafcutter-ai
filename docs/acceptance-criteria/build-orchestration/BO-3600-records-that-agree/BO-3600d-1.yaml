  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a conflict raised on one run between a named fault entry and a named
    requirement,
  When the reconciliation runs again while the two records still disagree,
  Then the same conflict is presented as the same conflict, under the identity it
    was first given,
    And it is not presented as a newly discovered one.

  Given a conflict that was raised and against which no verdict has been recorded,
  When any number of further runs occur and attention has moved elsewhere,
  Then it is still listed as outstanding,
    And its recorded state reads that no decision has yet been made,
    And it is absent from no run's output while it remains outstanding.

  Given an outstanding conflict,
  When someone looks up its identity later,
  Then they find the two records it is between, when it was first raised, and every
    state it has been in since,
  So the same disagreement is not re-litigated from scratch six weeks later.

  Given a conflict whose two records have been brought into agreement,
  When the reconciliation runs again,
  Then it is no longer listed as outstanding,
    And its identity and history remain findable,
  So a conflict leaves the outstanding list by being resolved and never by being
    forgotten.
