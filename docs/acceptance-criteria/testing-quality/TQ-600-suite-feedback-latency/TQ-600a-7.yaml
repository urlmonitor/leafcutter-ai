      it names the registered declaration marker and links to the guide.
      Verified at enrichment: the sentence is at CLAUDE.md line 416 today, so
      this descriptor is RED before the change and GREEN after — which is the
      honest shape for a claim written as an absence. NAMED MUTATION: reinstate
      the sentence; this test must go RED.
  - name: test_tq600a_7_every_declaration_the_guidance_shows_is_one_the_runner_actually_accepts
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "python -m pytest (child session declaring a test exactly as the published guide instructs)"
    description: >-
      Extract the marker names, commands and repository paths the guide shows,
      assert every marker is in pytest.ini's registered markers and every path
      exists, then EXECUTE the guide's declaration step verbatim and assert the
      declared test is routed to the shared layout. NAMED MUTATION: alter one
      character of the marker name in the guide; this test must go RED while
      every other descriptor stays green. This is what separates a guide that
      works from a guide that reads well.
  - name: test_tq600a_7_there_is_one_account_of_the_declaration_and_the_other_surfaces_link_to_it
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      The guide's anchor exists; unit_tests/README.md and the CLAUDE.md rule each
      link to it; and the step-by-step procedure for obtaining the shared root
      appears in the guide alone — the other two surfaces name the declaration and
      point, rather than restating how to use it. NAMED MUTATION: copy the
      procedure into CLAUDE.md as well; two accounts then exist, the louder one
      will rot first, and this test must go RED.
test_rationale: |
  Three of this AC's six clauses are reader outcomes and no automated descriptor
  can check them. Whether an author can state which of the two paths their test
  will take, name the case that must keep its own copy, and tell a
  named-as-undeclared run apart from a mis-routing failure are properties of
  whether the prose teaches — and a file with the right headings passes any
  presence check while teaching nobody anything. They are verified by a reader
  trial against the published page (a documentation-verifier pass carrying the
  reader's question, not the author's outline), and that is recorded here rather
  than papered over with a descriptor that greps for a filename.

  The two clauses the BA deliberately made mechanical get real descriptors. The
  missing CLAUDE.md sentence is checkable precisely because it is phrased as an
  absence: "the rule is updated" is an opinion, "that sentence is gone" is not.
  The copy-runnable clause is checked by EXECUTING the declaration the guide
  shows, not by reading it — a documented marker one character off the registered
  one is silently ignored, and silence routes the test to the 59.8s path with no
  error to notice.

  The third descriptor protects the property the other two depend on: one
  account. Two surfaces describing one declaration is two chances for one of them
  to rot, and the one that rots keeps being believed. It is satisfiable by a link
  and forbidden only from carrying a second procedure.

  No descriptor here asserts that a guide exists. Existence is not the claim.
