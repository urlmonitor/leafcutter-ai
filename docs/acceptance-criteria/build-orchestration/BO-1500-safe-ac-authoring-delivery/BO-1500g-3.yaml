notes: |
  Design-review gap 3. BO-1500c-1 specifies that approved criteria are routed into the
  standard reviewed delivery path; this AC specifies what may be inside that delivery.
  Broader than BO-1500g-2-i, which asserts the same property only for the two-concurrent-runs
  scenario: here the approved list is the authority for every delivery, and a mismatch in
  either direction refuses rather than warns.

  Re-homed 2026-08-14 from BO-1500a-11 to BO-1500g-3 by the Pattern C intermediate split
  of BO-1500a. Criteria text is unchanged. Its depends_on / expects_from pair with the
  per-run identity AC is kept intact and now points across the g/f boundary at BO-1500f-2
  (formerly BO-1500a-9).
