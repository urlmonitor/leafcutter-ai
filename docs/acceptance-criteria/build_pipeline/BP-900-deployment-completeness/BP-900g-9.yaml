notes: |
  IMPLEMENTATION LANDED 2026-08-31, work_status DELIBERATELY LEFT todo.

  The behaviour this AC specifies is shipped and covered by
  unit_tests/test_bp_900g_9.py (4 tests, all four test_spec entries). All five
  declared-entry deploy loops now record a DeployFailure and the build raises
  once at the end, exiting non-zero and naming every finding.

  work_status stays todo because the child L3, BP-900g-9-i, is todo and its
  third clause is NOT satisfied by this change: it requires that after a
  failure the target directory "does not contain a subset of the declared
  files presented as if it were the complete deploy". The implementation here
  lets the resolvable entries write and raises at the end of the run, so the
  target DOES hold a partial deploy — recognisable as failed by the non-zero
  exit and the report, but a partial deploy nonetheless. Flipping this L2 to
  done over an unfinished -i constraint is the dominant phantom-done shape
  CLAUDE.md names, so it is not being done.

  THE OPEN DESIGN QUESTION for whoever builds BP-900g-9-i: satisfying that
  clause means choosing between (a) validating every declaration's sources in
  a preflight before any phase writes, leaving the target untouched — clean,
  but the phase never runs, which sits awkwardly with this AC's "When the
  phase runs" framing; (b) writing a failure marker into the target; or
  (c) rolling back what was written. That is a real decision, not an
  oversight, and it belongs to that AC rather than being pre-empted here.

  ENUMERATION OF ENFORCEMENT POINTS (required by n_location_rule: all).
  Five declared-entry loops were found and flipped:
    1. build_ac_store                     — iterates AC_STORE_DEPLOY_MAP
    2. build_workflow_tools               — iterates a hardcoded deploy list
    3. build_knowledge_scripts            — iterates a hardcoded deploy list
    4. build_agent_support_scripts        — iterates AGENT_SUPPORT_SCRIPT_FILES
    5. _deploy_fast_lane_release_dependency — one declared path, warn+return 0
  Three further `is_file()` sites were audited and deliberately NOT flipped,
  because they iterate a GLOB of what exists on disk rather than a
  declaration — build_build_orchestration_scripts, build_template_standalone_scripts,
  and the pattern loop at ~3442. A glob cannot have a missing declared source;
  there the check filters directories and skipping is correct. Flipping them
  would manufacture failures for files nothing ever promised to ship.

  PRE-EXISTING STALE SET: EMPTY, verified rather than assumed. Every declared
  entry in all five loops resolves today — confirmed by running the real build
  and checking each loop actually executed and copied entries, not by the
  absence of warnings. So this flip turns no existing build red.

  HOLE B, second build-time half — the fail-open that hides the first one.

  WHY THIS IS SEPARATE FROM BP-900g-8. g-8 catches a dependency that was never
  declared. This AC catches a dependency that WAS declared and then went missing from
  source — a rename, a move, a deletion. The two failure modes reach the deployed tree
  by different routes and neither guard sees the other's case. Both were live in the
  same loop at HEAD, which is the argument for specifying them separately rather than
  as one "deploy map is correct" AC that a single test could appear to satisfy.

  WHY "EVERY ENTRY, NOT ONLY THE FIRST" IS IN THE CRITERIA. A guard that halts at the
  first finding turns a set of N stale entries into N build-fix-build cycles, and each
  intermediate green build reads as completion. This is the same reporting property
  BP-900e-4 requires of the registry-completeness report, applied to the deploy loop.

  TEST ANGLES for it-po. Floor: criterion + reachability, with must_block on the
  reachability entry (declared-but-absent source through the real build entry point →
  non-zero exit). `boundary` is triggered — the criterion names zero / one / many
  entry shapes explicitly, and a guard with no empty-declaration case is the exact
  shape of EPIC-BOPhantomDoneRemediation T03, where _check_change_target had an
  empty-list guard and the identically structured _check_risk_surface did not while
  all 22 tests passed. `deployed` is NOT triggered here: the assertion is about the
  build process's own exit, observable in the package tree.

  RISK TO FLAG AT IMPLEMENTATION. Flipping this branch fail-closed will surface every
  pre-existing stale entry at once and may turn the next unrelated build red. That is
  the point, but the set must be enumerated and resolved in the same change rather
  than parked — KNOWN_UNDEPLOYED_ALLOWLIST was emptied by BP-900g-5 and BP-900g-6
  carries a test asserting it stays empty, so re-parking is not available.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO ENRICHMENT NOTE (2026-08-17). Two constraints added that the criteria imply
  but do not name, both recorded in it_requirements.constraints.

  FIRST, n_location_rule is 'all'. The criteria say "a deploy phase", singular, and
  the Because clause names one loop. But warn-and-continue on a missing declared
  source is a PATTERN, and a fix scoped to the loop where the defect was found leaves
  the identical hole in every sibling loop — which is T03's shape exactly. The
  implementer must audit scripts/build_phases.py for every deploy iteration that can
  meet a missing source, and enumerate what was found in the sign-off.

  SECOND, the fail-closed behaviour must not be made configurable. A strict-mode flag
  or environment variable is the cheapest way to land this without confronting the
  pre-existing stale set, and it reproduces the defect for everyone who does not set
  it — including every consumer install, since the default is what ships.

  THE SCHEDULING RISK IS REAL AND IS NOT A REASON TO SOFTEN THE AC. This change can
  turn the next unrelated build red. The correct response is to enumerate the stale
  set first and land the resolutions with the flip, not to weaken the gate. The BA's
  RISK TO FLAG paragraph is upheld unchanged.
