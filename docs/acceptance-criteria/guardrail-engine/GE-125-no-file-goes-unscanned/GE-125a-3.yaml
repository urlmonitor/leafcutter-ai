notes: |
  THIS DISCHARGES GE-125a's documentation_triggers OF [reference-doc]. The L1's
  other children are all behavioural, so without this record the trigger has no
  owner and would be left to fall out of a code change whose sign-off is a
  passing suite — nothing fails if the sentence is never written.

  ONE PASSAGE, NOT FOUR — this is the goal's explicit instruction and the third
  arm above is where it is stated at L2, as the L0 asks. All four L1s in GE-125
  carry the same trigger and each genuinely needs it, so the sibling BAs are
  authoring documentation criteria of their own at the same time as this one. The
  arm is written so that whichever of the four lands first creates the passage
  and the rest amend it. If a sibling's record instead calls for a separate
  document, that is a collision to resolve before any of them is built, not
  after: two of the four descriptions will be stale within a release.

  WHAT IS WRONG WITH THE REFERENCE TODAY IS OMISSION, NOT ERROR. The skill
  surface lists the high-entropy rule with its threshold and says nothing about
  the exemption; the exemption is described only in the component architecture
  doc's known-constraints section, as a defect, and in the source comment. So the
  first arm is not "correct a wrong sentence" — it is "there is no sentence".
  That matters for how the arm is checked: an author looking for the passage to
  amend will not find one.

  THE FOURTH ARM IS A PARITY REQUIREMENT and it is stated because this passage is
  being changed by four criteria in one goal. Three edits to one file in one
  feature was already enough for a statement to survive that no longer matched
  the code, in the GE-123 tree; four is more. Parity runs in both directions —
  nothing claimed that the check lacks, nothing omitted that the check has.

  FOR THE IT PO. Verification here is a review against the shipped behaviour, not
  an executable test, and it should be recorded as such rather than left as an
  empty test slot; the sibling documentation record GE-123a-4 is the precedent
  for how that is expressed in this component. Two constraints the reviewer needs
  to know: the canonical copy is the one under templates/ and the deployed copies
  are build outputs, so an edit to a deployed copy leaves the shipped reference
  unchanged — the failure this criterion is least able to detect from its own
  output; and examples in this passage must not contain credential-shaped
  literals, because the file is scanned on every commit and a realistic example
  would either trip the check or need a suppression of its own.

  SEQUENCING. This text describes behaviour GE-125a-1 introduces. Written before
  that lands it documents an intention; write it against the shipped result, or
  mark it pending and re-check it once GE-125a-1 is done.
