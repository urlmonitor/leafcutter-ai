criteria: |
  The suite answers fast enough that running it stays part of the work.

  Today a full run takes an hour and a half, so in practice nobody waits for
  one. The check that is supposed to tell you whether your change is safe is
  skipped locally, deferred to somebody else's machine, or started and
  abandoned — and a suite that is not run is not a safety net, whatever it
  says when it eventually finishes. Worse, almost all of that time buys
  nothing: the same expensive setup is rebuilt from scratch for test after
  test, so the wait is mostly the suite repeating itself.

  After this goal, a full run comes back quickly enough to sit through, the
  expensive setup is paid for once rather than once per test, and the runtime
  is watched so it cannot quietly creep back. Speed here is not a comfort —
  it is what decides whether the suite is consulted before a change ships or
  after it breaks something.
