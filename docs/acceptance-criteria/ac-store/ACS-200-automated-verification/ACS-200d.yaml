priority: medium
title: "New tickets must reference their source AC"
component: ac-store
level: L1
scope: standing
status: active
req_status: active
work_status: todo
criteria: |
  Given a new ticket is created (via /create-ticket, /build-ac, or manual authoring),
  When the ticket touches a component that has ACs in the store,
  Then the ticket frontmatter must include a source_acs field listing
    the AC IDs that motivated this work.
  And a pre-commit hook validates: if docs/acceptance-criteria/ exists
    and the ticket's component has active ACs, source_acs must be non-empty.
  And tickets for components with no ACs yet are exempt (graceful degradation).
  And this is a standing rule — it applies to ALL future tickets.
depends_on: [ACS-200b]
