id: GE-129d-1-i
title: "A standing permission rule that pre-approves commit commands does not skip the person's prompt for a commit"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a top-level session in the default interactive mode, a
    staged change, and in turn each of:
    (a) project settings carrying the allow rule `Bash(git commit:*)`,
    (b) user settings carrying the same allow rule,
    (c) the person having chosen the prompt's "don't ask again for this command" option on an
        earlier commit in the same session,
  When the session issues `git commit -m "x"`,
  Then in each of (a) to (c) the permission prompt is shown to the person and the command does not
    run before the person answers,
    Or, where the probe findings (GE-129a-1) show the harness cannot show the prompt over that
    rule, the commit is refused as in GE-129d-2 and the refusal names the rule that would have
    skipped the prompt.
