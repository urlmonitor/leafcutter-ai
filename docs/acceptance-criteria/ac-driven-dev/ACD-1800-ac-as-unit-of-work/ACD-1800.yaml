criteria: |
  One requirement, its own deliverable checklist, done when all are signed off.

  Each requirement is self-contained: it lists every deliverable it needs -- the
  code, the tests, the documentation, the diagrams, the configuration -- and it
  counts as finished only when every one of those has been signed off by whoever
  is responsible for it. Work is planned and tracked around requirements
  themselves, not around separate paperwork. Tickets still exist, but only to
  group related requirements into one whole, valuable feature, so what ships is
  always coherent and complete rather than a scatter of isolated pieces. Because
  completion is tracked deliverable by deliverable on the requirement itself,
  "done" always means genuinely done -- nothing is quietly missing.
