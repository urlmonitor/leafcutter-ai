notes: |
  THE TWELVE ARE THE TEST OF THIS CRITERION. Twelve agents appear only in the
  newer field: research-agent, adr-author, how-to-author, explanation-author,
  brainstorm-lead, brainstorm-worker, worktree-agent, and the five sql creator
  agents. A consolidation onto either field's population alone silently drops or
  invents grants, and those twelve would still receive nothing even after
  delivery is repaired. That is why repairing delivery is not sufficient and this
  is not a tidy-up.

  WHY THE PER-AGENT ACCOUNT IS PART OF THE CRITERION AND NOT A NICETY. Union
  arithmetic on 32 and 40 with an overlap of 28 is easy to state and easy to get
  wrong in exactly the direction that looks right -- a total of 40 rather than
  44. A migration that reports only a total cannot be checked; one that names
  each agent and its provenance can be.

  THE EMPTY-DECLARATION CLAUSE IS DELIBERATE. The cheapest consolidation writes a
  declaration for all 60 agents, empty where there was no grant. That produces
  the empty-section state AR-300a-3 forbids downstream, and it destroys the
  distinction between 'granted nothing' and 'grant lost in migration'.
