  - path: scripts/ac_store/test_enforcement.py
    relationship: implements
    status: exists
    relevance: "WHY THE DEFECT EXISTS. COVERS_TAG_RE at :57 captures `(\\S+)`, which takes everything up to whitespace — so a comma, a closing bracket or a quotation mark travels with the id, and only the FIRST id on a multi-id line is captured at all. Normalisation on the tag side is a consequence of reusing the canonical rule, which ACS-1300a-1's final clause requires; it is not optional hardening."
  - path: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b-4.yaml
    relationship: relates-to
    status: exists
    relevance: "SEQUENCING HAZARD — READ BEFORE BUILDING EITHER. TQ-100b-4 narrows the canonical reader so that captured values which resolve to no record must be id-SHAPED, and requires that it 'removes nothing from the resolved list'. `BO-560,` is not id-shaped and was never in the resolved list, so TQ-100b-4 is fully satisfied by DISCARDING it — which entrenches this miss and removes the only signal of it. Land this normalisation before, or together with, that narrowing; afterwards the evidence is gone."
  - path: unit_tests/docs/test_artifact_graph_covers_scope.py
    relationship: relates-to
    status: exists
    relevance: "THE ORIGINAL LESSON, RETAINED FOR THE SECONDARY CASE ONLY. Its _strip_quotes helper exists because a RAW-TEXT store reader treated quoted ids as distinct from their bare-token tags. Measured 2026-09-01: six store ids are written quoted (GE-114-1/-2/-3/-4, GE-115, GE-118c) but a YAML-parsing reader resolves all six correctly, so the store side of this join needs no stripping. The tag side still does — hence quotation is one case of the general normalisation this AC requires, not its subject."
