id: INF-1300e-3
title: "The document produced in an adopting project is accepted by that project's own checks"
component: infrastructure
components:
  - documentation_system
  - doc_compliance
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300e.yaml"
criteria: |
  Given a document produced in an adopting project by the mandatory step,
  When that project's own commit-time document checks are run over it, unmodified,
  Then they pass,
  And the checks run are the copies that arrived in that project, run the way that
    project runs them, from where that project's authors work,
  And a pass obtained by running this package's copies of those checks over the
    adopting project's document does not satisfy this criterion,
  And each check is confirmed to have examined the produced document: a check that
    reported nothing because it was never given the document counts as a failure,
    not as a pass.
