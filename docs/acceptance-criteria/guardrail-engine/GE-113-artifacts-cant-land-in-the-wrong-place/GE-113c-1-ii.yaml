it_requirements:
  - "Derive the project root via `git rev-parse --show-toplevel` through the ONE shared _resolve_root helper mandated by GE-113c-1 — NOT Path(__file__).resolve().parents[N], and NOT by following the .leafcutter symlink to the workspace parent. This is the exact false-fail class recorded in CLAUDE.md (in an epic/feature worktree, check-doc-frontmatter resolves the staged path against the workspace parent and dies at open())."
  - "The frontmatter gate must ACTUALLY VALIDATE after the fix: a green commit result must mean the staged file's frontmatter was checked, never that check-doc-frontmatter was skipped via SKIP=. Do not leave the SKIP= bypass as the de-facto path."
  - "Behavioral verification must exercise a REAL worktree against a REAL on-disk artifact, not a synthetic fixture: run the guard from an actual git worktree checkout against a staged ticket .md / docs/*.md file serialized exactly as the ticket tooling and PyYAML produce it (column-0 block style), asserting open() succeeds and genuine violations are reported. This repo has a documented history of synthetic fixtures reproducing the bug-hiding bias and passing while the real worktree path stays broken (CLAUDE.md real-artifact spot-check rule; user-memory feedback_spotcheck_real_data_format)."
  - "No regression for the source/main checkout: the guard must resolve the project root and validate frontmatter identically when run from the main repository checkout, mirroring the GE-113c-1-i no-regression guarantee — both layouts resolve correctly through the one shared mechanism."
  - "Must handle git-unavailable gracefully per the project error handling policy: the shared helper wraps the git subprocess call (no bare except, Ruff E722/BLE001/TRY), warns, and falls back to a safe deterministic resolution (the ACS-300g-6 __file__-relative fallback precedent)."
  - "Deployed/template parity (ADR-001): the canonical fix lives under templates/scripts/commit_guardian/check_doc_frontmatter.py and the scripts/ copy is a build output — edit the template and round-trip via build.py; never edit only one side."
  - "The root-resolution call must complete in <100ms (mirror ACS-300g-6)."
