criteria: |
  Given the component library catalog defines a "card-grid" component with
    properties: column-count, card-spacing, and card-border-style,
  When the UX designer agent composes a prototype that includes "card-grid",
  Then the prototype uses the same property values as existing pages that use "card-grid"
  And the prototype does not override default property values unless the feature
    request explicitly requires a variation
  And the generated layout structure matches the established page type hierarchy
    (header, content-area, sidebar, footer) used across the product
