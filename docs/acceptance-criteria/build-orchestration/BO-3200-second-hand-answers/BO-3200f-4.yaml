notes: |
  Satisfies BO-3200f's `reference-doc` documentation trigger. reference-author rather than
  documentation-expert, matching every other documentation child in the BO-3200 tree.

  THE REJECTED ALTERNATIVES ARE REQUIRED CONTENT, not background. "Just call the CLI directly"
  is the obvious suggestion and cannot be done (KI-BO-20260901-1620); a reference that omits why
  invites the next author to re-derive it or to pre-resolve facts in a wrapper, which is the
  relay this L0 removes.

  BOUNDARY WITH BO-3200a-3. That page answers "which questions may a specialist be asked"; this
  one answers "what do I use when the answer is none". Cross-link both ways; do not merge.
