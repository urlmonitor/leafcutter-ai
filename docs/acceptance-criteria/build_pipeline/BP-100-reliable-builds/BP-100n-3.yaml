notes: "Verified defect, 2026-08-25. The bidirectional manifest/output equality guard added by this epic sets the antigravity platform to false in two places, so the whole gemini workflows output family is excluded from the equality assertion — the same family that separately turned out to contain unscanned command surfaces carrying live Skill() handoff targets. A guard that proves equality only for the platforms it chose to enable does not prove equality; the exclusion is invisible in the guard's green result. Restoring full coverage is expected to surface real inequalities in the previously excluded family."
