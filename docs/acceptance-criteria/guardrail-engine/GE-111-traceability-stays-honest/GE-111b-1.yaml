assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Path resolution must be against the STAGED tree, not the working tree — read the staged index (e.g. git ls-files --cached / git cat-file against the staged blob) so an unstaged deletion or a still-present working-tree copy does not mask or fabricate drift. Mirror the staged-files-only precedent in check_ac_circular_deps / check_ac_schema Phase 2."
  - "Change-kind classification (deleted vs moved/renamed) must use git's staged rename detection (git diff --cached --name-status -M) — a rename surfaces as R and reports change_kind moved/renamed; a pure delete surfaces as D and reports change_kind deleted."
  - "MUST have zero dependency on any external symbol-analysis binary or MCP tooling — this is the always-on floor and must produce a verdict even when the symbol tier (GE-111b-2) cannot run. Do not import or shell out to jcodemunch/jscpd/any resolver here."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4) for all git subprocess and file I/O; fail open (treat as clean + advisory) only on UNEXPECTED internal errors, never on a confirmed vanished path."
  - "Verdict object shape is the canonical contract consumed downstream: {ac_id: str, entry: str, tier: 'file', verdict: 'drift'|'clean', change_kind: 'deleted'|'moved'|'renamed'|null, symbol: null, suggested_location: null}. Keep this shape stable; the symbol tier (GE-111b-2) extends the same object."
delivers_to:
  agent: python-coder
  contract: "Per-AC drift/clean verdict object {ac_id, entry, tier: 'file', verdict, change_kind, symbol: null, suggested_location: null} at file-path granularity, consumed by GE-111a (block decision) and GE-111e (message)"
expects_from: null
