criteria: |
  Arrivals and completions for each kind of thing, over the period you choose.

  For a week, a month, or any range you pick, you can see how many of each kind
  were created and how many were consumed — closed, completed, retired, or
  replaced — together with the net change between them, so the two halves of the
  story are always read together instead of one at a time.
