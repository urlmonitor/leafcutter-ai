risk_surface: internal
notes: |
  This criterion exists because it is the premise of BO-2600b-1's decision. "Always
  exclude" is only safe if an operator who genuinely wants a whole branch can still get
  it by aiming at the branch. That premise is stated in BO-2600b's own brief as a
  consideration; here it is turned into something a test can falsify rather than something
  the decision merely assumes.
