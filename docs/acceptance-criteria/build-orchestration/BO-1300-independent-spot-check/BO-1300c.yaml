req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  The review goes after gaps your existing tests and criteria do not cover.

  These reviewers deliberately do not re-run the unit tests that already passed.
  They put the feature through real use -- edge cases, awkward inputs, the seams
  where it meets the rest of the system -- to surface problems the existing tests
  and acceptance criteria were never written to catch.
