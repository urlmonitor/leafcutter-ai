notes: |
  INHERITED, NOT REPEALED — GE-120's standing rule for this component: a check
  that cannot run says so. A resolver that cannot reach the store would
  otherwise resolve nothing, find no unresolved ids, and print a pass; "green"
  would be indistinguishable from "did not run", which is the exact defect class
  GE-120 exists to close.

  This AC deliberately does NOT decide whether the unreachable-store case should
  also BLOCK. GE-120's rule fixes the unit at VISIBILITY, and the component
  standing note is explicit that block-versus-announce is a per-check decision
  with no blanket default. Flagged for the IT PO and the user to settle;
  announcing is the floor either way.

  IT-PO RESPONSE TO THAT FLAG (2026-08-25). Recommendation, not a decision:
  ANNOUNCE at the commit tier, BLOCK at the CI tier. A developer with an
  unreadable store is usually mid-rebase and blocking them helps nobody; a CI
  run that could not read the store produced no evidence and must not be merged
  on. Left open for the user at the final gate; the test contract asserts
  visibility only, so it holds either way.
