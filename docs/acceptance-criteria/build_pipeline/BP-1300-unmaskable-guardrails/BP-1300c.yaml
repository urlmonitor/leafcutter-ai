id: BP-1300c
title: "During automated drives, guardrails block instead of whispering"
component: build-pipeline
level: L1
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  No more warn-only checks that pass unseen in a drive -- the ones that matter fail.

  Guardrails that default to warnings today (self-description enforcement, ticket
  sign-off parity outside the done state) enforce as failures during automated
  drives, so a real problem stops the drive and gets acted on instead of scrolling
  past invisibly in the logs.
