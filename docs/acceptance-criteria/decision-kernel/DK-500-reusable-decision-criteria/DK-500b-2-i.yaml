id: DK-500b-2-i
title: A question that bundles two questions is never merged into either of them
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the categories cat-52b16c7b5a23106f ("Does every change stay reviewable in normal git review?") and cat-d15d52392d7aa94c ("Does the option keep the rule that only a human approval creates a decision record and that precedent is evidence, never authority (ADR-060)?"),
  And the wording "Is every stored criterion or category reviewable in a Git diff, and does it come into existence only through a human approval, as ADR-060 requires for published records (so criteria mined automatically cannot self-publish)?", which asks both questions,
  And the wording "Can it be put in place with a small change and used with one command or click per run?", which asks a question of cat-1dc11c5a2ffa7310 and a second question no category asks,
  When groupings are suggested,
  Then neither wording is placed in cat-52b16c7b5a23106f, cat-d15d52392d7aa94c or cat-1dc11c5a2ffa7310; both get "none" and are left for a person to split or keep,
  And the wording "Does every published record still go through git review in a pull request?", which asks only the git-review question, is still placed in cat-52b16c7b5a23106f.
depends_on:
- DK-500b-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500b-2
  contract: 'Placement outcome per wording: category id | none, with reason.'
change_target: code
risk_surface: internal
it_requirements:
- No compound-question detector is built. Under dec-a070edfb6465bced the p >= 0.8 threshold keeps a compound wording apart (the trial's compound false merges scored p = 0.63 and 0.69), and the person can still split or keep it at review. It is not flagged as compound, because no LLM is used.
- The test replays the trial's recorded Jev outcomes for these wordings through a controlled Jev provider, so it fails if the threshold is lowered below the recorded probabilities.
- The single-question wording must still be placed in cat-52b16c7b5a23106f (here by exact label, since it is an other wording of that category), which is the positive control.
test_required: true
test_spec:
- name: test_compound_wordings_get_none
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The two compound wordings are placed in none of cat-52b16c7b5a23106f, cat-d15d52392d7aa94c or cat-1dc11c5a2ffa7310 and get none.
- name: test_single_question_wording_still_placed
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: '''Does every published record still go through git review in a pull request?'' is placed in cat-52b16c7b5a23106f.'
test_rationale: Drive the grouping through its public entry point with a controlled Jev provider that replays recorded probabilities and counts calls, plus a recording host port that fails on any request; assert placements, reasons and call counts, not internal helpers.
