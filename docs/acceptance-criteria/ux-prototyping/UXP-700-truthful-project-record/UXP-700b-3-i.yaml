id: UXP-700b-3-i
title: "One record is enough to exercise the rule, and a violating record still fails it"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a check phrased as a rule that must hold of every record of some kind,
  And a project record holding exactly one record of that kind, which satisfies the rule,
  When the check runs,
  Then it reports that the rule holds and that it examined one record,
  And it does not report that it was not exercised.
  Given instead a project record holding exactly one record of that kind, which violates the
    rule,
  When the check runs,
  Then it reports the violation naming that record,
  And it does not report that it was not exercised.
depends_on:
  - UXP-700b-3
