notes: |
  WHY THIS IS A SEPARATE CRITERION AND NOT AN INSTANCE OF GE-123b-1. It is a
  different implementation seam, not merely a bigger example. An entry that
  names a path can be checked against that path. An entry whose path field is
  the wildcard names no file at all, so an implementation that asks "which file
  would this entry empty?" never sees it — the emptiness only becomes visible
  when suppression is evaluated against the findings a run actually produced.
  A fix that satisfies GE-123b-1 by inspecting named paths passes that criterion
  and still leaves this hole wide open. The paired positive is different too:
  here it guards repository-wide RULE-scoped suppression, which is documented
  behaviour authors rely on.

  THE COMPLEMENT-OF--v POINT, load-bearing, and the reason this is new work
  rather than reopened work. GE-113c-3-v's third scenario is a wildcard rule
  with a zero-segment path, and it establishes that "a single malformed entry
  must never be able to disable the scanner across every rule". Its fourth
  scenario establishes that the literal wildcard path keeps working. Between
  them they close the typo'd spelling of total disablement and leave the
  correctly-typed spelling — wildcard rule plus wildcard path — fully
  operational. That is not an oversight in -v; it is precisely the boundary
  GE-123 was raised to cover. Nothing in -v is re-specified here.

  MEASURED TODAY, end-to-end through the multi-file entry point (2026-08-18):
    - arm 1 baseline: 0 findings across all three files, clean exit, and NO
      warning on any stream. Target: 12 findings, findings-present exit.
    - arm 2 baseline: 9 findings — ALREADY CORRECT. Labelled regression guard;
      green on arrival is expected and is not a TDD-order violation.
    - arm 3 baseline: 0 findings, because the over-broad line currently swallows
      everything. Target: three findings for "helpers.py".

  Three files rather than one, and one of them at a nested path sharing a
  basename with another, so the arms distinguish "the entry was correctly scoped"
  from "the entry happened to miss". Ordinary source filenames throughout — no
  env-named file appears in this criterion, per the tree-wide authoring
  constraint.

  Every arm must be exercised through the multi-file entry point with real files
  on disk. Coverage of the suppression predicate in isolation does not discharge
  this criterion.

  IT-PO RE-VERIFICATION (2026-08-18, before enrichment): all three baselines were
  re-measured through scan_files with three real files on disk, one of them at a
  nested path sharing a basename with another, and a real allowlist in the same
  temporary root — 0, 9, 0 — matching the BA's figures exactly.
target_epic: EPIC-SuppressionNarrowsNeverDisables
