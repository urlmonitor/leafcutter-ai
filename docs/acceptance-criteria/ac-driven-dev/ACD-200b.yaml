criteria: |
  Given it-po is enriching ACs with technical fields,
  When the feature being enriched introduces new commands, flows, or state machines,
  Then IT PO v3 checks whether documentation ACs exist in the same AC batch,
  And if documentation ACs are missing, IT PO v3 either:
    (a) creates the missing documentation ACs itself (with readiness: reviewed), or
    (b) flags the gap and refuses to set readiness: reviewed until resolved,
  And IT PO v3 never promotes a batch to readiness: reviewed if it contains
    flow/state triggers but no corresponding documentation ACs.
