  contract: "A reusable page-path-to-doc-path derivation helper (shared with the planning-time trigger layer GE-104a-2): given a frontend page path 'site/app/<route-segments>/page.tsx', returns exactly one deterministic reference-doc path 'docs/reference/frontend/<name>.md'. This is the single source of truth for the page->doc mapping rule across commit-time and planning-time enforcement."
