notes: |
  'DERIVED' WITHOUT A COMPARISON IS JUST 'IGNORED'. AR-300c-1 says the compiled
  prompt reads only the declaration. That alone makes the central record inert,
  not correct -- it can drift arbitrarily while every consumer that reads it, and
  there are several, keeps believing it. Two records of one grant that can
  disagree is the defect AR-300c exists to end; a derived copy nobody checks is
  that defect with a new name.

  THE MISSING-SIDE CASE IS CLASSED AS DISAGREEMENT ON PURPOSE. An agent with a
  declaration and no central entry, or the reverse, is the shape the current
  split takes. Treating it as 'nothing to compare' is how 12 agents became
  invisible to one side of the store in the first place.
