it_requirements:
  - >-
    NAMES SETTLED 2026-10-08 (user decision B). Nothing in this family is called
    "nightly" any more, because the run no longer happens nightly. Workflow file
    `.github/workflows/post-merge-suite.yml`, workflow name `Post-merge suite`; module
    `scripts/ci/post_merge_suite.py`. The per-PR check is `Post-merge suite status`
    (TQ-600a-13-vi, -x). Earlier names, all retired before anything was built:
    nightly-suite.yml, nightly_suite.py, `Nightly suite status`, `nightly-red`,
    `nightly-fix`.
  - >-
    AGENT ASSIGNMENT CONFIRMED, WITH THE REASON. No agent in config/agent_registry.json
    owns GitHub Actions YAML; python-coder owns `.py` and every prior AC in this tree that
    edits a workflow file assigns python-coder. The executable contract is a Python module
    plus unittest, and the workflow file is glue.
  - >-
    FAMILY ARCHITECTURE — ALL DECISION LOGIC IN PYTHON, THE WORKFLOW A THIN CALLER.
    Every verdict, retry selection, classification, notice write plan, hold verdict and
    exemption match in this family lives in small modules under scripts/ci/, which take
    the run results / run history / issue data / pull-request data as input and return
    the verdict and the writes to perform. Workflow steps only prepare the environment and
    invoke a module. Module split (re-enriched 2026-10-08): scripts/ci/post_merge_suite.py
    (this record, -v, -xii, -xiii: execute, retry, classify, lane verdicts, pass-on-retry
    window); scripts/ci/_run_history.py (CREATED HERE, because this record's own
    superseded-run descriptor needs it; its ending set is constrained by -v: the ONE
    settled-run rule and verdict-change detection, pure and stdlib-only — every consumer
    imports it, none re-implements it);
    scripts/ci/post_merge_notice.py (-iii, -iv, -x counter, -xii, -xiii: notice lifecycle
    for all three labels and the commit range); scripts/ci/post_merge_hold.py (-vi to -ix,
    -x reader, -xiv: per-PR verdict, exemption, comment, fail-closed, enforcement state);
    scripts/ci/post_merge_reeval.py (-xv, and -xvi's proof re-trigger: re-run fan-out);
    scripts/ci/post_merge_fix_proof.py (-xvi: proof selection and judgement); scripts/ci/
    _github_rest.py (the one REST client and the allowed-write list of -xi). Workflows:
    post-merge-suite.yml (this record), post-merge-timing.yml (-xii; bootstrap in -xix),
    post-merge-followup.yml (-iii notice job, -xv reevaluate job), post-merge-hold.yml
    (-vi), post-merge-fix-proof.yml (-xvi). scripts/ci/ is package-internal CI tooling,
    not deployed to consumers, so no build deploy-manifest entry is needed.
  - >-
    TUNABLES IN ONE FILE (owner decision 2026-10-08: the proposed defaults are accepted and
    must be tunable without a code edit). Every threshold in the family — heartbeat 12 h,
    staleness 30 h, flaky window 5 / threshold 2, run-history page 30, advisory 7 days /
    20 evaluations, demotion windows — is read from `scripts/ci/post_merge_tunables.json`
    (key list in TQ-600a-13-x). This record creates the file with the keys it reads
    (`flaky_window_runs`, `flaky_red_threshold`, `run_history_page`, `heartbeat_max_hours`);
    the heartbeat cron in post-merge-suite.yml must fire at least every
    `heartbeat_max_hours`, which a descriptor checks by parsing the cron string against
    the tunable (the one structural assertion in this record, because a schedule cannot
    be executed in the unit layer).
  - >-
    THE HOLD-SIDE MODULES ARE STDLIB-ONLY AND IMPORT NOTHING FROM THE TEST SIDE.
    post_merge_hold.py, _run_history.py and _github_rest.py must import without pytest,
    PyYAML or any dev dependency, because the hold job installs nothing (-vi). The suite
    and proof modules may import pytest-side code; the hold-side modules must not import
    them.
  - >-
    THE SELECTION IS TQ-600a-13's OPT-IN, NARROWED BY TQ-600a-13-xii's LANE MARKER, NEVER A
    COPY. The correctness lane is collected with the `manual` marker of PR #1050 minus the
    timing marker of TQ-600a-13-xii (proposed: `-m "manual and not timing_ratio"`) over
    `tests/ unit_tests/`, unsharded, in one process. Never a hard-coded list, never
    `-k _MANUAL` (which under PR #1050's addopts collects nothing).
  - >-
    THE RETRY MUST CARRY THE SAME SELECTION — MEASURED, NOT ASSUMED. At enrichment
    (2026-10-08), re-running two failing node ids WITHOUT `-m manual` under addopts
    `-m "not manual"` reported "2 deselected" and executed nothing. The retry job's
    outcome is read per node id from its own per-test report, and a first-run failure
    absent from the retry report counts as failed on both executions — never as
    passed-on-retry.
  - >-
    THE RETRY IS A SEPARATE JOB (user decision D; the earlier same-job retry is retired).
    Three jobs, job-level permissions `contents: read` (plus `actions: read` on `verdict`):
    `run` executes the lane and uploads the first-run per-test report as an artifact with
    `if: always()`, and exits zero whenever it produced a readable report (test failures
    are data, not a job failure); `retry` needs `run`, starts on a fresh runner, downloads
    only the list of first-run failures, performs its own checkout and build, executes
    exactly those ids, uploads its report; `verdict` needs both, runs always, classifies
    (green / red / did_not_complete per TQ-600a-13-v), writes the verdict artifact and
    exits with the verdict. That each GitHub-hosted job gets a fresh VM is a CI/CD-expert
    claim marked UNVERIFIED: record once, from a live run, that `run` and `retry` reported
    different runner names, in this record's notes. The verdict file records the runner
    name of each job for that purpose. The `retry` job is skipped (job-level `if:` on the
    run job's failure-count output) when there were no first-run failures; this workflow
    is not a required check, so a skipped job is harmless here, and `verdict` reads a
    skipped retry as "zero re-executions".
  - >-
    THE VERDICT JOB NAMES ITS OUTCOME IN A STEP THE HOLD CAN READ. The verdict job's last
    two steps are named exactly `Verdict: red` and `Verdict: did not complete`, exactly
    one of which runs and fails on a non-green verdict (both skipped on green). The hold
    (-vi) distinguishes red from did-not-complete with ONE read of the run's jobs
    (`GET /actions/runs/{id}/jobs?filter=latest`) instead of downloading the artifact or
    depending on the notice, so the wording survives a failed notice write.
  - >-
    THE VERDICT COMES FROM PER-TEST RESULTS, NOT EXIT STATUSES. pytest.ini's addopts
    carries `--continue-on-collection-errors`, and exit 5 (nothing collected) is not a
    failure status. Classify from the machine-readable per-test report of each execution.
    The run's conclusion is the verdict job's exit status computed from the verdict.
  - >-
    RUN CONDITIONS MATCH THE GATE THAT RUNS TODAY. Strict mode (`AC_ENFORCE_STRICT=1`),
    full-history checkout, dev dependencies, `python scripts/build.py --target-dir .`,
    and an explicit timeout on each job bounded at no more than three times its measured
    cost, so a hang ends as did-not-complete in bounded time.
  - >-
    TRIGGERS AND COALESCING (user decision B; the once-a-day schedule is retired). `push`
    to `main`; `schedule` as a heartbeat at least every 12 hours, off the hour (for
    example `17 3,15 * * *`); `workflow_dispatch`. Workflow-level `concurrency` with a
    fixed group and `cancel-in-progress: false`. VERIFIED (GitHub expert, docs): at most
    one run is pending per group and a newer pending run replaces the older, which ends
    `cancelled`. That displacement is intended here, and every consumer of the run
    history treats a cancelled run that a newer run superseded as no verdict at all,
    through scripts/ci/_run_history.py (TQ-600a-13-v) and nowhere else. No path filter:
    every merge to main is a candidate.
  - >-
    EVERY RUN-HISTORY READ IN THE FAMILY IS FILTERED TO RUNS THAT TESTED MAIN.
    `branch=main` on the query, and client-side the run's `event` in {push, schedule,
    workflow_dispatch} and `head_branch == "main"`. A pull request that adds a
    `pull_request` trigger to its own copy of post-merge-suite.yml produces runs of the
    same workflow file on its own branch; those never reach a consumer.
  - >-
    PERMISSIONS ARE PER JOB AND MINIMAL, AND THIS WORKFLOW WRITES NOTHING. Every job in
    post-merge-suite.yml holds `contents: read` only (`actions: read` additionally on the
    verdict job if it reads previous verdicts for TQ-600a-13-xiii). The notice and the
    re-evaluation fan-out run in a separate workflow triggered by this one's completion
    (TQ-600a-13-iii, -xv), so a token able to write issues or re-run workflows never
    coexists with the test session, and their failures cannot change this run's
    conclusion — which is what lets the hold (TQ-600a-13-vi) read this run's conclusion
    as the verdict.
  - >-
    RUN STEPS CARRY NO `${{ }}` EXPRESSIONS. Context reaches the module through `env:`
    and the runner's standard variables, so the seam test can execute steps verbatim and
    no shell line interpolates untrusted text.
  - >-
    THE TESTS OF THIS RECORD RUN IN THE DEFAULT SUITE AND COST UNDER 1.2 s. None may be
    `_MANUAL`, carry the `manual` or `timing_ratio` marker, start a build, or call GitHub.
    Real child pytest sessions only in the seam descriptor, against a synthetic project
    with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 (measured 0.21 s per session).
  - >-
    FAMILY TEST BUDGET: UNDER 15 s TOTAL, IN THE DEFAULT RUN (re-enriched 2026-10-08 for 18
    records). Per-record ceilings: -ii 1.2, -iii 0.8, -iv 0.4, -v 1.2, -vi 1.0, -vii 0.3,
    -viii 0.3, -ix 0.5, -x 0.3, -xi 1.0, -xii 1.2, -xiii 0.3, -xiv 0.2, -xv 0.4, -xvi 1.2,
    -xix 2.5 (the one record that collects the real repository), -xvii and -xviii 0 (no
    unit tests) — 12.8 s, leaving about 2 s for harness start-up. The shared fake server
    and scratch repositories are built once per test class, never per test. Measure with
    `--durations=0` over the family's files at sign-off and record the figure in -ii's
    notes; exceeding 15 s is a sign-off blocker, never a wall-clock assertion inside a
    test. For scale: TQ-600a-13-xix removes two default-run tests that cost about 22 s
    EACH, so the family's whole test cost is repaid about three times over.
  - >-
    THE SHARED TEST HARNESS IS BUILT HERE AND REUSED BY THE WHOLE FAMILY. (1) a recording
    fake of the GitHub REST API on 127.0.0.1, serving issues, comments, workflows (with
    `state`), workflow runs (with `status`, `conclusion`, `run_started_at`, `head_sha`,
    `event`), artifacts and branch rules, recording every request; (2) a workflow-step
    executor that loads a workflow file, locates a job by its exact `name:`, and executes
    its `run:` steps verbatim with `bash -e`, skipping `uses:` steps and an explicit
    exact-match list of preparation steps EXCEPT `actions/checkout`, which it EMULATES
    against the scratch repository from the step's own `with:` inputs (`ref` absent ->
    the scratch default-branch commit; `ref` present -> that ref resolved from the
    synthetic event payload; `sparse-checkout`, `path` honoured) so that the trust
    descriptors of -vi and -xvi observe what a checkout would really place on disk rather
    than reading the YAML for a `ref:` key — and FAILING on a `run:` step containing `${{`,
    on a job with a `strategy.matrix`, or on an `if:` it cannot evaluate — and able to
    execute two jobs of one workflow in two separate directories with only a named
    artifact handed between them (needed for the separate retry job); (3) a scratch git
    repository builder with a local bare origin. No test patches urllib or subprocess to
    fake GitHub or git.
  - >-
    THIS FAMILY IS THE CADENCE TQ-600a-13-i REQUIRES, AND IT RESOLVES THAT RECORD'S
    AGGREGATOR QUESTION. A post-merge run is not attached to any pull request, so it can
    neither feed `Test suite (pytest)` nor be required itself. Its result reaches merges
    through the per-PR `Post-merge suite status` check (TQ-600a-13-vi), and it is THAT
    check which becomes required (TQ-600a-13-x). BRANCH RECORDED: TQ-600a-13 was resolved
    on its exclusion branch by PR #1050 (commit 71b84fe2).
delivers_to:
  - agent: python-coder
    ac_id: TQ-600a-13-vi
    contract: >-
      The run history itself is the verdict the hold reads: each completed run of
      `post-merge-suite.yml` on `refs/heads/main` (event push / schedule /
      workflow_dispatch) has conclusion `success` exactly when the correctness lane was
      green, and any other conclusion otherwise. A cancelled run superseded by a newer run
      carries no verdict. On a non-green run, exactly one of the verdict job's steps named
      `Verdict: red` / `Verdict: did not complete` has conclusion `failure`, readable with
      one `GET /actions/runs/{id}/jobs?filter=latest`.
  - agent: python-coder
    ac_id: TQ-600a-13-iii
    contract: >-
      The run verdict file, written by the verdict job at the workspace-relative path
      `post-merge-verdict.json` and uploaded as artifact `post-merge-verdict` with
      `if: always()`. JSON object: `schema_version` (int, 2); `lane` ("correctness" |
      "timing"); `verdict` ("green" | "red" | "did_not_complete"); `stage` (null unless
      did_not_complete, then as TQ-600a-13-v lists); `collected` (int >= 0);
      `collected_ids` (sorted list of node ids — read by -xii to name lane entrants);
      `first_run_failures`, `failing`, `passed_on_retry`, `repeated_pass_on_retry` (sorted
      lists of full node ids; the last per TQ-600a-13-xiii, always empty for timing);
      `pass_on_retry_window` (object node id -> int count over the last five settled
      runs, current included); `window_runs_read` (int 1..5); `run_runner`,
      `retry_runner` (runner names, null when that job did not run); `head_sha` (40-hex);
      `ref`; `event` ("push" | "schedule" | "workflow_dispatch"); `run_id` (int);
      `run_url`.
  - agent: python-coder
    ac_id: TQ-600a-13-xvi
    contract: >-
      The same `post-merge-verdict` artifact of the current red run, whose `failing` list
      is the exact set the proof run executes and whose `run_id` the proof records.
  - agent: python-coder
    ac_id: TQ-600a-13-xiii
    contract: >-
      The per-run `passed_on_retry` list and the verdict job's slot for the
      `repeated_pass_on_retry` escalation, computed in the same verdict job before it
      exits.
  - agent: python-coder
    ac_id: TQ-600a-13-v
    contract: >-
      The same verdict object with `verdict: did_not_complete` and a `stage` for every
      ending the verdict job can observe.
  - agent: python-coder
    ac_id: TQ-600a-13-i
    contract: >-
      The invoked cadence TQ-600a-13-i requires for the correctness lane:
      `.github/workflows/post-merge-suite.yml`, on every merge to main plus a heartbeat,
      whose conclusion is failure on a red run. The timing lane's cadence is
      TQ-600a-13-xii's.
  - agent: documentation-expert
    contract: >-
      Correct scripts/suite_performance/README.md's "Known, accepted gap" bullet in the
      same change that lands this run. State the true position: the excluded population
      runs after every merge to main and on a heartbeat, in two lanes (correctness holds
      pull requests, timing reports only), failures are re-executed once on a fresh
      machine, a fail-then-pass is reported and tracked, and a red correctness run holds
      pull requests through the `Post-merge suite status` check. Do not delete the
      sentence and leave the reader to assume coverage.
expects_from:
  - ac_id: TQ-600a-13-i
    contract: >-
      The named opt-in that collects every test the default run excluded.
  - ac_id: TQ-600a-13-xii
    contract: >-
      The lane marker and the correctness-lane selection.
  - ac_id: TQ-600a-13
    contract: >-
      The exclusion mechanism of PR #1050, merged: the `manual` marker auto-applied to
      node ids ending `_MANUAL`, deselected by the addopts `-m "not manual"`, opt-in by a
      command-line `-m`. Measured by PR #1050: 43 tests, ~1,004 s.
test_spec:
  - name: test_tq600a_13_ii_only_first_run_failures_are_rerun_and_only_once
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_suite.py's execute, retry and classify entry points, called in-process with a fake test runner that records every invocation and returns per-test results"
    description: >-
      Population of three: A always passes, B fails then passes, C always fails. A runs
      once; B and C run twice; nothing runs a third time. Verdict red, `failing` is [C];
      B is in `passed_on_retry`; the verdict step's exit status is non-zero.
  - name: test_tq600a_13_ii_a_retry_does_not_hide_a_flaky_pass
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_suite.py in-process with a fake runner"
    must_catch:
      - "the whole population is re-executed rather than only the failures"
      - "a failure is retried more than once"
      - "a fail-then-pass test is counted as an ordinary pass and named nowhere"
      - "C fails on both executions and the verdict is still green because the retry's own exit status is what is reported"
      - "the retry report omits a first-run failure entirely and that failure is counted as passed-on-retry"
    description: >-
      Same population with B and C varied independently, plus a retry that returns an
      EMPTY report. Each named mutation turns this descriptor red.
  - name: test_tq600a_13_ii_a_clean_run_is_green_with_zero_reruns
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_suite.py in-process with a fake runner"
    description: >-
      The paired control. All three pass first time: green, zero re-executions, exit zero.
  - name: test_tq600a_13_ii_the_retry_is_a_separate_job_fed_only_the_failure_list
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the `run`, `retry` and `verdict` jobs of .github/workflows/post-merge-suite.yml, each located by exact name and executed verbatim by the shared workflow-step executor in its OWN fresh directory, with only the named artifacts handed between them, in a synthetic three-test project with real child pytest sessions and PYTEST_DISABLE_PLUGIN_AUTOLOAD=1"
    must_catch:
      - "the retry is performed inside the run job, so no separate retry job exists for the executor to find"
      - "the retry job depends on state left in the run job's workspace and fails or selects nothing in a fresh directory"
      - "the retry is invoked by node id without the lane selection, so it executes nothing and the run reads green"
      - "the run job exits non-zero on a test failure, so a fail-then-pass run concludes failure"
      - "the module parses a per-test report shape real pytest does not produce"
      - "the verdict job fails on red without running the step named `Verdict: red`, so the hold cannot tell red from did-not-complete"
    description: >-
      THE ONE SEAM FOR THIS WORKFLOW FILE. A passes, B fails then passes, C always fails.
      The verdict file names C in `failing` and B in `passed_on_retry`, the run job exits
      zero, the verdict job exits non-zero at the step named `Verdict: red`; with C made
      to pass, the verdict job exits zero with B still named. Three real child sessions,
      about 0.2 s each. The verdict job's -xiii history read is served by the fake server
      (no earlier runs) in this descriptor.
  - name: test_tq600a_13_ii_the_heartbeat_fires_within_the_tunable_bound
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: boundary
    surface_invoked: "the `schedule` cron strings of .github/workflows/post-merge-suite.yml, expanded over one week by a small stdlib cron expander, against `heartbeat_max_hours` read from scripts/ci/post_merge_tunables.json"
    must_catch:
      - "the heartbeat is once a day, so a quiet repository's verdict can age past the staleness bound"
      - "the cron fires on the hour"
      - "the bound is a literal in the test rather than the tunable"
    description: >-
      The largest gap between consecutive fire times over a week is at most
      `heartbeat_max_hours`, and no fire time has minute 0. Structural by necessity (a
      schedule cannot be executed offline); the live firing is a recorded observation.
  - name: test_tq600a_13_ii_successive_merges_never_cancel_the_run_in_progress
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    surface_invoked: "scripts/ci/_run_history.py's settled-run function, in-process, on served run lists (the shape of GET /actions/workflows/{file}/runs) containing in-progress, waiting, superseded-cancelled and pull_request-event runs"
    must_catch:
      - "a cancelled run superseded by a newer run is read as did_not_complete"
      - "every cancelled run is skipped, so a lone cancellation reads the older green run"
      - "the list is trusted to be newest-first rather than ordered by run_number"
      - "a run of the same workflow file triggered by pull_request on a PR branch is accepted as a main-branch verdict"
    description: >-
      The coalescing itself is the hosting service's behaviour and is recorded live (see
      notes); what the unit layer proves is that a cancelled run superseded by a newer
      run is classified as carrying no verdict, while a cancelled run with no newer run
      is did_not_complete, on a served list deliberately NOT in newest-first order.
test_rationale: |
  The retry exists to stop the run being ignored, and the passed-on-retry clause exists
  to stop the retry from becoming the thing that hides the bug. Both are asserted by
  executing a population whose failures are controlled.

  The amendment of 2026-10-08 moves the retry into its own job. The seam therefore
  executes the three jobs as three separate executions in three directories with only
  the named artifacts between them: a retry that silently relies on the first job's
  workspace, or a retry folded back into the first job, fails that seam. Whether the
  hosting service actually puts the second job on a different machine cannot be shown in
  the unit layer and is recorded once from a live run.

  The superseded-run descriptor lives here, not only in -v, because this record creates
  the run-history module and its coalescing produces the displaced runs; -v adds the hold
  and notice consequences on top.

  Cost: in-process descriptors in milliseconds, the seam's three child sessions about
  0.2 s each. Under 1.2 s for the record.
