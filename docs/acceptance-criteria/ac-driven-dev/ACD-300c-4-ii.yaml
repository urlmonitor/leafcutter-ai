notes: |
  The approval step already re-reads what it writes; this record makes the workflow honour
  that result. Whether ACD-9990a-1 (written and read back cleanly) stays approved in the
  failed run is left to the IT PO; the criteria only forbid reporting ACD-9990a-2 approved
  and committing the batch as approved.
