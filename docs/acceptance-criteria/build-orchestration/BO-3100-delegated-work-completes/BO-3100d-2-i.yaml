notes: |
  A supersession is completed in two places and it is normal for only one of them to be done.
  The half that gets forgotten is almost always the predecessor's own marking, because the
  author is working in the new record — and that is the half a reader depends on, since the
  reader arrives at the old record first.

  A REFERENCE THAT RESOLVES TO NOTHING READS AS COVERAGE. This repository has the shape on
  record already: the ac-driven-dev triage notes that "a reference that resolves to nothing
  reads as coverage to everyone who checks for one". An unresolvable supersession pointer is
  worse than none, because it tells a reader the question has been settled elsewhere.

  THE TWO REPORTS MUST DIFFER because the repairs differ: one is a wrong name in the new
  record, the other is a missing mark on the old one. Collapsing them sends the author to the
  wrong file, which is the misdirection cost KI-BO-018 records.

  The third scenario keeps the check from being satisfied by one that reports every pair.

  IT-PO ENRICHMENT NOTE (2026-08-26). This AC is the mechanical half of BO-3100d-2. It covers
  the structural facts about a supersession and makes no claim about whether the replacement
  reasons well — that boundary is stated on BO-3100d-2 and is discharged by human review. The
  checker must read only the machine-readable fields; a checker that starts parsing the body
  prose to judge completeness would be claiming the half that cannot be automated.
