notes: |
  THE GAP THIS CLOSES. Every other child of GE-122 is a DETECTOR. GE-122a-1 runs a
  whole-collection pass and reports numbers claimed twice; GE-122a-2 reports one work item held
  in two lifecycle folders; GE-122c reports them well; GE-122d runs them at three stages;
  GE-122e repairs what already drifted. Not one of them places an obligation on the component
  that CHOOSES a new identifier. Detection after the fact is not allocation, and the L1's own
  criteria are written in the allocation voice — "the number you give it is yours alone".

  WHY THIS IS PARENTED UNDER GE-122a AND NOT GE-122b. GE-122b's promise is enrolment: that new
  work joins the numbering rather than sitting outside it. A component that mints an identifier
  someone else already holds SATISFIES that promise — the artifact took a number. What it
  breaks is GE-122a's promise, that the number identifies exactly one thing. This AC is the
  prospective face of GE-122a-1's retrospective one: the pass says a collision exists, this says
  one is not created. GE-122b's own doc_link on the diagram allocator records that allocator as
  already correct and frames GE-122b's contribution as telling an author to USE it — a different
  concern from whether an allocator's answer is right.

  NOT A DUPLICATE OF GE-122a-1, AND IT CANNOT BE SATISFIED BY IT. GE-122a-1's verdict answers
  "is some number claimed twice". It never answers "which number is free", which is the only
  question a minting component asks. The two must nonetheless share ONE definition of a claimed
  identifier, which is what the expects_from contract pins — if the pass counts a cited-but-
  undeclared identifier as taken and the allocator does not, the allocator will mint identifiers
  the pass then blocks.

  THE TWO EXCLUSIONS ARE BOTH MEASURED, NOT HYPOTHETICAL, and both are live in ONE namespace.
  Verified 2026-08-25 in guardrail-engine: GE-120 is owned by a feature folder with no loose
  record at the namespace root, so a root-only scan does not see it — that is exactly the
  enumeration that reissued GE-120 sixteen hours after a 43-file tree took it. In the same
  namespace GE-114-1 through GE-114-4 and GE-115 sit loose at the root, owned by no folder, so
  the mirror error — a folder-only scan — under-reports too. Any enumeration that is not
  depth-agnostic is wrong in one direction or the other here.

  THE SECOND EXCLUSION IS THE ONE THAT LOOKS LIKE PEDANTRY AND IS NOT. Verified 2026-08-25:
  ACS-1100a-4, ACS-1100b-3, ACS-1100c-3 and ACS-1100d-3 are declared by no record in the store
  and are cited by name in five live records that describe them as former siblings. A component
  that tests freedom by asking whether a record declares the identifier will report all four as
  free. Reissuing one does not create a dangling reference — it creates a reference that
  resolves confidently to the wrong record, which is strictly worse and strictly harder to
  notice.

  WHAT IS DELIBERATELY NOT HERE. Concurrency is not in this criterion. The two observed
  incidents were sixteen and twenty-four hours apart, not concurrent, and an atomicity rule for
  minting is already specified elsewhere in the store for the quick-fix path. Adding a second
  statement of it here would be the second definition GE-122d-1 forbids. If a concurrent mint is
  later observed, that is new work under its own record.
