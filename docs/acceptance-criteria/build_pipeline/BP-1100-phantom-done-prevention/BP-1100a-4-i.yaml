title: "A file the requirement forbids touching is never named as the work's surface"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a requirement that names a file and states that this work must NOT touch it,
  because the problem that file represents is deliberately being solved by a different
  requirement,
  When a ticket is generated from that requirement,
  Then the surface the generated ticket names does not contain that file,
  And that file appears nowhere in the generated ticket as something this work is
  expected to change,
  And this holds however often and however prominently the requirement's record mentions
  the file — a prohibition is not weakened by being stated at length.
