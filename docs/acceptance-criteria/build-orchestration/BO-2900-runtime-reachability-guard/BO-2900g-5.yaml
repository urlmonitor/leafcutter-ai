notes: |
  Satisfies BO-2900g's documentation_triggers: [reference-doc]. Same role as
  BO-2900f-5 in the sibling tree: a reference, not a how-to.

  WHY THE LAST CLAUSE IS NOT BOILERPLATE. This page will be the single most
  convenient place to look up "what proof is required", which makes it the single
  most likely place for someone to conclude that a conforming description means
  the proof exists. The parent L1's boundary — planning-time only, never evidence
  of achievement — has to be written on the page itself, because a boundary that
  lives only in an AC file is invisible to the page's readers.

  AGENT ASSIGNMENT DELIBERATELY OMITTED. This AC is authored by the BA at L2 with
  no technical enrichment; the IT PO assigns it (documentation-expert is the
  expected owner, per the documentation-trigger convention) and pins the real
  page path.

  IT-PO ENRICHMENT NOTE (2026-08-17). Assignment DEVIATES from the suggestion
  above, on the evidence of config/agent_registry.json: the registry carries a
  more specific phase agent, reference-author (tier: phase, role: documentation,
  is_ticket_phase: true), whose selection_criteria reads "Assign when the ticket
  requires a new reference document in docs/reference/." documentation-expert's
  criteria are broader ("docs-only change", "files_touched contains docs/*.md")
  and it is additionally routed post-coder by the documentation_gates
  canonical-order path, so it will still see the change; the specialist owns the
  authoring. Page path pinned to docs/reference/required-proof-vocabulary.md.
