id: GE-133
title: "A directory stays small enough that a person can still find their way around it"
component: guardrail-engine
components:
  - commit_guardian
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Directories never quietly fill up past the point where a person can find
  anything in them.

  A folder holding dozens of unrelated files is where things get lost: the
  next file lands next to whatever happens to be there, related work drifts
  apart, and nobody can tell at a glance what the folder is for. The project
  already has a check for this, and it now runs on every ordinary commit. What
  it does not yet know is the difference between a folder a person browses
  and a store of records that only tools read, so it refuses the second for
  the reason it exists to apply to the first.

  After this goal, the crowding standard is applied where a person navigates
  by hand, a place that is deliberately flat because tools read it is set
  aside openly and on a stated ground rather than by someone bypassing the
  check and is reported as set aside, and nothing about this makes a folder of
  source or tests any easier to crowd.
