    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Determine the deployable-script source set from the build's existing source-resolution step (the function that enumerates every script path the build will ship); do not maintain a separate hardcoded list."
  - "Tracked-ness must be determined from the git index (e.g. git ls-files), not from filesystem presence; an on-disk-but-untracked file must classify as untracked."
  - "Resolve paths relative to the repository root so the classification is stable regardless of the build's working directory."
  - "Wrap the git query and any file access per the project error-handling policy (CLAUDE.md Rules 1-3): specific exception types, log at WARNING or higher, and surface a failure to determine tracked-ness as a determinate guard error rather than silently passing."
delivers_to:
  agent: python-coder
  contract: "list[dict] — list of deployable scripts whose source is untracked, each { script_path: str (repo-root-relative POSIX), tracked: false }; empty list means every deployable script source is tracked. Consumed by the build-fail step BP-900f-2 and the fresh-clone reproducibility assertion BP-900f-3."
