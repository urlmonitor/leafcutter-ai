notes: |
  THE CENTRAL SAFETY PROPERTY OF THE WHOLE TREE, and it is REFUSED, NOT DEFERRED. This
  is not a phasing decision and it is not open to the IT PO or to an implementer who
  notices how easy it would be. Restoring an evidence link is not the same act as
  awarding a done badge: auto-promoting finished state from derived evidence
  manufactures a done claim on the single field the entire phantom-done edifice rests
  on — the exact failure mode this repository exists to prevent, committed by the tool
  built to prevent it. The neighbouring L1 TQ-400f was authored and then closed unbuilt
  on 2026-09-01 partly for approaching this line.

  THE PAIRING IS WHAT MAKES THIS FALSIFIABLE. "No finished state changed" is perfectly
  satisfied by a tool that does nothing, by a crashed run, and by a test that never
  invoked the tool. Requiring, in the SAME invocation, that two records demonstrably
  gained their coverage entries excludes all three. Any amendment that separates the
  refusal clauses from the repair clauses into different scenarios reopens them.

  THE ELIGIBILITY CLAUSES ARE THE SHARP EDGE, and they are deliberately adjacent to the
  refusal rather than in a record of their own. Reporting "these records could now be
  marked finished" is exactly one line of code away from marking them, and separating
  the report from the refusal would let one ship without the other. Keeping them in one
  criterion means the implementer cannot satisfy the useful half without satisfying the
  restraint.

  WHY THE VERDICT MUST BE THE ORACLE'S. A repair that computed its own eligibility would
  be reading evidence it had just written, in a rule it wrote itself. Requiring
  verify_done_eligible's verdict keeps the judgement with the code that already fails
  closed on xfail, skip, error and not-run outcomes.

  CORRECTED 2026-09-01 — THE ELIGIBILITY CLAUSES SAID "BECAME ELIGIBLE" AND THAT WAS
  FALSE. Restoring a coverage link changes no record's mark-done eligibility, and never
  did: verify_done_eligible resolves a record's proof from its direct `# covers:` tag
  first and reads the coverage list only on the composite path, and every rotted record
  has a direct tag by construction. Measured: 527 of 549 rotted records were ALREADY
  eligible. The eligibility list this AC requires is therefore a standing inventory the
  repair is well placed to emit, not an effect the repair produced. The clause now
  requires the report to SAY that — before-and-after verdicts equal — which converts the
  correction into a guard against the same misreading recurring downstream.

  THE REFUSAL IS UNAFFECTED AND IF ANYTHING SHARPER. The temptation the refusal exists to
  resist was always "the evidence is right there, just flip it". Under the corrected model
  the evidence was right there BEFORE the repair ran, so the repair has even less claim to
  be the thing that earned the promotion. 276 records are eligible and unmarked today;
  clearing them is a separate sweep, and this tree's report is an input to it, never an
  execution of it.

  ACS-200f IS THE WORKED EXAMPLE FOR WHY THE ORACLE ITSELF NEEDS WATCHING. Found and fixed
  on this branch 2026-09-01: ACS-200f was marked done at priority high carrying the
  criterion "the tool's coverage gate treats those covering tests as passing", which was
  FALSE at HEAD for every parametrized covering test — done_proof._find_nodeid_for_test
  matched nodeid.endswith("::func"), which a parametrized nodeid never satisfies, so five
  records with fully green tests were refused as "linked test not run". The AC written to
  stop the gate falsely refusing was itself falsely refusing, its covering test never
  exercised the case, and only a whole-store oracle run surfaced it. Every eligibility
  figure this AC depends on is downstream of that fix.
