notes: |
  Owner ruling at the AC gate (2026-10-09), decision (2)(d): a canonical path with a
  percent-encoded slash or a trailing slash answers with the 404 'Flow not found' state quoting
  the requested id. The flow leafcutter/explore-flows-in-atlas v5 does not yet model this
  behaviour (its 'flowNotFound' branch covers a typo, a product alone, a step written as a path
  segment and an unknown flow with ?step=), so no flow node maps to this AC and it carries no
  flow back-link. The quoted id is the path after /flows/ verbatim, as the leafcutter/atlas-flows
  dataset defines the requested flow id, so the encoded form keeps '%2F' rather than being
  decoded to the id of an existing flow. The notice wording is the dataset's variant for an id
  that is not <product>/<flow>: neither requested id matches the two-segment flow-id form. That
  wording choice is derived from the dataset, not part of the ruling.
