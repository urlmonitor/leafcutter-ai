criteria: |
  Given a maintainer needs the complete contract for generating and validating
    Codex-native Leafcutter agents,
  When they open the Codex agent compatibility reference,
  Then it identifies AGENTS.md, .codex/agents/<identity>.toml, and
    .agents/skills/<skill>/SKILL.md as the native Codex surfaces,
  And it lists required native fields name, description, and developer_instructions
    plus supported model and reasoning fields,
  And it documents the versioned JSON policy schema, override precedence, and the
    defaults haiku to gpt-5.6-luna/low, sonnet to gpt-5.6-terra/medium, and opus
    to gpt-5.6-sol/high,
  And it lists every supported capability alias and namespace-qualified MCP tool
    with an explicit map or reject decision,
  And it documents explicit guidance inheritance for both deep variants while
    retaining their separate identities and model mappings,
  And it defines compatibility report fields and registry-intent completeness,
  And it records that Codex translations do not change Claude or Gemini behavior.
