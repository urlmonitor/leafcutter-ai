criteria: |
  Given an old-style workspace holding nothing unsent whose folder also holds
    files version control is told to ignore -- ".env.local" and a folder "build/" --
  When the cut-over retires it,
  Then its folder is gone,
  And the report's entry for it lists ".env.local" and "build/" as ignored content
    that was deleted,
  And the no-change preview lists the same paths before anything is deleted.
