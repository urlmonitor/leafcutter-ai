id: GE-130b-2-i
title: A request naming no agent is the top-level session and keeps its overrides on both paths; it is
  never treated as a caller who cannot be identified
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tool call carrying no agent identity, which GE-129a decides is the top-level session,
  And the documentation override, the guide-check override and the task-lock guard's warn
    setting each in effect in turn,
  When the top-level session makes a change each guard refuses without its override, once with
    the editing tools and once with a shell command,
  Then the change is let through on both paths under the override, and no statement that the
    caller could not be identified is made,
  And in the same run a tool call whose identity GE-129a counts as not established has the same
    override refused on both paths, so a call naming no agent and a call whose caller cannot be
    identified reach different outcomes.
depends_on:
