assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ac_store/ -q"
  config_schema_fragment:
    type: object
    description: "The per-check accounting record the readiness report must keep, and the verdict rule derived from it. The report today records only the checks it happened to run (line 2773 onward) and computes its verdict from that list (line 2801), so a check that was never attempted is indistinguishable from one that passed. The fix is to make NOT-ATTEMPTED a first-class recorded outcome carrying a reason, and to make the verdict a function of the full check inventory rather than of the lines that happen to be present. n_location_rule is 'all' rather than '1' because every gate on is_code_ac in the readiness block is an enforcement point — a fix applied to line 2773 alone leaves checks #4 and #5 silently unattempted, which is the fourth clause's exact target."
    required:
      - check_id
      - outcome
    properties:
      check_id:
        type: string
        description: "The check being accounted for. The inventory must be enumerable, so that 'every check is either performed or named as not performed' is decidable rather than aspirational. An inventory derived from the checks that ran cannot express a check that did not."
      outcome:
        type: string
        enum:
          - pass
          - fail
          - not_attempted
        description: "not_attempted is the new value and the whole point. Today an un-attempted check leaves no trace and the verdict at line 2801 reads READY over a report missing half its checks. not_attempted must never be counted toward a ready verdict — it is neither a pass nor a silent absence."
      reason:
        type: string
        description: "Required whenever outcome is not_attempted or fail. For an uncarried proof demand it must name WHICH demanded kind was not carried through and WHY, and name the work — the third criterion clause is about the report's content, not merely its verdict."
      uncarried_proof_kind:
        type: string
        description: "Set when the reason is that a demanded kind of proof could not be carried through. Uses the vocabulary TQ-200c-1 single-sources; before c-1 lands there is one kind and the field degenerates, which is why this AC depends on c-1."
  constraints:
    - "NOT-ATTEMPTED must be a recorded outcome, not an absence. Verified 2026-08-18: checks #4 (line 2776) and #5 (line 2783) are gated on is_code_ac and simply do not execute for judged work; nothing in the output says so. An un-attempted check that leaves no trace is indistinguishable from a passed one — the same failure BO-2400g-2 names for inert review phases."
    - "The verdict must be computed from the FULL check inventory, not from the recorded lines. The verdict at line 2801 today is derived from whatever was recorded, so a report missing half its checks still reads READY. Any fix that adds not-attempted lines while leaving the verdict derived from the same list satisfies the fourth clause's letter and still emits a green verdict."
    - "A report containing any uncarried demanded proof kind must not be emittable as ready-to-build. Assert on the verdict the real command surface writes, not on an in-memory structure — the operator reads the emitted report."
    - "'No proof demand' may only read as a pass when the decision was actually made. The current line 2773 records `PASS  non-code AC — no test contract required` for work where the question was never asked; the two must become distinguishable in the output. This is the reporting rule only — how the answer is DERIVED is TQ-200c-2's and is deliberately not depended on here."
    - "The guarantee is on the WHOLE routed demand, not on one field. An implementation that stops discarding an authored test_spec (the narrow, generator-local ACD-400b requirement being authored concurrently) and stops there still fails this AC: a judged kind can go uncarried while the authored deterministic field survives intact. Do not close this AC by citing that one."
    - "Must not turn an announced gap into a merge gate. This AC produces a REPORT. Whether an announced gap blocks CI is TQ-200b-4's; whether an unreachable eval set is a gap is TQ-200c-4-i's. Adding a non-zero exit for a gap here would pre-empt both."
    - "Must not alter the content, wording or order of any check that IS performed today. The existing readiness report is consumed by /build-ac; adding accounting must be additive, verified by generating tickets for a set of code ACs before and after and diffing the reports."
    - "Point any test at a COPY of the store. The generator writes an implemented_by back-reference into the source AC, so a test run against docs/acceptance-criteria mutates the real store."
delivers_to:
  agent: python-coder
  contract: "A readiness report in which every check carries an explicit outcome of pass, fail or not_attempted-with-reason; in which an uncarried demanded proof kind is named together with the work it belongs to; and whose verdict is computed from the full check inventory, so a report with any uncarried kind or any un-attempted check cannot read as ready-to-build. Consumed by whoever drives /build-ac, which today reads a green verdict over a report that silently omitted half its checks."
expects_from:
  ac_id: TQ-200c-1
  contract: "The single-sourced proof-kind vocabulary (test_spec[].proof_mode, values {asserted, judged}, absent-means-asserted). 'Which demanded kind of proof was not carried through' is only a statable finding once kinds exist; before c-1 there is one kind and the finding degenerates. This AC reads the vocabulary and never redefines it."
test_required: true
test_spec:
  - name: test_an_uncarried_proof_kind_is_named_in_the_report_together_with_the_work
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: criterion
    covers: [TQ-200c-5]
    description: "A record carrying a demand the pipeline cannot honour produces a report that names the uncarried kind, the reason, and the work. Asserting only that the report is non-green passes on an implementation that fails opaquely, which leaves the operator no better off."
  - name: test_a_report_with_an_uncarried_demand_cannot_read_as_ready_to_build
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: criterion
    covers: [TQ-200c-5]
    description: "The emitted verdict for that same record is not a success. Separate from the naming test because the two fail independently: a report can name the gap in its body and still compute READY at line 2801 from the lines it recorded."
  - name: test_a_check_that_was_not_attempted_is_named_as_not_attempted_with_a_reason
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    covers: [TQ-200c-5]
    description: "THE SHARPEST CLAUSE. For work where checks #4 and #5 are skipped, the report must say they were not performed and why. Today they leave no trace at all. A test asserting only that the report mentions the checks passes on a version that lists them as passed."
  - name: test_the_verdict_is_computed_from_the_full_check_inventory_not_the_recorded_lines
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: seam
    covers: [TQ-200c-5]
    description: "Removing a check from the executed path must change the verdict, not merely shorten the report. The natural half-fix adds not-attempted lines while leaving the verdict derived from the same list, which passes every presence assertion above and still emits READY."
  - name: test_none_required_is_distinguishable_from_never_asked
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: boundary
    covers: [TQ-200c-5]
    description: "Two records — one that genuinely needs no proof and one whose proof question was skipped — must produce different reports, and only the first may read as a pass. Today both produce the same line 2773 PASS. Does not assert HOW the answer was derived; that is TQ-200c-2's."
  - name: test_fixing_the_authored_field_alone_does_not_satisfy_the_whole_routed_demand
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    covers: [TQ-200c-5]
    description: "NEGATIVE CONTROL against the concurrent generator-local fix. A record whose authored test_spec survives intact but whose judged kind goes uncarried must still fail. Without this test the AC is closable by ACD-400b's narrower change, which is precisely what the fifth criterion clause forbids."
  - name: test_the_report_is_produced_by_the_real_generator_command_surface
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: reachability
    covers: [TQ-200c-5]
    description: "PRODUCTION ENTRY POINT: runs the real generator command line over a COPY of a store and asserts on the report it actually emitted. A correct accounting the command surface never prints is invisible, which is the same observable as no accounting at all. Use a copy — the generator writes an implemented_by back-reference into the source AC."
  - name: test_reports_for_existing_code_acs_are_unchanged_apart_from_the_new_accounting
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: real_artifact
    covers: [TQ-200c-5]
    description: "Added by it-po. Over a copy of the real store, the reports for a set of ordinary code ACs must keep every check they carry today, in the same wording and order. /build-ac consumes this report; a rewrite that changes what a passing report looks like breaks the reader while every positive test above passes."
test_rationale: |
  Every assertion is made on the report the real generator EMITTED, never on an in-memory
  structure, because the failure this AC names is invisible from the inside: checks #4 and
  #5 are not failed, they simply never run, and the verdict is computed from the lines that
  happened to be recorded. An implementation can hold a perfectly correct internal view of
  what it skipped and still print today's green report.
  Naming and verdict are separate tests because they fail independently, and the second is
  the one that matters to an operator: a report that describes the gap in its body and still
  computes READY at line 2801 has changed nothing about the decision anyone makes from it.
  For the same reason the seam test requires the verdict to MOVE when the executed check set
  moves — the natural half-fix appends not-attempted lines to the body while leaving the
  verdict derived from the same list, and that half-fix passes every presence assertion.
  The whole-routed-demand negative control is mandatory rather than optional. A narrow,
  generator-local requirement forbidding the discard of an authored test_spec is being
  authored concurrently under ACD-400b, and an implementer who closes it will be strongly
  tempted to mark this one done too. The fifth criterion clause exists to prevent that, and
  a test is the only thing that makes the clause bite.
  The real_artifact test guards the reader rather than the writer: /build-ac consumes this
  report today, so a restructure that satisfies every new clause while changing what a
  passing report looks like trades one silent failure for another.
