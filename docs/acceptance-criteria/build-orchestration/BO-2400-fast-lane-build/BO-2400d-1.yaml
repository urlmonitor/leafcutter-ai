roadmap_phase: phase_1
criteria: |
  Given an agent invocation completes during a build,
  When its telemetry is recorded,
  Then exactly one telemetry record is appended to the sink for that invocation
  And the record contains its duration, input token count, output token count, and
    cache-read token count.
