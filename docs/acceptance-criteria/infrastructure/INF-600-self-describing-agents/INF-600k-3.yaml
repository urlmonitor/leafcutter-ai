criteria: |
  Given an agent's registry entry lists a name in its spawned_by array that is
    neither a known agent in the registry nor a recognized external caller (not a
    workflow filename and not the literal "user")
  When the build validates the agent registry
  Then validation reports that entry as an unknown agent and the build fails
  And the relaxation that accepts workflow filenames and "user" does NOT suppress
    this genuine unknown-agent error
