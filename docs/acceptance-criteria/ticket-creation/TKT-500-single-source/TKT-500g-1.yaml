id: TKT-500g-1
components:
  - ticket_creation_pipeline
  - testing_quality
readiness: draft
priority: medium
title: "An authored proof demand reaches the work item whole, and names who owes it"
component: ticket-creation
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given an approved requirement that authors its own proof demand of two named
    statements — one answering "the stated behaviour holds" and one answering
    "the behaviour is reachable from the real entry point" — each carrying the
    descriptive sentence it was authored with,
  And the worker named on that requirement is not one of the workers classified
    as producing production code (for example a prompt specialist, a
    documentation author, a proof author, or no worker named at all),
  When a work item is generated from that requirement,
  Then the generated work item carries a proof section listing both authored
    statements,
  And each listed statement keeps the descriptive sentence and the
    kind-of-proof label it was authored with,
  And the work item's phase list records the proof writer and the proof runner
    as phases still owed,
  And the classification of the named worker changes none of the above,
  And the same holds for every approved requirement in the real store that
    authors a proof demand, not only for a constructed example.
depends_on: [TKT-500g]
