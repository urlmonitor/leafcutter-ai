criteria: |
  As a developer running /build-ac on a single leaf acceptance criterion, I want
  the coordinator to resolve that AC's connected build set — its still-unbuilt
  sub-parts plus its genuine (non-structural-parent) prerequisites, in dependency
  order — and generate tickets for the whole set, so I can build everything the
  requirement needs without hand-tracing prerequisites. When the resolved set is
  just the target AC, the output is unchanged from today's single-ticket path.
