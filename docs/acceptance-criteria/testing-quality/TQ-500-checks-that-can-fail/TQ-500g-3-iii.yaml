it_requirements:
- 'Placement: new private module scripts/build_orchestration/_cs_asserts.py holds the whole comparison (pure functions,
  no CLI of its own). consumer_sweep.py check calls it once, after _cs_edits'' comparison and before _cs_runs'' runs,
  whatever the edit comparison found (unlisted edits, a missing list): the loosened step never reads the sweep list.
  No second CLI, no second dispatch from finish, no route JS change. Until consumer_sweep.py check, as called by
  wrong_version_gate.py finish, fills loosened, this AC is not done.'
- 'Static only: Python stdlib ast over the source text of each side. Never import, execute or collect the test
  module, never start pytest or any subprocess for this step, never call a language model. The same base ref and
  working tree give byte-identical loosened output on every run (no set or dict iteration order in the output).'
- 'Scope: exactly the tests in -i''s per-test split (present at --base-ref and now, source with decorators changed),
  in existing test files and conftest.py. A test added by the work, a test gone from the working tree (TQ-500g-3-ii''s
  case), an unchanged test and any fixture, helper, constant or pytestmark are not compared. Each test is walked
  over its body only (decorators excluded), including nested blocks, nested functions and lambdas.'
- 'Rule (a) FEWER ASSERTIONS. assertion count = assert statements + assertion calls, where an assertion call is
  a call whose callee is an attribute or bare name starting with ''assert'' (self.assertEqual, mock assert_called_with,
  np.testing.assert_allclose, assert_frame_equal) or is self.fail, pytest.fail, pytest.raises, pytest.warns or pytest.deprecated_call
  (the last four also as bare names), counted once per call whether it is used as a with-context or in call form.
  pytest.approx is NOT counted: it lives inside an assertion already counted, and counting it would flag replacing
  approx by an exact == as weakening. An assert statement whose test is an and-chain counts once per conjunct
  (review H-2: assert x == 1 / assert y == 2 merged into assert x == 1 and y == 2 is 2 to 2, not fewer; removing
  one of the two is still ''2 to 1''). Stop when count now < count at base; what ''fewer assertions'', detail ''<base>
  to <now>'' (F: ''3 to 2''; L: ''1 to 0'').'
- 'Rule (b) COMPARISON LOOSENED, keyed by subject, not by position or operator multiset. A strict comparison is
  (1) an == or is pair inside an assert statement''s test, where the test is a comparison or an and-chain of comparisons
  (each pair of a chained comparison counts separately), and (2) a call to a strict method: assertEqual, assertEquals,
  assertIs, assertIsNone, assertDictEqual, assertListEqual, assertTupleEqual, assertSetEqual, assertSequenceEqual,
  assertMultiLineEqual, assertCountEqual, assertAlmostEqual, assert_called_with, assert_called_once_with, assert_awaited_with,
  assert_awaited_once_with, assert_has_calls. Every other assertion form is non-strict: in, not in, !=, is not,
  <, <=, >, >=, bare truthiness, not, or-chains, any comparison nested in a call, and every other assert* method
  (assertTrue, assertFalse, assertIn, assertNotEqual, assertIsNotNone, assertGreater, assertGreaterEqual, assertLess,
  assertLessEqual, assertRegex, assertIsInstance, assert_called, assert_called_once, assert_any_call...). The subject
  of a strict comparison is ast.unparse of its operand that is not a literal (a constant, a negated constant, or
  a tuple, list, set or dict of literals); if neither is a literal, the subject is order-independent (the pair of
  both unparsed operands, so review H-1''s operand swaps assert f() == expected to assert expected == f() and
  assertEqual(expected, actual) to assertEqual(actual, expected) are the same subject and pass); if both are literals,
  the constant subject ''<literal>'' (accepted coder deviation, see notes). A comparison passed to assertTrue(...)
  is classified as if it stood in an assert statement (review M-4: assertTrue(x == 1) is a strict == on x, so
  assertTrue(x == 1) becoming assertTrue(x) is comparison loosened on x, and assertEqual(x, 1) becoming
  assertTrue(x == 1) passes). Keyword-argument forms of unittest assertions (first=, second=, expr=, member=,
  container=, obj=, cls=, and mixed positional + keyword) carry the same facts as the positional form (second
  review: assertEqual(a, 1) to assertEqual(first=a, second=1) passes; assertEqual(first=a, second=1) to
  assertGreaterEqual(first=a, second=1) is comparison loosened). For the mock
  methods the subject is the receiver (m in m.assert_called_with). Stop when, for some subject, the working tree
  has fewer strict comparisons on that subject than the base (multiset per subject). A strict-to-strict change on
  the same subject (== to assertEqual, is None to == None) passes; a renamed subject stops (accepted strictness,
  like merged asserts).'
- 'Rule (b) detail: one fragment per lost strict comparison, in base source order, joined by '', ''. The fragment
  is ''<base form> became <now form>'' when the working tree asserts the same subject in a non-strict form (subject found by the same
  rule; the first such form in source order: the operator symbol for a comparison, the method name for a call), and ''<base form>
  removed'' when the subject is now asserted only by truthiness or not at all. Base and now forms are rendered
  as operator symbols (==, is, >=, in) or method names (assertEqual). Pinned examples: G ''== became >='', H ''is
  became in'', K ''== removed''.'
- 'Rule (c) TOLERANCE WIDENED. Collect pytest.approx calls (also bare approx) in each side in source order. Pair
  each base call with the first unpaired working-tree call whose expected argument (first positional or expected=)
  has the same ast.unparse; unpaired calls are not judged (an approx removed is caught by (a) or (b) if it weakens).
  For each pair and each of rel and abs (keyword, or positional 2nd and 3rd argument): the value is the numeric
  literal given (int or float constant, ast.literal_eval), else the pytest default (rel 1e-6, abs 1e-12). Stop when
  the working-tree value exceeds the base value for either key. A tolerance that is a numeric literal (or default)
  at the base and an expression that is not a numeric literal now is unverifiable and stops as widened, the detail
  naming the expression''s source (review M-5: rel=0.01 to rel=TOL gives ''rel 0.01 to TOL''). A tolerance that
  is not a numeric literal at the base makes that key unjudged for that pair (left to pr-reviewer); the same
  expression on both sides passes. detail ''<key> <base> to <now>''
  with the source spelling of literals and ''default'' for a default (I: ''rel 0.01 to 0.1''; added rel=0.01 where
  the base had none: ''rel default to 0.01''); several widened keys or pairs joined by '', ''.'
- 'Outcome against the criteria: F fewer assertions 3 to 2; G == became >=; H is became in; K == removed; I rel 0.01
  to 0.1; L fewer assertions 1 to 0; J passes (count 1 to 2, the strict == on header is kept). The swap case (base
  assert a == 1 and assert b >= 2, now assert a >= 1 and assert b == 2) stops with == became >= on a, which a per-test
  operator count or multiset would miss. A loose assertion inserted before a strict one passes, which per-position
  matching would wrongly stop.'
- 'Rule (d) ASSERTION NOW CONDITIONAL OR CUT OFF (user decision 2026-10-22/23). Same check step (_cs_asserts, called
  once from consumer_sweep.py check), same scope as (a)-(c), items in loosened. Assertions are exactly those rule
  (a) counts (assert statements and assertion calls). MATCHING: per test, each side''s assertions in source order
  keyed by normalised text (ast.unparse of the assert statement or of the assertion call). Occurrences of the same
  text are paired first by identical (guards, exits) signature - the kinds of its enclosing guards and of the exits
  before it - and the remainder k-th base to k-th working-tree occurrence in source order (second review: reordering
  identical assertions that carry different guards is not loosening). A text occurrence present only in the
  working tree is new and is not judged; one present only at the base is left to (a)/(b). GUARD: an enclosing
  construct between the test function and the assertion that can skip it: if/elif/else (if), while (while),
  for and async for (for, a loop can run zero times), match/case (match), any part of a try or try* statement -
  body, except, else, finally (try, so try: ... except AssertionError: pass and except Exception: pass are covered),
  and a def / async def (function), lambda (lambda) or class (class) nested in the test. A with / async with block
  is NOT a guard. (d1) A pair whose base occurrence has no guard and whose working-tree occurrence has at least
  one stops: what ''assertion now conditional'', detail ''under <if|while|for|match|try|function|lambda|class>''
  naming the nearest guard; several affected assertions in one test give one item whose detail joins their distinct
  ''under <kind>'' fragments in source order with '', ''. (d2) An EXIT is a return statement, a call pytest.skip(...)
  or pytest.xfail(...), a call self.skipTest(...) (unittest''s skip call, orchestrator decision 2026-10-23: same class
  as pytest.skip), or raise SkipTest / raise unittest.SkipTest (with or without arguments) that comes before
  the assertion in the test body at the same or an enclosing block level: a preceding sibling statement of the
  assertion or of any of its enclosing blocks that is, or contains, the exit; an exit inside a nested def / lambda
  / class that does not also contain the assertion does not count. A pair whose base occurrence has no exit before
  it and whose working-tree occurrence has at least one stops, kind taken from the first exit before it in source
  order: what ''assertion after an early return'' (return), ''assertion after an early skip'' (pytest.skip, self.skipTest,
  raise SkipTest, raise unittest.SkipTest) or ''assertion after an early xfail'' (pytest.xfail); detail names the exit
  as ''return'', ''pytest.skip(...)'', ''self.skipTest(...)'', ''pytest.xfail(...)'', ''raise SkipTest'' or ''raise
  unittest.SkipTest'' (call arguments are not part of the detail),
  distinct exits of the same kind joined by '', ''. At most one item per (file, test, what); (d1) and (d2) can
  both fire for one test. Rule order after (c): assertion now conditional, assertion after an early return, ...
  early skip, ... early xfail. Pinned outcome: M ''assertion now conditional'' / ''under if''; N one item
  ''assertion after an early return'' / ''return'' (both cut-off assertions in one item); P not judged (its base
  occurrence is already guarded by if, and no exit is added); Q not reported (assert attempts == 3 still pairs
  unguarded; the added if log.called: assert log.call_count == 1 is a new text, not judged). Static, deterministic,
  no run: the same base and working tree give byte-identical items.'
- 'Listing never exempts and is never read here: a strengthened, unaffected or missing entry gives the same loosened
  items, and an unlisted test is reported under both unlisted (-i) and loosened.'
- 'Fail closed through -i''s rules: an unresolvable base ref or an unparseable file is -i''s inconclusive; an internal
  error in this step still prints the full check shape with passed false and the error named, never a pass. Progress
  logging to stderr only.'
- 'Performance: the step must finish in under 2 seconds for 50 changed test files of 500 lines each on a developer
  machine (it parses each side once; it reuses -i''s parsed nodes rather than re-reading git).'
- 'File size (count_content_lines, scripts/commit_guardian/_file_size_ratchet.py) and complexity (check_complexity.py
  limits per function): _cs_asserts.py at or under 400 counted lines; consumer_sweep.py gains only the call and the
  merge into the output and stays at or under 400. Do not touch _cs_edits.py beyond exposing the per-test split
  -i already computes, _cs_runs.py, wrong_version_gate.py (finish already carries the check JSON verbatim), done_proof.py,
  check_contract_shrinking.py or any route JS.'
- 'Deploy and registry: build_build_orchestration_scripts copies every .py under scripts/build_orchestration/,
  so _cs_asserts.py deploys without a deploy-map entry. No new agent, skill, hook or registry entry, so package_surface
  is false.'
test_required: true
test_spec:
- name: test_fewer_assertions_reported_with_counts
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Base and working-tree sources of F and L passed to _cs_asserts: F gives fewer assertions "3 to 2"
    and L, whose pytest.raises block became a plain call, gives fewer assertions "1 to 0". self.assertRaises and
    mock assert_called_once removed from other tests count the same way.'
  must_catch:
  - only assert statements counted, so a removed pytest.raises or self.assert* call is missed
  - count compared per file, so an assertion added in one test hides one removed in another
  in_scope_files:
  - scripts/build_orchestration/_cs_asserts.py
- name: test_strict_comparison_loosened_reported_with_operators
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: criterion
  description: G, H and K give comparison loosened with details "== became >=", "is became in" and "== removed";
    assertEqual becoming assertGreaterEqual and assertIsNone becoming assertIn on the same subject are reported
    the same way.
  must_catch:
  - bare truthiness replacing == not seen as loosening because the assertion count is unchanged
  - only assert statements classified, unittest strict methods ignored
  - detail omits the base or the new operator
  in_scope_files:
  - scripts/build_orchestration/_cs_asserts.py
- name: test_operator_swap_with_equal_counts_is_caught
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: boundary
  description: Base assert a == 1 and assert b >= 2, now assert a >= 1 and assert b == 2. The check reports comparison
    loosened "== became >=" for the test, although count and operator multiset are equal.
  must_catch:
  - strict comparisons compared as a per-test count or operator multiset instead of per subject
  in_scope_files:
  - scripts/build_orchestration/_cs_asserts.py
- name: test_approx_tolerance_widened
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: criterion
  description: I gives tolerance widened "rel 0.01 to 0.1". rel=0.01 added where the base had none gives "rel default
    to 0.01"; abs narrowed passes; an approx inserted before the original one does not mis-pair; a tolerance given
    as the same name on both sides is not judged and does not stop.
  must_catch:
  - approx calls paired by position, so an inserted approx mis-pairs
  - pytest default ignored when the base gave no rel or abs
  - non-literal tolerance crashes the check or is read as widened
  in_scope_files:
  - scripts/build_orchestration/_cs_asserts.py
- name: test_added_assertion_beside_strict_one_passes
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Controls: J (the strict == kept, "5" in header added), a loose assertion inserted before a strict
    one, assert x == pytest.approx(1.0) becoming assert x == 1.0, == becoming assertEqual on the same subject, and
    a Class::method with an assertion added all give no loosened item.'
  must_catch:
  - any changed test reported as loosened
  - assertions matched by position, so an inserted assertion shifts the strict one
  - pytest.approx counted as an assertion, so replacing it by an exact == reads as fewer assertions
  in_scope_files:
  - scripts/build_orchestration/_cs_asserts.py
- name: test_assertion_moved_under_condition_reported
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: criterion
  description: 'M: assert header == "Retry-After: 5" moved under if header: gives assertion now conditional "under if".'
  must_catch:
  - assertion moved under a condition not reported
  - detail does not name the guard
  in_scope_files:
  - scripts/build_orchestration/_cs_asserts.py
  - scripts/build_orchestration/_cs_guards.py
- name: test_assertion_moved_under_every_guard_kind_names_it
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: unit
  angle: criterion
  description: 'An unconditional assertion moved under if/elif/else, while, for, async for, match/case, any part of try (body, except, else, finally; except AssertionError: pass and except Exception: pass), a nested def or async def, a lambda or a nested class gives one item "under <if|while|for|match|try|function|lambda|class>".'
  must_catch:
  - only if guards recognised, so while, for, match, try, nested def, lambda or class pass unnoticed
  - 'swallowed failure (except AssertionError: pass) treated as safe'
  in_scope_files:
