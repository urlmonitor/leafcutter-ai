criteria: |
  Only a refusal that asks for a craft brings one in — nothing else changes.

  Work that is accepted, and work that is turned away for something its author
  can put right there and then, is untouched. Nobody is brought in who was not
  asked for, so the ordinary path costs no more time and no more money than it
  does now.
