criteria: |
  One description of how the next piece of work is chosen — and it is true.

  Anyone who wants to know what the build system will pick up next can read a single
  account of it and rely on what they read. The older accounts that disagree with how
  the system actually behaves are corrected rather than left standing, so a reader is
  never quietly misled by a requirement that was true once and is not true now.
