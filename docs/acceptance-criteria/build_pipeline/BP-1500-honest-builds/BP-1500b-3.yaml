notes: |
  THIS AC IS THE HALF THE PARENT'S 2026-09-07 AMENDMENT ADDED, AND IT IS THE ONE
  THAT CANNOT BE DROPPED. The pre-existing L1 clause only required a SURVIVING
  orphan to be named. The current implementation never has a survivor to name,
  so it satisfied that clause perfectly while changing nothing. Any decomposition
  that constrains only the found-something path leaves the defect exactly where
  it is. That is why the clean path gets its own AC rather than an And-clause on
  BP-1500b-1.

  THE FALSIFIABILITY TEST TO APPLY TO ANY PROPOSED IMPLEMENTATION: take the
  build as it stands today, which prints a clean result over eleven unrelated
  historical paths. Does the proposal's test go RED against it? If the test can
  pass against today's code, the AC has been written too weakly and this file is
  wrong, not the code.

  WHY COUNTS AND NOT PROSE. "Examined the installed tree" is unfalsifiable -- it
  is true of a run that walked four hundred files and of one that walked none.
  Two integers, each reproducible by hand from the stated scope, are what turn
  the all-clear into something a reader can check in under a minute. The
  reproduce-by-hand clause is deliberate: it is the check the reporter actually
  performed to find the live orphan, having distrusted the printed line.

  ORDERING. This depends on BP-1500b-2 rather than only on the parent because
  the compared-against count is meaningless until the comparison set is derived
  from current sources. Reporting the size of a hardcoded list of eleven paths
  would satisfy the letter of the count clauses and none of their purpose.
