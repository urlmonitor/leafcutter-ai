title: "Parking a tree never adds work to the buildable queue, and un-parking alone does not either"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200d.yaml
criteria: |
  Given the real store, over which the buildable-work scan returns a baseline
    ready set that contains no KM-200 record — 436 ready records when measured
    on 2026-08-14,
  When the parked marker and a reason are added to KM-200.yaml and the scan is
    executed again as a process over the same store,
  Then the ready set it returns is identical to the baseline, record for record,
    so marking a tree parked adds nothing to the queue and removes nothing from
    it,
  And when KM-200 is un-parked per ACS-1200d-1 while no record below the feature
    level has been authored under it, the scan still returns no KM-200 record,
  And once a record at level L2 exists under KM-200 and reaches readiness
    approved, that record — and only that record — appears in the ready set,
  And each of the three states is measured by executing the scan and comparing
    the returned sets, not by inspecting its source.
