    - "NOT-YET-DETERMINED MUST BE UNAMBIGUOUS ON ITS OWN. A consumer must be able to recognise it without knowing the epic's work-store folder to compare against. The defect was harmless in the observed run only because a later step happened to overwrite the value; a consumer that reads it first has no way to notice."
    - "ABSENT IS NOT A LOCATION. Whatever represents not-yet-determined must not be a path-shaped value that any consumer could join, open, or run a command in. This is the fail-closed clause: the wrong value here sends agents to commit in the shared clone."
    - "TEST THE HAND-OFF, NOT ONLY THE RESOLVER. Assert that after the step which establishes the working copy, the resolved target carries it -- otherwise a fix that always reports undetermined would pass the negative case and break every drive."
