id: BO-570
components:
  - build_orchestration
title: "Render and lint defects are caught locally at sign-off, before the PR or CI"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Local pre-PR verification gates catch the defect classes that only surface at run time.

  When an agent signs off on a change, the build system runs the same checks that
  CI would run -- a real render of any changed user-facing surface and the
  repository's own lint over any changed code -- right there at sign-off. A
  render-time-only failure or a lint violation is surfaced and blocks the sign-off
  locally, so it never escapes to the pull request or to CI for the first time.
