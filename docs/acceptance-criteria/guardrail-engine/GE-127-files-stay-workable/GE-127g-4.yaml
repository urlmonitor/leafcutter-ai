id: GE-127g-4
title: "An author can find out before committing whether their document is judged for length, and on what stated ground it would not be"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the project's published description of the document-length standard,
  When an author who is about to add a new document reads it,
  Then it states that some document locations are not judged for length, lists
    each such declared location, and gives for each the stated ground on which it
    is not judged,
  And it states the ground as the property that earns the exemption — that the
    documents there are regenerated whole and have no human author — rather than
    as the name of the generator that writes them, so an author can tell whether
    a location they are about to create would qualify,
  And it states what a run reports for a document that is not judged, so an
    author who sees that report knows the document was set aside rather than
    found to be within its permitted length,
  And it states that an author adding a document to an already-declared location
    need not change the declaration.

  And given a location the description has stated is not judged for length,
  When the same author reads on to ask how large a document there may become,
  Then the description states that a bound nonetheless applies to that location —
    the size beyond which a document there is reported — so a reader does not
    leave the text believing documents there may grow without limit,
  And it states what happens when a document stands above that size: that it is
    reported and the commit still completes, so a reader does not expect to be
    refused for a length they did not write,
  And it states that declaring a location set aside requires declaring that size
    as well as its stated ground, so a reader about to add a declaration knows
    the bound is mandatory rather than optional.

  And given an author whose new document sits in no declared location,
  When they read the same description,
  Then it states that their document is judged, and states the limit that
    applies to it, without their having to read any program to find out.
