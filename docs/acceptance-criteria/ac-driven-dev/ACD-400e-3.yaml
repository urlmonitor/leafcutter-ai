notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400e.

  WHY "ONE TRUE ACCOUNT" NEEDS THIS AC AND IS NOT FINISHED WITHOUT IT. ACD-400e-1 makes
  the account true. ACD-400e-2 makes the older records true. Neither keeps anything true.
  The divergence this whole tree exists to repair was not created by anyone writing
  something false: ACD-400a-1 was accurate when it was authored, and became false when the
  urgency key was added to the queue and nothing re-checked the sentence. A repair that
  does not close that loop buys one accurate day and then decays the same way, and the
  next person to find it will have the same evidence and the same argument.

  THE BOTH-DIRECTIONS REQUIREMENT IS THE LOAD-BEARING ONE. A check that only validates
  the prose against the code catches an edit to the account and misses the change that
  actually caused this incident, which came from the code side. The criteria name one
  concrete example from each side so that neither can be quietly omitted, and the second
  example is deliberately the real history — a further ordering key being added.

  THE READ-BY-ASKING CLAUSE. This repo has shipped checks that searched source text for a
  string and passed on dead code; a check on the agreement between prose and behaviour is
  an unusually inviting place to make that mistake, because both sides are text. The
  clause forbids it in both directions at once: the check must fail when the words are
  right and the behaviour is wrong, and must not be satisfiable by the words alone.

  THE FINAL CLAUSE EXISTS BECAUSE A NOISY CHECK IS DISABLED. A detector that reports a
  disagreement while the two agree gets switched off, and a switched-off detector is
  indistinguishable from the absence this AC is closing.

  SCOPE — THIS IS NOT A NEW GATE ON THE QUEUE. The subject is the agreement between the
  account and the behaviour. It says nothing about what the queue outputs, adds no
  requirement to any build, and does not touch the ACS-1100-shaped follow-up flagged in
  ACD-400c's notes.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2. The
  criteria deliberately do not say WHERE the check runs. Whether it is a test, a commit
  hook or something else is a surface decision, and freezing one into a behavioural
  requirement would make this AC pass or fail on a plumbing change rather than on whether
  drift is caught.
