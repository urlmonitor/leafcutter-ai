criteria: |
  Given an agent registry entry where skills_invoked contains
    skill_id "custom-project-skill"
  And "custom-project-skill" does not exist in templates/skills/
  But it does exist at .claude/skills/custom-project-skill/SKILL.md
  When the build validates the skills_invoked cross-reference
  Then validation passes without error for "custom-project-skill"
  And the resolution order is:
    1. templates/skills/{skill_id}/SKILL.md (package-level)
    2. .claude/skills/{skill_id}/SKILL.md (project-local)
  And only if neither path resolves does the build emit an error
