assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  - agent: python-coder
    ac_id: TQ-500f-3-ii
    contract: 'CLI: python scripts/build_orchestration/fast_lane.py verify_red_baseline --ac-ids
      <comma-separated ids> --test-root <worktree> [--base-ref <ref>] [AC-store-root option
      if added]. Prints JSON {gate_passed: bool, reason: str|null, red: [...], green_at_baseline:
      [...], inconclusive: [...], preexisting: [...], plus an additive list of refused entries
      each {nodeid: str, ac_id: str, kind: ''absence'', message: str}}; exit 0 iff gate_passed.'
expects_from:
  - ac_id: TQ-500f-3
    contract: "The kind of red (absence or assertion) is distinguishable per test."
  - ac_id: TQ-500f-2
    contract: "must_catch present on the test's requirement entry is the declared signal that the test guards against a named wrong version."
it_requirements:
  - 'Extend the one existing reader: verify_red_baseline in scripts/build_orchestration/fast_lane.py
    with its private helpers in _fl_red_baseline_support.py. No second reader, and no copy of
    this rule in a workflow script or a prompt.'
  - 'The kind of red must be derived per test from the run''s own output. Absence: the failure
    is an import, name or attribute lookup error for the named thing, raised before any code
    under test ran, including a collection-time import failure of the test module. Assertion:
    any other failure after the code under test ran. The writer''s self-reported kind is never
    an input.'
  - 'The declared signal is read from the covering AC''s test_spec entry matched to the test
    by name: must_catch present (non-empty) OR angle == ''discrimination''. The AC''s criteria,
    title and notes must never be read for this decision.'
  - 'Gate verdict (user decision, fail closed): if ANY declared test (must_catch or angle: discrimination)
    is refused as absence-only red, gate_passed is false with a distinct, stable reason value
    naming the refusal. This holds however many sibling tests are properly red. The refused
    entries are listed in the report.'
  - The reader needs the AC store to read test_spec. Tickets copy test_spec verbatim and the
    fast lane has no ticket, so the AC record is the one source both lanes share. The AC store
    root must be an input whose default resolves to the project's configured AC store. The verify_red_baseline
    invocation in templates/workflows-js/fast-lane-ship.js must keep working unchanged, or be
    updated in the same change.
  - 'The pytest-output parsing stays shared with done_proof (reuse, not a fork). If capturing
    the failure kind needs richer pytest output, extend the shared parser additively so that
    done_proof''s {nodeid: outcome} contract and its verdicts are unchanged, and the gate still
    makes a single pytest run.'
  - 'Backward-compatible report: existing keys (gate_passed, reason, red, green_at_baseline,
    inconclusive, preexisting) keep their meaning. A refused test is reported with its nodeid,
    AC id, the observed kind ''absence'', and a message saying that a test naming wrong versions
    to catch must fail by reaching the code.'
  - 'Fail closed: a declared test whose kind of red cannot be determined is not accepted as
    red evidence.'
  - 'Stays idempotent and read-only (BO-2400a-3-viii): read-only git queries, no writes to the
    AC store.'
test_spec:
  - name: test_red_baseline_refuses_absence_only_red_for_must_catch_test
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: T1 (must_catch declared, fails only with ImportError for refresh_config_v2)
      is refused as red evidence, and the report names T1, the absence kind and the reach-the-code
      message.
  - name: test_red_baseline_accepts_assertion_red_and_undeclared_absence_red
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: T2 (declared, AssertionError) and T3 (undeclared, ImportError for summarise_window)
      are both accepted as red evidence, the controls against a reader that refuses every import-error
      red.
  - name: test_discrimination_angle_without_must_catch_is_treated_as_declared
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: failure
    description: 'An entry with angle: discrimination and no must_catch whose only red is absence
      is refused exactly as T1 is.'
  - name: test_verify_red_baseline_cli_refuses_absence_only_red_end_to_end
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: python scripts/build_orchestration/fast_lane.py verify_red_baseline (the
      CLI both lanes invoke)
    description: In a temp git repo with real T1/T2/T3 test files and a temp AC store, the CLI
      subprocess runs real pytest and its JSON names T1 as refused. Adding 'bug fix of existing
      refresh' wording to T3's AC criteria does not change the verdict (the decision never reads
      requirement wording).
  - name: test_red_baseline_gate_fails_when_any_declared_test_is_absence_only
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: With T1+T2+T3 together, gate_passed is false with the refusal reason and T1
      listed as refused, even though T2 and T3 are properly red (fail closed, must_block).
  - name: test_red_baseline_gate_passes_for_assertion_and_undeclared_absence_only
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: 'Control: with only T2+T3 (no absence-only declared test), gate_passed is true
      and nothing is refused.'
test_rationale: 'This is a gate, so it needs known-bad input through the production CLI (must_block)
  and controls that stop an over-broad rule. Real pytest output in a real git worktree is
  required: the kind of red is read from what pytest actually prints, and a hand-typed outcome
  dict would hide exactly the parsing the rule depends on.'
