notes: |
  ENCODES the deferred opt-out mechanism decision (resolution #3): an INLINE,
  PER-ITEM, REASON-BEARING marker placed in the item's own docstring/entry so it
  lands in the diff and is visible in review — NOT a config allowlist and NOT a
  silent global disable. Rationale: stays in the diff (auditable + reviewable),
  scoped to one item (never global), requires a reason (can't be a rubber stamp).
  Second scenario proves scoping: opting out one item never suppresses another's
  block. Exact wire-format of the marker is left to the IT-PO; the BEHAVIOR (inline,
  per-item, reason-required, visible-in-diff, non-global) is pinned and testable. The
  abuse/missing-reason rejection is GE-117e-2-i.

  IT-PO ENRICHMENT NOTE (2026-07-02, user-confirmed): the concrete wire-format is the
  inline sentinel `AC-EXEMPT: <reason>` in the item's own docstring/entry. Pinned in
  it_requirements; the behavioral guarantees from the criteria text are unchanged.
