id: TQ-600a-13-v
components:
  - testing_quality
title: "A nightly that did not run to completion is reported as not run, never as green"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the flag is closed by a green night and raised by a red one,
  And the failure class this repository has documented repeatedly — a check that examined
    nothing reporting the same result as a check that found nothing — which here takes the
    form of a nightly that broke before it tested anything being read as a night with no
    failures,
  When the scheduled run ends in any of these ways: a setup step before the tests fails
    (for example installing dependencies), test collection errors, the population
    collected is empty, the run is cancelled, the run exceeds its time limit, or the
    run's test result cannot be read,
  Then the night is not green, and the flag lifecycle treats it as red: it raises the
    flag when none is open and comments on the open one otherwise,
  And the issue or comment states that the nightly did not complete, names the stage at
    which it stopped where that stage is known, and is worded differently from a test
    failure, so a reader can tell "the tests failed" from "the tests never ran",
  And no open flag is closed by such a run,
  And only a run that collected the whole population, executed it, and ended with every
    test passing — after the single retry of TQ-600a-13-ii — is green and may close the
    flag,
  And a run whose collected population is empty is never green, however its exit status
    reads,
  And each ending is demonstrated by producing it — a failing setup, a collection error,
    an empty selection, a cancellation, a timeout, an unreadable result — and observing
    the verdict and the flag write, never by inspecting the workflow's failure handling.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-ii
  - TQ-600a-13-iii
