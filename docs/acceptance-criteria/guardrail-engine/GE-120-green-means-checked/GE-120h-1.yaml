it_requirements:
  - "THE FOUR ADVERTISING PLACES ALL EXIST AND WERE READ ON 2026-09-14 — DO NOT WRITE THEIR NAMES INTO THE CODE. templates/scripts/commit_guardian/README.md (the severity-rated hook index), templates/scripts/commit_guardian/config.py (per-check settings blocks resolved through _get), templates/scripts/commit_guardian/commit_guardian.json (top-level per-check settings sections — 38 top-level keys, of which folder_density, sql_complexity and debug_scripts are populated for checks no entry runs), and templates/scripts/precommit-autofix.json (autofix routing, which names hook_id check-sql-complexity and none of the other four). The criterion requires the set of places AND the set of advertised names to be obtained at run time; the enumeration here is the measured starting state, not a list to hard-code."
  - "THE EXECUTING LIST IS hooks_manifest.hooks IN templates/scripts/commit_guardian/commit_guardian.json — 62 members measured 2026-09-14, and the ONLY container whose membership causes a check to run. A settings section elsewhere in that same file does not. A reconciliation that reads only one container of that document misses the disagreement inside it."
  - "DO NOT ADD A THIRD DISK CENSUS, AND KNOW WHICH TWO ALREADY EXIST. BP-1600a-2 owns disk-to-registry (every gate script present in the guardian directory that no entry names) and GE-120c-6 already forked it once inside this same L0, and was subordinated to BP-1600a-2 by user decision on 2026-09-07. This record's population is what the SURFACES CLAIM, not what the directory HOLDS. Concrete tripwire: if the implementation lists templates/scripts/commit_guardian/*.py to build its population, it is building GE-120c-6 again — the population must come from parsing the four advertising places."
  - "DO NOT ADD A THIRD MANIFEST READER EITHER. check_hook_parity.py and _hook_trigger_reachability_helpers.py already read hooks_manifest.hooks. Reuse one callable; two readers will disagree and the disagreement will be settled by whichever is quieter."
  - "THE COUNT MUST BE DERIVED, NEVER PINNED. No count of today's disagreements may appear in the code, in a test, in a docstring or in a default. The disk baseline moved 18 -> 16 -> 14 in a single day and the advertised population has never been measured at all. A pinned number fails for the wrong reason and gets edited to match rather than investigated."
  - "READING A SURFACE MUST NOT EXECUTE IT. config.py is Python and carries the settings blocks; extract its claims by static means (AST or an equivalent text pass), never by importing or running it. An import-based reader makes the reconciliation's result depend on config.py's import side-effects and turns an unreadable surface into a crash rather than the reported outcome GE-120h-1-i requires."
  - "LATENCY BUDGET. This runs at commit time, on every commit. A full reconciliation across the four places plus the manifest must complete in under 300 ms and must not spawn a subprocess per advertisement."
  - "THE REFUSAL NAMES THE CHECK, EVERY PLACE THAT ADVERTISES IT, AND THAT NOTHING RUNS IT — not a count and not a bare 'disagreement detected'. Per-place attribution is not cosmetic: GE-120h-1-i requires an unread place to be nameable in the output, which is impossible if the implementation discards which place a claim came from."
  - "MUST BE INVOKED AT COMMIT TIME, NOT ONLY IN THE TEST SUITE. CLAUDE.md's 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep' is binding: a reconciliation that only a pytest run invokes leaves the author unrefused, and the implementation becomes the next instance of the very defect it describes. See the package-surface caveat in the notes before attempting that commit."
  - "ADR-001 TEMPLATE/DEPLOYED PARITY. The canonical source is templates/scripts/commit_guardian/; build_commit_guardian() walks it with rglob and deploys to scripts/commit_guardian/ and config/commit_guardian/. Edit the template, run build.py, and verify from the deployed copy. This worktree currently holds no deployed copies at all, so any verification done before build.py proves nothing about the deployed path."
