id: BP-1300e-2-i
components:
  - precommit_hooks
  - commit_guardian
title: "The project's written Error Handling Policy states which lint rules are enforced at commit time, and where"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the repository's standing instructions contain an Error Handling Policy
    that today says its rules are "enforced mechanically at commit time by Ruff
    (rules E722, BLE001, TRY)",
  And the commit-time lint check from BP-1300e-1 applies E722 repo-wide and
    BLE001 and TRY to kernel/ only,
  When the documentation step for this feature runs,
  Then the policy text states which of those rules the commit-time check enforces
    and over which trees, matching the declared rule set,
  And it states that the policy's other rules are explained for understanding
    and are not all mechanically enforced everywhere,
  And it no longer states that BLE001 or TRY block a commit outside kernel/,
  And every rule-and-tree statement in that text can be checked against the
    declared rule set in one lookup.
depends_on:
  - BP-1300e-2
