notes: |
  Authored 2026-10-12. KM-400f-3 measures usage against the ceiling the backend reports and
  refuses when the snapshot will not fit. The figures in its own first scenario — 189,950 of
  200,000 nodes, 94.98 percent — were chosen because at that usage the refusal is clearly
  correct. The measurement that motivates this record is that both real latches happened
  BELOW those published limits, so a headroom check written against them would have reported
  a fit on both occasions.

  Measured, both instances:

  - instance destroyed 2026-10-08: latched read-only at 169,568 nodes and 251,326
    relationships, against published limits of 200,000 and 400,000 — 84.8 percent of the
    node limit and 62.8 percent of the relationship limit;
  - instance destroyed 2026-10-12: latched read-only at 189,950 nodes and 304,498
    relationships against the same published limits — 94.98 percent and 76.1 percent.

  Neither was at its published limit. The second is inside KM-400f-3's own refusal
  threshold of 90 percent and would have been refused; the FIRST is under both the 90
  percent refusal threshold and, on relationships, under the 75 percent warning threshold,
  so KM-400f-3 as specified would have let it publish with no warning at all. The real
  ceiling is therefore not derivable from the published limits, and a percentage of a
  published limit is not a safety property.

  This record does not invent a different ceiling, because none has been measured — two
  observations are not a threshold. It requires the report to say which figure it used, to
  state that the refusal point is undetermined, and to give the recorded observations as the
  reason. An operator who is told "150,000 of a published 200,000, and this backend has
  twice refused at 169,568" can act; one who is told "75 percent, within limits" cannot.

  Deliberately not specified here: refusing at a figure derived from the recorded
  observations. That would be a new threshold with two data points behind it, and the
  honest form today is a stated unknown rather than a guess dressed as a bound.
it_requirements: null
test_required: true
test_spec:
  - name: test_headroom_result_names_its_basis_and_states_the_refusal_point_is_undetermined
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: With published limits of 200,000 nodes and 400,000 relationships, two
      recorded refusals below them at the measured incident figures, and usage of 150,000
      nodes and 280,000 relationships, assert the result names the published limits as its
      basis, states the refusal point is undetermined, names both recorded refusal usages,
      and does not present the comparison as a determination that publication will be
      accepted.
    covers: [KM-400f-3-i]
    must_catch:
      - "report a percentage of the published limit as a headroom verdict with no statement of basis"
      - "report that the snapshot fits, which is the claim both latches falsified"
      - "name the published limits but omit the recorded refusals below them"
    requires_db: false
  - name: test_no_recorded_refusal_is_not_evidence_the_published_limit_is_the_real_one
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: With the same published limits and usage but no recorded refusal, assert the
      result says no refusal is recorded and still states the refusal point is undetermined,
      rather than treating the absence of an observation as confirmation of the published
      limit.
    covers: [KM-400f-3-i]
    must_catch:
      - "treat an empty refusal history as a determination that the published limit is the refusal point"
      - "omit the refusal-point statement entirely when there is no observation to cite"
    requires_db: false
  - name: test_unreported_published_limit_and_no_history_is_two_unknowns_not_a_pass
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: With a backend that refuses to report its published limits and no recorded
      refusal, assert the result names the measured usage, reports both the published limits
      and the refusal point as unknown, and is not counted as a satisfied headroom check.
    covers: [KM-400f-3-i]
    must_catch:
      - "count a result with no ceiling at all as a satisfied headroom check"
      - "substitute a built-in published limit and report a basis the backend never gave"
    requires_db: false
  - name: test_live_headroom_report_states_its_basis_against_a_real_backend
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Against a real database, assert the headroom result's measured usage equals
      the backend's own counts and that the reported basis names the backend's published
      limits as published limits, with the refusal point stated as undetermined.
    covers: [KM-400f-3-i]
    requires_db: true
test_rationale: >-
  KM-400f-3's existing tests use the second instance's figures, at which a published-limit
  comparison happens to give the right answer, so they cannot distinguish a report that knows
  its ceiling is a published limit from one that treats it as the refusal point. Both tests
  here are driven at usages BELOW the published limits — including the first instance's
  169,568 nodes and 251,326 relationships, which KM-400f-3 as specified would have let
  publish without even a warning — because a fixture pinned at 94.98 percent reproduces the
  one case where the wrong basis looks correct, which is the same fixture bias that aimed the
  retention evaluator at an empty population. The assertions are on what the report SAYS
  about its own basis rather than on the verdict, since the verdict is identical under the
  correct and the incorrect implementation at these usages and the basis statement is the
  only observable difference. The two-unknowns test is separate because its wrong version is
  a substituted built-in limit, which produces a confident report citing a figure the backend
  never supplied.
