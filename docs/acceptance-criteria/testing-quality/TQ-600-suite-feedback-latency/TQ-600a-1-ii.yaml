notes: |
  SHARING CONCENTRATES RISK AND THIS AC PRICES IT. Before the change, a broken
  deploy failed one test at a time with that test's own error attached. After it,
  one broken deploy can produce dozens of tests failing on missing files, with the
  real cause — the deploy's own error output — discarded. That turns a five-minute
  diagnosis into an afternoon, which is the same currency TQ-600 is trying to save.

  THE "NONE OF THEM PASSES" CLAUSE IS THE ONE THAT MATTERS MOST. A shared fixture
  that swallows its own failure and hands back an empty or half-written directory
  can leave a consuming test passing vacuously — it finds nothing to object to
  because there is nothing there. That is phantom-done via the fixture layer.

  THE RETRY CLAUSE IS NOT AN OPTIMISATION. A failed shared preparation that is
  retried per consumer costs 59.8s per waiting test and converts one fast failure
  into the slowest possible run, which is the failure mode this whole goal exists
  to remove.
