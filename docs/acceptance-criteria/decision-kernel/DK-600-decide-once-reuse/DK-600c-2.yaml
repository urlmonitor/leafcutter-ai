id: DK-600c-2
title: "The record holds the question, the choice, its evidence trail and its provenance"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a completed decision approved by human:user, with 4 options, 5 criteria, the ranking you
    were shown, 1 precedent considered (dec-ef8ddcb79d668a67, applicability 0.62, used as evidence)
    and its retrieved evidence,
  When the record builder builds the decision record,
  Then the record holds the question, the 4 options, the 5 criteria, the selected option, the
    ranking shown with each option's rank and required-criteria mean, and the precedent with its
    applicability and action,
  And each evidence entry holds a locator and a content hash, and no evidence entry holds evidence
    text,
  And the record's provenance holds the run id, the Langfuse trace id, the repository revision, and
    the template, model and kernel versions.
depends_on:
