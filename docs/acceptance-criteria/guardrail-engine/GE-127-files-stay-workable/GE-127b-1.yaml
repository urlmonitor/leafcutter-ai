id: GE-127b-1
title: "A change that leaves an already-oversized file longer than it was is refused; one that leaves it the same or shorter is allowed"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked file of a kind the size standard covers already stands above
    its permitted length before the change,
  And a change is staged that leaves that file one line longer than it stood
    before,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the outcome states both the length the
    file stood at before the change and the length it stands at after it,
  And given instead a change is staged that leaves that same already-oversized
    file shorter than it stood before, while still above its permitted length,
  When the author performs an ordinary commit,
  Then the commit completes, and the file is not refused for still standing
    above its permitted length,
  And given a change is staged that leaves the already-oversized file at exactly
    the length it stood before,
  When the author performs an ordinary commit,
  Then the commit completes,
  And given a file of a covered kind that did not exist before is added, at a
    length comfortably below its permitted length,
  When the author performs an ordinary commit,
  Then the commit completes — a file with no previous length is never treated as
    having previously stood at zero lines, which would refuse every file ever
    created.
depends_on:
  - GE-127b
