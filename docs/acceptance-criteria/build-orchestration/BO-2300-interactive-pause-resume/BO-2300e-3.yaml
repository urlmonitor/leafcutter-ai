notes: |
  This is the second, silent half of
  docs/known-issues/ac-driven-dev/open-blocker-ki-acd-20260928-pause-store-dispatched-to-worktree-agent.md:
  "peek-pause-record is dispatched the same way and refused the same way, but a
  refusal there is parsed as 'no paused record exists' -- indistinguishable from
  the legitimate no-record case. So the run sails past peek and only fails at
  persist. One defect, failing open on one path and closed on another; only the
  closed one is visible." Fixing the routing (BO-2300e-2) removes the most
  common trigger for a refusal here but does not fix the parser -- any future
  refusal, timeout, or malformed reply on this path must still never be read as
  "no record".

  This repo already names the general shape: CLAUDE.md's post-merge-diff-audit
  guidance states the same principle for a different check -- "A check that
  examined nothing must not look like a check that found nothing." This AC is
  that principle applied to the pause-store peek/read path: a check that could
  not look must not report what it would have found.
