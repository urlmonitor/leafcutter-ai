created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100i.yaml"
criteria: |
  Given the legacy template commit_guardian.json registers a hook:
    - id: "check-future-feature"
    - enabled: false
  And the canonical template commit_guardian.json does NOT contain
    an entry with id "check-future-feature"
  When the parity check runs at pre-commit time
  Then the commit is blocked with exit code 1
  And the error message names "check-future-feature" as a hook present
    in the legacy manifest (with enabled: false) but absent from the
    canonical manifest
  And the error makes clear that disabled hooks still require parity
    because build.py reads the canonical manifest regardless of enabled state
