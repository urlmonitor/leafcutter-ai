id: BO-1100a-6
title: "Path rules match only their intended directory subtree, not unrelated paths sharing a substring"
component: build-orchestration
level: L2
status: active
readiness: reviewed
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the routing config contains an entry for shipped ACs with a path pattern
    that targets the AC store directory (e.g. "config/ac_store"),
  And the following files are staged:
    - config/ac_store/component-x/AC-001.yaml
    - config/accounting/report.csv
    - config/access/policy.json
  When the commit agent classifies the staged files,
  Then config/ac_store/component-x/AC-001.yaml is assigned to the shipped-ACs group,
  And config/accounting/report.csv is NOT assigned to the shipped-ACs group,
  And config/access/policy.json is NOT assigned to the shipped-ACs group,
  And no path is matched by a substring that happens to appear inside a longer,
    unrelated directory name.

  Given the routing config contains an entry for tickets with a path pattern
    that targets the "tickets/" directory,
  And the following files are staged:
    - tickets/00_inbox/TICKET-100.md
    - archived/old-tickets/readme.md
    - vendor/some-lib/tickets-config/setup.py
  When the commit agent classifies the staged files,
  Then tickets/00_inbox/TICKET-100.md is assigned to the tickets group,
  And archived/old-tickets/readme.md is NOT assigned to the tickets group,
  And vendor/some-lib/tickets-config/setup.py is NOT assigned to the tickets group,
  And path matching is anchored so that only paths rooted at the intended
    directory are matched.
