id: TQ-100b-4-ii
components:
  - testing_quality
  - ac_store
title: "An id-shaped covers phrase inside a string literal or docstring is not a tag"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given a test file in the repository's unit-test tree that contains the text
    "# covers: ACS-999z-9" only inside a string literal or a docstring — as
    fixture input to a test of the tagging mechanism itself — where that value
    has valid acceptance-criterion id shape, resolves to no acceptance criterion
    in the store, and is carried by no test function in tag position,
  When the coverage-tag reader scans that tree,
  Then ACS-999z-9 yields no coverage-tag record and appears in neither the
    dangling-reference list nor the malformed-tag list
  And in that same run every genuine tag in tag position elsewhere in that same
    file is still read and recorded, so excluding literal occurrences does not
    cost the file its real tags
  And when the same text is moved out of the string literal into tag position
    above a test function and the reader is run again through the same entry
    point, ACS-999z-9 is then recorded as a tag and reported as a dangling
    reference — the outcome flips on position alone.
depends_on:
  - TQ-100b-4
