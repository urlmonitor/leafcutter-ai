title: "A record that declares no producer is a state you can ask the store about, not a silence you discover one ticket at a time"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store as it stands, in which 743 records declare no producer — 506
    of them by leaving the field out and 237 by setting it to null,
  When the store is asked which of its records declare no producer,
  Then it answers with all 743, and it treats the two spellings as one state:
    leaving the field out and setting it null both mean "no producer declared",
    and neither is reported as a different condition from the other.

  And given that answer,
  When the number it reports is compared with the number of records it looked
    at,
  Then the two are stated together, so a run that looked at nothing reports
    that rather than reporting no records without a producer.

  And given the same answer narrowed to the records that are actually
    buildable — the 93 of those 743 that sit at leaf level,
  When it is broken down by the kind of change each record declares,
  Then it separates the 4 that declare a prompt change and the 8 that declare a
    documentation change from the rest, because those 12 are the ones a
    code-producing default is certainly wrong for.

  And given any one of the 743 records,
  When a ticket is generated from it,
  Then the producer used is `python-coder`, exactly as it was before this
    change, and the generated ticket reports that the producer was defaulted
    rather than declared, so the default is visible on the artifact that acts
    on it.
