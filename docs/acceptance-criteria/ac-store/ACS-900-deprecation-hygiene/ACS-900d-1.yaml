notes: |
  Happy-path AC covering two of the legitimate-pass cases from ACS-900d notes:
  implementing file deleted in the same commit, and implemented_by emptied. The
  re-point-to-successor case is ACS-900d-2; the empty-list-at-retirement case is
  ACS-900d-1-i.

  IT-PO enrichment (2026-06-22): re-stated the staged-tree dependency (same-commit
  deletion must read as absent) so the no-false-positive guarantee is mechanically
  achievable, and pinned the silent-pass (clean stdout, exit 0) contract.
