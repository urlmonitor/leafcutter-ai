id: ACD-2100d-5-ii
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "A run started without what the workflow needs stops before any authoring and names only a remedy that exists"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the installed workflow is started directly with the request text and no other argument
    -- no maker's answer and no startup verdict --
  When the run reaches its checks before triage,
  Then it stops before any authoring agent is dispatched and before any workspace or branch is
    made,
  And its report names each argument that was missing,
  And every step, command or argument the report tells the operator to run or supply is one
    the installed /plan-feature command or skill contains at that moment, or a script present
    in the installed copy at the path the report gives,
  And the report does not name a skill step or section that the installed skill does not
    contain,
  And the report does not say that a permission was denied or that the agent registry is
    misconfigured,
  And when the operator does what the report says, and only that, and starts the run again, it
    reaches triage,
  And the bug symptom (KI-ACD-20261022: the halt says "the plan-feature skill's pre-flight
    (scripts/worktree/check_workspace_setup_permission.py) must run BEFORE this workflow is
    invoked", but the skill replaced that pre-flight on 2026-10-10, so the operator cannot fix
    the run from the docs) must not occur.
depends_on: [ACD-2100d-5]
