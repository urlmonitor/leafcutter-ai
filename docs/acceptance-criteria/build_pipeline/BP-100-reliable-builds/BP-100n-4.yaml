assigned_agent: python-coder
estimated_complexity: M
package_surface: true
declares_side_effect: false
it_requirements:
  config_schema_fragment:
    hooks_manifest:
      type: object
      description: >-
        hooks_manifest.hooks gains one entry per script that day-one triage classifies as
        a real gate. (This field previously said "beginning with check-ticket-signoff-parity";
        that entry now exists — BP-1100g-5-i added it at 406375c88 — so it is asserted rather
        than added, and the remaining additions come from the check's own first run.) Prefer
        an id already documented for the script over minting a new one; minting is the
        expensive path per the known issue. Each added entry carries the same fields its
        siblings carry (id, name,
        entry, language, pass_filenames, and either always_run or a files trigger). This
        is the surface the build reads to decide which gates a consumer project receives,
        so every addition here is a package-surface registration.
  reference_file_path: "templates/scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - >-
      HOST AND LAYERING — MEASURED IN THIS WORKTREE, NOT GUESSED. Under check_file_size's
      own counting rule (docstrings stripped, "#" DECISION HISTORY lines counted),
      check_hook_trigger_reachability.py stands at 354 of its 400 permitted lines and
      _hook_trigger_reachability_helpers.py at 145. The guard has roughly 46 lines of
      headroom and this change's own DECISION HISTORY entry will consume much of it. Put
      the disk-side enumeration, the register resolution and the assembly of the summary
      counts in the helpers module; leave the guard only the call sites and the printed
      summary. If the guard still exceeds the cap, split a further sibling INSIDE
      templates/scripts/commit_guardian/ — never outside it.
    - >-
      DEPLOY-MANIFEST BOUNDARY. build_commit_guardian copies EVERY file in
      templates/scripts/commit_guardian/ verbatim, so a new sibling inside that directory
      needs no deploy entry. A module imported from OUTSIDE that directory — anything
      under scripts/ac_store/, scripts/build_helpers.py, or elsewhere — MUST be added to
      the deploy map in scripts/build_phases.py in the same change, or the deployed hook
      raises ModuleNotFoundError at commit time while the unit tests, which import from
      the source tree, stay green. The deployed-layout test descriptor exists to make that
      failure visible rather than latent.
    - >-
      CANONICAL VERSUS BUILD OUTPUT. templates/scripts/commit_guardian/ is canonical;
      scripts/commit_guardian/ is a build output that build.py overwrites. Edit the
      template and re-run build.py. A fix applied only to the build output disappears on
      the next build; a fix applied only to the template leaves the running hook unchanged
      and the work unverified.
    - >-
      EXTEND THE ENUMERATION, DO NOT FORK THE GUARD. The gap is in the enumeration, not
      the predicate: BP-100k-4's per-gate predicate is sound and is not being changed. Its
      input is hooks_manifest.hooks, so a script that was never registered is not in the
      set it walks. Widen that population; do not build a second reachability guard beside
      it, or the two will disagree about how many gates exist.
    - >-
      BOTH SIDES ENUMERATED AT RUN TIME. The disk side by listing the gate-script
      directory; the invoking side by reading the entry lines of the registry actually in
      effect at commit time. Neither side may be a set written into the check. An
      implementation that compares one literal list against another reproduces this exact
      defect one level up, which is how the incumbent guard fails.
    - >-
      THE DISK LISTING IS RECURSIVE AND IDENTITY IS THE PATH, NOT THE FILENAME. DECIDED
      EXPLICITLY BECAUSE THE PRIOR criteria DECIDED IT BY ACCIDENT. Measured at b846121c9:
      templates/scripts/commit_guardian/ holds 67 check_*.py directly and 5 more in its
      hooks/ subdirectory — check_ac_done_on_merge.py, check_ac_limits.py,
      check_agent_spawn_consistency.py, check_agent_verification_consistency.py and
      check_files_touched_reconciliation.py. Three of those five are registered and genuinely
      run (spawn-consistency, verification-consistency, and files-touched-reconciliation under
      the id check-predone-scope). A non-recursive listing therefore drops five gate scripts
      from the population, three of them live, and hides check_ac_done_on_merge.py, which no
      entry names — the exact class this AC exists to find. List recursively.
      IDENTITY MUST BE THE PATH BENEATH THE GATE DIRECTORY, for a reason recursion creates:
      check_ac_limits.py exists BOTH at the top level and in hooks/, and only the top-level
      one is on an entry line (under the id check-ac-tree-limits). Under bare-filename
      identity, hooks/check_ac_limits.py is silently covered by its namesake's registration
      and reported as invoked when nothing invokes it — a false negative in the one direction
      this check exists to close. Note also that the existing entry lines already carry the
      hooks/ path segment, so the invoking side can be read path-relative without inventing
      anything.
      WHAT THE COUNTING RULE COSTS, SO IT IS NOT RE-LITIGATED BY SURPRISE: recursion plus path
      identity is the widest of the plausible rules and produces the largest day-one triage
      set. That is the point. A narrower rule buys a smaller first commit by leaving gates
      unexamined, which is the trade this AC was written to refuse.
    - >-
      THE INVOKING SIDE IS THE ENTRY LINE, NEVER THE ID. check_ac_limits.py is registered
      and runs under the id check-ac-tree-limits, so a kebab-cased-filename-to-id
      comparison falsely reports it as unregistered. Take from each entry field the LAST
      TOKEN THAT ENDS IN .py.
      CORRECTION, MEASURED AT b846121c9 — THIS INSTRUCTION PREVIOUSLY SAID "exactly the
      extraction build_precommit._check_hook_script_integrity already performs", AND THAT IS
      A DIFFERENT AND BROKEN RULE. That function takes the last WHITESPACE-delimited token,
      which is not the last .py token whenever an entry carries arguments after its script.
      Three entries do: check-done-proof ends "check_done_proof.py --test-root .",
      check-product-truth-validate ends "validate_product_truth.py --quiet", and
      check-product-truth-generate ends "generate_product_truth.py --check --quiet". Under
      the whitespace rule all three resolve to a flag rather than a script, so
      check_done_proof.py — a registered, invoked, required gate — is reported as invoked by
      nothing. Copying that extraction reproduces the false positive and inflates the
      unreferenced population by one. The two directions should still read the registry the
      same way, so FIX _check_hook_script_integrity to the last-.py-token rule in the same
      change rather than matching this check to its defect; that function is silently
      skipping the same three entries today, which is why the flag case was never noticed.
    - >-
      THREE STATES, NEVER TWO. Registered-and-enabled is silent; registered with
      enabled:false is reported as deliberately switched off and does not fail;
      absent from the registry is reported and fails. The five enabled:false ids are
      check-mermaid-drift, check-diagram-naming, check-duplicate-code, check-diff-coverage
      and check-surface-components-e2 — stable across every measurement so far, and named
      here because the switched-off arm's mutation descriptor names them individually.
      DO NOT TAKE ANY POPULATION SIZE FROM THIS FIELD OR FROM criteria. The sizes are stated
      once, in notes, with the date, the commit and the counting rule that produced them, and
      they have already gone stale twice. Re-measure before triage.
    - >-
      DAY-ONE TRIAGE OF THE WHOLE UNREFERENCED SET IS IN SCOPE, NOT A FOLLOW-UP. The check
      fails on the very commit that lands it. EVERY script it reports as invoked by nothing —
      whatever that set turns out to be on the day, which is not the set any number in this
      record describes — must be registered, deleted, or given a grounded record in the
      declared-non-gate register (BP-100n-4-i) in that same change. Take the set from the
      check's own first run, never from a count written here. Landing the check green by
      pre-suppressing its findings proves nothing. A register ground that says only that
      triage or registration is deferred is a suppression under another name, not a ground.
    - >-
      TEN OF THE UNREFERENCED SCRIPTS ALREADY CARRY A CONFIGURATION SECTION, WHICH IS
      EVIDENCE OF INTENT. Re-verified at b846121c9: commit_guardian.json holds a dedicated
      top-level config section for check_complexity, check_debug_scripts, check_doc_coverage,
      check_doc_links, check_docstrings, check_documentation, check_file_size,
      check_folder_density, check_root_files and check_sql_complexity, and all ten are still
      named by no entry line. A script the registry configures but never invokes is a gate
      someone wired half-way; "declared non-gate" is an implausible disposition for these ten
      and, if chosen, needs a ground that explains the configuration section rather than
      ignoring it. These ten are named individually rather than counted, so this constraint
      stays checkable as the surrounding population moves.
    - >-
      check-ticket-signoff-parity IS ALREADY REGISTERED — ASSERT IT, DO NOT ADD IT. THIS
      CONSTRAINT SAID THE OPPOSITE UNTIL 2026-09-01 AND WAS THE AC'S NAMED EXEMPLAR OF A
      DOCUMENTED-BUT-UNREACHED GATE. Verified at b846121c9: BP-1100g-5-i (commit 406375c88,
      PR #660) added the hooks_manifest entry under exactly the documented id, enabled, and
      check_ticket_signoff_parity.py is now on an emitted entry line. The delivers_to
      contract to TQ-500b-1 already anticipated this — "whichever AC is scheduled first owns
      the addition" — and BP-1100g-5-i was first, so the correct action here is to find the
      entry present and assert it, never to re-add it. A RESIDUAL AND NARROWER DEFECT
      SURVIVES, and it is not this AC's to fix: the entry carries no --enforce flag, while
      README.md line 46 still states "current config uses --enforce". The script is reached;
      the documented enforcement level is not what runs. Do not silently correct that here —
      it is a documentation-versus-config discrepancy about one gate, not a member of this
      AC's reached-versus-unreached census, and folding it in would put a second question
      inside the criterion.
    - >-
      check_file_size.py IS THE ONE SCRIPT WHOSE REGISTRATION BLOCKS THE COMMIT THAT
      REGISTERS IT — SEQUENCE IT BEHIND GE-127b. Measured at b846121c9 under the hook's own
      docstring-stripping counting rule: scripts/build_phases.py stands at 2603 counted lines
      (3873 raw) against a 400-line cap, and this AC's own implementation edits that file for
      the deploy map. Registering check_file_size.py flat therefore refuses the very commit
      that registers it, and walls off a large fraction of the first-party Python tree
      besides. The two dispositions available inside this AC are both bad: register flat and
      block, or record it as a declared non-gate — which the configuration-section constraint
      above already calls implausible for exactly this script, and which is suppression under
      another name. THE THIRD ANSWER IS EXTERNAL: GE-127b ("A file already over the line
      cannot get further over it") specifies the ratchet — an oversized file may be changed
      and may shrink, but a change that leaves it larger is refused, judged against the file's
      own previous size rather than the threshold. Land GE-127b first and registering
      check_file_size.py is a no-op for every file already over, including build_phases.py.
      OPERATIONALLY: if GE-127b is not yet landed when this AC is scheduled, do NOT resolve
      the deadlock by weakening the census, by raising the cap, or by exempting the offenders
      — raise the sequencing and let this AC wait for that one script. Every other member of
      the unreferenced set can be triaged independently; this constraint quarantines exactly
      one. This is recorded as a doc_link and this constraint rather than a depends_on edge;
      the doc_link states why, and the reason is mechanical, not stylistic.
    - >-
      A NEWLY REGISTERED GATE GOES LIVE ON THE SAME COMMIT AND BP-100k-4 IMMEDIATELY
      JUDGES IT. Every entry added to hooks_manifest.hooks starts running at commit time
      and is simultaneously evaluated by the existing reachability predicate: an added
      gate whose files trigger matches no tracked path is reported UNREACHABLE and blocks.
      Those findings are real and must be resolved, not silenced by setting enabled:false
      — that flag records a deliberate, documented decision, never a gate that turned out
      to be inconvenient on its first run.
    - >-
      PACKAGE SURFACE — DECIDED, AND HERE IS THE CONSEQUENCE. WATCHED_REGISTRIES watches
      commit_guardian.json on hooks_manifest.hooks (by id) AND on the document's own top
      level (by mapping key). Registering any of the 19 adds a watched id, so
      check-package-surface-declaration refuses the commit unless a cited AC declares
      package_surface: true. This AC declares it, which is why the structured five-field
      spec is present. The paired consequence for the register in BP-100n-4-i: a NEW
      top-level key would trip the same hook on the mapping-key container, which is why
      that register reuses the existing hook_trigger_reachability_exemption_registry key
      instead of introducing one.
    - >-
      Must follow the repo error-handling policy: specific-exception try/except around
      directory listing, file and JSON I/O; log at WARNING or higher or re-raise; no bare
      or blind excepts. A swallowed listing error must never become an empty population —
      that is the precise fail-open shape BP-100n-4-ii exists to make impossible.
test_spec:
  - name: test_bp_100n_4_added_gate_script_is_reported_and_the_compared_count_rises_by_one
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE DECISIVE ANTI-GREP DESCRIPTOR — WRITE THIS ONE FIRST. Over a fixture copy of the
      real gate-script directory and the real registry, execute the check as a process and
      capture two things from its own output: the stated compared count and the set of
      script names reported as invoked by nothing. Then write ONE new check_<novel>.py file
      into that directory, change nothing else in the repository, and execute the check
      again. The new script's filename must appear in the reported set, and the stated
      compared count must be exactly one greater than the first run's. Both numbers are
      read from the check's output, never from a literal expected value. No implementation
      carrying a list of script names — however that list is spelled — can pass this.
  - name: test_bp_100n_4_every_script_named_by_no_entry_line_is_reported_and_the_run_fails
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Over the repository's real gate-script directory and real registry, the executed
      check reports by name every script that no entry line names, states of each that
      nothing invokes it, and exits non-zero. The assertion is count-and-membership based
      over the check's own reported set — never a comparison against a hard-coded list of
      today's 19 names, which would pass while a twentieth escaped.
  - name: test_bp_100n_4_a_script_on_an_emitted_entry_line_is_not_reported_at_all
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      A script named on an emitted entry line appears in NO reported class — not as
      invoked by nothing, not as switched off, not as a declared non-gate. NAMED MUTATION
      (mandatory, run it, do not merely describe it): build the invoking set by
      kebab-casing each script's filename and matching it against registry ids instead of
      reading the entry lines. Under that injection this descriptor must go RED, naming at
      minimum check_ac_limits.py, which is registered and runs under the id
      check-ac-tree-limits. Revert the injection and the descriptor must return to green.
      This is the precise over-report the known issue's Method section controls for, and
      the clause is green on arrival today only because nothing is reported at all.
  - name: test_bp_100n_4_a_disabled_entry_is_reported_switched_off_and_does_not_fail_the_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A script named by a registry entry carrying enabled:false is reported as
      deliberately switched off, is not counted among the scripts nothing invokes, and
      does not by itself drive a non-zero exit. NAMED MUTATION (mandatory, run it): build
      the registered set from the generated commit-time configuration alone — the emitted
      entry lines — rather than from the whole registry. The five enabled:false scripts
      then appear as invoked by nothing and the run fails on them; this descriptor must go
      RED with exactly check_mermaid_drift.py, check_diagram_naming.py,
      check_duplicate_code.py, check_diff_coverage.py and check_surface_components_e2.py
      named, and return to green on revert. This is the five-false-alarms-on-day-one
      scenario, and a false alarm has exactly one natural remedy — weakening the check
      until it stops — so the mutation must be executed, not described.
  - name: test_bp_100n_4_a_registered_script_invoked_on_no_entry_line_is_reported_the_same_way
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      A script that a registry entry mentions but that the generated commit-time
      configuration invokes on no entry line — the entry is enabled, yet its entry line
      executes a different script — is reported as invoked by nothing, identically to a
      script the registry never mentions. Establishes that the question answered is
      whether the script is REACHED at commit time, not whether its name appears somewhere
      in the registry. Build the generated configuration through the real
      build_precommit_config path rather than hand-writing the expected entry lines.
  - name: test_bp_100n_4_census_is_emitted_through_the_registered_hook_entry_point
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_hook_trigger_reachability.py
    description: >-
      PRODUCTION ENTRY POINT. Run the check as a subprocess through the registered hook
      path and assert that the per-script verdicts and the summary counts appear in the
      hook's own output stream, and that the exit status is the commit outcome rather than
      an advisory note — non-zero when any script is reported invoked by nothing, zero
      when none is. A census computed by a function nothing at commit time calls is inert.
  - name: test_bp_100n_4_deployed_copy_runs_the_census_and_the_real_registry_comes_back_clean
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy of the check and every module it imports load and
      run in a cold process — a helper placed outside templates/scripts/commit_guardian/
      without a scripts/build_phases.py deploy-map entry surfaces here as
      ModuleNotFoundError rather than passing. Over the repository's real registry and
      real gate-script directory, following the day-one triage, the deployed run reports
      zero scripts invoked by nothing, states a compared count greater than zero, exits
      zero, and reports check_ticket_signoff_parity.py as INVOKED under the documented id
      check-ticket-signoff-parity. That last assertion is red today and is this AC's own
      red baseline for the registration.
test_rationale: |
  Every clause of this AC is green on arrival on the incumbent implementation, for the
  single trivial reason that nothing is reported at all — which is KI-TQ-010's shape
  exactly, and the reason each absence-asserting clause here carries an executable
  injection rather than a note asking someone to check that the test is meaningful.

  The added-script descriptor is written first because it is the only one that cannot pass
  on an implementation holding a literal list, however that list is spelled: it adds a file
  the list cannot know about and requires the stated compared count to move. The
  kebab-case injection defends the not-reported-at-all clause, whose red baseline is
  otherwise unobtainable, and it names the one script (check_ac_limits.py, running as
  check-ac-tree-limits) that distinguishes an entry-line census from a name-to-id one. The
  emitted-configuration injection defends the switched-off clause and reproduces the
  five-false-alarms day, because a check that raises five false alarms on the day it lands
  gets weakened rather than fixed.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", no descriptor
  here may be satisfied by reading the guard's source or the registry as text; a text
  assertion stays green on precisely the dead enumeration being replaced. Every descriptor
  executes the check as a process and asserts on its emitted output and exit status, and
  the deployed descriptor runs the built copy so a missing deploy-map entry cannot hide
  behind source-tree imports.
