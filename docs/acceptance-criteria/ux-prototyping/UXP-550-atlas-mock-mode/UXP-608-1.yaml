it_requirements:
  - "When the explicit override opt-in flag is set in a production deployment with no production lock, the seam in leafcutter-web/lib/data/mock.ts (via leafcutter-web/middleware.ts) must honor ?mock=1 and resolve to mock, serving fixtures with the mock badge."
  - "The opt-in must be an explicit server-side configuration value, not derivable from untrusted request input, so only an operator can enable overrides in production."
