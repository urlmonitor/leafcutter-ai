notes: |
  WHY THIS SITS UNDER AR-300a. AR-300a promises that "the abilities on a
  specialist's record are the abilities in its briefing". AR-300's altitude note
  explicitly expects the promise to survive swapping the thing granted, and names
  the second dead delivery as "not a skills table at all". A permission to
  dispatch a sub-agent is that second thing. AR-300a was at 4 of 5 L2s; this
  takes the last slot. It folds the presence (AR-300a-1) and absence (AR-300a-3)
  halves into one record because there is no room for two; the single-account
  half (AR-300a-4) is its L3.

  MEASURED (orchestrator probe, 2026-10-09, production code): the builder exists
  and is re-exported but nothing calls it, so 0 agents receive a spawn section;
  25 agents hold a non-empty permission after macro expansion. 25 is a
  measurement for falsifying the criterion against the pre-fix tree, not a
  constant -- the population must be derived from the declarations.

  THE MACRO IS SHOWN RESOLVED. The declaration keeps "every ticket-phase agent"
  as one entry (AR-300c-5), but the agent reading its prompt needs names. A
  section that printed the macro token would satisfy "the section names the
  declaration" and tell ticket-supervisor nothing. Each sub-agent named once:
  an explicit entry that the macro also covers must not appear twice.

  EVIDENCE IS THE COMPILED PROMPT, in every platform root (today the claude and
  gemini roots). A check against the registry or the source passes today for 25
  agents that receive nothing -- the same trap AR-300a-1 names.

  ROLE AND TIER COLUMNS. The existing builder renders Agent | Role | Tier. This
  criterion requires only that the sub-agents are named; whether role and tier
  are carried is the IT PO's call. Any columns shown must come from the derived
  registry copy or the definitions, never typed by hand.
