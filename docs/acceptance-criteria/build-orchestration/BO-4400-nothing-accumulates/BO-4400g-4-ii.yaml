id: BO-4400g-4-ii
title: "Ship clears its workspace by naming its work once the work is merged, and keeps it while the pull request is open"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
change_target: prompt
risk_surface: safety
criteria: |
  Given a person runs ship for the feature "gamma" in the workspace the workspace maker made
    for it, with its tests passing and nothing uncommitted,
  And the person chooses to merge the work directly into the main line,
  When ship reaches its clearing step after that merge has reached the shared main line,
  Then no folder remains at the location of the "gamma" workspace,
  And the clearing command ship ran named the work by its kind "feature" and short name
    "gamma", the same name ship's first step looked the workspace up by, and gave no
    location,
  And ship's report to the person contains the clearing door's own answer for that
    workspace, reporting it cleared.

  Given a person runs ship for the feature "delta" and chooses to open a pull request,
  And that pull request is still open, not merged into the main line, when ship reaches its
    clearing step,
  When ship finishes,
  Then the "delta" workspace still exists, identical to its state when the pull request was
    opened,
  And ship's report to the person states that the workspace was kept because its work is
    not yet on the main line, and that the landed-work pass clears it after the merge.
depends_on: [BO-4400g-4, BO-4400g-1, BO-4400g-2]
