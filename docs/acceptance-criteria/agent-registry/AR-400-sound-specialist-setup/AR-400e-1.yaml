  - scripts/knowledge_edges.py
  - scripts/generate_agent_cards.py
  - scripts/agent_ability_verdict.py
  - scripts/render_effective_prompt.py
notes: |
  THE READERS ARE THE TEST (AR-400e notes). The design names, per view, which
  field each reader picks today -- the L3s pin the populations that each reader
  currently gets wrong:
    - briefing (render_effective_prompt) and registry validation
      (build_phases_agent_validation) read skills_invoked -> blind to the 4
      skills_used-only specialists                             -> AR-400e-1-i
    - architecture diagram (generate_agent_diagram) and knowledge-graph edges
      (knowledge_edges) read skills_used -> blind to the 12
      skills_invoked-only specialists                          -> AR-400e-1-ii
    - published card and done verdict (agent_ability_verdict)  -> AR-400e-1-iii
    - migration helper (migrate_agent_abilities)              -> AR-400e-1-iv
  Module names are for the IT PO; the criteria are about the views.

  EVIDENCE IS EACH VIEW'S LIST FOR EVERY SPECIALIST, not that the old field is
  gone (AR-400e notes). Removing the field while one reader still looks for it
  silently empties that view.
