notes: |
  Found by inspection of PR #495 before merge, and reproduced in a real repository before this
  record was written. The same code exists on main but is registered in no manifest there and
  has never executed; PR #495 is what makes it live, so the fix belongs on that branch and not
  on main.

  WHY THIS IS ITS OWN RECORD rather than a correction folded into GE-122a-1: GE-122a-1 is
  satisfied by the code as written. Its scenarios stage claimants that are all newly authored,
  and the defect only appears once a merged-in claimant and an authored claimant share a number
  in one change set. This is the second instance in this tree of the same shape as GE-122a-1-i
  — a plausible, well-tested implementation of the parent that still misses the defect the goal
  exists to prevent — which is why both are kept as separate, individually assertable records.

  THE ORDERING DEPENDENCE IS WORTH STATING ONCE. Under the defect the outcome turned on which
  staged path git listed first for the contested number: had the merged-in filename sorted
  first, the exemption would have resolved to it and the gate would have behaved correctly by
  accident. So the defect was intermittent by filename, which is exactly the kind of thing a
  single hand-picked fixture can pass over. The fix removes the lookup rather than reordering
  it, so the outcome no longer depends on path order at all.
