readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Test-writing agents are measured on the mistakes that once got past them.

  The agents that design, write and run tests, database tests included, each
  have scored eval cases taken from recorded incidents where a green test let a
  wrong version through, and from the rule that tests use your project's own
  database setting. Every agent's set includes at least one trap it must not
  fall into. When a change to one of these agents makes it stop catching what it
  used to, the score shows that before the change is trusted. These cases are
  the proof for instruction changes that no ordinary test can check.
