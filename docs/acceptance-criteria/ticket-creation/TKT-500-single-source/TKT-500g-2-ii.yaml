assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The comparison must read the three real sources at their real paths. A check that reads a convenience copy, a fixture, or a re-stated summary can report agreement while the shipped descriptions disagree — the recorded shape of EPIC-ComputedQualityGates FP-1."
  - "The comparison must fail closed. If a source is missing, unreadable, or its skip rule cannot be located, the result is a reported disagreement naming that source, never a silent pass — an unlocatable rule is indistinguishable from an absent one."
  - "Name every enforcement point this comparison is wired into, and identify which one actually gates. A parity check added only to an advisory surface while the load-bearing gate runs a different path is a no-op that reports success."
  - "The reported disagreement must name the route and the input it disagrees on. 'Parity check failed' does not let the next reader act, and this defect survived because nothing reported which of three surfaces was the odd one out."
  - "The route enumeration must be derived from the documented dispatch topology rather than hard-coded to today's three, so a route added later is compared automatically instead of being exempt by omission."
test_spec:
  - name: test_each_route_description_matches_the_single_statement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "Runs the comparison over the three real route sources and asserts all three agree with the single published statement of the skip question."
  - name: test_a_drifted_route_is_reported_by_name_and_by_the_input_it_disagrees_on
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: "Must-block control: one route's description is mutated to skip on an input the single statement forbids, and the comparison reports a disagreement that names that route and that input."
  - name: test_a_route_deciding_by_worker_classification_is_reported_even_when_the_answer_agrees
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The right answer for the wrong reason is still a disagreement: a route phrased in terms of which worker is needed is reported even on an example where it happens to reach the correct outcome."
  - name: test_the_comparison_reads_the_real_sources_not_a_convenience_copy
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Mutating the real on-disk source changes the comparison's verdict, and removing a source makes it fail closed — proving the check reads the shipped files rather than an internal copy of them."
test_rationale: |
  A parity comparison is the one mechanism available for surfaces that are prose and
  cannot import each other, and it has two characteristic ways of being worthless: it can
  read a copy, and it can be unable to fail. Descriptors 2 and 4 exist to kill both —
  without a mutation control the check is a Neverfail test, and without the real-source
  control it can report agreement while the shipped descriptions disagree. Descriptor 3
  is the AC's own last clause and is the one that distinguishes a route that asks the
  right question from a route that merely gets the right answer today.
delivers_to:
  agent: llm-expert
  contract: "A comparison that fails loudly and by name when any one route's written skip rule drifts from the single statement — so the three surfaces cannot silently diverge again after they are aligned."
expects_from:
  ac_id: TKT-500g-2
  contract: "One question, stated once, that all three routes are required to ask."
