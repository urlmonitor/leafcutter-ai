title: "Acted-on feedback is marked done and traceable to the work it created"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  The loop closes -- resolved entries link to the work they produced and are never re-processed.

  Once an entry has been turned into a concrete piece of work, the platform marks
  it resolved and records a back-reference to that work. You can trace any shipped
  improvement back to the feedback that prompted it, and the same entry is never
  picked up and acted on twice.
