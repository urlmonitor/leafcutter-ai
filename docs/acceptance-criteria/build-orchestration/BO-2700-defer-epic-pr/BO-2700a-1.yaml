id: BO-2700a-1
components:
  - build_orchestration
title: "driveTicketPhases takes isEpicMember and drops pull-request from dispatch when true; epic call site passes true"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given driveTicketPhases in templates/workflows-js/build-feature.js,
  And a new second parameter isEpicMember defaulting to false,
  When driveTicketPhases runs with isEpicMember=true,
  Then the pull-request phase is removed from the needed phases it dispatches
    (no PR is opened for that ticket), while the commit phase is retained,
  And the epic batch call site invokes driveTicketPhases(worktreeTicketPath, true),
  And the standalone single-ticket call site invokes driveTicketPhases with the
    default (isEpicMember=false), so single-ticket behavior — pull-request still
    runs — is unchanged.
depends_on: [BO-2700a]
