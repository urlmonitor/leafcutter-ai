risk_surface: internal
notes: |
  Authored to satisfy TQ-500d's how-to documentation trigger, and also standing in for
  TQ-500a's how-to trigger: both name the same procedure for the same reader, and two
  copies of it would drift.

  THIS AC'S DELIVERABLE IS THE DOCUMENT, AND ONLY THE DOCUMENT. It is deliberately not
  a proxy for any behavioural check in this tree. No behavioural AC here may be closed
  by pointing at this guidance, and the presence of an instruction in it is not
  evidence that anything records or reads anything — that evidence is TQ-500b-1,
  TQ-500b-2 and TQ-500d-1-i, all of which assert over emitted records.

  THE LAST CLAUSE IS THE ONE WORTH REVIEWING FOR. Adding a correct how-to while leaving
  the two existing surfaces asserting the inverse produces three documents and no
  resolution, and the reader will follow whichever they met first — which, for everyone
  involved in the recorded incident, was the rule that said an immediate pass is a
  problem.
