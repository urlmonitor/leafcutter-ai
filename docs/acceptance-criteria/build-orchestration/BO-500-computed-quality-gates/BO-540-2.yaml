title: "flow_change injects documentation-expert before any coder in the computed chain"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_type: flow_change
    and the assigned work agent is python-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then documentation-expert appears in the chain
  And documentation-expert has a lower sequence number than python-coder
  And documentation-expert has a lower sequence number than test-writer
  And documentation-expert has a HIGHER sequence number than architect-review
    (architecture review informs the documentation)
  And documentation-expert's status is set to "needed"

  Given a ticket has change_type: data_change,
  When ticket-supervisor computes the agent chain,
  Then documentation-expert does NOT appear as a mandatory pre-coder agent
  And documentation-expert may still appear in its normal post-coder position
    (priority 10) if the ticket's selection_criteria triggers it

  Given a ticket has change_type: flow_change
    and documentation-expert signs off before the coder runs,
  When python-coder is dispatched,
  Then the coder has access to the documentation written by documentation-expert
    as context for its implementation
