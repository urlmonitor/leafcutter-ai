estimated_complexity: M
it_requirements:
  - >-
    AGENT ASSIGNED documentation-expert, AND THE ACS-800f / GE-120f-5 PRECEDENT WAS CHECKED AND
    FOUND NOT TO FIRE — the convention conflict is real but it resolves on the facts rather than
    on the convention. GE-120f-5 moved to llm-expert because its deliverable included
    templates/skills/create-hook/SKILL.md, which matches llm-expert's registry trigger verbatim
    ("files_touched contains templates/skills/*/SKILL.md"). Every surface this record can land on
    is under docs/, which matches documentation-expert's trigger ("files_touched contains
    docs/*.md") and matches nothing in llm-expert's. The containment argument that decided
    GE-120f-5 — llm-expert can write markdown, documentation-expert cannot write a skill body —
    has nothing to contain here, because there is no skill body: create-hook is the PRE-COMMIT
    scaffolder and the how-to says the two systems are completely separate. Assigning llm-expert
    to a docs-only deliverable on the strength of a precedent whose discriminator is absent would
    make the precedent a habit.
  - >-
    NOT SPLIT, AND THE SPLIT POINT THE BA NAMED IS THE REASON WHY. The BA offered a split between
    writing the page and executing it. Taken at that point it strands the writing half with only
    the "the instructions state X" clauses — exactly the text-searchable shape this record's own
    notes were written to avoid, and the shape this tree treats as disqualifying. The split would
    manufacture a vacuous AC in order to tidy an agent boundary, which is a worse outcome than a
    two-party ticket. The immediate precedent agrees: GE-120f-5 has the same two-surface shape,
    was decided seven days earlier in the same family, and was left whole with the executable half
    carried as a hard requirement plus descriptors. Same treatment here. (The cap was not the
    deciding factor and would not have blocked a split — an L3 constraint sibling consumes no L2
    slot under GE-129a, which is at 5/5.)
  - >-
    THE EXECUTABLE HALF IS PYTHON, IT IS NOT OPTIONAL, AND IT IS NOT DISCHARGED BY THE PROSE.
    The two-walkthrough descriptors below must be authored by test-writer / python-coder in the
    same ticket. This record is NOT done when the page is written: without those descriptors every
    clause here is satisfiable by writing sentences, and sentences about a guarantee are what this
    repository already has too many of. Do not set test_required: false on this record for being
    change_target: docs. If the implementing ticket can carry a python-coder phase alongside the
    documentation-expert phase, take it; if it cannot, escalate rather than dropping the half.
  - >-
    BOTH NATURAL HOMES ARE ALREADY OVER THE DOC-LENGTH LIMIT — THE BA FLAGGED ONE AND THE OTHER IS
    WORSE. Measured in this worktree 2026-09-15: docs/reference/claude-code-hooks.md is 334 lines
    and docs/how-to/creating-a-claude-code-hook.md is 378, against commit_guardian.json's
    doc_length.max_lines of 300 with severity now `block` and a growth ratchet over `^docs/.*\.md$`
    — a doc already over may not GROW; shrinking or holding steady passes. The how-to is the
    document the first two clauses of the criteria are actually about, and it is the one the BA's
    note did not measure. So appending to EITHER makes the branch uncommittable. The workable
    shapes are: land the material in a NEW document under the limit and reach it by a link from
    both; or reduce a host by at least as much as is added. Choose at the start of the change, not
    at the end.
  - >-
    THE REACHABILITY CLAUSE IS ABOUT WHERE A PERSON ALREADY IS, AND BOTH DOORS MUST BE FITTED. The
    last criterion is satisfied only if an author wiring a guard to a tool-call event meets the
    rule without knowing to look for it. In this repository that author is reading
    docs/how-to/creating-a-claude-code-hook.md, and may also be reading
    docs/reference/claude-code-hooks.md. Enumerate the surfaces such an author passes through and
    state, for each, whether the rule is written there or deliberately not and why — the
    enumeration is a deliverable. A link from each is the minimum; a link added to only one leaves
    the other door open, and a link is not "adding a section", so it is affordable under the
    ratchet.
  - >-
    USE THE NAMES THE MACHINE READS, TAKEN FROM THE LIVE SOURCE. The page must use
    config/verification_flow.schema.json's own names for the known-bad input
    (negative_control.input), the observable rejection (negative_control.expected_result), the
    exemption and its ground (negative_control.not_applicable + reason), the four state values
    (currently.state: passing / failing / blocked / unverified) and the entry point (entry_point),
    together with the three identity fields GE-129a-2 fixes (event, matcher, script). A second
    vocabulary beside the first is how a rule with one reader becomes a rule with none, and that is
    the exact history of the vocabulary this record tells the author to use.
  - >-
    THE PAGE DESCRIBES A REQUIREMENT IN FORCE, WHICH IS A SEQUENCING CONSTRAINT, NOT A TONE. This
    clause passes trivially the moment the text is written, so it is the one to distrust. The page
    must not land ahead of the machinery and describe an intention: every state, class and file it
    tells an author about must resolve to something the run actually produces. That is what the
    fourth descriptor below asserts.
  - >-
    SCOPE BOUNDARY. docs/reference/false-green-mechanisms.md is a different document with a
    different owner and a recommended entry of its own that belongs to GE-120f. Writing there does
    not satisfy this record and this record is not satisfied by writing there. Likewise, do not
    edit any docs/known-issues/ register or any docs/**/PROJECT_CONTEXT.md — all are over the
    ratchet and any addition makes the branch uncommittable.
  - >-
    AC_ENFORCE_STRICT=1 on every pytest invocation the descriptors below specify, and the run side
    of the walkthrough must be exercised as the DEPLOYED copy. A page checked against a source-tree
    run the editor never loads agrees with nothing that runs.
test_spec:
  - name: test_ge129a5_a_guard_wired_by_following_the_written_steps_is_reported_declared_and_examined
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      THE WALKTHROUGH DESCRIPTOR, AND THE ONLY CLAUSE IN THIS RECORD NOT SATISFIABLE BY WRITING
      SENTENCES. Drive the written steps mechanically — parsing the step list and the declaration
      field set from the page itself AT RUN TIME, never from a literal in the test — to wire a
      fixture guard on a fixture settings surface, then run the liveness sweep and assert the
      resulting subject is reported as carrying a declaration tied to its entry and as having been
      examined.
  - name: test_ge129a5_omitting_the_declaration_step_makes_the_run_report_the_guard_undeclared
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      THE PAIRED HALF, AND IT IS WHAT MAKES THE PAGE FALSIFIABLE. Follow the same steps with the
      declaration step omitted and nothing else done differently; assert the resulting guard is
      reported as carrying no declaration, by name, so the two walkthroughs differ in the run's
      output in exactly the way the omitted step predicts. NAMED MUTATION, BOTH DIRECTIONS, both
      mandatory: (a) rewrite the page so the declaration reads as recommended rather than required,
      leaving the run unchanged — this pair must go RED; (b) leave the page as written and relax
      the run to report an undeclared subject as declared — it must go RED again. The defect is the
      gap between page and machinery, not its direction.
  - name: test_ge129a5_the_page_uses_the_schemas_own_names_and_a_synonym_version_fails
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Extract the field names and the four state values from config/verification_flow.schema.json
      AT RUN TIME — so the expectation moves when the schema moves and the test carries no
      vocabulary of its own — and assert each appears in the written page. PAIRED AND MANDATORY:
      run the same check against a fixture page that says the same things in its own synonyms and
      assert it FAILS. Without the paired fixture this is a presence grep and proves nothing.
  - name: test_ge129a5_every_state_class_and_file_the_page_names_resolves_to_something_the_run_produces
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      the hooks_manifest entry line that invokes the liveness run, executed as
      python .leafcutter/scripts/commit_guardian/run_hook.py <that gate>
    description: >-
      THE IN-FORCE CLAUSE, MADE FALSIFIABLE. For every state value, reported class and declaration
      file the page tells an author about, resolve it against the DEPLOYED run by invoking the gate
      through its production entry line and reading what it emits and loads. PAIRED with a fixture
      page naming a state or a file the run does not produce, which must FAIL. This is what stops
      the page landing ahead of the machinery and describing an intention.
  - name: test_ge129a5_the_rule_is_reachable_from_every_surface_a_session_hook_author_passes_through
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Take the enumerated author surfaces from the change's own deliverable enumeration at run
      time — at minimum docs/how-to/creating-a-claude-code-hook.md and
      docs/reference/claude-code-hooks.md — and assert each either states the rule or links to
      where it is stated. PAIRED: a fixture copy of one surface with the link removed must FAIL.
      Also assert no surface this change touched grew past doc_length.max_lines, and that no
      already-over surface grew at all — the ratchet is part of this record's definition of done,
      not a separate concern.
test_rationale: |
  Every clause of this record except the walkthrough pair is satisfiable by writing sentences, so
  the test contract is built around the clauses that are properties of TWO artifacts — the page and
  the run — and can therefore be exercised against each other. A documentation criterion phrased as
  "the document states X" is checkable by searching the text, which is the one form of verification
  this whole tree treats as disqualifying; the two walkthrough descriptors replace that with a
  difference the run itself produces.

  The last descriptor carries the doc-length ratchet deliberately. Both natural homes are already
  over the limit, so the realistic failure here is not a bad page but a good page that cannot be
  committed, discovered after it is written. Asserting the ratchet alongside the reachability clause
  makes that a red test on the first run rather than a rewrite at the end.
