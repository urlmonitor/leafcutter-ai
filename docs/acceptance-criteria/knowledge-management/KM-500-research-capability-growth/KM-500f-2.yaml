id: KM-500f-2
title: Keep declared coverage executed proof and deployment proof separate
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500f
criteria: 'Given KM-500c-2 declares seven test references and a separately supplied acceptance report describes
  an Aura proof at an earlier tested revision using scripted Jev and a supplied candidate

  When an agent asks what proves that criterion and whether the real research flow has passed

  Then the answer lists declared references separately from observed execution evidence and identifies the revision
  and environment each report actually exercised

  And the reported scripted judgment and supplied candidate remain distinct from a real judgment-provider or coding-agent
  run

  And a reported partial research result remains partial even when the surrounding test passed

  And an AC''s done status, an existing test reference, a passing local check and deployed operation are presented
  as separate facts

  And absent runtime or deployment evidence is reported as unverified for that claim, rather than as passing or
  failing

  And the revision storing a historical report is never substituted for the revision that report says it tested

  And neither available proof nor declared coverage is generalized beyond the specific behavior, environment and
  population it establishes.

  '
