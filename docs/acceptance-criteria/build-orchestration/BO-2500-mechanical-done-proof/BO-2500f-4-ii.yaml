    angle: deployed
    description: "scripts/ac_store/migrate_verification_records.py is in build_ac_store's deploy_map and imports in a fresh subprocess restricted to the deployed .leafcutter/scripts/ac_store directory."
    proves_clause: "each record ends in exactly one of two states: carrying a verification record that holds under BO-2500f-4, or returned to in_progress through the demotion path TQ-400b defines, with the reason and the date recorded on it"
    code_file: scripts/ac_store/migrate_verification_records.py
    to_be_created: true
