    path to a guard that already refuses rather than a second path that refuses nothing.
- agent: documentation-expert
  ac_id: GE-130f-4
  contract: >-
    The refusal form the repaired guard actually uses, and the session_hooks_manifest path where
    its liveness record is read - the two facts GE-130f-4's reference entry must state rather
    than assert in its own words that the guard works.
