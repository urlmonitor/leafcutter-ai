id: FIN-100c-5
readiness: approved
priority: high
components:
  - finalize
title: "The main-HEAD rerun is scoped to only the failing test IDs so it completes in bounded time"
level: L2
component: finalize
status: active
parent: FIN-100c
criteria: |
  Given the full-suite baseline run timed out, leaving baseline_failures null
  And the post-merge run reports exactly K failing test IDs
    (K = 3 in the 2026-07-15 case)
  When the workflow performs the main-HEAD rerun
  Then the rerun executes only those K specific test IDs and no others
  And it does NOT re-run the full test suite
  And the rerun therefore completes even when the full-suite baseline did not
origin_agent: "business-analyst"
created: 2026-07-15
created_by_ticket: null
assigned_agent: "python-coder"
estimated_complexity: S
it_requirements: |
  - SCOPED INVOCATION: the rerun must pass exactly the K post-merge failing test
    node IDs (file::test_name format) to pytest and no others — the recovery path
    must never invoke the full suite.
  - BOUNDED RUNTIME: rerun runtime must scale with K (the number of failing IDs),
    not with suite size, so the rerun completes even when the full-suite Step 0
    baseline timed out.
  - ROBUST ID PASSING: the node IDs handed to the runner must be the same IDs the
    post-merge run reported, unmodified, so the recovered baseline built in
    FIN-100c-6 is directly comparable to post_merge_failures under exact string
    matching.
  - The scoped rerun still runs AFTER the build/deploy step (FIN-100c-4) so the K
    tests are re-executed under the same deploy state as post-merge.
delivers_to:
  - agent: "test-failure-triage"
    contract: "provides a bounded-time recovered baseline covering exactly the post-merge failing test IDs"
expects_from:
  - agent: "finalize-feature-workflow"
    contract: "provides the K post-merge failing test IDs to rerun (baseline_failures=null)"
test_spec:
  - name: test_rerun_executes_only_failing_test_ids
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "The main-HEAD rerun is invoked with exactly the K post-merge failing test node IDs and no other tests."
  - name: test_rerun_does_not_run_full_suite
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "The recovery path never invokes the full test suite (no bare `pytest` / discover) — only the scoped node-ID invocation."
  - name: test_rerun_completes_when_full_suite_baseline_timed_out
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "Given the Step 0 full-suite baseline timed out (baseline_failures null), the scoped rerun of K IDs still completes and yields a recovered baseline."
doc_links:
  - path: "templates/workflows-js/finalize-feature.js"
    relevance: "null-baseline rerun branch must pass only the failing test node IDs (not the full suite) to the runner"
  - path: "docs/how-to/finalize-feature.md"
    relevance: "baseline capture can time out on the full suite; the targeted rerun must remain bounded"
