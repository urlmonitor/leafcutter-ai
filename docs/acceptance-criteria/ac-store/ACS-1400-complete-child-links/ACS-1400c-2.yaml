criteria: |
  Given a store containing a parent whose coverage list holds only entries that
    resolve to no record in the store, and which has a child it does not name,
  And, in the same store, a parent whose coverage list already names at least one
    real child and which omits another child it has,
  When the one-off adjudicated pass is run over that store,
  Then the first parent's file is byte-for-byte identical to its content before
    the run,
  And the first parent is reported as an abstention naming the record, stating
    that its coverage list resolves to no record so appending a child would change
    what that list is taken to mean, and naming the separate decision that has to
    be settled before it can be repaired,
  And the second parent gained the child it was missing in that same run, so the
    abstention was a decision this run reached rather than the whole of what it
    did,
  And the abstention is reported through the same channel every other abstention
    in the pass uses.
