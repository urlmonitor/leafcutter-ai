test_spec:
- name: test_missing_referencing_is_named_not_reported_as_missing_jsonschema
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: failure
  description: With jsonschema importable but `referencing` made unimportable in a fresh subprocess, the
    validator exits non-zero, names `referencing` and the installed jsonschema version, and does not
    claim jsonschema is missing.
- name: test_missing_jsonschema_is_still_reported_as_missing_jsonschema
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: boundary
  description: With jsonschema itself made unimportable in a fresh subprocess, the validator still exits
    non-zero with the existing jsonschema-missing refusal.
test_rationale: The defect is a misattributed import failure, so both tests run the real validator as a
  subprocess and make the unimportable module fail on purpose, rather than relying on how the host
  machine happens to be set up. The host that exposed the bug has since been repaired, so a test that
  depended on the environment would pass vacuously.
test_required: true
declares_side_effect: false
notes: Filed by /quick-fix on 2026-10-08. A shared try/except ImportError wrapped both `import jsonschema`
  and `from product_truth_contracts import ...`, so a failure inside product_truth_contracts (which imports
  `referencing` directly) set jsonschema to None and was reported as "jsonschema is not installed". On a
  host with Debian's python3-jsonschema 4.10.3, which predates `referencing`, this sent the operator to
  reinstall a package that was already present.
