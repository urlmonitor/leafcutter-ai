    detail: "Arm 4 (the anti-theatre clause) now applies to each of the five THAT HAS ANY WAY OF REFUSING. A check through which no path ends in a refusal, whatever it is given and however it is set, must instead carry an explicit, justified declaration on the entry that registers it, stating that it cannot refuse and why, on structural grounds. The amendment keeps the clause's teeth: a check that can be made to refuse — including one unarmed by default or one with nothing to examine here — cannot be excused by that declaration, and a false declaration fails the arm. Reason: check-ac-done-on-merge structurally cannot refuse (main() returns 0 unconditionally; the __main__ guard maps OSError/ValueError to exit 0; post-merge, tier transform), so arm 4 as written was unsatisfiable for it. Arms 1, 2, 3 and 5 and the coverage note are byte-identical. Authored by business-analyst on the user's explicit approval; work_status, readiness and all technical fields untouched."
