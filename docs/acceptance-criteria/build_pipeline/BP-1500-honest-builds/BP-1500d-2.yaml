notes: |
  WHAT THIS CHILD OWNS. Point (c) of the guarantee in BP-1500d's notes: the record
  stays readable wherever the project is later opened, moved or copied. This is a
  distinct failure from BP-1500d-1's: a record can be filed correctly inside the
  receiving project, travel with it, and still be unreadable the moment the project
  moves, because its entries are keyed to where the producing package happened to
  sit on disk when it was written. The file arrives; the meaning does not.

  WHY THE READ-AT-ORIGIN CONTROL IS IN THE CRITERIA. A two-run move-and-fail pair
  cannot separate a working readability check from a relocation that broke the
  project for some unrelated reason. Reading the deliberately non-portable record at
  its original location -- where it must still read -- is what makes the red at the
  new location attributable to the record's form.

  SAME FAILURE FAMILY AS BP-016 / BP-017, one layer deeper: build output keyed to
  one machine's directory layout and useless anywhere else. The difference is that
  those broke loudly at the point of use, whereas this degrades into an unreadable
  record, which the checks that read it currently treat as nothing to do.

  UNREADABLE IS NOT THE SAME AS FALLEN BEHIND. This child says nothing about whether
  the install matches what the package now holds -- that is BP-1500c's guarantee and
  is not re-derived here. This is BP-1500c's prerequisite: there is nothing to
  compare against until a record can be read in the project being checked.

  ORDERING. Presupposes the record produced by BP-1500d-1. depends_on carries only
  the parent link, as the authoring request specified; the it-po should express the
  producer/consumer edge as expects_from BP-1500d-1.
