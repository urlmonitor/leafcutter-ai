id: UXP-100e-1-i
title: "Feature without UX involvement skips UX designer dispatch entirely"
component: ux-prototyping
level: L3
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the PO agent has completed L0 and L1 AC authoring for a feature
    that is purely backend (e.g. a data migration or an API-only change with
    no user-facing screens),
  When the pipeline evaluates whether UX involvement is warranted,
  Then the UX designer agent is not dispatched
  And the BA agent is dispatched alone (not held back waiting for a UX decision)
  And no prototype artifact is expected or required for this feature
  And the pipeline proceeds to implementation after BA decomposition and
    IT PO enrichment without a UX approval gate
