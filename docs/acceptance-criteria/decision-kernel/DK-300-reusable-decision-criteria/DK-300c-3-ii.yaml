criteria: |
  Given cat-6c3eb4f2af148922 has been published with cat-d6ce5f78c181ebd1 as its broader category,
  When a person merges or splits cat-d6ce5f78c181ebd1 and publishes the change without changing cat-6c3eb4f2af148922,
  Then the publish is refused, naming cat-6c3eb4f2af148922 and its retired broader category,
  And when the same change also sets the broader category of cat-6c3eb4f2af148922 to a live replacement, or to none, the publish succeeds.
