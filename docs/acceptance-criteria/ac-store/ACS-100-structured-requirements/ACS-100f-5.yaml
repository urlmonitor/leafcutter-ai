title: "Children lookup returns all ACs that depend on a given AC"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given AC "ACS-100a" exists at L1,
  And ACs "ACS-100a-1", "ACS-100a-2", "ACS-100a-3" have depends_on: [ACS-100a],
  When an agent queries for AC ID "ACS-100a" with include_children: true,
  Then the result includes the matched AC plus all ACs whose depends_on
    contains "ACS-100a" (direct children only, not transitive),
  And when include_children: "recursive" is specified,
    all descendants at all levels below are returned,
  And children are grouped by level (L2s first, then L3s within each L2).
