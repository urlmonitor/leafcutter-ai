criteria: |
  Given the reachability guard is in place,
  When a reader who has just been refused follows the guard's own output to the
    documentation,
  Then one table lists every refusal the guard can emit, and for each gives what is
    unreachable, which side of the connection is missing, and the action that clears it,
    And each row links to the guide that describes that action in full rather than
      restating the procedure,
    And the table states which refusals a recorded exemption releases and which it does
      not,
    And the destination is reachable from the guard's output, so a reader who has only
      the refusal in front of them can find it,
    And no procedure already documented in the proof-of-completion guide, the
      capability-connection guide or the exemption guide is repeated here.
