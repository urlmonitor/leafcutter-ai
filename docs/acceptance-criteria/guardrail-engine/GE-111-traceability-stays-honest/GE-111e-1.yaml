assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Message is a pure renderer over the verdict object {ac_id, entry, tier, verdict, change_kind, symbol, suggested_location} (GE-111b-1 spine, extended by GE-111b-2/b-3) plus the applicable-routes content {update: {suggested_location}, confirm: bool} from GE-111d-3. It MUST NOT recompute drift or re-resolve symbols — render only."
  - "Must include all four load-bearing fields per the GE-111e PO note: (a) AC id, (b) broken implemented_by entry, (c) change kind (deleted/moved/renamed/removed; plus symbol name and located new location at symbol tier), (d) pointer to GE-111d reconciliation options. Mirror the ACS-400e-1 'clear, actionable error message' bar for this hook."
  - "Emit to stderr with a consistent [check-ac-traceability] prefix (commit-guardian convention) so it surfaces in the pre-commit failure output."
  - "When multiple ACs drift in one commit, the message must list each affected AC with its own fields (no silent truncation to the first)."
  - "Pure formatting over already-computed inputs — per CLAUDE.md Rule 4 this renderer must NOT be wrapped in try/except; let it propagate (the outer hook owns the I/O boundary and fail-open)."
