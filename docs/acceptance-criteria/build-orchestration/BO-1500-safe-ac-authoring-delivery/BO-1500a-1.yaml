created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given the user starts an AC-authoring workflow (/create-ac or /plan-feature),
  When the workflow begins its first authoring stage,
  Then it creates a dedicated authoring worktree on a new branch
    whose starting point is the current tip of origin/main,
  And every AC YAML file the workflow produces is written under that
    authoring worktree's path,
  And no AC YAML file is written under the user's original checkout.
