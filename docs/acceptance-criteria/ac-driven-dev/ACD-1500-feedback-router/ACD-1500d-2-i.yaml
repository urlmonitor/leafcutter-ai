req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the per-run artifact cap is 3,
  And 5 entries (F1..F5) are eligible to produce artifacts,
  When the router has created artifacts for F1, F2, and F3 (reaching the cap),
  Then F4 and F5 are parked for the next run or human review rather than processed,
  And the parked entries F4 and F5 remain unresolved,
  And the run ends cleanly with a summary stating 3 artifacts created and 2
    entries deferred due to the cap,
  And the next run is able to pick up F4 and F5 because they were never resolved.
