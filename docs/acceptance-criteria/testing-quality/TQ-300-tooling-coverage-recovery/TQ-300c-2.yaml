assigned_agent: python-coder
estimated_complexity: S
test_required: true
test_spec:
  - name: test_high_entropy_string_yields_finding_naming_file_and_line
    target_dir: tests/
    framework: pytest
    type: unit
    description: "scan_file on a file with a high-entropy secret-like token yields a finding (rule_id ENTROPY_HIGH) naming the file and line."
  - name: test_plain_text_yields_no_findings
    target_dir: tests/
    framework: pytest
    type: unit
    description: "scan_file on a plain-text file yields no findings."
  - name: test_allowlisted_line_is_suppressed
    target_dir: tests/
    framework: pytest
    type: unit
    description: "An allowlist entry matching rule_id:file:line suppresses the finding via scan_files (tmp_path project_root containing a .security-allowlist)."
  - name: test_wildcard_line_marker_suppresses_all_lines
    target_dir: tests/
    framework: pytest
    type: unit
    description: "A wildcard line marker ('*') for a path suppresses every matching line under that path, not just one fixed line number (_is_suppressed treats lineno '*' as match-all)."
it_requirements:
  - "Author fresh unit tests in tests/test_scan_secrets.py (new file). Write from scratch and verify run-to-green before sign-off. scan_secrets.py lives under templates/skills/security-scanner/scripts/ — import it via sys.path.insert of that scripts directory."
  - "API NAMING: there is NO function named scan_secrets. Use scan_file(path) (raw findings) and scan_files(paths, project_root) (applies the .security-allowlist). Findings are Finding(rule_id, file_path, line_no, excerpt) NamedTuples."
  - "For the allowlist scenarios, place a .security-allowlist under a tmp_path project_root and pass that root to scan_files; assert both the exact rule_id:file:line suppression and the wildcard ('*') line-marker suppression."
  - "No production change is expected for this AC — this is coverage recovery over existing behavior."
