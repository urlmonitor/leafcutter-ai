criteria: |
  Given a deployed command whose handoff references a workflow BY NAME, such as
    Workflow("build-feature") with no path,
  And "build-feature" is a registered entry in the deployed workflow registry,
  When build.py runs its command-reference reachability check,
  Then the build succeeds with a zero exit status for that reference,
  And the name-based target is treated as resolvable (resolution-by-name via the
    registry is a valid form and is the correct fix for the path-form defect in
    BP-900g-1).
