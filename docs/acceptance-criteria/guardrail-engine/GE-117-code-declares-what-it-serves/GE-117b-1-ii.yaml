assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "declared_refs collects ALL AC references parsed from the symbol docstring (a list, possibly length > 1); the verdict is 'satisfied' iff EVERY declared ref resolves via the shared _load_ac_by_id; a single unresolvable ref among otherwise-valid ones yields 'invalid' (partial validity never passes)."
  - "On the invalid branch, record which specific ref(s) failed to resolve in the verdict so GE-117e can act on the exact dangling id; do not collapse to a boolean."
  - "Reuse the SAME extracted _load_ac_by_id resolver as GE-117b-1 / GE-117c-1 (one shared module); no per-leaf reimplementation. Edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together; verify via build.py round-trip (ADR-001)."
delivers_to: null
expects_from:
  ac_id: GE-117b-1
  contract: "The per-symbol verdict object whose declared_refs list and invalid branch this edge case exercises"
