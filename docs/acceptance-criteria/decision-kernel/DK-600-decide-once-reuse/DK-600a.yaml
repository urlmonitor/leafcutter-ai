notes: |
  DERIVED FROM leafcutter/decision-forming (8 of its 15 scenarios):
    steps    ask, classify, ground, synthesize, propose, research-options, assess
    branch   budget-reserve
  Also half of the journey step decision-lifecycle/form (shared with DK-600b).
  NOT HERE: approve-proposals, revise-proposals, choose, rerank, no-answer and
  resolve (DK-600b), and precedent (DK-600e, it expands into the retrieval
  sub-flow).

  STANDING RULES TO CARRY INTO L2. A precedent alone never counts as grounding;
  findings cite only the retrieved evidence; options the person named are checked
  against their own words and kept as theirs. The ranking produced here is input
  to DK-600b and is never itself a decision.

  Sequence diagram: you, Claude Code as host, the research capability and Jev
  all take part in one round.

