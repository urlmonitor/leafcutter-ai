criteria: |
  Given a reader who has just had a working copy prepared for them,
  When they consult the how-to for managing commit-time checks,
  Then it states what set-up guarantees — that the checks are active and reach the same
    verdicts as the main checkout,
  And it states what set-up does when it cannot establish that: it names the missing part and
    refuses, rather than handing over an unprotected copy,
  And it gives the one command the reader runs to confirm protection is active in the copy in
    front of them, and what its output looks like in both the healthy and the unhealthy case,
  And it does not instruct the reader to establish any part of the protection by hand,
  And it does not reintroduce the manual layout-link step that GE-119b-5 removes.
