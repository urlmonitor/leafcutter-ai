  - path: scripts/suite_performance/check_shared_layout_migration.py
    relationship: creates
    status: planned
    relevance: >-
      THE EXAMINATION ITSELF, and the only file this AC brings into existence. It
      lives beside the fixture it checks routing onto
      (scripts/suite_performance/pytest_shared_reference_layout.py) rather than under
