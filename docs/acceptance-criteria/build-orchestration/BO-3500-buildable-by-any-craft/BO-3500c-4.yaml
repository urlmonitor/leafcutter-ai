it_requirements:
  - "NO REFUSED-KINDS LIST ANYWHERE. The verdict is 'this kind has an entry in BO-3500c-2's proof table' — data-driven, so DEFINING a proof makes the kind buildable with no edit to any list and no edit to the requirement. A deny-list satisfies the first scenario and fails the second, and a deny-list is the likely implementation. This mirrors BO-3500a-3's roster hinge on the other axis; the two must be built the same way."
  - "TWO DISTINCT REASON CODES, MACHINE-READABLE AND BRANCHED ON: `no_proof_defined` (fixed by defining something) and `proof_unavailable_here` (fixed by provisioning something — a missing vitest binary, an absent model credential). They will be conflated otherwise, and getting it wrong reproduces KI-BO-013 exactly: work is done, and the refusal arrives at the end."
  - "THE CHECK RUNS BEFORE DISPATCH, EXTENDING compute_producibility_verdict IN scripts/build_orchestration/fast_lane.py — not as a second gate at the end of the run. Extend that function's per-member finding structure rather than adding a parallel path; it is already read-only and already returns {ac_id, declared_producer, declared_proof, reason} per member."
  - "FOURTH SCENARIO (user decision D4): the kind is DERIVED per BO-3500c-2's resolution table; a record stating its own kind is reported as a defective declaration, not honoured. Without it, this criterion's refusal converts into an exemption obtainable by typing — the cheapest route to an exemption in the whole tree, cheaper than any already forbidden."
  - "DERIVE IN EXACTLY ONE PLACE. An implementation that derives the kind in the proof selector and reads a field in the refusal path has satisfied neither BO-3500c-1's last scenario, BO-3500c-2's fourth, nor this one. BO-3500c-2 delivers a single derive_proof_kind call site; this record must call it, not re-derive."
  - "PRESERVE BO-2400f-12's PROPERTIES rather than redoing them: the refusal performs no writes (BO-2400f-12-i), and the verdict is computed against the run's own capabilities (BO-2400f-12-ii). What is added is the case it cannot see — a member whose proof obligation is well formed and simply has no instrument behind it."
  - "NO PRESENCE-ONLY ASSERTIONS. The extensibility test must ADD a proof to the table and re-run; a test asserting the absence of a deny-list literal proves nothing."
delivers_to:
  agent: python-coder
  contract: "Up-front refusal outcome: {reason_code: 'no_proof_defined'|'proof_unavailable_here', ac_id, kind: <derived>, remedy: 'define-proof'|'provision'}. Emitted by the extended compute_producibility_verdict before any dispatch; consumed by the run's ending and by BO-3500d-2, which groups the standing backlog view by these same codes."
