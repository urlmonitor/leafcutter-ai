id: BO-2400a-3-xiv
components:
  - build_orchestration
  - testing_quality
title: "A batch made only of proven backfills goes from its mutation proof to the green gate without dispatching the coder"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every criterion in the batch, UXP-510 and UXP-511, is classified as a test
    backfill and has passed its mutation proof,
  When the fast lane decides its next step,
  Then the coder is not dispatched,
  And the run goes on to the green gate, the coverage check, the pre-commit review and
    the commit, exactly as for a batch the coder worked on,
  And the run's result states, for each criterion, its proof route (red-first or
    mutation), so the pull request shows how each criterion's tests were shown to
    constrain the code.

  Given a batch that holds at least one red-first criterion as well as proven
    backfills,
  When the fast lane decides its next step,
  Then the coder is dispatched once for the whole batch, as before.
depends_on: [BO-2400a-3, BO-2400a-3-ix, BO-2400a-3-x, BO-2400a-4-ii]
