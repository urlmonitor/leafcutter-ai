assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Exercises the mixed-change boundary of the leafcutter-web/** paths filter from BP-1400a-2: a changed-file set containing at least one leafcutter-web/ file AND one or more non-web-app files must still TRIGGER and REQUIRE the web-app check — the trigger predicate is 'ANY changed path matches leafcutter-web/**', not 'ALL changed paths match'."
  - "A failing web-app check on such a mixed PR must block the merge; a web-app change must not slip through unchecked just because it is bundled with backend or docs changes."
  - "Verify against the ACTUAL paths-filter semantics chosen in BP-1400a-2 (GitHub `paths:` matches if any changed file matches) — do not assume; a mis-specified filter that requires all-paths-in-scope would silently skip mixed PRs."
