id: BO-2800c-1
components:
  - build_orchestration
  - review_system
title: "Every path that proceeds past a blocking check writes an override record naming that check and that finding"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the documentation-verification gate has raised a blocking finding on a piece of
    work, and that finding carries a defect identifier,
  When a human decides in prose that the work proceeds to completion anyway rather than the
    finding being resolved,
  Then a structured override record is created that names the overruled gate, the defect
    identifier of the specific finding overruled, an instance identifier for that
    particular firing, the piece of work, the time, who or what authorised proceeding, and
    the stated reason,
  And the override is attributed to that gate alone — a second gate that signed off green
    on the same piece of work has no override recorded against it,
  And the record exists as structured data that can be counted, not solely as a sentence in
    the work's comment history.

  Given a phase returns a blocking finding that the build workflow classifies as a
    cross-agent blocker, and the workflow responds by adding that phase to its skipped list
    and leaving the remaining phases unrun,
  When the run finishes and reports its status,
  Then an override record is created for that skipped phase, naming the gate, the finding
    overruled, the piece of work, and the workflow itself as the authoriser, with the
    classification recorded as the stated reason,
  And the record is created whether or not the run reports itself as successful, so an
    automated skip that ends in a successful-looking status is still counted as an override
    of that gate,
  And this automated path is recorded on the same terms and in the same store as an
    override a human declared in prose, so the two are counted together rather than in
    separate populations.

  Given a sign-off comment that carries no completion manifest at all, and a supervisor
    that proceeds by treating the absent manifest as though every item had been recorded
    true,
  When the supervisor proceeds,
  Then an override record is created naming the signing agent's phase as the gate whose
    evidence was waived, the piece of work, and the absent manifest as the stated reason,
  And the record is flagged as an assumed pass rather than as a declared override, so a
    report can separate evidence that was overruled from evidence that was never supplied,
  And creating the record does not cause the supervisor to stop, retry, or demand the
    manifest, because tolerating an absent manifest is an existing and deliberate posture.

  Given a single gate raises two blocking findings on one piece of work,
  When both are overruled,
  Then two override records are created, one per finding, rather than a single record for
    the work.

  Given a single gate raises the same rule identifier twice on one piece of work — the same
    problem kind firing on two different places in the same work — and both firings are
    overruled,
  When the override records are created,
  Then the two records are distinguishable from one another by their instance identifiers
    even though they carry the same defect identifier,
  And an aggregate counts two overrides of that problem kind on that piece of work rather
    than one,
  And a report that groups by defect identifier still reports the problem kind once, with
    an override count of two.
