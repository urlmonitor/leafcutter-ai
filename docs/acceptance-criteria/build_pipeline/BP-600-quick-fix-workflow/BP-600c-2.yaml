id: BP-600c-2
components:
  - build_pipeline
title: "Quick-fix confirms the test fails (red phase) under strict AC enforcement"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the test-writer has produced a test file for the diagnosed bug,
  When the workflow reaches the red-phase verification step,
  Then it dispatches the test-runner agent targeting the new test file,
  And the run is required to be made under strict AC enforcement, so that a
    failing test is reported as a failure rather than being downgraded,
  And the workflow rejects the verdict outright — halting, and naming the
    command that was actually run — whenever the runner cannot evidence that
    the strict setting was in force, rather than accepting an unqualified
    "the test failed",
  And the test-runner reports at least one FAILED result for the new test,
  And if the test unexpectedly passes the workflow halts before applying any
    fix, reporting that the test passes against unmodified code and that the
    bug may already be fixed or the test may not cover it.

  The strict requirement is not a preference. The AC created moments earlier is
  by definition not yet done, and the test-enforcement plugin downgrades a
  failing test covering a not-yet-done AC to an expected failure — so a default
  run reports green on exactly the run this phase exists to catch red. A verdict
  that cannot demonstrate the strict setting is therefore no evidence at all.
depends_on:
  - BP-600c
  - BP-600c-1
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-006-flatten-supervisor-chain.md
