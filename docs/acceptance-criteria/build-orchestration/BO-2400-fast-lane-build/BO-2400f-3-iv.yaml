id: BO-2400f-3-iv
components:
  - build_orchestration
title: "A worktree refusal is reported only with a reason the setup itself gave; an invented reason is never passed on as the setup's"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the worktree setup declares a fixed set of refusal reasons, one of which is
    that the build workspace is already occupied (BO-2400f-13),
  And the agent asked to run the setup replies with outcome refused and the reason
    "bootstrap_script_failed", which is not one of the setup's declared reasons,
  When the run reads that reply,
  Then the run does not report a worktree refusal with reason
    "bootstrap_script_failed",
  And the run halts as a worktree step whose reply could not be trusted, naming the
    criterion, the agent asked, and the reason it gave, labelled as a reason the setup
    does not have,
  And no later step runs.

  Given the agent replies with outcome refused and a declared reason, the workspace
    already occupied, and the setup's own result says the same,
  When the run reads that reply,
  Then the run ends in the occupied-workspace refusal of BO-2400f-13, with that reason
    unchanged.

  Given the agent replies with outcome refused and a declared reason, but the setup's
    own result says it opened the worktree,
  When the run reads that reply,
  Then the run proceeds on the worktree the setup reported, because the setup's own
    result outranks the agent's account of it,
  And the run's report records that the agent's reply disagreed with the setup's
    result.
depends_on: [BO-2400f-3, BO-2400f-3-iii, BO-2400f-13, BO-2400f-5-iii]
