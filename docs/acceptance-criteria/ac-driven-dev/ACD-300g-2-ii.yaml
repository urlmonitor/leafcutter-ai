id: ACD-300g-2-ii
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "A parent AC whose covered_by the stage updated is staged in the same stage commit"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given a /plan-feature stage has completed and the user has approved its output,
  And during that stage the authoring agent wrote a new child AC
    BO-2600a-6.yaml under parent BO-2600a,
  And the agent also edited the parent file BO-2600a.yaml to append
    BO-2600a-6 to its covered_by list,
  And the agent reported only BO-2600a-6 as written in its stage output,
  And the AC store also contains a sibling file BO-2600a-5.yaml that the
    stage did not modify,
  And the working tree has an uncommitted change to a file outside the
    AC store (e.g. config/commit_guardian.json),
  When the workflow creates the stage commit,
  Then both BO-2600a-6.yaml and BO-2600a.yaml are staged in that one commit,
  And the commit passes the check-ac-parent-covered-by pre-commit hook
    without the user having to stage the parent by hand,
  And BO-2600a-5.yaml is not staged, because the stage did not modify it,
  And config/commit_guardian.json is not staged and remains an uncommitted
    change in the working tree after the commit completes.
depends_on: [ACD-300g-2]
