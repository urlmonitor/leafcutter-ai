criteria: |
  Learn at commit time, not after push, that CI's required lint check would reject you.

  A change that CI's required lint check would refuse is refused when you commit
  it, judged by the same rules over the same files, so the commit-time verdict and
  CI's verdict always agree. If the check cannot run on your machine, the commit is
  stopped and you are told why; it is never reported as passed. This holds in this
  repository, in any working copy of it, and in an adopter's project, where the
  check follows the adopter's own lint rules and the scope they declared.
