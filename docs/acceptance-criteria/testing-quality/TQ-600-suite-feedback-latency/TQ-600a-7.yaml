id: TQ-600a-7
components:
  - testing_quality
  - build_pipeline
title: "Someone adding a test that needs a deployed package can find out how to reuse the shared one, and the standing rule agrees with them"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an author about to add a test that needs a deployed copy of the package, who
    has the project's written guidance and nothing else — no sibling to ask and no
    access to the fixture's source,
  When they follow that guidance,
  Then they declare their test a reader and obtain the shared reference layout from
    that declaration, adding no deploy of their own and without having to infer the
    declaration by reading the fixture,
    And they can state which of the two paths their test will take and why, and can
      name the case that must keep a copy of its own — a test that alters the package
      before deploying it and then asserts that the deploy fails,
    And they can say what becomes of a test that declares nothing: it is given a copy
      of its own and the run names it, so they can recognise their own omission in a
      run's output instead of meeting it as an unexplained slow run,
    And, shown a run that named their test as undeclared and a run that failed because
      a test which alters the package was handed the shared layout, they can say which
      of the two they are looking at and what to change in each case,
    And the standing rule in the repository's root CLAUDE.md no longer says the
      fixture is absent: the sentence "Until that fixture exists, the prohibition alone
      applies" is gone from that rule, and in its place the rule names the declaration
      the author has just been taught and points at this guidance, so the rule and the
      mechanism describe the same repository,
    And every command and every declaration the guidance shows works as written
      against the repository at the time it is published — an author who copies a step
      does not have to adjust it to make it work.
depends_on:
  - TQ-600a
  - TQ-600a-1
  - TQ-600a-2
