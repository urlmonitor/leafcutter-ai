notes: |
  Gap G7: "pre-commit stash patch files (~/.cache/pre-commit/patch*) expire". These live
  outside the scratch location because the third-party tool writes them; they have no run
  owner, so the unknown-owner branch of the rule applies (age alone). The last clause guards
  the plausible wrong version "clear the pre-commit cache" which would force every hook
  environment to reinstall.
