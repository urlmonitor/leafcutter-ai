notes: |
  Idea stub — covered_by deliberately empty (see KM-200 notes). This is what makes
  the ACS-1100 standing principle usable rather than merely stated: a denominator
  you can open is a denominator you can audit. It also earns its keep as the
  cheapest defence against a silently wrong count — a figure with no list behind it
  cannot be spot-checked against the real store.
