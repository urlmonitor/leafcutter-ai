criteria: |
  Given a developer is adding or changing a public function or class that must
    declare the AC it satisfies
  When the developer opens the how-to guide for the symbol-AC declaration
  Then the guide states which symbols count as public (name not starting with an
    underscore, with __all__ authoritative when the module defines it)
  And the guide shows where in a function or class docstring to cite the AC and the
    expected form of the reference
  And the guide explains that the cited AC id must resolve to a real AC in the store
    or the commit is blocked
  And the guide shows how to cite more than one AC when a symbol satisfies several
