notes: |
  Authored by the business-analyst from a decision already taken (two independent
  analyses converged on it). The analysis report the brief cites
  (/tmp/claude-scratch/analysis/ratchet-option-b.md) was not present on disk when this
  record was written; the criteria follow the brief's statement of the decision. Its
  landing-order section is superseded in any case: this change lands on its own, with
  no gate change first.

  NAMES THE IT PO WILL NEED (kept out of the criteria, which describe behaviour):
  - The ratchet: unit_tests/docs/test_artifact_graph_covers_scope.py::
    test_untagged_done_ac_backlog_does_not_grow, measuring through
    scripts/ac_store/untagged_done_count.py.
  - "The done gate's own composite rule" is _unproven_composite_children in
    scripts/ac_store/_done_proof_composite.py. Clause (a) and the run-time-replacement
    clause require it to be looked up through its module when the ratchet runs, never
    copied or imported by value, so that patching it flips the ratchet's verdict.
  - "The done gate's own covers-tag pattern" is COVERS_TAG_RE in scripts/ac_store/test_enforcement.py.
    The tagged-id set passed to the composite rule is built with that pattern, not the
    ratchet's looser one; the prose-line clause is the case that tells them apart.

  WHY ONLY L0, L1 AND DOCS-ONLY COMPOSITES. An L0 or L1 states a benefit its children
  deliver, so proof through the children is proof of the record. A code, schema,
  pipeline, config or prompt L2/L3 states the main behaviour itself, and its -i children
  are edge cases or side constraints. INF-600b-1 is the worked example: it promises links
  on a card, and its only child covers OMITTING links for missing docs, so a proved child
  says nothing about the links. Such a record still counts until it has its own tag.

  WHY THE GROUND SAYS "TAGS READ, TESTS NOT RUN". The ratchet reads covers tags and
  work_status; it executes no test. A ground saying "proved" without that qualifier, or
  "tests passed", would claim evidence the measurement never gathered.

  ADR-076 A3. A3.1 forbids justifying a finished claim with a reason written later. This
  ground writes no reason into any record and stores no verdict: it recomputes the
  evidence (children's work_status, the gate's covers tags, covered_by against the
  records on disk) on every ratchet run, so a composite whose child later regresses
  re-enters the count on the next run.

  MEASUREMENT. On 4ba177be7, 47 composites leave under this ground (39 L1, 6 L0,
  DK-600c-5, DK-600d-5), which would put the mark at 162. main has moved since; the
  builder re-measures on the branch at build time and records the measured value, its
  date, commit and inclusion rule beside HIGH_WATER_MARK. A different figure is reported,
  never forced. Like KM-ADM-005-1, this is a re-scoping of the population, not TQ-400d's
  drawdown; nothing ever raises the mark.

  The fixture ids in the criteria (X-100a and its children) are illustrative; any
  temporary store with that shape exercises the clause.

  OUT OF SCOPE, FOLLOW-UPS (named here, not specified):
  - The 19 tagged composites that have unproven children. They leave the count as
    "tagged" before this ground is reached, and CI's done_proof.py leaf path never
    checks their children.
  - Covers tags in files no test lane collects (for example
    tests/knowledge_live/neo4j_checks.py), which the ratchet reads as tags although no
    lane runs them.
  - The done-gate change requiring code L2s to carry their own covers tag.
