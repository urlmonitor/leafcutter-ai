      the run does not end as "nothing to resume" and does not continue as though run R were not paused
    needs_test: true
    reason: Folding a decline into exists false is the named mutation, and it is invisible until a person's approval is lost.
  - clause: no authoring agent is sent to write or rewrite criteria for that stage
    needs_test: true
    reason: A re-dispatched author overwrites drafts the person approved, which only the run's dispatch record shows.
  - clause: the person's answer is not applied, and no approval or priority is recorded
    needs_test: true
    reason: Applying an answer to a record nobody read would act on an unverified state.
  - clause: >-
      the run ends as "pause record unreadable", and its message says the step was declined, names the step and the agent that declined it, quotes the stated reason, says the record is still on disk and was not examined, and says the resume can be started again with the same answer
    needs_test: true
    reason: The status and message are computed from the decline, and today a decline gets the same message as a damaged record.
  - clause: the message does not say the record is damaged, malformed or absent
    needs_test: true
    reason: The wrong wording sends the operator to repair a record that is fine.
  - clause: the declined step is not sent to any other agent
    needs_test: true
    reason: A substitute dispatch after a refusal is visible only in the dispatch record.
  - clause: the pause record and the eleven drafted criteria are byte-identical afterwards
    needs_test: true
    reason: Any write on this path would destroy the state the retry depends on.
  - clause: >-
      when the route is then started again for run R with the same answer and the step runs, the answer is applied to that decision point exactly as ACD-2100c-3 requires
    needs_test: true
    reason: The remedy the message promises must actually work, or the message is wrong.
  - clause: >-
      the bug symptom (run wf_4a8567df-505, 2026-10-30: the look-up replied "I did not run this read. Reading the pause record is not one of the two actions this agent handles"; a declined look-up read as no record sends the author back over drafts the person had approved) must not occur
    needs_test: true
    reason: This is the recorded failure, and it returns if a decline is read as no record again.
