id: INF-500e-4
components:
  - infrastructure
title: "Volume written is attributed to a language and to a kind, so building is distinguishable from bookkeeping"
component: infrastructure
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the changed file scripts/build.py,
  When it is attributed for the code-volume section,
  Then it is attributed to Python and to the kind "code".

  Given the changed file
    docs/acceptance-criteria/ac-store/ACS-100.yaml,
  When it is attributed for the code-volume section,
  Then it is attributed to YAML and to the kind "spec",
  So that a week spent writing acceptance criteria is not reported as a week spent
    building capability.

  Given the changed file docs/known-issues/ac-store.md,
  When it is attributed for the code-volume section,
  Then it is attributed to Markdown and to the kind "prose".

  Given the changed file deploy/Dockerfile, which carries no extension at all,
  When it is attributed for the code-volume section,
  Then it is attributed to Docker and to the kind "spec",
  So that a build definition is not discarded into the unclassified bucket merely for
    being named by convention rather than by suffix.

  Given the changed file notes/README.MD, whose suffix is upper case,
  When it is attributed for the code-volume section,
  Then it is attributed to Markdown and to the kind "prose",
  So that attribution does not depend on how a contributor happened to capitalise the
    filename.

  Given the changed file assets/logo.qqq, whose suffix matches no known language, and
    the changed file .gitignore, whose leading dot is not a suffix,
  When each is attributed for the code-volume section,
  Then both are attributed to "Other" and to the kind "other",
  And neither is attributed to a language it does not belong to,
  So that an unrecognised file is visibly unclassified rather than silently folded
    into a real language's totals.

  Given the changed files unit_tests/agent_health/test_x.py and
    scripts/foo/tests/test_bar.py,
  When each is examined for whether it belongs to a test surface,
  Then both are identified as test surfaces, including the one nested several
    directories deep.

  Given the changed file scripts/agent-health/weekly_health.py,
  When it is examined for whether it belongs to a test surface,
  Then it is identified as production code,
  So that the production and test line counts the velocity tier reports as capability
    density are genuinely separated rather than both counting the same lines.
