id: INF-600a-4
title: "Every config value referenced in the template body is declared in config_keys"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given an agent template file that references configuration values
    via Mustache interpolation (e.g. `{{config.file_size_limit_py}}`)
    or via prose instructions that name a config key
    (e.g. "reads testing_context.max_test_duration_seconds from skills_config")
  When the template frontmatter `config_keys` block is inspected
  Then every config value referenced anywhere in the template body
    has a corresponding entry in `config_keys`
  And each config_keys entry has fields:
    - key name (string matching the referenced name)
    - `required` (boolean)
    - `description` (string explaining what the value controls)
    - `source` (string: "skills_config" | "settings" | "build_injected",
       indicating where the value is resolved from)
  And no Mustache variable in the template body resolves to an
    undeclared config key
depends_on:
  - INF-600j
