risk_surface: contract_boundary
it_requirements:
  - "THREE DISTINCT REPORTS, ALL OF WHICH HALT. This AC does not weaken the fail-closed posture BO-3200d-1-i protects; every one of the three stops the run. What differs is only what the halt SAYS, so the covering test must compare the reports rather than the outcomes."
  - "THE THREE POINT AT THREE DIFFERENT PLACES and the wording must send the reader to the right one: nothing was produced (look at the producer's failure), nothing was meant to be there (look at whether the step should have run at all), something was produced that is not good enough (look at the content)."
  - "REUSE BO-3200e's VOCABULARY. 'Could not be obtained' is the `undetermined` outcome: the step has not inspected anything and must not report a finding about content it never saw. 'Empty' and 'inadequate' are substantive findings about content the step did see. Do not invent a second spelling of could-not-tell for this site."
  - "The distinction must be machine-readable as well as human-readable, so a caller can branch on which of the three occurred without parsing prose."
  - "Empty must mean genuinely zero-length content at the handover, distinguished from the location not existing. Those are different facts about different things — one about the producer's output, one about whether the producer ran."
  - "Classification must be total: every state the handover location can be in maps to exactly one of the three, and classification itself must not raise."
delivers_to: null
