package_surface: false
it_requirements:
- finalize obtains its comparison copy with `ensure --kind scratch` (a detached clone at origin/main after
  a fetch, landing in the one landing place) and always clears it with `remove` on both the success and
  the failure path; the clearing result is part of finalize's own result. Nothing is ever registered in
  the real project (F14); /tmp baselines and `git worktree add --detach` are retired.
- 'SCRATCH READINESS (decided by the user at the final gate, 2026-09-25): a detached clone has no line of
  work and nothing is ever committed or merged in it, so the branch ingredients AND every protection-stage
  canary are reported ''n/a'' for kind scratch: hooks_pre_commit_fired, hooks_commit_msg_fired, hooks_post_merge_fired
  and their conjunction hooks_canary_rejected (confirmed 2026-09-25: the rule covers all three stages
  of BO-4300c-1-ii, because each stage''s canary is a commit or a merge and a comparison copy has neither).
  The fresh-base, independent-copy and build ingredients still apply. ''n/a'' is reported explicitly;
  no ingredient is silently skipped. No other kind may report hooks_pre_commit_fired or hooks_canary_rejected
  as ''n/a''; for other kinds the commit-msg and post-merge checks may be ''n/a'' only when the project
  does not declare that stage (BO-4300c-2).'
- 'Workflow bodies run in the E2 engine with no filesystem or process access (ADR-030). They reach the
  maker only through (a) args.workspace -- the maker''s JSON object passed verbatim by the entry command
  or skill (BO-4300a-1-ib) -- or (b) exactly one agent() dispatch, carrying a result schema, to an agent
  whose registry entry has permits_shell: true, instructing it to run one exact absolute command unchanged
  and return stdout verbatim. Never status-checker (permits_shell: false), never free-form set-up steps.'
- Proof runs the workflow under unit_tests/_workflow_engine_harness.py -- the deployed copy the build
  produces, so the build's workflow transform is exercised -- with label-scripted agent replies, and asserts
  on the RECORDED dispatch list, never on workflow source text. The harness must be able to model a workspace
  step that declines its task, answers in prose, answers exit 0 with a non-JSON path, or answers JSON
  without status (F13); extending the harness for this is in scope of the first AC that needs it.
- Workflow edits are made in templates/workflows-js/*.js and reach .claude/workflows/ only through the
  build; the deployed copy is what the tests run.
test_required: true
test_spec:
- name: test_scratch_copy_starts_at_hub_main_after_fetch_on_success_and_failure
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: In both runs the scratch answer's base_commit equals the hub's main tip after a new commit
    was pushed to the hub before the run.
- name: test_no_scratch_folder_or_registration_remains_after_either_run
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: After both runs the landing place has no scratch entry and the main project's branches,
    registered worktrees and config are identical.
- name: test_failure_part_way_still_clears_the_scratch_copy
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With the comparison scripted to fail part-way, the recorded dispatches still include the
    remove request and it succeeded.
- name: test_finalize_result_reports_the_clearing
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: finalize's own result carries the remove outcome in both runs.
- name: test_scratch_answer_reports_every_protection_stage_as_na
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: 'With a fixture project declaring pre-commit, commit-msg and post-merge, the deployed maker''s
    ensure --kind scratch answer is ok with hooks_pre_commit_fired, hooks_commit_msg_fired, hooks_post_merge_fired
    and hooks_canary_rejected all ''n/a'', while base_is_fresh, is_independent_repo and build_ok are true.'
test_rationale: The 2026-09-25 incident was a perfect-enough maker with a caller that carried on, and
  every source grep of plan-feature.js would have passed. So the assertions are made on the recorded dispatch
  list of a real workflow run with scripted hostile answers, which is the only place 'no later step was
  dispatched' can be observed. The scratch copy itself is made by the deployed maker for real in these
  tests, so 'nothing registered' is checked on a real repository.
