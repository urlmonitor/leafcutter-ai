notes: |
  USER DECISION Q2 (2026-09-17): zero blocks on read-only commands, by design
  (block beforehand only when certain), measured against a sample of real agent
  shell commands before blocking is switched on. This measurement is the gate
  between the warn-only and blocking stages of the Q3 rollout.
  Sharpest case: inline_work_guard. /build-feature runs its own shell steps while
  its lock is in place, so blocking every shell command under the lock would stop
  the workflow it protects.
