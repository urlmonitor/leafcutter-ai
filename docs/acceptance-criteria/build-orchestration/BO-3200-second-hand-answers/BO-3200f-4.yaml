id: BO-3200f-4
title: "Reference documentation tells a workflow author what the chartered executor does, what it will not do, and when to use it instead of a specialist"
component: build-orchestration
components:
  - documentation_system
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a workflow author whose step needs to read something recorded in the project or carry
    out a chore,
  When they open the reference documentation for the chartered executor,
  Then it states that the executor carries out one exact command and returns its standard
    output, error stream and exit status verbatim as three separate parts, together with the
    directory the command ran in,
    And it states that the executor gives no answer to a request to look, decide, interpret or
    summarise, and that its charter admits every exact command,
    And it states how a check reports an executor dispatch that fails, comes back incomplete or
    is declined, as distinct from a command that ran and exited non-zero,
    And it states that a step needing judgement is still sent to a specialist, and links to the
    reference that says which questions a specialist may be asked,
    And it states why no step reads the project or runs a command without a dispatch -- the
    workflow engine gives a workflow body no file or command access -- and names the two
    rejected alternatives, an engine-level primitive and resolving facts before the run starts,
    each with its reason.

  Given the reference documentation,
  When each behaviour it states about the executor is exercised against the executor,
  Then the executor behaves as the documentation states.
