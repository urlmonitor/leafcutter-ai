criteria: |
  Detected corruption halts the drive loudly with a clear explanation.

  If the shared repository is ever found in a damaged state during a parallel
  drive, the drive stops immediately and reports what went wrong in plain terms,
  instead of pressing on and compounding the damage on a broken git store.
