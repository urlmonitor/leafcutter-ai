assigned_agent: frontend-coder
estimated_complexity: S
change_target:
  - code
  - ui
risk_surface: internal
it_requirements:
  - When the entry flow (crumbs[0]) still matches the new filters, the replace writes the same URL (?step=
    included) with the entry's stored filters updated, so UXP-591-5-ii restores the new filters; the drawn
    sub-flow, the breadcrumb and the open drawer are untouched.
  - No push and no URL change; the stored-state update is the only history write.
delivers_to: null
expects_from:
  ac_id: UXP-591-4
  contract: 'One replace-entry path for drawer open, switch and close that rewrites the current history
    entry with window.history.replaceState: URL flowHref(flowId, stepId | null) and view state {crumbs:
    string[] (Flow ids, entry flow first), filters: {source: ''real'' | ''mock'', kind: ''user'' | ''data''
    | ''architecture'', realization: ''all'' | ''built'' | ''spec'' | ''mock''}} kept in history.state
    under one namespaced key, merged into, never overwriting, the App Router''s own keys (__NA, __PRIVATE_NEXTJS_INTERNALS_TREE);
    not sessionStorage (owner decision 2026-10-09); history.length never changes.'
test_spec:
  - name: setting Realization to Built keeps how-acs-are-built drawn with its drawer, breadcrumb and address
      at unchanged history length
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: criterion
    must_catch:
      - the flow is re-picked because the drawn sub-flow, not the entry flow, was checked against the
        filters
      - the filter change pushes an entry
  - name: the entry's stored filters read Realization Built after the change, so Back and Forward restore
      them
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: seam
test_rationale: The visible state does not change here, so the stored entry state is asserted directly;
  that is what UXP-591-5-ii reads later.
test_required: true
declares_side_effect: false
origin_agent: business-analyst
