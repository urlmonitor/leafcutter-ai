notes: |
  SPLIT FROM INF-1100d-3 (user-approved at the IT-PO gate, following IT-PO's
  split recommendation "INF-1100d-3b"). Made an L3 under INF-1100d-3 rather than
  a sixth L2 under INF-1100d. The clause is a technical constraint of
  INF-1100d-3's behaviour, it mirrors INF-1100d-3-i, and it needs no cap
  override on the PO's L1.

  ONE READER. The resolver lives in the same module as INF-1100d-3-i's checker.
  A second reader could disagree about whether "   " is configured, and that
  disagreement is exactly how a blank value turns into a connection attempt
  against a driver default.

  "ERROR, NOT SKIP" is deliberate. A skipped test is non-passing for the done
  proof, but a skip reads as "not applicable" to a human. A missing setting is a
  configuration fault the user must see.

  P3 is the control: a resolver that always raises passes P1 and P2.

  The test-writer prompt change that makes the pattern call the resolver is
  INF-1100d-3's scope (llm-expert). This AC delivers the resolver and proves
  that a test using the pattern behaves as stated.

  IT-PO ENRICHMENT (2026-09-25)
  INTENDED must_catch: "resolver returns '' / None and lets the driver default connect" -> P2
  attempts a connection, test goes red; "pytest.skip on unset" -> the ERROR-outcome assertion goes red;
  "checker keeps its own blank-check" -> the seam test goes red; "always raise" -> P3 goes red.
  Lane: fast-lane-safe as a leaf (python-coder). The prompt change that makes the pattern
  call the resolver belongs to INF-1100d-3 (llm-expert, /build-feature).
