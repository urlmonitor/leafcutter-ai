notes: |
  Origin: EPIC-FinalizeFeatureHardening retrospective KI-3. Concrete failure:
  a ticket updated the workflow template (templates/workflows-js/<name>.js) but
  not the committed mirror (scripts/workflows/<name>.js), so a deploy-SHA test
  failed post-merge. Per BO PROJECT_CONTEXT this is the SAME byte-parity
  mechanism as BP-1000a (source <-> shipped) applied to the workflow-script
  mirror pair set, landed as a sibling L1 under BP-1000, not a new BO goal.
  Distinct from BP-100k (compiled-workflow-output drift via hash manifests at
  pre-commit on .claude/workflows/): this is source<->mirror byte diff at the
  merge gate. Reuse, do not re-invent, the BP-1000a-1 diff-runner approach.
