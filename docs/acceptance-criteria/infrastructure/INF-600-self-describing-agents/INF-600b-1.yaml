criteria: |
  Given an agent registry entry for "python-coder" with doc_links
    referencing "docs/architecture/agent_knowledge_plane.md" and
    "docs/agents/conventions.md"
  And the agent's knowledge_channels array references sources with
    concrete file paths (e.g. "signoff SKILL.md", "Root CLAUDE.md")
  When the card generator produces the agent card
  Then the card contains a "References" section (or equivalent)
  And each document referenced in doc_links appears as a relative
    Markdown hyperlink from the card's location to the referenced file
    (e.g. [Agent Knowledge Plane](../../architecture/agent_knowledge_plane.md))
  And documents referenced in knowledge_channels that resolve to a
    concrete file path also appear as hyperlinks in the Knowledge Flow
    section
  And the card does not contain bare file paths without hyperlinks
    for documents that exist on disk
