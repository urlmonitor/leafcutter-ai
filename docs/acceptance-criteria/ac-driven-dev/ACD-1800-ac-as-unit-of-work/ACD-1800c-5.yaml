notes: |
  GAP 2(a) from the independent v2 review. Canonical surface: the parity validator
  templates/scripts/commit_guardian/check_ticket_signoff_parity.py (and its helper
  _signoff_parity_checks.py). Placed under ACD-1800c because 1800c-1's it_requirements
  already flag this exact gate parity concern ("the ticket sign-off parity gate must not
  REQUIRE a ## Sign-offs section on a grouping ticket") and 1800c is "ticket carries no
  sign-offs of its own". ACD-1800b moves per-deliverable sign-offs ONTO the AC (schema in
  ACD-1800b-1a, hence depends_on) but nothing yet teaches the parity gate to accept AC-side
  sign-offs during the dual-record window -- this closes that gap so a thin ticket is not
  blocked for lacking a body ## Sign-offs section, while a legacy fat ticket's body sign-offs
  are still honoured.
  Per CLAUDE.md (gate/workflow ACs verify BEHAVIORALLY): the covering check MUST EXECUTE the
  parity gate against a real thin ticket (AC-side sign-offs, no body ## Sign-offs) and a real
  legacy fat ticket and assert both pass -- never grep-only. IT-PO to add it_requirements +
  surface wiring.

  IT-PO enrichment (2026-08-12): canonical source templates/scripts/commit_guardian/ (ADR-001;
  deployed scripts/commit_guardian/ is build output). Behavioral test_spec executes the parity
  gate on real thin + legacy-fat tickets (both pass) and an unmet thin ticket (blocked).
