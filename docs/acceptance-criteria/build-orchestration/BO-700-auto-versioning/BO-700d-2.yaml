criteria: |
  Given a release has been prepared with version 0.5.0
    and 2 changelog entries exist for this release,
  When the release rendering step runs,
  Then a YAML manifest file is produced alongside the Markdown CHANGELOG
  And the manifest contains:
    - version: "0.5.0"
    - date: "2026-06-05"
    - bump_magnitude: "minor"
    - determining_ac: (the AC ID that determined the bump)
    - entries: (a list of objects, each with ac_id, title, component, goal, level)
  And the manifest is machine-readable for downstream consumers
    (agents needing context about recent deliveries, CI/CD pipelines)
  And each entry in the manifest includes the same data as the Markdown rendering
    but in structured form.
