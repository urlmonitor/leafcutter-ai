title: "One command tells you whether delivery is getting healthier — and whether it is getting faster"
component: infrastructure
level: L1
status: active
work_status: done
criteria: |
  Ask once, and get both readings: are we healthier than last week, and are we picking up speed?

  An operator gets a week-over-week read on the health and the pace of the whole
  system from a single request, over as many weeks back as they care to look, and
  in whichever form they need to read it, hand on, or feed into something else.
  Nobody has to assemble the picture by hand from scattered sources to answer
  either question.

  The figures are worth acting on because they come from evidence the delivery
  system cannot award itself — what was genuinely merged, what had to be reopened,
  and what the recorded history of the work actually shows — rather than from the
  system's own claim that a piece of work is finished, a claim with a documented
  history of being wrong. Anything the report could not measure is shown as
  unknown and never as a zero, so "we measured nothing" always stays
  distinguishable from "we measured, and it was nothing". Trust comes first in the
  reading order, because a speed figure taken over numbers you cannot trust tells
  you nothing at all.
