notes: |
  The opaque UID is assigned sequentially at creation and is NOT derived from tree
  position (the opposite of today's position-encoded ids like ACS-100h-3). The BA
  should decompose at L2 the UID assignment scheme, the never-reused/never-renamed
  guarantee, and the relaxation of the schema id regex so an AC's id no longer has to
  encode hierarchy. Relates to: schema id regex in config/ac_store_schema.json and
  the id-derivation logic this capability replaces.
