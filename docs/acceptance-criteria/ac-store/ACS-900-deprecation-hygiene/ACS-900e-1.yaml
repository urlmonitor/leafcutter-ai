readiness: approved
priority: high
title: "Detection reuses the audit tool's traceability logic rather than re-implementing it"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the existing audit script scripts/ac_store/cross_reference_audit.py
    already implements AC-to-source traceability resolution (loading AC YAML
    files and reading their implemented_by lists),
  When the deprecation-hygiene hook resolves which source files a retired AC
    claims,
  Then the hook reuses the audit script's existing AC-loading and
    implemented_by-resolution logic (imported or refactored into a shared
    helper) rather than introducing a second independent AC-store traversal,
  And the deprecation-hygiene hook does NOT perform backfill — it neither writes
    implemented_by links nor sets work_status, leaving backfill solely to
    cross_reference_audit.py,
  And the hook performs detection only (at commit time), which the audit script
    does not do, so the two capabilities are complementary with no overlapping
    behavior.
depends_on: [ACS-900e]
