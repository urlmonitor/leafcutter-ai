id: TQ-500f-3-i
components:
  - testing_quality
  - build_orchestration
title: "The red-baseline check refuses absence-only red for a test that names wrong versions to catch"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given one piece of work with three newly added tests, each tagged as covering
    the same requirement,
      T1: its test requirements entry carries must_catch: ["revert the fix"];
          before the work, it fails with
          "ImportError: cannot import name 'refresh_config_v2'",
      T2: its entry carries must_catch: ["revert the fix"]; before the work,
          it fails with "AssertionError: expected 1 refresh call, got 3",
      T3: its entry carries no must_catch and no angle: discrimination; before
          the work, it fails with
          "ImportError: cannot import name 'summarise_window'",
  When the existing red-baseline check runs for that work — the same check in
    the fast lane and in /build-feature,
  Then T1 is refused as red evidence, and the check's report names T1, states
      that its only red was an absence red, and states that a test naming
      wrong versions to catch must fail by reaching the code,
    And T2 is accepted as red evidence,
    And the red-baseline gate as a whole fails for this work because T1 was
      refused, even though T2 and T3 are properly red — a declared test that
      is refused as absence-only red cannot ride on its siblings,
    And T3 is accepted as red evidence — absence red stays valid for a test
      that declares no wrong version to catch,
    And an entry declaring angle: discrimination with no must_catch is treated
      as T1 is when its only red is an absence red,
    And the decision uses only what the test requirements declare and the
      outcome of the run — never the wording of the requirement,
    And the refusal comes from the one existing red-baseline reader; no
      second reader is built for this rule, so a given set of tests and run
      outcomes gets the same verdict in either lane.
