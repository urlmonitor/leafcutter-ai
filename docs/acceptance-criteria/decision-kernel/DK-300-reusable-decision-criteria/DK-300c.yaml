notes: |
  LIFECYCLE (customer form -> record stage, per the mock data and the decision):
    - "a proposal"                         -> candidate (approval_status proposed)
    - "approved, waits beside the run"     -> staged (written under the run root)
    - "joins the shared library"           -> published (entered into Git by a human-run publish)
    - "retired, points to its replacement" -> retired (replaced_by set, members moved)
  Only a person approves and publishes. The mining job and models never do
  (ADR-060). Published decision records are never edited by any of these steps.

  CARRY TO L2 (assumptions in the mock data that the ACs must settle; the PO
  deliberately leaves them to the BA / IT PO):
    - Id scheme: cat-<16 hex>, kernel-minted, never changed by a label edit,
      merge or split.
    - Published folder: docs/criteria/<id>.yaml. The decision did NOT fix the
      folder name; docs/criteria/ is the name its question used. Confirm or
      change it.
    - Staging location:
      <run_root>/runs/<run_id>/staged/criterion_categories/<id>.yaml
    - The lifecycle values above, and approved_by matching human(:<name>).
    - Whether a new config/paths.json surface or pre-commit hook is needed. The
      decision's criterion crit.no_new_package_surface prefers none; if one is
      added, the AC needs package_surface: true.
  The four lifecycle stages with explicit transitions call for a state-diagram.
  The publish step is a command a person runs, hence how-to. The new record
  type needs a reference-doc.
