criteria: |
  Given a phase agent appending its sign-off comment per the sign-off block,
  When it writes the comment heading,
  Then the heading uses the em-dash separator required by the comment parser,
  And a heading that used a plain ASCII hyphen instead is treated as malformed and
    would not be recognized as a valid sign-off comment.
