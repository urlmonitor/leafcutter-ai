title: "Migration surfaces a reference that points at a non-existent requirement"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement whose dependency, coverage, or contract link names another
    requirement id that does not exist in the store at migration time (an
    already-dangling reference),
  When the migration runs,
  Then the migration reports the dangling reference, naming the referencing
    requirement and the missing target id,
  And the migration does not invent a UID for the missing target,
  And the pre-existing dangling reference is not counted as a new dangling
    reference introduced by the migration itself.
