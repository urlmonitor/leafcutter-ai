criteria: |
  Given a query over the requirements store that matches 40 records out of a store
    holding 180 records,
  When the answer is handed to a caller,
  Then the answer carries three parts together — the 40 result records, the total of
    180 records the query was measured against, and a named method describing how
    that total was established,
  And an answer that carries results but no total, or a total with no named method,
    is refused by the caller as an incomplete answer rather than read as a complete
    picture,
  And the total and method are present even when the result set is empty: an answer
    that matched nothing still reads 0 of 180 with its method named,
  And the total is reported as a count of records, not as a count of the results
    themselves, so 40 of 40 is only reportable when the store truly holds 40 records.
