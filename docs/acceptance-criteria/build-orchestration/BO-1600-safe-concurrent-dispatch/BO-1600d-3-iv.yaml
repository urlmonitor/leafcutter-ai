it_requirements:
  - "Determine the branch to reset from runtime state (the corrupt ref name, current HEAD, or the repository's configured default branch via origin/HEAD) — never assume 'main'/'master'. Reset that branch to its own reflog tip."
  - "If the affected branch is ambiguous or undeterminable, stop and report rather than resetting the wrong branch."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
