    relationship: describes
    status: exists
  - path: templates/workflows-js/plan-feature.js
    relationship: modifies
    status: exists
  - path: scripts/setup_ticket_worktree.py
    relationship: models
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    run_identity:
      type: object
      description: "{ run_id: '<value unique to one authoring run>', workspace_path: '<absolute path>', branch: '<branch name>' }. run_id is minted once when the run starts and is recorded so the same run can re-resolve it after an interruption. Two runs must never mint the same run_id, and no two distinct run_id values may resolve to the same workspace_path or branch."
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "BA-supplied schema minimum — the IT PO refines this block during technical enrichment."
    - "The identity must not be derived solely from the component name, nor solely from the calendar date, nor from any combination of only those two — that derivation is the defect being fixed, because it makes two same-day or same-component runs collide."
    - "Reconcile with BO-1500g-2-i (formerly BO-1500a-7-i, renamed by the 2026-08-14 split): the feature_key notion recorded there must be narrowed to a per-run identity, so resuming ONE run reuses its workspace while a second run for the same feature does not. This constraint now spans the BO-1500f / BO-1500g boundary and must be honoured across both trees."
    - "Uniqueness must be verified behaviorally by starting two runs with identical component, date, and request text and asserting two distinct workspaces — a test that varies the inputs cannot detect the collision."
