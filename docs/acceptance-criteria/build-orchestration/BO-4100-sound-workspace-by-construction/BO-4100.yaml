criteria: |
  A workspace starts current, stands on its own, and is described to you truthfully.

  Every separate workspace you are given to work in begins from the current state
  of the shared work rather than an older copy of it, so nothing is built on a
  picture of the project that has already moved on. It holds its own supporting
  material instead of borrowing another workspace's, so it is never judged for
  something you did not change and repairing it can never damage a session
  somebody else is running. When it is finished with, you can tell whether it
  still holds anything you would miss, so finished workspaces stop piling up
  without anyone risking work that was never delivered -- and nothing that exists
  is left out of that reckoning or beyond clearing away. And the account you are
  given of the workspace you received -- what it is called, what kind of work it
  is for -- matches what was actually made.
