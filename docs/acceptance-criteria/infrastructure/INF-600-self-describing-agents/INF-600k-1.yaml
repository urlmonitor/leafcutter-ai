    relationship: describes
    status: exists
    relevance: "What a workflow is in this package: templates/workflows-js/*.js, deployed by the build to .claude/workflows/."
  - path: docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600k-3.yaml
    relationship: related
    status: exists
    relevance: "The negative guarantee this relaxation must not break: a name that is neither an agent nor a recognised external caller is still an unknown agent."
