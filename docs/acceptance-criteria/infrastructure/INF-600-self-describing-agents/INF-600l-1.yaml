notes: |
  Extends the existing check_agent_spawn_consistency hook (which today validates
  spawned_by/spawn_allowlist reciprocity within the registry, INF-600g) to also
  validate that the GENERATED CARD mirrors the registry. Distinct from INF-600k
  (which teaches the registry validator to accept legitimate external callers);
  INF-600l guarantees the card and the registry tell the same story.
