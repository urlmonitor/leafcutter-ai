notes: |
  Not asked for in the 2026-11-02 request; written because the fix for an interrupted
  clearing creates a new danger. BO-4300d-2 completes a half-MADE copy of the same work and
  BO-4300d-4 resumes an existing line of work. Without this record, a request for the same
  work arriving after an interrupted clearing -- the second observed folder still carries a
  record saying "ready" -- could be resumed or "completed" into a workspace with a broken or
  half-deleted repository and handed out as ready, which is exactly what BO-4300 promises
  never happens. Do not drop as scope creep.

  The criteria leave open whether the request for the workspace finishes the clearing first
  and then makes a fresh workspace, or refuses; this record pins only that the leftover is
  never answered ready and is not changed by these two requests. Default chosen: the request
  is refused and names the remedy (ask to clear again), because deleting from a "make" request
  would be a surprise to the caller. See question Q3 in the BA sign-off.

  Locate stays read-only (BO-4300e-1-i): it must report the half-cleared state without
  changing anything.
