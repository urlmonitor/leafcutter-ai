notes: |
  WHY THE CRITERION IS AGREEMENT AND NOT A PARTICULAR VALUE. The register's stated fix
  direction — emit `pull-request: not_needed` when the target path is inside an `EPIC-*/`
  folder — is one implementation of this, and a reasonable one. It is deliberately NOT
  the criterion. Written as a value, the criterion is satisfied by one string in one
  branch, and the next phase the drive decides to defer reopens the identical blocker
  with a different phase name. The second scenario above exists to make that
  implementation insufficient on its own: it fails against a changed deferral rule
  unless the two sides share one account of which phases a location defers.

  THIS IS A TWO-SIDED CONTRACT WITH ONE ASSIGNED AGENT ON PURPOSE. Both the generating
  side and the drive's deferral rule may have to move for this to hold, but they must
  move together or the agreement is not established, so splitting them across two ACs
  with a delivers_to contract would let one half ship and pass. Left as one AC; the
  IT PO should confirm that judgement when it assigns technical detail.

  UNDER-DETERMINED, LEFT FOR THE IT PO ON PURPOSE — where the shared account of the
  deferral rule lives, and in which direction it is read (the drive publishing it for
  the generator, the generator and drive both reading a third declaration, or the
  generator asking the drive). Any of those satisfies this criterion. Choosing one is a
  technical decision that depends on what the two sides can already see of each other,
  which is not visible from the architecture docs.
