id: BP-1500b-4
title: "Files the build never produced are left untouched, and recognised as such without an exception list"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: critical
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a project's installed tree holds, alongside the artifacts the package
    produced, all three of the following, and none of them appears in any record
    of what the build has ever produced:
      - a machine-local settings file the adopter edited on this machine, which
        the package does not ship and never has,
      - a lock file written at run time by a scheduled task,
      - the link entries the build itself created to point one part of the
        installed tree at another,
  When the install is rebuilt and the orphan sweep runs,
  Then all three are still present afterwards, with their contents unchanged,
  And none of them is named in the report as an orphan, as removed, or as a
    candidate for removal,
  And the sweep reaches this outcome by recognising that it did not produce
    them, not by consulting an exception list naming these particular files, so
    a fourth file of the same kinds appearing tomorrow is also left alone,
  And the sweep never satisfies itself by emptying the installed tree and
    rewriting it, because the adopter's own files live in that tree alongside
    the produced ones.
depends_on:
  - BP-1500b
  - BP-1500b-2
