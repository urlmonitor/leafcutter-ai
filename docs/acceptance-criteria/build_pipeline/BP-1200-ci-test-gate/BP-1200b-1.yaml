notes: |
  This check must behave differently from the current informational typecheck
  job: a test failure must FAIL the pull request (blocking), not merely report
  status. Depends on BP-1200a-1 because the check can only be trustworthy once
  the suite is green on a fresh clone (CI runs from a clean checkout).
  IT-PO note: ci.yml already exists with lint (blocking) + typecheck
  (continue-on-error). This AC ADDS a third, blocking test job. The job name is a
  load-bearing contract consumed by BP-1200c-1's branch-protection list.
