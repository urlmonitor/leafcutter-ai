notes: |
  FIELD EVIDENCE — run wf_0e0872f9-453, 2026-09-14, Windows 11. /build-feature
  EPIC-TruthfulProjectRecord, started inside worktree uxp-700-tranche-2, spent about
  975k subagent tokens and built nothing: all 9 tickets in batch 1 were blocked. The
  workflow's worktree-path helper recognises a path as already inside the worktree only
  when it starts with the worktree path plus "/", and as absolute only when it starts
  with "/". A Windows absolute path matches neither and was joined onto the worktree,
  so every phase agent received
    C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2\tickets\00_inbox\epics\EPIC-TruthfulProjectRecord/C:\Users\...\07_TICKET-20260909-UXP-700a-3.md
  Ticket-planners answered "TICKET NOT FOUND" with empty titles, and the failure
  classifiers halted. The same helper normalises depends_on paths, which is why the
  depends_on scenario is its own clause and its own seam test. A second, independent
  defect in the same run (the worktree created inside the repository) is BO-4000.

  NAMED MUTATIONS the covering tests must catch (each must turn at least one test red):
    M1 — replace the Windows-absolute recognition with startsWith("/") alone: the
         incident path is joined again. Caught by
         test_windows_absolute_ticket_path_reaches_phase_agents_unjoined.
    M2 — test containment with worktreePath + "/" only: a backslash path inside a
         forward-slash-spelled worktree is judged outside and passed through (or joined).
         Caught by the incident replay, whose worktree and ticket use different separators.
    M3 — fix the ticket-path call site and leave the depends_on call site on the old
         logic. Caught by test_depends_on_in_any_spelling_resolves_to_the_dispatched_ticket_path.
    M4 — land the corrected helper but leave the workflow body calling the old one.
         Caught only by the reachability test; a direct helper test stays green.
    M5 — make the helper treat every path containing ":" as absolute, or return every
         path unchanged. Caught by the relative-path test, which requires a join to happen.

  SCOPE — DECIDED 2026-09-14 (user, Q5). EVERY workflow script that joins, resolves or
  compares paths the way build-feature does needs its own harness-driven reachability
  proof. A proof for build-feature alone does not satisfy this record.

  SCRIPTS IDENTIFIED, by a grep of templates/workflows-js/ on 2026-09-14 for
  toWorktreePath-style helpers, leading-"/" absoluteness checks, "/"-concatenation joins
  and "/"-only splits (line numbers are as of origin/main at authoring and will drift):
    - build-feature.js — toWorktreePath() at ~1471-1501: startsWith(worktreePath + "/")
      containment at 1477, startsWith("/") absoluteness at 1483, worktreePath + "/" + ...
      joins at 1488/1495/1501. 18 call sites, including epic path 2506, depends_on
      2745/2926, ticket paths 2227/2266/2716/2780/2920/3351, and result ticket_path
      3045/3058/3134/3137.
    - plan-feature.js — authoringWorktreePath.replace(/\/$/, "") + "/" +
      filePath.replace(/^\//, "") at 588: a Windows absolute filePath is joined onto the
      worktree, the same defect class. "/"-only last-segment split at 135. Store-path joins
      root + ptStorePath + "/" + flowRef.replace(/^\/+/, "") at 1391 and 1427. (633
      normalises backslashes before splitting and looks correct; it is listed so its
      harness proof can confirm that.)
    - build-epic.js — epicPath.split("/").pop() at 488: a backslash-spelled epic path gives
      the whole path back as the epic name.
  No matches in build-ticket.js, create-ticket.js, fast-lane-ship.js, finalize-feature.js
  or quick-fix.js for these patterns. That is a grep result, not a proof of absence.
  BO-3900d is the derived breadth guard for what a grep misses.

  Two follow-ups for IT PO enrichment. plan-feature is the AC-authoring workflow
  (ac-driven-dev territory), but it lives in the same script directory and is kept in
  scope here per the user's "every script" decision. Whether
  _workflow_engine_harness.py can already run plan-feature.js and build-epic.js's
  top-level bodies has not been checked; if it cannot, extending it is part of this work.

  NOT FILED IN THE REGISTER. This incident has no known-issues entry yet. The doc_link to
  the build-orchestration register points at the adjacent KI-BO-027, not at this incident.

  PLACEMENT. Authored as a root-level L2 in build-orchestration, the same shape the store
  already uses for defects found in a live build-feature run (BO-3000, BO-3700, BO-3701):
  a record that can be scheduled, driven and closed on its own, with L3 children for the
  axes whose mutations turn only that child red. Neighbours considered and rejected as
  parents: BO-1800a (per-drive isolated clones under ADR-018; already at 5/5 L2 and about
  topology, not path spelling); GE-113 (commit-time misplaced artifacts, guardrail-engine,
  not drive-time path resolution); UXP-700c-3-i (the same defect class, but in the
  product-truth store's checker). The BA authors L2/L3 only and does not invent an L1.
  BO-3800 is taken on the unmerged branch origin/ac-authoring/refactor-handoff, and
  BO-3300/BO-3400 are unexplained gaps, so BO-3900 was taken as the next number clear on
  every ref.
