notes: |
  WHY THIS IS AN EDGE CASE OF THE PARENT AND NOT A NEW DIRECTION. Anchoring the
  comparison at the top of the project only means anything if the check can tell
  where in the project a path lands, and that requires the path to be understood
  rather than matched as text. The defect being removed is a text match; the
  cheapest replacement — comparing a fixed list of segment sequences against the
  segments of whatever string arrived — inherits an input assumption that the
  original text match also had and that nothing in the parent's scenarios tests.
  Every one of the parent's arms happens to use one spelling.

  THE TWO FAILURE DIRECTIONS ARE BOTH LIVE, which is why both appear above. A
  spelling the comparison does not recognise as reaching a chosen location turns
  a quiet location loud — every acceptance-criterion file in this store would
  start reporting a credential, and the reaction to that is to widen the
  entitlement again. A spelling that resolves outside a chosen location but
  mentions one turns a loud location quiet, which is the original defect wearing
  a different costume.

  THE INDIRECT-PATH ARM IS NOT A SECURITY CLAIM ABOUT TRAVERSAL. It is about
  agreement between two names for one file. Nothing here asserts anything about
  what a path may reach outside the project; that question is not this L1's and
  is not raised by these scenarios.

  FOR THE IT PO. The spellings must be produced the way the commit machinery
  produces them wherever that is possible, rather than assembled by the test, and
  the platform-separator arm should be exercised in the form the host actually
  yields rather than by hand-substituting separators into a string. The token is
  assembled at runtime from fragments, as recorded on the parent. This record
  cannot be discharged by a test that inspects the check's source; the whole
  subject is what the check does with an input it was given.
