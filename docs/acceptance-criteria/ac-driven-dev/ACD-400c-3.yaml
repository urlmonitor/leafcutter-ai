assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Every pytest invocation used to run or verify these tests must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "The set of questions swept must be DERIVED from the scanner's own declared option values rather than written out as a literal list, so an option value added or renamed later is covered without anyone remembering to edit the test. A hardcoded enumeration is exactly the record that goes stale, and going stale silently is the failure this whole tree exists to close."
  - "The sweep must cover the full cross-product of the filtering options, and each combination must be executed against the store rather than reasoned about. Executing one combination and arguing the rest follow reintroduces the assumption the AC was written to test."
  - "Do not assert that the approved record is returned by every question. It is a finished leaf, so the questions scoped to unfinished work correctly return nothing. The universal claim is the NEGATIVE one — no question returns any of the four draft records — and stating it as a positive would produce a test that fails against correct behaviour."
  - "Both output forms the scanner offers must be swept, not only the machine-readable one. The reader this AC protects is a person reading the human-readable output, and a gate proved only on the JSON path leaves the surface they actually use unproven."
  - "This AC authorises no change to the scanner. It states that the approval requirement is unconditional across the question surface; whether it should be is a separately changeable decision the BA deliberately left open."
test_spec:
  - name: test_no_question_the_scanner_accepts_returns_an_unapproved_record
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --level {leaf,all} --work-status {todo,done,all} --ac-root <tmp> [--json]"
    description: "Over one store holding four draft records (leaf/todo, leaf/done, composite/todo, leaf/todo-with-unfinished-prerequisite) and one approved finished leaf, every combination of the scanner's declared filtering options returns none of the four draft ids in either list."
  - name: test_the_broadest_question_returns_only_the_approved_record
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --level all --work-status all --ac-root <tmp> --json"
    description: "Asking for every level in every state of completion returns exactly the approved id and an empty held list, so widening the question does not widen the approval requirement."
  - name: test_the_question_set_is_read_from_the_scanner_not_from_the_test
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --help"
    description: "The combinations swept are enumerated from the scanner's own declared option values, so adding a further option value extends the sweep automatically and a test asserting a fixed number of combinations would fail."
test_rationale: "The load-bearing risk is not that today's three combinations behave differently — they do not — but that a fourth is added later and nobody re-checks it. Only a sweep whose membership is derived from the scanner keeps the universal claim universal, so the enumeration mechanism is itself worth a test."
