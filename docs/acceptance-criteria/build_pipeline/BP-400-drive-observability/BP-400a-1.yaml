criteria: |
  Given the build system has deployed the leafcutter package,
  When the deploy target is inspected,
  Then .claude/skills/agent-telemetry/scripts/emit_event.py exists.

  Given emit_event.py is invoked as:
    python emit_event.py --agent "ticket-supervisor" --event agent_start
      --ticket "/path/to/01_schema.md" --phase "python-coder"
      --log debugging/logs/agent_telemetry.jsonl
  When the script completes,
  Then it exits with code 0,
  And exactly one JSON line is appended to the log file,
  And that line contains the keys: event_type, timestamp, agent_name,
    ticket_path, and payload,
  And payload contains phase, outcome (null if not supplied),
    and retry_count (null if not supplied).
