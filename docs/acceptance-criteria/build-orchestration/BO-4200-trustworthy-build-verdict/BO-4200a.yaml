criteria: |
  The whole project is exercised before your work is handed on.

  A run does not finish by checking only the part it was aimed at. Before the work
  leaves it, everything the project already promised is put to the test too, so
  damage the change did elsewhere is found by the run that caused it rather than
  by whoever meets it next.
