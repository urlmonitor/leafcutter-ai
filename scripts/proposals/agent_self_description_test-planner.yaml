agent_id: test-planner
template_file: templates/agents/test-planner.md
proposed_frontmatter:
  pre_flight_reads:
  - source: ticket_path
    required: true
  inputs: []
  outputs:
  - name: test_requirements
    type: structured_response
    description: 'Output field: test_requirements'
  - name: rationale
    type: structured_response
    description: 'Output field: rationale'
  - name: tests
    type: structured_response
    description: 'Output field: tests'
  mutates:
  - name: none
    surface: none
    description: Read-only agent — no filesystem mutations
  behavioral_patterns:
  - name: Delegation to research-agent
    trigger: task requiring research-agent capabilities
    behavior: Delegates to research-agent via Agent tool
    related_agent: research-agent
  - name: Conditional Behavior
    trigger: neither file exists
    behavior: 'use these built-in defaults:'
    related_agent: null
  - name: Conditional Behavior
    trigger: no matching directory exists in the config
    behavior: flag it as `"new directory
    related_agent: null
proposed_registry:
  category: planning
  skills_invoked: []
  knowledge_channels:
  - channel: 1
    source: template description field
  - channel: 5
    source: skills_config.json config_keys
  - channel: 6
    source: project files read during execution
  - channel: 7
    source: bash command output (git, build, tests)
