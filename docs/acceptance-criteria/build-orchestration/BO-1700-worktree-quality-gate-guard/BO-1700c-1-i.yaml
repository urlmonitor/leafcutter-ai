assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  Catch the SPECIFIC symlink-creation error (OSError family) and fall back to a
  file copy; log at WARNING per the project error-handling policy (never a bare
  except, never a silent swallow). Never leave the config unresolved after a failed
  symlink attempt. Implemented in the self-healing hook (BO-1700c-1); ADR-001
  deployed/template parity applies.
