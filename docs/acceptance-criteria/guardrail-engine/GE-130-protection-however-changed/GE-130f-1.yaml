    The session_hooks_manifest section of templates/scripts/commit_guardian/commit_guardian.json
    and documentation_guard's entry in it: {matcher, entry_point, negative_control, currently},
    where currently.state is one of passing / failing / blocked / unverified and was written from
    whether the edit was carried out on disk. GE-130f-3 reads currently.state for this guard and
    refuses command coverage while it is anything but passing.
- agent: python-coder
  ac_id: GE-130a-1
  contract: >-
    A documentation guard that refuses through the registered entry point and whose watched
