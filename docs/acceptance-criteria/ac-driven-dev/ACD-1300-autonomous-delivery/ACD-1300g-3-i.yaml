id: ACD-1300g-3-i
title: Failed or missing review results never become approval
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given the configured reviewer fails, returns an unusable result or provides no disposition for the requested head
  When the worker records review completion
  Then it reports a review blocker with the failure and existing evidence
  And no passing verdict is inferred from an empty response or failed execution
  And the feature cannot proceed to a delivered draft PR
