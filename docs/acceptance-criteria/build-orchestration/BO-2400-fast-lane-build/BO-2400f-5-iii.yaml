assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    Whether a reply is a result or a decline is decided in one place that every step's
    reply passes through, not per step. A step added later inherits it without its own
    branch.
  - >-
    A reply is a result only if it parses into that step's expected result shape. For a
    command-step-runner dispatch, a reply without exit_status is a decline. A reply with a
    non-zero exit_status is the step's own command failure and goes to that step's
    existing failure handling, never to the declined-step halt. For any other agent, a
    refusal, a role-mismatch answer, an empty reply or an unparseable reply is a decline.
  - >-
    The declined-step halt payload is {halt_kind: 'declined_step', step: string, agent:
    string, reason: string, target: {workspace, branch, ac_id} or null}. reason is the
    agent's own stated reason quoted verbatim, trimmed only of surrounding whitespace.
    When the reply was empty or unreadable, reason says so explicitly. target is null
    only before the worktree step has confirmed a workspace.
  - >-
    declined_step is distinct from contention, gate failure and the unproducible-set
    refusal (BO-2400f-12). Contention wording, and a contention reading of
    target_refused, is reachable only on the contention branch, and that branch still
    requires a non-empty held-member list (BO-2400f-7-iii).
  - >-
    A declined resolve never reaches the empty-set no-op (BO-2400f-2). A declined
    producibility never reaches the claim dispatch.
  - >-
    BO-2400f-7-iii's claim halt (never attempted, not contention) keeps its guarantees.
    If it is folded into declined_step, the halt must still say the claim was never
    attempted, and the existing f-7-iii workflow tests stay green unweakened.
  - >-
    Operator documentation: docs/how-to/fast-lane-build.md must gain the declined-step
    halt and its remedy (fix who is asked, or what they are asked). That doc change is
    owned by a documentation AC and not by this coder AC. See the documentation gate
    caveat.
  - >-
    Edit the template lane and regenerate the deployed copy through build.py. Template
    and deployed copies stay in parity.
test_required: true
test_spec:
  - name: test_declined_step_halts_naming_step_agent_and_quoted_reason
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "Parametrised over every step the lane dispatches (discovered from the harness's recorded dispatches, not a hand list): a refusal reply at that step halts with halt_kind declined_step, the step, the asked agent and the refusal text quoted verbatim."
  - name: test_declined_step_is_classified_apart_from_contention_gate_failure_and_unproducible
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: discrimination
    description: "A declined claim, a genuine contention, a gate failure and an unproducible set each produce their own halt kind. Only the genuine contention carries contention wording."
  - name: test_declined_resolve_is_not_read_as_an_empty_connected_set
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "A refusal at resolve ends as a declined resolve step, not as the clean no-op an empty set earns, and no later step is dispatched."
    must_catch:
      - "a declined resolve ends as a clean no-op that looks like success"
  - name: test_declined_producibility_does_not_proceed_to_claim
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "A refusal at producibility halts as a declined step, and the harness records no claim dispatch."
    must_catch:
      - "a declined producibility read as every member producible, followed by a claim"
  - name: test_observed_2026_09_25_refusal_yields_declined_step_without_contention_wording
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The verbatim status-checker refusal from the 2026-09-25 run ('Refusing this task. I am status-checker, scoped to investigating ticket state ...'), replayed at each step, yields a declined-step halt naming status-checker and quoting it, with no 'already claimed', 'in progress' or 'concurrent run' wording."
  - name: test_command_step_runner_reply_without_exit_status_is_a_decline_and_nonzero_exit_is_a_result
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: discrimination
    covers: [BO-2400f-5-iii, BO-2400a-1-i]
    description: "A command-step-runner decline object halts as declined_step. A command-step-runner result with exit_status 1 is handled as that step's command failure, not as a declined step."
  - name: test_empty_or_unparseable_reply_is_a_declined_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: boundary
    description: "An empty reply and a non-JSON prose reply at a command step each halt as declined_step with a reason stating no readable result was returned."
test_rationale: |
  The two dangerous misreadings are those that look like success or permission: a declined
  resolve ending as a clean no-op, and a declined producibility going on to claim. Each has
  its own failure-angle test that asserts on what the run did next (no further dispatch, no
  claim dispatch), not only on the halt text.

  The replay of the observed 2026-09-25 reply pins the incident itself. The discrimination
  tests keep the classification honest in both directions. A fix that calls everything a
  decline breaks genuine contention and the non-zero-exit result. A fix that keeps reading
  declines as contention breaks the replay.

  The per-step test takes its step list from the harness's recorded dispatches, so a step
  added later is covered without editing the test. Every test runs through the workflow
  engine harness with stubbed replies, so no model is called.
delivers_to:
  agent: python-coder
  contract: "One shared reply classifier in templates/workflows-js/fast-lane-ship.js and a terminal halt payload {halt_kind: 'declined_step', step: string, agent: string, reason: string (verbatim), target: {workspace: string, branch: string, ac_id: string} | null}. BO-2400f-10-iii reads halt_kind and step, together with the run's claim-held state, to decide on release. BO-2400f-3-ii fills target."
expects_from:
  ac_id: BO-2400f-7-iii
  contract: "The claim step's split between never-attempted and contention (contention requires a non-empty held-member list). This record keeps that split and applies the same reading to every other step; the command-step-runner decline shape comes from BO-2400a-1-i (in depends_on)."
