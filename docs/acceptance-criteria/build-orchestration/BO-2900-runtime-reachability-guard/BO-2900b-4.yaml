notes: |
  Satisfies one of the parent L1's two `documentation_triggers` (`how-to`).

  Intended agent is `documentation-expert` — left null per this run's instruction.

  ONE GUIDE, BOTH DIRECTIONS — DELIBERATE. BO-2900c also carries a `how-to` trigger,
  and its documentation AC (BO-2900c-3) requires the reverse-direction content to land
  in THIS SAME guide rather than in a second one. Two guides would split a single
  workflow — an author renaming a capability trips both checks in one change and needs
  one page, not two — and would guarantee that one of them goes stale. BO-2900c-3
  states the reverse-direction requirements; the writer must satisfy both ACs in one
  document.

  SCOPE FENCE: this is the CAPABILITY AUTHOR's guide. The criterion author's guide
  ("my done claim was refused") is BO-2900a-4, and the exemption reference is
  BO-2900d-5. Cross-link; do not absorb.

