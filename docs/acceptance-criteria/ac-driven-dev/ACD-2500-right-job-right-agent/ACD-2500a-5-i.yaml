roadmap_phase: phase_1
criteria: |
  Given the requirement rule check as built (ACD-2500a-1, ACD-2500a-2, ACD-2500a-3) and as
    extended by ACD-2500a-2-vi, ACD-2500a-2-vii and ACD-2500a-2-viii,
  When its decision record is authored,
  Then it is numbered ADR-075, sits in the decision-record folder, and the decision-record
    index lists it,
  And it records each of these as a decision, with the alternative that was rejected:
    - mechanical requirement rules are checked by one rule check made of rule families,
      not by instructions an authoring agent must remember;
    - the check runs after every /plan-feature authoring stage as a fail-closed gate, so a
      failed or empty check means the stage is not reported complete;
    - the check repairs only where exactly one right answer exists, through a guarded writer
      that evaluates its repairs again, and a repairing run needs a before-state;
    - one run can check every record changed since a given revision;
    - the surface-to-specialist map (config/surface_craft_map.yaml) is the one authority for
      which specialist owns a file surface;
    - HOLD_REASONS is the one hold-reason vocabulary;
    - the protected-field family is the deterministic backstop for stages that must not
      change fields they do not own,
  And it links ADR-072 and the rule check's reference document rather than restating the
    report format or the rule families' criteria.
