- States the documentation-trigger coverage-matching rule that ACD-2500a-2-v applies.
- States the CLI invocation and the JSON report shape exactly as ACD-2500a-1 delivers it.
delivers_to: null
expects_from:
  ac_id: ACD-2500a-1
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
