  PENDING METHOD (DK-500b): the grouping method is being decided in kernel run
  run-b5af8c7fae2248ba after a Jev trial. This record is method-neutral by design.
  USER RULE (a), settled: an LLM generates categories only for what code and Jev cannot place. The user's original words: "only need LLMs to generate further categories if jev thinks some are missing", applied to grouping as well as to gap drafting (ADR-053 order: deterministic code, then Jev, then an LLM, then a human).
  Pending with the method: what counts as "identical" (exact text, or text after a normalisation of case, spacing and punctuation), and whether an LLM is used at all for the "none" wordings. The "secrets" wording is illustrative and not in the mock data.
  Observable through the per-wording count of Jev and language-model calls.
