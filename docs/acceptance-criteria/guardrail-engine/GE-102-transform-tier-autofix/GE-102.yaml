created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  A new transform tier of pure-Python pre-commit hooks deterministically fixes mechanical
  documentation-field violations in place, stages the fix, and exits clean, failing open on
  any parse uncertainty. Each hook in the manifest declares a tier (transform or judgment)
  so the auto-fix path knows which failures are mechanically self-healed and which require the
  originating coder. The transform hooks are ordered before their matching validator hooks so a
  field is filled before it is validated. Judgment-required checks (complexity, file size,
  docstrings, exception handling) stay out of the transform tier. The exception-handling check
  additionally emits the originating-agent line so the safety net can re-dispatch it.
